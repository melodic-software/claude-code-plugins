skip_lfs: true

pre-push:
  jobs:
    - name: guardrails-remote-reference-verify
      script: guardrails-reference-verify.sh
      skip:
        - run: test -n "${MSYSTEM:-}${WINDIR:-}"

remotes:
  - git_url: https://github.com/melodic-software/claude-code-plugins
    ref: main
    refetch_frequency: 1h
    configs:
      - plugins/guardrails/git-hooks/lefthook-remote.yml
      - plugins/code-tidying/git-hooks/lefthook-remote.yml
