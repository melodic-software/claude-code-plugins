pre-push:
  jobs:
    # Keep double quotes out of `run`: on Windows lefthook wraps it in double quotes without
    # escaping them, and sh gets a cut-off script. mktemp paths hold no spaces, so $tmp needs none.
    - name: check-affected
      run: |
        if ! mb=$(git merge-base HEAD refs/remotes/origin/main 2>/dev/null); then
          echo 'check-affected pre-push: skipped, no origin/main merge-base to take the check from; CI checks it.' >&2
          exit 0
        fi
        if ! tmp=$(mktemp -d); then
          echo 'check-affected pre-push: failed, nothing was checked: mktemp could not make a directory.' >&2
          exit 1
        fi
        trap 'rm -rf $tmp' EXIT
        git archive $mb -- .claude/hooks/check-affected-pre-push.sh lib/hook-utils.sh | tar -x -C $tmp
        if [ ! -f $tmp/.claude/hooks/check-affected-pre-push.sh ]; then
          echo 'check-affected pre-push: failed, nothing was checked: merge-base' $mb 'has no .claude/hooks/check-affected-pre-push.sh with lib/hook-utils.sh; rebase onto origin/main.' >&2
          exit 1
        fi
        bash $tmp/.claude/hooks/check-affected-pre-push.sh --git-hook </dev/null

remotes:
  - git_url: https://github.com/melodic-software/claude-code-plugins
    ref: main
    refetch_frequency: 1h
    configs:
      - plugins/guardrails/git-hooks/lefthook-remote.yml
      - plugins/code-tidying/git-hooks/lefthook-remote.yml
