name: Check trusted trigger
description: >
  Gate a CI lane on its trigger: the PR must come from this repository, and
  both the event actor and the PR author must be on the trusted-actor list,
  matched by numeric user id. Handles pull_request, workflow_dispatch (with a
  PR number) and workflow_run. A workflow_dispatch sent by
  github-actions[bot] proceeds only through a checked dispatcher run. With
  require-pr false it checks the actors only and reads no PR. Always exits 0
  with proceed and reason; any read, parse or API failure emits
  proceed=false.

inputs:
  event-name:
    description: The triggering event name.
    required: false
    default: ${{ github.event_name }}
  event-path:
    description: Path to the event payload file.
    required: false
    default: ${{ github.event_path }}
  trusted-actors-path:
    description: >
      Path to the trusted-actor list, read from the base-SHA checkout so a PR
      cannot change the list it is judged by.
    required: false
    default: .base/.github/standards/trusted-actors/trusted-actors.json
  pr-number:
    description: The PR number on workflow_dispatch; ignored for other events.
    required: false
    default: ""
  github-token:
    description: >
      Token that can read the PR, used on workflow_dispatch and workflow_run
      to fetch it, and on a dispatcher-sent run to read both run records and
      compare commits.
    required: false
    default: ${{ github.token }}
  denied-actor-ids:
    description: >
      Comma- or space-separated user ids that stop the lane with bot-actor
      when any event actor has one, or with untrusted-rerunner when the
      triggering actor has one, even if listed.
    required: false
    default: ""
  triggering-actor:
    description: >
      The login that started this run attempt, which differs from the event
      actor on a re-run. Must be on the list; empty stops the lane.
    required: false
    default: ${{ github.triggering_actor }}
  dispatcher-run-id:
    description: >
      On a workflow_dispatch sent by github-actions[bot] (id 41898282), the
      id of the dispatcher run that sent it. Empty keeps the bot unlisted, so
      such a dispatch stops with untrusted-actor.
    required: false
    default: ""
  dispatcher-workflow:
    description: >
      The workflow path the dispatcher run must have, such as
      .github/workflows/<name>.yml. Empty stops every dispatcher-sent run.
    required: false
    default: ""
  run-dispatcher-workflow:
    description: >
      The workflow path a dispatcher run started by workflow_run must have.
      Such a run is trusted through the upstream run its record names, not
      its actor. Empty stops every workflow_run dispatcher.
    required: false
    default: ""
  run-dispatcher-upstreams:
    description: >
      Space-separated workflow paths the upstream run of a workflow_run
      dispatcher may have. It must also be a pull_request run of this
      repository, started (and any re-run) by the lanes App or a listed
      human, at the PR's current head. Empty stops every such dispatcher.
    required: false
    default: ""
  expected-upstream-head:
    description: >
      For a job after pr-unblock's model job, the head that job was gated on.
      With a workflow_run dispatcher the upstream must have reviewed it, and
      every commit from it to the PR's current head must be a
      signature-verified commit the lanes App authored. Empty keeps the
      current-head rule; set on any other path, it stops the run.
    required: false
    default: ""
  lanes-app-id:
    description: >
      The lanes App bot's numeric user id: an upstream review it started
      vouches, and only its commits may follow expected-upstream-head.
    required: false
    default: ""
  dispatched-workflow:
    description: >
      The workflow path this run must have when a dispatcher run sent it, and
      it must be a workflow_dispatch run on the default branch. Empty stops
      every dispatcher-sent run.
    required: false
    default: ""
  require-kind:
    description: >
      Empty accepts any listed actor. `human` narrows the actor-only checks
      (require-pr false) to actors listed with kind human, matched by id.
    required: false
    default: ""
  ratified-app-label:
    description: >
      With require-kind human on an issues event, the one label the lanes App
      (lanes-app-id) may apply to start the lane: it proceeds only while the
      issue carries a listed human's unedited ratification marker comment,
      read through the API now, and only for that App or a listed human as
      re-runner. Any other App event, or a failed read, stops. Empty keeps
      every App event stopped.
    required: false
    default: ""
  require-pr:
    description: >
      `true` gates a PR as described above. `false` checks only the actors
      of a push, workflow_dispatch or issues event: the sender on
      workflow_dispatch and issues, and the triggering actor on all three;
      any other event stops; no PR is read and the PR outputs stay empty.
    required: false
    default: "true"

outputs:
  proceed:
    description: "`true` when the lane may proceed, otherwise `false`."
    value: ${{ steps.check.outputs.proceed }}
  reason:
    description: "`ok`, `fork`, `no-pr`, `bot-actor`, `untrusted-actor`, `untrusted-rerunner`, `untrusted-author` or `list-unreadable`."
    value: ${{ steps.check.outputs.reason }}
  pr-number:
    description: The resolved PR number; empty unless proceed is `true`.
    value: ${{ steps.check.outputs.pr-number }}
  head-ref:
    description: The PR head branch; empty unless proceed is `true`.
    value: ${{ steps.check.outputs.head-ref }}
  head-sha:
    description: The PR head SHA; empty unless proceed is `true`.
    value: ${{ steps.check.outputs.head-sha }}
  base-sha:
    description: The PR base SHA; empty unless proceed is `true`.
    value: ${{ steps.check.outputs.base-sha }}

runs:
  using: composite
  steps:
    - name: Check the trigger
      id: check
      shell: bash
      env:
        EVENT_NAME: ${{ inputs.event-name }}
        EVENT_PATH: ${{ inputs.event-path }}
        TRUSTED_ACTORS_PATH: ${{ inputs.trusted-actors-path }}
        PR_NUMBER: ${{ inputs.pr-number }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DENIED_ACTOR_IDS: ${{ inputs.denied-actor-ids }}
        TRIGGERING_ACTOR: ${{ inputs.triggering-actor }}
        DISPATCHER_RUN_ID: ${{ inputs.dispatcher-run-id }}
        DISPATCHER_WORKFLOW: ${{ inputs.dispatcher-workflow }}
        RUN_DISPATCHER_WORKFLOW: ${{ inputs.run-dispatcher-workflow }}
        RUN_DISPATCHER_UPSTREAMS: ${{ inputs.run-dispatcher-upstreams }}
        EXPECTED_UPSTREAM_HEAD: ${{ inputs.expected-upstream-head }}
        LANES_APP_ID: ${{ inputs.lanes-app-id }}
        DISPATCHED_WORKFLOW: ${{ inputs.dispatched-workflow }}
        REQUIRE_KIND: ${{ inputs.require-kind }}
        RATIFIED_APP_LABEL: ${{ inputs.ratified-app-label }}
        REQUIRE_PR: ${{ inputs.require-pr }}
        REPOSITORY: ${{ github.repository }}
      run: node "$GITHUB_ACTION_PATH/check-trusted-trigger.mjs"
