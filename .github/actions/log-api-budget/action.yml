name: Log API budget
description: >
  At the end of a job, write the hub collector's api-budget notice for each
  named token, from the rate-limit readings the job's own API responses left
  in $RUNNER_TEMP/api-budget (api-budget.bash): one per refused (403/429)
  response and one for the last. GET /rate_limit is never read: it reports a
  different bucket from the one the job spends. Then an `api-calls <name>=N
  not-modified=M` line: N is this job's own calls, which cost (the rise in a
  counter every concurrent job shares) is not, and M its 304 answers, which
  GitHub does not count. Then one line for the job's content-creating writes
  (count and most in any 60 s). Also writes each line and a `<name>-cost=N`
  line to the step summary. A token with no reading gets no line. Never fails
  the job.

inputs:
  tokens:
    description: >
      Token names, space or newline separated, in lower-case kebab case:
      `github-token` for the job token, `lanes-app` for the lanes App token.
    required: true

outputs:
  costs:
    description: "`<name>-cost=N` for each named token with a reading, `unknown` when its cost is na."
    value: ${{ steps.log.outputs.costs }}

runs:
  using: composite
  steps:
    - name: Log the API budget
      id: log
      shell: bash
      env:
        TOKENS: ${{ inputs.tokens }}
      run: |
        # shellcheck source=/dev/null
        . "$GITHUB_ACTION_PATH/api-budget.bash" || exit 0
        costs=()
        for name in $TOKENS; do
          [[ $name =~ ^[a-z][a-z0-9-]{0,39}$ ]] || { echo "::warning::api-budget: skipped a token name that is not lower-case kebab case"; continue; }
          lines=$(api_budget_emit "$name")
          [[ -n $lines ]] || continue
          printf '%s\n' "$lines"
          sed 's/^::notice title=api-budget::/api-budget: /' <<<"$lines" >>"$GITHUB_STEP_SUMMARY"
          # This job's own calls, one reading each: unlike cost, no other job's.
          calls=$(awk '$1 != 304 { n++ } $1 == 304 { m++ } END { printf "api-calls %s=%d not-modified=%d", token, n, m }' token="$name" "$RUNNER_TEMP/api-budget/$name")
          echo "$calls"
          echo "$calls" >>"$GITHUB_STEP_SUMMARY"
          cost=${lines##*cost=}
          costs+=("$name-cost=${cost/na/unknown}")
        done
        lines=$(api_budget_emit_content)
        if [[ -n $lines ]]; then
          printf '%s\n' "$lines"
          sed 's/^::notice title=api-budget::/api-budget: /' <<<"$lines" >>"$GITHUB_STEP_SUMMARY"
        fi
        if ((${#costs[@]} > 0)); then
          echo "${costs[*]}" >>"$GITHUB_STEP_SUMMARY"
          echo "costs=${costs[*]}" >>"$GITHUB_OUTPUT"
        fi
        exit 0
