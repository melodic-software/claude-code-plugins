name: Log API budget
description: >
  At the end of a job, write the hub collector's api-budget notice for each
  named token, from the rate-limit readings the job's own API responses left
  in $RUNNER_TEMP/api-budget (api-budget.bash): one per refused (403/429)
  response and one for the last. GET /rate_limit is never read: it reports a
  different bucket from the one the job spends. Then an `api-calls` notice,
  `<name>=N not-modified=M graphql=K`: N is this job's own requests, which cost (the rise in a
  counter every concurrent job shares) is not, M its 304 answers, which
  GitHub does not count, and K the GraphQL requests among N, which spend
  GraphQL's own pool. Then one line for the job's content-creating writes
  (count and most in any 60 s). Then an `api-routes` notice per token,
  `<name> <route>=<count> ... rest=<count>`: N by templated request path,
  most first, at most 15 routes. Also writes each line and a `<name>-cost=N`
  line to the step summary. A token with no reading gets only its api-calls
  line, at 0. Never fails the job.

inputs:
  tokens:
    description: >
      Token names, space or newline separated, in lower-case kebab case:
      `github-token` for the job token, `lanes-app` for the lanes App token.
    required: true

outputs:
  costs:
    description: "`<name>-cost=N` for each named token with a reading, `unknown` when its cost is na."
    value: ${{ steps.log.outputs.costs }}
  calls:
    description: "`<name>-calls=N` for each named token, N its api-calls count: this job's own requests."
    value: ${{ steps.log.outputs.calls }}

runs:
  using: composite
  steps:
    - name: Log the API budget
      id: log
      shell: bash
      env:
        TOKENS: ${{ inputs.tokens }}
      run: |
        # shellcheck source=/dev/null
        . "$GITHUB_ACTION_PATH/api-budget.bash" || exit 0
        costs=() counts=() names=()
        for name in $TOKENS; do
          [[ $name =~ ^[a-z][a-z0-9-]{0,39}$ ]] || { echo "::warning::api-budget: skipped a token name that is not lower-case kebab case"; continue; }
          names+=("$name")
          lines=$(api_budget_emit "$name")
          if [[ -n $lines ]]; then
            printf '%s\n' "$lines"
            sed 's/^::notice title=api-budget::/api-budget: /' <<<"$lines" >>"$GITHUB_STEP_SUMMARY"
          fi
          # This job's own requests, every page and gh subcommand: unlike cost, no other job's.
          # A notice, as the hub reads annotations, not the log; 0 with no reading.
          calls=$(api_budget_emit_calls "$name")
          printf '%s\n' "$calls"
          echo "api-calls ${calls#*title=api-calls::}" >>"$GITHUB_STEP_SUMMARY"
          # With no RUNNER_TEMP the emitter writes no line: unknown, never empty.
          n=${calls#*title=api-calls::"$name"=}
          n=${n%% *}
          [[ $n =~ ^[0-9]+$ ]] || n=unknown
          counts+=("$name-calls=$n")
          [[ -n $lines ]] || continue
          cost=${lines##*cost=}
          costs+=("$name-cost=${cost/na/unknown}")
        done
        lines=$(api_budget_emit_content)
        if [[ -n $lines ]]; then
          printf '%s\n' "$lines"
          sed 's/^::notice title=api-budget::/api-budget: /' <<<"$lines" >>"$GITHUB_STEP_SUMMARY"
        fi
        # Last, after the lines the hub already reads.
        lines=$(api_budget_emit_routes "${names[@]}")
        if [[ -n $lines ]]; then
          printf '%s\n' "$lines"
          sed 's/^::notice title=api-routes::/api-routes /' <<<"$lines" >>"$GITHUB_STEP_SUMMARY"
        fi
        ((${#counts[@]} == 0)) || echo "calls=${counts[*]}" >>"$GITHUB_OUTPUT"
        if ((${#costs[@]} > 0)); then
          echo "${costs[*]}" >>"$GITHUB_STEP_SUMMARY"
          echo "costs=${costs[*]}" >>"$GITHUB_OUTPUT"
        fi
        exit 0
