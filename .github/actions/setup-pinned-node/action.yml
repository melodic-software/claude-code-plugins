name: Set up pinned Node
description: >
  Put the exact Node version a version file pins on PATH without a GitHub API
  call. actions/setup-node reads the actions/node-versions manifest through
  api.github.com with the job token whenever the version is not in the
  runner's tool cache, two requests a step. This action uses the tool cache
  when it holds the version and otherwise downloads the release from
  nodejs.org, checked against that release's SHASUMS256.txt after verifying
  that file's signature with the committed Node.js release keyring. Linux X64
  only.

inputs:
  node-version-file:
    description: >
      The file holding the exact X.Y.Z version, normally `.base/.node-version`
      in a job that checks main out to `.base`.
    required: true

runs:
  using: composite
  steps:
    - name: Install Node
      shell: bash
      env:
        VERSION_FILE: ${{ inputs.node-version-file }}
      run: bash "$GITHUB_ACTION_PATH/install-node.sh" "$VERSION_FILE"
