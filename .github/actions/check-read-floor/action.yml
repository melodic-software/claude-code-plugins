name: Check read floor
description: >
  Gate a maintenance lane on the GITHUB_TOKEN pool's read floor. Emits
  skip=false only when one counted read shows the pool at or above limits.api
  github-token read-floor of its planned budget (the base checkout's
  pr-pipeline.yaml over log-api-budget/rate-limits.json); under it, and when
  the pool cannot be read, emits skip=true. Always exits 0: gate the work on
  `skip == 'false'`, so a missing output also keeps it stopped.

inputs:
  github-token:
    description: The job token whose pool is read.
    required: false
    default: ${{ github.token }}

outputs:
  skip:
    description: "`false` when the work may run, otherwise `true`."
    value: ${{ steps.check.outputs.skip }}
  reason:
    description: "`ok`, `below-floor` or `unreadable`."
    value: ${{ steps.check.outputs.reason }}

runs:
  using: composite
  steps:
    # The base config's limits.api, in resolve-config's output shape; a failed
    # read leaves rate-limits.json's defaults.
    - name: Read the API margins from the base config
      shell: bash
      run: |
        yq -o=json '{"limits": {"api": (.limits.api // {})}}' "$GITHUB_ACTION_PATH/../../../docs/conventions/pr-pipeline.yaml" >"$RUNNER_TEMP/read-floor-config.json" ||
          rm -f "$RUNNER_TEMP/read-floor-config.json"

    - name: Check the read floor
      id: check
      shell: bash
      env:
        RESOLVED_CONFIG: ${{ runner.temp }}/read-floor-config.json
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/check-read-floor.mjs"
