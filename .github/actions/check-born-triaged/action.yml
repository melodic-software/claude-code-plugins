name: Check Born Triaged
description: >
  Decide whether an issue skips intake because another skill routes it or
  /work-items:decompose published it already triaged. skip=true when the issue
  carries the tracker binding's container label or a label starting with its
  wayfind prefix; or, with born-triaged true, when it carries the born-triaged
  marker, its author is a listed human or the lanes App (by numeric id), and it
  has an Issue Type and a status (a Work status field a trusted account set, or
  a status label; agent-ready alone counts only while the field is not
  configured). Re-reads the issue for up to about 25 seconds while only the
  type or status is missing. Fails when
  resolve-config's dependencies do not install or the Work status field
  cannot be read; any other read failure emits skip=false, and a rate limit,
  from this read or a stop the job already holds, also emits
  rate-limited=true.

inputs:
  issue-number:
    description: The issue to check.
    required: false
    default: ${{ github.event.issue.number }}
  trusted-actors-path:
    description: Path to the trusted-actor list, read from a default-branch checkout.
    required: false
    default: .base/.github/standards/trusted-actors/trusted-actors.json
  lanes-app-id:
    description: The lanes App bot's numeric user id. Empty trusts listed humans only.
    required: false
    default: ""
  github-token:
    description: Token that can read the issue.
    required: false
    default: ${{ github.token }}
  born-triaged:
    description: "`false` skips only on a routing label; anything else also applies the born-triaged rule."
    required: false
    default: "true"
  tracker-config:
    description: The work-items binding holding the routing labels, read from a default-branch checkout; a missing file keeps their defaults.
    required: false
    default: .base/docs/conventions/work-items.yaml

outputs:
  skip:
    description: "`true` when intake should skip the issue, otherwise `false`."
    value: ${{ steps.check.outputs.skip }}
  reason:
    description: "`routing-label`, `born-triaged`, `born-triaged-off`, `no-marker`, `untrusted-author`, `no-type`, `no-status`, `label-only`, `list-unreadable` or `issue-unreadable`."
    value: ${{ steps.check.outputs.reason }}
  label:
    description: The routing label that skipped the issue; empty otherwise.
    value: ${{ steps.check.outputs.label }}
  human-ids:
    description: "The trusted-actor list's `kind: human` ids, comma-joined; empty when the list is unreadable."
    value: ${{ steps.check.outputs.human-ids }}
  rate-limited:
    description: "`true` when the rate guard holds a stop on the issue read's pool; callers then make no more GitHub calls with the token. Otherwise `false`."
    value: ${{ steps.check.outputs.rate-limited }}

runs:
  using: composite
  steps:
    # The Work status field is read through resolve-config (read-status.mjs),
    # which needs its dependencies; without them every status read throws, so
    # an install that fails fails the step. A composite step takes no
    # timeout-minutes, so `timeout` bounds the install.
    - name: Check the issue
      id: check
      shell: bash
      env:
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        TRUSTED_ACTORS_PATH: ${{ inputs.trusted-actors-path }}
        LANES_APP_ID: ${{ inputs.lanes-app-id }}
        BORN_TRIAGED: ${{ inputs.born-triaged }}
        TRACKER_CONFIG: ${{ inputs.tracker-config }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
      run: |
        timeout 2m npm ci --ignore-scripts --omit=dev --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH/../resolve-config"
        node "$GITHUB_ACTION_PATH/check-born-triaged.mjs"
