name: Request lane token
description: >
  Exchange this job's GitHub OIDC token at the lanes token broker. In `token`
  mode, the default, it gets one lane App installation token: it retries only
  a 503 `github-unavailable`, with backoff, masks the token, and fails red, after
  revoking the token, unless the broker's effect, permissions, lane, activity
  and repository equal what this job resolved. In `check` mode it asks the
  broker's check endpoint, which mints nothing, whether a read lane may run,
  and fails red on anything but an allow. Contract:
  docs/conventions/pr-pipeline/pr-run-activity.md, run job step 6 and the
  check job.

inputs:
  mode:
    description: "`token` mints the write lane's token; `check` asks the check endpoint and mints nothing."
    required: false
    default: token
  broker-url:
    description: >
      The broker's token endpoint, normally `vars.LANES_BROKER_URL`. Empty
      fails red. `check` mode posts to the same URL with its final `/token`
      replaced by `/check`.
    required: true
  audience:
    description: The OIDC audience the broker accepts, normally `vars.LANES_BROKER_AUDIENCE`. Empty fails red.
    required: true
  lane:
    description: The lane, its caller workflow's file stem.
    required: true
  activity:
    description: The activity.
    required: true
  pr-number:
    description: The gated PR number; sent as `pr_number` when set. `token` mode only.
    required: false
    default: ""
  issue-number:
    description: >-
      The issue an `issues` lane works; sent as `issue_number` when set, which
      the broker needs on an `issues` event. Never with `pr-number` or
      `dispatcher-run-id`. `token` mode only.
    required: false
    default: ""
  dispatcher-run-id:
    description: >-
      The pr-unblock-dispatch.yml run that dispatched this run; sent as
      `dispatcher_run_id` when set, which the broker needs for a run sent by
      github-actions[bot]. `token` mode only.
    required: false
    default: ""
  expected-upstream-head:
    description: >-
      For a job after pr-unblock's model job, the head that job was gated on;
      sent as `expected_upstream_head`, with `dispatcher-run-id` only.
      `token` mode only.
    required: false
    default: ""
  effect:
    description: The effect resolve-config resolved for this activity. Required in `token` mode, empty in `check` mode.
    required: false
    default: ""
  contents:
    description: The resolved grant's `contents`, `read` or `write`. Required in `token` mode, empty in `check` mode.
    required: false
    default: ""
  pull-requests:
    description: The resolved grant's `pull-requests`, `read` or `write`. Required in `token` mode, empty in `check` mode.
    required: false
    default: ""
  issues:
    description: The resolved grant's `issues`, `read` or `write`. Required in `token` mode, empty in `check` mode.
    required: false
    default: ""
  superseded-ok:
    description: >-
      `true` ends the step green, with a warning and no token, when the broker
      answers 403 with reason `workflow-modified`: the caller workflow changed
      on the default branch after this run started, so a newer run does its
      work. Any other denial still fails red. Default `false`.
    required: false
    default: "false"

outputs:
  token:
    description: The lane App token, masked; set only in `token` mode when every check passed.
    value: ${{ steps.request.outputs.token }}
  expires-at:
    description: The token's expiry, as the broker returned it.
    value: ${{ steps.request.outputs.expires-at }}
  mint-id:
    description: The broker's `<check_run_id>-<run_attempt>` for this mint.
    value: ${{ steps.request.outputs.mint-id }}
  failure-reason:
    description: >
      The one-line reason the step failed with, such as `lane-token-denied: ...`;
      empty on a success.
    value: ${{ steps.request.outputs.failure-reason }}

runs:
  using: composite
  steps:
    - name: Request the lane token
      id: request
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BROKER_URL: ${{ inputs.broker-url }}
        AUDIENCE: ${{ inputs.audience }}
        LANE: ${{ inputs.lane }}
        ACTIVITY: ${{ inputs.activity }}
        PR_NUMBER: ${{ inputs.pr-number }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        DISPATCHER_RUN_ID: ${{ inputs.dispatcher-run-id }}
        EXPECTED_UPSTREAM_HEAD: ${{ inputs.expected-upstream-head }}
        EFFECT: ${{ inputs.effect }}
        CONTENTS: ${{ inputs.contents }}
        PULL_REQUESTS: ${{ inputs.pull-requests }}
        ISSUES: ${{ inputs.issues }}
        SUPERSEDED_OK: ${{ inputs.superseded-ok }}
      run: |
        set -euo pipefail
        umask 077
        fail() {
          echo "::error::$1"
          printf -- '- %s\n' "$1" >>"$GITHUB_STEP_SUMMARY"
          printf 'failure-reason=%s\n' "$1" >>"$GITHUB_OUTPUT"
          exit 1
        }
        # One printable line, at most 300 characters: broker text is data.
        one_line() { tr -cd '[:print:]' | cut -c1-300; }

        [ -n "$BROKER_URL" ] || fail "lane-token-unconfigured: the LANES_BROKER_URL variable is empty"
        [ -n "$AUDIENCE" ] || fail "lane-token-unconfigured: the LANES_BROKER_AUDIENCE variable is empty"
        [[ $BROKER_URL =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._/-]*)?$ ]] ||
          fail "lane-token-unconfigured: LANES_BROKER_URL is not an https URL"
        [[ $AUDIENCE =~ ^[A-Za-z0-9._:-]+$ ]] ||
          fail "lane-token-unconfigured: LANES_BROKER_AUDIENCE holds characters an audience cannot"
        name='^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        [[ $LANE =~ $name && $ACTIVITY =~ $name ]] || fail "the lane and activity must be kebab-case names"
        SUPERSEDED_OK=${SUPERSEDED_OK:-false}
        [[ $SUPERSEDED_OK == true || $SUPERSEDED_OK == false ]] || fail "superseded-ok must be true or false"
        case "$MODE" in
        token)
          [[ $EFFECT =~ $name ]] || fail "the effect must be a kebab-case name"
          for value in "$CONTENTS" "$PULL_REQUESTS" "$ISSUES"; do
            [[ $value == read || $value == write ]] ||
              fail "the resolved grant must be read or write for contents, pull-requests and issues"
          done
          [[ -z ${PR_NUMBER:-} || $PR_NUMBER =~ ^[1-9][0-9]{0,9}$ ]] || fail "the PR number is malformed"
          [[ -z ${ISSUE_NUMBER:-} || $ISSUE_NUMBER =~ ^[1-9][0-9]{0,9}$ ]] || fail "the issue number is malformed"
          [[ -z ${ISSUE_NUMBER:-} || -z $PR_NUMBER$DISPATCHER_RUN_ID ]] ||
            fail "an issue number goes without a PR number or dispatcher run id"
          # At most 15 digits keeps it a safe JSON integer for the broker.
          [[ -z ${DISPATCHER_RUN_ID:-} || $DISPATCHER_RUN_ID =~ ^[1-9][0-9]{0,14}$ ]] ||
            fail "the dispatcher run id is malformed"
          [[ -z ${EXPECTED_UPSTREAM_HEAD:-} || ($EXPECTED_UPSTREAM_HEAD =~ ^[0-9a-f]{40}$ && -n $DISPATCHER_RUN_ID) ]] ||
            fail "the expected upstream head must be a commit SHA and ride with a dispatcher run id"
          ;;
        check)
          # The check job resolves no grant and gates no PR, and the broker's
          # check endpoint answers 400 to any body field but lane and activity.
          [[ -z $EFFECT$CONTENTS$PULL_REQUESTS$ISSUES$PR_NUMBER$ISSUE_NUMBER$DISPATCHER_RUN_ID${EXPECTED_UPSTREAM_HEAD:-} ]] ||
            fail "check mode takes no effect, grant, PR or issue number, or dispatcher run id"
          [[ $BROKER_URL =~ ^https://[^/]+/(.+/)?token$ ]] ||
            fail "lane-token-unconfigured: LANES_BROKER_URL does not end in a /token path segment, so it names no check endpoint"
          BROKER_URL="${BROKER_URL%/token}/check"
          ;;
        *) fail "mode must be token or check" ;;
        esac
        [[ -n ${ACTIONS_ID_TOKEN_REQUEST_URL:-} && -n ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-} ]] ||
          fail "the job cannot request an OIDC token; it needs permissions id-token: write"

        response="$RUNNER_TEMP/lane-token-response.json"
        headers="$RUNNER_TEMP/lane-token-headers.txt"
        issued=""
        revoke() {
          printf 'Authorization: Bearer %s\n' "$1" |
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X DELETE -H @- \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/installation/token" || true
        }
        # Any failure after the broker issued a token attempts a revoke here and
        # prints its status, so only a token that passed every check reaches the job.
        cleanup() {
          local rc=$?
          rm -f "$response" "$headers"
          if [ "$rc" -ne 0 ] && [ -n "$issued" ]; then
            echo "Revoke attempt returned $(revoke "$issued")"
          fi
        }
        trap cleanup EXIT

        body=$(jq -cn --arg lane "$LANE" --arg activity "$ACTIVITY" --arg pr "$PR_NUMBER" \
          --arg issue "$ISSUE_NUMBER" --arg dispatcher "$DISPATCHER_RUN_ID" --arg upstream "${EXPECTED_UPSTREAM_HEAD:-}" \
          '{lane: $lane, activity: $activity}
            + (if $pr == "" then {} else {pr_number: ($pr | tonumber)} end)
            + (if $issue == "" then {} else {issue_number: ($issue | tonumber)} end)
            + (if $dispatcher == "" then {} else {dispatcher_run_id: ($dispatcher | tonumber)} end)
            + (if $upstream == "" then {} else {expected_upstream_head: $upstream} end)')

        reason_of() { jq -r 'if type == "object" and (.reason | type) == "string" then .reason else "" end' "$response" 2>/dev/null || true; }
        detail_of() { jq -r 'if type == "object" and (.detail | type) == "string" then .detail else "" end' "$response" 2>/dev/null | one_line || true; }

        # The one retry is a 503 github-unavailable: the broker's GitHub call
        # failed, as under a secondary rate limit. GitHub
        # says to wait at least a minute, then back off exponentially:
        # https://docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api#exceeding-the-rate-limit
        # A failed mint also answers github-unavailable, after the broker
        # reserved the job's one mint, so its retry is denied already-minted and
        # never gets a second token. Every other answer, and no answer, is
        # final: a 200 lost in transit is revoked by nobody. A Retry-After header
        # longer than the backoff sets the wait; no retry starts more than 8
        # minutes after the first request, so with its 30 s OIDC and 60 s broker
        # timeouts the last answer comes within 9.5 minutes.
        # Each attempt takes a fresh OIDC token. A check is never reserved, so
        # re-running all jobs asks again; "Re-run failed jobs" reuses an earlier
        # allow, which the read file's run job refuses.
        backoff=(60 120 240)
        attempt=0 start=$SECONDS retried=""
        while :; do
          oidc=$(printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" |
            curl -sS --fail --max-time 30 -H @- "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" |
            jq -r 'if type == "object" and (.value | type) == "string" then .value else "" end') ||
            fail "the OIDC token request failed"
          [ -n "$oidc" ] || fail "the OIDC token request returned no token"
          echo "::add-mask::$oidc"
          status=$(printf 'Authorization: Bearer %s\n' "$oidc" |
            curl -sS --proto '=https' --max-time 60 -o "$response" -D "$headers" -w '%{http_code}' -X POST -H @- \
              -H 'Content-Type: application/json' --data-binary "$body" "$BROKER_URL") || status=000
          unset oidc
          [[ $status == 503 && $attempt -lt ${#backoff[@]} && $(reason_of) == github-unavailable ]] || break
          delay=$((backoff[attempt] + RANDOM % 21))
          after=$(tr -d '\r' <"$headers" 2>/dev/null |
            awk -F': *' 'tolower($1) == "retry-after" && $2 ~ /^[0-9]+$/ && length($2) <= 6 { v = $2 + 0 } END { print v }') || after=""
          [[ -z $after || $after -le $delay ]] || delay=$after
          [ $((SECONDS - start + delay)) -le 480 ] || break
          detail=$(detail_of)
          retried="503 with reason github-unavailable${detail:+: $detail}"
          attempt=$((attempt + 1))
          echo "::warning::lane-token-retry: the broker answered $retried; retry $attempt of ${#backoff[@]} in ${delay}s"
          sleep "$delay"
        done

        if [ "$status" = 000 ]; then
          fail "broker-unreachable: the lanes token broker gave no response${retried:+, after $retried}"
        fi
        denied=lane-token-denied
        [ "$MODE" = token ] || denied=lane-check-denied
        if [ "$status" != 200 ]; then
          reason=$(reason_of)
          [[ $reason =~ ^[a-z]+(-[a-z]+)*$ ]] || reason=unknown
          detail=$(detail_of)
          [ "$reason" != github-unavailable ] || retried=""
          detail="$detail${retried:+, after $retried}"
          if [[ $SUPERSEDED_OK == true && $status == 403 && $reason == workflow-modified ]]; then
            msg="lane-token-superseded: $LANE.yml changed on the default branch after this run started, so a newer run of it does this work; this run takes no token and skips the rest"
            echo "::warning::$msg"
            printf -- '- %s\n' "$msg" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          fail "$denied: the broker answered $status with reason $reason${detail:+: $detail}"
        fi

        if [ "$MODE" = check ]; then
          allowed=$(jq --arg lane "$LANE" --arg activity "$ACTIVITY" \
            'type == "object" and .decision == "allow" and .lane == $lane and .activity == $activity' \
            "$response" 2>/dev/null) || allowed=false
          [ "$allowed" = true ] || fail "$denied: the broker's 200 is not an allow for this lane and activity"
          # shellcheck disable=SC2016  # the backticks are Markdown, not expansions
          printf -- '- Broker check allowed: lane `%s`, activity `%s`\n' "$LANE" "$ACTIVITY" >>"$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        token=$(jq -r 'if type == "object" and (.token | type) == "string" then .token else "" end' "$response") || token=""
        [[ $token =~ ^[A-Za-z0-9_.-]+$ ]] || fail "lane-token-denied: the broker's 200 carries no usable token"
        echo "::add-mask::$token"
        issued=$token

        # The broker derives the grant from the default-branch tip; this job ran
        # base-SHA actions on its own resolution. Any difference fails red.
        got=$(jq -c '{effect, permissions, lane, activity, repository_ids}' "$response")
        want=$(jq -cn --arg effect "$EFFECT" --arg c "$CONTENTS" --arg p "$PULL_REQUESTS" --arg i "$ISSUES" \
          --arg lane "$LANE" --arg activity "$ACTIVITY" --arg repo "$GITHUB_REPOSITORY_ID" \
          '{effect: $effect, permissions: {contents: $c, pull_requests: $p, issues: $i},
            lane: $lane, activity: $activity, repository_ids: [($repo | tonumber)]}')
        if [ "$(jq -n --argjson got "$got" --argjson want "$want" '$got == $want')" != true ]; then
          fail "effect-mismatch: the broker granted $(one_line <<<"$got"), this job resolved $want"
        fi

        expires=$(jq -r '.expires_at // ""' "$response" | one_line)
        mint_id=$(jq -r '.mint_id // ""' "$response" | one_line)
        [[ $mint_id =~ ^[0-9]+-[0-9]+$ ]] || fail "lane-token-denied: the broker's 200 carries no mint id"
        {
          echo "token=$token"
          echo "expires-at=$expires"
          echo "mint-id=$mint_id"
        } >>"$GITHUB_OUTPUT"
        # shellcheck disable=SC2016  # the backticks are Markdown, not expansions
        printf -- '- Lane token minted: effect `%s`, mint `%s`, expires `%s`\n' "$EFFECT" "$mint_id" "$expires" >>"$GITHUB_STEP_SUMMARY"
        issued=""
