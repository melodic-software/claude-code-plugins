version: 2
activities:
  run-tests:
    script: scripts/run-tests.sh
    effect: read
    gating: gate
    reads-untrusted: false
  fix-prose:
    script: scripts/fix-prose.sh
    effect: mutate-branch
    gating: advisory
    reads-untrusted: false
lanes:
  pr-run-checks:
    stage: verify
    slots:
      - activity: run-tests
        needs: [fix-prose]
  pr-refine:
    stage: refine
    slots:
      - activity: fix-prose
