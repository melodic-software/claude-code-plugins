name: Check trusted base
description: >
  Fail unless the gated PR targets the default branch and its base SHA is on
  the default branch, then check out the trusted base in the base checkout:
  that SHA in mode pr-base, the default branch tip in mode default-tip. Only a
  PR into the default branch runs, and only from a base the default branch
  already holds: a PR into another branch could otherwise choose the actions,
  config and trusted-actor list it is judged by. Contract:
  docs/conventions/pr-pipeline/pr-run-activity.md, run job step 4.

inputs:
  base-sha:
    description: The trigger gate's base SHA.
    required: true
  pr-number:
    description: The trigger gate's PR number, read on events other than pull_request.
    required: true
  base-path:
    description: The default-branch checkout, with full history.
    required: false
    default: .base
  github-token:
    description: Token that can read the PR.
    required: false
    default: ${{ github.token }}
  mode:
    description: >
      pr-base trusts the gated base SHA. default-tip trusts the default branch
      tip instead, for a lane whose PR keeps a stale base SHA (a PR in merge
      conflict); it must run before any head checkout.
    required: false
    default: pr-base

outputs:
  commit:
    description: >
      The checked-out trusted base SHA, used for config, actions, trusted
      actors and a merge's second parent; set only when every check passed.
    value: ${{ steps.check.outputs.commit }}

runs:
  using: composite
  steps:
    - name: Check the base
      id: check
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        BASE_SHA: ${{ inputs.base-sha }}
        PR_NUMBER: ${{ inputs.pr-number }}
        BASE_PATH: ${{ inputs.base-path }}
        GH_TOKEN: ${{ inputs.github-token }}
        MODE: ${{ inputs.mode }}
      run: |
        fail() {
          echo "::error::$1"
          exit 1
        }
        case $MODE in
        pr-base | default-tip) ;;
        *) fail "mode must be pr-base or default-tip" ;;
        esac
        if [ "$EVENT_NAME" = pull_request ]; then
          base_ref=$EVENT_BASE_REF
        else
          base_ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .base.ref) ||
            fail "could not read the PR's base branch"
        fi
        [ -n "$DEFAULT_BRANCH" ] || fail "the event names no default branch"
        [ "$base_ref" = "$DEFAULT_BRANCH" ] ||
          fail "the PR targets a branch other than the default branch; lanes run only on PRs into the default branch"
        [[ $BASE_SHA =~ ^[0-9a-f]{40}$ ]] || fail "the gated base SHA is malformed"
        git -C "$BASE_PATH" merge-base --is-ancestor "$BASE_SHA" "refs/remotes/origin/$DEFAULT_BRANCH" ||
          fail "the gated base SHA is not on the default branch"
        trusted=$BASE_SHA
        if [ "$MODE" = default-tip ]; then
          trusted=$(git -C "$BASE_PATH" rev-parse --verify "refs/remotes/origin/$DEFAULT_BRANCH^{commit}") ||
            fail "could not resolve the default branch tip"
        fi
        git -C "$BASE_PATH" checkout -q --detach "$trusted"
        commit=$(git -C "$BASE_PATH" rev-parse HEAD)
        echo "trusted-base-sha=$commit mode=$MODE"
        echo "commit=$commit" >>"$GITHUB_OUTPUT"
