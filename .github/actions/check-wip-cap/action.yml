name: Check the WIP cap
description: >
  Read the lanes App's open, merged and opened pull requests in this
  repository with serial searches on the job's own token, then the open
  agent-ready issues from the repository issues listing, plus one pull request
  read per open lane PR whose first body line
  names no issue (its head branch then names it); derive the issue lane's WIP cap from the merge rate and the default
  branch's pr-pipeline.yaml `wip` block; count held pull requests apart; count
  queued work against the admission pace; and publish the status. Set
  `capped` to `true` only when runs pause (over the WIP cap or the held cap on
  or after `wip.pause-from`), and on a hold: when a read the pause depends on
  (the open listing, the base config) fails, the pause is
  unknown, `capped` is `true` and a notice names the hold. No stored state
  decides it. Set `admission-open` to `false` only when new
  admissions pause (queued work at or over the queued cap on or after
  `wip.pause-from`, or, whatever `wip.pause-from` says, a search answered
  `incomplete_results: true` or the base config could not be read).
  Run it from the default branch checkout, before any slot or lane token.

inputs:
  base-path:
    description: The default-branch checkout that holds this action and the config.
    required: false
    default: .base
  reads:
    description: >-
      `full` (the default) makes every read. `pause` makes only the two
      searches `capped` depends on (the open lane PRs and the merged count),
      for a job that reads no other output; `admission-open` is then `true`
      and the status's `admission_basis` is `not-read`, unless a search
      answered incomplete or the base config could not be read.
    required: false
    default: full
  github-token:
    description: A token that can search this repository's pull requests and list its issues.
    required: false
    default: ${{ github.token }}

outputs:
  capped:
    description: "`true` only while the lane pauses (over the WIP cap or the held cap on or after `wip.pause-from`, or a hold when a read the pause depends on failed); otherwise `false`."
    value: ${{ steps.check.outputs.capped }}
  held:
    description: "`true` when a read the pause depends on failed, so the pause is unknown; `false` when the pause was read."
    value: ${{ steps.check.outputs.held }}
  admission-open:
    description: "`false` only while new admissions pause (queued work at or over the queued cap on or after `wip.pause-from`, or, whatever `wip.pause-from` says, a search answered `incomplete_results: true` or the base config could not be read, `admission_basis` `config-unreadable`); a failed queued read without that flag leaves `true`. Runs never pause on it."
    value: ${{ steps.check.outputs.admission-open }}
  wip:
    description: "The status as one flat JSON object: countable_lane_prs, held_lane_prs, held_oldest_age_hours, held_over_alarm_count, wip_cap, wip_cap_source and the rest (pr-pipeline README, WIP cap)."
    value: ${{ steps.check.outputs.wip }}

runs:
  using: composite
  steps:
    # setup-pinned-node's script, the sibling action in the same checkout: no
    # GitHub API call, unlike actions/setup-node on a tool-cache miss.
    - name: Set up Node
      shell: bash
      env:
        VERSION_FILE: ${{ inputs.base-path }}/.node-version
      run: bash "$GITHUB_ACTION_PATH/../setup-pinned-node/install-node.sh" "$VERSION_FILE"

    # The cap comes through resolve-config, which needs its dependencies; an
    # install that fails leaves the base config unread, so the run holds and admissions close.
    # A composite step takes no timeout-minutes, so `timeout` bounds the install.
    - name: Count the open lane PRs
      id: check
      shell: bash
      env:
        BASE_PATH: ${{ inputs.base-path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        WIP_READS: ${{ inputs.reads }}
      run: |
        timeout 2m npm ci --ignore-scripts --omit=dev --no-audit --no-fund --prefix "$BASE_PATH/.github/actions/resolve-config" ||
          echo "::warning title=check-wip-cap::resolve-config's dependencies did not install; the base config cannot be read, so the run holds and admissions close"
        node "$GITHUB_ACTION_PATH/check-wip-cap.mjs"
