name: Check the WIP cap
description: >
  Count the lanes App's open pull requests in this repository with one search
  call on the job's own token, and set `capped` to `true` when the count is at
  or over `limits.wip-cap` in the default branch's pr-pipeline.yaml. A count
  that cannot be read sets `false`: the run starts. Run it from the default
  branch checkout, before any slot or lane token.

inputs:
  base-path:
    description: The default-branch checkout that holds this action and the config.
    required: false
    default: .base
  github-token:
    description: A token that can search this repository's pull requests.
    required: false
    default: ${{ github.token }}

outputs:
  capped:
    description: "`true` at or over the cap; `false` under it or when the count cannot be read."
    value: ${{ steps.check.outputs.capped }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.base-path }}/.node-version
        package-manager-cache: false

    # The cap comes through resolve-config, which needs its dependencies; an
    # install that fails leaves the default cap.
    - name: Count the open lane PRs
      id: check
      shell: bash
      env:
        BASE_PATH: ${{ inputs.base-path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        npm ci --ignore-scripts --omit=dev --prefix "$BASE_PATH/.github/actions/resolve-config" ||
          echo "::warning::resolve-config's dependencies did not install; the default WIP cap applies"
        node "$GITHUB_ACTION_PATH/check-wip-cap.mjs"
