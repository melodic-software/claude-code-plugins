name: Select Trusted Text
description: >
  Build a lane's prompt context from a PR (title, body, issue comments,
  reviews, review comments, and the issues it closes with their comments),
  keeping only items whose own author is on the trusted-actor list. Writes a
  TrustedContext JSON file and logs only how many items of each kind it
  dropped. Fails without writing the file when it cannot read everything.

inputs:
  pr-number:
    description: The PR number, normally the trigger gate's `pr-number` output.
    required: true
  repository:
    description: The repository that holds the PR, as owner/name.
    required: false
    default: ${{ github.repository }}
  standards-path:
    description: >
      A melodic-software/standards checkout (download-standards' `path`
      output), checked out before any head code ran. The trusted-actor list
      is read from it only: unset, or without the list,
      the action fails closed.
    required: false
    default: ""
  output-path:
    description: Where to write the TrustedContext JSON file.
    required: true
  reads-path:
    description: >
      The reads pr-verify's resolver handed on (select-trusted-text.mjs
      PR_READS), taken instead of reading the pull request and the first
      pages of its closing references and title renames again. Set, the file
      must hold reads for this pr-number, or the action fails without writing;
      it is deleted either way. Empty reads everything.
    required: false
    default: ""
  head-sha:
    description: >
      The head SHA being judged. With reads-path set, a handed-on pull
      request at any other head fails the action without writing.
    required: false
    default: ""
  github-token:
    description: >
      Token that can read the PR, its comments and reviews, and the issues it
      closes: the lane's App token, or the job's GITHUB_TOKEN for a read
      activity.
    required: true

runs:
  using: composite
  steps:
    - name: Filter the PR text
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        REPOSITORY: ${{ inputs.repository }}
        STANDARDS_DIR: ${{ inputs.standards-path }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        READS_PATH: ${{ inputs.reads-path }}
        HEAD_SHA: ${{ inputs.head-sha }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/select-trusted-text.mjs"
