name: Check Kill Switch
description: >
  Start gate for a CI lane: the org and repository kill switches, then the
  GITHUB_TOKEN budget. Each switch proceeds only on exactly `false`;
  `true@<UTC time>` stops until that time; unset, empty and every other value
  stop. With both switches off, one GET /rate_limit stops the lane while the
  core pool's remaining is under limits.api github-token start-gate of its
  limit; a failed read proceeds. Every stop is proceed=false
  reason=kill-switch, with cause switch, expiry or budget. Always exits 0:
  the model step's `if:` reads the output, so a missing output also keeps the
  lane stopped.

inputs:
  value:
    description: >
      The org kill-switch value, normally `vars.CLAUDE_LANES_DISABLED`. Only
      `false`, or a `true@<UTC time>` already past, lets the lane proceed.
    required: false
    default: ""
  repo-value:
    description: >
      The repository kill-switch value, normally
      `vars.CLAUDE_LANES_REPO_DISABLED`. Only `false`, or a
      `true@<UTC time>` already past, lets the lane proceed.
    required: false
    default: ""
  token:
    description: >
      The token whose GET /rate_limit answer is the budget reading. Defaults
      to the job's GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  budget:
    description: >
      `false` skips the budget read: the gate checks the switches only. Set
      on a gate that runs after a model turn, so a low budget never throws
      that turn's work away; the rate guard's stop-floor is its backstop.
      Any other value reads the budget.
    required: false
    default: "true"

outputs:
  proceed:
    description: "`true` when the lane may proceed, otherwise `false`."
    value: ${{ steps.check.outputs.proceed }}
  reason:
    description: "`ok` or `kill-switch`."
    value: ${{ steps.check.outputs.reason }}
  cause:
    description: "`ok`, or why the lane stopped: `switch`, `expiry` or `budget`."
    value: ${{ steps.check.outputs.cause }}

runs:
  using: composite
  steps:
    - name: Check the kill switch
      id: check
      shell: bash
      env:
        KILL_SWITCH_VALUE: ${{ inputs.value }}
        REPO_KILL_SWITCH_VALUE: ${{ inputs.repo-value }}
        BUDGET_TOKEN: ${{ inputs.token }}
        BUDGET_CHECK: ${{ inputs.budget }}
      run: node "$GITHUB_ACTION_PATH/check-kill-switch.mjs"
