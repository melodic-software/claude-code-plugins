name: Check kill switch
description: >
  Gate a CI lane on the org kill switch. Emits proceed=true only when the
  switch value reads exactly `false`; unset, empty and every other value
  emit proceed=false reason=kill-switch. Always exits 0: the model step's
  `if:` reads the output, so a missing output also keeps the lane stopped.

inputs:
  value:
    description: >
      The kill-switch value, normally `vars.CLAUDE_LANES_DISABLED`. Only the
      exact string `false` lets the lane proceed.
    required: false
    default: ""

outputs:
  proceed:
    description: "`true` when the lane may proceed, otherwise `false`."
    value: ${{ steps.check.outputs.proceed }}
  reason:
    description: "`ok` or `kill-switch`."
    value: ${{ steps.check.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Check the kill switch
      id: check
      shell: bash
      env:
        KILL_SWITCH_VALUE: ${{ inputs.value }}
      run: node "$GITHUB_ACTION_PATH/check-kill-switch.mjs"
