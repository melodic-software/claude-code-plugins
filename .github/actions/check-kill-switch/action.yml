name: Check Kill Switch
description: >
  Gate a CI lane on the org and repository kill switches, and, on a gate
  that starts new work (budget "true"), the GITHUB_TOKEN budget. Each switch
  proceeds only on exactly `false`; unset, empty and every other value stop.
  With budget "true" and both switches off, one GET /rate_limit stops the
  lane while the core pool's remaining is under rate-limits.json's
  github-token start-gate share of its limit, or when the read is refused
  (403, 429, retry-after, remaining 0); any other failed read proceeds. Every
  stop is proceed=false reason=kill-switch, with cause switch or budget.
  Always exits 0: the model step's `if:` reads the output, so a missing
  output also keeps the lane stopped.

inputs:
  value:
    description: >
      The org kill-switch value, normally `vars.CLAUDE_LANES_DISABLED`. Only
      the exact string `false` lets the lane proceed.
    required: false
    default: ""
  repo-value:
    description: >
      The repository kill-switch value, normally
      `vars.CLAUDE_LANES_REPO_DISABLED`. Only the exact string `false` lets
      the lane proceed.
    required: false
    default: ""
  budget:
    description: >
      `true` also reads the GITHUB_TOKEN budget. Set it only on a gate that
      starts new work; a gate that finishes or judges existing work keeps the
      default, switches only, so a low budget never throws that work away.
    required: false
    default: "false"
  token:
    description: >
      The token whose GET /rate_limit answer is the budget reading. Defaults
      to the job's GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}

outputs:
  proceed:
    description: "`true` when the lane may proceed, otherwise `false`."
    value: ${{ steps.check.outputs.proceed }}
  reason:
    description: "`ok` or `kill-switch`."
    value: ${{ steps.check.outputs.reason }}
  cause:
    description: "`ok`, or why the lane stopped: `switch` or `budget`."
    value: ${{ steps.check.outputs.cause }}
  reset:
    description: "On a budget stop, the epoch second the reading's window resets; otherwise empty."
    value: ${{ steps.check.outputs.reset }}

runs:
  using: composite
  steps:
    - name: Check the kill switch
      id: check
      shell: bash
      env:
        KILL_SWITCH_VALUE: ${{ inputs.value }}
        REPO_KILL_SWITCH_VALUE: ${{ inputs.repo-value }}
        BUDGET_CHECK: ${{ inputs.budget }}
        BUDGET_TOKEN: ${{ inputs.token }}
      run: node "$GITHUB_ACTION_PATH/check-kill-switch.mjs"
