name: Collect base activity
description: >
  Copy what an activity runs out of the base checkout before the PR head
  replaces it: a script's whole directory to $RUNNER_TEMP/base-script, or for
  a skill the base plugins/ and .claude-plugin/ to
  $RUNNER_TEMP/base-marketplace, plus the plugins to install, prompt (with its
  changed-paths) and claude_args (with read access to the marketplace copy,
  and for an activity that edits, the write tool set, a scratch directory,
  the web tools when the activity sets web-access, the tidy passes and their
  routing tool when it sets tidy and, when it commits, the instruction to
  commit). An activity edits when its effect is not read, or
  when its applied-by sets patch: it then leaves its change uncommitted for
  the runner to collect as a patch. Contract: docs/conventions/pr-pipeline/pr-run-activity.md, run job
  step 8 and Skill activities.

inputs:
  kind:
    description: "`script` or `skill`, from resolve-config."
    required: true
  script:
    description: The script path, for a script activity.
    required: false
    default: ""
  skill:
    description: "`<plugin>:<skill>`, for a skill activity."
    required: false
    default: ""
  gating:
    description: "`gate` or `advisory`."
    required: false
    default: ""
  effect:
    description: >
      The activity's effect, from resolve-config. Any effect but `read`, or
      `read` with applied-by.patch in the resolved file, gets the write tool
      set below.
    required: true
  can-commit:
    description: >
      `true` when the activity's grant can commit, from resolve-config; the
      skill is then told to commit its edits.
    required: false
    default: "false"
  prepare:
    description: >
      The activity's prepare mode from resolve-config, empty for none. With
      `merge-base` the runner commits the staged merge after the skill, so
      the skill gets neither the commit tool nor the instruction to commit.
      With `review-threads` the skill also gets the review-thread tool, a
      read-only wrapper over the base's feedback-thread.sh that reads the
      thread file the runner wrote to $RUNNER_TEMP/lane-feedback. With
      `dependency-review` the skill gets read access to the context file the
      runner wrote to $RUNNER_TEMP/lane-dependency, made read-only, and must
      end with the verdict JSON schema's structured output. With `ci-context`
      (effect read only) the skill gets Bash, Edit and Write and read access
      to the context file the runner wrote to $RUNNER_TEMP/lane-ci, made
      read-only.
    required: false
    default: ""
  resolved-path:
    description: resolve-config's output file, which holds the activity's args.
    required: true
  issue-number:
    description: >
      An issues lane's issue; the prompt then passes `--issue <number>`
      before the activity's args. Empty for a PR lane.
    required: false
    default: ""
  base-path:
    description: The base-SHA checkout.
    required: false
    default: .base

outputs:
  plugins:
    description: >
      The plugins to install for a skill, one `<plugin>@<marketplace>` per
      line: the skill's own, plus the research plugins under web-access
      and the tidy passes' plugins.
    value: ${{ steps.skill.outputs.plugins }}
  claude-args:
    description: The skill's claude_args after the fixed ones.
    value: ${{ steps.skill.outputs.claude-args }}
  prompt:
    description: The skill's prompt.
    value: ${{ steps.skill.outputs.prompt }}

runs:
  using: composite
  steps:
    - name: Copy the script's base directory
      if: inputs.kind == 'script'
      shell: bash
      env:
        SCRIPT: ${{ inputs.script }}
        SCRIPT_DIR: ${{ runner.temp }}/base-script
        BASE_PATH: ${{ inputs.base-path }}
      run: |
        case "/$SCRIPT/" in
          //* | */../* | *//)
            echo "::error::the script path must be repository-relative"
            exit 1
            ;;
          /*/*/) ;;
          *)
            echo "::error::the script must sit in a subdirectory, not at the repository root"
            exit 1
            ;;
        esac
        mkdir -p "$SCRIPT_DIR"
        cp -R "$BASE_PATH/$(dirname "$SCRIPT")/." "$SCRIPT_DIR/"

    - name: Stage the base marketplace and the skill prompt
      id: skill
      if: inputs.kind == 'skill'
      shell: bash
      env:
        MARKETPLACE: ${{ runner.temp }}/base-marketplace
        DOCS_DIR: ${{ runner.temp }}/lane-docs
        BASE_PATH: ${{ inputs.base-path }}
        RESOLVED: ${{ inputs.resolved-path }}
        SKILL: ${{ inputs.skill }}
        GATING: ${{ inputs.gating }}
        EFFECT: ${{ inputs.effect }}
        CAN_COMMIT: ${{ inputs.can-commit }}
        PREPARE: ${{ inputs.prepare }}
        SCRATCH: ${{ runner.temp }}/lane-scratch
        CHECKS_DIR: ${{ runner.temp }}/lane-checks
        VERIFY_DIR: ${{ runner.temp }}/lane-verify
        FEEDBACK_DIR: ${{ runner.temp }}/lane-feedback
        FEEDBACK_STATE: ${{ runner.temp }}/lane-feedback-state
        DEPENDENCY_DIR: ${{ runner.temp }}/lane-dependency
        CI_DIR: ${{ runner.temp }}/lane-ci
        TIDY_DIR: ${{ runner.temp }}/lane-tidy
        WORKSPACE: ${{ github.workspace }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
      run: |
        fail() {
          echo "::error::$1"
          exit 1
        }
        [[ -z ${ISSUE_NUMBER:-} || $ISSUE_NUMBER =~ ^[1-9][0-9]{0,9}$ ]] || fail "the issue number is malformed"
        subject="a pull request"
        if [ -n "${ISSUE_NUMBER:-}" ]; then
          subject="an issue"
        fi
        mkdir -p "$MARKETPLACE"
        cp -R "$BASE_PATH/plugins" "$BASE_PATH/.claude-plugin" "$MARKETPLACE/"
        marketplace=$(jq -r '.name' "$MARKETPLACE/.claude-plugin/marketplace.json")
        name='^[a-z0-9][a-z0-9-]*$'
        [[ $marketplace =~ $name ]] || fail "the base marketplace name is malformed"
        [[ $SKILL =~ ^[a-z0-9-]+:[a-z0-9-]+$ ]] || fail "the skill must be <plugin>:<skill>"
        case "$PREPARE" in
          "" | merge-base | review-threads) ;;
          dependency-review) [ "$GATING" = advisory ] || fail "dependency-review: the activity must be advisory, since its verdict is the structured output" ;;
          ci-context) [ "$EFFECT" = read ] || fail "ci-context: the activity's effect must be read, since it runs head code" ;;
          *) fail "the activity's prepare mode is not a known mode" ;;
        esac
        # resolve-config already filtered these; a name outside this set
        # could break the prompt (a leading @ reads as a file mention), so it
        # fails red.
        mapfile -t targets < <(jq -r '.selected["changed-paths"] // [] | .[]' "$RESOLVED")
        safe='^[A-Za-z0-9_@+.-]+(/[A-Za-z0-9_@+.-]+)*$'
        for target in "${targets[@]}"; do
          [[ $target =~ $safe && $target != @* && /$target/ != */-* && /$target/ != */./* && /$target/ != */../* ]] ||
            fail "a changed path has a name the prompt cannot carry"
        done
        # The plugin loads from this copy, outside the working directory,
        # where an unlisted read is denied, so the skill could not read its
        # own reference files. A rule path starting `//` is absolute.
        allowed="Skill($SKILL),Read(/$MARKETPLACE/**)"
        plugins="${SKILL%%:*}@$marketplace"
        disallowed=""
        system_prompt=""
        # A read skill that hands on a patch edits like a write skill, but
        # commits nothing: the runner collects its change. ci-context keeps
        # its own tool set.
        edits=$EFFECT
        if [ "$EFFECT" = read ] && [ "$PREPARE" != ci-context ] &&
          jq -e '.selected["applied-by"].patch // empty' "$RESOLVED" >/dev/null; then
          edits=patch
        fi
        case "$edits" in
          read)
            # ci-context: the job holds no write token, so the skill gets the
            # tools to rerun the failing checks and fix them (Bash, Edit,
            # Write), and read access to the context file the runner wrote,
            # which its Edit and Write cannot reach. The runner turns its
            # uncommitted edits into a patch.
            if [ "$PREPARE" = ci-context ]; then
              [[ $CI_DIR =~ ^/[A-Za-z0-9_./-]+$ ]] || fail "the CI context directory has a name a rule cannot carry"
              [ -f "$CI_DIR/context.json" ] || fail "ci-context: the runner wrote no context file"
              chmod -R a-w "$CI_DIR"
              mkdir -p "$SCRATCH"
              allowed="$allowed,Bash,Edit,Write,Agent,Read(/$CI_DIR/**),Edit(/$SCRATCH/**)"
              disallowed="WebFetch,WebSearch,Edit(/$CI_DIR/**),Write(/$CI_DIR/**)"
              system_prompt="You run unattended as a CI lane activity on $subject, and no one can answer a question. Run every step the skill instructions name. Your scratchpad directory is $SCRATCH: put every temporary or state file there. The context file is $CI_DIR/context.json. Leave every fix uncommitted in the working tree: the runner turns it into a patch that a later job pushes."
            fi
            ;;
          patch | mutate-branch | mutate-tracker | publish-artifact | merge)
            # What a write skill needs to do its job unattended: edit files,
            # run subagents, keep state files in a scratch directory (added
            # as a working directory) and commit through the action's signed
            # tool. Bash runs what a rule in this list allows, the read-only
            # commands dontAsk runs anyway, and what an invoked skill's
            # allowed-tools grant for the run (tidy passes deny theirs). The PR
            # is the review step; no tool here limits which files it changes.
            # In merge-base mode the runner commits what the skill staged,
            # so the skill gets no commit tool and no instruction to commit.
            mkdir -p "$SCRATCH"
            allowed="$allowed,Edit,Write,Agent"
            # delete_files carries a rename's old path or a removal to the
            # branch, which commit_files cannot.
            if [ "$PREPARE" != merge-base ] && [ "$edits" != patch ]; then
              allowed="$allowed,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            fi
            allowed="$allowed,Edit(/$SCRATCH/**)"
            system_prompt="You run unattended as a CI lane activity on $subject, and no one can answer a question. Run every step the skill instructions name. Your scratchpad directory is $SCRATCH: put every temporary or state file there."
            if [ "$edits" = patch ]; then
              system_prompt="$system_prompt Leave every change uncommitted in the working tree: the runner turns it into a patch that a later job applies."
            elif [ "$CAN_COMMIT" = true ] && [ "$PREPARE" != merge-base ]; then
              # The slash command never says the edits reach the PR only as
              # commits on CLAUDE_BRANCH. commit_files takes each file's mode
              # from disk, and Write creates a file without the executable bit.
              allowed="$allowed,Bash(chmod +x *)"
              system_prompt="$system_prompt A change to a repository file reaches the branch only as a commit: before you finish, run chmod +x on every new or changed file that starts with #! or ends in .sh, because the commit takes each file's mode from disk, then commit every repository file you changed with the mcp__github_file_ops__commit_files tool, and delete every committed path you renamed or removed with the mcp__github_file_ops__delete_files tool. An uncommitted change is discarded when the run ends."
            fi
            # The web stays off unless the activity sets web-access. On, the
            # skill may search, fetch the listed domains (`any`: every one)
            # and run the research skills, whose plugins are installed too.
            # No sandbox is enabled, so a domain list limits WebFetch alone;
            # a shell command such as curl is not held to it.
            disallowed="WebFetch,WebSearch"
            if [ "$(jq -r '.selected["web-access"].enabled // false' "$RESOLVED")" = true ]; then
              # `any` is tested on its own, so no list entry can stand for it.
              if jq -e '.selected["web-access"].domains == "any"' "$RESOLVED" >/dev/null; then
                allowed="$allowed,WebFetch(domain:*)"
                # The docs skills fetch through fetch-docs.sh and
                # docs-cache.sh. Granted for `any` only: they curl any host,
                # so a domain list keeps them denied. The skill's bare Edit
                # and Write could rewrite a script the rule then runs, so the
                # rules name a read-only copy, denied to Edit and Write below.
                # The prompt puts the cache and the page files in the scratch
                # directory.
                [[ $DOCS_DIR =~ ^/[A-Za-z0-9_./-]+$ ]] || fail "the docs script copy has a name a rule cannot carry"
                mkdir -p "$DOCS_DIR"
                cp "$BASE_PATH"/plugins/discovery/scripts/{fetch-docs.sh,docs-cache.sh,html2md.py} "$DOCS_DIR/"
                chmod -R a-w "$DOCS_DIR"
                # A Bash rule matches the words before its `*` as written, so
                # each script gets a rule for the bare path and one for the
                # double-quoted path the skills' examples use. The guard above
                # keeps quotes and spaces out of the path. `\"` survives the
                # claude_args quoting as a literal quote.
                for script in fetch-docs.sh docs-cache.sh; do
                  allowed="$allowed,Bash(bash $DOCS_DIR/$script *),Bash(bash \\\"$DOCS_DIR/$script\\\" *)"
                done
                system_prompt="$system_prompt Any skill that runs fetch-docs.sh or docs-cache.sh runs this copy, by exactly this path, bare or in double quotes: bash $DOCS_DIR/fetch-docs.sh --cache --cache-dir $SCRATCH/docs-cache --out $SCRATCH/docs-<n> <other arguments>, a new <n> per fetch and no mktemp, and bash $DOCS_DIR/docs-cache.sh --cache-dir $SCRATCH/docs-cache <subcommand> <arguments>. Quote the arguments after the path as the skill shows them."
              else
                domains=$(jq -r '.selected["web-access"].domains
                  | if type == "array" and length > 0 and all(type == "string") then .[]
                    else error("bad") end' "$RESOLVED") ||
                  fail "web-access: domains must be any or a list of host names"
                host='^(\*\.)?([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                while IFS= read -r domain; do
                  [[ $domain =~ $host ]] || fail "web-access: a domain is not a host name"
                  allowed="$allowed,WebFetch(domain:$domain)"
                done <<<"$domains"
                # The docs scripts stay denied here, so /discovery:read-docs
                # cannot run its lookup: the run reads a listed host's page
                # with WebFetch itself.
                web_hosts=$(paste -sd ' ' <<<"$domains")
              fi
              allowed="$allowed,WebSearch,Skill(discovery:read-docs),Skill(discovery:research),Skill(knowledge:docpage-digest),Skill(knowledge:map-corpus)"
              plugins="$plugins"$'\n'"discovery@$marketplace"$'\n'"knowledge@$marketplace"
              disallowed=""
              if [ -d "$DOCS_DIR" ]; then
                disallowed="Edit(/$DOCS_DIR/**),Write(/$DOCS_DIR/**)"
              fi
              if [ -n "${web_hosts:-}" ]; then
                system_prompt="$system_prompt This run may search the web and read pages only on these hosts: $web_hosts. The docs scripts /discovery:read-docs runs are not available in this run, so read a page on one of those hosts with WebFetch, and cite each page you read."
              else
                system_prompt="$system_prompt This run may read web pages: read each external source through /discovery:read-docs, /discovery:research, /knowledge:docpage-digest or /knowledge:map-corpus."
              fi
            fi
            # The activity's checks run from a base copy outside the working
            # directory, which the skill cannot edit, against the checkout,
            # through a wrapper with the flags fixed: the Bash rule allows the
            # wrapper alone, with no arguments. The skill runs checks and
            # self-checks alike; only checks does the runner run again.
            mapfile -t checks < <(jq -r '(.selected.checks // []) + (.selected["self-checks"] // []) | .[]' "$RESOLVED")
            if ((${#checks[@]})); then
              [[ $CHECKS_DIR =~ ^/[A-Za-z0-9_./-]+$ && $WORKSPACE =~ ^/[A-Za-z0-9_./-]+$ ]] ||
                fail "the checks directory or workspace has a name a rule cannot carry"
              shape='^scripts/[A-Za-z0-9_-]+\.sh( --[a-z][a-z-]*)*$'
              for check in "${checks[@]}"; do
                [[ $check =~ $shape ]] || fail "a check must be a scripts/ script with fixed flags"
              done
              mkdir -p "$CHECKS_DIR/bin"
              cp -R "$BASE_PATH/scripts" "$CHECKS_DIR/"
              # check-affected.sh lints with the configs beside its copy, and
              # run-ruff.sh reads its version pin there.
              for config in .shellcheckrc .markdownlint-cli2.jsonc .github/requirements-ci.txt; do
                [ ! -f "$BASE_PATH/$config" ] || { mkdir -p "$CHECKS_DIR/$(dirname "$config")" && cp "$BASE_PATH/$config" "$CHECKS_DIR/$config"; }
              done
              wrappers=""
              for check in "${checks[@]}"; do
                script=${check%% *}
                flags=${check#"$script"}
                wrapper="$CHECKS_DIR/bin/$(basename "$script" .sh)"
                [ ! -e "$wrapper" ] || fail "two checks run the same script"
                # The same environment as a verify-script's wrapper below:
                # no GitHub token, and no system, global, hook or fsmonitor
                # git config.
                {
                  printf '#!/usr/bin/env bash\ncd %q || exit 2\n' "$WORKSPACE"
                  printf '%s\n' \
                    'unset GH_TOKEN GITHUB_TOKEN' \
                    'export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_COUNT=2' \
                    'export GIT_CONFIG_KEY_0=core.fsmonitor GIT_CONFIG_VALUE_0=false GIT_CONFIG_KEY_1=core.hooksPath GIT_CONFIG_VALUE_1=/dev/null'
                  printf 'CHECK_DATA_ROOT=%q exec %q%s\n' "$WORKSPACE" "$CHECKS_DIR/$script" "$flags"
                } >"$wrapper"
                chmod +x "$wrapper"
                allowed="$allowed,Bash($wrapper)"
                wrappers="$wrappers $wrapper"
              done
              # The skill's bare Edit and Write must not reach the copy it runs.
              chmod -R a-w "$CHECKS_DIR"
              disallowed="${disallowed:+$disallowed,}Edit(/$CHECKS_DIR/**),Write(/$CHECKS_DIR/**)"
              system_prompt="$system_prompt Before you report done, run each of these repository checks as written, with no arguments:$wrappers. Fix each failure a check reports in the working tree and run the check again; name any failure you could not fix in your report."
              # The checks read the working tree, so a run that commits runs
              # them first and commits after, or its fixes stay uncommitted.
              if [ "$CAN_COMMIT" = true ] && [ "$PREPARE" != merge-base ]; then
                system_prompt="$system_prompt Run the checks before you commit: run them, fix, run them again, then commit your changes and the fixes."
              fi
            fi
            # The activity's verify-scripts run with any arguments from a
            # read-only base copy of the script's plugin (or of scripts/),
            # so the files a script reads beside itself come along. Each runs
            # through a wrapper that starts in the checkout, refuses an
            # argument naming a path outside it (a script may print what it
            # reads), unsets GH_TOKEN and GITHUB_TOKEN in the script's own
            # environment (an ancestor's /proc/<pid>/environ still holds
            # them), and keeps git from loading system, global or
            # hook and fsmonitor programs.
            mapfile -t verify < <(jq -r '.selected["verify-scripts"] // [] | .[]' "$RESOLVED")
            if ((${#verify[@]})); then
              [[ $VERIFY_DIR =~ ^/[A-Za-z0-9_./-]+$ && $WORKSPACE =~ ^/[A-Za-z0-9_./-]+$ ]] ||
                fail "the verify-scripts copy or workspace has a name a rule cannot carry"
              shape='^(scripts|plugins/[a-z0-9-]+/(skills/[a-z0-9-]+/)?scripts)/[A-Za-z0-9_-]+\.sh$'
              mkdir -p "$VERIFY_DIR/bin"
              commands=""
              for script in "${verify[@]}"; do
                [[ $script =~ $shape ]] || fail "a verify-script must be the exact path of a scripts/ script"
                [ -f "$BASE_PATH/$script" ] || fail "a verify-script is not in the base"
                unit=scripts
                if [[ $script == plugins/* ]]; then
                  rest=${script#plugins/}
                  unit=plugins/${rest%%/*}
                fi
                if [ ! -e "$VERIFY_DIR/$unit" ]; then
                  mkdir -p "$VERIFY_DIR/$(dirname "$unit")"
                  cp -R "$BASE_PATH/$unit" "$VERIFY_DIR/$unit"
                  # chmod does not follow a link, so its target would stay writable.
                  [ -z "$(find "$VERIFY_DIR/$unit" -type l -print -quit)" ] || fail "a verify-script's directory holds a symbolic link"
                fi
                verifier="$VERIFY_DIR/bin/$(basename "$script" .sh)"
                [ ! -e "$verifier" ] || fail "two verify-scripts share a file name"
                {
                  printf '#!/usr/bin/env bash\nworkspace=%q\ncopy=%q\n' "$WORKSPACE" "$VERIFY_DIR/$script"
                  printf '%s\n' \
                    'cd "$workspace" && workspace=$(pwd -P) || exit 2' \
                    'for arg in "$@"; do' \
                    '  for path in "$arg" "${arg#*=}"; do' \
                    '    [ -e "$path" ] || [ -L "$path" ] || continue' \
                    '    real=$(realpath -e -- "$path") || exit 2' \
                    '    case $real in' \
                    '      "$workspace" | "$workspace"/*) ;;' \
                    '      *) echo "refused: $path is outside the checkout" >&2 && exit 2 ;;' \
                    '    esac' \
                    '  done' \
                    'done' \
                    'unset GH_TOKEN GITHUB_TOKEN' \
                    'export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_COUNT=2' \
                    'export GIT_CONFIG_KEY_0=core.fsmonitor GIT_CONFIG_VALUE_0=false GIT_CONFIG_KEY_1=core.hooksPath GIT_CONFIG_VALUE_1=/dev/null'
                  # check-skill.sh runs each skill's scripts/*.test.sh, and
                  # the runner's ~/.claude is read-only, so it gets a fresh,
                  # writable HOME and CLAUDE_CONFIG_DIR.
                  if [ "$script" = plugins/skill-quality/scripts/check-skill.sh ]; then
                    printf '%s\n' \
                      'HOME=$(mktemp -d) && mkdir "$HOME/.claude" || exit 2' \
                      'export HOME CLAUDE_CONFIG_DIR="$HOME/.claude"'
                  fi
                  printf '%s\n' \
                    'bash "$copy" "$@"' \
                    'status=$?' \
                    'echo "exit status: $status" >&2' \
                    'exit "$status"'
                } >"$verifier"
                chmod +x "$verifier"
                allowed="$allowed,Bash($verifier *)"
                commands="$commands $verifier <arguments>;"
              done
              chmod -R a-w "$VERIFY_DIR"
              disallowed="${disallowed:+$disallowed,}Edit(/$VERIFY_DIR/**),Write(/$VERIFY_DIR/**)"
              # A Bash allow rule must match each subcommand of a compound
              # command (https://code.claude.com/docs/en/permissions,
              # "Compound commands"), so under dontAsk a chained, piped or
              # interpreter command is denied; Read, Grep and Glob need no
              # rule in a working directory (same page, "Permission modes").
              system_prompt="$system_prompt To run one of these repository verification scripts, run its wrapper by exactly this path, with the script's own arguments and paths inside the checkout:${commands%;}. Bash runs only the wrappers named in these instructions, each as its own command (a verification wrapper prints the script's exit status): use Read, Grep and Glob to inspect files and Edit or Write to change them, never cd, ;, &&, a pipe or an interpreter one-liner."
              if [ -e "$VERIFY_DIR/bin/git-mv-rm" ]; then
                system_prompt="$system_prompt Rename or delete a file with $VERIFY_DIR/bin/git-mv-rm."
              fi
              if [ -e "$VERIFY_DIR/bin/run-test-file" ]; then
                system_prompt="$system_prompt Run a test file only through $VERIFY_DIR/bin/run-test-file <test file>, with the path from the checkout root: it picks the runner, vitest included, and a compound command such as cd <dir>; <command> is refused."
              fi
            fi
            # tidy: after its checks pass, the skill runs these passes on its
            # own diff when the routing tool says the diff is small and in one
            # area. Exactly the listed skills are allowed and their plugins
            # installed. The tool runs from a read-only base copy with its
            # cutoff and pass list fixed, so the rule takes no arguments.
            # Only a mutate-branch skill tidies (the schema says so too), and
            # a share that rounds to no turn grants nothing.
            if [ "$EFFECT" = mutate-branch ] && jq -e '(.selected.tidy.turns // 0) > 0' "$RESOLVED" >/dev/null; then
              [[ $TIDY_DIR =~ ^/[A-Za-z0-9_./-]+$ && $WORKSPACE =~ ^/[A-Za-z0-9_./-]+$ ]] ||
                fail "the tidy tool directory or workspace has a name a rule cannot carry"
              max=$(jq -r '.selected.tidy["max-changed-lines"]' "$RESOLVED")
              turns=$(jq -r '.selected.tidy.turns' "$RESOLVED")
              [[ $max =~ ^[1-9][0-9]*$ && $turns =~ ^[1-9][0-9]*$ ]] || fail "tidy: the cutoff and the turns must be whole numbers"
              mkdir -p "$TIDY_DIR/bin"
              cp "$BASE_PATH/scripts/tidy-route.sh" "$TIDY_DIR/tidy-route.sh"
              jq -r '.selected.tidy.passes[] | [.files, .skill, (.args // "")] | @tsv' "$RESOLVED" >"$TIDY_DIR/passes.tsv"
              # A bare Skill(name) rule also matches a project skill of that
              # name, which the run can write, so a pass is <plugin>:<skill>.
              pass_shape='^[a-z0-9-]+:[a-z0-9-]+$'
              args_shape='^[A-Za-z0-9 _.=-]*$'
              while IFS=$'\t' read -r files pass pass_args; do
                [[ $files =~ ^(code|markdown)$ && $pass =~ $pass_shape && $pass_args =~ $args_shape ]] || fail "tidy: a pass is malformed"
                allowed="$allowed,Skill($pass)"
                plugins="$plugins"$'\n'"${pass%%:*}@$marketplace"
              done <"$TIDY_DIR/passes.tsv"
              router="$TIDY_DIR/bin/tidy-route"
              {
                printf '#!/usr/bin/env bash\ncd %q || exit 2\n' "$WORKSPACE"
                printf '%s\n' \
                  'unset GH_TOKEN GITHUB_TOKEN' \
                  'export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_COUNT=2' \
                  'export GIT_CONFIG_KEY_0=core.fsmonitor GIT_CONFIG_VALUE_0=false GIT_CONFIG_KEY_1=core.hooksPath GIT_CONFIG_VALUE_1=/dev/null'
                printf 'exec bash %q --max-changed-lines %q --passes %q\n' "$TIDY_DIR/tidy-route.sh" "$max" "$TIDY_DIR/passes.tsv"
              } >"$router"
              chmod +x "$router"
              chmod -R a-w "$TIDY_DIR"
              allowed="$allowed,Bash($router)"
              # Invoking a pass grants its allowed-tools for the rest of the
              # run, and those commands would run beside the GitHub token
              # (code.claude.com/docs/en/skills, "Pre-approve tools for a
              # skill"). A deny wins over any allow (code.claude.com/docs/en/permissions,
              # "Manage permissions"), so the reviewed list beside this action
              # denies each one, git included (its -c options run any command),
              # and /proc, where an ancestor's environ holds the token. A test
              # fails when a pass grants a rule that list neither denies nor allows.
              mapfile -t tidy_deny < <(jq -r '.deny[]' "$BASE_PATH/.github/actions/collect-base-activity/tidy-pass-grants.json")
              ((${#tidy_deny[@]})) || fail "tidy: the reviewed grants list denies nothing"
              disallowed="${disallowed:+$disallowed,}Edit(/$TIDY_DIR/**),Write(/$TIDY_DIR/**)"
              for rule in "${tidy_deny[@]}"; do
                [[ $rule =~ ^[A-Za-z]+\([A-Za-z0-9\ _./*-]+\)$ ]] || fail "tidy: a reviewed deny rule is malformed"
                disallowed="$disallowed,$rule"
              done
              system_prompt="$system_prompt Tidy your own diff before any review step: once the change is committed and the checks pass, run $router with no arguments, as its own command. It prints route: skip with the reason, or route: run and one run: line per tidy pass. On route: run, invoke each run: line's skill as written, with its arguments and files, in that order, and where a pass only reports, fix what it reports on the lines this run changed; then run the checks again, fix what they report and commit. The tidy passes may use at most $turns turns of this run: stop them when those are spent, so the review and the outcome keep theirs. A pass's own scripts are denied in this run and its injected commands do not run, so apply its instructions to the listed files without them. Name each pass and what it changed in your report; a pass that will not load or run is named and skipped, and never holds back the commit or the outcome. Give a tidy skill only the files its run: line lists."
            fi
            # review-threads: the skill reads the runner's thread file, and
            # records its replies to those threads, only through this tool:
            # a base copy behind a wrapper that fixes its environment, which
            # the skill's Edit and Write cannot reach. The tool posts nothing;
            # the runner uploads its replies file for the reply job.
            if [ "$PREPARE" = review-threads ]; then
              [[ $FEEDBACK_DIR =~ ^/[A-Za-z0-9_./-]+$ && $FEEDBACK_STATE =~ ^/[A-Za-z0-9_./-]+$ && $WORKSPACE =~ ^/[A-Za-z0-9_./-]+$ ]] ||
                fail "the review-thread tool directory has a name a rule cannot carry"
              [ -f "$FEEDBACK_DIR/threads.json" ] || fail "review-threads: the runner wrote no thread file"
              mkdir -p "$FEEDBACK_DIR/bin" "$FEEDBACK_STATE"
              cp "$BASE_PATH/plugins/source-control/skills/pull-request/scripts/feedback-thread.sh" "$FEEDBACK_DIR/feedback-thread.sh"
              tool="$FEEDBACK_DIR/bin/feedback-thread"
              printf '#!/usr/bin/env bash\nexport FEEDBACK_THREADS=%q FEEDBACK_LOG=%q FEEDBACK_SCRATCH=%q FEEDBACK_WORKSPACE=%q\nexec bash %q "$@"\n' \
                "$FEEDBACK_DIR/threads.json" "$FEEDBACK_STATE/replies.jsonl" "$SCRATCH" "$WORKSPACE" "$FEEDBACK_DIR/feedback-thread.sh" >"$tool"
              chmod +x "$tool"
              chmod -R a-w "$FEEDBACK_DIR"
              allowed="$allowed,Bash($tool *)"
              disallowed="${disallowed:+$disallowed,}Edit(/$FEEDBACK_DIR/**),Write(/$FEEDBACK_DIR/**),Edit(/$FEEDBACK_STATE/**),Write(/$FEEDBACK_STATE/**)"
              system_prompt="$system_prompt The review-thread tool is $tool: run it by exactly this path as $tool list, $tool check-paths <path>... and $tool record <thread-id> <file>, with each disposition file in $SCRATCH. The tool posts nothing: a later job posts what you record."
            fi
            # dependency-review: the skill reads the runner's context file,
            # which its Edit and Write cannot reach, and returns its verdict
            # as structured output; a later job with no model acts on it.
            if [ "$PREPARE" = dependency-review ]; then
              [[ $DEPENDENCY_DIR =~ ^/[A-Za-z0-9_./-]+$ ]] || fail "the dependency context directory has a name a rule cannot carry"
              [ -f "$DEPENDENCY_DIR/dependency.json" ] || fail "dependency-review: the runner wrote no context file"
              chmod -R a-w "$DEPENDENCY_DIR"
              allowed="$allowed,Read(/$DEPENDENCY_DIR/**)"
              disallowed="${disallowed:+$disallowed,}Edit(/$DEPENDENCY_DIR/**),Write(/$DEPENDENCY_DIR/**)"
              system_prompt="$system_prompt The dependency context file is $DEPENDENCY_DIR/dependency.json. Your verdict is your structured output; a later job acts on it, and you post nothing."
            fi
            # Read-only commands such as cat, echo and diff run with no allow
            # rule in every mode, until a deny rule names them
            # (https://code.claude.com/docs/en/permissions#read-only-commands).
            # A write skill reads files with Read, Grep and Glob, so these
            # deny every command that can print a file or the environment,
            # read-only or a text filter; the Read rule keeps it out of
            # process files.
            disallowed="${disallowed:+$disallowed,}Bash(echo *),Bash(printf *),Bash(cat *),Bash(head *),Bash(tail *),Bash(grep *),Bash(find *),Bash(env *),Bash(printenv *),Bash(strings *),Bash(od *),Bash(xxd *),Bash(diff *),Bash(sed *),Bash(awk *),Bash(sort *),Bash(cut *),Bash(tr *),Bash(base64 *),Bash(nl *),Bash(tac *),Bash(rev *),Bash(uniq *),Bash(fold *),Bash(column *),Bash(jq *),Bash(xargs *),Bash(more *),Bash(less *),Read(//proc/**)"
            ;;
          *) fail "the activity's effect is not a known effect" ;;
        esac
        claude_args="--allowedTools \"$allowed\""
        if [ -n "$disallowed" ]; then
          claude_args="$claude_args --disallowedTools \"$disallowed\""
        fi
        if [ -n "$system_prompt" ]; then
          claude_args="$claude_args --add-dir \"$SCRATCH\" --append-system-prompt \"$system_prompt\""
        fi
        # A gate skill must end with a verdict the next steps can fail on;
        # the action fails its step when no structured output returns.
        case "$GATING" in
          gate)
            schema='{"type":"object","properties":{"verdict":{"enum":["pass","fail"]},"summary":{"type":"string"}},"required":["verdict","summary"],"additionalProperties":false}'
            claude_args="$claude_args --json-schema '$schema'"
            ;;
          advisory) ;;
          *) fail "the activity's gating must be gate or advisory" ;;
        esac
        # The verdict job validates the same shape (apply-dependency-verdict.mjs).
        if [ "$PREPARE" = dependency-review ]; then
          schema='{"type":"object","properties":{"verdict":{"enum":["merge","fix","close","escalate"]},"reasons":{"type":"array","minItems":1,"maxItems":10,"items":{"type":"string","minLength":1,"maxLength":500}},"evidence":{"type":"array","maxItems":20,"items":{"type":"string","minLength":1,"maxLength":300}}},"required":["verdict","reasons","evidence"],"additionalProperties":false}'
          claude_args="$claude_args --json-schema '$schema'"
        fi
        args=$(jq -r '.selected.args // ""' "$RESOLVED")
        command_line="/$SKILL"
        for word in "${ISSUE_NUMBER:+--issue $ISSUE_NUMBER}" "$args" "${targets[@]}"; do
          if [ -n "$word" ]; then
            command_line="$command_line $word"
          fi
        done
        delimiter="prompt_$(openssl rand -hex 16)"
        {
          echo "plugins<<$delimiter"
          # A tidy pass may name the skill's own plugin or a research one.
          printf '%s\n' "$plugins" | awk '!seen[$0]++'
          echo "$delimiter"
          echo "claude-args=$claude_args"
          echo "prompt<<$delimiter"
          printf '%s\n' "$command_line"
          echo "$delimiter"
        } >>"$GITHUB_OUTPUT"
