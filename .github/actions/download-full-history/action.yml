name: Download Full History
description: >
  Deepen a just-checked-out worktree to full history and fetch
  origin/$BASE_REF on pull_request events. A same-repo composite cannot
  be the first step of a job (GitHub has not fetched the tree yet), so
  callers run a pinned actions/checkout first and this action after it.
  It does not write GITHUB_ENV: callers pass BASE_REF from
  github.base_ref, and zizmor flags GITHUB_ENV writes.

inputs:
  fetch-base:
    description: >
      When true (the default, and the safe one), fetch origin/$BASE_REF
      on pull_request events so later steps can resolve that ref with no
      extra fetch of their own.
    required: false
    default: "true"
  filter:
    description: >
      A git partial-clone filter for the deepening fetch, such as
      blob:none: every commit and tree arrives, so merge-base and rev-list
      match a full fetch, and a blob is fetched from origin when first read.
      Diffs read blobs too (rename detection reads the old side), so this
      relies on an anonymous fetch in those later steps, which a public
      repository allows. Empty
      (the default) fetches every blob. Opt in only from a job whose
      historical blob reads are few and fail closed:
      gitleaks in lint-repo reads every blob in its range, and the bump
      checks in check-plugins and check-skills read base blobs and treat a
      failed read as empty, so those keep the full fetch.
    required: false
    default: ""
  token:
    description: >
      Token both fetches send, so GitHub's limit on anonymous git reads from
      shared runner addresses does not refuse them. It reaches git as an
      http.extraheader in GIT_CONFIG_* variables of the step alone, masked,
      and is never written to .git/config. The job token needs contents: read.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Deepen history
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
        FETCH_BASE: ${{ inputs.fetch-base == 'true' && github.event_name == 'pull_request' && github.base_ref || '' }}
        FETCH_TOKEN: ${{ inputs.token }}
      run: |
        header="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
        echo "::add-mask::$header"
        unset FETCH_TOKEN
        export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $header"
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --prune --unshallow --no-tags ${FILTER:+"--filter=$FILTER"}
        fi
        if [ -n "$FETCH_BASE" ]; then
          git fetch --no-tags origin "$FETCH_BASE":"refs/remotes/origin/$FETCH_BASE"
        fi
