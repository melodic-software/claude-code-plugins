  # CI installs both locks in one pip call, so numpy moves in both at once (group-by, in
  # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference).
  - package-ecosystem: pip
    directories:
      - /plugins/animation
      - /plugins/playwright/skills/demo-video
    labels:
      - dependencies
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      numpy:
        group-by: dependency-name
        patterns:
          - "numpy"
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: pip
    directories:
      - /plugins/explainer-video
      - /lib/media-render
    labels:
      - dependencies
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "manim"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      playwright:
        group-by: dependency-name
        patterns:
          - "playwright"
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
