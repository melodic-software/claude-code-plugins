# Dependabot keeps this repo's dependencies current with REVIEWED pull requests — GitHub-native,
# no third-party app and no PAT. It covers full-SHA GitHub Actions, the root locked Node CI
# toolchain, the standards-managed runner-policy dependency root, the hash-locked Python CI
# toolchain, and the miro plugin's bundled Node MCP server. The plugin hooks still use each
# consuming repository's tools; these manifests exist only to make this repository's validation
# reproducible. No auto-merge is configured, so every bump is a PR that runs ci before a human merges.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Only the `dependencies` label (already in the governed taxonomy). This overrides
    # Dependabot's defaults, suppressing the auto-created snake_case `github_actions`
    # ecosystem label — the label every downstream tool ignores anyway (release notes
    # group on `dependencies`; auto-merge, unused here, keys on fetch-metadata outputs).
    labels:
      - dependencies
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # Let a brand-new release settle before proposing it (supply-chain caution); security-advisory
    # updates bypass cooldown and still surface immediately.
    cooldown:
      default-days: 7
      # First-party melodic-software/* actions skip the supply-chain wait so our
      # own ci-workflows fixes propagate without the cooldown delay.
      exclude:
        - "melodic-software/*"
    groups:
      github-actions:
        patterns:
          - "*"
  # Biome and Claude Code are executable CI dependencies locked at the root.
  - package-ecosystem: npm
    directory: /
    labels:
      - dependencies
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The standards-distributed runner policy has its own package manifest and
  # lockfile. Keep this as an independent dependency root so policy parser
  # updates are reviewed and cannot drift behind the materialized component.
  - package-ecosystem: npm
    directory: /.github/standards/runner-policy
    labels:
      - dependencies
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The miro plugin bundles a Node MCP server; its runtime + build dependencies
  # are pinned by plugins/miro/package-lock.json and rebuilt into the committed
  # bundle by CI, so bumps are reviewed here like any other locked manifest.
  - package-ecosystem: npm
    directory: /plugins/miro
    labels:
      - dependencies
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Ruff is a CI-only executable pinned to the Ubuntu x64 wheel and its PyPI
  # digest. Dependabot must update both the version and reviewed hash.
  - package-ecosystem: pip
    directory: /.github
    labels:
      - dependencies
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
