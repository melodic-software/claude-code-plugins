version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    labels:
      - dependencies
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    cooldown:
      default-days: 3
      exclude:
        - "anthropics/claude-code-action"
    groups:
      vendor-actions:
        patterns:
          - actions/*
          - github/*
          - anthropics/*
        update-types: [minor, patch]
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    labels:
      - dependencies
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      exclude:
        - "@anthropic-ai/claude-code"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: npm
