rules:
  # The org Dependabot cooldown floor is 3 days (standards dependabot-policy).
  dependabot-cooldown:
    config:
      days: 3
  unpinned-uses:
    config:
      policies:
        "melodic-software/*": ref-pin
        "actions/*": ref-pin
        "github/*": ref-pin
        "dependabot/*": ref-pin
        "microsoft/*": ref-pin
        "azure/*": ref-pin
        "Azure/*": ref-pin
        "anthropics/*": ref-pin
        "openai/*": ref-pin
        "*": hash-pin
