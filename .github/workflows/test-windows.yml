name: test-windows

# The informational Windows lane, in its own workflow.
#
# WHY IT LEFT ci.yml. It is not in `ci-status.needs` and is not a required
# check, so nothing waits on it — but it is the longest job in the run at 355 to
# 413 s against the required lanes' 330 s, and while it sat in ci.yml it held
# that RUN open. Time-to-green is measured to the run's completion, so an
# advisory lane nobody gates on was setting the number. Out here it holds only
# its own run open, and ci.yml finishes when its required lanes do.
#
# IT IS STILL INFORMATIONAL. Do not add this workflow to any required check and
# do not wire it into `ci-status`. The doctrine that kept it out of the
# aggregate is unchanged and is the reason a JOB-LEVEL gate is legal here: a
# lane the aggregate cannot see costs a skipped informational run rather than a
# false green. Inside the required closure the same condition would let a lane
# report success having run nothing, which both of ci.yml's gates reject.
#
# SCOPE IS DECIDED AT TRIGGER LEVEL. Being outside the required closure is
# also what makes `on.paths` legal here: a workflow a path filter never starts
# leaves no pending required check behind. The `paths` lists below are the
# union of the `shell`, `python` and `powershell` groups of ci.yml's
# change-detection filter table, so a diff that touches none of them (docs
# only, say) starts no run and no Linux resolver job. Keep them in step with
# those three groups. GitHub reads at most the first 300 changed files for a
# `paths` filter, so a larger diff whose matching files fall past that point
# starts no run; accepted for an informational lane.
#
# Draft pull requests run nothing: both jobs gate on the draft flag, and
# `ready_for_review` starts the run when the draft flips. Contract-only events
# (`edited`, `labeled`, `unlabeled`) are not triggers, since this lane reads
# nothing from the pull request body or labels.

on:
  # Present for parity with ci.yml, which takes a dispatch to run its bench
  # lanes. This lane has none; a dispatch here just runs the Windows suites.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/**
      - scripts/**
      - lib/**
      - package.json
      - package-lock.json
      - pyproject.toml
      - uv.lock
      - requirements*.txt
      - .node-version
      - .python-version
      - .shellcheckrc
      - ruff.toml
      - plugins/docs-naming/skills/generate-file-name-gate/**
      - .claude/docs-naming.json
      - "**/*.sh"
      - "**/*.bash"
      - "**/*.py"
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/**
      - scripts/**
      - lib/**
      - package.json
      - package-lock.json
      - pyproject.toml
      - uv.lock
      - requirements*.txt
      - .node-version
      - .python-version
      - .shellcheckrc
      - ruff.toml
      - plugins/docs-naming/skills/generate-file-name-gate/**
      - .claude/docs-naming.json
      - "**/*.sh"
      - "**/*.bash"
      - "**/*.py"
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"

permissions:
  contents: read

# Namespaced by `github.workflow`, which differs from ci.yml's, so the two
# workflows never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # One of the only two jobs on a Windows runner in this repository, and
  # deliberately so; `test-windows-guardrails` below is the other. Every other
  # suite is platform-agnostic bash string logic that a Linux runner
  # exercises identically — `lib/powershell/ps-command.sh`, for instance,
  # carries zero `OSTYPE`/`cygpath`/`uname` branches despite classifying
  # PowerShell commands, so Linux tests it faithfully.
  #
  # Five surfaces are the exception. `lib/hook-utils.sh` carries OSTYPE-gated
  # branches a Linux runner NEVER EXECUTES — case-insensitive path folding for
  # the Windows filesystem, and `cygpath` short-name (8.3) resolution. #2774's
  # disk-hygiene read-only Bash allowlist is NT-specific (MSYS path mapping,
  # .exe basename stripping, ProgramFiles trust roots), which is how an inert
  # Windows allowlist shipped green. And the MSYS-to-Windows emit helper exists
  # for its NT branch: cygpath's answer cannot be faked on Linux, so on a Linux
  # runner those cases report NOT EXERCISED and the suite is green having
  # proved nothing about them. And the gaming plugin's DLSS 5 script is
  # Windows-only by its own header (backslash paths, Authenticode), so its
  # selftest SKIPs on every other OS and ran in no CI before this lane. And
  # the exec-form bash launcher (#3686) resolves a real Git Bash, refuses the
  # System32 WSL relay and spawns bash from node.exe with no shell, none of
  # which a Linux runner does.
  #
  # Keep this job SMALL. Adding a platform-agnostic suite here buys no coverage
  # and pays Windows' process-creation cost (~140ms/spawn vs ~3ms on Linux).
  #
  # The guardrails suites run in `test-windows-guardrails`, not here.
  #
  # HOST-SKIP SUITES (#3683). Three suites probe the host at run time and two
  # print a SKIP line when they cannot pin their cases, so their Windows
  # behaviour is read from this lane's log, not asserted from a Linux run:
  #   markdown-format — four PATH-probed cases print a counted SKIP when cygpath
  #     rewrites a POSIX mktemp path. The symlink-escape case prints an uncounted
  #     SKIP line and an `ok ... SKIPPED` line that counts as PASS.
  #   cloud-bootstrap-plugins — one SKIPPED=1 for the whole suite when an
  #     extensionless node_modules/.bin/claude stub does not run.
  #   audit_skill_visibility — its --installed fixture embeds paths in JSON that
  #     a native Python reads verbatim, so a cygpath probe rewrites them to the
  #     forward-slash form; it prints no SKIP line, and a green step means the
  #     rewritten fixture resolved.
  # They stub markdownlint-cli2 and claude, so no step installs either. The
  # PASS/FAIL/SKIPPED totals in each step's log say whether the probe fired or
  # the cases ran.
  # Pinned, not `windows-latest`: the runner policy forbids the floating
  # `*-latest` labels outright, for the same reason ci.yml's lanes pin
  # ubuntu-24.04 — an image roll must be a reviewed commit, not a silent
  # Tuesday. Free: GitHub Actions is free for public repositories on standard
  # GitHub-hosted runners, Windows included.
  test-windows:
    # Not on a draft; always on push and dispatch, where the flag is absent.
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Run shared lib tests on Windows
        run: bash lib/hook-utils.test.sh
      # GuardTests only, not the full hygiene module: two of its tests fail on
      # windows-2025 and are already green on Linux — the preview case expects
      # ready-for-explicit-approval where Windows returns blocked, and the
      # handoff case compares path strings where 8.3 `RUNNER~1` differs from
      # the long `runneradmin`. The other nine classes gate on the Linux run.
      - name: Run disk-hygiene GuardTests on Windows
        working-directory: plugins/disk-hygiene/skills/clean/scripts
        run: python -m unittest -v test_hygiene.GuardTests
      - name: Test the MSYS-to-Windows emit helper on Windows
        run: bash scripts/emit-windows-path.test.sh
      - name: Test the drive-root litter detector on Windows
        run: bash scripts/check-drive-root-litter.test.sh
      - name: Test the piped early-exit grep gate on Windows
        run: bash scripts/check-pipefail-grep-q.test.sh
      # NTFS is case-insensitive, which is the whole point of running this one
      # here: the rename executor's case-only `git mv` path and its
      # index-not-filesystem existence test cannot be exercised on a
      # case-sensitive runner, so a regression in either would ship green from
      # Linux alone. Named explicitly, like the fixed suites above, rather than
      # discovered.
      - name: Test the file-name rename executor on Windows
        run: bash plugins/docs-naming/skills/realign-file-names/scripts/apply-rename.test.sh
      # The host-skip suites of #3683, named explicitly: each probes the host at
      # run time, so a green step is only evidence once its log shows whether
      # the probe fired or the cases ran.
      - name: Test the markdown-format hook on Windows
        run: bash plugins/markdown-format/hooks/markdown-format.test.sh
      - name: Test cloud-bootstrap plugin accounting on Windows
        run: bash .claude/hooks/cloud-bootstrap-plugins.test.sh
      - name: Test the skill-visibility audit on Windows
        run: bash plugins/harness-ops/skills/audit-skill-visibility/scripts/audit_skill_visibility.test.sh
      # pwsh directly, not the .test.sh wrapper: the wrapper SKIPs with exit 0
      # when pwsh is missing, which would read as green here. The selftest's
      # exit code is its failure count.
      - name: Run the gaming DLSS 5 selftest on Windows
        run: pwsh -NoProfile -NonInteractive -File plugins/gaming/skills/dlss5/scripts/Invoke-Dlss5Mod.ps1 -Verb selftest
      # Pester has no Linux lane. These are the suites affected-tests.sh names
      # and declines: machine-health's own runner, and the kindle-dedrm tests.
      # #3703.
      - name: Install Pester 5.7
        shell: pwsh
        run: |
          $found = Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.7.0' } | Select-Object -First 1
          if (-not $found) {
            Install-Module Pester -MinimumVersion 5.7.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
      - name: Run machine-health Pester suites
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File plugins/machine-health/skills/audit/scripts/run-tests.ps1
      - name: Run kindle-dedrm Pester suites
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'plugins/kindle-dedrm/skills/manage/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      # The probe reads hook frontmatter with PyYAML and exits 2 when the
      # module is missing. requirements-ci.txt also pins a Linux-only zizmor
      # wheel, so this step installs only the PyYAML pin from that file.
      - name: Install the pinned YAML reader
        run: python -m pip install --disable-pip-version-check "pyyaml==$(awk '/^pyyaml==/ { sub(/^pyyaml==/, ""); sub(/[[:space:]\\].*$/, ""); print; exit }' .github/requirements-ci.txt)"
      # Exec form on Windows is a real .exe plus an args array, with no shell.
      # REQUIRE_SPAWN makes a missing node.exe a failure here. A non-Windows
      # run of the same script skips that half and does not clear #90495.
      - name: Probe Windows exec-form args delivery
        env:
          EXEC_FORM_WINDOWS_PROBE_REQUIRE_SPAWN: "1"
        run: bash scripts/check-exec-form-windows-probe.sh
      # The resolver test hands resolveBash a win32 platform and a fake
      # `exists`, so a Linux run already covers its logic; here it runs under
      # the real node.exe. The launcher test is the one that spawns a real Git
      # Bash through node.exe, with stdin, an argument and exit 2 passed
      # through, and reads every hooks.json row for the node exec form.
      - name: Test the exec-form bash launcher resolver on Windows
        run: node --test lib/exec-bash.resolver.test.mjs
      - name: Test the guardrails exec-bash launcher on Windows
        run: bash plugins/guardrails/hooks/exec-bash.test.sh

  # GUARDRAILS (#4527). The guardrails suites whose guards branch on OSTYPE,
  # cygpath or MSYS run here: block-windows-drive-tmp, hardcoded-path-check,
  # block-hook-bypass, secret-pattern-detection, run-guards and
  # coverage-manifest. coverage-manifest has no OSTYPE branch, but the native
  # `jq.exe` on a Windows host writes CRLF after every line, so its family and
  # README lookups miss there and only a Windows run exercises that. Each suite
  # is a step of its own so its log shows its own duration. They are a job of
  # their own because added to `test-windows`'s steps they leave under a minute
  # of margin below its 20-minute timeout. A host-gated case that cannot run
  # must print a counted SKIP line.
  test-windows-guardrails:
    # `test-windows`'s gate, verbatim.
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Test block-windows-drive-tmp on Windows
        run: bash plugins/guardrails/hooks/block-windows-drive-tmp.test.sh
      - name: Test hardcoded-path-check on Windows
        run: bash plugins/guardrails/hooks/hardcoded-path-check.test.sh
      - name: Test block-hook-bypass on Windows
        run: bash plugins/guardrails/hooks/block-hook-bypass.test.sh
      - name: Test secret-pattern-detection on Windows
        run: bash plugins/guardrails/hooks/secret-pattern-detection.test.sh
      - name: Test run-guards on Windows
        run: bash plugins/guardrails/hooks/run-guards.test.sh
      - name: Test coverage-manifest on Windows
        run: bash plugins/guardrails/hooks/coverage-manifest.test.sh
