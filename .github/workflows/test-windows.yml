name: test-windows

# The informational Windows lane, in its own workflow.
#
# WHY IT LEFT ci.yml. It is not in `ci-status.needs` and is not a required
# check, so nothing waits on it — but it is the longest job in the run at 355 to
# 413 s against the required lanes' 330 s, and while it sat in ci.yml it held
# that RUN open. Time-to-green is measured to the run's completion, so an
# advisory lane nobody gates on was setting the number. Out here it holds only
# its own run open, and ci.yml finishes when its required lanes do.
#
# IT IS STILL INFORMATIONAL. Do not add this workflow to any required check and
# do not wire it into `ci-status`. The doctrine that kept it out of the
# aggregate is unchanged and is the reason a JOB-LEVEL gate is legal here: a
# lane the aggregate cannot see costs a skipped informational run rather than a
# false green. Inside the required closure the same condition would let a lane
# report success having run nothing, which both of ci.yml's gates reject.
#
# THE SELECTION DECIDES WHAT RUNS. `scope-windows` runs
# scripts/plan-test-lanes.sh, the planner ci.yml's `scope` runs, over the same
# diff, and a Windows step runs only when the change selects its suite: each
# step's key and the suites that start it are lines of
# scripts/test-windows-plan.txt, and a job runs when one of its steps does. A
# change to this file or to .github/actions/, a schedule run and a dispatch run
# every step. A push diffs against the push before it.
#
# `on.paths` still decides whether a run starts at all, because being outside
# the required closure is also what makes it legal here: a workflow a path
# filter never starts leaves no pending required check behind. The `paths`
# lists below are the union of the `shell`, `python` and `powershell` groups of
# ci.yml's change-detection filter table, so a diff that touches none of them
# (docs only, say) starts no run. Keep them in step with those three groups.
# GitHub reads at most the first 300 changed files for a `paths` filter, so a
# larger diff whose matching files fall past that point starts no run; accepted
# for an informational lane, and the scheduled run covers it.
#
# Draft pull requests run nothing: `scope-windows` gates on the draft flag and
# every other job needs it, and `ready_for_review` starts the run when the
# draft flips. Contract-only events (`edited`, `labeled`, `unlabeled`) are not
# triggers, since this lane reads nothing from the pull request body or labels.
# Nor is `merge_group`: a merge queue waits only on required checks, and this
# lane is not one.

on:
  # Present for parity with ci.yml, which takes a dispatch to run its bench
  # lanes. This lane has none; a dispatch here runs every Windows step.
  workflow_dispatch:
  # Every Windows step, at ci.yml's whole-tree hours: the net for a Windows
  # suite a change reaches through something the selector does not see.
  schedule:
    - cron: '17 9,16 * * *'
  push:
    branches: [main]
    paths:
      - .github/**
      - scripts/**
      - lib/**
      - package.json
      - package-lock.json
      - pyproject.toml
      - uv.lock
      - requirements*.txt
      - .node-version
      - .python-version
      - .shellcheckrc
      - ruff.toml
      - plugins/docs-naming/skills/generate-file-name-gate/**
      - .claude/docs-naming.json
      - "**/*.sh"
      - "**/*.bash"
      - "**/*.py"
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/**
      - scripts/**
      - lib/**
      - package.json
      - package-lock.json
      - pyproject.toml
      - uv.lock
      - requirements*.txt
      - .node-version
      - .python-version
      - .shellcheckrc
      - ruff.toml
      - plugins/docs-naming/skills/generate-file-name-gate/**
      - .claude/docs-naming.json
      - "**/*.sh"
      - "**/*.bash"
      - "**/*.py"
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"

permissions:
  contents: read

# Namespaced by `github.workflow`, which differs from ci.yml's, so the two
# workflows never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Which Windows jobs and steps this change runs, on a Linux runner: the
  # selector takes about 20 s there and several times that under Git Bash.
  scope-windows:
    # Not on a draft; always on push, schedule and dispatch, where the flag is absent.
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      jobs: ${{ steps.plan.outputs.windows_jobs }}
      steps: ${{ steps.plan.outputs.windows_steps }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch base
        uses: ./.github/actions/checkout-with-base # zizmor: ignore[self-repository]
      - name: Plan the Windows steps the change selects
        id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=''
          case "$GITHUB_EVENT_NAME" in
          pull_request) base="origin/$BASE_REF" ;;
          push) git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null && base="$BEFORE" ;;
          *) ;;
          esac
          [ -n "$base" ] || echo "::notice::A $GITHUB_EVENT_NAME run with no usable base runs every Windows step."
          scripts/plan-test-lanes.sh ${base:+--base "$base"} >>"$GITHUB_OUTPUT"

  # Every suite runs on Linux too. A suite is here because a Linux runner cannot
  # exercise part of what it tests:
  #
  # `lib/hook-utils.sh` carries OSTYPE-gated branches a Linux runner NEVER
  # EXECUTES — case-insensitive path folding for the Windows filesystem, and
  # `cygpath` short-name (8.3) resolution. #2774's disk-hygiene read-only Bash
  # allowlist is NT-specific (MSYS path mapping, .exe basename stripping,
  # ProgramFiles trust roots), which is how an inert Windows allowlist shipped
  # green. The MSYS-to-Windows emit helper exists for its NT branch: cygpath's
  # answer cannot be faked on Linux, so on a Linux runner those cases report NOT
  # EXERCISED and the suite is green having proved nothing about them. The
  # gaming plugin's DLSS 5 script is Windows-only by its own header (backslash
  # paths, Authenticode), so its selftest SKIPs on every other OS. And the
  # exec-form bash launcher (#3686) resolves a real Git Bash, refuses the
  # System32 WSL relay and spawns bash from node.exe with no shell, none of which
  # a Linux runner does.
  #
  # GUARDRAILS (#4527). The guardrails suites whose guards branch on OSTYPE,
  # cygpath or MSYS run here too: block-windows-drive-tmp, hardcoded-path-check,
  # block-hook-bypass, secret-pattern-detection, run-guards and
  # coverage-manifest. coverage-manifest has no OSTYPE branch, but the native
  # `jq.exe` on a Windows host writes CRLF after every line, so its family and
  # README lookups miss there and only a Windows run exercises that. A
  # host-gated case that cannot run must print a counted SKIP line.
  #
  # Keep these jobs SMALL. Adding a platform-agnostic suite here buys no
  # coverage and pays Windows' process-creation cost (~140ms/spawn vs ~3ms on
  # Linux). A new step needs a line in scripts/test-windows-plan.txt under its
  # job, keyed as its `if:` is.
  #
  # SIX PARALLEL JOBS (#5830, #5988). Every slow step is a bash suite bound by
  # that spawn cost, so the lane's wall time is its longest job. The rename
  # executor suite, the longest at about 270 s, runs as two shards in two jobs
  # (APPLY_RENAME_TEST_SHARD=1 and 2); each shard prints its group and case
  # counts, and the suite refuses to start when a case group is in neither
  # shard. The suites are spread by measured p50 step time (seconds), each job
  # about 200 s of steps plus about 27 s of checkout and setup:
  #   rename-1  rename shard 1 147, run-guards 59                       = 206
  #   rename-2  rename shard 2 147, Pester + machine-health 36,
  #             pipefail grep 12, drive-root litter 2, emit helper 1     = 198
  #   secrets   secret-pattern-detection 176, GuardTests 18,
  #             skill-visibility 3, coverage-manifest 2                  = 199
  #   guards    block-hook-bypass 138, hardcoded-path-check 63           = 201
  #   hooks     markdown-format 114, cloud-bootstrap 69, PyYAML +
  #             exec-form probe 9, exec-bash launcher 5, resolver 1      = 198
  #   lib       block-windows-drive-tmp 85, hook-utils 84, DLSS 5 22,
  #             Pester + kindle-dedrm 6                                  = 197
  # Each suite is a step of its own so its log shows its own duration. Put a
  # new suite in the job with the smallest total, and keep each install step
  # in the job whose suites need it, gated like the step it serves: Pester
  # before each Pester suite (rename-2, lib), PyYAML before the exec-form probe
  # (hooks). Do not run suites concurrently inside a job: hook-utils and
  # markdown-format assert timing that CPU contention breaks.
  #
  # HOST-SKIP SUITES (#3683). Three suites probe the host at run time and two
  # print a SKIP line when they cannot pin their cases, so their Windows
  # behaviour is read from this lane's log, not asserted from a Linux run:
  #   markdown-format — four PATH-probed cases print a counted SKIP when cygpath
  #     rewrites a POSIX mktemp path. The symlink-escape case prints an uncounted
  #     SKIP line and an `ok ... SKIPPED` line that counts as PASS.
  #   cloud-bootstrap-plugins — one SKIPPED=1 for the whole suite when an
  #     extensionless node_modules/.bin/claude stub does not run.
  #   audit_skill_visibility — its --installed fixture embeds paths in JSON that
  #     a native Python reads verbatim, so a cygpath probe rewrites them to the
  #     forward-slash form; it prints no SKIP line, and a green step means the
  #     rewritten fixture resolved.
  # They stub markdownlint-cli2 and claude, so no step installs either. The
  # PASS/FAIL/SKIPPED totals in each step's log say whether the probe fired or
  # the cases ran.
  # Pinned, not `windows-latest`: the runner policy forbids the floating
  # `*-latest` labels outright, for the same reason ci.yml's lanes pin
  # ubuntu-24.04 — an image roll must be a reviewed commit, not a silent
  # Tuesday. Free: GitHub Actions is free for public repositories on standard
  # GitHub-hosted runners, Windows included.
  test-windows-rename-1:
    needs: [scope-windows]
    if: ${{ contains(fromJSON(needs.scope-windows.outputs.jobs || '[]'), 'test-windows-rename-1') }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      # NTFS is case-insensitive, which is the whole point of running this one
      # here: the rename executor's case-only `git mv` path and its
      # index-not-filesystem existence test cannot be exercised on a
      # case-sensitive runner, so a regression in either would ship green from
      # Linux alone. Shard 2 runs in `test-windows-rename-2`.
      - name: Test the file-name rename executor on Windows (shard 1 of 2)
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/docs-naming/skills/realign-file-names/scripts/apply-rename.test.sh')
        env:
          APPLY_RENAME_TEST_SHARD: "1"
        run: bash plugins/docs-naming/skills/realign-file-names/scripts/apply-rename.test.sh
      - name: Test run-guards on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/guardrails/hooks/run-guards.test.sh')
        run: bash plugins/guardrails/hooks/run-guards.test.sh

  test-windows-rename-2:
    needs: [scope-windows]
    if: ${{ contains(fromJSON(needs.scope-windows.outputs.jobs || '[]'), 'test-windows-rename-2') }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Test the file-name rename executor on Windows (shard 2 of 2)
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/docs-naming/skills/realign-file-names/scripts/apply-rename.test.sh')
        env:
          APPLY_RENAME_TEST_SHARD: "2"
        run: bash plugins/docs-naming/skills/realign-file-names/scripts/apply-rename.test.sh
      - name: Test the piped early-exit grep gate on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'scripts/check-pipefail-grep-q.test.sh')
        run: bash scripts/check-pipefail-grep-q.test.sh
      - name: Test the drive-root litter detector on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'scripts/check-drive-root-litter.test.sh')
        run: bash scripts/check-drive-root-litter.test.sh
      - name: Test the MSYS-to-Windows emit helper on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'scripts/emit-windows-path.test.sh')
        run: bash scripts/emit-windows-path.test.sh
      # Pester has no Linux lane. These are the suites affected-tests.sh names
      # and declines: machine-health's own runner here, and the kindle-dedrm
      # tests in `test-windows-lib`, which installs Pester itself. #3703.
      - name: Install Pester 5.7
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/machine-health/skills/audit/scripts/run-tests.ps1')
        shell: pwsh
        run: |
          $found = Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.7.0' } | Select-Object -First 1
          if (-not $found) {
            Install-Module Pester -MinimumVersion 5.7.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
      - name: Run machine-health Pester suites
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/machine-health/skills/audit/scripts/run-tests.ps1')
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File plugins/machine-health/skills/audit/scripts/run-tests.ps1

  test-windows-secrets:
    needs: [scope-windows]
    if: ${{ contains(fromJSON(needs.scope-windows.outputs.jobs || '[]'), 'test-windows-secrets') }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Test secret-pattern-detection on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/guardrails/hooks/secret-pattern-detection.test.sh')
        run: bash plugins/guardrails/hooks/secret-pattern-detection.test.sh
      - name: Test coverage-manifest on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/guardrails/hooks/coverage-manifest.test.sh')
        run: bash plugins/guardrails/hooks/coverage-manifest.test.sh
      # A host-skip suite of #3683 (see the job comment above).
      - name: Test the skill-visibility audit on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/harness-ops/skills/audit-skill-visibility/scripts/audit_skill_visibility.test.sh')
        run: bash plugins/harness-ops/skills/audit-skill-visibility/scripts/audit_skill_visibility.test.sh
      # GuardTests only, not the full hygiene module: two of its tests fail on
      # windows-2025 and are already green on Linux — the preview case expects
      # ready-for-explicit-approval where Windows returns blocked, and the
      # handoff case compares path strings where 8.3 `RUNNER~1` differs from
      # the long `runneradmin`. The other nine classes gate on the Linux run.
      - name: Run disk-hygiene GuardTests on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/disk-hygiene/skills/clean/scripts/test_hygiene.py')
        working-directory: plugins/disk-hygiene/skills/clean/scripts
        run: python -m unittest -v test_hygiene.GuardTests

  test-windows-guards:
    needs: [scope-windows]
    if: ${{ contains(fromJSON(needs.scope-windows.outputs.jobs || '[]'), 'test-windows-guards') }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Test block-hook-bypass on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/guardrails/hooks/block-hook-bypass.test.sh')
        run: bash plugins/guardrails/hooks/block-hook-bypass.test.sh
      - name: Test hardcoded-path-check on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/guardrails/hooks/hardcoded-path-check.test.sh')
        run: bash plugins/guardrails/hooks/hardcoded-path-check.test.sh

  test-windows-hooks:
    needs: [scope-windows]
    if: ${{ contains(fromJSON(needs.scope-windows.outputs.jobs || '[]'), 'test-windows-hooks') }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      # The host-skip suites of #3683, named explicitly: each probes the host at
      # run time, so a green step is only evidence once its log shows whether
      # the probe fired or the cases ran.
      - name: Test the markdown-format hook on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/markdown-format/hooks/markdown-format.test.sh')
        run: bash plugins/markdown-format/hooks/markdown-format.test.sh
      - name: Test cloud-bootstrap plugin accounting on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), '.claude/hooks/cloud-bootstrap-plugins.test.sh')
        run: bash .claude/hooks/cloud-bootstrap-plugins.test.sh
      # The launcher test spawns a real Git Bash through node.exe, with stdin,
      # an argument and exit 2 passed through, and reads every hooks.json row
      # for the node exec form.
      - name: Test the guardrails exec-bash launcher on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/guardrails/hooks/exec-bash.test.sh')
        run: bash plugins/guardrails/hooks/exec-bash.test.sh
      # The probe reads hook frontmatter with PyYAML and exits 2 when the
      # module is missing. requirements-ci.txt also pins a Linux-only zizmor
      # wheel, so this step installs only the PyYAML pin from that file.
      - name: Install the pinned YAML reader
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'scripts/check-exec-form-windows-probe.sh')
        run: python -m pip install --disable-pip-version-check "pyyaml==$(awk '/^pyyaml==/ { sub(/^pyyaml==/, ""); sub(/[[:space:]\\].*$/, ""); print; exit }' .github/requirements-ci.txt)"
      # Exec form on Windows is a real .exe plus an args array, with no shell.
      # REQUIRE_SPAWN makes a missing node.exe a failure here. A non-Windows
      # run of the same script skips that half and does not clear #90495.
      - name: Probe Windows exec-form args delivery
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'scripts/check-exec-form-windows-probe.sh')
        env:
          EXEC_FORM_WINDOWS_PROBE_REQUIRE_SPAWN: "1"
        run: bash scripts/check-exec-form-windows-probe.sh
      # The resolver test hands resolveBash a win32 platform and a fake
      # `exists`, so a Linux run already covers its logic; here it runs under
      # the real node.exe. The launcher test above is the one that spawns a
      # real Git Bash through node.exe.
      - name: Test the exec-form bash launcher resolver on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'lib/exec-bash.resolver.test.mjs')
        run: node --test lib/exec-bash.resolver.test.mjs

  test-windows-lib:
    needs: [scope-windows]
    if: ${{ contains(fromJSON(needs.scope-windows.outputs.jobs || '[]'), 'test-windows-lib') }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Test block-windows-drive-tmp on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/guardrails/hooks/block-windows-drive-tmp.test.sh')
        run: bash plugins/guardrails/hooks/block-windows-drive-tmp.test.sh
      - name: Run shared lib tests on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'lib/hook-utils.test.sh')
        run: bash lib/hook-utils.test.sh
      # pwsh directly, not the .test.sh wrapper: the wrapper SKIPs with exit 0
      # when pwsh is missing, which would read as green here. The selftest's
      # exit code is its failure count.
      - name: Run the gaming DLSS 5 selftest on Windows
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/gaming/skills/dlss5/scripts/Invoke-Dlss5Mod.ps1')
        run: pwsh -NoProfile -NonInteractive -File plugins/gaming/skills/dlss5/scripts/Invoke-Dlss5Mod.ps1 -Verb selftest
      # `test-windows-rename-2` installs Pester for its own suite; this job runs
      # on a separate runner and installs it again.
      - name: Install Pester 5.7
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/kindle-dedrm/skills/manage/tests')
        shell: pwsh
        run: |
          $found = Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.7.0' } | Select-Object -First 1
          if (-not $found) {
            Install-Module Pester -MinimumVersion 5.7.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
      - name: Run kindle-dedrm Pester suites
        if: contains(fromJSON(needs.scope-windows.outputs.steps), 'plugins/kindle-dedrm/skills/manage/tests')
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'plugins/kindle-dedrm/skills/manage/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
