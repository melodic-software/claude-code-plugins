name: link-check

# Advisory online external-link check (not part of ci-status). Runs weekly and
# on demand; files a rolling tracking issue on failure rather than gating merges.
# Deterministic on-disk link integrity is covered separately by the offline
# lychee check; this lane catches dead external URLs in the docs.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    # This issue-writing advisory lane remains hosted by policy and is paused
    # while strict local-only emergency routing is active.
    if: ${{ vars.CI_RUNNER_POLICY != 'self-hosted-only' }}
    # issues: write is scoped to this job (least privilege) — only the called
    # workflow files the rolling tracking issue.
    permissions:
      contents: read
      issues: write
    uses: melodic-software/ci-workflows/.github/workflows/link-check.yml@c2654182bc2d78f7909795df78304d482aa69226 # 99ac2f8 2026-07-11
    with:
      args: >-
        --cache
        --max-cache-age 7d
        --no-progress
        --accept-timeouts
        --config lychee.toml
        './**/*.md'
