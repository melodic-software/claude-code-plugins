name: claude-security-review

# SYNC-MANAGED FILE: DO NOT EDIT IN THE CONSUMING REPOSITORY.
# Source of truth: melodic-software/standards,
# components/claude-lanes-hosted/claude-security-review.yml (the
# `claude-security-review-hosted-caller` component in
# distribution/sync-manifest.yml).
# Downstream edits are overwritten by the next sync PR; change the component
# upstream, or move the component to `locally-owned` in the manifest to
# customize.
#
# Thin caller for the org's reusable security-review lane (advisory verdict,
# fail-closed execution check). The reusable workflow owns the action pin,
# model, and the secret-handling model; per its header, this caller owns the
# triggers, concurrency, and the GITHUB_TOKEN permission grant.
#
# There is no path gating: every non-draft same-repository PR is
# security-reviewed. A `.github/claude-security-paths` file is no longer read.
#
# NEVER add workflow-level `paths:`/`paths-ignore:` to this caller: a
# required check whose workflow never triggers stays Pending forever and
# wedges every out-of-scope PR.
#
# The reusable skips fork PRs (they receive no secrets and a read-only token)
# and every `[bot]` actor; a required check does NOT prove a fork PR was
# reviewed (see the reusable's header). On a public repository the lane
# reviews only pull requests from branches of this repository: fork and
# Dependabot pull requests get no secrets.
#
# RUNNER PLACEMENT: hosted shape, the sibling of
# components/claude-lanes/claude-security-review.yml, differing from it only
# in these comments and `runner`. It is an interim with the same removal
# trigger as the code-review caller. See that file's header.

on:
  pull_request:
    # `synchronize`, matching the code-review lane: every push is reviewed,
    # including the push that resolves a merge conflict (GitHub runs no
    # pull_request workflow while a PR conflicts with its base). The check
    # stays advisory: github-iac ADR 0011 forbids any organization ruleset
    # from making an agentic review a merge or deployment prerequisite. With
    # the per-PR group below not cancelling, pushes during a review queue at
    # most one pending run per PR (GitHub keeps only the newest pending).
    #
    # NO `merge_group:`: the pinned action cannot serve that event; see
    # melodic-software/ci-workflows#272 before enabling a merge queue.
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

# No top-level concurrency block: the standards `concurrency-policy` component
# requires a `${{ github.workflow }}`-prefixed group and literal
# `cancel-in-progress: true`, which this lane cannot ship. A canceled run of
# a check a ruleset might later read is not a skip and does not read success,
# so canceling an in-flight review can wedge the merge behind a void check.
# Concurrency lives on the `security-review` job below
# (`cancel-in-progress: false`, no queue), which is the shape a
# `delegated-job-level` concurrency-policy exception waives. And NO job-level
# queue group: a full queue CANCELS new arrivals, which is the same wedge; a
# queue is added only if overflow smoke-testing proves otherwise. These are
# per-LANE values, deliberately different from the code-review caller's (which
# cancels superseded runs). Do not normalize the two.

jobs:
  security-review:
    # A draft is work in progress and does not spend a review; the
    # ready_for_review trigger above is what delivers one when it is ready.
    if: github.event.pull_request.draft == false
    permissions:
      contents: read         # checkout + read the diff
      pull-requests: write   # post the security review + tracking comment
      id-token: write        # OIDC, mints the Claude GitHub App token (required
                             # even with an OAuth/API-key credential)
    # Per-PR serialization without cancellation. See the workflow header.
    concurrency:
      group: claude-security-review-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    uses: melodic-software/ci-workflows/.github/workflows/claude-security-review.yml@35880dcbb2f174aac90159e276dc7eddf1bc20b9 # v0.30.1
    with:
      runner: ubuntu-24.04
    # Pass only the one named secret (least privilege) rather than
    # `secrets: inherit`, which would forward every parent secret to the
    # called workflow.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
