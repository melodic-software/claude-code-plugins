name: intake-triage

# Triages each newly opened issue with the org intake-triage lane: a read-only
# Claude run proposes labels and a comment, and a step with no model applies
# only allowlisted labels that exist here, or `needs-human` when the run
# escalates. Advisory: never blocks a merge. See ci-workflows'
# intake-triage.yml for the security model and inputs. The apply-verdict job
# then writes the run's verdict as the lanes App (no model): the work class,
# the Size, Complexity and Uncertainty fields, and `status: ready` or
# `status: needs-decision` (.github/scripts/intake-triage/apply-verdict.mjs),
# and on `status: ready` adds `agent-ready` when the admission rules
# (.github/actions/resolve-config/admission-rules.json) and the issue lane's
# caps allow (.github/scripts/intake-triage/admit.mjs).
#
# workflow_dispatch triages one issue by number: issues a job's GITHUB_TOKEN
# creates (the lane sweep's) start no issues run, and intake-reenter.yml
# sends back an answered needs-decision or needs-info issue. The reusable admits a
# dispatch only from an actor whose id is in allowed-author-ids or
# allowed-bot-sender-ids, and reads the issue from the API.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue-number:
        description: The issue to triage.
        type: string
        required: true

permissions: {}

# No top-level concurrency block: the standards `concurrency-policy` shape for
# one requires `cancel-in-progress: true`, and canceling a triage run mid-way
# could leave a comment without its labels. Per-issue serialization without
# cancellation lives on the job, as in pr-review-security-hosted.yml.

jobs:
  # Skips intake for an issue /work-items:decompose published already
  # triaged; see .github/actions/check-born-triaged. A failed gate leaves
  # skip empty, so intake falls through to the reusable, which turns away
  # every person when human-ids is empty too. The job also resolves the lane's
  # model, turns and effort from the triage-issue route of the default
  # branch's models block; when that fails, claude-args is empty and intake
  # does not run, so it never falls back to the CLI's own model and an
  # unbounded turn budget. A dispatch runs only from main, so the trusted-actor
  # list, the models block and the lane's AGENTS.md come from the default branch.
  born-triaged:
    if: github.event_name == 'issues' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the default branch for the trusted-actor list and models block
      issues: read # read the issue's current body, type and labels
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      # When this run started: apply-verdict acts only on a lane comment
      # written at or after it.
      started-at: ${{ steps.started.outputs.at }}
      # The trusted-actor list's human ids, for the reusable's author gate.
      human-ids: ${{ steps.check.outputs.human-ids }}
      bot-ids: ${{ steps.bots.outputs.ids }}
      # Empty when the profile sets a subagent model, which the reusable
      # cannot apply; the refusal step below shows why.
      claude-args: ${{ steps.models.outputs.settings-json == '' && steps.models.outputs.claude-args || '' }}
    steps:
      - name: Record when this run started
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/check-born-triaged/
            /.github/actions/check-kill-switch/
            /.github/actions/check-trusted-trigger/
            /.github/actions/resolve-config/
            /.github/CODEOWNERS
            /.github/standards/github-actions-conventions/vocabulary.json
            /.github/standards/trusted-actors/
            /.node-version
            /docs/conventions/pr-pipeline.yaml
            /docs/conventions/pr-pipeline/
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      - name: Resolve the triage model
        id: models
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: triage-issue
          output-path: ${{ runner.temp }}/intake-models.json

      - name: Refuse a subagent model
        env:
          SETTINGS_JSON: ${{ steps.models.outputs.settings-json }}
        run: |
          if [ -n "$SETTINGS_JSON" ]; then
            echo "::error::the triage-issue profile sets subagent-model, which intake-triage.yml does not support"
            exit 1
          fi

      - name: Check whether the issue was born triaged
        id: check
        uses: ./.base/.github/actions/check-born-triaged # zizmor: ignore[self-repository]
        with:
          issue-number: ${{ github.event.issue.number || inputs.issue-number }}
          lanes-app-id: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}

      # Bots the reusable admits: github-actions[bot] (41898282), the actor of
      # a dispatch sent with a GITHUB_TOKEN, and the lanes App when its id is
      # set. An issue the GITHUB_TOKEN opens starts no issues run, so listing
      # 41898282 starts runs only for its dispatches. The same list picks the
      # comments the model reads, so any comment a GITHUB_TOKEN posts (other
      # than the lane's own marker comment) reaches the model as trusted text.
      - name: Compose the bot id list
        id: bots
        env:
          LANES_APP_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
        run: |
          ids=41898282
          if printf '%s' "$LANES_APP_ID" | grep -Eq '^[1-9][0-9]*$'; then
            ids="$ids,$LANES_APP_ID"
          fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  # The pinned reusable reads no kill switch, so this caller does. Intake has
  # no lane switch of its own; the org and repository switches fail closed
  # (check-kill-switch), and a failed job leaves proceed empty, which also
  # stops intake.
  kill-switch:
    if: github.event_name == 'issues' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the default branch for the kill-switch action
    outputs:
      proceed: ${{ steps.kill.outputs.proceed }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/check-kill-switch/
            /.node-version
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
        run: |
          echo "::notice::the lanes kill switch stops this triage (reason: ${REASON:-unreadable})"

  # A dispatch asks for triage, so the born-triaged skip applies to an opened
  # issue only: intake-reenter.yml dispatches an answered issue that was born
  # triaged and may still carry a status label.
  intake-triage:
    needs: [born-triaged, kill-switch]
    if: >-
      ${{ !cancelled()
      && needs.kill-switch.outputs.proceed == 'true'
      && (github.event_name == 'workflow_dispatch' || needs.born-triaged.outputs.skip != 'true')
      && needs.born-triaged.outputs.claude-args != '' }}
    permissions:
      contents: read # check out the default branch so the lane can read AGENTS.md
      issues: write  # apply labels and post the triage comment
    concurrency:
      group: intake-triage-${{ github.event.issue.number || inputs.issue-number || github.run_id }}
      cancel-in-progress: false
    uses: melodic-software/ci-workflows/.github/workflows/intake-triage.yml@2fe38c031867900824c164e33a140a335ed9ecf0 # v0.62.0
    with:
      runner: ubuntu-24.04
      role: automations
      claude-args: ${{ needs.born-triaged.outputs.claude-args }}
      issue-number: ${{ inputs.issue-number }}
      allowed-author-ids: ${{ needs.born-triaged.outputs.human-ids }}
      allowed-bot-sender-ids: ${{ needs.born-triaged.outputs.bot-ids }}
      # Re-entry after a recorded decision (intake-reenter.yml). The marker is
      # the first line isDecisionComment in select-trusted-text.mjs matches. An
      # escalated run posts only the reusable's fixed note, so the quote and
      # new questions survive only on a run that does not set needs_human, so
      # allowed-labels lets the run apply `needs-human` as a plain label (the
      # reusable's defaults plus that label).
      allowed-labels: |
        priority: critical
        priority: high
        priority: medium
        priority: low
        status: needs-info
        status: needs-decision
        question
        area: security
        needs-human
      instructions: |
        RUBRIC. Decide the same way every time for the same issue text.
        - Priority, exactly one: `priority: critical` for a red main branch, a security exposure,
          or a lane that is down; `priority: high` for something that blocks the pipeline or queued
          work; `priority: low` for a cosmetic or docs-only change; otherwise `priority: medium`.
        - Type: Bug for a defect in something that exists, Task for a bounded change, Feature for a
          new capability.
        - Work class: the `work-class:` label whose meaning in this repository's conventions fits;
          none when unsure.
        - Size: Small for one focused change in a few files, Medium for several files or one
          subsystem, Large for work that needs splitting.
        - Complexity: Low for a direct edit, Medium for several moving parts, High for subtle
          interactions or concurrency.
        - Uncertainty: Known when the approach is clear from the issue, Knowable when reading or
          asking first would settle it, Unknown when only an experiment would.
        - Flags: intent when the intended outcome is not exact or needs the owner's decision;
          security only for a very-high security risk, the security review's CRITICAL tier: the
          work would expose a credential or secret, bypass a trust boundary, or open an external
          attack surface (other security-related work gets no flag); cost as COST below describes.

        UNRUNNABLE DONE-WHEN. A done-when item an unattended lane run cannot do (a run on a named
        host or OS, a paid eval, a run repeated N times, a measurement over time, or a page on a
        host outside the issue lane's web access) is no reason for needs_human, the intent flag or
        a none class on its own: triage the lane-checkable items as usual, with their work class
        and fields. Admission holds the issue and posts the split itself.

        VERDICT LINES. Begin your comment with these four lines, each at the start of its own line,
        exactly in this form, one value each (the Flags line lists every flag that applies, comma
        separated, or none), before any quote or other text:
        Size: Small|Medium|Large
        Complexity: Low|Medium|High
        Uncertainty: Known|Knowable|Unknown
        Flags: none|intent|security|cost
        A step with no model reads only those four lines and the proposed class, and sets the
        issue's class label, fields and status from them.

        COST. When the work an issue asks for would add or raise a charge that no diff shows (a new
        paid service or subscription, a plan upgrade, or an account, organization or repository
        billing setting such as a paid GitHub feature, Actions retention or a spending limit),
        apply the `needs-human` label and keep needs_human false, so your comment is kept, and add one line to it:
        `Cost: <what bills, where; the owner decision it lacks>`.
        Skip this only when a comment whose first line is exactly `**Decision recorded.**`, by an
        author whose login does not end in `[bot]`, already covers that charge; then name it on the
        Cost line.
        A charge a diff shows (IaC resources or SKUs, runner labels or cron schedules in
        workflows, model, effort or turn flags, new secrets) gets no `cost` flag, no `needs-human`
        and no Cost line: the merge-time cost hold catches it after review.

        RE-ENTRY AFTER A RECORDED DECISION. Apply this section only when a comment's first line is
        exactly `**Decision recorded.**` and whose author login does not end in `[bot]`; the newest
        such comment is the decision. It is the owner's
        answer to the open questions the issue was parked on. Then:

        a. Quote the decision verbatim in your comment: every line as a Markdown quote (`> `), the
           first line included, followed by its link from the comment's `url` field (when that field
           is missing or empty, name it as the decision comment by its author). Never paraphrase,
           summarize or reword it; quote any @mention as written, since the lane breaks mentions itself. The quote does not count toward the 150-word limit, but the whole
           comment must stay under 2800 characters: when the quote would not fit, quote its opening
           lines and end with `> [quote truncated; the full decision is at the link]`.
        b. List the open questions from the issue body and earlier comments, and check each against
           the decision. Treat any assumption, unknown or gap in intent the decision does not settle
           as an open question too.
        c. When one or more stay open, apply `status: needs-decision` and keep needs_human false.
           After the quote, ask each as a numbered new question with a `RECOMMENDED:` answer and its
           basis. Never fill one with a default of your own or treat a recommendation as decided.
        d. When the remaining work needs a person (a host, spend, a trust-boundary call, or an
           attended run), apply the `needs-human` label and keep needs_human false, even when (c)
           also applies, so your comment with the quote and new questions is kept. The decision
           comment stays on the issue for the person who picks it up.
        e. When the decision settles every open question and no person is needed, apply no status
           label, quote the decision, say in one sentence that it settles the open questions, and ask
           nothing again. Triage the rest as usual.
    secrets:
      CLAUDE_API_KEY: ${{ secrets.AUTOMATIONS_CLAUDE_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN }}

  # Writes the triage run's verdict on the issue as the lanes App, so the work
  # lanes count it: the work-class label, the Size, Complexity and Uncertainty
  # issue fields, and `status: ready` or `status: needs-decision`. No model:
  # .github/scripts/intake-triage/apply-verdict.mjs parses the lane comment
  # against closed enums; on `status: ready`, admit.mjs adds agent-ready (or
  # admission-deferred over a cap) when the admission rules hold. It runs only
  # after a triage that ran and applied, and reads only a lane comment written
  # since this run started.
  apply-verdict:
    needs: [born-triaged, intake-triage]
    if: >-
      ${{ !cancelled()
      && needs.intake-triage.result == 'success'
      && needs.intake-triage.outputs.triage-failed != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: intake-apply-verdict-${{ github.event.issue.number || inputs.issue-number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read # check out main
      id-token: write # prove to the token broker which workflow this is
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # The broker mints only for a listed human, or github-actions[bot] on a
      # dispatch (intake-reenter.yml, the triage sweep), and a re-run only for
      # a listed human. Anything else stops here quietly, before the token
      # request: an issue the lanes App or a listed bot opened gets triage but
      # no written verdict.
      - name: Check who started the run
        id: who
        if: steps.kill.outputs.proceed == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_ACTORS_PATH: .base/.github/standards/trusted-actors/trusted-actors.json
        run: node .base/.github/scripts/intake-triage/apply-verdict.mjs --check

      - name: Resolve the config
        id: config
        if: steps.who.outputs.proceed == 'true'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: intake-triage
          activity: apply-verdict
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json

      - name: Report a lane the config turns off
        if: steps.config.outcome == 'success' && steps.config.outputs.applies != 'true'
        env:
          REASON: ${{ steps.config.outputs.skip-reason }}
        run: echo "::notice::apply-verdict does not apply (${REASON:-no reason}); nothing written"

      # Swaps this job's GitHub identity proof for a short-lived lanes App
      # token for this repository only, with the resolved grant (issues:
      # write, contents: read, pull-requests: read).
      - name: Request the lane token
        id: lane-token
        if: steps.config.outcome == 'success' && steps.config.outputs.applies == 'true'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: intake-triage
          activity: apply-verdict
          issue-number: ${{ format('{0}', github.event.issue.number || inputs.issue-number) }}
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}

      # Measures the run's spend on the lane token and on the job's own token:
      # this reading and the one at job end bracket the run. The lanes App's
      # bucket is shared by every job using it, so the lane figure includes
      # their calls. Never fails the job.
      - name: Log the API budget at mint
        if: steps.lane-token.outputs.token != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          phase: start
          tokens: |
            lane ${{ steps.lane-token.outputs.token }}
            github-token ${{ github.token }}

      - name: Write the verdict
        if: steps.lane-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          SCRIPT: ${{ steps.config.outputs.script }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue-number }}
          STARTED_AT: ${{ needs.born-triaged.outputs.started-at }}
          KILL_SWITCH: ${{ steps.kill.outputs.proceed == 'true' && 'proceed' || '' }}
          TRUSTED_ACTORS_PATH: .base/.github/standards/trusted-actors/trusted-actors.json
          BASE_PATH: .base
          RESOLVED_CONFIG: ${{ runner.temp }}/resolved-config.json
        run: node ".base/$SCRIPT"

      - name: Log the API budget at job end
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          phase: end
          tokens: |
            lane ${{ steps.lane-token.outputs.token }}
            github-token ${{ github.token }}

      # The token is cancelled as soon as the job is done; it would otherwise
      # expire within the hour. This never fails the job.
      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: |
          # The header goes through stdin so the token never appears in a
          # process listing.
          status=$(printf 'Authorization: Bearer %s\n' "$GH_TOKEN" |
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X DELETE -H @- \
              -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/installation/token" || true)
          if [ "$status" = 204 ]; then
            echo "the lane token is revoked"
          else
            echo "::warning::the lane token was not revoked (DELETE $status); it expires within the hour"
          fi
