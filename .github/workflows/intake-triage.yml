      # key and kept 7 days for the puller; a failed upload never fails the job.
      - name: Upload the sealed transcript
        if: always() && steps.run.outputs.execution-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@8972ed0d6815585dbbead0532c4ea65b4088375e # v0.81.0
        with:
          gate-path: .base/lib/publish-gate.mjs
