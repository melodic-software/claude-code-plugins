name: maintenance-code-tidying-upkeep

# Code-tidying upkeep. Two things, by event:
#
# On a push to main, detect names the areas the merge changed in the job
# summary. No model, no write, no pull request. The gate derives churn from git
# log, so a lost run here drops no area.
#
# On the daily schedule, and a listed human's dispatch, the batch:
#   gate (no model, no secret) reads the settings, the open tidy pull requests
#     and the sweep records, and picks at most upkeep_max_open minus open areas
#     (.github/scripts/maintenance-code-tidying-upkeep/upkeep.mjs); it enforces
#     a cadence or backstop cron cannot.
#   model runs `/code-tidying:tidy <glob> in-place=commit` per area on a local
#     chore/tidy-adhoc-<slug>-<date> branch, on the automations role's
#     subscription token, with a read-only GITHUB_TOKEN and nothing else. What
#     it leaves is sealed to the scan-carrier key.
#   scan (the key's third holder: main only, no model, no id-token, no write
#     token) opens it, checks each branch stays in its area and off the hold
#     paths, and scans what will be published. It records each area that needed
#     no pull request as a code-tidying-upkeep-sweeps artifact, so a clean area
#     is not picked again until it changes: the job needs no write token for that.
#   push-branches (mutate-branch: contents write) recreates each branch as one
#     lanes App commit, and publish (publish-artifact) opens one pull request per
#     branch, reading the cap again. The broker never grants contents and
#     pull-requests write in one mint, nor merge or actions.
#
# How to stop it: set the organization or repository lanes kill-switch variable
# to anything but "false"; every batch job checks it first and the broker reads
# it live.

on:
  push:
    branches: [main]
  # 05:27 UTC sits clear of the other scheduled runs here.
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:

permissions: {}

# One batch at a time; a detect run never waits behind one.
concurrency:
  group: maintenance-code-tidying-upkeep-${{ github.event_name == 'push' && github.sha || 'batch' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  detect:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # read the pushed range
    steps:
      - name: Check out the pushed commit's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            /.github/actions/setup-pinned-node/
            /.github/scripts/maintenance-code-tidying-upkeep/
            /.node-version
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: ./.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .node-version

      # Trees only: naming the changed paths reads no file content.
      - name: Name the changed areas
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          [[ $BEFORE =~ ^[0-9a-f]{40}$ ]] && git fetch --quiet --no-tags --depth=1 --filter=blob:none origin "$BEFORE" || true
          node .github/scripts/maintenance-code-tidying-upkeep/upkeep.mjs detect --before "$BEFORE" --after "$AFTER"

  gate:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # list and download the sweep records
      contents: read # check out main with history
      pull-requests: read # list the tidy pull requests
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      areas: ${{ steps.gate.outputs.areas }}
      date: ${{ steps.gate.outputs.date }}
      base-sha: ${{ github.sha }}
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      # Full history, no blobs: the gate reads commits back to the oldest sweep.
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .base
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up Node
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
        run: echo "::notice::the lanes kill switch stops this run (reason ${REASON:-unreadable}); nothing read or written"

      # A dispatch, and any re-run, must come from a listed human; the broker
      # checks the same, so this only keeps the model from running for nothing.
      - name: Check who started the run
        id: who
        if: steps.kill.outputs.proceed == 'true' && (github.event_name == 'workflow_dispatch' || github.run_attempt != '1')
        uses: ./.base/.github/actions/check-trusted-trigger # zizmor: ignore[self-repository]
        with:
          denied-actor-ids: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          require-pr: "false"
          require-kind: human

      - name: Pick the areas
        id: gate
        if: >-
          steps.kill.outputs.proceed == 'true'
          && (steps.who.outcome == 'skipped' || steps.who.outputs.proceed == 'true')
        working-directory: .base
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/maintenance-code-tidying-upkeep/upkeep.mjs gate --root "$PWD"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The model, with the subscription token and a read-only GITHUB_TOKEN and
  # nothing else: tidy needs Bash to commit and verify, so this job holds no
  # write token. run-claude-cli runs the CLI with --restricted; the plugin loads
  # from a read-only copy staged from main before the root checkout, and every
  # CLAUDE.md, AGENTS.md, .mcp.json and .claude/ in the checkout is removed from
  # the working tree first.
  model:
    needs: gate
    # The first attempt only: a re-run never runs the model again.
    if: needs.gate.outputs.proceed == 'true' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    cache-mode: read
    permissions:
      contents: read # check out main with history, to branch from it
    # No global or system git config applies to any step: one the model writes
    # during its leg would otherwise reach every later git call.
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    outputs:
      sealed-length: ${{ steps.seal.outputs.sealed-length }}
      sealed-1: ${{ steps.seal.outputs.sealed-1 }}
      sealed-2: ${{ steps.seal.outputs.sealed-2 }}
      sealed-3: ${{ steps.seal.outputs.sealed-3 }}
      sealed-4: ${{ steps.seal.outputs.sealed-4 }}
      sealed-5: ${{ steps.seal.outputs.sealed-5 }}
      sealed-6: ${{ steps.seal.outputs.sealed-6 }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.base-sha }}
          path: .base
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Set up Node
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Resolve the model
        id: models
        if: steps.kill.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: resolve-issue
          base-path: .base
          output-path: ${{ runner.temp }}/upkeep-models.json

      # The plugin and the prompt, written from main before the root checkout
      # replaces .base.
      - name: Stage the plugin and the prompt
        if: steps.models.outcome == 'success'
        env:
          STAGE: ${{ runner.temp }}/upkeep-stage
          AREAS: ${{ needs.gate.outputs.areas }}
          DATE: ${{ needs.gate.outputs.date }}
          BASE_SHA: ${{ needs.gate.outputs.base-sha }}
          PROMPT_FILE: ${{ runner.temp }}/upkeep-prompt.md
        run: |
          mkdir -p "$STAGE/plugins"
          cp -R .base/plugins/code-tidying "$STAGE/plugins/"
          printf '{"mcpServers":{}}\n' >"$STAGE/plugins/code-tidying/.mcp.json"
          [ -z "$(find "$STAGE" -type l -print -quit)" ] || { echo "::error::a staged plugin holds a symbolic link"; exit 1; }
          node .base/.github/scripts/maintenance-code-tidying-upkeep/batch.mjs prompt

      - name: Apply the Claude managed settings
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@2476d5dde8979eab34374150b7e4b0a2b99f4e88 # 2476d5d 2026-10-29

      - name: Isolate the runner
        if: steps.models.outcome == 'success'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: "true"

      # The skill branches from here. Nothing after this step runs from .base.
      - name: Check out main with history
        if: steps.models.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.base-sha }}
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Prepare the working tree
        id: prepare
        if: steps.models.outcome == 'success'
        env:
          STAGE: ${{ runner.temp }}/upkeep-stage
          MODEL: ${{ steps.models.outputs.model }}
        run: |
          [ -n "$MODEL" ] || { echo "::error::the resolve-issue route's model is default, which run-claude-cli cannot pass"; exit 1; }
          git config user.name "maintenance-code-tidying-upkeep"
          git config user.email "maintenance-code-tidying-upkeep@users.noreply.github.com"
          printf '.lane/\n' >>.git/info/exclude
          # Head instruction, settings and server files stay out of the session;
          # skip-worktree keeps their removal out of every commit.
          mapfile -t held < <(git ls-files -- ':(glob)**/CLAUDE.md' ':(glob)**/AGENTS.md' ':(glob)**/.mcp.json' ':(glob)**/.claude/**' CLAUDE.md AGENTS.md .mcp.json)
          if ((${#held[@]})); then
            git update-index --skip-worktree -- "${held[@]}"
            rm -f -- "${held[@]}"
          fi
          mkdir .lane
          cp -R "$STAGE/plugins" .lane/plugins
          chmod -R a-w .lane/plugins

      - name: Sweep the areas
        id: run
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 75
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@2476d5dde8979eab34374150b7e4b0a2b99f4e88 # 2476d5d 2026-10-29
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: maintenance-code-tidying-upkeep
          role: automations
          prompt-file: ${{ runner.temp }}/upkeep-prompt.md
          preamble: You run unattended as the code-tidying upkeep CI lane, and no one can answer a question.
          subscription-token: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: |
            Read
            Grep
            Glob
            Skill
            Edit
            Write
            Bash
            WebFetch
          allowed-tools: |
            Skill
            Edit
            Write
            Bash
            WebFetch(domain:code.claude.com)
            WebFetch(domain:docs.anthropic.com)
            WebFetch(domain:raw.githubusercontent.com)
          disallowed-tools: |
            Bash(git push *)
            Bash(gh *)
            Edit(./.lane/plugins/**)
            Write(./.lane/plugins/**)
            Read(//proc/**)
            WebSearch
            mcp__*
          plugin-dirs: |
            .lane/plugins/code-tidying
          leg-timeout-minutes: "70"

      # The sealer, its key and the transcript uploader come from a fresh
      # checkout of the base after the leg: the model could have written anything
      # under the workspace and RUNNER_TEMP, including this path.
      - name: Clear the trusted checkout path
        if: always() && steps.run.outcome != 'skipped'
        run: rm -rf "${GITHUB_WORKSPACE:?}/.lane-trusted"

      - name: Check out the base for the sealer
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.base-sha }}
          path: .lane-trusted
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Upload the sealed transcript
        if: always() && steps.run.outputs.execution-file != ''
        continue-on-error: true
        uses: ./.lane-trusted/.github/actions/upload-lane-transcript # zizmor: ignore[self-repository]
        with:
          execution-file: ${{ steps.run.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}

      # The plan, and the planned branches as one git bundle from the base,
      # sealed with the sealer from the trusted checkout.
      - name: Seal the plan and the branches
        id: seal
        if: always() && steps.run.outcome != 'skipped'
        env:
          BASE_SHA: ${{ needs.gate.outputs.base-sha }}
          TRUSTED: ${{ github.workspace }}/.lane-trusted
          OUT: ${{ runner.temp }}/upkeep-out
          JOB_ID: model
          MAX_CHUNKS: "6"
        run: |
          rm -rf "$OUT"
          mkdir -p "$OUT"
          plan=.work/upkeep-plan.json
          if [ -f "$plan" ] && [ ! -L "$plan" ]; then
            cp "$plan" "$OUT/plan.json"
          fi
          mapfile -t refs < <(git -c core.fsmonitor=false for-each-ref --format='%(refname)' 'refs/heads/chore/tidy-adhoc-*')
          if ((${#refs[@]})); then
            git -c core.fsmonitor=false bundle create "$OUT/branches.bundle" "^$BASE_SHA" "${refs[@]}" || true
          fi
          PUBLIC_KEY_FILE="$TRUSTED/.github/lane-keys/scan-carrier.pub"
          PAYLOADS=$(printf 'plan.json=%s\nbranches.bundle=%s\n' "$OUT/plan.json" "$OUT/branches.bundle")
          export PUBLIC_KEY_FILE PAYLOADS
          node "$TRUSTED/.github/actions/seal-lane-output/seal.mjs"

      - name: Log the API budget at the end
        if: always() && steps.run.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.lane-trusted/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # Opens the sealed plan and bundle, scans what will be published for
  # credentials, uploads only a clean set, and records the areas that need no
  # pull request. No model, no write token.
  scan:
    needs: [gate, model]
    if: ${{ !cancelled() && needs.model.outputs.sealed-length != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    cache-mode: read
    # The scan-carrier key's third holder (owner decision, 2026-11-03, #12475):
    # main only, no id-token, no write token, read-only cache, no model; the
    # environment admits main only.
    environment: pr-pipeline-scan-carrier
    permissions:
      contents: read # check out main
    outputs:
      clean: ${{ steps.upload.outcome == 'success' }}
      branches: ${{ steps.check.outputs.branches }}
      synthetic: ${{ steps.check.outputs.synthetic }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      plan-sha256: ${{ steps.hash.outputs.plan }}
      bundle-sha256: ${{ steps.hash.outputs.bundle }}
    env:
      API_BUDGET_TOKEN: github-token
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.base-sha }}
          path: .base
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Set up Node
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version

      - name: Read the scan-carrier key id
        id: key
        run: |
          read -r _ id _ <.base/.github/lane-keys/scan-carrier.pub || true
          echo "id=$id" >>"$GITHUB_OUTPUT"

      - name: Open the model job's sealed payloads
        id: open
        uses: ./.base/.github/actions/open-lane-output # zizmor: ignore[self-repository]
        with:
          private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}
          expected-key-ids: ${{ steps.key.outputs.id }}
          job-id: model
          max-bytes: |
            plan.json=262144
            branches.bundle=393216
          directory: ${{ runner.temp }}/scan-in
          sealed-length: ${{ needs.model.outputs.sealed-length }}
          sealed-1: ${{ needs.model.outputs.sealed-1 }}
          sealed-2: ${{ needs.model.outputs.sealed-2 }}
          sealed-3: ${{ needs.model.outputs.sealed-3 }}
          sealed-4: ${{ needs.model.outputs.sealed-4 }}
          sealed-5: ${{ needs.model.outputs.sealed-5 }}
          sealed-6: ${{ needs.model.outputs.sealed-6 }}

      - name: Check the plan and write the diffs
        id: check
        env:
          IN: ${{ runner.temp }}/scan-in
          OUT: ${{ runner.temp }}/scan-out
          RECORD_DIR: ${{ runner.temp }}/scan-record
          AREAS: ${{ needs.gate.outputs.areas }}
          DATE: ${{ needs.gate.outputs.date }}
          BASE_SHA: ${{ needs.gate.outputs.base-sha }}
          REPO_DIR: ${{ github.workspace }}/.base
        run: node .base/.github/scripts/maintenance-code-tidying-upkeep/batch.mjs scan

      - name: Scan the plan for credentials
        id: scan-plan
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/scan-in/plan.json

      - name: Scan the branch diffs for credentials
        id: scan-diffs
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/scan-in/diffs.txt

      - name: Scan the pull request text for credentials
        id: scan-publish
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/scan-in/publish.txt

      # Holds only slugs of areas the gate chose. Its absence means a later run
      # picks those areas again, so a failed upload costs a repeat sweep only.
      - name: Upload the sweep record
        if: steps.check.outputs.recorded != '0' && steps.check.outputs.recorded != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-tidying-upkeep-sweeps
          path: ${{ runner.temp }}/scan-record/sweeps.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error

      - name: Hash the plan and the branches
        id: hash
        if: >-
          steps.scan-plan.outputs.clean == 'true' && steps.scan-diffs.outputs.clean == 'true'
          && steps.scan-publish.outputs.clean == 'true'
        env:
          OUT: ${{ runner.temp }}/scan-out
        run: |
          sum=$(sha256sum <"$OUT/plan.json")
          echo "plan=${sum%% *}" >>"$GITHUB_OUTPUT"
          if [ -f "$OUT/branches.bundle" ]; then
            sum=$(sha256sum <"$OUT/branches.bundle")
            echo "bundle=${sum%% *}" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload the plan and the branches
        id: upload
        if: steps.hash.outcome == 'success' && steps.check.outputs.branches != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-code-tidying-upkeep-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-out/
          retention-days: 1
          if-no-files-found: error

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # mutate-branch: contents write only.
  push-branches:
    needs: [gate, scan]
    if: ${{ !cancelled() && needs.scan.outputs.clean == 'true' && needs.scan.outputs.branches != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    cache-mode: read
    permissions:
      contents: read # check out main
      id-token: write # prove to the token broker which workflow this is
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    outputs:
      skip-reason: ${{ steps.lane-token.outputs.skip-reason }}
      heads: ${{ steps.push.outputs.heads }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.base-sha }}
          path: .base
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Set up Node
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Resolve the config
        id: config
        if: steps.kill.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: maintenance-code-tidying-upkeep
          activity: apply-upkeep-branches
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json

      # Before the mint: the scan job's artifact, by id, and the SHA-256 it
      # recorded for each file. A missing or altered file fails the job.
      - name: Download the plan and the branches
        if: steps.config.outcome == 'success' && steps.config.outputs.applies == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact-id }}
          path: ${{ runner.temp }}/plan

      - name: Check the plan and the branches
        id: verify
        if: steps.config.outcome == 'success' && steps.config.outputs.applies == 'true'
        env:
          DIR: ${{ runner.temp }}/plan
          PLAN_SHA256: ${{ needs.scan.outputs.plan-sha256 }}
          BUNDLE_SHA256: ${{ needs.scan.outputs.bundle-sha256 }}
        run: |
          for pair in "plan.json:$PLAN_SHA256" "branches.bundle:$BUNDLE_SHA256"; do
            file="$DIR/${pair%%:*}" want="${pair#*:}"
            if [ -L "$file" ] || [ ! -f "$file" ] || [ "$(stat -c %s "$file")" -gt 1048576 ]; then
              echo "::error::the plan artifact holds no ${pair%%:*} of at most 1 MiB"
              exit 1
            fi
            sum=$(sha256sum <"$file")
            if ! [[ $want =~ ^[0-9a-f]{64}$ ]] || [ "${sum%% *}" != "$want" ]; then
              echo "::error::${pair%%:*} does not match the SHA-256 the scan job recorded"
              exit 1
            fi
          done

      # A kill switch turned on since the step above is a designed stop.
      - name: Request the lane token
        id: lane-token
        if: steps.verify.outcome == 'success'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: maintenance-code-tidying-upkeep
          activity: apply-upkeep-branches
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}
          kill-switch-ok: true

      - name: Push the branches
        id: push
        if: steps.lane-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          API_BUDGET_TOKEN: lanes-app
          AREAS: ${{ needs.gate.outputs.areas }}
          DATE: ${{ needs.gate.outputs.date }}
          BASE_SHA: ${{ needs.gate.outputs.base-sha }}
          PLAN_FILE: ${{ runner.temp }}/plan/plan.json
          BUNDLE_FILE: ${{ runner.temp }}/plan/branches.bundle
          SYNTHETIC: ${{ needs.scan.outputs.synthetic }}
          REPO_DIR: ${{ github.workspace }}/.base
        run: node .base/.github/scripts/maintenance-code-tidying-upkeep/batch.mjs push

      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: |
          status=$(printf 'Authorization: Bearer %s\n' "$GH_TOKEN" |
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X DELETE -H @- \
              -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/installation/token" || true)
          [ "$status" = 204 ] || echo "::warning::the lane token was not revoked (DELETE $status); it expires within the hour"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: lanes-app github-token

  # publish-artifact: pull-requests write, contents read.
  publish:
    needs: [gate, scan, push-branches]
    if: >-
      ${{ !cancelled() && needs.push-branches.result == 'success'
      && needs.push-branches.outputs.skip-reason == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    cache-mode: read
    permissions:
      contents: read # check out main
      id-token: write # prove to the token broker which workflow this is
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.base-sha }}
          path: .base
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Set up Node
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Resolve the config
        id: config
        if: steps.kill.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: maintenance-code-tidying-upkeep
          activity: publish-upkeep-prs
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json

      - name: Download the plan
        if: steps.config.outcome == 'success' && steps.config.outputs.applies == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact-id }}
          path: ${{ runner.temp }}/plan

      - name: Check the plan
        id: verify
        if: steps.config.outcome == 'success' && steps.config.outputs.applies == 'true'
        env:
          FILE: ${{ runner.temp }}/plan/plan.json
          WANT: ${{ needs.scan.outputs.plan-sha256 }}
        run: |
          if [ -L "$FILE" ] || [ ! -f "$FILE" ] || [ "$(stat -c %s "$FILE")" -gt 1048576 ]; then
            echo "::error::the plan artifact holds no plan.json of at most 1 MiB"
            exit 1
          fi
          sum=$(sha256sum <"$FILE")
          if ! [[ $WANT =~ ^[0-9a-f]{64}$ ]] || [ "${sum%% *}" != "$WANT" ]; then
            echo "::error::plan.json does not match the SHA-256 the scan job recorded"
            exit 1
          fi

      - name: Request the lane token
        id: lane-token
        if: steps.verify.outcome == 'success'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: maintenance-code-tidying-upkeep
          activity: publish-upkeep-prs
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}
          kill-switch-ok: true

      - name: Open the pull requests
        if: steps.lane-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          API_BUDGET_TOKEN: lanes-app
          AREAS: ${{ needs.gate.outputs.areas }}
          DATE: ${{ needs.gate.outputs.date }}
          BASE_SHA: ${{ needs.gate.outputs.base-sha }}
          PLAN_FILE: ${{ runner.temp }}/plan/plan.json
          HEADS: ${{ needs.push-branches.outputs.heads }}
          REPO_DIR: ${{ github.workspace }}/.base
        run: node .base/.github/scripts/maintenance-code-tidying-upkeep/batch.mjs publish

      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: |
          status=$(printf 'Authorization: Bearer %s\n' "$GH_TOKEN" |
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X DELETE -H @- \
              -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/installation/token" || true)
          [ "$status" = 204 ] || echo "::warning::the lane token was not revoked (DELETE $status); it expires within the hour"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: lanes-app github-token
