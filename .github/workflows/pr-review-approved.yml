name: PR Review Approved

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  relay:
    name: Relay
    if: >-
      github.event.review.state == 'approved'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Relay the approval
        run: echo "An approval of the head; pr-dispatch-feedback.yml decides whether ci-status re-runs."
