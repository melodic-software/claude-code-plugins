name: Maintenance Monitor Signals

# The monitoring lane: every hour, reads a fixed set of factory signals, writes
# each signal's state and evidence to the job summary, and keeps at most one
# open incident issue per signal, past thresholds set in pr-pipeline.yaml
# monitor.incidents; GitHub incidents go to the run summary only.
# docs/conventions/pr-pipeline/README.md, "The monitoring lane", lists the
# signals and the rules; the scripts and tests are in
# .github/scripts/maintenance-monitor-signals/.
#
# It runs no model and holds no lanes App token or secret: the job's own
# GITHUB_TOKEN reads runs, jobs, annotations, artifacts, pull requests and issue comments,
# and writes only issues, so its issues come from github-actions[bot] and
# start no workflow. Only the schedule and a manual run with no inputs start
# it, on main. Run, annotation and pull-request text reaches an issue only as
# inert lines inside a text fence, never through a `${{ }}` expression.
#
# How to stop it: set the organization or repository lanes kill-switch
# variable to anything but "false".
#
# :52 sits clear of the other scheduled runs here.

on:
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: maintenance-monitor-signals
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # list runs, jobs and artifacts, download pr-merge-summary, pr-merge-post-merge-report and the last run's monitor-signals-jobs
      checks: read # read check-run annotations
      contents: read # check out main
      issues: write # file and update the lane's own issues
      pull-requests: read # list merged pull requests
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
      npm_config_audit: "false"
      npm_config_fetch_timeout: "60000"
      npm_config_fund: "false"
      # npm's fetch timeout and retries, from the one file that sets them.
      npm_config_globalconfig: ${{ github.workspace }}/.base/.github/npm-fetch.npmrc
    steps:
      - name: Check out the run's main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
        run: echo "::notice::the lanes kill switch stops this run (reason ${REASON:-unreadable}); nothing read or filed"

      # The base config's limits.api, in resolve-config's output shape, for
      # the pacer; a failed read leaves rate-limits.json's defaults.
      - name: Read the pace override from the base config
        if: steps.kill.outputs.proceed == 'true'
        continue-on-error: true
        run: |
          yq -o=json '{"limits": {"api": (.limits.api // {})}}' .base/docs/conventions/pr-pipeline.yaml >"$RUNNER_TEMP/pace-config.json"

      # A schedule tick skips its work while the GITHUB_TOKEN pool's remaining
      # at reset, projected at this window's burn rate, is under limits.api
      # github-token pace (pr-pipeline.yaml over rate-limits.json; 0 is off),
      # on even run numbers only. A paced tick uploads no carry, so the next
      # run reads the newest run that kept one. A hand run, or a read that
      # fails, runs as before (.github/actions/log-api-budget/pace.mjs).
      - name: Pace the tick on the GITHUB_TOKEN burn rate
        id: pace
        if: steps.kill.outputs.proceed == 'true'
        continue-on-error: true
        env:
          RESOLVED_CONFIG: ${{ runner.temp }}/pace-config.json
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: node .base/.github/actions/log-api-budget/pace.mjs

      # The Work status writer (write-status.mjs) reads models.issue-status
      # through resolve-config.mjs, whose packages only the resolve-config
      # action installs; this job does not run it.
      - name: Install resolve-config's packages
        timeout-minutes: 5
        if: steps.kill.outputs.proceed == 'true' && steps.pace.outputs.paced != 'true'
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund --prefix .base/.github/actions/resolve-config

      - name: Read the signals and file their issues
        if: steps.kill.outputs.proceed == 'true' && steps.pace.outputs.paced != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CALL_BUDGET: "250"
          WINDOW_MINUTES: "65"
          JOBS_CARRY_PATH: ${{ runner.temp }}/monitor-jobs/jobs.json
        run: |
          mkdir -p "$RUNNER_TEMP/monitor-jobs"
          AGENT_IDENTITY=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          export AGENT_IDENTITY
          node .base/.github/scripts/maintenance-monitor-signals/monitor.mjs

      # Completed runs' job reads and the signals' timers, which the next run
      # reads (collect.mjs JOBS_ARTIFACT). A missing upload costs the next run
      # a full read and restarts the timers, so an incident opens later.
      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          ${{ !cancelled() && steps.kill.outputs.proceed == 'true' && steps.pace.outputs.paced != 'true' }}
        # A hit withholds only the carry: the next run reads every run's jobs.
        continue-on-error: true
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/monitor-jobs/jobs.json

      - name: Carry the job reads
        if: >-
          (!cancelled() && steps.kill.outputs.proceed == 'true') && steps.scan-upload.outputs.clean == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monitor-signals-jobs
          path: ${{ runner.temp }}/monitor-jobs/jobs.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token
