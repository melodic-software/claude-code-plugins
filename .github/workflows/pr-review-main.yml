          execution-file: ${{ steps.review-1.outputs.execution-file }}
          log-file: ${{ steps.review-1.outputs.log-file }}
          lane: pr-review-main
          lane-id: pr-review-main-${{ matrix.lane }}
          step-started-at: ${{ steps.prompt.outputs.started-at }}
          step-timeout-minutes: 22
          credential: ${{ steps.review-1.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.review-1.outputs.lane-class }}
          # Why this leg ran, for the lane's one record.
          fallback-reason: ${{ matrix.reason == 'credit-stop' && 'credit-stop' || matrix.reason == 'auth' && 'auth' || matrix.reason == 'limit-stop' && 'limit-stop' || matrix.reason == 'no-key' && 'no-key' || '' }}

      - name: Upload chunk 1's sealed transcript
        if: always() && steps.review-1.outputs.execution-file != ''
        continue-on-error: true
        uses: ./.base/.github/actions/upload-lane-transcript # zizmor: ignore[self-repository]
        with:
          execution-file: ${{ steps.review-1.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}-${{ matrix.lane }}

      - name: Time chunk 2
