    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.route.outputs.matrix }}
    steps:
      - name: Route the handed-off lanes
        id: route
        env:
          CODE: ${{ needs.review-subscription.outputs.claude-review }}
          SECURITY: ${{ needs.review-subscription.outputs.claude-security-review }}
          CODE_BASE: ${{ needs.review-subscription.outputs.claude-review-base-sha }}
          SECURITY_BASE: ${{ needs.review-subscription.outputs.claude-security-review-base-sha }}
          REASONS: limit-stop credit-stop auth no-key
        run: |
          matrix=$(jq -cn --arg code "$CODE" --arg security "$SECURITY" --arg code_base "$CODE_BASE" --arg security_base "$SECURITY_BASE" --arg reasons "$REASONS" '
            ($reasons | split(" ")) as $ok
            | [{lane: "claude-review", skill: "code-review", route: "review-code", switch: "CLAUDE_REVIEW_DISABLED", reason: $code, base: $code_base},
               {lane: "claude-security-review", skill: "security-review", route: "review-security", switch: "CLAUDE_SECURITY_REVIEW_DISABLED", reason: $security, base: $security_base}]
            | map(select(.reason != ""))
            | if all(.[]; .reason as $r | any($ok[]; . == $r)) then . else error("a handoff reason is not one this leg hands on with") end
