  # The lanes the subscription leg handed on, as review-fallback's matrix.
  subscription-handoffs:
    needs: review-subscription
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && (needs.review-subscription.outputs.claude-review != '' || needs.review-subscription.outputs.claude-security-review != '')
