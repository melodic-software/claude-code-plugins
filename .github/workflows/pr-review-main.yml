name: pr-review-main

# Both AI review lanes, again, from the default branch, for a pull request
# that changes a lane source (babysit_review_evidence.lane_source): a
# workflow, Claude Code configuration or the review criteria. The
# pull_request review lanes run the head's copy of their callers and post as
# github-actions[bot], so a head can rewrite or forge their result; the merge
# gate binds such a pull request's review only on this run's verdict
# (babysit_review_evidence `_main_bound`), never on a comment.
#
# workflow_run runs this file from main, never a head's copy. No pull request
# code runs here: the diff, the trusted pull request text and the lane's
# criteria (copied from main) are data files in pr-review-main-data, and the
# model reads them with the Read tool alone. Each lane uploads its verdict as
# the artifact pr-review-main-<lane>-<pr>-<tree> (write-verdict.mjs); only a
# run's own steps can upload its artifacts, so the gate authenticates the
# name through this run's record (path, workflow_run event, main, completed
# success). The job tokens can only read and nothing is posted.
#
# One leg per lane, on the reviews role's API key. A run that leaves no
# verdict (a handoff, a kill switch, a failure) leaves the lane unbound, as
# it was before this workflow, and the next push reviews again.
#
# Every local action runs from the main checkout at ./.base. zizmor's
# self-repository advice (`$/...`) is ignored on those lines, as in
# pr-verify.yml.

on:
  # workflow_run runs this file from the default branch, never a PR's copy.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [pr-require-checks]
    types: [completed]
    # Only a pull_request run is reviewed, so a merge-queue or main run would
    # only start a run that skips.
    branches-ignore: [main, 'gh-readonly-queue/**']

permissions: {}

# One review per PR and head at a time, never cancelled once running: a
# later run for the same head queues behind it.
concurrency:
  group: pr-review-main-${{ github.event.workflow_run.pull_requests[0].number || 'none' }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  review:
    if: >-
      github.ref == 'refs/heads/main'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: claude-review
            skill: code-review
            route: review-code
            switch: CLAUDE_REVIEW_DISABLED
          - lane: claude-security-review
            skill: security-review
            route: review-security
            switch: CLAUDE_SECURITY_REVIEW_DISABLED
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out main; read the PR's commits for the diff
      pull-requests: read # the PR, its files, comments and reviews
      actions: read # the upstream run the trigger gate reads
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Report the kill switch
        id: switch
        env:
          PROCEED: ${{ steps.kill.outputs.proceed }}
          REASON: ${{ steps.kill.outputs.reason }}
          LANE_SWITCH: ${{ vars[matrix.switch] }}
        run: |
          if [ "$PROCEED" = true ] && [ "$LANE_SWITCH" != true ]; then
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::a kill switch stops this review (lanes: ${REASON:-unreadable}, lane: ${LANE_SWITCH:-unset}); no verdict, so the lane stays unbound"
          fi

      # The upstream run's actors, the re-runner and the PR author must all be
      # on the trusted-actor list.
      - name: Check the trigger
        id: gate
        if: steps.switch.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/check-trusted-trigger # zizmor: ignore[self-repository]
        with:
          trusted-actors-path: .base/.github/standards/trusted-actors/trusted-actors.json
          triggering-actor: ${{ github.triggering_actor }}
          reconciler-workflow: .github/workflows/maintenance-reconcile-lost-runs.yml
          ci-status-rerun-workflow: .github/workflows/pr-feedback-dispatch.yml

      # Only a pull request that changes a lane source is reviewed here; the
      # predicate is the merge gate's own, read from main.
      - name: Select a lane-source pull request
        id: select
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr-number }}
          FILES: ${{ runner.temp }}/pr-review-main-files.txt
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' >"$FILES"
          review=$(python3 -I -c '
          import sys
          sys.path.insert(0, ".base/plugins/source-control/skills/babysit-prs/scripts")
          import babysit_review_evidence as ev
          paths = [line.rstrip("\n") for line in open(sys.argv[1], encoding="utf-8")]
          # The files API lists at most 3000; a longer list may hide one.
          print("true" if len(paths) >= 3000 or any(ev.lane_source(p) for p in paths) else "false")
          ' "$FILES")
          echo "review=$review" >>"$GITHUB_OUTPUT"
          echo "lane source changed: $review"

      # A blobless fetch of the two commits into its own repository outside
      # the workspace. git diff reads no attributes or diff drivers from it,
      # so nothing in the PR runs; the patch is a data file. The tree the
      # verdict is keyed on comes from git, never from the model.
      - name: Write the diff
        id: diff
        if: steps.select.outputs.review == 'true'
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          BASE_SHA: ${{ steps.gate.outputs.base-sha }}
          PR_NUMBER: ${{ steps.gate.outputs.pr-number }}
          DATA: ${{ github.workspace }}/pr-review-main-data
          SRC: ${{ runner.temp }}/pr-review-main-src
        run: |
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          mkdir -p "$DATA"
          git init -q "$SRC"
          git -C "$SRC" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$SRC" fetch -q --no-tags --filter=blob:none origin "$BASE_SHA" "$HEAD_SHA"
          git -C "$SRC" diff --no-ext-diff --no-textconv --no-color "$BASE_SHA...$HEAD_SHA" >"$DATA/diff.patch"
          tree=$(git -C "$SRC" rev-parse --verify "$HEAD_SHA^{tree}")
          jq -n --argjson pr "$PR_NUMBER" --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg tree "$tree" \
            '{pr: $pr, head_sha: $head, base_sha: $base, tree: $tree}' >"$DATA/pr.json"
          echo "tree=$tree" >>"$GITHUB_OUTPUT"
          echo "diff: $(wc -l <"$DATA/diff.patch") lines"

      - name: Select the trusted PR text
        if: steps.diff.outcome == 'success'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/select-trusted-text # zizmor: ignore[self-repository]
        with:
          pr-number: ${{ steps.gate.outputs.pr-number }}
          trusted-actors-path: .base/.github/standards/trusted-actors/trusted-actors.json
          output-path: ${{ github.workspace }}/pr-review-main-data/context.json
          github-token: ${{ github.token }}

      # The lane's criteria and the repository's standards, from main.
      - name: Copy the review criteria
        if: steps.diff.outcome == 'success'
        env:
          SKILL: ${{ matrix.skill }}
          DATA: ${{ github.workspace }}/pr-review-main-data
        run: |
          mkdir -p "$DATA/criteria" "$DATA/standards"
          cp .base/plugins/review/skills/"$SKILL"/SKILL.md "$DATA/criteria/"
          if [ -d .base/plugins/review/skills/"$SKILL"/reference ]; then
            cp -R .base/plugins/review/skills/"$SKILL"/reference "$DATA/criteria/"
          fi
          cp .base/REVIEW.md "$DATA/standards/"
          cp -R .base/docs/standards "$DATA/standards/standards"

      - name: Resolve the review's model
        id: models
        if: steps.diff.outcome == 'success'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: ${{ matrix.route }}
          output-path: ${{ runner.temp }}/pr-review-main-models.json

      # Only whether the secret is set leaves this step, never its value.
      - name: Check the credential
        id: credential
        if: steps.diff.outcome == 'success'
        env:
          PRESENT: ${{ secrets.REVIEWS_CLAUDE_API_KEY != '' }}
        run: |
          if [ "$PRESENT" = true ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::REVIEWS_CLAUDE_API_KEY is empty; no main-run review, so the lane stays unbound."
          fi

      # run-claude-cli refuses to run without these root-owned settings, which
      # need sudo, so they are written before the runner is isolated.
      - name: Apply the Claude managed settings
        if: steps.credential.outputs.present == 'true'
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@81a603a6e2b0319428c981bf28f3fe923032afb2 # v0.65.17

      - name: Isolate the runner
        if: steps.credential.outputs.present == 'true'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: true

      # Files, not step outputs: run-claude-cli reads both.
      - name: Write the prompt and schema
        id: prompt
        if: steps.credential.outputs.present == 'true'
        env:
          DATA: ${{ github.workspace }}/pr-review-main-data
          LANE: ${{ matrix.lane }}
          MODEL: ${{ steps.models.outputs.model }}
          PROMPT_FILE: ${{ runner.temp }}/pr-review-main-prompt.md
          SCHEMA_FILE: ${{ runner.temp }}/pr-review-main-schema.json
        run: |
          if [ -z "$MODEL" ]; then
            echo "::error::the review profile's model is default, which run-claude-cli cannot pass; name an alias"
            exit 1
          fi
          prompt=$(<.base/.github/scripts/pr-review-main/prompt.md)
          prompt=${prompt//LANE_NAME/$LANE}
          prompt=${prompt//CRITERIA_DIR/$DATA/criteria}
          prompt=${prompt//STANDARDS_DIR/$DATA/standards}
          prompt=${prompt//DIFF_FILE/$DATA/diff.patch}
          prompt=${prompt//CONTEXT_FILE/$DATA/context.json}
          prompt=${prompt//PR_FILE/$DATA/pr.json}
          printf '%s\n' "$prompt" >"$PROMPT_FILE"
          printf '%s\n' '{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"enum":["CRITICAL","IMPORTANT","SUGGESTION"]},"path":{"type":"string"},"line":{"type":"integer","minimum":0},"title":{"type":"string"},"body":{"type":"string"}},"required":["severity","path","line","title","body"],"additionalProperties":false}},"summary":{"type":"string"}},"required":["findings","summary"],"additionalProperties":false}' >"$SCHEMA_FILE"

      # Under dontAsk only the allow rule's directory is readable; the deny
      # rules hold if the tools or the working directory change. The model
      # may share its job with the upload: it has Read alone and the job
      # token can only read.
      - name: Review the pull request
        id: review
        if: steps.prompt.outcome == 'success'
        timeout-minutes: 22
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@81a603a6e2b0319428c981bf28f3fe923032afb2 # v0.65.17
        env:
          # No work may outlive the result message the launcher reads.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: pr-review-main
          role: reviews
          prompt-file: ${{ runner.temp }}/pr-review-main-prompt.md
          preamble: >-
            You run unattended; return only the findings the schema asks for;
            nothing you write is posted.
          api-key: ${{ secrets.REVIEWS_CLAUDE_API_KEY }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./pr-review-main-data/**)
          disallowed-tools: |
            Read(./.base/**)
            Glob
            Grep
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            mcp__*
          json-schema-file: ${{ runner.temp }}/pr-review-main-schema.json
          leg-timeout-minutes: "15"

      # The structured output is untrusted model text: read from the file and
      # checked by the script, never interpolated into a command.
      - name: Write the verdict
        id: verdict
        if: steps.review.outcome == 'success' && steps.review.outputs.handoff != 'true'
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution-file }}
          LANE: ${{ matrix.lane }}
          PR_NUMBER: ${{ steps.gate.outputs.pr-number }}
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          BASE_SHA: ${{ steps.gate.outputs.base-sha }}
          TREE_SHA: ${{ steps.diff.outputs.tree }}
          VERDICT_DIR: ${{ runner.temp }}/pr-review-main-verdict
        run: node .base/.github/scripts/pr-review-main/write-verdict.mjs

      - name: Upload the verdict
        if: steps.verdict.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.verdict.outputs.name }}
          path: ${{ runner.temp }}/pr-review-main-verdict/verdict.json
          retention-days: 30
          if-no-files-found: error

      - name: Summarize the verdict
        if: steps.verdict.outcome == 'success'
        env:
          VERDICT_FILE: ${{ runner.temp }}/pr-review-main-verdict/verdict.json
          LANE: ${{ matrix.lane }}
        run: |
          {
            echo "### $LANE, reviewed from main"
            echo
            echo '```json'
            jq '{findings, critical, summary: (.summary | gsub("`"; "'"'"'")), items: (.items | map(.title |= gsub("`"; "'"'"'") | .body |= gsub("`"; "'"'"'")))}' "$VERDICT_FILE"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Log the API budget
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

      # A reviewed pull request that left no verdict fails here, so the run
      # shows it; the lane stays unbound either way.
      - name: Fail without a verdict
        if: always() && steps.diff.outcome == 'success' && steps.credential.outputs.present == 'true' && steps.verdict.outcome != 'success'
        run: |
          echo "::error::the review left no verdict for this head"
          exit 1
