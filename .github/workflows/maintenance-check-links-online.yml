name: maintenance-check-links-online

# Online link check: runs lychee with the network on over every Markdown file,
# with the same synced lychee.toml and fixture excludes the offline lane in
# pr-require-checks.yml uses, plus this repository's .lycheeignore. The report
# goes to the job summary and any broken link fails the job red. Informational:
# not behind `ci-status`, so nothing here can block a merge. It holds only the
# read-only GITHUB_TOKEN, used to lift the github.com rate limit; that token
# cannot read another private repository, so lychee never reports a link into
# one as OK. It never opens an issue or posts a comment. It runs weekly so a
# link that rots upstream shows up as a red run, and on demand.

on:
  schedule:
    - cron: "37 11 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  check-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action evals `args`, so each regex and the glob stay single-quoted.
      # Pacing: from a runner IP, Google-hosted blogs, Shopify stores and gnu.org
      # throttle or drop lychee's default per-host burst, so each host gets
      # fewer parallel requests, spaced out, with longer retries and timeout.
      - name: Check links (online)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          token: ${{ github.token }}
          fail: true
          jobSummary: true
          format: markdown
          args: >-
            --no-progress
            --config lychee.toml
            --host-concurrency 4
            --host-request-interval 250ms
            --max-retries 4
            --retry-wait-time 5
            --timeout 40
            --exclude-path '(^|/)plugins/attribution/skills/audit/evals/fixtures/golden/'
            --exclude-path '(^|/)scripts/fixtures/hooks-lifecycle-table\.md$'
            '**/*.md'

      - name: Probe excluded URLs (temporary, removed before merge)
        if: ${{ !cancelled() }}
        run: |
          set -u
          probe="$RUNNER_TEMP/probe"
          mkdir -p "$probe"
          awk 'BEGIN{skip=0} /^exclude = \[/{skip=1} skip&&/^\]/{skip=0; next} !skip' lychee.toml > "$probe/probe.toml"
          {
            for u in \
              https://claude.ai/code https://claude.ai/code/routines \
              https://claude.ai/code/zz-made-up-path-7f3a \
              https://dl.acm.org/doi/10.1145/3183519.3183521 \
              https://dl.acm.org/doi/10.1109/TSE.2010.62 \
              https://dl.acm.org/doi/10.1145/3611643.3613871 \
              'https://queue.acm.org/detail.cfm?id=3454124' \
              https://www.iso.org/standard/78907.html \
              https://docs.genius.com/ \
              https://cursor.com/agents https://cursor.com/dashboard/cloud-agents \
              https://lib.rs/crates/cargo-udeps \
              https://www.ntia.gov/files/ntia/publications/sbom_minimum_elements_report.pdf \
              https://medium.com/@ziobrando/the-rise-and-fall-of-the-dungeon-master-c2d511eed12f \
              https://medium.com/fortmatic/postmortem-service-disruption-from-expired-ssl-certificate-a993a59272a0 \
              https://dev.mysql.com/doc/refman/8.4/en/innodb-transaction-isolation-levels.html \
              https://help.miro.com/hc/en-us/articles/31624028247058 \
              https://isdown.app/status/anthropic \
              https://www.npmjs.com/package/firecrawl-cli \
              https://www.npmjs.com/package/@mirohq/miro-api \
              https://www.w3.org/International/wiki/WorkingWithTimeZones \
              https://www.linkedin.com/posts/milostanaskovic_softwareengineering-devtips-programming-activity-7416528696242610176-WuxX \
              https://bsky.app/profile/nick-tune.me \
              https://bsky.app/profile/no.lol/post/3ljsrfhus2s2b \
              https://bsky.app/profile/no.lol/post/zzzzzzzzzzzzz \
              https://x.com/karpathy/status/2015883857489522876 \
              https://x.com/trq212/status/2107192901537329354 \
              https://x.com/KentBeck \
              https://x.com/bcherny/status/1; do
              printf -- '- <%s>\n' "$u"
            done
          } > "$probe/urls.md"
          "$(command -v lychee || echo "$RUNNER_TEMP/lychee/bin/lychee")" --no-progress \
            --config "$probe/probe.toml" --max-concurrency 4 --format detailed \
            --verbose "$probe/urls.md" || true
