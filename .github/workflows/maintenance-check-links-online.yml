name: maintenance-check-links-online

# Online link check: runs lychee with the network on over every Markdown file,
# with the same synced lychee.toml and fixture excludes the offline lane in
# pr-require-checks.yml uses, plus this repository's .lycheeignore. The report
# goes to the job summary and any broken link fails the job red. Informational:
# not behind `ci-status`, so nothing here can block a merge. It holds only the
# read-only GITHUB_TOKEN, used to lift the github.com rate limit; that token
# cannot read another private repository, so lychee never reports a link into
# one as OK. It never opens an issue or posts a comment.

on:
  workflow_dispatch:

permissions: {}

jobs:
  check-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action evals `args`, so each regex and the glob stay single-quoted.
      - name: Check links (online)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          token: ${{ github.token }}
          fail: true
          jobSummary: true
          format: markdown
          args: >-
            --no-progress
            --config lychee.toml
            --exclude-path '(^|/)plugins/attribution/skills/audit/evals/fixtures/golden/'
            --exclude-path '(^|/)scripts/fixtures/hooks-lifecycle-table\.md$'
            '**/*.md'
