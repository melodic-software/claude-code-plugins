name: Maintenance Check Links Online

on:
  schedule:
    - cron: "37 11 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  check-links:
    name: Check Links
    permissions:
      contents: read
    uses: melodic-software/ci-workflows/.github/workflows/maintenance-check-links-online.yml@main
    with:
      runner: ubuntu-24.04
      extra-args: >-
        --exclude-path '(^|/)plugins/[^/]+/(skills/[^/]+/)?evals/'
        --exclude-path '(^|/)scripts/fixtures/hooks-lifecycle-table\.md$'
