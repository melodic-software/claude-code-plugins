name: Work Resolve Issue

# Lane caller for work-resolve-issue: setting an issue's Work status field to
# agent-ready (`field_added`, field 48484079, option 84879220,
# models.issue-status in docs/conventions/pr-pipeline.yaml) starts one agent
# run on it. Its file stem is the lane, so the lanes token broker
# accepts its write activities. No App key; each run job's OIDC token is
# exchanged at LANES_BROKER_URL for audience LANES_BROKER_AUDIENCE.
# Job contract: docs/conventions/pr-pipeline/pr-run-activity.md, Issue mode.
#
# resolve-issue runs /work-items:work on the issue in pr-run-activity-read.yml,
# with no write token, and leaves its change as a patch, or stops and says why.
# It runs on run-claude-cli with the issue lane's API key; when that call hands
# off (an empty key, a credit stop, or a 401 or 402), resolve-issue-handoff
# reads so from this run's jobs and resolve-issue-subscription runs the
# activity again on the OAuth token. When pick-slot's key-credit gate finds the
# key's last credit stop inside its window, resolve-issue never starts and
# resolve-issue-subscription is the first call. Every later job takes the call
# that ran.
# apply-issue-patch, a script in pr-run-activity-write.yml, commits that patch
# to a new branch. report-outcome then opens a ready PR from that branch, or
# comments on the issue and routes the stop by stop-routes.json (needs-human,
# host-run, attended, a capped retry, intake, a park at Work status confirmed, or
# a failed stop); an issue its dimensions skip gets the same from report-skip,
# never needs-human. The field write alone admits the issue, from a listed
# human or from the lanes App; the hold labels and the go-live time are in
# docs/conventions/pr-pipeline.yaml. The App restarts a run the same way, as a
# field write: it clears the field (`field_removed`, which starts nothing) and
# sets agent-ready again. The text freeze anchors on the admission record
# (write-issue.mjs), else on a listed human's set of the field, which the
# runner hands on as TRIGGER_AT and TRIGGER_SENDER_ID. The token broker
# mints on the issue's live field state. The kill switch, the trigger check
# (a listed human, or the lanes App setting agent-ready) and the token broker
# run inside each runner.

# The morning brief's Lanes section groups runs by the issue number that ends
# this title, so a retitled issue stays one item and two issues with one
# title stay two. Quoted: unquoted, " #" would start a YAML comment.
run-name: "${{ github.event.issue.title }} #${{ github.event.issue.number }}"

# API_BUDGET_HOLD (outage posture element 2): no step here sets it.
# report-outcome.mjs, find-prior included, reads through retry-fetch.mjs,
# which the rate guard never refuses, so its fault holds need none.
# A step opts in only once its script is shown to hold green with a notice on
# a refused call (rate-guard.mjs createRateLimitLatch); a gate never does, since
# a hold would pass what it could not read, so the rest still end red on a
# rate limit past the guard's budget.
on:
  issues:
    types: [field_added]

permissions: {}

# One agent-ready run per issue at a time. A newer agent-ready field write
# replaces one still waiting; a running one finishes. Every other field write,
# which starts no work, gets its own group, so it never replaces a waiting
# agent-ready run.
concurrency:
  group: work-resolve-issue-${{ github.event.issue.number }}-${{ github.event.issue_field.id == 48484079 && github.event.issue_field_value.option.id == 84879220 }}
  cancel-in-progress: false

jobs:
  # The lane's admission gate, before any job that gets a credential: the
  # account that set Work status to agent-ready, and any re-runner, must be a
  # listed human, or the lanes App setting it itself (work-unblock's).
  # Anyone else's field write, on an issue anyone can open, starts nothing
  # past this job; a Bot other than the App never starts it. It runs
  # check-trusted-trigger from the default branch tip with a read-only token
  # and no secret; the read runner checks the trigger again.
  # A trusted write proceeds no further (check-blockers.mjs, admission's rules)
  # on an issue neither a listed human nor the lanes App wrote, or one
  # untrusted provenance holds, both for good, or one a blocker still
  # blocks, or whose labels, events or blockers cannot be read. On the first,
  # report-skip removes agent-ready and comments that a listed human re-files
  # the work; on the rest agent-ready stays, and work-unblock's sweep re-fires
  # the last two once they clear. A blocker added while the run waits for its
  # slot is caught inside it: resolve-issue's broker-check re-runs
  # check-blockers.mjs (RECHECK) before the model job and stops the run the
  # same way, at its `Stop on an open blocker` step.
  admit:
    name: Admit
    if: >-
      github.event.issue_field.id == 48484079 && github.event.issue_field_value.option.id == 84879220
      && (github.event.sender.type == 'User' || github.event.sender.id == vars.AUTOMATION_LANES_APP_SENDER_ID)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read # list the issue's blocked_by dependencies
    outputs:
      proceed: ${{ steps.gate.outputs.proceed == 'true' && steps.blockers.outputs.proceed == 'true' && steps.upstream.outputs.degraded != 'true' }}
      outsider: ${{ steps.gate.outputs.proceed == 'true' && steps.blockers.outputs.outsider == 'true' }}
      # Whether the issue is a trusted size-split sub-issue or a finished
      # parent, for resolve-config.
      split-child: ${{ steps.blockers.outputs.split-child }}
      # A finished parent's sub-issues, each closed as completed by a trusted
      # close, for report-outcome's verified-done close.
      verify-close: ${{ steps.blockers.outputs.verify-close }}
    env:
      API_BUDGET_TOKEN: github-token
      npm_config_audit: "false"
      npm_config_fetch_timeout: "60000"
      npm_config_fund: "false"
      # npm's fetch timeout and retries, from the one file that sets them.
      npm_config_globalconfig: ${{ github.workspace }}/.base/.github/npm-fetch.npmrc
    steps:
      # The gate cannot match an unset lanes App id, so the App's own field
      # writes would read as a stranger's and its exception would never hold.
      - name: Assert the lanes App sender id and default branch are set
        env:
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! [[ $APP_SENDER_ID =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the AUTOMATION_LANES_APP_SENDER_ID variable must hold the lanes App bot's numeric user id"
            exit 1
          fi
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error::the event names no default branch"
            exit 1
          fi

      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # A switch that is on skips every API step below and leaves the run
      # green; work-unblock's sweep reads that skip as a kill-switch trip
      # (label-unblocked.mjs didNoWork) and re-fires it once the switch clears.
      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # check-blockers.mjs reads the issue's Work status through
      # resolve-config.mjs, whose packages only the resolve-config action
      # installs; this job does not run it.
      - name: Install resolve-config's packages
        if: steps.kill.outputs.proceed == 'true'
        timeout-minutes: 3
        run: npm ci --ignore-scripts --omit=dev --prefix .base/.github/actions/resolve-config

      - name: Check the trigger
        id: gate
        if: steps.kill.outputs.proceed == 'true'
        uses: ./.base/.github/actions/check-trusted-trigger # zizmor: ignore[self-repository]
        with:
          trusted-actors-path: .base/.github/standards/trusted-actors/trusted-actors.json
          denied-actor-ids: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          lanes-app-id: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          triggering-actor: ${{ github.triggering_actor }}
          require-pr: "false"
          require-kind: human
          app-field-id: "48484079"
          app-field-option: "84879220"

      - name: Wait for open blockers
        id: blockers
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRUSTED_ACTORS_PATH: .base/.github/standards/trusted-actors/trusted-actors.json
          LANES_APP_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
        run: node .base/.github/scripts/work-resolve-issue/check-blockers.mjs

      # Skips the run while Actions or npm installs report a degraded
      # component, with a logged reason; fails open
      # (.github/actions/check-upstream-status). agent-ready stays, and
      # work-unblock's sweep re-fires the run as one the blocker gate skipped
      # (label-unblocked.mjs didNoWork).
      - name: Check upstream status
        id: upstream
        if: steps.blockers.outputs.proceed == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.base/.github/actions/check-upstream-status # zizmor: ignore[self-repository]

      # The mark work-unblock's sweep reads: a run that stopped here is never
      # re-fired.
      - name: Stop on untrusted provenance
        if: steps.blockers.outputs.untrusted == 'true'
        run: echo "an outside author or untrusted provenance holds this issue; a person decides it"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # Picks the concurrency slot resolve-issue waits on (a run-time cap, not a
  # lane slot in pr-pipeline.yaml): the issue number modulo SLOTS. Workflow
  # expressions have no arithmetic operator, so a job computes it. A burst of
  # admissions then waits in SLOTS queues instead of spending the lanes App's
  # hourly API quota at once.
  pick-slot:
    name: Pick Slot
    needs: admit
    if: github.event.issue_field.id == 48484079 && github.event.issue_field_value.option.id == 84879220 && needs.admit.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    # No step here uses a cache; read keeps an issues run from saving one.
    cache-mode: read
    permissions:
      actions: read # the key-credit gate lists the credit-stop markers
      contents: read # check out the default branch for the WIP cap
      pull-requests: read # count the lanes App's open pull requests
      issues: read # read the issue's Size, Complexity and Uncertainty fields
    env:
      API_BUDGET_TOKEN: github-token
      # npm's fetch timeout and retries, from the one file that sets them.
      npm_config_globalconfig: ${{ github.workspace }}/.base/.github/npm-fetch.npmrc
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    outputs:
      slot: ${{ steps.slot.outputs.slot }}
      capped: ${{ steps.wip.outputs.capped }}
      timeout-minutes: ${{ steps.dimensions.outputs.timeout-minutes }}
      issue-dimensions: ${{ steps.dimensions.outputs.issue-dimensions }}
      skip-reason: ${{ steps.dimensions.outputs.skip-reason }}
      skip-key: ${{ steps.credit.outcome == 'success' && steps.credit.outputs.skip-key || '' }}
    steps:
      - name: Resolve main's tip
        id: tip
        continue-on-error: true
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        if: steps.tip.outputs.sha != ''
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      # A switch that is on skips every API step below and leaves the job
      # green with no `capped`, so resolve-issue skips; work-unblock's sweep
      # reads that skip as a kill-switch trip (label-unblocked.mjs didNoWork).
      # A check that cannot run (no checkout) sets no `proceed` and leaves the
      # hold below as it was; broker-check asks again before any model turn.
      - name: Check the kill switch
        id: kill
        continue-on-error: true
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # When the WIP cap check pauses the lane (over the WIP cap or the held
      # cap on or after wip.pause-from), resolve-issue is skipped: no
      # slot, no token. work-unblock's sweep re-fires the issue once under the
      # cap. The check publishes its status as the `wip` output. A read the
      # pause depends on that fails, or a check that sets no `capped`, holds
      # (outage posture element 2): resolve-issue starts only on
      # `capped == 'false'`, the job ends green with a notice, and
      # work-unblock's sweep re-fires the issue as a WIP cap skip, so its next
      # run reads again (element 3). No stored state decides the pause. Its
      # queued cap (`admission-open`) gates only new agent-ready labels in
      # work-unblock, never this run: a queued issue leaves the count by running.
      - name: Check the WIP cap
        id: wip
        if: steps.kill.outputs.proceed != 'false'
        continue-on-error: true
        uses: ./.base/.github/actions/check-wip-cap # zizmor: ignore[self-repository]
        with:
          # Only capped leaves this job, so the admission reads are skipped.
          reads: pause

      # The check names its own hold; this names one it could not, when it
      # failed or never ran.
      - name: Hold on an unknown WIP cap
        if: steps.kill.outputs.proceed != 'false' && steps.wip.outputs.capped != 'true' && steps.wip.outputs.capped != 'false'
        run: echo "::notice title=WIP cap hold::the WIP cap check did not finish, so the pause is unknown and this run starts no work; work-unblock's next sweep re-fires it and the check reads again"

      # The key-credit gate, read before the slot queue: a credit stop inside
      # vars.KEY_CREDIT_WINDOW_HOURS skips resolve-issue, so the run queues
      # once, for resolve-issue-subscription, instead of once per leg. Every
      # failure leaves skip-key empty and the key runs, re-reading its credit
      # in its own broker-check. On a skip, resolve-issue-subscription runs
      # with fallback credit-stop, and its broker-check writes the skipped key
      # leg's lane record and re-checks the blockers in the slot.
      # The decision comes before the first slot wait, so a window that
      # expires during that wait still sends the run to the subscription,
      # which costs plan capacity, not correctness.
      - name: Read the key's credit history
        id: credit
        if: steps.wip.outputs.capped == 'false'
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@5b5110ae015183e900dd098c631d4dcc68904067 # 5b5110a 2026-11-06
        with:
          leg: start
          key-job: resolve-issue
          window-hours: ${{ vars.KEY_CREDIT_WINDOW_HOURS }}
          reset-at: ${{ vars.KEY_CREDIT_RESET_AT }}
          probe-minutes: "0"

      # A job's timeout is fixed before it starts, so the run job's comes from
      # here: the issue's Size, Complexity and Uncertainty fields read through
      # the base config (models.issue-dimensions). The run job takes the same
      # dimensions for its turn cap rather than reading the fields again, so a
      # field set while it waits in its slot cannot outgrow the timeout.
      # Without issue-dimensions the timeout is 40 minutes, a 25-minute leg.
      # A config that cannot be resolved, or an option it does not map, fails
      # this job. A run held on an unknown pause skips this read, so it ends
      # green; a paused run still reads it, since report-skip runs at the WIP
      # cap too.
      - name: Resolve the issue dimensions' timeout
        id: dimensions
        if: steps.wip.outputs.held == 'false'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: work-resolve-issue
          activity: resolve-issue
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          # What the read runner hands on for resolve-issue.
          applied-by-supported: patch work-outcome
          split-child: ${{ needs.admit.outputs.split-child }}

      # SLOTS is the effective lane level: the published level variable,
      # clamped to limits.lane-level's floor and ceiling, or its default when
      # the value is empty, expired or malformed, and the default while
      # limits.lane-level.shadow is set, with a notice naming the level it
      # would use (.github/scripts/lib/lane-level-value.mjs). It reads the
      # vars context and the resolved config, no API. A read that cannot run
      # (no base checkout) leaves the fallback below, the same default.
      - name: Read the lane level
        id: level
        if: steps.tip.outputs.sha != ''
        continue-on-error: true
        timeout-minutes: 1
        env:
          LANE_VARS: ${{ toJSON(vars) }}
          RESOLVED_CONFIG: ${{ runner.temp }}/resolved-config.json
        run: node .base/.github/scripts/lib/lane-level-value.mjs slots

      - name: Pick the slot
        id: slot
        env:
          # limits.lane-level.default, the fallback when the read fails.
          SLOTS: ${{ steps.level.outputs.slots || '3' }}
        run: |
          [[ $ISSUE_NUMBER =~ ^[1-9][0-9]*$ && $SLOTS =~ ^[1-9][0-9]*$ ]] || exit 1
          echo "slot=$((ISSUE_NUMBER % SLOTS))" >> "$GITHUB_OUTPUT"

      # Either WIP cap hold above, kept as the lane-hold-work-resolve-issue
      # artifact for monitor signal 13 (lane-hold-marker.mjs).
      - name: Mark the lane hold
        id: hold-marker
        if: steps.kill.outputs.proceed != 'false' && (steps.wip.outputs.held == 'true' || (steps.wip.outputs.capped != 'true' && steps.wip.outputs.capped != 'false'))
        continue-on-error: true
        run: mkdir -p "$RUNNER_TEMP/lane-hold" && echo "work-resolve-issue $GITHUB_RUN_ID" >"$RUNNER_TEMP/lane-hold/work-resolve-issue"
      - name: Keep the lane hold marker
        if: steps.hold-marker.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-hold-work-resolve-issue
          path: ${{ runner.temp }}/lane-hold/work-resolve-issue
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The lanes App setting Work status to agent-ready (work-unblock's, or
  # report-outcome's re-fire of a run that stopped on stale workflow files)
  # starts a run like a listed human's; the App's other field writes never
  # start one. Only that re-fire sets agent-ready in this lane, at most
  # limits.limit-stops-per-issue times since a person last set it or a run
  # last reported.
  resolve-issue:
    name: Resolve Issue
    needs: [admit, pick-slot]
    if: >-
      github.event.issue_field.id == 48484079 && github.event.issue_field_value.option.id == 84879220 && needs.admit.outputs.proceed == 'true'
      && needs.pick-slot.outputs.capped == 'false' && needs.pick-slot.outputs.skip-key != 'true'
    # One run per slot at a time; the rest wait in line, holding no runner,
    # and are never cancelled (`queue: max`). GitHub keeps at most 100 waiting
    # per slot and cancels any more. report-outcome takes no slot, so it never
    # waits behind another issue's whole run; it is short and follows one
    # resolve-issue, so at most SLOTS of each run at once.
    concurrency:
      group: work-resolve-issue-slot-${{ needs.pick-slot.outputs.slot }}
      queue: max
    # The read runner's run job, which runs the model, holds contents and
    # pull-requests read only; checks: write is its report job's (posting
    # nothing in issue mode) and id-token: write its broker-check job's,
    # which runs only default-branch-tip code. The first call holds the API
    # key alone.
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: write
      checks: write
      issues: write
      id-token: write
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      start-gate: true
      lane: work-resolve-issue
      role: issue-lane
      activity: resolve-issue
      key-credit-job: resolve-issue
      issue-number: ${{ format('{0}', github.event.issue.number) }}
      trusted-base: default-tip
      app-field-id: "48484079"
      app-field-option: "84879220"
      timeout-minutes: ${{ fromJSON(needs.pick-slot.outputs.timeout-minutes || '40') }}
      issue-dimensions: ${{ needs.pick-slot.outputs.issue-dimensions }}
      caller-releases-lease: true
    secrets:
      claude-api-key: ${{ secrets.ISSUE_LANE_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether resolve-issue handed off, read from this run's jobs through the
  # Actions API by the default branch tip's handoff-evidence.sh, never from a
  # resolve-issue output. A call handed off when its broker-allowed job
  # succeeded, its run job succeeded, and its scan job never ran: the read
  # runner skips the scan job only on its run job's handed-off output (a run
  # that stopped on stale workflow files, an earlier run's work or a reuse
  # still runs it). Every one of those is a job conclusion, which the jobs
  # listing returns as the job ends. That output comes from the key-presence
  # step, which runs before any model turn, and run-claude-cli's handoff,
  # which it sets after restoring the step files, but the run job runs the
  # model's commands and could still forge it, so a forged handoff starts one
  # subscription run at most. A failed read fails this job and starts no
  # second call; report-outcome then reports the first call, which uploaded
  # no outcome.
  resolve-issue-handoff:
    name: Resolve Issue Handoff
    needs: [admit, pick-slot, resolve-issue]
    if: ${{ !cancelled() && needs.admit.outputs.proceed == 'true' && (needs.resolve-issue.result != 'skipped' || needs.pick-slot.result == 'success' && needs.pick-slot.outputs.skip-key == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      fallback-ready: ${{ steps.fallback.outputs.ready }}
      handed-off: ${{ steps.handoff.outputs.handed-off }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # A resolve-issue the key-credit gate skipped ran nothing to read; the
      # job then only checks the fallback token for resolve-issue-subscription.
      - name: Read whether resolve-issue handed off
        id: handoff
        if: needs.resolve-issue.result != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: resolve-issue
        run: bash .base/.github/scripts/lib/handoff-evidence.sh handed-off

      # Whether the third call can run, never the token.
      # resolve-issue-subscription passes it on as fallback-ready, so with the
      # token empty its subscription leg stays the last; a failed read leaves
      # it empty, which hands nothing on.
      - name: Check the fallback token
        id: fallback
        env:
          PRESENT: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: echo "ready=$PRESENT" >>"$GITHUB_OUTPUT"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The key's credit-stop markers, read by the read runner's broker-check in
  # later runs (each first call's key-credit-job). Each comes from a jobs-API
  # read of the call's run job (handoff-evidence.sh credit-stop), never from a
  # call's output. No job needs this one, so the read, which waits for the
  # jobs listing's steps, delays no handoff.
  key-credit-markers:
    name: Key Credit Markers
    needs: [resolve-issue]
    if: ${{ !cancelled() && (needs.resolve-issue.result != 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether resolve-issue's key hit a credit stop
        id: credit-stop-resolve-issue
        if: needs.resolve-issue.result != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: resolve-issue
          HANDOFF_EVIDENCE_LAG: notice
        run: bash .base/.github/scripts/lib/handoff-evidence.sh credit-stop

      - name: Write resolve-issue's credit-stop marker
        id: credit-marker-resolve-issue
        if: steps.credit-stop-resolve-issue.outputs.credit-stop == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/key-credit-stop-resolve-issue"
          echo "$GITHUB_RUN_ID" >"$RUNNER_TEMP/key-credit-stop-resolve-issue/run-id"

      - name: Upload resolve-issue's credit-stop marker
        if: steps.credit-marker-resolve-issue.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: key-credit-stop-work-resolve-issue.yml-resolve-issue
          path: ${{ runner.temp }}/key-credit-stop-resolve-issue/run-id
          if-no-files-found: error
          retention-days: 1

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The subscription fallback, a second call on new VMs in the same slot: it
  # runs on resolve-issue-handoff's read, passing fallback handoff, the one
  # fact that read attests, or as the first call in the slot when pick-slot's
  # key-credit gate skipped resolve-issue, passing fallback credit-stop. It
  # holds the OAuth token alone.
  resolve-issue-subscription:
    name: Resolve Issue Subscription
    needs: [admit, pick-slot, resolve-issue, resolve-issue-handoff]
    if: >-
      ${{ !cancelled() && github.event.issue_field.id == 48484079 && github.event.issue_field_value.option.id == 84879220 && needs.admit.outputs.proceed == 'true'
      && needs.pick-slot.outputs.capped == 'false'
      && (needs.resolve-issue-handoff.outputs.handed-off == 'true' || needs.pick-slot.result == 'success' && needs.pick-slot.outputs.skip-key == 'true' && needs.resolve-issue.result == 'skipped') }}
    concurrency:
      group: work-resolve-issue-slot-${{ needs.pick-slot.outputs.slot }}
      queue: max
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: write
      checks: write
      issues: write
      id-token: write
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      start-gate: true
      lane: work-resolve-issue
      role: issue-lane
      activity: resolve-issue
      fallback: ${{ needs.resolve-issue.result == 'skipped' && 'credit-stop' || 'handoff' }}
      fallback-ready: ${{ needs.resolve-issue-handoff.outputs.fallback-ready }}
      issue-number: ${{ format('{0}', github.event.issue.number) }}
      trusted-base: default-tip
      app-field-id: "48484079"
      app-field-option: "84879220"
      timeout-minutes: ${{ fromJSON(needs.pick-slot.outputs.timeout-minutes || '40') }}
      issue-dimensions: ${{ needs.pick-slot.outputs.issue-dimensions }}
      caller-releases-lease: true
    secrets:
      claude-code-oauth-token: ${{ secrets.ISSUE_LANE_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether resolve-issue-subscription handed off to the fallback token,
  # read from this run's jobs by handoff-evidence.sh, never from a
  # resolve-issue-subscription output: its broker allowed it, its run job
  # succeeded and its scan job never ran. It runs only when
  # resolve-issue-handoff found the fallback token set, so with the token
  # empty nothing starts that did not before. A failed read starts no third
  # call.
  resolve-issue-subscription-handoff:
    name: Resolve Issue Subscription Handoff
    needs: [resolve-issue-handoff, resolve-issue-subscription]
    if: ${{ !cancelled() && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-handoff.outputs.fallback-ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      handed-off: ${{ steps.handoff.outputs.handed-off }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether resolve-issue-subscription handed off
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: resolve-issue-subscription
        run: bash .base/.github/scripts/lib/handoff-evidence.sh handed-off

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The third call, on the central fallback subscription's token alone: it
  # runs only on resolve-issue-subscription-handoff's read, after
  # resolve-issue-subscription's leg handed off (a limit stop, a credit stop,
  # or a 401 or 402). It is the last leg and never hands off.
  resolve-issue-fallback:
    name: Resolve Issue Fallback
    needs: [admit, pick-slot, resolve-issue, resolve-issue-handoff, resolve-issue-subscription, resolve-issue-subscription-handoff]
    if: >-
      ${{ !cancelled() && github.event.issue_field.id == 48484079 && github.event.issue_field_value.option.id == 84879220 && needs.admit.outputs.proceed == 'true'
      && needs.pick-slot.outputs.capped == 'false' && needs.resolve-issue-handoff.outputs.fallback-ready == 'true'
      && needs.resolve-issue-subscription-handoff.outputs.handed-off == 'true' }}
    concurrency:
      group: work-resolve-issue-slot-${{ needs.pick-slot.outputs.slot }}
      queue: max
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: write
      checks: write
      issues: write
      id-token: write
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      lane: work-resolve-issue
      role: issue-lane
      activity: resolve-issue
      fallback: fallback
      issue-number: ${{ format('{0}', github.event.issue.number) }}
      trusted-base: default-tip
      app-field-id: "48484079"
      app-field-option: "84879220"
      timeout-minutes: ${{ fromJSON(needs.pick-slot.outputs.timeout-minutes || '40') }}
      issue-dimensions: ${{ needs.pick-slot.outputs.issue-dimensions }}
      caller-releases-lease: true
    secrets:
      fallback-claude-code-oauth-token: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether a call stopped on stale workflow files (it waited in its slot past
  # a change to this file or the write runner on main, so no model ran), read
  # from this run's jobs by handoff-evidence.sh, never from a call's output.
  # Only a run that started no skill and reused no branch is read. On true,
  # report-outcome re-fires the issue at once on main's files instead of
  # leaving it to work-unblock's hourly sweep. A failed read re-fires nothing.
  resolve-issue-stale:
    name: Resolve Issue Stale
    needs: [admit, resolve-issue, resolve-issue-subscription, resolve-issue-fallback]
    if: >-
      ${{ !cancelled() && needs.admit.outputs.proceed == 'true' && (needs.resolve-issue.result != 'skipped' || needs.resolve-issue-subscription.result != 'skipped')
      && (needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-issue-run-started || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-issue-run-started || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-issue-run-started || '') != 'true'
      && (needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-reuse-branch || '') == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      stale: ${{ steps.stale.outputs.stale }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether a resolve-issue call stopped on stale workflow files
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: resolve-issue resolve-issue-subscription resolve-issue-fallback
        run: bash .base/.github/scripts/lib/handoff-evidence.sh stale

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # An issue its Size, Complexity and Uncertainty fields skip (pick-slot's
  # resolve) takes no model turn, so the run leaves no outcome and every job
  # below skips. This job reports it instead: report-outcome, with the
  # lanes App token, routes the skip by stop-routes.json to no person, removes
  # agent-ready and comments the next step: research-first and probe-first
  # park at status: confirmed beside admission's comment naming the reason,
  # and split-required goes back through intake, whose size split files its
  # sub-issues. It needs no slot and runs at the WIP cap too.
  # It also reports the admit job's outside-author stop (pick-slot skipped,
  # hence !cancelled()): report-outcome removes agent-ready and comments that
  # a listed human re-files the work as a new issue, adding no label.
  report-skip:
    name: Report Skip
    needs: [admit, pick-slot]
    if: >-
      !cancelled() && github.event.issue_field.id == 48484079 && github.event.issue_field_value.option.id == 84879220
      && (needs.admit.outputs.outsider == 'true'
      || (needs.admit.outputs.proceed == 'true' && needs.pick-slot.result == 'success'
      && (needs.pick-slot.outputs.skip-reason == 'split-required'
      || needs.pick-slot.outputs.skip-reason == 'research-first'
      || needs.pick-slot.outputs.skip-reason == 'probe-first')))
    permissions:
      actions: read # the write runner's run job reads the review lanes' comment records
      contents: read
      pull-requests: write
      checks: write
      issues: write
      id-token: write
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      lane: work-resolve-issue
      role: issue-lane
      activity: report-outcome
      issue-number: ${{ format('{0}', github.event.issue.number) }}
      trusted-base: default-tip
      app-field-id: "48484079"
      app-field-option: "84879220"
      dimension-skip: ${{ needs.admit.outputs.outsider == 'true' && 'outside-author' || needs.pick-slot.outputs.skip-reason }}

  # The commit job: a script with no model that runs nothing from the patch.
  # It checks the patch against the model job's SHA-256, applies it to the
  # commit the model worked on (checked out fresh, never the model job's
  # workspace), refuses the paths patch-rules.json's `issue` row refuses,
  # re-reads the issue's hold labels and agent-ready, and commits it to a new
  # work-resolve-issue/issue-<n>-<run id>-<attempt> branch. One per issue at a
  # time, the rest queued.
  apply-issue-patch:
    name: Apply Issue Patch
    needs: [resolve-issue, resolve-issue-subscription, resolve-issue-fallback]
    if: >-
      ${{ !cancelled() && (needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-issue-run-started || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-issue-run-started || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-issue-run-started || '') == 'true'
      && (needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-patch-state || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-patch-state || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-patch-state || '') == 'written' }}
    permissions:
      actions: read # the write runner's run job reads the review lanes' comment records
      contents: read
      pull-requests: write
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: work-resolve-issue-write-${{ github.event.issue.number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      lane: work-resolve-issue
      role: issue-lane
      activity: apply-issue-patch
      issue-number: ${{ format('{0}', github.event.issue.number) }}
      trusted-base: default-tip
      app-field-id: "48484079"
      app-field-option: "84879220"
      patch-state: ${{ needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-patch-state || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-patch-state || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-patch-state || '' }}
      patch-sha256: ${{ needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-patch-sha256 || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-patch-sha256 || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-patch-sha256 || '' }}
      # The selected read call's lease, ended here only on a kill-switch stop,
      # which skips report-outcome.
      lease-comment-id: ${{ needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.lease-comment-id || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.lease-comment-id || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.lease-comment-id || '' }}
      patch-attempt: ${{ needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-patch-attempt || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-patch-attempt || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-patch-attempt || '' }}
      patch-activity: resolve-issue
      patch-base-sha: ${{ needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-base-sha || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-base-sha || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-base-sha || '' }}
      patch-resume-tip: ${{ needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-resume-tip || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-resume-tip || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-resume-tip || '' }}
      reply-attempt: ${{ needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-reply-attempt || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-reply-attempt || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-reply-attempt || '' }}

  # A stopped run's leftover lane branches (owner decision on #7948): the
  # issue's lane branches whose run posted an outcome marker and whose commits
  # are all the lanes App's, with no pull request in any state, which the read
  # runner's earlier-work check named past the branch it reused, resumed or
  # started fresh past. The run job that named them ran the model, so the list
  # is a claim, held to the lane-branch shape by issue-fields: prune-branches.mjs,
  # from the default branch tip, spares this run's own branches and the reuse
  # and resume branches, reads every named branch in one GraphQL request, and
  # deletes only one with no pull request, at the tip it read. Nothing here
  # fails the run. The daily branch cleanup's rule is unchanged.
  prune-lane-branches:
    name: Prune Lane Branches
    needs: [resolve-issue, resolve-issue-subscription, resolve-issue-fallback]
    if: >-
      ${{ !cancelled() && (needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-prune-branches || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-prune-branches || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-prune-branches || '') != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # delete a lane branch ref
      pull-requests: read # each named branch's pull requests
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Delete the stopped runs' lane branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          PRUNE_BRANCHES: ${{ needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-prune-branches || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-prune-branches || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-prune-branches || '' }}
          REUSE_BRANCH: ${{ needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-reuse-branch || '' }}
          RESUME_BRANCH: ${{ needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-resume-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-resume-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-resume-branch || '' }}
        run: node .base/.github/scripts/work-resolve-issue/prune-branches.mjs

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # One `pipeline/<activity>` commit status per lane step on the lane branch's
  # head (post-statuses.mjs). No step is skipped on them; a failing one holds
  # the merge gate like any failing check. This is the lane's only
  # `statuses: write` grant, on the job's own GITHUB_TOKEN, and it runs only
  # scripts from the default branch tip.
  report-statuses:
    name: Report Statuses
    needs: [resolve-issue, resolve-issue-subscription, resolve-issue-fallback, apply-issue-patch, run-checks, report-outcome]
    if: >-
      ${{ !cancelled() && ((needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-issue-run-started || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-issue-run-started || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-issue-run-started || '') == 'true'
      || (needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-reuse-branch || '') != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # A run that uploaded no outcome posts what its job results say.
      - name: Download the issue outcome
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: work-outcome-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/work-outcome

      - name: Post the pipeline statuses
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          WORK_OUTCOME_DIR: ${{ runner.temp }}/work-outcome
          REUSE_BRANCH: ${{ needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-reuse-branch || '' }}
          RESUME_BRANCH: ${{ needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-resume-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-resume-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-resume-branch || '' }}
          RUNNER_CHECKS: ${{ needs.run-checks.result == 'success' && needs.run-checks.outputs.checks || '' }}
          RESOLVE_RESULT: ${{ needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.result || needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.result || needs.resolve-issue.result }}
          REPORT_RESULT: ${{ needs.report-outcome.outputs.skip-reason == 'kill-switch' && 'stopped' || needs.report-outcome.result }}
        run: node .base/.github/scripts/work-resolve-issue/post-statuses.mjs

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The model's outcome file is its own word, so the runner runs the
  # resolve-issue activity's `checks` itself, on a fresh runner no model ran
  # on. Each check runs from the default branch tip's copy, in a checkout of
  # the lane branch whose scripts/ is replaced by the base's, so every script
  # the check runs is the base's. The branch's own data there (.txt, .json and
  # .jsonl, such as scripts/fragment-plugins.txt) is restored from its commit,
  # so the check reads the same lists the PR's CI does; a check reads list
  # entries as data and never executes them. The results, with the
  # tip they checked, are this job's `checks` output, never the outcome
  # artifact, which code the model started can rewrite. report-outcome gets
  # them only when this job succeeded, and stops a done run whose checks
  # failed, did not run, or ran on another tip.
  run-checks:
    name: Run Checks
    needs: [admit, resolve-issue, resolve-issue-subscription, resolve-issue-fallback, apply-issue-patch]
    if: >-
      ${{ !cancelled() && ((needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-issue-run-started || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-issue-run-started || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-issue-run-started || '') == 'true'
      && (needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-outcome-uploaded || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-outcome-uploaded || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-outcome-uploaded || '') == 'true'
      || (needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-reuse-branch || '') != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    cache-mode: read
    permissions:
      contents: read
      issues: read # resolve-config reads the issue's labels for labels-absent
    outputs:
      checks: ${{ steps.run-checks.outputs.checks }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # No activity selected: every slot's predicate is decided, which reads
      # the issue's labels; only the resolve-issue slot's checks are used.
      - name: Resolve the config
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: work-resolve-issue
          base-path: .base
          split-child: ${{ needs.admit.outputs.split-child }}
          output-path: ${{ runner.temp }}/resolved-config.json

      # For lane.json, which names the branch. A skill run reaches this job
      # only when the scan uploaded the outcome; a reuse may have none.
      - name: Download the issue outcome
        continue-on-error: ${{ (needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-reuse-branch || '') != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: work-outcome-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/work-outcome

      # The branch report-outcome opens the PR from: the reuse branch, else
      # the one lane.json names (apply-issue-patch writes it), which must be
      # this run's own, else the branch a resumed run continued.
      - name: Pick the lane branch
        id: branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          REUSE_BRANCH: ${{ needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-reuse-branch || '' }}
          RESUME_BRANCH: ${{ needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-resume-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-resume-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-resume-branch || '' }}
          LANE_FILE: ${{ runner.temp }}/work-outcome/lane.json
        run: |
          [[ $ISSUE_NUMBER =~ ^[1-9][0-9]*$ && $RUN_ID =~ ^[1-9][0-9]*$ ]] || exit 1
          branch=$REUSE_BRANCH
          shape="^work-resolve-issue/issue-$ISSUE_NUMBER-[1-9][0-9]*-[1-9][0-9]*$"
          if [ -z "$branch" ]; then
            if [ -f "$LANE_FILE" ]; then
              branch=$(jq -r '.branch | strings' "$LANE_FILE" 2>/dev/null) || branch=""
            fi
            shape="^work-resolve-issue/issue-$ISSUE_NUMBER-$RUN_ID-[1-9][0-9]*$"
            # A resumed run that committed nothing kept no branch, so its work
            # is the branch it resumed: that whole branch is checked. lane.json
            # can be rewritten by code the model started, so its resume must
            # equal the branch issue-prior chose before the mint.
            # report-outcome counts the results only when every commit on it
            # ahead of the default branch is the lanes App's.
            if [ -z "$branch" ] && [ -n "$RESUME_BRANCH" ] && [ -f "$LANE_FILE" ]; then
              resume=$(jq -r '.resume | strings' "$LANE_FILE" 2>/dev/null) || resume=""
              if [ "$resume" = "$RESUME_BRANCH" ]; then
                branch=$RESUME_BRANCH
                shape="^work-resolve-issue/issue-$ISSUE_NUMBER-[1-9][0-9]*-[1-9][0-9]*$"
              else
                echo "lane.json's resume is not the branch this run resumed"
              fi
            fi
          fi
          if ! [[ $branch =~ $shape ]]; then
            echo "No lane branch of this run to check"
            branch=""
          fi
          reuse=""
          if [ -n "$REUSE_BRANCH" ] && [ "$branch" = "$REUSE_BRANCH" ]; then
            reuse=true
          fi
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          echo "reuse=$reuse" >>"$GITHUB_OUTPUT"

      - name: Check out the lane branch
        if: steps.branch.outputs.branch != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch.outputs.branch }}
          path: .lane
          # Full history, so the lane branch's merge base with the base tip resolves.
          fetch-depth: 0
          persist-credentials: false

      # A reused branch's commits were scanned when their run made them,
      # against that day's patterns, or never when the branch predates
      # issue-mode scanning. Before any check runs, the read runner's leak
      # scan (lib/publish-gate.mjs, from the base) reads everything the
      # branch changes since its merge base with the base tip. Its word and
      # the tip it scanned go into the checks record, and report-outcome holds
      # the reuse PR on any word but clean.
      - name: Scan the reused branch for credentials
        id: reuse-scan
        if: steps.branch.outputs.reuse == 'true'
        env:
          BASE: ${{ github.workspace }}/.base
          LANE: ${{ github.workspace }}/.lane
        run: |
          scan=failed
          tip=""
          if tip=$(git -C "$LANE" rev-parse HEAD) && base_tip=$(git -C "$BASE" rev-parse HEAD); then
            scan=$(node "$BASE/.github/scripts/work-resolve-issue/scan-reuse.mjs" "$LANE" "$base_tip" "$tip") || scan=failed
          fi
          echo "Leak scan of the reused branch at $tip: $scan"
          echo "scan=$scan" >>"$GITHUB_OUTPUT"
          echo "tip=$tip" >>"$GITHUB_OUTPUT"

      - name: Run the activity's checks
        id: run-checks
        if: steps.branch.outputs.branch != ''
        env:
          BASE: ${{ github.workspace }}/.base
          LANE: ${{ github.workspace }}/.lane
          BRANCH: ${{ steps.branch.outputs.branch }}
          RESOLVED: ${{ runner.temp }}/resolved-config.json
          # Empty unless the branch is a reused one; a scan of another tip,
          # or a step that set no word, counts as failed.
          REUSE: ${{ steps.branch.outputs.reuse }}
          SCAN: ${{ steps.reuse-scan.outputs.scan }}
          SCAN_TIP: ${{ steps.reuse-scan.outputs.tip }}
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }
          list=$(jq -r '[.lane.slots[] | select(.name == "resolve-issue")]
            | if length == 1 then .[0].checks // [] | .[] else error("no single resolve-issue slot") end' "$RESOLVED") ||
            fail "cannot read the resolve-issue checks from the resolved config"
          mapfile -t checks < <(printf '%s' "$list")
          tip=$(git -C "$LANE" rev-parse HEAD) || fail "cannot read the lane branch tip"
          base_tip=$(git -C "$BASE" rev-parse HEAD) || fail "cannot read the base tip"
          merge_base=$(git -C "$LANE" merge-base HEAD "$base_tip") ||
            fail "cannot find the lane branch's merge base with the base tip"
          rm -rf "${LANE:?}/scripts"
          cp -R "$BASE/scripts" "$LANE/scripts"
          # Code stays the base's. Data is what the merged ref would hold: the
          # base's, with the branch's own data changes since the merge base.
          data=('scripts/*.txt' 'scripts/*.json' 'scripts/*.jsonl')
          git -C "$LANE" diff --name-only -z --no-renames --diff-filter=AMT "$merge_base" HEAD -- "${data[@]}" |
            xargs -0r env GIT_LFS_SKIP_SMUDGE=1 git -C "$LANE" restore --source=HEAD -- ||
            fail "cannot restore the lane branch's scripts/ data files"
          git -C "$LANE" diff --name-only -z --no-renames --diff-filter=D "$merge_base" HEAD -- "${data[@]}" |
            xargs -0r -I{} rm -f -- "$LANE/{}" ||
            fail "cannot remove the scripts/ data files the lane branch deleted"
          [[ -z $(find "$LANE/scripts" -type l -print -quit) ]] || fail "the lane branch's scripts/ holds a symlink"
          shape='^scripts/[A-Za-z0-9_-]+\.sh( --[a-z][a-z-]*)*$'
          results='[]'
          # A check prints what it reads from the branch, so none of its
          # lines may run a workflow command.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          for check in "${checks[@]}"; do
            [[ $check =~ $shape ]] || { echo "::$token::"; fail "a check must be a scripts/ script with fixed flags"; }
            script=${check%% *}
            read -ra flags <<<"${check#"$script"}"
            status=0
            # A check gets none of the runner's file-command paths, so it
            # cannot write this step's outputs.
            (cd "$LANE" && env -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STEP_SUMMARY \
              CHECK_DATA_ROOT="$LANE" bash "$BASE/$script" "${flags[@]}") || status=$?
            echo "$check: exit status $status"
            results=$(jq -c --arg check "$check" --argjson exit "$status" '. + [{check: $check, exit: $exit}]' <<<"$results")
          done
          echo "::$token::"
          scan=""
          if [ "$REUSE" = true ]; then
            scan=failed
            if [ "$SCAN_TIP" = "$tip" ] && [[ $SCAN =~ ^(clean|found|failed)$ ]]; then
              scan=$SCAN
            fi
          fi
          record=$(jq -nc --arg branch "$BRANCH" --arg tip "$tip" --argjson results "$results" --arg scan "$scan" \
            '{version: 1, branch: $branch, tip: $tip, results: $results} + if $scan == "" then {} else {scan: $scan} end')
          echo "checks=$record" >>"$GITHUB_OUTPUT"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  report-outcome:
    name: Report Outcome
    needs: [admit, resolve-issue, resolve-issue-subscription, resolve-issue-fallback, resolve-issue-stale, apply-issue-patch, run-checks]
    # issue-run-started is set only by the read runner's own steps, before
    # any model turn, once the run chose to run the skill, and reaches this
    # file through the read runner's issue-fields job, which checks it and
    # every other issue output read here (the patch outputs come from its
    # scan job); a run that failed after that still reports, with
    # apply-issue-patch's branch when it made one.
    # reuse-branch, also runner-computed, names a lane branch an earlier run
    # left with commits and no report: the work was skipped, a read-only
    # summary pass described the branch, and this opens the PR from it.
    # Needing resolve-issue waits for every job of that call, the summary job
    # included; !cancelled() runs this whether that job failed or skipped.
    # A kill switch that stopped apply-issue-patch dropped this run's patch,
    # so this skips and work-unblock re-fires the issue as a breaker trip.
    # A call that stopped on stale workflow files (resolve-issue-stale) runs
    # this with dimension-skip workflow-stale: it re-fires the issue at once.
    # The broker mints for this report job though the run's files are stale
    # while each main change to them is recent (pr-run-activity.md, Broker
    # reasons); when it refuses, the run ends red and work-unblock's sweep
    # re-fires the stale stop as before.
    if: >-
      ${{ !cancelled() && (((needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-issue-run-started || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-issue-run-started || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-issue-run-started || '') == 'true'
      || (needs.resolve-issue-fallback.result != 'skipped' && needs.resolve-issue-fallback.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result != 'skipped' && needs.resolve-issue-subscription.outputs.scan-reuse-branch || needs.resolve-issue-fallback.result == 'skipped' && needs.resolve-issue-subscription.result == 'skipped' && needs.resolve-issue.outputs.scan-reuse-branch || '') != '')
      && needs.apply-issue-patch.outputs.skip-reason != 'kill-switch'
      || needs.resolve-issue-stale.outputs.stale == 'true') }}
    permissions:
      actions: read # the write runner's run job reads the review lanes' comment records
      contents: read
      pull-requests: write
      checks: write
      issues: write
      id-token: write
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      lane: work-resolve-issue
      role: issue-lane
      activity: report-outcome
      issue-number: ${{ format('{0}', github.event.issue.number) }}
      trusted-base: default-tip
      app-field-id: "48484079"
      app-field-option: "84879220"
      dimension-skip: ${{ needs.resolve-issue-stale.outputs.stale == 'true' && 'workflow-stale' || '' }}
