name: work-resolve-issue

# Lane caller for work-resolve-issue: the agent-ready label on an issue starts
# one agent run on it. Its file stem is the lane, so the lanes token broker
# accepts its write activities. No App key; each run job's OIDC token is
# exchanged at LANES_BROKER_URL for audience LANES_BROKER_AUDIENCE.
# Job contract: docs/conventions/pr-pipeline/pr-run-activity.md, Issue mode.
#
# resolve-issue runs /work-items:work on the issue and commits to a new branch,
# or stops and says why. report-outcome then opens a ready PR from that branch,
# or comments on the issue and labels it needs-human. The agent-ready label
# alone admits the issue; the hold labels and the go-live time are in
# docs/conventions/pr-pipeline.yaml. The kill switch, the labeler check (a
# listed human, or the lanes App) and the token broker run inside
# pr-run-activity-write.yml.

# The morning brief's Lanes section groups runs by the issue number that ends
# this title, so a retitled issue stays one item and two issues with one
# title stay two. Quoted: unquoted, " #" would start a YAML comment.
run-name: "${{ github.event.issue.title }} #${{ github.event.issue.number }}"

on:
  issues:
    types: [labeled]

permissions: {}

# One agent-ready run per issue at a time. A newer agent-ready event replaces
# one still waiting; a running one finishes. Other labels get their own group,
# so they never replace a waiting agent-ready run.
concurrency:
  group: work-resolve-issue-${{ github.event.issue.number }}-${{ github.event.label.name == 'agent-ready' }}
  cancel-in-progress: false

jobs:
  # Picks the concurrency slot resolve-issue waits on (a run-time cap, not a
  # lane slot in pr-pipeline.yaml): the issue number modulo SLOTS. Workflow
  # expressions have no arithmetic operator, so a job computes it. A burst of
  # admissions then waits in SLOTS queues instead of spending the lanes App's
  # hourly API quota at once.
  pick-slot:
    if: github.event.label.name == 'agent-ready'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      # At most this many resolve-issue runs at once. The one place to change it.
      SLOTS: 3
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    outputs:
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - name: Pick the slot
        id: slot
        run: |
          [[ $ISSUE_NUMBER =~ ^[1-9][0-9]*$ && $SLOTS =~ ^[1-9][0-9]*$ ]] || exit 1
          echo "slot=$((ISSUE_NUMBER % SLOTS))" >> "$GITHUB_OUTPUT"

  # The lanes App's agent-ready label (work-unblock's) starts a run like a
  # listed human's; the App's other labels never start one. No step of this
  # lane adds agent-ready, so a run cannot start another.
  resolve-issue:
    needs: pick-slot
    if: github.event.label.name == 'agent-ready'
    # One run per slot at a time; the rest wait in line, holding no runner,
    # and are never cancelled (`queue: max`). GitHub keeps at most 100 waiting
    # per slot and cancels any more. report-outcome takes no slot, so it never
    # waits behind another issue's whole run; it is short and follows one
    # resolve-issue, so at most SLOTS of each run at once.
    concurrency:
      group: work-resolve-issue-slot-${{ needs.pick-slot.outputs.slot }}
      queue: max
    permissions:
      contents: read
      pull-requests: read
      checks: write
      id-token: write
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      lane: work-resolve-issue
      activity: resolve-issue
      issue-number: ${{ format('{0}', github.event.issue.number) }}
      trusted-base: default-tip
      app-label: agent-ready
      timeout-minutes: 25
    secrets:
      claude-code-oauth-token: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN }}

  # One `pipeline/<activity>` commit status per lane step on the lane branch's
  # head (post-statuses.mjs). No step is skipped on them; a failing one holds
  # the merge gate like any failing check. This is the lane's only `statuses: write` grant, on the job's own
  # GITHUB_TOKEN, and it runs only scripts from the default branch tip.
  report-statuses:
    needs: [resolve-issue, report-outcome]
    if: >-
      ${{ !cancelled() && (needs.resolve-issue.outputs.issue-run-started == 'true'
      || needs.resolve-issue.outputs.reuse-branch != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # A run that uploaded no outcome posts what its job results say.
      - name: Download the issue outcome
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: work-outcome-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/work-outcome

      - name: Post the pipeline statuses
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          WORK_OUTCOME_DIR: ${{ runner.temp }}/work-outcome
          REUSE_BRANCH: ${{ needs.resolve-issue.outputs.reuse-branch }}
          RESOLVE_RESULT: ${{ needs.resolve-issue.result }}
          REPORT_RESULT: ${{ needs.report-outcome.result }}
        run: node .base/.github/scripts/work-resolve-issue/post-statuses.mjs

  # The model's outcome file is its own word, so the runner runs the
  # resolve-issue activity's `checks` itself, on a fresh runner no model ran
  # on. Each check runs from the default branch tip's copy, in a checkout of
  # the lane branch whose scripts/ is replaced by the base's, so the check's
  # code and its data there (scripts/fragment-plugins.txt) are the base's and
  # only the branch's own files (.changes/) are checked. checks.json, with the
  # tip it checked, joins the issue outcome artifact; report-outcome stops a
  # done run whose checks failed, did not run, or ran on another tip.
  run-checks:
    needs: resolve-issue
    if: >-
      ${{ !cancelled() && (needs.resolve-issue.outputs.issue-run-started == 'true'
      || needs.resolve-issue.outputs.reuse-branch != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # No activity selected: the lane's slots are resolved with no predicate
      # decided, so the resolve-issue slot's checks are read with no API call.
      - name: Resolve the config
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: work-resolve-issue
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json

      # A skill run always uploads the outcome, so a failed download fails
      # the job rather than overwrite the artifact without it. A reuse may
      # have none.
      - name: Download the issue outcome
        continue-on-error: ${{ needs.resolve-issue.outputs.reuse-branch != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: work-outcome-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/work-outcome

      # The branch report-outcome opens the PR from: the reuse branch, else
      # the one lane.json names, which must be this run's own.
      - name: Pick the lane branch
        id: branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          REUSE_BRANCH: ${{ needs.resolve-issue.outputs.reuse-branch }}
          LANE_FILE: ${{ runner.temp }}/work-outcome/lane.json
        run: |
          [[ $ISSUE_NUMBER =~ ^[1-9][0-9]*$ && $RUN_ID =~ ^[1-9][0-9]*$ ]] || exit 1
          branch=$REUSE_BRANCH
          shape="^work-resolve-issue/issue-$ISSUE_NUMBER-[1-9][0-9]*-[1-9][0-9]*$"
          if [ -z "$branch" ]; then
            if [ -f "$LANE_FILE" ]; then
              branch=$(jq -r '.branch | strings' "$LANE_FILE" 2>/dev/null) || branch=""
            fi
            shape="^work-resolve-issue/issue-$ISSUE_NUMBER-$RUN_ID-[1-9][0-9]*$"
          fi
          if ! [[ $branch =~ $shape ]]; then
            echo "No lane branch of this run to check"
            branch=""
          fi
          echo "branch=$branch" >>"$GITHUB_OUTPUT"

      - name: Check out the lane branch
        if: steps.branch.outputs.branch != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch.outputs.branch }}
          path: .lane
          persist-credentials: false

      - name: Run the activity's checks
        id: run-checks
        if: steps.branch.outputs.branch != ''
        env:
          BASE: ${{ github.workspace }}/.base
          LANE: ${{ github.workspace }}/.lane
          BRANCH: ${{ steps.branch.outputs.branch }}
          RESOLVED: ${{ runner.temp }}/resolved-config.json
          OUT_DIR: ${{ runner.temp }}/work-outcome
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }
          mkdir -p "$OUT_DIR"
          rm -f "$OUT_DIR/checks.json"
          list=$(jq -r '[.lane.slots[] | select(.name == "resolve-issue")]
            | if length == 1 then .[0].checks // [] | .[] else error("no single resolve-issue slot") end' "$RESOLVED") ||
            fail "cannot read the resolve-issue checks from the resolved config"
          mapfile -t checks < <(printf '%s' "$list")
          tip=$(git -C "$LANE" rev-parse HEAD) || fail "cannot read the lane branch tip"
          rm -rf "${LANE:?}/scripts"
          cp -R "$BASE/scripts" "$LANE/scripts"
          shape='^scripts/[A-Za-z0-9_-]+\.sh( --[a-z][a-z-]*)*$'
          results='[]'
          # A check prints what it reads from the branch, so none of its
          # lines may run a workflow command.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          for check in "${checks[@]}"; do
            [[ $check =~ $shape ]] || { echo "::$token::"; fail "a check must be a scripts/ script with fixed flags"; }
            script=${check%% *}
            read -ra flags <<<"${check#"$script"}"
            status=0
            (cd "$LANE" && CHECK_DATA_ROOT="$LANE" bash "$BASE/$script" "${flags[@]}") || status=$?
            echo "$check: exit status $status"
            results=$(jq -c --arg check "$check" --argjson exit "$status" '. + [{check: $check, exit: $exit}]' <<<"$results")
          done
          echo "::$token::"
          jq -n --arg branch "$BRANCH" --arg tip "$tip" --argjson results "$results" \
            '{version: 1, branch: $branch, tip: $tip, results: $results}' >"$OUT_DIR/checks.json"

      - name: Add the check results to the issue outcome
        if: steps.run-checks.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: work-outcome-${{ github.event.issue.number }}
          path: |
            ${{ runner.temp }}/work-outcome/lane.json
            ${{ runner.temp }}/work-outcome/work-outcome.json
            ${{ runner.temp }}/work-outcome/checks.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  report-outcome:
    needs: [resolve-issue, run-checks]
    # issue-run-started is set only by the write runner's own steps, once the
    # run got its token; a run that failed after that still reports.
    # reuse-branch, also runner-computed, names a lane branch an earlier run
    # left with commits and no report: the work was skipped, a read-only
    # summary pass described the branch, and this opens the PR from it.
    # Needing resolve-issue waits for every job of that call, the summary job
    # included; !cancelled() runs this whether that job failed or skipped.
    if: >-
      ${{ !cancelled() && (needs.resolve-issue.outputs.issue-run-started == 'true'
      || needs.resolve-issue.outputs.reuse-branch != '') }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      id-token: write
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      lane: work-resolve-issue
      activity: report-outcome
      issue-number: ${{ format('{0}', github.event.issue.number) }}
      trusted-base: default-tip
      app-label: agent-ready
      reuse-branch: ${{ needs.resolve-issue.outputs.reuse-branch }}
