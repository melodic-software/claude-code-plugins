name: Maintenance Tidy Code Upkeep

on:
  push:
    branches: [main]
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: maintenance-tidy-code-upkeep-${{ github.event_name == 'push' && github.sha || 'batch' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the pushed commit's scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            /.github/scripts/maintenance-tidy-code-upkeep/
            /.node-version
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .node-version

      - name: Name the changed areas
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          [[ $BEFORE =~ ^[0-9a-f]{40}$ ]] && git fetch --quiet --no-tags --depth=1 --filter=blob:none origin "$BEFORE" || true
          node .github/scripts/maintenance-tidy-code-upkeep/upkeep.mjs detect --before "$BEFORE" --after "$AFTER"

  select-areas:
    name: Select Areas
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      areas: ${{ steps.gate.outputs.areas }}
      date: ${{ steps.gate.outputs.date }}
      spec-issue: ${{ steps.gate.outputs.spec-issue }}
      base-sha: ${{ github.sha }}
      next-leg: ${{ steps.credit.outputs.next-leg }}
      next-reason: ${{ steps.credit.outputs.next-reason }}
      credit-marker: ${{ steps.credit.outputs.marker }}
      standards-sha: ${{ steps.standards.outputs.sha }}
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .base
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}
          budget: "true"

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
          CAUSE: ${{ steps.kill.outputs.cause }}
          WHY: ${{ steps.kill.outputs.cause == 'budget' && format('the GITHUB_TOKEN budget is low until {0} (epoch seconds), which stops', steps.kill.outputs.reset) || 'the lanes kill switch stops' }}
        run: echo "::notice::${WHY} this run (reason ${REASON:-unreadable}, cause ${CAUSE:-unreadable}); nothing read or written"

      - name: Check who started the run
        id: who
        if: steps.kill.outputs.proceed == 'true' && (github.event_name == 'workflow_dispatch' || github.run_attempt != '1')
        uses: ./.base/.github/actions/check-trusted-trigger # zizmor: ignore[self-repository]
        with:
          denied-actor-ids: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          require-pr: "false"
          require-kind: human
          standards-path: ${{ steps.standards.outputs.path }}

      - name: Pick the areas
        id: gate
        if: >-
          steps.kill.outputs.proceed == 'true'
          && (steps.who.outcome == 'skipped' || steps.who.outputs.proceed == 'true')
        working-directory: .base
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/maintenance-tidy-code-upkeep/upkeep.mjs gate --root "$PWD"

      - name: Read the key's credit history
        id: credit
        if: steps.gate.outputs.proceed == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          leg: start
          role: automations
          key-job: model
          window-hours: ${{ vars.KEY_CREDIT_WINDOW_HOURS }}
          reset-at: ${{ vars.KEY_CREDIT_RESET_AT }}
          probe-minutes: "0"

      - name: Report the skipped key leg
        if: steps.credit.outputs.next-leg == 'subscription'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: skipped
          lane: maintenance-tidy-code-upkeep
          lane-id: maintenance-tidy-code-upkeep
          credential: AUTOMATIONS_CLAUDE_API_KEY
          known-failure-class: credit-stop
          handoff: "true"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  sweep-areas:
    name: Sweep Areas
    needs: select-areas
    if: needs.select-areas.outputs.proceed == 'true' && needs.select-areas.outputs.next-leg != 'subscription' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    cache-mode: read
    permissions:
      contents: read
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    outputs:
      next-leg: ${{ steps.next.outputs.next-leg }}
      next-reason: ${{ steps.next.outputs.next-reason }}
      sealed-length: ${{ steps.seal.outputs.sealed-length }}
      sealed-1: ${{ steps.seal.outputs.sealed-1 }}
      sealed-2: ${{ steps.seal.outputs.sealed-2 }}
      sealed-3: ${{ steps.seal.outputs.sealed-3 }}
      sealed-4: ${{ steps.seal.outputs.sealed-4 }}
      sealed-5: ${{ steps.seal.outputs.sealed-5 }}
      sealed-6: ${{ steps.seal.outputs.sealed-6 }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-areas.outputs.base-sha }}
          path: .base
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.select-areas.outputs.standards-sha }}

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Resolve the model
        id: models
        if: steps.kill.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: resolve-issue
          base-path: .base
          output-path: ${{ runner.temp }}/upkeep-models.json
          standards-path: ${{ steps.standards.outputs.path }}

      - name: Check the credential
        id: credential
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          leg: key
          role: automations
          credential-set: ${{ secrets.AUTOMATIONS_CLAUDE_API_KEY != '' }}
          key-off: ${{ vars.CLAUDE_API_KEYS_DISABLED == 'true' }}

      - name: Stage the plugin and the prompt
        if: steps.models.outcome == 'success'
        env:
          STAGE: ${{ runner.temp }}/upkeep-stage
          AREAS: ${{ needs.select-areas.outputs.areas }}
          DATE: ${{ needs.select-areas.outputs.date }}
          BASE_SHA: ${{ needs.select-areas.outputs.base-sha }}
          PROMPT_FILE: ${{ runner.temp }}/upkeep-prompt.md
        run: |
          mkdir -p "$STAGE/plugins"
          cp -R .base/plugins/code-tidying "$STAGE/plugins/"
          printf '{"mcpServers":{}}\n' >"$STAGE/plugins/code-tidying/.mcp.json"
          [ -z "$(find "$STAGE" -type l -print -quit)" ] || { echo "::error::a staged plugin holds a symbolic link"; exit 1; }
          node .base/.github/scripts/maintenance-tidy-code-upkeep/batch.mjs prompt

      - name: Apply the Claude managed settings
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@main

      - name: Isolate the runner
        if: steps.models.outcome == 'success'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: "true"

      - name: Check out main with history
        if: steps.models.outcome == 'success'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-areas.outputs.base-sha }}
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Prepare the working tree
        id: prepare
        if: steps.models.outcome == 'success'
        env:
          STAGE: ${{ runner.temp }}/upkeep-stage
          MODEL: ${{ steps.models.outputs.model }}
        run: bash .github/scripts/maintenance-tidy-code-upkeep/prepare-working-tree.sh

      - name: Sweep the areas
        id: run
        if: steps.prepare.outcome == 'success' && steps.credential.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 75
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@main
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: maintenance-tidy-code-upkeep
          role: automations
          prompt-file: ${{ runner.temp }}/upkeep-prompt.md
          preamble: You run unattended as the code-tidying upkeep CI lane, and no one can answer a question.
          api-key: ${{ secrets.AUTOMATIONS_CLAUDE_API_KEY }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          sandbox: "false"
          tools: |
            Read
            Grep
            Glob
            Skill
            Edit
            Write
            Bash
            WebFetch
          allowed-tools: |
            Skill
            Edit
            Write
            Bash
            WebFetch(domain:code.claude.com)
            WebFetch(domain:docs.anthropic.com)
            WebFetch(domain:raw.githubusercontent.com)
          disallowed-tools: |
            Bash(git push *)
            Bash(gh *)
            Edit(./.lane/plugins/**)
            Write(./.lane/plugins/**)
            Read(//proc/**)
            WebSearch
            mcp__*
          plugin-dirs: |
            .lane/plugins/code-tidying
          leg-timeout-minutes: "70"

      - name: Clear the trusted checkout path
        if: always() && steps.run.outcome != 'skipped'
        run: rm -rf "${GITHUB_WORKSPACE:?}/.lane-trusted"

      - name: Check out the base for the sealer
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-areas.outputs.base-sha }}
          path: .lane-trusted
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Upload the sealed transcript
        if: always() && steps.run.outputs.execution-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@main
        with:
          gate-path: .lane-trusted/lib/publish-gate.mjs
          hide-trace-ids: "true"
          execution-file: ${{ steps.run.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}

      - name: Write the key's credit-stop marker
        id: credit-marker
        if: always() && needs.select-areas.outputs.credit-marker == 'key-credit-stop-AUTOMATIONS_CLAUDE_API_KEY' && steps.run.outputs.handoff-reason == 'credit-stop'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/key-credit-stop"
          echo "$GITHUB_RUN_ID" >"$RUNNER_TEMP/key-credit-stop/run-id"

      - name: Scan the key's credit-stop marker for credentials
        id: credit-marker-scan
        if: always() && steps.credit-marker.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .lane-trusted/lib/publish-gate.mjs
          path: ${{ runner.temp }}/key-credit-stop/run-id

      - name: Upload the key's credit-stop marker
        id: credit-marker-upload
        if: (always() && steps.credit-marker.outcome == 'success') && steps.credit-marker-scan.outputs.clean == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: key-credit-stop-AUTOMATIONS_CLAUDE_API_KEY
          overwrite: true
          path: ${{ runner.temp }}/key-credit-stop/run-id
          if-no-files-found: error
          retention-days: 1

      - name: Report the key's handoff
        if: always() && steps.run.outputs.handoff == 'true'
        continue-on-error: true
        timeout-minutes: 1
        env:
          LANE_CLASS: ${{ steps.run.outputs.lane-class }}
        run: |
          case "$LANE_CLASS" in
            auth) line="the API refused AUTOMATIONS_CLAUDE_API_KEY (class auth); the owner must replace the secret, and sweep-areas-subscription sweeps on the subscription token" ;;
            *) line="AUTOMATIONS_CLAUDE_API_KEY hit a credit stop (class credit-stop); sweep-areas-subscription sweeps on the subscription token" ;;
          esac
          echo "::warning::$line"
          echo "$line" >>"$GITHUB_STEP_SUMMARY"

      - name: Record the leg
        if: always() && steps.run.outcome != 'skipped'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: ${{ steps.run.outcome }}
          execution-file: ${{ steps.run.outputs.execution-file }}
          log-file: ${{ steps.run.outputs.log-file }}
          lane: maintenance-tidy-code-upkeep
          lane-id: maintenance-tidy-code-upkeep
          credential: ${{ steps.run.outputs.credential }}
          handoff: ${{ steps.run.outputs.handoff }}
          known-failure-class: ${{ steps.run.outputs.lane-class }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          fallback-reason: ""

      - name: Seal the plan and the branches
        id: seal
        if: always() && steps.run.outcome != 'skipped'
        env:
          BASE_SHA: ${{ needs.select-areas.outputs.base-sha }}
          TRUSTED: ${{ github.workspace }}/.lane-trusted
          OUT: ${{ runner.temp }}/upkeep-out
          JOB_ID: sweep-areas
          MAX_CHUNKS: "6"
        run: |
          rm -rf "$OUT"
          mkdir -p "$OUT"
          plan=.work/upkeep-plan.json
          if [ -f "$plan" ] && [ ! -L "$plan" ]; then
            cp "$plan" "$OUT/plan.json"
          fi
          mapfile -t refs < <(git -c core.fsmonitor=false for-each-ref --format='%(refname)' 'refs/heads/chore/tidy-adhoc-*')
          if ((${#refs[@]})); then
            git -c core.fsmonitor=false bundle create "$OUT/branches.bundle" "^$BASE_SHA" "${refs[@]}" || true
          fi
          PUBLIC_KEY_FILE="$TRUSTED/.github/lane-keys/scan-carrier.pub"
          PAYLOADS=$(printf 'plan.json=%s\nbranches.bundle=%s\n' "$OUT/plan.json" "$OUT/branches.bundle")
          export PUBLIC_KEY_FILE PAYLOADS
          node "$TRUSTED/.github/actions/seal-lane-output/seal.mjs"

      - name: Pick the next leg
        id: next
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 1
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          state: ${{ steps.credential.outputs.state }}
          handoff: ${{ steps.run.outputs.handoff }}
          handoff-reason: ${{ steps.run.outputs.handoff-reason }}

      - name: Log the API budget at the end
        if: always() && steps.run.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.lane-trusted/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  sweep-areas-subscription:
    name: Sweep Areas Subscription
    needs: [select-areas, sweep-areas]
    if: >-
      ${{ !cancelled() && needs.select-areas.outputs.proceed == 'true' && github.run_attempt == '1'
      && (needs.sweep-areas.outputs.next-leg == 'subscription' || needs.select-areas.outputs.next-leg == 'subscription') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    cache-mode: read
    permissions:
      contents: read
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    outputs:
      next-leg: ${{ steps.next.outputs.next-leg }}
      next-reason: ${{ steps.next.outputs.next-reason }}
      credential-present: ${{ steps.credential.outputs.present }}
      sealed-length: ${{ steps.seal.outputs.sealed-length }}
      sealed-1: ${{ steps.seal.outputs.sealed-1 }}
      sealed-2: ${{ steps.seal.outputs.sealed-2 }}
      sealed-3: ${{ steps.seal.outputs.sealed-3 }}
      sealed-4: ${{ steps.seal.outputs.sealed-4 }}
      sealed-5: ${{ steps.seal.outputs.sealed-5 }}
      sealed-6: ${{ steps.seal.outputs.sealed-6 }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-areas.outputs.base-sha }}
          path: .base
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.select-areas.outputs.standards-sha }}

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Resolve the model
        id: models
        if: steps.kill.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: resolve-issue
          base-path: .base
          output-path: ${{ runner.temp }}/upkeep-models.json
          standards-path: ${{ steps.standards.outputs.path }}

      - name: Check the credential
        id: credential
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          leg: subscription
          role: automations
          credential-set: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN != '' }}
          fallback-set: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
          reason: ${{ needs.sweep-areas.outputs.next-reason || needs.select-areas.outputs.next-reason }}

      - name: Stage the plugin and the prompt
        if: steps.models.outcome == 'success'
        env:
          STAGE: ${{ runner.temp }}/upkeep-stage
          AREAS: ${{ needs.select-areas.outputs.areas }}
          DATE: ${{ needs.select-areas.outputs.date }}
          BASE_SHA: ${{ needs.select-areas.outputs.base-sha }}
          PROMPT_FILE: ${{ runner.temp }}/upkeep-prompt.md
        run: |
          mkdir -p "$STAGE/plugins"
          cp -R .base/plugins/code-tidying "$STAGE/plugins/"
          printf '{"mcpServers":{}}\n' >"$STAGE/plugins/code-tidying/.mcp.json"
          [ -z "$(find "$STAGE" -type l -print -quit)" ] || { echo "::error::a staged plugin holds a symbolic link"; exit 1; }
          node .base/.github/scripts/maintenance-tidy-code-upkeep/batch.mjs prompt

      - name: Apply the Claude managed settings
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@main

      - name: Isolate the runner
        if: steps.models.outcome == 'success'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: "true"

      - name: Check out main with history
        if: steps.models.outcome == 'success'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-areas.outputs.base-sha }}
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Prepare the working tree
        id: prepare
        if: steps.models.outcome == 'success'
        env:
          STAGE: ${{ runner.temp }}/upkeep-stage
          MODEL: ${{ steps.models.outputs.model }}
        run: bash .github/scripts/maintenance-tidy-code-upkeep/prepare-working-tree.sh

      - name: Sweep the areas
        id: run
        if: steps.prepare.outcome == 'success' && steps.credential.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 75
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@main
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: maintenance-tidy-code-upkeep
          role: automations
          prompt-file: ${{ runner.temp }}/upkeep-prompt.md
          preamble: You run unattended as the code-tidying upkeep CI lane, and no one can answer a question.
          subscription-token: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN }}
          fallback-ready: ${{ steps.credential.outputs.fallback-ready }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          sandbox: "false"
          tools: |
            Read
            Grep
            Glob
            Skill
            Edit
            Write
            Bash
            WebFetch
          allowed-tools: |
            Skill
            Edit
            Write
            Bash
            WebFetch(domain:code.claude.com)
            WebFetch(domain:docs.anthropic.com)
            WebFetch(domain:raw.githubusercontent.com)
          disallowed-tools: |
            Bash(git push *)
            Bash(gh *)
            Edit(./.lane/plugins/**)
            Write(./.lane/plugins/**)
            Read(//proc/**)
            WebSearch
            mcp__*
          plugin-dirs: |
            .lane/plugins/code-tidying
          leg-timeout-minutes: "70"

      - name: Clear the trusted checkout path
        if: always() && steps.run.outcome != 'skipped'
        run: rm -rf "${GITHUB_WORKSPACE:?}/.lane-trusted"

      - name: Check out the base for the sealer
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-areas.outputs.base-sha }}
          path: .lane-trusted
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Upload the sealed transcript
        if: always() && steps.run.outputs.execution-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@main
        with:
          gate-path: .lane-trusted/lib/publish-gate.mjs
          hide-trace-ids: "true"
          execution-file: ${{ steps.run.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}

      - name: Report the subscription's handoff
        if: always() && steps.run.outputs.handoff == 'true'
        continue-on-error: true
        timeout-minutes: 1
        env:
          HANDOFF_REASON: ${{ steps.run.outputs.handoff-reason }}
        run: |
          line="AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN handed off (${HANDOFF_REASON:-unknown}); sweep-areas-fallback sweeps on FALLBACK_CLAUDE_CODE_OAUTH_TOKEN"
          echo "::notice::$line"
          echo "$line" >>"$GITHUB_STEP_SUMMARY"

      - name: Record the leg
        if: always() && steps.run.outcome != 'skipped'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: ${{ steps.run.outcome }}
          execution-file: ${{ steps.run.outputs.execution-file }}
          log-file: ${{ steps.run.outputs.log-file }}
          lane: maintenance-tidy-code-upkeep
          lane-id: maintenance-tidy-code-upkeep
          credential: ${{ steps.run.outputs.credential }}
          handoff: ${{ steps.run.outputs.handoff }}
          known-failure-class: ${{ steps.run.outputs.lane-class }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          fallback-reason: ${{ steps.credential.outputs.fallback-reason }}

      - name: Seal the plan and the branches
        id: seal
        if: always() && steps.run.outcome != 'skipped'
        env:
          BASE_SHA: ${{ needs.select-areas.outputs.base-sha }}
          TRUSTED: ${{ github.workspace }}/.lane-trusted
          OUT: ${{ runner.temp }}/upkeep-out
          JOB_ID: sweep-areas-subscription
          MAX_CHUNKS: "6"
        run: |
          rm -rf "$OUT"
          mkdir -p "$OUT"
          plan=.work/upkeep-plan.json
          if [ -f "$plan" ] && [ ! -L "$plan" ]; then
            cp "$plan" "$OUT/plan.json"
          fi
          mapfile -t refs < <(git -c core.fsmonitor=false for-each-ref --format='%(refname)' 'refs/heads/chore/tidy-adhoc-*')
          if ((${#refs[@]})); then
            git -c core.fsmonitor=false bundle create "$OUT/branches.bundle" "^$BASE_SHA" "${refs[@]}" || true
          fi
          PUBLIC_KEY_FILE="$TRUSTED/.github/lane-keys/scan-carrier.pub"
          PAYLOADS=$(printf 'plan.json=%s\nbranches.bundle=%s\n' "$OUT/plan.json" "$OUT/branches.bundle")
          export PUBLIC_KEY_FILE PAYLOADS
          node "$TRUSTED/.github/actions/seal-lane-output/seal.mjs"

      - name: Pick the next leg
        id: next
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 1
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          state: ${{ steps.credential.outputs.state }}
          handoff: ${{ steps.run.outputs.handoff }}
          handoff-reason: ${{ steps.run.outputs.handoff-reason }}

      - name: Log the API budget at the end
        if: always() && steps.run.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.lane-trusted/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  sweep-areas-fallback:
    name: Sweep Areas Fallback
    needs: [select-areas, sweep-areas-subscription]
    if: >-
      ${{ !cancelled() && needs.select-areas.outputs.proceed == 'true' && github.run_attempt == '1'
      && (needs.sweep-areas-subscription.outputs.next-leg == 'fallback' || needs.sweep-areas-subscription.outputs.credential-present == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    cache-mode: read
    permissions:
      contents: read
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    outputs:
      sealed-length: ${{ steps.seal.outputs.sealed-length }}
      sealed-1: ${{ steps.seal.outputs.sealed-1 }}
      sealed-2: ${{ steps.seal.outputs.sealed-2 }}
      sealed-3: ${{ steps.seal.outputs.sealed-3 }}
      sealed-4: ${{ steps.seal.outputs.sealed-4 }}
      sealed-5: ${{ steps.seal.outputs.sealed-5 }}
      sealed-6: ${{ steps.seal.outputs.sealed-6 }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-areas.outputs.base-sha }}
          path: .base
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.select-areas.outputs.standards-sha }}

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Resolve the model
        id: models
        if: steps.kill.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: resolve-issue
          base-path: .base
          output-path: ${{ runner.temp }}/upkeep-models.json
          standards-path: ${{ steps.standards.outputs.path }}

      - name: Check the credential
        id: credential
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          leg: fallback
          role: automations
          credential-set: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
          reason: ${{ needs.sweep-areas-subscription.outputs.next-reason }}

      - name: Stage the plugin and the prompt
        if: steps.models.outcome == 'success'
        env:
          STAGE: ${{ runner.temp }}/upkeep-stage
          AREAS: ${{ needs.select-areas.outputs.areas }}
          DATE: ${{ needs.select-areas.outputs.date }}
          BASE_SHA: ${{ needs.select-areas.outputs.base-sha }}
          PROMPT_FILE: ${{ runner.temp }}/upkeep-prompt.md
        run: |
          mkdir -p "$STAGE/plugins"
          cp -R .base/plugins/code-tidying "$STAGE/plugins/"
          printf '{"mcpServers":{}}\n' >"$STAGE/plugins/code-tidying/.mcp.json"
          [ -z "$(find "$STAGE" -type l -print -quit)" ] || { echo "::error::a staged plugin holds a symbolic link"; exit 1; }
          node .base/.github/scripts/maintenance-tidy-code-upkeep/batch.mjs prompt

      - name: Apply the Claude managed settings
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@main

      - name: Isolate the runner
        if: steps.models.outcome == 'success'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: "true"

      - name: Check out main with history
        if: steps.models.outcome == 'success'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-areas.outputs.base-sha }}
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Prepare the working tree
        id: prepare
        if: steps.models.outcome == 'success'
        env:
          STAGE: ${{ runner.temp }}/upkeep-stage
          MODEL: ${{ steps.models.outputs.model }}
        run: bash .github/scripts/maintenance-tidy-code-upkeep/prepare-working-tree.sh

      - name: Sweep the areas
        id: run
        if: steps.prepare.outcome == 'success' && steps.credential.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 75
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@main
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: maintenance-tidy-code-upkeep
          role: automations
          prompt-file: ${{ runner.temp }}/upkeep-prompt.md
          preamble: You run unattended as the code-tidying upkeep CI lane, and no one can answer a question.
          fallback-token: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          sandbox: "false"
          tools: |
            Read
            Grep
            Glob
            Skill
            Edit
            Write
            Bash
            WebFetch
          allowed-tools: |
            Skill
            Edit
            Write
            Bash
            WebFetch(domain:code.claude.com)
            WebFetch(domain:docs.anthropic.com)
            WebFetch(domain:raw.githubusercontent.com)
          disallowed-tools: |
            Bash(git push *)
            Bash(gh *)
            Edit(./.lane/plugins/**)
            Write(./.lane/plugins/**)
            Read(//proc/**)
            WebSearch
            mcp__*
          plugin-dirs: |
            .lane/plugins/code-tidying
          leg-timeout-minutes: "70"

      - name: Clear the trusted checkout path
        if: always() && steps.run.outcome != 'skipped'
        run: rm -rf "${GITHUB_WORKSPACE:?}/.lane-trusted"

      - name: Check out the base for the sealer
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-areas.outputs.base-sha }}
          path: .lane-trusted
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Upload the sealed transcript
        if: always() && steps.run.outputs.execution-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@main
        with:
          gate-path: .lane-trusted/lib/publish-gate.mjs
          hide-trace-ids: "true"
          execution-file: ${{ steps.run.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}

      - name: Record the leg
        if: always() && steps.run.outcome != 'skipped'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: ${{ steps.run.outcome }}
          execution-file: ${{ steps.run.outputs.execution-file }}
          log-file: ${{ steps.run.outputs.log-file }}
          lane: maintenance-tidy-code-upkeep
          lane-id: maintenance-tidy-code-upkeep
          credential: ${{ steps.run.outputs.credential }}
          handoff: ${{ steps.run.outputs.handoff }}
          known-failure-class: ${{ steps.run.outputs.lane-class }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          fallback-reason: ${{ steps.credential.outputs.fallback-reason }}

      - name: Seal the plan and the branches
        id: seal
        if: always() && steps.run.outcome != 'skipped'
        env:
          BASE_SHA: ${{ needs.select-areas.outputs.base-sha }}
          TRUSTED: ${{ github.workspace }}/.lane-trusted
          OUT: ${{ runner.temp }}/upkeep-out
          JOB_ID: sweep-areas-fallback
          MAX_CHUNKS: "6"
        run: |
          rm -rf "$OUT"
          mkdir -p "$OUT"
          plan=.work/upkeep-plan.json
          if [ -f "$plan" ] && [ ! -L "$plan" ]; then
            cp "$plan" "$OUT/plan.json"
          fi
          mapfile -t refs < <(git -c core.fsmonitor=false for-each-ref --format='%(refname)' 'refs/heads/chore/tidy-adhoc-*')
          if ((${#refs[@]})); then
            git -c core.fsmonitor=false bundle create "$OUT/branches.bundle" "^$BASE_SHA" "${refs[@]}" || true
          fi
          PUBLIC_KEY_FILE="$TRUSTED/.github/lane-keys/scan-carrier.pub"
          PAYLOADS=$(printf 'plan.json=%s\nbranches.bundle=%s\n' "$OUT/plan.json" "$OUT/branches.bundle")
          export PUBLIC_KEY_FILE PAYLOADS
          node "$TRUSTED/.github/actions/seal-lane-output/seal.mjs"

      - name: Log the API budget at the end
        if: always() && steps.run.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.lane-trusted/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  scan:
    name: Scan
    needs: [select-areas, sweep-areas, sweep-areas-subscription, sweep-areas-fallback]
    if: ${{ !cancelled() && (needs.sweep-areas-fallback.result != 'skipped' && needs.sweep-areas-fallback.outputs.sealed-length || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result != 'skipped' && needs.sweep-areas-subscription.outputs.sealed-length || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result == 'skipped' && needs.sweep-areas.outputs.sealed-length || '') != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    cache-mode: read
    environment:
      name: pr-pipeline-scan-carrier
      deployment: false
    permissions:
      contents: read
    outputs:
      clean: ${{ steps.upload.outcome == 'success' }}
      branches: ${{ steps.check.outputs.branches }}
      synthetic: ${{ steps.check.outputs.synthetic }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      plan-sha256: ${{ steps.hash.outputs.plan }}
      bundle-sha256: ${{ steps.hash.outputs.bundle }}
    env:
      API_BUDGET_TOKEN: github-token
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-areas.outputs.base-sha }}
          path: .base
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Read the scan-carrier key id
        id: key
        run: |
          read -r _ id _ <.base/.github/lane-keys/scan-carrier.pub || true
          echo "id=$id" >>"$GITHUB_OUTPUT"

      - name: Open the sweep-areas job's sealed payloads
        id: open
        uses: ./.base/.github/actions/open-lane-output # zizmor: ignore[self-repository]
        with:
          private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}
          expected-key-ids: ${{ steps.key.outputs.id }}
          job-id: ${{ needs.sweep-areas-fallback.result != 'skipped' && 'sweep-areas-fallback' || needs.sweep-areas-subscription.result != 'skipped' && 'sweep-areas-subscription' || 'sweep-areas' }}
          max-bytes: |
            plan.json=262144
            branches.bundle=393216
          directory: ${{ runner.temp }}/scan-in
          sealed-length: ${{ needs.sweep-areas-fallback.result != 'skipped' && needs.sweep-areas-fallback.outputs.sealed-length || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result != 'skipped' && needs.sweep-areas-subscription.outputs.sealed-length || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result == 'skipped' && needs.sweep-areas.outputs.sealed-length || '' }}
          sealed-1: ${{ needs.sweep-areas-fallback.result != 'skipped' && needs.sweep-areas-fallback.outputs.sealed-1 || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result != 'skipped' && needs.sweep-areas-subscription.outputs.sealed-1 || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result == 'skipped' && needs.sweep-areas.outputs.sealed-1 || '' }}
          sealed-2: ${{ needs.sweep-areas-fallback.result != 'skipped' && needs.sweep-areas-fallback.outputs.sealed-2 || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result != 'skipped' && needs.sweep-areas-subscription.outputs.sealed-2 || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result == 'skipped' && needs.sweep-areas.outputs.sealed-2 || '' }}
          sealed-3: ${{ needs.sweep-areas-fallback.result != 'skipped' && needs.sweep-areas-fallback.outputs.sealed-3 || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result != 'skipped' && needs.sweep-areas-subscription.outputs.sealed-3 || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result == 'skipped' && needs.sweep-areas.outputs.sealed-3 || '' }}
          sealed-4: ${{ needs.sweep-areas-fallback.result != 'skipped' && needs.sweep-areas-fallback.outputs.sealed-4 || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result != 'skipped' && needs.sweep-areas-subscription.outputs.sealed-4 || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result == 'skipped' && needs.sweep-areas.outputs.sealed-4 || '' }}
          sealed-5: ${{ needs.sweep-areas-fallback.result != 'skipped' && needs.sweep-areas-fallback.outputs.sealed-5 || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result != 'skipped' && needs.sweep-areas-subscription.outputs.sealed-5 || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result == 'skipped' && needs.sweep-areas.outputs.sealed-5 || '' }}
          sealed-6: ${{ needs.sweep-areas-fallback.result != 'skipped' && needs.sweep-areas-fallback.outputs.sealed-6 || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result != 'skipped' && needs.sweep-areas-subscription.outputs.sealed-6 || needs.sweep-areas-fallback.result == 'skipped' && needs.sweep-areas-subscription.result == 'skipped' && needs.sweep-areas.outputs.sealed-6 || '' }}

      - name: Check the plan and write the diffs
        id: check
        env:
          IN: ${{ runner.temp }}/scan-in
          OUT: ${{ runner.temp }}/scan-out
          RECORD_DIR: ${{ runner.temp }}/scan-record
          AREAS: ${{ needs.select-areas.outputs.areas }}
          DATE: ${{ needs.select-areas.outputs.date }}
          BASE_SHA: ${{ needs.select-areas.outputs.base-sha }}
          SPEC_ISSUE: ${{ needs.select-areas.outputs.spec-issue }}
          REPO_DIR: ${{ github.workspace }}/.base
        run: node .base/.github/scripts/maintenance-tidy-code-upkeep/batch.mjs scan

      - name: Scan the plan for credentials
        id: scan-plan
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/scan-in/plan.json

      - name: Scan the branch diffs for credentials
        id: scan-diffs
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/scan-in/diffs.txt

      - name: Scan the pull request text for credentials
        id: scan-publish
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/scan-in/publish.txt

      - name: Upload the sweep record
        if: steps.check.outputs.recorded != '0' && steps.check.outputs.recorded != ''
        uses: actions/upload-artifact@v7
        with:
          name: tidy-code-upkeep-sweeps
          path: ${{ runner.temp }}/scan-record/sweeps.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error

      - name: Hash the plan and the branches
        id: hash
        if: >-
          steps.scan-plan.outputs.clean == 'true' && steps.scan-diffs.outputs.clean == 'true'
          && steps.scan-publish.outputs.clean == 'true'
        env:
          OUT: ${{ runner.temp }}/scan-out
        run: |
          sum=$(sha256sum <"$OUT/plan.json")
          echo "plan=${sum%% *}" >>"$GITHUB_OUTPUT"
          if [ -f "$OUT/branches.bundle" ]; then
            sum=$(sha256sum <"$OUT/branches.bundle")
            echo "bundle=${sum%% *}" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload the plan and the branches
        id: upload
        if: steps.hash.outcome == 'success' && steps.check.outputs.branches != '0'
        uses: actions/upload-artifact@v7
        with:
          name: maintenance-tidy-code-upkeep-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-out/
          retention-days: 1
          if-no-files-found: error

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  push-branches:
    name: Push Branches
    needs: [select-areas, scan]
    if: ${{ !cancelled() && needs.scan.outputs.clean == 'true' && needs.scan.outputs.branches != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    cache-mode: read
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    outputs:
      skip-reason: ${{ steps.lane-token.outputs.skip-reason }}
      heads: ${{ steps.push.outputs.heads }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-areas.outputs.base-sha }}
          path: .base
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.select-areas.outputs.standards-sha }}

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Resolve the config
        id: config
        if: steps.kill.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: maintenance-tidy-code-upkeep
          activity: apply-upkeep-branches
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          standards-path: ${{ steps.standards.outputs.path }}

      - name: Download the plan and the branches
        if: steps.config.outcome == 'success' && steps.config.outputs.applies == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact-id }}
          path: ${{ runner.temp }}/plan

      - name: Check the plan and the branches
        id: verify
        if: steps.config.outcome == 'success' && steps.config.outputs.applies == 'true'
        env:
          DIR: ${{ runner.temp }}/plan
          PLAN_SHA256: ${{ needs.scan.outputs.plan-sha256 }}
          BUNDLE_SHA256: ${{ needs.scan.outputs.bundle-sha256 }}
        run: |
          for pair in "plan.json:$PLAN_SHA256" "branches.bundle:$BUNDLE_SHA256"; do
            file="$DIR/${pair%%:*}" want="${pair#*:}"
            if [ -L "$file" ] || [ ! -f "$file" ] || [ "$(stat -c %s "$file")" -gt 1048576 ]; then
              echo "::error::the plan artifact holds no ${pair%%:*} of at most 1 MiB"
              exit 1
            fi
            sum=$(sha256sum <"$file")
            if ! [[ $want =~ ^[0-9a-f]{64}$ ]] || [ "${sum%% *}" != "$want" ]; then
              echo "::error::${pair%%:*} does not match the SHA-256 the scan job recorded"
              exit 1
            fi
          done

      - name: Request the lane token
        id: lane-token
        if: steps.verify.outcome == 'success'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: maintenance-tidy-code-upkeep
          activity: apply-upkeep-branches
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}
          kill-switch-ok: true

      - name: Push the branches
        id: push
        if: steps.lane-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          COUNT_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: lanes-app
          AREAS: ${{ needs.select-areas.outputs.areas }}
          DATE: ${{ needs.select-areas.outputs.date }}
          BASE_SHA: ${{ needs.select-areas.outputs.base-sha }}
          PLAN_FILE: ${{ runner.temp }}/plan/plan.json
          BUNDLE_FILE: ${{ runner.temp }}/plan/branches.bundle
          SYNTHETIC: ${{ needs.scan.outputs.synthetic }}
          REPO_DIR: ${{ github.workspace }}/.base
        run: node .base/.github/scripts/maintenance-tidy-code-upkeep/batch.mjs push

      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: bash .base/.github/scripts/lib/revoke-lane-token.sh

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: lanes-app github-token

  publish:
    name: Publish
    needs: [select-areas, scan, push-branches]
    if: >-
      ${{ !cancelled() && needs.push-branches.result == 'success'
      && needs.push-branches.outputs.skip-reason == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    cache-mode: read
    permissions:
      contents: read
      id-token: write
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-areas.outputs.base-sha }}
          path: .base
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.select-areas.outputs.standards-sha }}

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Resolve the config
        id: config
        if: steps.kill.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: maintenance-tidy-code-upkeep
          activity: publish-upkeep-prs
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          standards-path: ${{ steps.standards.outputs.path }}

      - name: Download the plan
        if: steps.config.outcome == 'success' && steps.config.outputs.applies == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact-id }}
          path: ${{ runner.temp }}/plan

      - name: Check the plan
        id: verify
        if: steps.config.outcome == 'success' && steps.config.outputs.applies == 'true'
        env:
          FILE: ${{ runner.temp }}/plan/plan.json
          WANT: ${{ needs.scan.outputs.plan-sha256 }}
        run: |
          if [ -L "$FILE" ] || [ ! -f "$FILE" ] || [ "$(stat -c %s "$FILE")" -gt 1048576 ]; then
            echo "::error::the plan artifact holds no plan.json of at most 1 MiB"
            exit 1
          fi
          sum=$(sha256sum <"$FILE")
          if ! [[ $WANT =~ ^[0-9a-f]{64}$ ]] || [ "${sum%% *}" != "$WANT" ]; then
            echo "::error::plan.json does not match the SHA-256 the scan job recorded"
            exit 1
          fi

      - name: Request the lane token
        id: lane-token
        if: steps.verify.outcome == 'success'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: maintenance-tidy-code-upkeep
          activity: publish-upkeep-prs
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}
          kill-switch-ok: true

      - name: Open the pull requests
        if: steps.lane-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          API_BUDGET_TOKEN: lanes-app
          AREAS: ${{ needs.select-areas.outputs.areas }}
          DATE: ${{ needs.select-areas.outputs.date }}
          BASE_SHA: ${{ needs.select-areas.outputs.base-sha }}
          PLAN_FILE: ${{ runner.temp }}/plan/plan.json
          HEADS: ${{ needs.push-branches.outputs.heads }}
          SPEC_ISSUE: ${{ needs.select-areas.outputs.spec-issue }}
          REPO_DIR: ${{ github.workspace }}/.base
        run: node .base/.github/scripts/maintenance-tidy-code-upkeep/batch.mjs publish

      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: bash .base/.github/scripts/lib/revoke-lane-token.sh

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: lanes-app github-token
