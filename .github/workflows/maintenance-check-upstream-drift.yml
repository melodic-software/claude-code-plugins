name: maintenance-check-upstream-drift

# Weekly drift check for every skill that vendors an upstream: runs each skill's
# own update script in its read-only check mode and fails the run when one
# reports drift, so GitHub's failed-workflow notification reaches the
# maintainers. Informational: not in pr-require-checks.yml and not behind
# `ci-status`, so nothing here can block a merge. It holds a read-only token
# and no secret, and it never opens an issue or a pull request; applying an
# update stays a reviewed maintainer step through each skill's update action.
#
# Every script follows one exit-code contract: 0 no drift, 1 upstream drift,
# 2 unverifiable (a prerequisite, the network, or usage). A CLI that is not
# installed on the runner is reported but is not drift.
#
# Monday 10:29 UTC sits clear of the other scheduled runs.

on:
  schedule:
    - cron: "29 10 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  check-upstream-drift:
    name: drift (${{ matrix.skill }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill: playwright:playwright
            script: plugins/playwright/skills/playwright/scripts/update.sh
            args: --check
          - skill: firecrawl:update
            script: plugins/firecrawl/skills/update/scripts/update.sh
            args: --check
          - skill: playbooks:boris
            script: plugins/playbooks/skills/boris/scripts/update.sh
            args: --check
          - skill: playbooks:skill-authoring
            script: plugins/playbooks/skills/skill-authoring/scripts/update.sh
            args: --check
          - skill: dometrain:sync
            script: plugins/dometrain/skills/sync/scripts/update.sh
            args: report
          - skill: context7:lookup
            script: plugins/context7/skills/lookup/scripts/update.sh
            args: ""
          - skill: user-interface:write-css
            script: plugins/user-interface/scripts/check-good-css-drift.sh
            args: --check
          - skill: user-interface:write-animation
            script: plugins/user-interface/scripts/check-emilkowalski-drift.sh
            args: --check
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Run the drift check
        env:
          SKILL: ${{ matrix.skill }}
          SCRIPT: ${{ matrix.script }}
          ARGS: ${{ matrix.args }}
        run: |
          set +e
          # shellcheck disable=SC2086 # ARGS is empty or one word from the matrix
          bash "$SCRIPT" $ARGS >report.txt 2>&1
          code=$?
          set -e
          {
            echo "### ${SKILL}"
            echo
            echo "Exit code ${code}. Script: \`${SCRIPT}\`"
            echo
            echo '```text'
            head -c 60000 report.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) ;;
            1)
              echo "::error title=Upstream drift::${SKILL} has drifted from its upstream. Run its update action to review and apply."
              exit 1
              ;;
            2) echo "::warning title=Drift unverifiable::${SKILL} could not be checked (prerequisite, network or usage failure, exit 2)." ;;
            *)
              echo "::error title=Drift check failed::${SKILL} exited ${code}, outside the 0/1/2 drift-check contract."
              exit 1
              ;;
          esac
