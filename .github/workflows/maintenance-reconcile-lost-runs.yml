        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plan.outputs.record-6 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-7
        if: >-
          steps.plan.outputs.record-7 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 7
        if: >-
          (steps.plan.outputs.record-7 != '') && steps.scan-record-7.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plan.outputs.record-7 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-8
        if: >-
          steps.plan.outputs.record-8 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 8
        if: >-
          (steps.plan.outputs.record-8 != '') && steps.scan-record-8.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plan.outputs.record-8 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-9
        if: >-
          steps.plan.outputs.record-9 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 9
        if: >-
          (steps.plan.outputs.record-9 != '') && steps.scan-record-9.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plan.outputs.record-9 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
