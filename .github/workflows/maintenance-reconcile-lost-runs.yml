name: Maintenance Reconcile Lost Runs

# A CI run on the PR's current head that ended failure only from an outside
# outage (each failed job hit its time limit, failed in an install step, or
# lost its runner: infra-failure.mjs) has its failed jobs re-run once, at
# attempt 1 only, 15 minutes after the attempt ended, and only while
# status.npmjs.org and githubstatus.com both show indicator none; at attempt 2
# pr-unblock's fix-ci takes it. A run with
# any other failure has its failed jobs re-run once, at attempt 1 only, so a
# flaky test the diff did not cause can pass. pr-unblock's fix-ci waits only on
# a re-run already queued or going, or on an infra-only first failure's re-run
# while it is due (infra-failure.mjs RERUN_DUE_MINUTES). A pr-require-checks
# run whose failed jobs (Mark Lanes, or CI Status alone) failed only where the
# GITHUB_TOKEN hit its rate-limit floor, by the rate guard's own refusal text,
# has its failed jobs re-run once the same way, placed before lane runs.
#
# A pr-require-checks run that passed on its first attempt is re-run once,
# recorded, when the head's pr-verify pass predates a change to its spec (an
# issue edit or a new spec comment), so pr-verify judges the head again
# instead of leaving it at verify:spec-changed. So is one inside GitHub's
# re-run window on a pull request past the gate's TOO_OLD_DAYS whose head has
# no counted verdict, so a fresh pass clears verify:too-old.
#
# A lanes App pull request whose newest pr-require-checks run failed, on its
# first attempt, only in ci-status, which noted that the lanes kill switch was
# on, has that ci-status re-run, recorded as above, by the first run after the
# switch is lifted, whatever the run's age; it takes a place under the cap. A
# run at a later attempt is left to a person.
# Any pull request's ci-status that failed only on reviews still running or
# not yet started is re-run the same way once both reviews' newest runs on
# the head finished at least PENDING_BACKOFF_MINUTES ago.
#
# An intake-triage run an issue event started whose first attempt failed only
# in its intake-label-needs-triage job (a rate limit, most often) left the
# issue without its floor label; its failed jobs are re-run once, taking no
# place under the cap. A run where any other job failed is left alone, so no
# triage or broker job runs again. When that failure kept the issue from a
# status label, the hourly triage sweep in maintenance-audit-lane-runs.yml
# re-dispatches intake and adds needs-triage after 2 dispatches leave it
# untriaged; otherwise, and once a dispatch triages it, the issue stays without
# the floor label.
#
# pr-verify's and pr-review-main's trigger checks trust a re-run github-actions[bot] starts only
# through this run's record of it: the plan step names an artifact
# reconcile-rerun-<run id>-<attempt>-<head sha>, naming the attempt the re-run starts, for each
# pr-verify or pr-review-main run it will re-run, for each pr-require-checks run whose
# re-run makes its attempt 2, or attempt 3 when a spec changed again after a
# recorded re-run's pass (pr-verify runs after it; the cap is
# RECONCILER_ATTEMPT_CAP in check-trusted-trigger.mjs), and for each hosted review run a kill switch or the
# upstream-status gate stopped, the upload steps below write them, and only then
# does the act step re-run those runs. That no other run can upload into this run's artifacts is
# UNVERIFIED: GitHub does not document that it scopes the runtime upload token
# to its own run, and the REST API has no endpoint that creates an artifact.
# A forged record still needs a github-actions[bot] re-run, at the attempt it names, of the
# lane, and the check's actor checks still apply
# (.github/actions/check-trusted-trigger/README.md).
#
# It does nothing while githubstatus.com shows Actions as anything but
# operational, or the page cannot be read, so it adds no load mid-incident. At
# most 3 re-runs are in flight at once, auto-merge PRs first, beside at most
# 12 re-runs a pass of hosted reviews and pr-verify runs a defer gate stopped,
# each once its window's reset is a minute past, and its writes
# are at least a second apart. A lost pull_request review or refine lane run is listed in
# the run summary for a person: those lanes, or the lanes token broker, refuse
# a re-run github-actions[bot] starts. No model, and no PR code is checked out.
# Rules: https://github.com/melodic-software/claude-code-plugins/blob/main/.github/scripts/maintenance-reconcile-lost-runs/reconcile.mjs.
#
# How to stop it: set the organization or repository lanes kill-switch
# variable to anything but "false".

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run the pass even when a full pass finished under MIN_GAP_MINUTES ago
        type: boolean
        default: false

permissions: {}

concurrency:
  group: maintenance-reconcile-lost-runs
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  reconcile:
    name: Reconcile
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # list runs and re-run a lost run
      checks: read # a cut job's annotations: whether it lost its runner; a held pr-verify run's notice
      contents: read # check out main
      pull-requests: read # list the open PRs
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Check out the run's main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          node-version-file: .base/.node-version

      # One pass per token window, just after its reset
      # (https://github.com/melodic-software/claude-code-plugins/issues/17460).
      - name: Check the token window's reset
        id: reset
        continue-on-error: true
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: node .base/.github/scripts/maintenance-reconcile-lost-runs/reset-tick.mjs

      - name: Check the kill switch
        id: kill
        if: steps.reset.outputs.due != 'false'
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}
          # Starts new work: also stop on a low GITHUB_TOKEN budget.
          budget: "true"

      # The base config's limits.api, in resolve-config's output shape, for
      # the pacer; a failed read leaves rate-limits.json's defaults.
      - name: Read the pace override from the base config
        if: steps.reset.outputs.due != 'false' && steps.reset.outputs.post-reset != 'true'
        continue-on-error: true
        run: |
          yq -o=json '{"limits": {"api": (.limits.api // {})}}' .base/docs/conventions/pr-pipeline.yaml >"$RUNNER_TEMP/pace-config.json"

      # A schedule tick skips its work while the GITHUB_TOKEN pool's remaining
      # at reset, projected at this window's burn rate, is under limits.api
      # github-token pace (pr-pipeline.yaml over rate-limits.json; 0 is off),
      # and only when the previous scheduled run marked a clean pass, so the timer
      # lanes slow to half cadence before the breaker stops every lane. A pass
      # that deferred recovery work for want of a place marks none, so the tick
      # after it always runs. Any
      # other event, or a read that fails, runs as before
      # (.github/actions/log-api-budget/pace.mjs).
      - name: Pace the tick on the GITHUB_TOKEN burn rate
        id: pace
        if: steps.reset.outputs.due != 'false' && steps.reset.outputs.post-reset != 'true'
        continue-on-error: true
        env:
          RESOLVED_CONFIG: ${{ runner.temp }}/pace-config.json
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PACE_WORK_STEP: Mark this tick's work done
        run: node .base/.github/actions/log-api-budget/pace.mjs

      - name: Skip a run right after a full pass
        id: recent
        if: steps.reset.outputs.due != 'false'
        continue-on-error: true
        env:
          MIN_GAP_MINUTES: "60"
          PASS_AFTER: ${{ steps.reset.outputs.pass-after }}
          FORCE: ${{ inputs.force }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: node .base/.github/scripts/maintenance-reconcile-lost-runs/recent-pass.mjs

      - name: Find lost runs
        id: plan
        if: steps.reset.outputs.due != 'false' && steps.pace.outputs.paced != 'true' && steps.recent.outputs.skip != 'true'
        env:
          MODE: plan
          PLAN_PATH: ${{ runner.temp }}/reconcile-plan.json
          RECORD_PATH: ${{ runner.temp }}/reconcile-record/record.json
          SETTLED_PATH: ${{ runner.temp }}/reconcile-settled/settled.json
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KILL_SWITCH: ${{ steps.kill.outputs.proceed == 'true' && 'proceed' || '' }}
          # Read as the review callers read them: only `true`, in any case, stops the lane.
          CLAUDE_REVIEW_DISABLED: ${{ vars.CLAUDE_REVIEW_DISABLED }}
          CLAUDE_SECURITY_REVIEW_DISABLED: ${{ vars.CLAUDE_SECURITY_REVIEW_DISABLED }}
          TRUSTED_ACTORS_PATH: .base/.github/standards/trusted-actors/trusted-actors.json
        run: |
          mkdir -p "$RUNNER_TEMP/reconcile-record" "$RUNNER_TEMP/reconcile-settled"
          # pr-verify.yml's resolver inputs, for the spec-changed re-runs.
          VERIFY_AUTHORS=$(yq '.merge."verify-authors" // "lane"' .base/docs/conventions/pr-pipeline.yaml)
          LANE_IDENTITY=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          SPEC_FROM_BODY_APPS=$(yq '.adoption."spec-from-body-apps" // [] | .[]' .base/docs/conventions/pr-pipeline.yaml)
          export VERIFY_AUTHORS LANE_IDENTITY SPEC_FROM_BODY_APPS
          node .base/.github/scripts/maintenance-reconcile-lost-runs/reconcile.mjs

      # One record per pr-verify or pr-review-main run, per pr-require-checks run made attempt
      # 2, and per stopped hosted review run the act step re-runs, uploaded
      # first. A failed upload fails the job, so that run is not re-run.
      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          steps.plan.outputs.record-1 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 1
        if: >-
          (steps.plan.outputs.record-1 != '') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-1 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-upload-2
        if: >-
          steps.plan.outputs.record-2 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 2
        if: >-
          (steps.plan.outputs.record-2 != '') && steps.scan-upload-2.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-2 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-upload-3
        if: >-
          steps.plan.outputs.record-3 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 3
        if: >-
          (steps.plan.outputs.record-3 != '') && steps.scan-upload-3.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-3 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-4
        if: >-
          steps.plan.outputs.record-4 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 4
        if: >-
          (steps.plan.outputs.record-4 != '') && steps.scan-record-4.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-4 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-5
        if: >-
          steps.plan.outputs.record-5 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 5
        if: >-
          (steps.plan.outputs.record-5 != '') && steps.scan-record-5.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-5 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-6
        if: >-
          steps.plan.outputs.record-6 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 6
        if: >-
          (steps.plan.outputs.record-6 != '') && steps.scan-record-6.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-6 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-7
        if: >-
          steps.plan.outputs.record-7 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 7
        if: >-
          (steps.plan.outputs.record-7 != '') && steps.scan-record-7.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-7 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-8
        if: >-
          steps.plan.outputs.record-8 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 8
        if: >-
          (steps.plan.outputs.record-8 != '') && steps.scan-record-8.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-8 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-9
        if: >-
          steps.plan.outputs.record-9 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 9
        if: >-
          (steps.plan.outputs.record-9 != '') && steps.scan-record-9.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-9 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-10
        if: >-
          steps.plan.outputs.record-10 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 10
        if: >-
          (steps.plan.outputs.record-10 != '') && steps.scan-record-10.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-10 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-11
        if: >-
          steps.plan.outputs.record-11 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 11
        if: >-
          (steps.plan.outputs.record-11 != '') && steps.scan-record-11.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-11 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-12
        if: >-
          steps.plan.outputs.record-12 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 12
        if: >-
          (steps.plan.outputs.record-12 != '') && steps.scan-record-12.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-12 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-13
        if: >-
          steps.plan.outputs.record-13 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 13
        if: >-
          (steps.plan.outputs.record-13 != '') && steps.scan-record-13.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-13 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-14
        if: >-
          steps.plan.outputs.record-14 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 14
        if: >-
          (steps.plan.outputs.record-14 != '') && steps.scan-record-14.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-14 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-15
        if: >-
          steps.plan.outputs.record-15 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 15
        if: >-
          (steps.plan.outputs.record-15 != '') && steps.scan-record-15.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-15 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      # A Verdict re-run uploads a pr-feedback-deferred record, so this fixed
      # name goes first: the dispatch tick reads the per-head records only
      # while it is listed (feedback-dispatch.mjs DEFERRAL_MARKER). Kept a day
      # longer than the record, and a failed upload skips the act step, so no
      # record outlives its marker. The plan holds run ids, PR numbers and SHAs.
      - name: Mark the deferred verdicts
        if: steps.plan.outputs.deferral == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-feedback-deferral
          path: ${{ runner.temp }}/reconcile-plan.json
          if-no-files-found: error
          retention-days: 2

      - name: Re-run lost runs
        if: steps.reset.outputs.due != 'false' && steps.pace.outputs.paced != 'true' && steps.recent.outputs.skip != 'true'
        env:
          MODE: act
          PLAN_PATH: ${{ runner.temp }}/reconcile-plan.json
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .base/.github/scripts/maintenance-reconcile-lost-runs/reconcile.mjs

      # The runs this pass settled for good, which the next pass skips
      # (reconcile.mjs SETTLED_ARTIFACT). A missing upload costs the next pass
      # a full read, never a re-run.
      - name: Scan the upload for credentials
        id: scan-upload-4
        if: >-
          ${{ !cancelled() && steps.plan.outcome == 'success' }}
        # A hit withholds only the carry: the next pass reads every run.
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@07df326dec55d0740f9b0dd885a2d09c09620deb # v0.82.0
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-settled/settled.json

      - name: Carry the settled runs
        if: >-
          (!cancelled() && steps.plan.outcome == 'success') && steps.scan-upload-4.outputs.clean == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reconcile-settled-runs
          path: ${{ runner.temp }}/reconcile-settled/settled.json
          if-no-files-found: ignore
          retention-days: 1

      # A green pass whose plan read every listing and deferred no recovery
      # work (reconcile.mjs writes clean; a failed listing, the kill switch,
      # an Actions outage or a deferred place other than a flake re-run does
      # not). The pacer paces the next scheduled tick only after this step
      # (.github/actions/log-api-budget/pace.mjs).
      - name: Mark this tick's work done
        if: steps.plan.outputs.clean == 'true'
        run: echo "the reconciler read every listing"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token
