name: maintenance-reconcile-lost-runs

# Re-runs PR CI and verify runs a GitHub outage ended without a result, so
# nobody has to re-run them by hand. Every 30 minutes it looks at each open,
# non-draft pull request into main from a branch of this repository, and at
# the last day's pr-verify and pr-review-main runs. A CI workflow whose newest run on the PR's
# current head, or a pr-verify run, ended cancelled, timed_out or
# startup_failure, on its first attempt, is re-run once with this job's own
# token. The attempt number is the record: a run at attempt 2 was already
# re-run and is never touched again. A pr-verify run is also re-run when its
# first attempt failed: a judgment that broke after it started, or a run the
# lanes kill switch stopped, which fails so that it is re-run once the switch
# is off. A pr-verify run whose verdict write started (it runs only when the
# judgment succeeded) is not re-run, even when the write or upload failed, so
# a head is never judged twice; the summary names the hold. A pr-verify run none of whose jobs started is not
# re-run: a newer run for the same head judges it. A pr-review-main run is
# taken the same way: one that ended failure with no lane's verdict write
# started (every credential leg stopped) is re-run once, recorded.
#
# A CI run on the PR's current head that ended failure only from an outside
# outage (each failed job hit its time limit, failed in an install step, or
# lost its runner: infra-failure.mjs) has its failed jobs re-run once, at
# attempt 1 only, 15 minutes after the attempt ended, and only while
# status.npmjs.org and githubstatus.com both show indicator none; at attempt 2
# pr-unblock's fix-ci takes it. A run with
# any other failure has its failed jobs re-run once, at attempt 1 only, so a
# flaky test the diff did not cause can pass. pr-unblock's fix-ci waits only on
# a re-run already queued or going, or on an infra-only first failure's re-run
# while it is due (infra-failure.mjs RERUN_DUE_MINUTES).
#
# A pr-require-checks run that passed on its first attempt is re-run once,
# recorded, when the head's pr-verify pass predates a change to its spec (an
# issue edit or a new spec comment), so pr-verify judges the head again
# instead of leaving it at verify:spec-changed.
#
# A lanes App pull request whose newest pr-require-checks run failed, on its
# first attempt, only in ci-status, which noted that the lanes kill switch was
# on, has that ci-status re-run, recorded as above, by the first run after the
# switch is lifted, whatever the run's age; it takes a place under the cap. A
# run at a later attempt is left to a person. Any pull request's ci-status that
# failed the same way only on a `pr-unblock/*` status is re-run the same way
# once no such status fails the head (the lane that stopped cleared it); a
# status post starts no run, and a failed re-run of it is only a warning.
#
# A hosted review run a kill switch stopped, on a head whose newest
# pr-require-checks run failed only in ci-status with its note of that stop, is
# re-run once, recorded, once neither the lanes switch, the lane's own switch
# nor the upstream gate would stop it again; its completion re-runs ci-status
# (pr-feedback-dispatch.yml rerun-ci-status). One lane per head per pass, and a
# place under the cap, whatever the run's age up to GitHub's 30 days.
#
# An intake-triage run an issue event started whose first attempt failed only
# in its intake-label-needs-triage job (a rate limit, most often) left the
# issue without its floor label; its failed jobs are re-run once, taking no
# place under the cap. A run where any other job failed is left alone, so no
# triage or broker job runs again. When that failure kept the issue from a
# status label, the hourly triage sweep in maintenance-audit-lane-runs.yml
# re-dispatches intake and adds needs-triage after 2 dispatches leave it
# untriaged; otherwise, and once a dispatch triages it, the issue stays without
# the floor label.
#
# pr-verify's and pr-review-main's trigger checks trust a re-run github-actions[bot] starts only
# through this run's record of it: the plan step names an artifact
# reconcile-rerun-<run id>-2-<head sha> for each pr-verify or pr-review-main run it will re-run,
# for each pr-require-checks run whose re-run makes its attempt 2 (pr-verify
# runs after it), and for each hosted review run a kill switch or the
# upstream-status gate stopped, the upload steps below write them, and only then
# does the act step re-run those runs. That no other run can upload into this run's artifacts is
# UNVERIFIED: GitHub does not document that it scopes the runtime upload token
# to its own run, and the REST API has no endpoint that creates an artifact.
# A forged record still needs a github-actions[bot] attempt-2 re-run of the
# lane, and the check's actor checks still apply
# (.github/actions/check-trusted-trigger/README.md).
#
# It does nothing while githubstatus.com shows Actions as anything but
# operational, or the page cannot be read, so it adds no load mid-incident. At
# most 3 re-runs are in flight at once, auto-merge PRs first, and its writes
# are at least a second apart. A lost pull_request review or refine lane run is listed in
# the run summary for a person: those lanes, or the lanes token broker, refuse
# a re-run github-actions[bot] starts. No model, and no PR code is checked out.
# Rules: .github/scripts/maintenance-reconcile-lost-runs/reconcile.mjs.
#
# How to stop it: set the organization or repository lanes kill-switch
# variable to anything but "false".

on:
  schedule:
    - cron: "4,34 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: maintenance-reconcile-lost-runs
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # list runs and re-run a lost run
      checks: read # a cut job's annotations: whether it lost its runner
      contents: read # check out main
      pull-requests: read # list the open PRs
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Check out the run's main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # The base config's limits.api, in resolve-config's output shape, for
      # the pacer; a failed read leaves rate-limits.json's defaults.
      - name: Read the pace override from the base config
        continue-on-error: true
        run: |
          yq -o=json '{"limits": {"api": (.limits.api // {})}}' .base/docs/conventions/pr-pipeline.yaml >"$RUNNER_TEMP/pace-config.json"

      # A schedule tick skips its work while the GITHUB_TOKEN pool's remaining
      # at reset, projected at this window's burn rate, is under limits.api
      # github-token pace (pr-pipeline.yaml over rate-limits.json; 0 is off),
      # on even run numbers only, so the timer lanes slow to half cadence
      # before the breaker stops every lane. Any other event, or a read that
      # fails, runs as before (.github/actions/log-api-budget/pace.mjs).
      - name: Pace the tick on the GITHUB_TOKEN burn rate
        id: pace
        continue-on-error: true
        env:
          RESOLVED_CONFIG: ${{ runner.temp }}/pace-config.json
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: node .base/.github/actions/log-api-budget/pace.mjs

      - name: Find lost runs
        id: plan
        if: steps.pace.outputs.paced != 'true'
        env:
          MODE: plan
          PLAN_PATH: ${{ runner.temp }}/reconcile-plan.json
          RECORD_PATH: ${{ runner.temp }}/reconcile-record/record.json
          SETTLED_PATH: ${{ runner.temp }}/reconcile-settled/settled.json
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KILL_SWITCH: ${{ steps.kill.outputs.proceed == 'true' && 'proceed' || '' }}
          # Read as the review callers read them: only `true`, in any case, stops the lane.
          CLAUDE_REVIEW_DISABLED: ${{ vars.CLAUDE_REVIEW_DISABLED }}
          CLAUDE_SECURITY_REVIEW_DISABLED: ${{ vars.CLAUDE_SECURITY_REVIEW_DISABLED }}
          TRUSTED_ACTORS_PATH: .base/.github/standards/trusted-actors/trusted-actors.json
        run: |
          mkdir -p "$RUNNER_TEMP/reconcile-record" "$RUNNER_TEMP/reconcile-settled"
          # pr-verify.yml's resolver inputs, for the spec-changed re-runs.
          VERIFY_AUTHORS=$(yq '.merge."verify-authors" // "lane"' .base/docs/conventions/pr-pipeline.yaml)
          LANE_IDENTITY=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          SPEC_FROM_BODY_APPS=$(yq '.adoption."spec-from-body-apps" // [] | .[]' .base/docs/conventions/pr-pipeline.yaml)
          export VERIFY_AUTHORS LANE_IDENTITY SPEC_FROM_BODY_APPS
          node .base/.github/scripts/maintenance-reconcile-lost-runs/reconcile.mjs

      # One record per pr-verify or pr-review-main run, per pr-require-checks run made attempt
      # 2, and per stopped hosted review run the act step re-runs, uploaded
      # first. A failed upload fails the job, so that run is not re-run.
      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          steps.plan.outputs.record-1 != ''
        uses: ./.base/.github/actions/scan-upload
        with:
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 1
        if: >-
          (steps.plan.outputs.record-1 != '') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-1 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-upload-2
        if: >-
          steps.plan.outputs.record-2 != ''
        uses: ./.base/.github/actions/scan-upload
        with:
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 2
        if: >-
          (steps.plan.outputs.record-2 != '') && steps.scan-upload-2.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-2 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-upload-3
        if: >-
          steps.plan.outputs.record-3 != ''
        uses: ./.base/.github/actions/scan-upload
        with:
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 3
        if: >-
          (steps.plan.outputs.record-3 != '') && steps.scan-upload-3.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.record-3 }}
          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Re-run lost runs
        if: steps.pace.outputs.paced != 'true'
        env:
          MODE: act
          PLAN_PATH: ${{ runner.temp }}/reconcile-plan.json
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .base/.github/scripts/maintenance-reconcile-lost-runs/reconcile.mjs

      # The runs this pass settled for good, which the next pass skips
      # (reconcile.mjs SETTLED_ARTIFACT). A missing upload costs the next pass
      # a full read, never a re-run.
      - name: Scan the upload for credentials
        id: scan-upload-4
        if: >-
          ${{ !cancelled() && steps.plan.outcome == 'success' }}
        uses: ./.base/.github/actions/scan-upload
        with:
          path: ${{ runner.temp }}/reconcile-settled/settled.json

      - name: Carry the settled runs
        if: >-
          (!cancelled() && steps.plan.outcome == 'success') && steps.scan-upload-4.outputs.clean == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reconcile-settled-runs
          path: ${{ runner.temp }}/reconcile-settled/settled.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token
