          path: ${{ runner.temp }}/reconcile-record/record.json
          if-no-files-found: error
          retention-days: 1

      - name: Scan the upload for credentials
        id: scan-record-6
        if: >-
          steps.plan.outputs.record-6 != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/reconcile-record/record.json

      - name: Record re-run 6
        if: >-
