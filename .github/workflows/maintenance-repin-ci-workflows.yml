name: Maintenance Repin CI Workflows

# Moves the melodic-software/ci-workflows action pins, the eval legs' checkout
# refs and the pr-run-activity.md link to the newest ci-workflows release, in
# one pull request armed to auto-merge. Dependabot ignores
# melodic-software/ci-workflows/*; scripts/repin-ci-workflows.sh does the
# rewrite and scripts/repin-ci-workflows.test.sh covers it.
on:
  workflow_dispatch:
  schedule:
    - cron: "47 14 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  repin:
    name: Repin
    permissions:
      contents: read
    # The App key lives only in this environment, which admits main.
    environment:
      name: claude-lanes-repin
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HAS_APP_CREDENTIAL: >-
        ${{ secrets.CLAUDE_LANES_REPIN_APP_CLIENT_ID != ''
            && secrets.CLAUDE_LANES_REPIN_APP_PRIVATE_KEY != '' }}
    steps:
      # Resolved before checkout, so a dispatch from another branch neither
      # runs that branch's script nor retargets the pull request.
      - name: Resolve the default branch
        id: default-branch
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          name="$(git -C "$RUNNER_TEMP" ls-remote --symref "https://github.com/${GITHUB_REPOSITORY}.git" HEAD |
            awk '$1 == "ref:" && $3 == "HEAD" { sub("refs/heads/", "", $2); print $2 }')"
          [[ -n "$name" ]] || { echo "::error::Could not resolve the default branch." >&2; exit 1; }
          echo "name=${name}" >>"$GITHUB_OUTPUT"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.default-branch.outputs.name }}
          persist-credentials: false

      - name: Resolve the newest ci-workflows release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/repin-ci-workflows.sh resolve

      - name: Read the current pin
        id: current
        run: bash scripts/repin-ci-workflows.sh current

      - name: Re-pin the ci-workflows actions
        id: repin
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_SHA: ${{ steps.current.outputs.sha }}
          OLD_TAG: ${{ steps.current.outputs.tag }}
          NEW_SHA: ${{ steps.release.outputs.sha }}
          NEW_TAG: ${{ steps.release.outputs.tag }}
        run: bash scripts/repin-ci-workflows.sh apply "$OLD_SHA" "$OLD_TAG" "$NEW_SHA" "$NEW_TAG"

      - name: Report the missing re-pin credential
        if: steps.repin.outputs.changed == 'true' && env.HAS_APP_CREDENTIAL != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: echo "::warning::The ci-workflows pin is behind ${TAG}, but CLAUDE_LANES_REPIN_APP_CLIENT_ID and CLAUDE_LANES_REPIN_APP_PRIVATE_KEY are not set in the claude-lanes-repin environment, so no pull request was opened."

      - name: Mint the re-pin App token
        id: app-token
        if: steps.repin.outputs.changed == 'true' && env.HAS_APP_CREDENTIAL == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CLAUDE_LANES_REPIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_LANES_REPIN_APP_PRIVATE_KEY }}
          # With no owner and no repositories, the token covers this repository only.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Open or update the re-pin pull request
        id: pull-request
        if: steps.repin.outputs.changed == 'true' && env.HAS_APP_CREDENTIAL == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: chore/repin-ci-workflows
          base: ${{ steps.default-branch.outputs.name }}
          add-paths: |
            .github/workflows
            docs/conventions/pr-pipeline/pr-run-activity.md
          commit-message: |
            chore(ci): re-pin ci-workflows actions to ${{ steps.release.outputs.tag }}

            Co-Authored-By: claude-lanes-repin <noreply@github.com>
          title: "chore(ci): re-pin ci-workflows actions to ${{ steps.release.outputs.tag }}"
          body: |
            No related issue: automated re-pin to the newest ci-workflows release

            ## Summary

            Moves every `melodic-software/ci-workflows/.github/actions/...` pin
            in `.github/workflows/`, the eval legs' ci-workflows checkout refs and
            the `pr-run-activity.md` link from `${{ steps.current.outputs.tag }}`
            to `${{ steps.release.outputs.tag }}` (`${{ steps.release.outputs.sha }}`).
            `pr-check-managed-files-hosted.yml` is left to the standards sync.

            ## Fix

            Opened by `.github/workflows/maintenance-repin-ci-workflows.yml`
            through `scripts/repin-ci-workflows.sh`, which refuses a release that
            does not contain the current pin.

            ## Verification

            - `scripts/repin-ci-workflows.test.sh` covers the rewrite.
            - `callers.test.mjs` and `parity.test.mjs` check the launchers and the
              pr-verify replay against run-claude-cli at the new pin.

            ## Related

            - https://github.com/melodic-software/ci-workflows/releases/tag/${{ steps.release.outputs.tag }}

      - name: Arm auto-merge on the re-pin pull request
        if: steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        run: |
          . .github/actions/log-api-budget/api-budget.bash
          api_budget_wrap_gh repin-app
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token repin-app
