name: PR Review Hosted

on:
  pull_request:
    # No pull_request workflow runs while a PR has a merge conflict, so synchronize must re-review.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  check-kill-switch:
    name: Check Kill Switch
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the default branch for the kill-switch action
    outputs:
      proceed: ${{ steps.kill.outputs.proceed == 'true' && steps.upstream.outputs.degraded != 'true' && vars.CLAUDE_REVIEW_DISABLED != 'true' && 'true' || 'false' }}
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/check-kill-switch/
            /.github/actions/check-upstream-status/
            /.github/scripts/maintenance-reconcile-lost-runs/component-status.mjs
            /.node-version
            /.github/actions/log-api-budget/
            /docs/conventions/pr-pipeline.yaml
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Read the defer override from the base config
        continue-on-error: true
        run: |
          yq -o=json '{"limits": {"api": (.limits.api // {})}}' .base/docs/conventions/pr-pipeline.yaml >"$RUNNER_TEMP/defer-config.json"

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}
          defer: "true"
          defer-job: review
          resolved-config: ${{ runner.temp }}/defer-config.json

      - name: Check upstream status
        id: upstream
        if: steps.kill.outputs.proceed == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.base/.github/actions/check-upstream-status # zizmor: ignore[self-repository]

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true' || vars.CLAUDE_REVIEW_DISABLED == 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
          CAUSE: ${{ steps.kill.outputs.cause }}
          RESET: ${{ steps.kill.outputs.reset }}
          LANE_SWITCH: ${{ vars.CLAUDE_REVIEW_DISABLED }}
        run: |
          echo "::notice::a kill switch stops this review (lanes: ${REASON:-unreadable} cause=${CAUSE:-unreadable} reset=${RESET:-none}, CLAUDE_REVIEW_DISABLED: ${LANE_SWITCH:-unset})"

      - name: Stop on upstream status
        if: steps.kill.outputs.proceed == 'true' && steps.upstream.outputs.degraded == 'true' && vars.CLAUDE_REVIEW_DISABLED != 'true'
        env:
          REASON: ${{ steps.upstream.outputs.reason }}
        run: |
          echo "::error::an upstream outage stops this review (${REASON:-unknown}); the lost-run reconciler re-runs it once GitHub Actions is operational"
          exit 1

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  pr-review:
    name: PR Review
    needs: [check-kill-switch]
    if: github.event.pull_request.draft == false && needs.check-kill-switch.outputs.proceed == 'true'
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    uses: melodic-software/ci-workflows/.github/workflows/pr-review-cli.yml@main
    with:
      lane: code
      publish: comments
      lane-transcript-public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
      key-credit-window-hours: ${{ vars.KEY_CREDIT_WINDOW_HOURS }}
      key-credit-reset-at: ${{ vars.KEY_CREDIT_RESET_AT }}
      allowed-bot-sender-ids: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
      allowed-author-ids: '153232337'
      docs-only-paths: ''
      generated-copies: scripts/shared-copies.txt
      generated-data: scripts/review-generated-data.txt
      media-paths: scripts/review-media-paths.txt
      binary-allowlist: scripts/review-binary-allowlist.txt
      hold-label: needs-human
      # BEGIN hold-floor hold-paths: generated by scripts/sync-hold-floor.py
      hold-paths: |
        **/CODEOWNERS
        docs/conventions/pr-pipeline.yaml
        **/.gitmodules
        plugins/source-control/skills/babysit-prs/scripts/diff_risk.py
        plugins/source-control/skills/babysit-prs/scripts/babysit_check_inputs.py
