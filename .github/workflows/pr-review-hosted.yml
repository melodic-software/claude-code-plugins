name: pr-review-hosted

# Locally owned: the `claude-review-hosted-caller` component of
# melodic-software/standards (components/claude-lanes-hosted/claude-review.yml)
# is `locally-owned` for this repository in distribution/sync-manifest.yml, so
# this copy can add the resolve-model and kill-switch jobs below. It differs
# from the component in those jobs and these comments.
#
# Thin caller for the org's pr-review-cli reusable, lane `code`. The reusable
# owns the launcher, the credential order (the reviews role's API key, then
# its subscription token after a handoff) and the secret-handling model; per
# its header, this caller owns the triggers, concurrency, and the GITHUB_TOKEN
# permission grant (a called workflow can only downgrade the caller's grant,
# never elevate it).
#
# The reusable skips fork PRs (they receive no secrets and a read-only token),
# Dependabot, and every `[bot]` actor whose sender id is not in
# `allowed-bot-sender-ids` (below), so none is reviewed by design. On a public
# repository that means the lane reviews only pull requests from branches of
# this repository: fork and Dependabot pull requests get no secrets.
#
# RUNNER PLACEMENT: every job of the reusable runs on ubuntu-24.04; it takes
# no runner input. The job id `pr-review` keeps the check
# `pr-review / claude-review-status`.
#
# No ruleset requires this check. ci-status, the one required check, needs
# its success on the head and fails while the hold label is on (github-iac
# ADR 0017).

on:
  pull_request:
    # `synchronize` re-reviews every push, including the push that resolves a
    # merge conflict: GitHub runs no pull_request workflow while a PR
    # conflicts with its base, so a once-per-PR trigger set silently skipped
    # any PR that conflicted when it opened. The reusable narrows a push's
    # review to the files changed since the lane's last completed review and
    # skips a push that changed none of the PR's files; opened, reopened and
    # ready_for_review review the whole PR.
    #
    # Re-running the job does NOT review a newer head: a re-run replays the
    # ORIGINAL event payload. Push to review the current head.
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

# Per-PR group: a newer event for the same PR waits for the running review
# instead of cancelling it, because the guardrails merge guard reads a
# cancelled run as red. The security caller does the same. The group is the
# `${{ github.workflow }}`-prefixed canonical form the standards
# `concurrency-policy` component requires.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # The review's model, turns and effort: the review-code route of the models
  # block in docs/conventions/pr-pipeline.yaml, read from the default branch,
  # never the PR head, so a PR cannot choose the model through its own
  # pr-pipeline.yaml (an edit to this file still shows in its diff). When
  # this job fails, the review still runs on the reusable's own defaults.
  resolve-model:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the default branch for the models block
    outputs:
      claude-args: ${{ steps.models.outputs.claude-args }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          persist-credentials: false
          # resolve-config imports the two check-* action modules.
          sparse-checkout: |
            /.github/actions/check-kill-switch/
            /.github/actions/check-trusted-trigger/
            /.github/actions/resolve-config/
            /.github/CODEOWNERS
            /.github/standards/github-actions-conventions/vocabulary.json
            /.node-version
            /docs/conventions/pr-pipeline.yaml
            /docs/conventions/pr-pipeline/
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      - name: Resolve the review model
        id: models
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: review-code
          output-path: ${{ runner.temp }}/review-models.json

      # The reusable takes Claude args only; a subagent model would be dropped.
      - name: Refuse a subagent model
        env:
          SETTINGS_JSON: ${{ steps.models.outputs.settings-json }}
        run: |
          if [ -n "$SETTINGS_JSON" ]; then
            echo "::error::the review-code profile sets subagent-model, which pr-review-cli.yml does not support"
            exit 1
          fi

  # The pinned reusable reads no kill switch, so this caller does. The org
  # and repository switches fail closed (check-kill-switch); the lane's own
  # CLAUDE_REVIEW_DISABLED stops it only at `true`, as github-iac's README
  # documents for the review-lane switches. A failed job leaves proceed empty,
  # which also stops the review.
  kill-switch:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the default branch for the kill-switch action
    outputs:
      proceed: ${{ steps.kill.outputs.proceed == 'true' && vars.CLAUDE_REVIEW_DISABLED != 'true' && 'true' || 'false' }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/check-kill-switch/
            /.node-version
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true' || vars.CLAUDE_REVIEW_DISABLED == 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
          LANE_SWITCH: ${{ vars.CLAUDE_REVIEW_DISABLED }}
        run: |
          echo "::notice::a kill switch stops this review (lanes: ${REASON:-unreadable}, CLAUDE_REVIEW_DISABLED: ${LANE_SWITCH:-unset})"

  pr-review:
    needs: [resolve-model, kill-switch]
    # A draft is work in progress and does not spend a review; the
    # ready_for_review trigger above is what delivers one when it is ready.
    if: ${{ !cancelled() && github.event.pull_request.draft == false && needs.kill-switch.outputs.proceed == 'true' }}
    # The model jobs narrow this to contents: read and pull-requests: read;
    # only the reusable's status job (the claude-review-status check) writes.
    permissions:
      contents: read
      pull-requests: write   # the review, its inline comments and the lane's
                             # reviewed-head marker comment
    uses: melodic-software/ci-workflows/.github/workflows/pr-review-cli.yml@914264587c35692c15e05c965103426eec18d1f0 # v0.65.6
    with:
      lane: code
      publish: comments
      # Empty unless resolve-model succeeded, so a failed job's partial output
      # never reaches the review.
      model-args: ${{ needs.resolve-model.result == 'success' && needs.resolve-model.outputs.claude-args || '' }}
      # Bot senders this lane reviews, by numeric user id: the
      # automation-lanes App, so a commit it pushes to a pull request is
      # reviewed. Where the repository does not set this variable the value is
      # empty and the reusable reviews no bot.
      allowed-bot-sender-ids: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
      # People whose closing issues the review reads in full, by numeric user
      # id: the `human` entries of .github/standards/trusted-actors/trusted-actors.json
      # (standards components/trusted-actors/trusted-actors.json). Empty
      # would replace every person's closing issue with a placeholder. The
      # bot ids in allowed-bot-sender-ids above also mark issues those bots
      # wrote as trusted closing-issue context.
      allowed-author-ids: '153232337'
      # Empty, as pr-review.yml's default was: the code lane reviews every
      # change, documentation included.
      docs-only-paths: ''
      # A hold adds this label and a `claude-lane-hold` marker comment; ci-status
      # fails while the label is on. The review holds only for its hold
      # classes; a changed file matching hold-paths holds as trust-gate
      # whatever the review says. Keep both lists equal in the two callers.
      hold-label: needs-human
      hold-paths: |
        .github/standards/trusted-actors/**
        .github/actions/check-trusted-trigger/**
        **/CODEOWNERS
        **/.gitmodules
    # The reviews role's key runs first; its subscription token only after the
    # key hands off. Named secrets only, never `secrets: inherit`.
    secrets:
      CLAUDE_API_KEY: ${{ secrets.REVIEWS_CLAUDE_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.REVIEWS_CLAUDE_CODE_OAUTH_TOKEN }}
