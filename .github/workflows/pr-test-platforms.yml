name: PR Test Platforms

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9,16 * * *'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  select-tests-windows:
    name: Select Tests Windows
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      jobs: ${{ steps.plan.outputs.windows_jobs }}
      steps: ${{ steps.plan.outputs.windows_steps }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch base
        uses: $/.github/actions/download-full-history
      - name: Plan the Windows steps the change selects
        id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="${BASE_REF:+origin/$BASE_REF}"
          [ -n "$base" ] || echo "::notice::A $GITHUB_EVENT_NAME run with no usable base runs every Windows step."
          rc=0
          timeout 10m scripts/plan-test-lanes.sh ${base:+--base "$base"} >>"$GITHUB_OUTPUT" || rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::error::The planner ran past 10 minutes, so no Windows or macOS step ran. This is a failed plan, not an empty one."
          fi
          exit "$rc"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: $/.github/actions/log-api-budget
        with:
          tokens: github-token

  test-windows-rename-1:
    name: Test Windows Rename 1
    needs: [select-tests-windows]
    if: ${{ contains(fromJSON(needs.select-tests-windows.outputs.jobs || '[]'), 'test-windows-rename-1') }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install pinned shfmt
        uses: $/.github/actions/setup-pinned-shfmt
      - name: Test the file-name rename executor on Windows (shard 1 of 2)
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/docs-naming/skills/realign-file-names/scripts/apply-rename.test.sh')
        env:
          APPLY_RENAME_TEST_SHARD: "1"
        run: bash plugins/docs-naming/skills/realign-file-names/scripts/apply-rename.test.sh
      - name: Test run-guards on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/guardrails/hooks/run-guards.test.sh')
        run: bash plugins/guardrails/hooks/run-guards.test.sh

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: $/.github/actions/log-api-budget
        with:
          tokens: github-token

  test-windows-rename-2:
    name: Test Windows Rename 2
    needs: [select-tests-windows]
    if: ${{ contains(fromJSON(needs.select-tests-windows.outputs.jobs || '[]'), 'test-windows-rename-2') }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Test the file-name rename executor on Windows (shard 2 of 2)
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/docs-naming/skills/realign-file-names/scripts/apply-rename.test.sh')
        env:
          APPLY_RENAME_TEST_SHARD: "2"
        run: bash plugins/docs-naming/skills/realign-file-names/scripts/apply-rename.test.sh
      - name: Test the piped early-exit grep gate on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'scripts/check-pipefail-grep-q.test.sh')
        run: bash scripts/check-pipefail-grep-q.test.sh
      - name: Test the drive-root litter detector on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'scripts/check-drive-root-litter.test.sh')
        run: bash scripts/check-drive-root-litter.test.sh
      - name: Test the MSYS-to-Windows emit helper on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'scripts/emit-windows-path.test.sh')
        run: bash scripts/emit-windows-path.test.sh
      - name: Install Pester 5.7
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/machine-health/skills/audit/scripts/run-tests.ps1')
        shell: pwsh
        run: |
          $found = Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.7.0' } | Select-Object -First 1
          if (-not $found) {
            Install-Module Pester -MinimumVersion 5.7.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
      - name: Run machine-health Pester suites
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/machine-health/skills/audit/scripts/run-tests.ps1')
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File plugins/machine-health/skills/audit/scripts/run-tests.ps1

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: $/.github/actions/log-api-budget
        with:
          tokens: github-token

  test-windows-secrets:
    name: Test Windows Secrets
    needs: [select-tests-windows]
    if: ${{ contains(fromJSON(needs.select-tests-windows.outputs.jobs || '[]'), 'test-windows-secrets') }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Test secret-pattern-detection on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/guardrails/hooks/secret-pattern-detection.test.sh')
        run: bash plugins/guardrails/hooks/secret-pattern-detection.test.sh
      - name: Test coverage-manifest on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/guardrails/hooks/coverage-manifest.test.sh')
        run: bash plugins/guardrails/hooks/coverage-manifest.test.sh
      - name: Test the skill-visibility audit on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/harness-ops/skills/audit-skill-visibility/scripts/audit_skill_visibility.test.sh')
        run: bash plugins/harness-ops/skills/audit-skill-visibility/scripts/audit_skill_visibility.test.sh
      - name: Run disk-hygiene GuardTests on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/disk-hygiene/skills/clean/scripts/test_hygiene.py')
        working-directory: plugins/disk-hygiene/skills/clean/scripts
        run: python -m unittest -v test_hygiene.GuardTests

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: $/.github/actions/log-api-budget
        with:
          tokens: github-token

  test-windows-guards:
    name: Test Windows Guards
    needs: [select-tests-windows]
    if: ${{ contains(fromJSON(needs.select-tests-windows.outputs.jobs || '[]'), 'test-windows-guards') }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Test hardcoded-path-check on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/guardrails/hooks/hardcoded-path-check.test.sh')
        run: bash plugins/guardrails/hooks/hardcoded-path-check.test.sh
      - name: Install pinned shfmt
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/guardrails/hooks/block-root-delete-target-resolve.test.sh')
        uses: $/.github/actions/setup-pinned-shfmt
      - name: Test block-root-delete-target-resolve on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/guardrails/hooks/block-root-delete-target-resolve.test.sh')
        run: bash plugins/guardrails/hooks/block-root-delete-target-resolve.test.sh
      - name: Test block-main-checkout-edit on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/guardrails/hooks/block-main-checkout-edit.test.sh')
        run: bash plugins/guardrails/hooks/block-main-checkout-edit.test.sh
      - name: Test the plugin-profiles settings-file rename retry on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/plugin-profiles/lib/atomic-file.test.mjs')
        run: node --test plugins/plugin-profiles/lib/atomic-file.test.mjs

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: $/.github/actions/log-api-budget
        with:
          tokens: github-token

  test-windows-hooks:
    name: Test Windows Hooks
    needs: [select-tests-windows]
    if: ${{ contains(fromJSON(needs.select-tests-windows.outputs.jobs || '[]'), 'test-windows-hooks') }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install pinned shfmt
        uses: $/.github/actions/setup-pinned-shfmt
      - name: Test the markdown-format hook on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/markdown-format/hooks/markdown-format.test.sh')
        run: bash plugins/markdown-format/hooks/markdown-format.test.sh
      - name: Test cloud-bootstrap plugin accounting on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), '.claude/hooks/cloud-bootstrap-plugins.test.sh')
        run: bash .claude/hooks/cloud-bootstrap-plugins.test.sh
      - name: Test the guardrails exec-bash launcher on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/guardrails/hooks/exec-bash.test.sh')
        run: bash plugins/guardrails/hooks/exec-bash.test.sh
      - name: Install the pinned YAML reader
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'scripts/check-exec-form-windows-probe.sh')
        run: python -m pip install --disable-pip-version-check "pyyaml==$(awk '/^pyyaml==/ { sub(/^pyyaml==/, ""); sub(/[[:space:]\\].*$/, ""); print; exit }' .github/requirements-ci.txt)"
      - name: Probe Windows exec-form args delivery
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'scripts/check-exec-form-windows-probe.sh')
        env:
          EXEC_FORM_WINDOWS_PROBE_REQUIRE_SPAWN: "1"
        run: bash scripts/check-exec-form-windows-probe.sh
      - name: Test the exec-form bash launcher resolver on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'lib/exec-bash.resolver.test.mjs')
        run: node --test lib/exec-bash.resolver.test.mjs
      - name: Test the guards' snapshot writer on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'lib/write-snapshot.test.mjs')
        run: node --test lib/write-snapshot.test.mjs
      - name: Test the developer-experience pointer-line helper on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/developer-experience/skills/setup/scripts/pointer-line.test.sh')
        run: bash plugins/developer-experience/skills/setup/scripts/pointer-line.test.sh
      - name: Test the install-python-deps hook on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'lib/install-python-deps.test.sh')
        run: bash lib/install-python-deps.test.sh

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: $/.github/actions/log-api-budget
        with:
          tokens: github-token

  test-windows-lib:
    name: Test Windows Lib
    needs: [select-tests-windows]
    if: ${{ contains(fromJSON(needs.select-tests-windows.outputs.jobs || '[]'), 'test-windows-lib') }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install pinned shfmt
        uses: $/.github/actions/setup-pinned-shfmt
      - name: Test block-windows-drive-tmp on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/guardrails/hooks/block-windows-drive-tmp.test.sh')
        run: bash plugins/guardrails/hooks/block-windows-drive-tmp.test.sh
      - name: Run shared lib tests on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'lib/hook-utils.test.sh')
        run: bash lib/hook-utils.test.sh
      - name: Test the code-metrics Python resolver on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/code-metrics/scripts/python-resolve.test.sh')
        run: bash plugins/code-metrics/scripts/python-resolve.test.sh
      - name: Test remove-comments detect on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/code-tidying/skills/remove-comments/scripts/detect.test.sh')
        run: bash plugins/code-tidying/skills/remove-comments/scripts/detect.test.sh
      - name: Run the gaming DLSS 5 selftest on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/gaming/skills/dlss5/scripts/Invoke-Dlss5Mod.ps1')
        run: pwsh -NoProfile -NonInteractive -File plugins/gaming/skills/dlss5/scripts/Invoke-Dlss5Mod.ps1 -Verb selftest
      - name: Install Pester 5.7
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/kindle-dedrm/skills/manage/tests')
        shell: pwsh
        run: |
          $found = Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.7.0' } | Select-Object -First 1
          if (-not $found) {
            Install-Module Pester -MinimumVersion 5.7.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
      - name: Run kindle-dedrm Pester suites
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/kindle-dedrm/skills/manage/tests')
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'plugins/kindle-dedrm/skills/manage/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: $/.github/actions/log-api-budget
        with:
          tokens: github-token

  test-windows-worktree:
    name: Test Windows Worktree
    needs: [select-tests-windows]
    if: ${{ contains(fromJSON(needs.select-tests-windows.outputs.jobs || '[]'), 'test-windows-worktree') }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test the worktree claim helper on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/source-control/scripts/worktree-claim.test.sh')
        run: bash plugins/source-control/scripts/worktree-claim.test.sh
      - name: Test the worktree fact record on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/source-control/scripts/lib/worktree-facts.test.sh')
        run: bash plugins/source-control/scripts/lib/worktree-facts.test.sh
      - name: Test the worktree root scan on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/source-control/scripts/worktree-root-scan.test.sh')
        run: bash plugins/source-control/scripts/worktree-root-scan.test.sh
      - name: Test the repo-sweep tick script on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/playbooks/skills/repo-sweep/scripts/tick.test.sh')
        run: bash plugins/playbooks/skills/repo-sweep/scripts/tick.test.sh
      - name: Test the repo-sweep state script on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/playbooks/skills/repo-sweep/scripts/state.test.sh')
        run: bash plugins/playbooks/skills/repo-sweep/scripts/state.test.sh
      - name: Set up Python
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/planning/shared/tests/test_server.py')
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Test the shared session API on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/planning/shared/tests/test_server.py')
        run: python -m unittest discover -v -s plugins/planning/shared/tests -p 'test_s*.py'
      - name: Test the shared session tunnel on Windows
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/planning/shared/tests/test_server.py')
        run: python -m unittest discover -v -s plugins/planning/shared/tests -p 'test_tunnel.py'

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: $/.github/actions/log-api-budget
        with:
          tokens: github-token

  test-macos-planning-shared:
    name: Test Macos Planning Shared
    needs: [select-tests-windows]
    if: ${{ contains(fromJSON(needs.select-tests-windows.outputs.jobs || '[]'), 'test-macos-planning-shared') }}
    runs-on: macos-26
    timeout-minutes: 32
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Test test_cfdns on macOS
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/planning/shared/tests/test_cfdns.py')
        timeout-minutes: 2
        run: python -m unittest discover -v -s plugins/planning/shared/tests -p 'test_cfdns.py'
      - name: Test test_load on macOS
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/planning/shared/tests/test_load.py')
        timeout-minutes: 2
        run: python -m unittest discover -v -s plugins/planning/shared/tests -p 'test_load.py'
      - name: Test test_owner_ops on macOS
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/planning/shared/tests/test_owner_ops.py')
        timeout-minutes: 2
        run: python -m unittest discover -v -s plugins/planning/shared/tests -p 'test_owner_ops.py'
      - name: Test test_people_proposals on macOS
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/planning/shared/tests/test_people_proposals.py')
        timeout-minutes: 2
        run: python -m unittest discover -v -s plugins/planning/shared/tests -p 'test_people_proposals.py'
      - name: Test test_schema_shapes on macOS
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/planning/shared/tests/test_schema_shapes.py')
        timeout-minutes: 2
        run: python -m unittest discover -v -s plugins/planning/shared/tests -p 'test_schema_shapes.py'
      - name: Test test_server on macOS
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/planning/shared/tests/test_server.py')
        timeout-minutes: 7
        run: python -m unittest discover -v -s plugins/planning/shared/tests -p 'test_server.py'
      - name: Test test_session on macOS
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/planning/shared/tests/test_session.py')
        timeout-minutes: 2
        run: python -m unittest discover -v -s plugins/planning/shared/tests -p 'test_session.py'
      - name: Test test_share on macOS
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/planning/shared/tests/test_share.py')
        timeout-minutes: 7
        run: python -m unittest discover -v -s plugins/planning/shared/tests -p 'test_share.py'
      - name: Test test_tunnel on macOS
        if: contains(fromJSON(needs.select-tests-windows.outputs.steps), 'plugins/planning/shared/tests/test_tunnel.py')
        timeout-minutes: 3
        run: python -m unittest discover -v -s plugins/planning/shared/tests -p 'test_tunnel.py'

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: $/.github/actions/log-api-budget
        with:
          tokens: github-token
