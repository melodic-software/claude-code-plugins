        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@6b9c640bf209c0c7e76f1111c5d18c96707348a2 # 6b9c640 2026-11-02
        with:
          outcome: ${{ steps.rate.outcome }}
          execution-file: ${{ steps.rate.outputs.execution-file }}
          log-file: ${{ steps.rate.outputs.log-file }}
          lane: pr-merge-risk
          lane-id: pr-merge-risk
          step-started-at: ${{ steps.prompt.outputs.started-at }}
          step-timeout-minutes: 25
          credential: ${{ steps.rate.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.rate.outputs.lane-class }}
          handoff: ${{ steps.rate.outputs.handoff }}
          fallback-reason: ${{ steps.credential.outputs.fallback-reason }}

      - name: Upload the sealed transcript
        if: always() && steps.rate.outputs.execution-file != ''
        continue-on-error: true
        uses: ./.base/.github/actions/upload-lane-transcript # zizmor: ignore[self-repository]
        with:
          execution-file: ${{ steps.rate.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}

      - name: Write the rating
        id: rating
        if: ${{ !cancelled() && steps.rate.outcome == 'success' && steps.rate.outputs.structured-output-file != '' }}
        env:
          OUTPUT_FILE: ${{ steps.rate.outputs.structured-output-file }}
          EXECUTION_FILE: ${{ steps.rate.outputs.execution-file }}
          PLUGIN_MANIFEST: .base/plugins/review/.claude-plugin/plugin.json
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          CLI_VERSION: ${{ steps.rate.outputs.cli-version }}
          STARTED_AT: ${{ steps.prompt.outputs.started-at }}
          OUT_DIR: ${{ runner.temp }}/merge-risk-rating
        run: node .base/.github/scripts/pr-merge-risk/write-rating.mjs

      - name: Scan the upload for credentials
        id: scan-upload
        if: ${{ !cancelled() && steps.rating.outcome == 'success' }}
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
