        if: steps.data.outcome == 'success'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: merge-risk
          output-path: ${{ runner.temp }}/merge-risk-models.json

      - name: Read the checker's model
        id: checker
        if: steps.models.outcome == 'success'
        env:
          SETTINGS: ${{ steps.models.outputs.settings-json }}
          MODEL: ${{ steps.models.outputs.model }}
        run: bash .base/.github/scripts/pr-merge-risk/read-checker-model.sh

      # Only whether each secret is set reaches this step, never its value.
      # `present` is whether this leg runs the model.
      - name: Check the credential
        id: credential
        if: steps.checker.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@5b5110ae015183e900dd098c631d4dcc68904067 # 5b5110a 2026-11-06
