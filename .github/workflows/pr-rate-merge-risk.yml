          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: |
            Read
            Skill
            Agent
          allowed-tools: |
            Read(./merge-risk-data/**)
            Read(./.lane/plugins/review/**)
            Skill(review:merge-risk *)
            Agent
          disallowed-tools: |
            Read(./.base/**)
            Read(/${{ runner.temp }}/**)
            Read(~/.config/**)
            Read(~/.git-credentials)
            Read(~/.claude/**)
            Read(//proc/**)
            Read(//sys/**)
            Read(//etc/**)
            Glob
            Grep
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            mcp__*
