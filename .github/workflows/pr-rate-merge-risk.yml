        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-merge-risk-${{ steps.pr.outputs.pr-number }}-${{ steps.pr.outputs.head-sha }}
          path: ${{ runner.temp }}/merge-risk-rating/rating.json
          retention-days: 7
          if-no-files-found: error

      - name: Pick the next leg
        id: next
        continue-on-error: true
        timeout-minutes: 1
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@5b5110ae015183e900dd098c631d4dcc68904067 # 5b5110a 2026-11-06
        with:
          state: ${{ steps.credential.outputs.state }}
          handoff: ${{ steps.rate.outputs.handoff }}
          handoff-reason: ${{ steps.rate.outputs.handoff-reason }}

      - name: Log the API budget
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

      - name: Fail without a rating
        if: always() && steps.checker.outcome == 'success' && steps.credential.outputs.present == 'true' && steps.rating.outcome != 'success' && steps.rate.outputs.handoff != 'true'
        run: |
          echo "::error::the rating left nothing for this head; the arm records it unrated"
          exit 1

  # The fallback leg, on the central fallback token alone, on a third VM:
  # the same steps, after the subscription leg handed off or found its token
  # empty, and only when the fallback token is set. It never hands off.
  rate-merge-risk-fallback:
    name: Rate Merge Risk Fallback
    needs: rate-merge-risk-subscription
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
