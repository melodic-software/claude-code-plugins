name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Quality lanes run the ci-workflows composite actions / reusable workflows
# (referenced by SHA, bumped via Dependabot — never copied) against this repo's
# exact standards materializations. Tool configs live at their tool-native
# root paths; comment-hygiene's default policy is bundled with its action. The
# local ci-status gateway aggregates every lane into the
# single required check the org ci-gate ruleset keys on.
jobs:
  # Give every independently scheduled workload its own inventory decision.
  # Sharing one selector across this fanout would route every lane locally from
  # one idle observation. Independent decisions let later selectors see newly
  # assigned capacity and fall hosted, while preserving every existing job and
  # required-check identity. A simultaneous burst can still race because GitHub
  # does not provide an atomic runner reservation; the fleet's queue monitor
  # owns that documented alert-and-rerun recovery path.
  select-markdown:
    name: Select runner for markdown
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  select-typos:
    name: Select runner for typos
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  select-gitleaks:
    name: Select runner for gitleaks
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  select-editorconfig:
    name: Select runner for editorconfig
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  select-shellcheck:
    name: Select runner for shellcheck
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  select-actionlint:
    name: Select runner for actionlint
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  select-jsonschema:
    name: Select runner for jsonschema
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  select-exec-bit:
    name: Select runner for exec-bit
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  select-machine-specific-paths:
    name: Select runner for machine-specific-paths
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  select-eol-renormalize:
    name: Select runner for eol-renormalize
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  select-comment-hygiene:
    name: Select runner for comment-hygiene
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  select-hook-utils-sync:
    name: Select runner for hook-utils-sync
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  select-plugin-gate:
    name: Select runner for plugin-gate
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  markdown:
    needs: select-markdown
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.select-markdown.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Lint markdown
        uses: melodic-software/ci-workflows/.github/actions/markdown@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
        with:
          config: .markdownlint-cli2.jsonc

  typos:
    needs: select-typos
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.select-typos.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Spell-check
        uses: melodic-software/ci-workflows/.github/actions/typos@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
        with:
          config: _typos.toml

  gitleaks:
    needs: select-gitleaks
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.select-gitleaks.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Scan for secrets
        uses: melodic-software/ci-workflows/.github/actions/gitleaks@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
        with:
          config: .gitleaks.toml

  editorconfig:
    needs: select-editorconfig
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.select-editorconfig.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check editorconfig conformance
        uses: melodic-software/ci-workflows/.github/actions/editorconfig@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
        with:
          config: .editorconfig-checker.json

  shellcheck:
    needs: select-shellcheck
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.select-shellcheck.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Lint shell scripts
        uses: melodic-software/ci-workflows/.github/actions/shellcheck@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
        with:
          rcfile: .shellcheckrc

  actionlint:
    needs: select-actionlint
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.select-actionlint.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: melodic-software/ci-workflows/.github/actions/actionlint@fd9a74d126fcaca9543ce8172c019e5a97ea4e79 # fd9a74d 2026-07-10

  jsonschema:
    needs: select-jsonschema
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.select-jsonschema.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate marketplace manifest
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
        with:
          schemafile: https://json.schemastore.org/claude-code-marketplace.json
          files: .claude-plugin/marketplace.json
      - name: Validate plugin manifests
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
        with:
          schemafile: https://json.schemastore.org/claude-code-plugin-manifest.json
          files: plugins/*/.claude-plugin/plugin.json
      - name: Validate dependabot.yml
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
        with:
          builtin-schema: vendor.dependabot
          files: .github/dependabot.yml
      - name: Validate workflows
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
        with:
          builtin-schema: vendor.github-workflows
          files: >-
            .github/workflows/ci.yml
            .github/workflows/claude-review.yml
            .github/workflows/link-check.yml
            .github/workflows/pr-title.yml

  exec-bit:
    needs: select-exec-bit
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.select-exec-bit.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify shebang files are executable
        uses: melodic-software/ci-workflows/.github/actions/exec-bit@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10

  machine-specific-paths:
    needs: select-machine-specific-paths
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.select-machine-specific-paths.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check for machine-specific paths
        uses: melodic-software/ci-workflows/.github/actions/machine-specific-paths@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
        with:
          # The guardrails plugin bundles a path-detection pattern lib whose
          # regex bodies self-match this lane's own detector.
          exclude: ':(exclude)plugins/guardrails/lib/path-detection/**'

  eol-renormalize:
    needs: select-eol-renormalize
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.select-eol-renormalize.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check index-level EOL drift
        uses: melodic-software/ci-workflows/.github/actions/eol-renormalize@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10

  comment-hygiene:
    needs: select-comment-hygiene
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.select-comment-hygiene.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Scan comment hygiene
        uses: melodic-software/ci-workflows/.github/actions/comment-hygiene@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10

  zizmor:
    permissions:
      contents: read
    # Advisory Actions security lint; findings annotate without blocking.
    uses: melodic-software/ci-workflows/.github/workflows/zizmor.yml@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
    with:
      paths: .

  hook-utils-sync:
    needs: select-hook-utils-sync
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.select-hook-utils-sync.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history so the PR base ref is resolvable for the bump gate.
          fetch-depth: 0
      - name: Verify plugin copies match the shared lib
        run: scripts/sync-hook-utils.sh --check
      - name: Run shared lib tests
        run: bash lib/hook-utils.test.sh
      - name: Verify carrying plugins bumped when the lib changed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/sync-hook-utils.sh --check-bump "origin/$BASE_REF"

  plugin-gate:
    needs: select-plugin-gate
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.select-plugin-gate.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install and verify ShellCheck toolchain
        # This canonical action also makes the exact ShellCheck version
        # available to the later bash-lint contract tests in this same job.
        uses: melodic-software/ci-workflows/.github/actions/shellcheck@9596686335da057de7b575ebf82ca1210768c590 # 9596686 2026-07-10
        with:
          paths: plugins/bash-lint
          rcfile: .shellcheckrc
      # Contract tests run first and gate independently of the CLI validate step
      # below: a validate-infra problem (e.g. the CLI needing auth) can never mask
      # a real contract-test failure. shfmt is optional in both environments, so
      # shfmt-gated cases skip rather than fail. Node, Python, ShellCheck, Biome,
      # and Ruff are declared here so hosted and local runs exercise the same
      # contract suites instead of inheriting different image tool inventories.
      - name: Install locked plugin test toolchains
        run: |
          npm ci
          python -m pip install --user --only-binary=:all: --require-hashes \
            --requirement .github/requirements-ci.txt
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run plugin contract tests
        run: scripts/run-plugin-tests.sh
      - name: Validate plugin and catalog manifests
        run: scripts/validate-plugins.sh

  runner-policy:
    name: Runner policy
    # The independent enforcement path stays hosted and audits the selector
    # wiring rather than depending on the fleet it is responsible for policing.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: .github/standards/runner-policy/package-lock.json
      - name: Install pinned runner-policy dependencies
        run: npm ci --prefix .github/standards/runner-policy
      - name: Enforce runner policy
        run: node .github/standards/runner-policy/runner-policy.mjs --root .
        env:
          CI_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}

  ci-status:
    if: always()
    needs:
      - markdown
      - typos
      - gitleaks
      - editorconfig
      - shellcheck
      - actionlint
      - jsonschema
      - exec-bit
      - machine-specific-paths
      - eol-renormalize
      - comment-hygiene
      - hook-utils-sync
      - plugin-gate
      - runner-policy
      - zizmor
    # The required gateway stays hosted so a fleet outage cannot prevent it
    # from reporting required workload failures.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Aggregate lane results
        # Derived from the needs graph above — the single source of truth for the
        # lane list. Adding a lane to needs automatically extends this check.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success) ;;
              *) echo "A required lane did not pass (result: $r)."; exit 1 ;;
            esac
          done
          echo "All required lanes passed."
