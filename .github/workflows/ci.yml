name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Quality lanes run the ci-workflows composite actions / reusable workflows
# (referenced by SHA, bumped via Dependabot — never copied) against this repo's
# exact standards materializations. Tool configs live at their tool-native
# root paths; comment-hygiene's default policy is bundled with its action. The
# local ci-status gateway aggregates every lane into the
# single required check the org ci-gate ruleset keys on.
jobs:
  # Give each independently scheduled workload one governed routing gate.
  # The short hygiene checks share one checkout and one ephemeral worker to
  # avoid runner-registration churn. A selector/configuration failure blocks
  # the complete workload; it cannot silently redirect to paid hosted Linux.
  select-hygiene:
    name: Select runner for hygiene
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@de50a08b6093d231519ee7a4c9371db76c0a7e1e # de50a08 2026-07-13
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  select-hook-utils-sync:
    name: Select runner for hook-utils-sync
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@de50a08b6093d231519ee7a4c9371db76c0a7e1e # de50a08 2026-07-13
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  select-plugin-gate:
    name: Select runner for plugin-gate
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@de50a08b6093d231519ee7a4c9371db76c0a7e1e # de50a08 2026-07-13
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  select-miro-plugin:
    name: Select runner for miro-plugin
    uses: melodic-software/ci-workflows/.github/workflows/select-runner.yml@de50a08b6093d231519ee7a4c9371db76c0a7e1e # de50a08 2026-07-13
    with:
      policy: ${{ vars.CI_RUNNER_POLICY }}
      self-hosted-label: ${{ vars.CI_SELF_HOSTED_LABEL }}
      hosted-runner: ${{ vars.CI_HOSTED_RUNNER }}
      scope: ${{ vars.CI_RUNNER_SCOPE }}
      managed-runner-prefix: ${{ vars.CI_MANAGED_RUNNER_PREFIX }}
      observer-client-id: ${{ vars.CI_RUNNER_OBSERVER_CLIENT_ID }}
    secrets:
      observer-private-key: ${{ secrets.CI_RUNNER_OBSERVER_PRIVATE_KEY }}

  hygiene:
    needs: select-hygiene
    if: ${{ !cancelled() && needs.select-hygiene.result == 'success' }}
    runs-on: ${{ needs.select-hygiene.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Lint markdown
        id: markdown
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/markdown@99ac2f8c5b09dbb785d4eaf18465cbd96c30290c # 99ac2f8 2026-07-11
        with:
          config: .markdownlint-cli2.jsonc

      - name: Spell-check
        id: typos
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/typos@99ac2f8c5b09dbb785d4eaf18465cbd96c30290c # 99ac2f8 2026-07-11
        with:
          config: _typos.toml

      - name: Scan for secrets
        id: gitleaks
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/gitleaks@99ac2f8c5b09dbb785d4eaf18465cbd96c30290c # 99ac2f8 2026-07-11
        with:
          config: .gitleaks.toml

      - name: Check editorconfig conformance
        id: editorconfig
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/editorconfig@99ac2f8c5b09dbb785d4eaf18465cbd96c30290c # 99ac2f8 2026-07-11
        with:
          config: .editorconfig-checker.json

      - name: Lint shell scripts
        id: shellcheck
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/shellcheck@99ac2f8c5b09dbb785d4eaf18465cbd96c30290c # 99ac2f8 2026-07-11
        with:
          rcfile: .shellcheckrc

      - name: Lint workflows
        id: actionlint
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/actionlint@99ac2f8c5b09dbb785d4eaf18465cbd96c30290c # 99ac2f8 2026-07-11

      - name: Validate marketplace manifest
        id: marketplace_schema
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@99ac2f8c5b09dbb785d4eaf18465cbd96c30290c # 99ac2f8 2026-07-11
        with:
          schemafile: https://json.schemastore.org/claude-code-marketplace.json
          files: .claude-plugin/marketplace.json
      - name: Validate plugin manifests
        id: plugin_schema
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@99ac2f8c5b09dbb785d4eaf18465cbd96c30290c # 99ac2f8 2026-07-11
        with:
          schemafile: https://json.schemastore.org/claude-code-plugin-manifest.json
          files: plugins/*/.claude-plugin/plugin.json
      - name: Validate dependabot.yml
        id: dependabot_schema
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@99ac2f8c5b09dbb785d4eaf18465cbd96c30290c # 99ac2f8 2026-07-11
        with:
          builtin-schema: vendor.dependabot
          files: .github/dependabot.yml
      - name: Validate workflows
        id: workflow_schema
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@99ac2f8c5b09dbb785d4eaf18465cbd96c30290c # 99ac2f8 2026-07-11
        with:
          builtin-schema: vendor.github-workflows
          files: >-
            .github/workflows/ci.yml
            .github/workflows/claude-review.yml
            .github/workflows/link-check.yml
            .github/workflows/pr-title.yml

      - name: Verify shebang files are executable
        id: exec_bit
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/exec-bit@99ac2f8c5b09dbb785d4eaf18465cbd96c30290c # 99ac2f8 2026-07-11

      - name: Check for machine-specific paths
        id: machine_paths
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/machine-specific-paths@99ac2f8c5b09dbb785d4eaf18465cbd96c30290c # 99ac2f8 2026-07-11
        with:
          # The guardrails plugin bundles a path-detection pattern lib whose
          # regex bodies self-match this lane's own detector.
          exclude: ':(exclude)plugins/guardrails/lib/path-detection/**'

      - name: Check index-level EOL drift
        id: eol
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/eol-renormalize@99ac2f8c5b09dbb785d4eaf18465cbd96c30290c # 99ac2f8 2026-07-11

      - name: Scan comment hygiene
        id: comment_hygiene
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/comment-hygiene@99ac2f8c5b09dbb785d4eaf18465cbd96c30290c # 99ac2f8 2026-07-11

      - name: Test hygiene result aggregation
        run: scripts/aggregate-hygiene-results.sh --self-test

      - name: Aggregate hygiene results
        if: always()
        env:
          # Display names (left) are annotations; step ids (right) use underscores.
          CHECK_RESULTS: |
            markdown=${{ steps.markdown.outcome }}
            typos=${{ steps.typos.outcome }}
            gitleaks=${{ steps.gitleaks.outcome }}
            editorconfig=${{ steps.editorconfig.outcome }}
            shellcheck=${{ steps.shellcheck.outcome }}
            actionlint=${{ steps.actionlint.outcome }}
            marketplace-schema=${{ steps.marketplace_schema.outcome }}
            plugin-schema=${{ steps.plugin_schema.outcome }}
            dependabot-schema=${{ steps.dependabot_schema.outcome }}
            workflow-schema=${{ steps.workflow_schema.outcome }}
            exec-bit=${{ steps.exec_bit.outcome }}
            machine-specific-paths=${{ steps.machine_paths.outcome }}
            eol-renormalize=${{ steps.eol.outcome }}
            comment-hygiene=${{ steps.comment_hygiene.outcome }}
        run: scripts/aggregate-hygiene-results.sh

  zizmor:
    needs: select-hygiene
    if: ${{ !cancelled() && needs.select-hygiene.result == 'success' }}
    permissions:
      contents: read
    # Advisory Actions security lint; findings annotate without blocking.
    uses: melodic-software/ci-workflows/.github/workflows/zizmor.yml@de50a08b6093d231519ee7a4c9371db76c0a7e1e # de50a08 2026-07-12
    with:
      runner: ${{ needs.select-hygiene.outputs.runner || 'ubuntu-24.04' }}
      paths: .

  hook-utils-sync:
    needs: select-hook-utils-sync
    if: ${{ !cancelled() && needs.select-hook-utils-sync.result == 'success' }}
    runs-on: ${{ needs.select-hook-utils-sync.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history so the PR base ref is resolvable for the bump gate.
          fetch-depth: 0
      - name: Verify plugin copies match the shared lib
        run: scripts/sync-hook-utils.sh --check
      - name: Run shared lib tests
        run: bash lib/hook-utils.test.sh
      - name: Verify carrying plugins bumped when the lib changed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/sync-hook-utils.sh --check-bump "origin/$BASE_REF"

  plugin-gate:
    needs: select-plugin-gate
    if: ${{ !cancelled() && needs.select-plugin-gate.result == 'success' }}
    runs-on: ${{ needs.select-plugin-gate.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install and verify ShellCheck toolchain
        # This canonical action also makes the exact ShellCheck version
        # available to the later bash-lint contract tests in this same job.
        uses: melodic-software/ci-workflows/.github/actions/shellcheck@99ac2f8c5b09dbb785d4eaf18465cbd96c30290c # 99ac2f8 2026-07-11
        with:
          paths: plugins/bash-lint
          rcfile: .shellcheckrc
      # Contract tests run first and gate independently of the CLI validate step
      # below: a validate-infra problem (e.g. the CLI needing auth) can never mask
      # a real contract-test failure. shfmt is optional in both environments, so
      # shfmt-gated cases skip rather than fail. Node, Python, ShellCheck, Biome,
      # and Ruff are declared here so hosted and local runs exercise the same
      # contract suites instead of inheriting different image tool inventories.
      - name: Install locked plugin test toolchains
        run: |
          npm ci
          python -m pip install --user --only-binary=:all: --require-hashes \
            --requirement .github/requirements-ci.txt
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run plugin contract tests
        run: scripts/run-plugin-tests.sh
      - name: Validate plugin and catalog manifests
        run: scripts/validate-plugins.sh

  # The miro plugin ships a bundled Node MCP server — the marketplace's first.
  # Its TypeScript source is the source of truth; dist/index.min.js is committed
  # generated output. This lane rebuilds from source with the pinned toolchain
  # and fails on any drift, then runs the bundle over stdio so a build that
  # compiles but cannot serve MCP is caught here, not on a consumer's machine.
  miro-plugin:
    needs: select-miro-plugin
    if: ${{ !cancelled() && needs.select-miro-plugin.result == 'success' }}
    runs-on: ${{ needs.select-miro-plugin.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: plugins/miro/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: plugins/miro
      - name: Typecheck
        run: npm run typecheck
        working-directory: plugins/miro
      - name: Lint
        run: npm run lint
        working-directory: plugins/miro
      - name: Test
        run: npm test
        working-directory: plugins/miro
      - name: Verify the committed bundle matches source
        run: npm run verify-bundle
        working-directory: plugins/miro
      - name: Smoke-test the bundled MCP server over stdio
        working-directory: plugins/miro
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | MIRO_API_TOKEN=ci-smoke-token timeout 10 node dist/index.min.js > smoke-out.json
          grep -q '"miro_create_board"' smoke-out.json
          rm -f smoke-out.json

  runner-policy:
    name: Runner policy
    needs: select-hygiene
    if: ${{ !cancelled() && needs.select-hygiene.result == 'success' }}
    runs-on: ${{ needs.select-hygiene.outputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: .github/standards/runner-policy/package-lock.json
      - name: Install pinned runner-policy dependencies
        run: npm ci --prefix .github/standards/runner-policy
      - name: Enforce runner policy
        run: node .github/standards/runner-policy/runner-policy.mjs --root .
        env:
          CI_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}

  ci-status:
    if: always()
    needs:
      - hygiene
      - hook-utils-sync
      - plugin-gate
      - miro-plugin
      - runner-policy
      - zizmor
    # The required gateway remains independent of selector/fleet health so a
    # failed route materializes as a failing required check, never a skipped
    # check that GitHub could treat as successful.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Aggregate lane results
        # Derived from the needs graph above — the single source of truth for the
        # lane list. Adding a lane to needs automatically extends this check.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success) ;;
              *) echo "A required lane did not pass (result: $r)."; exit 1 ;;
            esac
          done
          echo "All required lanes passed."
