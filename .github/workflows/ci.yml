      # The miro plugin ships a bundled Node MCP server — the marketplace's
      # first. Its TypeScript source is the source of truth; dist/index.min.js
      # is committed generated output. These steps rebuild from source with the
      # pinned toolchain and fail on any drift, then run the bundle over stdio
      # so a build that compiles but cannot serve MCP is caught here, not on a
      # consumer's machine.
      - name: Install dependencies
        if: needs.changes.outputs.run_node == 'true'
        run: npm ci
        working-directory: plugins/miro
      - name: Typecheck
        if: needs.changes.outputs.run_node == 'true'
        run: npm run typecheck
        working-directory: plugins/miro
      - name: Lint
        if: needs.changes.outputs.run_node == 'true'
        run: npm run lint
        working-directory: plugins/miro
      - name: Test
        if: needs.changes.outputs.run_node == 'true'
        run: npm test
        working-directory: plugins/miro
      - name: Verify the committed bundle matches source
        if: needs.changes.outputs.run_node == 'true'
        run: npm run verify-bundle
        working-directory: plugins/miro
      - name: Smoke-test the bundled MCP server over stdio
        if: needs.changes.outputs.run_node == 'true'
        working-directory: plugins/miro
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | MIRO_API_TOKEN=ci-smoke-token timeout 10 node dist/index.min.js > smoke-out.json
          grep -q '"miro_create_board"' smoke-out.json
          rm -f smoke-out.json

      # The knowledge plugin's video-digest extraction pipeline is a Node
      # package with a typecheck and vitest suite no other lane installs or
      # runs. Its committed lockfile pins the shared vendor/ packages as packed
      # installs (install-links via the package's .npmrc), so manifest/lockfile
      # drift breaks `npm ci` only on a clean install.
      - name: Install dependencies
        if: needs.changes.outputs.run_node == 'true'
        run: bash plugins/knowledge/skills/video-digest/scripts/run-tests.sh install
      - name: Typecheck
        if: needs.changes.outputs.run_node == 'true'
        run: bash plugins/knowledge/skills/video-digest/scripts/run-tests.sh build
      - name: Test
        if: needs.changes.outputs.run_node == 'true'
        run: bash plugins/knowledge/skills/video-digest/scripts/run-tests.sh test

      # ai-briefing's build/render pipeline is a Node package (native
      # `node --test` suite) no other lane installs or runs — including
      # test/url-policy.test.js, which asserts the SSRF gate (lib/url-policy.js)
      # that decides which URLs the briefing validator is allowed to
      # dereference. Without these steps that suite runs locally only, so a
      # future refactor could silently break the predicate with nothing red in
      # CI (#1488).
      - name: Install dependencies
        if: needs.changes.outputs.run_node == 'true'
        run: bash plugins/ai-briefing/skills/generate/scripts/run-tests.sh install
      - name: Test
        if: needs.changes.outputs.run_node == 'true'
        run: bash plugins/ai-briefing/skills/generate/scripts/run-tests.sh test

      # The knowledge plugin's course-digest extraction pipeline is a Node
      # package (typecheck + vitest suite) no other lane installs or runs —
      # same shape as video-digest, including the shared vendor/ packages
      # pulled in as file: dependencies via the package's .npmrc
      # install-links=true (#1507).
      - name: Install dependencies
        if: needs.changes.outputs.run_node == 'true'
        run: bash plugins/knowledge/skills/course-digest/scripts/run-tests.sh install
      - name: Typecheck
        if: needs.changes.outputs.run_node == 'true'
        run: bash plugins/knowledge/skills/course-digest/scripts/run-tests.sh build
      - name: Test
        if: needs.changes.outputs.run_node == 'true'
        run: bash plugins/knowledge/skills/course-digest/scripts/run-tests.sh test

      # #2871: the full test_hygiene module. Its ten TestCase classes need a
      # check that cannot take hygiene.test.sh's SKIP-when-Python-absent path.
      # The Windows lane stays GuardTests-only (NT allowlist, plus two failures
      # named there). Suite is not host-destructive (tempdir fixtures; no live
      # drive-root scans). Measured 317 OK.
      - name: Run disk-hygiene tests
        if: needs.changes.outputs.run_python == 'true'
        working-directory: plugins/disk-hygiene/skills/clean/scripts
        run: python -m unittest -v test_hygiene

      - name: Report not applicable to a docs-only diff
        if: needs.changes.outputs.run_tests == 'false'
        run: echo "The diff is within the docs-only allowlist (scripts/docs-only-paths.txt), or this is a draft pull request; the plugin contract suite, the sync gates and the sub-project builds cannot be affected — reporting success."

  # The ONLY job on a Windows runner, and deliberately so. Every other suite in
  # this repository is platform-agnostic bash string logic that a Linux runner
  # exercises identically — `lib/powershell/ps-command.sh`, for instance,
  # carries zero `OSTYPE`/`cygpath`/`uname` branches despite classifying
  # PowerShell commands, so Linux tests it faithfully.
  #
  # Three surfaces are the exception. `lib/hook-utils.sh` carries OSTYPE-gated
  # branches a Linux runner NEVER EXECUTES — case-insensitive path folding for
  # the Windows filesystem, and `cygpath` short-name (8.3) resolution. #2774's
  # disk-hygiene read-only Bash allowlist is NT-specific (MSYS path mapping,
  # .exe basename stripping, ProgramFiles trust roots), which is how an inert
  # Windows allowlist shipped green. And the MSYS-to-Windows emit helper exists
  # for its NT branch: cygpath's answer cannot be faked on Linux, so on a Linux
  # runner those cases report NOT EXERCISED and the suite is green having
  # proved nothing about them.
  #
  # Keep this job SMALL. Adding a platform-agnostic suite here buys no coverage
  # and pays Windows' process-creation cost (~140ms/spawn vs ~3ms on Linux).
  # Pinned, not `windows-latest`: the runner policy forbids the floating
  # `*-latest` labels outright, for the same reason the Linux lanes pin
  # ubuntu-24.04 — an image roll must be a reviewed commit, not a silent
  # Tuesday. Free: GitHub Actions is free for public repositories on standard
  # GitHub-hosted runners, Windows included.
  #
  # THIS IS THE ONE JOB-LEVEL GATE IN THIS FILE, and it is legal precisely
  # because the job sits OUTSIDE the required-lane closure the aggregate
  # defines. A lane the aggregate cannot see costs a skipped informational run
  # rather than a false green, so skipping the whole job is the cheaper shape;
  # inside the closure the same condition would let the lane report success
  # having run nothing, and both gates reject it there. Do not add this job to
  # `ci-status.needs`: doing so makes both the condition and the annotation
  # below defects, which each gate's own tests prove.
  #
  # If `changes` fails outright, rather than failing a continue-on-error step,
  # `needs: [changes]` skips this job. That is accepted for a non-required
  # lane: the fail-open path this file cares about runs through the resolver's
  # published outputs, and those are absorbed.
  # lane-coverage-ok: informational platform lane, outside the ci-status aggregate by design
  test-windows:
    needs:
      - changes
    # The contract-only gate ANDed with the existing resolver gate. This lane is
    # outside the ci-status aggregate, so it may gate at job level.
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) && needs.changes.outputs.run_windows == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Run shared lib tests on Windows
        run: bash lib/hook-utils.test.sh
      # GuardTests only, not the full hygiene module: two of its tests fail on
      # windows-2025 and are already green on Linux — the preview case expects
      # ready-for-explicit-approval where Windows returns blocked, and the
      # handoff case compares path strings where 8.3 `RUNNER~1` differs from
      # the long `runneradmin`. The other nine classes gate on the Linux run.
      - name: Run disk-hygiene GuardTests on Windows
        working-directory: plugins/disk-hygiene/skills/clean/scripts
        run: python -m unittest -v test_hygiene.GuardTests
      - name: Test the MSYS-to-Windows emit helper on Windows
        run: bash scripts/emit-windows-path.test.sh
      - name: Test the drive-root litter detector on Windows
        run: bash scripts/check-drive-root-litter.test.sh

  # The shared hook-utils library, kept out of test-linux so its delivery check
  # and its own suite are legible as one lane rather than buried among fifty
  # steps, and so the suite runs on a shell-only diff without paying for the
  # Node and Python toolchains test-linux installs.
  hook-utils:
    needs:
      - changes
    # The contract-only gate, verbatim.
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch base
        uses: ./.github/actions/checkout-with-base
      - name: Verify plugin copies match the shared lib
        if: needs.changes.outputs.run_tests == 'true'
        run: scripts/sync-hook-utils.sh --check
      - name: Run shared lib tests
        if: needs.changes.outputs.run_shell == 'true'
        run: bash lib/hook-utils.test.sh
      - name: Verify carrying plugins bumped when the lib changed
        if: needs.changes.outputs.run_tests == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "::notice::Declined on a $GITHUB_EVENT_NAME event; there is no base ref to diff against."
            exit 0
          fi
          scripts/sync-hook-utils.sh --check-bump "origin/$BASE_REF"
      - name: Report not applicable to a docs-only diff
        if: needs.changes.outputs.run_tests == 'false'
        run: echo "The diff is within the docs-only allowlist (scripts/docs-only-paths.txt), or this is a draft pull request; the shared hook-utils library cannot be affected — reporting success."

  ci-status:
    needs:
      - changes
      - lint
      - test-linux
      - hook-utils
    # Fail-closed through execution: !cancelled() (never a success-guard) so a
    # lane failure still runs this required aggregate and the aggregation below
    # turns it red. A success-guard would skip the job, and a skipped required
    # check reports success to branch protection. This condition is safe where
    # a consumer's would not be: this job reads no resolver output, so there is
    # no empty-string state for it to misread.
    #
    # This is the ONE job that carries no contract-only gate: on a label flip or
    # a body edit it is the only job that runs, and it answers from the
    # `ci-lanes` commit status the last full run recorded on this SHA.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # 10, not 5, because of the carry-forward wait below: this repository's full
    # run takes 4 to 5 minutes, so a contract-only event arriving as one starts
    # waits nearly that long, and a 5-minute job cannot hold a wait that long
    # plus its own work.
    timeout-minutes: 10
    permissions:
      # ci-status lists this workflow's runs on this head SHA to find an earlier
      # incomplete one before it reads the carried-forward status. Under an
      # explicit block the default is none, and the call would 403.
      actions: read
      contents: read
      # pr-contract upserts the advisory linkage comment and moves the linkage
      # label; ci-status records the `ci-lanes` commit status the carry-forward
      # branch reads back on the next contract-only event.
      pull-requests: write
      statuses: write
    steps:
      - name: Check the pull-request contract
        uses: melodic-software/ci-workflows/.github/actions/pr-contract@906ae7ef379ea4d2b8497f64475dce1d3d8715c4 # v0.22.0
        with:
          token: ${{ github.token }}
          # Carried over verbatim from `pr-issue-linkage.yml`, the caller this
          # step replaces: dependabot PR bodies cannot carry the closing keyword
          # and the four contract sections, so its login is exempt from the
          # linkage check and its pull requests stay mergeable. An exact-login
          # match, never a `*[bot]` pattern.
          exempt-authors: 'dependabot[bot]'
      - name: Aggregate lane results
        # `!cancelled()` so a failing pr-contract step does not skip the
        # aggregation: the job still fails on the contract step's exit code, and
        # the `ci-lanes` status is on the SHA for the next contract-only run.
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/ci-status@5776760254f8b63cba44e896f51604cb755350d9 # v0.22.2
        with:
          # Derived from the needs graph above — the single source of truth for
          # the lane list. Adding a lane to needs automatically extends this
          # check.
          results: ${{ join(needs.*.result, ' ') }}
          # The replaced inline aggregator passed only `success`, so a `skipped`
          # lane was already red here.
          treat-skipped-as: fail
          # A contract-only run no longer queues behind the full run it reads
          # from, so it waits for one instead. 540 seconds is this job's
          # `timeout-minutes: 10` less the 60-second margin the composite's
          # README requires, so the fail-closed error is never preempted by the
          # job timeout. Measured: a body edit one minute into a full run waited
          # 210 s (run 33993232104), so the 240 s a 5-minute job allows would
          # have gone red on the very case the wait exists for, a bot that
          # force-pushes and edits in the same second.
          carry-forward-wait-seconds: '540'
          token: ${{ github.token }}
