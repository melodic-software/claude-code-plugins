name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Quality lanes run the ci-workflows composite actions / reusable workflows
# (referenced by SHA, bumped via Dependabot — never copied) against this repo's
# own copies of the standards configs. Tool configs live at the repo root, so
# each lane overrides the action's config input to that root path; the
# comment-hygiene policy and lychee ruleset sit under modules/ at the actions'
# default paths. The local ci-status gateway aggregates every lane into the
# single required check the org ci-gate ruleset keys on.
jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Lint markdown
        uses: melodic-software/ci-workflows/.github/actions/markdown@2275e82c502d29b468e3ee2b9c11b2de69b1677f # b6431a1 2026-06-26
        with:
          config: .markdownlint-cli2.jsonc

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Spell-check
        uses: melodic-software/ci-workflows/.github/actions/typos@2275e82c502d29b468e3ee2b9c11b2de69b1677f # b6431a1 2026-06-26
        with:
          config: _typos.toml

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Scan for secrets
        uses: melodic-software/ci-workflows/.github/actions/gitleaks@2275e82c502d29b468e3ee2b9c11b2de69b1677f # b6431a1 2026-06-26
        with:
          config: .gitleaks.toml

  editorconfig:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check editorconfig conformance
        uses: melodic-software/ci-workflows/.github/actions/editorconfig@2275e82c502d29b468e3ee2b9c11b2de69b1677f # b6431a1 2026-06-26
        with:
          config: .editorconfig-checker.json

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Lint shell scripts
        uses: melodic-software/ci-workflows/.github/actions/shellcheck@2275e82c502d29b468e3ee2b9c11b2de69b1677f # b6431a1 2026-06-26
        with:
          rcfile: .shellcheckrc

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: melodic-software/ci-workflows/.github/actions/actionlint@2275e82c502d29b468e3ee2b9c11b2de69b1677f # b6431a1 2026-06-26

  jsonschema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate marketplace manifest
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@2275e82c502d29b468e3ee2b9c11b2de69b1677f # b6431a1 2026-06-26
        with:
          schemafile: https://json.schemastore.org/claude-code-marketplace.json
          files: .claude-plugin/marketplace.json
      - name: Validate plugin manifests
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@2275e82c502d29b468e3ee2b9c11b2de69b1677f # b6431a1 2026-06-26
        with:
          schemafile: https://json.schemastore.org/claude-code-plugin-manifest.json
          files: plugins/*/.claude-plugin/plugin.json
      - name: Validate dependabot.yml
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@2275e82c502d29b468e3ee2b9c11b2de69b1677f # b6431a1 2026-06-26
        with:
          builtin-schema: vendor.dependabot
          files: .github/dependabot.yml
      - name: Validate workflows
        uses: melodic-software/ci-workflows/.github/actions/check-jsonschema@2275e82c502d29b468e3ee2b9c11b2de69b1677f # b6431a1 2026-06-26
        with:
          builtin-schema: vendor.github-workflows
          files: >-
            .github/workflows/ci.yml
            .github/workflows/link-check.yml

  exec-bit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify shebang files are executable
        uses: melodic-software/ci-workflows/.github/actions/exec-bit@2275e82c502d29b468e3ee2b9c11b2de69b1677f # b6431a1 2026-06-26

  machine-specific-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check for machine-specific paths
        uses: melodic-software/ci-workflows/.github/actions/machine-specific-paths@2275e82c502d29b468e3ee2b9c11b2de69b1677f # b6431a1 2026-06-26
        with:
          # The guardrails plugin bundles a path-detection pattern lib whose
          # regex bodies self-match this lane's own detector.
          exclude: ':(exclude)plugins/guardrails/lib/path-detection/**'

  eol-renormalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check index-level EOL drift
        uses: melodic-software/ci-workflows/.github/actions/eol-renormalize@2275e82c502d29b468e3ee2b9c11b2de69b1677f # b6431a1 2026-06-26

  comment-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Scan comment hygiene
        # The vendored policy library references the literal marker tokens in its
        # own comments, so skip the module to avoid self-matching.
        uses: melodic-software/ci-workflows/.github/actions/comment-hygiene@2275e82c502d29b468e3ee2b9c11b2de69b1677f # b6431a1 2026-06-26
        with:
          exclude: ':(exclude)modules/comment-hygiene/**'

  zizmor:
    permissions:
      contents: read
    # Advisory Actions security lint; findings annotate without blocking.
    uses: melodic-software/ci-workflows/.github/workflows/zizmor.yml@2275e82c502d29b468e3ee2b9c11b2de69b1677f # b6431a1 2026-06-26
    with:
      paths: .

  hook-utils-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history so the PR base ref is resolvable for the bump gate.
          fetch-depth: 0
      - name: Verify plugin copies match the shared lib
        run: scripts/sync-hook-utils.sh --check
      - name: Run shared lib tests
        run: bash lib/hook-utils.test.sh
      - name: Verify carrying plugins bumped when the lib changed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/sync-hook-utils.sh --check-bump "origin/$BASE_REF"

  plugin-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Contract tests run first and gate independently of the CLI validate step
      # below: a validate-infra problem (e.g. the CLI needing auth) can never mask
      # a real contract-test failure. shellcheck is preinstalled on the runner;
      # shfmt is not, so shfmt-gated cases skip rather than fail. Biome and Ruff
      # are installed below so biome-format/ruff-format suites execute instead of
      # silently skipping when the binaries are absent.
      - name: Install plugin test toolchains
        run: |
          npm install -g @biomejs/biome
          python3 -m pip install --user ruff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run plugin contract tests
        run: scripts/run-plugin-tests.sh
      # Node.js is preinstalled on ubuntu-latest; no setup-node action needed.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and catalog manifests
        run: scripts/validate-plugins.sh

  ci-status:
    if: always()
    needs:
      - markdown
      - typos
      - gitleaks
      - editorconfig
      - shellcheck
      - actionlint
      - jsonschema
      - exec-bit
      - machine-specific-paths
      - eol-renormalize
      - comment-hygiene
      - hook-utils-sync
      - plugin-gate
      - zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Aggregate lane results
        # Derived from the needs graph above — the single source of truth for the
        # lane list. Adding a lane to needs automatically extends this check.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "A lane did not pass (result: $r)."; exit 1 ;;
            esac
          done
          echo "All lanes passed or were skipped."
