name: pr-review-security-hosted

# Locally owned: the `claude-security-review-hosted-caller` component of
# melodic-software/standards
# (components/claude-lanes-hosted/claude-security-review.yml) is
# `locally-owned` for this repository in distribution/sync-manifest.yml, so
# this copy can add the resolve-model and kill-switch jobs below. It differs
# from the component in those jobs and these comments.
#
# Thin caller for the org's pr-review-cli reusable, lane `security` (advisory
# verdict, fail-closed execution check). The reusable owns the launcher, the
# credential order (the reviews role's API key, then its subscription token
# after a handoff) and the secret-handling model; per its header, this caller
# owns the triggers, concurrency, and the GITHUB_TOKEN permission grant.
#
# There is no workflow-level path gating. The `docs-only-paths` passed below
# is empty, so a documentation-only pull request is reviewed too. A
# `.github/claude-security-paths` file is no longer read.
#
# NEVER add workflow-level `paths:`/`paths-ignore:` to this caller: a check
# whose workflow never triggers is missing, not green, so a required check
# would stay Pending forever, and the babysit merge gate, which waits for
# `pr-review-security / security-review`, never arms.
#
# The reusable skips fork PRs (they receive no secrets and a read-only token),
# Dependabot, and every `[bot]` actor whose sender id is not in
# `allowed-bot-sender-ids` (below); a required check does NOT prove a fork PR
# was reviewed (see the reusable's header). On a public repository the lane
# reviews only pull requests from branches of this repository: fork and
# Dependabot pull requests get no secrets.
#
# RUNNER PLACEMENT: every job of the reusable runs on ubuntu-24.04; it takes
# no runner input.

on:
  pull_request:
    # `synchronize`, matching the code-review lane: every push is re-reviewed,
    # including the push that resolves a merge conflict (GitHub runs no
    # pull_request workflow while a PR conflicts with its base), narrowed by
    # the reusable to the files changed since the last completed review. No
    # ruleset requires the check; ci-status, the one required check, needs its
    # success on the head and fails while the hold label is on (github-iac
    # ADR 0017).
    #
    # NO `merge_group:`: the reusable runs only on `pull_request`; see
    # melodic-software/ci-workflows#272 before enabling a merge queue.
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

# Per-PR group: a newer event for the same PR waits for the running review
# instead of cancelling it, because the guardrails merge guard reads a
# cancelled run as red. The group is the `${{ github.workflow }}`-prefixed
# canonical form the standards `concurrency-policy` component requires.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # The review's model, turns and effort: the review-security route of the
  # models block in docs/conventions/pr-pipeline.yaml, read from the default
  # branch, never the PR head, so a PR cannot choose the model through its
  # own pr-pipeline.yaml (an edit to this file still shows in its diff). When
  # this job fails, the review still runs on the reusable's own
  # defaults, so the security-review check keeps reporting.
  resolve-model:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the default branch for the models block
    outputs:
      claude-args: ${{ steps.models.outputs.claude-args }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          persist-credentials: false
          # resolve-config imports the two check-* action modules.
          sparse-checkout: |
            /.github/actions/check-kill-switch/
            /.github/actions/check-trusted-trigger/
            /.github/actions/resolve-config/
            /.github/CODEOWNERS
            /.github/standards/github-actions-conventions/vocabulary.json
            /.node-version
            /docs/conventions/pr-pipeline.yaml
            /docs/conventions/pr-pipeline/
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      - name: Resolve the review model
        id: models
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: review-security
          output-path: ${{ runner.temp }}/review-models.json

      # The reusable takes Claude args only; a subagent model would be dropped.
      - name: Refuse a subagent model
        env:
          SETTINGS_JSON: ${{ steps.models.outputs.settings-json }}
        run: |
          if [ -n "$SETTINGS_JSON" ]; then
            echo "::error::the review-security profile sets subagent-model, which pr-review-cli.yml does not support"
            exit 1
          fi

  # The pinned reusable reads no kill switch, so this caller does. The org
  # and repository switches fail closed (check-kill-switch); the lane's own
  # CLAUDE_SECURITY_REVIEW_DISABLED stops it only at `true`, as github-iac's
  # README documents for the review-lane switches. A failed job leaves proceed
  # empty, which also stops the review.
  kill-switch:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the default branch for the kill-switch action
    outputs:
      proceed: ${{ steps.kill.outputs.proceed == 'true' && vars.CLAUDE_SECURITY_REVIEW_DISABLED != 'true' && 'true' || 'false' }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/check-kill-switch/
            /.node-version
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true' || vars.CLAUDE_SECURITY_REVIEW_DISABLED == 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
          LANE_SWITCH: ${{ vars.CLAUDE_SECURITY_REVIEW_DISABLED }}
        run: |
          echo "::notice::a kill switch stops this security review (lanes: ${REASON:-unreadable}, CLAUDE_SECURITY_REVIEW_DISABLED: ${LANE_SWITCH:-unset})"

  pr-review-security:
    needs: [resolve-model, kill-switch]
    # A draft is work in progress and does not spend a review; the
    # ready_for_review trigger above is what delivers one when it is ready.
    if: ${{ !cancelled() && github.event.pull_request.draft == false && needs.kill-switch.outputs.proceed == 'true' }}
    # The model jobs narrow this to contents: read and pull-requests: read;
    # only the reusable's status job (the security-review check) writes.
    permissions:
      actions: read          # the reusable's check-key-credit job reads this
                             # workflow's runs for the key's recent credit stop
      contents: read
      pull-requests: write   # the review, its inline comments and the lane's
                             # reviewed-head marker comment
    uses: melodic-software/ci-workflows/.github/workflows/pr-review-cli.yml@4f79cc9244498ae856504cf74aeeb05dcc9c6b43 # v0.65.8
    with:
      lane: security
      publish: comments
      # Empty unless resolve-model succeeded, so a failed job's partial output
      # never reaches the review.
      model-args: ${{ needs.resolve-model.result == 'success' && needs.resolve-model.outputs.claude-args || '' }}
      # Bot senders this lane reviews, by numeric user id: the
      # automation-lanes App, so a commit it pushes to a pull request is
      # reviewed. Where the repository does not set this variable the value is
      # empty and the reusable reviews no bot.
      allowed-bot-sender-ids: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
      # Empty: the security lane reviews every change, documentation included.
      # A skipped review binds no evidence to the head, so pr-merge scored a
      # docs-only pull request medium and held it for a person; a review with
      # no findings binds to the head and scores low.
      docs-only-paths: ''
      # A hold adds this label and a `claude-lane-hold` marker comment; ci-status
      # fails while the label is on. The review holds only for a real-charge
      # cost or a CRITICAL security finding; hold-paths names the files the
      # prompt sends to extra security scrutiny and never holds by itself.
      # Keep both lists equal in the two callers.
      hold-label: needs-human
      hold-paths: |
        .github/standards/trusted-actors/**
        .github/actions/check-trusted-trigger/**
        **/CODEOWNERS
        **/.gitmodules
    # The reviews role's key runs first; its subscription token only after the
    # key hands off. Named secrets only, never `secrets: inherit`.
    secrets:
      CLAUDE_API_KEY: ${{ secrets.REVIEWS_CLAUDE_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.REVIEWS_CLAUDE_CODE_OAUTH_TOKEN }}
