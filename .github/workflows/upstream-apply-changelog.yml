        id: start-scan
        if: always() && steps.start.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .lane-trusted/lib/publish-gate.mjs
          path: ${{ runner.temp }}/started/release.txt

      - name: Upload the start record
        id: start-upload
        if: (always() && steps.start.outcome == 'success') && steps.start-scan.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: upstream-apply-changelog-started
          path: ${{ runner.temp }}/started/release.txt
          retention-days: 2
          if-no-files-found: error

      - name: Report the subscription's handoff
        if: always() && steps.run.outputs.handoff == 'true'
        continue-on-error: true
        timeout-minutes: 1
        env:
          RELEASE: ${{ needs.select-release.outputs.release }}
          HANDOFF_REASON: ${{ steps.run.outputs.handoff-reason }}
        run: |
          line="ISSUE_LANE_CLAUDE_CODE_OAUTH_TOKEN handed off (${HANDOFF_REASON:-unknown}); apply-changelog-fallback runs release $RELEASE on FALLBACK_CLAUDE_CODE_OAUTH_TOKEN"
          echo "::notice::$line"
          echo "$line" >>"$GITHUB_STEP_SUMMARY"

