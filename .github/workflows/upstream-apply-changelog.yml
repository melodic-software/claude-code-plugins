            exit 1
          fi
          mkdir -p "$NATIVE_DIR"
          harness=plugins/harness-ops/skills
          inventory="$harness/inventory/scripts/inventory.py"
          store=docs/native-surfaces/records.json
          drift="$harness/changelog/scripts/native_drift.py"
          check=0
          python3 "$inventory" --binary "$binary" --self-check || check=$?
          if [[ "$check" != 0 && "$check" != 3 ]]; then
            echo "::error::Native inventory self-check failed ($check). See the host changelog apply Phase 5 procedure."
            exit 1
          fi
          python3 "$inventory" --binary "$binary" --binary-only --docs --out "$RUNNER_TEMP/native-inventory.json"
          detect=0
          python3 "$harness/audit-native-overlap/scripts/overlap.py" detect \
            --inventory "$RUNNER_TEMP/native-inventory.json" --store "$store" --out "$RUNNER_TEMP/native-detect.json" || detect=$?
          [[ "$detect" == 0 || "$detect" == 3 ]]
          python3 "$drift" summarize --inventory "$RUNNER_TEMP/native-inventory.json" \
            --detect "$RUNNER_TEMP/native-detect.json" --out "$NATIVE_DIR/summary.json"
          python3 "$drift" diff --current "$NATIVE_DIR/summary.json" \
            --previous docs/upstream/claude-code-native-surfaces.min.json --store "$store" \
            --detect "$RUNNER_TEMP/native-detect.json" --self-check-exit "$check" --out "$NATIVE_DIR/diff.json"

      - name: Scan the native-surface results for credentials
        id: scan-native
        if: steps.kill.outputs.proceed == 'true'
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/native-baseline/

      - name: Report the baseline difference
        id: report
        if: steps.scan-native.outputs.clean == 'true'
        env:
          NATIVE_DIR: ${{ runner.temp }}/native-baseline
          RELEASE: ${{ needs.select-release.outputs.release }}
        run: node .base/.github/scripts/upstream-apply-changelog/native-baseline-publish.mjs report

  push-native-baseline:
    name: Push Native Baseline
    needs: [select-release, check-native-surfaces]
    if: needs.check-native-surfaces.outputs.summary != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    cache-mode: read
    permissions:
      contents: read
      id-token: write
    outputs:
      head: ${{ steps.write.outputs.head }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-release.outputs.base-sha }}
          path: .base
          persist-credentials: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.select-release.outputs.standards-sha }}

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Resolve the config
        id: config
        if: steps.kill.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: upstream-apply-changelog
          activity: push-native-baseline-branch
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          standards-path: ${{ steps.standards.outputs.path }}

      - name: Request the lane token
        id: lane-token
        if: steps.config.outputs.applies == 'true'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: upstream-apply-changelog
          activity: push-native-baseline-branch
          release: ${{ needs.select-release.outputs.release }}
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}
          kill-switch-ok: true

      - name: Push the baseline branch
        id: write
        if: steps.lane-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          API_BUDGET_TOKEN: lanes-app
          RELEASE: ${{ needs.select-release.outputs.release }}
          BASE_SHA: ${{ needs.select-release.outputs.base-sha }}
          BASELINE_SUMMARY: ${{ needs.check-native-surfaces.outputs.summary }}
        run: node .base/.github/scripts/upstream-apply-changelog/native-baseline-publish.mjs push

      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: bash .base/.github/scripts/lib/revoke-lane-token.sh

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: lanes-app github-token

  publish-native-baseline:
    name: Publish Native Baseline
    needs: [select-release, check-native-surfaces, push-native-baseline]
    if: needs.push-native-baseline.outputs.head != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    cache-mode: read
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-release.outputs.base-sha }}
          path: .base
          persist-credentials: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.select-release.outputs.standards-sha }}

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Resolve the config
        id: config
        if: steps.kill.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: upstream-apply-changelog
          activity: publish-native-baseline-pr
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          standards-path: ${{ steps.standards.outputs.path }}

      - name: Request the lane token
        id: lane-token
        if: steps.config.outputs.applies == 'true'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: upstream-apply-changelog
          activity: publish-native-baseline-pr
          release: ${{ needs.select-release.outputs.release }}
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}
          kill-switch-ok: true

      - name: Open the baseline pull request
        id: write
        if: steps.lane-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          API_BUDGET_TOKEN: lanes-app
          RELEASE: ${{ needs.select-release.outputs.release }}
          HEAD_SHA: ${{ needs.push-native-baseline.outputs.head }}
          BASELINE_REPORT: ${{ needs.check-native-surfaces.outputs.report }}
        run: node .base/.github/scripts/upstream-apply-changelog/native-baseline-publish.mjs publish

      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: bash .base/.github/scripts/lib/revoke-lane-token.sh

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: lanes-app github-token

  scan:
    name: Scan
    needs: [select-release, apply-changelog, apply-changelog-subscription, apply-changelog-fallback]
    if: ${{ !cancelled() && (needs.apply-changelog-fallback.result != 'skipped' && needs.apply-changelog-fallback.outputs.sealed-length || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result != 'skipped' && needs.apply-changelog-subscription.outputs.sealed-length || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result == 'skipped' && needs.apply-changelog.outputs.sealed-length || '') != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    cache-mode: read
    environment:
      name: pr-pipeline-scan-carrier
      deployment: false
    permissions:
      contents: read
    outputs:
      clean: ${{ steps.upload.outcome == 'success' }}
      branches: ${{ steps.check.outputs.branches }}
      synthetic: ${{ steps.check.outputs.synthetic }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      plan-sha256: ${{ steps.hash.outputs.plan }}
      bundle-sha256: ${{ steps.hash.outputs.bundle }}
    env:
      API_BUDGET_TOKEN: github-token
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-release.outputs.base-sha }}
          path: .base
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Read the scan-carrier key id
        id: key
        run: |
          read -r _ id _ <.base/.github/lane-keys/scan-carrier.pub || true
          echo "id=$id" >>"$GITHUB_OUTPUT"

      - name: Open the apply-changelog job's sealed payloads
        id: open
        uses: ./.base/.github/actions/open-lane-output # zizmor: ignore[self-repository]
        with:
          private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}
          expected-key-ids: ${{ steps.key.outputs.id }}
          job-id: ${{ needs.apply-changelog-fallback.result != 'skipped' && 'apply-changelog-fallback' || needs.apply-changelog-subscription.result != 'skipped' && 'apply-changelog-subscription' || 'apply-changelog' }}
          max-bytes: |
            plan.json=262144
            branches.bundle=393216
          directory: ${{ runner.temp }}/scan-in
          sealed-length: ${{ needs.apply-changelog-fallback.result != 'skipped' && needs.apply-changelog-fallback.outputs.sealed-length || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result != 'skipped' && needs.apply-changelog-subscription.outputs.sealed-length || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result == 'skipped' && needs.apply-changelog.outputs.sealed-length || '' }}
          sealed-1: ${{ needs.apply-changelog-fallback.result != 'skipped' && needs.apply-changelog-fallback.outputs.sealed-1 || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result != 'skipped' && needs.apply-changelog-subscription.outputs.sealed-1 || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result == 'skipped' && needs.apply-changelog.outputs.sealed-1 || '' }}
          sealed-2: ${{ needs.apply-changelog-fallback.result != 'skipped' && needs.apply-changelog-fallback.outputs.sealed-2 || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result != 'skipped' && needs.apply-changelog-subscription.outputs.sealed-2 || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result == 'skipped' && needs.apply-changelog.outputs.sealed-2 || '' }}
          sealed-3: ${{ needs.apply-changelog-fallback.result != 'skipped' && needs.apply-changelog-fallback.outputs.sealed-3 || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result != 'skipped' && needs.apply-changelog-subscription.outputs.sealed-3 || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result == 'skipped' && needs.apply-changelog.outputs.sealed-3 || '' }}
          sealed-4: ${{ needs.apply-changelog-fallback.result != 'skipped' && needs.apply-changelog-fallback.outputs.sealed-4 || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result != 'skipped' && needs.apply-changelog-subscription.outputs.sealed-4 || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result == 'skipped' && needs.apply-changelog.outputs.sealed-4 || '' }}
          sealed-5: ${{ needs.apply-changelog-fallback.result != 'skipped' && needs.apply-changelog-fallback.outputs.sealed-5 || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result != 'skipped' && needs.apply-changelog-subscription.outputs.sealed-5 || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result == 'skipped' && needs.apply-changelog.outputs.sealed-5 || '' }}
          sealed-6: ${{ needs.apply-changelog-fallback.result != 'skipped' && needs.apply-changelog-fallback.outputs.sealed-6 || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result != 'skipped' && needs.apply-changelog-subscription.outputs.sealed-6 || needs.apply-changelog-fallback.result == 'skipped' && needs.apply-changelog-subscription.result == 'skipped' && needs.apply-changelog.outputs.sealed-6 || '' }}

      - name: Check the plan and write the diffs
        id: check
        env:
          IN: ${{ runner.temp }}/scan-in
          OUT: ${{ runner.temp }}/scan-out
          RELEASE: ${{ needs.select-release.outputs.release }}
          BASE_SHA: ${{ needs.select-release.outputs.base-sha }}
          REPO_DIR: .base
        run: bash .base/.github/scripts/upstream-apply-changelog/check-plan.sh

      - name: Scan the plan for credentials
        id: scan-plan
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/scan-in/plan.json

      - name: Scan the branch diffs for credentials
        id: scan-diffs
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/scan-in/diffs.txt

      - name: Scan the pull request and issue text for credentials
        id: scan-publish
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/scan-in/publish.txt

      - name: Hash the plan and the branches
        id: hash
        if: >-
          steps.scan-plan.outputs.clean == 'true' && steps.scan-diffs.outputs.clean == 'true'
          && steps.scan-publish.outputs.clean == 'true'
        env:
          OUT: ${{ runner.temp }}/scan-out
        run: |
          sum=$(sha256sum <"$OUT/plan.json")
          echo "plan=${sum%% *}" >>"$GITHUB_OUTPUT"
          if [ -f "$OUT/branches.bundle" ]; then
            sum=$(sha256sum <"$OUT/branches.bundle")
            echo "bundle=${sum%% *}" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload the plan and the branches
        id: upload
        if: steps.hash.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: upstream-apply-changelog-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-out/
          retention-days: 1
          if-no-files-found: error

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  push-branches:
    name: Push Branches
    needs: [select-release, scan]
    if: ${{ !cancelled() && needs.scan.outputs.clean == 'true' && needs.scan.outputs.branches != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    cache-mode: read
    permissions:
      contents: read
      id-token: write
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    outputs:
      skip-reason: ${{ steps.lane-token.outputs.skip-reason }}
      heads: ${{ steps.push.outputs.heads }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-release.outputs.base-sha }}
          path: .base
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.select-release.outputs.standards-sha }}

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Resolve the config
        id: config
        if: steps.kill.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: upstream-apply-changelog
          activity: apply-changelog-branches
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          standards-path: ${{ steps.standards.outputs.path }}

      - name: Download the plan and the branches
        if: steps.config.outcome == 'success' && steps.config.outputs.applies == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact-id }}
          path: ${{ runner.temp }}/plan

      - name: Check the plan and the branches
        id: verify
        if: steps.config.outcome == 'success' && steps.config.outputs.applies == 'true'
        env:
          DIR: ${{ runner.temp }}/plan
          PLAN_SHA256: ${{ needs.scan.outputs.plan-sha256 }}
          BUNDLE_SHA256: ${{ needs.scan.outputs.bundle-sha256 }}
        run: |
          for pair in "plan.json:$PLAN_SHA256" "branches.bundle:$BUNDLE_SHA256"; do
            file="$DIR/${pair%%:*}" want="${pair#*:}"
            if [ -L "$file" ] || [ ! -f "$file" ] || [ "$(stat -c %s "$file")" -gt 1048576 ]; then
              echo "::error::the plan artifact holds no ${pair%%:*} of at most 1 MiB"
              exit 1
            fi
            sum=$(sha256sum <"$file")
            if ! [[ $want =~ ^[0-9a-f]{64}$ ]] || [ "${sum%% *}" != "$want" ]; then
              echo "::error::${pair%%:*} does not match the SHA-256 the scan job recorded"
              exit 1
            fi
          done

      - name: Request the lane token
        id: lane-token
        if: steps.verify.outcome == 'success'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: upstream-apply-changelog
          activity: apply-changelog-branches
          release: ${{ needs.select-release.outputs.release }}
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}
          kill-switch-ok: true

      - name: Push the branches
        id: push
        if: steps.lane-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          API_BUDGET_TOKEN: lanes-app
          RELEASE: ${{ needs.select-release.outputs.release }}
          BASE_SHA: ${{ needs.select-release.outputs.base-sha }}
          PLAN_FILE: ${{ runner.temp }}/plan/plan.json
          BUNDLE_FILE: ${{ runner.temp }}/plan/branches.bundle
          SYNTHETIC: ${{ needs.scan.outputs.synthetic }}
          REPO_DIR: ${{ github.workspace }}/.base
        run: node .base/.github/scripts/upstream-apply-changelog/upstream-apply-changelog.mjs push

      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: bash .base/.github/scripts/lib/revoke-lane-token.sh

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: lanes-app github-token

  publish:
    name: Publish
    needs: [select-release, scan, push-branches]
    if: >-
      ${{ !cancelled() && needs.scan.outputs.clean == 'true'
      && (needs.push-branches.result == 'success' || needs.push-branches.result == 'skipped')
      && needs.push-branches.outputs.skip-reason == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    cache-mode: read
    permissions:
      contents: read
      id-token: write
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-release.outputs.base-sha }}
          path: .base
          persist-credentials: false
          set-safe-directory: false # GIT_CONFIG_GLOBAL is /dev/null, so its --global write cannot land

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.select-release.outputs.standards-sha }}

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Resolve the config
        id: config
        if: steps.kill.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: upstream-apply-changelog
          activity: publish-changelog-intake
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          standards-path: ${{ steps.standards.outputs.path }}

      - name: Download the plan
        if: steps.config.outcome == 'success' && steps.config.outputs.applies == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact-id }}
          path: ${{ runner.temp }}/plan

      - name: Check the plan and the branches
        id: verify
        if: steps.config.outcome == 'success' && steps.config.outputs.applies == 'true'
        env:
          DIR: ${{ runner.temp }}/plan
          PLAN_SHA256: ${{ needs.scan.outputs.plan-sha256 }}
          BUNDLE_SHA256: ${{ needs.scan.outputs.bundle-sha256 }}
        run: |
          pairs=("plan.json:$PLAN_SHA256")
          if [ -n "$BUNDLE_SHA256" ]; then
            pairs+=("branches.bundle:$BUNDLE_SHA256")
          elif [ -e "$DIR/branches.bundle" ] || [ -L "$DIR/branches.bundle" ]; then
            echo "::error::the plan artifact holds a bundle the scan job recorded no SHA-256 for"
            exit 1
          fi
          for pair in "${pairs[@]}"; do
            file="$DIR/${pair%%:*}" want="${pair#*:}"
            if [ -L "$file" ] || [ ! -f "$file" ] || [ "$(stat -c %s "$file")" -gt 1048576 ]; then
              echo "::error::the plan artifact holds no ${pair%%:*} of at most 1 MiB"
              exit 1
            fi
            sum=$(sha256sum <"$file")
            if ! [[ $want =~ ^[0-9a-f]{64}$ ]] || [ "${sum%% *}" != "$want" ]; then
              echo "::error::${pair%%:*} does not match the SHA-256 the scan job recorded"
              exit 1
            fi
          done

      - name: Request the lane token
        id: lane-token
        if: steps.verify.outcome == 'success'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: upstream-apply-changelog
          activity: publish-changelog-intake
          release: ${{ needs.select-release.outputs.release }}
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}
          kill-switch-ok: true

      - name: Open the pull requests and file the handoffs
        id: publish
        if: steps.lane-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          API_BUDGET_TOKEN: lanes-app
          RELEASE: ${{ needs.select-release.outputs.release }}
          BASE_SHA: ${{ needs.select-release.outputs.base-sha }}
          PLAN_FILE: ${{ runner.temp }}/plan/plan.json
          HEADS: ${{ needs.push-branches.outputs.heads }}
        run: node .base/.github/scripts/upstream-apply-changelog/upstream-apply-changelog.mjs publish

      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: bash .base/.github/scripts/lib/revoke-lane-token.sh

      - name: Upload the done marker
        if: steps.publish.outcome == 'success' && steps.publish.outputs.done == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: upstream-apply-changelog-done-${{ needs.select-release.outputs.release }}
          path: ${{ runner.temp }}/plan/plan.json
          retention-days: 90
          if-no-files-found: error

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: lanes-app github-token
