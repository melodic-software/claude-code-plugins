      - name: Extract and compare native surfaces
        if: steps.kill.outputs.proceed == 'true'
        working-directory: .base
        env:
          PACKAGE: ${{ runner.temp }}/claude-cli/node_modules/@anthropic-ai/claude-code
          NATIVE_DIR: ${{ runner.temp }}/native-baseline
        run: |
          binary="$PACKAGE/bin/claude.exe"
          if [[ ! -f "$binary" || -L "$binary" ]] || [[ "$(stat -c %s "$binary")" -le 20000000 ]]; then
