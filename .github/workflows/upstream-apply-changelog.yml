    runs-on: ubuntu-24.04
    timeout-minutes: 10
    cache-mode: read
    permissions:
      contents: read
    env:
      npm_config_globalconfig: ${{ github.workspace }}/.base/.github/npm-fetch.npmrc
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-release.outputs.base-sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Install the release's CLI outside the checkout and verify its registry signatures
        if: steps.kill.outputs.proceed == 'true'
        working-directory: ${{ runner.temp }}
        env:
          RELEASE: ${{ needs.select-release.outputs.release }}
          PREFIX: ${{ runner.temp }}/claude-cli
        run: |
          mkdir -p "$PREFIX"
          printf '{"allowScripts":{"@anthropic-ai/claude-code@%s":true}}\n' "$RELEASE" >"$PREFIX/package.json"
          timeout 4m npm install --registry=https://registry.npmjs.org/ --save-exact --no-audit --no-fund --prefix "$PREFIX" "@anthropic-ai/claude-code@$RELEASE"
          timeout 2m npm audit signatures --registry=https://registry.npmjs.org/ --prefix "$PREFIX"

      - name: Check the claude function's flags
        if: steps.kill.outputs.proceed == 'true'
        env:
          CLAUDE_BIN: ${{ runner.temp }}/claude-cli/node_modules/.bin/claude
        run: node .base/.github/scripts/upstream-apply-changelog/check-claude-function-flags.mjs "$CLAUDE_BIN"

      - name: Log the API budget at the end
