# THROWAWAY verification job for issue #1709 — deleted from this branch once
# the BSD/macOS execution evidence is recorded on the issue. Never merges.
name: tmp-mktemp-bsd-verify-1709
on:
  push:
    branches:
      - cursor/mktemp-portable-form-63e1
permissions: {}
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Verify mktemp candidate forms on BSD/macOS
        shell: sh {0}
        run: |
          echo "=== platform ==="
          uname -a
          sw_vers
          mktemp --version 2>/dev/null | head -1 || echo "mktemp: no --version (BSD)"
          echo '=== 1. candidate file form: mktemp "${TMPDIR:-/tmp}/name-XXXXXX" ==='
          t=$(mktemp "${TMPDIR:-/tmp}/verify1709-XXXXXX") && echo "created: $t" && ls -l "$t" && rm "$t"
          echo '=== 2. candidate dir form: mktemp -d "${TMPDIR:-/tmp}/name-XXXXXX" ==='
          d=$(mktemp -d "${TMPDIR:-/tmp}/verify1709-XXXXXX") && echo "created dir: $d" && rmdir "$d"
          echo "=== 3. suffix-after-Xs template (the trap the rule forbids) ==="
          if s=$(mktemp "${TMPDIR:-/tmp}/verify1709-XXXXXX.html" 2>&1); then
            echo "accepted: $s"; ls -l "$s" 2>/dev/null; rm -f "$s"
          else
            echo "REJECTED: $s"
          fi
          echo "=== 4. bare relative template lands in cwd (the danger) ==="
          w=$(mktemp -d "${TMPDIR:-/tmp}/verify1709-cwd-XXXXXX")
          ( cd "$w" && r=$(mktemp verify1709-XXXXXX) && echo "created: $r (cwd=$(pwd))" )
          rm -rf "$w"
          echo "=== 5. GNU-only flags on BSD ==="
          mktemp --tmpdir 2>&1 | head -1 || true
          echo "=== done ==="
