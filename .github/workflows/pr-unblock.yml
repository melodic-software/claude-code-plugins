name: pr-unblock

# Lane caller for pr-unblock: its file stem is the lane, so the lanes token
# broker accepts its write activities. No App key; each run job's OIDC token is
# exchanged at LANES_BROKER_URL for audience LANES_BROKER_AUDIENCE.
# Job contract: docs/conventions/pr-pipeline/pr-run-activity.md.
#
# workflow_dispatch only. resolve-conflicts: GitHub runs no pull_request
# workflow on a conflicting PR, so pr-unblock-dispatch.yml sends one dispatch
# per conflicting PR after a push to the default branch; a base job merges the
# default branch tip into the head and decides, a read model job resolves the
# conflicts and hands them on as a patch, and a script job commits the merge.
# address-feedback:
# pr-feedback-dispatch.yml sends one after a review lane finishes on a lanes App
# PR with unresolved reviewer-bot threads; a base job keeps the threads, a read
# model job answers them, and script jobs push its patch and post its replies.
# review-dependency:
# pr-unblock-dispatch.yml also sends one per review-tier Dependabot PR (a major
# bump, an action publisher outside the allowlist, a group holding a major, or
# a red ci-status) whose head has no review yet; a base job selects the PR, a
# read model job returns a verdict and any fix as a patch, and script jobs
# push a fix verdict's patch and act on the verdict. fix-ci: pr-unblock-dispatch.yml
# also sends one per lanes App PR whose ci-status or pr-test-windows run failed
# past the lost-run reconciler's re-run. All set dispatcher-run-id; a trusted
# human may dispatch with pr-number and activity alone. Every job trusts the
# default branch tip, since a conflicting PR's base SHA is stale and the
# dispatchers run from the tip.

# feedback-dispatch.mjs and dispatch.mjs read this title to skip a second
# dispatch while one for the same activity and PR is still queued or going.
# Quoted: unquoted, " #" would start a YAML comment and drop the PR number.
run-name: "pr-unblock ${{ inputs.activity }} #${{ inputs.pr-number }}"

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: The PR to unblock.
        required: true
        type: string
      activity:
        description: What to unblock.
        required: false
        type: choice
        options: [resolve-conflicts, address-feedback, review-dependency, fix-ci]
        default: resolve-conflicts
      dispatcher-run-id:
        description: The dispatcher run that sent this dispatch; empty for a human dispatch.
        required: false
        type: string
        default: ""

permissions: {}

# A newer dispatch of the same activity for the same PR replaces one still
# waiting; a running one finishes.
concurrency:
  group: pr-unblock-${{ inputs.activity }}-${{ inputs.pr-number }}
  cancel-in-progress: false

jobs:
  # resolve-conflicts is five jobs, so no model ever holds a write token or
  # runs git. This one runs only base code with a read-only token. Before any
  # model turn it reads the PR head, resolves the slot (draft, held and
  # mergeable PRs skip it), pins the default branch tip as the base, checks
  # out the head with no credentials, and merges the base into it with the
  # base's prepare.sh, copied out and hashed first: clean (the push job
  # commits the merge with no model), conflicted (the model resolves) or
  # escalate (the repeat cap, a protected path, or a conflict no model can
  # resolve from markers). Every gate, head, base and conflict tree the jobs
  # after it take comes from here, and every model-call input from a model
  # call's scan job, never from its run job, whose runner head code could
  # forge.
  resolve-conflicts-select:
    if: >-
      inputs.pr-number != '' && inputs.activity == 'resolve-conflicts'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out main and the PR head
      pull-requests: read # the PR's head and mergeable state
    outputs:
      # true only for a conflicted merge; false on a skip, a clean merge or
      # an escalation; empty when the job stopped before deciding.
      proceed: >-
        ${{ steps.prepare.outputs.merge-state == 'conflicted' && 'true'
        || (steps.slot.outputs.applies == 'false' || steps.hold.outputs.held == 'true' || steps.prepare.outputs.merge-state != '') && 'false' || '' }}
      merge-state: ${{ steps.prepare.outputs.merge-state }}
      head-sha: ${{ steps.head.outputs.sha }}
      base-sha: ${{ steps.base-sha.outputs.sha }}
      conflict-tree: ${{ steps.prepare.outputs.conflict-tree }}
      escalation-reason: ${{ steps.prepare.outputs.escalation-reason }}
      skip-reason: >-
        ${{ steps.slot.outputs.applies == 'false' && steps.slot.outputs.skip-reason
        || steps.hold.outputs.held == 'true' && 'awaiting-human' || '' }}
      # true when another lane's escalation put the human-gated label on, so
      # apply-conflict-patch pushes past it (lane-hold.mjs).
      lane-escalated: ${{ steps.hold.outputs.lane-escalated }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Read the PR head
        id: head
        if: steps.kill.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          if ! [[ $PR_NUMBER =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::the pr-number input is not a PR number"
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          if ! [[ $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the PR names no head SHA"
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # As the read runner resolves it: its applies-when decides on the head
      # just read, before any merge.
      - name: Resolve the slot
        id: slot
        if: steps.head.outcome == 'success'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: resolve-conflicts
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          pr-number: ${{ inputs.pr-number }}
          head-sha: ${{ steps.head.outputs.sha }}
          prepare-supported: "true"
          applied-by-supported: patch

      # The human-gated label holds the PR unless another lane's escalation
      # put it on; do-not-merge stays with the slot's labels-absent.
      - name: Check the human-gated hold
        id: hold
        if: steps.slot.outputs.applies == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          ACTIVITY: resolve-conflicts
        run: node .base/.github/scripts/pr-unblock/lane-hold.mjs

      # The base every merge of this round uses: the default branch tip now,
      # pinned, so the read runner and the push job merge the same commit
      # however the branch moves.
      - name: Pin the base
        id: base-sha
        if: steps.hold.outputs.held == 'false'
        run: |
          sha=$(git -C .base rev-parse HEAD)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the default branch tip is not a commit id"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # The base's merge scripts and version-bump script, never the head's,
      # each with its SHA-256, which the merge step checks; the repeat cap
      # reads loop.no-progress from the resolved config.
      - name: Copy the merge scripts from the base
        id: merge-bin
        if: steps.hold.outputs.held == 'false'
        env:
          BIN: ${{ runner.temp }}/merge-base-bin
          RESOLVED: ${{ runner.temp }}/resolved-config.json
        run: |
          mkdir -p "$BIN"
          for file in .base/.github/scripts/merge-base/prepare.sh \
            .base/plugins/source-control/scripts/resolve-version-bump-conflict.sh; do
            name=$(basename "$file" .sh)
            cp "$file" "$BIN/$name.sh"
            sum=$(sha256sum <"$BIN/$name.sh")
            echo "$name-sha256=${sum%% *}" >>"$GITHUB_OUTPUT"
          done
          no_progress=$(jq -r '.loop["no-progress"] // empty' "$RESOLVED")
          if ! [[ $no_progress =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the resolved config holds no loop.no-progress"
            exit 1
          fi
          echo "no-progress=$no_progress" >>"$GITHUB_OUTPUT"

      # Full history: the merge needs the merge base and the pinned base. No
      # credentials stay behind, and no head code runs.
      - name: Check out the PR head
        if: steps.hold.outputs.held == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.head.outputs.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      # prepare.sh merges the pinned base without committing, runs the
      # version-bump script, and decides; only whitelisted, validated
      # key=value lines become outputs. The identity is the lanes bot's: git
      # refuses even a --no-commit merge without one, and the repeat cap
      # counts commits by that author name.
      - name: Merge the base into the head
        id: prepare
        if: steps.hold.outputs.held == 'false'
        working-directory: head
        env:
          GIT_AUTHOR_NAME: melodic-automation-lanes[bot]
          GIT_AUTHOR_EMAIL: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}+melodic-automation-lanes[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: melodic-automation-lanes[bot]
          GIT_COMMITTER_EMAIL: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}+melodic-automation-lanes[bot]@users.noreply.github.com
          LOOP_NO_PROGRESS: ${{ steps.merge-bin.outputs.no-progress }}
          # Replace refs from the head's history never stand in for objects.
          GIT_NO_REPLACE_OBJECTS: "1"
          BIN: ${{ runner.temp }}/merge-base-bin
          OUT: ${{ runner.temp }}/merge-base-out
          PREPARE_SHA256: ${{ steps.merge-bin.outputs.prepare-sha256 }}
          BUMP_SHA256: ${{ steps.merge-bin.outputs.resolve-version-bump-conflict-sha256 }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          BASE_SHA: ${{ steps.base-sha.outputs.sha }}
        run: bash "$GITHUB_WORKSPACE/.base/.github/scripts/merge-base/run-prepare.sh"

  # A select that skipped, merged cleanly, or handed the PR to a person runs
  # no model job, so no resolve-conflicts check would land on the head and
  # dispatch.mjs would dispatch it again on every run. This job posts it
  # neutral on the head the select job read: the slot's skip reason, else
  # clean-merge (the push job commits it), else awaiting-human. A
  # kill-switch stop reads no head, and nothing is posted.
  resolve-conflicts-not-run:
    needs: resolve-conflicts-select
    if: >-
      ${{ !cancelled() && inputs.activity == 'resolve-conflicts'
      && needs.resolve-conflicts-select.outputs.proceed == 'false'
      && needs.resolve-conflicts-select.outputs.head-sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Post the resolve-conflicts check run
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: resolve-conflicts
          run-result: skipped
          not-run-reason: >-
            ${{ needs.resolve-conflicts-select.outputs.skip-reason
            || needs.resolve-conflicts-select.outputs.merge-state == 'clean' && 'clean-merge'
            || 'awaiting-human' }}
          head-sha: ${{ needs.resolve-conflicts-select.outputs.head-sha }}
          can-commit: "false"
          base-path: .base
          head-sha-fallback: ${{ needs.resolve-conflicts-select.outputs.head-sha }}
          github-token: ${{ github.token }}

  # The model job: a read activity with no write token and no OIDC token in
  # the job that runs head code. The runner merges the select job's base
  # again, refuses any conflict tree but the select job's, and gives the
  # skill the conflicts as read-only files with no git or Bash; the skill
  # resolves them in place and the runner hands its edits on as a patch
  # measured from the conflict tree. It runs on the pr-unblock role's API
  # key alone, in the per-PR write queue.
  resolve-conflicts:
    needs: resolve-conflicts-select
    if: ${{ !cancelled() && needs.resolve-conflicts-select.outputs.proceed == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    # One per-PR queue shared by every write lane: it queues, never cancels.
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: resolve-conflicts
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      head-sha: ${{ needs.resolve-conflicts-select.outputs.head-sha }}
      merge-base-sha: ${{ needs.resolve-conflicts-select.outputs.base-sha }}
      merge-conflict-tree: ${{ needs.resolve-conflicts-select.outputs.conflict-tree }}
      # The 50-minute launcher step, the CLI install and the merge.
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether resolve-conflicts's report job posted its check, read from this
  # run's jobs as fix-ci-handoff reads fix-ci's, never from a resolve-conflicts
  # output: the run job runs head code and can forge them. A failed read
  # leaves posted empty, which starts the fallback call.
  resolve-conflicts-handoff:
    needs: [resolve-conflicts-select, resolve-conflicts]
    if: ${{ !cancelled() && needs.resolve-conflicts-select.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      posted: ${{ steps.posted.outputs.posted }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          sparse-checkout: .github/scripts/lib/handoff-evidence.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether resolve-conflicts posted its check
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: resolve-conflicts
        run: bash .base/.github/scripts/lib/handoff-evidence.sh posted

  # The subscription fallback, as fix-ci-subscription is for fix-ci: it runs
  # only when resolve-conflicts-handoff read no check posted, which a credit
  # stop or an empty key leaves, and holds the OAuth token alone.
  resolve-conflicts-subscription:
    needs: [resolve-conflicts-select, resolve-conflicts, resolve-conflicts-handoff]
    if: >-
      ${{ !cancelled() && needs.resolve-conflicts-select.outputs.proceed == 'true'
      && needs.resolve-conflicts-handoff.outputs.posted != 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: resolve-conflicts
      fallback: handoff
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      head-sha: ${{ needs.resolve-conflicts-select.outputs.head-sha }}
      merge-base-sha: ${{ needs.resolve-conflicts-select.outputs.base-sha }}
      merge-conflict-tree: ${{ needs.resolve-conflicts-select.outputs.conflict-tree }}
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.PR_UNBLOCK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # The push job: apply-patch.mjs under patch-rules.json's merge-base row, a
  # script with no model that runs no head code. It merges the select job's
  # pinned base into the head again, refuses any conflict tree but the
  # select job's, applies the patch to that tree, admits only marker-free
  # resolutions of the conflicted paths, skips a head that moved since the
  # select job read it, and pushes one merge commit with the head and the
  # base as parents, without force. A clean merge commits with no patch; an
  # empty patch leaves the conflicts to a person (unresolved-conflict). One
  # leg answers a conflicted round: the fallback call when it ran, else the
  # first, and every model-call input below is that leg's scan job's.
  apply-conflict-patch:
    needs: [resolve-conflicts-select, resolve-conflicts, resolve-conflicts-subscription]
    if: >-
      ${{ !cancelled()
      && (needs.resolve-conflicts-select.outputs.merge-state == 'clean'
      || needs.resolve-conflicts-select.outputs.proceed == 'true'
      && ((needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-patch-state || needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-patch-state || '') == 'written'
      || (needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-patch-state || needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-patch-state || '') == 'empty')) }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: apply-conflict-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      # The scan job's outputs alone, never a run job's, from the one leg;
      # empty for a clean merge, which no model call answered.
      patch-state: ${{ needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-patch-state || needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-patch-state || '' }}
      patch-sha256: ${{ needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-patch-sha256 || needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-patch-sha256 || '' }}
      patch-attempt: ${{ needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-patch-attempt || needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-patch-attempt || '' }}
      reply-attempt: ${{ needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-reply-attempt || needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-reply-attempt || '' }}
      patch-activity: resolve-conflicts
      patch-prepare: merge-base
      # The head, pinned base, merge state and conflict tree the select job
      # decided on, from a job that ran no head code or model.
      patch-head-sha: ${{ needs.resolve-conflicts-select.outputs.head-sha }}
      patch-merge-base-sha: ${{ needs.resolve-conflicts-select.outputs.base-sha }}
      patch-merge-state: ${{ needs.resolve-conflicts-select.outputs.merge-state }}
      patch-conflict-tree: ${{ needs.resolve-conflicts-select.outputs.conflict-tree }}
      # true drops the human-gated label from the holds: another lane's
      # escalation put it on (lane-hold.mjs).
      patch-fix-requested: ${{ needs.resolve-conflicts-select.outputs.lane-escalated }}

  # A conflicted round whose answering leg handed on no patch state, which a
  # scan that refused the model's output (a leak-scan block, an oversize
  # patch) leaves, so apply-conflict-patch did not run. This script job, with
  # no model and no head code, downloads every attempt's scan-refusal marker
  # for resolve-conflicts by name, never a job output (a failed job's outputs
  # are not documented to reach this caller), and escalates
  # unresolved-conflict when one says the scan refused
  # (conflict-scan-refusal.mjs). No marker escalates nothing.
  conflict-scan-refusal:
    needs: [resolve-conflicts-select, resolve-conflicts, resolve-conflicts-subscription]
    if: >-
      ${{ !cancelled() && needs.resolve-conflicts-select.outputs.proceed == 'true'
      && (needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-patch-state || needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-patch-state || '') != 'written'
      && (needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-patch-state || needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-patch-state || '') != 'empty' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      escalation-reason: ${{ steps.refusal.outputs.escalation-reason }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # A pattern that matches nothing downloads nothing and succeeds; a
      # failed download reads as a refusal.
      - name: Download the scan refusal markers
        id: scan-refused
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scan-refused-pr-unblock-resolve-conflicts-*
          path: ${{ runner.temp }}/scan-refused
          merge-multiple: true

      - name: Read the scan refusal
        id: refusal
        env:
          SCAN_REFUSED_DIR: ${{ runner.temp }}/scan-refused
          SCAN_REFUSED_READ: ${{ steps.scan-refused.outcome }}
        run: node .base/.github/scripts/pr-unblock/conflict-scan-refusal.mjs

  # address-feedback is five jobs, so no model ever holds a write token. This
  # one runs only base code with a read-only token and checks out no PR head.
  # Before any model turn it reads the PR head, resolves the slot (draft and
  # do-not-merge skip it), and keeps the reviewer-bot threads to work on
  # (address-feedback.mjs select): it skips, hands the PR to a person (a
  # .github/ diff or the round cap), or writes the thread file and run.json
  # the model job and the reply job read. Every gate, head and reply input
  # the jobs after it take comes from here, never from the model job, whose
  # runner head code could forge.
  address-feedback-select:
    if: >-
      inputs.pr-number != '' && inputs.activity == 'address-feedback'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out main
      pull-requests: read # the PR, its reviews, review comments and threads
      checks: read # the model check runs that count rounds
    outputs:
      # true once the context is uploaded; false on a skip or an escalation;
      # empty when the job stopped before deciding.
      proceed: >-
        ${{ steps.upload.outcome == 'success' && 'true'
        || (steps.slot.outputs.applies == 'false' || steps.select.outputs.proceed == 'false') && 'false' || '' }}
      head-sha: ${{ steps.head.outputs.sha }}
      escalation-reason: ${{ steps.select.outputs.escalation-reason }}
      skip-reason: ${{ steps.slot.outputs.applies == 'false' && steps.slot.outputs.skip-reason || steps.select.outputs.skip-reason }}
      fix-requested: ${{ steps.select.outputs.fix-requested }}
      # `round <N> of max <M>` when the round cap stopped the PR, for the
      # neutral checks' summary.
      not-run-detail: ${{ steps.select.outputs.not-run-detail }}
      threads-sha256: ${{ steps.select.outputs.threads-sha256 }}
      run-sha256: ${{ steps.select.outputs.run-sha256 }}
      # The artifact name's attempt, so a re-run of a later job alone still
      # finds it.
      context-attempt: ${{ steps.upload.outcome == 'success' && github.run_attempt || '' }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Read the PR head
        id: head
        if: steps.kill.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          if ! [[ $PR_NUMBER =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::the pr-number input is not a PR number"
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          if ! [[ $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the PR names no head SHA"
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # As the read runner resolves it: its applies-when decides on the head
      # just read, before any thread is read.
      - name: Resolve the slot
        id: slot
        if: steps.head.outcome == 'success'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: address-feedback
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          pr-number: ${{ inputs.pr-number }}
          head-sha: ${{ steps.head.outputs.sha }}
          prepare-supported: "true"
          applied-by-supported: patch feedback-replies

      - name: Select the review threads
        id: select
        if: steps.slot.outputs.applies == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          FEEDBACK_DIR: ${{ runner.temp }}/feedback-context
          TRUSTED_ACTORS: .base/.github/standards/trusted-actors/trusted-actors.json
          TRACKER_CONFIG: .base/.work-item-tracker.json
          RESOLVED: ${{ runner.temp }}/resolved-config.json
        run: |
          mkdir -p "$FEEDBACK_DIR"
          REVIEW_ROUNDS=$(jq -r '.loop["review-rounds"]' "$RESOLVED")
          export REVIEW_ROUNDS
          THREAD_FILE="$FEEDBACK_DIR/threads.json" RUN_FILE="$FEEDBACK_DIR/run.json" \
            node .base/.github/scripts/pr-unblock/address-feedback.mjs select
          if [ -f "$FEEDBACK_DIR/threads.json" ]; then
            for name in threads run; do
              sum=$(sha256sum <"$FEEDBACK_DIR/$name.json")
              echo "$name-sha256=${sum%% *}" >>"$GITHUB_OUTPUT"
            done
          fi

      - name: Upload the feedback context
        id: upload
        if: steps.select.outputs.proceed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feedback-context-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/feedback-context/threads.json
            ${{ runner.temp }}/feedback-context/run.json
          retention-days: 1
          if-no-files-found: error

  # A select that kept nothing, or handed the PR to a person, runs no model
  # or reply job, so neither check would land on the head and
  # feedback-dispatch.mjs would dispatch it again. This job posts both
  # neutral on the head the select job read; a kill-switch stop reads none,
  # and nothing is posted.
  address-feedback-not-run:
    needs: address-feedback-select
    if: >-
      ${{ !cancelled() && inputs.activity == 'address-feedback'
      && needs.address-feedback-select.outputs.proceed == 'false'
      && needs.address-feedback-select.outputs.head-sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Post the address-feedback check run
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: address-feedback
          run-result: skipped
          not-run-reason: ${{ needs.address-feedback-select.outputs.skip-reason || 'awaiting-human' }}
          not-run-detail: ${{ needs.address-feedback-select.outputs.not-run-detail }}
          head-sha: ${{ needs.address-feedback-select.outputs.head-sha }}
          can-commit: "false"
          base-path: .base
          head-sha-fallback: ${{ needs.address-feedback-select.outputs.head-sha }}
          github-token: ${{ github.token }}

      - name: Post the publish-feedback check run
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: publish-feedback
          run-result: skipped
          not-run-reason: ${{ needs.address-feedback-select.outputs.skip-reason || 'awaiting-human' }}
          not-run-detail: ${{ needs.address-feedback-select.outputs.not-run-detail }}
          head-sha: ${{ needs.address-feedback-select.outputs.head-sha }}
          can-commit: "false"
          base-path: .base
          head-sha-fallback: ${{ needs.address-feedback-select.outputs.head-sha }}
          github-token: ${{ github.token }}

  # The model job: a read activity with no write token and no OIDC token in
  # the job that runs head code. The skill fixes the kept threads and records
  # a reply for each with the review-thread tool; the runner uploads its
  # uncommitted edits as a patch and, after its leak scan, its replies. It
  # runs on the pr-unblock role's API key alone, in the per-PR write queue.
  address-feedback:
    needs: address-feedback-select
    if: ${{ !cancelled() && needs.address-feedback-select.outputs.proceed == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: address-feedback
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      feedback-context-attempt: ${{ needs.address-feedback-select.outputs.context-attempt }}
      feedback-context-sha256: ${{ needs.address-feedback-select.outputs.threads-sha256 }}
      head-sha: ${{ needs.address-feedback-select.outputs.head-sha }}
      # The 50-minute launcher step and the CLI install.
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether address-feedback's report job posted its check, read from this run's
  # jobs as fix-ci-handoff reads fix-ci's, never from an address-feedback
  # output: the run job runs head code and can forge them. A failed read
  # leaves posted empty, which starts the fallback call.
  address-feedback-handoff:
    needs: [address-feedback-select, address-feedback]
    if: ${{ !cancelled() && needs.address-feedback-select.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      posted: ${{ steps.posted.outputs.posted }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          sparse-checkout: .github/scripts/lib/handoff-evidence.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether address-feedback posted its check
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: address-feedback
        run: bash .base/.github/scripts/lib/handoff-evidence.sh posted

  # The subscription fallback, as fix-ci-subscription is for fix-ci: it runs
  # only when address-feedback-handoff read no check posted, which a credit
  # stop or an empty key leaves, and holds the OAuth token alone.
  address-feedback-subscription:
    needs: [address-feedback-select, address-feedback, address-feedback-handoff]
    if: >-
      ${{ !cancelled() && needs.address-feedback-select.outputs.proceed == 'true'
      && needs.address-feedback-handoff.outputs.posted != 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: address-feedback
      fallback: handoff
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      feedback-context-attempt: ${{ needs.address-feedback-select.outputs.context-attempt }}
      feedback-context-sha256: ${{ needs.address-feedback-select.outputs.threads-sha256 }}
      head-sha: ${{ needs.address-feedback-select.outputs.head-sha }}
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.PR_UNBLOCK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # The push job: apply-patch.mjs under patch-rules.json's review-threads
  # row, a script with no model that runs no head code. It admits only paths
  # in the kept threads' scope, read from the select job's thread file, skips
  # a head that moved since the select job read it, and pushes one commit
  # without force. It runs only on a written patch: no change (every thread
  # INCORRECT or UNCERTAIN) needs no push. report-escalation does not need it:
  # a patch that does not land leaves no fix commit, and publish-feedback
  # hands the PR to a person as feedback-not-landed.
  apply-feedback-patch:
    # After adjudicate-feedback too, so the push lands right before the reply
    # job: a review run on the pushed head that finishes while this run still
    # goes would find it in progress, skip, and start no next round.
    needs: [address-feedback-select, address-feedback, address-feedback-subscription, adjudicate-feedback]
    # One leg answers the round: the fallback call when it ran, else the
    # first, and every model-call input below is that leg's, so one leg's
    # patch never pairs with the other's replies and an empty field never
    # falls through. A patch with no replies is not pushed.
    if: >-
      ${{ !cancelled()
      && (needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.scan-patch-state || needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.scan-patch-state || '') == 'written'
      && (needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-attempt || needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-attempt || '') != '' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: apply-feedback-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      # The scan job's outputs alone, never a run job's, from the one leg.
      patch-state: ${{ needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.scan-patch-state || needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.scan-patch-state || '' }}
      patch-sha256: ${{ needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.scan-patch-sha256 || needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.scan-patch-sha256 || '' }}
      patch-attempt: ${{ needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.scan-patch-attempt || needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.scan-patch-attempt || '' }}
      patch-activity: address-feedback
      patch-prepare: review-threads
      # The head the select job read, from a job that ran no head code.
      patch-head-sha: ${{ needs.address-feedback-select.outputs.head-sha }}
      patch-threads-attempt: ${{ needs.address-feedback-select.outputs.context-attempt }}
      patch-threads-sha256: ${{ needs.address-feedback-select.outputs.threads-sha256 }}
      # true drops the human-gated label from the holds: the select job kept
      # only threads a trusted person with write access asked to fix, or a
      # lane escalation put the label on (gate-source.mjs).
      patch-fix-requested: ${{ needs.address-feedback-select.outputs.fix-requested }}
      reply-attempt: ${{ needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.scan-reply-attempt || needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.scan-reply-attempt || '' }}

  # The adjudicator, after the model job and before the reply job, only when
  # the answering leg's scan job read an INCORRECT reply (feedback-disputed);
  # skipping it leaves any such reply with no verdict, which escalates
  # feedback-unadjudicated. For each INCORRECT reply on a non-CRITICAL
  # code-review thread no adjudication stood before, up to three
  # (adjudicate-feedback.mjs MAX_THREADS), a fresh-context model reads the
  # whole review comment, the locations the reviewer and the lane cited and
  # those files at the head the select job read, never the lane's note, and
  # returns lane, reviewer or human as structured output. The job runs only
  # base code, holds a read-only token and no OIDC token, and runs each model
  # call on run-claude-cli under dontAsk with Read alone, confined to its
  # slot; the model route is adjudicate-feedback (pr-pipeline.yaml
  # models.routes). Its verdicts leave as one artifact whose SHA-256 the reply
  # job checks, so an artifact the model job's head code uploaded under that
  # name fails this upload and reads as none. No verdict for a thread, a
  # skipped job or an empty key escalates it as feedback-unadjudicated.
  adjudicate-feedback:
    needs: [address-feedback-select, address-feedback, address-feedback-subscription]
    if: >-
      ${{ !cancelled() && needs.address-feedback-select.outputs.proceed == 'true'
      && (needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-attempt || needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-attempt || '') != ''
      && (needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-disputed || needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-disputed || '') == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read # the base checkout and the disputed files at the head
    outputs:
      attempt: ${{ steps.upload.outcome == 'success' && github.run_attempt || '' }}
      sha256: ${{ steps.upload.outcome == 'success' && steps.collect.outputs.sha256 || '' }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # The select job's thread file and the scan job's replies, from the one
      # leg the reply job reads; prepare checks each against its writer's SHA-256.
      - name: Download the feedback context
        if: steps.kill.outputs.proceed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feedback-context-${{ needs.address-feedback-select.outputs.context-attempt }}
          path: ${{ runner.temp }}/adjudicate-input

      - name: Download the review-thread replies
        if: steps.kill.outputs.proceed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feedback-replies-pr-unblock-address-feedback-${{ needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-attempt || needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-attempt || '' }}
          path: ${{ runner.temp }}/adjudicate-input

      - name: Stage the disputed threads
        id: prepare
        if: steps.kill.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          HEAD_SHA: ${{ needs.address-feedback-select.outputs.head-sha }}
          THREADS_FILE: ${{ runner.temp }}/adjudicate-input/threads.json
          THREADS_SHA256: ${{ needs.address-feedback-select.outputs.threads-sha256 }}
          REPLIES_FILE: ${{ runner.temp }}/adjudicate-input/replies.jsonl
          REPLIES_SHA256: ${{ needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-sha256 || needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-sha256 || '' }}
          OUT_DIR: ${{ runner.temp }}/adjudicate
        run: node .base/.github/scripts/pr-unblock/adjudicate-feedback.mjs prepare

      - name: Resolve the adjudicator's model
        id: models
        if: fromJSON(steps.prepare.outputs.count || '0') > 0
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: adjudicate-feedback
          base-path: .base
          output-path: ${{ runner.temp }}/adjudicate-models.json

      # Only whether the secret is set leaves this step, never its value.
      - name: Check the API key
        id: key
        if: steps.models.outcome == 'success'
        env:
          PRESENT: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY != '' }}
        run: |
          if [ "$PRESENT" != true ]; then
            echo "::warning::PR_UNBLOCK_CLAUDE_API_KEY is empty; no disputed thread is adjudicated"
          fi
          echo "present=$PRESENT" >>"$GITHUB_OUTPUT"

      # run-claude-cli refuses to run without these root-owned settings, which
      # need sudo, so they are written before the runner is isolated.
      - name: Apply the Claude managed settings
        if: steps.key.outputs.present == 'true'
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@d02b8697e092705153f0996549b05f95a446bb52 # v0.65.0

      # Nothing after this step needs sudo or docker.
      - name: Isolate the runner
        if: steps.key.outputs.present == 'true'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: "true"

      # One fresh model call per thread: each sees only its own slot, copied
      # into the workspace, the one tree run-claude-cli reads. The judge has
      # Read alone, as pr-verify's verifier does: evidence.json names every
      # file it needs, so Glob and Grep are denied rather than trusted to
      # honor Read denials. The Read denials keep the base checkout and the
      # runner's temp files (the lane's replies.jsonl, the other slots) out
      # (code.claude.com/docs/en/permissions, "Read and Edit"). Each staged
      # file carries a .txt suffix, so a cited CLAUDE.md or .claude/** file
      # is never loaded as instructions. The steps repeat once per slot up to MAX_THREADS
      # (workflow-gates.test.mjs pins the count and their grants).

      - name: Stage disputed thread 0
        if: steps.key.outputs.present == 'true' && fromJSON(steps.prepare.outputs.count || '0') > 0
        env:
          SLOT_DIR: ${{ runner.temp }}/adjudicate/0
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}/adjudicate"
          cp -R "$SLOT_DIR" "$GITHUB_WORKSPACE/adjudicate"

      - name: Adjudicate disputed thread 0
        id: judge-0
        if: steps.key.outputs.present == 'true' && fromJSON(steps.prepare.outputs.count || '0') > 0
        continue-on-error: true
        timeout-minutes: 20
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@d02b8697e092705153f0996549b05f95a446bb52 # v0.65.0
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          LD_LIBRARY_PATH: ""
        with:
          lane: adjudicate-feedback
          role: pr-unblock
          prompt-file: ${{ github.workspace }}/.base/.github/scripts/pr-unblock/adjudicate-feedback.prompt.md
          preamble: You are running unattended in GitHub Actions. No person can answer a question during this run, and you change nothing.
          api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./adjudicate/**)
          disallowed-tools: |
            Read(./.base/**)
            Read(/${{ runner.temp }}/**)
            Read(//proc/**)
            Glob
            Grep
            mcp__*
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            Skill
          json-schema-file: ${{ github.workspace }}/.base/.github/scripts/pr-unblock/adjudicate-feedback.schema.json
          leg-timeout-minutes: "15"

      # A leg in another permission mode, or with no init message, keeps no
      # verdict (check-permission-mode.sh); its thread reads as unadjudicated.
      - name: Keep disputed thread 0's verdict
        if: always() && steps.judge-0.outputs.structured-output-file != ''
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.judge-0.outputs.execution-file }}
          MODE: dontAsk
          OUTPUT_FILE: ${{ steps.judge-0.outputs.structured-output-file }}
          SLOT_DIR: ${{ runner.temp }}/adjudicate/0
        run: |
          bash .base/.github/scripts/read-patch/check-permission-mode.sh
          cp "$OUTPUT_FILE" "$SLOT_DIR/verdict.json"

      - name: Stage disputed thread 1
        if: steps.key.outputs.present == 'true' && fromJSON(steps.prepare.outputs.count || '0') > 1
        env:
          SLOT_DIR: ${{ runner.temp }}/adjudicate/1
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}/adjudicate"
          cp -R "$SLOT_DIR" "$GITHUB_WORKSPACE/adjudicate"

      - name: Adjudicate disputed thread 1
        id: judge-1
        if: steps.key.outputs.present == 'true' && fromJSON(steps.prepare.outputs.count || '0') > 1
        continue-on-error: true
        timeout-minutes: 20
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@d02b8697e092705153f0996549b05f95a446bb52 # v0.65.0
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          LD_LIBRARY_PATH: ""
        with:
          lane: adjudicate-feedback
          role: pr-unblock
          prompt-file: ${{ github.workspace }}/.base/.github/scripts/pr-unblock/adjudicate-feedback.prompt.md
          preamble: You are running unattended in GitHub Actions. No person can answer a question during this run, and you change nothing.
          api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./adjudicate/**)
          disallowed-tools: |
            Read(./.base/**)
            Read(/${{ runner.temp }}/**)
            Read(//proc/**)
            Glob
            Grep
            mcp__*
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            Skill
          json-schema-file: ${{ github.workspace }}/.base/.github/scripts/pr-unblock/adjudicate-feedback.schema.json
          leg-timeout-minutes: "15"

      # A leg in another permission mode, or with no init message, keeps no
      # verdict (check-permission-mode.sh); its thread reads as unadjudicated.
      - name: Keep disputed thread 1's verdict
        if: always() && steps.judge-1.outputs.structured-output-file != ''
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.judge-1.outputs.execution-file }}
          MODE: dontAsk
          OUTPUT_FILE: ${{ steps.judge-1.outputs.structured-output-file }}
          SLOT_DIR: ${{ runner.temp }}/adjudicate/1
        run: |
          bash .base/.github/scripts/read-patch/check-permission-mode.sh
          cp "$OUTPUT_FILE" "$SLOT_DIR/verdict.json"

      - name: Stage disputed thread 2
        if: steps.key.outputs.present == 'true' && fromJSON(steps.prepare.outputs.count || '0') > 2
        env:
          SLOT_DIR: ${{ runner.temp }}/adjudicate/2
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}/adjudicate"
          cp -R "$SLOT_DIR" "$GITHUB_WORKSPACE/adjudicate"

      - name: Adjudicate disputed thread 2
        id: judge-2
        if: steps.key.outputs.present == 'true' && fromJSON(steps.prepare.outputs.count || '0') > 2
        continue-on-error: true
        timeout-minutes: 20
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@d02b8697e092705153f0996549b05f95a446bb52 # v0.65.0
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          LD_LIBRARY_PATH: ""
        with:
          lane: adjudicate-feedback
          role: pr-unblock
          prompt-file: ${{ github.workspace }}/.base/.github/scripts/pr-unblock/adjudicate-feedback.prompt.md
          preamble: You are running unattended in GitHub Actions. No person can answer a question during this run, and you change nothing.
          api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./adjudicate/**)
          disallowed-tools: |
            Read(./.base/**)
            Read(/${{ runner.temp }}/**)
            Read(//proc/**)
            Glob
            Grep
            mcp__*
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            Skill
          json-schema-file: ${{ github.workspace }}/.base/.github/scripts/pr-unblock/adjudicate-feedback.schema.json
          leg-timeout-minutes: "15"

      # A leg in another permission mode, or with no init message, keeps no
      # verdict (check-permission-mode.sh); its thread reads as unadjudicated.
      - name: Keep disputed thread 2's verdict
        if: always() && steps.judge-2.outputs.structured-output-file != ''
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.judge-2.outputs.execution-file }}
          MODE: dontAsk
          OUTPUT_FILE: ${{ steps.judge-2.outputs.structured-output-file }}
          SLOT_DIR: ${{ runner.temp }}/adjudicate/2
        run: |
          bash .base/.github/scripts/read-patch/check-permission-mode.sh
          cp "$OUTPUT_FILE" "$SLOT_DIR/verdict.json"

      - name: Collect the verdicts
        id: collect
        if: always() && fromJSON(steps.prepare.outputs.count || '0') > 0
        env:
          OUT_DIR: ${{ runner.temp }}/adjudicate
          VERDICTS_FILE: ${{ runner.temp }}/adjudication/verdicts.json
        run: |
          mkdir -p "$(dirname "$VERDICTS_FILE")"
          node .base/.github/scripts/pr-unblock/adjudicate-feedback.mjs collect

      # overwrite: false, so a copy the model job's head code uploaded first
      # fails this upload, and the reply job reads no verdicts.
      - name: Upload the verdicts
        id: upload
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feedback-adjudication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adjudication/verdicts.json
          retention-days: 1
          if-no-files-found: error
          overwrite: false

      # The prepare step's contents reads, from their own responses.
      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The reply job, a script with no model: it holds pull-requests: write and
  # posts the replies the model job recorded, exactly as written or not at
  # all, naming the commit the push job made, then the round marker. It runs
  # whenever the select job proceeded, whatever the model and push jobs did,
  # so every round is counted; a hostile model job cannot skip it.
  publish-feedback:
    needs: [address-feedback-select, address-feedback, address-feedback-subscription, apply-feedback-patch, adjudicate-feedback]
    if: ${{ !cancelled() && needs.address-feedback-select.outputs.proceed == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: publish-feedback
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      review-replies: true
      # run.json and its SHA-256, from the select job.
      review-run-sha256: ${{ needs.address-feedback-select.outputs.run-sha256 }}
      review-run-attempt: ${{ needs.address-feedback-select.outputs.context-attempt }}
      # The replies, their SHA-256 and the patch state, all from the one leg
      # apply-feedback-patch reads; only the scan job, which ran no model or
      # head code, sets these outputs. The scan's refusal arrives as the
      # scan-refusal job's marker artifact, which the reply job downloads.
      review-replies-attempt: ${{ needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-attempt || needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-attempt || '' }}
      review-replies-sha256: ${{ needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-sha256 || needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-sha256 || '' }}
      review-patch-state: ${{ needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.scan-patch-state || needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.scan-patch-state || '' }}
      # The adjudicator's verdicts on the INCORRECT replies, and their SHA-256,
      # set only once its upload succeeded.
      review-adjudication-attempt: ${{ needs.adjudicate-feedback.outputs.attempt }}
      review-adjudication-sha256: ${{ needs.adjudicate-feedback.outputs.sha256 }}
      # The push job moved the PR head off the reviewed one; the gate and the
      # broker accept the review of the head the select job read when only
      # commits GitHub signed for the lanes App during this run follow it. A
      # human dispatch has no dispatcher and passes none.
      expected-upstream-head: >-
        ${{ inputs.dispatcher-run-id != '' && needs.address-feedback-select.outputs.head-sha || '' }}

  # review-dependency is six jobs, so no model ever holds a write token. This
  # one runs only base code with a read-only token and checks out no PR head.
  # Before any model turn it reads the PR head, resolves the slot (draft and
  # held PRs skip it) and selects the PR (review-dependency.mjs select): it
  # skips one Dependabot did not open or one sorted auto, hands the PR to a
  # person once the round cap is reached, or writes the context file the
  # model job reads and context.json, the run fields the verdict job reads.
  # Every gate and head the jobs after it take comes from here, and every
  # model-call input from a model call's scan job, never from its run job,
  # whose runner head code could forge.
  review-dependency-select:
    if: >-
      inputs.pr-number != '' && inputs.activity == 'review-dependency'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out main
      pull-requests: read # the PR, its commits and files
      checks: read # ci-status and the model check runs that count rounds
      issues: read # the round markers
    outputs:
      # true once the context is uploaded; false on a skip or an escalation;
      # empty when the job stopped before deciding.
      proceed: >-
        ${{ steps.upload.outcome == 'success' && 'true'
        || (steps.slot.outputs.applies == 'false' || steps.select.outputs.proceed == 'false') && 'false' || '' }}
      head-sha: ${{ steps.head.outputs.sha }}
      escalation-reason: ${{ steps.select.outputs.escalation-reason }}
      skip-reason: ${{ steps.slot.outputs.applies == 'false' && steps.slot.outputs.skip-reason || steps.select.outputs.skip-reason }}
      # dependency.json's, which the model call checks, and context.json's,
      # which the verdict job checks.
      context-sha256: ${{ steps.select.outputs.context-sha256 }}
      run-sha256: ${{ steps.select.outputs.run-sha256 }}
      # The artifact name's attempt, so a re-run of a later job alone still
      # finds it.
      context-attempt: ${{ steps.upload.outcome == 'success' && github.run_attempt || '' }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Read the PR head
        id: head
        if: steps.kill.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          if ! [[ $PR_NUMBER =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::the pr-number input is not a PR number"
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          if ! [[ $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the PR names no head SHA"
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # As the read runner resolves it: its applies-when decides on the head
      # just read, before the PR is classified.
      - name: Resolve the slot
        id: slot
        if: steps.head.outcome == 'success'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: review-dependency
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          pr-number: ${{ inputs.pr-number }}
          head-sha: ${{ steps.head.outputs.sha }}
          prepare-supported: "true"
          applied-by-supported: patch dependency-verdict

      - name: Select the dependency pull request
        id: select
        if: steps.slot.outputs.applies == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          DEPENDENCY_DIR: ${{ runner.temp }}/dependency-context
          TRUSTED_ACTORS: .base/.github/standards/trusted-actors/trusted-actors.json
          # The content rule's ecosystems and directories, read from the base.
          DEPENDABOT_CONFIG: .base/.github/dependabot.yml
          # The review-only dependencies, read from the base.
          DEPENDABOT_POLICY: .base/.github/standards/dependabot-policy/policy.json
          RESOLVED: ${{ runner.temp }}/resolved-config.json
        run: |
          mkdir -p "$DEPENDENCY_DIR"
          DEPENDENCY_REVIEW_ROUNDS=$(jq -r '.loop["dependency-review-rounds"] // empty' "$RESOLVED")
          export DEPENDENCY_REVIEW_ROUNDS
          DEPENDENCY_FILE="$DEPENDENCY_DIR/dependency.json" CONTEXT_RUN_FILE="$DEPENDENCY_DIR/context.json" \
            node .base/.github/scripts/pr-unblock/review-dependency.mjs select
          if [ -f "$DEPENDENCY_DIR/dependency.json" ]; then
            sum=$(sha256sum <"$DEPENDENCY_DIR/dependency.json")
            echo "context-sha256=${sum%% *}" >>"$GITHUB_OUTPUT"
            sum=$(sha256sum <"$DEPENDENCY_DIR/context.json")
            echo "run-sha256=${sum%% *}" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload the dependency context
        id: upload
        if: steps.select.outputs.proceed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-context-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dependency-context/dependency.json
            ${{ runner.temp }}/dependency-context/context.json
          retention-days: 1
          if-no-files-found: error

  # A select that skipped, or handed the PR to a person, runs no model job,
  # so no review-dependency check would land on the head and
  # dependency-dispatch.mjs would dispatch it again on every run. This job
  # posts it neutral on the head the select job read; a kill-switch stop
  # reads none, and nothing is posted.
  review-dependency-not-run:
    needs: review-dependency-select
    if: >-
      ${{ !cancelled() && inputs.activity == 'review-dependency'
      && needs.review-dependency-select.outputs.proceed == 'false'
      && needs.review-dependency-select.outputs.head-sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Post the review-dependency check run
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: review-dependency
          run-result: skipped
          not-run-reason: ${{ needs.review-dependency-select.outputs.skip-reason || 'awaiting-human' }}
          head-sha: ${{ needs.review-dependency-select.outputs.head-sha }}
          can-commit: "false"
          base-path: .base
          head-sha-fallback: ${{ needs.review-dependency-select.outputs.head-sha }}
          github-token: ${{ github.token }}

  # The model job: a read activity with no write token and no OIDC token in
  # the job that runs head code. The skill reviews the update and returns its
  # verdict as structured output; on a fix it leaves the fix uncommitted, and
  # the runner hands it on as a patch. Its upstream release notes are
  # untrusted text. It runs on the pr-unblock role's API key alone, in the
  # per-PR write queue.
  review-dependency:
    needs: review-dependency-select
    if: ${{ !cancelled() && needs.review-dependency-select.outputs.proceed == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: review-dependency
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      dependency-context-attempt: ${{ needs.review-dependency-select.outputs.context-attempt }}
      dependency-context-sha256: ${{ needs.review-dependency-select.outputs.context-sha256 }}
      head-sha: ${{ needs.review-dependency-select.outputs.head-sha }}
      # The 50-minute launcher step and the CLI install.
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether review-dependency's report job posted its check, read from this run's
  # jobs as fix-ci-handoff reads fix-ci's, never from an review-dependency
  # output: the run job runs head code and can forge them. A failed read
  # leaves posted empty, which starts the fallback call.
  review-dependency-handoff:
    needs: [review-dependency-select, review-dependency]
    if: ${{ !cancelled() && needs.review-dependency-select.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      posted: ${{ steps.posted.outputs.posted }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          sparse-checkout: .github/scripts/lib/handoff-evidence.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether review-dependency posted its check
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: review-dependency
        run: bash .base/.github/scripts/lib/handoff-evidence.sh posted

  # The subscription fallback, as fix-ci-subscription is for fix-ci: it runs
  # only when review-dependency-handoff read no check posted, which a credit
  # stop or an empty key leaves, and holds the OAuth token alone.
  review-dependency-subscription:
    needs: [review-dependency-select, review-dependency, review-dependency-handoff]
    if: >-
      ${{ !cancelled() && needs.review-dependency-select.outputs.proceed == 'true'
      && needs.review-dependency-handoff.outputs.posted != 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: review-dependency
      fallback: handoff
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      dependency-context-attempt: ${{ needs.review-dependency-select.outputs.context-attempt }}
      dependency-context-sha256: ${{ needs.review-dependency-select.outputs.context-sha256 }}
      head-sha: ${{ needs.review-dependency-select.outputs.head-sha }}
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.PR_UNBLOCK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # The push job: apply-patch.mjs under patch-rules.json's dependency-review
  # row, a script with no model that runs no head code. It admits only a
  # version change of npm or pip manifest and lock files outside .github/ in
  # a directory the base dependabot.yml lists, skips a head that moved since
  # the select job read it, and pushes one commit with [dependabot skip]
  # without force. It runs only on a written patch beside a scanned fix
  # verdict; a patch beside any other verdict is dropped. report-escalation
  # does not need it: a patch that does not land leaves no fix commit, and
  # the verdict job hands the PR to a person as dependency-fix-not-landed.
  apply-dependency-patch:
    needs: [review-dependency-select, review-dependency, review-dependency-subscription]
    # One leg answers the round: the fallback call when it ran, else the
    # first, and every model-call input below is that leg's scan job's, so
    # one leg's patch never pairs with the other's verdict and an empty
    # field never falls through.
    if: >-
      ${{ !cancelled()
      && (needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.scan-patch-state || needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.scan-patch-state || '') == 'written'
      && (needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.dependency-verdict || needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.dependency-verdict || '') == 'fix' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: apply-dependency-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      # The scan job's outputs alone, never a run job's, from the one leg.
      patch-state: ${{ needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.scan-patch-state || needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.scan-patch-state || '' }}
      patch-sha256: ${{ needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.scan-patch-sha256 || needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.scan-patch-sha256 || '' }}
      patch-attempt: ${{ needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.scan-patch-attempt || needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.scan-patch-attempt || '' }}
      patch-activity: review-dependency
      patch-prepare: dependency-review
      # The head the select job read, from a job that ran no head code.
      patch-head-sha: ${{ needs.review-dependency-select.outputs.head-sha }}
      # The scanned verdict the row's dependency-verdict requirement reads.
      patch-verdict-attempt: ${{ needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.dependency-attempt || needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.dependency-attempt || '' }}
      patch-verdict-sha256: ${{ needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.dependency-sha256 || needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.dependency-sha256 || '' }}
      reply-attempt: ${{ needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.scan-reply-attempt || needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.scan-reply-attempt || '' }}

  # The verdict job, a script with no model: it holds pull-requests and
  # issues write and acts on the verdict: the round marker, a close (never a
  # security update) with an ignore-entry issue, or an escalation. It runs
  # whenever the select job proceeded, whatever the model and push jobs did,
  # so every round is counted; a hostile model job cannot skip it. Neither
  # job merges.
  apply-dependency-verdict:
    needs: [review-dependency-select, review-dependency, review-dependency-subscription, apply-dependency-patch]
    if: ${{ !cancelled() && needs.review-dependency-select.outputs.proceed == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: apply-dependency-verdict
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      dependency-verdict: true
      # context.json, its SHA-256 and the head, from the select job.
      dependency-context-attempt: ${{ needs.review-dependency-select.outputs.context-attempt }}
      dependency-run-sha256: ${{ needs.review-dependency-select.outputs.run-sha256 }}
      dependency-head-sha: ${{ needs.review-dependency-select.outputs.head-sha }}
      # The verdict, its SHA-256 and the patch state, all from the one leg
      # apply-dependency-patch reads; only the scan job, which ran no model
      # or head code, sets these outputs. The scan's refusal arrives as the
      # scan-refusal job's marker artifact, which the verdict job downloads. The verdict's
      # attempt names the model run in the round marker, so "Re-run failed
      # jobs" on this job alone still downloads it.
      dependency-run-attempt: ${{ needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.dependency-attempt || needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.dependency-attempt || '' }}
      dependency-verdict-sha256: ${{ needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.dependency-sha256 || needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.dependency-sha256 || '' }}
      dependency-patch-state: ${{ needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.scan-patch-state || needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.scan-patch-state || '' }}

  # fix-ci is four jobs, so no model ever holds a write token. This one runs
  # only base code with a read-only token and checks out no PR head: it hands
  # the PR to a person once loop.fix-ci-rounds fixes were pushed, or writes
  # the failing checks' names, workflows, annotations and log ends to the
  # context file the model job reads. Logs and annotations are data.
  fix-ci-context:
    if: >-
      inputs.pr-number != '' && inputs.activity == 'fix-ci'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out main
      pull-requests: read # the PR's head and commits
      checks: read # the head's check runs and their annotations
      actions: read # each failing job's workflow file and log
    outputs:
      proceed: ${{ steps.context.outputs.proceed }}
      head-sha: ${{ steps.context.outputs.head-sha }}
      escalation-reason: ${{ steps.context.outputs.escalation-reason }}
      context-sha256: ${{ steps.context.outputs.context-sha256 }}
      # awaiting-human when the human-gated label holds fix-ci, which
      # fix-ci-not-run posts; lane-escalated when another lane's escalation
      # put the label on, so apply-patch pushes past it.
      skip-reason: ${{ steps.context.outputs.skip-reason }}
      lane-escalated: ${{ steps.context.outputs.lane-escalated }}
      # The artifact name's attempt, so a re-run of the model job alone still
      # finds it.
      context-attempt: ${{ steps.upload.outcome == 'success' && github.run_attempt || '' }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # fix-ci-context.mjs reads loop.fix-ci-rounds through the base's
      # resolve-config, which needs its dependencies.
      - name: Install resolve-config's dependencies
        if: steps.kill.outputs.proceed == 'true'
        run: npm ci --ignore-scripts --omit=dev --prefix .base/.github/actions/resolve-config

      - name: Write the failing checks' context
        id: context
        if: steps.kill.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          CONTEXT_FILE: ${{ runner.temp }}/ci-context/context.json
          BASE_PATH: .base
        run: |
          mkdir -p "$RUNNER_TEMP/ci-context"
          node .base/.github/scripts/pr-unblock/fix-ci-context.mjs

      - name: Upload the context
        id: upload
        if: steps.context.outputs.proceed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-context-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-context/context.json
          retention-days: 1
          if-no-files-found: error

  # A fix-ci-context skip (a closed PR, a human-gated hold, or no failing
  # check) runs no fix-ci job,
  # so no fix-ci check would land on the head and fix-ci-dispatch.mjs would
  # dispatch it again on every run. This job posts fix-ci neutral on that head,
  # as publish-feedback-not-run does; a kill-switch stop leaves the head empty.
  fix-ci-not-run:
    needs: fix-ci-context
    if: >-
      ${{ !cancelled() && inputs.activity == 'fix-ci'
      && needs.fix-ci-context.outputs.proceed == 'false'
      && needs.fix-ci-context.outputs.escalation-reason == ''
      && needs.fix-ci-context.outputs.head-sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Post the check run
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: fix-ci
          run-result: skipped
          not-run-reason: ${{ needs.fix-ci-context.outputs.skip-reason || 'not-applicable' }}
          head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
          can-commit: "false"
          base-path: .base
          head-sha-fallback: ${{ needs.fix-ci-context.outputs.head-sha }}
          github-token: ${{ github.token }}

  # The model job: a read activity with no write token and no OIDC token in
  # the job that runs head code. The skill reruns the failing checks, fixes
  # them and reruns them; the runner uploads its uncommitted edits as a patch.
  # It runs on the pr-unblock role's API key alone. The per-PR write queue
  # holds it, never the run's own group, pr-unblock-fix-ci-<pr>: a job group
  # with that name waits on its own run and never starts.
  fix-ci:
    needs: fix-ci-context
    if: ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: fix-ci
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      # Reproducing, fixing and rerunning several checks outlasts the default.
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether fix-ci's report job posted its check, read from this run's jobs
  # through the Actions API, never from a fix-ci output: fix-ci's run job runs
  # head code, so its handed-off, lane-class and credential-present outputs
  # are forgeable, while its report job runs on its own runner and posts the
  # check unless the call handed off. A failed read leaves posted empty,
  # which starts the fallback call: a second leg, never a lost check.
  fix-ci-handoff:
    needs: [fix-ci-context, fix-ci]
    if: ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      posted: ${{ steps.posted.outputs.posted }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          sparse-checkout: .github/scripts/lib/handoff-evidence.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether fix-ci posted its check
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: fix-ci
        run: bash .base/.github/scripts/lib/handoff-evidence.sh posted

  # The subscription fallback, as a second call on new VMs: it runs only when
  # fix-ci posted no check, which a credit stop or an empty key leaves as a
  # handoff with no upload, lane record or check. Its start reads only
  # fix-ci-handoff, and it holds the OAuth token alone. fallback is handoff,
  # the one fact that read attests: the lane record says the key posted no
  # check, not why, since only the run job knows.
  fix-ci-subscription:
    needs: [fix-ci-context, fix-ci, fix-ci-handoff]
    if: >-
      ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true'
      && needs.fix-ci-handoff.outputs.posted != 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: fix-ci
      fallback: handoff
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.PR_UNBLOCK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # The push job: apply-patch.mjs, a script with no model that runs no head
  # code. It checks the patch against the model job's SHA-256 and head,
  # applies it, refuses what patch-rules.json's ci-context row refuses, and
  # pushes one commit without force. An empty or refused patch, a collection
  # the run's collector refused, or an escalated check, hands the PR to a
  # person (a refused collection reaches select with no patch-state, which
  # escalates ci-fix-invalid). One leg answers: the fallback call when it ran,
  # else the first, and every input is that leg's scan job's, never a run
  # job's; a call that handed off left none.
  apply-patch:
    needs: [fix-ci-context, fix-ci, fix-ci-subscription]
    if: >-
      ${{ !cancelled()
      && ((needs.fix-ci-subscription.result != 'skipped' && needs.fix-ci-subscription.outputs.scan-patch-state || needs.fix-ci-subscription.result == 'skipped' && needs.fix-ci.outputs.scan-patch-state || '') == 'written'
      || (needs.fix-ci-subscription.result != 'skipped' && needs.fix-ci-subscription.outputs.scan-patch-state || needs.fix-ci-subscription.result == 'skipped' && needs.fix-ci.outputs.scan-patch-state || '') == 'empty'
      || (needs.fix-ci-subscription.result != 'skipped' && needs.fix-ci-subscription.outputs.scan-collect-refused || needs.fix-ci-subscription.result == 'skipped' && needs.fix-ci.outputs.scan-collect-refused || '') == 'true') }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: apply-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      patch-state: ${{ needs.fix-ci-subscription.result != 'skipped' && needs.fix-ci-subscription.outputs.scan-patch-state || needs.fix-ci-subscription.result == 'skipped' && needs.fix-ci.outputs.scan-patch-state || '' }}
      patch-sha256: ${{ needs.fix-ci-subscription.result != 'skipped' && needs.fix-ci-subscription.outputs.scan-patch-sha256 || needs.fix-ci-subscription.result == 'skipped' && needs.fix-ci.outputs.scan-patch-sha256 || '' }}
      patch-attempt: ${{ needs.fix-ci-subscription.result != 'skipped' && needs.fix-ci-subscription.outputs.scan-patch-attempt || needs.fix-ci-subscription.result == 'skipped' && needs.fix-ci.outputs.scan-patch-attempt || '' }}
      patch-activity: fix-ci
      patch-prepare: ci-context
      # The head fix-ci-context gated, from a job that ran no head code; the
      # read runner's own head-sha output is the run job's, which head code
      # could forge. Both fix-ci calls refuse a context for another head, so a
      # patch was made on this one. apply-patch compares it with the head its
      # own trigger gate reads at apply time, and its push needs the branch
      # still at that head.
      patch-head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      # true drops the human-gated label from the holds: another lane's
      # escalation put it on (fix-ci-context.mjs).
      patch-fix-requested: ${{ needs.fix-ci-context.outputs.lane-escalated }}
      reply-attempt: ${{ needs.fix-ci-subscription.result != 'skipped' && needs.fix-ci-subscription.outputs.scan-reply-attempt || needs.fix-ci-subscription.result == 'skipped' && needs.fix-ci.outputs.scan-reply-attempt || '' }}

  # fix-ci's one retry one model rung up, in this same run: when apply-patch
  # skipped rung-up (the run changed nothing and escalated only unfixed or
  # not-reproducible checks), fix-ci runs again at model-rung 1 on the same
  # context and head, with its own subscription fallback and apply-patch.
  # Whatever the retry ends in reaches report-escalation, which hands the PR
  # to a person unless the retry's patch applied cleanly; nothing here runs
  # at rung 1 twice.
  fix-ci-rung-up:
    needs: [fix-ci-context, apply-patch]
    if: >-
      ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true'
      && needs.apply-patch.outputs.rung-up == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: fix-ci
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      model-rung: "1"
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # As fix-ci-handoff and fix-ci-subscription are for fix-ci.
  fix-ci-rung-up-handoff:
    needs: [fix-ci-context, fix-ci-rung-up]
    if: >-
      ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true'
      && needs.fix-ci-rung-up.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      posted: ${{ steps.posted.outputs.posted }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          sparse-checkout: .github/scripts/lib/handoff-evidence.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether fix-ci-rung-up posted its check
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: fix-ci-rung-up
        run: bash .base/.github/scripts/lib/handoff-evidence.sh posted

  fix-ci-rung-up-subscription:
    needs: [fix-ci-context, fix-ci-rung-up, fix-ci-rung-up-handoff]
    if: >-
      ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true'
      && needs.fix-ci-rung-up.result != 'skipped'
      && needs.fix-ci-rung-up-handoff.outputs.posted != 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: fix-ci
      fallback: handoff
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      model-rung: "1"
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.PR_UNBLOCK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  apply-patch-rung-up:
    needs: [fix-ci-context, fix-ci-rung-up, fix-ci-rung-up-subscription]
    if: >-
      ${{ !cancelled()
      && ((needs.fix-ci-rung-up-subscription.result != 'skipped' && needs.fix-ci-rung-up-subscription.outputs.scan-patch-state || needs.fix-ci-rung-up-subscription.result == 'skipped' && needs.fix-ci-rung-up.outputs.scan-patch-state || '') == 'written'
      || (needs.fix-ci-rung-up-subscription.result != 'skipped' && needs.fix-ci-rung-up-subscription.outputs.scan-patch-state || needs.fix-ci-rung-up-subscription.result == 'skipped' && needs.fix-ci-rung-up.outputs.scan-patch-state || '') == 'empty'
      || (needs.fix-ci-rung-up-subscription.result != 'skipped' && needs.fix-ci-rung-up-subscription.outputs.scan-collect-refused || needs.fix-ci-rung-up-subscription.result == 'skipped' && needs.fix-ci-rung-up.outputs.scan-collect-refused || '') == 'true') }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: apply-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      patch-state: ${{ needs.fix-ci-rung-up-subscription.result != 'skipped' && needs.fix-ci-rung-up-subscription.outputs.scan-patch-state || needs.fix-ci-rung-up-subscription.result == 'skipped' && needs.fix-ci-rung-up.outputs.scan-patch-state || '' }}
      patch-sha256: ${{ needs.fix-ci-rung-up-subscription.result != 'skipped' && needs.fix-ci-rung-up-subscription.outputs.scan-patch-sha256 || needs.fix-ci-rung-up-subscription.result == 'skipped' && needs.fix-ci-rung-up.outputs.scan-patch-sha256 || '' }}
      patch-attempt: ${{ needs.fix-ci-rung-up-subscription.result != 'skipped' && needs.fix-ci-rung-up-subscription.outputs.scan-patch-attempt || needs.fix-ci-rung-up-subscription.result == 'skipped' && needs.fix-ci-rung-up.outputs.scan-patch-attempt || '' }}
      patch-activity: fix-ci
      patch-prepare: ci-context
      patch-head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      patch-fix-requested: ${{ needs.fix-ci-context.outputs.lane-escalated }}
      # At rung 1 an escalation goes to a person: there is no rung above.
      patch-model-rung: "1"
      reply-attempt: ${{ needs.fix-ci-rung-up-subscription.result != 'skipped' && needs.fix-ci-rung-up-subscription.outputs.scan-reply-attempt || needs.fix-ci-rung-up-subscription.result == 'skipped' && needs.fix-ci-rung-up.outputs.scan-reply-attempt || '' }}

  # A fix-ci round whose every call posted no check (a run that forged a
  # handoff, or a report job that failed) would leave nothing for
  # fix-ci-dispatch.mjs to count, so it would dispatch the head again with no
  # end. This job reads this run's jobs as fix-ci-handoff does and posts
  # fix-ci failure on the gated head, which counts toward fix-ci-restarts. As
  # the report job does, it posts nothing unless a call's broker-check job
  # allowed the lane: a kill switch, read there with its repository shadow,
  # or a broker refusal is no merge blocker and spends no restart.
  fix-ci-unreported:
    needs: [fix-ci-context, fix-ci, fix-ci-subscription, fix-ci-rung-up, fix-ci-rung-up-subscription]
    if: ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      checks: write
      contents: read
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read whether a fix-ci call posted its check
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: fix-ci fix-ci-subscription fix-ci-rung-up fix-ci-rung-up-subscription
        run: bash .base/.github/scripts/lib/handoff-evidence.sh posted allowed

      - name: Post the check run
        if: steps.posted.outputs.posted == 'false' && steps.posted.outputs.allowed == 'true'
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: fix-ci
          # No verdict: posts failure, "The run left no verdict."
          run-result: failure
          head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
          can-commit: "false"
          base-path: .base
          head-sha-fallback: ${{ needs.fix-ci-context.outputs.head-sha }}
          github-token: ${{ github.token }}

  # GitHub starts no pull_request workflow on a conflicted PR, so a head the
  # lane could not resolve gets no CI and no sign why. This script job, with
  # no model, posts a failing pr-unblock/conflict commit status on that head,
  # whether the select job escalated before any model turn, the push job
  # found a conflict left, or the scan refused the model's output. It is the
  # lane's only statuses: write, on its own GITHUB_TOKEN: the lanes App token
  # the escalation comment uses carries no statuses permission.
  report-conflict-status:
    needs: [resolve-conflicts-select, apply-conflict-patch, conflict-scan-refusal]
    if: >-
      ${{ !cancelled() && needs.resolve-conflicts-select.outputs.head-sha != ''
      && (needs.resolve-conflicts-select.outputs.escalation-reason == 'unresolved-conflict'
      || needs.apply-conflict-patch.outputs.escalation-reason == 'unresolved-conflict'
      || needs.conflict-scan-refusal.outputs.escalation-reason == 'unresolved-conflict') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Post the conflict status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ needs.resolve-conflicts-select.outputs.head-sha }}
          ESCALATION_REASON: unresolved-conflict
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .base/.github/scripts/pr-unblock/report-escalation.sh status

  report-escalation:
    needs:
      - resolve-conflicts-select
      - apply-conflict-patch
      - conflict-scan-refusal
      - address-feedback-select
      - publish-feedback
      - review-dependency-select
      - apply-dependency-verdict
      - fix-ci-context
      - apply-patch
      - apply-patch-rung-up
    # escalation-reason is set only by the write runner's own steps, the
    # base's reply, verdict and apply-patch scripts, and the base scripts of
    # resolve-conflicts-select, conflict-scan-refusal, address-feedback-select,
    # review-dependency-select and fix-ci-context.
    # At most one escalates: one activity runs per dispatch, a reply, verdict
    # or push job runs only after a select job proceeded, and a select job,
    # or fix-ci-context, escalates only before any model turn. A rung-up stop
    # escalates here too unless apply-patch-rung-up applied the retry's patch
    # cleanly: its own reason, else ci-fix-escalated. On a cancelled run this
    # always() branch fires, but the write workflow's run job skips, so no
    # label is applied and ci-status stays red.
    if: >-
      ${{ (!cancelled() && (needs.resolve-conflicts-select.outputs.escalation-reason != ''
      || needs.apply-conflict-patch.outputs.escalation-reason != ''
      || needs.conflict-scan-refusal.outputs.escalation-reason != ''
      || needs.address-feedback-select.outputs.escalation-reason != ''
      || needs.publish-feedback.outputs.escalation-reason != ''
      || needs.review-dependency-select.outputs.escalation-reason != ''
      || needs.apply-dependency-verdict.outputs.escalation-reason != ''
      || needs.fix-ci-context.outputs.escalation-reason != ''
      || needs.apply-patch.outputs.escalation-reason != ''))
      || (always() && needs.apply-patch.outputs.rung-up == 'true'
      && !(needs.apply-patch-rung-up.result == 'success'
      && needs.apply-patch-rung-up.outputs.escalation-reason == ''
      && needs.apply-patch-rung-up.outputs.patch-skip-reason == '')) }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: report-escalation
      pr-number: ${{ inputs.pr-number }}
      escalation-reason: >-
        ${{ needs.resolve-conflicts-select.outputs.escalation-reason
        || needs.apply-conflict-patch.outputs.escalation-reason
        || needs.conflict-scan-refusal.outputs.escalation-reason
        || needs.address-feedback-select.outputs.escalation-reason
        || needs.publish-feedback.outputs.escalation-reason
        || needs.review-dependency-select.outputs.escalation-reason
        || needs.apply-dependency-verdict.outputs.escalation-reason
        || needs.fix-ci-context.outputs.escalation-reason
        || needs.apply-patch.outputs.escalation-reason
        || needs.apply-patch-rung-up.outputs.escalation-reason
        || needs.apply-patch.outputs.rung-up == 'true' && 'ci-fix-escalated' || '' }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      expected-upstream-head: >-
        ${{ inputs.activity == 'address-feedback' && inputs.dispatcher-run-id != ''
        && needs.address-feedback-select.outputs.head-sha || '' }}
      trusted-base: default-tip
