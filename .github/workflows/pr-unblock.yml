name: PR Unblock

# Lane caller for pr-unblock: its file stem is the lane, so the lanes token
# broker accepts its write activities. No App key; each run job's OIDC token is
# exchanged at LANES_BROKER_URL for audience LANES_BROKER_AUDIENCE.
# Job contract: docs/conventions/pr-pipeline/pr-run-activity.md.
#
# workflow_dispatch only. resolve-conflicts: GitHub runs no pull_request
# workflow on a conflicting PR, so pr-unblock-dispatch.yml sends one dispatch
# per conflicting PR after a push to the default branch, and a trusted human
# may dispatch one for a clean PR whose base is stale; a base job merges the
# default branch tip into the head and decides, a read model job resolves the
# conflicts and hands them on as a patch, and a script job commits the merge.
# address-feedback:
# pr-feedback-dispatch.yml sends one after a review lane finishes on a lanes App
# PR, or an idle adopted owner PR, with unresolved reviewer-bot threads; a base
# job keeps the threads, a read model job answers them, and script jobs push
# its patch and post its replies.
# After a pr-verify pass at a PR's head that left fail-note threads open, it
# sends one with verify-pass-head: a pass-only round, where the base job lists
# those of earlier heads, and those at the head when verify-superseded-head
# names it, no model job runs, and the reply job resolves them as the lanes
# App, posting nothing and counting no round.
# When the merge gate refuses the head verify:earlier-fail, the dispatch names
# the FAILed heads in verify-earlier-fail-heads; with no thread left to work,
# the base job reads those FAILs' notes from their verdict artifacts as the
# model's work items, and the reply job posts nothing for them.
# review-dependency:
# pr-unblock-dispatch.yml also sends one per review-tier Dependabot PR (a major
# bump, an action publisher outside the allowlist, a group holding a major, or
# a red ci-status) whose head has no review yet; a base job selects the PR, a
# read model job returns a verdict and any fix as a patch, and script jobs
# push a fix verdict's patch and act on the verdict. A head whose claude-code
# install-script pin lags its lockfile gets the pin moved instead, with no
# model turn, and its new head is reviewed. fix-ci: pr-unblock-dispatch.yml
# also sends one per lanes App PR whose ci-status or pr-test-platforms run failed
# past the lost-run reconciler's re-run. sync-shared-copies:
# pr-unblock-dispatch.yml also sends one per lanes App PR that pr-merge refused
# as shared-copy-sources-changed at its head; a base job merges the default
# branch tip and regenerates the copies with the base's tooling, and a script
# job pushes the merge. All set dispatcher-run-id; a trusted
# human may dispatch with pr-number and activity alone. Every job trusts the
# default branch tip, since a conflicting PR's base SHA is stale and the
# dispatchers run from the tip.

# feedback-dispatch.mjs and dispatch.mjs read this title to skip a second
# dispatch while one for the same activity and PR is still queued or going.
# Quoted: unquoted, " #" would start a YAML comment and drop the PR number.
run-name: "pr-unblock ${{ inputs.activity }} #${{ inputs.pr-number }}"

# API_BUDGET_HOLD (outage posture element 2): only the two human-gated hold
# steps set it, since lane-hold.mjs holds green on a fault and starts nothing.
# The select jobs' other reads stop red before any model turn, and that red
# result is what dispatch.mjs retries.
# A step opts in only once its script is shown to hold green with a notice on
# a refused call (rate-guard.mjs createRateLimitLatch); a gate never does, since
# a hold would pass what it could not read, so the rest still end red on a
# rate limit past the guard's budget.
on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: The PR to unblock.
        required: true
        type: string
      activity:
        description: What to unblock.
        required: false
        type: choice
        options: [resolve-conflicts, address-feedback, review-dependency, fix-ci, sync-shared-copies]
        default: resolve-conflicts
      dispatcher-run-id:
        description: The dispatcher run that sent this dispatch; empty for a human dispatch.
        required: false
        type: string
        default: ""
      verify-pass-head:
        description: address-feedback from pr-feedback-dispatch.yml only; the head a pr-verify pass judged, for a pass-only round.
        required: false
        type: string
        default: ""
      verify-superseded-head:
        description: With verify-pass-head only; that head, when the merge gate's reader found the FAIL there superseded, so the round resolves its notes too.
        required: false
        type: string
        default: ""
      verify-earlier-fail-heads:
        description: address-feedback from pr-feedback-dispatch.yml only, never with verify-pass-head; the FAILed heads behind the merge gate's verify:earlier-fail refusal, space-separated, whose verdict artifacts hold the notes a round with no thread works.
        required: false
        type: string
        default: ""
      upstream-relay:
        description: address-feedback from pr-feedback-dispatch.yml only; true when its upstream is a review-comment relay (a person's reply), so resolve-feedback-threads, with no thread to resolve, starts no job. Setting it can only skip that job.
        required: false
        type: string
        default: ""

permissions: {}

# A newer dispatch of the same activity for the same PR replaces one still
# waiting; a running one finishes.
concurrency:
  group: pr-unblock-${{ inputs.activity }}-${{ inputs.pr-number }}
  cancel-in-progress: false

jobs:
  # A dispatcher that ran an older copy of its file than the tip sent a run the
  # broker refuses every write token (workflow-modified), so this job compares
  # the two before anything else. On a difference no select job starts: no
  # model turn, no check and no stop, so the run ends green and the next
  # dispatcher, on the tip's file, finds the head unhandled and sends it again.
  # Here and not in the read runner, because the jobs after a select job that
  # proceeded mint a token whatever the model call did. Only base code and a
  # read-only token; a dispatch with no dispatcher run skips the steps.
  dispatcher-current:
    name: Dispatcher Current
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out main; the dispatcher file at its run's head
      actions: read # the dispatcher run's file and head
    outputs:
      stale: ${{ steps.current.outputs.stale }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        if: inputs.dispatcher-run-id != ''
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        if: inputs.dispatcher-run-id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Compare the dispatcher file with the tip's
        id: current
        if: inputs.dispatcher-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHER_RUN_ID: ${{ inputs.dispatcher-run-id }}
        run: bash .base/.github/scripts/pr-unblock/dispatcher-current.sh

      - name: Log the API budget at the end
        if: always() && inputs.dispatcher-run-id != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # resolve-conflicts is five jobs, so no model ever holds a write token or
  # runs git. This one runs only base code with a read-only token. Before any
  # model turn it reads the PR head, resolves the slot (draft and held PRs
  # skip it), pins the default branch tip as the base, checks out the head
  # with no credentials, skips a head that already holds that base, and
  # merges the base into it with the base's prepare.sh, copied out and
  # hashed first: clean (the push job commits the merge with no model),
  # conflicted (the model resolves) or escalate (the repeat cap, a protected
  # path, or a conflict no model can resolve from markers). Every gate, head,
  # base and conflict tree the jobs
  # after it take comes from here, and every model-call input from a model
  # call's scan job, never from its run job, whose runner head code could
  # forge.
  resolve-conflicts-select:
    name: Resolve Conflicts Select
    needs: dispatcher-current
    if: >-
      inputs.pr-number != '' && inputs.activity == 'resolve-conflicts'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
      && needs.dispatcher-current.outputs.stale != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    cache-mode: read
    permissions:
      actions: read # the review lanes' comment records
      contents: read # check out main and the PR head
      pull-requests: read # the PR's head and mergeable state
    outputs:
      # true only for a conflicted merge; false on a skip, a clean merge or
      # an escalation; empty when the job stopped before deciding.
      proceed: >-
        ${{ steps.prepare.outputs.merge-state == 'conflicted' && 'true'
        || (steps.head.outputs.default-base == 'false' || steps.slot.outputs.applies == 'false' || steps.hold.outputs.held == 'true' || steps.behind.outputs.behind == 'false' || steps.prepare.outputs.merge-state != '') && 'false' || '' }}
      merge-state: ${{ steps.prepare.outputs.merge-state }}
      head-sha: ${{ steps.head.outputs.sha }}
      base-sha: ${{ steps.base-sha.outputs.sha }}
      conflict-tree: ${{ steps.prepare.outputs.conflict-tree }}
      escalation-reason: ${{ steps.prepare.outputs.escalation-reason }}
      skip-reason: >-
        ${{ steps.head.outputs.default-base == 'false' && 'not-applicable'
        || steps.slot.outputs.applies == 'false' && steps.slot.outputs.skip-reason
        || steps.hold.outputs.held == 'true' && 'awaiting-human'
        || steps.behind.outputs.behind == 'false' && 'up-to-date' || '' }}
      # true when another lane's escalation put the human-gated label on, so
      # apply-conflict-patch pushes past it (lane-hold.mjs).
      lane-escalated: ${{ steps.hold.outputs.lane-escalated }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # Every job merges the default branch tip, so a PR stacked on another
      # branch skips not-applicable here, as the dispatcher leaves it out. The
      # dispatcher leaves out a fork's PR too; a hand dispatch of one stops
      # here, with no sha output for a later job to post a status on.
      - name: Read the PR head
        id: head
        if: steps.kill.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Each `gh api` call keeps its rate-limit reading for the job-end
          # api-budget notice (.github/actions/log-api-budget).
          # shellcheck source=/dev/null
          { . .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null && api_budget_wrap_gh github-token; } || true
          # shellcheck source=/dev/null
          . .base/.github/scripts/pr-unblock/read-pr-head.bash
          if ! [[ $PR_NUMBER =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::the pr-number input is not a PR number"
            exit 1
          fi
          read_pr_fields "$PR_NUMBER" '.head.sha, .base.ref, .head.repo.full_name' || exit 1
          { read -r sha && read -r base && read -r head_repo; } <<<"$pr_fields" || true
          if ! [[ ${sha:-} =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the PR names no head SHA"
            exit 1
          fi
          if [[ ${head_repo:-} != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::the PR's head is not in this repository"
            exit 1
          fi
          if [[ -z ${base:-} || -z ${DEFAULT_BRANCH:-} ]]; then
            echo "::error::the PR's base or the default branch is unknown"
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          if [[ $base == "$DEFAULT_BRANCH" ]]; then
            echo "default-base=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::the PR's base is not the default branch; resolve-conflicts merges only the default branch"
            echo "default-base=false" >>"$GITHUB_OUTPUT"
          fi

      # As the read runner resolves it: its applies-when decides on the head
      # just read, before any merge.
      - name: Resolve the slot
        id: slot
        if: steps.head.outcome == 'success' && steps.head.outputs.default-base == 'true'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: resolve-conflicts
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          pr-number: ${{ inputs.pr-number }}
          head-sha: ${{ steps.head.outputs.sha }}
          prepare-supported: "true"
          applied-by-supported: patch

      # The human-gated label holds the PR unless another lane's escalation
      # put it on; do-not-merge stays with the slot's labels-absent. A GitHub
      # fault on its reads holds green with a notice and no held output
      # (lane-hold.mjs): proceed stays empty, no check posts, and the next
      # dispatcher tick sends the head again.
      - name: Check the human-gated hold
        id: hold
        if: steps.slot.outputs.applies == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The review lanes' comment records (actions: read).
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          ACTIVITY: resolve-conflicts
          # A rate limit past the guard's budget refuses the read with a
          # notice, and the step holds.
          API_BUDGET_HOLD: "1"
        run: node .base/.github/scripts/pr-unblock/lane-hold.mjs

      # The base every merge of this round uses: the default branch tip now,
      # pinned, so the read runner and the push job merge the same commit
      # however the branch moves.
      - name: Pin the base
        id: base-sha
        if: steps.hold.outputs.held == 'false'
        run: |
          sha=$(git -C .base rev-parse HEAD)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the default branch tip is not a commit id"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # The base's merge scripts and version-bump script, never the head's,
      # each with its SHA-256, which the merge step checks; the repeat cap
      # reads loop.no-progress from the resolved config.
      - name: Copy the merge scripts from the base
        id: merge-bin
        if: steps.hold.outputs.held == 'false'
        env:
          BIN: ${{ runner.temp }}/merge-base-bin
          RESOLVED: ${{ runner.temp }}/resolved-config.json
        run: |
          mkdir -p "$BIN"
          for file in .base/.github/scripts/merge-base/prepare.sh \
            .base/plugins/source-control/scripts/resolve-version-bump-conflict.sh; do
            name=$(basename "$file" .sh)
            cp "$file" "$BIN/$name.sh"
            sum=$(sha256sum <"$BIN/$name.sh")
            echo "$name-sha256=${sum%% *}" >>"$GITHUB_OUTPUT"
          done
          no_progress=$(jq -r '.loop["no-progress"] // empty' "$RESOLVED")
          if ! [[ $no_progress =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the resolved config holds no loop.no-progress"
            exit 1
          fi
          echo "no-progress=$no_progress" >>"$GITHUB_OUTPUT"

      # Full history: the merge needs the merge base and the pinned base. No
      # credentials stay behind, and no head code runs.
      - name: Check out the PR head
        if: steps.hold.outputs.held == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.head.outputs.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      # A clean PR passes the slot so a hand dispatch can refresh a stale
      # base; a head that already holds the pinned base has nothing to merge,
      # and prepare.sh's --no-ff merge would leave no MERGE_HEAD.
      - name: Check the head is behind the base
        id: behind
        if: steps.hold.outputs.held == 'false'
        working-directory: head
        env:
          GIT_NO_REPLACE_OBJECTS: "1"
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          BASE_SHA: ${{ steps.base-sha.outputs.sha }}
        run: |
          rc=0
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" || rc=$?
          case $rc in
          0)
            echo "::notice::the head already holds the default branch tip; nothing to merge"
            echo "behind=false" >>"$GITHUB_OUTPUT"
            ;;
          1) echo "behind=true" >>"$GITHUB_OUTPUT" ;;
          *)
            echo "::error::git merge-base --is-ancestor exited $rc"
            exit 1
            ;;
          esac

      # prepare.sh merges the pinned base without committing, runs the
      # version-bump script, and decides; only whitelisted, validated
      # key=value lines become outputs. The identity is the lanes bot's: git
      # refuses even a --no-commit merge without one, and the repeat cap
      # counts commits by that author name.
      - name: Merge the base into the head
        id: prepare
        if: steps.hold.outputs.held == 'false' && steps.behind.outputs.behind == 'true'
        working-directory: head
        env:
          GIT_AUTHOR_NAME: melodic-automation-lanes[bot]
          GIT_AUTHOR_EMAIL: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}+melodic-automation-lanes[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: melodic-automation-lanes[bot]
          GIT_COMMITTER_EMAIL: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}+melodic-automation-lanes[bot]@users.noreply.github.com
          LOOP_NO_PROGRESS: ${{ steps.merge-bin.outputs.no-progress }}
          # Replace refs from the head's history never stand in for objects.
          GIT_NO_REPLACE_OBJECTS: "1"
          BIN: ${{ runner.temp }}/merge-base-bin
          OUT: ${{ runner.temp }}/merge-base-out
          PREPARE_SHA256: ${{ steps.merge-bin.outputs.prepare-sha256 }}
          BUMP_SHA256: ${{ steps.merge-bin.outputs.resolve-version-bump-conflict-sha256 }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          BASE_SHA: ${{ steps.base-sha.outputs.sha }}
        run: bash "$GITHUB_WORKSPACE/.base/.github/scripts/merge-base/run-prepare.sh"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # A select that skipped, merged cleanly, or handed the PR to a person runs
  # no model job, so no resolve-conflicts check would land on the head and
  # dispatch.mjs would dispatch it again on every run. This job posts it
  # neutral on the head the select job read: the slot's skip reason, else
  # clean-merge (the push job commits it), else the stop's own skip
  # (escalation-routes.mjs stopSkip: lane-stopped for a stop routed to a
  # failing status, which ends the head until the base moves;
  # awaiting-human for one held for a person). A kill-switch stop reads no
  # head, and nothing is posted; nor is an up-to-date skip, since a neutral
  # check would end the head for the dispatcher should a later default-branch
  # push conflict with it.
  resolve-conflicts-not-run:
    name: Resolve Conflicts Not Run
    needs: resolve-conflicts-select
    if: >-
      ${{ !cancelled() && inputs.activity == 'resolve-conflicts'
      && needs.resolve-conflicts-select.outputs.proceed == 'false'
      && needs.resolve-conflicts-select.outputs.skip-reason != 'up-to-date'
      && needs.resolve-conflicts-select.outputs.head-sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read the stop's skip reason
        id: stop
        env:
          REASON: ${{ needs.resolve-conflicts-select.outputs.escalation-reason }}
        run: echo "skip=$(node .base/.github/scripts/pr-unblock/escalation-routes.mjs skip)" >>"$GITHUB_OUTPUT"

      - name: Post the resolve-conflicts check run
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: resolve-conflicts
          run-result: skipped
          not-run-reason: >-
            ${{ needs.resolve-conflicts-select.outputs.skip-reason
            || needs.resolve-conflicts-select.outputs.merge-state == 'clean' && 'clean-merge'
            || steps.stop.outputs.skip }}
          head-sha: ${{ needs.resolve-conflicts-select.outputs.head-sha }}
          can-commit: "false"
          base-path: .base
          head-sha-fallback: ${{ needs.resolve-conflicts-select.outputs.head-sha }}
          github-token: ${{ github.token }}

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The model job: a read activity with no write token and no OIDC token in
  # the job that runs head code. The runner merges the select job's base
  # again, refuses any conflict tree but the select job's, and gives the
  # skill the conflicts as read-only files with no git or Bash; the skill
  # resolves them in place and the runner hands its edits on as a patch
  # measured from the conflict tree. It runs on the pr-unblock role's API
  # key alone, in the per-PR write queue.
  resolve-conflicts:
    name: Resolve Conflicts
    needs: resolve-conflicts-select
    if: ${{ !cancelled() && needs.resolve-conflicts-select.outputs.proceed == 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    # One per-PR queue shared by every write lane: it queues, never cancels.
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: resolve-conflicts
      key-credit-job: resolve-conflicts
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      head-sha: ${{ needs.resolve-conflicts-select.outputs.head-sha }}
      merge-base-sha: ${{ needs.resolve-conflicts-select.outputs.base-sha }}
      merge-conflict-tree: ${{ needs.resolve-conflicts-select.outputs.conflict-tree }}
      # The 50-minute launcher step, the CLI install and the merge.
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether resolve-conflicts's report job posted its check, read from this
  # run's jobs as fix-ci-handoff reads fix-ci's, never from a resolve-conflicts
  # output: the run job runs head code and can forge them. A failed read
  # leaves posted empty, which starts the fallback call.
  resolve-conflicts-handoff:
    name: Resolve Conflicts Handoff
    needs: [resolve-conflicts-select, resolve-conflicts]
    if: ${{ !cancelled() && needs.resolve-conflicts-select.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      fallback-ready: ${{ steps.fallback.outputs.ready }}
      posted: ${{ steps.posted.outputs.posted }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether resolve-conflicts posted its check
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: resolve-conflicts
        run: bash .base/.github/scripts/lib/handoff-evidence.sh posted

      # Whether the third call can run, never the token.
      # resolve-conflicts-subscription passes it on as fallback-ready, so with
      # the token empty its subscription leg stays the last; a failed read
      # leaves it empty, which hands nothing on.
      - name: Check the fallback token
        id: fallback
        env:
          PRESENT: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: echo "ready=$PRESENT" >>"$GITHUB_OUTPUT"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The subscription fallback, as fix-ci-subscription is for fix-ci: it runs
  # only when resolve-conflicts-handoff read no check posted, which a credit
  # stop or an empty key leaves, and holds the OAuth token alone.
  resolve-conflicts-subscription:
    name: Resolve Conflicts Subscription
    needs: [resolve-conflicts-select, resolve-conflicts, resolve-conflicts-handoff]
    if: >-
      ${{ !cancelled() && needs.resolve-conflicts-select.outputs.proceed == 'true'
      && needs.resolve-conflicts-handoff.outputs.posted != 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: resolve-conflicts
      fallback: handoff
      fallback-ready: ${{ needs.resolve-conflicts-handoff.outputs.fallback-ready }}
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      head-sha: ${{ needs.resolve-conflicts-select.outputs.head-sha }}
      merge-base-sha: ${{ needs.resolve-conflicts-select.outputs.base-sha }}
      merge-conflict-tree: ${{ needs.resolve-conflicts-select.outputs.conflict-tree }}
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.PR_UNBLOCK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether resolve-conflicts-subscription handed off to the fallback token,
  # read from this run's jobs by handoff-evidence.sh, never from a
  # resolve-conflicts-subscription output: its broker allowed it, its run job
  # succeeded and its scan job never ran. It runs only when
  # resolve-conflicts-handoff found the fallback token set, so with the token
  # empty nothing starts that did not before. A failed read starts no third
  # call.
  resolve-conflicts-subscription-handoff:
    name: Resolve Conflicts Subscription Handoff
    needs: [resolve-conflicts-handoff, resolve-conflicts-subscription]
    if: ${{ !cancelled() && needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-handoff.outputs.fallback-ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      handed-off: ${{ steps.handoff.outputs.handed-off }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether resolve-conflicts-subscription handed off
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: resolve-conflicts-subscription
        run: bash .base/.github/scripts/lib/handoff-evidence.sh handed-off

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The third call, on the central fallback subscription's token alone: it
  # runs only on resolve-conflicts-subscription-handoff's read, after
  # resolve-conflicts-subscription's leg handed off (a limit stop, a credit
  # stop, or a 401 or 402). It is the last leg and never hands off.
  resolve-conflicts-fallback:
    name: Resolve Conflicts Fallback
    needs: [resolve-conflicts-select, resolve-conflicts, resolve-conflicts-handoff, resolve-conflicts-subscription, resolve-conflicts-subscription-handoff]
    if: ${{ !cancelled() && needs.resolve-conflicts-handoff.outputs.fallback-ready == 'true' && needs.resolve-conflicts-subscription-handoff.outputs.handed-off == 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: resolve-conflicts
      fallback: fallback
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      head-sha: ${{ needs.resolve-conflicts-select.outputs.head-sha }}
      merge-base-sha: ${{ needs.resolve-conflicts-select.outputs.base-sha }}
      merge-conflict-tree: ${{ needs.resolve-conflicts-select.outputs.conflict-tree }}
      timeout-minutes: 60
    secrets:
      fallback-claude-code-oauth-token: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # The push job: apply-patch.mjs under patch-rules.json's merge-base row, a
  # script with no model that runs no head code. It merges the select job's
  # pinned base into the head again, refuses any conflict tree but the
  # select job's, applies the patch to that tree, admits only marker-free
  # resolutions of the conflicted paths, skips a head that moved since the
  # select job read it, and pushes one merge commit with the head and the
  # base as parents, without force. A clean merge commits with no patch; an
  # empty patch leaves the conflicts to a person (unresolved-conflict). One
  # leg answers a conflicted round: the fallback call when it ran, else the
  # subscription call when it ran, else the first, and every model-call
  # input below is that leg's scan job's.
  apply-conflict-patch:
    name: Apply Conflict Patch
    needs: [resolve-conflicts-select, resolve-conflicts, resolve-conflicts-subscription, resolve-conflicts-fallback]
    if: >-
      ${{ !cancelled()
      && (needs.resolve-conflicts-select.outputs.merge-state == 'clean'
      || needs.resolve-conflicts-select.outputs.proceed == 'true'
      && ((needs.resolve-conflicts-fallback.result != 'skipped' && needs.resolve-conflicts-fallback.outputs.scan-patch-state || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-patch-state || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-patch-state || '') == 'written'
      || (needs.resolve-conflicts-fallback.result != 'skipped' && needs.resolve-conflicts-fallback.outputs.scan-patch-state || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-patch-state || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-patch-state || '') == 'empty')) }}
    permissions:
      actions: read # the write runner's run job reads the review lanes' comment records
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: apply-conflict-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      # The scan job's outputs alone, never a run job's, from the one leg;
      # empty for a clean merge, which no model call answered.
      patch-state: ${{ needs.resolve-conflicts-fallback.result != 'skipped' && needs.resolve-conflicts-fallback.outputs.scan-patch-state || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-patch-state || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-patch-state || '' }}
      patch-sha256: ${{ needs.resolve-conflicts-fallback.result != 'skipped' && needs.resolve-conflicts-fallback.outputs.scan-patch-sha256 || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-patch-sha256 || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-patch-sha256 || '' }}
      patch-attempt: ${{ needs.resolve-conflicts-fallback.result != 'skipped' && needs.resolve-conflicts-fallback.outputs.scan-patch-attempt || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-patch-attempt || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-patch-attempt || '' }}
      reply-attempt: ${{ needs.resolve-conflicts-fallback.result != 'skipped' && needs.resolve-conflicts-fallback.outputs.scan-reply-attempt || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-reply-attempt || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-reply-attempt || '' }}
      patch-activity: resolve-conflicts
      patch-prepare: merge-base
      # The head, pinned base, merge state and conflict tree the select job
      # decided on, from a job that ran no head code or model.
      patch-head-sha: ${{ needs.resolve-conflicts-select.outputs.head-sha }}
      patch-merge-base-sha: ${{ needs.resolve-conflicts-select.outputs.base-sha }}
      patch-merge-state: ${{ needs.resolve-conflicts-select.outputs.merge-state }}
      patch-conflict-tree: ${{ needs.resolve-conflicts-select.outputs.conflict-tree }}
      # lane-escalation drops the human-gated label from the holds while the
      # write runner reads it again as another lane's escalation (lane-hold.mjs).
      patch-human-gate: ${{ needs.resolve-conflicts-select.outputs.lane-escalated == 'true' && 'lane-escalation' || '' }}

  # A conflicted round whose answering leg handed on no patch state, which a
  # scan that refused the model's output (a leak-scan block, an oversize
  # patch) leaves, so apply-conflict-patch did not run. This script job, with
  # no model and no head code, downloads every attempt's scan-refusal marker
  # for resolve-conflicts by name, never a job output (a failed job's outputs
  # are not documented to reach this caller), and escalates
  # unresolved-conflict when one says the scan refused
  # (conflict-scan-refusal.mjs). No marker escalates nothing.
  conflict-scan-refusal:
    name: Conflict Scan Refusal
    needs: [resolve-conflicts-select, resolve-conflicts, resolve-conflicts-subscription, resolve-conflicts-fallback]
    if: >-
      ${{ !cancelled() && needs.resolve-conflicts-select.outputs.proceed == 'true'
      && (needs.resolve-conflicts-fallback.result != 'skipped' && needs.resolve-conflicts-fallback.outputs.scan-patch-state || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-patch-state || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-patch-state || '') != 'written'
      && (needs.resolve-conflicts-fallback.result != 'skipped' && needs.resolve-conflicts-fallback.outputs.scan-patch-state || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result != 'skipped' && needs.resolve-conflicts-subscription.outputs.scan-patch-state || needs.resolve-conflicts-fallback.result == 'skipped' && needs.resolve-conflicts-subscription.result == 'skipped' && needs.resolve-conflicts.outputs.scan-patch-state || '') != 'empty' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      escalation-reason: ${{ steps.refusal.outputs.escalation-reason }}
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # A pattern that matches nothing downloads nothing and succeeds; a
      # failed download reads as a refusal.
      - name: Download the scan refusal markers
        id: scan-refused
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scan-refused-pr-unblock-resolve-conflicts-*
          path: ${{ runner.temp }}/scan-refused
          merge-multiple: true

      - name: Read the scan refusal
        id: refusal
        env:
          SCAN_REFUSED_DIR: ${{ runner.temp }}/scan-refused
          SCAN_REFUSED_READ: ${{ steps.scan-refused.outcome }}
        run: node .base/.github/scripts/pr-unblock/conflict-scan-refusal.mjs

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # sync-shared-copies is three jobs and no model. pr-merge refuses a lanes App
  # head whose shared-library copies are stale as shared-copy-sources-changed
  # and puts the human-gated label on; pr-unblock-dispatch.yml sends one
  # dispatch per such head. This job runs only base code with a read-only
  # token: it reads the PR head, resolves the slot, works past the label only
  # when pr-merge's shared-copy refusal at that head put it on (lane-hold.mjs,
  # gate-source.mjs sharedCopyGate), pins the default branch tip, merges it
  # into the head with the base's prepare.sh as resolve-conflicts-select does,
  # and on a clean merge runs the base's sync-shared-copies.sh, which runs the
  # base's scripts/sync-shared-copies.sh and refuses a head that changes it,
  # its registry or scripts/lib, or a write the base-tip
  # scripts/shared-copies.txt lists as no copy. A merge that is not clean
  # escalates as shared-copy-merge-conflicted: resolve-conflicts is held by
  # the same label, so a session merges main by hand. The regenerated
  # copies leave as a patch, which apply-shared-copies pushes; when the merge
  # already holds current copies (both sides regenerated disjoint canonical
  # edits), it pushes the merge alone, which still moves the head past the
  # refusal.
  sync-shared-copies-select:
    name: Sync Shared Copies Select
    needs: dispatcher-current
    if: >-
      inputs.pr-number != '' && inputs.activity == 'sync-shared-copies'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
      && needs.dispatcher-current.outputs.stale != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # the review lanes' comment records
      contents: read # check out main and the PR head
      pull-requests: read # the PR's head, author and labels
    outputs:
      # true when the sync ran on the clean merge: it wrote a patch, or found
      # the merge's copies current (empty), when the refused head still needs
      # the merge alone pushed; false on a skip or a refusal; empty when the
      # job stopped before deciding.
      proceed: >-
        ${{ (steps.sync.outputs.state == 'written' || steps.sync.outputs.state == 'empty') && 'true'
        || (steps.head.outputs.applicable == 'false' || steps.slot.outputs.applies == 'false' || steps.hold.outputs.held == 'true' || steps.hold.outputs.lane-escalated == 'false' || steps.behind.outputs.behind == 'false' || steps.prepare.outputs.merge-state != '' && steps.prepare.outputs.merge-state != 'clean' || steps.sync.outputs.refused != '') && 'false' || '' }}
      patch-state: ${{ steps.sync.outputs.state }}
      merge-state: ${{ steps.prepare.outputs.merge-state }}
      head-sha: ${{ steps.head.outputs.sha }}
      base-sha: ${{ steps.base-sha.outputs.sha }}
      conflict-tree: ${{ steps.prepare.outputs.conflict-tree }}
      patch-sha256: ${{ steps.sync.outputs.sha256 }}
      patch-attempt: ${{ steps.sync.outputs.state == 'written' && github.run_attempt || '' }}
      # The sync script's own refusals, or shared-copy-merge-conflicted for a
      # merge that is not clean: resolve-conflicts stays held by the label
      # pr-merge's refusal put on, so the stop goes to the session queue
      # rather than sitting silent on this head.
      escalation-reason: >-
        ${{ steps.sync.outputs.refused
        || steps.prepare.outputs.merge-state != '' && steps.prepare.outputs.merge-state != 'clean' && 'shared-copy-merge-conflicted' || '' }}
      skip-reason: >-
        ${{ steps.head.outputs.applicable == 'false' && 'not-applicable'
        || steps.slot.outputs.applies == 'false' && steps.slot.outputs.skip-reason
        || steps.hold.outputs.held == 'true' && 'awaiting-human'
        || steps.hold.outputs.lane-escalated == 'false' && 'not-applicable'
        || steps.behind.outputs.behind == 'false' && 'not-applicable' || '' }}
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # As resolve-conflicts-select reads it, and the PR must be the lanes
      # App's: the activity regenerates copies only on a lane's own branch.
      - name: Read the PR head
        id: head
        if: steps.kill.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
        run: |
          # Each `gh api` call keeps its rate-limit reading for the job-end
          # api-budget notice (.github/actions/log-api-budget).
          # shellcheck source=/dev/null
          { . .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null && api_budget_wrap_gh github-token; } || true
          # shellcheck source=/dev/null
          . .base/.github/scripts/pr-unblock/read-pr-head.bash
          if ! [[ $PR_NUMBER =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::the pr-number input is not a PR number"
            exit 1
          fi
          if ! [[ $APP_SENDER_ID =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the AUTOMATION_LANES_APP_SENDER_ID variable must hold the lanes App bot's numeric user id"
            exit 1
          fi
          read_pr_fields "$PR_NUMBER" '.head.sha, .base.ref, .head.repo.full_name, .user.id' || exit 1
          { read -r sha && read -r base && read -r head_repo && read -r author; } <<<"$pr_fields" || true
          if ! [[ ${sha:-} =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the PR names no head SHA"
            exit 1
          fi
          if [[ ${head_repo:-} != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::the PR's head is not in this repository"
            exit 1
          fi
          if [[ -z ${base:-} || -z ${DEFAULT_BRANCH:-} ]]; then
            echo "::error::the PR's base or the default branch is unknown"
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          if [[ $base != "$DEFAULT_BRANCH" ]]; then
            echo "::notice::the PR's base is not the default branch; sync-shared-copies merges only the default branch"
            echo "applicable=false" >>"$GITHUB_OUTPUT"
          elif [[ ${author:-} != "$APP_SENDER_ID" ]]; then
            echo "::notice::the lanes App did not open the PR; sync-shared-copies works only lane pull requests"
            echo "applicable=false" >>"$GITHUB_OUTPUT"
          else
            echo "applicable=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Resolve the slot
        id: slot
        if: steps.head.outcome == 'success' && steps.head.outputs.applicable == 'true'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: sync-shared-copies
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          pr-number: ${{ inputs.pr-number }}
          head-sha: ${{ steps.head.outputs.sha }}

      # The human-gated label holds the PR unless pr-merge's shared-copy
      # refusal at this head put it on; with no such refusal
      # (lane-escalated false) there is nothing for the activity to answer.
      # A GitHub fault on its reads holds green with no held output, as in
      # resolve-conflicts-select: no check posts, and the next tick sends it.
      - name: Check the human-gated hold
        id: hold
        if: steps.slot.outputs.applies == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The review lanes' comment records (actions: read).
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          ACTIVITY: sync-shared-copies
          # A rate limit past the guard's budget refuses the read with a
          # notice, and the step holds.
          API_BUDGET_HOLD: "1"
        run: node .base/.github/scripts/pr-unblock/lane-hold.mjs

      - name: Pin the base
        id: base-sha
        if: steps.hold.outputs.held == 'false' && steps.hold.outputs.lane-escalated == 'true'
        run: |
          sha=$(git -C .base rev-parse HEAD)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the default branch tip is not a commit id"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # The base's merge scripts and version-bump script, never the head's,
      # each with its SHA-256, which the merge step checks; the repeat cap
      # reads loop.no-progress from the resolved config.
      - name: Copy the merge scripts from the base
        id: merge-bin
        if: steps.base-sha.outcome == 'success'
        env:
          BIN: ${{ runner.temp }}/merge-base-bin
          RESOLVED: ${{ runner.temp }}/resolved-config.json
        run: |
          mkdir -p "$BIN"
          for file in .base/.github/scripts/merge-base/prepare.sh \
            .base/plugins/source-control/scripts/resolve-version-bump-conflict.sh; do
            name=$(basename "$file" .sh)
            cp "$file" "$BIN/$name.sh"
            sum=$(sha256sum <"$BIN/$name.sh")
            echo "$name-sha256=${sum%% *}" >>"$GITHUB_OUTPUT"
          done
          no_progress=$(jq -r '.loop["no-progress"] // empty' "$RESOLVED")
          if ! [[ $no_progress =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the resolved config holds no loop.no-progress"
            exit 1
          fi
          echo "no-progress=$no_progress" >>"$GITHUB_OUTPUT"

      - name: Check out the PR head
        if: steps.base-sha.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.head.outputs.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Check the head is behind the base
        id: behind
        if: steps.base-sha.outcome == 'success'
        working-directory: head
        env:
          GIT_NO_REPLACE_OBJECTS: "1"
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          BASE_SHA: ${{ steps.base-sha.outputs.sha }}
        run: |
          rc=0
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" || rc=$?
          case $rc in
          0)
            echo "::notice::the head already holds the default branch tip; nothing to merge"
            echo "behind=false" >>"$GITHUB_OUTPUT"
            ;;
          1) echo "behind=true" >>"$GITHUB_OUTPUT" ;;
          *)
            echo "::error::git merge-base --is-ancestor exited $rc"
            exit 1
            ;;
          esac

      # As resolve-conflicts-select merges it; only a clean merge goes on, and
      # any other escalates as shared-copy-merge-conflicted.
      - name: Merge the base into the head
        id: prepare
        if: steps.behind.outputs.behind == 'true'
        working-directory: head
        env:
          GIT_AUTHOR_NAME: melodic-automation-lanes[bot]
          GIT_AUTHOR_EMAIL: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}+melodic-automation-lanes[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: melodic-automation-lanes[bot]
          GIT_COMMITTER_EMAIL: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}+melodic-automation-lanes[bot]@users.noreply.github.com
          LOOP_NO_PROGRESS: ${{ steps.merge-bin.outputs.no-progress }}
          GIT_NO_REPLACE_OBJECTS: "1"
          BIN: ${{ runner.temp }}/merge-base-bin
          OUT: ${{ runner.temp }}/merge-base-out
          PREPARE_SHA256: ${{ steps.merge-bin.outputs.prepare-sha256 }}
          BUMP_SHA256: ${{ steps.merge-bin.outputs.resolve-version-bump-conflict-sha256 }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          BASE_SHA: ${{ steps.base-sha.outputs.sha }}
        run: bash "$GITHUB_WORKSPACE/.base/.github/scripts/merge-base/run-prepare.sh"

      # The base's sync-shared-copies.sh, copied out of the base checkout,
      # regenerates the copies in the merged head; only its whitelisted,
      # validated key=value lines become outputs.
      - name: Regenerate the shared copies
        id: sync
        if: steps.prepare.outputs.merge-state == 'clean'
        env:
          BIN: ${{ runner.temp }}/sync-shared-copies-bin
          PATCH_OUT: ${{ runner.temp }}/sync-shared-copies-patch/patch.diff
          BASE_SHA: ${{ steps.base-sha.outputs.sha }}
        run: |
          mkdir -p "$BIN" "$(dirname "$PATCH_OUT")"
          cp .base/.github/scripts/pr-unblock/sync-shared-copies.sh "$BIN/"
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          rc=0
          result=$(bash "$BIN/sync-shared-copies.sh" "$GITHUB_WORKSPACE/.base" "$GITHUB_WORKSPACE/head" "$BASE_SHA" "$PATCH_OUT") || rc=$?
          echo "::$token::"
          state="" sum="" refused=""
          while IFS='=' read -r key value; do
            case $key in
              state) [[ $value =~ ^(written|empty)$ ]] && state=$value ;;
              sha256) [[ $value =~ ^[0-9a-f]{64}$ ]] && sum=$value ;;
              refused) [[ $value =~ ^shared-copy-(tooling-changed|path-unregistered)$ ]] && refused=$value ;;
            esac
          done <<<"$result"
          if ((rc == 3)) && [[ -n $refused ]]; then
            echo "refused=$refused" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          ((rc == 0)) || { echo "::error::sync-shared-copies.sh exited $rc"; exit 1; }
          if [[ $state == written && -n $sum ]]; then
            actual=$(sha256sum <"$PATCH_OUT")
            [[ ${actual%% *} == "$sum" ]] || { echo "::error::the patch does not match the SHA-256 the sync printed"; exit 1; }
          elif [[ $state != empty ]]; then
            echo "::error::sync-shared-copies.sh printed no valid state"
            exit 1
          fi
          echo "state=$state" >>"$GITHUB_OUTPUT"
          echo "sha256=$sum" >>"$GITHUB_OUTPUT"

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          steps.sync.outputs.state == 'written'
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/sync-shared-copies-patch/patch.diff

      - name: Upload the patch
        if: >-
          (steps.sync.outputs.state == 'written') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patch-pr-unblock-sync-shared-copies-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sync-shared-copies-patch/patch.diff
          if-no-files-found: error
          retention-days: 1

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # Every select outcome posts the sync-shared-copies check on the head the
  # select job read, so dispatch.mjs sends a head once: no-model-turn when it
  # proceeded (apply-shared-copies pushes the merge), else the skip reason, else
  # the refusal's own skip (escalation-routes.mjs stopSkip). A select job
  # whose hold read held on a fault posts nothing. A select job that failed
  # after reading the head posts failure, which dispatch.mjs retries
  # until limit-stops-per-head failures stand on the head, as it does
  # resolve-conflicts's. A kill-switch stop reads no head, and nothing is
  # posted.
  sync-shared-copies-not-run:
    name: Sync Shared Copies Not Run
    needs: sync-shared-copies-select
    if: >-
      ${{ !cancelled() && inputs.activity == 'sync-shared-copies'
      && (needs.sync-shared-copies-select.outputs.proceed != '' || needs.sync-shared-copies-select.result == 'failure')
      && needs.sync-shared-copies-select.outputs.head-sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read the stop's skip reason
        id: stop
        env:
          REASON: ${{ needs.sync-shared-copies-select.outputs.escalation-reason }}
        run: echo "skip=$(node .base/.github/scripts/pr-unblock/escalation-routes.mjs skip)" >>"$GITHUB_OUTPUT"

      - name: Post the sync-shared-copies check run
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: sync-shared-copies
          run-result: ${{ needs.sync-shared-copies-select.result == 'failure' && 'failure' || 'skipped' }}
          not-run-reason: >-
            ${{ needs.sync-shared-copies-select.result != 'failure'
            && (needs.sync-shared-copies-select.outputs.proceed == 'true' && 'no-model-turn'
            || needs.sync-shared-copies-select.outputs.skip-reason
            || steps.stop.outputs.skip) || '' }}
          head-sha: ${{ needs.sync-shared-copies-select.outputs.head-sha }}
          can-commit: "false"
          base-path: .base
          head-sha-fallback: ${{ needs.sync-shared-copies-select.outputs.head-sha }}
          github-token: ${{ github.token }}

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The push job: apply-patch.mjs under patch-rules.json's shared-copies row,
  # a script with no model that runs no head code. It merges the select job's
  # pinned base into the head again, refuses any state but the select job's
  # clean merge and tree, applies the select job's patch to that tree (none
  # when the sync was empty), admits only copies the base-tip
  # scripts/shared-copies.txt lists, skips a head that moved since the select
  # job read it, and pushes one merge commit with the head and the base as
  # parents, without force.
  apply-shared-copies:
    name: Apply Shared Copies
    needs: sync-shared-copies-select
    if: ${{ !cancelled() && needs.sync-shared-copies-select.outputs.proceed == 'true' }}
    permissions:
      actions: read # the write runner's run job reads the review lanes' comment records
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: apply-shared-copies
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      # The select job's own outputs: it ran no model and only base code.
      # written or empty; an empty state carries no patch, SHA-256 or attempt.
      patch-state: ${{ needs.sync-shared-copies-select.outputs.patch-state }}
      patch-sha256: ${{ needs.sync-shared-copies-select.outputs.patch-sha256 }}
      patch-attempt: ${{ needs.sync-shared-copies-select.outputs.patch-attempt }}
      patch-activity: sync-shared-copies
      patch-prepare: shared-copies
      patch-head-sha: ${{ needs.sync-shared-copies-select.outputs.head-sha }}
      patch-merge-base-sha: ${{ needs.sync-shared-copies-select.outputs.base-sha }}
      patch-merge-state: clean
      patch-conflict-tree: ${{ needs.sync-shared-copies-select.outputs.conflict-tree }}
      # The select job proceeds only past pr-merge's shared-copy refusal,
      # which gate-recheck.mjs reads again right before the push.
      patch-human-gate: lane-escalation

  # address-feedback is five jobs, so no model ever holds a write token. This
  # one runs only base code with a read-only token and checks out no PR head.
  # Before any model turn it reads the PR head, resolves the slot (draft and
  # do-not-merge skip it), and keeps the reviewer-bot threads to work on
  # (address-feedback.mjs select): it skips, hands the PR to a person (a
  # .github/ diff or the round cap), or writes the thread file and run.json
  # the model job and the reply job read. Every gate, head and reply input
  # the jobs after it take comes from here, never from the model job, whose
  # runner head code could forge.
  address-feedback-select:
    name: Address Feedback Select
    needs: dispatcher-current
    if: >-
      inputs.pr-number != '' && inputs.activity == 'address-feedback'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
      && needs.dispatcher-current.outputs.stale != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out main
      pull-requests: read # the PR, its reviews, review comments and threads
      checks: read # the model check runs that count rounds
      actions: read # an earlier FAIL's verdict artifact and its pr-verify run (verify-earlier-fail-heads)
      issues: read # the closing issues' spec text an advisory thread is judged against (closing_issues)
    outputs:
      # true once the context is uploaded; false on a skip or an escalation;
      # empty when the job stopped before deciding.
      proceed: >-
        ${{ steps.upload.outcome == 'success' && steps.select.outputs.resolve-only != 'true' && 'true'
        || (steps.slot.outputs.applies == 'false' || steps.select.outputs.proceed == 'false') && 'false' || '' }}
      # true for a pass-only round with stale fail-note threads uploaded: only
      # the reply job runs, and proceed stays empty.
      resolve-only: ${{ steps.upload.outcome == 'success' && steps.select.outputs.resolve-only == 'true' && 'true' || '' }}
      head-sha: ${{ steps.head.outputs.sha }}
      escalation-reason: ${{ steps.select.outputs.escalation-reason }}
      skip-reason: ${{ steps.slot.outputs.applies == 'false' && steps.slot.outputs.skip-reason || steps.select.outputs.skip-reason }}
      human-gate: ${{ steps.select.outputs.human-gate }}
      # "1" for a same-head retry after the reply job stopped there
      # (escalation-routes.mjs retryRung), else empty.
      model-rung: ${{ steps.select.outputs.model-rung }}
      # `round <N> of max <M>` when the round cap stopped the PR, for the
      # neutral checks' summary.
      not-run-detail: ${{ steps.select.outputs.not-run-detail }}
      # true when no hold and no unresolved thread is left on the head, so
      # report-stop-status clears a failing pr-unblock/address-feedback.
      stop-resolved: ${{ steps.select.outputs.stop-resolved }}
      # true when a listed person opened the PR (resolve-threads.mjs
      # ownerPull), for resolve-feedback-threads' gate.
      person-opened: ${{ steps.select.outputs.person-opened }}
      threads-sha256: ${{ steps.select.outputs.threads-sha256 }}
      run-sha256: ${{ steps.select.outputs.run-sha256 }}
      # The artifact name's attempt, so a re-run of a later job alone still
      # finds it.
      context-attempt: ${{ steps.upload.outcome == 'success' && github.run_attempt || '' }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Read the PR head
        id: head
        if: steps.kill.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          # The whole answer, which the select step takes instead of reading
          # the PR again (address-feedback.mjs pullFromFile).
          PULL_FILE: ${{ runner.temp }}/pr-head.json
        run: |
          # Each `gh api` call keeps its rate-limit reading for the job-end
          # api-budget notice (.github/actions/log-api-budget).
          # shellcheck source=/dev/null
          { . .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null && api_budget_wrap_gh github-token; } || true
          # shellcheck source=/dev/null
          . .base/.github/scripts/pr-unblock/read-pr-head.bash
          if ! [[ $PR_NUMBER =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::the pr-number input is not a PR number"
            exit 1
          fi
          read_pr_fields "$PR_NUMBER" '.' || exit 1
          printf '%s\n' "$pr_fields" >"$PULL_FILE"
          { read -r sha && read -r head_repo; } <<<"$(jq -r '.head.sha // "", .head.repo.full_name // ""' "$PULL_FILE")" || true
          if ! [[ ${sha:-} =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the PR names no head SHA"
            exit 1
          fi
          if [[ ${head_repo:-} != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::the PR's head is not in this repository"
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # As the read runner resolves it: its applies-when decides on the head
      # just read, before any thread is read.
      - name: Resolve the slot
        id: slot
        if: steps.head.outcome == 'success'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: address-feedback
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          pr-number: ${{ inputs.pr-number }}
          head-sha: ${{ steps.head.outputs.sha }}
          prepare-supported: "true"
          applied-by-supported: patch feedback-replies

      - name: Select the review threads
        id: select
        if: steps.slot.outputs.applies == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The review lanes' comment records (actions: read).
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          PULL_FILE: ${{ runner.temp }}/pr-head.json
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          FEEDBACK_DIR: ${{ runner.temp }}/feedback-context
          TRUSTED_ACTORS: .base/.github/standards/trusted-actors/trusted-actors.json
          TRACKER_CONFIG: .base/docs/conventions/work-items.yaml
          RESOLVED: ${{ runner.temp }}/resolved-config.json
          # A pass-only round (address-feedback.mjs select), sent only by a
          # dispatcher run, which the reply job's gate checks.
          VERIFY_PASS_HEAD: ${{ inputs.verify-pass-head }}
          VERIFY_SUPERSEDED_HEAD: ${{ inputs.verify-superseded-head }}
          # A model round on the notes of the FAILs behind a verify:earlier-fail
          # refusal, read from their verdict artifacts (earlier-fail-notes.mjs).
          VERIFY_EARLIER_FAIL_HEADS: ${{ inputs.verify-earlier-fail-heads }}
          DISPATCHER_RUN_ID: ${{ inputs.dispatcher-run-id }}
        run: |
          mkdir -p "$FEEDBACK_DIR"
          REVIEW_ROUNDS=$(jq -r '.loop["review-rounds"]' "$RESOLVED")
          export REVIEW_ROUNDS
          # The listed review bots' ids (review-threads.reviewer-ids), one per line.
          REVIEWER_IDS=$(jq -r '.["review-threads"]["reviewer-ids"] // [] | .[]' "$RESOLVED")
          export REVIEWER_IDS
          LANE_IDENTITY=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          export LANE_IDENTITY
          THREAD_FILE="$FEEDBACK_DIR/threads.json" RUN_FILE="$FEEDBACK_DIR/run.json" \
            node .base/.github/scripts/pr-unblock/address-feedback.mjs select
          if [ -f "$FEEDBACK_DIR/threads.json" ]; then
            for name in threads run; do
              sum=$(sha256sum <"$FEEDBACK_DIR/$name.json")
              echo "$name-sha256=${sum%% *}" >>"$GITHUB_OUTPUT"
            done
          fi

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          steps.select.outputs.proceed == 'true' || steps.select.outputs.resolve-only == 'true'
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: |
            ${{ runner.temp }}/feedback-context/threads.json
            ${{ runner.temp }}/feedback-context/run.json

      - name: Upload the feedback context
        id: upload
        if: >-
          (steps.select.outputs.proceed == 'true' || steps.select.outputs.resolve-only == 'true') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feedback-context-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/feedback-context/threads.json
            ${{ runner.temp }}/feedback-context/run.json
          retention-days: 1
          if-no-files-found: error

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # A select that kept nothing, or handed the PR to a person, runs no model
  # or reply job, so neither check would land on the head and
  # feedback-dispatch.mjs would dispatch it again. This job posts both
  # neutral on the head the select job read; a kill-switch stop reads none,
  # and nothing is posted.
  address-feedback-not-run:
    name: Address Feedback Not Run
    needs: address-feedback-select
    if: >-
      ${{ !cancelled() && inputs.activity == 'address-feedback'
      && needs.address-feedback-select.outputs.proceed == 'false'
      && needs.address-feedback-select.outputs.head-sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Post the address-feedback check run
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: address-feedback
          run-result: skipped
          not-run-reason: ${{ needs.address-feedback-select.outputs.skip-reason || 'awaiting-human' }}
          not-run-detail: ${{ needs.address-feedback-select.outputs.not-run-detail }}
          head-sha: ${{ needs.address-feedback-select.outputs.head-sha }}
          can-commit: "false"
          base-path: .base
          head-sha-fallback: ${{ needs.address-feedback-select.outputs.head-sha }}
          github-token: ${{ github.token }}

      - name: Post the publish-feedback check run
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: publish-feedback
          run-result: skipped
          not-run-reason: ${{ needs.address-feedback-select.outputs.skip-reason || 'awaiting-human' }}
          not-run-detail: ${{ needs.address-feedback-select.outputs.not-run-detail }}
          head-sha: ${{ needs.address-feedback-select.outputs.head-sha }}
          can-commit: "false"
          base-path: .base
          head-sha-fallback: ${{ needs.address-feedback-select.outputs.head-sha }}
          github-token: ${{ github.token }}

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The model job: a read activity with no write token and no OIDC token in
  # the job that runs head code. The skill fixes the kept threads and records
  # a reply for each with the review-thread tool; the runner uploads its
  # uncommitted edits as a patch and, after its leak scan, its replies. It
  # runs on the pr-unblock role's API key alone, in the per-PR write queue.
  address-feedback:
    name: Address Feedback
    needs: address-feedback-select
    if: ${{ !cancelled() && needs.address-feedback-select.outputs.proceed == 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: address-feedback
      key-credit-job: address-feedback
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      model-rung: ${{ needs.address-feedback-select.outputs.model-rung }}
      feedback-context-attempt: ${{ needs.address-feedback-select.outputs.context-attempt }}
      feedback-context-sha256: ${{ needs.address-feedback-select.outputs.threads-sha256 }}
      head-sha: ${{ needs.address-feedback-select.outputs.head-sha }}
      # The 50-minute launcher step and the CLI install.
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether address-feedback's report job posted its check, read from this run's
  # jobs as fix-ci-handoff reads fix-ci's, never from an address-feedback
  # output: the run job runs head code and can forge them. A failed read
  # leaves posted empty, which starts the fallback call.
  address-feedback-handoff:
    name: Address Feedback Handoff
    needs: [address-feedback-select, address-feedback]
    if: ${{ !cancelled() && needs.address-feedback-select.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      fallback-ready: ${{ steps.fallback.outputs.ready }}
      posted: ${{ steps.posted.outputs.posted }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether address-feedback posted its check
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: address-feedback
        run: bash .base/.github/scripts/lib/handoff-evidence.sh posted

      # Whether the third call can run, never the token.
      # address-feedback-subscription passes it on as fallback-ready, so with
      # the token empty its subscription leg stays the last; a failed read
      # leaves it empty, which hands nothing on.
      - name: Check the fallback token
        id: fallback
        env:
          PRESENT: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: echo "ready=$PRESENT" >>"$GITHUB_OUTPUT"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The subscription fallback, as fix-ci-subscription is for fix-ci: it runs
  # only when address-feedback-handoff read no check posted, which a credit
  # stop or an empty key leaves, and holds the OAuth token alone.
  address-feedback-subscription:
    name: Address Feedback Subscription
    needs: [address-feedback-select, address-feedback, address-feedback-handoff]
    if: >-
      ${{ !cancelled() && needs.address-feedback-select.outputs.proceed == 'true'
      && needs.address-feedback-handoff.outputs.posted != 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: address-feedback
      fallback: handoff
      fallback-ready: ${{ needs.address-feedback-handoff.outputs.fallback-ready }}
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      model-rung: ${{ needs.address-feedback-select.outputs.model-rung }}
      feedback-context-attempt: ${{ needs.address-feedback-select.outputs.context-attempt }}
      feedback-context-sha256: ${{ needs.address-feedback-select.outputs.threads-sha256 }}
      head-sha: ${{ needs.address-feedback-select.outputs.head-sha }}
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.PR_UNBLOCK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether address-feedback-subscription handed off to the fallback token, read from this run's
  # jobs by handoff-evidence.sh, never from a address-feedback-subscription output: its broker
  # allowed it, its run job succeeded and its scan job never ran. It runs
  # only when address-feedback-handoff found the fallback token set, so with the token empty
  # nothing starts that did not before. A failed read starts no third call.
  address-feedback-subscription-handoff:
    name: Address Feedback Subscription Handoff
    needs: [address-feedback-handoff, address-feedback-subscription]
    if: ${{ !cancelled() && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-handoff.outputs.fallback-ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      handed-off: ${{ steps.handoff.outputs.handed-off }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether address-feedback-subscription handed off
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: address-feedback-subscription
        run: bash .base/.github/scripts/lib/handoff-evidence.sh handed-off

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The third call, on the central fallback subscription's token alone: it
  # runs only on address-feedback-subscription-handoff's read, after address-feedback-subscription's subscription leg handed off (a
  # limit stop, a credit stop, or a 401 or 402). It is the last leg and never
  # hands off.
  address-feedback-fallback:
    name: Address Feedback Fallback
    needs: [address-feedback-select, address-feedback, address-feedback-handoff, address-feedback-subscription, address-feedback-subscription-handoff]
    if: ${{ !cancelled() && needs.address-feedback-handoff.outputs.fallback-ready == 'true' && needs.address-feedback-subscription-handoff.outputs.handed-off == 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: address-feedback
      fallback: fallback
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      model-rung: ${{ needs.address-feedback-select.outputs.model-rung }}
      feedback-context-attempt: ${{ needs.address-feedback-select.outputs.context-attempt }}
      feedback-context-sha256: ${{ needs.address-feedback-select.outputs.threads-sha256 }}
      head-sha: ${{ needs.address-feedback-select.outputs.head-sha }}
      timeout-minutes: 60
    secrets:
      fallback-claude-code-oauth-token: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # The push job: apply-patch.mjs under patch-rules.json's review-threads
  # row, a script with no model that runs no head code. It admits only paths
  # in the kept threads' scope, read from the select job's thread file, skips
  # a head that moved since the select job read it, and pushes one commit
  # without force. It runs only on a written patch: no change (every thread
  # INCORRECT or UNCERTAIN) needs no push. report-escalation takes no
  # escalation from it: a patch that does not land leaves no fix commit, and
  # publish-feedback ends the round feedback-not-landed. Its pushed-commit
  # output is the one head after the select job's that the reply job and
  # report-escalation accept.
  apply-feedback-patch:
    # After adjudicate-feedback too, so the push lands right before the reply
    # job: a review run on the pushed head that finishes while this run still
    # goes would find it in progress, skip, and start no next round.
    name: Apply Feedback Patch
    needs: [address-feedback-select, address-feedback, address-feedback-subscription, address-feedback-fallback, adjudicate-feedback]
    # One leg answers the round: the fallback call when it ran, else the
    # first, and every model-call input below is that leg's, so one leg's
    # patch never pairs with the other's replies and an empty field never
    # falls through. A patch with no replies is not pushed.
    if: >-
      ${{ !cancelled()
      && (needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.scan-patch-state || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.scan-patch-state || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.scan-patch-state || '') == 'written'
      && (needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.feedback-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-attempt || '') != '' }}
    permissions:
      actions: read # the write runner's run job reads the review lanes' comment records
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: apply-feedback-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      # The scan job's outputs alone, never a run job's, from the one leg.
      patch-state: ${{ needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.scan-patch-state || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.scan-patch-state || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.scan-patch-state || '' }}
      patch-sha256: ${{ needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.scan-patch-sha256 || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.scan-patch-sha256 || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.scan-patch-sha256 || '' }}
      patch-attempt: ${{ needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.scan-patch-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.scan-patch-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.scan-patch-attempt || '' }}
      patch-activity: address-feedback
      patch-prepare: review-threads
      # The head the select job read, from a job that ran no head code.
      patch-head-sha: ${{ needs.address-feedback-select.outputs.head-sha }}
      patch-threads-attempt: ${{ needs.address-feedback-select.outputs.context-attempt }}
      patch-threads-sha256: ${{ needs.address-feedback-select.outputs.threads-sha256 }}
      # The same leg's scanned replies, whose VALID threads the commit names.
      patch-replies-attempt: ${{ needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.feedback-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-attempt || '' }}
      patch-replies-sha256: ${{ needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.feedback-sha256 || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-sha256 || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-sha256 || '' }}
      # fix-request drops the human-gated label from the holds: the select job
      # kept only threads a trusted person with write access asked to fix;
      # lane-escalation drops it while the write runner reads it again as a
      # lane escalation (gate-source.mjs).
      patch-human-gate: ${{ needs.address-feedback-select.outputs.human-gate }}
      reply-attempt: ${{ needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.scan-reply-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.scan-reply-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.scan-reply-attempt || '' }}

  # Whether the adjudicator's key is still out of credit, and so which leg
  # every slot starts on (ci-workflows select-model-credential, its start
  # call: check-key-credit's one artifact-list call for the marker
  # adjudicate-feedback uploads after a key leg's credit stop). A credit stop
  # inside the window names the subscription leg, with no refused key attempt
  # first. No secret, no model, no checkout; every failure runs the key
  # (next-leg empty). Probing is off.
  adjudicate-key-credit:
    name: Adjudicate Key Credit
    needs: [address-feedback-select, address-feedback, address-feedback-subscription, address-feedback-fallback]
    # adjudicate-feedback's own condition: a round with a disputed reply.
    if: >-
      ${{ !cancelled() && needs.address-feedback-select.outputs.proceed == 'true'
      && (needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.feedback-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-attempt || '') != ''
      && (needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.feedback-disputed || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-disputed || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-disputed || '') == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # list this repository's credit-stop markers
    outputs:
      next-leg: ${{ steps.credit.outputs.next-leg }}
      next-reason: ${{ steps.credit.outputs.next-reason }}
      marker: ${{ steps.credit.outputs.marker }}
    steps:
      - name: Read the key's credit history
        id: credit
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@5b5110ae015183e900dd098c631d4dcc68904067 # 5b5110a 2026-11-06
        with:
          leg: start
          key-job: adjudicate-feedback
          window-hours: ${{ vars.KEY_CREDIT_WINDOW_HOURS }}
          reset-at: ${{ vars.KEY_CREDIT_RESET_AT }}
          probe-minutes: "0"

      # The skipped key leg's lane record: outcome skip, class credit-stop,
      # handed off, so leg counts before and after the gate compare.
      - name: Report the skipped key leg
        if: steps.credit.outputs.next-leg == 'subscription'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@6b9c640bf209c0c7e76f1111c5d18c96707348a2 # 6b9c640 2026-11-02
        with:
          outcome: skipped
          lane: adjudicate-feedback
          lane-id: adjudicate-feedback
          credential: PR_UNBLOCK_CLAUDE_API_KEY
          known-failure-class: credit-stop
          handoff: "true"

  # The adjudicator, after the model job and before the reply job, only when
  # the answering leg's scan job read a reply that leaves its thread open
  # (INCORRECT, UNCERTAIN or VALID-defer: feedback-disputed); skipping it
  # leaves any such reply with no verdict, which ends
  # feedback-unadjudicated. For each such reply on a non-CRITICAL
  # code-review thread no adjudication stood before, up to three
  # (adjudicate-feedback.mjs MAX_THREADS), a fresh-context model reads the
  # whole review comment, the locations the reviewer and the lane cited and
  # those files at the head the select job read, never the lane's note, and
  # returns lane, reviewer or human as structured output. The job runs only
  # base code, holds a read-only token and no OIDC token, and runs each model
  # call on run-claude-cli under dontAsk with Read alone, confined to its
  # slot; the model route is adjudicate-feedback (pr-pipeline.yaml
  # models.routes). Its verdicts leave as one artifact whose SHA-256 the reply
  # job checks, so an artifact the model job's head code uploaded under that
  # name fails this upload and reads as none. No verdict for a thread, a
  # skipped job or no usable credential escalates it as
  # feedback-unadjudicated.
  adjudicate-feedback:
    name: Adjudicate Feedback
    needs: [address-feedback-select, address-feedback, address-feedback-subscription, address-feedback-fallback, adjudicate-key-credit]
    if: >-
      ${{ !cancelled() && needs.address-feedback-select.outputs.proceed == 'true'
      && (needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.feedback-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-attempt || '') != ''
      && (needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.feedback-disputed || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-disputed || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-disputed || '') == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    cache-mode: read
    permissions:
      contents: read # the base checkout and the disputed files at the head
      issues: read # the linked issues' spec text (contract.json)
      pull-requests: read # the PR's closing issues and Refs: line
    outputs:
      attempt: ${{ steps.upload.outcome == 'success' && github.run_attempt || '' }}
      sha256: ${{ steps.upload.outcome == 'success' && steps.collect.outputs.sha256 || '' }}
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # The select job's thread file and the scan job's replies, from the one
      # leg the reply job reads; prepare checks each against its writer's SHA-256.
      - name: Download the feedback context
        if: steps.kill.outputs.proceed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feedback-context-${{ needs.address-feedback-select.outputs.context-attempt }}
          path: ${{ runner.temp }}/adjudicate-input

      - name: Download the review-thread replies
        if: steps.kill.outputs.proceed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feedback-replies-pr-unblock-address-feedback-${{ needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.feedback-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-attempt || '' }}
          path: ${{ runner.temp }}/adjudicate-input

      - name: Stage the disputed threads
        id: prepare
        if: steps.kill.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          HEAD_SHA: ${{ needs.address-feedback-select.outputs.head-sha }}
          THREADS_FILE: ${{ runner.temp }}/adjudicate-input/threads.json
          THREADS_SHA256: ${{ needs.address-feedback-select.outputs.threads-sha256 }}
          REPLIES_FILE: ${{ runner.temp }}/adjudicate-input/replies.jsonl
          REPLIES_SHA256: ${{ needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.feedback-sha256 || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-sha256 || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-sha256 || '' }}
          OUT_DIR: ${{ runner.temp }}/adjudicate
          # The linked issues' trusted spec text, read as pr-verify reads it,
          # staged as contract.json: a quote from it may settle an intent or
          # design question.
          PR_NUMBER: ${{ inputs.pr-number }}
          TRUSTED_ACTORS_PATH: .base/.github/standards/trusted-actors/trusted-actors.json
        run: |
          LANE_IDENTITY=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          export LANE_IDENTITY
          node .base/.github/scripts/pr-unblock/adjudicate-feedback.mjs prepare

      - name: Resolve the adjudicator's model
        id: models
        if: fromJSON(steps.prepare.outputs.count || '0') > 0
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: adjudicate-feedback
          base-path: .base
          output-path: ${{ runner.temp }}/adjudicate-models.json

      # Which legs can run, never a secret's value (ci-workflows
      # select-model-credential, one call per leg for the whole job). The key
      # runs unless it is empty or adjudicate-key-credit named the
      # subscription leg. Each slot's next-leg calls take these states.
      - name: Check the API key
        id: key
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@5b5110ae015183e900dd098c631d4dcc68904067 # 5b5110a 2026-11-06
        with:
          leg: key
          role: pr-unblock
          credential-set: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY != '' }}
          selected: ${{ needs.adjudicate-key-credit.outputs.next-leg }}

      - name: Check the subscription token
        id: sub
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@5b5110ae015183e900dd098c631d4dcc68904067 # 5b5110a 2026-11-06
        with:
          leg: subscription
          role: pr-unblock
          credential-set: ${{ secrets.PR_UNBLOCK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
          fallback-set: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}

      - name: Check the fallback token
        id: fb
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@5b5110ae015183e900dd098c631d4dcc68904067 # 5b5110a 2026-11-06
        with:
          leg: fallback
          role: pr-unblock
          credential-set: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}

      # run-claude-cli refuses to run without these root-owned settings, which
      # need sudo, so they are written before the runner is isolated.
      - name: Apply the Claude managed settings
        if: steps.key.outputs.present == 'true' || steps.sub.outputs.present == 'true' || steps.fb.outputs.present == 'true'
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@2476d5dde8979eab34374150b7e4b0a2b99f4e88 # 2476d5d 2026-10-29

      # Nothing after this step needs sudo or docker.
      - name: Isolate the runner
        if: steps.key.outputs.present == 'true' || steps.sub.outputs.present == 'true' || steps.fb.outputs.present == 'true'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: "true"

      # One fresh model call per thread and leg: each sees only its own slot,
      # copied into the workspace, the one tree run-claude-cli reads. A slot
      # runs the key leg, then the subscription leg when the key leg handed
      # off (a credit stop, or a 401 or 402) or did not run, then the fallback
      # leg when the subscription leg handed off (a limit stop, a credit stop,
      # or a 401 or 402) or its token is empty. The steps hold one credential each and stay in one
      # job: the judge has Read alone, no Bash (run-claude-cli's one-job rule). The judge has
      # Read alone, as pr-verify's verifier does: evidence.json names every
      # file it needs, so Glob and Grep are denied rather than trusted to
      # honor Read denials. The Read denials keep the base checkout and the
      # runner's temp files (the lane's replies.jsonl, the other slots) out
      # (code.claude.com/docs/en/permissions, "Read and Edit"). Each staged
      # file carries a .txt suffix, so a cited CLAUDE.md or .claude/** file
      # is never loaded as instructions. The steps repeat once per slot up to MAX_THREADS
      # (workflow-gates.test.mjs pins the count and their grants).

      - name: Stage disputed thread 0
        if: (steps.key.outputs.present == 'true' || steps.sub.outputs.present == 'true' || steps.fb.outputs.present == 'true') && fromJSON(steps.prepare.outputs.count || '0') > 0
        env:
          SLOT_DIR: ${{ runner.temp }}/adjudicate/0
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}/adjudicate"
          cp -R "$SLOT_DIR" "$GITHUB_WORKSPACE/adjudicate"

      - name: Adjudicate disputed thread 0
        id: judge-0
        if: steps.key.outputs.present == 'true' && fromJSON(steps.prepare.outputs.count || '0') > 0
        continue-on-error: true
        timeout-minutes: 20
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@fc442ad3e808adafe3b195e9d12fff901220db50 # fc442ad 2026-11-09
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          LD_LIBRARY_PATH: ""
        with:
          lane: adjudicate-feedback
          role: pr-unblock
          prompt-file: ${{ github.workspace }}/.base/.github/scripts/pr-unblock/adjudicate-feedback.prompt.md
          preamble: You are running unattended in GitHub Actions. No person can answer a question during this run, and you change nothing.
          api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./adjudicate/**)
          disallowed-tools: |
            Read(./.base/**)
            Read(/${{ runner.temp }}/**)
            Read(//proc/**)
            Glob
            Grep
            mcp__*
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            Skill
          json-schema-file: ${{ github.workspace }}/.base/.github/scripts/pr-unblock/adjudicate-feedback.schema.json
          leg-timeout-minutes: "15"

      # The leg's transcript, failed legs included, sealed to the transcript
      # key and kept 7 days for the puller; a failed upload never fails the job.
      - name: Upload disputed thread 0's sealed transcript
        if: always() && steps.judge-0.outputs.execution-file != ''
        continue-on-error: true
        uses: ./.base/.github/actions/upload-lane-transcript # zizmor: ignore[self-repository]
        with:
          execution-file: ${{ steps.judge-0.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}-0

      # The leg's lane-outcome record: its credential, outcome, handoff,
      # fallback reason and durationMs.
      - name: Record disputed thread 0's leg
        if: always() && steps.judge-0.outcome != 'skipped'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@6b9c640bf209c0c7e76f1111c5d18c96707348a2 # 6b9c640 2026-11-02
        with:
          outcome: ${{ steps.judge-0.outcome }}
          execution-file: ${{ steps.judge-0.outputs.execution-file }}
          log-file: ${{ steps.judge-0.outputs.log-file }}
          lane: adjudicate-feedback
          lane-id: adjudicate-feedback
          credential: ${{ steps.judge-0.outputs.credential }}
          handoff: ${{ steps.judge-0.outputs.handoff }}
          known-failure-class: ${{ steps.judge-0.outputs.lane-class }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          fallback-reason: ""

      # Whether the subscription leg judges thread 0: after the key leg's
      # handoff, or when the key did not run.
      - name: Pick disputed thread 0's next leg
        id: next-0
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 1
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@5b5110ae015183e900dd098c631d4dcc68904067 # 5b5110a 2026-11-06
        with:
          state: ${{ steps.key.outputs.state }}
          handoff: ${{ steps.judge-0.outputs.handoff }}
          handoff-reason: ${{ steps.judge-0.outputs.handoff-reason }}

      - name: Adjudicate disputed thread 0 on the subscription
        id: judge-0-subscription
        if: steps.sub.outputs.present == 'true' && fromJSON(steps.prepare.outputs.count || '0') > 0 && steps.next-0.outputs.next-leg == 'subscription'
        continue-on-error: true
        timeout-minutes: 20
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@fc442ad3e808adafe3b195e9d12fff901220db50 # fc442ad 2026-11-09
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          LD_LIBRARY_PATH: ""
        with:
          lane: adjudicate-feedback
          role: pr-unblock
          prompt-file: ${{ github.workspace }}/.base/.github/scripts/pr-unblock/adjudicate-feedback.prompt.md
          preamble: You are running unattended in GitHub Actions. No person can answer a question during this run, and you change nothing.
          subscription-token: ${{ secrets.PR_UNBLOCK_CLAUDE_CODE_OAUTH_TOKEN }}
          fallback-ready: ${{ steps.sub.outputs.fallback-ready }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./adjudicate/**)
          disallowed-tools: |
            Read(./.base/**)
            Read(/${{ runner.temp }}/**)
            Read(//proc/**)
            Glob
            Grep
            mcp__*
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            Skill
          json-schema-file: ${{ github.workspace }}/.base/.github/scripts/pr-unblock/adjudicate-feedback.schema.json
          leg-timeout-minutes: "15"

      # The leg's transcript, failed legs included, sealed to the transcript
      # key and kept 7 days for the puller; a failed upload never fails the job.
      - name: Upload disputed thread 0's sealed transcript on the subscription
        if: always() && steps.judge-0-subscription.outputs.execution-file != ''
        continue-on-error: true
        uses: ./.base/.github/actions/upload-lane-transcript # zizmor: ignore[self-repository]
        with:
          execution-file: ${{ steps.judge-0-subscription.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}-0-subscription

      # The leg's lane-outcome record: its credential, outcome, handoff,
      # fallback reason and durationMs.
      - name: Record disputed thread 0's leg on the subscription
        if: always() && steps.judge-0-subscription.outcome != 'skipped'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@6b9c640bf209c0c7e76f1111c5d18c96707348a2 # 6b9c640 2026-11-02
        with:
          outcome: ${{ steps.judge-0-subscription.outcome }}
          execution-file: ${{ steps.judge-0-subscription.outputs.execution-file }}
          log-file: ${{ steps.judge-0-subscription.outputs.log-file }}
          lane: adjudicate-feedback
          lane-id: adjudicate-feedback
          credential: ${{ steps.judge-0-subscription.outputs.credential }}
          handoff: ${{ steps.judge-0-subscription.outputs.handoff }}
          known-failure-class: ${{ steps.judge-0-subscription.outputs.lane-class }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          fallback-reason: ${{ steps.next-0.outputs.next-reason }}

      # Whether the fallback leg judges thread 0: after the subscription
      # leg's handoff, or when its token is empty. The subscription state is
      # the job's one call, so it counts only when this slot reached that leg.
      - name: Pick disputed thread 0's next leg after the subscription
        id: next-0-subscription
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 1
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@5b5110ae015183e900dd098c631d4dcc68904067 # 5b5110a 2026-11-06
        with:
          state: ${{ steps.next-0.outputs.next-leg == 'subscription' && steps.sub.outputs.state || '' }}
          handoff: ${{ steps.judge-0-subscription.outputs.handoff }}
          handoff-reason: ${{ steps.judge-0-subscription.outputs.handoff-reason }}

      - name: Adjudicate disputed thread 0 on the fallback token
        id: judge-0-fallback
        if: steps.fb.outputs.present == 'true' && fromJSON(steps.prepare.outputs.count || '0') > 0 && steps.next-0-subscription.outputs.next-leg == 'fallback'
        continue-on-error: true
        timeout-minutes: 20
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@fc442ad3e808adafe3b195e9d12fff901220db50 # fc442ad 2026-11-09
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          LD_LIBRARY_PATH: ""
        with:
          lane: adjudicate-feedback
          role: pr-unblock
          prompt-file: ${{ github.workspace }}/.base/.github/scripts/pr-unblock/adjudicate-feedback.prompt.md
          preamble: You are running unattended in GitHub Actions. No person can answer a question during this run, and you change nothing.
          fallback-token: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./adjudicate/**)
          disallowed-tools: |
            Read(./.base/**)
            Read(/${{ runner.temp }}/**)
            Read(//proc/**)
            Glob
            Grep
            mcp__*
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            Skill
          json-schema-file: ${{ github.workspace }}/.base/.github/scripts/pr-unblock/adjudicate-feedback.schema.json
          leg-timeout-minutes: "15"

      # The leg's transcript, failed legs included, sealed to the transcript
      # key and kept 7 days for the puller; a failed upload never fails the job.
      - name: Upload disputed thread 0's sealed transcript on the fallback token
        if: always() && steps.judge-0-fallback.outputs.execution-file != ''
        continue-on-error: true
        uses: ./.base/.github/actions/upload-lane-transcript # zizmor: ignore[self-repository]
        with:
          execution-file: ${{ steps.judge-0-fallback.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}-0-fallback

      # The leg's lane-outcome record: its credential, outcome, handoff,
      # fallback reason and durationMs.
      - name: Record disputed thread 0's leg on the fallback token
        if: always() && steps.judge-0-fallback.outcome != 'skipped'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@6b9c640bf209c0c7e76f1111c5d18c96707348a2 # 6b9c640 2026-11-02
        with:
          outcome: ${{ steps.judge-0-fallback.outcome }}
          execution-file: ${{ steps.judge-0-fallback.outputs.execution-file }}
          log-file: ${{ steps.judge-0-fallback.outputs.log-file }}
          lane: adjudicate-feedback
          lane-id: adjudicate-feedback
          credential: ${{ steps.judge-0-fallback.outputs.credential }}
          handoff: ${{ steps.judge-0-fallback.outputs.handoff }}
          known-failure-class: ${{ steps.judge-0-fallback.outputs.lane-class }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          fallback-reason: ${{ steps.next-0-subscription.outputs.next-reason }}

      # The answering leg's verdict, from the one leg with structured output.
      # A leg in another permission mode, or with no init message, keeps no
      # verdict (check-permission-mode.sh); its thread reads as unadjudicated.
      - name: Keep disputed thread 0's verdict
        if: always() && (steps.judge-0.outputs.structured-output-file != '' || steps.judge-0-subscription.outputs.structured-output-file != '' || steps.judge-0-fallback.outputs.structured-output-file != '')
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.judge-0-fallback.outputs.structured-output-file != '' && steps.judge-0-fallback.outputs.execution-file || steps.judge-0-subscription.outputs.structured-output-file != '' && steps.judge-0-subscription.outputs.execution-file || steps.judge-0.outputs.execution-file }}
          MODE: dontAsk
          OUTPUT_FILE: ${{ steps.judge-0-fallback.outputs.structured-output-file != '' && steps.judge-0-fallback.outputs.structured-output-file || steps.judge-0-subscription.outputs.structured-output-file != '' && steps.judge-0-subscription.outputs.structured-output-file || steps.judge-0.outputs.structured-output-file }}
          SLOT_DIR: ${{ runner.temp }}/adjudicate/0
        run: |
          bash .base/.github/scripts/read-patch/check-permission-mode.sh
          cp "$OUTPUT_FILE" "$SLOT_DIR/verdict.json"

      - name: Stage disputed thread 1
        if: (steps.key.outputs.present == 'true' || steps.sub.outputs.present == 'true' || steps.fb.outputs.present == 'true') && fromJSON(steps.prepare.outputs.count || '0') > 1
        env:
          SLOT_DIR: ${{ runner.temp }}/adjudicate/1
        run: |
