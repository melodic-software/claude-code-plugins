        timeout-minutes: 1
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/key-credit-stop-address-feedback/run-id

      - name: Upload address-feedback's credit-stop marker
        if: (steps.credit-marker-address-feedback.outcome == 'success') && steps.credit-marker-scan-address-feedback.outputs.clean == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: key-credit-stop-PR_UNBLOCK_CLAUDE_API_KEY
          overwrite: true
          path: ${{ runner.temp }}/key-credit-stop-address-feedback/run-id
