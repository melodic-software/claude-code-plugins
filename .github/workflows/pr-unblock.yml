          cp "$OUTPUT_FILE" "$SLOT_DIR/verdict.json"

      # Read by the next runs' credit gate (adjudicate-key-credit): the
      # artifact its `marker` output names (check-key-credit gate.cjs
      # markerName), uploaded only after a key leg's credit-stop handoff. The
      # name is written out so its retention row claims it.
      - name: Write the key's credit-stop marker
        id: credit-marker
        if: always() && needs.adjudicate-key-credit.outputs.marker == 'key-credit-stop-pr-unblock.yml-adjudicate-feedback' && (steps.judge-0.outputs.handoff-reason == 'credit-stop' || steps.judge-1.outputs.handoff-reason == 'credit-stop' || steps.judge-2.outputs.handoff-reason == 'credit-stop')
        continue-on-error: true
        timeout-minutes: 1
        run: |
          rm -rf "${RUNNER_TEMP:?}/key-credit-stop"
          mkdir -p "$RUNNER_TEMP/key-credit-stop"
          echo "$GITHUB_RUN_ID" >"$RUNNER_TEMP/key-credit-stop/run-id"

      - name: Scan the key's credit-stop marker for credentials
        id: credit-marker-scan
        if: always() && steps.credit-marker.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/key-credit-stop/run-id

      - name: Upload the key's credit-stop marker
        if: (always() && steps.credit-marker.outcome == 'success') && steps.credit-marker-scan.outputs.clean == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: key-credit-stop-pr-unblock.yml-adjudicate-feedback
          path: ${{ runner.temp }}/key-credit-stop/run-id
          if-no-files-found: error
          retention-days: 1

      - name: Collect the verdicts
        id: collect
        if: always() && fromJSON(steps.prepare.outputs.count || '0') > 0
        env:
          OUT_DIR: ${{ runner.temp }}/adjudicate
          VERDICTS_FILE: ${{ runner.temp }}/adjudication/verdicts.json
        run: |
          mkdir -p "$(dirname "$VERDICTS_FILE")"
          node .base/.github/scripts/pr-unblock/adjudicate-feedback.mjs collect

      # overwrite: false, so a copy the model job's head code uploaded first
      # fails this upload, and the reply job reads no verdicts.
      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          always() && steps.collect.outcome == 'success'
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/adjudication/verdicts.json

      - name: Upload the verdicts
        id: upload
        if: >-
          (always() && steps.collect.outcome == 'success') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feedback-adjudication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adjudication/verdicts.json
          retention-days: 1
          if-no-files-found: error
          overwrite: false

      # The prepare step's contents reads, from their own responses.
      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The reply job, a script with no model: it holds pull-requests: write and
  # posts the replies the model job recorded, exactly as written or not at
  # all, naming the commit the push job made, then the round marker. It runs
  # whenever the select job proceeded, whatever the model and push jobs did,
  # so every round is counted; a hostile model job cannot skip it. In a
  # pass-only round it runs alone and only resolves the stale fail-note
  # threads run.json lists (publish-feedback.mjs).
  publish-feedback:
    name: Publish Feedback
    needs: [address-feedback-select, address-feedback, address-feedback-subscription, address-feedback-fallback, apply-feedback-patch, adjudicate-feedback]
    if: ${{ !cancelled() && (needs.address-feedback-select.outputs.proceed == 'true' || needs.address-feedback-select.outputs.resolve-only == 'true') }}
    permissions:
      actions: read # the write runner's run job reads the review lanes' comment records
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: publish-feedback
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      review-replies: true
      # run.json and its SHA-256, from the select job.
      review-run-sha256: ${{ needs.address-feedback-select.outputs.run-sha256 }}
      review-run-attempt: ${{ needs.address-feedback-select.outputs.context-attempt }}
      # The replies, their SHA-256 and the patch state, all from the one leg
      # apply-feedback-patch reads; only the scan job, which ran no model or
      # head code, sets these outputs. The scan's refusal arrives as the
      # scan-refusal job's marker artifact, which the reply job downloads.
      review-replies-attempt: ${{ needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.feedback-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-attempt || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-attempt || '' }}
      review-replies-sha256: ${{ needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.feedback-sha256 || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.feedback-sha256 || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.feedback-sha256 || '' }}
      review-patch-state: ${{ needs.address-feedback-fallback.result != 'skipped' && needs.address-feedback-fallback.outputs.scan-patch-state || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result != 'skipped' && needs.address-feedback-subscription.outputs.scan-patch-state || needs.address-feedback-fallback.result == 'skipped' && needs.address-feedback-subscription.result == 'skipped' && needs.address-feedback.outputs.scan-patch-state || '' }}
      # The adjudicator's verdicts on the INCORRECT replies, and their SHA-256,
      # set only once its upload succeeded.
      review-adjudication-attempt: ${{ needs.adjudicate-feedback.outputs.attempt }}
      review-adjudication-sha256: ${{ needs.adjudicate-feedback.outputs.sha256 }}
      # The push job moved the PR head off the reviewed one; the gate accepts
      # the review of the head the select job read only while the PR is at it
      # or at the one commit the push job pushed, never at a lanes App commit
      # another job or run made. A human dispatch has no dispatcher and
      # passes neither.
      expected-upstream-head: >-
        ${{ inputs.dispatcher-run-id != '' && needs.address-feedback-select.outputs.head-sha || '' }}
      pushed-commit: >-
        ${{ inputs.dispatcher-run-id != '' && needs.apply-feedback-patch.outputs.pushed-commit || '' }}

  # The resolve job, a script with no model and no PR head checkout
  # (checkout: base): on a PR a trusted person opened it resolves the threads
  # publish-feedback answered or GitHub reports outdated, with no CRITICAL
  # finding and no person's comment (resolve-threads.mjs). It reads the
  # threads from GitHub, never from another job's outputs, and is the one job
  # whose lane token holds the contents: write that resolving there needs;
  # publish-feedback keeps publish-artifact. It escalates nothing.
  resolve-feedback-threads:
    name: Resolve Feedback Threads
    needs: [address-feedback-select, apply-feedback-patch, publish-feedback]
    # On an acted round, and on the reply script's own stops, after which
    # other threads may still hold its answers: an escalation (lane-stopped,
    # awaiting-human), finding-stands or no-model-turn. Never on any other
    # skip: a kill-switch stop ends publish-feedback green with no token, and
    # nothing may run after it. Never on a PR no listed person opened, where
    # the script resolves nothing (publish-feedback resolves a lanes App PR's
    # threads itself), nor on a relayed person's reply, whose thread holds a
    # person's comment the script leaves open: no runner, no mint.
    if: >-
      ${{ !cancelled() && needs.publish-feedback.result == 'success'
      && needs.address-feedback-select.outputs.person-opened == 'true'
      && inputs.upstream-relay != 'true'
      && (needs.publish-feedback.outputs.skip-reason == ''
      || needs.publish-feedback.outputs.skip-reason == 'lane-stopped'
      || needs.publish-feedback.outputs.skip-reason == 'awaiting-human'
      || needs.publish-feedback.outputs.skip-reason == 'finding-stands'
      || needs.publish-feedback.outputs.skip-reason == 'no-model-turn') }}
    permissions:
      actions: read # the write runner's run job reads the review lanes' comment records
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: resolve-feedback-threads
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      # As publish-feedback: the gate accepts the review of the head the
      # select job read while the PR is at it or at the push job's commit.
      expected-upstream-head: >-
        ${{ inputs.dispatcher-run-id != '' && needs.address-feedback-select.outputs.head-sha || '' }}
      pushed-commit: >-
        ${{ inputs.dispatcher-run-id != '' && needs.apply-feedback-patch.outputs.pushed-commit || '' }}

  # review-dependency is six jobs, so no model ever holds a write token. This
  # one runs only base code with a read-only token and checks out no PR head.
  # Before any model turn it reads the PR head, resolves the slot (draft and
  # held PRs skip it) and selects the PR (review-dependency.mjs select): it
  # skips one Dependabot did not open or one sorted auto, writes the
  # install-script pin patch apply-dependency-pin pushes when the head's
  # claude-code allowScripts pin lags its lockfile (no model turn), hands the
  # PR to a person once the round cap is reached, or writes the context file the
  # model job reads and context.json, the run fields the verdict job reads.
  # Every gate and head the jobs after it take comes from here, and every
  # model-call input from a model call's scan job, never from its run job,
  # whose runner head code could forge.
  review-dependency-select:
    name: Review Dependency Select
    needs: dispatcher-current
    if: >-
      inputs.pr-number != '' && inputs.activity == 'review-dependency'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
      && needs.dispatcher-current.outputs.stale != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out main
      pull-requests: read # the PR, its commits and files
      checks: read # ci-status and the model check runs that count rounds
      issues: read # the round markers
    outputs:
      # true once the context is uploaded; false on a skip or an escalation;
      # empty when the job stopped before deciding.
      proceed: >-
        ${{ steps.upload.outcome == 'success' && 'true'
        || (steps.slot.outputs.applies == 'false' || steps.select.outputs.proceed == 'false') && 'false' || '' }}
      head-sha: ${{ steps.head.outputs.sha }}
      escalation-reason: ${{ steps.select.outputs.escalation-reason }}
      skip-reason: ${{ steps.slot.outputs.applies == 'false' && steps.slot.outputs.skip-reason || steps.select.outputs.skip-reason }}
      # dependency.json's, which the model call checks, and context.json's,
      # which the verdict job checks.
      context-sha256: ${{ steps.select.outputs.context-sha256 }}
      run-sha256: ${{ steps.select.outputs.run-sha256 }}
      # The artifact name's attempt, so a re-run of a later job alone still
      # finds it.
      context-attempt: ${{ steps.upload.outcome == 'success' && github.run_attempt || '' }}
      # The install-script pin patch the select step wrote with no model turn,
      # which apply-dependency-pin pushes: written once uploaded, else empty.
      pin-state: ${{ steps.upload-pin.outcome == 'success' && 'written' || '' }}
      pin-sha256: ${{ steps.upload-pin.outcome == 'success' && steps.select.outputs.pin-sha256 || '' }}
      pin-attempt: ${{ steps.upload-pin.outcome == 'success' && github.run_attempt || '' }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Read the PR head
        id: head
        if: steps.kill.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          # Each `gh api` call keeps its rate-limit reading for the job-end
          # api-budget notice (.github/actions/log-api-budget).
          # shellcheck source=/dev/null
          { . .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null && api_budget_wrap_gh github-token; } || true
          # shellcheck source=/dev/null
          . .base/.github/scripts/pr-unblock/read-pr-head.bash
          if ! [[ $PR_NUMBER =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::the pr-number input is not a PR number"
            exit 1
          fi
          read_pr_fields "$PR_NUMBER" '.head.sha, .head.repo.full_name' || exit 1
          { read -r sha && read -r head_repo; } <<<"$pr_fields" || true
          if ! [[ ${sha:-} =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the PR names no head SHA"
            exit 1
          fi
          if [[ ${head_repo:-} != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::the PR's head is not in this repository"
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # As the read runner resolves it: its applies-when decides on the head
      # just read, before the PR is classified.
      - name: Resolve the slot
        id: slot
        if: steps.head.outcome == 'success'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: review-dependency
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          pr-number: ${{ inputs.pr-number }}
          head-sha: ${{ steps.head.outputs.sha }}
          prepare-supported: "true"
          applied-by-supported: patch dependency-verdict

      - name: Select the dependency pull request
        id: select
        if: steps.slot.outputs.applies == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          DEPENDENCY_DIR: ${{ runner.temp }}/dependency-context
          TRUSTED_ACTORS: .base/.github/standards/trusted-actors/trusted-actors.json
          # The content rule's ecosystems and directories, read from the base.
          DEPENDABOT_CONFIG: .base/.github/dependabot.yml
          # The review-only dependencies, read from the base.
          DEPENDABOT_POLICY: .base/.github/standards/dependabot-policy/policy.json
          RESOLVED: ${{ runner.temp }}/resolved-config.json
          # Where a stale install-script pin's patch goes (install-script-pin.mjs).
          PIN_PATCH_FILE: ${{ runner.temp }}/dependency-pin/patch.diff
        run: |
          mkdir -p "$DEPENDENCY_DIR" "$(dirname "$PIN_PATCH_FILE")"
          DEPENDENCY_REVIEW_ROUNDS=$(jq -r '.loop["dependency-review-rounds"] // empty' "$RESOLVED")
          export DEPENDENCY_REVIEW_ROUNDS
          DEPENDENCY_FILE="$DEPENDENCY_DIR/dependency.json" CONTEXT_RUN_FILE="$DEPENDENCY_DIR/context.json" \
            node .base/.github/scripts/pr-unblock/review-dependency.mjs select
          if [ -f "$DEPENDENCY_DIR/dependency.json" ]; then
            sum=$(sha256sum <"$DEPENDENCY_DIR/dependency.json")
            echo "context-sha256=${sum%% *}" >>"$GITHUB_OUTPUT"
            sum=$(sha256sum <"$DEPENDENCY_DIR/context.json")
            echo "run-sha256=${sum%% *}" >>"$GITHUB_OUTPUT"
          fi

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          steps.select.outputs.proceed == 'true'
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: |
            ${{ runner.temp }}/dependency-context/dependency.json
            ${{ runner.temp }}/dependency-context/context.json

      - name: Upload the dependency context
        id: upload
        if: >-
          (steps.select.outputs.proceed == 'true') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-context-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dependency-context/dependency.json
            ${{ runner.temp }}/dependency-context/context.json
          retention-days: 1
          if-no-files-found: error

      - name: Scan the pin patch for credentials
        id: scan-pin
        if: steps.select.outputs.pin-state == 'written'
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/dependency-pin/patch.diff

      # Named as the push job's patch-activity reads it: no model job runs in
      # this round, so nothing else uploads that name.
      - name: Upload the pin patch
        id: upload-pin
        if: (steps.select.outputs.pin-state == 'written') && steps.scan-pin.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patch-pr-unblock-review-dependency-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-pin/patch.diff
          retention-days: 1
          if-no-files-found: error

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # A select that skipped, or handed the PR to a person, runs no model job,
  # so no review-dependency check would land on the head and
  # dependency-dispatch.mjs would dispatch it again on every run. This job
  # posts it neutral on the head the select job read; a kill-switch stop
  # reads none, and nothing is posted.
  review-dependency-not-run:
    name: Review Dependency Not Run
    needs: review-dependency-select
    if: >-
      ${{ !cancelled() && inputs.activity == 'review-dependency'
      && needs.review-dependency-select.outputs.proceed == 'false'
      && needs.review-dependency-select.outputs.head-sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Post the review-dependency check run
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: review-dependency
          run-result: skipped
          not-run-reason: ${{ needs.review-dependency-select.outputs.skip-reason || 'awaiting-human' }}
          head-sha: ${{ needs.review-dependency-select.outputs.head-sha }}
          can-commit: "false"
          base-path: .base
          head-sha-fallback: ${{ needs.review-dependency-select.outputs.head-sha }}
          github-token: ${{ github.token }}

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The model job: a read activity with no write token and no OIDC token in
  # the job that runs head code. The skill reviews the update and returns its
  # verdict as structured output; on a fix it leaves the fix uncommitted, and
  # the runner hands it on as a patch. Its upstream release notes are
  # untrusted text. It runs on the pr-unblock role's API key alone, in the
  # per-PR write queue.
  review-dependency:
    name: Review Dependency
    needs: review-dependency-select
    if: ${{ !cancelled() && needs.review-dependency-select.outputs.proceed == 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: review-dependency
      key-credit-job: review-dependency
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      dependency-context-attempt: ${{ needs.review-dependency-select.outputs.context-attempt }}
      dependency-context-sha256: ${{ needs.review-dependency-select.outputs.context-sha256 }}
      head-sha: ${{ needs.review-dependency-select.outputs.head-sha }}
      # The 50-minute launcher step and the CLI install.
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether review-dependency's report job posted its check, read from this run's
  # jobs as fix-ci-handoff reads fix-ci's, never from an review-dependency
  # output: the run job runs head code and can forge them. A failed read
  # leaves posted empty, which starts the fallback call.
  review-dependency-handoff:
    name: Review Dependency Handoff
    needs: [review-dependency-select, review-dependency]
    if: ${{ !cancelled() && needs.review-dependency-select.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      fallback-ready: ${{ steps.fallback.outputs.ready }}
      posted: ${{ steps.posted.outputs.posted }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether review-dependency posted its check
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: review-dependency
        run: bash .base/.github/scripts/lib/handoff-evidence.sh posted

      # Whether the third call can run, never the token. review-dependency-subscription passes it
      # on as fallback-ready, so with the token empty its subscription leg
      # stays the last; a failed read leaves it empty, which hands nothing on.
      - name: Check the fallback token
        id: fallback
        env:
          PRESENT: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: echo "ready=$PRESENT" >>"$GITHUB_OUTPUT"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The subscription fallback, as fix-ci-subscription is for fix-ci: it runs
  # only when review-dependency-handoff read no check posted, which a credit
  # stop or an empty key leaves, and holds the OAuth token alone.
  review-dependency-subscription:
    name: Review Dependency Subscription
    needs: [review-dependency-select, review-dependency, review-dependency-handoff]
    if: >-
      ${{ !cancelled() && needs.review-dependency-select.outputs.proceed == 'true'
      && needs.review-dependency-handoff.outputs.posted != 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: review-dependency
      fallback: handoff
      fallback-ready: ${{ needs.review-dependency-handoff.outputs.fallback-ready }}
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      dependency-context-attempt: ${{ needs.review-dependency-select.outputs.context-attempt }}
      dependency-context-sha256: ${{ needs.review-dependency-select.outputs.context-sha256 }}
      head-sha: ${{ needs.review-dependency-select.outputs.head-sha }}
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.PR_UNBLOCK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether review-dependency-subscription handed off to the fallback token, read from this run's
  # jobs by handoff-evidence.sh, never from a review-dependency-subscription output: its broker
  # allowed it, its run job succeeded and its scan job never ran. It runs
  # only when review-dependency-handoff found the fallback token set, so with the token empty
  # nothing starts that did not before. A failed read starts no third call.
  review-dependency-subscription-handoff:
    name: Review Dependency Subscription Handoff
    needs: [review-dependency-handoff, review-dependency-subscription]
    if: ${{ !cancelled() && needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-handoff.outputs.fallback-ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      handed-off: ${{ steps.handoff.outputs.handed-off }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether review-dependency-subscription handed off
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: review-dependency-subscription
        run: bash .base/.github/scripts/lib/handoff-evidence.sh handed-off

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The third call, on the central fallback subscription's token alone: it
  # runs only on review-dependency-subscription-handoff's read, after review-dependency-subscription's subscription leg handed off (a
  # limit stop, a credit stop, or a 401 or 402). It is the last leg and never
  # hands off.
  review-dependency-fallback:
    name: Review Dependency Fallback
    needs: [review-dependency-select, review-dependency, review-dependency-handoff, review-dependency-subscription, review-dependency-subscription-handoff]
    if: ${{ !cancelled() && needs.review-dependency-handoff.outputs.fallback-ready == 'true' && needs.review-dependency-subscription-handoff.outputs.handed-off == 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: review-dependency
      fallback: fallback
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      dependency-context-attempt: ${{ needs.review-dependency-select.outputs.context-attempt }}
      dependency-context-sha256: ${{ needs.review-dependency-select.outputs.context-sha256 }}
      head-sha: ${{ needs.review-dependency-select.outputs.head-sha }}
      timeout-minutes: 60
    secrets:
      fallback-claude-code-oauth-token: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # The push job: apply-patch.mjs under patch-rules.json's dependency-review
  # row, a script with no model that runs no head code. It admits only a
  # version change of npm or pip manifest and lock files outside .github/ in
  # a directory the base dependabot.yml lists, skips a head that moved since
  # the select job read it, and pushes one commit with [dependabot skip]
  # without force. It runs only on a written patch beside a scanned fix
  # verdict; a patch beside any other verdict is dropped. report-escalation
  # does not need it: a patch that does not land leaves no fix commit, and
  # the verdict job hands the PR to a person as dependency-fix-not-landed.
  apply-dependency-patch:
    name: Apply Dependency Patch
    needs: [review-dependency-select, review-dependency, review-dependency-subscription, review-dependency-fallback]
    # One leg answers the round: the fallback call when it ran, else the
    # first, and every model-call input below is that leg's scan job's, so
    # one leg's patch never pairs with the other's verdict and an empty
    # field never falls through.
    if: >-
      ${{ !cancelled()
      && (needs.review-dependency-fallback.result != 'skipped' && needs.review-dependency-fallback.outputs.scan-patch-state || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.scan-patch-state || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.scan-patch-state || '') == 'written'
      && (needs.review-dependency-fallback.result != 'skipped' && needs.review-dependency-fallback.outputs.dependency-verdict || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.dependency-verdict || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.dependency-verdict || '') == 'fix' }}
    permissions:
      actions: read # the write runner's run job reads the review lanes' comment records
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: apply-dependency-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      # The scan job's outputs alone, never a run job's, from the one leg.
      patch-state: ${{ needs.review-dependency-fallback.result != 'skipped' && needs.review-dependency-fallback.outputs.scan-patch-state || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.scan-patch-state || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.scan-patch-state || '' }}
      patch-sha256: ${{ needs.review-dependency-fallback.result != 'skipped' && needs.review-dependency-fallback.outputs.scan-patch-sha256 || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.scan-patch-sha256 || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.scan-patch-sha256 || '' }}
      patch-attempt: ${{ needs.review-dependency-fallback.result != 'skipped' && needs.review-dependency-fallback.outputs.scan-patch-attempt || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.scan-patch-attempt || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.scan-patch-attempt || '' }}
      patch-activity: review-dependency
      patch-prepare: dependency-review
      # The head the select job read, from a job that ran no head code.
      patch-head-sha: ${{ needs.review-dependency-select.outputs.head-sha }}
      # The scanned verdict the row's dependency-verdict requirement reads.
      patch-verdict-attempt: ${{ needs.review-dependency-fallback.result != 'skipped' && needs.review-dependency-fallback.outputs.dependency-attempt || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.dependency-attempt || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.dependency-attempt || '' }}
      patch-verdict-sha256: ${{ needs.review-dependency-fallback.result != 'skipped' && needs.review-dependency-fallback.outputs.dependency-sha256 || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.dependency-sha256 || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.dependency-sha256 || '' }}
      reply-attempt: ${{ needs.review-dependency-fallback.result != 'skipped' && needs.review-dependency-fallback.outputs.scan-reply-attempt || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.scan-reply-attempt || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.scan-reply-attempt || '' }}

  # The pin push job: apply-patch.mjs under patch-rules.json's
  # install-script-pin row, with apply-dependency-patch's grant, a script with
  # no model that runs no head code. It takes the select job's patch, made
  # from the head's package.json and package-lock.json read as data, admits
  # only the root package.json with the @anthropic-ai/claude-code allowScripts
  # pin moved to the exact version the manifest pins, skips a head that moved
  # since the select job read it, and pushes one commit with [dependabot
  # skip] without force. No round marker is posted and no round counted: the
  # new head goes through review-dependency like any other. A refused push
  # stops as dependency-pin-invalid, -not-applied or -protected-path, which
  # report-escalation and report-stop-status hand to the session queue.
  apply-dependency-pin:
    name: Apply Dependency Pin
    needs: review-dependency-select
    if: ${{ !cancelled() && needs.review-dependency-select.outputs.pin-state == 'written' }}
    permissions:
      actions: read # the write runner's run job reads the review lanes' comment records
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: apply-dependency-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      # The select job's own outputs: it ran no model and only base code.
      patch-state: written
      patch-sha256: ${{ needs.review-dependency-select.outputs.pin-sha256 }}
      patch-attempt: ${{ needs.review-dependency-select.outputs.pin-attempt }}
      patch-activity: review-dependency
      patch-prepare: install-script-pin
      patch-head-sha: ${{ needs.review-dependency-select.outputs.head-sha }}

  # The verdict job, a script with no model: it holds pull-requests and
  # issues write and acts on the verdict: the round marker, a close (never a
  # security update) with an ignore-entry issue, or an escalation. It runs
  # whenever the select job proceeded, whatever the model and push jobs did,
  # so every round is counted; a hostile model job cannot skip it. Neither
  # job merges.
  apply-dependency-verdict:
    name: Apply Dependency Verdict
    needs: [review-dependency-select, review-dependency, review-dependency-subscription, review-dependency-fallback, apply-dependency-patch]
    if: ${{ !cancelled() && needs.review-dependency-select.outputs.proceed == 'true' }}
    permissions:
      actions: read # the write runner's run job reads the review lanes' comment records
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: apply-dependency-verdict
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      dependency-verdict: true
      # context.json, its SHA-256 and the head, from the select job.
      dependency-context-attempt: ${{ needs.review-dependency-select.outputs.context-attempt }}
      dependency-run-sha256: ${{ needs.review-dependency-select.outputs.run-sha256 }}
      dependency-head-sha: ${{ needs.review-dependency-select.outputs.head-sha }}
      # The verdict, its SHA-256 and the patch state, all from the one leg
      # apply-dependency-patch reads; only the scan job, which ran no model
      # or head code, sets these outputs. The scan's refusal arrives as the
      # scan-refusal job's marker artifact, which the verdict job downloads. The verdict's
      # attempt names the model run in the round marker, so "Re-run failed
      # jobs" on this job alone still downloads it.
      dependency-run-attempt: ${{ needs.review-dependency-fallback.result != 'skipped' && needs.review-dependency-fallback.outputs.dependency-attempt || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.dependency-attempt || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.dependency-attempt || '' }}
      dependency-verdict-sha256: ${{ needs.review-dependency-fallback.result != 'skipped' && needs.review-dependency-fallback.outputs.dependency-sha256 || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.dependency-sha256 || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.dependency-sha256 || '' }}
      dependency-patch-state: ${{ needs.review-dependency-fallback.result != 'skipped' && needs.review-dependency-fallback.outputs.scan-patch-state || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result != 'skipped' && needs.review-dependency-subscription.outputs.scan-patch-state || needs.review-dependency-fallback.result == 'skipped' && needs.review-dependency-subscription.result == 'skipped' && needs.review-dependency.outputs.scan-patch-state || '' }}

  # fix-ci is four jobs, so no model ever holds a write token. This one runs
  # only base code with a read-only token and checks out no PR head: it hands
  # the PR to a person once loop.fix-ci-rounds fixes were pushed, or writes
  # the failing checks' names, workflows, annotations and log ends to the
  # context file the model job reads. Logs and annotations are data.
  fix-ci-context:
    name: Fix CI Context
    needs: dispatcher-current
    if: >-
      inputs.pr-number != '' && inputs.activity == 'fix-ci'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
      && needs.dispatcher-current.outputs.stale != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out main
      pull-requests: read # the PR's head and commits
      checks: read # the head's check runs and their annotations
      actions: read # each failing job's workflow file and log
      statuses: read # the head's pr-unblock/fix-ci weaken retry stop
    outputs:
      proceed: ${{ steps.context.outputs.proceed }}
      head-sha: ${{ steps.context.outputs.head-sha }}
      escalation-reason: ${{ steps.context.outputs.escalation-reason }}
      context-sha256: ${{ steps.context.outputs.context-sha256 }}
      # awaiting-human when the human-gated label holds fix-ci, lane-stopped
      # on the round cap, which fix-ci-not-run posts; lane-escalated when another lane's escalation
      # put the label on, so apply-patch pushes past it.
      skip-reason: ${{ steps.context.outputs.skip-reason }}
      lane-escalated: ${{ steps.context.outputs.lane-escalated }}
      # true when a whole, settled listing of the head's checks has none
      # failing, so report-stop-status clears a failing pr-unblock/fix-ci.
      stop-resolved: ${{ steps.context.outputs.stop-resolved }}
      # "1" for a same-head retry after the push job stopped there
      # (escalation-routes.mjs retryRung), else empty.
      model-rung: ${{ steps.context.outputs.model-rung }}
      # true on a head with no lane stop yet, so apply-patch gives a
      # weaken-required stop one fresh fixer round (ci-fix-weaken-retry).
      weaken-retry: ${{ steps.context.outputs.weaken-retry }}
      # The artifact name's attempt, so a re-run of the model job alone still
      # finds it.
      context-attempt: ${{ steps.upload.outcome == 'success' && github.run_attempt || '' }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
      npm_config_audit: "false"
      npm_config_fetch_timeout: "60000"
      npm_config_fund: "false"
      # npm's fetch timeout and retries, from the one file that sets them.
      npm_config_globalconfig: ${{ github.workspace }}/.base/.github/npm-fetch.npmrc
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # fix-ci-context.mjs reads loop.fix-ci-rounds through the base's
      # resolve-config, which needs its dependencies.
      - name: Install resolve-config's dependencies
        timeout-minutes: 5
        if: steps.kill.outputs.proceed == 'true'
        run: npm ci --ignore-scripts --omit=dev --prefix .base/.github/actions/resolve-config

      - name: Write the failing checks' context
        id: context
        if: steps.kill.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The review lanes' comment records (actions: read).
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          CONTEXT_FILE: ${{ runner.temp }}/ci-context/context.json
          BASE_PATH: .base
        run: |
          mkdir -p "$RUNNER_TEMP/ci-context"
          # The listed review bots' ids (review-threads.reviewer-ids), one per line.
          REVIEWER_IDS=$(yq '."review-threads"."reviewer-ids" // [] | .[]' .base/docs/conventions/pr-pipeline.yaml)
          export REVIEWER_IDS
          node .base/.github/scripts/pr-unblock/fix-ci-context.mjs

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          steps.context.outputs.proceed == 'true'
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/ci-context/context.json

      - name: Upload the context
        id: upload
        if: >-
          (steps.context.outputs.proceed == 'true') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-context-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-context/context.json
          retention-days: 1
          if-no-files-found: error

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # A fix-ci-context skip (a closed PR, a human-gated hold, or no failing
  # check) or stop (the round cap, lane-stopped) runs no fix-ci job,
  # so no fix-ci check would land on the head and fix-ci-dispatch.mjs would
  # dispatch it again on every run. This job posts fix-ci neutral on that head,
  # as publish-feedback-not-run does; a kill-switch stop leaves the head empty.
  fix-ci-not-run:
    name: Fix CI Not Run
    needs: fix-ci-context
    if: >-
      ${{ !cancelled() && inputs.activity == 'fix-ci'
      && needs.fix-ci-context.outputs.proceed == 'false'
      && needs.fix-ci-context.outputs.head-sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Post the check run
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: fix-ci
          run-result: skipped
          not-run-reason: ${{ needs.fix-ci-context.outputs.skip-reason || 'not-applicable' }}
          head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
          can-commit: "false"
          base-path: .base
          head-sha-fallback: ${{ needs.fix-ci-context.outputs.head-sha }}
          github-token: ${{ github.token }}

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The model job: a read activity with no write token and no OIDC token in
  # the job that runs head code. The skill reruns the failing checks, fixes
  # them and reruns them; the runner uploads its uncommitted edits as a patch.
  # It runs on the pr-unblock role's API key alone. The per-PR write queue
  # holds it, never the run's own group, pr-unblock-fix-ci-<pr>: a job group
  # with that name waits on its own run and never starts.
  fix-ci:
    name: Fix CI
    needs: fix-ci-context
    if: ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: fix-ci
      key-credit-job: fix-ci
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      model-rung: ${{ needs.fix-ci-context.outputs.model-rung }}
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      # Reproducing, fixing and rerunning several checks outlasts the default.
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether fix-ci's report job posted its check, read from this run's jobs
  # through the Actions API, never from a fix-ci output: fix-ci's run job runs
  # head code, so its handed-off, lane-class and credential-present outputs
  # are forgeable, while its report job runs on its own runner and posts the
  # check unless the call handed off. A failed read leaves posted empty,
  # which starts the fallback call: a second leg, never a lost check.
  fix-ci-handoff:
    name: Fix CI Handoff
    needs: [fix-ci-context, fix-ci]
    if: ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      fallback-ready: ${{ steps.fallback.outputs.ready }}
      posted: ${{ steps.posted.outputs.posted }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether fix-ci posted its check
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: fix-ci
        run: bash .base/.github/scripts/lib/handoff-evidence.sh posted

      # Whether the third call can run, never the token. fix-ci-subscription passes it
      # on as fallback-ready, so with the token empty its subscription leg
      # stays the last; a failed read leaves it empty, which hands nothing on.
      - name: Check the fallback token
        id: fallback
        env:
          PRESENT: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: echo "ready=$PRESENT" >>"$GITHUB_OUTPUT"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The subscription fallback, as a second call on new VMs: it runs only when
  # fix-ci posted no check, which a credit stop or an empty key leaves as a
  # handoff with no upload, lane record or check. Its start reads only
  # fix-ci-handoff, and it holds the OAuth token alone. fallback is handoff,
  # the one fact that read attests: the lane record says the key posted no
  # check, not why, since only the run job knows.
  fix-ci-subscription:
    name: Fix CI Subscription
    needs: [fix-ci-context, fix-ci, fix-ci-handoff]
    if: >-
      ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true'
      && needs.fix-ci-handoff.outputs.posted != 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: fix-ci
      fallback: handoff
      fallback-ready: ${{ needs.fix-ci-handoff.outputs.fallback-ready }}
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      model-rung: ${{ needs.fix-ci-context.outputs.model-rung }}
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.PR_UNBLOCK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether fix-ci-subscription handed off to the fallback token, read from this run's
  # jobs by handoff-evidence.sh, never from a fix-ci-subscription output: its broker
  # allowed it, its run job succeeded and its scan job never ran. It runs
  # only when fix-ci-handoff found the fallback token set, so with the token empty
  # nothing starts that did not before. A failed read starts no third call.
  fix-ci-subscription-handoff:
    name: Fix CI Subscription Handoff
    needs: [fix-ci-handoff, fix-ci-subscription]
    if: ${{ !cancelled() && needs.fix-ci-subscription.result != 'skipped' && needs.fix-ci-handoff.outputs.fallback-ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      handed-off: ${{ steps.handoff.outputs.handed-off }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether fix-ci-subscription handed off
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: fix-ci-subscription
        run: bash .base/.github/scripts/lib/handoff-evidence.sh handed-off

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The third call, on the central fallback subscription's token alone: it
  # runs only on fix-ci-subscription-handoff's read, after fix-ci-subscription's subscription leg handed off (a
  # limit stop, a credit stop, or a 401 or 402). It is the last leg and never
  # hands off.
  fix-ci-fallback:
    name: Fix CI Fallback
    needs: [fix-ci-context, fix-ci, fix-ci-handoff, fix-ci-subscription, fix-ci-subscription-handoff]
    if: ${{ !cancelled() && needs.fix-ci-handoff.outputs.fallback-ready == 'true' && needs.fix-ci-subscription-handoff.outputs.handed-off == 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: fix-ci
      fallback: fallback
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      model-rung: ${{ needs.fix-ci-context.outputs.model-rung }}
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      timeout-minutes: 60
    secrets:
      fallback-claude-code-oauth-token: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # The push job: apply-patch.mjs, a script with no model that runs no head
  # code. It checks the patch against the model job's SHA-256 and head,
  # applies it, refuses what patch-rules.json's ci-context row refuses, and
  # pushes one commit without force. An empty or refused patch, or a
  # collection the run's collector refused, hands the PR to a person (a
  # refused collection reaches select with no patch-state, which escalates
  # ci-fix-invalid); a pushed patch hands none, so the new head's CI decides.
  # One leg answers: the fallback call when it ran,
  # else the first, and every input is that leg's scan job's, never a run
  # job's; a call that handed off left none.
  apply-patch:
    name: Apply Patch
    needs: [fix-ci-context, fix-ci, fix-ci-subscription, fix-ci-fallback]
    if: >-
      ${{ !cancelled()
      && ((needs.fix-ci-fallback.result != 'skipped' && needs.fix-ci-fallback.outputs.scan-patch-state || needs.fix-ci-fallback.result == 'skipped' && needs.fix-ci-subscription.result != 'skipped' && needs.fix-ci-subscription.outputs.scan-patch-state || needs.fix-ci-fallback.result == 'skipped' && needs.fix-ci-subscription.result == 'skipped' && needs.fix-ci.outputs.scan-patch-state || '') == 'written'
      || (needs.fix-ci-fallback.result != 'skipped' && needs.fix-ci-fallback.outputs.scan-patch-state || needs.fix-ci-fallback.result == 'skipped' && needs.fix-ci-subscription.result != 'skipped' && needs.fix-ci-subscription.outputs.scan-patch-state || needs.fix-ci-fallback.result == 'skipped' && needs.fix-ci-subscription.result == 'skipped' && needs.fix-ci.outputs.scan-patch-state || '') == 'empty'
      || (needs.fix-ci-fallback.result != 'skipped' && needs.fix-ci-fallback.outputs.scan-collect-refused || needs.fix-ci-fallback.result == 'skipped' && needs.fix-ci-subscription.result != 'skipped' && needs.fix-ci-subscription.outputs.scan-collect-refused || needs.fix-ci-fallback.result == 'skipped' && needs.fix-ci-subscription.result == 'skipped' && needs.fix-ci.outputs.scan-collect-refused || '') == 'true') }}
    permissions:
      actions: read # the write runner's run job reads the review lanes' comment records
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: apply-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      patch-state: ${{ needs.fix-ci-fallback.result != 'skipped' && needs.fix-ci-fallback.outputs.scan-patch-state || needs.fix-ci-fallback.result == 'skipped' && needs.fix-ci-subscription.result != 'skipped' && needs.fix-ci-subscription.outputs.scan-patch-state || needs.fix-ci-fallback.result == 'skipped' && needs.fix-ci-subscription.result == 'skipped' && needs.fix-ci.outputs.scan-patch-state || '' }}
      patch-sha256: ${{ needs.fix-ci-fallback.result != 'skipped' && needs.fix-ci-fallback.outputs.scan-patch-sha256 || needs.fix-ci-fallback.result == 'skipped' && needs.fix-ci-subscription.result != 'skipped' && needs.fix-ci-subscription.outputs.scan-patch-sha256 || needs.fix-ci-fallback.result == 'skipped' && needs.fix-ci-subscription.result == 'skipped' && needs.fix-ci.outputs.scan-patch-sha256 || '' }}
      patch-attempt: ${{ needs.fix-ci-fallback.result != 'skipped' && needs.fix-ci-fallback.outputs.scan-patch-attempt || needs.fix-ci-fallback.result == 'skipped' && needs.fix-ci-subscription.result != 'skipped' && needs.fix-ci-subscription.outputs.scan-patch-attempt || needs.fix-ci-fallback.result == 'skipped' && needs.fix-ci-subscription.result == 'skipped' && needs.fix-ci.outputs.scan-patch-attempt || '' }}
      patch-activity: fix-ci
      patch-prepare: ci-context
      # A same-head retry's producer ran a rung up: no second in-run rung-up.
      patch-model-rung: ${{ needs.fix-ci-context.outputs.model-rung }}
      patch-weaken-retry: ${{ needs.fix-ci-context.outputs.weaken-retry }}
      # The head fix-ci-context gated, from a job that ran no head code; the
      # read runner's own head-sha output is the run job's, which head code
      # could forge. Both fix-ci calls refuse a context for another head, so a
      # patch was made on this one. apply-patch compares it with the head its
      # own trigger gate reads at apply time, and its push needs the branch
      # still at that head.
      patch-head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      # lane-escalation drops the human-gated label from the holds while the
      # write runner reads it again as another lane's escalation
      # (fix-ci-context.mjs).
      patch-human-gate: ${{ needs.fix-ci-context.outputs.lane-escalated == 'true' && 'lane-escalation' || '' }}
      reply-attempt: ${{ needs.fix-ci-fallback.result != 'skipped' && needs.fix-ci-fallback.outputs.scan-reply-attempt || needs.fix-ci-fallback.result == 'skipped' && needs.fix-ci-subscription.result != 'skipped' && needs.fix-ci-subscription.outputs.scan-reply-attempt || needs.fix-ci-fallback.result == 'skipped' && needs.fix-ci-subscription.result == 'skipped' && needs.fix-ci.outputs.scan-reply-attempt || '' }}

  # fix-ci's one retry one model rung up, in this same run: when apply-patch
  # skipped rung-up (the run changed nothing and escalated only unfixed or
  # not-reproducible checks), fix-ci runs again at model-rung 1 on the same
  # context and head, with its own subscription fallback and apply-patch.
  # Whatever the retry ends in reaches report-escalation, which hands the PR
  # to a person unless the retry's patch applied cleanly; nothing here runs
  # at rung 1 twice.
  fix-ci-rung-up:
    name: Fix CI Rung Up
    needs: [fix-ci-context, apply-patch]
    if: >-
      ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true'
      && needs.apply-patch.outputs.rung-up == 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: fix-ci
      key-credit-job: fix-ci-rung-up
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      model-rung: "1"
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # As fix-ci-handoff and fix-ci-subscription are for fix-ci.
  fix-ci-rung-up-handoff:
    name: Fix CI Rung Up Handoff
    needs: [fix-ci-context, fix-ci-rung-up]
    if: >-
      ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true'
      && needs.fix-ci-rung-up.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      fallback-ready: ${{ steps.fallback.outputs.ready }}
      posted: ${{ steps.posted.outputs.posted }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether fix-ci-rung-up posted its check
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: fix-ci-rung-up
        run: bash .base/.github/scripts/lib/handoff-evidence.sh posted

      # Whether the third call can run, never the token. fix-ci-rung-up-subscription passes it
      # on as fallback-ready, so with the token empty its subscription leg
      # stays the last; a failed read leaves it empty, which hands nothing on.
      - name: Check the fallback token
        id: fallback
        env:
          PRESENT: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: echo "ready=$PRESENT" >>"$GITHUB_OUTPUT"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  fix-ci-rung-up-subscription:
    name: Fix CI Rung Up Subscription
    needs: [fix-ci-context, fix-ci-rung-up, fix-ci-rung-up-handoff]
    if: >-
      ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true'
      && needs.fix-ci-rung-up.result != 'skipped'
      && needs.fix-ci-rung-up-handoff.outputs.posted != 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: fix-ci
      fallback: handoff
      fallback-ready: ${{ needs.fix-ci-rung-up-handoff.outputs.fallback-ready }}
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      model-rung: "1"
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.PR_UNBLOCK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether fix-ci-rung-up-subscription handed off to the fallback token, read from this run's
  # jobs by handoff-evidence.sh, never from a fix-ci-rung-up-subscription output: its broker
  # allowed it, its run job succeeded and its scan job never ran. It runs
  # only when fix-ci-rung-up-handoff found the fallback token set, so with the token empty
  # nothing starts that did not before. A failed read starts no third call.
  fix-ci-rung-up-subscription-handoff:
    name: Fix CI Rung Up Subscription Handoff
    needs: [fix-ci-rung-up-handoff, fix-ci-rung-up-subscription]
    if: ${{ !cancelled() && needs.fix-ci-rung-up-subscription.result != 'skipped' && needs.fix-ci-rung-up-handoff.outputs.fallback-ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      handed-off: ${{ steps.handoff.outputs.handed-off }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether fix-ci-rung-up-subscription handed off
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: fix-ci-rung-up-subscription
        run: bash .base/.github/scripts/lib/handoff-evidence.sh handed-off

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The third call, on the central fallback subscription's token alone: it
  # runs only on fix-ci-rung-up-subscription-handoff's read, after fix-ci-rung-up-subscription's subscription leg handed off (a
  # limit stop, a credit stop, or a 401 or 402). It is the last leg and never
  # hands off.
  fix-ci-rung-up-fallback:
    name: Fix CI Rung Up Fallback
    needs: [fix-ci-context, fix-ci-rung-up, fix-ci-rung-up-handoff, fix-ci-rung-up-subscription, fix-ci-rung-up-subscription-handoff]
    if: ${{ !cancelled() && needs.fix-ci-rung-up-handoff.outputs.fallback-ready == 'true' && needs.fix-ci-rung-up-subscription-handoff.outputs.handed-off == 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: fix-ci
      fallback: fallback
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      model-rung: "1"
      timeout-minutes: 60
    secrets:
      fallback-claude-code-oauth-token: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  apply-patch-rung-up:
    name: Apply Patch Rung Up
    needs: [fix-ci-context, fix-ci-rung-up, fix-ci-rung-up-subscription, fix-ci-rung-up-fallback]
    if: >-
      ${{ !cancelled()
      && ((needs.fix-ci-rung-up-fallback.result != 'skipped' && needs.fix-ci-rung-up-fallback.outputs.scan-patch-state || needs.fix-ci-rung-up-fallback.result == 'skipped' && needs.fix-ci-rung-up-subscription.result != 'skipped' && needs.fix-ci-rung-up-subscription.outputs.scan-patch-state || needs.fix-ci-rung-up-fallback.result == 'skipped' && needs.fix-ci-rung-up-subscription.result == 'skipped' && needs.fix-ci-rung-up.outputs.scan-patch-state || '') == 'written'
      || (needs.fix-ci-rung-up-fallback.result != 'skipped' && needs.fix-ci-rung-up-fallback.outputs.scan-patch-state || needs.fix-ci-rung-up-fallback.result == 'skipped' && needs.fix-ci-rung-up-subscription.result != 'skipped' && needs.fix-ci-rung-up-subscription.outputs.scan-patch-state || needs.fix-ci-rung-up-fallback.result == 'skipped' && needs.fix-ci-rung-up-subscription.result == 'skipped' && needs.fix-ci-rung-up.outputs.scan-patch-state || '') == 'empty'
      || (needs.fix-ci-rung-up-fallback.result != 'skipped' && needs.fix-ci-rung-up-fallback.outputs.scan-collect-refused || needs.fix-ci-rung-up-fallback.result == 'skipped' && needs.fix-ci-rung-up-subscription.result != 'skipped' && needs.fix-ci-rung-up-subscription.outputs.scan-collect-refused || needs.fix-ci-rung-up-fallback.result == 'skipped' && needs.fix-ci-rung-up-subscription.result == 'skipped' && needs.fix-ci-rung-up.outputs.scan-collect-refused || '') == 'true') }}
    permissions:
      actions: read # the write runner's run job reads the review lanes' comment records
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: apply-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      patch-state: ${{ needs.fix-ci-rung-up-fallback.result != 'skipped' && needs.fix-ci-rung-up-fallback.outputs.scan-patch-state || needs.fix-ci-rung-up-fallback.result == 'skipped' && needs.fix-ci-rung-up-subscription.result != 'skipped' && needs.fix-ci-rung-up-subscription.outputs.scan-patch-state || needs.fix-ci-rung-up-fallback.result == 'skipped' && needs.fix-ci-rung-up-subscription.result == 'skipped' && needs.fix-ci-rung-up.outputs.scan-patch-state || '' }}
      patch-sha256: ${{ needs.fix-ci-rung-up-fallback.result != 'skipped' && needs.fix-ci-rung-up-fallback.outputs.scan-patch-sha256 || needs.fix-ci-rung-up-fallback.result == 'skipped' && needs.fix-ci-rung-up-subscription.result != 'skipped' && needs.fix-ci-rung-up-subscription.outputs.scan-patch-sha256 || needs.fix-ci-rung-up-fallback.result == 'skipped' && needs.fix-ci-rung-up-subscription.result == 'skipped' && needs.fix-ci-rung-up.outputs.scan-patch-sha256 || '' }}
      patch-attempt: ${{ needs.fix-ci-rung-up-fallback.result != 'skipped' && needs.fix-ci-rung-up-fallback.outputs.scan-patch-attempt || needs.fix-ci-rung-up-fallback.result == 'skipped' && needs.fix-ci-rung-up-subscription.result != 'skipped' && needs.fix-ci-rung-up-subscription.outputs.scan-patch-attempt || needs.fix-ci-rung-up-fallback.result == 'skipped' && needs.fix-ci-rung-up-subscription.result == 'skipped' && needs.fix-ci-rung-up.outputs.scan-patch-attempt || '' }}
      patch-activity: fix-ci
      patch-prepare: ci-context
      patch-head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      patch-human-gate: ${{ needs.fix-ci-context.outputs.lane-escalated == 'true' && 'lane-escalation' || '' }}
      # At rung 1 an escalation goes to a person: there is no rung above.
      patch-model-rung: "1"
      # A weaken-required stop here still takes the head's fresh fixer round.
      patch-weaken-retry: ${{ needs.fix-ci-context.outputs.weaken-retry }}
      reply-attempt: ${{ needs.fix-ci-rung-up-fallback.result != 'skipped' && needs.fix-ci-rung-up-fallback.outputs.scan-reply-attempt || needs.fix-ci-rung-up-fallback.result == 'skipped' && needs.fix-ci-rung-up-subscription.result != 'skipped' && needs.fix-ci-rung-up-subscription.outputs.scan-reply-attempt || needs.fix-ci-rung-up-fallback.result == 'skipped' && needs.fix-ci-rung-up-subscription.result == 'skipped' && needs.fix-ci-rung-up.outputs.scan-reply-attempt || '' }}

  # A fix-ci round whose every call posted no check (a run that forged a
  # handoff, or a report job that failed) would leave nothing for
  # fix-ci-dispatch.mjs to count, so it would dispatch the head again with no
  # end. This job reads this run's jobs as fix-ci-handoff does and posts
  # fix-ci failure on the gated head, which counts toward fix-ci-restarts. As
  # the report job does, it posts nothing unless a call's broker-check job
  # allowed the lane: a kill switch, read there with its repository shadow,
  # or a broker refusal is no merge blocker and spends no restart.
  fix-ci-unreported:
    name: Fix CI Unreported
    needs: [fix-ci-context, fix-ci, fix-ci-subscription, fix-ci-fallback, fix-ci-rung-up, fix-ci-rung-up-subscription, fix-ci-rung-up-fallback]
    if: ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      checks: write
      contents: read
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read whether a fix-ci call posted its check
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: fix-ci fix-ci-subscription fix-ci-fallback fix-ci-rung-up fix-ci-rung-up-subscription fix-ci-rung-up-fallback
        run: bash .base/.github/scripts/lib/handoff-evidence.sh posted allowed

      - name: Post the check run
        if: steps.posted.outputs.posted == 'false' && steps.posted.outputs.allowed == 'true'
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: fix-ci
          # No verdict: posts failure, "The run left no verdict."
          run-result: failure
          head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
          can-commit: "false"
          base-path: .base
          head-sha-fallback: ${{ needs.fix-ci-context.outputs.head-sha }}
          github-token: ${{ github.token }}

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # A run that stopped on a reason escalation-routes.json routes `fail` ends
  # in a failing commit status on the head its activity gated, never a
  # person: pr-unblock/conflict for resolve-conflicts (GitHub starts no
  # pull_request workflow on a conflicted PR, so it also shows that head why
  # its CI is missing), pr-unblock/<activity> otherwise; a new head carries
  # none. It runs when report-escalation does, on the same reason, except
  # on a cancelled run, and report-escalation.sh status posts nothing for a
  # reason held for a person. It also runs after an attempt whose push, reply
  # or verdict job acted and ended with no stop: report-escalation.sh clear
  # then posts success over a failure an earlier stop left on the same head,
  # so a same-head retry that landed leaves nothing red. A job that succeeded
  # on a skip (the reply script's no-model-turn, a gate or head-recheck skip)
  # (a rung-up skip included) landed nothing and leaves the failure in place;
  # the address-feedback sweep counts a no-model-turn skip toward
  # SWEEP_HEAD_CAP (feedback-dispatch.mjs RELEASES). clear also runs when a
  # select job that succeeded finds the stop gone on its head (stop-resolved:
  # every thread resolved, or no check failing), since no push, reply or
  # verdict job runs then. This script job, with no
  # model, is the lane's only
  # statuses: write, on its own GITHUB_TOKEN: the lanes App token the
  # escalation comment uses carries no statuses permission. actions: read and
  # checks: read let status mode read this run's jobs and the reply job's
  # annotations: a feedback-publish-failed whose lane token a retry takes the
  # head on (refire-refused.mjs tokenRefusal) posts no status, and its
  # status-withheld output keeps report-escalation from posting the
  # lane-stopped comment for it.
  report-stop-status:
    name: Report Stop Status
    needs:
      - resolve-conflicts-select
      - apply-conflict-patch
      - conflict-scan-refusal
      - address-feedback-select
      - apply-feedback-patch
      - publish-feedback
      - review-dependency-select
      - apply-dependency-patch
      - apply-dependency-pin
      - apply-dependency-verdict
      - fix-ci-context
      - apply-patch
      - apply-patch-rung-up
      - sync-shared-copies-select
      - apply-shared-copies
    if: >-
      ${{ !cancelled()
      && (needs.resolve-conflicts-select.outputs.head-sha || needs.address-feedback-select.outputs.head-sha
      || needs.review-dependency-select.outputs.head-sha || needs.fix-ci-context.outputs.head-sha
      || needs.sync-shared-copies-select.outputs.head-sha || '') != ''
      && (needs.resolve-conflicts-select.outputs.escalation-reason != ''
      || needs.apply-conflict-patch.outputs.escalation-reason != ''
      || needs.conflict-scan-refusal.outputs.escalation-reason != ''
      || needs.address-feedback-select.outputs.escalation-reason != ''
      || needs.publish-feedback.outputs.escalation-reason != ''
      || needs.publish-feedback.result == 'failure'
      || needs.review-dependency-select.outputs.escalation-reason != ''
      || needs.apply-dependency-verdict.outputs.escalation-reason != ''
      || needs.apply-dependency-pin.outputs.escalation-reason != ''
      || needs.fix-ci-context.outputs.escalation-reason != ''
      || needs.apply-patch.outputs.escalation-reason != ''
      || needs.sync-shared-copies-select.outputs.escalation-reason != ''
      || needs.apply-shared-copies.outputs.escalation-reason != ''
      || needs.apply-patch.outputs.rung-up == 'true'
      && !(needs.apply-patch-rung-up.result == 'success'
      && needs.apply-patch-rung-up.outputs.escalation-reason == ''
      && needs.apply-patch-rung-up.outputs.patch-skip-reason == '')
      || needs.apply-conflict-patch.result == 'success' && needs.apply-conflict-patch.outputs.skip-reason == ''
      || needs.publish-feedback.result == 'success' && needs.publish-feedback.outputs.skip-reason == ''
      || needs.apply-dependency-verdict.result == 'success' && needs.apply-dependency-verdict.outputs.skip-reason == ''
      || needs.apply-dependency-pin.result == 'success' && needs.apply-dependency-pin.outputs.skip-reason == ''
      || needs.apply-patch.result == 'success' && needs.apply-patch.outputs.skip-reason == ''
      || needs.apply-patch-rung-up.result == 'success' && needs.apply-patch-rung-up.outputs.skip-reason == ''
      || needs.apply-shared-copies.result == 'success' && needs.apply-shared-copies.outputs.skip-reason == ''
      || needs.address-feedback-select.result == 'success' && needs.address-feedback-select.outputs.stop-resolved == 'true'
      || needs.fix-ci-context.result == 'success' && needs.fix-ci-context.outputs.stop-resolved == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs
      checks: read # the reply job's annotations
      contents: read
      statuses: write
    outputs:
      # `true` when status mode withheld the failing status for a refusal the
      # feedback sweep sends again (report-escalation.sh retried_refusal).
      status-withheld: ${{ steps.post.outputs.status-withheld }}
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      # report-escalation.sh's tokenRefusal read imports the base's modules.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # One activity runs per dispatch, so one select job's head is set; a
      # reason is a fixed enum value from a base script or this run's jobs,
      # which report-escalation.sh rejects unless the routing table lists it.
      # No reason: the attempt did not stop, and clear runs instead. A commit
      # the activity's push job pushed comes before its select head: the
      # reply and verdict jobs can stop after that push, and a status on the
      # head before it leaves the PR's head with no failing status.
      - name: Post the stop status
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: >-
            ${{ needs.apply-conflict-patch.outputs.pushed-commit || needs.resolve-conflicts-select.outputs.head-sha
            || needs.apply-feedback-patch.outputs.pushed-commit || needs.address-feedback-select.outputs.head-sha
            || needs.apply-dependency-patch.outputs.pushed-commit || needs.apply-dependency-pin.outputs.pushed-commit
            || needs.review-dependency-select.outputs.head-sha
            || needs.fix-ci-context.outputs.head-sha || needs.sync-shared-copies-select.outputs.head-sha }}
          ESCALATION_REASON: >-
            ${{ needs.resolve-conflicts-select.outputs.escalation-reason
            || needs.apply-conflict-patch.outputs.escalation-reason
            || needs.conflict-scan-refusal.outputs.escalation-reason
            || needs.address-feedback-select.outputs.escalation-reason
            || needs.publish-feedback.outputs.escalation-reason
            || needs.publish-feedback.result == 'failure' && 'feedback-publish-failed'
            || needs.review-dependency-select.outputs.escalation-reason
            || needs.apply-dependency-verdict.outputs.escalation-reason
            || needs.apply-dependency-pin.outputs.escalation-reason
            || needs.fix-ci-context.outputs.escalation-reason
            || needs.apply-patch.outputs.escalation-reason
            || needs.apply-patch-rung-up.outputs.escalation-reason
            || needs.apply-patch.outputs.rung-up == 'true'
            && !(needs.apply-patch-rung-up.result == 'success' && needs.apply-patch-rung-up.outputs.patch-skip-reason == '')
            && 'ci-fix-escalated'
            || needs.sync-shared-copies-select.outputs.escalation-reason
            || needs.apply-shared-copies.outputs.escalation-reason || '' }}
          ACTIVITY: ${{ inputs.activity }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .base/.github/scripts/pr-unblock/report-escalation.sh "$([ -n "$ESCALATION_REASON" ] && echo status || echo clear)"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  report-escalation:
    name: Report Escalation
    needs:
      - resolve-conflicts-select
      - apply-conflict-patch
      - conflict-scan-refusal
      - address-feedback-select
      - apply-feedback-patch
      - publish-feedback
      - review-dependency-select
      - apply-dependency-patch
      - apply-dependency-pin
      - apply-dependency-verdict
      - fix-ci-context
      - apply-patch
      - apply-patch-rung-up
      - sync-shared-copies-select
      - apply-shared-copies
      - report-stop-status
    # A reply job that failed with no reason (its lane token, a script error)
    # stops as feedback-publish-failed, derived here from its result. When
    # report-stop-status withheld that stop's status, because the feedback
    # sweep sends a workflow-modified refusal again, no comment posts either;
    # a skipped or failed report-stop-status leaves the output empty, so the
    # comment posts.
    # escalation-reason is set only by the write runner's own steps, the
    # base's reply, verdict and apply-patch scripts, and the base scripts of
    # resolve-conflicts-select, conflict-scan-refusal, address-feedback-select,
    # review-dependency-select, fix-ci-context and sync-shared-copies-select.
    # At most one escalates: one activity runs per dispatch, a reply, verdict
    # or push job runs only after a select job proceeded, and a select job,
    # or fix-ci-context, escalates only before any model turn. A rung-up stop
    # escalates here too unless apply-patch-rung-up applied the retry's patch
    # cleanly: its own reason, else ci-fix-escalated. On a cancelled run this
    # always() branch fires, but the write workflow's run job skips, so no
    # label is applied and ci-status stays red.
    if: >-
      ${{ (!cancelled() && needs.report-stop-status.outputs.status-withheld != 'true'
      && (needs.resolve-conflicts-select.outputs.escalation-reason != ''
      || needs.apply-conflict-patch.outputs.escalation-reason != ''
      || needs.conflict-scan-refusal.outputs.escalation-reason != ''
      || needs.address-feedback-select.outputs.escalation-reason != ''
      || needs.publish-feedback.outputs.escalation-reason != ''
      || needs.publish-feedback.result == 'failure'
      || needs.review-dependency-select.outputs.escalation-reason != ''
      || needs.apply-dependency-verdict.outputs.escalation-reason != ''
      || needs.apply-dependency-pin.outputs.escalation-reason != ''
      || needs.fix-ci-context.outputs.escalation-reason != ''
      || needs.apply-patch.outputs.escalation-reason != ''
      || needs.sync-shared-copies-select.outputs.escalation-reason != ''
      || needs.apply-shared-copies.outputs.escalation-reason != ''))
      || (always() && needs.apply-patch.outputs.rung-up == 'true'
      && !(needs.apply-patch-rung-up.result == 'success'
      && needs.apply-patch-rung-up.outputs.escalation-reason == ''
      && needs.apply-patch-rung-up.outputs.patch-skip-reason == '')) }}
    permissions:
      actions: read # the write runner's run job reads the review lanes' comment records
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-unblock
      activity: report-escalation
      pr-number: ${{ inputs.pr-number }}
      escalation-reason: >-
        ${{ needs.resolve-conflicts-select.outputs.escalation-reason
        || needs.apply-conflict-patch.outputs.escalation-reason
        || needs.conflict-scan-refusal.outputs.escalation-reason
        || needs.address-feedback-select.outputs.escalation-reason
        || needs.publish-feedback.outputs.escalation-reason
        || needs.publish-feedback.result == 'failure' && 'feedback-publish-failed'
        || needs.review-dependency-select.outputs.escalation-reason
        || needs.apply-dependency-verdict.outputs.escalation-reason
        || needs.apply-dependency-pin.outputs.escalation-reason
        || needs.fix-ci-context.outputs.escalation-reason
        || needs.apply-patch.outputs.escalation-reason
        || needs.apply-patch-rung-up.outputs.escalation-reason
        || needs.apply-patch.outputs.rung-up == 'true' && 'ci-fix-escalated'
        || needs.sync-shared-copies-select.outputs.escalation-reason
        || needs.apply-shared-copies.outputs.escalation-reason || '' }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      expected-upstream-head: >-
        ${{ inputs.activity == 'address-feedback' && inputs.dispatcher-run-id != ''
        && needs.address-feedback-select.outputs.head-sha || '' }}
      # The push job's commit alone, never its escalation: as for the reply
      # job, the gate accepts that one commit after the select job's head.
      pushed-commit: >-
        ${{ inputs.activity == 'address-feedback' && inputs.dispatcher-run-id != ''
        && needs.apply-feedback-patch.outputs.pushed-commit || '' }}
      trusted-base: default-tip

  # The key's credit-stop markers, read by the read runner's broker-check in
  # later runs (each first call's key-credit-job). Each comes from a jobs-API
  # read of the call's run job (handoff-evidence.sh credit-stop), never from a
  # call's output. No job needs this one, so the read, which waits for the
  # jobs listing's steps, delays no handoff.
  key-credit-markers:
    name: Key Credit Markers
    needs: [resolve-conflicts, address-feedback, review-dependency, fix-ci, fix-ci-rung-up]
    if: ${{ !cancelled() && (needs.resolve-conflicts.result != 'skipped' || needs.address-feedback.result != 'skipped' || needs.review-dependency.result != 'skipped' || needs.fix-ci.result != 'skipped' || needs.fix-ci-rung-up.result != 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether resolve-conflicts's key hit a credit stop
        id: credit-stop-resolve-conflicts
        if: needs.resolve-conflicts.result != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: resolve-conflicts
          HANDOFF_EVIDENCE_LAG: notice
        run: bash .base/.github/scripts/lib/handoff-evidence.sh credit-stop

      - name: Write resolve-conflicts's credit-stop marker
        id: credit-marker-resolve-conflicts
        if: steps.credit-stop-resolve-conflicts.outputs.credit-stop == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/key-credit-stop-resolve-conflicts"
          echo "$GITHUB_RUN_ID" >"$RUNNER_TEMP/key-credit-stop-resolve-conflicts/run-id"

      - name: Upload resolve-conflicts's credit-stop marker
        if: steps.credit-marker-resolve-conflicts.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: key-credit-stop-pr-unblock.yml-resolve-conflicts
          path: ${{ runner.temp }}/key-credit-stop-resolve-conflicts/run-id
          if-no-files-found: error
          retention-days: 1

      - name: Read whether address-feedback's key hit a credit stop
        id: credit-stop-address-feedback
        if: needs.address-feedback.result != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: address-feedback
          HANDOFF_EVIDENCE_LAG: notice
        run: bash .base/.github/scripts/lib/handoff-evidence.sh credit-stop

      - name: Write address-feedback's credit-stop marker
        id: credit-marker-address-feedback
        if: steps.credit-stop-address-feedback.outputs.credit-stop == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/key-credit-stop-address-feedback"
          echo "$GITHUB_RUN_ID" >"$RUNNER_TEMP/key-credit-stop-address-feedback/run-id"

      - name: Upload address-feedback's credit-stop marker
        if: steps.credit-marker-address-feedback.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: key-credit-stop-pr-unblock.yml-address-feedback
          path: ${{ runner.temp }}/key-credit-stop-address-feedback/run-id
          if-no-files-found: error
          retention-days: 1

      - name: Read whether review-dependency's key hit a credit stop
        id: credit-stop-review-dependency
        if: needs.review-dependency.result != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: review-dependency
          HANDOFF_EVIDENCE_LAG: notice
        run: bash .base/.github/scripts/lib/handoff-evidence.sh credit-stop

      - name: Write review-dependency's credit-stop marker
        id: credit-marker-review-dependency
        if: steps.credit-stop-review-dependency.outputs.credit-stop == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/key-credit-stop-review-dependency"
          echo "$GITHUB_RUN_ID" >"$RUNNER_TEMP/key-credit-stop-review-dependency/run-id"

      - name: Upload review-dependency's credit-stop marker
        if: steps.credit-marker-review-dependency.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: key-credit-stop-pr-unblock.yml-review-dependency
          path: ${{ runner.temp }}/key-credit-stop-review-dependency/run-id
          if-no-files-found: error
          retention-days: 1

      - name: Read whether fix-ci's key hit a credit stop
        id: credit-stop-fix-ci
        if: needs.fix-ci.result != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: fix-ci
          HANDOFF_EVIDENCE_LAG: notice
        run: bash .base/.github/scripts/lib/handoff-evidence.sh credit-stop

      - name: Write fix-ci's credit-stop marker
        id: credit-marker-fix-ci
        if: steps.credit-stop-fix-ci.outputs.credit-stop == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/key-credit-stop-fix-ci"
          echo "$GITHUB_RUN_ID" >"$RUNNER_TEMP/key-credit-stop-fix-ci/run-id"

      - name: Upload fix-ci's credit-stop marker
        if: steps.credit-marker-fix-ci.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: key-credit-stop-pr-unblock.yml-fix-ci
          path: ${{ runner.temp }}/key-credit-stop-fix-ci/run-id
          if-no-files-found: error
          retention-days: 1

      - name: Read whether fix-ci-rung-up's key hit a credit stop
        id: credit-stop-fix-ci-rung-up
        if: needs.fix-ci-rung-up.result != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: fix-ci-rung-up
          HANDOFF_EVIDENCE_LAG: notice
        run: bash .base/.github/scripts/lib/handoff-evidence.sh credit-stop

      - name: Write fix-ci-rung-up's credit-stop marker
        id: credit-marker-fix-ci-rung-up
        if: steps.credit-stop-fix-ci-rung-up.outputs.credit-stop == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/key-credit-stop-fix-ci-rung-up"
          echo "$GITHUB_RUN_ID" >"$RUNNER_TEMP/key-credit-stop-fix-ci-rung-up/run-id"

      - name: Upload fix-ci-rung-up's credit-stop marker
        if: steps.credit-marker-fix-ci-rung-up.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: key-credit-stop-pr-unblock.yml-fix-ci-rung-up
          path: ${{ runner.temp }}/key-credit-stop-fix-ci-rung-up/run-id
          if-no-files-found: error
          retention-days: 1

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token
