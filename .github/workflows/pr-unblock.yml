        if: (steps.credit-marker-resolve-conflicts.outcome == 'success') && steps.credit-marker-scan-resolve-conflicts.outputs.clean == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: key-credit-stop-PR_UNBLOCK_CLAUDE_API_KEY
          overwrite: true
          path: ${{ runner.temp }}/key-credit-stop-resolve-conflicts/run-id
