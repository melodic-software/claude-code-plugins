name: pr-unblock

# Lane caller for pr-unblock: its file stem is the lane, so the lanes token
# broker accepts its write activities. No App key; each run job's OIDC token is
# exchanged at LANES_BROKER_URL for audience LANES_BROKER_AUDIENCE.
# Job contract: docs/conventions/pr-pipeline/pr-run-activity.md.
#
# workflow_dispatch only. resolve-conflicts: GitHub runs no pull_request
# workflow on a conflicting PR, so pr-unblock-dispatch.yml sends one dispatch
# per conflicting PR after a push to the default branch. address-feedback:
# pr-feedback-dispatch.yml sends one after a review lane finishes on a lanes App
# PR with unresolved reviewer-bot threads. review-dependency:
# pr-unblock-dispatch.yml also sends one per review-tier Dependabot PR (a major
# bump, an action publisher outside the allowlist, a group holding a major, or
# a red ci-status) whose head has no review yet. fix-ci: pr-unblock-dispatch.yml
# also sends one per lanes App PR whose ci-status failed. fix-docs:
# pr-unblock-dispatch.yml also sends one per ready PR a person opened that
# changes a Markdown file and never had a fix-docs run. All set
# dispatcher-run-id; a trusted human may dispatch with pr-number and activity
# alone. Every job
# trusts the default branch tip, since a conflicting PR's base SHA is stale and
# the dispatchers run from the tip.

# feedback-dispatch.mjs and dispatch.mjs read this title to skip a second
# dispatch while one for the same activity and PR is still queued or going.
# Quoted: unquoted, " #" would start a YAML comment and drop the PR number.
run-name: "pr-unblock ${{ inputs.activity }} #${{ inputs.pr-number }}"

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: The PR to unblock.
        required: true
        type: string
      activity:
        description: What to unblock.
        required: false
        type: choice
        options: [resolve-conflicts, address-feedback, review-dependency, fix-ci, fix-docs]
        default: resolve-conflicts
      dispatcher-run-id:
        description: The dispatcher run that sent this dispatch; empty for a human dispatch.
        required: false
        type: string
        default: ""

permissions: {}

# A newer dispatch of the same activity for the same PR replaces one still
# waiting; a running one finishes.
concurrency:
  group: pr-unblock-${{ inputs.activity }}-${{ inputs.pr-number }}
  cancel-in-progress: false

jobs:
  resolve-conflicts:
    # The per-PR write queue sits on the job behind this if:, so a run that
    # does nothing, or a dispatch the lanes App sent, never waits in it.
    if: >-
      inputs.pr-number != '' && inputs.activity == 'resolve-conflicts'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    # One per-PR queue shared by every write lane: it queues, never cancels.
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-unblock
      activity: resolve-conflicts
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
    secrets:
      claude-code-oauth-token: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN }}

  address-feedback:
    if: >-
      inputs.pr-number != '' && inputs.activity == 'address-feedback'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-unblock
      activity: address-feedback
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
    secrets:
      claude-code-oauth-token: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN }}

  # address-feedback's model job holds contents: write and posts nothing; this
  # script job, with no model, holds pull-requests: write and posts the replies
  # that job recorded, exactly as written or not at all, then the round marker.
  # It runs whenever the model job's skill ran, even when that job failed, so
  # every round is counted.
  publish-feedback:
    needs: address-feedback
    if: ${{ !cancelled() && needs.address-feedback.outputs.feedback-round == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-unblock
      activity: publish-feedback
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      review-replies: true
      review-run-sha256: ${{ needs.address-feedback.outputs.feedback-run-sha256 }}
      # The model job's attempt names the replies artifact, so "Re-run failed
      # jobs" on this job alone still downloads it.
      review-run-attempt: ${{ needs.address-feedback.outputs.feedback-run-attempt }}
      # The model job's push moved the PR head off the reviewed one; the gate
      # and the broker accept the review of the head that job gated when only
      # commits GitHub signed for the lanes App during this run follow it. A human dispatch has no
      # dispatcher and passes none.
      expected-upstream-head: >-
        ${{ inputs.dispatcher-run-id != '' && needs.address-feedback.outputs.head-sha || '' }}

  # A skipped publish-feedback posts no check, so a red one from an earlier
  # run would stay on the head. When address-feedback ran no feedback round,
  # this job posts publish-feedback neutral on the head that job gated; a gate
  # stop leaves that head empty, and nothing is posted.
  publish-feedback-not-run:
    needs: address-feedback
    if: >-
      ${{ !cancelled() && inputs.activity == 'address-feedback'
      && needs.address-feedback.outputs.feedback-round != 'true'
      && needs.address-feedback.outputs.head-sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Post the check run
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: publish-feedback
          run-result: skipped
          not-run-reason: not-applicable
          head-sha: ${{ needs.address-feedback.outputs.head-sha }}
          can-commit: "false"
          base-path: .base
          head-sha-fallback: ${{ needs.address-feedback.outputs.head-sha }}
          github-token: ${{ github.token }}

  # review-dependency's model job holds contents: write, posts nothing, and
  # returns its verdict as structured output that the runner uploads; it
  # pushes a fix only to npm or pip manifest and lock files outside .github/,
  # with [dependabot skip]. Its upstream
  # release notes are untrusted text, so it holds no pull-requests or issues
  # write. The verdict job, with no model, holds those and acts on the
  # verdict: the round marker, a close (never a security update) with an
  # ignore-entry issue, or an escalation. Neither job merges.
  review-dependency:
    if: >-
      inputs.pr-number != '' && inputs.activity == 'review-dependency'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-unblock
      activity: review-dependency
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
    secrets:
      claude-code-oauth-token: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN }}

  apply-dependency-verdict:
    needs: review-dependency
    if: ${{ !cancelled() && needs.review-dependency.outputs.dependency-round == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-unblock
      activity: apply-dependency-verdict
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      dependency-verdict: true
      dependency-run-sha256: ${{ needs.review-dependency.outputs.dependency-run-sha256 }}
      dependency-head-sha: ${{ needs.review-dependency.outputs.head-sha }}
      # The model job's attempt names the verdict artifact, so "Re-run failed
      # jobs" on this job alone still downloads it.
      dependency-run-attempt: ${{ needs.review-dependency.outputs.dependency-run-attempt }}

  # fix-ci is four jobs, so no model ever holds a write token. This one runs
  # only base code with a read-only token and checks out no PR head: it hands
  # the PR to a person once loop.fix-ci-rounds fixes were pushed, or writes
  # the failing checks' names, workflows, annotations and log ends to the
  # context file the model job reads. Logs and annotations are data.
  fix-ci-context:
    if: >-
      inputs.pr-number != '' && inputs.activity == 'fix-ci'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out main
      pull-requests: read # the PR's head and commits
      checks: read # the head's check runs and their annotations
      actions: read # each failing job's workflow file and log
    outputs:
      proceed: ${{ steps.context.outputs.proceed }}
      head-sha: ${{ steps.context.outputs.head-sha }}
      escalation-reason: ${{ steps.context.outputs.escalation-reason }}
      context-sha256: ${{ steps.context.outputs.context-sha256 }}
      # The artifact name's attempt, so a re-run of the model job alone still
      # finds it.
      context-attempt: ${{ steps.upload.outcome == 'success' && github.run_attempt || '' }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # fix-ci-context.mjs reads loop.fix-ci-rounds through the base's
      # resolve-config, which needs its dependencies.
      - name: Install resolve-config's dependencies
        if: steps.kill.outputs.proceed == 'true'
        run: npm ci --ignore-scripts --omit=dev --prefix .base/.github/actions/resolve-config

      - name: Write the failing checks' context
        id: context
        if: steps.kill.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          CONTEXT_FILE: ${{ runner.temp }}/ci-context/context.json
          BASE_PATH: .base
        run: |
          mkdir -p "$RUNNER_TEMP/ci-context"
          node .base/.github/scripts/pr-unblock/fix-ci-context.mjs

      - name: Upload the context
        id: upload
        if: steps.context.outputs.proceed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-context-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-context/context.json
          retention-days: 1
          if-no-files-found: error

  # A fix-ci-context skip (a closed PR or no failing check) runs no fix-ci job,
  # so no fix-ci check would land on the head and fix-ci-dispatch.mjs would
  # dispatch it again on every run. This job posts fix-ci neutral on that head,
  # as publish-feedback-not-run does; a kill-switch stop leaves the head empty.
  fix-ci-not-run:
    needs: fix-ci-context
    if: >-
      ${{ !cancelled() && inputs.activity == 'fix-ci'
      && needs.fix-ci-context.outputs.proceed == 'false'
      && needs.fix-ci-context.outputs.escalation-reason == ''
      && needs.fix-ci-context.outputs.head-sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Post the check run
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: pr-unblock
          activity: fix-ci
          run-result: skipped
          not-run-reason: not-applicable
          head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
          can-commit: "false"
          base-path: .base
          head-sha-fallback: ${{ needs.fix-ci-context.outputs.head-sha }}
          github-token: ${{ github.token }}

  # The model job: a read activity with no write token and no OIDC token in
  # the job that runs head code. The skill reruns the failing checks, fixes
  # them and reruns them; the runner uploads its uncommitted edits as a patch.
  # It runs on the automations role's API key alone. The per-PR write queue
  # holds it, never the run's own group, pr-unblock-fix-ci-<pr>: a job group
  # with that name waits on its own run and never starts.
  fix-ci:
    needs: fix-ci-context
    if: ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-unblock
      activity: fix-ci
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      # Reproducing, fixing and rerunning several checks outlasts the default.
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ secrets.AUTOMATIONS_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # The subscription fallback, as a second call on new VMs: it runs only when
  # fix-ci's key leg hit a credit stop or its key is empty, which fix-ci then
  # reports as a handoff with no upload, lane record or check. It reads only
  # those two outputs, each compared to a fixed string, and holds the OAuth
  # token alone; fallback picks between two literals.
  fix-ci-subscription:
    needs: [fix-ci-context, fix-ci]
    if: >-
      ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true'
      && (needs.fix-ci.outputs.lane-class == 'credit-stop'
      || needs.fix-ci.outputs.credential-present == 'false') }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-unblock
      activity: fix-ci
      fallback: ${{ needs.fix-ci.outputs.lane-class == 'credit-stop' && 'credit-stop' || 'no-key' }}
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # The push job: apply-patch.mjs, a script with no model that runs no head
  # code. It checks the patch against the model job's SHA-256 and head,
  # applies it, refuses what patch-rules.json's ci-context row refuses, and
  # pushes one commit without force. An empty or refused patch, or an
  # escalated check, hands the PR to a person. The patch comes from whichever
  # call ran the activity; a call that handed off left none.
  apply-patch:
    needs: [fix-ci-context, fix-ci, fix-ci-subscription]
    if: >-
      ${{ !cancelled() && ((needs.fix-ci-subscription.outputs.patch-state || needs.fix-ci.outputs.patch-state) == 'written'
      || (needs.fix-ci-subscription.outputs.patch-state || needs.fix-ci.outputs.patch-state) == 'empty') }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-unblock
      activity: apply-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      patch-state: ${{ needs.fix-ci-subscription.outputs.patch-state || needs.fix-ci.outputs.patch-state }}
      patch-sha256: ${{ needs.fix-ci-subscription.outputs.patch-sha256 || needs.fix-ci.outputs.patch-sha256 }}
      patch-attempt: ${{ needs.fix-ci-subscription.outputs.patch-attempt || needs.fix-ci.outputs.patch-attempt }}
      patch-activity: fix-ci
      patch-prepare: ci-context
      # The head fix-ci-context gated, from a job that ran no head code; the
      # read runner's own head-sha output is the run job's, which head code
      # could forge. Both fix-ci calls refuse a context for another head, so a
      # patch was made on this one. apply-patch compares it with the head its
      # own trigger gate reads at apply time, and its push needs the branch
      # still at that head.
      patch-head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      reply-attempt: ${{ needs.fix-ci-subscription.outputs.reply-attempt || needs.fix-ci.outputs.reply-attempt }}

  # fix-ci's one retry one model rung up, in this same run: when apply-patch
  # skipped rung-up (the run changed nothing and escalated only unfixed or
  # not-reproducible checks), fix-ci runs again at model-rung 1 on the same
  # context and head, with its own subscription fallback and apply-patch.
  # Whatever the retry ends in reaches report-escalation, which hands the PR
  # to a person unless the retry's patch applied cleanly; nothing here runs
  # at rung 1 twice.
  fix-ci-rung-up:
    needs: [fix-ci-context, apply-patch]
    if: >-
      ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true'
      && needs.apply-patch.outputs.rung-up == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-unblock
      activity: fix-ci
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      model-rung: "1"
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ secrets.AUTOMATIONS_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  fix-ci-rung-up-subscription:
    needs: [fix-ci-context, fix-ci-rung-up]
    if: >-
      ${{ !cancelled() && needs.fix-ci-context.outputs.proceed == 'true'
      && (needs.fix-ci-rung-up.outputs.lane-class == 'credit-stop'
      || needs.fix-ci-rung-up.outputs.credential-present == 'false') }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-unblock
      activity: fix-ci
      fallback: ${{ needs.fix-ci-rung-up.outputs.lane-class == 'credit-stop' && 'credit-stop' || 'no-key' }}
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      ci-context-attempt: ${{ needs.fix-ci-context.outputs.context-attempt }}
      ci-context-sha256: ${{ needs.fix-ci-context.outputs.context-sha256 }}
      head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      model-rung: "1"
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  apply-patch-rung-up:
    needs: [fix-ci-context, fix-ci-rung-up, fix-ci-rung-up-subscription]
    if: >-
      ${{ !cancelled() && ((needs.fix-ci-rung-up-subscription.outputs.patch-state || needs.fix-ci-rung-up.outputs.patch-state) == 'written'
      || (needs.fix-ci-rung-up-subscription.outputs.patch-state || needs.fix-ci-rung-up.outputs.patch-state) == 'empty') }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-unblock
      activity: apply-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      patch-state: ${{ needs.fix-ci-rung-up-subscription.outputs.patch-state || needs.fix-ci-rung-up.outputs.patch-state }}
      patch-sha256: ${{ needs.fix-ci-rung-up-subscription.outputs.patch-sha256 || needs.fix-ci-rung-up.outputs.patch-sha256 }}
      patch-attempt: ${{ needs.fix-ci-rung-up-subscription.outputs.patch-attempt || needs.fix-ci-rung-up.outputs.patch-attempt }}
      patch-activity: fix-ci
      patch-prepare: ci-context
      patch-head-sha: ${{ needs.fix-ci-context.outputs.head-sha }}
      # At rung 1 an escalation goes to a person: there is no rung above.
      patch-model-rung: "1"
      reply-attempt: ${{ needs.fix-ci-rung-up-subscription.outputs.reply-attempt || needs.fix-ci-rung-up.outputs.reply-attempt }}

  # The PR head fix-docs's report posts its check on, read by a job that runs
  # no head code, as fix-ci-context's is for fix-ci. Without it the report
  # trusts only the head read at report time, so a push mid-run posts failure
  # on the new head.
  fix-docs-head:
    if: >-
      inputs.pr-number != '' && inputs.activity == 'fix-docs'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      head-sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Read the PR's head SHA
        id: head
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $PR_NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr-number is not a PR number"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no PR head SHA read"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  # fix-docs is four jobs, so no model ever holds a write token. The model
  # job: a read activity with no write token and no OIDC token in the job that
  # runs head code. The skill fixes the changed Markdown files; the runner
  # uploads its uncommitted edits as a patch. It runs on the automations
  # role's API key alone. Drafts and held PRs skip in the config's
  # applies-when, before any model turn.
  fix-docs:
    needs: fix-docs-head
    if: >-
      inputs.pr-number != '' && inputs.activity == 'fix-docs'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-unblock
      activity: fix-docs
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      head-sha: ${{ needs.fix-docs-head.outputs.head-sha }}
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ secrets.AUTOMATIONS_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # The subscription fallback, as fix-ci-subscription is for fix-ci: it runs
  # only when fix-docs's key leg hit a credit stop or its key is empty, reads
  # only those two outputs, each compared to a fixed string, and holds the
  # OAuth token alone.
  fix-docs-subscription:
    needs: [fix-docs-head, fix-docs]
    if: >-
      ${{ !cancelled() && (needs.fix-docs.outputs.lane-class == 'credit-stop'
      || needs.fix-docs.outputs.credential-present == 'false') }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-unblock
      activity: fix-docs
      fallback: ${{ needs.fix-docs.outputs.lane-class == 'credit-stop' && 'credit-stop' || 'no-key' }}
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      head-sha: ${{ needs.fix-docs-head.outputs.head-sha }}
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # fix-docs's push job: the apply-patch activity under patch-rules.json's
  # default row (fix-docs has no prepare mode). It runs only on a written
  # patch: no change is the common case and needs no one. report-escalation
  # does not need it, so a refused patch posts the pr-unblock / apply-patch
  # check neutral and labels nothing. The patch and its head come from
  # whichever call ran the activity; apply-patch still applies onto the head
  # its own gate reads.
  apply-docs-patch:
    needs: [fix-docs, fix-docs-subscription]
    if: >-
      ${{ !cancelled() && (needs.fix-docs-subscription.outputs.patch-state || needs.fix-docs.outputs.patch-state) == 'written' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-unblock
      activity: apply-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      patch-state: ${{ needs.fix-docs-subscription.outputs.patch-state || needs.fix-docs.outputs.patch-state }}
      patch-sha256: ${{ needs.fix-docs-subscription.outputs.patch-sha256 || needs.fix-docs.outputs.patch-sha256 }}
      patch-attempt: ${{ needs.fix-docs-subscription.outputs.patch-attempt || needs.fix-docs.outputs.patch-attempt }}
      patch-activity: fix-docs
      patch-head-sha: ${{ needs.fix-docs-subscription.outputs.head-sha || needs.fix-docs.outputs.head-sha }}
      reply-attempt: ${{ needs.fix-docs-subscription.outputs.reply-attempt || needs.fix-docs.outputs.reply-attempt }}

  # GitHub starts no pull_request workflow on a conflicted PR, so a head the
  # lane could not resolve gets no CI and no sign why. This script job, with
  # no model, posts a failing pr-unblock/conflict commit status on that head.
  # It is the lane's only statuses: write, on its own GITHUB_TOKEN: the lanes
  # App token the escalation comment uses carries no statuses permission.
  report-conflict-status:
    needs: resolve-conflicts
    if: >-
      ${{ !cancelled() && needs.resolve-conflicts.outputs.escalation-reason == 'unresolved-conflict'
      && needs.resolve-conflicts.outputs.head-sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Post the conflict status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ needs.resolve-conflicts.outputs.head-sha }}
          ESCALATION_REASON: ${{ needs.resolve-conflicts.outputs.escalation-reason }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .base/.github/scripts/pr-unblock/report-escalation.sh status

  report-escalation:
    needs:
      - resolve-conflicts
      - address-feedback
      - publish-feedback
      - review-dependency
      - apply-dependency-verdict
      - fix-ci-context
      - apply-patch
      - apply-patch-rung-up
    # escalation-reason is set only by the write runner's own steps, the
    # base's reply, verdict and apply-patch scripts, and fix-ci-context's
    # base script. A later failure in that run (a failed verdict upload)
    # still escalates. At most one escalates: one activity runs per dispatch,
    # a reply, verdict or push job runs only after a model turn, and a model
    # job, or fix-ci-context, escalates only before one. A rung-up stop
    # escalates here too unless apply-patch-rung-up applied the retry's patch
    # cleanly: its own reason, else ci-fix-escalated. On a cancelled run this
    # always() branch fires, but the write workflow's run job skips, so no
    # label is applied and ci-status stays red.
    if: >-
      ${{ (!cancelled() && (needs.resolve-conflicts.outputs.escalation-reason != ''
      || needs.address-feedback.outputs.escalation-reason != ''
      || needs.publish-feedback.outputs.escalation-reason != ''
      || needs.review-dependency.outputs.escalation-reason != ''
      || needs.apply-dependency-verdict.outputs.escalation-reason != ''
      || needs.fix-ci-context.outputs.escalation-reason != ''
      || needs.apply-patch.outputs.escalation-reason != ''))
      || (always() && needs.apply-patch.outputs.rung-up == 'true'
      && !(needs.apply-patch-rung-up.result == 'success'
      && needs.apply-patch-rung-up.outputs.escalation-reason == ''
      && needs.apply-patch-rung-up.outputs.patch-skip-reason == '')) }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: automations
      lane: pr-unblock
      activity: report-escalation
      pr-number: ${{ inputs.pr-number }}
      escalation-reason: >-
        ${{ needs.resolve-conflicts.outputs.escalation-reason
        || needs.address-feedback.outputs.escalation-reason
        || needs.publish-feedback.outputs.escalation-reason
        || needs.review-dependency.outputs.escalation-reason
        || needs.apply-dependency-verdict.outputs.escalation-reason
        || needs.fix-ci-context.outputs.escalation-reason
        || needs.apply-patch.outputs.escalation-reason
        || needs.apply-patch-rung-up.outputs.escalation-reason
        || needs.apply-patch.outputs.rung-up == 'true' && 'ci-fix-escalated' || '' }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      expected-upstream-head: >-
        ${{ inputs.activity == 'address-feedback' && inputs.dispatcher-run-id != ''
        && needs.address-feedback.outputs.head-sha || '' }}
      trusted-base: default-tip
