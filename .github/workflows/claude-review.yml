name: claude-review

# Automated PR code review via the ci-workflows reusable workflow. The caller
# owns the triggers + GITHUB_TOKEN permission grant (a called workflow can only
# downgrade them, never elevate); the reusable workflow owns the action pin and
# the secret-handling safety model. Fork PRs and bot actors are not reviewed.
# The CLAUDE_CODE_OAUTH_TOKEN org secret has `all` repository visibility
# (github-iac README). Public repo: hosted default runner.
#
# EVERY PUSH IS REVIEWED; DRAFTS ARE NOT (ADR 0038). `synchronize` lands the
# review on the head that merges, and on a pull request that conflicted with
# main when it opened (GitHub runs no pull_request workflow while it
# conflicts). A newer push cancels the older run.
#
# The `review / claude-review-status` check goes red and names the cause when
# the review fails (ci-workflows#619). It is advisory: never add it, or any
# check in this file, to required status checks.
#
# `skill-invocation` is the #4306 fail-closed check (ADR 0038, 2026-09-28
# addendum). A session that exits 0 after `Execute skill:` with no body, or
# after a hand review of the diff, is a failed lane. The job is advisory.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read         # checkout + read the diff
      pull-requests: write   # post review + track_progress tracking comment
      id-token: write        # OIDC — mints the Claude GitHub App token
    # Repo-wide review queue: parallel PRs queue for the shared Claude seat
    # instead of contending for it. `queue: max` admits no `cancel-in-progress`
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idconcurrency).
    concurrency:
      group: claude-review-${{ github.repository }}
      queue: max
    uses: melodic-software/ci-workflows/.github/workflows/claude-review.yml@0d3e6a6f3851cf678f82fa9a8a17f10faa909ac9 # v0.29.1
    with:
      runner: ubuntu-24.04
    # One named secret (least privilege), never `secrets: inherit`.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Distinct from review / claude-review-status: that check is infrastructure.
  # This one is a posted empty skill invocation or a confessed hand review.
  skill-invocation:
    needs: review
    if: >-
      always() && needs.review.result != 'skipped'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed when the review skill body never loaded
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LANE_SKILL: code-review
          REVIEWER_LOGIN: claude[bot]
        run: python3 plugins/review/hooks/fail-closed-skill-invocation.py check-lane
