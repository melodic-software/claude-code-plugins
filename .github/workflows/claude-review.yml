name: claude-review

# Automated PR code review via the ci-workflows reusable workflow. The caller
# owns the triggers + GITHUB_TOKEN permission grant (a called workflow can only
# downgrade them, never elevate); the reusable workflow owns the action pin and
# the secret-handling safety model.
#
# Fork PRs receive no secrets and a read-only token, so they are simply not
# reviewed by design (no token-exfiltration surface). Requires `claude-code-plugins` to be
# in the CLAUDE_CODE_OAUTH_TOKEN org secret's selected-repositories scope.
# Public repo: runs on the reusable's hosted default runner.
#
# NO RE-REVIEW ON PUSH, AND DRAFTS ARE NOT REVIEWED. This lane reviews on
# open, ready-for-review and reopen only; a push to an open pull request does
# not re-trigger it, and neither does re-running the job (a re-run replays the
# ORIGINAL event payload, and the reusable's freshness guard retires the run as
# superseded once the head has moved). There are exactly three ways to get a
# review of a newer head, all documented by the reusable: reopen the pull
# request, flip it to draft and back to ready, or `workflow_dispatch` with the
# pull request's number. `@claude` is not wired here and is not one of them.
#
# The evidence job below keeps its `pull_request` condition, so it does not run
# for a dispatched review: the dispatch path has no event payload for it to
# read a head SHA from, and its guard is about the posted review body rather
# than about the trigger.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to re-review
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    # A draft is work in progress and does not spend a review; the
    # ready_for_review trigger above is what delivers one when it is ready. The
    # event_name clause is load-bearing: a dispatched run has no
    # `github.event.pull_request` at all, so a bare draft comparison would
    # never run the review the operator asked for.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions:
      contents: read         # checkout + read the diff
      pull-requests: write   # post review + track_progress tracking comment
      id-token: write        # OIDC — mints the Claude GitHub App token
    # Repo-wide review queue: serializes reviews so parallel PRs queue for the
    # shared Claude seat instead of contending for it. Job-scoped and repo-wide
    # by design, and deliberately distinct from the reusable's own inner group
    # (keyed per PR and head SHA) — a caller group sharing that name would
    # deadlock the call against itself. `queue: max` admits no
    # `cancel-in-progress`, which the two cannot be combined with anyway
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idconcurrency).
    concurrency:
      group: claude-review-${{ github.repository }}
      queue: max
    uses: melodic-software/ci-workflows/.github/workflows/claude-review.yml@cd2f4e6d500e7923c0db521b4d10034d36331ed3 # v0.22.1
    with:
      runner: ubuntu-24.04
      # Empty on a pull_request event, where the payload supplies the number
      # and head SHA; on a dispatch it is the number the operator typed, and
      # the reusable resolves the live head from the API.
      pr-number: ${{ inputs.pr-number }}
      # Below the reusable's own 30-minute default, which is sized for two
      # 11-minute attempts plus backoff. This lane is advisory and its runs are
      # the largest single line in this repository's Actions bill, so it is
      # capped: a review that has not landed in fifteen minutes is retired
      # rather than paid for.
      timeout-minutes: 15
    # Pass only the one named secret (least privilege) rather than `secrets:
    # inherit`, which would forward every parent secret to the called workflow.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Repo-owned fail-closed supplement for #3147: the reusable workflow stays
  # green when the session succeeds but the Skill tool cannot load
  # /review:code-review and the agent substitutes a manual diff review.
  # This job reads the posted review body (never the job log — #2517) and
  # reddens that silent degrade so the check row cannot stay unconditionally
  # green through a broken skill chain.
  review-skill-evidence:
    needs: review
    # The draft clause mirrors the review job's: with `review` skipped on a
    # draft, this guard would otherwise run and look for a review body that was
    # never posted. No workflow_dispatch alternative here, because this job is
    # already pull_request-only.
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.review.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run claude-review skill-evidence guard tests
        run: bash scripts/verify-claude-review-skill.sh.test.sh
      # The skip-actors exception lives in .github/claude-skip-actors — the one
      # statement of ADR 0002's ratified list, read through its one parser. The
      # value used to be restated inline here (and at four sibling sites), and
      # the restatement drifted (2b4d8abf).
      # Plain assignment first, never inside the echo: a command substitution
      # in echo's argument returns ECHO's status under bash -e, so a parser
      # failure would emit `list=` and the step would stay green. The
      # assignment form fails the step the moment the read fails.
      - name: Read the ratified skip-actors list
        id: skip-actors
        run: |
          list="$(scripts/read-skip-actors.sh)"
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Verify claude-review invoked the skill
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LANE_RESULT: ${{ needs.review.result }}
          REVIEWER_LOGINS: claude[bot]
          SKIP_ACTORS: ${{ steps.skip-actors.outputs.list }}
        run: bash scripts/verify-claude-review-skill.sh
