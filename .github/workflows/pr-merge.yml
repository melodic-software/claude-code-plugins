name: pr-merge

# What this does, in plain words:
#
# The lanes App opens pull requests, each for one issue. The gate treats each
# as class C2 and reads no `work-class:` label: it merges one only when the
# pr-verify verifier passed its current commit against that issue. Instead of
# the owner merging each one by hand, this workflow asks the existing merge gate
# (the babysit merge script) about each such PR and, when the gate says yes, adds the PR to GitHub's merge queue at
# the exact commit the gate checked. The merge queue then runs CI one last
# time and merges.
#
# Dependabot PRs are the other kind it merges, made only of Dependabot's own
# verified commits and only once `ci-status` passes. A non-major bump from an
# allowed publisher (tier `auto`) merges as is. Anything riskier (tier
# `review`: another Actions publisher, a red `ci-status`) merges only after
# the pr-unblock lane's AI review leaves a `verdict=merge` marker, written by
# the lanes App, for the PR's current commit. A major bump, one whose version
# cannot be read, or one whose title and commit metadata disagree, waits for a
# human whatever the verdict while `merge.dependabot.majors` is `hold`.
#
# It runs no AI model and never checks out a PR's own code: every script it
# runs comes from the main branch. The rules live in
# docs/conventions/pr-pipeline.yaml (`merge:` and `lanes.pr-merge`); while
# `merge.report-only` is true there, the lane only reports what it would do
# for its own PRs and changes nothing for them. Dependabot PRs follow
# `merge.dependabot.mode` instead: `enforce` merges them, `report` only
# reports, `off` (or no setting) refuses them. While neither merges, the lane
# adds no PR to the queue and starts no CI run.
#
# How to stop it: set the CLAUDE_LANES_DISABLED (organization) or
# CLAUDE_LANES_REPO_DISABLED (repository) Actions variable to anything but
# "false". The first steps check that switch and stop the run. The merge gate
# cannot read those variables with its own token, so this workflow hands it
# the answer; if the answer is missing, the gate stops too.
#
# One exception to the switch: when the merge queue lands any PR on main,
# whoever enqueued it, the push starts a full CI run of main (the
# dispatch-full-run job), even while the switch or report-only is on, since it
# merges nothing. That run raises no workflow_run event (GITHUB_TOKEN started
# it), so when it ends red the same job sends its run id and head SHA to
# post-merge-demotion-alert.yml through workflow_dispatch, which files the
# post-merge record and fix issues and reports the red-main culprit once the
# re-run fails too. A red run this workflow dispatched gets its one re-run
# from the post-merge-dispatch job, which records it, when it is inside a lane
# merge's attribution window, or was created within
# red-main.confirm-wait-minutes plus 50 minutes and demotes by the
# affected-set rule. Any other gets none, and the alert judges attempt 1
# after red-main.confirm-wait-minutes. For a lane merge the merge job's
# post-merge check also files the demotion record once it reads the run red,
# and either filer's record is found by the other through its failing run.
#
# On its schedule it also gives a PR a new head, an empty commit, when a lane
# run on its current head was refused by the token broker as
# workflow-modified, once per version of the workflow file the broker named,
# and takes off a needs-human label the lanes App set for a pr-unblock
# escalation once its recorded reason no longer holds.
#
# How to keep one PR from merging: put the line `Hold: a human merges this`
# in its body, or add the `do-not-merge` or `needs-human` label (the
# human-gated role label). The gate refuses all of them.

on:
  # Every trigger below is only a wake-up call. The run never trusts the event
  # to say which PR to look at: it lists the open PRs from the GitHub API and
  # checks each one, so any trigger leads to the same decisions.

  # A label was removed, the PR body changed, or a draft became ready. Since
  # every run reads every PR, an event starts a run only when it can make a
  # PR mergeable sooner. Adding a label can only add a hold, which the next
  # run sees anyway, so it starts none; a body edit can unblock (a new
  # closing-issue line, a removed `Hold:` line). pull_request_target runs
  # this file as it is on main, not the PR's copy, so a PR cannot change
  # what this lane does; the job below never checks out the PR's code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [unlabeled, edited, ready_for_review]

  # A person can start a run by hand (Actions tab, "Run workflow") to retry a
  # PR that looks stuck. Only a run on main does anything.
  workflow_dispatch: {}

  # Every 15 minutes the lane looks at every candidate. This is how it sees
  # checks or reviews that finished, a review thread resolved, or a PR dropped
  # from the merge queue. It does not wake on each CI or review completion:
  # those arrive faster than runs finish, which would overflow the
  # concurrency queue below. Its summary also lists candidates that are still
  # blocked and have not changed for over 24 hours.
  schedule:
    - cron: "11,26,41,56 * * * *"

  # A merge-queue landing on main (the merge-queue ruleset has no bypass, so
  # every push to main is one). Only `dispatch-full-run` runs on it: it starts
  # the full CI run that verifies the merge at once instead of at the next
  # scheduled run. The merge job does not run on it, so it never joins the
  # queue below.
  push:
    branches: [main]

  # The issue lane finished, and may have opened a pull request: only the
  # enable-auto-merge job runs on it, so the new pull request is armed at
  # once rather than at the next scheduled run. The run is the main copy of
  # this file and checks out no code from the issue run.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [work-resolve-issue]
    types: [completed]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # The post-merge check on its own, and the full CI run of main it asks for,
  # started at once: not after the merge job's candidate listing, which can
  # fail on a GitHub 5xx, nor after its gate loop, which can take many
  # minutes. It reads with this job's own token, so the merge job's Actions
  # token stays read-only. It also starts the one re-run of a red full run the
  # lane dispatched, which the lanes App cannot start. Same mechanics as
  # dispatch-full-run: ref main, and the pr-merge-dispatched-<id> artifact the
  # post-merge check trusts. Not on pull_request_target, whose dispatch the
  # check does not trust; that event's merge job still runs the check.
  post-merge-dispatch:
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out main
      pull-requests: read # read lane merges and their merge-queue entries
      actions: write # read full runs and their records; start pr-require-checks.yml on main and re-run a red lane-dispatched run
      checks: read # read a failed full run's annotations
      issues: read # read the demotion records the merge floor depends on
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # Live as the merge job reads it: the lane's own PRs not report-only,
      # or Dependabot PRs enforced.
      - name: Read report-only
        id: mode
        if: steps.kill.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          config=.base/docs/conventions/pr-pipeline.yaml
          if [[ $(yq '.merge."report-only"' "$config") =~ ^(false|null)$ ]] ||
            [ "$(yq '.merge.dependabot.mode // "off"' "$config")" = enforce ]; then
            echo "live=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::the lane is report-only; no full CI run started"
          fi

      - name: Check earlier lane merges
        id: post-merge
        if: steps.mode.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          code=0
          python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_postmerge.py \
            --repo "$REPO" --agent-identity "$identity" --lane-merges-only \
            </dev/null >"$RUNNER_TEMP/post-merge.json" || code=$?
          echo "::group::post-merge check: exit $code"
          cat "$RUNNER_TEMP/post-merge.json"
          echo "::endgroup::"
          # 1 (a failure) and 5 (not yet verified) are verdicts; 2, 3 and 4
          # mean the check could not judge. A full run starts only when the
          # JSON asks for one: an unlisted-record hold asks once per merge.
          needs=$(jq '.needsDispatch == true' "$RUNNER_TEMP/post-merge.json" 2>/dev/null || echo false)
          case $code in
            2 | 3 | 4) echo "::warning::the post-merge check exited $code (2 refused, 3 unreadable, 4 write failed); needsDispatch=$needs" ;;
          esac
          if [[ $(jq -r '.hold // ""' "$RUNNER_TEMP/post-merge.json" 2>/dev/null || true) == recovery-unrecorded ]]; then
            echo "::error::the post-merge hold's recovery run has no pr-merge-dispatched record either; no further full run starts: $(jq -r '.reason // ""' "$RUNNER_TEMP/post-merge.json")"
          fi
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "needs-dispatch=$needs" >>"$GITHUB_OUTPUT"
          rerun=$(jq -r '[.reruns[]? | select(.laneDispatched == true) | .runId][0] // ""' "$RUNNER_TEMP/post-merge.json" 2>/dev/null || true)
          echo "lane-rerun=$rerun" >>"$GITHUB_OUTPUT"

      # The same body as dispatch-full-run's step of this name; see there.
      # WAIT_CAP: of the 15 minutes, the whole job took 97-127 s on the last
      # ten scheduled runs read on 2026-10-23 (the post-merge check 81-111 s
      # of it). Add 180 s here, the re-run step's read-back sleeps (up to
      # 170 s) and about 20 s of reads and uploads: about 8.5 minutes, which
      # leaves 6.5 for slow reads. A timeout after the re-run POST would leave
      # its attempt 2 unrecorded, so the cap gives way, not the timeout.
      - name: Start the full CI run on main
        id: dispatch
        if: steps.post-merge.outputs.needs-dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WAIT_CAP: 180
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            what="merge $GITHUB_SHA"
          else
            what="main (this run started at $GITHUB_SHA)"
          fi
          # A header of the last response, by case-insensitive name.
          header() { awk -F': *' -v n="$1" 'tolower($1) == n { sub(/\r$/, "", $2); print $2; exit }' <<<"$hdr"; }
          id='' why='' waited=0
          for try in 1 2 3; do
            code=0
            out=$(gh api -i -X POST "repos/$REPO/actions/workflows/pr-require-checks.yml/dispatches" \
              -f ref=main -F return_run_details=true 2>"$RUNNER_TEMP/dispatch-stderr") || code=$?
            cat "$RUNNER_TEMP/dispatch-stderr" >&2
            hdr=$(sed '/^\r\?$/q' <<<"$out")
            body=$(sed '1,/^\r\?$/d' <<<"$out")
            status=$(awk 'NR == 1 { print $2 }' <<<"$hdr")
            if [ "$code" = 0 ]; then
              id=$(jq -r '.workflow_run_id // ""' <<<"$body" 2>/dev/null || true)
              if [[ ! $id =~ ^[1-9][0-9]{0,14}$ ]]; then
                id='' why="the dispatch returned no run id"
              fi
              break
            fi
            wait=
            if [[ $status =~ ^(403|429)$ ]]; then
              message=$(jq -r '.message // ""' <<<"$body" 2>/dev/null || true)
              after=$(header retry-after) left=$(header x-ratelimit-remaining) reset=$(header x-ratelimit-reset)
              why="HTTP $status: ${message:-no message} (retry-after=${after:-none} remaining=${left:-none} reset=${reset:-none})"
              if [[ $after =~ ^[0-9]+$ ]]; then
                wait=$after
              elif [ "$left" = 0 ] && [[ $reset =~ ^[0-9]+$ ]]; then
                wait=$((reset - $(date +%s)))
                if ((wait < 0)); then wait=0; fi
                wait=$((wait + 1))
              elif [ "$left" = 0 ] || [[ ${message,,} == *"rate limit"* ]]; then
                wait=60
              fi
            elif [ -z "$status" ]; then
              error=$(tail -n 1 "$RUNNER_TEMP/dispatch-stderr")
              if grep -qE 'dial tcp|tls: (handshake|first record)' "$RUNNER_TEMP/dispatch-stderr"; then
                why="the connection failed before the request was sent (gh exit $code: $error)"
                wait=$((RANDOM % (10 * 2 ** (try - 1)) + 1))
              else
                why="no response (gh exit $code: ${error:-no error text}), and the request may have been sent; not sent again"
              fi
            else
              why="HTTP $status, not sent again"
            fi
            if [ -z "$wait" ] || [ "$try" = 3 ]; then
              break
            fi
            if ((waited + wait > WAIT_CAP)); then
              why="$why; a ${wait}s wait does not fit the ${WAIT_CAP}s this job allows (${waited}s spent)"
              break
            fi
            echo "::notice::attempt $try: $why; waiting ${wait}s, then sending again"
            sleep "$wait"
            waited=$((waited + wait))
          done
          if [ -z "$id" ]; then
            echo "::warning::no full CI run started for $what after $try attempt(s): $why; the next push or scheduled pr-merge run starts one"
            exit 0
          fi
          echo "started run $id"
          echo "{\"dispatcher_run_id\":$GITHUB_RUN_ID,\"run_id\":$id}" >"$RUNNER_TEMP/dispatched.json"
          echo "run-id=$id" >>"$GITHUB_OUTPUT"

      - name: Record the dispatched run
        if: steps.dispatch.outputs.run-id != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-merge-dispatched-${{ steps.dispatch.outputs.run-id }}
          path: ${{ runner.temp }}/dispatched.json
          retention-days: 90
          if-no-files-found: error

      # A red attempt 1 of a full run this workflow dispatched waits for its
      # one re-run, and the lanes App holds no Actions permission to start it.
      # This job starts it with its own token, one run per job, and records it
      # as pr-merge-rerun-<id>-attempt-2, which the post-merge check needs
      # before it counts a github-actions[bot] attempt 2 of a lane-dispatched
      # run. The record is uploaded only after this job's own re-run made
      # attempt 2, so a re-run anyone else started never gets one. Only a
      # check that could judge (exit 0, 1 or 5) names a run. It runs after the
      # dispatch, and either failing leaves the other to run.
      - name: Re-run a red lane-dispatched full run
        id: rerun
        if: >-
          !cancelled()
          && contains(fromJSON('["0","1","5"]'), steps.post-merge.outputs.code)
          && steps.post-merge.outputs.lane-rerun != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.post-merge.outputs.lane-rerun }}
        run: |
          set -euo pipefail
          if [[ ! $RUN_ID =~ ^[1-9][0-9]{0,14}$ ]]; then
            echo "::error::the post-merge check named no run id to re-run: $RUN_ID"
            exit 1
          fi
          attempt=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_attempt)
          if [ "$attempt" != 1 ]; then
            echo "::notice::run $RUN_ID is at attempt $attempt; no re-run started or recorded"
            exit 0
          fi
          if ! gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs" >/dev/null; then
            echo "::warning::the re-run of run $RUN_ID was refused; the next run tries again"
            exit 0
          fi
          # The re-run started, so a read that fails or still shows attempt 1
          # is retried for about three minutes, and a step that cannot confirm
          # attempt 2 fails instead of leaving that attempt unrecorded.
          for wait in 0 5 10 20 30 45 60; do
            sleep "$wait"
            if attempt=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_attempt); then
              [ "$attempt" = 1 ] || break
            else
              attempt=
            fi
          done
          if [ -z "$attempt" ]; then
            echo "::error::the re-run of run $RUN_ID started, but its attempt could not read back; nothing recorded"
            exit 1
          fi
          if [ "$attempt" = 1 ]; then
            echo "::error::the re-run of run $RUN_ID started, but the run still reads attempt 1; nothing recorded"
            exit 1
          fi
          if [ "$attempt" != 2 ]; then
            echo "::warning::run $RUN_ID reads attempt $attempt after the re-run, not 2; nothing recorded"
            exit 0
          fi
          echo "re-ran run $RUN_ID as attempt 2"
          echo "{\"rerunner_run_id\":$GITHUB_RUN_ID,\"run_id\":$RUN_ID,\"attempt\":2}" >"$RUNNER_TEMP/rerun.json"
          echo "recorded=true" >>"$GITHUB_OUTPUT"

      - name: Record the re-run
        if: "!cancelled() && steps.rerun.outputs.recorded == 'true'"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-merge-rerun-${{ steps.post-merge.outputs.lane-rerun }}-attempt-2
          path: ${{ runner.temp }}/rerun.json
          retention-days: 90
          if-no-files-found: error

  merge:
    # A run started on any other branch would use that branch's copy of this
    # file, so it does nothing. pull_request_target runs carry the PR's base
    # branch here, so PRs that do not target main are skipped too. Events from
    # a fork PR are skipped before the job joins the concurrency group, so an
    # outsider editing a fork PR over and over cannot keep pushing real runs
    # out of the queue.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'push'
      && github.event_name != 'workflow_run'
      && (github.event_name != 'pull_request_target'
      || github.event.pull_request.head.repo.full_name == github.repository)
    # One run at a time, and a running one is never cancelled: a cancelled run
    # could stop between the gate's check and its merge-queue write. Extra runs
    # wait in line (`queue: max`) instead of being dropped. Without it GitHub
    # keeps only one waiting run and cancels the rest, which leaves CANCELLED
    # `merge` checks on PRs and makes the merge hook refuse them. Waiting is
    # harmless because every run re-reads every PR from the API, and a run
    # with a pending successor that does its work skips the gate (the
    # superseded step). GitHub caps
    # the waiting line at 100 runs and rejects the rest, so the triggers above
    # must start runs more slowly than they finish.
    concurrency:
      group: pr-merge
      queue: max
    runs-on: ubuntu-24.04
    # A ceiling above the gate's time budget (merge.gate-budget-minutes, 10),
    # which is what ends a long sweep: the budget stops between candidates,
    # a timeout can stop one between its check and its merge-queue write.
    # 30 leaves about a minute before the loop, then the longer of the
    # budget plus the last candidate's read limit (merge.gate-candidate-minutes,
    # 4) and a deferred candidate's ceiling (merge.gate-deferred-minutes, 20;
    # it is always gated first), plus one read's own timeout, the writes and
    # the closing steps.
    timeout-minutes: 30
    permissions:
      contents: read # check out main
      pull-requests: read # list the open PRs
      # The gate's pr-verify verdict reads (artifact listing, run records,
      # download); the lane token holds Actions read as a fallback only.
      actions: read
      # Read a refused lane run's annotations and its PR head's checks. Never
      # write: the gate-check job below writes the check runs.
      checks: read
      issues: read # the post-merge check's demotion records, read with this job's token
      id-token: write # prove to the token broker which workflow this is
    outputs:
      # `true` when the gate's rows were handed to the gate-check job.
      gate-rows: ${{ steps.rows.outcome == 'success' }}
      # `true` when the lane can merge (its own PRs are not report-only, or
      # Dependabot PRs are enforced) and either a PR merged during this run
      # and the gate could not start the follow-up full CI run itself (its
      # token cannot start workflows). While neither can merge it is never
      # true; the summary says what would have been started. An earlier lane
      # merge that still needs a full run is the post-merge-dispatch job's.
      dispatch: ${{ steps.mode.outputs.live == 'true' && steps.gate.outputs.dispatch == 'true' }}
    steps:
      # Everything below runs from main as it is right now, never from a PR.
      # Full history: the gate reads the pipeline config's history from this
      # clone with git instead of one contents-API call per commit.
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      # The off switch, checked before anything else.
      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
        run: echo "::notice::the lanes kill switch stops this run (reason ${REASON:-unreadable}); nothing checked or merged"

      # The token broker gives this lane its merge token only when the person
      # behind the run is a listed human (trusted-actors.json on main). Runs
      # started by a bot, such as the lanes App pushing or labeling, or by an
      # unlisted account, stop here quietly instead of failing; the next
      # scheduled run picks up whatever they changed. A scheduled run always
      # proceeds: nobody starts it, and GitHub names as its actor whoever last
      # changed the schedule or the default branch, often a bot.
      - name: Check who started the run
        id: who
        if: steps.kill.outputs.proceed == 'true'
        env:
          EVENT: ${{ github.event_name }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          LIST: .base/.github/standards/trusted-actors/trusted-actors.json
        run: |
          set -euo pipefail
          if [ "$EVENT" = schedule ]; then
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          elif [[ $ACTOR_ID =~ ^[1-9][0-9]*$ ]] &&
            jq -e --argjson id "$ACTOR_ID" --arg login "$TRIGGERING_ACTOR" '
              [.actors[] | select(.kind == "human")] as $humans
              | ($humans | any(.id == $id))
                and ($humans | any((.login | ascii_downcase) == ($login | ascii_downcase)))
            ' "$LIST" >/dev/null; then
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::started by ${TRIGGERING_ACTOR:-an unknown account}, who is not a listed human; nothing checked here, the next scheduled run checks every candidate"
            echo "proceed=false" >>"$GITHUB_OUTPUT"
          fi

      # A run still pending in the concurrency group below starts after this
      # one. When one is pending that checks every candidate and does every
      # follow-up this run would, this run ends green here with a notice,
      # before it takes the lane token, so a backlog costs one sweep and no
      # run is cancelled. Any error leaves superseded unset and the gate runs.
      # Rules: .github/scripts/pr-merge/superseded.mjs.
      - name: Check for a newer run that does this work
        id: superseded
        if: steps.who.outputs.proceed == 'true'
        continue-on-error: true
        env:
          # The job's own token; the lane token is minted after this step.
          ACTIONS_TOKEN: ${{ github.token }}
          TRUSTED_ACTORS_PATH: .base/.github/standards/trusted-actors/trusted-actors.json
        run: node .base/.github/scripts/pr-merge/superseded.mjs

      # Reads the lane's rules from main and works out which token
      # permissions its `merge-pr` activity gets.
      - name: Resolve the config
        id: config
        if: steps.who.outputs.proceed == 'true' && steps.superseded.outputs.superseded != 'true'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: pr-merge
          activity: merge-pr
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json

      # Report-only or live, read the same way the gate reads it: for the
      # lane's own PRs only `false` (or no setting at all) is live; for
      # Dependabot PRs only `merge.dependabot.mode: enforce` is, and only
      # `report` or `enforce` lists them at all. While neither is live this
      # run starts no CI run either.
      - name: Read report-only
        id: mode
        if: steps.config.outcome == 'success'
        run: |
          set -euo pipefail
          config=.base/docs/conventions/pr-pipeline.yaml
          value=$(yq '.merge."report-only"' "$config")
          case "$value" in
            false | null) report_only=false ;;
            *) report_only=true ;;
          esac
          dependabot=$(yq '.merge.dependabot.mode // "off"' "$config")
          case "$dependabot" in
            report | enforce) ;;
            *) dependabot=off ;;
          esac
          live=false
          if [ "$report_only" = false ] || [ "$dependabot" = enforce ]; then
            live=true
          fi
          {
            echo "report-only=$report_only"
            echo "dependabot=$dependabot"
            echo "live=$live"
            echo "gate-budget-minutes=$(yq '.merge."gate-budget-minutes" // ""' "$config")"
            echo "gate-candidate-minutes=$(yq '.merge."gate-candidate-minutes" // ""' "$config")"
            echo "gate-deferred-minutes=$(yq '.merge."gate-deferred-minutes" // ""' "$config")"
            echo "skip-max-minutes=$(yq '.merge."skip-unchanged"."max-minutes" // ""' "$config")"
            echo "skip-max-skips=$(yq '.merge."skip-unchanged"."max-skips" // ""' "$config")"
          } >>"$GITHUB_OUTPUT"

      # Swaps this job's GitHub identity proof for a short-lived token of the
      # lanes App, with exactly the permissions resolved above. The broker
      # re-checks everything itself (main only, this file unchanged from main,
      # kill switch, a listed human) and hands out one token per job. A queued
      # run that a change to this file on main superseded is refused
      # `workflow-modified`; it ends green with a warning and no token, so the
      # steps below skip and no stale failed `merge` check lands on a PR. The
      # newer run checks every PR.
      - name: Request the lane token
        id: lane-token
        if: steps.config.outcome == 'success'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: pr-merge
          activity: merge-pr
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}
          actions: ${{ steps.config.outputs.actions }}
          superseded-ok: true

      # Measures the run's spend on the lane token and on the job's own token
      # (the verdict reads, the listing): this reading and the one at job end
      # bracket the run, and run even when it times out. The lanes App's
      # bucket is shared by every job using it, so the lane figure includes
      # their calls. Never fails the job.
      - name: Log the API budget at mint
        if: steps.lane-token.outputs.token != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          phase: start
          tokens: |
            lane ${{ steps.lane-token.outputs.token }}
            github-token ${{ github.token }}

      # Candidates: open, non-draft PRs into main that the lanes App
      # (merge.agent-identity on main) or the owner account opened, plus
      # Dependabot's unless merge.dependabot.mode is off. This is only a shortlist; the gate checks
      # the author, the closing issue and verifier verdict or the Dependabot
      # tier, and every other rule again. A candidate the gate would refuse on
      # its listed labels or body alone (the `do-not-merge` label, the
      # human-gated role label from .work-item-tracker.json, `needs-human` by
      # default, or a hold in the body) is set aside here before it costs
      # lane-token calls (babysit_merge_prefilter.py); the summary still
      # reports it. Read with the job's own read-only token.
      - name: List the candidate PRs
        id: candidates
        if: steps.lane-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPENDABOT: ${{ steps.mode.outputs.dependabot }}
        run: |
          set -euo pipefail
          identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          slug=${identity%\[bot\]}
          if ! [[ $slug =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::merge.agent-identity is not an App bot login: $identity"
            exit 1
          fi
          authors=("app/$slug")
          # With adoption.idle-hours set, each trusted-actors.json account, a
          # person by login and an App as app/<slug>: the gate adopts their
          # pull requests (babysit_merge_policy.adoption_refusal) and checks
          # the id again. Dependabot is listed below, by its own switch.
          if [ -n "$(yq '.adoption."idle-hours" // ""' .base/docs/conventions/pr-pipeline.yaml)" ]; then
            while IFS= read -r login; do
              author=$login
              [[ $login =~ ^(.*)\[bot\]$ ]] && author="app/${BASH_REMATCH[1]}"
              if [[ $author =~ ^(app/)?[A-Za-z0-9][A-Za-z0-9-]*$ ]] &&
                [ "$author" != "app/$slug" ] && [ "$author" != app/dependabot ]; then
                authors+=("$author")
              fi
            done < <(jq -r '.actors[].login' .base/.github/standards/trusted-actors/trusted-actors.json)
          fi
          # The gate resolves the same label through babysit_postmerge._role_label.
          human_gated=needs-human
          if [ -f .base/.work-item-tracker.json ]; then
            human_gated=$(jq -er '[objects | .config | objects | .role_labels | objects
              | .["human-gated"] | strings | gsub("^\\s+|\\s+$"; "")][0] // ""
              | if . == "" then "needs-human" else . end' \
              .base/.work-item-tracker.json) || {
              echo "::error::cannot read the human-gated role label from the base .work-item-tracker.json"
              exit 1
            }
          fi
          if [ "$DEPENDABOT" != off ]; then
            authors+=(app/dependabot)
          fi
          # A 5xx from the API fails one call; three tries, then one clear
          # error instead of jq and the prefilter failing on empty input.
          listing="$RUNNER_TEMP/listing.jsonl"
          : >"$listing"
          for author in "${authors[@]}"; do
            for attempt in 1 2 3; do
              if gh pr list --repo "$REPO" --base main --state open --limit 500 \
                --author "$author" --json id,number,headRefOid,isDraft,updatedAt,labels,body >>"$listing"; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::gh pr list --author $author failed 3 times; no candidates listed, the gate does not run"
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done
          jq -cs '[add[] | select(.isDraft | not)
              | {number, head: .headRefOid, updatedAt, labels: [.labels[].name], body}]
              | unique_by(.number)' "$listing" |
            python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_merge_prefilter.py \
              --human-gated="$human_gated" >"$RUNNER_TEMP/prefilter.json"
          jq -c .candidates "$RUNNER_TEMP/prefilter.json" >"$RUNNER_TEMP/candidates.json"
          jq -c .held "$RUNNER_TEMP/prefilter.json" >"$RUNNER_TEMP/held.json"
          jq -cs '[add[] | select(.isDraft) | {number, id, head: .headRefOid, updatedAt,
              labels: [.labels[].name]}] | unique_by(.number)' "$listing" >"$RUNNER_TEMP/drafts.json"
          echo "count=$(jq length "$RUNNER_TEMP/candidates.json")" >>"$GITHUB_OUTPUT"

      # The gate loop below can stop at its time budget, so it starts after
      # the last candidate the previous loop reached (the
      # pr-merge-gate-cursor artifact) and wraps round: every candidate is
      # reached across runs. The cursor sets only the order; any error
      # leaves the listing order. Rules: .github/scripts/pr-merge/rotation.mjs.
      - name: Start after the candidate the last run reached
        if: steps.candidates.outcome == 'success'
        continue-on-error: true
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          CANDIDATES_PATH: ${{ runner.temp }}/candidates.json
        run: node .base/.github/scripts/pr-merge/rotation.mjs

      # The head ref each untied pr-verify FAIL's verdict.json records, by
      # artifact id, as the last scheduled or hand-started run kept them (the
      # pr-merge-head-refs artifact, found the way the cursor is): the gate
      # ties or unties those FAILs without downloading them. Only that run's
      # steps could upload it. Any error leaves no map, and the gate downloads
      # each untied FAIL. Rules: .github/scripts/pr-merge/head-ref-map.mjs.
      - name: Read the head refs the last run kept
        if: steps.candidates.outcome == 'success'
        continue-on-error: true
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          HEAD_REFS_PATH: ${{ runner.temp }}/head-refs-in.json
        run: node .base/.github/scripts/pr-merge/head-ref-map.mjs read

      # The verdict reads that never change (FAIL run records, FAIL head refs,
      # run heads on main) carry over from the last run, so a sweep does not
      # read them all again on its first candidate. A cache key is never
      # overwritten, so each run saves a new one and restores the newest
      # (https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching).
      # Any job in the default branch's cache scope can write that prefix, so
      # the entry is untrusted: each kept read lands in a carried-* section the
      # gate uses only where it counts a FAIL, never to turn one away or allow
      # a PASS, and reads GitHub for any other answer. Rules:
      # .github/scripts/pr-merge/carry-run-cache.mjs. Any error leaves the
      # run cache empty, and the gate reads GitHub.
      - name: Restore the verdict reads the last run kept
        if: steps.candidates.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pr-merge-carried.json
          key: pr-merge-run-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pr-merge-run-cache-

      - name: Start the run cache from them
        if: steps.candidates.outcome == 'success'
        continue-on-error: true
        env:
          CARRY_FROM: ${{ runner.temp }}/pr-merge-carried.json
          CARRY_TO: ${{ runner.temp }}/babysit-run-cache.json
        run: node .base/.github/scripts/pr-merge/carry-run-cache.mjs

      # The post-merge check, read-only, on every run whether or not any PR is
      # a candidate: after the queue lands the last lane PR there is none, yet
      # that merge still needs its full CI run to be verified. It looks only
      # at PRs this lane put in the merge queue itself; merges by a person or
      # by another App (a release PR, say) are not the lane's to check.
      # It runs before the gate, which reuses its answer for every candidate
      # whose base has the same floor while no lane merge has landed since
      # (--postmerge-result); a PR that merges during the run is in the
      # gate's own `dispatch` output. The post-merge-dispatch job runs the
      # same check to start the full run an earlier merge needs, so neither a
      # failed listing nor a long gate loop holds that run back. Read-only,
      # so it reads with this job's own token, off the lane App's quota; only
      # --remediate below needs the lane token.
      - name: Check earlier lane merges
        id: post-merge
        if: steps.lane-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          code=0
          python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_postmerge.py \
            --repo "$REPO" --agent-identity "$identity" --lane-merges-only \
            </dev/null >"$RUNNER_TEMP/post-merge.json" || code=$?
          echo "::group::post-merge check: exit $code"
          cat "$RUNNER_TEMP/post-merge.json"
          echo "::endgroup::"
          needs=$(jq '.needsDispatch == true' "$RUNNER_TEMP/post-merge.json" 2>/dev/null || echo false)
          echo "needs-dispatch=$needs" >>"$GITHUB_OUTPUT"
          echo "code=$code" >>"$GITHUB_OUTPUT"

      # A failed lane merge (the check above exited 1) holds the gate until a
      # human closes every open demotion record, and the gate reads only records the
      # lanes App or github-actions[bot] filed. post-merge-demotion-alert.yml
      # hears of a full run this workflow dispatched only when the push job
      # sends it, and not of one the merge job or post-merge-dispatch started:
      # a run started with GITHUB_TOKEN raises no workflow_run event. So the check runs again
      # with --remediate under the lane token, which files the record (or
      # comments on it, reopening it on a new sighting) and dequeues the
      # lane's merge-queue entries. The lane token holds no Actions
      # write, so the re-run and dispatch --remediate also attempts fail
      # here and are reported as a write failure (exit 4); the
      # post-merge-dispatch job starts those. Live mode only.
      - name: Record a failed lane merge
        if: steps.mode.outputs.live == 'true' && steps.post-merge.outputs.code == '1'
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          code=0
          python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_postmerge.py \
            --repo "$REPO" --agent-identity "$identity" --lane-merges-only --remediate \
            </dev/null >"$RUNNER_TEMP/post-merge-remediate.json" || code=$?
          report=$RUNNER_TEMP/post-merge-remediate.json
          echo "::group::post-merge remediation: exit $code"
          cat "$report"
          echo "::endgroup::"
          # Exit 4 also covers the expected re-run and dispatch refusals, so
          # the report, not the exit code, says whether the record was filed.
          if ! jq -e '.remediation.errors | type == "array"' "$report" >/dev/null 2>&1; then
            echo "::error::the post-merge remediation exited $code with no remediation report; no demotion record was filed"
          elif jq -e '[.remediation.errors[] | select(startswith("demotion issue:") or startswith("dequeue:"))] | length > 0' "$report" >/dev/null; then
            echo "::error::the post-merge remediation could not file the demotion record or dequeue the lane's entries; see its report above"
          elif [ "$code" -eq 4 ]; then
            echo "::warning::the post-merge remediation exited $code (re-run or dispatch refused: the lane token has no Actions permission)"
          fi

      # A whole-review request (babysit_whole_review.py) converts a lane PR
      # to a draft and marks it ready again; a run that ended between the two
      # left a draft the listing above skips. Each lane draft updated in the
      # last day whose newest lane comment records a request at its current
      # head is marked ready here: one comments read per such draft.
      - name: Re-ready a draft a whole-review request left
        if: steps.mode.outputs.report-only == 'false' && steps.candidates.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_whole_review.py recover \
            --repo "$REPO" --identity "$identity" --drafts "$RUNNER_TEMP/drafts.json"

      # A candidate the last run refused on inputs that have not changed
      # since (head, updatedAt, labels, base, check rollup, reviews and
      # threads, comments, closing issues, verdict artifacts, the gate's
      # config and code on main) is reported with that refusal, marked
      # carried, instead of gated again: a skip only repeats a refusal. It is
      # gated again within merge.skip-unchanged (max-minutes, max-skips),
      # always while in the merge queue, and one candidate always is. One
      # GraphQL query per 20 candidates; the artifact listing it reads is
      # saved for the gate's first candidate. Any error gates every
      # candidate. Rules: babysit_merge_skip.py.
      - name: Skip refusals whose inputs have not changed
        if: steps.candidates.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          BABYSIT_VERIFY_GH_TOKEN: ${{ github.token }}
          BABYSIT_VERIFY_LISTING: ${{ runner.temp }}/verify-listing.json
          REPO: ${{ github.repository }}
          RUNG_CAP: ${{ vars.CLAUDE_LANES_MERGE_RUNG_CAP }}
          MAX_MINUTES: ${{ steps.mode.outputs.skip-max-minutes }}
          MAX_SKIPS: ${{ steps.mode.outputs.skip-max-skips }}
        run: |
          python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_merge_skip.py filter \
            --repo "$REPO" --base .base --store "$RUNNER_TEMP/pr-merge-carried.json" \
            --candidates "$RUNNER_TEMP/candidates.json" --out-keys "$RUNNER_TEMP/skip-keys.json" \
            --out-skipped "$RUNNER_TEMP/skipped.json" --rung-cap "$RUNG_CAP" \
            --max-minutes "$MAX_MINUTES" --max-skips "$MAX_SKIPS"

      # The gate itself, once per candidate, using the lane App's token. It is
      # the same script the local babysit loop uses, run as the pr-merge lane:
      # it refuses on any hold, missing review, failing check, risk above LOW,
      # a changed file on the denied list, no passing verifier verdict at the
      # head, or a head that moved since listing.
      # A Dependabot PR is judged by its tier and `ci-status` instead of the
      # risk score, denied list and verdict.
      # When it passes (and that PR's kind is live) it posts the checked commit as
      # a pin comment and adds the PR to the merge queue at that commit.
      # The gate's token cannot read the kill switch, so it gets this run's
      # own answer from the first step: the word `proceed`, or nothing. It
      # stops on anything but `proceed`. For the same reason it gets the
      # CLAUDE_LANES_MERGE_RUNG_CAP variable from here: a person can set it to
      # `off` (or `C2`) to lower how far the lane may go; left unset, there is
      # no extra limit.
      # Once the loop has run merge.gate-budget-minutes, it starts no further
      # candidate and ends; the candidate in progress finishes first, so no
      # gate stops between its check and its merge-queue write. The rest wait
      # for the next run, which starts after the last one reached here
      # (cursor.json, uploaded below). No setting: no budget. Each candidate's
      # gate reads for at most merge.gate-candidate-minutes, then stops before
      # its next read and is reported unknown (exit 11); the gate bounds only
      # its reads, so a write it started finishes. No setting: no limit. The
      # first candidate stopped so is recorded in the cursor as deferred, and
      # the next run gates it first under merge.gate-deferred-minutes instead
      # (rotation.mjs). One stopped at that ceiling is warned about and goes
      # back to the capped rotation, never deferred again.
      - name: Run the merge gate on each candidate
        id: gate
        if: steps.candidates.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          # The verdict reader's Actions calls, the review-evidence reads
          # (timeline, comments, lane runs, attempts, jobs, annotations) and
          # the whole-review request's limit reads use this, as their own
          # GH_TOKEN (babysit_verify_evidence.py, babysit_merge.py
          # _lane_evidence, babysit_whole_review.py); every write keeps the
          # lane token. The job runs main's code alone, never a PR's.
          BABYSIT_VERIFY_GH_TOKEN: ${{ github.token }}
          # At most one whole-review request per run: the first candidate to
          # reach its limits creates this file (babysit_whole_review.py).
          BABYSIT_WHOLE_REVIEW_SPENT: ${{ runner.temp }}/whole-review-spent
          # The first candidate saves its artifact listing here and the rest
          # of the run reads it while it is under two minutes old; a
          # candidate the saved listing would allow lists again before it is
          # allowed.
          BABYSIT_VERIFY_LISTING: ${{ runner.temp }}/verify-listing.json
          # The head-ref map read above, if any.
          BABYSIT_VERIFY_HEAD_REFS: ${{ runner.temp }}/head-refs-in.json
          # Reads that are the same for every candidate (acting login,
          # credential pass, permissions, trusted list, run heads on main,
          # FAIL run records, default branch, base rules, the queued entries
          # a candidate kept) are shared here within their bounds
          # (babysit_run_cache.py), starting from the reads the last run kept.
          BABYSIT_RUN_CACHE: ${{ runner.temp }}/babysit-run-cache.json
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SCRIPT: ${{ steps.config.outputs.script }}
          KILL_SWITCH: ${{ steps.kill.outputs.proceed == 'true' && 'proceed' || '' }}
          RUNG_CAP: ${{ vars.CLAUDE_LANES_MERGE_RUNG_CAP }}
          BUDGET_MINUTES: ${{ steps.mode.outputs.gate-budget-minutes }}
          CANDIDATE_MINUTES: ${{ steps.mode.outputs.gate-candidate-minutes }}
          DEFERRED_MINUTES: ${{ steps.mode.outputs.gate-deferred-minutes }}
        run: |
          set -euo pipefail
          budget=${BUDGET_MINUTES:-}
          if [[ -n $budget && ! $budget =~ ^[1-9][0-9]*$ ]]; then
            echo "::warning::merge.gate-budget-minutes is not a whole number of minutes ($budget); the gate runs with no budget"
            budget=
          fi
          # The read limit for a candidate, then for a deferred one.
          limit=() ceiling=()
          if [[ ${CANDIDATE_MINUTES:-} =~ ^[1-9][0-9]*$ ]]; then
            limit=(--candidate-deadline-seconds $((CANDIDATE_MINUTES * 60)))
          elif [ -n "${CANDIDATE_MINUTES:-}" ]; then
            echo "::warning::merge.gate-candidate-minutes is not a whole number of minutes ($CANDIDATE_MINUTES); each candidate runs with no limit"
          fi
          if [[ ${DEFERRED_MINUTES:-} =~ ^[1-9][0-9]*$ ]]; then
            ceiling=(--candidate-deadline-seconds $((DEFERRED_MINUTES * 60)))
          elif [ -n "${DEFERRED_MINUTES:-}" ]; then
            echo "::warning::merge.gate-deferred-minutes is not a whole number of minutes ($DEFERRED_MINUTES); a deferred candidate runs with no limit"
          fi
          cursor="$RUNNER_TEMP/gate-cursor/cursor.json"
          mkdir -p "${cursor%/*}"
          started=$(date +%s)
          reached=0
          deferred=
          # The script and its flags come from the merge-pr activity on main.
          read -ra args < <(jq -r '.selected.args // ""' "$RUNNER_TEMP/resolved-config.json")
          results="$RUNNER_TEMP/results.jsonl"
          # The candidates set aside for a hold, reported as the gate would.
          jq -c '.[] | {pr: .number, head, updatedAt, exit: 10, ready: false,
            enqueued: false, merged: false, reportOnly: null, reason: "prefilter:\(.reason)",
            dispatched: null, blockers: ["prefilter: \(.reason), refused before the gate"]}' \
            "$RUNNER_TEMP/held.json" >"$results"
          # The candidates the skip step set aside, with their carried
          # refusal; one still listed for the gate is not reported twice.
          jq -c --slurpfile c "$RUNNER_TEMP/candidates.json" \
            '.[] | select(.pr as $p | $c[0] | any(.number == $p) | not)' \
            "$RUNNER_TEMP/skipped.json" >"$RUNNER_TEMP/carried.jsonl" 2>/dev/null &&
            cat "$RUNNER_TEMP/carried.jsonl" >>"$results" || true
          # Rewritten after each candidate, so a cancelled run still reports
          # the verdicts it reached.
          summary="$RUNNER_TEMP/pr-merge-summary.json"
          save() { jq -s . "$results" >"$summary.tmp" && mv "$summary.tmp" "$summary"; }
          save
          while read -r number head updated was_deferred; do
            if [ -n "$budget" ] && (($(date +%s) - started >= budget * 60)); then
              stop="the ${budget}-minute gate budget is used after $reached of $(jq length "$RUNNER_TEMP/candidates.json") candidates; the next run starts after #$(jq .last "$cursor" 2>/dev/null || echo none)"
              echo "::notice::$stop"
              echo "budget-stop: $stop" >>"$GITHUB_STEP_SUMMARY"
              break
            fi
            out="$RUNNER_TEMP/gate-$number.json"
            code=0
            cap=("${limit[@]}")
            [ "$was_deferred" = true ] && cap=("${ceiling[@]}")
            ".base/$SCRIPT" "${args[@]}" --allowed-owners "$OWNER" \
              --lane-kill-switch "$KILL_SWITCH" --lane-rung-cap "$RUNG_CAP" \
              --postmerge-result "$RUNNER_TEMP/post-merge.json" "${cap[@]}" \
              --expected-head "$head" "$REPO#$number" </dev/null >"$out" || code=$?
            echo "::group::PR #$number at $head: exit $code"
            cat "$out"
            echo "::endgroup::"
            if jq -e '.unattended.writes.wholeReview.toggled == true' "$out" >/dev/null 2>&1; then
              echo "::notice::pr-merge whole-review-toggle pr=$number head=$head"
            fi
            # Keep only the verdict fields; a gate that printed no JSON object
            # is recorded as an error with its exit code.
            jq -e 'type == "object"' "$out" >/dev/null 2>&1 || echo '{"error": "gate printed no JSON"}' >"$out"
            jq -c --argjson n "$number" --arg head "$head" --arg updated "$updated" --argjson code "$code" '
              {pr: $n, head: $head, updatedAt: $updated, exit: $code,
               ready: (.ready == true), enqueued: (.enqueued == true), merged: (.merged == true),
               reportOnly: .unattended.reportOnly, reason: (.unattended.reason // .error),
               dispatched: .unattended.dispatched, blockers: (.blockers // [])}
            ' "$out" >>"$results"
            save
            reached=$((reached + 1))
            if [ "$code" = 11 ] && [ "$was_deferred" = true ]; then
              echo "::warning::PR #$number's gate ran past merge.gate-deferred-minutes ($DEFERRED_MINUTES) after a deferral; it goes back to the capped rotation"
            elif [ "$code" = 11 ] && [ -z "$deferred" ]; then
              deferred=$number
            fi
            echo "{\"last\":$number${deferred:+,\"deferred\":$deferred}}" >"$cursor"
          done < <(jq -r '.[] | "\(.number) \(.head) \(.updatedAt) \(.deferred == true)"' "$RUNNER_TEMP/candidates.json")
          dispatch=$(jq 'any(.[]; .merged and .dispatched != true)' "$summary")
          echo "dispatch=$dispatch" >>"$GITHUB_OUTPUT"

      # The next run's starting point (rotation.mjs reads it), uploaded even
      # when the job is cancelled, since cursor.json is rewritten after each
      # candidate.
      - name: Record where the gate stopped
        if: always() && steps.gate.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-merge-gate-cursor
          path: ${{ runner.temp }}/gate-cursor/cursor.json
          retention-days: 1
          if-no-files-found: ignore

      # The next run's head-ref map: the one read above and this run's
      # downloads, for ids the run's last listing still lists. Only a
      # scheduled or hand-started run's map is read back, so only one uploads
      # it; also after a timeout, since each download is in the run cache as
      # it is read. Rules: .github/scripts/pr-merge/head-ref-map.mjs.
      - name: Keep the head refs the gate read
        id: head-refs
        if: >-
          always() && steps.gate.outcome != 'skipped'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          HEAD_REFS_PATH: ${{ runner.temp }}/head-refs-in.json
          BABYSIT_RUN_CACHE: ${{ runner.temp }}/babysit-run-cache.json
          BABYSIT_VERIFY_LISTING: ${{ runner.temp }}/verify-listing.json
          HEAD_REFS_OUT: ${{ runner.temp }}/head-refs/head-refs.json
        run: |
          mkdir -p "${HEAD_REFS_OUT%/*}"
          node .base/.github/scripts/pr-merge/head-ref-map.mjs write

      - name: Upload them for the next run
        if: always() && steps.head-refs.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-merge-head-refs
          path: ${{ runner.temp }}/head-refs/head-refs.json
          retention-days: 1
          if-no-files-found: ignore

      # The next run's verdict reads, under this run's own key; also after a
      # timeout, since the run cache is written as each candidate reads.
      - name: Keep the verdict reads that never change
        id: carry
        if: always() && steps.gate.outcome != 'skipped'
        continue-on-error: true
        env:
          CARRY_FROM: ${{ runner.temp }}/babysit-run-cache.json
          CARRY_TO: ${{ runner.temp }}/pr-merge-carried.json
        run: node .base/.github/scripts/pr-merge/carry-run-cache.mjs

      # The refusals the next run may skip, in the same entry: each gated
      # refusal it may skip whose gate process left nothing to do, each
      # skipped one with its count raised, each unreached one as it was.
      # Rules: babysit_merge_skip.py.
      - name: Keep the refusals the next run may skip
        if: always() && steps.carry.outputs.carried == 'true'
        continue-on-error: true
        run: |
          python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_merge_skip.py record \
            --keys "$RUNNER_TEMP/skip-keys.json" --summary "$RUNNER_TEMP/pr-merge-summary.json" \
            --outputs-dir "$RUNNER_TEMP" --store "$RUNNER_TEMP/pr-merge-carried.json" --run-id "$GITHUB_RUN_ID"

      - name: Save them for the next run
        if: always() && steps.carry.outputs.carried == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pr-merge-carried.json
          key: pr-merge-run-cache-${{ github.run_id }}-${{ github.run_attempt }}

      # The run's report: every candidate with its verdict, whether a full CI
      # run is started (or, in report-only mode, would have been), then the
      # ones that are blocked and untouched for over 24 hours, which need a
      # person.
      - name: Write the summary
        if: always() && steps.gate.outcome != 'skipped'
        env:
          EVENT: ${{ github.event_name }}
          LIVE: ${{ steps.mode.outputs.live }}
          WANTS_DISPATCH: ${{ steps.gate.outputs.dispatch == 'true' }}
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/pr-merge-summary.json"
          [ -f "$summary" ] || echo '[]' >"$summary"
          cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          # Backticks are dropped so PR-supplied text cannot end the code block.
          {
            echo "### pr-merge ($EVENT)"
            echo
            echo '```json'
            jq '[.[] | .blockers |= map(gsub("[\r\n`]"; " ") | .[0:300])]' "$summary"
            echo '```'
            echo
            if [ "$WANTS_DISPATCH" != true ]; then
              echo "Full CI run on main: none for a merge in this run; earlier lane merges are the post-merge-dispatch job's."
            elif [ "$LIVE" = true ]; then
              echo "Full CI run on main: started by the next job."
            else
              echo "Full CI run on main: would be started; report-only, so none was."
            fi
            echo
            echo "#### Blocked for over 24 hours"
            echo
            jq -r --arg cutoff "$cutoff" '
              [.[] | select(((.enqueued or .merged) | not) and .updatedAt < $cutoff)]
              | if length == 0 then "None." else .[] | "- #\(.pr): \((.reason // "not ready") | tostring | gsub("[\r\n`]"; " ") | .[0:200])" end
            ' "$summary"
          } >>"$GITHUB_STEP_SUMMARY"

      # The same verdicts as data for the lane trend chart, since the API
      # cannot read a step summary: the pr-merge-summary artifact, and one log
      # line of refusal counts by reason. The key is split here so this
      # script, which the log echoes, never matches a grep for it. Rules:
      # .github/scripts/pr-merge/sweep-summary.mjs.
      - name: Count the sweep's refusals
        if: always() && steps.gate.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          LIVE: ${{ steps.mode.outputs.live }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          SUMMARY_PATH: ${{ runner.temp }}/pr-merge-summary.json
          HELD_PATH: ${{ runner.temp }}/held.json
          CANDIDATES_PATH: ${{ runner.temp }}/candidates.json
          CURSOR_PATH: ${{ runner.temp }}/gate-cursor/cursor.json
          SWEEP_SUMMARY_TO: ${{ runner.temp }}/pr-merge-sweep.json
        run: |
          set -euo pipefail
          RUN_STARTED_AT=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at) || RUN_STARTED_AT=
          export RUN_STARTED_AT
          node .base/.github/scripts/pr-merge/sweep-summary.mjs
          jq -r '"refusal" + "-counts=" + (.refusal_counts | tojson)' "$SWEEP_SUMMARY_TO"

      - name: Upload the sweep's verdicts
        if: always() && steps.gate.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-merge-summary
          path: ${{ runner.temp }}/pr-merge-sweep.json
          retention-days: 1
          if-no-files-found: ignore

      # The gate-check job below writes each candidate's check run from these
      # rows. Not while the lane is report-only.
      - name: Hand the gate's rows to the check writer
        id: rows
        if: always() && steps.gate.outcome != 'skipped' && steps.mode.outputs.report-only == 'false'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-merge-gate-rows
          path: ${{ runner.temp }}/pr-merge-summary.json
          retention-days: 1
          if-no-files-found: error

      # A pr-unblock run the broker refused as workflow-modified cannot
      # pass on a rerun, which keeps its first event's workflow files. On
      # the schedule, this pushes an empty commit with the lane token to
      # each such PR whose head check-trusted-trigger would trust (no fork,
      # no Dependabot PR), so the next pr-unblock run uses main's files: at
      # most five a run, and once per PR per version of the file the
      # broker named, recorded in a marker comment first. It runs after the
      # gate, which refuses a PR with a failing check, and not while the lane
      # is report-only. Rules: .github/scripts/pr-merge/refire-refused.mjs.
      - name: Re-fire lane runs refused as workflow-modified
        if: >-
          always() && github.event_name == 'schedule'
          && steps.lane-token.outputs.token != ''
          && steps.mode.outputs.report-only == 'false'
        env:
          LANES_APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          # The job's own read-only token lists runs, jobs and annotations;
          # the lane token holds no Checks permission.
          ACTIONS_TOKEN: ${{ github.token }}
          KILL_SWITCH: ${{ steps.kill.outputs.proceed == 'true' && 'proceed' || '' }}
          TRUSTED_ACTORS_PATH: .base/.github/standards/trusted-actors/trusted-actors.json
        run: node .base/.github/scripts/pr-merge/refire-refused.mjs

      # A pr-unblock escalation adds the human-gated label with a reason. On
      # the schedule, this takes off a label the lanes App set once that
      # reason no longer holds at the PR's head (workflow-staged, a conflict
      # reason, feedback-protected-path), after a comment naming the reason
      # and the head: never a label a person set, and never after anyone but
      # the App commented or reviewed since it went on. At most five a run, and not
      # while the lane is report-only.
      # Rules: .github/scripts/pr-merge/clear-escalations.mjs.
      - name: Clear escalations whose reason no longer holds
        if: >-
          always() && github.event_name == 'schedule'
          && steps.lane-token.outputs.token != ''
          && steps.mode.outputs.report-only == 'false'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          KILL_SWITCH: ${{ steps.kill.outputs.proceed == 'true' && 'proceed' || '' }}
        run: node .base/.github/scripts/pr-merge/clear-escalations.mjs

      - name: Log the API budget at job end
        id: budget-end
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          phase: end
          tokens: |
            lane ${{ steps.lane-token.outputs.token }}
            github-token ${{ github.token }}

      # One line per sweep, in the log and the summary: the two tokens' spend
      # since mint (`unknown` when the hourly window rolled), the candidates
      # listed, how many the gate reached before it ended, and how many it
      # skipped as unchanged.
      - name: Write the sweep cost
        if: always() && steps.gate.outcome != 'skipped'
        continue-on-error: true
        env:
          COSTS: ${{ steps.budget-end.outputs.costs }}
          CANDIDATES: ${{ steps.candidates.outputs.count }}
        run: |
          lane=unknown github_token=unknown
          for cost in $COSTS; do
            case $cost in
              lane-cost=*) lane=${cost#*=} ;;
              github-token-cost=*) github_token=${cost#*=} ;;
            esac
          done
          reached=$(jq -n --slurpfile s "$RUNNER_TEMP/pr-merge-summary.json" --slurpfile h "$RUNNER_TEMP/held.json" \
            '($s[0] | map(select(has("carried") | not)) | length) - ($h[0] | length)' 2>/dev/null) || reached=unknown
          skipped=$(jq '[.[] | select(has("carried"))] | length' "$RUNNER_TEMP/pr-merge-summary.json" 2>/dev/null) || skipped=unknown
          line="sweep-cost=$lane github-token-cost=$github_token candidates=${CANDIDATES:-unknown} reached=$reached skipped=$skipped"
          echo "$line"
          echo "$line" >>"$GITHUB_STEP_SUMMARY"

      # The token is cancelled as soon as the job is done; it would otherwise
      # expire within the hour. This never fails the job.
      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: |
          # The header goes through stdin so the token never appears in a
          # process listing.
          status=$(printf 'Authorization: Bearer %s\n' "$GH_TOKEN" |
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X DELETE -H @- \
              -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/installation/token" || true)
          if [ "$status" = 204 ]; then
            echo "the lane token is revoked"
          else
            echo "::warning::the lane token was not revoked (DELETE $status); it expires within the hour"
          fi

  # Turns on GitHub's native auto-merge for each open lanes App pull request
  # into main that closes an issue and carries no hold, and turns it off on
  # one that now carries a hold (a `Hold:` line, do-not-merge, the human-gated
  # label). Every event is a wake-up: the script lists the pull requests
  # itself. The issue lane finishing arms the pull request it opened; a listed
  # human's edit, unlabel or ready disarms or arms at once; the schedule
  # catches what the events missed, such as a run the lanes App started, which
  # the broker refuses. It arms only on the verifier evidence pr-merge's gate
  # would take at the head (babysit_verify_evidence.py, read with the job's
  # GITHUB_TOKEN as the gate does, from the head-ref map and run cache the
  # last gate run kept), so a FAIL or the repeated-FAIL cap disarms too.
  # Its own job and token: the broker mints one token per
  # job. Rules: .github/scripts/pr-merge/enable-auto-merge.mjs.
  enable-auto-merge:
    # An issue run that skipped every job (a label other than agent-ready)
    # opened nothing.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'push'
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped')
      && (github.event_name != 'pull_request_target'
      || github.event.pull_request.head.repo.full_name == github.repository)
    # A pending run is never replaced: a cancelled run leaves a CANCELLED
    # check on the pull request that woke it.
    concurrency:
      group: pr-merge-enable-auto-merge
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out main
      actions: read # the verifier verdicts, their runs and the head-ref map
      id-token: write # prove to the token broker which workflow this is
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # The broker mints the merge token only for a listed human, or on the
      # schedule; any other run stops here quietly, as the merge job's does.
      - name: Check who started the run
        id: who
        if: steps.kill.outputs.proceed == 'true'
        env:
          EVENT: ${{ github.event_name }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          LIST: .base/.github/standards/trusted-actors/trusted-actors.json
        run: |
          set -euo pipefail
          if [ "$EVENT" = schedule ]; then
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          elif [[ $ACTOR_ID =~ ^[1-9][0-9]*$ ]] &&
            jq -e --argjson id "$ACTOR_ID" --arg login "$TRIGGERING_ACTOR" '
              [.actors[] | select(.kind == "human")] as $humans
              | ($humans | any(.id == $id))
                and ($humans | any((.login | ascii_downcase) == ($login | ascii_downcase)))
            ' "$LIST" >/dev/null; then
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::started by ${TRIGGERING_ACTOR:-an unknown account}, who is not a listed human; the next scheduled run arms what this one would"
            echo "proceed=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Resolve the config
        id: config
        if: steps.who.outputs.proceed == 'true'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: pr-merge
          activity: enable-auto-merge
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json

      - name: Request the lane token
        id: lane-token
        if: steps.config.outcome == 'success'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: pr-merge
          activity: enable-auto-merge
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}
          superseded-ok: true

      # The verdict reader's untied FAILs, as the gate job reads them: the
      # head-ref map and the carried run cache. Any error leaves none, and
      # the reader reads GitHub instead.
      - name: Read the head refs the last gate run kept
        if: steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          HEAD_REFS_PATH: ${{ runner.temp }}/head-refs-in.json
        run: node .base/.github/scripts/pr-merge/head-ref-map.mjs read

      - name: Restore the verdict reads the last gate run kept
        if: steps.lane-token.outputs.token != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pr-merge-carried.json
          key: pr-merge-run-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pr-merge-run-cache-

      - name: Start the run cache from them
        if: steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          CARRY_FROM: ${{ runner.temp }}/pr-merge-carried.json
          CARRY_TO: ${{ runner.temp }}/babysit-run-cache.json
        run: node .base/.github/scripts/pr-merge/carry-run-cache.mjs

      # While merge.report-only is anything but false it reports each
      # decision and writes nothing.
      - name: Arm and disarm auto-merge
        if: steps.lane-token.outputs.token != ''
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          KILL_SWITCH: ${{ steps.kill.outputs.proceed == 'true' && 'proceed' || '' }}
          RESOLVED_CONFIG: ${{ runner.temp }}/resolved-config.json
          BABYSIT_VERIFY_GH_TOKEN: ${{ github.token }}
          BABYSIT_VERIFY_LISTING: ${{ runner.temp }}/verify-listing.json
          BABYSIT_VERIFY_HEAD_REFS: ${{ runner.temp }}/head-refs-in.json
          BABYSIT_RUN_CACHE: ${{ runner.temp }}/babysit-run-cache.json
        run: |
          set -euo pipefail
          config=.base/docs/conventions/pr-pipeline.yaml
          REPORT_ONLY=$(yq '.merge."report-only"' "$config")
          LANES_BOT_LOGIN=$(yq '.merge."agent-identity" // ""' "$config")
          MAX_VERIFY_FAILS=$(yq '.merge."max-verify-fails" // ""' "$config")
          export REPORT_ONLY LANES_BOT_LOGIN MAX_VERIFY_FAILS
          node .base/.github/scripts/pr-merge/enable-auto-merge.mjs

      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: |
          status=$(printf 'Authorization: Bearer %s\n' "$GH_TOKEN" |
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X DELETE -H @- \
              -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/installation/token" || true)
          if [ "$status" = 204 ]; then
            echo "the lane token is revoked"
          else
            echo "::warning::the lane token was not revoked (DELETE $status); it expires within the hour"
          fi

  # Starts the full CI run that verifies main. Starting a workflow needs
  # `actions: write`, which the lane App token does not have, so this job does
  # it with its own GitHub token, in two cases:
  #   * The merge job says a lane PR merged during its run, which it never
  #     says while nothing can merge. A run woken by pull_request_target
  #     leaves it to the next run: the post-merge check does not trust a
  #     dispatch from that event, which runs the PR base branch's copy of
  #     this file.
  #   * A push to main, whoever merged: a person, a release App or the lanes
  #     App. The run it starts is a `dispatch` signal for
  #     post-merge-demotion-alert.yml, and for a lane merge the post-merge
  #     check credits it through the artifact below.
  # An earlier lane merge the post-merge check still finds unverified is the
  # post-merge-dispatch job's, which is also the catch-up for a push dispatch
  # that failed. A lane merge can get a second run from it when it checks the
  # merge before the push dispatch's run exists.
  #
  # BURSTS COLLAPSE HERE, NOT IN pr-require-checks.yml. Push jobs share one
  # group without `cancel-in-progress`, so one runs while one waits; a newer
  # push replaces the waiting job, which is cancelled before it dispatches
  # anything. The running job holds the group until the run it started
  # finishes, so the waiting one dispatches main's tip then, which contains
  # every merge it replaced. A pending pr-require-checks run is never
  # cancelled: babysit_postmerge.py and post-merge-demotion-alert.yml both
  # count a cancelled full run as red. Every other event takes a group of its
  # own and does not wait.
  dispatch-full-run:
    needs: [merge]
    if: >-
      !cancelled()
      && ((needs.merge.result == 'success' && needs.merge.outputs.dispatch == 'true'
      && github.event_name != 'pull_request_target')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    concurrency:
      group: ${{ github.event_name == 'push' && 'pr-merge-verify-main' || format('pr-merge-dispatch-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # A push job waits for the full run, whose longest lane is capped at 16
    # minutes, plus time in the runner queue.
    timeout-minutes: 45
    permissions:
      actions: write # start pr-require-checks.yml on main, read its status, and send a red one to post-merge-demotion-alert.yml
    steps:
      # At most three POSTs. A rate-limited 403 or 429 waits as GitHub
      # documents: retry-after seconds, else until one second past
      # x-ratelimit-reset while remaining is 0, else 60 s (a secondary
      # limit). No response is sent again, after a full-jitter backoff (up to
      # 10 s, then 20 s), only when gh's error shows the connection failed
      # before the request went out: a `dial tcp` error (a DNS lookup, a
      # refused or unreachable connection, a connect timeout) or a failed TLS
      # handshake. Any other answer, a 5xx, a timeout or a reset on an open
      # connection included, is not sent again: the run may exist, and a
      # second run would have no record. The waits sum to
      # at most WAIT_CAP seconds; one that does not fit is not taken. A
      # dispatch that still fails sets no run id and ends green with a
      # warning: nothing is recorded or waited on, and the next push, or the
      # post-merge-dispatch job's check on the next scheduled run for a lane
      # merge, starts the run.
      # WAIT_CAP: 45 minutes, less the wait step's 39 and about 1 for the
      # reads and uploads, leaves 5; 180 s of it.
      - name: Start the full CI run on main
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WAIT_CAP: 180
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            what="merge $GITHUB_SHA"
          else
            what="main (this run started at $GITHUB_SHA)"
          fi
          # A header of the last response, by case-insensitive name.
          header() { awk -F': *' -v n="$1" 'tolower($1) == n { sub(/\r$/, "", $2); print $2; exit }' <<<"$hdr"; }
          id='' why='' waited=0
          for try in 1 2 3; do
            code=0
            out=$(gh api -i -X POST "repos/$REPO/actions/workflows/pr-require-checks.yml/dispatches" \
              -f ref=main -F return_run_details=true 2>"$RUNNER_TEMP/dispatch-stderr") || code=$?
            cat "$RUNNER_TEMP/dispatch-stderr" >&2
            hdr=$(sed '/^\r\?$/q' <<<"$out")
            body=$(sed '1,/^\r\?$/d' <<<"$out")
            status=$(awk 'NR == 1 { print $2 }' <<<"$hdr")
            if [ "$code" = 0 ]; then
              id=$(jq -r '.workflow_run_id // ""' <<<"$body" 2>/dev/null || true)
              if [[ ! $id =~ ^[1-9][0-9]{0,14}$ ]]; then
                id='' why="the dispatch returned no run id"
              fi
              break
            fi
            wait=
            if [[ $status =~ ^(403|429)$ ]]; then
              message=$(jq -r '.message // ""' <<<"$body" 2>/dev/null || true)
              after=$(header retry-after) left=$(header x-ratelimit-remaining) reset=$(header x-ratelimit-reset)
              why="HTTP $status: ${message:-no message} (retry-after=${after:-none} remaining=${left:-none} reset=${reset:-none})"
              if [[ $after =~ ^[0-9]+$ ]]; then
                wait=$after
              elif [ "$left" = 0 ] && [[ $reset =~ ^[0-9]+$ ]]; then
                wait=$((reset - $(date +%s)))
                if ((wait < 0)); then wait=0; fi
                wait=$((wait + 1))
              elif [ "$left" = 0 ] || [[ ${message,,} == *"rate limit"* ]]; then
                wait=60
              fi
            elif [ -z "$status" ]; then
              error=$(tail -n 1 "$RUNNER_TEMP/dispatch-stderr")
              if grep -qE 'dial tcp|tls: (handshake|first record)' "$RUNNER_TEMP/dispatch-stderr"; then
                why="the connection failed before the request was sent (gh exit $code: $error)"
                wait=$((RANDOM % (10 * 2 ** (try - 1)) + 1))
              else
                why="no response (gh exit $code: ${error:-no error text}), and the request may have been sent; not sent again"
              fi
            else
              why="HTTP $status, not sent again"
            fi
            if [ -z "$wait" ] || [ "$try" = 3 ]; then
              break
            fi
            if ((waited + wait > WAIT_CAP)); then
              why="$why; a ${wait}s wait does not fit the ${WAIT_CAP}s this job allows (${waited}s spent)"
              break
            fi
            echo "::notice::attempt $try: $why; waiting ${wait}s, then sending again"
            sleep "$wait"
            waited=$((waited + wait))
          done
          if [ -z "$id" ]; then
            echo "::warning::no full CI run started for $what after $try attempt(s): $why; the next push or scheduled pr-merge run starts one"
            exit 0
          fi
          echo "started run $id"
          echo "{\"dispatcher_run_id\":$GITHUB_RUN_ID,\"run_id\":$id}" >"$RUNNER_TEMP/dispatched.json"
          echo "run-id=$id" >>"$GITHUB_OUTPUT"

      # The post-merge check counts a full run started by github-actions[bot]
      # only when a pr-merge.yml run on main uploaded an artifact naming it.
      # Only this run's own steps can upload this run's artifacts.
      - name: Record the dispatched run
        if: steps.dispatch.outputs.run-id != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-merge-dispatched-${{ steps.dispatch.outputs.run-id }}
          path: ${{ runner.temp }}/dispatched.json
          retention-days: 90
          if-no-files-found: error

      # Holds the push group until the run finishes, so a burst of merges
      # waits here as one pending job. One REST read every three minutes, 13
      # over 39 minutes; the run's result is the merge job's post-merge
      # check's to judge, not this job's.
      # A red run raises no workflow_run event (this token started it), so
      # this step sends its id and head SHA (which keys the alert's
      # concurrency group) to post-merge-demotion-alert.yml, which waits
      # for a re-run before it files or reports anything. Red is any
      # conclusion in babysit_postmerge.py's FAILED_CONCLUSIONS: a cancel on
      # a time-budget overrun is red too. Every merge is a push to main, so
      # every merge's run passes here.
      - name: Wait for the full run to finish
        if: github.event_name == 'push' && steps.dispatch.outputs.run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.dispatch.outputs.run-id }}
        run: |
          set -euo pipefail
          for _ in $(seq 13); do
            sleep 180
            state=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.status + " " + .head_sha + " " + (.conclusion // "")') || continue
            read -r status head_sha conclusion <<<"$state"
            if [ "$status" = completed ]; then
              echo "run $RUN_ID completed: $conclusion"
              if [[ "$conclusion" =~ ^(failure|timed_out|cancelled|startup_failure|action_required)$ ]] &&
                ! gh api -X POST "repos/$REPO/actions/workflows/post-merge-demotion-alert.yml/dispatches" \
                  -f ref=main -f "inputs[run-id]=$RUN_ID" -f "inputs[head-sha]=$head_sha" >/dev/null; then
                echo "::error::could not send run $RUN_ID to post-merge-demotion-alert.yml; the next scheduled full run reports a red that lasts"
                exit 1
              fi
              exit 0
            fi
          done
          echo "::warning::run $RUN_ID did not finish within 39 minutes; releasing the group"

  # Each candidate the gate judged shows its verdict on its head as one
  # `pr-merge / gate` check run: neutral, titled with the top refusal, or
  # success over a refusal once enqueued or merged. Not `ci-status`, so never
  # required. One GraphQL read per 50 candidates; a write only where the title
  # or conclusion changed. Rules: .github/scripts/pr-merge/gate-check.mjs.
  #
  # A job of its own, because the main ruleset requires `ci-status` from the
  # GitHub Actions app, the app every GITHUB_TOKEN posts as: a token with
  # checks: write could pass that check, so only this job, which runs nothing
  # but main's check writer and holds no lane token, gets it. Its runs wait in
  # line like the merge job's, so two never write at once and none is
  # cancelled onto a PR head; every step after the checkout cannot fail it.
  gate-check:
    needs: [merge]
    if: always() && needs.merge.outputs.gate-rows == 'true'
    concurrency:
      group: pr-merge-gate-check
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out main
      checks: write
      pull-requests: read # write only at each candidate's current head
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      - name: Read the gate's rows
        id: rows
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-merge-gate-rows
          path: ${{ runner.temp }}/rows

      - name: Show each candidate's refusal as a check run
        if: steps.rows.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_PATH: ${{ runner.temp }}/rows/pr-merge-summary.json
        run: node .base/.github/scripts/pr-merge/gate-check.mjs
