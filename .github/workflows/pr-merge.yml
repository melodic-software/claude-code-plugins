name: PR Merge
run-name: "${{ inputs.pr && format('PR Merge: arm #{0}', inputs.pr) || '' }}"

on:

  # Runs this file as it is on main; the job below never checks out the PR's code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [unlabeled]

  workflow_dispatch:
    inputs:
      pr:
        description: "Arm only this pull request (number); empty runs the full sweep"
        type: string
        required: false

  schedule:
    - cron: "11,41 * * * *"

  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

env:
  # The legacy FAILs file the verdict reader takes from the default branch:
  # https://github.com/melodic-software/claude-code-plugins/blob/main/docs/conventions/pr-pipeline/README.md
  BABYSIT_VERIFY_LEGACY_FAILS: ${{ github.workspace }}/.base/.github/verify-legacy-fails.json

jobs:
  dispatch-post-merge-runs:
    name: Dispatch Post Merge Runs
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && !inputs.pr
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: write # read full runs and their records; start pr-require-checks.yml on main, re-run a red lane-dispatched run, and send a red one to post-merge-file-demotion-issues.yml
      checks: read
      issues: read # read the demotion records the merge floor depends on
    outputs:
      rate-limited: ${{ steps.post-merge.outputs.rate-limited || steps.cover.outputs.stop || steps.dispatch.outputs.stop || steps.rerun.outputs.stop || steps.close.outputs.stop || steps.alert.outputs.stop }}
      paced: ${{ steps.pace.outputs.paced }}
      standards-sha: ${{ steps.standards.outputs.sha }}
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the standards commit
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          checkout: 'false'

      - name: Write the source-control trust settings
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@main
        with:
          drop-in-file: .base/.github/source-control-settings.json
          drop-in-name: 50-source-control

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Read the pace override from the base config
        if: steps.kill.outputs.proceed == 'true'
        continue-on-error: true
        run: |
          yq -o=json '{"limits": {"api": (.limits.api // {})}}' .base/docs/conventions/pr-pipeline.yaml >"$RUNNER_TEMP/pace-config.json"

      - name: Pace the tick on the GITHUB_TOKEN burn rate
        id: pace
        if: steps.kill.outputs.proceed == 'true'
        continue-on-error: true
        env:
          RESOLVED_CONFIG: ${{ runner.temp }}/pace-config.json
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PACE_WORK_STEP: Mark this tick's work done
        run: node .base/.github/actions/log-api-budget/pace.mjs

      - name: Read report-only
        id: mode
        if: steps.kill.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          config=.base/docs/conventions/pr-pipeline.yaml
          if [[ $(yq '.merge."report-only"' "$config") =~ ^(false|null)$ ]] ||
            [ "$(yq '.merge.dependabot.mode // "off"' "$config")" = enforce ]; then
            echo "live=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::the lane is report-only; no full CI run started"
          fi

      - name: Read the lane records the last run kept
        if: steps.mode.outputs.live == 'true'
        continue-on-error: true
        env:
          PR_MERGE_MAIN_TIP: ${{ steps.tip.outputs.unambiguous-sha }}
          ACTIONS_TOKEN: ${{ github.token }}
          LANE_RECORDS_PATH: ${{ runner.temp }}/lane-records.json
          PR_MERGE_READS_PATH: ${{ runner.temp }}/pr-merge-reads.json
        run: node .base/.github/scripts/pr-merge/lane-records.mjs read

      - name: Read the post-merge report the last run kept
        if: steps.mode.outputs.live == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          PR_MERGE_MAIN_TIP: ${{ steps.tip.outputs.unambiguous-sha }}
          ACTIONS_TOKEN: ${{ github.token }}
          LAST_REPORT_DIR: ${{ runner.temp }}/post-merge-last
          PR_MERGE_READS_PATH: ${{ runner.temp }}/pr-merge-reads.json
        run: node .base/.github/scripts/pr-merge/last-report.mjs

      - name: Check earlier lane merges
        id: post-merge
        if: steps.mode.outputs.live == 'true'
        env:
          MAIN_TIP_SHA: ${{ steps.tip.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          BABYSIT_POSTMERGE_LANE_RECORDS: ${{ runner.temp }}/lane-records.json
          BABYSIT_POSTMERGE_ATTEMPTS: ${{ runner.temp }}/post-merge-attempts.json
          BABYSIT_POSTMERGE_ANCHOR: ${{ runner.temp }}/post-merge-anchor/anchor.json
          BABYSIT_DEMOTION_RECOVERIES: ${{ runner.temp }}/demotion-recoveries.json
          BABYSIT_DEMOTION_RECOVERIES_WRITE_ENABLED: 'true'
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          last=$RUNNER_TEMP/post-merge-last
          scripts=.base/plugins/source-control/skills/babysit-prs/scripts
          code='' code_sha=''
          mkdir -p "$RUNNER_TEMP/post-merge-anchor"
          # The completed attempts the last check read, which the check
          # answers with no read (babysit_postmerge.py ATTEMPTS_ENV), and the
          # recoveries it proved; both kept below whether or not the check runs.
          [ ! -f "$last/attempts.json" ] || cp "$last/attempts.json" "$RUNNER_TEMP/post-merge-attempts.json"
          [ ! -f "$last/demotion-recoveries.json" ] || cp "$last/demotion-recoveries.json" "$RUNNER_TEMP/demotion-recoveries.json"
          # An idle tick: the last run's report, from a check that passed
          # (exit 0 or 5), stands while the lane room's reuse rule keeps it
          # and nothing else the check reads has moved (settle --idle-tick).
          # Its computedAt, code and commit are kept as they were, so the
          # reuse ends SHARED_MAX_AGE after the check that made it.
          if [ -f "$last/post-merge.json" ] && [ -f "$last/post-merge-code" ]; then
            last_code=$(cat "$last/post-merge-code")
            last_sha=$(cat "$last/post-merge-code-sha" 2>/dev/null || true)
            if [[ $last_code =~ ^[05]$ ]] &&
              python3 "$scripts/babysit_verify_evidence.py" settle --idle-tick --repo "$REPO" \
                --postmerge-result "$last/post-merge.json" --code-sha "$last_sha"; then
              cp "$last/post-merge.json" "$RUNNER_TEMP/post-merge.json"
              code=$last_code code_sha=$last_sha
              echo "::notice::the last run's post-merge check (exit $code) still stands: nothing it reads has moved; reused, not run again"
            fi
          fi
          if [ -z "$code" ]; then
            identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
            code=0
            python3 "$scripts/babysit_postmerge.py" \
              --repo "$REPO" --agent-identity "$identity" --lane-merges-only \
              </dev/null >"$RUNNER_TEMP/post-merge.json" || code=$?
            if jq -e '.recoveries | keys | any(split("|")[2] == "OPEN")' \
              "$RUNNER_TEMP/demotion-recoveries.json" >/dev/null 2>&1; then
              echo "close-cleared=true" >>"$GITHUB_OUTPUT"
            fi
          fi
          echo "::group::post-merge check: exit $code"
          cat "$RUNNER_TEMP/post-merge.json"
          echo "::endgroup::"
          # 1 (a failure) and 5 (not yet verified) are verdicts; 2, 3 and 4
          # mean the check could not judge. A full run starts only when the
          # JSON asks for one: an unlisted-record hold asks once per merge.
          needs=$(jq '.needsDispatch == true' "$RUNNER_TEMP/post-merge.json" 2>/dev/null || echo false)
          case $code in
            2 | 3 | 4) echo "::warning::the post-merge check exited $code (2 refused, 3 unreadable, 4 write failed); needsDispatch=$needs" ;;
            75)
              # The stop it recorded in the job's stop file (babysit_gh.py), for
              # the merge and enable-auto-merge jobs, which read on this token
              # too, and its cause: a server error hold (a 5xx whose only
              # signal was Retry-After) is named so.
              . .base/.github/actions/log-api-budget/api-budget.bash
              . .base/.github/scripts/pr-merge/rate-stop.bash
              stop=$(rate_stop_label)
              needs=false
              if server=$(rate_stop_server); then
                echo "::error title=GitHub server error::the post-merge check stopped on $(rate_stop_cause); no full run is started or re-run"
                echo "rate-limited=$stop, held on HTTP $server with a Retry-After" >>"$GITHUB_OUTPUT"
              else
                echo "::error::the post-merge check stopped on a GitHub rate limit; no full run is started or re-run"
                echo "rate-limited=${stop:-an unrecorded pool until its reset}" >>"$GITHUB_OUTPUT"
              fi
              ;;
          esac
          if [[ $(jq -r '.hold // ""' "$RUNNER_TEMP/post-merge.json" 2>/dev/null || true) == recovery-unrecorded ]]; then
            echo "::error::the post-merge hold's recovery run has no pr-merge-dispatched record either; no further full run starts: $(jq -r '.reason // ""' "$RUNNER_TEMP/post-merge.json")"
          fi
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "needs-dispatch=$needs" >>"$GITHUB_OUTPUT"
          rerun=$(jq -r '[.reruns[]? | select(.laneDispatched == true) | .runId][0] // ""' "$RUNNER_TEMP/post-merge.json" 2>/dev/null || true)
          echo "lane-rerun=$rerun" >>"$GITHUB_OUTPUT"
          # The report kept below: the check's JSON, its exit code, the lane
          # records it read and proved, and the commit whose code ran it
          # (none if unreadable, which the readers refuse).
          kept=$RUNNER_TEMP/post-merge-report
          mkdir -p "$kept"
          cp "$RUNNER_TEMP/post-merge.json" "$kept/post-merge.json"
          echo "$code" >"$kept/post-merge-code"
          git -C .base rev-parse HEAD >"$kept/post-merge-code-sha" || true
          # A reused report keeps the commit whose code made it.
          [ -z "$code_sha" ] || echo "$code_sha" >"$kept/post-merge-code-sha"
          [ ! -f "$RUNNER_TEMP/lane-records.json" ] || cp "$RUNNER_TEMP/lane-records.json" "$kept/lane-records.json"
          [ ! -f "$RUNNER_TEMP/post-merge-attempts.json" ] || cp "$RUNNER_TEMP/post-merge-attempts.json" "$kept/attempts.json"
          [ ! -f "$RUNNER_TEMP/demotion-recoveries.json" ] || cp "$RUNNER_TEMP/demotion-recoveries.json" "$kept/demotion-recoveries.json"
          # A rate-limit stop fails the job red once the outputs are written.
          [ "$code" != 75 ] || exit 1

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          steps.post-merge.conclusion == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/post-merge-report/

      - name: Keep the post-merge report for enable-auto-merge
        if: >-
          (steps.post-merge.conclusion == 'success') && steps.scan-upload.outputs.clean == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-post-merge-report
          path: ${{ runner.temp }}/post-merge-report/
          retention-days: 1
          if-no-files-found: error

      - name: Scan the upload for credentials
        id: scan-upload-5
        if: >-
          steps.post-merge.conclusion == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/post-merge-anchor/anchor.json

      - name: Keep the lane floor's anchor
        if: >-
          (steps.post-merge.conclusion == 'success') && steps.scan-upload-5.outputs.clean == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-post-merge-anchor
          path: ${{ runner.temp }}/post-merge-anchor/anchor.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Read main's full-run cover
        id: cover
        if: steps.kill.outputs.proceed == 'true' && steps.mode.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TIP: ${{ github.sha }}
          CAP_MINUTES: 30
        run: |
          set -euo pipefail
          . .base/.github/actions/log-api-budget/api-budget.bash
          . .base/.github/scripts/pr-merge/rate-stop.bash
          api_budget_wrap_gh github-token
          if ! runs=$(gh api "repos/$REPO/actions/workflows/pr-require-checks.yml/runs?branch=main&per_page=20" \
            --jq '[.workflow_runs[] | select((.event == "schedule" or .event == "workflow_dispatch") and .head_branch == "main" and .conclusion != "cancelled") | {sha: .head_sha, created: .created_at, lane: (.event == "workflow_dispatch" and .actor.login == "github-actions[bot]")}]' 2>"$RUNNER_TEMP/cover-stderr"); then
            cat "$RUNNER_TEMP/cover-stderr" >&2
            stop=$(rate_stop_from "$RUNNER_TEMP/cover-stderr" "the read of main's full runs")
            if [ -n "$stop" ]; then
              echo "::error title=GitHub rate limit::the read of main's full runs was rate limited ($stop); nothing more is sent"
              echo "rate-limited=true" >>"$GITHUB_OUTPUT"
              echo "stop=$stop" >>"$GITHUB_OUTPUT"
              exit 1
            fi
            echo "::warning::the read of main's full runs failed; no cap applies to this run"
            exit 0
          fi
          # The listing, for dispatch-post-merge-runs's cap bypass.
          printf '%s\n' "$runs" >"$RUNNER_TEMP/cover-runs.json"
          since=$(date -u -d "@$(($(date +%s) - CAP_MINUTES * 60))" +%Y-%m-%dT%H:%M:%SZ)
          recent=$(jq -r --arg since "$since" '[.[] | select(.created >= $since) | .created] | max // ""' <<<"$runs")
          if [ -n "$recent" ]; then
            echo "::notice::a full run of main was started at $recent, within $CAP_MINUTES minutes; the first push or scheduled pr-merge run after that window starts one for main's tip"
            echo "capped=true" >>"$GITHUB_OUTPUT"
          fi
          if ! jq -e --arg tip "$TIP" 'any(.[]; .sha == $tip)' <<<"$runs" >/dev/null; then
            echo "uncovered=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Find lane merges no full run covers
        id: bypass
        if: >-
          steps.cover.outputs.capped == 'true'
          && contains(fromJSON('["0","5"]'), steps.post-merge.outputs.code)
        run: |
          set -euo pipefail
          if [ "$(yq '.merge."full-run-cap-bypass"' .base/docs/conventions/pr-pipeline.yaml)" = false ]; then
            echo "::notice::merge.full-run-cap-bypass is false: the cap holds"
            exit 0
          fi
          report=$RUNNER_TEMP/post-merge.json runs=$RUNNER_TEMP/cover-runs.json
          [ -f "$report" ] && [ -f "$runs" ] || exit 0
          oldest=$(jq -r 'map(select(.lane) | .created) | min // ""' "$runs")
          uncovered=()
          while IFS=$'\t' read -r number sha at; do
            [[ $number =~ ^[1-9][0-9]*$ && $sha =~ ^[0-9a-f]{40}$ && $at =~ ^[0-9T:-]+Z$ ]] || continue
            git -C .base cat-file -e "$sha^{commit}" 2>/dev/null || continue
            [[ -n $oldest && ! $at < $oldest ]] || continue
            covered=''
            while IFS=$'\t' read -r run_sha created; do
              [[ $created < $at ]] && continue
              if ! git -C .base cat-file -e "$run_sha^{commit}" 2>/dev/null ||
                git -C .base merge-base --is-ancestor "$sha" "$run_sha"; then
                covered=1
                break
              fi
            done < <(jq -r '.[] | select(.lane) | [.sha, .created] | @tsv' "$runs")
            [ -n "$covered" ] || uncovered+=("#$number")
          done < <(jq -r '.autoMerges[]? | select(.verified != true)
            | select((.pending // []) | any(.[]; . == "dispatch-run-pending")
              and all(.[]; (startswith("dispatch-run-in-progress:") or startswith("attribution-pending:")) | not))
            | [.number, .mergeCommit, .mergedAt] | @tsv' "$report")
          if [ "${#uncovered[@]}" -gt 0 ]; then
            echo "::notice::no full run covers lane merge(s) ${uncovered[*]}; one run of main's tip starts inside the cap (merge.full-run-cap-bypass)"
            echo "bypass=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Start the full CI run on main
        id: dispatch
        if: >-
          steps.kill.outputs.proceed == 'true'
          && steps.mode.outputs.live == 'true'
          && steps.cover.outputs.rate-limited != 'true'
          && (steps.cover.outputs.capped != 'true' || steps.bypass.outputs.bypass == 'true')
          && (steps.post-merge.outputs.needs-dispatch == 'true' || steps.cover.outputs.uncovered == 'true' || steps.bypass.outputs.bypass == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WAIT_CAP: 180
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            what="merge $GITHUB_SHA"
          else
            what="main (this run started at $GITHUB_SHA)"
          fi
          # Each POST's rate-limit reading, for the job-end api-calls notice;
          # recorded only, never guarded, so the POST goes as it would
          # without the library, and without it nothing is recorded.
          . .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null || true
          # A header of the last response, by case-insensitive name.
          header() { awk -F': *' -v n="$1" 'tolower($1) == n { sub(/\r$/, "", $2); print $2; exit }' <<<"$hdr"; }
          id='' why='' waited=0
          for try in 1 2 3; do
            code=0
            out=$(gh api -i -X POST "repos/$REPO/actions/workflows/pr-require-checks.yml/dispatches" \
              -f ref=main -F return_run_details=true 2>"$RUNNER_TEMP/dispatch-stderr") || code=$?
            ! declare -F api_budget_read >/dev/null || api_budget_read github-token /dev/stdin "repos/{repo}/actions/workflows/{x}/dispatches" <<<"$out" >/dev/null
            cat "$RUNNER_TEMP/dispatch-stderr" >&2
            hdr=$(sed '/^\r\?$/q' <<<"$out")
            body=$(sed '1,/^\r\?$/d' <<<"$out")
            status=$(awk 'NR == 1 { print $2 }' <<<"$hdr")
            if [ "$code" = 0 ]; then
              id=$(jq -r '.workflow_run_id // ""' <<<"$body" 2>/dev/null || true)
              if [[ ! $id =~ ^[1-9][0-9]{0,14}$ ]]; then
                id='' why="the dispatch returned no run id"
              fi
              break
            fi
            wait=
            if [[ $status =~ ^(403|429)$ ]]; then
              message=$(jq -r '.message // ""' <<<"$body" 2>/dev/null || true)
              after=$(header retry-after) left=$(header x-ratelimit-remaining) reset=$(header x-ratelimit-reset)
              why="HTTP $status: ${message:-no message} (retry-after=${after:-none} remaining=${left:-none} reset=${reset:-none})"
              if [ "$status" = 429 ] || [[ $after =~ ^[0-9]+$ ]] || [ "$left" = 0 ] || [[ ${message,,} =~ rate\ limit|abuse\ detection ]]; then
                now=$(date +%s) until='' resource=$(header x-ratelimit-resource) pool="every pool"
                if [[ $after =~ ^[0-9]+$ ]]; then until=$((now + after)); fi
                if [ "$left" = 0 ] && [[ $reset =~ ^[0-9]+$ ]] && ((reset > ${until:-0})); then until=$reset; fi
                secondary=''
                if [[ ${message,,} =~ secondary\ rate\ limit|abuse\ detection ]]; then secondary=1; fi
                # As rate-guard.mjs classify: a secondary limit is not per
                # resource, whatever remaining says.
                if ! [[ $after =~ ^[0-9]+$ ]] && [ "$left" = 0 ] && [ -z "$secondary" ]; then
                  [[ $resource =~ ^[a-z_]+$ ]] || resource=core
                  pool="the $resource pool"
                fi
                # No header time ahead, as rate-guard.mjs classify: a secondary
                # limit or a past header time waits the minute, any other the hour.
                if [ -z "$until" ]; then
                  if [ -n "$secondary" ]; then until=$((now + 60)); else until=$((now + 3600)); fi
                elif ((until <= now)); then
                  until=$((now + 60))
                fi
                when=$(date -u -d "@$until" +%Y-%m-%dT%H:%M:%SZ)
                echo "::error title=GitHub rate limit::$pool is exhausted ($why); nothing more is sent before $when"
                echo "rate-limited=true" >>"$GITHUB_OUTPUT"
                echo "stop=$pool until $when" >>"$GITHUB_OUTPUT"
                exit 1
              fi
            elif [ -z "$status" ]; then
              error=$(tail -n 1 "$RUNNER_TEMP/dispatch-stderr")
              if grep -qE 'dial tcp|tls: (handshake|first record)|net/http: TLS handshake timeout' "$RUNNER_TEMP/dispatch-stderr"; then
                why="the connection failed before the request was sent (gh exit $code: $error)"
                wait=$((RANDOM % (10 * 2 ** (try - 1)) + 1))
              else
                why="no response (gh exit $code: ${error:-no error text}), and the request may have been sent; not sent again"
              fi
            else
              why="HTTP $status, not sent again"
            fi
            if [ -z "$wait" ] || [ "$try" = 3 ]; then
              break
            fi
            if ((waited + wait > WAIT_CAP)); then
              why="$why; a ${wait}s wait does not fit the ${WAIT_CAP}s this job allows (${waited}s spent)"
              break
            fi
            echo "::notice::attempt $try: $why; waiting ${wait}s, then sending again"
            sleep "$wait"
            waited=$((waited + wait))
          done
          if [ -z "$id" ]; then
            echo "::warning::no full CI run started for $what after $try attempt(s): $why; the next scheduled pr-merge run starts one for main's tip"
            exit 0
          fi
          echo "started run $id"
          echo "{\"dispatcher_run_id\":$GITHUB_RUN_ID,\"run_id\":$id}" >"$RUNNER_TEMP/dispatched.json"
          echo "run-id=$id" >>"$GITHUB_OUTPUT"

      - name: Scan the upload for credentials
        id: scan-upload-2
        if: >-
          steps.dispatch.outputs.run-id != ''
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/dispatched.json

      - name: Record the dispatched run
        if: >-
          (steps.dispatch.outputs.run-id != '') && steps.scan-upload-2.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-dispatched-${{ steps.dispatch.outputs.run-id }}
          path: ${{ runner.temp }}/dispatched.json
          retention-days: 30
          if-no-files-found: error

      - name: Re-run a red lane-dispatched full run
        id: rerun
        if: >-
          !cancelled()
          && steps.cover.outputs.rate-limited != 'true'
          && steps.dispatch.outputs.rate-limited != 'true'
          && contains(fromJSON('["0","1","5"]'), steps.post-merge.outputs.code)
          && steps.post-merge.outputs.lane-rerun != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.post-merge.outputs.lane-rerun }}
        run: |
          set -euo pipefail
          if [[ ! $RUN_ID =~ ^[1-9][0-9]{0,14}$ ]]; then
            echo "::error::the post-merge check named no run id to re-run: $RUN_ID"
            exit 1
          fi
          # Every gh call goes through the shared rate guard, which records a
          # 403 or 429 rate limit in the job's stop file and refuses the pool
          # after it. A call it stopped ends the step red, with the stop as
          # this job's rate-limited output.
          . .base/.github/actions/log-api-budget/api-budget.bash
          . .base/.github/scripts/pr-merge/rate-stop.bash
          api_budget_wrap_gh github-token
          err=$RUNNER_TEMP/rerun-stderr
          stopped() {
            local stop
            cat "$err" >&2
            stop=$(rate_stop_from "$err" "$1")
            [ -n "$stop" ] || return 0
            echo "::error title=GitHub rate limit::$1 was rate limited ($stop); nothing more is sent and nothing recorded"
            echo "rate-limited=true" >>"$GITHUB_OUTPUT"
            echo "stop=$stop" >>"$GITHUB_OUTPUT"
            exit 1
          }
          if ! attempt=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_attempt 2>"$err"); then
            stopped "the read of run $RUN_ID"
            echo "::error::the read of run $RUN_ID failed; no re-run started or recorded"
            exit 1
          fi
          if [ "$attempt" != 1 ]; then
            echo "::notice::run $RUN_ID is at attempt $attempt; no re-run started or recorded"
            exit 0
          fi
          # As the dispatch: at most three POSTs, sent again after a capped
          # full-jitter wait only when gh's error shows the request never
          # left; a rate limit stops above and is never sent again.
          for try in 1 2 3; do
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs" >/dev/null 2>"$err" && break
            stopped "the re-run of run $RUN_ID"
            if [ "$try" = 3 ] || ! grep -qE 'dial tcp|tls: (handshake|first record)|net/http: TLS handshake timeout' "$err"; then
              echo "::warning::the re-run of run $RUN_ID was refused after $try attempt(s); the next run tries again"
              exit 0
            fi
            wait=$((RANDOM % (10 * 2 ** (try - 1)) + 1))
            echo "::notice::attempt $try: the connection failed before the re-run was sent; waiting ${wait}s, then sending again"
            sleep "$wait"
          done
          # The re-run started, so a read that fails or still shows attempt 1
          # is retried for about three minutes, and a step that cannot confirm
          # attempt 2 fails instead of leaving that attempt unrecorded. A read
          # refused for a rate limit is never retried.
          for wait in 0 5 10 20 30 45 60; do
            sleep "$wait"
            if attempt=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_attempt 2>"$err"); then
              [ "$attempt" = 1 ] || break
            else
              stopped "the read-back of run $RUN_ID's re-run"
              attempt=
            fi
          done
          if [ -z "$attempt" ]; then
            echo "::error::the re-run of run $RUN_ID started, but its attempt could not read back; nothing recorded"
            exit 1
          fi
          if [ "$attempt" = 1 ]; then
            echo "::error::the re-run of run $RUN_ID started, but the run still reads attempt 1; nothing recorded"
            exit 1
          fi
          if [ "$attempt" != 2 ]; then
            echo "::warning::run $RUN_ID reads attempt $attempt after the re-run, not 2; nothing recorded"
            exit 0
          fi
          echo "re-ran run $RUN_ID as attempt 2"
          echo "{\"rerunner_run_id\":$GITHUB_RUN_ID,\"run_id\":$RUN_ID,\"attempt\":2}" >"$RUNNER_TEMP/rerun.json"
          echo "recorded=true" >>"$GITHUB_OUTPUT"

      - name: Scan the upload for credentials
        id: scan-upload-3
        if: >-
          !cancelled() && steps.rerun.outputs.recorded == 'true'
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/rerun.json

      - name: Record the re-run
        if: >-
          (!cancelled() && steps.rerun.outputs.recorded == 'true') && steps.scan-upload-3.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-rerun-${{ steps.post-merge.outputs.lane-rerun }}-attempt-2
          path: ${{ runner.temp }}/rerun.json
          retention-days: 90
          if-no-files-found: error

      - name: Send a red full run to the demotion alert
        id: alert
        if: >-
          !cancelled()
          && steps.kill.outputs.proceed == 'true'
          && steps.mode.outputs.live == 'true'
          && steps.post-merge.outputs.code != '75'
          && steps.cover.outputs.rate-limited != 'true'
          && steps.dispatch.outputs.rate-limited != 'true'
          && steps.rerun.outputs.rate-limited != 'true'
        env:
          MAIN_TIP_SHA: ${{ steps.tip.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LOOKBACK_HOURS: 6
        run: |
          set -euo pipefail
          . .base/.github/actions/log-api-budget/api-budget.bash
          . .base/.github/scripts/pr-merge/rate-stop.bash
          api_budget_wrap_gh github-token
          err=$RUNNER_TEMP/alert-stderr
          stopped() {
            local stop
            cat "$err" >&2
            stop=$(rate_stop_from "$err" "$1")
            [ -n "$stop" ] || return 0
            echo "::error title=GitHub rate limit::$1 was rate limited ($stop); nothing more is sent"
            echo "rate-limited=true" >>"$GITHUB_OUTPUT"
            echo "stop=$stop" >>"$GITHUB_OUTPUT"
            exit 1
          }
          since=$(date -u -d "@$(($(date +%s) - LOOKBACK_HOURS * 3600))" +%Y-%m-%dT%H:%M:%SZ)
          if ! runs=$(gh api "repos/$REPO/actions/workflows/pr-require-checks.yml/runs?event=workflow_dispatch&branch=main&created=%3E%3D$since&per_page=100" \
            --jq '.workflow_runs | sort_by(.id) | .[] | select(.actor.login == "github-actions[bot]" and .head_branch == "main") | [.id, .run_attempt, .status, (.conclusion // "none"), .head_sha] | @tsv' 2>"$err"); then
            stopped "the listing of main's full runs"
            echo "::warning::the listing of main's full runs failed; the next run sends any red one"
            exit 0
          fi
          while IFS=$'\t' read -r id attempt status conclusion sha; do
            [[ $id =~ ^[1-9][0-9]{0,14}$ && $sha =~ ^[0-9a-f]{40}$ ]] || continue
            if [ "$attempt" != 1 ]; then
              if ! state=$(gh api "repos/$REPO/actions/runs/$id/attempts/1" --jq '.status + " " + (.conclusion // "none")' 2>"$err"); then
                stopped "the read of run $id attempt 1"
                echo "::warning::the read of run $id attempt 1 failed; the next run tries again"
                continue
              fi
              read -r status conclusion <<<"$state"
            fi
            [ "$status" = completed ] || continue
            [[ $conclusion =~ ^(failure|timed_out|cancelled|startup_failure|action_required)$ ]] || continue
            if [ "$conclusion" = cancelled ]; then
              if ! jobs=$(gh api "repos/$REPO/actions/runs/$id/attempts/1/jobs?per_page=1" --jq .total_count 2>"$err"); then
                stopped "the jobs read of run $id"
                echo "::warning::the jobs read of run $id failed; the next run tries again"
                continue
              fi
              if [ "$jobs" = 0 ]; then
                echo "run $id was replaced before it started: no signal"
                continue
              fi
            fi
            # Already sent only when pr-merge.yml's own dispatch-post-merge-runs on
            # main uploaded the record (_Context.lane_alerted, the sender rule
            # of the dispatch and re-run records): a same-name artifact any
            # other run uploads is no record. 0 sent, 4 not sent, 75 a rate
            # limit. Only 4 sends: 1 (a crash), 3 (a failed read) and any other
            # code leave the run to the next run, so a broken check never sends
            # the same run again each tick.
            code=0
            python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_postmerge.py \
              --repo "$REPO" --branch main --lane-alerted "$id" </dev/null >/dev/null 2>"$err" || code=$?
            case $code in
              0) continue ;;
              4) ;;
              75)
                stopped "the record read of run $id"
                echo "::error title=GitHub rate limit::the record read of run $id was rate limited (an unrecorded pool until its reset); nothing more is sent"
                echo "rate-limited=true" >>"$GITHUB_OUTPUT"
                echo "stop=an unrecorded pool until its reset" >>"$GITHUB_OUTPUT"
                exit 1
                ;;
              *)
                cat "$err" >&2
                echo "::warning::the record read of run $id failed (exit $code); the next run tries again"
                continue
                ;;
            esac
            # As the dispatch: at most three sends, sent again after a capped
            # full-jitter wait only when gh's error shows the request never
            # left. A rate limit is never sent again.
            for try in 1 2 3; do
              if gh api -X POST "repos/$REPO/actions/workflows/post-merge-file-demotion-issues.yml/dispatches" \
                -f ref=main -f "inputs[run-id]=$id" -f "inputs[head-sha]=$sha" >/dev/null 2>"$err"; then
                echo "sent run $id ($conclusion) to post-merge-file-demotion-issues.yml"
                echo "{\"alerter_run_id\":$GITHUB_RUN_ID,\"run_id\":$id}" >"$RUNNER_TEMP/alerted.json"
                echo "run-id=$id" >>"$GITHUB_OUTPUT"
                exit 0
              fi
              stopped "the send of run $id to post-merge-file-demotion-issues.yml"
              if [ "$try" = 3 ] || ! grep -qE 'dial tcp|tls: (handshake|first record)|net/http: TLS handshake timeout' "$err"; then
                break
              fi
              wait=$((RANDOM % (10 * 2 ** (try - 1)) + 1))
              echo "::notice::attempt $try: the connection failed before the send; waiting ${wait}s, then sending again"
              sleep "$wait"
            done
            echo "::warning::could not send run $id to post-merge-file-demotion-issues.yml after $try attempt(s); the next run tries again"
            exit 0
          done <<<"$runs"

      - name: Scan the upload for credentials
        id: scan-upload-4
        if: >-
          !cancelled() && steps.alert.outputs.run-id != ''
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/alerted.json

      - name: Record the alert sent
        if: >-
          (!cancelled() && steps.alert.outputs.run-id != '') && steps.scan-upload-4.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-alerted-${{ steps.alert.outputs.run-id }}
          path: ${{ runner.temp }}/alerted.json
          retention-days: 1
          if-no-files-found: error

      - name: Send a proven recovery to close-cleared
        id: close
        if: >-
          !cancelled()
          && steps.kill.outputs.proceed == 'true'
          && steps.mode.outputs.live == 'true'
          && steps.post-merge.outputs.close-cleared == 'true'
          && steps.post-merge.outputs.code != '75'
          && steps.cover.outputs.rate-limited != 'true'
          && steps.dispatch.outputs.rate-limited != 'true'
          && steps.rerun.outputs.rate-limited != 'true'
          && steps.alert.outputs.rate-limited != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          . .base/.github/actions/log-api-budget/api-budget.bash
          . .base/.github/scripts/pr-merge/rate-stop.bash
          api_budget_wrap_gh github-token
          err=$RUNNER_TEMP/close-stderr
          if gh api -X POST "repos/$REPO/actions/workflows/post-merge-file-demotion-issues.yml/dispatches" \
            -f ref=main -f "inputs[close-cleared]=true" >/dev/null 2>"$err"; then
            echo "sent the proven recoveries to close-cleared"
            exit 0
          fi
          cat "$err" >&2
          stop=$(rate_stop_from "$err" "the send to close-cleared")
          if [ -n "$stop" ]; then
            echo "::error title=GitHub rate limit::the send to close-cleared was rate limited ($stop)"
            echo "rate-limited=true" >>"$GITHUB_OUTPUT"
            echo "stop=$stop" >>"$GITHUB_OUTPUT"
            exit 1
          fi
          echo "::warning::could not send the proven recoveries to close-cleared; the next check that proves them, or the next scheduled full run, closes them"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  merge:
    name: Merge
    needs: [dispatch-post-merge-runs]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main' && github.event_name != 'push'
      && !inputs.pr
      && needs.dispatch-post-merge-runs.outputs.paced != 'true'
      && (github.event_name != 'pull_request_target'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.sender.type != 'Bot'))
    concurrency:
      group: pr-merge
      queue: max
      # queue: max keeps up to 100 pending; the default cancels the older pending run.
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    permissions:
      contents: read # check out main
      pull-requests: read # list the open PRs
      actions: read
      checks: read
      issues: read
      statuses: read # a lane stop's pr-unblock status (the lanes App holds no statuses permission)
      id-token: write # prove to the token broker which workflow this is
    outputs:
      gate-rows: ${{ steps.rows.outcome == 'success' }}
      dispatch: ${{ steps.mode.outputs.live == 'true' && steps.gate.outputs.dispatch == 'true' }}
      mended-heads: ${{ steps.clear.outputs.mended-heads }}
      eval-released: ${{ steps.release-eval.outputs.released }}
    steps:
      - name: Stop on dispatch-post-merge-runs's rate limit
        if: needs.dispatch-post-merge-runs.outputs.rate-limited != ''
        env:
          STOP: ${{ needs.dispatch-post-merge-runs.outputs.rate-limited }}
        run: |
          if [[ $STOP == *", held on HTTP 5"[0-9][0-9]" with a Retry-After" ]]; then
            echo "::error title=GitHub server error::dispatch-post-merge-runs stopped on a GitHub server error hold ($STOP); this job sends nothing to GitHub"
          else
            echo "::error title=GitHub rate limit::dispatch-post-merge-runs stopped on a GitHub rate limit ($STOP); this job sends nothing to GitHub"
          fi
          exit 1

      - name: Resolve main's tip
        id: tip
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main

      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          fetch-depth: 0
          persist-credentials: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.dispatch-post-merge-runs.outputs.standards-sha }}

      - name: Write the source-control trust settings
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@main
        with:
          drop-in-file: .base/.github/source-control-settings.json
          drop-in-name: 50-source-control

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .base/.python-version

      - name: Install the pinned YAML reader
        continue-on-error: true
        run: bash .base/.github/scripts/lib/install-pinned-pyyaml.sh 'PyYAML did not install; no workflow-file change binds its review this run'

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
        run: echo "::notice::the lanes kill switch stops this run (reason ${REASON:-unreadable}); nothing checked or merged"

      - name: Check who started the run
        id: who
        if: steps.kill.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
          ACTIONS_TOKEN: ${{ github.token }}
          ACTOR_ID: ${{ github.actor_id }}
          TRUSTED_ACTORS_PATH: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          STOP_NOTICE: nothing checked here, the next scheduled run checks every candidate
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/pr-merge/who.mjs

      - name: Check for a newer run that does this work
        id: superseded
        if: steps.who.outputs.proceed == 'true'
        continue-on-error: true
        env:
          API_BUDGET_TOKEN: github-token
          ACTIONS_TOKEN: ${{ github.token }}
          TRUSTED_ACTORS_PATH: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/pr-merge/superseded.mjs

      - name: Resolve the config
        id: config
        if: steps.who.outputs.proceed == 'true' && steps.superseded.outputs.superseded != 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: pr-merge
          activity: merge-pr
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          standards-path: ${{ steps.standards.outputs.path }}

      - name: Read report-only
        id: mode
        if: steps.config.outcome == 'success' && steps.config.outputs.applies == 'true'
        run: |
          set -euo pipefail
          config=.base/docs/conventions/pr-pipeline.yaml
          value=$(yq '.merge."report-only"' "$config")
          case "$value" in
            false | null) report_only=false ;;
            *) report_only=true ;;
          esac
          dependabot=$(yq '.merge.dependabot.mode // "off"' "$config")
          case "$dependabot" in
            report | enforce) ;;
            *) dependabot=off ;;
          esac
          live=false
          if [ "$report_only" = false ] || [ "$dependabot" = enforce ]; then
            live=true
          fi
          {
            echo "report-only=$report_only"
            echo "dependabot=$dependabot"
            echo "live=$live"
            echo "lane-prs=$(jq -r '.merge."lane-prs"' "$RUNNER_TEMP/resolved-config.json")"
            echo "gate-budget-minutes=$(yq '.merge."gate-budget-minutes" // ""' "$config")"
            echo "gate-candidate-minutes=$(yq '.merge."gate-candidate-minutes" // ""' "$config")"
            echo "gate-deferred-minutes=$(yq '.merge."gate-deferred-minutes" // ""' "$config")"
            echo "skip-max-minutes=$(yq '.merge."skip-unchanged"."max-minutes" // ""' "$config")"
            echo "skip-max-skips=$(yq '.merge."skip-unchanged"."max-skips" // ""' "$config")"
          } >>"$GITHUB_OUTPUT"

      - name: Report a lane the config turns off
        if: steps.config.outcome == 'success' && steps.config.outputs.applies != 'true'
        env:
          REASON: ${{ steps.config.outputs.skip-reason }}
        run: echo "::notice::merge-pr does not apply (${REASON:-no reason}); no lane token requested, nothing read or merged"

      - name: Request the lane token
        id: lane-token
        if: steps.config.outcome == 'success' && steps.config.outputs.applies == 'true'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: pr-merge
          activity: merge-pr
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}
          actions: ${{ steps.config.outputs.actions }}
          superseded-ok: true
          kill-switch-ok: true
          rate-limit-hold-ok: true

      - name: List the candidate PRs
        id: candidates
        if: steps.lane-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          API_BUDGET_HOLD: "1"
          REPO: ${{ github.repository }}
          DEPENDABOT: ${{ steps.mode.outputs.dependabot }}
          LANE_PRS: ${{ steps.mode.outputs.lane-prs }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          TRUSTED_ACTORS_PATH: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
        run: |
          set -euo pipefail
          identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          slug=${identity%\[bot\]}
          if ! [[ $slug =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::merge.agent-identity is not an App bot login: $identity"
            exit 1
          fi
          lanes=true
          [ "$LANE_PRS" != native ] || lanes=false
          dependabot=true
          [ "$DEPENDABOT" != off ] || dependabot=false
          # With adoption.idle-hours set, each trusted-actors.json account by
          # its numeric id, a person's User.databaseId or an App's
          # Bot.databaseId, so a renamed account still matches: the gate
          # adopts their pull requests (babysit_merge_policy.adoption_refusal)
          # and checks the id again. The lanes App (merge.agent-identity) and
          # Dependabot go by their own switches below whatever their ids.
          ids='[]'
          if [ -n "$(yq '.adoption."idle-hours" // ""' .base/docs/conventions/pr-pipeline.yaml)" ]; then
            ids=$(jq -c '[.actors[].id | select(type == "number" and . > 0 and . == floor)] | unique' "$TRUSTED_ACTORS_PATH")
          fi
          # The gate resolves the same label through babysit_postmerge._role_label.
          human_gated=needs-human
          if [ -f .base/docs/conventions/work-items.yaml ]; then
            human_gated=$(yq -o=json -I=0 '.tracker' .base/docs/conventions/work-items.yaml |
              jq -er '[objects | .config | objects | .role_labels | objects
              | .["human-gated"] | strings | gsub("^\\s+|\\s+$"; "")][0] // ""
              | if . == "" then "needs-human" else . end') || {
              echo "::error::cannot read the human-gated role label from the base docs/conventions/work-items.yaml"
              exit 1
            }
          fi
          # A failed read, a rate stop past the budget, a 200 that fails the
          # completeness check, or a listing past the page cap leaves the
          # listing unknown: this step ends green with a notice and `held`, the
          # steps that need the listing wait on `listed`, and the next scheduled
          # run is the probe. Only the sweep summary and cost run on `held`: no
          # step lists, demotes, files or dequeues, and a failed lane merge
          # waits for a run that lists. The summary's listing_held is what
          # monitor signal 12 counts. 60 s of waits covers the documented minute
          # of a secondary limit; a longer stop gains little over the next run.
          # A listing past the cap is not tried again: another try reads the
          # same. gh goes through the shared rate guard (api-budget.bash).
          . .base/.github/actions/log-api-budget/api-budget.bash
          . .base/.github/scripts/pr-merge/rate-stop.bash
          . .base/.github/scripts/pr-merge/retry-call.bash
          api_budget_wrap_gh github-token
          listing="$RUNNER_TEMP/listing.json"
          page_file="$RUNNER_TEMP/listing-page.json"
          # One GraphQL list of every open pull request into main, 100 a page
          # with the connection's totalCount on each page, kept by author
          # below. At most max_pages pages (1000 pull requests); a list with
          # more is cut short, so it leaves the retry at once and holds the
          # step below. Newest first.
          max_pages=10
          echo '[]' >"$listing"
          listing_full='' listing_fault=''
          list_open_prs() {
            local page=0 cursor='' total='' held more
            local -a after
            listing_fault=
            echo '[]' >"$listing"
            while :; do
              page=$((page + 1))
              after=()
              [ -z "$cursor" ] || after=(-f after="$cursor")
              # shellcheck disable=SC2016 # GraphQL variables, not shell ones
              gh api graphql -f owner="${REPO%/*}" -f name="${REPO#*/}" "${after[@]}" \
                -f query='query($owner: String!, $name: String!, $after: String) {
                  repository(owner: $owner, name: $name) {
                    pullRequests(states: OPEN, baseRefName: "main", first: 100, after: $after,
                        orderBy: {field: CREATED_AT, direction: DESC}) {
                      totalCount
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id number headRefOid isDraft updatedAt body
                        labels(first: 100) { nodes { name } }
                        author { __typename login ... on Bot { databaseId } ... on User { databaseId } }
                      } } } }' >"$page_file" || return 1
              # A 200 with errors, or without the connection, fails the try.
              jq -e '(.errors // [] | length) == 0
                  and (.data.repository.pullRequests | (.nodes | type) == "array"
                    and (.totalCount | type) == "number"
                    and (.pageInfo.hasNextPage | type) == "boolean")' "$page_file" >/dev/null || return 1
              jq -c --slurpfile page "$page_file" \
                '. + [$page[0].data.repository.pullRequests.nodes[] | .labels = .labels.nodes]' \
                "$listing" >"$listing.next" && mv "$listing.next" "$listing" || return 1
              # Every page must count the same total.
              held=$(jq '.data.repository.pullRequests.totalCount' "$page_file") || return 1
              if [ -n "$total" ] && [ "$held" != "$total" ]; then
                listing_fault="count mismatch"
                echo "the open count moved from $total to $held while listing" >&2
                return 1
              fi
              total=$held
              more=$(jq -r '.data.repository.pullRequests.pageInfo.hasNextPage' "$page_file") || return 1
              [ "$more" = true ] || break
              if [ "$page" -ge "$max_pages" ]; then
                listing_full=true
                return 0
              fi
              cursor=$(jq -r '.data.repository.pullRequests.pageInfo.endCursor // ""' "$page_file") || return 1
              [ -n "$cursor" ] || return 1
            done
            held=$(jq 'map(.number) | unique | length' "$listing") || return 1
            if [ "$held" != "$total" ]; then
              listing_fault="count mismatch"
              echo "the listing holds $held of $total open pull requests" >&2
              return 1
            fi
          }
          # The reason reaches a public issue: fixed text, never a call's stderr.
          reason=''
          if { [ "$lanes" = true ] || [ "$dependabot" = true ] || [ "$ids" != '[]' ]; } &&
            ! retry_call --read 60 list_open_prs; then
            reason="$retry_call_unknown${listing_fault:+ ($listing_fault)}"
          elif [ -n "$listing_full" ]; then
            reason="listing full: more than $((max_pages * 100)) open pull requests, so it is cut short"
          fi
          if [ -n "$reason" ]; then
            echo "::notice title=Merge lane hold::the open pull requests are unknown ($reason); this job gates, merges, re-readies, re-fires, files, dequeues and clears nothing; it still writes the sweep summary; the next scheduled run lists again"
            echo "held=true" >>"$GITHUB_OUTPUT"
            echo "held-reason=$reason" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull_request_target run gates only its own pull request, as the
          # listing holds it; the scheduled run gates every candidate.
          # The lanes App and Dependabot are Bots matched by login and kept by
          # their switches alone; every other author by its id. GraphQL gives
          # a Bot's login without the [bot] suffix. An author with no id (a
          # deleted account, a mannequin) matches nothing.
          jq -c --arg slug "$slug" --argjson lanes "$lanes" --argjson dependabot "$dependabot" --argjson ids "$ids" '
              [.[] | select(.author as $a | ($a.__typename // "") as $type | ($a.login // "" | ascii_downcase) as $login
                | if $type == "Bot" and $login == $slug then $lanes
                  elif $type == "Bot" and $login == "dependabot" then $dependabot
                  else ($a.databaseId // null) as $id | $id != null and any($ids[]; . == $id) end)
              | select(env.EVENT_PR == "" or (.number | tostring) == env.EVENT_PR)]' \
            <"$listing" >"$RUNNER_TEMP/authored.json"
          jq -c '[.[] | select(.isDraft | not)
              | {number, head: .headRefOid, updatedAt, labels: [.labels[].name], body}]
              | unique_by(.number)' "$RUNNER_TEMP/authored.json" |
            python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_merge_prefilter.py \
              --human-gated="$human_gated" >"$RUNNER_TEMP/prefilter.json"
          jq -c .candidates "$RUNNER_TEMP/prefilter.json" >"$RUNNER_TEMP/candidates.json"
          jq -c .held "$RUNNER_TEMP/prefilter.json" >"$RUNNER_TEMP/held.json"
          jq -c '[.[] | select(.isDraft) | {number, id, head: .headRefOid, updatedAt,
              labels: [.labels[].name]}] | unique_by(.number)' "$RUNNER_TEMP/authored.json" >"$RUNNER_TEMP/drafts.json"
          echo "count=$(jq length "$RUNNER_TEMP/candidates.json")" >>"$GITHUB_OUTPUT"
          echo "listed=true" >>"$GITHUB_OUTPUT"

      - name: Start after the candidate the last run reached
        if: steps.candidates.outputs.listed == 'true'
        continue-on-error: true
        env:
          API_BUDGET_TOKEN: github-token
          ACTIONS_TOKEN: ${{ github.token }}
          CANDIDATES_PATH: ${{ runner.temp }}/candidates.json
          PR_MERGE_READS_PATH: ${{ runner.temp }}/pr-merge-reads.json
        run: node .base/.github/scripts/pr-merge/rotation.mjs

      - name: Read the head refs the last run kept
        if: steps.candidates.outputs.listed == 'true'
        continue-on-error: true
        env:
          PR_MERGE_MAIN_TIP: ${{ steps.tip.outputs.unambiguous-sha }}
          API_BUDGET_TOKEN: github-token
          ACTIONS_TOKEN: ${{ github.token }}
          HEAD_REFS_PATH: ${{ runner.temp }}/head-refs-in.json
          PR_MERGE_READS_PATH: ${{ runner.temp }}/pr-merge-reads.json
        run: node .base/.github/scripts/pr-merge/head-ref-map.mjs read

      - name: Read the verdict reads the last run kept
        if: steps.candidates.outputs.listed == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          PR_MERGE_MAIN_TIP: ${{ steps.tip.outputs.unambiguous-sha }}
          API_BUDGET_TOKEN: github-token
          ACTIONS_TOKEN: ${{ github.token }}
          CARRY_TO: ${{ runner.temp }}/pr-merge-carried.json
          PR_MERGE_READS_PATH: ${{ runner.temp }}/pr-merge-reads.json
        run: node .base/.github/scripts/pr-merge/carry-run-cache.mjs read

      - name: Start the run cache from them
        if: steps.candidates.outputs.listed == 'true'
        continue-on-error: true
        env:
          CARRY_FROM: ${{ runner.temp }}/pr-merge-carried.json
          CARRY_TO: ${{ runner.temp }}/babysit-run-cache.json
        run: node .base/.github/scripts/pr-merge/carry-run-cache.mjs

      - name: Read the lane records the last run kept
        if: steps.lane-token.outputs.token != '' && steps.candidates.outputs.listed == 'true'
        continue-on-error: true
        env:
          PR_MERGE_MAIN_TIP: ${{ steps.tip.outputs.unambiguous-sha }}
          API_BUDGET_TOKEN: github-token
          ACTIONS_TOKEN: ${{ github.token }}
          LANE_RECORDS_PATH: ${{ runner.temp }}/lane-records.json
          PR_MERGE_READS_PATH: ${{ runner.temp }}/pr-merge-reads.json
        run: node .base/.github/scripts/pr-merge/lane-records.mjs read

      - name: Read this run's post-merge report
        if: >-
          steps.lane-token.outputs.token != '' && steps.mode.outputs.live == 'true'
          && needs.dispatch-post-merge-runs.result != 'skipped'
          && steps.candidates.outputs.listed == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@v8
        with:
          pattern: pr-merge-post-merge-report
          merge-multiple: true
          path: ${{ runner.temp }}/post-merge-kept

      - name: Check earlier lane merges
        id: post-merge
        if: steps.lane-token.outputs.token != '' && steps.candidates.outputs.listed == 'true'
        env:
          MAIN_TIP_SHA: ${{ steps.tip.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          BABYSIT_POSTMERGE_LANE_RECORDS: ${{ runner.temp }}/lane-records.json
          BABYSIT_POSTMERGE_ATTEMPTS: ${{ runner.temp }}/post-merge-attempts.json
          BABYSIT_DEMOTION_RECOVERIES: ${{ runner.temp }}/post-merge-kept/demotion-recoveries.json
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          kept=$RUNNER_TEMP/post-merge-kept
          scripts=.base/plugins/source-control/skills/babysit-prs/scripts
          code=
          # Copied whether or not the report is reused: the merge gate reads
          # this file too.
          [ ! -f "$kept/attempts.json" ] || cp "$kept/attempts.json" "$BABYSIT_POSTMERGE_ATTEMPTS"
          if [ -f "$kept/post-merge.json" ] && [ -f "$kept/post-merge-code" ]; then
            kept_code=$(cat "$kept/post-merge-code")
            kept_sha=$(cat "$kept/post-merge-code-sha" 2>/dev/null || true)
            # The lane room's reuse rule, at main's head now, for a check
            # run by this checkout's code: a refusal or a failed read runs
            # the check.
            if [[ $kept_code =~ ^[015]$ ]] &&
              python3 "$scripts/babysit_verify_evidence.py" settle --repo "$REPO" \
                --postmerge-result "$kept/post-merge.json" --code-sha "$kept_sha"; then
              cp "$kept/post-merge.json" "$RUNNER_TEMP/post-merge.json"
              [ ! -f "$kept/lane-records.json" ] || cp "$kept/lane-records.json" "$RUNNER_TEMP/lane-records.json"
              code=$kept_code
              echo "::notice::dispatch-post-merge-runs's check (exit $code) still stands by the lane room's reuse rule; reused, not run again"
            fi
          fi
          if [ -z "$code" ]; then
            identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
            code=0
            python3 "$scripts/babysit_postmerge.py" \
              --repo "$REPO" --agent-identity "$identity" --lane-merges-only \
              </dev/null >"$RUNNER_TEMP/post-merge.json" || code=$?
          fi
          echo "::group::post-merge check: exit $code"
          cat "$RUNNER_TEMP/post-merge.json"
          echo "::endgroup::"
          needs=$(jq '.needsDispatch == true' "$RUNNER_TEMP/post-merge.json" 2>/dev/null || echo false)
          if [ "$code" = 75 ]; then
            echo "::error::the post-merge check stopped on $(. .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null && . .base/.github/scripts/pr-merge/rate-stop.bash 2>/dev/null && rate_stop_cause || echo "a GitHub rate limit"); no remediation or gate runs"
            needs=false
          fi
          echo "needs-dispatch=$needs" >>"$GITHUB_OUTPUT"
          echo "code=$code" >>"$GITHUB_OUTPUT"
          # A rate-limit stop fails the job red once the outputs are written.
          [ "$code" != 75 ] || exit 1

      - name: Record a failed lane merge
        if: >-
          steps.lane-token.outputs.token != '' && steps.mode.outputs.live == 'true'
          && steps.post-merge.outputs.code == '1'
        env:
          MAIN_TIP_SHA: ${{ steps.tip.outputs.sha }}
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          API_BUDGET_TOKEN: lanes-app
          BABYSIT_POSTMERGE_LANE_RECORDS: ${{ runner.temp }}/lane-records.json
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          report=$RUNNER_TEMP/post-merge-remediate.json
          code=0
          python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_postmerge.py \
            --repo "$REPO" --agent-identity "$identity" --lane-merges-only --remediate \
            </dev/null >"$report" || code=$?
          echo "::group::post-merge remediation: exit $code"
          cat "$report"
          echo "::endgroup::"
          # Exit 4 also covers the expected re-run and dispatch refusals, so
          # the report, not the exit code, says whether the record was filed.
          if ! jq -e '.remediation.errors | type == "array"' "$report" >/dev/null 2>&1; then
            echo "::error::the post-merge remediation exited $code with no remediation report; no demotion record was filed"
          elif jq -e '[.remediation.errors[] | select(startswith("demotion issue:") or startswith("dequeue:") or startswith("disarm:"))] | length > 0' "$report" >/dev/null; then
            echo "::error::the post-merge remediation could not file the demotion record, dequeue the lane's entries or disarm its pull requests; see its report above"
          elif [ "$code" -eq 4 ]; then
            echo "::warning::the post-merge remediation exited $code (re-run or dispatch refused: the lane token has no Actions permission)"
          fi

      - name: Settle verified lane merges
        if: >-
          steps.lane-token.outputs.token != '' && steps.mode.outputs.live == 'true'
          && (steps.post-merge.outputs.code == '0' || steps.post-merge.outputs.code == '1'
              || steps.post-merge.outputs.code == '5')
        continue-on-error: true
        env:
          MAIN_TIP_SHA: ${{ steps.tip.outputs.sha }}
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          API_BUDGET_TOKEN: lanes-app
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          report=$RUNNER_TEMP/post-merge.json
          settled=$RUNNER_TEMP/post-merge-settle.json
          jq -e '.settle | length > 0' "$report" >/dev/null 2>&1 || exit 0
          identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          code=0
          python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_postmerge.py \
            --repo "$REPO" --agent-identity "$identity" --settle-from "$report" \
            </dev/null >"$settled" || code=$?
          cat "$settled"
          if [ "$code" != 0 ]; then
            echo "::warning::settling verified lane merges exited $code; no marker was posted"
          fi
          jq -r '.warnings[]?' "$settled" 2>/dev/null | while IFS= read -r warning; do
            echo "::warning::$warning"
          done

      - name: Re-ready a draft a whole-review request left
        if: steps.lane-token.outputs.token != '' && steps.mode.outputs.report-only == 'false' && steps.candidates.outputs.listed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          API_BUDGET_TOKEN: lanes-app
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_whole_review.py recover \
            --repo "$REPO" --identity "$identity" --drafts "$RUNNER_TEMP/drafts.json"

      - name: Skip refusals whose inputs have not changed
        if: steps.lane-token.outputs.token != '' && steps.candidates.outputs.listed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          API_BUDGET_TOKEN: lanes-app
          API_BUDGET_OVERRIDE_TOKEN: github-token
          BABYSIT_VERIFY_GH_TOKEN: ${{ github.token }}
          BABYSIT_VERIFY_LISTING: ${{ runner.temp }}/verify-listing.json
          REPO: ${{ github.repository }}
          RUNG_CAP: ${{ vars.CLAUDE_LANES_MERGE_RUNG_CAP }}
          MAX_MINUTES: ${{ steps.mode.outputs.skip-max-minutes }}
          MAX_SKIPS: ${{ steps.mode.outputs.skip-max-skips }}
        run: |
          python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_merge_skip.py filter \
            --repo "$REPO" --base .base --store "$RUNNER_TEMP/pr-merge-carried.json" \
            --candidates "$RUNNER_TEMP/candidates.json" --out-keys "$RUNNER_TEMP/skip-keys.json" \
            --out-skipped "$RUNNER_TEMP/skipped.json" --rung-cap "$RUNG_CAP" \
            --max-minutes "$MAX_MINUTES" --max-skips "$MAX_SKIPS"

      - name: Run the merge gate on each candidate
        id: gate
        if: steps.lane-token.outputs.token != '' && steps.candidates.outputs.listed == 'true'
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          BABYSIT_VERIFY_GH_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: lanes-app
          API_BUDGET_OVERRIDE_TOKEN: github-token
          BABYSIT_WHOLE_REVIEW_SPENT: ${{ runner.temp }}/whole-review-spent
          BABYSIT_VERIFY_LISTING: ${{ runner.temp }}/verify-listing.json
          BABYSIT_VERIFY_HEAD_REFS: ${{ runner.temp }}/head-refs-in.json
          BABYSIT_POSTMERGE_LANE_RECORDS: ${{ runner.temp }}/lane-records.json
          BABYSIT_POSTMERGE_ATTEMPTS: ${{ runner.temp }}/post-merge-attempts.json
          BABYSIT_DEMOTION_RECOVERIES: ${{ runner.temp }}/post-merge-kept/demotion-recoveries.json
          BABYSIT_RUN_CACHE: ${{ runner.temp }}/babysit-run-cache.json
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SCRIPT: ${{ steps.config.outputs.script }}
          KILL_SWITCH: ${{ steps.kill.outputs.proceed == 'true' && 'proceed' || '' }}
          RUNG_CAP: ${{ vars.CLAUDE_LANES_MERGE_RUNG_CAP }}
          BUDGET_MINUTES: ${{ steps.mode.outputs.gate-budget-minutes }}
          CANDIDATE_MINUTES: ${{ steps.mode.outputs.gate-candidate-minutes }}
          DEFERRED_MINUTES: ${{ steps.mode.outputs.gate-deferred-minutes }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          budget=${BUDGET_MINUTES:-}
          if [[ -n $budget && ! $budget =~ ^[1-9][0-9]*$ ]]; then
            echo "::warning::merge.gate-budget-minutes is not a whole number of minutes ($budget); the gate runs with no budget"
            budget=
          fi
          # The read limit for a candidate, then for a deferred one.
          limit=() ceiling=()
          if [[ ${CANDIDATE_MINUTES:-} =~ ^[1-9][0-9]*$ ]]; then
            limit=(--candidate-deadline-seconds $((CANDIDATE_MINUTES * 60)))
          elif [ -n "${CANDIDATE_MINUTES:-}" ]; then
            echo "::warning::merge.gate-candidate-minutes is not a whole number of minutes ($CANDIDATE_MINUTES); each candidate runs with no limit"
          fi
          if [[ ${DEFERRED_MINUTES:-} =~ ^[1-9][0-9]*$ ]]; then
            ceiling=(--candidate-deadline-seconds $((DEFERRED_MINUTES * 60)))
          elif [ -n "${DEFERRED_MINUTES:-}" ]; then
            echo "::warning::merge.gate-deferred-minutes is not a whole number of minutes ($DEFERRED_MINUTES); a deferred candidate runs with no limit"
          fi
          cursor="$RUNNER_TEMP/gate-cursor/cursor.json"
          mkdir -p "${cursor%/*}"
          started=$(date +%s)
          reached=0
          deferred=
          # The script and its flags come from the merge-pr activity on main.
          read -ra args < <(jq -r '.selected.args // ""' "$RUNNER_TEMP/resolved-config.json")
          results="$RUNNER_TEMP/results.jsonl"
          # The candidates set aside for a hold, reported as the gate would.
          jq -c '.[] | {pr: .number, head, updatedAt, exit: 10, ready: false,
            enqueued: false, merged: false, reportOnly: null, reason: "prefilter:\(.reason)",
            dispatched: null, blockers: ["prefilter: \(.reason), refused before the gate"]}' \
            "$RUNNER_TEMP/held.json" >"$results"
          # The candidates the skip step set aside, with their carried
          # refusal; one still listed for the gate is not reported twice.
          jq -c --slurpfile c "$RUNNER_TEMP/candidates.json" \
            '.[] | select(.pr as $p | $c[0] | any(.number == $p) | not)' \
            "$RUNNER_TEMP/skipped.json" >"$RUNNER_TEMP/carried.jsonl" 2>/dev/null &&
            cat "$RUNNER_TEMP/carried.jsonl" >>"$results" || true
          # Rewritten after each candidate, so a cancelled run still reports
          # the verdicts it reached.
          summary="$RUNNER_TEMP/pr-merge-summary.json"
          save() { jq -s . "$results" >"$summary.tmp" && mv "$summary.tmp" "$summary"; }
          save
          while read -r number head updated was_deferred; do
            if [ -n "$budget" ] && (($(date +%s) - started >= budget * 60)); then
              stop="the ${budget}-minute gate budget is used after $reached of $(jq length "$RUNNER_TEMP/candidates.json") candidates; the next run starts after #$(jq .last "$cursor" 2>/dev/null || echo none)"
              echo "::notice::$stop"
              echo "budget-stop: $stop" >>"$GITHUB_STEP_SUMMARY"
              break
            fi
            out="$RUNNER_TEMP/gate-$number.json"
            code=0
            cap=("${limit[@]}")
            [ "$was_deferred" = true ] && cap=("${ceiling[@]}")
            # main's tip as this candidate's gate starts, for its reads of it
            # (MAIN_TIP_SHA); unresolved, the gate reads it over REST.
            tip=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main |
              awk '$2 == "refs/heads/main" { print $1 }') || tip=''
            [[ $tip =~ ^[0-9a-f]{40}$ ]] || tip=''
            MAIN_TIP_SHA=$tip ".base/$SCRIPT" "${args[@]}" --allowed-owners "$OWNER" \
              --lane-kill-switch "$KILL_SWITCH" --lane-rung-cap "$RUNG_CAP" \
              --postmerge-result "$RUNNER_TEMP/post-merge.json" "${cap[@]}" \
              --expected-head "$head" "$REPO#$number" </dev/null >"$out" 2> >(tee "$out.err" >&2) || code=$?
            wait $! || true
            # Its gh invocations, from the babysit-gh-calls lines it printed.
            calls=$(sed -n 's/^babysit-gh-calls //p' "$out.err" | jq -s 'map(.total) | add') || calls=null
            echo "::group::PR #$number at $head: exit $code"
            cat "$out"
            echo "::endgroup::"
            if jq -e '.unattended.writes.wholeReview.toggled == true' "$out" >/dev/null 2>&1; then
              echo "::notice::pr-merge whole-review-toggle pr=$number head=$head"
            fi
            # Keep only the verdict fields; a gate that printed no JSON object
            # is recorded as an error with its exit code.
            jq -e 'type == "object"' "$out" >/dev/null 2>&1 || echo '{"error": "gate printed no JSON"}' >"$out"
            jq -c --argjson n "$number" --arg head "$head" --arg updated "$updated" --argjson code "$code" --argjson calls "${calls:-null}" '
              {pr: $n, head: $head, updatedAt: $updated, exit: $code, calls: $calls,
               ready: (.ready == true), enqueued: (.enqueued == true), merged: (.merged == true),
               reportOnly: .unattended.reportOnly, reason: (.unattended.reason // .error),
               dispatched: .unattended.dispatched, blockers: (.blockers // [])}
            ' "$out" >>"$results"
            save
            reached=$((reached + 1))
            if [ "$code" = 11 ] && [ "$was_deferred" = true ]; then
              echo "::warning::PR #$number's gate ran past merge.gate-deferred-minutes ($DEFERRED_MINUTES) after a deferral; it goes back to the capped rotation"
            elif [ "$code" = 11 ] && [ -z "$deferred" ]; then
              deferred=$number
            fi
            echo "{\"last\":$number${deferred:+,\"deferred\":$deferred}}" >"$cursor"
            # 75: the gate stopped on a GitHub rate limit (babysit_gh.py); a
            # later candidate's gate would call GitHub again while limited.
            if [ "$code" = 75 ]; then
              limited=$number
              cause=$(. .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null && . .base/.github/scripts/pr-merge/rate-stop.bash 2>/dev/null && rate_stop_cause || echo "a GitHub rate limit")
              if [[ $cause == "a GitHub server error hold"* ]]; then
                echo "::error title=GitHub server error::PR #$number's gate stopped on $cause; no later candidate is gated this run"
              else
                echo "::error title=GitHub rate limit::PR #$number's gate stopped on a GitHub rate limit; no later candidate is gated this run"
              fi
              break
            fi
          done < <(jq -r '.[] | "\(.number) \(.head) \(.updatedAt) \(.deferred == true)"' "$RUNNER_TEMP/candidates.json")
          dispatch=$(jq 'any(.[]; .merged and .dispatched != true)' "$summary")
          echo "dispatch=$dispatch" >>"$GITHUB_OUTPUT"
          # The later steps that call GitHub read this and send nothing.
          if [ -n "${limited:-}" ]; then
            echo "rate-limited=true" >>"$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          always() && steps.gate.outcome != 'skipped'
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/gate-cursor/cursor.json

      - name: Record where the gate stopped
        if: >-
          (always() && steps.gate.outcome != 'skipped') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-gate-cursor
          path: ${{ runner.temp }}/gate-cursor/cursor.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Keep the head refs the gate read
        id: head-refs
        if: >-
          always() && steps.gate.outcome != 'skipped'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          HEAD_REFS_PATH: ${{ runner.temp }}/head-refs-in.json
          BABYSIT_RUN_CACHE: ${{ runner.temp }}/babysit-run-cache.json
          BABYSIT_VERIFY_LISTING: ${{ runner.temp }}/verify-listing.json
          HEAD_REFS_OUT: ${{ runner.temp }}/head-refs/head-refs.json
        run: |
          mkdir -p "${HEAD_REFS_OUT%/*}"
          node .base/.github/scripts/pr-merge/head-ref-map.mjs write

      - name: Scan the upload for credentials
        id: scan-upload-2
        if: >-
          always() && steps.head-refs.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/head-refs/head-refs.json

      - name: Upload them for the next run
        if: >-
          (always() && steps.head-refs.outcome == 'success') && steps.scan-upload-2.outputs.clean == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-head-refs
          path: ${{ runner.temp }}/head-refs/head-refs.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Keep the lane records the checks proved
        id: lane-records
        if: >-
          always() && steps.post-merge.outcome != 'skipped'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          LANE_RECORDS_PATH: ${{ runner.temp }}/lane-records.json
          BABYSIT_VERIFY_LISTING: ${{ runner.temp }}/verify-listing.json
          LANE_RECORDS_OUT: ${{ runner.temp }}/lane-records/lane-records.json
        run: |
          mkdir -p "${LANE_RECORDS_OUT%/*}"
          node .base/.github/scripts/pr-merge/lane-records.mjs write

      - name: Scan the upload for credentials
        id: scan-upload-3
        if: >-
          always() && steps.lane-records.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/lane-records/lane-records.json

      - name: Upload the lane records for the next run
        if: >-
          (always() && steps.lane-records.outcome == 'success') && steps.scan-upload-3.outputs.clean == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-lane-records
          path: ${{ runner.temp }}/lane-records/lane-records.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Keep the verdict reads that never change
        id: carry
        if: >-
          always() && steps.gate.outcome != 'skipped'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          CARRY_FROM: ${{ runner.temp }}/babysit-run-cache.json
          CARRY_TO: ${{ runner.temp }}/pr-merge-carried.json
        run: node .base/.github/scripts/pr-merge/carry-run-cache.mjs

      - name: Keep the refusals the next run may skip
        if: always() && steps.carry.outputs.carried == 'true'
        continue-on-error: true
        run: |
          python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_merge_skip.py record \
            --keys "$RUNNER_TEMP/skip-keys.json" --summary "$RUNNER_TEMP/pr-merge-summary.json" \
            --outputs-dir "$RUNNER_TEMP" --store "$RUNNER_TEMP/pr-merge-carried.json" --run-id "$GITHUB_RUN_ID"

      - name: Scan the upload for credentials
        id: scan-upload-4
        if: >-
          always() && steps.carry.outputs.carried == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/pr-merge-carried.json

      - name: Upload the verdict reads for the next run
        if: >-
          (always() && steps.carry.outputs.carried == 'true') && steps.scan-upload-4.outputs.clean == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-run-cache
          path: ${{ runner.temp }}/pr-merge-carried.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Write the summary
        if: always() && steps.gate.outcome != 'skipped'
        env:
          EVENT: ${{ github.event_name }}
          LIVE: ${{ steps.mode.outputs.live }}
          WANTS_DISPATCH: ${{ steps.gate.outputs.dispatch == 'true' }}
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/pr-merge-summary.json"
          [ -f "$summary" ] || echo '[]' >"$summary"
          cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          # Backticks are dropped so PR-supplied text cannot end the code block.
          {
            echo "### pr-merge ($EVENT)"
            echo
            echo '```json'
            jq '[.[] | .blockers |= map(gsub("[\r\n`]"; " ") | .[0:300])]' "$summary"
            echo '```'
            echo
            if [ "$WANTS_DISPATCH" != true ]; then
              echo "Full CI run on main: none for a merge in this run; earlier lane merges are the dispatch-post-merge-runs job's."
            elif [ "$LIVE" = true ]; then
              echo "Full CI run on main: started by the next job."
            else
              echo "Full CI run on main: would be started; report-only, so none was."
            fi
            echo
            echo "#### Blocked for over 24 hours"
            echo
            jq -r --arg cutoff "$cutoff" '
              [.[] | select(((.enqueued or .merged) | not) and .updatedAt < $cutoff)]
              | if length == 0 then "None." else .[] | "- #\(.pr): \((.reason // "not ready") | tostring | gsub("[\r\n`]"; " ") | .[0:200])" end
            ' "$summary"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Count the sweep's refusals
        if: always() && (steps.gate.outcome != 'skipped' || steps.candidates.outputs.held == 'true')
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          LIVE: ${{ steps.mode.outputs.live }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          LIMITED: ${{ steps.gate.outputs.rate-limited }}
          LISTING_HELD: ${{ steps.candidates.outputs.held }}
          LISTING_HELD_REASON: ${{ steps.candidates.outputs.held-reason }}
          SUMMARY_PATH: ${{ runner.temp }}/pr-merge-summary.json
          HELD_PATH: ${{ runner.temp }}/held.json
          CANDIDATES_PATH: ${{ runner.temp }}/candidates.json
          CURSOR_PATH: ${{ runner.temp }}/gate-cursor/cursor.json
          SWEEP_SUMMARY_TO: ${{ runner.temp }}/pr-merge-sweep.json
        run: |
          set -euo pipefail
          # The read goes through the wrapped gh, so the job-end notice counts it.
          . .base/.github/actions/log-api-budget/api-budget.bash
          api_budget_wrap_gh github-token
          # After the gate's rate-limit stop or a held listing, no read: the
          # start stays unknown.
          RUN_STARTED_AT=
          if [ "$LIMITED" != true ] && [ "$LISTING_HELD" != true ]; then
            RUN_STARTED_AT=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at) || RUN_STARTED_AT=
          fi
          export RUN_STARTED_AT
          node .base/.github/scripts/pr-merge/sweep-summary.mjs
          jq -r '"refusal" + "-counts=" + (.refusal_counts | tojson)' "$SWEEP_SUMMARY_TO"

      - name: Scan the upload for credentials
        id: scan-upload-5
        if: >-
          always() && (steps.gate.outcome != 'skipped' || steps.candidates.outputs.held == 'true')
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/pr-merge-sweep.json

      - name: Upload the sweep's verdicts
        if: >-
          (always() && (steps.gate.outcome != 'skipped' || steps.candidates.outputs.held == 'true')) && steps.scan-upload-5.outputs.clean == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-summary
          path: ${{ runner.temp }}/pr-merge-sweep.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Scan the upload for credentials
        id: scan-upload-6
        if: >-
          always() && steps.gate.outcome != 'skipped' && steps.mode.outputs.report-only == 'false' && steps.gate.outputs.rate-limited != 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/pr-merge-summary.json

      - name: Hand the gate's rows to the check writer
        id: rows
        if: >-
          (always() && steps.gate.outcome != 'skipped' && steps.mode.outputs.report-only == 'false' && steps.gate.outputs.rate-limited != 'true') && steps.scan-upload-6.outputs.clean == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-gate-rows
          path: ${{ runner.temp }}/pr-merge-summary.json
          retention-days: 1
          if-no-files-found: error

      - name: Resolve main's tip after the gate
        id: late-tip
        if: >-
          always() && github.event_name == 'schedule'
          && steps.lane-token.outputs.token != ''
          && steps.mode.outputs.report-only == 'false'
          && steps.gate.outputs.rate-limited != 'true'
          && steps.candidates.outputs.listed == 'true'
        continue-on-error: true
        timeout-minutes: 4
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main

      - name: Re-fire lane runs refused as workflow-modified
        if: >-
          always() && github.event_name == 'schedule'
          && steps.lane-token.outputs.token != ''
          && steps.mode.outputs.report-only == 'false'
          && steps.gate.outputs.rate-limited != 'true'
          && steps.candidates.outputs.listed == 'true'
        env:
          MAIN_TIP_SHA: ${{ steps.late-tip.outputs.sha }}
          LANES_APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          API_BUDGET_TOKEN: lanes-app
          ACTIONS_TOKEN: ${{ github.token }}
          API_BUDGET_OVERRIDE_TOKEN: github-token
          KILL_SWITCH: ${{ steps.kill.outputs.proceed == 'true' && 'proceed' || '' }}
          TRUSTED_ACTORS_PATH: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          RESOLVED_CONFIG_PATH: ${{ runner.temp }}/resolved-config.json
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/pr-merge/refire-refused.mjs

      - name: Clear escalations whose reason no longer holds
        id: clear
        if: >-
          always() && github.event_name == 'schedule'
          && steps.lane-token.outputs.token != ''
          && steps.mode.outputs.report-only == 'false'
          && steps.gate.outputs.rate-limited != 'true'
          && steps.candidates.outputs.listed == 'true'
        timeout-minutes: 15
        env:
          MAIN_TIP_SHA: ${{ steps.late-tip.outputs.sha }}
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          CHECKS_TOKEN: ${{ github.token }}
          BABYSIT_VERIFY_GH_TOKEN: ${{ github.token }}
          BABYSIT_VERIFY_LISTING: ${{ runner.temp }}/verify-listing.json
          BABYSIT_VERIFY_HEAD_REFS: ${{ runner.temp }}/head-refs-in.json
          BABYSIT_RUN_CACHE: ${{ runner.temp }}/babysit-run-cache.json
          API_BUDGET_TOKEN: lanes-app
          API_BUDGET_OVERRIDE_TOKEN: github-token
          KILL_SWITCH: ${{ steps.kill.outputs.proceed == 'true' && 'proceed' || '' }}
          LANE_PRS: ${{ steps.mode.outputs.lane-prs }}
          TRUSTED_ACTORS_PATH: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/pr-merge/clear-escalations.mjs

      - name: Release eval holds whose record matches the head
        id: release-eval
        if: >-
          always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && !inputs.pr
          && steps.lane-token.outputs.token != ''
          && steps.mode.outputs.report-only == 'false'
          && steps.gate.outputs.rate-limited != 'true'
          && steps.candidates.outputs.listed == 'true'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          RUNS_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: lanes-app
          API_BUDGET_OVERRIDE_TOKEN: github-token
          KILL_SWITCH: ${{ steps.kill.outputs.proceed == 'true' && 'proceed' || '' }}
          TRUSTED_ACTORS_PATH: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/pr-merge/release-eval-hold.mjs

      - name: Mark this tick's work done
        if: steps.candidates.outputs.listed == 'true' && steps.gate.outcome == 'success'
        run: echo "the merge sweep listed and gated its candidates"

      - name: Mark the lane hold
        id: hold-marker
        if: steps.lane-token.outputs.skip-reason == 'rate-limited'
        continue-on-error: true
        run: mkdir -p "$RUNNER_TEMP/lane-hold" && echo "pr-merge $GITHUB_RUN_ID" >"$RUNNER_TEMP/lane-hold/pr-merge"
      - name: Keep the lane hold marker
        if: steps.hold-marker.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lane-hold-pr-merge
          path: ${{ runner.temp }}/lane-hold/pr-merge
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Log the API budget at job end
        id: budget-end
        if: always() && needs.dispatch-post-merge-runs.outputs.rate-limited == ''
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: lanes-app github-token

      - name: Write the sweep cost
        if: always() && (steps.gate.outcome != 'skipped' || steps.candidates.outputs.held == 'true')
        continue-on-error: true
        env:
          CALLS: ${{ steps.budget-end.outputs.calls }}
          CANDIDATES: ${{ steps.candidates.outputs.count }}
          LISTING_HELD: ${{ steps.candidates.outputs.held }}
        run: |
          lane=unknown github_token=unknown
          for count in $CALLS; do
            case $count in
              lanes-app-calls=*) lane=${count#*=} ;;
              github-token-calls=*) github_token=${count#*=} ;;
            esac
          done
          reached=$(jq -n --slurpfile s "$RUNNER_TEMP/pr-merge-summary.json" --slurpfile h "$RUNNER_TEMP/held.json" \
            '($s[0] | map(select(has("carried") | not)) | length) - ($h[0] | length)' 2>/dev/null) || reached=unknown
          skipped=$(jq '[.[] | select(has("carried"))] | length' "$RUNNER_TEMP/pr-merge-summary.json" 2>/dev/null) || skipped=unknown
          line="sweep-calls=$lane github-token-calls=$github_token candidates=${CANDIDATES:-unknown} reached=$reached skipped=$skipped"
          [ "$LISTING_HELD" != true ] || line="$line listing-held=true"
          echo "$line"
          echo "$line" >>"$GITHUB_STEP_SUMMARY"

      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: bash .base/.github/scripts/lib/revoke-lane-token.sh

  enable-auto-merge:
    name: Enable Auto Merge
    needs: [dispatch-post-merge-runs]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main' && github.event_name != 'push'
      && (github.event_name != 'pull_request_target'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && format('{0}', github.event.pull_request.user.id) == vars.AUTOMATION_LANES_APP_SENDER_ID
      && github.event.sender.type != 'Bot'))
    concurrency:
      group: pr-merge-enable-auto-merge
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # check out main
      actions: read # the verifier verdicts, their runs and the head-ref map
      pull-requests: read # the lane's merges and the merge queue, for the lane's room
      checks: read # the review lanes' annotations, as the gate binds their evidence
      issues: read # the demotion records the lane's room re-checks
      statuses: read # the head's pr-unblock statuses (the lanes App holds no statuses permission)
      id-token: write # prove to the token broker which workflow this is
    outputs:
      unarmed-statuses: ${{ steps.arm.outputs.unarmed-statuses }}
    steps:
      - name: Stop on dispatch-post-merge-runs's rate limit
        if: needs.dispatch-post-merge-runs.outputs.rate-limited != ''
        env:
          STOP: ${{ needs.dispatch-post-merge-runs.outputs.rate-limited }}
        run: |
          if [[ $STOP == *", held on HTTP 5"[0-9][0-9]" with a Retry-After" ]]; then
            echo "::error title=GitHub server error::dispatch-post-merge-runs stopped on a GitHub server error hold ($STOP); this job sends nothing to GitHub"
          else
            echo "::error title=GitHub rate limit::dispatch-post-merge-runs stopped on a GitHub rate limit ($STOP); this job sends nothing to GitHub"
          fi
          exit 1

      - name: Resolve main's tip
        id: tip
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main

      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          fetch-depth: 0
          persist-credentials: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.dispatch-post-merge-runs.outputs.standards-sha }}

      - name: Write the source-control trust settings
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@main
        with:
          drop-in-file: .base/.github/source-control-settings.json
          drop-in-name: 50-source-control

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .base/.python-version

      - name: Install the pinned YAML reader
        continue-on-error: true
        run: bash .base/.github/scripts/lib/install-pinned-pyyaml.sh 'PyYAML did not install; no workflow-file change binds its review this run'

      - name: Read the defer override from the base config
        if: inputs.pr
        continue-on-error: true
        run: |
          yq -o=json '{"limits": {"api": (.limits.api // {})}}' .base/docs/conventions/pr-pipeline.yaml >"$RUNNER_TEMP/defer-config.json"

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}
          defer: ${{ inputs.pr && 'true' || 'false' }}
          defer-job: pr-merge
          resolved-config: ${{ runner.temp }}/defer-config.json

      - name: Check who started the run
        id: who
        if: steps.kill.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
          API_BUDGET_SCRIPT: who
          ACTIONS_TOKEN: ${{ github.token }}
          ACTOR_ID: ${{ github.actor_id }}
          DISPATCH_PR: ${{ inputs.pr }}
          TRUSTED_ACTORS_PATH: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          STOP_NOTICE: the next scheduled run arms what this one would
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/pr-merge/who.mjs

      - name: Check for a newer run that does this work
        id: superseded
        if: steps.who.outputs.proceed == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          API_BUDGET_TOKEN: github-token
          API_BUDGET_SCRIPT: superseded
          ACTIONS_TOKEN: ${{ github.token }}
          SUPERSEDED_JOB: enable-auto-merge
          TRUSTED_ACTORS_PATH: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          DISPATCH_PR: ${{ inputs.pr }}
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/pr-merge/superseded.mjs

      - name: Resolve the config
        id: config
        if: steps.who.outputs.proceed == 'true' && steps.superseded.outputs.superseded != 'true'
        env:
          API_BUDGET_TOKEN: github-token
          API_BUDGET_SCRIPT: resolve-config
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: pr-merge
          activity: enable-auto-merge
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json
          standards-path: ${{ steps.standards.outputs.path }}

      - name: Request the lane token
        id: lane-token
        if: steps.config.outcome == 'success'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: pr-merge
          activity: enable-auto-merge
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}
          pr-number: ${{ github.actor_id == '41898282' && inputs.pr || '' }}
          superseded-ok: true
          kill-switch-ok: true
          rate-limit-hold-ok: true

      - name: Check whether a full run covers the newest lane merge
        id: precheck
        if: steps.lane-token.outputs.token != '' && github.event_name == 'workflow_dispatch' && inputs.pr
        continue-on-error: true
        timeout-minutes: 1
        env:
          MAIN_TIP_SHA: ${{ steps.tip.outputs.sha }}
          BABYSIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          API_BUDGET_SCRIPT: uncovered-at
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml) || exit 0
          [ -n "$identity" ] || exit 0
          lane=$(git -C .base log -1 --first-parent --fixed-strings --author="$identity" --format=%H HEAD) || exit 0
          [ -n "$lane" ] || exit 0
          code=0
          python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_postmerge.py \
            --repo "$REPO" --branch main --uncovered-at "$lane" || code=$?
          if [ "$code" = 6 ]; then
            echo "::notice::the pre-check found a lane merge ($lane) no dispatch run covers yet; its report would need a dispatch, so nothing is armed or disarmed, and the next sweep checks again"
            echo "uncovered=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Read the post-merge report the last sweep kept
        if: steps.lane-token.outputs.token != '' && github.event_name == 'workflow_dispatch' && inputs.pr && steps.precheck.outputs.uncovered != 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          PR_MERGE_MAIN_TIP: ${{ steps.tip.outputs.unambiguous-sha }}
          API_BUDGET_TOKEN: github-token
          API_BUDGET_SCRIPT: last-report
          ACTIONS_TOKEN: ${{ github.token }}
          LAST_REPORT_DIR: ${{ runner.temp }}/post-merge
          PR_MERGE_READS_PATH: ${{ runner.temp }}/pr-merge-reads.json
        run: node .base/.github/scripts/pr-merge/last-report.mjs

      - name: Check whether the last sweep's report predates a code change
        id: code
        if: steps.lane-token.outputs.token != '' && github.event_name == 'workflow_dispatch' && inputs.pr && steps.precheck.outputs.uncovered != 'true'
        continue-on-error: true
        run: |
          last=$RUNNER_TEMP/post-merge
          [ -f "$last/post-merge.json" ] && [ -f "$last/post-merge-code" ] || exit 0
          [[ $(cat "$last/post-merge-code") =~ ^[05]$ ]] || exit 0
          sha=$(cat "$last/post-merge-code-sha" 2>/dev/null || true)
          code=0
          python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_verify_evidence.py \
            check-code --code-sha "$sha" || code=$?
          [ "$code" != 1 ] || echo "changed=true" >>"$GITHUB_OUTPUT"

      - name: Read the verdict reads the last run kept
        if: >-
          steps.lane-token.outputs.token != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && steps.code.outputs.changed != 'true' && steps.precheck.outputs.uncovered != 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          PR_MERGE_MAIN_TIP: ${{ steps.tip.outputs.unambiguous-sha }}
          API_BUDGET_TOKEN: github-token
          API_BUDGET_SCRIPT: carry-run-cache
          ACTIONS_TOKEN: ${{ github.token }}
          CARRY_TO: ${{ runner.temp }}/pr-merge-carried.json
          PR_MERGE_READS_PATH: ${{ runner.temp }}/pr-merge-reads.json
        run: node .base/.github/scripts/pr-merge/carry-run-cache.mjs read

      - name: Start the run cache from them
        if: >-
          steps.lane-token.outputs.token != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && steps.code.outputs.changed != 'true' && steps.precheck.outputs.uncovered != 'true'
        continue-on-error: true
        env:
          CARRY_FROM: ${{ runner.temp }}/pr-merge-carried.json
          CARRY_TO: ${{ runner.temp }}/babysit-run-cache.json
        run: node .base/.github/scripts/pr-merge/carry-run-cache.mjs

      - name: Read this run's post-merge report
        if: >-
          steps.lane-token.outputs.token != ''
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && needs.dispatch-post-merge-runs.result != 'skipped'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@v8
        with:
          name: pr-merge-post-merge-report
          path: ${{ runner.temp }}/post-merge

      - name: Read the lane records the last run kept
        if: >-
          steps.lane-token.outputs.token != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && steps.code.outputs.changed != 'true' && steps.precheck.outputs.uncovered != 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          PR_MERGE_MAIN_TIP: ${{ steps.tip.outputs.unambiguous-sha }}
          API_BUDGET_TOKEN: github-token
          API_BUDGET_SCRIPT: lane-records
          ACTIONS_TOKEN: ${{ github.token }}
          LANE_RECORDS_PATH: ${{ runner.temp }}/lane-records.json
          PR_MERGE_READS_PATH: ${{ runner.temp }}/pr-merge-reads.json
        run: node .base/.github/scripts/pr-merge/lane-records.mjs read

      - name: Keep the last sweep's report only while nothing it read has moved
        id: keep-report
        if: steps.lane-token.outputs.token != '' && github.event_name == 'workflow_dispatch' && inputs.pr && steps.precheck.outputs.uncovered != 'true'
        timeout-minutes: 5
        env:
          MAIN_TIP_SHA: ${{ steps.tip.outputs.sha }}
          BABYSIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          API_BUDGET_SCRIPT: settle-idle-tick
          BABYSIT_POSTMERGE_LANE_RECORDS: ${{ runner.temp }}/lane-records.json
          BABYSIT_POSTMERGE_ATTEMPTS: ${{ runner.temp }}/post-merge-attempts.json
          BABYSIT_DEMOTION_RECOVERIES: ${{ runner.temp }}/demotion-recoveries.json
          BABYSIT_RUN_CACHE: ${{ runner.temp }}/babysit-run-cache.json
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          last=$RUNNER_TEMP/post-merge
          [ ! -f "$last/demotion-recoveries.json" ] || cp "$last/demotion-recoveries.json" "$RUNNER_TEMP/demotion-recoveries.json"
          scripts=.base/plugins/source-control/skills/babysit-prs/scripts
          kept=false fresh='' reason='' last_reason=''
          settle() {
            python3 "$scripts/babysit_verify_evidence.py" settle --idle-tick --repo "$REPO" \
              --postmerge-result "$last/post-merge.json" --code-sha "$@"
          }
          if [ -f "$last/post-merge.json" ] && [ -f "$last/post-merge-code" ]; then
            last_code=$(cat "$last/post-merge-code")
            last_sha=$(cat "$last/post-merge-code-sha" 2>/dev/null || true)
            if [[ $last_code =~ ^[05]$ ]]; then
              settled=$(settle "$last_sha" --probe-unmoved) && kept=true
              echo "$settled"
              last_reason=$(jq -r '.reason // ""' <<<"$settled" 2>/dev/null | head -n 1) || last_reason=''
            fi
          fi
          if [ "$kept" = true ]; then
            echo "the last sweep's post-merge report still stands: nothing it reads has moved"
          elif [ "$last_reason" = "post-merge answer code-changed" ]; then
            rm -rf "${last:?}"
            echo "::notice::the last sweep's post-merge report predates a code change; no fresh check runs, nothing is armed or disarmed, and the next sweep checks again"
          elif [ "$last_reason" = "idle tick unattributed-unmoved" ]; then
            rm -rf "${last:?}"
            echo "::notice::the last sweep's post-merge report lists a red full run charged to no merge, and no full run finished since that could clear it; no fresh check runs, nothing is armed or disarmed, and the next sweep checks again"
          elif [ "$last_reason" = "idle tick reruns-unmoved" ]; then
            rm -rf "${last:?}"
            echo "::notice::the last sweep's post-merge report lists a pending or red rerun of main, and nothing it read has moved since; no fresh check runs, nothing is armed or disarmed, and the next sweep checks again"
          else
            [ ! -f "$last/attempts.json" ] || cp "$last/attempts.json" "$BABYSIT_POSTMERGE_ATTEMPTS"
            rm -rf "${last:?}"
            mkdir -p "$last"
            echo "the last sweep's post-merge report does not stand for this run; the post-merge check runs fresh"
            identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
            fresh=0
            # Written now, so a check that times out or is cancelled still
            # says it ran.
            echo "fresh-started=true" >>"$GITHUB_OUTPUT"
            # --stop-uncovered ends the check with exit 6 once its run
            # listings show a judged merge no dispatch run covers: that report
            # would need a dispatch, which idle_report_refusal always refuses.
            python3 "$scripts/babysit_postmerge.py" \
              --repo "$REPO" --agent-identity "$identity" --lane-merges-only --stop-uncovered \
              </dev/null >"$last/post-merge.json" || fresh=$?
            echo "::group::fresh post-merge check: exit $fresh"
            cat "$last/post-merge.json"
            echo "::endgroup::"
            echo "$fresh" >"$last/post-merge-code"
            sha=$(git -C .base rev-parse HEAD) || sha=''
            echo "$sha" >"$last/post-merge-code-sha"
            # Beside the report, as a sweep's artifact holds them, for the
            # arm step's room.
            [ ! -f "$BABYSIT_POSTMERGE_ATTEMPTS" ] || cp "$BABYSIT_POSTMERGE_ATTEMPTS" "$last/attempts.json"
            [ ! -f "$RUNNER_TEMP/demotion-recoveries.json" ] || cp "$RUNNER_TEMP/demotion-recoveries.json" "$last/demotion-recoveries.json"
            if [[ $fresh =~ ^[05]$ ]]; then
              settled=$(settle "$sha" --fresh) && kept=true
              echo "$settled"
              # Why the idle tick refused the fresh report, for the outcome line.
              reason=$(jq -r '.reason // ""' <<<"$settled" 2>/dev/null | head -n 1) || reason=''
            fi
            if [ "$kept" = true ]; then
              echo "the fresh post-merge check (exit $fresh) passed and settle --idle-tick --fresh keeps it"
            elif [ "$fresh" = 6 ]; then
              rm -rf "${last:?}"
              echo "::notice::the fresh post-merge check stopped at a lane merge no dispatch run covers yet; its report would need a dispatch, so nothing is armed or disarmed, and the next sweep checks again"
            else
              rm -rf "${last:?}"
              echo "::notice::the fresh post-merge check (exit $fresh) does not stand for this run; nothing is armed or disarmed, and the next sweep checks again"
            fi
          fi
          {
            echo "stands=$kept"
            echo "fresh=$fresh"
            echo "fresh-reason=${reason//[$'\r\n']/ }"
          } >>"$GITHUB_OUTPUT"

      - name: Read the head refs the last gate run kept
        if: >-
          steps.lane-token.outputs.token != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && (!inputs.pr || steps.keep-report.outputs.stands == 'true')
        continue-on-error: true
        env:
          PR_MERGE_MAIN_TIP: ${{ steps.tip.outputs.unambiguous-sha }}
          API_BUDGET_TOKEN: github-token
          API_BUDGET_SCRIPT: head-ref-map
          ACTIONS_TOKEN: ${{ github.token }}
          HEAD_REFS_PATH: ${{ runner.temp }}/head-refs-in.json
          PR_MERGE_READS_PATH: ${{ runner.temp }}/pr-merge-reads.json
        run: node .base/.github/scripts/pr-merge/head-ref-map.mjs read

      - name: Read the skip records the last run kept
        if: >-
          steps.lane-token.outputs.token != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && (!inputs.pr || steps.keep-report.outputs.stands == 'true')
        continue-on-error: true
        timeout-minutes: 2
        env:
          PR_MERGE_MAIN_TIP: ${{ steps.tip.outputs.unambiguous-sha }}
          API_BUDGET_TOKEN: github-token
          API_BUDGET_SCRIPT: verify-answers
          ACTIONS_TOKEN: ${{ github.token }}
          EAM_SKIP_PATH: ${{ runner.temp }}/eam-skip-in.json
          PR_MERGE_READS_PATH: ${{ runner.temp }}/pr-merge-reads.json
        run: node .base/.github/scripts/pr-merge/verify-answers.mjs

      - name: Arm and disarm auto-merge
        id: arm
        if: steps.lane-token.outputs.token != '' && !(github.event_name == 'workflow_dispatch' && inputs.pr && steps.keep-report.outputs.stands != 'true')
        timeout-minutes: 18
        env:
          MAIN_TIP_SHA: ${{ steps.tip.outputs.sha }}
          BABYSIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          KILL_SWITCH: ${{ steps.kill.outputs.proceed == 'true' && 'proceed' || '' }}
          RESOLVED_CONFIG: ${{ runner.temp }}/resolved-config.json
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number || inputs.pr }}
          BABYSIT_VERIFY_GH_TOKEN: ${{ github.token }}
          BABYSIT_VERIFY_LISTING: ${{ runner.temp }}/verify-listing.json
          BABYSIT_VERIFY_HEAD_REFS: ${{ runner.temp }}/head-refs-in.json
          BABYSIT_RUN_CACHE: ${{ runner.temp }}/babysit-run-cache.json
          BABYSIT_WHOLE_REVIEW_SPENT: ${{ runner.temp }}/whole-review-spent
          EAM_SKIP_IN: ${{ runner.temp }}/eam-skip-in.json
          EAM_SKIP_OUT: ${{ runner.temp }}/verify-answers/eam-skip.json
          POSTMERGE_RESULT: ${{ runner.temp }}/post-merge/post-merge.json
          RUNG_CAP: ${{ vars.CLAUDE_LANES_MERGE_RUNG_CAP }}
          BABYSIT_POSTMERGE_LANE_RECORDS: ${{ runner.temp }}/lane-records.json
          BABYSIT_POSTMERGE_ATTEMPTS: ${{ runner.temp }}/post-merge/attempts.json
          BABYSIT_DEMOTION_RECOVERIES: ${{ runner.temp }}/post-merge/demotion-recoveries.json
          API_BUDGET_TOKEN: lanes-app
          API_BUDGET_OVERRIDE_TOKEN: github-token
          API_BUDGET_SCRIPT: enable-auto-merge
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: |
          set -euo pipefail
          config=.base/docs/conventions/pr-pipeline.yaml
          REPORT_ONLY=$(yq '.merge."report-only"' "$config")
          LANES_BOT_LOGIN=$(yq '.merge."agent-identity" // ""' "$config")
          RISK_ESCALATION_MINUTES=$(yq '.merge."risk-escalation-minutes" // ""' "$config")
          SKIP_MAX_MINUTES=$(yq '.merge."skip-unchanged"."max-minutes" // ""' "$config")
          SKIP_MAX_SKIPS=$(yq '.merge."skip-unchanged"."max-skips" // ""' "$config")
          mkdir -p "$(dirname "$EAM_SKIP_OUT")"
          # The commit whose code ran the report's check, for lane-room, which
          # reads the report again or refuses it when that code changed.
          POSTMERGE_CODE_SHA=$(cat "$RUNNER_TEMP/post-merge/post-merge-code-sha" 2>/dev/null || true)
          export SKIP_MAX_MINUTES SKIP_MAX_SKIPS
          export REPORT_ONLY LANES_BOT_LOGIN RISK_ESCALATION_MINUTES POSTMERGE_CODE_SHA
          node .base/.github/scripts/pr-merge/enable-auto-merge.mjs

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          always() && steps.arm.outcome != 'skipped' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.pr
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/verify-answers/eam-skip.json

      - name: Upload the skip records for the next run
        if: >-
          (always() && steps.arm.outcome != 'skipped' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.pr) && steps.scan-upload.outputs.clean == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-verify-answers
          path: ${{ runner.temp }}/verify-answers/eam-skip.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Keep the verdict reads that never change
        id: carry
        if: >-
          always() && steps.arm.outcome != 'skipped'
          && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && !inputs.pr
        continue-on-error: true
        env:
          CARRY_FROM: ${{ runner.temp }}/babysit-run-cache.json
          CARRY_TO: ${{ runner.temp }}/pr-merge-carried.json
        run: node .base/.github/scripts/pr-merge/carry-run-cache.mjs

      - name: Scan the upload for credentials
        id: scan-upload-2
        if: >-
          always() && steps.carry.outputs.kept == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/pr-merge-carried.json

      - name: Upload the verdict reads for the next run
        if: >-
          (always() && steps.carry.outputs.kept == 'true') && steps.scan-upload-2.outputs.clean == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-verify-run-cache
          path: ${{ runner.temp }}/pr-merge-carried.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Mark the lane hold
        id: hold-marker
        if: steps.lane-token.outputs.skip-reason == 'rate-limited'
        continue-on-error: true
        run: mkdir -p "$RUNNER_TEMP/lane-hold" && echo "pr-merge $GITHUB_RUN_ID" >"$RUNNER_TEMP/lane-hold/pr-merge"
      - name: Keep the lane hold marker
        if: steps.hold-marker.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lane-hold-pr-merge
          path: ${{ runner.temp }}/lane-hold/pr-merge
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Log the API budget at job end
        id: budget-end
        if: always() && needs.dispatch-post-merge-runs.outputs.rate-limited == ''
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: lanes-app github-token

      - name: Report the PR-scoped outcome
        if: always() && github.event_name == 'workflow_dispatch' && inputs.pr
        continue-on-error: true
        timeout-minutes: 1
        env:
          PR: ${{ inputs.pr }}
          OUTCOME: ${{ steps.arm.outputs.wake-outcome }}
          ARM: ${{ steps.arm.outcome }}
          KILL: ${{ steps.kill.outputs.proceed }}
          KILL_CAUSE: ${{ steps.kill.outputs.cause }}
          KILL_RESET: ${{ steps.kill.outputs.reset }}
          WHO: ${{ steps.who.outputs.proceed }}
          SUPERSEDED: ${{ steps.superseded.outputs.superseded }}
          UNCOVERED: ${{ steps.precheck.outputs.uncovered }}
          STANDS: ${{ steps.keep-report.outputs.stands }}
          FRESH: ${{ steps.keep-report.outputs.fresh }}
          FRESH_REASON: ${{ steps.keep-report.outputs.fresh-reason }}
          FRESH_STARTED: ${{ steps.keep-report.outputs.fresh-started }}
          CALLS: ${{ steps.budget-end.outputs.calls }}
        run: |
          if [ -z "$OUTCOME" ]; then
            if [ "$KILL" != true ] && [ "$KILL_CAUSE" = defer ]; then
              OUTCOME="deferred (cause defer): the GITHUB_TOKEN window is projected to run short before its reset at $KILL_RESET (epoch seconds); the next sweep, which never defers, arms what this run would"
            elif [ "$KILL" != true ]; then
              OUTCOME="skipped: the lanes kill switch stopped it"
            elif [ "$WHO" != true ]; then
              OUTCOME="skipped: the who step stopped it"
            elif [ "$SUPERSEDED" = true ]; then
              OUTCOME="skipped: a waiting run does this work"
            elif [ "$UNCOVERED" = true ]; then
              OUTCOME="skipped: the pre-check found a lane merge no dispatch run covers (needs-dispatch)"
            elif [ -z "$FRESH" ] && [ "$FRESH_STARTED" = true ]; then
              OUTCOME="skipped: the fresh post-merge check did not finish (timeout or cancel)"
            elif [ "$STANDS" = false ] && [ "$FRESH" = 6 ]; then
              OUTCOME="skipped: the fresh post-merge check stopped at a lane merge no dispatch run covers (needs-dispatch)"
            elif [ "$STANDS" = false ] && [ "$FRESH" = 75 ]; then
              OUTCOME="skipped: the fresh post-merge check stopped on $(. .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null && . .base/.github/scripts/pr-merge/rate-stop.bash 2>/dev/null && rate_stop_cause || echo "a GitHub rate limit")"
            elif [ "$STANDS" = false ] && [[ $FRESH =~ ^[05]$ ]]; then
              OUTCOME="skipped: settle --idle-tick refused the fresh post-merge report (${FRESH_REASON:-no reason read})"
            elif [ "$STANDS" = false ] && [ -n "$FRESH" ]; then
              OUTCOME="skipped: the fresh post-merge check exited $FRESH"
            elif [ "$STANDS" = false ]; then
              OUTCOME="skipped: the last sweep's report does not stand"
            else
              OUTCOME="skipped: the arm step ended ${ARM:-unrun} with no outcome"
            fi
          fi
          # Which report the room came from: none read, the last sweep's, or
          # a fresh check's.
          report=none
          [ -z "$STANDS" ] || report=last
          [ -z "$FRESH" ] && [ "$FRESH_STARTED" != true ] || report=fresh
          # The outcome last: its reason holds spaces.
          line="pr=$PR ${CALLS:-calls=unknown} report=$report outcome=$OUTCOME"
          echo "::notice title=pr-merge-wake::${line//[$'\r\n%']/ }"

      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: bash .base/.github/scripts/lib/revoke-lane-token.sh

  report-unarmed-status:
    name: Report Unarmed Status
    needs: [merge, enable-auto-merge]
    if: ${{ !cancelled() && !inputs.pr && (needs.enable-auto-merge.outputs.unarmed-statuses != '' || needs.merge.outputs.mended-heads != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write # post pr-merge/unarmed on lanes App pull request heads
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Post the pr-merge/unarmed statuses
        if: needs.enable-auto-merge.outputs.unarmed-statuses != ''
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          STATUSES: ${{ needs.enable-auto-merge.outputs.unarmed-statuses }}
        run: node .base/.github/scripts/pr-merge/post-unarmed-status.mjs

      - name: Clear the address-feedback stops pr-verify settled
        if: ${{ !cancelled() && needs.merge.outputs.mended-heads != '' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          MENDED_HEADS: ${{ needs.merge.outputs.mended-heads }}
          ACTIVITY: address-feedback
          CLEAR_DESCRIPTION: pr-verify passed this head after a trusted body edit; the stop is settled
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for head in $MENDED_HEADS; do
            HEAD_SHA=$head bash .base/.github/scripts/pr-unblock/report-escalation.sh clear
          done

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  dispatch-full-run:
    name: Dispatch Full Run
    needs: [merge]
    if: >-
      !cancelled()
      && ((needs.merge.result == 'success' && needs.merge.outputs.dispatch == 'true'
      && github.event_name != 'pull_request_target')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    concurrency:
      group: ${{ github.event_name == 'push' && 'pr-merge-verify-main' || format('pr-merge-dispatch-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # read main's full runs and start pr-require-checks.yml on main
      contents: read # check out the api-budget library
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main
      - name: Check out the api-budget library
        if: steps.tip.outputs.sha != ''
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/log-api-budget/
            /lib/publish-gate.mjs
          sparse-checkout-cone-mode: false

      - name: Read main's full-run cover
        id: cover
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TIP: ${{ github.sha }}
          CAP_MINUTES: 30
        run: |
          set -euo pipefail
          # The read keeps its rate-limit reading for the job-end api-calls
          # notice; none when the checkout of the library failed.
          { . .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null && api_budget_wrap_gh github-token; } || true
          if ! runs=$(gh api "repos/$REPO/actions/workflows/pr-require-checks.yml/runs?branch=main&per_page=20" \
            --jq '[.workflow_runs[] | select((.event == "schedule" or .event == "workflow_dispatch") and .head_branch == "main" and .conclusion != "cancelled") | {sha: .head_sha, created: .created_at, lane: (.event == "workflow_dispatch" and .actor.login == "github-actions[bot]")}]' 2>"$RUNNER_TEMP/cover-stderr"); then
            cat "$RUNNER_TEMP/cover-stderr" >&2
            if grep -qiE 'rate limit|RATE_LIMITED|abuse detection|HTTP 429' "$RUNNER_TEMP/cover-stderr"; then
              echo "::error title=GitHub rate limit::the read of main's full runs was rate limited; nothing more is sent"
              echo "rate-limited=true" >>"$GITHUB_OUTPUT"
              exit 1
            fi
            echo "::warning::the read of main's full runs failed; no cap applies to this run"
            exit 0
          fi
          # The listing, for dispatch-post-merge-runs's cap bypass.
          printf '%s\n' "$runs" >"$RUNNER_TEMP/cover-runs.json"
          since=$(date -u -d "@$(($(date +%s) - CAP_MINUTES * 60))" +%Y-%m-%dT%H:%M:%SZ)
          recent=$(jq -r --arg since "$since" '[.[] | select(.created >= $since) | .created] | max // ""' <<<"$runs")
          if [ -n "$recent" ]; then
            echo "::notice::a full run of main was started at $recent, within $CAP_MINUTES minutes; the first push or scheduled pr-merge run after that window starts one for main's tip"
            echo "capped=true" >>"$GITHUB_OUTPUT"
          fi
          if ! jq -e --arg tip "$TIP" 'any(.[]; .sha == $tip)' <<<"$runs" >/dev/null; then
            echo "uncovered=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Start the full CI run on main
        id: dispatch
        if: steps.cover.outputs.rate-limited != 'true' && steps.cover.outputs.capped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WAIT_CAP: 180
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            what="merge $GITHUB_SHA"
          else
            what="main (this run started at $GITHUB_SHA)"
          fi
          # Each POST's rate-limit reading, for the job-end api-calls notice;
          # recorded only, never guarded, so the POST goes as it would
          # without the library, and without it nothing is recorded.
          . .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null || true
          # A header of the last response, by case-insensitive name.
          header() { awk -F': *' -v n="$1" 'tolower($1) == n { sub(/\r$/, "", $2); print $2; exit }' <<<"$hdr"; }
          id='' why='' waited=0
          for try in 1 2 3; do
            code=0
            out=$(gh api -i -X POST "repos/$REPO/actions/workflows/pr-require-checks.yml/dispatches" \
              -f ref=main -F return_run_details=true 2>"$RUNNER_TEMP/dispatch-stderr") || code=$?
            ! declare -F api_budget_read >/dev/null || api_budget_read github-token /dev/stdin "repos/{repo}/actions/workflows/{x}/dispatches" <<<"$out" >/dev/null
            cat "$RUNNER_TEMP/dispatch-stderr" >&2
            hdr=$(sed '/^\r\?$/q' <<<"$out")
            body=$(sed '1,/^\r\?$/d' <<<"$out")
            status=$(awk 'NR == 1 { print $2 }' <<<"$hdr")
            if [ "$code" = 0 ]; then
              id=$(jq -r '.workflow_run_id // ""' <<<"$body" 2>/dev/null || true)
              if [[ ! $id =~ ^[1-9][0-9]{0,14}$ ]]; then
                id='' why="the dispatch returned no run id"
              fi
              break
            fi
            wait=
            if [[ $status =~ ^(403|429)$ ]]; then
              message=$(jq -r '.message // ""' <<<"$body" 2>/dev/null || true)
              after=$(header retry-after) left=$(header x-ratelimit-remaining) reset=$(header x-ratelimit-reset)
              why="HTTP $status: ${message:-no message} (retry-after=${after:-none} remaining=${left:-none} reset=${reset:-none})"
              if [ "$status" = 429 ] || [[ $after =~ ^[0-9]+$ ]] || [ "$left" = 0 ] || [[ ${message,,} =~ rate\ limit|abuse\ detection ]]; then
                now=$(date +%s) until='' resource=$(header x-ratelimit-resource) pool="every pool"
                if [[ $after =~ ^[0-9]+$ ]]; then until=$((now + after)); fi
                if [ "$left" = 0 ] && [[ $reset =~ ^[0-9]+$ ]] && ((reset > ${until:-0})); then until=$reset; fi
                secondary=''
                if [[ ${message,,} =~ secondary\ rate\ limit|abuse\ detection ]]; then secondary=1; fi
                # As rate-guard.mjs classify: a secondary limit is not per
                # resource, whatever remaining says.
                if ! [[ $after =~ ^[0-9]+$ ]] && [ "$left" = 0 ] && [ -z "$secondary" ]; then
                  [[ $resource =~ ^[a-z_]+$ ]] || resource=core
                  pool="the $resource pool"
                fi
                # No header time ahead, as rate-guard.mjs classify: a secondary
                # limit or a past header time waits the minute, any other the hour.
                if [ -z "$until" ]; then
                  if [ -n "$secondary" ]; then until=$((now + 60)); else until=$((now + 3600)); fi
                elif ((until <= now)); then
                  until=$((now + 60))
                fi
                when=$(date -u -d "@$until" +%Y-%m-%dT%H:%M:%SZ)
                echo "::error title=GitHub rate limit::$pool is exhausted ($why); nothing more is sent before $when"
                echo "rate-limited=true" >>"$GITHUB_OUTPUT"
                echo "stop=$pool until $when" >>"$GITHUB_OUTPUT"
                exit 1
              fi
            elif [ -z "$status" ]; then
              error=$(tail -n 1 "$RUNNER_TEMP/dispatch-stderr")
              if grep -qE 'dial tcp|tls: (handshake|first record)|net/http: TLS handshake timeout' "$RUNNER_TEMP/dispatch-stderr"; then
                why="the connection failed before the request was sent (gh exit $code: $error)"
                wait=$((RANDOM % (10 * 2 ** (try - 1)) + 1))
              else
                why="no response (gh exit $code: ${error:-no error text}), and the request may have been sent; not sent again"
              fi
            else
              why="HTTP $status, not sent again"
            fi
            if [ -z "$wait" ] || [ "$try" = 3 ]; then
              break
            fi
            if ((waited + wait > WAIT_CAP)); then
              why="$why; a ${wait}s wait does not fit the ${WAIT_CAP}s this job allows (${waited}s spent)"
              break
            fi
            echo "::notice::attempt $try: $why; waiting ${wait}s, then sending again"
            sleep "$wait"
            waited=$((waited + wait))
          done
          if [ -z "$id" ]; then
            echo "::warning::no full CI run started for $what after $try attempt(s): $why; the next scheduled pr-merge run starts one for main's tip"
            exit 0
          fi
          echo "started run $id"
          echo "{\"dispatcher_run_id\":$GITHUB_RUN_ID,\"run_id\":$id}" >"$RUNNER_TEMP/dispatched.json"
          echo "run-id=$id" >>"$GITHUB_OUTPUT"

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          steps.dispatch.outputs.run-id != ''
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/dispatched.json

      - name: Record the dispatched run
        if: >-
          (steps.dispatch.outputs.run-id != '') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-dispatched-${{ steps.dispatch.outputs.run-id }}
          path: ${{ runner.temp }}/dispatched.json
          retention-days: 30
          if-no-files-found: error

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  wake-eval-released:
    name: Wake Eval Released
    needs: [merge]
    if: >-
      !cancelled() && needs.merge.outputs.eval-released != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main
      - name: Check out the api-budget library
        if: steps.tip.outputs.sha != ''
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/log-api-budget/
          sparse-checkout-cone-mode: false

      - name: Wake pr-merge for each released pull request
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED: ${{ needs.merge.outputs.eval-released }}
          MAX_WAKES: 5
        run: |
          set -euo pipefail
          { . .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null && api_budget_wrap_gh github-token; } || true
          woken=0
          for pr in $RELEASED; do
            if [[ ! $pr =~ ^[1-9][0-9]{0,15}$ ]]; then
              echo "::warning::wake-eval-released: '$pr' is not a pull request number; not woken"
              continue
            fi
            if ((woken >= MAX_WAKES)); then
              echo "::notice title=eval-release wake::pr=$pr not woken: $MAX_WAKES woken this run; the next scheduled run arms it"
              continue
            fi
            woken=$((woken + 1))
            if gh workflow run pr-merge.yml -R "$GITHUB_REPOSITORY" --ref main -f pr="$pr"; then
              echo "::notice title=eval-release wake::pr=$pr pr-merge dispatched"
            else
              echo "::warning::wake-eval-released: the pr-merge dispatch for #$pr failed; its next scheduled run arms it"
            fi
          done

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  report-gate-checks:
    name: Report Gate Checks
    needs: [merge]
    if: always() && needs.merge.outputs.gate-rows == 'true'
    concurrency:
      group: pr-merge-gate-check
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: read
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Read the gate's rows
        id: rows
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@v8
        with:
          name: pr-merge-gate-rows
          path: ${{ runner.temp }}/rows

      - name: Show each candidate's refusal as a check run
        if: steps.rows.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_PATH: ${{ runner.temp }}/rows/pr-merge-summary.json
        run: node .base/.github/scripts/pr-merge/gate-check.mjs

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token
