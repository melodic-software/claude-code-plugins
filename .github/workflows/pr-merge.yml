name: pr-merge

# What this does, in plain words:
#
# The lanes App opens pull requests, each for one issue. The gate treats each
# as class C2 and reads no `work-class:` label: it merges one only when the
# pr-verify verifier passed its current commit against that issue. Instead of
# the owner merging each one by hand, this workflow asks the existing merge gate
# (the babysit merge script) about each such PR and, when the gate says yes, adds the PR to GitHub's merge queue at
# the exact commit the gate checked. The merge queue then runs CI one last
# time and merges.
#
# Dependabot PRs are the other kind it merges, made only of Dependabot's own
# verified commits and only once `ci-status` passes. A non-major bump from an
# allowed publisher (tier `auto`) merges as is. Anything riskier (tier
# `review`: another Actions publisher, a red `ci-status`) merges only after
# the pr-unblock lane's AI review leaves a `verdict=merge` marker, written by
# the lanes App, for the PR's current commit. A major bump, one whose version
# cannot be read, or one whose title and commit metadata disagree, waits for a
# human whatever the verdict while `merge.dependabot.majors` is `hold`.
#
# It runs no AI model and never checks out a PR's own code: every script it
# runs comes from the main branch. The rules live in
# docs/conventions/pr-pipeline.yaml (`merge:` and `lanes.pr-merge`); while
# `merge.report-only` is true there, the lane only reports what it would do
# for its own PRs and changes nothing for them. Dependabot PRs follow
# `merge.dependabot.mode` instead: `enforce` merges them, `report` only
# reports, `off` (or no setting) refuses them. While neither merges, the lane
# adds no PR to the queue and starts no CI run.
#
# How to stop it: set the CLAUDE_LANES_DISABLED (organization) or
# CLAUDE_LANES_REPO_DISABLED (repository) Actions variable to anything but
# "false". The first steps check that switch and stop the run. The merge gate
# cannot read those variables with its own token, so this workflow hands it
# the answer; if the answer is missing, the gate stops too.
#
# One exception to the switch: when the merge queue lands any PR on main,
# whoever enqueued it, the push starts a full CI run of main (the
# dispatch-full-run job), even while the switch or report-only is on, since it
# merges nothing. If that run fails, post-merge-demotion-alert.yml files a
# needs-human issue; it demotes the lane only when the lanes App enqueued one
# of the merges the run covers, or when it cannot tell who enqueued them.
#
# On its schedule it also gives a PR a new head, an empty commit, when a lane
# run on its current head was refused by the token broker as
# workflow-modified, once per version of the workflow file the broker named.
#
# How to keep one PR from merging: put the line `Hold: a human merges this`
# in its body, or add the `do-not-merge` or `needs-human` label (the
# human-gated role label). The gate refuses all of them.

on:
  # Every trigger below is only a wake-up call. The run never trusts the event
  # to say which PR to look at: it lists the open PRs from the GitHub API and
  # checks each one, so any trigger leads to the same decisions.

  # A label was removed, the PR body changed, or a draft became ready. Since
  # every run reads every PR, an event starts a run only when it can make a
  # PR mergeable sooner. Adding a label can only add a hold, which the next
  # run sees anyway, so it starts none; a body edit can unblock (a new
  # closing-issue line, a removed `Hold:` line). pull_request_target runs
  # this file as it is on main, not the PR's copy, so a PR cannot change
  # what this lane does; the job below never checks out the PR's code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [unlabeled, edited, ready_for_review]

  # A person can start a run by hand (Actions tab, "Run workflow") to retry a
  # PR that looks stuck. Only a run on main does anything.
  workflow_dispatch: {}

  # Every 15 minutes the lane looks at every candidate. This is how it sees
  # checks or reviews that finished, a review thread resolved, or a PR dropped
  # from the merge queue. It does not wake on each CI or review completion:
  # those arrive faster than runs finish, which would overflow the
  # concurrency queue below. Its summary also lists candidates that are still
  # blocked and have not changed for over 24 hours.
  schedule:
    - cron: "11,26,41,56 * * * *"

  # A merge-queue landing on main (the merge-queue ruleset has no bypass, so
  # every push to main is one). Only `dispatch-full-run` runs on it: it starts
  # the full CI run that verifies the merge at once instead of at the next
  # scheduled run. The merge job does not run on it, so it never joins the
  # queue below.
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # The post-merge check on its own, and the full CI run of main it asks for,
  # started at once: not after the merge job's candidate listing, which can
  # fail on a GitHub 5xx, nor after its gate loop, which can take many
  # minutes. It reads with this job's own token, so the merge job's Actions
  # token stays read-only. Same mechanics as
  # dispatch-full-run: ref main, and the pr-merge-dispatched-<id> artifact the
  # post-merge check trusts. Not on pull_request_target, whose dispatch the
  # check does not trust; that event's merge job still runs the check.
  post-merge-dispatch:
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out main
      pull-requests: read # read lane merges and their merge-queue entries
      actions: write # read full runs and their records; start pr-require-checks.yml on main
      checks: read # read a failed full run's annotations
      issues: read # read the demotion records the merge floor depends on
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # Live as the merge job reads it: the lane's own PRs not report-only,
      # or Dependabot PRs enforced.
      - name: Read report-only
        id: mode
        if: steps.kill.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          config=.base/docs/conventions/pr-pipeline.yaml
          if [[ $(yq '.merge."report-only"' "$config") =~ ^(false|null)$ ]] ||
            [ "$(yq '.merge.dependabot.mode // "off"' "$config")" = enforce ]; then
            echo "live=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::the lane is report-only; no full CI run started"
          fi

      - name: Check earlier lane merges
        id: post-merge
        if: steps.mode.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          code=0
          python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_postmerge.py \
            --repo "$REPO" --agent-identity "$identity" --lane-merges-only \
            </dev/null >"$RUNNER_TEMP/post-merge.json" || code=$?
          echo "::group::post-merge check: exit $code"
          cat "$RUNNER_TEMP/post-merge.json"
          echo "::endgroup::"
          # 1 (a failure) and 5 (not yet verified) are verdicts; 2, 3 and 4
          # mean the check could not judge, so no full run starts from it.
          case $code in
            2 | 3 | 4) echo "::warning::the post-merge check exited $code (2 refused, 3 unreadable, 4 write failed); no full CI run started from it" ;;
          esac
          needs=$(jq '.needsDispatch == true' "$RUNNER_TEMP/post-merge.json" 2>/dev/null || echo false)
          echo "needs-dispatch=$needs" >>"$GITHUB_OUTPUT"

      - name: Start the full CI run on main
        id: dispatch
        if: steps.post-merge.outputs.needs-dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          id=$(gh api -X POST "repos/$REPO/actions/workflows/pr-require-checks.yml/dispatches" \
            -f ref=main -F return_run_details=true --jq '.workflow_run_id')
          if [[ ! $id =~ ^[1-9][0-9]{0,14}$ ]]; then
            echo "::error::the dispatch returned no run id"
            exit 1
          fi
          echo "started run $id"
          echo "{\"dispatcher_run_id\":$GITHUB_RUN_ID,\"run_id\":$id}" >"$RUNNER_TEMP/dispatched.json"
          echo "run-id=$id" >>"$GITHUB_OUTPUT"

      - name: Record the dispatched run
        if: steps.dispatch.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-merge-dispatched-${{ steps.dispatch.outputs.run-id }}
          path: ${{ runner.temp }}/dispatched.json
          retention-days: 90
          if-no-files-found: error

  merge:
    # A run started on any other branch would use that branch's copy of this
    # file, so it does nothing. pull_request_target runs carry the PR's base
    # branch here, so PRs that do not target main are skipped too. Events from
    # a fork PR are skipped before the job joins the concurrency group, so an
    # outsider editing a fork PR over and over cannot keep pushing real runs
    # out of the queue.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'push'
      && (github.event_name != 'pull_request_target'
      || github.event.pull_request.head.repo.full_name == github.repository)
    # One run at a time, and a running one is never cancelled: a cancelled run
    # could stop between the gate's check and its merge-queue write. Extra runs
    # wait in line (`queue: max`) instead of being dropped. Without it GitHub
    # keeps only one waiting run and cancels the rest, which leaves CANCELLED
    # `merge` checks on PRs and makes the merge hook refuse them. Waiting is
    # harmless because every run re-reads every PR from the API, and a run
    # with a pending successor that does its work skips the gate (the
    # superseded step). GitHub caps
    # the waiting line at 100 runs and rejects the rest, so the triggers above
    # must start runs more slowly than they finish.
    concurrency:
      group: pr-merge
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out main
      pull-requests: read # list the open PRs
      # The gate's pr-verify verdict reads (artifact listing, run records,
      # download); the lane token holds no Actions permission.
      actions: read
      checks: read # read a refused lane run's annotations and its PR head's checks
      id-token: write # prove to the token broker which workflow this is
    outputs:
      # `true` when the lane can merge (its own PRs are not report-only, or
      # Dependabot PRs are enforced) and either a PR merged during this run
      # and the gate could not start the follow-up full CI run itself (its
      # token cannot start workflows). While neither can merge it is never
      # true; the summary says what would have been started. An earlier lane
      # merge that still needs a full run is the post-merge-dispatch job's.
      dispatch: ${{ steps.mode.outputs.live == 'true' && steps.gate.outputs.dispatch == 'true' }}
    steps:
      # Everything below runs from main as it is right now, never from a PR.
      # Full history: the gate reads the pipeline config's history from this
      # clone with git instead of one contents-API call per commit.
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      # The off switch, checked before anything else.
      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
        run: echo "::notice::the lanes kill switch stops this run (reason ${REASON:-unreadable}); nothing checked or merged"

      # The token broker gives this lane its merge token only when the person
      # behind the run is a listed human (trusted-actors.json on main). Runs
      # started by a bot, such as the lanes App pushing or labeling, or by an
      # unlisted account, stop here quietly instead of failing; the next
      # scheduled run picks up whatever they changed. A scheduled run always
      # proceeds: nobody starts it, and GitHub names as its actor whoever last
      # changed the schedule or the default branch, often a bot.
      - name: Check who started the run
        id: who
        if: steps.kill.outputs.proceed == 'true'
        env:
          EVENT: ${{ github.event_name }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          LIST: .base/.github/standards/trusted-actors/trusted-actors.json
        run: |
          set -euo pipefail
          if [ "$EVENT" = schedule ]; then
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          elif [[ $ACTOR_ID =~ ^[1-9][0-9]*$ ]] &&
            jq -e --argjson id "$ACTOR_ID" --arg login "$TRIGGERING_ACTOR" '
              [.actors[] | select(.kind == "human")] as $humans
              | ($humans | any(.id == $id))
                and ($humans | any((.login | ascii_downcase) == ($login | ascii_downcase)))
            ' "$LIST" >/dev/null; then
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::started by ${TRIGGERING_ACTOR:-an unknown account}, who is not a listed human; nothing checked here, the next scheduled run checks every candidate"
            echo "proceed=false" >>"$GITHUB_OUTPUT"
          fi

      # A run still pending in the concurrency group below starts after this
      # one. When one is pending that checks every candidate and does every
      # follow-up this run would, this run ends green here with a notice,
      # before it takes the lane token, so a backlog costs one sweep and no
      # run is cancelled. Any error leaves superseded unset and the gate runs.
      # Rules: .github/scripts/pr-merge/superseded.mjs.
      - name: Check for a newer run that does this work
        id: superseded
        if: steps.who.outputs.proceed == 'true'
        continue-on-error: true
        env:
          # The lane token holds no Actions permission.
          ACTIONS_TOKEN: ${{ github.token }}
          TRUSTED_ACTORS_PATH: .base/.github/standards/trusted-actors/trusted-actors.json
        run: node .base/.github/scripts/pr-merge/superseded.mjs

      # Reads the lane's rules from main and works out which token
      # permissions its `merge-pr` activity gets.
      - name: Resolve the config
        id: config
        if: steps.who.outputs.proceed == 'true' && steps.superseded.outputs.superseded != 'true'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: pr-merge
          activity: merge-pr
          base-path: .base
          output-path: ${{ runner.temp }}/resolved-config.json

      # Report-only or live, read the same way the gate reads it: for the
      # lane's own PRs only `false` (or no setting at all) is live; for
      # Dependabot PRs only `merge.dependabot.mode: enforce` is, and only
      # `report` or `enforce` lists them at all. While neither is live this
      # run starts no CI run either.
      - name: Read report-only
        id: mode
        if: steps.config.outcome == 'success'
        run: |
          set -euo pipefail
          config=.base/docs/conventions/pr-pipeline.yaml
          value=$(yq '.merge."report-only"' "$config")
          case "$value" in
            false | null) report_only=false ;;
            *) report_only=true ;;
          esac
          dependabot=$(yq '.merge.dependabot.mode // "off"' "$config")
          case "$dependabot" in
            report | enforce) ;;
            *) dependabot=off ;;
          esac
          live=false
          if [ "$report_only" = false ] || [ "$dependabot" = enforce ]; then
            live=true
          fi
          {
            echo "report-only=$report_only"
            echo "dependabot=$dependabot"
            echo "live=$live"
          } >>"$GITHUB_OUTPUT"

      # Swaps this job's GitHub identity proof for a short-lived token of the
      # lanes App, with exactly the permissions resolved above. The broker
      # re-checks everything itself (main only, this file unchanged from main,
      # kill switch, a listed human) and hands out one token per job. A queued
      # run that a change to this file on main superseded is refused
      # `workflow-modified`; it ends green with a warning and no token, so the
      # steps below skip and no stale failed `merge` check lands on a PR. The
      # newer run checks every PR.
      - name: Request the lane token
        id: lane-token
        if: steps.config.outcome == 'success'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: pr-merge
          activity: merge-pr
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}
          superseded-ok: true

      # Measures the lane token's spend: this reading and the one before the
      # revoke bracket the run. GET /rate_limit does not count against the
      # REST limit. The installation's bucket is shared by every job using the
      # lanes App, so the difference includes their calls. Never fails the job.
      - name: Log the lane token rate limit at mint
        id: rate-start
        if: steps.lane-token.outputs.token != ''
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: |
          r=$(gh api rate_limit)
          line=$(jq -r '"mint core remaining=\(.resources.core.remaining) used=\(.resources.core.used) limit=\(.resources.core.limit) reset=\(.resources.core.reset | todate)"
            + (if .resources.graphql then " graphql remaining=\(.resources.graphql.remaining)" else "" end)' <<<"$r")
          echo "::notice title=lane-app-rate::$line"
          echo "lane-app-rate: $line" >>"$GITHUB_STEP_SUMMARY"
          jq -r '"used=\(.resources.core.used)\nreset=\(.resources.core.reset)"' <<<"$r" >>"$GITHUB_OUTPUT"

      # Candidates: open, non-draft PRs into main that the lanes App
      # (merge.agent-identity on main) opened, plus Dependabot's unless
      # merge.dependabot.mode is off. This is only a shortlist; the gate checks
      # the author, the closing issue and verifier verdict or the Dependabot
      # tier, and every other rule again. A candidate the gate would refuse on
      # its listed labels or body alone (the `do-not-merge` label, the
      # human-gated role label from .work-item-tracker.json, `needs-human` by
      # default, or a hold in the body) is set aside here before it costs
      # lane-token calls (babysit_merge_prefilter.py); the summary still
      # reports it. Read with the job's own read-only token.
      - name: List the candidate PRs
        id: candidates
        if: steps.lane-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPENDABOT: ${{ steps.mode.outputs.dependabot }}
        run: |
          set -euo pipefail
          identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          slug=${identity%\[bot\]}
          if ! [[ $slug =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::merge.agent-identity is not an App bot login: $identity"
            exit 1
          fi
          authors=("app/$slug")
          # The gate resolves the same label through babysit_postmerge._role_label.
          human_gated=needs-human
          if [ -f .base/.work-item-tracker.json ]; then
            human_gated=$(jq -er '[objects | .config | objects | .role_labels | objects
              | .["human-gated"] | strings | gsub("^\\s+|\\s+$"; "")][0] // ""
              | if . == "" then "needs-human" else . end' \
              .base/.work-item-tracker.json) || {
              echo "::error::cannot read the human-gated role label from the base .work-item-tracker.json"
              exit 1
            }
          fi
          if [ "$DEPENDABOT" != off ]; then
            authors+=(app/dependabot)
          fi
          # A 5xx from the API fails one call; three tries, then one clear
          # error instead of jq and the prefilter failing on empty input.
          listing="$RUNNER_TEMP/listing.jsonl"
          : >"$listing"
          for author in "${authors[@]}"; do
            for attempt in 1 2 3; do
              if gh pr list --repo "$REPO" --base main --state open --limit 500 \
                --author "$author" --json number,headRefOid,isDraft,updatedAt,labels,body >>"$listing"; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::gh pr list --author $author failed 3 times; no candidates listed, the gate does not run"
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done
          jq -cs '[add[] | select(.isDraft | not)
              | {number, head: .headRefOid, updatedAt, labels: [.labels[].name], body}]
              | unique_by(.number)' "$listing" |
            python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_merge_prefilter.py \
              --human-gated="$human_gated" >"$RUNNER_TEMP/prefilter.json"
          jq -c .candidates "$RUNNER_TEMP/prefilter.json" >"$RUNNER_TEMP/candidates.json"
          jq -c .held "$RUNNER_TEMP/prefilter.json" >"$RUNNER_TEMP/held.json"
          echo "count=$(jq length "$RUNNER_TEMP/candidates.json")" >>"$GITHUB_OUTPUT"

      # The post-merge check, read-only, on every run whether or not any PR is
      # a candidate: after the queue lands the last lane PR there is none, yet
      # that merge still needs its full CI run to be verified. It looks only
      # at PRs this lane put in the merge queue itself; merges by a person or
      # by another App (a release PR, say) are not the lane's to check.
      # It runs before the gate, which reuses its answer for every candidate
      # whose base has the same floor while no lane merge has landed since
      # (--postmerge-result); a PR that merges during the run is in the
      # gate's own `dispatch` output. The post-merge-dispatch job runs the
      # same check to start the full run an earlier merge needs, so neither a
      # failed listing nor a long gate loop holds that run back.
      - name: Check earlier lane merges
        id: post-merge
        if: steps.lane-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          identity=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          code=0
          python3 .base/plugins/source-control/skills/babysit-prs/scripts/babysit_postmerge.py \
            --repo "$REPO" --agent-identity "$identity" --lane-merges-only \
            </dev/null >"$RUNNER_TEMP/post-merge.json" || code=$?
          echo "::group::post-merge check: exit $code"
          cat "$RUNNER_TEMP/post-merge.json"
          echo "::endgroup::"
          needs=$(jq '.needsDispatch == true' "$RUNNER_TEMP/post-merge.json" 2>/dev/null || echo false)
          echo "needs-dispatch=$needs" >>"$GITHUB_OUTPUT"

      # The gate itself, once per candidate, using the lane App's token. It is
      # the same script the local babysit loop uses, run as the pr-merge lane:
      # it refuses on any hold, missing review, failing check, risk above LOW,
      # a changed file on the denied list, no passing verifier verdict at the
      # head, or a head that moved since listing.
      # A Dependabot PR is judged by its tier and `ci-status` instead of the
      # risk score, denied list and verdict.
      # When it passes (and that PR's kind is live) it posts the checked commit as
      # a pin comment and adds the PR to the merge queue at that commit.
      # The gate's token cannot read the kill switch, so it gets this run's
      # own answer from the first step: the word `proceed`, or nothing. It
      # stops on anything but `proceed`. For the same reason it gets the
      # CLAUDE_LANES_MERGE_RUNG_CAP variable from here: a person can set it to
      # `off` (or `C2`) to lower how far the lane may go; left unset, there is
      # no extra limit.
      - name: Run the merge gate on each candidate
        id: gate
        if: steps.candidates.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          # Only the verdict reader's Actions calls use this, as their own
          # GH_TOKEN (babysit_verify_evidence.py); the job runs main's code
          # alone, never a PR's.
          BABYSIT_VERIFY_GH_TOKEN: ${{ github.token }}
          # The first candidate saves its artifact listing here and the rest
          # of the run reads it while it is under two minutes old; a
          # candidate the saved listing would allow lists again before it is
          # allowed.
          BABYSIT_VERIFY_LISTING: ${{ runner.temp }}/verify-listing.json
          # Reads that are the same for every candidate (acting login,
          # credential pass, permissions, trusted list, run heads on main,
          # FAIL run records, default branch, base rules, the queued entries
          # a candidate kept) are shared here within their bounds
          # (babysit_run_cache.py).
          BABYSIT_RUN_CACHE: ${{ runner.temp }}/babysit-run-cache.json
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SCRIPT: ${{ steps.config.outputs.script }}
          KILL_SWITCH: ${{ steps.kill.outputs.proceed == 'true' && 'proceed' || '' }}
          RUNG_CAP: ${{ vars.CLAUDE_LANES_MERGE_RUNG_CAP }}
        run: |
          set -euo pipefail
          # The script and its flags come from the merge-pr activity on main.
          read -ra args < <(jq -r '.selected.args // ""' "$RUNNER_TEMP/resolved-config.json")
          results="$RUNNER_TEMP/results.jsonl"
          # The sweep's API cost: core remaining before and after the loop,
          # for the lane token and the github.token the verdict reads use.
          rate() { gh api rate_limit --jq '.resources.core | "\(.remaining)/\(.limit) reset=\(.reset)"' || echo unread; }
          cost() { [[ $1 =~ ^[0-9]+/ && $2 =~ ^[0-9]+/ && ${1#*reset=} == "${2#*reset=}" ]] && echo $((${1%%/*} - ${2%%/*})) || echo unknown; }
          lane_before=$(rate)
          verify_before=$(GH_TOKEN=$BABYSIT_VERIFY_GH_TOKEN rate)
          echo "rate before the gate: lane $lane_before github.token $verify_before"
          # The candidates set aside for a hold, reported as the gate would.
          jq -c '.[] | {pr: .number, head, updatedAt, exit: 10, ready: false,
            enqueued: false, merged: false, reportOnly: null, reason: "prefilter:\(.reason)",
            dispatched: null, blockers: ["prefilter: \(.reason), refused before the gate"]}' \
            "$RUNNER_TEMP/held.json" >"$results"
          while read -r number head updated; do
            out="$RUNNER_TEMP/gate-$number.json"
            code=0
            ".base/$SCRIPT" "${args[@]}" --allowed-owners "$OWNER" \
              --lane-kill-switch "$KILL_SWITCH" --lane-rung-cap "$RUNG_CAP" \
              --postmerge-result "$RUNNER_TEMP/post-merge.json" \
              --expected-head "$head" "$REPO#$number" </dev/null >"$out" || code=$?
            echo "::group::PR #$number at $head: exit $code"
            cat "$out"
            echo "::endgroup::"
            # Keep only the verdict fields; a gate that printed no JSON object
            # is recorded as an error with its exit code.
            jq -e 'type == "object"' "$out" >/dev/null 2>&1 || echo '{"error": "gate printed no JSON"}' >"$out"
            jq -c --argjson n "$number" --arg head "$head" --arg updated "$updated" --argjson code "$code" '
              {pr: $n, head: $head, updatedAt: $updated, exit: $code,
               ready: (.ready == true), enqueued: (.enqueued == true), merged: (.merged == true),
               reportOnly: .unattended.reportOnly, reason: (.unattended.reason // .error),
               dispatched: .unattended.dispatched, blockers: (.blockers // [])}
            ' "$out" >>"$results"
          done < <(jq -r '.[] | "\(.number) \(.head) \(.updatedAt)"' "$RUNNER_TEMP/candidates.json")
          lane_after=$(rate)
          verify_after=$(GH_TOKEN=$BABYSIT_VERIFY_GH_TOKEN rate)
          echo "rate after the gate: lane $lane_after github.token $verify_after"
          echo "sweep-cost=$(cost "$lane_before" "$lane_after") github-token-cost=$(cost "$verify_before" "$verify_after") candidates=$(jq length "$RUNNER_TEMP/candidates.json")" >>"$GITHUB_STEP_SUMMARY"
          jq -s . "$results" >"$RUNNER_TEMP/pr-merge-summary.json"
          dispatch=$(jq 'any(.[]; .merged and .dispatched != true)' "$RUNNER_TEMP/pr-merge-summary.json")
          echo "dispatch=$dispatch" >>"$GITHUB_OUTPUT"

      # The run's report: every candidate with its verdict, whether a full CI
      # run is started (or, in report-only mode, would have been), then the
      # ones that are blocked and untouched for over 24 hours, which need a
      # person.
      - name: Write the summary
        if: always() && steps.gate.outcome != 'skipped'
        env:
          EVENT: ${{ github.event_name }}
          LIVE: ${{ steps.mode.outputs.live }}
          WANTS_DISPATCH: ${{ steps.gate.outputs.dispatch == 'true' }}
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/pr-merge-summary.json"
          [ -f "$summary" ] || echo '[]' >"$summary"
          cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          # Backticks are dropped so PR-supplied text cannot end the code block.
          {
            echo "### pr-merge ($EVENT)"
            echo
            echo '```json'
            jq '[.[] | .blockers |= map(gsub("[\r\n`]"; " ") | .[0:300])]' "$summary"
            echo '```'
            echo
            if [ "$WANTS_DISPATCH" != true ]; then
              echo "Full CI run on main: none for a merge in this run; earlier lane merges are the post-merge-dispatch job's."
            elif [ "$LIVE" = true ]; then
              echo "Full CI run on main: started by the next job."
            else
              echo "Full CI run on main: would be started; report-only, so none was."
            fi
            echo
            echo "#### Blocked for over 24 hours"
            echo
            jq -r --arg cutoff "$cutoff" '
              [.[] | select(((.enqueued or .merged) | not) and .updatedAt < $cutoff)]
              | if length == 0 then "None." else .[] | "- #\(.pr): \((.reason // "not ready") | tostring | gsub("[\r\n`]"; " ") | .[0:200])" end
            ' "$summary"
          } >>"$GITHUB_STEP_SUMMARY"

      # A pr-refine or pr-unblock run the broker refused as
      # workflow-modified cannot pass on a rerun, which keeps its first
      # event's workflow files. On the schedule, this pushes an empty commit
      # with the lane token to each such PR whose head check-trusted-trigger
      # would trust (no fork, no Dependabot PR), so new runs start on main's
      # files: at most five a run, and once per PR per version of the file the
      # broker named, recorded in a marker comment first. It runs after the
      # gate, which refuses a PR with a failing check, and not while the lane
      # is report-only. Rules: .github/scripts/pr-merge/refire-refused.mjs.
      - name: Re-fire lane runs refused as workflow-modified
        if: >-
          always() && github.event_name == 'schedule'
          && steps.lane-token.outputs.token != ''
          && steps.mode.outputs.report-only == 'false'
        env:
          LANES_APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          # The job's own read-only token lists runs, jobs and annotations;
          # the lane token holds no Actions or Checks permission.
          ACTIONS_TOKEN: ${{ github.token }}
          KILL_SWITCH: ${{ steps.kill.outputs.proceed == 'true' && 'proceed' || '' }}
          TRUSTED_ACTORS_PATH: .base/.github/standards/trusted-actors/trusted-actors.json
        run: node .base/.github/scripts/pr-merge/refire-refused.mjs

      - name: Log the lane token rate limit at job end
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
          START_USED: ${{ steps.rate-start.outputs.used }}
          START_RESET: ${{ steps.rate-start.outputs.reset }}
        run: |
          r=$(gh api rate_limit)
          line=$(jq -r --arg s "$START_USED" --arg sr "$START_RESET" '"end core remaining=\(.resources.core.remaining) used=\(.resources.core.used) limit=\(.resources.core.limit) reset=\(.resources.core.reset | todate)"
            + (if .resources.graphql then " graphql remaining=\(.resources.graphql.remaining)" else "" end)
            + (if $s == "" then ""
               elif ($sr | tostring) != (.resources.core.reset | tostring) then " used-since-mint=window-rolled"
               else " used-since-mint=\(.resources.core.used - ($s | tonumber))" end)' <<<"$r")
          echo "::notice title=lane-app-rate::$line"
          echo "lane-app-rate: $line" >>"$GITHUB_STEP_SUMMARY"

      # The token is cancelled as soon as the job is done; it would otherwise
      # expire within the hour. This never fails the job.
      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: |
          # The header goes through stdin so the token never appears in a
          # process listing.
          status=$(printf 'Authorization: Bearer %s\n' "$GH_TOKEN" |
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X DELETE -H @- \
              -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/installation/token" || true)
          if [ "$status" = 204 ]; then
            echo "the lane token is revoked"
          else
            echo "::warning::the lane token was not revoked (DELETE $status); it expires within the hour"
          fi

  # Starts the full CI run that verifies main. Starting a workflow needs
  # `actions: write`, which the lane App token does not have, so this job does
  # it with its own GitHub token, in two cases:
  #   * The merge job says a lane PR merged during its run, which it never
  #     says while nothing can merge. A run woken by pull_request_target
  #     leaves it to the next run: the post-merge check does not trust a
  #     dispatch from that event, which runs the PR base branch's copy of
  #     this file.
  #   * A push to main, whoever merged: a person, a release App or the lanes
  #     App. The run it starts is a `dispatch` signal for
  #     post-merge-demotion-alert.yml, and for a lane merge the post-merge
  #     check credits it through the artifact below.
  # An earlier lane merge the post-merge check still finds unverified is the
  # post-merge-dispatch job's, which is also the catch-up for a push dispatch
  # that failed. A lane merge can get a second run from it when it checks the
  # merge before the push dispatch's run exists.
  #
  # BURSTS COLLAPSE HERE, NOT IN pr-require-checks.yml. Push jobs share one
  # group without `cancel-in-progress`, so one runs while one waits; a newer
  # push replaces the waiting job, which is cancelled before it dispatches
  # anything. The running job holds the group until the run it started
  # finishes, so the waiting one dispatches main's tip then, which contains
  # every merge it replaced. A pending pr-require-checks run is never
  # cancelled: babysit_postmerge.py and post-merge-demotion-alert.yml both
  # count a cancelled full run as red. Every other event takes a group of its
  # own and does not wait.
  dispatch-full-run:
    needs: [merge]
    if: >-
      !cancelled()
      && ((needs.merge.result == 'success' && needs.merge.outputs.dispatch == 'true'
      && github.event_name != 'pull_request_target')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    concurrency:
      group: ${{ github.event_name == 'push' && 'pr-merge-verify-main' || format('pr-merge-dispatch-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # A push job waits for the full run, whose longest lane is capped at 16
    # minutes, plus time in the runner queue.
    timeout-minutes: 45
    permissions:
      actions: write # start pr-require-checks.yml on main and read its status
    steps:
      - name: Start the full CI run on main
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          id=$(gh api -X POST "repos/$REPO/actions/workflows/pr-require-checks.yml/dispatches" \
            -f ref=main -F return_run_details=true --jq '.workflow_run_id')
          if [[ ! $id =~ ^[1-9][0-9]{0,14}$ ]]; then
            echo "::error::the dispatch returned no run id"
            exit 1
          fi
          echo "started run $id"
          echo "{\"dispatcher_run_id\":$GITHUB_RUN_ID,\"run_id\":$id}" >"$RUNNER_TEMP/dispatched.json"
          echo "run-id=$id" >>"$GITHUB_OUTPUT"

      # The post-merge check counts a full run started by github-actions[bot]
      # only when a pr-merge.yml run on main uploaded an artifact naming it.
      # Only this run's own steps can upload this run's artifacts.
      - name: Record the dispatched run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-merge-dispatched-${{ steps.dispatch.outputs.run-id }}
          path: ${{ runner.temp }}/dispatched.json
          retention-days: 90
          if-no-files-found: error

      # Holds the push group until the run finishes, so a burst of merges
      # waits here as one pending job. One REST read a minute; the run's
      # result is post-merge-demotion-alert.yml's to judge, not this job's.
      - name: Wait for the full run to finish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.dispatch.outputs.run-id }}
        run: |
          set -euo pipefail
          for _ in $(seq 40); do
            sleep 60
            status=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .status) || continue
            if [ "$status" = completed ]; then
              echo "run $RUN_ID completed"
              exit 0
            fi
          done
          echo "::warning::run $RUN_ID did not finish within 40 minutes; releasing the group"
