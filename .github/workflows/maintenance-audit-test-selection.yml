name: Maintenance Audit Test Selection

# Miss detection for the pull-request test selection (scripts/affected-tests.sh).
# Informational: not in pr-require-checks.yml and not behind `ci-status`, so nothing here can
# block a merge. It reports in the job summary and an artifact and never opens
# or edits an issue.
#
# Pull-request time comes first: pr-require-checks.yml's `test-selection` job
# traces the suites a pull request adds or changes, and an undeclared read
# fails that pull request. The daily trace here is the backstop for reads that
# change through files no suite change touches: a suite whose code is
# unchanged starts reading a file through a library, tool or fixture another
# pull request changed
# (https://github.com/melodic-software/claude-code-plugins/issues/17522).
#
#   audit-test-selection  daily and on dispatch: traces one seventh of the
#                         suites under strace and reports every file a suite
#                         read whose one-file diff would not select that suite.
#                         The seventh rotates with the day, so every suite is
#                         traced within a week; the whole corpus under strace
#                         would not fit the 35-minute job.
#   audit-failed-suite-selection
#                         when a pr-require-checks run on main fails: for each
#                         failing suite, replays the selector on every commit
#                         since the suite's last green run and reports a
#                         selection miss when none of them selected it.
#
# 10:43 UTC is the quietest hour of ci load (1.4 runs/hour over 8 days, against
# 36 at 05h) and clear of the scheduled full pr-require-checks run.

on:
  schedule:
    - cron: "43 10 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "I/N of the suite corpus to trace; empty traces today's seventh, 0/1 traces every suite"
        required: false
        default: ""
      suites:
        description: "Space-separated suite paths to trace instead of a shard"
        required: false
        default: ""
  # Runs only for pr-require-checks runs on main, checks out main, holds a read-only token and
  # no secret, so no fork-controlled code runs with privileges.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [PR Require Checks]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  audit-test-selection:
    name: Audit Test Selection
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    concurrency:
      group: selection-audit-trace
      cancel-in-progress: false
    env:
      npm_config_audit: "false"
      npm_config_fetch_timeout: "60000"
      npm_config_fund: "false"
      npm_config_globalconfig: ${{ github.workspace }}/.github/npm-fetch.npmrc
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            .github/requirements-ci.txt
            plugins/animation/requirements.txt
      - name: Install and verify ShellCheck toolchain
        uses: melodic-software/ci-workflows/.github/actions/shellcheck@main
        with:
          paths: plugins/bash-format
          rcfile: .shellcheckrc
      - name: Install pinned shfmt
        uses: $/.github/actions/setup-pinned-shfmt
      - name: Install locked test toolchains
        timeout-minutes: 5
        run: |
          npm ci
          npm ci --prefix scripts/ci-deps
          python -m pip install --user --only-binary=:all: --require-hashes \
            --requirement .github/requirements-ci.txt \
            --requirement plugins/animation/requirements.txt
          python plugins/harness-ops/skills/inventory/scripts/parser_reader.py --install
          node node_modules/playwright/cli.js install --only-shell chromium
      - name: Install DuckDB CLI
        env:
          DUCKDB_VERSION: v1.5.5
          DUCKDB_SHA256: c61f21485e6e41d3a0c28ce9904ea18346309cf427b4cf9479bc3564348dc885
        run: |
          mkdir -p "$RUNNER_TEMP/duckdb"
          curl -fsSL --retry 7 --retry-all-errors -o "$RUNNER_TEMP/duckdb/duckdb.gz" \
            "https://github.com/duckdb/duckdb/releases/download/$DUCKDB_VERSION/duckdb_cli-linux-amd64.gz"
          echo "$DUCKDB_SHA256  $RUNNER_TEMP/duckdb/duckdb.gz" | sha256sum -c -
          gunzip "$RUNNER_TEMP/duckdb/duckdb.gz"
          chmod +x "$RUNNER_TEMP/duckdb/duckdb"
      - name: Test the selection audit
        run: bash scripts/selection-audit.test.sh
      # Budget 1500 s: suites start for the first 900 s, selector queries stop
      # at 1500 s, and anything cut off is counted in the report, not dropped.
      # PATH is set here rather than through GITHUB_PATH, which zizmor rejects
      # in a workflow that also has a workflow_run trigger.
      - name: Trace suites and report selection gaps
        env:
          SHARD_INPUT: ${{ inputs.shard }}
          SUITES_INPUT: ${{ inputs.suites }}
          ANIMATION_REQUIRE_DEPS: '1'
          INVENTORY_REQUIRE_ACORN: '1'
          CODE_TIDYING_REQUIRE_TREE_SITTER: '1'
        run: |
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$HOME/.local/bin:$RUNNER_TEMP/duckdb:$PATH"
          shard="${SHARD_INPUT:-$(($(date -u +%s) / 86400 % 7))/7}"
          read -ra suites <<<"$SUITES_INPUT"
          scripts/selection-audit.sh trace --shard "$shard" --jobs 4 --budget 1500 \
            --out "$RUNNER_TEMP/selection-audit" "${suites[@]}"
      - name: Upload the trace report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: selection-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/selection-audit/*.md
            ${{ runner.temp }}/selection-audit/*.tsv
            ${{ runner.temp }}/selection-audit/logs/
          retention-days: 7

  audit-failed-suite-selection:
    name: Audit Failed Suite Selection
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      contains(fromJSON('["push","schedule"]'), github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: read
      actions: read
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Replay the selection for each failing suite
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: scripts/selection-audit.sh red-replay --run-id "$RUN_ID" --out "$RUNNER_TEMP/red-replay"
      - name: Upload the replay report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: selection-red-replay-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/red-replay/report.md
          retention-days: 7

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: $/.github/actions/log-api-budget
        with:
          tokens: github-token
