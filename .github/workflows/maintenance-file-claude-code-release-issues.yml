name: maintenance-file-claude-code-release-issues

# Daily: files one issue per Claude Code release newer than the read marker in
# docs/upstream/claude-code.md, so a release is noticed without someone first
# running /harness-ops:changelog. It runs the changelog skill's
# changelog-status.sh in its fetching mode, puts the status in the job summary,
# and hands it to scripts/claude-code-release-issues.sh, which files
# `Claude Code changelog: <version>` unless that title exists in any state, or,
# over the replay cap, one `Claude Code changelog: unread releases beyond the
# replay cap` issue unless one is open. A range the status script could not
# compute, or a missing marker, fails the run and files nothing. It adds no
# label: the issue proposes an apply, it never admits one. triage-filed-issues
# then dispatches intake-triage.yml for each issue filed. Intake leaves a
# per-release issue to upstream-apply-changelog.yml, which builds every release
# itself (`release-lane-titles` in
# .github/actions/resolve-config/admission-rules.json), so the issue lane never
# builds it too.
#
# It runs no model and holds no lanes App token or secret: the filing job's
# GITHUB_TOKEN reads contents and writes only issues, and the dispatch job's
# holds only actions: write. Only the schedule and a manual run with no inputs
# start it. Changelog text reaches the issue helper as a file, never through a
# `${{ }}` expression.
#
# How to stop it: set the organization or repository lanes kill-switch
# variable to anything but "false".
#
# 08:27 UTC sits clear of the other scheduled runs here.

on:
  schedule:
    - cron: "27 8 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: maintenance-file-claude-code-release-issues
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  file-release-issues:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the ledger and the scripts
      issues: write # file the release issues
    outputs:
      # The numbers of the issues filed, space separated, for triage-filed-issues.
      issues: ${{ steps.file.outputs.issues }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
        run: echo "::notice::the lanes kill switch stops this run (reason ${REASON:-unreadable}); nothing read or filed"

      - name: Read the changelog status
        if: steps.kill.outputs.proceed == 'true'
        working-directory: .base
        run: |
          f="$RUNNER_TEMP/status.txt"
          bash plugins/harness-ops/skills/changelog/scripts/changelog-status.sh --ledger docs/upstream/claude-code.md >"$f"
          {
            echo "### Claude Code changelog status"
            echo
            echo '```text'
            cat "$f"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: File release issues
        id: file
        if: steps.kill.outputs.proceed == 'true'
        working-directory: .base
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/claude-code-release-issues.sh "$RUNNER_TEMP/status.txt"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # An issue the job's GITHUB_TOKEN files starts no issues run, so intake
  # never sees it; a workflow_dispatch from the same token does start one.
  # Its own job holds the dispatch grant, not the job that writes issues, as
  # intake-triage.yml's triage-split-children does.
  triage-filed-issues:
    needs: [file-release-issues]
    if: ${{ !cancelled() && needs.file-release-issues.outputs.issues != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # dispatch intake-triage.yml
    steps:
      - name: Triage each filed release issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES: ${{ needs.file-release-issues.outputs.issues }}
        run: |
          read -ra issues <<< "$ISSUES"
          for issue in "${issues[@]}"; do
            if ! [[ $issue =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo "::error::an issue number is not a number"
              exit 1
            fi
          done
          calls=0
          # The count never changes the step's exit status.
          trap '{ echo "$calls" >"$RUNNER_TEMP/intake-dispatch-calls"; } 2>/dev/null || :' EXIT
          for issue in "${issues[@]}"; do
            calls=$((calls + 1))
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/intake-triage.yml/dispatches" \
              -f ref=main -f "inputs[issue-number]=$issue"
          done

      # The hub's api-calls notice, as intake-triage.yml's
      # triage-split-children writes it.
      - name: Log the API calls at the end
        if: always()
        run: |
          calls=0
          [[ -f $RUNNER_TEMP/intake-dispatch-calls ]] && calls=$(<"$RUNNER_TEMP/intake-dispatch-calls")
          [[ $calls =~ ^[0-9]{1,6}$ ]] || calls=0
          echo "::notice title=api-calls::github-token=$calls not-modified=0 graphql=0"
