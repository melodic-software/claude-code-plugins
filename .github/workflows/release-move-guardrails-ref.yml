name: release-move-guardrails-ref

# Moves refs/heads/guardrails-release to main's newest guardrails release: the commit that
# changed the `version` in plugins/guardrails/.claude-plugin/plugin.json. Consumers' lefthook
# remotes fetch the guardrails git hooks from that branch (entries.json `remote.ref`), so they run
# released code only. Every repository that adopted the remote runs what this branch points at.
#
# - Runs on main only: a push to main that touches the manifest, or a manual run from main,
#   optionally naming a commit on main. Any other ref fails the job.
# - Moves only by fast-forward: .github/scripts/guardrails-release-ref/move.sh refuses a target off
#   main or one that does not descend from the branch's current tip, and the push carries no force.
#   The first run creates the branch.
# - Tests the target first: plugins/guardrails/git-hooks/lefthook-remote.test.sh runs with the
#   pinned lefthook against the target commit's own files, end to end, and a failure stops the
#   run before the push. A broken lefthook-remote.yml on the branch would block every
#   consumer's commits.
# - Pushes with this job's GITHUB_TOKEN, so the push starts no workflow; that is intended, since
#   nothing runs on guardrails-release.

on:
  push:
    branches: [main]
    paths:
      - plugins/guardrails/.claude-plugin/plugin.json
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on main to move guardrails-release to; empty: main's newest guardrails version change"
        type: string
        default: ""

permissions: {}

concurrency:
  group: release-move-guardrails-ref
  cancel-in-progress: false

jobs:
  move:
    name: Move guardrails-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Refuse any ref but main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::guardrails-release moves only from main, not $REF"
          exit 1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide the move
        id: decide
        env:
          MAIN: ${{ github.sha }}
          TARGET: ${{ inputs.sha }}
        run: |
          current=""
          rc=0
          git ls-remote --exit-code origin refs/heads/guardrails-release >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch --quiet origin refs/heads/guardrails-release
            current="$(git rev-parse FETCH_HEAD)"
          elif [ "$rc" -ne 2 ]; then
            echo "::error::could not read guardrails-release (git ls-remote exit $rc)"
            exit 1
          fi
          bash .github/scripts/guardrails-release-ref/move.sh "$MAIN" "$TARGET" "$current" >>"$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.decide.outputs.action != 'unchanged'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pinned lefthook
        if: steps.decide.outputs.action != 'unchanged'
        run: bash .github/scripts/guardrails-release-ref/install-lefthook.sh

      - name: Test the target's lefthook remote end to end
        if: steps.decide.outputs.action != 'unchanged'
        env:
          SHA: ${{ steps.decide.outputs.sha }}
          GUARDRAILS_REQUIRE_LEFTHOOK: "1"
        run: |
          git checkout --quiet --detach "$SHA"
          bash plugins/guardrails/git-hooks/lefthook-remote.test.sh

      - name: Push guardrails-release
        if: steps.decide.outputs.action != 'unchanged'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.decide.outputs.sha }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "$SHA:refs/heads/guardrails-release"
          echo "guardrails-release -> $SHA" >>"$GITHUB_STEP_SUMMARY"
