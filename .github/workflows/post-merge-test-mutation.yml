            Bash(git branch *)
            Bash(git rev-parse *)
            Agent
            Read(./mutation-data/**)
            Bash(bash ${{ steps.prompt.outputs.lint }} *)
          disallowed-tools: |
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Read(//proc/**)
            Read(./.base/**)
            mcp__*
            Bash(git log *)
            Bash(git show *)
            Bash(git diff *--no-index*)
            Bash(git diff *--output*)
            Bash(git diff *~*)
            Bash(git diff * /*)
            Bash(git diff *../*)
            Bash(git diff *$*)
          plugin-dirs: |
            .lane/plugins/mutation-testing
          json-schema-file: ${{ runner.temp }}/mutation-schema.json
          leg-timeout-minutes: "40"

      - name: Upload the sealed transcript
        if: always() && steps.run.outputs.execution-file != ''
        continue-on-error: true
        uses: ./.base/.github/actions/upload-lane-transcript # zizmor: ignore[self-repository]
        with:
          execution-file: ${{ steps.run.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}

      # The leg's lane-outcome record: its credential, outcome, handoff,
      # fallback reason and durationMs, one record per leg.
      - name: Record the leg
        if: always() && steps.run.outcome != 'skipped' && steps.run.outcome != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@6b9c640bf209c0c7e76f1111c5d18c96707348a2 # 6b9c640 2026-11-02
        with:
          outcome: ${{ steps.run.outcome }}
          execution-file: ${{ steps.run.outputs.execution-file }}
          log-file: ${{ steps.run.outputs.log-file }}
          lane: post-merge-test-mutation
          lane-id: post-merge-test-mutation
          credential: ${{ steps.run.outputs.credential }}
          handoff: ${{ steps.run.outputs.handoff }}
          known-failure-class: ${{ steps.run.outputs.lane-class }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          fallback-reason: ${{ steps.credential.outputs.fallback-reason }}

      # A usage limit (rate-limit) or an overloaded API (overloaded) on a leg
      # that hands nothing on is a designed stop, not a defect: the run ends
      # green with a notice and the report says so. A handoff is no failure;
      # any other failed leg fails the job.
      - name: Fail the leg unless it handed off or a limit stopped it
        id: stop
        if: always() && steps.run.outcome == 'failure' && steps.run.outputs.handoff != 'true'
        env:
          FAILURE_CLASS: ${{ steps.run.outputs.lane-class }}
        run: |
          case $FAILURE_CLASS in
            rate-limit | overloaded)
              echo "class=$FAILURE_CLASS" >>"$GITHUB_OUTPUT"
              echo "::notice::the triage leg stopped on class $FAILURE_CLASS; nothing to fix in the lane"
              ;;
            *)
              echo "::error::the triage leg failed with class ${FAILURE_CLASS:-unknown}"
              exit 1
              ;;
          esac

      # The leg's structured output, read from the launcher's file only after
      # its init message reports dontAsk; the next job checks it again.
      - name: Keep the triage result
        id: keep
        if: steps.run.outcome == 'success' && steps.run.outputs.structured-output-file != ''
        env:
          EXECUTION_FILE: ${{ steps.run.outputs.execution-file }}
          MODE: dontAsk
          OUTPUT_FILE: ${{ steps.run.outputs.structured-output-file }}
          OUT: ${{ runner.temp }}/triage-out
        run: |
          bash .base/.github/scripts/read-patch/check-permission-mode.sh
          mkdir -p "$OUT"
          jq 'if type == "object" then . else error("the structured output is not an object") end' "$OUTPUT_FILE" >"$OUT/triage.json"
          sum=$(sha256sum <"$OUT/triage.json")
          echo "sha256=${sum%% *}" >>"$GITHUB_OUTPUT"

      - name: Scan the triage result for credentials
        id: scan-upload
        if: steps.keep.outcome == 'success'
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/triage-out/triage.json

      - name: Upload the triage result
        id: upload
        if: (steps.keep.outcome == 'success') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: post-merge-test-mutation-triage-${{ github.job }}-${{ github.run_id }}
          path: ${{ runner.temp }}/triage-out/triage.json
          retention-days: 1
          if-no-files-found: error

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  report:
    name: Report
    needs: [prep, generate, generate-subscription, generate-fallback, mutate, triage, triage-subscription, triage-fallback]
    if: ${{ !cancelled() && needs.prep.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out main for the report script
      pull-requests: write # find the pull requests that merged the pushed range and comment the report on it
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/check-kill-switch/
            /.github/actions/check-trusted-trigger/
            /.github/actions/log-api-budget/
            /.github/actions/setup-pinned-node/
            /.github/scripts/lib/
            /.github/scripts/post-merge-test-mutation/
            /.node-version
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version

      - name: Download the executed mutants
        if: needs.mutate.outputs.artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.mutate.outputs.artifact-id }}
          path: ${{ runner.temp }}/executed

      - name: Download the triage verdicts
        if: (needs.triage-fallback.outputs.artifact-id || needs.triage-subscription.outputs.artifact-id || needs.triage.outputs.artifact-id) != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.triage-fallback.outputs.artifact-id || needs.triage-subscription.outputs.artifact-id || needs.triage.outputs.artifact-id }}
          path: ${{ runner.temp }}/triage

      # Each file by the SHA-256 its job recorded. The result is assembled from
      # the executor's states and triage's verdicts; both are untrusted, read
      # by the scripts and never interpolated into a command.
      - name: Write the report
        id: report
        env:
          EXECUTED: ${{ runner.temp }}/executed/executed.json
          EXECUTED_SUM: ${{ needs.mutate.outputs.sha256 }}
          TRIAGE: ${{ runner.temp }}/triage/triage.json
          TRIAGE_SUM: ${{ needs.triage-fallback.outputs.sha256 || needs.triage-subscription.outputs.sha256 || needs.triage.outputs.sha256 }}
          MUTATE_RESULT: ${{ needs.mutate.result }}
          RESTORED: ${{ needs.mutate.outputs.restored }}
          STOP_CLASS: ${{ needs.generate-fallback.outputs.stop-class || needs.generate-subscription.outputs.stop-class || needs.generate.outputs.stop-class || needs.triage-fallback.outputs.stop-class || needs.triage-subscription.outputs.stop-class || needs.triage.outputs.stop-class }}
          BEFORE: ${{ needs.prep.outputs.before }}
          AFTER: ${{ needs.prep.outputs.after }}
          RANGE_MODE: ${{ needs.generate-fallback.outputs.mode || needs.generate-subscription.outputs.mode || needs.generate.outputs.mode }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          COMMENT_PATH: ${{ runner.temp }}/mutation-comment.md
        run: |
          pinned() { [ -f "$1" ] && [[ $2 =~ ^[0-9a-f]{64}$ ]] && [ "$(sha256sum <"$1" | cut -d' ' -f1)" = "$2" ]; }
          tool=.base/.github/scripts/post-merge-test-mutation
          result="" audit=failure
          if pinned "$EXECUTED" "$EXECUTED_SUM"; then
            triage=()
            if pinned "$TRIAGE" "$TRIAGE_SUM"; then triage=("$TRIAGE"); fi
            if result=$(node "$tool/assemble.mjs" "$EXECUTED" "${triage[@]}"); then audit=success; fi
          elif [ -f "$EXECUTED" ]; then
            echo "::error::executed.json does not match the SHA-256 the mutate job recorded"
          elif [ -n "$MUTATE_RESULT" ]; then
            audit=$MUTATE_RESULT
          fi
          STRUCTURED_OUTPUT=$result AUDIT_RESULT=$audit node "$tool/report.mjs"

      # Runs after a no-result report too, which the comment then says. The body
      # is the file report.mjs built from the validated result, without the
      # model's free-text detail; nothing reaches it through an expression.
      - name: Comment the report on the merged pull request
        if: ${{ !cancelled() && steps.report.outputs.pull != '' }}
        env:
          PULL: ${{ steps.report.outputs.pull }}
          COMMENT_PATH: ${{ runner.temp }}/mutation-comment.md
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .base/.github/scripts/post-merge-test-mutation/comment.mjs

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token
