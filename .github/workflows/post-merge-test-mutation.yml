name: Post Merge Test Mutation

# The post-merge mutation lane: after a push to main that changes a source
# file, runs /mutation-testing:audit on the lines that push changed and writes
# the killed and surviving mutants to the job summary. Mutation testing runs
# post-merge only, never on a pull request. Advisory: it gates nothing, and
# surviving mutants never fail it.
#
# post-merge-select-mutation-range.yml takes the push (with the source-path
# filter) and records its range; this workflow runs on that run's
# workflow_run event.
#
# Jobs:
# - prep: no model. Checks the kill switch and reads the range artifact.
# - key-credit: no model, no secret. Skips a chain's key after a recent
#   credit stop (ci-workflows select-model-credential's start call).
# - generate, generate-subscription, generate-fallback: the model returns the
#   mutants for the lines the push changed (/mutation-testing:audit
#   --phase generate), on the automations API key, then its subscription
#   token, then FALLBACK_CLAUDE_CODE_OAUTH_TOKEN, one credential per job, each
#   after the one before hands off (run-claude-cli). Contents: read, and no
#   test or mutant runs there.
# - mutate: no model and no secret. Applies each mutant and runs its covering
#   tests (execute.mjs), so mutated code never runs beside a Claude
#   credential or a write token.
# - triage, triage-subscription, triage-fallback: the same chain classifies the
#   survivors (--phase triage), runs no test, and starts only when one
#   survived.
# - report: no model. Assembles the result from the mutate job's states and
#   triage's verdicts (assemble.mjs), finds the pull request that merged the
#   head, and writes the job summary. When exactly one pull request merged the
#   head, a second step posts the report there as one comment with
#   GITHUB_TOKEN, editing the lane's earlier one. It is the only job that
#   writes.
#
# Each job passes the next its data as one artifact pinned by the SHA-256 the
# job recorded.
#
# How to stop it: set the organization or repository lanes kill-switch
# variable to anything but "false".

on:
  # The triggering run is main's own gate workflow; this file checks out the
  # pushed head, which is on main, and runs main's code only. Each guard below
  # reads the event's fields.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Post Merge Select Mutation Range]
    types: [completed]
    branches: [main]

permissions: {}

# One run per pushed head; pushes never wait on one another.
concurrency:
  group: post-merge-test-mutation-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prep:
    name: Prep
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # download the range artifact from the triggering run
      contents: read # check out main for the kill-switch action
    outputs:
      proceed: ${{ steps.range.outputs.proceed }}
      before: ${{ steps.range.outputs.before }}
      after: ${{ steps.range.outputs.after }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/check-kill-switch/
            /.github/actions/log-api-budget/
            /.github/actions/setup-pinned-node/
            /.node-version
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}
          # Starts new work: also stop on a low GITHUB_TOKEN budget.
          budget: "true"

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
          CAUSE: ${{ steps.kill.outputs.cause }}
          WHY: ${{ steps.kill.outputs.cause == 'budget' && format('the GITHUB_TOKEN budget is low until {0} (epoch seconds), which stops', steps.kill.outputs.reset) || 'the lanes kill switch stops' }}
        run: echo "::notice::${WHY} this run (reason ${REASON:-unreadable}, cause ${CAUSE:-unreadable}); nothing mutated"

      - name: Download the range
        id: download-range
        if: steps.kill.outputs.proceed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-range
          path: ${{ runner.temp }}/mutation-range
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The artifact's head must be the triggering run's head.
      - name: Check the range
        id: range
        if: steps.kill.outputs.proceed == 'true'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          file="$RUNNER_TEMP/mutation-range/range.json"
          if ! before=$(jq -r '.before // ""' "$file") || ! after=$(jq -r '.after // ""' "$file"); then
            echo "::error::the range artifact is not readable"
            exit 1
          fi
          [[ $after =~ ^[0-9a-f]{40}$ && $after == "$HEAD_SHA" ]] ||
            { echo "::error::the range's head is not the triggering run's head"; exit 1; }
          [[ -z $before || $before =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the range's base is not a SHA"; exit 1; }
          {
            echo "before=$before"
            echo "after=$after"
            echo "proceed=true"
          } >>"$GITHUB_OUTPUT"

      # The range download reads another run's artifacts through
      # download-artifact's own client, which no counter sees.
      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token
          outside: ${{ steps.download-range.outcome != 'skipped' && 'download-range:actions/runs/artifacts' || '' }}

  # The key's credit gate for both chains (ci-workflows select-model-credential,
  # its start call: check-key-credit's one artifact-list call per chain for the
  # marker its key leg uploads after a credit stop). A credit stop inside the
  # window names the subscription leg, and that chain's key leg runs nothing.
  # No secret, no model, no checkout; every failure runs the key. Probing is
  # off.
  key-credit:
    name: Key Credit
    needs: prep
    if: needs.prep.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # list this repository's credit-stop markers
    outputs:
      generate-next-leg: ${{ steps.credit-generate.outputs.next-leg }}
      generate-next-reason: ${{ steps.credit-generate.outputs.next-reason }}
      generate-marker: ${{ steps.credit-generate.outputs.marker }}
      triage-next-leg: ${{ steps.credit-triage.outputs.next-leg }}
      triage-next-reason: ${{ steps.credit-triage.outputs.next-reason }}
      triage-marker: ${{ steps.credit-triage.outputs.marker }}
    steps:
      - name: Read the generate key's credit history
        id: credit-generate
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@5b5110ae015183e900dd098c631d4dcc68904067 # 5b5110a 2026-11-06
        with:
          leg: start
          key-job: generate
          window-hours: ${{ vars.KEY_CREDIT_WINDOW_HOURS }}
          reset-at: ${{ vars.KEY_CREDIT_RESET_AT }}
          probe-minutes: "0"

      # The skipped key leg's lane record: outcome skip, class credit-stop,
      # handed off, so leg counts before and after the gate compare.
      - name: Report the skipped generate key leg
        if: steps.credit-generate.outputs.next-leg == 'subscription'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@6b9c640bf209c0c7e76f1111c5d18c96707348a2 # 6b9c640 2026-11-02
        with:
          outcome: skipped
          lane: post-merge-test-mutation
          lane-id: post-merge-test-mutation
          credential: AUTOMATIONS_CLAUDE_API_KEY
          known-failure-class: credit-stop
          handoff: "true"

      - name: Read the triage key's credit history
        id: credit-triage
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@5b5110ae015183e900dd098c631d4dcc68904067 # 5b5110a 2026-11-06
        with:
          leg: start
          key-job: triage
          window-hours: ${{ vars.KEY_CREDIT_WINDOW_HOURS }}
          reset-at: ${{ vars.KEY_CREDIT_RESET_AT }}
          probe-minutes: "0"

      # The skipped key leg's lane record: outcome skip, class credit-stop,
      # handed off, so leg counts before and after the gate compare.
      - name: Report the skipped triage key leg
        if: steps.credit-triage.outputs.next-leg == 'subscription'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@6b9c640bf209c0c7e76f1111c5d18c96707348a2 # 6b9c640 2026-11-02
        with:
          outcome: skipped
          lane: post-merge-test-mutation
          lane-id: post-merge-test-mutation
          credential: AUTOMATIONS_CLAUDE_API_KEY
          known-failure-class: credit-stop
          handoff: "true"


  # The generate chain's key leg, on the automations role's API key alone: it
  # generates the mutants (skill Phases 0 to 2) and runs no test. A credit stop, or a 401 or 402, hands off to
  # generate-subscription; an empty key, or one the gate skipped, runs nothing here.
  generate:
    name: Generate
    needs: [prep, key-credit]
    if: >-
      ${{ !cancelled() && needs.prep.outputs.proceed == 'true'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    cache-mode: read
    permissions:
      contents: read # check out the pushed head; nothing in this job writes
    outputs:
      next-leg: ${{ steps.next.outputs.next-leg }}
      next-reason: ${{ steps.next.outputs.next-reason }}
      stop-class: ${{ steps.stop.outputs.class }}
      mode: ${{ steps.target.outputs.mode }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.keep.outputs.sha256 }}
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Check out the pushed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prep.outputs.after }}
          fetch-depth: 0
          persist-credentials: false

      # The plugin, the prompt and the config reader come from main at the
      # event's commit.
      - name: Check out main's tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .base
          persist-credentials: false

      # The head must be on main, and the diff target is the push's previous
      # head, or the head's first parent when the push had none (a first push
      # or a rewrite), said in the summary. The personal override is gitignored
      # (.claude/**/*.local.*), so the audit sees a clean tree.
      - name: Set the diff target
        id: target
        env:
          BEFORE: ${{ needs.prep.outputs.before }}
          AFTER: ${{ needs.prep.outputs.after }}
        run: |
          git merge-base --is-ancestor "$AFTER" refs/remotes/origin/main ||
            { echo "::error::the pushed head $AFTER is not on main"; exit 1; }
          if [[ -n $BEFORE ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            target=$BEFORE mode=range
          else
            target=$(git rev-parse "$AFTER^") || { echo "::error::the head has no parent to diff against"; exit 1; }
            mode=commit
            echo "::warning::no usable previous head; mutating only the head commit $AFTER"
          fi
          printf '.base/\n.lane/\nmutation-data/\n' >>.git/info/exclude
          # shellcheck disable=SC2016 # the backticks are the markdown fence
          printf '# Written by post-merge-test-mutation.yml.\n\n```yaml\ndiff-target: %s\n```\n' "$target" \
            >.claude/mutation-testing.local.md
          [ -z "$(git status --porcelain)" ] || { echo "::error::the checkout is not clean before the audit"; exit 1; }
          {
            echo "mode=$mode"
            echo "target=$target"
          } >>"$GITHUB_OUTPUT"

      - name: Set up Node
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version

      # The verify-pr route's profile: a judgment model with its turn cap.
      - name: Resolve the model
        id: models
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: verify-pr
          base-path: .base
          output-path: ${{ runner.temp }}/mutation-models.json

      # Only whether each secret is set leaves this step, never its value.
      # `present` is whether this leg runs the model.
      - name: Check the credential
        id: credential
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@5b5110ae015183e900dd098c631d4dcc68904067 # 5b5110a 2026-11-06
        with:
          leg: key
          role: automations
          credential-set: ${{ secrets.AUTOMATIONS_CLAUDE_API_KEY != '' }}
          selected: ${{ needs.key-credit.outputs.generate-next-leg }}

      # The plugin loads from a read-only copy of main's under the workspace,
      # the one tree run-claude-cli's file tools reach.
      - name: Stage the plugin and the prompt
        id: prompt
        if: steps.credential.outputs.present == 'true'
        env:
          HEAD_SHA: ${{ needs.prep.outputs.after }}
          DIFF_TARGET: ${{ steps.target.outputs.target }}
          PROMPT_FILE: ${{ runner.temp }}/mutation-prompt.md
          SCHEMA_FILE: ${{ runner.temp }}/mutation-schema.json
          MODEL: ${{ steps.models.outputs.model }}
        run: |
          [ -n "$MODEL" ] || { echo "::error::the verify-pr route's model is default, which run-claude-cli cannot pass"; exit 1; }
          mkdir -p .lane/plugins
          cp -R .base/plugins/mutation-testing .lane/plugins/
          [ -z "$(find .lane -type l -print -quit)" ] || { echo "::error::the staged plugin holds a symbolic link"; exit 1; }
          chmod -R a-w .lane/plugins
          prompt=$(<.base/.github/scripts/post-merge-test-mutation/generate.prompt.md)
          prompt=${prompt//HEAD_SHA/$HEAD_SHA}
          prompt=${prompt//DIFF_TARGET/$DIFF_TARGET}
          prompt=${prompt//EXECUTED_FILE/mutation-data/executed.json}
          printf '%s\n' "$prompt" >"$PROMPT_FILE"
          # The model gets the shape without pattern, minimum and maximum, which
          # no live lane schema has used with --json-schema; the next job
          # checks the whole file.
          jq -c 'walk(if type == "object" then del(.pattern, .minimum, .maximum) else . end)' \
            .base/.github/scripts/post-merge-test-mutation/generate.schema.json >"$SCHEMA_FILE"
          echo "lint=$GITHUB_WORKSPACE/.lane/plugins/mutation-testing/scripts/suppression-lint.sh" >>"$GITHUB_OUTPUT"

      # run-claude-cli refuses to run without these root-owned settings, which
      # need sudo, so they are written before the runner is isolated.
      - name: Apply the Claude managed settings
        if: steps.prompt.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@b8bdd7fa2319b2457cbbef32c5348c394b9bc3f6 # b8bdd7f 2026-11-04

      - name: Isolate the runner
        if: steps.prompt.outcome == 'success'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: "true"

      # A push to main lands through the merge queue; the run executes main's
      # own code, and no mutant runs in this job. Bash runs read-only git and the plugin's suppression lint.
      - name: Run the generate leg
        id: run
        if: steps.prompt.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@fc442ad3e808adafe3b195e9d12fff901220db50 # fc442ad 2026-11-09
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: post-merge-test-mutation
          role: automations
          prompt-file: ${{ runner.temp }}/mutation-prompt.md
          preamble: You run unattended as the post-merge mutation CI lane. No one can answer a question during this run, and you change nothing.
          api-key: ${{ secrets.AUTOMATIONS_CLAUDE_API_KEY }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: |
            Read
            Grep
            Glob
            Skill
            Bash
          allowed-tools: |
            Skill(mutation-testing:audit)
            Bash(git status *)
            Bash(git diff *)
            Bash(git branch *)
            Bash(git rev-parse *)
            Bash(bash ${{ steps.prompt.outputs.lint }} *)
          disallowed-tools: |
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            Read(//proc/**)
            Read(./.base/**)
            mcp__*
            Bash(git log *)
            Bash(git show *)
            Bash(git diff *--no-index*)
            Bash(git diff *--output*)
            Bash(git diff *~*)
            Bash(git diff * /*)
            Bash(git diff *../*)
            Bash(git diff *$*)
          plugin-dirs: |
            .lane/plugins/mutation-testing
          json-schema-file: ${{ runner.temp }}/mutation-schema.json
          leg-timeout-minutes: "40"

      - name: Upload the sealed transcript
        if: always() && steps.run.outputs.execution-file != ''
        continue-on-error: true
        uses: ./.base/.github/actions/upload-lane-transcript # zizmor: ignore[self-repository]
        with:
          execution-file: ${{ steps.run.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}

      # Read by the next runs' credit gate (key-credit): the artifact its
      # `generate-marker` output names (check-key-credit gate.cjs markerName),
      # uploaded only after the key leg's credit-stop handoff. The name is
      # written out so its retention row claims it.
      - name: Write the key's credit-stop marker
        id: credit-marker
        if: always() && needs.key-credit.outputs.generate-marker == 'key-credit-stop-post-merge-test-mutation.yml-generate' && steps.run.outputs.handoff-reason == 'credit-stop'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          rm -rf "${RUNNER_TEMP:?}/key-credit-stop"
          mkdir -p "$RUNNER_TEMP/key-credit-stop"
          echo "$GITHUB_RUN_ID" >"$RUNNER_TEMP/key-credit-stop/run-id"

      - name: Scan the key's credit-stop marker for credentials
        id: credit-marker-scan
        if: always() && steps.credit-marker.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/key-credit-stop/run-id

      - name: Upload the key's credit-stop marker
        id: credit-marker-upload
        if: (always() && steps.credit-marker.outcome == 'success') && steps.credit-marker-scan.outputs.clean == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: key-credit-stop-post-merge-test-mutation.yml-generate
          path: ${{ runner.temp }}/key-credit-stop/run-id
          if-no-files-found: error
          retention-days: 1

      # The leg's lane-outcome record: its credential, outcome, handoff,
      # fallback reason and durationMs, one record per leg.
      - name: Record the leg
        if: always() && steps.run.outcome != 'skipped' && steps.run.outcome != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@6b9c640bf209c0c7e76f1111c5d18c96707348a2 # 6b9c640 2026-11-02
        with:
          outcome: ${{ steps.run.outcome }}
          execution-file: ${{ steps.run.outputs.execution-file }}
          log-file: ${{ steps.run.outputs.log-file }}
          lane: post-merge-test-mutation
          lane-id: post-merge-test-mutation
          credential: ${{ steps.run.outputs.credential }}
          handoff: ${{ steps.run.outputs.handoff }}
          known-failure-class: ${{ steps.run.outputs.lane-class }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          fallback-reason: ""

      # A usage limit (rate-limit) or an overloaded API (overloaded) on a leg
      # that hands nothing on is a designed stop, not a defect: the run ends
      # green with a notice and the report says so. A handoff is no failure;
      # any other failed leg fails the job.
      - name: Fail the leg unless it handed off or a limit stopped it
        id: stop
        if: always() && steps.run.outcome == 'failure' && steps.run.outputs.handoff != 'true'
        env:
          FAILURE_CLASS: ${{ steps.run.outputs.lane-class }}
        run: |
          case $FAILURE_CLASS in
            rate-limit | overloaded)
              echo "class=$FAILURE_CLASS" >>"$GITHUB_OUTPUT"
              echo "::notice::the generate leg stopped on class $FAILURE_CLASS; nothing to fix in the lane"
              ;;
            *)
              echo "::error::the generate leg failed with class ${FAILURE_CLASS:-unknown}"
              exit 1
              ;;
          esac

      # The leg's structured output, read from the launcher's file only after
      # its init message reports dontAsk; the next job checks it again.
      - name: Keep the generate result
        id: keep
        if: steps.run.outcome == 'success' && steps.run.outputs.structured-output-file != ''
        env:
          EXECUTION_FILE: ${{ steps.run.outputs.execution-file }}
          MODE: dontAsk
          OUTPUT_FILE: ${{ steps.run.outputs.structured-output-file }}
          OUT: ${{ runner.temp }}/generate-out
        run: |
          bash .base/.github/scripts/read-patch/check-permission-mode.sh
          mkdir -p "$OUT"
          jq 'if type == "object" then . else error("the structured output is not an object") end' "$OUTPUT_FILE" >"$OUT/generate.json"
          sum=$(sha256sum <"$OUT/generate.json")
          echo "sha256=${sum%% *}" >>"$GITHUB_OUTPUT"

      - name: Scan the generate result for credentials
        id: scan-upload
        if: steps.keep.outcome == 'success'
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/generate-out/generate.json

      - name: Upload the generate result
        id: upload
        if: (steps.keep.outcome == 'success') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: post-merge-test-mutation-generate-${{ github.job }}-${{ github.run_id }}
          path: ${{ runner.temp }}/generate-out/generate.json
          retention-days: 1
          if-no-files-found: error

      # The leg the next job runs, from this job's credential decision and
      # the launcher's handoff (select-model-credential). always(), so a step
      # that failed, or a job that hit its own timeout, after a handoff or an
      # empty credential still hands on, as the job outputs did before; the
      # next job's own !cancelled() still stops a cancelled run.
      - name: Pick the next leg
        id: next
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 1
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@5b5110ae015183e900dd098c631d4dcc68904067 # 5b5110a 2026-11-06
        with:
          state: ${{ steps.credential.outputs.state }}
          handoff: ${{ steps.run.outputs.handoff }}
          handoff-reason: ${{ steps.run.outputs.handoff-reason }}

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The generate chain's subscription leg: the key leg's steps on a fresh runner,
  # on the automations subscription token alone. With the fallback token set,
