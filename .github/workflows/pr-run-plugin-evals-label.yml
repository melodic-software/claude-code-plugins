name: PR Run Plugin Evals Label

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  record:
    name: Record
    if: >-
      github.event.label.name == 'eval: run'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report the label
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "::notice::eval: run on #$PR_NUMBER at $HEAD_SHA; PR Run Plugin Evals starts when this run completes"
