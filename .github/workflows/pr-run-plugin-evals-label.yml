name: PR Run Plugin Evals Label

# Starts PR Run Plugin Evals: adding the `eval: run` label to a same-repository,
# non-draft pull request runs this file, and its completion starts the evals on
# workflow_run, which runs main's copy of the eval workflow with the Claude
# credentials, never the PR's
# (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run).
# This run is the head's copy, holds no secret and no write token, and the
# evals read nothing it writes.
on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  record:
    name: Record
    if: >-
      github.event.label.name == 'eval: run'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report the label
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "::notice::eval: run on #$PR_NUMBER at $HEAD_SHA; PR Run Plugin Evals starts when this run completes"
