name: Post Merge Select Mutation Range

on:
  push:
    branches: [main]
    paths:
      - "**/*.sh"
      - "**/*.mjs"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.py"
      - "!**/*.test.*"
      - "!**/test_*.py"
      - "!**/conftest.py"
      - "!**/tests/**"
      - "!**/evals/**"
      - "!**/fixtures/**"
      - "!**/vendor/**"
      - "!.claude/**"
      - "!docs/conventions/**"

permissions: {}

jobs:
  select-range:
    name: Select Range
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record the pushed range
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          [[ $EVENT_AFTER =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the push names no head SHA"; exit 1; }
          [[ $EVENT_BEFORE =~ ^[0-9a-f]{40}$ ]] || EVENT_BEFORE=""
          mkdir -p "$RUNNER_TEMP/mutation-range"
          jq -n --arg before "$EVENT_BEFORE" --arg after "$EVENT_AFTER" '{before: $before, after: $after}' \
            >"$RUNNER_TEMP/mutation-range/range.json"

      - name: Upload the range
        uses: actions/upload-artifact@v7
        with:
          name: mutation-range
          path: ${{ runner.temp }}/mutation-range/range.json
          if-no-files-found: error
          retention-days: 7
