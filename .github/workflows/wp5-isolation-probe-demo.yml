name: wp5-isolation-probe-demo

# One-off WP5 Phase 4 acceptance probe (removed before merge; evidence lives in
# the run log + PR body): the job PROVISIONS a genuine egress-denied boundary —
# a nested no-network container on the hosted runner — and executes the
# isolation-probe recipe INSIDE it. The outer job stays networked (control
# step), so a passing egress-denial assertion is proof the inner boundary
# sealed, never a property of the bare runner.
on:
  pull_request:
    paths:
      - ".github/workflows/wp5-isolation-probe-demo.yml"

permissions: {}

jobs:
  isolation-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Control - outer job egress is OPEN
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://example.com)
          echo "outer-egress: HTTP ${code} (networked, as expected)"
          test "${code}" = "200"
      - name: Probe inside provisioned no-network boundary
        run: |
          docker run --rm --network none ubuntu:24.04 bash -c '
            set -u
            fail=0
            echo "surface: ci-nested-container (docker --network none)"
            if timeout 10 bash -c "exec 3<>/dev/tcp/example.com/443" 2>/dev/null; then
              echo "egress-denial: FAIL - connection succeeded"
              fail=1
            else
              echo "egress-denial: PASS - external fetch failed inside the boundary"
            fi
            found=0
            for p in /root/.ssh /root/.netrc /root/.docker/config.json /home/*/.ssh; do
              if [ -e "$p" ]; then
                echo "credential-absence: FAIL - present: $p"
                found=1
                fail=1
              fi
            done
            if [ "$found" = "0" ]; then
              echo "credential-absence: PASS - no host credential paths present"
            fi
            echo "probe-verdict: $([ "$fail" = "0" ] && echo BOUNDARY-PROVEN || echo BOUNDARY-NOT-PROVEN)"
            exit "$fail"
          '
