name: wp5-isolation-probe-demo

# One-off WP5 Phase 4 acceptance probe (removed before merge; evidence lives in
# the run log + PR body): the job PROVISIONS a genuine egress-denied boundary —
# a nested no-network container on the hosted runner — executes the
# isolation-probe recipe INSIDE it, captures the transcript in the
# isolation-probe template's JSON shape, and proves the security-binding
# checker passes only against that live-captured evidence. The outer job stays
# networked (control step), so a passing egress-denial assertion is proof the
# inner boundary sealed, never a property of the bare runner.
on:
  pull_request:
    paths:
      - ".github/workflows/wp5-isolation-probe-demo.yml"

permissions: {}

jobs:
  isolation-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Control - outer job egress is OPEN
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://example.com)
          echo "outer-egress: HTTP ${code} (networked, as expected)"
          test "${code}" = "200"
      - name: Probe inside provisioned no-network boundary
        run: |
          set -u
          egress_exit=0
          docker run --rm --network none ubuntu:24.04 bash -c \
            'if timeout 10 bash -c "exec 3<>/dev/tcp/example.com/443" 2>/dev/null; then exit 0; else exit 4; fi' || egress_exit=$?
          if [ "${egress_exit}" != "4" ]; then
            echo "egress-denial: FAIL - expected denial exit 4, got ${egress_exit} (0 = connection succeeded; other = container infra error, boundary not proven)"
            exit 1
          fi
          echo "egress-denial: PASS - external fetch failed inside the boundary (exit ${egress_exit})"
          cred_exit=0
          docker run --rm --network none ubuntu:24.04 bash -c '
            present=0
            for p in "$HOME/.ssh" "$HOME/.netrc" "$HOME/.docker/config.json"; do
              if [ -e "$p" ]; then echo "credential path readable: $p"; present=1; fi
            done
            [ "$present" = "0" ] && exit 3 || exit 0
          ' || cred_exit=$?
          if [ "${cred_exit}" != "3" ]; then
            echo "credential-absence: FAIL - expected all-absent exit 3, got ${cred_exit} (0 = a credential path is readable; other = container infra error, boundary not proven)"
            exit 1
          fi
          echo "credential-absence: PASS - every tested credential path absent inside the boundary (exit ${cred_exit})"
          mkdir -p live-evidence/probe-transcripts
          cat > live-evidence/probe-transcripts/ci-pool-a-l2.json <<EOF
          {
            "schema_version": "1",
            "surface": "ci-pool-a",
            "level": "L2",
            "substrate": "nested-no-network-container",
            "substrate_class": "container",
            "probed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "assertions": {
              "egress_denied": { "host": "example.com", "exit_code": "${egress_exit}", "outcome": "denied" },
              "credentials_absent": { "path": "\$HOME/.ssh,\$HOME/.netrc,\$HOME/.docker/config.json", "exit_code": "${cred_exit}", "outcome": "absent-or-denied" }
            },
            "outer_context_networked": true
          }
          EOF
          echo "captured live transcript:"
          cat live-evidence/probe-transcripts/ci-pool-a-l2.json
      - name: Checker passes against the LIVE-captured evidence
        run: |
          jq '.isolation_bindings["ci-pool-a"].L2.substrate = "nested-no-network-container"' \
            plugins/autonomy/skills/setup/evals/fixtures/security-binding/valid.json \
            > live-evidence/demo-binding.json
          node plugins/autonomy/skills/setup/scripts/check-security-binding.mjs \
            live-evidence/demo-binding.json \
            --probe-evidence-root live-evidence
