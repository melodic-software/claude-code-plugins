name: post-merge-demotion-alert

# Files the unattended-merge demotion issue when a post-merge signal fails on
# main, so a human hears of it while no babysit lane runs. The signals are a
# scheduled or dispatched pr-require-checks run (the whole-tree run) and a
# canary push run. The issue is the demotion record the babysit post-merge
# check files under the agent identity and the merge-policy reader holds the
# rung off on: first body line `<!-- babysit-merge-demotion sha=<S>
# signal=<name> -->`, labeled needs-human, one per (signal, SHA). A record
# that already exists gets a comment naming the run attempt instead. Records
# the agent identity filed are not read here, so one (signal, SHA) can hold a
# record from each filer; both hold the rung off. This workflow merges,
# reverts and dequeues nothing.
#
# A red full run files only after one re-run of its failed jobs, which the
# job waits up to 20 minutes for, fails again or does not finish, and only for checks that were not already failing on main's newest
# completed run of the same event at an earlier SHA (babysit_postmerge.py
# applies the same rule). A check is a failed job, or one gate the hygiene
# aggregator names in a titled annotation; the lane aggregator ci-status adds
# nothing beside another failed job, and the gitleaks gate, which scans every
# branch on these events, counts against no merge.
#
# Test: scripts/post-merge-demotion-alert.test.sh runs the step body.

on:
  # The job checks out nothing, runs no action, and holds a token that can
  # write issues only, so no code from the triggering run executes here. The
  # step reads the event's fields through env and acts only on runs of this
  # repository's main branch.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [pr-require-checks, post-merge-detect-silent-revert]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  alert:
    name: File the demotion issue
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # up to 20 minutes waiting on the re-run
    permissions:
      issues: write # file the demotion issue or comment on it
      actions: write # re-run a red full run's failed jobs; read jobs and runs
      checks: read # read the hygiene aggregator's annotations
    # One group per signal and SHA, so two attempts of one run cannot both
    # find no record and file two.
    concurrency:
      group: post-merge-demotion-alert-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: File or comment on the demotion issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_CREATED: ${{ github.event.workflow_run.created_at }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          RUN_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          case "$RUN_WORKFLOW:$RUN_EVENT" in
            pr-require-checks:schedule) signal=schedule ;;
            pr-require-checks:workflow_dispatch) signal=dispatch ;;
            post-merge-detect-silent-revert:push) signal=canary ;;
            *)
              echo "$RUN_WORKFLOW on $RUN_EVENT is not a post-merge signal"
              exit 0
              ;;
          esac
          # Neither signal's runs are cancelled by concurrency, so a cancel
          # comes from an actor with actions: write and counts as a failure.
          # A re-run that passes is recorded on the record; it clears nothing.
          case "$RUN_CONCLUSION" in
            failure | timed_out | startup_failure | cancelled) passed='' ;;
            success)
              if [[ ! "$RUN_ATTEMPT" =~ ^[0-9]+$ || "$RUN_ATTEMPT" -lt 2 ]]; then
                echo "$RUN_WORKFLOW passed on attempt $RUN_ATTEMPT: nothing to file"
                exit 0
              fi
              passed=1
              ;;
            *)
              echo "$RUN_WORKFLOW concluded $RUN_CONCLUSION: nothing to file"
              exit 0
              ;;
          esac
          if [[ "$RUN_BRANCH" != main || "$RUN_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "the run is not on this repository's main branch"
            exit 0
          fi
          if [[ ! "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::head SHA '$RUN_SHA' is not a full commit SHA"
            exit 1
          fi
          if [[ ! "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::run attempt '$RUN_ATTEMPT' is not a positive integer"
            exit 1
          fi
          newly=''
          if [[ -z "$passed" && "$signal" != canary ]]; then
            # Re-run the failed jobs once and wait here for that attempt: a
            # re-run this token starts raises no workflow_run event of its own.
            # babysit_postmerge.py credits this re-run only on a run the bot
            # did not start, so a run the bot started (a pr-merge dispatch) is
            # left to the wrapper's own re-run. When the wrapper re-ran first,
            # the POST fails and the wait reads its attempt instead. A re-run
            # that does not finish within 20 minutes leaves attempt 1 judged.
            if [[ "$RUN_ATTEMPT" -eq 1 && "$RUN_TRIGGERING_ACTOR" != 'github-actions[bot]' ]]; then
              if ! gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs" >/dev/null; then
                echo "::warning::could not re-run $RUN_URL; waiting for any re-run already started"
              fi
              for _ in $(seq 20); do
                sleep "${POLL_SECONDS:-60}"
                latest="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
                  --jq '[.run_attempt, .status, (.conclusion // "")] | @tsv')" || continue
                IFS=$'\t' read -r attempt status conclusion <<<"$latest"
                if [[ "$attempt" =~ ^[0-9]+$ && "$attempt" -ge 2 && "$status" == completed ]]; then
                  if [[ "$conclusion" == success ]]; then
                    echo "attempt $attempt, the re-run of the failed jobs, passed: nothing to file"
                    exit 0
                  fi
                  RUN_ATTEMPT="$attempt"
                  break
                fi
              done
              if [[ "$RUN_ATTEMPT" -eq 1 ]]; then
                echo "::warning::the re-run of $RUN_URL did not finish: judging attempt 1"
              fi
            fi
            # failing_checks <run id> <attempt>: one check per line.
            failing_checks() {
              local jobs count id name other gates gate
              jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$1/attempts/$2/jobs?per_page=100" \
                --jq '.jobs[] | select(.conclusion | IN("failure", "timed_out", "cancelled", "startup_failure", "action_required"))
                  | [.id, .name, ([.steps[]? | select(.conclusion | IN("failure", "timed_out", "cancelled"))
                      | select(.name != "Aggregate hygiene results")] | length)] | @tsv')"
              count="$(awk 'NF' <<<"$jobs" | wc -l)"
              # A red run with no failed job (a workflow file that does not
              # load) is one check of its own, never excused.
              if [[ "$count" -eq 0 ]]; then
                echo 'pr-require-checks.yml: no failed jobs'
              fi
              while IFS=$'\t' read -r id name other; do
                if [[ -z "$id" || ("$name" == ci-status && "$count" -gt 1) ]]; then
                  continue
                fi
                gates="$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations?per_page=100" \
                  --jq '.[] | select(.annotation_level == "failure" and ((.title // "") | length) > 0) | .title')"
                if [[ -z "$gates" || "$other" -gt 0 ]]; then
                  echo "$name"
                fi
                while IFS= read -r gate; do
                  if [[ -n "$gate" && "$gate" != 'gitleaks failed' ]]; then
                    echo "$name: $gate"
                  fi
                done <<<"$gates"
              done <<<"$jobs"
            }
            now="$(mktemp)"
            failing_checks "$RUN_ID" "$RUN_ATTEMPT" >"$now"
            if [[ ! -s "$now" ]]; then
              echo "::warning::$RUN_URL failed only on checks no merge can cause (the all-branches gitleaks scan): not a demotion"
              exit 0
            fi
            baseline="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$RUN_WORKFLOW_ID/runs?event=$RUN_EVENT&branch=main&status=completed&created=%3C$RUN_CREATED&per_page=20" \
              --jq '[.workflow_runs[] | select(.head_branch == "main" and .head_sha != env.RUN_SHA and .created_at < env.RUN_CREATED)]
                | max_by(.created_at) // empty | [.id, .run_attempt, .conclusion] | @tsv')"
            if [[ -n "$baseline" ]]; then
              IFS=$'\t' read -r base_id base_attempt base_conclusion <<<"$baseline"
              before="$(mktemp)"
              if [[ "$base_conclusion" != success ]]; then
                failing_checks "$base_id" "$base_attempt" >"$before"
              fi
              grep -vxFf "$before" "$now" >"$now.new" || true
              mv "$now.new" "$now"
              if [[ ! -s "$now" ]]; then
                echo "::warning::$RUN_URL failed only on checks already failing before ${RUN_SHA:0:12} (run $base_id): not a demotion"
                exit 0
              fi
            fi
            newly="$(paste -sd ';' "$now" | sed 's/;/, /g')"
          fi
          # A run's URL names no attempt, so every sighting names its attempt:
          # a later failing attempt of a recorded run is a new sighting.
          sighting="$RUN_URL/attempts/$RUN_ATTEMPT"
          again='The post-merge check found this failure again: '

          marker="<!-- babysit-merge-demotion sha=$RUN_SHA signal=$signal -->"
          # Records are read by their filer, github-actions[bot], which is any
          # workflow's GITHUB_TOKEN: an issue a user opens with the marker
          # cannot stand in for this one.
          records="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues?state=all&creator=github-actions%5Bbot%5D&per_page=100" \
            --jq '.[] | select(.pull_request == null) | [.number, .state, (.body // "")]
              | [.[0], .[1], (.[2] | sub("^\\s+"; "") | split("\n")[0] | sub("\\s+$"; "")),
                 ([.[2] | split("\n")[] | select(startswith("- Failing run: "))][0] // ""
                  | ltrimstr("- Failing run: ") | sub("\\s+$"; ""))]
              | @tsv')"
          number=''
          state=''
          filed=''
          while IFS=$'\t' read -r n s first failing; do
            if [[ "$first" == "$marker" ]]; then
              number="$n"
              state="$s"
              filed="$failing"
              break
            fi
          done <<<"$records"

          if [[ -n "$passed" && -z "$number" ]]; then
            echo "attempt $RUN_ATTEMPT passed and no record exists: nothing to file"
            exit 0
          fi
          if [[ -n "$number" ]]; then
            comments="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/issues/$number/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body')"
            if [[ -n "$passed" ]]; then
              note="re-run passed: $sighting"
              # A pass is noted only on a record of this run's failure.
              if [[ "$filed" != "$RUN_URL/attempts/"* ]] &&
                ! grep -Fq -- "$again$RUN_URL/attempts/" <<<"$comments"; then
                echo "#$number records no failure of $RUN_URL: nothing to note"
                exit 0
              fi
            else
              note="$again$sighting"
            fi
            # Whole-line matches, so attempt 1 is not attempt 10 and a pass
            # note cannot hide a later failing attempt.
            if grep -Fxq -- "$note" <<<"$comments" || [[ -z "$passed" && "$filed" == "$sighting" ]]; then
              echo "#$number already records $sighting"
              exit 0
            fi
            # A new failure on a closed record demotes again.
            if [[ -z "$passed" && "$state" != open ]]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$number" -f state=open >/dev/null
              echo "reopened #$number"
            fi
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$number/comments" -f body="$note" >/dev/null
            echo "commented on #$number"
            exit 0
          fi

          pulls="${GITHUB_SERVER_URL:-https://github.com}/$GITHUB_REPOSITORY/pull"
          subject="${RUN_COMMIT_MESSAGE%%$'\n'*}"
          pr='unknown (the head commit names none)'
          title="Post-merge $signal failure at ${RUN_SHA:0:12}: unattended merging demoted"
          if [[ "$subject" =~ \(#([0-9]+)\)$ ]]; then
            pr="$pulls/${BASH_REMATCH[1]}"
            title="Post-merge $signal failure after #${BASH_REMATCH[1]}: unattended merging demoted"
          fi
          # A full run covers every first-parent commit since main's last
          # green full run, so the failure is charged to that whole range.
          range=()
          if [[ "$signal" != canary ]]; then
            base="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$RUN_WORKFLOW_ID/runs?branch=main&status=success&created=%3C$RUN_CREATED&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_branch == "main" and (.event | IN("schedule", "workflow_dispatch"))
                and .head_sha != env.RUN_SHA and .created_at < env.RUN_CREATED)]
                | max_by(.created_at) // empty | .head_sha')" || base=''
            if [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
              commits="$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$RUN_SHA" \
                --jq '.commits[] | [.sha, (.parents[0].sha // "none"), (.author.login // .commit.author.name // "unknown"),
                  (.commit.message | split("\n")[0])] | @tsv')" || commits=''
              declare -A parent=() entry=()
              while IFS=$'\t' read -r c p a s; do
                if [[ -n "$c" ]]; then
                  parent[$c]="$p"
                  entry[$c]="$a"$'\t'"$s"
                fi
              done <<<"$commits"
              at="$RUN_SHA"
              while [[ -n "$at" && "$at" != "$base" && -n "${entry[$at]+x}" ]]; do
                range=("$at" "${range[@]}")
                at="${parent[$at]}"
              done
              if [[ "$at" != "$base" ]]; then
                range=()
              fi
            fi
          fi
          sha_label='Main at the failing run'
          if [[ "$signal" == canary ]]; then
            sha_label='Merge commit'
          fi
          fence='```'
          lead="The post-merge check found a \`$signal\` failure on main."
          revert="To revert the merge, a human runs:

          ${fence}sh
          git revert $RUN_SHA
          ${fence}"
          pr_line="- Pull request: $pr
          "
          if [[ "${#range[@]}" -gt 1 ]]; then
            lead="$lead It is attributed to the range of ${#range[@]} merges since main's last green full run at \`$base\`, not to one pull request."
            pr_line="- Merges in the range, oldest first:
          "
            first='' last=''
            for c in "${range[@]}"; do
              IFS=$'\t' read -r a s <<<"${entry[$c]}"
              name="${c:0:12}" link="no pull request ($s)"
              if [[ "$s" =~ \(#([0-9]+)\)$ ]]; then
                name="#${BASH_REMATCH[1]}" link="$pulls/${BASH_REMATCH[1]}"
              fi
              first="${first:-$name}" last="$name"
              pr_line="$pr_line  - $link, merge commit \`$c\`, by $a
          "
            done
            title="Post-merge $signal failure after $first..$last: unattended merging demoted"
            revert='A human reads the failing suites in the run above, picks the merge responsible, and reverts that one.'
          elif [[ "$signal" != canary && "${#range[@]}" -eq 0 ]]; then
            lead="$lead The last green full run on main before this one could not be found, so the merges this failure covers are unknown; only the head commit is listed."
            revert='A human reads the failing suites in the run above and finds the merge responsible before reverting anything.'
          fi
          body="$marker

          $lead The unattended merge path stays at
          rung off until a human closes this issue directly (not through a pull request's closing keyword).

          $pr_line- $sha_label: \`$RUN_SHA\`
          - Failing run: $sighting${newly:+
          - Newly failing: $newly}

          $revert"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues" \
            -f title="$title" -f body="$body" -f 'labels[]=needs-human' >/dev/null
          echo "filed the $signal demotion issue for $RUN_SHA"
