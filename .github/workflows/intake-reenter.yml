name: Intake Reenter

# Sends an answered issue back to intake triage. The issue's status is its
# Work status field (hold labels still hold on top of it). A listed human's
# `**Decision recorded.**` comment on a `needs-owner-decision` issue or on
# a `status: confirmed` one with no other status and no `agent-ready`, or
# the author's or a listed human's reply on a `needs-reporter-info` issue,
# takes a status label the issue still carries off (a decision on an issue
# with `needs-human` changes nothing), sets the Work status field to
# needs-triage, and dispatches intake-triage.yml once when intake admits the
# issue's author (a listed human or the lanes App). A listed human's
# decision on an issue with no `status:` and no `agent-ready`,
# `needs-human`, `needs-triage` or `admission-deferred` takes nothing off and
# does the same. It never adds `agent-ready`. The rules are in
# .github/scripts/intake-reenter/reenter.mjs.
#
# No model and no App token: the job's GITHUB_TOKEN edits labels and the Work
# status field and starts the dispatch, as the triage sweep's does, and intake-triage admits
# github-actions[bot] as a dispatcher. The script reads the issue and comment
# back from the API; nothing from the event but their numbers, the removed
# label's name and a field change's action and sender id, through env, reaches it, and no comment text reaches a shell. issue_comment and issues run this file from
# the default branch only.
#
# A listed human who removes `needs-human` and leaves no `status:` has
# answered without a comment: the `issues: unlabeled` run reads the issue's
# label and field history, and when that person was the newest to remove
# `needs-human` from an open issue with no status, no `agent-ready` and an
# admitted author, it sets needs-triage and dispatches the same way. An
# issue work-unblock unparks goes back to intake through the hourly triage
# sweep, not this run.
#
# A listed human who changes the Work status field (48484079) from a hold to
# none or needs-triage has released it: the `issues: field_added` or
# `field_removed` run reads the issue's field events, and when that person
# made the newest ones (past this lane's own needs-triage write), on an open
# issue with no status label but `needs-triage` and an admitted author, it
# posts a comment marked with the field event that left the hold (the claim a
# re-run finds; deleted again when the run fails), sets the field to
# needs-triage when the release emptied it, and dispatches the same way.
#
# Accepted exposure: only a trusted comment decides whether a re-entry
# happens, and the triage run it starts passes the model only comments whose
# author id is in intake-triage.yml's allowed-author-ids (a person) or
# allowed-bot-sender-ids (a bot), never the lane's own triage comment. That
# bot list holds github-actions[bot], the dispatcher, so any other comment a
# workflow posts with a GITHUB_TOKEN counts as trusted too. The
# issue's title and body still reach the model on each re-entry, and that
# text, like the trusted comments, stays untrusted data. The model holds no
# GitHub token and only Read, Grep and Glob; a job with no model applies only
# allowlisted labels, posts with mentions broken, and never adds
# `agent-ready`.
on:
  # Runs from the default branch; the job's `if` drops PR, bot and App
  # comments, and only the issue and comment numbers, the removed label's
  # name, and a field change's action and sender id, through env, reach the
  # script.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  issues: # zizmor: ignore[dangerous-triggers]
    types: [unlabeled, field_added, field_removed]

permissions: {}

jobs:
  reenter:
    # Pull request comments, bot and App-posted comments and closed issues
    # stop here, before a runner starts, and so does a comment without the
    # decision marker anywhere but `needs-reporter-info` or by anyone but the
    # issue's author (whose reply answers a needs-info hold that exists only
    # on the Work status field), and a decision on an issue at
    # `status: ready` or with `agent-ready`, `needs-human`, `needs-triage` or
    # `admission-deferred` and no parked status, which the script refuses
    # anyway (`contains`, not `startsWith`: the script trims leading
    # whitespace first; it alone tells a statusless issue apart); so does any
    # unlabel other than `needs-human`, and a `needs-human` unlabel whose
    # payload already shows `status: confirmed`: a session parking an issue
    # swaps the labels in one edit, and the script refuses any issue with a
    # `status:` label anyway. When the payload predates the add, the script's
    # own read refuses it. A Work status field change gets through only on
    # that field and from a person; the script reads who made it and from
    # which state.
    name: Reenter
    if: >-
      !github.event.issue.pull_request
      && github.event.issue.state == 'open'
      && ((github.event_name == 'issue_comment'
           && github.event.comment.user.type == 'User'
           && !github.event.comment.performed_via_github_app
           && (((contains(github.event.issue.labels.*.name, 'needs-owner-decision')
                 || contains(github.event.issue.labels.*.name, 'status: confirmed'))
                && contains(github.event.comment.body, '**Decision recorded.**'))
               || contains(github.event.issue.labels.*.name, 'needs-reporter-info')
               || github.event.comment.user.id == github.event.issue.user.id
               || (contains(github.event.comment.body, '**Decision recorded.**')
                   && !contains(github.event.issue.labels.*.name, 'status: ready')
                   && !contains(github.event.issue.labels.*.name, 'agent-ready')
                   && !contains(github.event.issue.labels.*.name, 'needs-human')
                   && !contains(github.event.issue.labels.*.name, 'needs-triage')
                   && !contains(github.event.issue.labels.*.name, 'admission-deferred'))))
          || (github.event_name == 'issues'
              && ((github.event.label.name == 'needs-human'
                   && !contains(github.event.issue.labels.*.name, 'status: confirmed'))
                  || ((github.event.action == 'field_added' || github.event.action == 'field_removed')
                      && github.event.issue_field.id == 48484079
                      && github.event.sender.type == 'User'))))
    runs-on: ubuntu-24.04
    # The resolve-config install can take its full 3 minutes on a slow registry;
    # the 5 minutes the job had before stay for the rest, so a slow install
    # cannot cut the re-entry off between its label removal and add.
    timeout-minutes: 9
    permissions:
      contents: read # check out main
      issues: write # read the issue and comments; edit its labels and Work status field; post and delete a release's claim comment
      actions: write # dispatch intake-triage.yml
    # Every comment on a parked issue and every removal above starts a
    # run, so runs wait in line (`queue: max`): the default keeps one waiting run and cancels it when a
    # later comment arrives, which would drop an answer behind a chat reply.
    concurrency:
      group: intake-reenter-${{ github.event.issue.number }}
      queue: max
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
      npm_config_audit: "false"
      npm_config_fetch_timeout: "60000"
      npm_config_fund: "false"
      # npm's fetch timeout and retries, from the one file that sets them.
      npm_config_globalconfig: ${{ github.workspace }}/.base/.github/npm-fetch.npmrc
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: main
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}
          # Starts new work: also stop on a low GITHUB_TOKEN budget.
          budget: "true"

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
          CAUSE: ${{ steps.kill.outputs.cause }}
          WHY: ${{ steps.kill.outputs.cause == 'budget' && format('the GITHUB_TOKEN budget is low until {0} (epoch seconds), which stops', steps.kill.outputs.reset) || 'the lanes kill switch stops' }}
        run: echo "::notice::${WHY} this run (reason ${REASON:-unreadable}, cause ${CAUSE:-unreadable}); nothing read or labeled"

      # reenter.mjs reads an issue's Work status field through resolve-config.mjs,
      # whose packages only the resolve-config action installs; this job does
      # not run it.
      - name: Install resolve-config's packages
        timeout-minutes: 3
        # A failed install fails the run: the Work status read fails closed.
        if: steps.kill.outputs.proceed == 'true'
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund --prefix .base/.github/actions/resolve-config

      - name: Send the answered issue back to triage
        if: steps.kill.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EVENT_NAME: ${{ github.event_name }}
          REMOVED_LABEL: ${{ github.event.label.name }}
          EVENT_ACTION: ${{ github.event.action }}
          SENDER_ID: ${{ github.event.sender.id }}
          LANES_APP_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          TRUSTED_ACTORS_PATH: .base/.github/standards/trusted-actors/trusted-actors.json
          KILL_SWITCH: proceed
        run: node .base/.github/scripts/intake-reenter/reenter.mjs

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token
