        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@2476d5dde8979eab34374150b7e4b0a2b99f4e88 # 2476d5d 2026-10-29
        with:
          outcome: ${{ steps.judge-spec.outcome }}
          execution-file: ${{ steps.judge-spec.outputs.execution-file }}
          log-file: ${{ steps.judge-spec.outputs.log-file }}
          lane: pr-verify
          lane-id: pr-verify
          step-started-at: ${{ steps.time-spec.outputs.started-at }}
          step-timeout-minutes: 22
          credential: ${{ steps.judge-spec.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.judge-spec.outputs.lane-class }}
          fallback-reason: ${{ needs.check-intent-subscription.outputs.handoff-reason == 'limit-stop' && 'limit-stop' || needs.check-intent-subscription.outputs.handoff-reason == 'credit-stop' && 'credit-stop' || needs.check-intent-subscription.outputs.handoff-reason == 'auth' && 'auth' || '' }}

      - name: Upload the spec judgment's sealed transcript
        if: always() && steps.judge-spec.outputs.execution-file != ''
        continue-on-error: true
        uses: ./.base/.github/actions/upload-lane-transcript # zizmor: ignore[self-repository]
        with:
          execution-file: ${{ steps.judge-spec.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}-spec

      # The structured output, in the last result message of the execution
      # file, is untrusted model text: read from the file and checked by the
      # script, never interpolated into a command.
      - name: Write the verdict
        id: verdict
        if: ${{ !cancelled() && (steps.chunk-fail.outputs.fail == 'true' || steps.chunk-fail-2.outputs.fail == 'true' || steps.chunk-fail-3.outputs.fail == 'true' || steps.chunk-fail-4.outputs.fail == 'true' || steps.chunk-fail-5.outputs.fail == 'true' || steps.chunk-fail-6.outputs.fail == 'true' || steps.chunk-fail-7.outputs.fail == 'true' || steps.chunk-fail-8.outputs.fail == 'true' || steps.chunk-fail-9.outputs.fail == 'true' || steps.chunk-fail-10.outputs.fail == 'true' || steps.chunk-fail-11.outputs.fail == 'true' || steps.chunk-fail-12.outputs.fail == 'true' || steps.chunk-results.outcome == 'failure' || (steps.judge.outcome == 'success' && (fromJSON(steps.diff.outputs.chunks || '0') < 2 || steps.judge-2.outcome == 'success') && (fromJSON(steps.diff.outputs.chunks || '0') < 3 || steps.judge-3.outcome == 'success') && (fromJSON(steps.diff.outputs.chunks || '0') < 4 || steps.judge-4.outcome == 'success') && (fromJSON(steps.diff.outputs.chunks || '0') < 5 || steps.judge-5.outcome == 'success') && (fromJSON(steps.diff.outputs.chunks || '0') < 6 || steps.judge-6.outcome == 'success') && (fromJSON(steps.diff.outputs.chunks || '0') < 7 || steps.judge-7.outcome == 'success') && (fromJSON(steps.diff.outputs.chunks || '0') < 8 || steps.judge-8.outcome == 'success') && (fromJSON(steps.diff.outputs.chunks || '0') < 9 || steps.judge-9.outcome == 'success') && (fromJSON(steps.diff.outputs.chunks || '0') < 10 || steps.judge-10.outcome == 'success') && (fromJSON(steps.diff.outputs.chunks || '0') < 11 || steps.judge-11.outcome == 'success') && (fromJSON(steps.diff.outputs.chunks || '0') < 12 || steps.judge-12.outcome == 'success') && (fromJSON(steps.diff.outputs.chunks || '0') < 2 || (steps.judge-spec.outcome == 'success' || (steps.judge-spec.outcome == 'failure' && steps.judge-spec.outputs.lane-class == '' && steps.judge-spec.outputs.execution-file != ''))))) }}
        env:
          # Each chunk's files in chunk order. A counted fail needs no others;
          # anything else needs every chunk and the final judge.
          EXECUTION_FILES: |
            ${{ steps.judge.outputs.execution-file }}
            ${{ steps.judge-2.outputs.execution-file }}
            ${{ steps.judge-3.outputs.execution-file }}
            ${{ steps.judge-4.outputs.execution-file }}
            ${{ steps.judge-5.outputs.execution-file }}
            ${{ steps.judge-6.outputs.execution-file }}
            ${{ steps.judge-7.outputs.execution-file }}
            ${{ steps.judge-8.outputs.execution-file }}
            ${{ steps.judge-9.outputs.execution-file }}
            ${{ steps.judge-10.outputs.execution-file }}
            ${{ steps.judge-11.outputs.execution-file }}
            ${{ steps.judge-12.outputs.execution-file }}
          LOG_FILES: |
            ${{ steps.judge.outputs.log-file }}
            ${{ steps.judge-2.outputs.log-file }}
            ${{ steps.judge-3.outputs.log-file }}
            ${{ steps.judge-4.outputs.log-file }}
            ${{ steps.judge-5.outputs.log-file }}
            ${{ steps.judge-6.outputs.log-file }}
            ${{ steps.judge-7.outputs.log-file }}
            ${{ steps.judge-8.outputs.log-file }}
            ${{ steps.judge-9.outputs.log-file }}
            ${{ steps.judge-10.outputs.log-file }}
            ${{ steps.judge-11.outputs.log-file }}
            ${{ steps.judge-12.outputs.log-file }}
          JUDGE_OUTCOMES: |
            ${{ steps.judge.outcome }}
            ${{ steps.judge-2.outcome }}
            ${{ steps.judge-3.outcome }}
            ${{ steps.judge-4.outcome }}
            ${{ steps.judge-5.outcome }}
            ${{ steps.judge-6.outcome }}
            ${{ steps.judge-7.outcome }}
            ${{ steps.judge-8.outcome }}
            ${{ steps.judge-9.outcome }}
            ${{ steps.judge-10.outcome }}
            ${{ steps.judge-11.outcome }}
            ${{ steps.judge-12.outcome }}
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          DIFF_DIR: ${{ github.workspace }}/pr-verify-data/diff
          # The whole-spec judgment, which a head of two chunks or more must have.
          FINAL_EXECUTION_FILE: ${{ steps.judge-spec.outputs.execution-file }}
          FINAL_LOG_FILE: ${{ steps.judge-spec.outputs.log-file }}
          FINAL_OUTCOME: ${{ steps.judge-spec.outcome }}
          RESULTS_DIR: ${{ github.workspace }}/pr-verify-data/chunk-results
          MANIFEST_DIR: ${{ github.workspace }}/pr-verify-data/manifest
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          HEAD_REF: ${{ steps.pr.outputs.head-ref }}
          RELINK_SINCE_HEAD: ${{ steps.pr.outputs.relink-since-head }}
          SPEC_FILE: ${{ github.workspace }}/pr-verify-data/spec.json
          SPEC_TEXT_FILE: ${{ github.workspace }}/pr-verify-data/spec-text.json
          VERDICT_DIR: ${{ runner.temp }}/pr-verify-verdict
        run: node .base/.github/scripts/pr-verify/write-verdict.mjs

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          ${{ !cancelled() && steps.verdict.outcome == 'success' }}
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/pr-verify-verdict/verdict.json

      - name: Upload the verdict
        if: >-
          (!cancelled() && steps.verdict.outcome == 'success') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.verdict.outputs.name }}
          path: ${{ runner.temp }}/pr-verify-verdict/verdict.json
          retention-days: ${{ steps.verdict.outputs.retention-days }}
          if-no-files-found: error

      - name: Summarize the verdict
        if: ${{ !cancelled() && steps.verdict.outcome == 'success' }}
        env:
          VERDICT_FILE: ${{ runner.temp }}/pr-verify-verdict/verdict.json
        run: |
          {
            echo "### Verifier verdict"
            echo
            echo '```json'
            jq '.summary |= gsub("`"; "'"'"'") | .notes |= map(gsub("`"; "'"'"'"))' "$VERDICT_FILE"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Log the API budget
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

      - name: Fail without a verdict
        if: always() && steps.agree.outcome == 'success' && steps.verdict.outcome != 'success'
        run: |
          echo "::error::the judgment left no verdict for this head"
          exit 1
