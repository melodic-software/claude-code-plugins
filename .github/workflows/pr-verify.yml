          CONTEXT_FILE: ${{ github.workspace }}/pr-verify-data/context.json
          VERDICT_DIR: ${{ runner.temp }}/pr-verify-verdict
          # This job uploads a FAIL's index (write-verdict.mjs FAIL_INDEX).
          FAIL_INDEX: "1"
        run: node .base/.github/scripts/pr-verify/write-verdict.mjs

      # A FAIL uploads its index first (write-verdict.mjs failIndexNames), and
      # the FAIL only after every index uploaded: the merge gate finds a FAIL
      # by its index alone, so a failed index upload leaves no verdict.
      - name: Upload the FAIL index
        id: fail-index
        if: >-
          ${{ !cancelled() && steps.verdict.outcome == 'success' && steps.verdict.outputs.verdict == 'fail' }}
        uses: ./.base/.github/actions/upload-fail-index # zizmor: ignore[self-repository]
        with:
          names: ${{ steps.verdict.outputs.index-names }}
          path: ${{ runner.temp }}/pr-verify-verdict/fail-index.txt
          retention-days: ${{ steps.verdict.outputs.retention-days }}
          github-token: ${{ github.token }}

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          ${{ !cancelled() && steps.verdict.outcome == 'success' && (steps.verdict.outputs.verdict != 'fail' || steps.fail-index.outcome == 'success') }}
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/pr-verify-verdict/verdict.json

      - name: Upload the verdict
        id: upload-verdict
        if: >-
          (!cancelled() && steps.verdict.outcome == 'success' && (steps.verdict.outputs.verdict != 'fail' || steps.fail-index.outcome == 'success')) && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.verdict.outputs.name }}
          path: ${{ runner.temp }}/pr-verify-verdict/verdict.json
          retention-days: ${{ steps.verdict.outputs.retention-days }}
          if-no-files-found: error

      - name: Summarize the verdict
        if: ${{ !cancelled() && steps.verdict.outcome == 'success' }}
        env:
          VERDICT_FILE: ${{ runner.temp }}/pr-verify-verdict/verdict.json
        run: |
          {
            echo "### Verifier verdict"
            echo
            echo '```json'
            jq '.summary |= gsub("`"; "'"'"'") | .notes |= map(gsub("`"; "'"'"'"))' "$VERDICT_FILE"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Log the API budget
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

      - name: Fail without a verdict
        if: always() && steps.agree.outcome == 'success' && steps.verdict.outcome != 'success'
        run: |
          echo "::error::the judgment left no verdict for this head"
          exit 1

  # Wakes pr-merge for this one pull request once a verdict job uploaded a
  # pass or pass-notes, so a lanes App pull request is armed now rather than
  # at pr-merge's next scheduled run (every 30 minutes, the backstop). The
  # dispatch starts a PR-scoped run of main's pr-merge.yml (inputs.pr), which
  # arms only that pull request and only if every rule allows; it filters the
  # author itself, since nothing here names it. A GITHUB_TOKEN's
  # workflow_dispatch creates a run, as github-actions[bot], which pr-merge's
  # who step admits for this case alone (who.mjs verdictWake). The job holds
  # actions: write, pull-requests: read and contents: read (for main's
  # api-budget library alone), runs no model, and passes the
  # verdict jobs' outputs through env, checked in bash. A failed dispatch
  # only warns: the run's verdict stands, and the schedule arms it. A failed
  # job (timeout, lost runner) leaves the run's conclusion to the verdict jobs,
  # since pr-merge counts a pass only from a run that ended success.
  wake-pr-merge:
    needs: [check-intent, check-intent-subscription, check-intent-fallback]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && (needs.check-intent.outputs.verdict == 'pass'
      || needs.check-intent.outputs.verdict == 'pass-notes'
      || needs.check-intent-subscription.outputs.verdict == 'pass'
      || needs.check-intent-subscription.outputs.verdict == 'pass-notes'
      || needs.check-intent-fallback.outputs.verdict == 'pass'
      || needs.check-intent-fallback.outputs.verdict == 'pass-notes')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write # start pr-merge.yml on main for this pull request
      pull-requests: read # read the pull request's author: only a lanes App one is woken
      contents: read # check out the api-budget library
    # Each gh call's rate-limit reading, for the job-end api-calls notice
    # (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        continue-on-error: true
        env:
          TIP_BRANCH: main
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      # The api-budget library alone, from the default branch. A failed
      # checkout leaves none: the step below calls GitHub as it would without
      # it, and no reading is logged.
      - name: Check out the api-budget library
        if: steps.tip.outputs.sha != ''
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/log-api-budget/
          sparse-checkout-cone-mode: false

      - name: Wake pr-merge for this pull request
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          LANES_APP_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          KEY_PR: ${{ needs.check-intent.outputs.pr-number }}
          KEY_VERDICT: ${{ needs.check-intent.outputs.verdict }}
          SUB_PR: ${{ needs.check-intent-subscription.outputs.pr-number }}
          SUB_VERDICT: ${{ needs.check-intent-subscription.outputs.verdict }}
          FB_PR: ${{ needs.check-intent-fallback.outputs.pr-number }}
          FB_VERDICT: ${{ needs.check-intent-fallback.outputs.verdict }}
        run: |
          set -euo pipefail
          # Each gh call keeps its rate-limit reading for the job-end api-calls
          # notice; none when the checkout of the library failed.
          { . .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null && api_budget_wrap_gh github-token; } || true
          pr=''
          # One job per run judges; the first pass in job order names the PR.
          for leg in KEY SUB FB; do
            verdict_var=${leg}_VERDICT pr_var=${leg}_PR
            if [[ ${!verdict_var:-} =~ ^(pass|pass-notes)$ ]]; then
              pr=${!pr_var:-} verdict=${!verdict_var}
              break
            fi
          done
          if [[ ! $pr =~ ^[1-9][0-9]{0,15}$ ]]; then
            echo "::warning::wake-pr-merge: the passing job named no pull request number; nothing woken"
            exit 0
          fi
          # pr-merge arms only lanes App pull requests, and the token broker
          # mints for this wake only on one, so one read here spares every
          # other pass a whole pr-merge run. One already armed or held by
          # do-not-merge needs no wake: the scheduled sweep runs the same
          # decision on it, disarms included, and ci-status holds do-not-merge
          # in the merge queue. A failed read, or no lanes App id, dispatches
          # anyway: pr-merge decides all of this itself.
          if [[ ${LANES_APP_ID:-} =~ ^[1-9][0-9]*$ ]] &&
            answer=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" \
              --jq '"\(.user.id) \(.user.type) \(.auto_merge != null) \([.labels[].name] | index("do-not-merge") != null)"') &&
            read -r id type armed held <<<"$answer"; then
            if [ "$id $type" != "$LANES_APP_ID Bot" ]; then
              echo "::notice title=pr-verify wake::pr=$pr verdict=$verdict not a lanes App pull request; nothing woken"
              exit 0
            fi
            if [ "$armed" = true ]; then
              echo "::notice title=pr-verify wake::pr=$pr verdict=$verdict already armed; nothing woken"
              exit 0
            fi
            if [ "$held" = true ]; then
              echo "::notice title=pr-verify wake::pr=$pr verdict=$verdict held (do-not-merge); nothing woken"
              exit 0
            fi
          fi
          if gh workflow run pr-merge.yml -R "$GITHUB_REPOSITORY" --ref main -f pr="$pr"; then
            echo "::notice title=pr-verify wake::pr=$pr verdict=$verdict pr-merge dispatched"
          else
            echo "::warning::wake-pr-merge: the pr-merge dispatch for #$pr failed; its next scheduled run arms it"
          fi

      - name: Log the API budget
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token
