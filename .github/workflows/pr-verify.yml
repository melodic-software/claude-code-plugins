name: PR Verify

# The verifier: a model that did not write the pull request judges each head
# that passes pr-require-checks, or fails it only on holds an approving review
# of the head lifts (resolve-pr.mjs heldOnly, so the person approves a judged
# head), against its linked issue. The run uploads its verdict as the artifact
# pr-verify-<pr>-<head-sha>-<pass|pass-notes|fail>, a FAIL's followed by
# -i<issues> (write-verdict.mjs artifactName); its readers also accept the
# -<ref-digest> before that (write-verdict.mjs headRefDigest). A FAIL first
# uploads its index (upload-fail-index, write-verdict.mjs failIndexNames),
# which the gate reads by exact name instead of the whole artifact listing,
# and uploads the verdict only once every index did.
# Only steps of a run of this file on main can upload that run's artifacts, so
# the pr-merge lane counts a verdict only through its run record
# (plugins/source-control/skills/babysit-prs/scripts/babysit_verify_evidence.py).
# The verdict is not a check run. ci-status reads a pass by exact name only in
# the merge queue, for a lanes App pull request, since a ci-status on a pull
# request event red for anything but such a hold stops this workflow from running
# (docs/conventions/pr-pipeline/README.md, "Native auto-merge").
#
# No pull request code runs here (https://github.com/melodic-software/claude-code-plugins/blob/main/docs/conventions/pr-pipeline/README.md#verifier-verdict). The diff, the trusted PR
# text, the linked issues and the upstream run's jobs (upstream-jobs.mjs) are
# data files in pr-verify-data under the working directory, and the model
# reads them with the Read tool alone: its rules allow that directory
# and deny .base and every other tool. The judgment runs on ci-workflows'
# run-claude-cli as the pr-verify role, on one credential per job. The
# check-intent job holds only the API key. The check-intent-subscription job
# holds only the subscription token and runs, on a new ubuntu-24.04 VM, only
# when check-intent's key leg handed off (run-claude-cli's handoff output:
# a credit stop, or class auth with API status 401 or 402) with no permission
# denial, or its key is empty; then check-intent writes no verdict and does
# not fail. It also runs when check-intent's credit gate skipped the key leg
# because the key's credit stop is recent, and in check-intent's place when
# vars.CLAUDE_API_KEYS_DISABLED is `true`, which skips it. With the org secret
# FALLBACK_CLAUDE_CODE_OAUTH_TOKEN set, the subscription leg hands off the
# same way (a limit stop, a credit stop, or a 401 or 402) and the
# check-intent-fallback job judges once on that token, on a third VM; with it
# empty, nothing hands off past the subscription job. So one job per run
# judges. Each later job repeats every step from a fresh checkout, but the
# subscription job takes check-intent's reads instead of repeating them. Of
# check-intent's outputs it reads next-leg, compared to a fixed string in its
# `if`; next-reason, passed only as its credential call's `reason` input;
# and `reads`, the resolved PR, spec and trusted text,
# which the "Hand the reads on" step writes from base-side step files before
# the model runs and which reaches resolve-pr.mjs only through env. It still
# runs the trigger gate (2 reads), whose head the agree step compares with
# the carried one, and reads everything again when the bundle is missing,
# malformed, too large or from another run attempt
# (resolve-pr.mjs takeReads). None of them is written into a `run:` script,
# and it takes no cache and no artifact. run-claude-cli sets handoff and lane-class after it
# restores the step files, so the model cannot set them.
# The judging jobs' tokens can only read. Every script and local action comes
# from the main checkout in .base, and the Claude actions are ci-workflows',
# pinned by commit SHA. After them, wake-pr-merge, whose only write is
# actions: write, starts a PR-scoped pr-merge run on a pass or pass-notes
# verdict that uploaded.
#
# zizmor's self-repository advice (`$/...`) is ignored on the local action
# lines, as in pr-run-activity-read.yml.

# API_BUDGET_HOLD (outage posture element 2): only each job's resolver step
# sets it. resolve-pr.mjs holds green with a notice on a GitHub fault, a rate
# stop included, or on a 200 a re-read could return whole (closing,
# incomplete), and the reconciler re-runs the held run once; it still ends
# red on any other error, a list past what its query reads (shortList)
# included. A step opts in only once its script is shown to hold green with
# a notice on a refused call (rate-guard.mjs createRateLimitLatch); a gate
# never does, since a hold would pass what it could not read, so the rest
# still end red on a rate limit past the guard's budget.
on:
  # workflow_run runs this file from the default branch, never a PR's copy.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [PR Require Checks]
    types: [completed]
    branches-ignore: [main, 'gh-readonly-queue/**']

permissions: {}

# One judgment per PR and head at a time, never cancelled once running: a
# later run for the same head (a label or body edit re-runs pr-require-checks)
# queues behind it and then skips the judged head. GitHub still cancels an
# older run while it is pending when a newer one queues; no verdict uploads
# before the judge step, so a run cancelled then leaves none
# (workflow.test.mjs). "none" stands in when the payload names no PR, so the
# expression never fails.
concurrency:
  group: pr-verify-${{ github.event.workflow_run.pull_requests[0].number || 'none' }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check-intent:
    name: Check Intent
    if: >-
      github.ref == 'refs/heads/main'
      && github.event.workflow_run.event == 'pull_request'
      && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
      && github.event.workflow_run.head_repository.full_name == github.repository
      && vars.CLAUDE_API_KEYS_DISABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 222
    cache-mode: read
    permissions:
      contents: read # check out main; read the PR's commits for the diff
      pull-requests: read # the PR, its comments and reviews
      actions: read # the upstream run, and verdicts already uploaded
    outputs:
      next-leg: ${{ steps.next.outputs.next-leg }}
      next-reason: ${{ steps.next.outputs.next-reason }}
      reads: ${{ steps.carry.outputs.reads }}
      # For wake-pr-merge: the pull request, and the verdict once it uploaded.
      pr-number: ${{ steps.pr.outputs.pr-number }}
      verdict: ${{ steps.upload-verdict.outcome == 'success' && steps.verdict.outputs.verdict || '' }}
      standards-sha: ${{ steps.standards.outputs.sha }}
    steps:
      - name: Resolve main's tip
        id: tip
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
        run: |
          echo "::error::the lanes kill switch stops this run (reason: ${REASON:-unreadable}); no verdict until the lost-run reconciler re-runs it"
          exit 1

      # The resolver reads only, and skips on its own reads every run it
      # would not judge (a head already judged or moved past, a draft, a run
      # red for anything an approval does not lift, an author it does not
      # judge), so it runs first and the gate's reads go only to a run it
      # would judge. Nothing it writes reaches the model before the gate and
      # the agree step pass.
      - name: Resolve the pull request
        id: pr
        if: steps.kill.outputs.proceed == 'true'
        env:
          GITHUB_READ_STORE: ${{ runner.temp }}/github-reads
          GITHUB_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          # A rate-guard stop holds green with the resolver's other GitHub
          # faults (resolve-pr.mjs closing) instead of failing the step.
          API_BUDGET_HOLD: "1"
          SPEC_FILE: ${{ github.workspace }}/pr-verify-data/spec.json
          SPEC_TEXT_FILE: ${{ github.workspace }}/pr-verify-data/spec-text.json
          STANDARDS_SHA: ${{ steps.standards.outputs.sha }}
          TRUSTED_ACTORS_PATH: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: |
          mkdir -p "$(dirname "$SPEC_FILE")"
          VERIFY_AUTHORS=$(yq '.merge."verify-authors" // "lane"' .base/docs/conventions/pr-pipeline.yaml)
          LANE_IDENTITY=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          SPEC_FROM_BODY_APPS=$(yq '.adoption."spec-from-body-apps" // [] | .[]' .base/docs/conventions/pr-pipeline.yaml)
          # The issue lane's web hosts as admission reads them (resolve-config issueLaneWebHostsFromBase).
          ISSUE_LANE_WEB_HOSTS=$(yq -o=json -I=0 '(.activities."resolve-issue"."web-access" | select(.enabled == true) | .domains) // []' .base/docs/conventions/pr-pipeline.yaml)
          # The one file a lanes App pull request may change alone with no verdict (resolve-pr.mjs baselineOnly).
          BASELINE_FILE=$(yq '.merge."baseline-file" // ""' .base/docs/conventions/pr-pipeline.yaml)
          export VERIFY_AUTHORS LANE_IDENTITY SPEC_FROM_BODY_APPS ISSUE_LANE_WEB_HOSTS BASELINE_FILE
          node .base/.github/scripts/pr-verify/resolve-pr.mjs

      # The upstream run's actors, the re-runner and the PR author must all be
      # on the trusted-actor list.
      - name: Check the trigger
        id: gate
        if: steps.pr.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
          GITHUB_READ_STORE: ${{ runner.temp }}/github-reads
        uses: ./.base/.github/actions/check-trusted-trigger # zizmor: ignore[self-repository]
        with:
          standards-path: ${{ steps.standards.outputs.path }}
          triggering-actor: ${{ github.triggering_actor }}
          reconciler-workflow: .github/workflows/maintenance-reconcile-lost-runs.yml
          ci-status-rerun-workflow: .github/workflows/pr-dispatch-feedback.yml
          # A stop a GitHub fault caused reads read-fault, not the refusal's
          # reason, so the next step can mark it held; it still stops.
          fault-reason: "true"

      # A GitHub fault held the resolver green with a `held: ` notice and
      # proceed=false (resolve-pr.mjs closing), or stopped the trigger gate
      # with reason read-fault, which this step's notice reports. It marks the
      # run so the lost-run reconciler finds it from the jobs listing and
      # re-runs it once on its next pass (reconcile.mjs faultHeld), where the
      # gate checks the trigger again.
      - name: Note the hold
        id: note-hold
        if: steps.pr.outputs.reason == 'held' || steps.gate.outputs.reason == 'read-fault'
        env:
          GATE_REASON: ${{ steps.gate.outputs.reason }}
        run: |
          if [[ $GATE_REASON == read-fault ]]; then
            echo "::notice title=pr-verify::held: pr-verify's trigger gate met a GitHub fault (read-fault); nothing is judged"
          fi
          echo "pr-verify held on a GitHub fault; the lost-run reconciler re-runs this run once"
          # The hold's marker for monitor signal 13 (lane-hold-marker.mjs).
          { mkdir -p "$RUNNER_TEMP/lane-hold" && echo "pr-verify $GITHUB_RUN_ID" >"$RUNNER_TEMP/lane-hold/pr-verify"; } || true

      - name: Read the defer override from the base config
        if: steps.gate.outputs.proceed == 'true'
        continue-on-error: true
        run: |
          yq -o=json '{"limits": {"api": (.limits.api // {})}}' .base/docs/conventions/pr-pipeline.yaml >"$RUNNER_TEMP/defer-config.json"

      # The budget read sits after the resolver and the trigger gate, so only
      # a run that would judge defers: most runs skip there and spend little.
      # A first attempt defers while the GITHUB_TOKEN window is projected to
      # run short before the judgment ends; a re-run attempt never defers
      # (https://github.com/melodic-software/claude-code-plugins/blob/main/.github/actions/check-kill-switch/README.md).
      # The kill switch step above already read both switches, so this one
      # passes them as off and decides on the budget alone.
      - name: Check the token budget
        id: defer
        if: steps.gate.outputs.proceed == 'true'
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: "false"
          repo-value: "false"
          defer: "true"
          defer-job: check-intent
          resolved-config: ${{ runner.temp }}/defer-config.json

      - name: Note the deferral
        id: note-defer
        if: steps.defer.outputs.cause == 'defer'
        env:
          RESET: ${{ steps.defer.outputs.reset }}
        run: |
          echo "::notice title=pr-verify::deferred: the GITHUB_TOKEN window is projected to run short before this judgment ends; nothing is judged, and the lost-run reconciler re-runs this run once after the reset (cause=defer reset=${RESET})"

      # The gate and the resolver read the PR separately; both must name the
      # same PR at the run's head, or nothing is judged.
      - name: Assert the gate and the resolver agree
        id: agree
        if: steps.gate.outputs.proceed == 'true' && steps.defer.outputs.cause != 'defer'
        env:
          GATE_PR: ${{ steps.gate.outputs.pr-number }}
          GATE_HEAD: ${{ steps.gate.outputs.head-sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
        run: bash .base/.github/scripts/pr-verify/assert-gate-agrees.sh

      - name: Select the trusted PR text
        if: steps.agree.outcome == 'success'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/select-trusted-text # zizmor: ignore[self-repository]
        with:
          pr-number: ${{ steps.pr.outputs.pr-number }}
          standards-path: ${{ steps.standards.outputs.path }}
          output-path: ${{ github.workspace }}/pr-verify-data/context.json
          reads-path: ${{ runner.temp }}/pr-verify-pr-reads.json
          head-sha: ${{ steps.pr.outputs.head-sha }}
          github-token: ${{ github.token }}

      # A blobless fetch of the two commits into its own repository outside
      # the workspace. git diff reads no attributes or diff drivers from it,
      # so nothing in the PR runs; the patch is a data file. chunk-diff.sh cuts
      # it into chunks of whole files, a file over one chunk cut at its hunks
      # (a hunk over one chunk between its lines) into pieces, and each chunk
      # into parts one Read returns whole, in as many chunks as the diff
      # takes, up to the ceiling chunk-diff.sh sets, with a judge step below
      # for each. A file with a line over one chunk,
      # or a diff over the ceiling, fails the step by name: no verdict, so no
      # fail on size alone. The cut:
      # https://github.com/melodic-software/claude-code-plugins/blob/main/.github/scripts/pr-verify/chunk-diff.sh
      - name: Write the diff
        id: diff
        if: steps.agree.outcome == 'success'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          DATA: ${{ github.workspace }}/pr-verify-data
          SRC: ${{ runner.temp }}/pr-verify-src
          # The head's tree, for upstream-jobs.mjs: trees come with a blobless fetch.
          HEAD_PATHS_FILE: ${{ runner.temp }}/pr-verify-head-paths
          MAX_DIFF_BYTES: "300000"
          # One Read returns at most 25,000 tokens
          # (https://code.claude.com/docs/en/tools-reference#large-files), and
          # a token is at least a byte, so a part this size comes back whole.
          PART_BYTES: "15000"
          PART_LINES: "1000"
        run: |
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          mkdir -p "$DATA"
          git init -q "$SRC"
          git -C "$SRC" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$SRC" fetch -q --no-tags --filter=blob:none origin "$BASE_SHA" "$HEAD_SHA"
          git -C "$SRC" diff --no-ext-diff --no-textconv --no-color "$BASE_SHA...$HEAD_SHA" >"$DATA/diff.patch"
          git -C "$SRC" ls-tree -r -z --name-only "$HEAD_SHA" >"$HEAD_PATHS_FILE"
          jq -n --argjson pr "$PR_NUMBER" --arg head "$HEAD_SHA" --arg base "$BASE_SHA" \
            '{pr: $pr, head_sha: $head, base_sha: $base}' >"$DATA/pr.json"
          echo "diff: $(wc -l <"$DATA/diff.patch") lines"
          bash .base/.github/scripts/pr-verify/chunk-diff.sh

      # The jobs of the run this one was started by, each with its name and
      # conclusion, so the model can judge whether the suites that cover the
      # change ran (prompt.md), and the Node suites at the head that test-bash
      # runs through a sibling .test.sh. The token reads only.
      - name: List the upstream run's jobs
        if: steps.agree.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          JOBS_FILE: ${{ github.workspace }}/pr-verify-data/upstream-jobs.json
          HEAD_PATHS_FILE: ${{ runner.temp }}/pr-verify-head-paths
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/pr-verify/upstream-jobs.mjs

      - name: Hand the reads on
        id: carry
        if: steps.agree.outcome == 'success'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          HEAD_REF: ${{ steps.pr.outputs.head-ref }}
          RELINK_SINCE_HEAD: ${{ steps.pr.outputs.relink-since-head }}
          SPEC_FILE: ${{ github.workspace }}/pr-verify-data/spec.json
          SPEC_TEXT_FILE: ${{ github.workspace }}/pr-verify-data/spec-text.json
          CONTEXT_FILE: ${{ github.workspace }}/pr-verify-data/context.json
        run: node .base/.github/scripts/pr-verify/resolve-pr.mjs carry

      - name: Read the key's credit history
        id: credit
        if: steps.agree.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          leg: start
          role: pr-verify
          key-job: check-intent
          window-hours: ${{ vars.KEY_CREDIT_WINDOW_HOURS }}
          reset-at: ${{ vars.KEY_CREDIT_RESET_AT }}

      # Whether the key runs: it is set, and the read above did not hold it
      # off (selected). Only whether the secret is set reaches the action,
      # never its value.
      - name: Check the credential
        id: credential
        if: steps.agree.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          leg: key
          role: pr-verify
          credential-set: ${{ secrets.PR_VERIFY_CLAUDE_API_KEY != '' }}
          selected: ${{ steps.credit.outputs.next-leg }}
          key-off: ${{ vars.CLAUDE_API_KEYS_DISABLED == 'true' }}

      - name: Report the skipped key leg
        if: steps.credential.outputs.key-skipped == 'true'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: skipped
          lane: pr-verify
          lane-id: pr-verify
          credential: PR_VERIFY_CLAUDE_API_KEY
          known-failure-class: credit-stop
          handoff: "true"

      - name: Resolve the verifier's model
        id: models
        if: steps.agree.outcome == 'success' && steps.credential.outputs.key-skipped != 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: verify-pr
          output-path: ${{ runner.temp }}/pr-verify-models.json
          standards-path: ${{ steps.standards.outputs.path }}

      # Read by the next runs' gates: the probing marker the gate names
      # (gate.cjs probeName) when this run tries the key first after a credit
      # stop's window, so they skip while this run's judge steps do. Written
      # only when the key is set, the first judge step's term, so a run that
      # judges nothing never holds the key off; as soon after the read as that
      # allows. A judge step's credit stop writes the credit-stop marker below,
      # which takes over. The name is written out so its retention row claims
      # it. An artifact upload uses the runner's token, not the job token.
      - name: Write the key's probing marker
        id: probe-marker
        if: always() && steps.credit.outputs.probing-marker == 'key-credit-probing-PR_VERIFY_CLAUDE_API_KEY' && steps.credential.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/key-credit-probing"
          echo "$GITHUB_RUN_ID" >"$RUNNER_TEMP/key-credit-probing/run-id"

      - name: Scan the key's probing marker for credentials
        id: probe-marker-scan
        if: always() && steps.probe-marker.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/key-credit-probing/run-id

      - name: Upload the key's probing marker
        if: (always() && steps.probe-marker.outcome == 'success') && steps.probe-marker-scan.outputs.clean == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: key-credit-probing-PR_VERIFY_CLAUDE_API_KEY
          overwrite: true
          path: ${{ runner.temp }}/key-credit-probing/run-id
          if-no-files-found: error
          retention-days: 1

      # run-claude-cli refuses to run without these root-owned settings, which
      # need sudo, so they are written before the runner is isolated.
      - name: Apply the Claude managed settings
        if: steps.agree.outcome == 'success' && steps.credential.outputs.key-skipped != 'true'
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@main

      - name: Isolate the runner
        if: steps.agree.outcome == 'success' && steps.credential.outputs.key-skipped != 'true'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: true

      # Files, not step outputs: run-claude-cli reads both. A `default` model
      # resolves to an empty model, which the launcher cannot pass. started-at
      # lets the outcome step tell a step timeout from other failures.
      - name: Write the prompt and schema
        id: prompt
        if: steps.agree.outcome == 'success' && steps.credential.outputs.key-skipped != 'true'
        env:
          DATA: ${{ github.workspace }}/pr-verify-data
          MODEL: ${{ steps.models.outputs.model }}
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          PROMPT_STEM: ${{ runner.temp }}/pr-verify-prompts/prompt
          SCHEMA_FILE: ${{ runner.temp }}/pr-verify-schema.json
          LEG_MINUTES: "15"
          CHUNK_PARALLELISM: "8"
        run: |
          if [ -z "$MODEL" ]; then
            echo "::error::the verify-pr profile's model is default, which run-claude-cli cannot pass; name an alias"
            exit 1
          fi
          if ! [[ $CHUNKS =~ ^[1-9][0-9]?$ ]]; then
            echo "::error::the chunk count is malformed"
            exit 1
          fi
          mkdir -p "${PROMPT_STEM%/*}"
          node .base/.github/scripts/pr-verify/render-prompt.mjs
          printf '%s\n' '{"type":"object","properties":{"verdict":{"enum":["pass","pass-notes","fail"]},"summary":{"type":"string"},"notes":{"type":"array","items":{"type":"string"}}},"required":["verdict","summary","notes"],"additionalProperties":false}' >"$SCHEMA_FILE"
          # The later chunks' step limit: one leg and a minute for each round
          # of CHUNK_PARALLELISM legs, and 3 minutes to install the CLI.
          rounds=$(((CHUNKS - 1 + CHUNK_PARALLELISM - 1) / CHUNK_PARALLELISM))
          { echo "started-at=$(date +%s)"; echo "loop-minutes=$((3 + rounds * (LEG_MINUTES + 1)))"; } >>"$GITHUB_OUTPUT"

      # continue-on-error keeps a launcher failure, which run-claude-cli
      # reports by failing this step, from ending the job before the outcome
      # step; "Fail without a verdict" carries the red. A handoff skips the
      # verdict steps; the outcome step records the leg as handed off, and the
      # subscription job judges the run.
      # Under dontAsk only the allow rule's directory is readable; the deny
      # rules hold if the tools or the working directory change.
      - name: Judge the pull request
        id: judge
        if: steps.credential.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 22
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@main
        env:
          # No work may outlive the result message the launcher reads.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: pr-verify
          role: pr-verify
          prompt-file: ${{ runner.temp }}/pr-verify-prompts/prompt-1.md
          preamble: >-
            You run unattended; return only the verdict the schema asks for;
            your summary and notes are public, so never quote a credential.
          api-key: ${{ secrets.PR_VERIFY_CLAUDE_API_KEY }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./pr-verify-data/**)
          disallowed-tools: |
            Read(./.base/**)
            Glob
            Grep
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            mcp__*
          json-schema-file: ${{ runner.temp }}/pr-verify-schema.json
          leg-timeout-minutes: "15"

      # After a handoff: the owner's signal to rotate or replace the key, then
      # the denial check. A denial on the key leg means no verdict, so the
      # subscription job runs only on this step's clean=true; continue-on-error
      # lets the report record the stop, and "Fail without a verdict" carries
      # the red. A 403 hands nothing off, so this step skips and the run fails.
      - name: Check the key leg
        id: key-leg
        if: steps.judge.outputs.handoff == 'true'
        continue-on-error: true
        env:
          LOG_FILES: |
            ${{ steps.judge.outputs.log-file }}
          LANE_CLASS: ${{ steps.judge.outputs.lane-class }}
        run: |
          case "$LANE_CLASS" in
            auth) echo "::warning::the API refused the pr-verify role's API key (PR_VERIFY_CLAUDE_API_KEY), class auth; the owner must replace the secret" ;;
            *) echo "::warning::the pr-verify role's API key (PR_VERIFY_CLAUDE_API_KEY) hit a credit stop; rotate a spare key in" ;;
          esac
          node .base/.github/scripts/pr-verify/write-verdict.mjs check-key-leg
          echo "::notice::check-intent-subscription judges on the subscription token"

      # One lane record per leg, under the leg's own class: a clean handoff
      # is recorded with handoff true, a notice; a handoff the check above
      # refused, on a denial or a log it cannot read, as an error.
      - name: Report the judgment's outcome
        if: steps.judge.outcome == 'success' || steps.judge.outcome == 'failure'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: ${{ steps.judge.outcome }}
          execution-file: ${{ steps.judge.outputs.execution-file }}
          log-file: ${{ steps.judge.outputs.log-file }}
          lane: pr-verify
          lane-id: pr-verify
          step-started-at: ${{ steps.prompt.outputs.started-at }}
          step-timeout-minutes: 22
          credential: ${{ steps.judge.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.judge.outputs.lane-class }}
          handoff: ${{ steps.judge.outputs.handoff == 'true' && steps.key-leg.outcome != 'failure' }}

      - name: Upload the sealed transcript
        if: always() && steps.judge.outputs.execution-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          hide-trace-ids: "true"
          execution-file: ${{ steps.judge.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}

      # A fail the head can count ends the judgment here (write-verdict.mjs
      # checkChunk): the later chunks, the final judge and any handoff are
      # skipped, and "Write the verdict" runs on it, so no later step can lose
      # it to a re-run. !cancelled() runs the check even after an earlier step
      # failed. A judge step that run-claude-cli failed with no lane class but
      # with an execution file stopped on its credential scan, so it counts as
      # a fail with none of its text.
      - name: Read chunk 1's verdict
        id: chunk-fail
        if: ${{ !cancelled() && (steps.judge.outcome == 'success' || (steps.judge.outcome == 'failure' && steps.judge.outputs.lane-class == '' && steps.judge.outputs.execution-file != '')) }}
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.judge.outputs.execution-file }}
          JUDGE_OUTCOME: ${{ steps.judge.outcome }}
          LOG_FILE: ${{ steps.judge.outputs.log-file }}
          CHUNK: "1"
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          DIFF_DIR: ${{ github.workspace }}/pr-verify-data/diff
          MANIFEST_DIR: ${{ github.workspace }}/pr-verify-data/manifest
        run: node .base/.github/scripts/pr-verify/write-verdict.mjs chunk-fail

      - name: Time the later chunks
        id: time-chunks
        if: steps.credential.outputs.present == 'true' && fromJSON(steps.diff.outputs.chunks || '0') >= 2 && steps.judge.outcome == 'success' && steps.judge.outputs.handoff != 'true' && steps.chunk-fail.outputs.fail != 'true'
        run: echo "started-at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Judge the later chunks
        id: judge-chunks
        if: steps.credential.outputs.present == 'true' && fromJSON(steps.diff.outputs.chunks || '0') >= 2 && steps.judge.outcome == 'success' && steps.judge.outputs.handoff != 'true' && steps.chunk-fail.outputs.fail != 'true'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.prompt.outputs.loop-minutes || '1') }}
        uses: melodic-software/ci-workflows/.github/actions/run-review-chunks@main
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: pr-verify
          role: pr-verify
          prompt-dir: ${{ runner.temp }}/pr-verify-prompts
          chunk-first: "2"
          chunk-last: ${{ steps.diff.outputs.chunks }}
          parallelism: "8"
          preamble: >-
            You run unattended; return only the verdict the schema asks for;
            your summary and notes are public, so never quote a credential.
          api-key: ${{ secrets.PR_VERIFY_CLAUDE_API_KEY }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./pr-verify-data/**)
          disallowed-tools: |
            Read(./.base/**)
            Glob
            Grep
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            mcp__*
          json-schema-file: ${{ runner.temp }}/pr-verify-schema.json
          leg-timeout-minutes: "15"

      - name: Check the later chunks for a fail
        id: later-fail
        if: steps.judge-chunks.outputs.handoff == 'true'
        env:
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          CHUNKS_DIR: ${{ steps.judge-chunks.outputs.results-dir }}
          CHUNK_OUTCOMES: ${{ steps.judge-chunks.outputs.chunk-outcomes }}
          DIFF_DIR: ${{ github.workspace }}/pr-verify-data/diff
          MANIFEST_DIR: ${{ github.workspace }}/pr-verify-data/manifest
        run: node .base/.github/scripts/pr-verify/write-verdict.mjs later-fail

      - name: Check the key leg, later chunks
        id: key-leg-chunks
        if: steps.judge-chunks.outputs.handoff == 'true' && steps.later-fail.outputs.fail != 'true'
        continue-on-error: true
        env:
          LOG_FILES: |
            ${{ steps.judge.outputs.log-file }}
          CHUNKS_DIR: ${{ steps.judge-chunks.outputs.results-dir }}
          CHUNK_OUTCOMES: ${{ steps.judge-chunks.outputs.chunk-outcomes }}
          LANE_CLASS: ${{ steps.judge-chunks.outputs.lane-class }}
        run: |
          case "$LANE_CLASS" in
            auth) echo "::warning::the API refused the pr-verify role's API key (PR_VERIFY_CLAUDE_API_KEY), class auth; the owner must replace the secret" ;;
            *) echo "::warning::the pr-verify role's API key (PR_VERIFY_CLAUDE_API_KEY) hit a credit stop; rotate a spare key in" ;;
          esac
          node .base/.github/scripts/pr-verify/write-verdict.mjs check-key-leg
          echo "::notice::check-intent-subscription judges on the subscription token"

      - name: Report the later chunks' outcome
        if: steps.judge-chunks.outcome == 'success' || steps.judge-chunks.outcome == 'failure'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: ${{ steps.judge-chunks.outcome }}
          execution-file: ${{ steps.judge-chunks.outputs.execution-file }}
          log-file: ${{ steps.judge-chunks.outputs.log-file }}
          lane: pr-verify
          lane-id: pr-verify
          step-started-at: ${{ steps.time-chunks.outputs.started-at }}
          step-timeout-minutes: ${{ steps.prompt.outputs.loop-minutes }}
          credential: ${{ steps.judge-chunks.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.judge-chunks.outputs.lane-class }}
          handoff: ${{ steps.judge-chunks.outputs.handoff == 'true' && steps.later-fail.outputs.fail != 'true' && steps.key-leg-chunks.outcome != 'failure' }}

      - name: Upload the later chunks' sealed transcript
        if: always() && steps.judge-chunks.outputs.transcript-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          hide-trace-ids: "true"
          execution-file: ${{ steps.judge-chunks.outputs.transcript-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}-chunks

      # A diff in chunks: one more judge, with no diff, reads the spec and every
      # chunk's checked result and fails an item no chunk delivers. The results
      # are model text, checked as any verdict is and read as data; a chunk that
      # fails the check fails here, so the head gets no verdict. The deny rule
      # keeps this judge off the diff, and a denial voids a pass or pass-notes.
      - name: Write the chunk results
        id: chunk-results
        if: steps.credential.outputs.present == 'true' && fromJSON(steps.diff.outputs.chunks || '0') > 1 && steps.judge.outcome == 'success' && steps.chunk-fail.outputs.fail != 'true' && (steps.judge-chunks.outcome == 'success' || steps.judge-chunks.outcome == 'failure') && (steps.judge-chunks.outputs.handoff != 'true' || steps.later-fail.outputs.fail == 'true')
        env:
          EXECUTION_FILES: |
            ${{ steps.judge.outputs.execution-file }}
          LOG_FILES: |
            ${{ steps.judge.outputs.log-file }}
          JUDGE_OUTCOMES: |
            ${{ steps.judge.outcome }}
          CHUNKS_DIR: ${{ steps.judge-chunks.outputs.results-dir }}
          CHUNK_OUTCOMES: ${{ steps.judge-chunks.outputs.chunk-outcomes }}
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          DIFF_DIR: ${{ github.workspace }}/pr-verify-data/diff
          RESULTS_DIR: ${{ github.workspace }}/pr-verify-data/chunk-results
          PART_BYTES: "15000"
          SPEC_TEXT_FILE: ${{ github.workspace }}/pr-verify-data/spec-text.json
          SPEC_FILE: ${{ github.workspace }}/pr-verify-data/spec.json
          CONTEXT_FILE: ${{ github.workspace }}/pr-verify-data/context.json
          PR_FILE: ${{ github.workspace }}/pr-verify-data/pr.json
          MANIFEST_DIR: ${{ github.workspace }}/pr-verify-data/manifest
          PROMPT_FILE: ${{ runner.temp }}/pr-verify-prompt-spec.md
          PROMPT_TEMPLATE: .base/.github/scripts/pr-verify/spec-prompt.md
          SCHEMA_FILE: ${{ runner.temp }}/pr-verify-spec-schema.json
        run: node .base/.github/scripts/pr-verify/write-verdict.mjs chunk-results

      - name: Time the spec judgment
        id: time-spec
        if: fromJSON(steps.diff.outputs.chunks || '0') > 1 && steps.chunk-results.outcome == 'success' && steps.chunk-results.outputs.fail != 'true'
        run: echo "started-at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Judge the whole spec
        id: judge-spec
        if: fromJSON(steps.diff.outputs.chunks || '0') > 1 && steps.chunk-results.outcome == 'success' && steps.chunk-results.outputs.fail != 'true'
        continue-on-error: true
        timeout-minutes: 22
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@main
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: pr-verify
          role: pr-verify
          prompt-file: ${{ runner.temp }}/pr-verify-prompt-spec.md
          preamble: >-
            You run unattended; return only the verdict the schema asks for;
            your summary and notes are public, so never quote a credential.
          api-key: ${{ secrets.PR_VERIFY_CLAUDE_API_KEY }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./pr-verify-data/**)
          disallowed-tools: |
            Read(./.base/**)
            Read(./pr-verify-data/diff/**)
            Glob
            Grep
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            mcp__*
          json-schema-file: ${{ runner.temp }}/pr-verify-spec-schema.json
          leg-timeout-minutes: "15"

      - name: Check the key leg, whole spec
        id: key-leg-spec
        if: steps.judge-spec.outputs.handoff == 'true'
        continue-on-error: true
        env:
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          LOG_FILES: |
            ${{ steps.judge.outputs.log-file }}
            ${{ steps.judge-spec.outputs.log-file }}
          CHUNKS_DIR: ${{ steps.judge-chunks.outputs.results-dir }}
          CHUNK_OUTCOMES: ${{ steps.judge-chunks.outputs.chunk-outcomes }}
          LANE_CLASS: ${{ steps.judge-spec.outputs.lane-class }}
        run: |
          case "$LANE_CLASS" in
            auth) echo "::warning::the API refused the pr-verify role's API key (PR_VERIFY_CLAUDE_API_KEY), class auth; the owner must replace the secret" ;;
            *) echo "::warning::the pr-verify role's API key (PR_VERIFY_CLAUDE_API_KEY) hit a credit stop; rotate a spare key in" ;;
          esac
          node .base/.github/scripts/pr-verify/write-verdict.mjs check-key-leg
          echo "::notice::check-intent-subscription judges on the subscription token"

      - name: Report the spec judgment's outcome
        if: steps.judge-spec.outcome == 'success' || steps.judge-spec.outcome == 'failure'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: ${{ steps.judge-spec.outcome }}
          execution-file: ${{ steps.judge-spec.outputs.execution-file }}
          log-file: ${{ steps.judge-spec.outputs.log-file }}
          lane: pr-verify
          lane-id: pr-verify
          step-started-at: ${{ steps.time-spec.outputs.started-at }}
          step-timeout-minutes: 22
          credential: ${{ steps.judge-spec.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.judge-spec.outputs.lane-class }}
          handoff: ${{ steps.judge-spec.outputs.handoff == 'true' && steps.key-leg-spec.outcome != 'failure' }}

      - name: Upload the spec judgment's sealed transcript
        if: always() && steps.judge-spec.outputs.execution-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          hide-trace-ids: "true"
          execution-file: ${{ steps.judge-spec.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}-spec

      # The structured output, in the last result message of the execution
      # file, is untrusted model text: read from the file and checked by the
      # script, never interpolated into a command.
      - name: Write the verdict
        id: verdict
        if: ${{ !cancelled() && (steps.chunk-fail.outputs.fail == 'true' || steps.chunk-results.outputs.fail == 'true' || steps.chunk-results.outcome == 'failure' || (steps.judge.outcome == 'success' && (fromJSON(steps.diff.outputs.chunks || '0') < 2 || (steps.judge-chunks.outcome == 'success' && (steps.judge-spec.outcome == 'success' || (steps.judge-spec.outcome == 'failure' && steps.judge-spec.outputs.lane-class == '' && steps.judge-spec.outputs.execution-file != '')))))) }}
        env:
          EXECUTION_FILES: |
            ${{ steps.judge.outputs.execution-file }}
          LOG_FILES: |
            ${{ steps.judge.outputs.log-file }}
          JUDGE_OUTCOMES: |
            ${{ steps.judge.outcome }}
          CHUNKS_DIR: ${{ steps.judge-chunks.outputs.results-dir }}
          CHUNK_OUTCOMES: ${{ steps.judge-chunks.outputs.chunk-outcomes }}
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          DIFF_DIR: ${{ github.workspace }}/pr-verify-data/diff
          FINAL_EXECUTION_FILE: ${{ steps.judge-spec.outputs.execution-file }}
          FINAL_LOG_FILE: ${{ steps.judge-spec.outputs.log-file }}
          FINAL_OUTCOME: ${{ steps.judge-spec.outcome }}
          RESULTS_DIR: ${{ github.workspace }}/pr-verify-data/chunk-results
          MANIFEST_DIR: ${{ github.workspace }}/pr-verify-data/manifest
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          HEAD_REF: ${{ steps.pr.outputs.head-ref }}
          RELINK_SINCE_HEAD: ${{ steps.pr.outputs.relink-since-head }}
          SPEC_FILE: ${{ github.workspace }}/pr-verify-data/spec.json
          SPEC_TEXT_FILE: ${{ github.workspace }}/pr-verify-data/spec-text.json
          CONTEXT_FILE: ${{ github.workspace }}/pr-verify-data/context.json
          VERDICT_DIR: ${{ runner.temp }}/pr-verify-verdict
          # This job uploads a FAIL's index (write-verdict.mjs FAIL_INDEX).
          FAIL_INDEX: "1"
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/pr-verify/write-verdict.mjs

      - name: Upload the FAIL index
        id: fail-index
        if: >-
          ${{ !cancelled() && steps.verdict.outcome == 'success' && steps.verdict.outputs.verdict == 'fail' }}
        uses: ./.base/.github/actions/upload-fail-index # zizmor: ignore[self-repository]
        with:
          names: ${{ steps.verdict.outputs.index-names }}
          path: ${{ runner.temp }}/pr-verify-verdict/fail-index.txt
          retention-days: ${{ steps.verdict.outputs.retention-days }}
          github-token: ${{ github.token }}

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          ${{ !cancelled() && steps.verdict.outcome == 'success' && (steps.verdict.outputs.verdict != 'fail' || steps.fail-index.outcome == 'success') }}
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/pr-verify-verdict/verdict.json

      - name: Upload the verdict
        id: upload-verdict
        if: >-
          (!cancelled() && steps.verdict.outcome == 'success' && (steps.verdict.outputs.verdict != 'fail' || steps.fail-index.outcome == 'success')) && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.verdict.outputs.name }}
          path: ${{ runner.temp }}/pr-verify-verdict/verdict.json
          retention-days: ${{ steps.verdict.outputs.retention-days }}
          if-no-files-found: error

      - name: Summarize the verdict
        if: ${{ !cancelled() && steps.verdict.outcome == 'success' }}
        env:
          VERDICT_FILE: ${{ runner.temp }}/pr-verify-verdict/verdict.json
        run: |
          {
            echo "### Verifier verdict"
            echo
            echo '```json'
            jq '.summary |= gsub("`"; "'"'"'") | .notes |= map(gsub("`"; "'"'"'"))' "$VERDICT_FILE"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # Read by the next runs' credit gate: the artifact its `marker` output
      # names (check-key-credit gate.cjs markerName), uploaded only after a
      # judge step's credit-stop handoff, which on this key leg means the key
      # is out of credit. The name is written out so its retention row
      # (.github/artifact-retention.json) claims it; a gate that names
      # another marker writes none. Its upload time starts the window; one
      # day's retention covers windows up to 24 hours.
      - name: Write the key's credit-stop marker
        id: credit-marker
        if: always() && steps.credit.outputs.marker == 'key-credit-stop-PR_VERIFY_CLAUDE_API_KEY' && (steps.judge.outputs.handoff-reason == 'credit-stop' || steps.judge-chunks.outputs.handoff-reason == 'credit-stop' || steps.judge-spec.outputs.handoff-reason == 'credit-stop')
        continue-on-error: true
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/key-credit-stop"
          echo "$GITHUB_RUN_ID" >"$RUNNER_TEMP/key-credit-stop/run-id"

      - name: Scan the key's credit-stop marker for credentials
        id: credit-marker-scan
        if: always() && steps.credit-marker.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/key-credit-stop/run-id

      - name: Upload the key's credit-stop marker
        if: (always() && steps.credit-marker.outcome == 'success') && steps.credit-marker-scan.outputs.clean == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: key-credit-stop-PR_VERIFY_CLAUDE_API_KEY
          overwrite: true
          path: ${{ runner.temp }}/key-credit-stop/run-id
          if-no-files-found: error
          retention-days: 1

      # The leg the next job runs, from this job's credential decision and
      # a clean handoff of whichever judge step handed off
      # (select-model-credential). It has no if:, so it names a leg only when
      # every step before it passed; the next job also needs this job's success.
      - name: Pick the next leg
        id: next
        continue-on-error: true
        timeout-minutes: 1
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          state: ${{ steps.credential.outputs.state }}
          handoff: ${{ (steps.judge.outputs.handoff == 'true' || steps.judge-chunks.outputs.handoff == 'true' || steps.judge-spec.outputs.handoff == 'true') && (steps.key-leg.outputs.clean || steps.key-leg-chunks.outputs.clean || steps.key-leg-spec.outputs.clean) == 'true' }}
          handoff-reason: ${{ steps.judge.outputs.handoff-reason || steps.judge-chunks.outputs.handoff-reason || steps.judge-spec.outputs.handoff-reason }}

      - name: Keep the lane hold marker
        if: steps.note-hold.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lane-hold-pr-verify
          path: ${{ runner.temp }}/lane-hold/pr-verify
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Log the API budget
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

      - name: Fail without a verdict
        if: always() && steps.agree.outcome == 'success' && steps.credential.outputs.key-skipped != 'true' && steps.verdict.outcome != 'success' && steps.credential.outputs.present != 'false' && steps.key-leg.outcome != 'success' && steps.key-leg-chunks.outcome != 'success' && steps.key-leg-spec.outcome != 'success'
        run: |
          echo "::error::the judgment left no verdict for this head"
          exit 1

  # The subscription leg, as its own job on a new VM
  # (https://github.com/melodic-software/claude-code-plugins/blob/main/docs/conventions/pr-pipeline/README.md#funding). It runs when
  # check-intent succeeded and named it the next leg (a clean handoff, an
  # empty key or a key the credit gate skipped), or when check-intent was
  # skipped, which with this job's own trigger terms means the API-key
  # switch is on: then its reason is no-key and it reads everything itself.
  # Keying on check-intent's result, not the switch, keeps a switch flipped
  # between the two jobs from judging twice or not at all. A check-intent
  # that failed, a denial on its key leg included, leaves it skipped. check-intent's
  # processes and environment do not reach it, and of its files only the
  # pre-judge reads do, through the `reads` output. Its steps repeat
  # check-intent's from a fresh checkout but for the credential, the reads
  # it takes from check-intent, its own leg checks and the
  # key-only steps (handing the reads on, the credit gate, the credit-stop
  # and probing markers); scripts/sync-credential-legs.mjs renders the rest
  # from check-intent's, so the trigger gate, the kill switch and the
  # hardening run again. Only this job references the subscription token.
  check-intent-subscription:
    name: Check Intent Subscription
    needs: check-intent
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && github.event.workflow_run.event == 'pull_request'
      && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (needs.check-intent.result == 'skipped'
      || (needs.check-intent.result == 'success'
      && needs.check-intent.outputs.next-leg == 'subscription'))
    runs-on: ubuntu-24.04
    timeout-minutes: 222
    cache-mode: read
    permissions:
      contents: read # check out main; read the PR's commits for the diff
      pull-requests: read # the PR, its comments and reviews
      actions: read # the upstream run, and verdicts already uploaded
    outputs:
      next-leg: ${{ steps.next.outputs.next-leg }}
      next-reason: ${{ steps.next.outputs.next-reason }}
      # For wake-pr-merge: the pull request, and the verdict once it uploaded.
      pr-number: ${{ steps.pr.outputs.pr-number }}
      verdict: ${{ steps.upload-verdict.outcome == 'success' && steps.verdict.outputs.verdict || '' }}
    steps:
      - name: Resolve main's tip
        id: tip
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.check-intent.outputs.standards-sha }}

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
        run: |
          echo "::error::the lanes kill switch stops this run (reason: ${REASON:-unreadable}); no verdict until the lost-run reconciler re-runs it"
          exit 1

      - name: Resolve the pull request
        id: pr
        if: steps.kill.outputs.proceed == 'true'
        env:
          GITHUB_READ_STORE: ${{ runner.temp }}/github-reads
          GITHUB_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          # A rate-guard stop holds green with the resolver's other GitHub
          # faults (resolve-pr.mjs closing) instead of failing the step.
          API_BUDGET_HOLD: "1"
          SPEC_FILE: ${{ github.workspace }}/pr-verify-data/spec.json
          SPEC_TEXT_FILE: ${{ github.workspace }}/pr-verify-data/spec-text.json
          STANDARDS_SHA: ${{ steps.standards.outputs.sha }}
          TRUSTED_ACTORS_PATH: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
          CONTEXT_FILE: ${{ github.workspace }}/pr-verify-data/context.json
          # check-intent's reads, taken only when they hold (resolve-pr.mjs takeReads).
          CARRIED: ${{ needs.check-intent.outputs.reads }}
        run: |
          mkdir -p "$(dirname "$SPEC_FILE")"
          VERIFY_AUTHORS=$(yq '.merge."verify-authors" // "lane"' .base/docs/conventions/pr-pipeline.yaml)
          LANE_IDENTITY=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          SPEC_FROM_BODY_APPS=$(yq '.adoption."spec-from-body-apps" // [] | .[]' .base/docs/conventions/pr-pipeline.yaml)
          # The issue lane's web hosts as admission reads them (resolve-config issueLaneWebHostsFromBase).
          ISSUE_LANE_WEB_HOSTS=$(yq -o=json -I=0 '(.activities."resolve-issue"."web-access" | select(.enabled == true) | .domains) // []' .base/docs/conventions/pr-pipeline.yaml)
          # The one file a lanes App pull request may change alone with no verdict (resolve-pr.mjs baselineOnly).
          BASELINE_FILE=$(yq '.merge."baseline-file" // ""' .base/docs/conventions/pr-pipeline.yaml)
          export VERIFY_AUTHORS LANE_IDENTITY SPEC_FROM_BODY_APPS ISSUE_LANE_WEB_HOSTS BASELINE_FILE
          node .base/.github/scripts/pr-verify/resolve-pr.mjs

      # The upstream run's actors, the re-runner and the PR author must all be
      # on the trusted-actor list. A re-run github-actions[bot] started passes
      # only as the lost-run reconciler's recorded re-run of this run.
      - name: Check the trigger
        id: gate
        if: steps.pr.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
          GITHUB_READ_STORE: ${{ runner.temp }}/github-reads
        uses: ./.base/.github/actions/check-trusted-trigger # zizmor: ignore[self-repository]
        with:
          standards-path: ${{ steps.standards.outputs.path }}
          triggering-actor: ${{ github.triggering_actor }}
          reconciler-workflow: .github/workflows/maintenance-reconcile-lost-runs.yml
          ci-status-rerun-workflow: .github/workflows/pr-dispatch-feedback.yml
          # A stop a GitHub fault caused reads read-fault, not the refusal's
          # reason, so the next step can mark it held; it still stops.
          fault-reason: "true"

      - name: Note the hold
        id: note-hold
        if: steps.pr.outputs.reason == 'held' || steps.gate.outputs.reason == 'read-fault'
        env:
          GATE_REASON: ${{ steps.gate.outputs.reason }}
        run: |
          if [[ $GATE_REASON == read-fault ]]; then
            echo "::notice title=pr-verify::held: pr-verify's trigger gate met a GitHub fault (read-fault); nothing is judged"
          fi
          echo "pr-verify held on a GitHub fault; the lost-run reconciler re-runs this run once"
          # The hold's marker for monitor signal 13 (lane-hold-marker.mjs).
          { mkdir -p "$RUNNER_TEMP/lane-hold" && echo "pr-verify $GITHUB_RUN_ID" >"$RUNNER_TEMP/lane-hold/pr-verify"; } || true

      - name: Assert the gate and the resolver agree
        id: agree
        if: steps.gate.outputs.proceed == 'true'
        env:
          GATE_PR: ${{ steps.gate.outputs.pr-number }}
          GATE_HEAD: ${{ steps.gate.outputs.head-sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
        run: bash .base/.github/scripts/pr-verify/assert-gate-agrees.sh

      # Carried from check-intent when the resolver took its reads.
      - name: Select the trusted PR text
        if: steps.agree.outcome == 'success' && steps.pr.outputs.carried != 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/select-trusted-text # zizmor: ignore[self-repository]
        with:
          pr-number: ${{ steps.pr.outputs.pr-number }}
          standards-path: ${{ steps.standards.outputs.path }}
          output-path: ${{ github.workspace }}/pr-verify-data/context.json
          reads-path: ${{ runner.temp }}/pr-verify-pr-reads.json
          head-sha: ${{ steps.pr.outputs.head-sha }}
          github-token: ${{ github.token }}

      - name: Write the diff
        id: diff
        if: steps.agree.outcome == 'success'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          DATA: ${{ github.workspace }}/pr-verify-data
          SRC: ${{ runner.temp }}/pr-verify-src
          # The head's tree, for upstream-jobs.mjs: trees come with a blobless fetch.
          HEAD_PATHS_FILE: ${{ runner.temp }}/pr-verify-head-paths
          MAX_DIFF_BYTES: "300000"
          # One Read returns at most 25,000 tokens
          # (https://code.claude.com/docs/en/tools-reference#large-files), and
          # a token is at least a byte, so a part this size comes back whole.
          PART_BYTES: "15000"
          PART_LINES: "1000"
        run: |
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          mkdir -p "$DATA"
          git init -q "$SRC"
          git -C "$SRC" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$SRC" fetch -q --no-tags --filter=blob:none origin "$BASE_SHA" "$HEAD_SHA"
          git -C "$SRC" diff --no-ext-diff --no-textconv --no-color "$BASE_SHA...$HEAD_SHA" >"$DATA/diff.patch"
          git -C "$SRC" ls-tree -r -z --name-only "$HEAD_SHA" >"$HEAD_PATHS_FILE"
          jq -n --argjson pr "$PR_NUMBER" --arg head "$HEAD_SHA" --arg base "$BASE_SHA" \
            '{pr: $pr, head_sha: $head, base_sha: $base}' >"$DATA/pr.json"
          echo "diff: $(wc -l <"$DATA/diff.patch") lines"
          bash .base/.github/scripts/pr-verify/chunk-diff.sh

      - name: List the upstream run's jobs
        if: steps.agree.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          JOBS_FILE: ${{ github.workspace }}/pr-verify-data/upstream-jobs.json
          HEAD_PATHS_FILE: ${{ runner.temp }}/pr-verify-head-paths
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/pr-verify/upstream-jobs.mjs

      - name: Resolve the verifier's model
        id: models
        if: steps.agree.outcome == 'success'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: verify-pr
          output-path: ${{ runner.temp }}/pr-verify-models.json
          standards-path: ${{ steps.standards.outputs.path }}

      # Only whether each secret is set reaches the action, never a value.
      - name: Check the credential
        id: credential
        if: steps.agree.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          leg: subscription
          role: pr-verify
          credential-set: ${{ secrets.PR_VERIFY_CLAUDE_CODE_OAUTH_TOKEN != '' }}
          fallback-set: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
          reason: ${{ needs.check-intent.result == 'skipped' && 'no-key' || needs.check-intent.outputs.next-reason }}

      - name: Apply the Claude managed settings
        if: steps.agree.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@main

      - name: Isolate the runner
        if: steps.agree.outcome == 'success'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: true

      # Files, not step outputs: run-claude-cli reads both. A `default` model
      # resolves to an empty model, which the launcher cannot pass. started-at
      # lets the outcome step tell a step timeout from other failures.
      - name: Write the prompt and schema
        id: prompt
        if: steps.agree.outcome == 'success'
        env:
          DATA: ${{ github.workspace }}/pr-verify-data
          MODEL: ${{ steps.models.outputs.model }}
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          PROMPT_STEM: ${{ runner.temp }}/pr-verify-prompts/prompt
          SCHEMA_FILE: ${{ runner.temp }}/pr-verify-schema.json
          LEG_MINUTES: "15"
          CHUNK_PARALLELISM: "8"
        run: |
          if [ -z "$MODEL" ]; then
            echo "::error::the verify-pr profile's model is default, which run-claude-cli cannot pass; name an alias"
            exit 1
          fi
          if ! [[ $CHUNKS =~ ^[1-9][0-9]?$ ]]; then
            echo "::error::the chunk count is malformed"
            exit 1
          fi
          mkdir -p "${PROMPT_STEM%/*}"
          node .base/.github/scripts/pr-verify/render-prompt.mjs
          printf '%s\n' '{"type":"object","properties":{"verdict":{"enum":["pass","pass-notes","fail"]},"summary":{"type":"string"},"notes":{"type":"array","items":{"type":"string"}}},"required":["verdict","summary","notes"],"additionalProperties":false}' >"$SCHEMA_FILE"
          # The later chunks' step limit: one leg and a minute for each round
          # of CHUNK_PARALLELISM legs, and 3 minutes to install the CLI.
          rounds=$(((CHUNKS - 1 + CHUNK_PARALLELISM - 1) / CHUNK_PARALLELISM))
          { echo "started-at=$(date +%s)"; echo "loop-minutes=$((3 + rounds * (LEG_MINUTES + 1)))"; } >>"$GITHUB_OUTPUT"

      # With the fallback token set, a limit stop, a credit stop or a 401 or
      # 402 hands off, which skips the verdict steps; the outcome step records
      # the leg as handed off, and the fallback job judges the run.
      - name: Judge the pull request
        id: judge
        if: steps.credential.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 22
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@main
        env:
          # No work may outlive the result message the launcher reads.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: pr-verify
          role: pr-verify
          prompt-file: ${{ runner.temp }}/pr-verify-prompts/prompt-1.md
          preamble: >-
            You run unattended; return only the verdict the schema asks for;
            your summary and notes are public, so never quote a credential.
          subscription-token: ${{ secrets.PR_VERIFY_CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./pr-verify-data/**)
          disallowed-tools: |
            Read(./.base/**)
            Glob
            Grep
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            mcp__*
          json-schema-file: ${{ runner.temp }}/pr-verify-schema.json
          fallback-ready: ${{ steps.credential.outputs.fallback-ready }}
          leg-timeout-minutes: "15"

      # After a handoff, the denial check: a denial on the subscription leg
      # means no verdict, so the fallback job runs only on this step's
      # clean=true; continue-on-error lets the report record the stop, and
      # "Fail without a verdict" carries the red. run-claude-cli warns of a
      # refused token itself.
      - name: Check the subscription leg
        id: sub-leg
        if: steps.judge.outputs.handoff == 'true'
        continue-on-error: true
        env:
          LOG_FILES: |
            ${{ steps.judge.outputs.log-file }}
          HANDOFF_REASON: ${{ steps.judge.outputs.handoff-reason }}
        run: |
          node .base/.github/scripts/pr-verify/write-verdict.mjs check-key-leg
          echo "::notice::the subscription leg handed off (${HANDOFF_REASON}); check-intent-fallback judges on the fallback token"

      # One lane record per leg: this one, marked handoff when the leg handed
      # off cleanly; the fallback job records its own leg.
      - name: Report the judgment's outcome
        if: steps.judge.outcome == 'success' || steps.judge.outcome == 'failure'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: ${{ steps.judge.outcome }}
          execution-file: ${{ steps.judge.outputs.execution-file }}
          log-file: ${{ steps.judge.outputs.log-file }}
          lane: pr-verify
          lane-id: pr-verify
          step-started-at: ${{ steps.prompt.outputs.started-at }}
          step-timeout-minutes: 22
          credential: ${{ steps.judge.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.judge.outputs.lane-class }}
          handoff: ${{ steps.judge.outputs.handoff == 'true' && steps.sub-leg.outcome != 'failure' }}
          # Why this job ran, for its lane record.
          fallback-reason: ${{ steps.credential.outputs.fallback-reason }}

      - name: Upload the sealed transcript
        if: always() && steps.judge.outputs.execution-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          hide-trace-ids: "true"
          execution-file: ${{ steps.judge.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}

      - name: Read chunk 1's verdict
        id: chunk-fail
        if: ${{ !cancelled() && (steps.judge.outcome == 'success' || (steps.judge.outcome == 'failure' && steps.judge.outputs.lane-class == '' && steps.judge.outputs.execution-file != '')) }}
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.judge.outputs.execution-file }}
          JUDGE_OUTCOME: ${{ steps.judge.outcome }}
          LOG_FILE: ${{ steps.judge.outputs.log-file }}
          CHUNK: "1"
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          DIFF_DIR: ${{ github.workspace }}/pr-verify-data/diff
          MANIFEST_DIR: ${{ github.workspace }}/pr-verify-data/manifest
        run: node .base/.github/scripts/pr-verify/write-verdict.mjs chunk-fail

      - name: Time the later chunks
        id: time-chunks
        if: steps.credential.outputs.present == 'true' && fromJSON(steps.diff.outputs.chunks || '0') >= 2 && steps.judge.outcome == 'success' && steps.judge.outputs.handoff != 'true' && steps.chunk-fail.outputs.fail != 'true'
        run: echo "started-at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Judge the later chunks
        id: judge-chunks
        if: steps.credential.outputs.present == 'true' && fromJSON(steps.diff.outputs.chunks || '0') >= 2 && steps.judge.outcome == 'success' && steps.judge.outputs.handoff != 'true' && steps.chunk-fail.outputs.fail != 'true'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.prompt.outputs.loop-minutes || '1') }}
        uses: melodic-software/ci-workflows/.github/actions/run-review-chunks@main
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: pr-verify
          role: pr-verify
          prompt-dir: ${{ runner.temp }}/pr-verify-prompts
          chunk-first: "2"
          chunk-last: ${{ steps.diff.outputs.chunks }}
          parallelism: "8"
          preamble: >-
            You run unattended; return only the verdict the schema asks for;
            your summary and notes are public, so never quote a credential.
          subscription-token: ${{ secrets.PR_VERIFY_CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./pr-verify-data/**)
          disallowed-tools: |
            Read(./.base/**)
            Glob
            Grep
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            mcp__*
          json-schema-file: ${{ runner.temp }}/pr-verify-schema.json
          fallback-ready: ${{ steps.credential.outputs.fallback-ready }}
          leg-timeout-minutes: "15"

      - name: Check the later chunks for a fail
        id: later-fail
        if: steps.judge-chunks.outputs.handoff == 'true'
        env:
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          CHUNKS_DIR: ${{ steps.judge-chunks.outputs.results-dir }}
          CHUNK_OUTCOMES: ${{ steps.judge-chunks.outputs.chunk-outcomes }}
          DIFF_DIR: ${{ github.workspace }}/pr-verify-data/diff
          MANIFEST_DIR: ${{ github.workspace }}/pr-verify-data/manifest
        run: node .base/.github/scripts/pr-verify/write-verdict.mjs later-fail

      - name: Check the subscription leg, later chunks
        id: sub-leg-chunks
        if: steps.judge-chunks.outputs.handoff == 'true' && steps.later-fail.outputs.fail != 'true'
        continue-on-error: true
        env:
          LOG_FILES: |
            ${{ steps.judge.outputs.log-file }}
          CHUNKS_DIR: ${{ steps.judge-chunks.outputs.results-dir }}
          CHUNK_OUTCOMES: ${{ steps.judge-chunks.outputs.chunk-outcomes }}
          HANDOFF_REASON: ${{ steps.judge-chunks.outputs.handoff-reason }}
        run: |
          node .base/.github/scripts/pr-verify/write-verdict.mjs check-key-leg
          echo "::notice::the subscription leg handed off (${HANDOFF_REASON}); check-intent-fallback judges on the fallback token"

      - name: Report the later chunks' outcome
        if: steps.judge-chunks.outcome == 'success' || steps.judge-chunks.outcome == 'failure'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: ${{ steps.judge-chunks.outcome }}
          execution-file: ${{ steps.judge-chunks.outputs.execution-file }}
          log-file: ${{ steps.judge-chunks.outputs.log-file }}
          lane: pr-verify
          lane-id: pr-verify
          step-started-at: ${{ steps.time-chunks.outputs.started-at }}
          step-timeout-minutes: ${{ steps.prompt.outputs.loop-minutes }}
          credential: ${{ steps.judge-chunks.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.judge-chunks.outputs.lane-class }}
          handoff: ${{ steps.judge-chunks.outputs.handoff == 'true' && steps.later-fail.outputs.fail != 'true' && steps.sub-leg-chunks.outcome != 'failure' }}
          fallback-reason: ${{ steps.credential.outputs.fallback-reason }}

      - name: Upload the later chunks' sealed transcript
        if: always() && steps.judge-chunks.outputs.transcript-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          hide-trace-ids: "true"
          execution-file: ${{ steps.judge-chunks.outputs.transcript-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}-chunks

      - name: Write the chunk results
        id: chunk-results
        if: steps.credential.outputs.present == 'true' && fromJSON(steps.diff.outputs.chunks || '0') > 1 && steps.judge.outcome == 'success' && steps.chunk-fail.outputs.fail != 'true' && (steps.judge-chunks.outcome == 'success' || steps.judge-chunks.outcome == 'failure') && (steps.judge-chunks.outputs.handoff != 'true' || steps.later-fail.outputs.fail == 'true')
        env:
          EXECUTION_FILES: |
            ${{ steps.judge.outputs.execution-file }}
          LOG_FILES: |
            ${{ steps.judge.outputs.log-file }}
          JUDGE_OUTCOMES: |
            ${{ steps.judge.outcome }}
          CHUNKS_DIR: ${{ steps.judge-chunks.outputs.results-dir }}
          CHUNK_OUTCOMES: ${{ steps.judge-chunks.outputs.chunk-outcomes }}
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          DIFF_DIR: ${{ github.workspace }}/pr-verify-data/diff
          RESULTS_DIR: ${{ github.workspace }}/pr-verify-data/chunk-results
          PART_BYTES: "15000"
          SPEC_TEXT_FILE: ${{ github.workspace }}/pr-verify-data/spec-text.json
          SPEC_FILE: ${{ github.workspace }}/pr-verify-data/spec.json
          CONTEXT_FILE: ${{ github.workspace }}/pr-verify-data/context.json
          PR_FILE: ${{ github.workspace }}/pr-verify-data/pr.json
          MANIFEST_DIR: ${{ github.workspace }}/pr-verify-data/manifest
          PROMPT_FILE: ${{ runner.temp }}/pr-verify-prompt-spec.md
          PROMPT_TEMPLATE: .base/.github/scripts/pr-verify/spec-prompt.md
          SCHEMA_FILE: ${{ runner.temp }}/pr-verify-spec-schema.json
        run: node .base/.github/scripts/pr-verify/write-verdict.mjs chunk-results

      - name: Time the spec judgment
        id: time-spec
        if: fromJSON(steps.diff.outputs.chunks || '0') > 1 && steps.chunk-results.outcome == 'success' && steps.chunk-results.outputs.fail != 'true'
        run: echo "started-at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Judge the whole spec
        id: judge-spec
        if: fromJSON(steps.diff.outputs.chunks || '0') > 1 && steps.chunk-results.outcome == 'success' && steps.chunk-results.outputs.fail != 'true'
        continue-on-error: true
        timeout-minutes: 22
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@main
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: pr-verify
          role: pr-verify
          prompt-file: ${{ runner.temp }}/pr-verify-prompt-spec.md
          preamble: >-
            You run unattended; return only the verdict the schema asks for;
            your summary and notes are public, so never quote a credential.
          subscription-token: ${{ secrets.PR_VERIFY_CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./pr-verify-data/**)
          disallowed-tools: |
            Read(./.base/**)
            Read(./pr-verify-data/diff/**)
            Glob
            Grep
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            mcp__*
          json-schema-file: ${{ runner.temp }}/pr-verify-spec-schema.json
          fallback-ready: ${{ steps.credential.outputs.fallback-ready }}
          leg-timeout-minutes: "15"

      - name: Check the subscription leg, whole spec
        id: sub-leg-spec
        if: steps.judge-spec.outputs.handoff == 'true'
        continue-on-error: true
        env:
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          LOG_FILES: |
            ${{ steps.judge.outputs.log-file }}
            ${{ steps.judge-spec.outputs.log-file }}
          CHUNKS_DIR: ${{ steps.judge-chunks.outputs.results-dir }}
          CHUNK_OUTCOMES: ${{ steps.judge-chunks.outputs.chunk-outcomes }}
          HANDOFF_REASON: ${{ steps.judge-spec.outputs.handoff-reason }}
        run: |
          node .base/.github/scripts/pr-verify/write-verdict.mjs check-key-leg
          echo "::notice::the subscription leg handed off (${HANDOFF_REASON}); check-intent-fallback judges on the fallback token"

      - name: Report the spec judgment's outcome
        if: steps.judge-spec.outcome == 'success' || steps.judge-spec.outcome == 'failure'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: ${{ steps.judge-spec.outcome }}
          execution-file: ${{ steps.judge-spec.outputs.execution-file }}
          log-file: ${{ steps.judge-spec.outputs.log-file }}
          lane: pr-verify
          lane-id: pr-verify
          step-started-at: ${{ steps.time-spec.outputs.started-at }}
          step-timeout-minutes: 22
          credential: ${{ steps.judge-spec.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.judge-spec.outputs.lane-class }}
          handoff: ${{ steps.judge-spec.outputs.handoff == 'true' && steps.sub-leg-spec.outcome != 'failure' }}
          fallback-reason: ${{ steps.credential.outputs.fallback-reason }}

      - name: Upload the spec judgment's sealed transcript
        if: always() && steps.judge-spec.outputs.execution-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          hide-trace-ids: "true"
          execution-file: ${{ steps.judge-spec.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}-spec

      - name: Write the verdict
        id: verdict
        if: ${{ !cancelled() && (steps.chunk-fail.outputs.fail == 'true' || steps.chunk-results.outputs.fail == 'true' || steps.chunk-results.outcome == 'failure' || (steps.judge.outcome == 'success' && (fromJSON(steps.diff.outputs.chunks || '0') < 2 || (steps.judge-chunks.outcome == 'success' && (steps.judge-spec.outcome == 'success' || (steps.judge-spec.outcome == 'failure' && steps.judge-spec.outputs.lane-class == '' && steps.judge-spec.outputs.execution-file != '')))))) }}
        env:
          EXECUTION_FILES: |
            ${{ steps.judge.outputs.execution-file }}
          LOG_FILES: |
            ${{ steps.judge.outputs.log-file }}
          JUDGE_OUTCOMES: |
            ${{ steps.judge.outcome }}
          CHUNKS_DIR: ${{ steps.judge-chunks.outputs.results-dir }}
          CHUNK_OUTCOMES: ${{ steps.judge-chunks.outputs.chunk-outcomes }}
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          DIFF_DIR: ${{ github.workspace }}/pr-verify-data/diff
          FINAL_EXECUTION_FILE: ${{ steps.judge-spec.outputs.execution-file }}
          FINAL_LOG_FILE: ${{ steps.judge-spec.outputs.log-file }}
          FINAL_OUTCOME: ${{ steps.judge-spec.outcome }}
          RESULTS_DIR: ${{ github.workspace }}/pr-verify-data/chunk-results
          MANIFEST_DIR: ${{ github.workspace }}/pr-verify-data/manifest
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          HEAD_REF: ${{ steps.pr.outputs.head-ref }}
          RELINK_SINCE_HEAD: ${{ steps.pr.outputs.relink-since-head }}
          SPEC_FILE: ${{ github.workspace }}/pr-verify-data/spec.json
          SPEC_TEXT_FILE: ${{ github.workspace }}/pr-verify-data/spec-text.json
          CONTEXT_FILE: ${{ github.workspace }}/pr-verify-data/context.json
          VERDICT_DIR: ${{ runner.temp }}/pr-verify-verdict
          # This job uploads a FAIL's index (write-verdict.mjs FAIL_INDEX).
          FAIL_INDEX: "1"
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/pr-verify/write-verdict.mjs

      - name: Upload the FAIL index
        id: fail-index
        if: >-
          ${{ !cancelled() && steps.verdict.outcome == 'success' && steps.verdict.outputs.verdict == 'fail' }}
        uses: ./.base/.github/actions/upload-fail-index # zizmor: ignore[self-repository]
        with:
          names: ${{ steps.verdict.outputs.index-names }}
          path: ${{ runner.temp }}/pr-verify-verdict/fail-index.txt
          retention-days: ${{ steps.verdict.outputs.retention-days }}
          github-token: ${{ github.token }}

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          ${{ !cancelled() && steps.verdict.outcome == 'success' && (steps.verdict.outputs.verdict != 'fail' || steps.fail-index.outcome == 'success') }}
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/pr-verify-verdict/verdict.json

      - name: Upload the verdict
        id: upload-verdict
        if: >-
          (!cancelled() && steps.verdict.outcome == 'success' && (steps.verdict.outputs.verdict != 'fail' || steps.fail-index.outcome == 'success')) && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.verdict.outputs.name }}
          path: ${{ runner.temp }}/pr-verify-verdict/verdict.json
          retention-days: ${{ steps.verdict.outputs.retention-days }}
          if-no-files-found: error

      - name: Summarize the verdict
        if: ${{ !cancelled() && steps.verdict.outcome == 'success' }}
        env:
          VERDICT_FILE: ${{ runner.temp }}/pr-verify-verdict/verdict.json
        run: |
          {
            echo "### Verifier verdict"
            echo
            echo '```json'
            jq '.summary |= gsub("`"; "'"'"'") | .notes |= map(gsub("`"; "'"'"'"))' "$VERDICT_FILE"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Pick the next leg
        id: next
        continue-on-error: true
        timeout-minutes: 1
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          state: ${{ steps.credential.outputs.state }}
          handoff: ${{ (steps.judge.outputs.handoff == 'true' || steps.judge-chunks.outputs.handoff == 'true' || steps.judge-spec.outputs.handoff == 'true') && (steps.sub-leg.outputs.clean || steps.sub-leg-chunks.outputs.clean || steps.sub-leg-spec.outputs.clean) == 'true' }}
          handoff-reason: ${{ steps.judge.outputs.handoff-reason || steps.judge-chunks.outputs.handoff-reason || steps.judge-spec.outputs.handoff-reason }}

      - name: Keep the lane hold marker
        if: steps.note-hold.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lane-hold-pr-verify
          path: ${{ runner.temp }}/lane-hold/pr-verify
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Log the API budget
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

      # A clean handoff, or an empty token with the fallback token set, hands
      # the judgment on; any other run that passed the gates and left no
      # verdict fails here.
      - name: Fail without a verdict
        if: always() && steps.agree.outcome == 'success' && steps.verdict.outcome != 'success' && !(steps.credential.outputs.present == 'false' && steps.credential.outputs.fallback-ready == 'true') && steps.sub-leg.outcome != 'success' && steps.sub-leg-chunks.outcome != 'success' && steps.sub-leg-spec.outcome != 'success'
        run: |
          echo "::error::the judgment left no verdict for this head"
          exit 1

  check-intent-fallback:
    name: Check Intent Fallback
    needs: [check-intent, check-intent-subscription]
    if: >-
      !cancelled()
      && needs.check-intent-subscription.result == 'success'
      && github.ref == 'refs/heads/main'
      && github.event.workflow_run.event == 'pull_request'
      && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
      && github.event.workflow_run.head_repository.full_name == github.repository
      && needs.check-intent-subscription.outputs.next-leg == 'fallback'
    runs-on: ubuntu-24.04
    timeout-minutes: 222
    cache-mode: read
    permissions:
      contents: read # check out main; read the PR's commits for the diff
      pull-requests: read # the PR, its comments and reviews
      actions: read # the upstream run, and verdicts already uploaded
    outputs:
      # For wake-pr-merge: the pull request, and the verdict once it uploaded.
      pr-number: ${{ steps.pr.outputs.pr-number }}
      verdict: ${{ steps.upload-verdict.outcome == 'success' && steps.verdict.outputs.verdict || '' }}
    steps:
      - name: Resolve main's tip
        id: tip
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.check-intent.outputs.standards-sha }}

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
        run: |
          echo "::error::the lanes kill switch stops this run (reason: ${REASON:-unreadable}); no verdict until the lost-run reconciler re-runs it"
          exit 1

      - name: Resolve the pull request
        id: pr
        if: steps.kill.outputs.proceed == 'true'
        env:
          GITHUB_READ_STORE: ${{ runner.temp }}/github-reads
          GITHUB_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          # A rate-guard stop holds green with the resolver's other GitHub
          # faults (resolve-pr.mjs closing) instead of failing the step.
          API_BUDGET_HOLD: "1"
          SPEC_FILE: ${{ github.workspace }}/pr-verify-data/spec.json
          SPEC_TEXT_FILE: ${{ github.workspace }}/pr-verify-data/spec-text.json
          STANDARDS_SHA: ${{ steps.standards.outputs.sha }}
          TRUSTED_ACTORS_PATH: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
          CONTEXT_FILE: ${{ github.workspace }}/pr-verify-data/context.json
          CARRIED: ${{ needs.check-intent.outputs.reads }}
        run: |
          mkdir -p "$(dirname "$SPEC_FILE")"
          VERIFY_AUTHORS=$(yq '.merge."verify-authors" // "lane"' .base/docs/conventions/pr-pipeline.yaml)
          LANE_IDENTITY=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          SPEC_FROM_BODY_APPS=$(yq '.adoption."spec-from-body-apps" // [] | .[]' .base/docs/conventions/pr-pipeline.yaml)
          # The issue lane's web hosts as admission reads them (resolve-config issueLaneWebHostsFromBase).
          ISSUE_LANE_WEB_HOSTS=$(yq -o=json -I=0 '(.activities."resolve-issue"."web-access" | select(.enabled == true) | .domains) // []' .base/docs/conventions/pr-pipeline.yaml)
          # The one file a lanes App pull request may change alone with no verdict (resolve-pr.mjs baselineOnly).
          BASELINE_FILE=$(yq '.merge."baseline-file" // ""' .base/docs/conventions/pr-pipeline.yaml)
          export VERIFY_AUTHORS LANE_IDENTITY SPEC_FROM_BODY_APPS ISSUE_LANE_WEB_HOSTS BASELINE_FILE
          node .base/.github/scripts/pr-verify/resolve-pr.mjs

      - name: Check the trigger
        id: gate
        if: steps.pr.outputs.proceed == 'true'
        env:
          API_BUDGET_TOKEN: github-token
          GITHUB_READ_STORE: ${{ runner.temp }}/github-reads
        uses: ./.base/.github/actions/check-trusted-trigger # zizmor: ignore[self-repository]
        with:
          standards-path: ${{ steps.standards.outputs.path }}
          triggering-actor: ${{ github.triggering_actor }}
          reconciler-workflow: .github/workflows/maintenance-reconcile-lost-runs.yml
          ci-status-rerun-workflow: .github/workflows/pr-dispatch-feedback.yml
          # A stop a GitHub fault caused reads read-fault, not the refusal's
          # reason, so the next step can mark it held; it still stops.
          fault-reason: "true"

      - name: Note the hold
        id: note-hold
        if: steps.pr.outputs.reason == 'held' || steps.gate.outputs.reason == 'read-fault'
        env:
          GATE_REASON: ${{ steps.gate.outputs.reason }}
        run: |
          if [[ $GATE_REASON == read-fault ]]; then
            echo "::notice title=pr-verify::held: pr-verify's trigger gate met a GitHub fault (read-fault); nothing is judged"
          fi
          echo "pr-verify held on a GitHub fault; the lost-run reconciler re-runs this run once"
          # The hold's marker for monitor signal 13 (lane-hold-marker.mjs).
          { mkdir -p "$RUNNER_TEMP/lane-hold" && echo "pr-verify $GITHUB_RUN_ID" >"$RUNNER_TEMP/lane-hold/pr-verify"; } || true

      - name: Assert the gate and the resolver agree
        id: agree
        if: steps.gate.outputs.proceed == 'true'
        env:
          GATE_PR: ${{ steps.gate.outputs.pr-number }}
          GATE_HEAD: ${{ steps.gate.outputs.head-sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
        run: bash .base/.github/scripts/pr-verify/assert-gate-agrees.sh

      - name: Select the trusted PR text
        if: steps.agree.outcome == 'success' && steps.pr.outputs.carried != 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/select-trusted-text # zizmor: ignore[self-repository]
        with:
          pr-number: ${{ steps.pr.outputs.pr-number }}
          standards-path: ${{ steps.standards.outputs.path }}
          output-path: ${{ github.workspace }}/pr-verify-data/context.json
          reads-path: ${{ runner.temp }}/pr-verify-pr-reads.json
          head-sha: ${{ steps.pr.outputs.head-sha }}
          github-token: ${{ github.token }}

      - name: Write the diff
        id: diff
        if: steps.agree.outcome == 'success'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          DATA: ${{ github.workspace }}/pr-verify-data
          SRC: ${{ runner.temp }}/pr-verify-src
          # The head's tree, for upstream-jobs.mjs: trees come with a blobless fetch.
          HEAD_PATHS_FILE: ${{ runner.temp }}/pr-verify-head-paths
          MAX_DIFF_BYTES: "300000"
          # One Read returns at most 25,000 tokens
          # (https://code.claude.com/docs/en/tools-reference#large-files), and
          # a token is at least a byte, so a part this size comes back whole.
          PART_BYTES: "15000"
          PART_LINES: "1000"
        run: |
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          mkdir -p "$DATA"
          git init -q "$SRC"
          git -C "$SRC" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$SRC" fetch -q --no-tags --filter=blob:none origin "$BASE_SHA" "$HEAD_SHA"
          git -C "$SRC" diff --no-ext-diff --no-textconv --no-color "$BASE_SHA...$HEAD_SHA" >"$DATA/diff.patch"
          git -C "$SRC" ls-tree -r -z --name-only "$HEAD_SHA" >"$HEAD_PATHS_FILE"
          jq -n --argjson pr "$PR_NUMBER" --arg head "$HEAD_SHA" --arg base "$BASE_SHA" \
            '{pr: $pr, head_sha: $head, base_sha: $base}' >"$DATA/pr.json"
          echo "diff: $(wc -l <"$DATA/diff.patch") lines"
          bash .base/.github/scripts/pr-verify/chunk-diff.sh

      - name: List the upstream run's jobs
        if: steps.agree.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          JOBS_FILE: ${{ github.workspace }}/pr-verify-data/upstream-jobs.json
          HEAD_PATHS_FILE: ${{ runner.temp }}/pr-verify-head-paths
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/pr-verify/upstream-jobs.mjs

      - name: Resolve the verifier's model
        id: models
        if: steps.agree.outcome == 'success'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: verify-pr
          output-path: ${{ runner.temp }}/pr-verify-models.json
          standards-path: ${{ steps.standards.outputs.path }}

      # Only whether the fallback token is set reaches the action, as both
      # inputs, never its value.
      - name: Check the credential
        id: credential
        if: steps.agree.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          leg: fallback
          role: pr-verify
          credential-set: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
          fallback-set: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
          reason: ${{ needs.check-intent-subscription.outputs.next-reason }}

      - name: Apply the Claude managed settings
        if: steps.agree.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@main

      - name: Isolate the runner
        if: steps.agree.outcome == 'success'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: true

      # Files, not step outputs: run-claude-cli reads both. A `default` model
      # resolves to an empty model, which the launcher cannot pass. started-at
      # lets the outcome step tell a step timeout from other failures.
      - name: Write the prompt and schema
        id: prompt
        if: steps.agree.outcome == 'success'
        env:
          DATA: ${{ github.workspace }}/pr-verify-data
          MODEL: ${{ steps.models.outputs.model }}
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          PROMPT_STEM: ${{ runner.temp }}/pr-verify-prompts/prompt
          SCHEMA_FILE: ${{ runner.temp }}/pr-verify-schema.json
          LEG_MINUTES: "15"
          CHUNK_PARALLELISM: "8"
        run: |
          if [ -z "$MODEL" ]; then
            echo "::error::the verify-pr profile's model is default, which run-claude-cli cannot pass; name an alias"
            exit 1
          fi
          if ! [[ $CHUNKS =~ ^[1-9][0-9]?$ ]]; then
            echo "::error::the chunk count is malformed"
            exit 1
          fi
          mkdir -p "${PROMPT_STEM%/*}"
          node .base/.github/scripts/pr-verify/render-prompt.mjs
          printf '%s\n' '{"type":"object","properties":{"verdict":{"enum":["pass","pass-notes","fail"]},"summary":{"type":"string"},"notes":{"type":"array","items":{"type":"string"}}},"required":["verdict","summary","notes"],"additionalProperties":false}' >"$SCHEMA_FILE"
          # The later chunks' step limit: one leg and a minute for each round
          # of CHUNK_PARALLELISM legs, and 3 minutes to install the CLI.
          rounds=$(((CHUNKS - 1 + CHUNK_PARALLELISM - 1) / CHUNK_PARALLELISM))
          { echo "started-at=$(date +%s)"; echo "loop-minutes=$((3 + rounds * (LEG_MINUTES + 1)))"; } >>"$GITHUB_OUTPUT"

      - name: Judge the pull request
        id: judge
        if: steps.credential.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 22
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@main
        env:
          # No work may outlive the result message the launcher reads.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: pr-verify
          role: pr-verify
          prompt-file: ${{ runner.temp }}/pr-verify-prompts/prompt-1.md
          preamble: >-
            You run unattended; return only the verdict the schema asks for;
            your summary and notes are public, so never quote a credential.
          fallback-token: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./pr-verify-data/**)
          disallowed-tools: |
            Read(./.base/**)
            Glob
            Grep
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            mcp__*
          json-schema-file: ${{ runner.temp }}/pr-verify-schema.json
          fallback-ready: ${{ steps.credential.outputs.fallback-ready }}
          leg-timeout-minutes: "15"

      - name: Report the judgment's outcome
        if: steps.judge.outcome == 'success' || steps.judge.outcome == 'failure'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: ${{ steps.judge.outcome }}
          execution-file: ${{ steps.judge.outputs.execution-file }}
          log-file: ${{ steps.judge.outputs.log-file }}
          lane: pr-verify
          lane-id: pr-verify
          step-started-at: ${{ steps.prompt.outputs.started-at }}
          step-timeout-minutes: 22
          credential: ${{ steps.judge.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.judge.outputs.lane-class }}
          # Why this job ran, for its lane record.
          fallback-reason: ${{ steps.credential.outputs.fallback-reason }}

      - name: Upload the sealed transcript
        if: always() && steps.judge.outputs.execution-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          hide-trace-ids: "true"
          execution-file: ${{ steps.judge.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}

      - name: Read chunk 1's verdict
        id: chunk-fail
        if: ${{ !cancelled() && (steps.judge.outcome == 'success' || (steps.judge.outcome == 'failure' && steps.judge.outputs.lane-class == '' && steps.judge.outputs.execution-file != '')) }}
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.judge.outputs.execution-file }}
          JUDGE_OUTCOME: ${{ steps.judge.outcome }}
          LOG_FILE: ${{ steps.judge.outputs.log-file }}
          CHUNK: "1"
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          DIFF_DIR: ${{ github.workspace }}/pr-verify-data/diff
          MANIFEST_DIR: ${{ github.workspace }}/pr-verify-data/manifest
        run: node .base/.github/scripts/pr-verify/write-verdict.mjs chunk-fail

      - name: Time the later chunks
        id: time-chunks
        if: steps.credential.outputs.present == 'true' && fromJSON(steps.diff.outputs.chunks || '0') >= 2 && steps.judge.outcome == 'success' && steps.judge.outputs.handoff != 'true' && steps.chunk-fail.outputs.fail != 'true'
        run: echo "started-at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Judge the later chunks
        id: judge-chunks
        if: steps.credential.outputs.present == 'true' && fromJSON(steps.diff.outputs.chunks || '0') >= 2 && steps.judge.outcome == 'success' && steps.judge.outputs.handoff != 'true' && steps.chunk-fail.outputs.fail != 'true'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.prompt.outputs.loop-minutes || '1') }}
        uses: melodic-software/ci-workflows/.github/actions/run-review-chunks@main
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: pr-verify
          role: pr-verify
          prompt-dir: ${{ runner.temp }}/pr-verify-prompts
          chunk-first: "2"
          chunk-last: ${{ steps.diff.outputs.chunks }}
          parallelism: "8"
          preamble: >-
            You run unattended; return only the verdict the schema asks for;
            your summary and notes are public, so never quote a credential.
          fallback-token: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./pr-verify-data/**)
          disallowed-tools: |
            Read(./.base/**)
            Glob
            Grep
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            mcp__*
          json-schema-file: ${{ runner.temp }}/pr-verify-schema.json
          fallback-ready: ${{ steps.credential.outputs.fallback-ready }}
          leg-timeout-minutes: "15"

      - name: Check the later chunks for a fail
        id: later-fail
        if: steps.judge-chunks.outputs.handoff == 'true'
        env:
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          CHUNKS_DIR: ${{ steps.judge-chunks.outputs.results-dir }}
          CHUNK_OUTCOMES: ${{ steps.judge-chunks.outputs.chunk-outcomes }}
          DIFF_DIR: ${{ github.workspace }}/pr-verify-data/diff
          MANIFEST_DIR: ${{ github.workspace }}/pr-verify-data/manifest
        run: node .base/.github/scripts/pr-verify/write-verdict.mjs later-fail

      - name: Report the later chunks' outcome
        if: steps.judge-chunks.outcome == 'success' || steps.judge-chunks.outcome == 'failure'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: ${{ steps.judge-chunks.outcome }}
          execution-file: ${{ steps.judge-chunks.outputs.execution-file }}
          log-file: ${{ steps.judge-chunks.outputs.log-file }}
          lane: pr-verify
          lane-id: pr-verify
          step-started-at: ${{ steps.time-chunks.outputs.started-at }}
          step-timeout-minutes: ${{ steps.prompt.outputs.loop-minutes }}
          credential: ${{ steps.judge-chunks.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.judge-chunks.outputs.lane-class }}
          fallback-reason: ${{ steps.credential.outputs.fallback-reason }}

      - name: Upload the later chunks' sealed transcript
        if: always() && steps.judge-chunks.outputs.transcript-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          hide-trace-ids: "true"
          execution-file: ${{ steps.judge-chunks.outputs.transcript-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}-chunks

      - name: Write the chunk results
        id: chunk-results
        if: steps.credential.outputs.present == 'true' && fromJSON(steps.diff.outputs.chunks || '0') > 1 && steps.judge.outcome == 'success' && steps.chunk-fail.outputs.fail != 'true' && (steps.judge-chunks.outcome == 'success' || steps.judge-chunks.outcome == 'failure') && (steps.judge-chunks.outputs.handoff != 'true' || steps.later-fail.outputs.fail == 'true')
        env:
          EXECUTION_FILES: |
            ${{ steps.judge.outputs.execution-file }}
          LOG_FILES: |
            ${{ steps.judge.outputs.log-file }}
          JUDGE_OUTCOMES: |
            ${{ steps.judge.outcome }}
          CHUNKS_DIR: ${{ steps.judge-chunks.outputs.results-dir }}
          CHUNK_OUTCOMES: ${{ steps.judge-chunks.outputs.chunk-outcomes }}
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          DIFF_DIR: ${{ github.workspace }}/pr-verify-data/diff
          RESULTS_DIR: ${{ github.workspace }}/pr-verify-data/chunk-results
          PART_BYTES: "15000"
          SPEC_TEXT_FILE: ${{ github.workspace }}/pr-verify-data/spec-text.json
          SPEC_FILE: ${{ github.workspace }}/pr-verify-data/spec.json
          CONTEXT_FILE: ${{ github.workspace }}/pr-verify-data/context.json
          PR_FILE: ${{ github.workspace }}/pr-verify-data/pr.json
          MANIFEST_DIR: ${{ github.workspace }}/pr-verify-data/manifest
          PROMPT_FILE: ${{ runner.temp }}/pr-verify-prompt-spec.md
          PROMPT_TEMPLATE: .base/.github/scripts/pr-verify/spec-prompt.md
          SCHEMA_FILE: ${{ runner.temp }}/pr-verify-spec-schema.json
        run: node .base/.github/scripts/pr-verify/write-verdict.mjs chunk-results

      - name: Time the spec judgment
        id: time-spec
        if: fromJSON(steps.diff.outputs.chunks || '0') > 1 && steps.chunk-results.outcome == 'success' && steps.chunk-results.outputs.fail != 'true'
        run: echo "started-at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Judge the whole spec
        id: judge-spec
        if: fromJSON(steps.diff.outputs.chunks || '0') > 1 && steps.chunk-results.outcome == 'success' && steps.chunk-results.outputs.fail != 'true'
        continue-on-error: true
        timeout-minutes: 22
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@main
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: pr-verify
          role: pr-verify
          prompt-file: ${{ runner.temp }}/pr-verify-prompt-spec.md
          preamble: >-
            You run unattended; return only the verdict the schema asks for;
            your summary and notes are public, so never quote a credential.
          fallback-token: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./pr-verify-data/**)
          disallowed-tools: |
            Read(./.base/**)
            Read(./pr-verify-data/diff/**)
            Glob
            Grep
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            mcp__*
          json-schema-file: ${{ runner.temp }}/pr-verify-spec-schema.json
          fallback-ready: ${{ steps.credential.outputs.fallback-ready }}
          leg-timeout-minutes: "15"

      - name: Report the spec judgment's outcome
        if: steps.judge-spec.outcome == 'success' || steps.judge-spec.outcome == 'failure'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: ${{ steps.judge-spec.outcome }}
          execution-file: ${{ steps.judge-spec.outputs.execution-file }}
          log-file: ${{ steps.judge-spec.outputs.log-file }}
          lane: pr-verify
          lane-id: pr-verify
          step-started-at: ${{ steps.time-spec.outputs.started-at }}
          step-timeout-minutes: 22
          credential: ${{ steps.judge-spec.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.judge-spec.outputs.lane-class }}
          fallback-reason: ${{ steps.credential.outputs.fallback-reason }}

      - name: Upload the spec judgment's sealed transcript
        if: always() && steps.judge-spec.outputs.execution-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          hide-trace-ids: "true"
          execution-file: ${{ steps.judge-spec.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}-spec

      - name: Write the verdict
        id: verdict
        if: ${{ !cancelled() && (steps.chunk-fail.outputs.fail == 'true' || steps.chunk-results.outputs.fail == 'true' || steps.chunk-results.outcome == 'failure' || (steps.judge.outcome == 'success' && (fromJSON(steps.diff.outputs.chunks || '0') < 2 || (steps.judge-chunks.outcome == 'success' && (steps.judge-spec.outcome == 'success' || (steps.judge-spec.outcome == 'failure' && steps.judge-spec.outputs.lane-class == '' && steps.judge-spec.outputs.execution-file != '')))))) }}
        env:
          EXECUTION_FILES: |
            ${{ steps.judge.outputs.execution-file }}
          LOG_FILES: |
            ${{ steps.judge.outputs.log-file }}
          JUDGE_OUTCOMES: |
            ${{ steps.judge.outcome }}
          CHUNKS_DIR: ${{ steps.judge-chunks.outputs.results-dir }}
          CHUNK_OUTCOMES: ${{ steps.judge-chunks.outputs.chunk-outcomes }}
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          DIFF_DIR: ${{ github.workspace }}/pr-verify-data/diff
          FINAL_EXECUTION_FILE: ${{ steps.judge-spec.outputs.execution-file }}
          FINAL_LOG_FILE: ${{ steps.judge-spec.outputs.log-file }}
          FINAL_OUTCOME: ${{ steps.judge-spec.outcome }}
          RESULTS_DIR: ${{ github.workspace }}/pr-verify-data/chunk-results
          MANIFEST_DIR: ${{ github.workspace }}/pr-verify-data/manifest
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          HEAD_REF: ${{ steps.pr.outputs.head-ref }}
          RELINK_SINCE_HEAD: ${{ steps.pr.outputs.relink-since-head }}
          SPEC_FILE: ${{ github.workspace }}/pr-verify-data/spec.json
          SPEC_TEXT_FILE: ${{ github.workspace }}/pr-verify-data/spec-text.json
          CONTEXT_FILE: ${{ github.workspace }}/pr-verify-data/context.json
          VERDICT_DIR: ${{ runner.temp }}/pr-verify-verdict
          # This job uploads a FAIL's index (write-verdict.mjs FAIL_INDEX).
          FAIL_INDEX: "1"
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/pr-verify/write-verdict.mjs

      - name: Upload the FAIL index
        id: fail-index
        if: >-
          ${{ !cancelled() && steps.verdict.outcome == 'success' && steps.verdict.outputs.verdict == 'fail' }}
        uses: ./.base/.github/actions/upload-fail-index # zizmor: ignore[self-repository]
        with:
          names: ${{ steps.verdict.outputs.index-names }}
          path: ${{ runner.temp }}/pr-verify-verdict/fail-index.txt
          retention-days: ${{ steps.verdict.outputs.retention-days }}
          github-token: ${{ github.token }}

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          ${{ !cancelled() && steps.verdict.outcome == 'success' && (steps.verdict.outputs.verdict != 'fail' || steps.fail-index.outcome == 'success') }}
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/pr-verify-verdict/verdict.json

      - name: Upload the verdict
        id: upload-verdict
        if: >-
          (!cancelled() && steps.verdict.outcome == 'success' && (steps.verdict.outputs.verdict != 'fail' || steps.fail-index.outcome == 'success')) && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.verdict.outputs.name }}
          path: ${{ runner.temp }}/pr-verify-verdict/verdict.json
          retention-days: ${{ steps.verdict.outputs.retention-days }}
          if-no-files-found: error

      - name: Summarize the verdict
        if: ${{ !cancelled() && steps.verdict.outcome == 'success' }}
        env:
          VERDICT_FILE: ${{ runner.temp }}/pr-verify-verdict/verdict.json
        run: |
          {
            echo "### Verifier verdict"
            echo
            echo '```json'
            jq '.summary |= gsub("`"; "'"'"'") | .notes |= map(gsub("`"; "'"'"'"))' "$VERDICT_FILE"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the lane hold marker
        if: steps.note-hold.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lane-hold-pr-verify
          path: ${{ runner.temp }}/lane-hold/pr-verify
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Log the API budget
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

      - name: Fail without a verdict
        if: always() && steps.agree.outcome == 'success' && steps.verdict.outcome != 'success'
        run: |
          echo "::error::the judgment left no verdict for this head"
          exit 1

  # Wakes pr-merge for this one pull request once a verdict job uploaded a
  # pass or pass-notes, so a lanes App pull request is armed now rather than
  # at pr-merge's next scheduled run (every 30 minutes, the backstop). The
  # dispatch starts a PR-scoped run of main's pr-merge.yml (inputs.pr), which
  # arms only that pull request and only if every rule allows, its author's
  # included; the wake step reads the pull request only to spare pr-merge a
  # run it would not arm on. A GITHUB_TOKEN's workflow_dispatch creates a
  # run, as github-actions[bot], which pr-merge's who step admits for this
  # case alone (who.mjs verdictWake). The job runs no model and passes the
  # verdict jobs' outputs through env, checked in bash. A failed dispatch
  # only warns: the run's verdict stands, and the schedule arms it. A failed
  # job (timeout, lost runner) leaves the run's conclusion to the verdict jobs,
  # since pr-merge counts a pass only from a run that ended success.
  wake-pr-merge:
    name: Wake PR Merge
    needs: [check-intent, check-intent-subscription, check-intent-fallback]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && (needs.check-intent.outputs.verdict == 'pass'
      || needs.check-intent.outputs.verdict == 'pass-notes'
      || needs.check-intent-subscription.outputs.verdict == 'pass'
      || needs.check-intent-subscription.outputs.verdict == 'pass-notes'
      || needs.check-intent-fallback.outputs.verdict == 'pass'
      || needs.check-intent-fallback.outputs.verdict == 'pass-notes')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write # start pr-merge.yml on main for this pull request
      pull-requests: read # read the pull request's author: only a lanes App one is woken
      contents: read # check out the api-budget library
    # Each gh call's rate-limit reading, for the job-end api-calls notice
    # (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main
      - name: Check out the api-budget library
        if: steps.tip.outputs.sha != ''
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/log-api-budget/
          sparse-checkout-cone-mode: false

      - name: Wake pr-merge for this pull request
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          LANES_APP_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          KEY_PR: ${{ needs.check-intent.outputs.pr-number }}
          KEY_VERDICT: ${{ needs.check-intent.outputs.verdict }}
          SUB_PR: ${{ needs.check-intent-subscription.outputs.pr-number }}
          SUB_VERDICT: ${{ needs.check-intent-subscription.outputs.verdict }}
          FB_PR: ${{ needs.check-intent-fallback.outputs.pr-number }}
          FB_VERDICT: ${{ needs.check-intent-fallback.outputs.verdict }}
        run: |
          set -euo pipefail
          { . .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null && api_budget_wrap_gh github-token; } || true
          pr=''
          # One job per run judges; the first pass in job order names the PR.
          for leg in KEY SUB FB; do
            verdict_var=${leg}_VERDICT pr_var=${leg}_PR
            if [[ ${!verdict_var:-} =~ ^(pass|pass-notes)$ ]]; then
              pr=${!pr_var:-} verdict=${!verdict_var}
              break
            fi
          done
          if [[ ! $pr =~ ^[1-9][0-9]{0,15}$ ]]; then
            echo "::warning::wake-pr-merge: the passing job named no pull request number; nothing woken"
            exit 0
          fi
          # pr-merge arms only lanes App pull requests, and the token broker
          # mints for this wake only on one, so one read here spares every
          # other pass a whole pr-merge run. One already armed or held by
          # do-not-merge needs no wake: the scheduled sweep runs the same
          # decision on it, disarms included, and ci-status holds do-not-merge
          # in the merge queue. A failed read, or no lanes App id, dispatches
          # anyway: pr-merge decides all of this itself.
          if [[ ${LANES_APP_ID:-} =~ ^[1-9][0-9]*$ ]] &&
            answer=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" \
              --jq '"\(.user.id) \(.user.type) \(.auto_merge != null) \([.labels[].name] | index("do-not-merge") != null)"') &&
            read -r id type armed held <<<"$answer"; then
            if [ "$id $type" != "$LANES_APP_ID Bot" ]; then
              echo "::notice title=pr-verify wake::pr=$pr verdict=$verdict not a lanes App pull request; nothing woken"
              exit 0
            fi
            if [ "$armed" = true ]; then
              echo "::notice title=pr-verify wake::pr=$pr verdict=$verdict already armed; nothing woken"
              exit 0
            fi
            if [ "$held" = true ]; then
              echo "::notice title=pr-verify wake::pr=$pr verdict=$verdict held (do-not-merge); nothing woken"
              exit 0
            fi
          fi
          if gh workflow run pr-merge.yml -R "$GITHUB_REPOSITORY" --ref main -f pr="$pr"; then
            echo "::notice title=pr-verify wake::pr=$pr verdict=$verdict pr-merge dispatched"
          else
            echo "::warning::wake-pr-merge: the pr-merge dispatch for #$pr failed; its next scheduled run arms it"
          fi

      - name: Log the API budget
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token
