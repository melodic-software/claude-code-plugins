        with:
          path: ${{ runner.temp }}/pr-verify-verdict/verdict.json

      - name: Upload the verdict
        if: >-
          (!cancelled() && steps.verdict.outcome == 'success') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.verdict.outputs.name }}
          path: ${{ runner.temp }}/pr-verify-verdict/verdict.json
          retention-days: ${{ steps.verdict.outputs.retention-days }}
          if-no-files-found: error

      - name: Summarize the verdict
        if: ${{ !cancelled() && steps.verdict.outcome == 'success' }}
        env:
          VERDICT_FILE: ${{ runner.temp }}/pr-verify-verdict/verdict.json
        run: |
          {
            echo "### Verifier verdict"
            echo
            echo '```json'
            jq '.summary |= gsub("`"; "'"'"'") | .notes |= map(gsub("`"; "'"'"'"))' "$VERDICT_FILE"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Log the API budget
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

      # A clean handoff or an empty key hands the judgment on; any other
      # run that passed the gates and left no verdict fails here.
      - name: Fail without a verdict
        if: always() && steps.agree.outcome == 'success' && steps.verdict.outcome != 'success' && steps.credential.outputs.present != 'false' && steps.key-leg.outcome != 'success' && steps.key-leg-2.outcome != 'success' && steps.key-leg-3.outcome != 'success' && steps.key-leg-4.outcome != 'success' && steps.key-leg-5.outcome != 'success' && steps.key-leg-6.outcome != 'success' && steps.key-leg-7.outcome != 'success' && steps.key-leg-8.outcome != 'success' && steps.key-leg-9.outcome != 'success' && steps.key-leg-10.outcome != 'success' && steps.key-leg-11.outcome != 'success' && steps.key-leg-12.outcome != 'success' && steps.key-leg-spec.outcome != 'success'
        run: |
          echo "::error::the judgment left no verdict for this head"
          exit 1

  # The subscription leg, as its own job on a new VM: check-intent's
  # processes and environment do not reach it, and of its files only the
  # pre-judge reads do, through the `reads` output. Its steps repeat
  # check-intent's from a fresh checkout but for the credential, the
  # key-leg check and the reads it takes from check-intent's `reads` output
  # (workflow.test.mjs holds them equal), so the trigger gate, the kill
  # switch and the hardening run again. Only this job references the
  # subscription token. needs adds success(): a check-intent that failed, a
  # denial on its key leg included, leaves this job skipped.
  check-intent-subscription:
    needs: check-intent
    if: >-
      github.ref == 'refs/heads/main'
      && github.event.workflow_run.event == 'pull_request'
      && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
      && github.event.workflow_run.head_repository.full_name == github.repository
      && ((needs.check-intent.outputs.handoff == 'true'
      && needs.check-intent.outputs.key-leg-clean == 'true')
      || needs.check-intent.outputs.credential-present == 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 301
    cache-mode: read
    permissions:
      contents: read # check out main; read the PR's commits for the diff
      pull-requests: read # the PR, its comments and reviews
      actions: read # the upstream run, and verdicts already uploaded
    outputs:
      handoff: ${{ steps.judge.outputs.handoff == 'true' || steps.judge-2.outputs.handoff == 'true' || steps.judge-3.outputs.handoff == 'true' || steps.judge-4.outputs.handoff == 'true' || steps.judge-5.outputs.handoff == 'true' || steps.judge-6.outputs.handoff == 'true' || steps.judge-7.outputs.handoff == 'true' || steps.judge-8.outputs.handoff == 'true' || steps.judge-9.outputs.handoff == 'true' || steps.judge-10.outputs.handoff == 'true' || steps.judge-11.outputs.handoff == 'true' || steps.judge-12.outputs.handoff == 'true' || steps.judge-spec.outputs.handoff == 'true' }}
      handoff-reason: ${{ steps.judge.outputs.handoff-reason || steps.judge-2.outputs.handoff-reason || steps.judge-3.outputs.handoff-reason || steps.judge-4.outputs.handoff-reason || steps.judge-5.outputs.handoff-reason || steps.judge-6.outputs.handoff-reason || steps.judge-7.outputs.handoff-reason || steps.judge-8.outputs.handoff-reason || steps.judge-9.outputs.handoff-reason || steps.judge-10.outputs.handoff-reason || steps.judge-11.outputs.handoff-reason || steps.judge-12.outputs.handoff-reason || steps.judge-spec.outputs.handoff-reason }}
      leg-clean: ${{ steps.sub-leg.outputs.clean || steps.sub-leg-2.outputs.clean || steps.sub-leg-3.outputs.clean || steps.sub-leg-4.outputs.clean || steps.sub-leg-5.outputs.clean || steps.sub-leg-6.outputs.clean || steps.sub-leg-7.outputs.clean || steps.sub-leg-8.outputs.clean || steps.sub-leg-9.outputs.clean || steps.sub-leg-10.outputs.clean || steps.sub-leg-11.outputs.clean || steps.sub-leg-12.outputs.clean || steps.sub-leg-spec.outputs.clean }}
    steps:
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # The run fails, so the lost-run reconciler re-runs it once the switch
      # is off and the head is judged then.
      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
        run: |
          echo "::error::the lanes kill switch stops this run (reason: ${REASON:-unreadable}); no verdict until the lost-run reconciler re-runs it"
          exit 1

      # The resolver reads only, and skips on its own reads every run it
      # would not judge (a head already judged or moved past, a draft, a run
      # red for anything an approval does not lift, an author it does not
      # judge), so it runs first and the gate's reads go only to a run it
      # would judge. Nothing it writes reaches the model before the gate and
      # the agree step pass.
      - name: Resolve the pull request
        id: pr
        if: steps.kill.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          SPEC_FILE: ${{ github.workspace }}/pr-verify-data/spec.json
          SPEC_TEXT_FILE: ${{ github.workspace }}/pr-verify-data/spec-text.json
          TRUSTED_ACTORS_PATH: .base/.github/standards/trusted-actors/trusted-actors.json
          CONTEXT_FILE: ${{ github.workspace }}/pr-verify-data/context.json
          # check-intent's reads, taken only when they hold (resolve-pr.mjs takeReads).
          CARRIED: ${{ needs.check-intent.outputs.reads }}
        run: |
          mkdir -p "$(dirname "$SPEC_FILE")"
          VERIFY_AUTHORS=$(yq '.merge."verify-authors" // "lane"' .base/docs/conventions/pr-pipeline.yaml)
          LANE_IDENTITY=$(yq '.merge."agent-identity" // ""' .base/docs/conventions/pr-pipeline.yaml)
          SPEC_FROM_BODY_APPS=$(yq '.adoption."spec-from-body-apps" // [] | .[]' .base/docs/conventions/pr-pipeline.yaml)
          # The issue lane's web hosts as admission reads them (resolve-config issueLaneWebHostsFromBase).
          ISSUE_LANE_WEB_HOSTS=$(yq -o=json -I=0 '(.activities."resolve-issue"."web-access" | select(.enabled == true) | .domains) // []' .base/docs/conventions/pr-pipeline.yaml)
          export VERIFY_AUTHORS LANE_IDENTITY SPEC_FROM_BODY_APPS ISSUE_LANE_WEB_HOSTS
          node .base/.github/scripts/pr-verify/resolve-pr.mjs

      # The upstream run's actors, the re-runner and the PR author must all be
      # on the trusted-actor list. A re-run github-actions[bot] started passes
      # only as the lost-run reconciler's recorded re-run of this run.
      - name: Check the trigger
        id: gate
        if: steps.pr.outputs.proceed == 'true'
        # Each API call keeps its rate-limit reading for the api-budget
        # notice the job logs before its last step.
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/check-trusted-trigger # zizmor: ignore[self-repository]
        with:
          trusted-actors-path: .base/.github/standards/trusted-actors/trusted-actors.json
          triggering-actor: ${{ github.triggering_actor }}
          reconciler-workflow: .github/workflows/maintenance-reconcile-lost-runs.yml
          ci-status-rerun-workflow: .github/workflows/pr-feedback-dispatch.yml

      # The gate and the resolver read the PR separately; both must name the
      # same PR at the run's head, or nothing is judged.
      - name: Assert the gate and the resolver agree
        id: agree
        if: steps.gate.outputs.proceed == 'true'
        env:
          GATE_PR: ${{ steps.gate.outputs.pr-number }}
          GATE_HEAD: ${{ steps.gate.outputs.head-sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
        run: |
          if [ "$GATE_PR" != "$PR_NUMBER" ] || [ "$GATE_HEAD" != "$HEAD_SHA" ]; then
            echo "::error::the trigger gate and the resolver name different pull requests or heads"
            exit 1
          fi

      # Carried from check-intent when the resolver took its reads.
      - name: Select the trusted PR text
        if: steps.agree.outcome == 'success' && steps.pr.outputs.carried != 'true'
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/select-trusted-text # zizmor: ignore[self-repository]
        with:
          pr-number: ${{ steps.pr.outputs.pr-number }}
          trusted-actors-path: .base/.github/standards/trusted-actors/trusted-actors.json
          output-path: ${{ github.workspace }}/pr-verify-data/context.json
          github-token: ${{ github.token }}

      # A blobless fetch of the two commits into its own repository outside
      # the workspace. git diff reads no attributes or diff drivers from it,
      # so nothing in the PR runs; the patch is a data file. chunk-diff.sh cuts
      # it into chunks of whole files, and each chunk into parts one Read
      # returns whole, in as many chunks as the diff takes, up to the ceiling
      # chunk-diff.sh sets, with a judge step below for each. A file over one
      # chunk, or a diff over the ceiling, fails the step by name: no verdict,
      # so no fail on size alone.
      - name: Write the diff
        id: diff
        if: steps.agree.outcome == 'success'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
          DATA: ${{ github.workspace }}/pr-verify-data
          SRC: ${{ runner.temp }}/pr-verify-src
          # The head's tree, for upstream-jobs.mjs: trees come with a blobless fetch.
          HEAD_PATHS_FILE: ${{ runner.temp }}/pr-verify-head-paths
          # About 75k tokens of patch, the budget pr-review-main.yml sets: room
          # in the review profile's turns to read one chunk whole (judgment).
          MAX_DIFF_BYTES: "300000"
          # One Read returns at most 25,000 tokens
          # (https://code.claude.com/docs/en/tools-reference#large-files), and
          # a token is at least a byte, so a part this size comes back whole.
          PART_BYTES: "15000"
          PART_LINES: "1000"
          # Read may cut a long line short, so a longer one continues on
          # marked lines (chunk-diff.sh), at pr-review-main.yml's length.
          LONG_LINE_BYTES: "1800"
        run: |
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          mkdir -p "$DATA"
          git init -q "$SRC"
          git -C "$SRC" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$SRC" fetch -q --no-tags --filter=blob:none origin "$BASE_SHA" "$HEAD_SHA"
          git -C "$SRC" diff --no-ext-diff --no-textconv --no-color "$BASE_SHA...$HEAD_SHA" >"$DATA/diff.patch"
          git -C "$SRC" ls-tree -r -z --name-only "$HEAD_SHA" >"$HEAD_PATHS_FILE"
          jq -n --argjson pr "$PR_NUMBER" --arg head "$HEAD_SHA" --arg base "$BASE_SHA" \
            '{pr: $pr, head_sha: $head, base_sha: $base}' >"$DATA/pr.json"
          echo "diff: $(wc -l <"$DATA/diff.patch") lines"
          bash .base/.github/scripts/pr-verify/chunk-diff.sh

      # The jobs of the run this one was started by, each with its name and
      # conclusion, so the model can judge whether the suites that cover the
      # change ran (prompt.md), and the Node suites at the head that test-bash
      # runs through a sibling .test.sh. The token reads only.
      - name: List the upstream run's jobs
        if: steps.agree.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          JOBS_FILE: ${{ github.workspace }}/pr-verify-data/upstream-jobs.json
          HEAD_PATHS_FILE: ${{ runner.temp }}/pr-verify-head-paths
        run: node .base/.github/scripts/pr-verify/upstream-jobs.mjs

      # The judgment's model, turns and effort: the verify-pr route of the
      # base config's models block.
      - name: Resolve the verifier's model
        id: models
        if: steps.agree.outcome == 'success'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: verify-pr
          output-path: ${{ runner.temp }}/pr-verify-models.json

      # Only whether the secrets are set leaves this step, never a value.
      - name: Check the credential
        id: credential
        if: steps.agree.outcome == 'success'
        env:
          PRESENT: ${{ secrets.PR_VERIFY_CLAUDE_CODE_OAUTH_TOKEN != '' }}
          SECRET_NAME: PR_VERIFY_CLAUDE_CODE_OAUTH_TOKEN
          # Whether the fallback leg can run, never the token.
          FALLBACK_PRESENT: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$PRESENT" = true ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::$SECRET_NAME is empty; this job does not judge."
            echo "present=false" >>"$GITHUB_OUTPUT"
          fi
          if [ "$FALLBACK_PRESENT" = true ]; then
            echo "fallback-ready=true" >>"$GITHUB_OUTPUT"
          else
            echo "fallback-ready=false" >>"$GITHUB_OUTPUT"
          fi

      # run-claude-cli refuses to run without these root-owned settings, which
      # need sudo, so they are written before the runner is isolated.
      - name: Apply the Claude managed settings
        if: steps.agree.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@2476d5dde8979eab34374150b7e4b0a2b99f4e88 # 2476d5d 2026-10-29

      - name: Isolate the runner
        if: steps.agree.outcome == 'success'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: true

      # Files, not step outputs: run-claude-cli reads both. A `default` model
      # resolves to an empty model, which the launcher cannot pass. started-at
      # lets the outcome step tell a step timeout from other failures.
      - name: Write the prompt and schema
        id: prompt
        if: steps.agree.outcome == 'success'
        env:
          DATA: ${{ github.workspace }}/pr-verify-data
          MODEL: ${{ steps.models.outputs.model }}
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          PROMPT_STEM: ${{ runner.temp }}/pr-verify-prompt
          SCHEMA_FILE: ${{ runner.temp }}/pr-verify-schema.json
        run: |
          if [ -z "$MODEL" ]; then
            echo "::error::the verify-pr profile's model is default, which run-claude-cli cannot pass; name an alias"
            exit 1
          fi
          if ! [[ $CHUNKS =~ ^[1-9][0-9]?$ ]]; then
            echo "::error::the chunk count is malformed"
            exit 1
          fi
          template=$(<.base/.github/scripts/pr-verify/prompt.md)
          for k in $(seq "$CHUNKS"); do
            prompt=$template
            # shellcheck disable=SC2016 # the backticks are Markdown, not a command
            parts=$(printf '  - `%s`\n' "$DATA/diff/chunk-$k"/part-*.patch)
            prompt=${prompt//DIFF_PARTS/$parts}
            prompt=${prompt//CONTEXT_FILE/$DATA/context.json}
            prompt=${prompt//PR_FILE/$DATA/pr.json}
            prompt=${prompt//SPEC_TEXT_FILE/$DATA/spec-text.json}
            prompt=${prompt//SPEC_FILE/$DATA/spec.json}
            prompt=${prompt//JOBS_FILE/$DATA/upstream-jobs.json}
            note=
            if [ "$CHUNKS" -gt 1 ]; then
              note=$(<.base/.github/scripts/pr-verify/chunk-note.md)
              # shellcheck disable=SC2016 # the backticks are Markdown, not a command
              manifest=$(printf '  - `%s`\n' "$DATA"/manifest/part-*.txt)
              note=${note//MANIFEST_PARTS/$manifest}
              note=${note//DATA_DIR/$DATA}
              note=${note//CHUNK_INDEX/$k}
              note=${note//CHUNK_COUNT/$CHUNKS}
              note=$'\n'$note
            fi
            prompt=${prompt//CHUNK_NOTE/"$note"}
            printf '%s\n' "$prompt" >"$PROMPT_STEM-$k.md"
          done
          printf '%s\n' '{"type":"object","properties":{"verdict":{"enum":["pass","pass-notes","fail"]},"summary":{"type":"string"},"notes":{"type":"array","items":{"type":"string"}}},"required":["verdict","summary","notes"],"additionalProperties":false}' >"$SCHEMA_FILE"
          echo "started-at=$(date +%s)" >>"$GITHUB_OUTPUT"

      # continue-on-error keeps a launcher failure, which run-claude-cli
      # reports by failing this step, from ending the job before the outcome
      # step; "Fail without a verdict" carries the red. With the fallback
      # token set, a limit stop, a credit stop or a 401 or 402 hands off,
      # which skips the verdict steps, and a clean one the outcome step too:
      # the fallback job judges and records the run instead. One leg of
      # leg-timeout-minutes and the CLI install fit in timeout-minutes, which
      # the outcome step repeats, and the job's timeout holds one of those for
      # every judge step. The model may share its job with the upload: it has
      # Read alone and the job token can only read.
      # Under dontAsk only the allow rule's directory is readable; the deny
      # rules hold if the tools or the working directory change.
      - name: Judge the pull request
        id: judge
        if: steps.credential.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 22
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@2476d5dde8979eab34374150b7e4b0a2b99f4e88 # 2476d5d 2026-10-29
        env:
          # No work may outlive the result message the launcher reads.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: pr-verify
          role: pr-verify
          prompt-file: ${{ runner.temp }}/pr-verify-prompt-1.md
          preamble: >-
            You run unattended; return only the verdict the schema asks for;
            your summary and notes are public, so never quote a credential.
          subscription-token: ${{ secrets.PR_VERIFY_CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: Read
          allowed-tools: Read(./pr-verify-data/**)
          disallowed-tools: |
            Read(./.base/**)
            Glob
            Grep
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            mcp__*
          json-schema-file: ${{ runner.temp }}/pr-verify-schema.json
          fallback-ready: ${{ steps.credential.outputs.fallback-ready }}
          leg-timeout-minutes: "15"

      # After a handoff, the denial check: a denial on the subscription leg
      # means no verdict, so the fallback job runs only on this step's
      # clean=true; continue-on-error lets the report record the stop, and
      # "Fail without a verdict" carries the red. run-claude-cli warns of a
      # refused token itself.
      - name: Check the subscription leg
        id: sub-leg
        if: steps.judge.outputs.handoff == 'true'
        continue-on-error: true
        env:
          LOG_FILES: |
            ${{ steps.judge.outputs.log-file }}
          HANDOFF_REASON: ${{ steps.judge.outputs.handoff-reason }}
        run: |
          node .base/.github/scripts/pr-verify/write-verdict.mjs check-key-leg
          echo "::notice::the subscription leg handed off (${HANDOFF_REASON}); check-intent-fallback judges on the fallback token"

      # One lane record per run: a clean handoff is recorded by the fallback
      # job; a handoff the check above refused, on a denial or a log it
      # cannot read, here.
      - name: Report the judgment's outcome
        if: (steps.judge.outcome == 'success' || steps.judge.outcome == 'failure') && (steps.judge.outputs.handoff != 'true' || steps.sub-leg.outcome == 'failure')
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@2476d5dde8979eab34374150b7e4b0a2b99f4e88 # 2476d5d 2026-10-29
        with:
          outcome: ${{ steps.judge.outcome }}
          execution-file: ${{ steps.judge.outputs.execution-file }}
          log-file: ${{ steps.judge.outputs.log-file }}
          lane: pr-verify
          lane-id: pr-verify
          step-started-at: ${{ steps.prompt.outputs.started-at }}
          step-timeout-minutes: 22
          credential: ${{ steps.judge.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.judge.outputs.lane-class }}
          # Why this job ran, for the run's one lane record.
          fallback-reason: ${{ needs.check-intent.outputs.lane-class == 'credit-stop' && 'credit-stop' || needs.check-intent.outputs.lane-class == 'auth' && 'auth' || needs.check-intent.outputs.credential-present == 'false' && 'no-key' || '' }}

      # The leg's transcript, failed legs included, sealed to the transcript
      # key and kept 7 days for the puller; a failed upload never fails the job.
      - name: Upload the sealed transcript
        if: always() && steps.judge.outputs.execution-file != ''
        continue-on-error: true
        uses: ./.base/.github/actions/upload-lane-transcript # zizmor: ignore[self-repository]
        with:
          execution-file: ${{ steps.judge.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}

      # A fail the head can count ends the judgment here (write-verdict.mjs
      # checkChunk): the later chunks, the final judge and any handoff are
      # skipped, and "Write the verdict" runs on it, so no later step can lose
      # it to a re-run. A step that fails before it does not stop the check,
      # and a judge step run-claude-cli failed with no lane class, having left
      # an execution file, stopped on its credential scan, so it counts as a fail
      # with none of its text.
      - name: Read chunk 1's verdict
        id: chunk-fail
        if: ${{ !cancelled() && (steps.judge.outcome == 'success' || (steps.judge.outcome == 'failure' && steps.judge.outputs.lane-class == '' && steps.judge.outputs.execution-file != '')) }}
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.judge.outputs.execution-file }}
          JUDGE_OUTCOME: ${{ steps.judge.outcome }}
          LOG_FILE: ${{ steps.judge.outputs.log-file }}
          CHUNK: "1"
          CHUNKS: ${{ steps.diff.outputs.chunks }}
          DIFF_DIR: ${{ github.workspace }}/pr-verify-data/diff
          MANIFEST_DIR: ${{ github.workspace }}/pr-verify-data/manifest
        run: node .base/.github/scripts/pr-verify/write-verdict.mjs chunk-fail

      # Chunk 2 on, each the first chunk's steps on its own prompt: chunk k runs
      # only when the diff has k chunks and chunk k-1 judged and handed nothing
      # on, so a handoff hands the whole judgment on and the next leg judges
      # every chunk again. The leg check reads every chunk's log so far.
      - name: Time chunk 2
        id: time-2
        if: steps.credential.outputs.present == 'true' && fromJSON(steps.diff.outputs.chunks || '0') >= 2 && steps.judge.outcome == 'success' && steps.judge.outputs.handoff != 'true' && steps.chunk-fail.outputs.fail != 'true'
        run: echo "started-at=$(date +%s)" >>"$GITHUB_OUTPUT"

