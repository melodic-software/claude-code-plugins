name: Release Generate Dependabot Changelog Fragments

# Changelog fragments for merged Dependabot updates (ADR 0048). A Dependabot pull
# request gets no commit for a plugin in fragment mode: a commit made with
# GITHUB_TOKEN holds every run on it at action_required (#5786), and
# check-changelog-fragments.sh --check-required exempts a pull request of
# verified Dependabot commits. scripts/dependabot-fragments.sh finds each merged
# Dependabot update of a fragment-mode plugin that has no fragment yet, and this
# workflow lands those fragments through one pull request, release/dependabot-
# fragments, armed to auto-merge. The release pull request then takes them.
#
# It runs as the release GitHub App, never GITHUB_TOKEN: a pull request that
# GITHUB_TOKEN opens or updates gets its `pull_request` runs only after
# approval, and this one needs `ci-status` unattended. The commit goes through createCommitOnBranch, which GitHub signs,
# so main's required_signatures rule accepts it (the pattern of
# release-publish-plugins.yml). A fragment is named after its merge commit, so
# a rerun writes nothing twice.
#
# It starts on a push to main that changes a manifest Dependabot bumps under
# plugins/ (scripts/dependabot-fragments.test.sh checks the paths against
# .github/dependabot.yml), and the job runs only when the push carries a
# Dependabot commit, so most merges start no run. The schedule every six hours
# is the safety net for what the filter cannot see: a manifest or directory it does
# not list, or a push run GitHub lost. A fragment that late still rides a
# release, which runs every three hours and on a push under .changes/**.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/**/package.json'
      - 'plugins/**/package-lock.json'
      - 'plugins/**/requirements*.txt'
      - 'plugins/**/requirements*.in'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-fragments
  cancel-in-progress: false

jobs:
  generate-changelog-fragments:
    name: Generate Changelog Fragments
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name != 'push'
      || contains(github.event.commits.*.author.email, '49699333+dependabot[bot]@users.noreply.github.com'))
    # The App's private key is an environment secret; the environment admits
    # only main (github-iac RepositoryEnvironments.cs).
    environment:
      name: plugin-release
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Resolve main's tip
        id: tip
        # Inline, not the ci-workflows action, while this job holds the release App key: https://github.com/melodic-software/claude-code-plugins/issues/18056#issuecomment-7082231555
        env:
          TIP_BRANCH: main
          TIP_TOKEN: ${{ github.token }}
        run: |
          header="$(printf 'x-access-token:%s' "$TIP_TOKEN" | base64 | tr -d '\n')"
          unset TIP_TOKEN
          echo "::add-mask::$header"
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $header"
          unset header
          export TIP_HEAD="refs/heads/$TIP_BRANCH"
          err="$RUNNER_TEMP/resolve-tip.err"
          i=0
          while :; do
            status=0
            listing="$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "$TIP_HEAD" 2>"$err")" || status=$?
            sed 's/^/git: /' "$err" >&2
            if ((status == 0)); then
              # ls-remote matches a pattern as a ref's tail, so only an exact name counts.
              sha="$(awk '$2 == ENVIRON["TIP_HEAD"] { print $1 }' <<<"$listing")"
              [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$GITHUB_REPOSITORY has no branch $TIP_BRANCH"; exit 1; }
              echo "sha=$sha" >>"$GITHUB_OUTPUT"
              exit 0
            elif ((status == 124)); then
              why="timed out after 60 s"
            elif grep -qE 'returned error: 40[13]|HTTP 40[13]|Authentication failed for|could not read Username' "$err"; then
              echo "::error::GitHub refused the token (HTTP 401/403): the job's token needs contents: read"
              exit 1
            elif grep -qE 'returned error: 5[0-9]{2}|HTTP 5[0-9]{2}' "$err"; then
              why="got a server error"
            else
              echo "::error::git ls-remote failed with exit $status"
              exit 1
            fi
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve: try 3 $why"; exit 1; }
            echo "::warning::try $i $why; retrying"
            sleep "$((RANDOM % (2 * i + 1)))"
          done
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Find merged Dependabot updates with no fragment
        id: find
        run: |
          list="$RUNNER_TEMP/fragments.txt"
          scripts/dependabot-fragments.sh HEAD | tee "$list"
          echo "count=$(grep -c . "$list" || true)" >>"$GITHUB_OUTPUT"
      - name: Mint the release App token
        id: app-token
        if: steps.find.outputs.count != '0'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PLUGIN_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLUGIN_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Write the fragments and open the pull request
        if: steps.find.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MAIN_SHA: ${{ steps.tip.outputs.sha }}
        run: |
          branch=release/dependabot-fragments
          title="chore(release): changelog fragments for merged Dependabot updates"
          refs="repos/$GITHUB_REPOSITORY/git/refs"
          want="$(LC_ALL=C sort "$RUNNER_TEMP/fragments.txt")"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')"
          if [ -n "$number" ] && [ "$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$number/files" --jq '.[].filename' | LC_ALL=C sort)" = "$want" ]; then
            echo "Pull request #$number already holds these fragments; leaving it alone."
            exit 0
          fi
          adds="$RUNNER_TEMP/additions.jsonl"
          : >"$adds"
          while IFS= read -r path; do
            base64 -w0 "$path" | jq -Rsc --arg path "$path" '{path: $path, contents: .}' >>"$adds"
          done <<<"$want"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --silent 2>/dev/null; then
            gh api -X PATCH "$refs/heads/$branch" -f sha="$MAIN_SHA" -F force=true --silent
          else
            gh api -X POST "$refs" -f ref="refs/heads/$branch" -f sha="$MAIN_SHA" --silent
          fi
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg oid "$MAIN_SHA" \
            --arg branch "$branch" \
            --arg headline "$title" \
            --slurpfile additions "$adds" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: $headline},
                fileChanges: {additions: $additions}
              }}
            }' | gh api graphql --input - | jq -er '.data.createCommitOnBranch.commit.oid'
          body="$RUNNER_TEMP/body.md"
          {
            echo "Adds the changelog fragment for each merged Dependabot update of a plugin in fragment mode ([ADR 0048](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/adr/0048-release-plugins-from-changelog-fragments-through-a-bot-maintained-release-pr.md)). Dependabot pull requests carry no fragment, so their runs need no approval (#5786); \`scripts/dependabot-fragments.sh\` writes it after the merge, and the release pull request releases it."
            echo
            while IFS= read -r path; do echo "- \`$path\`"; done <<<"$want"
            echo
            echo "No linked issue: written by \`.github/workflows/release-generate-dependabot-changelog-fragments.yml\`."
          } >"$body"
          if [ -z "$number" ]; then
            number="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "$title" --body-file "$body" | grep -o '[0-9]*$')"
          else
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash
      # The steps above call GitHub on the release App's token, not this one,
      # so the line reads 0 unless a step starts spending the job token.
      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token
