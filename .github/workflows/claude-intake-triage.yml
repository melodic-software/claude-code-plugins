name: claude-intake-triage

# Triages each newly opened issue with the org intake-triage lane: a read-only
# Claude run proposes labels and a comment, and a step with no model applies
# only allowlisted labels that exist here, or `needs-human` when the run
# escalates. Advisory: never blocks a merge. See ci-workflows'
# claude-intake-triage.yml for the security model and inputs.
on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  intake-triage:
    permissions:
      contents: read # check out the default branch so the lane can read AGENTS.md
      issues: write  # apply labels and post the triage comment
    uses: melodic-software/ci-workflows/.github/workflows/claude-intake-triage.yml@632130a974770e50825c8747e87b0e18ecb2b36e # v0.33.0
    with:
      runner: ubuntu-24.04
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
