name: pr-refine

# Lane caller for pr-refine: its file stem is the lane, so the lanes token
# broker accepts its write activities. No App key; each run job's OIDC token is
# exchanged at LANES_BROKER_URL for audience LANES_BROKER_AUDIENCE.
# Job contract: docs/conventions/pr-pipeline/pr-run-activity.md.
#
# workflow_dispatch only. fix-docs: pr-unblock-dispatch.yml sends one per
# ready PR that changes a Markdown file and never had a fix-docs run, whoever
# opened it except Dependabot, the release App and the standards-sync App
# (fix-docs-dispatch.mjs). It sets dispatcher-run-id; a trusted human may
# dispatch with pr-number and activity alone. Every job trusts the default
# branch tip, as the dispatcher runs from the tip.
#
# Each activity is a model job and its push job (slots[].needs in
# docs/conventions/pr-pipeline.yaml); pairs on one PR serialize on the per-PR
# write queue.

# fix-docs-dispatch.mjs reads this title to skip a second dispatch while one
# for the same activity and PR is still queued or going. Quoted: unquoted,
# " #" would start a YAML comment and drop the PR number.
run-name: "pr-refine ${{ inputs.activity }} #${{ inputs.pr-number }}"

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: The PR to refine.
        required: true
        type: string
      activity:
        description: What to refine.
        required: false
        type: choice
        options: [fix-docs]
        default: fix-docs
      dispatcher-run-id:
        description: The dispatcher run that sent this dispatch; empty for a human dispatch.
        required: false
        type: string
        default: ""

permissions: {}

# A newer dispatch of the same activity for the same PR replaces one still
# waiting; a running one finishes.
concurrency:
  group: pr-refine-${{ inputs.activity }}-${{ inputs.pr-number }}
  cancel-in-progress: false

jobs:
  # The PR head fix-docs's report posts its check on, read by a job that runs
  # no head code, as fix-ci-context's is for fix-ci. Without it the report
  # trusts only the head read at report time, so a push mid-run posts failure
  # on the new head.
  fix-docs-head:
    if: >-
      inputs.pr-number != '' && inputs.activity == 'fix-docs'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      head-sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Read the PR's head SHA
        id: head
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $PR_NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr-number is not a PR number"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no PR head SHA read"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  # fix-docs is four jobs, so no model ever holds a write token. The model
  # job: a read activity with no write token and no OIDC token in the job that
  # runs head code. The skill fixes the changed Markdown files; the runner
  # uploads its uncommitted edits as a patch. It runs on the pr-unblock
  # role's API key alone. Drafts and held PRs skip in the config's
  # applies-when, before any model turn.
  fix-docs:
    needs: fix-docs-head
    if: >-
      inputs.pr-number != '' && inputs.activity == 'fix-docs'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-refine
      activity: fix-docs
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      head-sha: ${{ needs.fix-docs-head.outputs.head-sha }}
      post-decline: false
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether fix-docs's report job posted its check, and whether the broker
  # allowed the call, read from this run's jobs through the Actions API, as
  # pr-unblock.yml's fix-ci-handoff reads them for fix-ci: never from a
  # fix-docs output, since fix-docs's run job runs head code and can forge
  # handed-off, lane-class or credential-present. A failed read leaves both
  # empty, which starts no fallback; with no check posted,
  # fix-docs-dispatch.mjs dispatches the PR again.
  fix-docs-handoff:
    needs: [fix-docs-head, fix-docs]
    if: ${{ !cancelled() && needs.fix-docs.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
    outputs:
      posted: ${{ steps.posted.outputs.posted }}
      allowed: ${{ steps.posted.outputs.allowed }}
    steps:
      - name: Read whether fix-docs posted its check
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: fix-docs
        run: |
          names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | (select(any(.steps[]?; .name == "Post the check run" and .conclusion == "success")) | "posted \(.name)"),
              (select(any(.steps[]?; .name == "Ask the broker whether the lane may run" and .conclusion == "success")) | "allowed \(.name)")')
          posted=false
          allowed=false
          for call in $CALLS; do
            if grep -qxF "posted $call / report" <<<"$names"; then posted=true; fi
            if grep -qxF "allowed $call / broker-check" <<<"$names"; then allowed=true; fi
          done
          printf 'posted=%s\nallowed=%s\n' "$posted" "$allowed" >>"$GITHUB_OUTPUT"

  # The subscription fallback, as fix-ci-subscription is for fix-ci: it runs
  # only when the broker allowed fix-docs and fix-docs posted no check, which
  # a credit stop or an empty key leaves as a handoff with no upload, lane
  # record or check. fix-docs posts nothing on a decline (post-decline: false),
  # so the broker's allow keeps a kill switch or a refusal from starting a
  # second leg. Its start reads only fix-docs-handoff, and it holds the OAuth
  # token alone. fallback: handoff labels the lane record without reading a
  # fix-docs output: only the run job knows whether it was a credit stop or an
  # empty key, and head code can forge that.
  fix-docs-subscription:
    needs: [fix-docs-head, fix-docs, fix-docs-handoff]
    if: >-
      ${{ !cancelled() && needs.fix-docs.result != 'skipped'
      && needs.fix-docs-handoff.outputs.posted != 'true'
      && needs.fix-docs-handoff.outputs.allowed == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-refine
      activity: fix-docs
      fallback: handoff
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      head-sha: ${{ needs.fix-docs-head.outputs.head-sha }}
      post-decline: false
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.PR_UNBLOCK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # fix-docs's push job: the apply-patch activity under patch-rules.json's
  # default row (fix-docs has no prepare mode). It runs only on a written
  # patch: no change is the common case and needs no one. The lane has no
  # escalation job, so a refused patch posts the pr-refine / apply-patch
  # check neutral and labels nothing. One leg answers, as for pr-unblock.yml's
  # apply-patch: the fallback call when it ran, else the first, and every
  # input is that leg's scan job's, never a run job's, since the run job runs
  # head code. The head is fix-docs-head's, read by a job that ran no head
  # code; apply-patch still applies onto the head its own gate reads.
  apply-docs-patch:
    needs: [fix-docs-head, fix-docs, fix-docs-subscription]
    if: >-
      ${{ !cancelled()
      && (needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-subscription.outputs.scan-patch-state || needs.fix-docs-subscription.result == 'skipped' && needs.fix-docs.outputs.scan-patch-state || '') == 'written' }}
    permissions:
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-refine
      activity: apply-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      patch-state: ${{ needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-subscription.outputs.scan-patch-state || needs.fix-docs-subscription.result == 'skipped' && needs.fix-docs.outputs.scan-patch-state || '' }}
      patch-sha256: ${{ needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-subscription.outputs.scan-patch-sha256 || needs.fix-docs-subscription.result == 'skipped' && needs.fix-docs.outputs.scan-patch-sha256 || '' }}
      patch-attempt: ${{ needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-subscription.outputs.scan-patch-attempt || needs.fix-docs-subscription.result == 'skipped' && needs.fix-docs.outputs.scan-patch-attempt || '' }}
      patch-activity: fix-docs
      patch-head-sha: ${{ needs.fix-docs-head.outputs.head-sha }}
      reply-attempt: ${{ needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-subscription.outputs.scan-reply-attempt || needs.fix-docs-subscription.result == 'skipped' && needs.fix-docs.outputs.scan-reply-attempt || '' }}
