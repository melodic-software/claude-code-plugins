name: PR Refine

# Lane caller for pr-refine: its file stem is the lane, so the lanes token
# broker accepts its write activities. No App key; each run job's OIDC token is
# exchanged at LANES_BROKER_URL for audience LANES_BROKER_AUDIENCE.
# Job contract: docs/conventions/pr-pipeline/pr-run-activity.md.
#
# workflow_dispatch only. fix-docs: pr-unblock-dispatch.yml's refine job sends
# one, on the PR's own pull_request_target event, per ready PR that changes a
# Markdown file and never had a fix-docs run, when the event's sender is the
# lanes App or a listed human, except Dependabot, the release App and the
# standards-sync App, and not for a work-resolve-issue PR tidied in its own run
# (within the tidy cutoffs) (refine-event-dispatch.mjs over
# fix-docs-dispatch.mjs); the push and scheduled dispatcher runs send none. The
# refine job sets dispatcher-run-id; a trusted human may dispatch with
# pr-number and activity alone. Every job trusts the default branch tip, as the
# dispatcher runs from the tip.
#
# Each activity is a model job and its push job (slots[].needs in
# docs/conventions/pr-pipeline.yaml); pairs on one PR serialize on the per-PR
# write queue.

# fix-docs-dispatch.mjs reads this title to skip a second dispatch while one
# for the same activity and PR is still queued or going. Quoted: unquoted,
# " #" would start a YAML comment and drop the PR number.
run-name: "pr-refine ${{ inputs.activity }} #${{ inputs.pr-number }}"

# API_BUDGET_HOLD (outage posture element 2): only plan's changed-files read
# and fix-docs-head's head read and hold check set it, since an unread file
# list, head or hold holds green and starts nothing. handoff-evidence.sh sets
# it itself for the fix-docs reads.
# A step opts in only once its script is shown to hold green with a notice on
# a refused call (rate-guard.mjs createRateLimitLatch); a gate never does, since
# a hold would pass what it could not read, so the rest still end red on a
# rate limit past the guard's budget.
on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: The PR to refine.
        required: true
        type: string
      activity:
        description: What to refine.
        required: false
        type: choice
        options: [fix-docs]
        default: fix-docs
      dispatcher-run-id:
        description: The dispatcher run that sent this dispatch; empty for a human dispatch.
        required: false
        type: string
        default: ""

permissions: {}

# A newer dispatch of the same activity for the same PR replaces one still
# waiting; a running one finishes.
concurrency:
  group: pr-refine-${{ inputs.activity }}-${{ inputs.pr-number }}
  cancel-in-progress: false

jobs:
  # A dispatcher that ran an older copy of its file than the tip sent a run the
  # broker refuses every write token (workflow-modified), so this job compares
  # the two before anything else. On a difference the plan job does not start,
  # nor any job after it: no model turn and no check; the run ends green and
  # the next dispatcher, on the tip's file, finds the head unhandled and sends
  # it again. Here and not in the read runner, because the jobs after a
  # fix-docs-head that proceeded mint a token whatever the model call did.
  # Only base code and a read-only token; a dispatch with no dispatcher run
  # skips the steps.
  dispatcher-current:
    name: Dispatcher Current
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out main; the dispatcher file at its run's head
      actions: read # the dispatcher run's file and head
    outputs:
      stale: ${{ steps.current.outputs.stale }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        if: inputs.dispatcher-run-id != ''
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        if: inputs.dispatcher-run-id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Compare the dispatcher file with the tip's
        id: current
        if: inputs.dispatcher-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHER_RUN_ID: ${{ inputs.dispatcher-run-id }}
        run: bash .base/.github/scripts/pr-unblock/dispatcher-current.sh

      - name: Log the API budget at the end
        if: always() && inputs.dispatcher-run-id != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # Plans the Refine passes (.github/scripts/pr-refine/plan-passes.mjs): each
  # enabled leaf of the base config's pr-refine slots, as resolve.mjs
  # laneSlots expands them, with `stage: refine` and predicates whose paths
  # and paths-ignore let one of the PR's changed files through (for a pass
  # taking changed-paths, one resolve.mjs slotTargets keeps, as its runner
  # does), in batches by order and group. A pass's first job starts only on
  # its plan output, so a PR that matches no pass ends here, every later job
  # skipped, with no model turn. Only base code and a read-only token. A file
  # list at the REST cap of 3000 may be cut off, so it plans every pass and
  # each runner's own applies-when decides. A file list it cannot read holds
  # (outage posture element 2): one notice, held=true and no passes, and
  # fix-docs-head-held logs the hold the dispatcher reads to send the PR again.
  plan:
    name: Plan
    needs: dispatcher-current
    if: >-
      inputs.pr-number != '' && inputs.activity == 'fix-docs'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
      && needs.dispatcher-current.outputs.stale != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out main
      pull-requests: read # the PR's changed files
    outputs:
      passes: ${{ steps.plan.outputs.passes }}
      batches: ${{ steps.plan.outputs.batches }}
      files: ${{ steps.plan.outputs.files }}
      started-at: ${{ steps.start.outputs.at }}
      held: ${{ steps.files.outputs.held }}
      fix-docs: ${{ steps.plan.outputs.fix-docs }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
      npm_config_audit: "false"
      npm_config_fetch_timeout: "60000"
      npm_config_fund: "false"
      # npm's fetch timeout and retries, from the one file that sets them.
      npm_config_globalconfig: ${{ github.workspace }}/.base/.github/npm-fetch.npmrc
    steps:
      - name: Note the start
        id: start
        run: echo "at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: List the PR's changed files
        id: files
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          GH_TOKEN: ${{ github.token }}
          # A rate limit past the guard's budget refuses the read with a notice
          # (api-budget.bash), and the step holds.
          API_BUDGET_HOLD: "1"
        run: |
          # Each `gh api` call keeps its rate-limit reading for the job-end
          # api-budget notice (.github/actions/log-api-budget).
          # shellcheck source=/dev/null
          { . .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null && api_budget_wrap_gh github-token; } || true
          [[ $PR_NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr-number is not a PR number"; exit 1; }
          # A failed read (a 5xx, a network error, a refused rate limit) is
          # read once more, then holds.
          until gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' >"$RUNNER_TEMP/changed-paths.txt"; do
            ((++i < 2)) || {
              echo "::notice::the changed files of #$PR_NUMBER could not be read; no Refine pass runs"
              echo "held=true" >>"$GITHUB_OUTPUT"
              exit 0
            }
            sleep 5
          done
          echo "held=false" >>"$GITHUB_OUTPUT"
          truncated=false
          (($(wc -l <"$RUNNER_TEMP/changed-paths.txt") < 3000)) || truncated=true
          echo "truncated=$truncated" >>"$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.files.outputs.held == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # write-pass-plan.mjs loads the base config and expands the lane's slots
      # through the base's resolve-config, which needs its dependencies.
      - name: Install resolve-config's dependencies
        if: steps.files.outputs.held == 'false'
        timeout-minutes: 5
        run: npm ci --ignore-scripts --omit=dev --prefix .base/.github/actions/resolve-config

      - name: Plan the passes
        id: plan
        if: steps.files.outputs.held == 'false'
        env:
          BASE_PATH: .base
          PATHS_FILE: ${{ runner.temp }}/changed-paths.txt
          CODEOWNERS_FILE: .base/.github/CODEOWNERS
          TRUNCATED: ${{ steps.files.outputs.truncated }}
        run: node .base/.github/scripts/pr-refine/write-pass-plan.mjs

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The PR head fix-docs's report posts its check on, read by a job that runs
  # no head code, as fix-ci-context's is for fix-ci. Without it the report
  # trusts only the head read at report time, so a push mid-run posts failure
  # on the new head.
  # It also reads whether the human-gated label holds fix-docs: only when a
  # lane escalation did not put it on (lane-hold.mjs); a held PR runs nothing.
  # A head it cannot read (a failed read, a rate limit past the guard's budget,
  # or an answer with no SHA) holds (outage posture element 2): one notice,
  # unread=true, no head-sha, so nothing after it starts but fix-docs-head-held.
  # A hold whose reads meet a GitHub fault holds the same way, with no held.
  # It starts only when the plan job planned fix-docs.
  fix-docs-head:
    name: Fix Docs Head
    needs: [dispatcher-current, plan]
    if: >-
      inputs.pr-number != '' && inputs.activity == 'fix-docs'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
      && needs.dispatcher-current.outputs.stale != 'true'
      && needs.plan.outputs.fix-docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # the review lanes' comment records
      contents: read # check out main
      pull-requests: read
    outputs:
      head-sha: ${{ steps.head.outputs.sha }}
      unread: ${{ steps.head.outputs.unread || steps.hold.outputs.unread }}
      hold-unread: ${{ steps.hold.outputs.unread }}
      held: ${{ steps.hold.outputs.held }}
      lane-escalated: ${{ steps.hold.outputs.lane-escalated }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Read the PR's head SHA
        id: head
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          GH_TOKEN: ${{ github.token }}
          # A rate limit past the guard's budget refuses the read with a notice
          # (api-budget.bash), and the step holds.
          API_BUDGET_HOLD: "1"
          READ_PR_FAILURE: notice
        run: |
          # Each `gh api` call keeps its rate-limit reading for the job-end
          # api-budget notice (.github/actions/log-api-budget).
          # shellcheck source=/dev/null
          { . .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null && api_budget_wrap_gh github-token; } || true
          # read_pr_fields reads a transient fault (a 5xx, a network error) once
          # more and never a rate limit; a read that still fails, or names no
          # SHA, holds: fix-docs-head-held logs the hold and nothing else runs.
          # shellcheck source=/dev/null
          . .base/.github/scripts/pr-unblock/read-pr-head.bash
          [[ $PR_NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr-number is not a PR number"; exit 1; }
          sha=""
          if read_pr_fields "$PR_NUMBER" .head.sha; then sha=$pr_fields; fi
          if ! [[ $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::notice::no PR head SHA read for #$PR_NUMBER; fix-docs does not run"
            echo "unread=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.head.outputs.sha != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the human-gated hold
        id: hold
        if: steps.head.outputs.sha != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The review lanes' comment records (actions: read).
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          ACTIVITY: fix-docs
          # A rate limit past the guard's budget refuses the read with a
          # notice, and the step holds.
          API_BUDGET_HOLD: "1"
        run: node .base/.github/scripts/pr-unblock/lane-hold.mjs

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # Job-level evidence that fix-docs-head held on an unread head or hold, or
  # the plan on unread changed files: the run ends green, and
  # fix-docs-dispatch.mjs (heldHead) reads this job's conclusion, as it reads a
  # handoff hold, to dispatch the PR again until limit-stops-per-head runs went
  # red or held. Monitor signal 13 counts its titled notice (signals.mjs
  # HOLD_LANES). It needs plan and fix-docs-head alone, jobs that run no head
  # code, so nothing forges it.
  fix-docs-head-held:
    name: Fix Docs Head Held
    needs: [plan, fix-docs-head]
    if: >-
      ${{ !cancelled() && (needs.fix-docs-head.outputs.unread == 'true'
      || needs.plan.outputs.held == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Note the hold
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          HOLD_UNREAD: ${{ needs.fix-docs-head.outputs.hold-unread }}
          PLAN_HELD: ${{ needs.plan.outputs.held }}
        run: |
          what="head"
          [[ $HOLD_UNREAD != true ]] || what="human-gated hold"
          if [[ $PLAN_HELD != true ]]; then
            echo "::notice title=PR head hold::the $what of #$PR_NUMBER could not be read; fix-docs did not run, and the next dispatcher tick sends the PR again"
          else
            echo "::notice title=PR head hold::the changed files of #$PR_NUMBER could not be read; no Refine pass ran, and the next dispatcher tick sends the PR again"
          fi
          # The hold's marker for monitor signal 13 (lane-hold-marker.mjs).
          { mkdir -p "$RUNNER_TEMP/lane-hold" && echo "pr-refine $GITHUB_RUN_ID" >"$RUNNER_TEMP/lane-hold/pr-refine"; } || true
      - name: Keep the lane hold marker
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-hold-pr-refine
          path: ${{ runner.temp }}/lane-hold/pr-refine
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

  # fix-docs is split across jobs, so no model ever holds a write token. The
  # model job: a read activity with no write token and no OIDC token in the job that
  # runs head code. The skill fixes the changed Markdown files; the runner
  # uploads its uncommitted edits as a patch. It runs on the pr-unblock
  # role's API key alone. Drafts and do-not-merge PRs skip in the config's
  # applies-when, a human-gated hold in fix-docs-head, before any model turn.
  fix-docs:
    name: Fix Docs
    needs: fix-docs-head
    if: >-
      inputs.pr-number != '' && inputs.activity == 'fix-docs'
      && format('{0}', github.event.sender.id) != vars.AUTOMATION_LANES_APP_SENDER_ID
      && needs.fix-docs-head.outputs.held == 'false'
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-refine
      activity: fix-docs
      key-credit-job: fix-docs
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      head-sha: ${{ needs.fix-docs-head.outputs.head-sha }}
      post-decline: false
      timeout-minutes: 60
    secrets:
      claude-api-key: ${{ secrets.PR_UNBLOCK_CLAUDE_API_KEY }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether fix-docs's report job posted its check, and whether the broker
  # allowed the call, read from this run's jobs through the Actions API, as
  # pr-unblock.yml's fix-ci-handoff reads them for fix-ci: never from a
  # fix-docs output, since fix-docs's run job runs head code and can forge
  # handed-off, lane-class or credential-present. A listing that lags past the
  # read budget, and a read that fails 3 times (handoff-evidence.sh's fix-docs
  # hold, a rate limit included), each end green with one notice and the handoff
  # facts empty, which starts no fallback. fix-docs-dispatch.mjs reads such a
  # held run from its job conclusions (heldHandoff) and dispatches the PR again,
  # as after a red run, until limit-stops-per-head runs went red or held, or two
  # were lost (cancelled, timed_out or startup_failure); any other completed run
  # ends the PR. A failed fix-docs still reds its own jobs and the run.
  fix-docs-handoff:
    name: Fix Docs Handoff
    needs: [fix-docs-head, fix-docs]
    if: ${{ !cancelled() && needs.fix-docs.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      fallback-ready: ${{ steps.fallback.outputs.ready }}
      posted: ${{ steps.posted.outputs.posted }}
      allowed: ${{ steps.posted.outputs.allowed }}
      handed-off: ${{ steps.posted.outputs.handed-off }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
      HANDOFF_EVIDENCE_LAG: notice
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether fix-docs posted its check
        id: posted
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: fix-docs
          LANE_HOLD_MARKER: ${{ runner.temp }}/lane-hold/pr-refine
        run: bash .base/.github/scripts/lib/handoff-evidence.sh posted allowed handed-off

      # A held read's marker for monitor signal 13; no marker uploads nothing.
      - name: Keep the lane hold marker
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-hold-pr-refine
          path: ${{ runner.temp }}/lane-hold/pr-refine
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      # Whether the third call can run, never the token. fix-docs-subscription
      # passes it on as fallback-ready, so with the token empty its
      # subscription leg stays the last. A failed read leaves it empty. A
      # lagging read sets it, and the empty handed-off still keeps both later
      # legs from starting.
      - name: Check the fallback token
        id: fallback
        env:
          PRESENT: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: echo "ready=$PRESENT" >>"$GITHUB_OUTPUT"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The key's credit-stop markers, read by the read runner's broker-check in
  # later runs (each first call's key-credit-job). Each comes from a jobs-API
  # read of the call's run job (handoff-evidence.sh credit-stop), never from a
  # call's output. No job needs this one, so the read, which waits for the
  # jobs listing's steps, delays no handoff.
  key-credit-markers:
    name: Key Credit Markers
    needs: [fix-docs]
    if: ${{ !cancelled() && (needs.fix-docs.result != 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether fix-docs's key hit a credit stop
        id: credit-stop-fix-docs
        if: needs.fix-docs.result != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: fix-docs
          HANDOFF_EVIDENCE_LAG: notice
        run: bash .base/.github/scripts/lib/handoff-evidence.sh credit-stop

      - name: Write fix-docs's credit-stop marker
        id: credit-marker-fix-docs
        if: steps.credit-stop-fix-docs.outputs.credit-stop == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/key-credit-stop-fix-docs"
          echo "$GITHUB_RUN_ID" >"$RUNNER_TEMP/key-credit-stop-fix-docs/run-id"

      - name: Upload fix-docs's credit-stop marker
        if: steps.credit-marker-fix-docs.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: key-credit-stop-pr-refine.yml-fix-docs
          path: ${{ runner.temp }}/key-credit-stop-fix-docs/run-id
          if-no-files-found: error
          retention-days: 1

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The subscription fallback, as fix-ci-subscription is for fix-ci: it runs
  # only when the broker allowed fix-docs, fix-docs posted no check, and
  # fix-docs handed off: a credit stop or an empty key, whose run job succeeds
  # with its scan job skipped, leaving no upload, lane record or check.
  # fix-docs posts nothing on a decline (post-decline: false), so the broker's
  # allow keeps a kill switch or a refusal from starting a second leg, and the
  # handoff keeps a trigger decline or a supersede (the PR head moved after
  # fix-docs-head read it, so a second leg would supersede too) from starting
  # one: their scan job runs. Its start reads no fix-docs output, only
  # fix-docs-handoff's, and it holds the OAuth token alone. fallback: handoff
  # labels the lane record without reading a fix-docs output: only the run job
  # knows whether it was a credit stop or an empty key, and head code can
  # forge that.
  fix-docs-subscription:
    name: Fix Docs Subscription
    needs: [fix-docs-head, fix-docs, fix-docs-handoff]
    if: >-
      ${{ !cancelled() && needs.fix-docs.result != 'skipped'
      && needs.fix-docs-handoff.outputs.posted != 'true'
      && needs.fix-docs-handoff.outputs.allowed == 'true'
      && needs.fix-docs-handoff.outputs.handed-off == 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-refine
      activity: fix-docs
      fallback: handoff
      fallback-ready: ${{ needs.fix-docs-handoff.outputs.fallback-ready }}
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      head-sha: ${{ needs.fix-docs-head.outputs.head-sha }}
      post-decline: false
      timeout-minutes: 60
    secrets:
      claude-code-oauth-token: ${{ secrets.PR_UNBLOCK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # Whether fix-docs-subscription handed off to the fallback token, read from
  # this run's jobs by handoff-evidence.sh, never from a fix-docs-subscription
  # output: its broker allowed it, its run job succeeded and its scan job never
  # ran. It runs only when fix-docs-handoff found the fallback token set, so
  # with the token empty neither it nor the third call starts. A failed or
  # lagging read starts no third call.
  fix-docs-subscription-handoff:
    name: Fix Docs Subscription Handoff
    needs: [fix-docs-handoff, fix-docs-subscription]
    if: ${{ !cancelled() && needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-handoff.outputs.fallback-ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # this run's jobs and their steps
      contents: read # the default branch tip's handoff-evidence.sh
    outputs:
      handed-off: ${{ steps.handoff.outputs.handed-off }}
    # Each guarded API call's rate-limit reading, for the job-end api-budget
    # notice (.github/actions/log-api-budget).
    env:
      API_BUDGET_TOKEN: github-token
      HANDOFF_EVIDENCE_LAG: notice
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/lib/handoff-evidence.sh
            .github/actions/log-api-budget
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read whether fix-docs-subscription handed off
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          CALLS: fix-docs-subscription
          LANE_HOLD_MARKER: ${{ runner.temp }}/lane-hold/pr-refine
        run: bash .base/.github/scripts/lib/handoff-evidence.sh handed-off

      # A held read's marker for monitor signal 13, on a green job only; no
      # marker uploads nothing.
      - name: Keep the lane hold marker
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-hold-pr-refine
          path: ${{ runner.temp }}/lane-hold/pr-refine
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # The third call, on the central fallback subscription's token alone: it
  # runs only on fix-docs-subscription-handoff's read, after
  # fix-docs-subscription handed off (a limit stop, a credit stop, or a 401 or
  # 402). It is the last leg and never hands off.
  fix-docs-fallback:
    name: Fix Docs Fallback
    needs: [fix-docs-head, fix-docs, fix-docs-handoff, fix-docs-subscription, fix-docs-subscription-handoff]
    if: ${{ !cancelled() && needs.fix-docs-handoff.outputs.fallback-ready == 'true' && needs.fix-docs-subscription-handoff.outputs.handed-off == 'true' }}
    permissions:
      actions: read # the read runner's key-credit gate lists the credit-stop markers
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-read.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-refine
      activity: fix-docs
      fallback: fallback
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      head-sha: ${{ needs.fix-docs-head.outputs.head-sha }}
      post-decline: false
      timeout-minutes: 60
    secrets:
      fallback-claude-code-oauth-token: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
      scan-carrier-private-key: ${{ secrets.SCAN_CARRIER_PRIVATE_KEY }}

  # fix-docs's push job: the apply-patch activity under patch-rules.json's
  # docs row, which admits only markdown outside skills/ and no SKILL.md. It
  # runs only on a written patch: no change is the common case and needs no
  # one. The lane has no escalation job, so a refused patch posts the
  # pr-refine / apply-patch check neutral and labels nothing. One leg answers,
  # as for pr-unblock.yml's apply-patch: the fallback call when it ran, else
  # the subscription call when it ran, else the first, and every input is that
  # leg's scan job's, never a run job's, since the run job runs head code. The
  # head is fix-docs-head's, read by a job that ran no head code; apply-patch
  # still applies onto the head its own gate reads.
  apply-docs-patch:
    name: Apply Docs Patch
    needs: [fix-docs-head, fix-docs, fix-docs-subscription, fix-docs-fallback]
    if: >-
      ${{ !cancelled()
      && (needs.fix-docs-fallback.result != 'skipped' && needs.fix-docs-fallback.outputs.scan-patch-state || needs.fix-docs-fallback.result == 'skipped' && needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-subscription.outputs.scan-patch-state || needs.fix-docs-fallback.result == 'skipped' && needs.fix-docs-subscription.result == 'skipped' && needs.fix-docs.outputs.scan-patch-state || '') == 'written' }}
    permissions:
      actions: read # the write runner's run job reads the review lanes' comment records
      contents: read
      pull-requests: read
      checks: write
      issues: write
      id-token: write
    concurrency:
      group: pr-pipeline-write-${{ inputs.pr-number }}
      queue: max
    uses: ./.github/workflows/pr-run-activity-write.yml # zizmor: ignore[self-repository]
    with:
      role: pr-unblock
      lane: pr-refine
      activity: apply-patch
      pr-number: ${{ inputs.pr-number }}
      dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
      trusted-base: default-tip
      patch-state: ${{ needs.fix-docs-fallback.result != 'skipped' && needs.fix-docs-fallback.outputs.scan-patch-state || needs.fix-docs-fallback.result == 'skipped' && needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-subscription.outputs.scan-patch-state || needs.fix-docs-fallback.result == 'skipped' && needs.fix-docs-subscription.result == 'skipped' && needs.fix-docs.outputs.scan-patch-state || '' }}
      patch-sha256: ${{ needs.fix-docs-fallback.result != 'skipped' && needs.fix-docs-fallback.outputs.scan-patch-sha256 || needs.fix-docs-fallback.result == 'skipped' && needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-subscription.outputs.scan-patch-sha256 || needs.fix-docs-fallback.result == 'skipped' && needs.fix-docs-subscription.result == 'skipped' && needs.fix-docs.outputs.scan-patch-sha256 || '' }}
      patch-attempt: ${{ needs.fix-docs-fallback.result != 'skipped' && needs.fix-docs-fallback.outputs.scan-patch-attempt || needs.fix-docs-fallback.result == 'skipped' && needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-subscription.outputs.scan-patch-attempt || needs.fix-docs-fallback.result == 'skipped' && needs.fix-docs-subscription.result == 'skipped' && needs.fix-docs.outputs.scan-patch-attempt || '' }}
      patch-activity: fix-docs
      patch-prepare: docs
      # The write runner's own default, set here so the job's limit is
      # visible at its caller (pr-run-activity-write.yml inputs).
      timeout-minutes: 30
      patch-head-sha: ${{ needs.fix-docs-head.outputs.head-sha }}
      # lane-escalation drops the human-gated label from the holds while the
      # write runner reads it again as a lane escalation (lane-hold.mjs).
      patch-human-gate: ${{ needs.fix-docs-head.outputs.lane-escalated == 'true' && 'lane-escalation' || '' }}
      reply-attempt: ${{ needs.fix-docs-fallback.result != 'skipped' && needs.fix-docs-fallback.outputs.scan-reply-attempt || needs.fix-docs-fallback.result == 'skipped' && needs.fix-docs-subscription.result != 'skipped' && needs.fix-docs-subscription.outputs.scan-reply-attempt || needs.fix-docs-fallback.result == 'skipped' && needs.fix-docs-subscription.result == 'skipped' && needs.fix-docs.outputs.scan-reply-attempt || '' }}

  # One refine-pass notice per planned pass (log-pass-records.mjs): its name,
  # files matched, outcome (pushed, none, superseded or failed) and seconds
  # since the plan started. A failed pass also logs a refine-failed warning,
  # which monitor signal 13 counts as a pr-refine hold, on this job of a red
  # run too (signals.mjs HOLD_LANES). Each outcome comes from the jobs'
  # results and the push job's outputs, which only its base script sets,
  # never from a model call's run job, which runs head code. A plan job that
  # failed logs refine-failed for pass=plan, since no pass's job ran. No token
  # but a read-only one for the checkout.
  record-passes:
    name: Record Passes
    needs: [plan, fix-docs-head, fix-docs, fix-docs-handoff, fix-docs-subscription, fix-docs-subscription-handoff, fix-docs-fallback, apply-docs-patch]
    if: >-
      ${{ !cancelled() && (needs.plan.result == 'failure'
      || needs.plan.result == 'success' && needs.plan.outputs.held != 'true' && needs.plan.outputs.passes != '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # the default branch tip's log-pass-records.mjs
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          sparse-checkout: |
            .github/scripts/pr-refine/log-pass-records.mjs
            .github/scripts/lib/lane-hold-marker.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Record each pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PASSES: ${{ needs.plan.outputs.passes }}
          FILES: ${{ needs.plan.outputs.files }}
          STARTED_AT: ${{ needs.plan.outputs.started-at }}
          # fix-docs's jobs and their results, and its push job's outputs.
          FIX_DOCS_RESULTS: >-
            {"fix-docs-head": "${{ needs.fix-docs-head.result }}",
            "fix-docs": "${{ needs.fix-docs.result }}",
            "fix-docs-handoff": "${{ needs.fix-docs-handoff.result }}",
            "fix-docs-subscription": "${{ needs.fix-docs-subscription.result }}",
            "fix-docs-subscription-handoff": "${{ needs.fix-docs-subscription-handoff.result }}",
            "fix-docs-fallback": "${{ needs.fix-docs-fallback.result }}",
            "apply-docs-patch": "${{ needs.apply-docs-patch.result }}"}
          FIX_DOCS_PUSHED: ${{ needs.apply-docs-patch.outputs.pushed-commit }}
          FIX_DOCS_SKIP: ${{ needs.apply-docs-patch.outputs.skip-reason }}
          # A failed pass's marker for monitor signal 13 (lane-hold-marker.mjs).
          LANE_HOLD_MARKER: ${{ runner.temp }}/lane-hold/pr-refine
        run: node .base/.github/scripts/pr-refine/log-pass-records.mjs

      - name: Keep the lane hold marker
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-hold-pr-refine
          path: ${{ runner.temp }}/lane-hold/pr-refine
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
