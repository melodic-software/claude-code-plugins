name: pr-run-activity-write

# Runs one write activity (any effect but `read`) of one PR pipeline lane and
# reports it as the check run `<lane> / <activity>`. The run job gates,
# resolves the base-SHA config, fails red on a `read` effect, gets the App
# token the effect grants from the lanes token broker with its OIDC token
# before any head checkout, runs a skill or a script, and revokes the token;
# the report job writes the check from the run job's runner-computed outputs.
# Neither file references the App key. Read activities run in
# pr-run-activity-read.yml, whose head-code job holds no OIDC token.
# Job contract: docs/conventions/pr-pipeline/pr-run-activity.md.
#
# Every action runs from the base-SHA checkout at ./.base. zizmor's
# self-repository advice (`$/...`) is ignored on those lines: `$/` loads the
# action from this workflow's own commit, which on pull_request is the PR's
# merge commit, not the base.

on:
  workflow_call:
    inputs:
      lane:
        description: The lane, its caller workflow's file stem.
        required: true
        type: string
      activity:
        description: The activity to run from the lane's slots.
        required: true
        type: string
      config-path:
        description: The config, relative to the base checkout. For test callers only.
        required: false
        type: string
        default: docs/conventions/pr-pipeline.yaml
      pr-number:
        description: The PR on workflow_dispatch; ignored for other events.
        required: false
        type: string
        default: ""
      default-model:
        description: The model when the activity sets none; empty omits --model.
        required: false
        type: string
        default: ""
      default-max-turns:
        description: The turn budget when the activity sets none.
        required: false
        type: number
        default: 75
      timeout-minutes:
        description: The run job's timeout in minutes.
        required: false
        type: number
        default: 30
      dispatcher-run-id:
        description: >-
          On a workflow_dispatch sent by github-actions[bot], the
          pr-unblock-dispatch.yml run that sent it; empty otherwise.
        required: false
        type: string
        default: ""
      trusted-base:
        description: >-
          pr-base trusts the PR's base SHA; default-tip trusts the default
          branch tip, for a lane whose PR keeps a stale base (a merge conflict).
        required: false
        type: string
        default: pr-base
      escalation-reason:
        description: >-
          For a report-escalation script activity, the escalation-reason output
          of the run that escalated; exported to the script as ESCALATION_REASON.
        required: false
        type: string
        default: ""
    secrets:
      claude-code-oauth-token:
        description: Claude Code OAuth token for skill activities.
        required: false
    outputs:
      escalation-reason:
        description: >-
          Why a prepare: merge-base activity handed the PR to a person:
          protected-path-conflict, workflow-staged, repeat-cap or
          unresolved-conflict; empty otherwise. Set only by runner steps.
        value: ${{ jobs.run.outputs.escalation-reason }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  run:
    # The lanes App's own pull_request events never start a lane.
    if: >-
      !(github.event_name == 'pull_request'
      && format('{0}', github.event.sender.id) == vars.AUTOMATION_LANES_APP_SENDER_ID)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # id-token: write is only for the broker request. Any step of this job can
    # request an OIDC token for another audience: an accepted residual (ADR
    # 0058), bounded by the broker's one mint per job.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    # The report job trusts only these, all computed by runner steps. Every
    # one but act-outcome, merge-state and escalation-reason is a step outcome
    # or an output of a step that ran before any PR head code. act-outcome
    # reads steps that run after the skill: for a gate skill the verdict step,
    # so a gate skill must not execute head code; its promote, commit and
    # turn terms only turn a success into a failure. merge-state and a
    # pre-model escalation-reason come from the prepare step, before any
    # model turn; a post-model escalation-reason comes from post.sh after it,
    # and a forged one can only hand the PR to a person.
    outputs:
      base-sha: ${{ steps.trusted-base.outputs.commit }}
      head-sha: ${{ steps.gate.outputs.head-sha }}
      head-ref: ${{ steps.gate.outputs.head-ref }}
      pr-number: ${{ steps.gate.outputs.pr-number }}
      gate-reason: >-
        ${{ steps.kill.outputs.proceed != 'true' && steps.kill.outputs.reason
        || steps.gate.outputs.proceed != 'true' && steps.gate.outputs.reason
        || '' }}
      can-commit: ${{ steps.config.outputs.can-commit }}
      merge-state: ${{ steps.prepare.outputs.merge-state }}
      escalation-reason: ${{ steps.prepare.outputs.escalation-reason || steps.post.outputs.escalation-reason }}
      # A gate skill succeeds only on a `pass` verdict, a skill that took no
      # model turn fails, and a skill whose commits could not be moved onto
      # the PR branch fails. In merge-base mode a clean merge skips the skill
      # and succeeds only once its commit is made and promoted (or post.sh
      # escalates), and a staged merge that post.sh cleared but that was not
      # committed fails. The verdict step's ACT_OUTCOME repeats this
      # expression: runner-policy refuses YAML aliases.
      act-outcome: >-
        ${{ steps.act-skill.outcome == 'skipped' && steps.prepare.outputs.merge-state == 'clean'
        && ((steps.post.outputs.escalation-reason != ''
        || steps.commit.outcome == 'success' && steps.promote.outcome == 'success') && 'success' || 'failure')
        || steps.act-skill.outcome == 'success'
        && (steps.config.outputs.gating == 'gate' && steps.skill-verdict.outcome != 'success'
        || steps.promote.outcome == 'failure' || steps.act-turns.outcome != 'success'
        || steps.commit.outcome == 'failure'
        || steps.post.outputs.tree != '' && steps.commit.outcome != 'success') && 'failure'
        || steps.act-skill.outcome != 'skipped' && steps.act-skill.outcome
        || steps.act-script.outcome }}
    steps:
      # The job if: above cannot match an unset variable, so the guard would
      # silently let the App's own events through. An empty default branch
      # would make the checkout below fall back to the event's ref.
      # The escalation-reason input reaches a script as ESCALATION_REASON, so
      # only the runner output's own values pass.
      - name: Assert the lanes App sender id, default branch and inputs are set
        env:
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ESCALATION_REASON: ${{ inputs.escalation-reason }}
        run: |
          if ! [[ $APP_SENDER_ID =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the AUTOMATION_LANES_APP_SENDER_ID variable must hold the lanes App bot's numeric user id"
            exit 1
          fi
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error::the event names no default branch"
            exit 1
          fi
          case $ESCALATION_REASON in
            "" | protected-path-conflict | workflow-staged | repeat-cap | unresolved-conflict) ;;
            *)
              echo "::error::the escalation-reason input is not a known escalation reason"
              exit 1
              ;;
          esac

      # The kill switch and the trigger gate run from the default branch tip,
      # never from a base the PR chose. Full history lets the next check test
      # the gated base SHA's ancestry.
      - name: Check out the default branch tip
        id: base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # The lanes App bot never starts a write activity, on any event, so one
      # write cannot chain into the next; a re-run must be started by a listed
      # account.
      - name: Check the trigger
        id: gate
        if: steps.kill.outputs.proceed == 'true'
        uses: ./.base/.github/actions/check-trusted-trigger # zizmor: ignore[self-repository]
        with:
          trusted-actors-path: .base/.github/standards/trusted-actors/trusted-actors.json
          pr-number: ${{ inputs.pr-number }}
          denied-actor-ids: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          triggering-actor: ${{ github.triggering_actor }}
          # A dispatch from github-actions[bot] proceeds only when it names a
          # pr-unblock-dispatch.yml run on the default branch that sent it to
          # pr-unblock.yml; any other run passes no id and the bot stays unlisted.
          dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
          dispatcher-workflow: .github/workflows/pr-unblock-dispatch.yml
          dispatched-workflow: .github/workflows/pr-unblock.yml

      # The trusted base is the config, actions and trusted-actor source and,
      # in prepare: merge-base mode, the merge's second parent.
      - name: Assert the base is on the default branch
        id: trusted-base
        if: steps.gate.outputs.proceed == 'true'
        uses: ./.base/.github/actions/check-trusted-base # zizmor: ignore[self-repository]
        with:
          base-sha: ${{ steps.gate.outputs.base-sha }}
          pr-number: ${{ steps.gate.outputs.pr-number }}
          mode: ${{ inputs.trusted-base }}

      - name: Resolve the config
        id: config
        if: steps.trusted-base.outcome == 'success'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: ${{ inputs.lane }}
          activity: ${{ inputs.activity }}
          base-path: .base
          config-path: ${{ inputs.config-path }}
          output-path: ${{ runner.temp }}/resolved-config.json
          pr-number: ${{ steps.gate.outputs.pr-number }}
          head-sha: ${{ steps.gate.outputs.head-sha }}
          # This file performs prepare: merge-base (the prepare, post and
          # commit steps below).
          prepare-supported: "true"

      # A read activity belongs in pr-run-activity-read.yml, whose run holds no
      # App key; the caller chose the wrong file.
      - name: Assert the effect is not read
        if: steps.config.outcome == 'success' && steps.config.outputs.effect == 'read'
        run: |
          echo "::error::effect-read: a read activity runs in pr-run-activity-read.yml, not pr-run-activity-write.yml"
          exit 1

      # A branch-writing activity re-reads the PR branch from git/ref before
      # the mint (GET /pulls can lag a push), and a moved branch skips it
      # neutral superseded-sha with nothing minted: the run the newer head
      # starts redoes it. Other effects never write the branch and proceed
      # on the gated head. Every later step keys on proceed.
      - name: Re-read the PR head before the mint
        id: head-recheck
        if: steps.config.outputs.applies == 'true' && steps.config.outputs.effect != 'read'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          EFFECT: ${{ steps.config.outputs.effect }}
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          HEAD_REF: ${{ steps.gate.outputs.head-ref }}
        with:
          retries: 0
          script: |
            const { EFFECT, HEAD_SHA, HEAD_REF } = process.env;
            if (EFFECT !== 'mutate-branch') {
              core.setOutput('proceed', 'true');
              return;
            }
            const { data } = await github.request('GET /repos/{owner}/{repo}/git/ref/{ref}', {
              ...context.repo,
              ref: `heads/${HEAD_REF}`,
            });
            if (data.object.sha === HEAD_SHA) {
              core.setOutput('proceed', 'true');
              return;
            }
            core.info(`The PR branch moved from ${HEAD_SHA} to ${data.object.sha} before the mint; skipping as superseded`);
            core.setOutput('proceed', 'false');
            core.setOutput('skip-reason', 'superseded-sha');

      # The broker mints once per job, and this runs before any head checkout,
      # so a second request from this job is denied already-minted. It fails
      # red on an empty LANES_BROKER_URL or LANES_BROKER_AUDIENCE, on any
      # answer but 200, and on a grant other than the one resolved above.
      - name: Request the lane token
        id: lane-token
        if: steps.head-recheck.outputs.proceed == 'true'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: ${{ inputs.lane }}
          activity: ${{ inputs.activity }}
          pr-number: ${{ steps.gate.outputs.pr-number }}
          dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}

      - name: Select the trusted PR text
        if: steps.head-recheck.outputs.proceed == 'true' && steps.config.outputs.reads-untrusted == 'true'
        uses: ./.base/.github/actions/select-trusted-text # zizmor: ignore[self-repository]
        with:
          pr-number: ${{ steps.gate.outputs.pr-number }}
          trusted-actors-path: .base/.github/standards/trusted-actors/trusted-actors.json
          output-path: ${{ runner.temp }}/trusted-context.json
          github-token: ${{ steps.lane-token.outputs.token }}

      # The head checkout below replaces .base, so what the activity runs from
      # the base is copied out first.
      - name: Stage the activity from the base
        id: stage
        if: steps.head-recheck.outputs.proceed == 'true'
        uses: ./.base/.github/actions/collect-base-activity # zizmor: ignore[self-repository]
        with:
          kind: ${{ steps.config.outputs.kind }}
          script: ${{ steps.config.outputs.script }}
          skill: ${{ steps.config.outputs.skill }}
          model: ${{ steps.config.outputs.model || inputs.default-model }}
          max-turns: ${{ steps.config.outputs.max-turns || inputs.default-max-turns }}
          gating: ${{ steps.config.outputs.gating }}
          effect: ${{ steps.config.outputs.effect }}
          can-commit: ${{ steps.config.outputs.can-commit }}
          prepare: ${{ steps.config.outputs.prepare }}
          resolved-path: ${{ runner.temp }}/resolved-config.json

      # A script reads the base's work-item tracker config (report-escalation's
      # human-gated role label), which the head checkout would replace. Its
      # SHA-256, or `absent`, is checked by the script step.
      - name: Copy the tracker config from the base
        id: tracker-config
        if: steps.head-recheck.outputs.proceed == 'true' && steps.config.outputs.kind == 'script'
        env:
          COPY: ${{ runner.temp }}/base-script/.work-item-tracker.json
        run: |
          rm -f "$COPY"
          if [ -f .base/.work-item-tracker.json ]; then
            cp .base/.work-item-tracker.json "$COPY"
            sum=$(sha256sum <"$COPY")
            echo "sha256=${sum%% *}" >>"$GITHUB_OUTPUT"
          else
            echo "sha256=absent" >>"$GITHUB_OUTPUT"
          fi

      # prepare: merge-base runs the base's merge scripts and the base's
      # version-bump script, never the head's: copied out here, each with its
      # SHA-256 as a step output that every later step checks its copy
      # against before running it. The repeat cap reads loop.no-progress from
      # the resolved config now, before any head code could rewrite the file.
      - name: Copy the merge scripts from the base
        id: merge-bin
        if: steps.head-recheck.outputs.proceed == 'true' && steps.config.outputs.prepare == 'merge-base'
        env:
          BIN: ${{ runner.temp }}/merge-base-bin
          RESOLVED: ${{ runner.temp }}/resolved-config.json
        run: |
          mkdir -p "$BIN"
          for file in .base/.github/scripts/merge-base/{prepare,post,tree-entries}.sh \
            .base/plugins/source-control/scripts/resolve-version-bump-conflict.sh; do
            name=$(basename "$file" .sh)
            cp "$file" "$BIN/$name.sh"
            sum=$(sha256sum <"$BIN/$name.sh")
            echo "$name-sha256=${sum%% *}" >>"$GITHUB_OUTPUT"
          done
          no_progress=$(jq -r '.loop["no-progress"] // empty' "$RESOLVED")
          if ! [[ $no_progress =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the resolved config holds no loop.no-progress"
            exit 1
          fi
          echo "no-progress=$no_progress" >>"$GITHUB_OUTPUT"
          # The human-gated role label, which the commit step treats as a
          # hold, resolved from the base the way report-escalation.sh does.
          hold_label=needs-human
          if [ -f .base/.work-item-tracker.json ]; then
            hold_label=$(jq -er '.config.role_labels // {}
              | if has("human-gated") then .["human-gated"] | strings | select(length > 0) else "needs-human" end' \
              .base/.work-item-tracker.json) || {
              echo "::error::cannot read the human-gated role label from the base .work-item-tracker.json"
              exit 1
            }
          fi
          if ! [[ $hold_label =~ ^[A-Za-z0-9][A-Za-z0-9\ ._:/-]*$ ]]; then
            echo "::error::the human-gated role label is malformed"
            exit 1
          fi
          echo "hold-label=$hold_label" >>"$GITHUB_OUTPUT"

      # Nothing after this step needs sudo or docker.
      - name: Isolate the runner
        if: steps.head-recheck.outputs.proceed == 'true'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: ${{ steps.config.outputs.kind == 'skill' }}

      - name: Check out the PR head
        if: steps.head-recheck.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.head-sha }}
          token: ${{ steps.lane-token.outputs.token }}
          persist-credentials: false
          # The merge needs the history back to the merge base and the trusted
          # base commit. Written as != so the 0 is not read as false.
          fetch-depth: ${{ steps.config.outputs.prepare != 'merge-base' && 1 || 0 }}

      # The activity judges exactly the commit the check is posted on.
      - name: Assert the head is the gated SHA
        if: steps.head-recheck.outputs.proceed == 'true'
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::the checked-out head is not the gated head SHA"
            exit 1
          fi

      # prepare: merge-base, before any model turn: merge the trusted base
      # into the gated head without committing, run the base's version-bump
      # script, and decide clean (commit with no model turn), conflicted (the
      # skill resolves) or escalate (awaiting-human, reason for the
      # report-escalation leaf). Only whitelisted, validated key=value lines
      # become outputs. The identity is the lanes bot's: git refuses even a
      # --no-commit merge without one, and the repeat cap counts commits by
      # that author name.
      - name: Start the merge of the trusted base
        id: prepare
        if: steps.head-recheck.outputs.proceed == 'true' && steps.config.outputs.prepare == 'merge-base'
        env:
          GIT_AUTHOR_NAME: melodic-automation-lanes[bot]
          GIT_AUTHOR_EMAIL: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}+melodic-automation-lanes[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: melodic-automation-lanes[bot]
          GIT_COMMITTER_EMAIL: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}+melodic-automation-lanes[bot]@users.noreply.github.com
          LOOP_NO_PROGRESS: ${{ steps.merge-bin.outputs.no-progress }}
          # Replace refs from the head's history never stand in for objects.
          GIT_NO_REPLACE_OBJECTS: "1"
          BIN: ${{ runner.temp }}/merge-base-bin
          OUT: ${{ runner.temp }}/merge-base-out
          PREPARE_SHA256: ${{ steps.merge-bin.outputs.prepare-sha256 }}
          BUMP_SHA256: ${{ steps.merge-bin.outputs.resolve-version-bump-conflict-sha256 }}
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          BASE_SHA: ${{ steps.trusted-base.outputs.commit }}
        run: |
          check() {
            local sum
            sum=$(sha256sum <"$1")
            if [ "${sum%% *}" != "$2" ]; then
              echo "::error::$1 does not match the SHA-256 recorded when it was copied from the base"
              exit 1
            fi
          }
          check "$BIN/prepare.sh" "$PREPARE_SHA256"
          check "$BIN/resolve-version-bump-conflict.sh" "$BUMP_SHA256"
          # git's merge output names head files, so no line of it may run a
          # workflow command; commands resume before this step's own lines.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          result=$(bash "$BIN/prepare.sh" "$HEAD_SHA" "$BASE_SHA" "$BIN/resolve-version-bump-conflict.sh" "$OUT")
          echo "::$token::"
          state="" reason="" skip=""
          while IFS='=' read -r key value; do
            case $key in
              config-sha256 | snapshot-sha256)
                [[ $value =~ ^[0-9a-f]{64}$ ]] || { echo "::error::prepare.sh printed a malformed $key"; exit 1; }
                echo "$key=$value" >>"$GITHUB_OUTPUT"
                ;;
              attributes-sha256)
                [[ $value =~ ^([0-9a-f]{64}|absent)$ ]] || { echo "::error::prepare.sh printed a malformed $key"; exit 1; }
                echo "$key=$value" >>"$GITHUB_OUTPUT"
                ;;
              merge-state) state=$value ;;
              escalation-reason) reason=$value ;;
              *) echo "::error::prepare.sh printed an unknown key"; exit 1 ;;
            esac
          done <<<"$result"
          case $state:$reason in
            clean: | conflicted:) ;;
            escalate:protected-path-conflict | escalate:repeat-cap | escalate:unresolved-conflict)
              skip=awaiting-human
              ;;
            *) echo "::error::prepare.sh printed no valid merge-state and escalation-reason"; exit 1 ;;
          esac
          {
            echo "skip-reason=$skip"
            echo "merge-state=$state"
            echo "escalation-reason=$reason"
          } >>"$GITHUB_OUTPUT"
          echo "merge-state=$state escalation-reason=$reason"

      # claude-code-action's commit_files builds each commit on the live tip of
      # CLAUDE_BRANCH with file bytes from this checkout
      # (src/mcp/github-file-ops-server.ts:226-367 at ed670b4), so a push to
      # the PR branch during the run would have its edits to the same files
      # overwritten. The skill commits to a branch made at the gated SHA
      # instead, and a later step moves the PR branch to it only while the PR
      # branch is still at the gated SHA. In merge-base mode the commit step
      # below writes the merge commit to this branch; an escalation needs none.
      - name: Make the lane's commit branch at the gated SHA
        id: lane-branch
        if: >-
          steps.head-recheck.outputs.proceed == 'true' && steps.config.outputs.kind == 'skill'
          && steps.config.outputs.can-commit == 'true'
          && steps.prepare.outputs.merge-state != 'escalate'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          LANE_BRANCH: lane-commits/${{ inputs.lane }}/${{ inputs.activity }}/${{ github.run_id }}-${{ github.run_attempt }}
        with:
          github-token: ${{ steps.lane-token.outputs.token }}
          retries: 0
          script: |
            const { HEAD_SHA, LANE_BRANCH } = process.env;
            await github.rest.git.createRef({ ...context.repo, ref: `refs/heads/${LANE_BRANCH}`, sha: HEAD_SHA });
            core.setOutput('branch', LANE_BRANCH);

      # In merge-base mode only a conflicted merge needs the model.
      - name: Run the skill activity
        id: act-skill
        if: >-
          steps.head-recheck.outputs.proceed == 'true' && steps.config.outputs.kind == 'skill'
          && (steps.config.outputs.prepare != 'merge-base' || steps.prepare.outputs.merge-state == 'conflicted')
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        env:
          # Strips the OAuth token and other credentials from Bash, hook and
          # MCP subprocesses and gives Bash its own PID namespace, so /proc
          # shows no ancestor's env. It keeps GH_TOKEN and GITHUB_TOKEN, so a
          # subprocess still holds this activity's GitHub token
          # (code.claude.com/docs/en/env-vars, as of 2026-10-04; recheck when
          # the CLAUDE_CODE_SUBPROCESS_ENV_SCRUB row stops listing GH_TOKEN
          # and GITHUB_TOKEN as kept).
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          CLAUDE_BRANCH: ${{ steps.lane-branch.outputs.branch || steps.gate.outputs.head-ref }}
          TRUSTED_CONTEXT_FILE: >-
            ${{ steps.config.outputs.reads-untrusted == 'true'
            && format('{0}/trusted-context.json', runner.temp) || '' }}
        with:
          claude_code_oauth_token: ${{ secrets.claude-code-oauth-token }}
          github_token: ${{ steps.lane-token.outputs.token }}
          use_commit_signing: true
          # A dispatcher-sent run is started by github-actions[bot]; the
          # action refuses a bot actor unless it is listed. The trigger gate
          # has already checked the dispatcher run this id names.
          allowed_bots: ${{ inputs.dispatcher-run-id != '' && 'github-actions' || '' }}
          plugin_marketplaces: ${{ runner.temp }}/base-marketplace
          plugins: ${{ steps.stage.outputs.plugin }}
          prompt: ${{ steps.stage.outputs.prompt }}
          claude_args: >-
            --setting-sources user
            --permission-mode dontAsk
            ${{ steps.stage.outputs.claude-args }}

      # The reply is untrusted model text: it is read with jq and printed as
      # data, never interpolated into a command. The file path falls back to
      # the action's fixed location (base-action/src/execution-file.ts:6-13).
      # It is also uploaded below as audit evidence, since the REST API cannot
      # read step summaries; nothing in this workflow reads that artifact.
      - name: Show the skill's final reply
        if: always() && (steps.act-skill.outcome == 'success' || steps.act-skill.outcome == 'failure')
        env:
          EXECUTION_FILE: >-
            ${{ steps.act-skill.outputs.execution_file
            || format('{0}/claude-execution-output.json', runner.temp) }}
          REPLY_DIR: ${{ runner.temp }}/skill-reply
          # The model can read the lane token, so its reply could quote it;
          # the token is cut out before the reply is shown or uploaded.
          LANE_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: |
          mkdir -p "$REPLY_DIR"
          if [ ! -f "$EXECUTION_FILE" ]; then
            echo "No execution file to summarize" | tee "$REPLY_DIR/reply.txt"
            exit 0
          fi
          jq -r --arg token "$LANE_TOKEN" '[.[] | select(.type == "result")] | last | (.result // "")
            | if $token == "" then . else split($token) | join("[REDACTED]") end
            | .[:4000] | gsub("`"; "'"'"'")' \
            "$EXECUTION_FILE" >"$REPLY_DIR/reply.txt"
          {
            echo "### Skill reply"
            echo
            echo '```text'
            cat "$REPLY_DIR/reply.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # A slash command whose expansion fails, such as a skill pre-compute line
      # the permission mode denies, ends with a `success` result and no model
      # turn, so the act did nothing. This fails it and records why. The same
      # step runs in pr-run-activity-read.yml, which holds no lane token.
      - name: Check the skill took a model turn
        id: act-turns
        if: always() && (steps.act-skill.outcome == 'success' || steps.act-skill.outcome == 'failure')
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          EXECUTION_FILE: >-
            ${{ steps.act-skill.outputs.execution_file
            || format('{0}/claude-execution-output.json', runner.temp) }}
          REPLY_DIR: ${{ runner.temp }}/skill-reply
          LANE_TOKEN: ${{ steps.lane-token.outputs.token }}
        with:
          retries: 0
          script: |
            const fs = require('fs');
            const { EXECUTION_FILE, REPLY_DIR, LANE_TOKEN } = process.env;
            // Head code could have planted one; only this step's copy is uploaded.
            fs.rmSync(`${REPLY_DIR}/act-turns.json`, { force: true });
            const redact = (text) => (LANE_TOKEN ? text.split(LANE_TOKEN).join('[REDACTED]') : text);
            let messages = [];
            try {
              messages = JSON.parse(fs.readFileSync(EXECUTION_FILE, 'utf8'));
            } catch (error) {
              core.setFailed(`No readable execution file: ${error.code ?? error.name}`);
              return;
            }
            const result = messages.filter((m) => m.type === 'result').at(-1) ?? {};
            const textOf = (content) =>
              typeof content === 'string' ? content : (content ?? []).map((block) => block?.text ?? '').join('\n');
            const diag = {
              subtype: result.subtype ?? null,
              is_error: result.is_error ?? null,
              num_turns: result.num_turns ?? null,
              duration_ms: result.duration_ms ?? null,
              models: Object.keys(result.modelUsage ?? {}),
              // The CLI's own report of a failed slash command expansion.
              local_command_stderr: messages
                .filter((m) => m.type === 'user')
                .map((m) => textOf(m.message?.content))
                .filter((text) => text.includes('<local-command-stderr>'))
                .map((text) => redact(text).slice(0, 2000)),
            };
            fs.mkdirSync(REPLY_DIR, { recursive: true });
            fs.writeFileSync(`${REPLY_DIR}/act-turns.json`, `${JSON.stringify(diag, null, 2)}\n`);
            await core.summary
              .addHeading('Skill run', 3)
              // addCodeBlock does not escape its text.
              .addCodeBlock(JSON.stringify(diag, null, 2).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'), 'json')
              .write();
            // JSON escapes newlines, so no field can start a workflow command.
            core.info(JSON.stringify({ subtype: diag.subtype, is_error: diag.is_error, num_turns: diag.num_turns, models: diag.models.length }));
            if (!(diag.num_turns > 0) || diag.models.length === 0) {
              core.setFailed(
                'no-model-turn: the skill ended without a model turn, so it did nothing; ' +
                  'the step summary and the skill-reply artifact hold the result fields and any local-command stderr',
              );
            }

      - name: Upload the skill's final reply
        if: always() && (steps.act-skill.outcome == 'success' || steps.act-skill.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-reply-${{ inputs.lane }}-${{ inputs.activity }}-${{ github.run_attempt }}
          # Named files only: head code can write into this directory.
          path: |
            ${{ runner.temp }}/skill-reply/reply.txt
            ${{ runner.temp }}/skill-reply/act-turns.json
          retention-days: 7
          if-no-files-found: error

      # The verdict comes from the action's structured_output, read through env
      # and parsed by jq. Anything but exactly `pass` fails the activity; the
      # summary is model text, printed as data.
      - name: Check the gate skill's verdict
        id: skill-verdict
        if: always() && steps.act-skill.outcome == 'success' && steps.config.outputs.gating == 'gate'
        env:
          STRUCTURED_OUTPUT: ${{ steps.act-skill.outputs.structured_output }}
        run: |
          verdict=$(jq -r 'if type == "object" and (.verdict | type) == "string" then .verdict else "" end' <<<"$STRUCTURED_OUTPUT") || verdict=""
          summary=$(jq -r 'if type == "object" then (.summary // "" | tostring)[:4000] | gsub("`"; "'"'"'") else "" end' <<<"$STRUCTURED_OUTPUT") || summary=""
          {
            echo "### Gate verdict"
            echo
            echo '```text'
            printf 'verdict: %s\n\n%s\n' "$verdict" "$summary"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$verdict" != pass ]; then
            echo "::error::the gate skill's verdict is not pass"
            exit 1
          fi

      # merge-base mode, after the skill (or straight after a clean merge):
      # post.sh checks prepare's saved copies and snapshot against their
      # hashes, repairs the sensitive paths the action reset, and escalates
      # unresolved-conflict or workflow-staged; otherwise it writes the
      # validated index as a tree, the only tree the commit step accepts.
      - name: Check the staged merge
        id: post
        if: >-
          steps.config.outputs.prepare == 'merge-base' && steps.prepare.outcome == 'success'
          && (steps.prepare.outputs.merge-state == 'clean'
          || steps.act-skill.outcome == 'success' && steps.act-turns.outcome == 'success')
        env:
          BIN: ${{ runner.temp }}/merge-base-bin
          OUT: ${{ runner.temp }}/merge-base-out
          POST_SHA256: ${{ steps.merge-bin.outputs.post-sha256 }}
          CONFIG_SHA256: ${{ steps.prepare.outputs.config-sha256 }}
          ATTRIBUTES_SHA256: ${{ steps.prepare.outputs.attributes-sha256 }}
          SNAPSHOT_SHA256: ${{ steps.prepare.outputs.snapshot-sha256 }}
          GATED_HEAD: ${{ steps.gate.outputs.head-sha }}
          TRUSTED_BASE: ${{ steps.trusted-base.outputs.commit }}
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          sum=$(sha256sum <"$BIN/post.sh")
          if [ "${sum%% *}" != "$POST_SHA256" ]; then
            echo "::error::post.sh does not match the SHA-256 recorded when it was copied from the base"
            exit 1
          fi
          # git's output can name head files: no workflow commands meanwhile.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          result=$(bash "$BIN/post.sh" "$OUT")
          echo "::$token::"
          reason="" tree="" skip=""
          while IFS='=' read -r key value; do
            case $key in
              escalation-reason) reason=$value ;;
              tree) tree=$value ;;
              *) echo "::error::post.sh printed an unknown key"; exit 1 ;;
            esac
          done <<<"$result"
          case $reason in
            "")
              [[ $tree =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || { echo "::error::post.sh printed no tree"; exit 1; }
              ;;
            unresolved-conflict | workflow-staged)
              tree="" skip=awaiting-human
              ;;
            *) echo "::error::post.sh printed an unknown escalation reason"; exit 1 ;;
          esac
          {
            echo "skip-reason=$skip"
            echo "escalation-reason=$reason"
            echo "tree=$tree"
          } >>"$GITHUB_OUTPUT"
          echo "escalation-reason=$reason tree=$tree"

      # The merge commit, made through the Git Data API so GitHub signs it as
      # the App: parents [gated head, trusted base], no author, committer or
      # signature (T8-C). Its tree is post.sh's: tree-entries.sh lists what it
      # changes against the gated head, only blobs neither parent holds are
      # uploaded, and the tree GitHub builds must hash to post.sh's tree. The
      # commit goes to the lane branch, which must still be at the gated head;
      # the promote step below moves the PR branch. A pinned action with
      # /usr/bin/git under an allowlisted env, since the activity could have
      # changed PATH. A do-not-merge or human-gated label added during the run
      # stops it uncommitted (awaiting-human).
      - name: Commit the merge
        id: commit
        if: >-
          steps.post.outcome == 'success' && steps.post.outputs.escalation-reason == ''
          && steps.post.outputs.tree != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BIN: ${{ runner.temp }}/merge-base-bin
          TREE_ENTRIES_SHA256: ${{ steps.merge-bin.outputs.tree-entries-sha256 }}
          TREE: ${{ steps.post.outputs.tree }}
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          HEAD_REF: ${{ steps.gate.outputs.head-ref }}
          BASE_SHA: ${{ steps.trusted-base.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LANE_BRANCH: ${{ steps.lane-branch.outputs.branch }}
          PR_NUMBER: ${{ steps.gate.outputs.pr-number }}
          HOLD_LABEL: ${{ steps.merge-bin.outputs.hold-label }}
          READ_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.lane-token.outputs.token }}
          retries: 0
          script: |
            const { createHash, randomBytes } = require('crypto');
            const { execFileSync } = require('child_process');
            const { readFileSync } = require('fs');
            const { BIN, TREE_ENTRIES_SHA256, TREE, HEAD_SHA, HEAD_REF, BASE_SHA, DEFAULT_BRANCH, LANE_BRANCH } = process.env;
            const { PR_NUMBER, HOLD_LABEL, READ_TOKEN } = process.env;
            core.setOutput('commit', '');
            core.setOutput('skip-reason', '');
            if (!LANE_BRANCH) {
              core.setFailed('No lane branch to commit the merge to');
              return;
            }
            const script = `${BIN}/tree-entries.sh`;
            if (createHash('sha256').update(readFileSync(script)).digest('hex') !== TREE_ENTRIES_SHA256) {
              core.setFailed('tree-entries.sh does not match the SHA-256 recorded when it was copied from the base');
              return;
            }
            const laneRef = `heads/${LANE_BRANCH}`;
            const ref = async (name) =>
              (await github.request('GET /repos/{owner}/{repo}/git/ref/{ref}', { ...context.repo, ref: name })).data.object.sha;
            const laneTip = await ref(laneRef);
            if (laneTip !== HEAD_SHA) {
              core.setFailed(`The lane branch moved from ${HEAD_SHA} to ${laneTip}; the merge is not committed`);
              return;
            }
            // An allowlisted environment and absolute binaries: nothing the
            // activity left in this job's env or PATH reaches git.
            const gitEnv = {
              PATH: '/usr/bin:/bin',
              HOME: process.env.HOME,
              GIT_CONFIG_GLOBAL: '/dev/null',
              GIT_CONFIG_NOSYSTEM: '1',
              GIT_NO_REPLACE_OBJECTS: '1',
            };
            // git's stderr can name head files, so workflow commands stop
            // while it runs and resume before this step's own messages.
            const quiet = (run) => {
              const token = randomBytes(16).toString('hex');
              console.log(`::stop-commands::${token}`);
              try {
                return run();
              } finally {
                console.log(`::${token}::`);
              }
            };
            const git = (args) =>
              quiet(() =>
                execFileSync('/usr/bin/git', ['-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=', '-c', 'diff.external=', ...args], {
                  env: gitEnv,
                  maxBuffer: 1 << 30,
                }),
              );
            const listing = quiet(() =>
              execFileSync('/usr/bin/bash', [script, HEAD_SHA, BASE_SHA, TREE], { env: gitEnv, encoding: 'utf8', maxBuffer: 1 << 28 }),
            );
            const entries = [];
            let created = 0;
            for (const line of listing.split('\n').filter(Boolean)) {
              const tab = line.indexOf('\t');
              const [mode, sha, flag] = line.slice(0, tab).split(' ');
              const path = line.slice(tab + 1);
              if (sha === 'null') {
                entries.push({ path, mode, type: mode === '160000' ? 'commit' : 'blob', sha: null });
                continue;
              }
              if (flag === 'create-blob') {
                const content = git(['cat-file', 'blob', sha]).toString('base64');
                const blob = await github.rest.git.createBlob({ ...context.repo, content, encoding: 'base64' });
                if (blob.data.sha !== sha) {
                  core.setFailed(`GitHub stored the blob for ${JSON.stringify(path)} as ${blob.data.sha}, not ${sha}`);
                  return;
                }
                created += 1;
              }
              entries.push({ path, mode, type: mode === '160000' ? 'commit' : 'blob', sha });
            }
            core.info(`created ${created} blobs`);
            const headTree = (await github.rest.git.getCommit({ ...context.repo, commit_sha: HEAD_SHA })).data.tree.sha;
            const tree = entries.length
              ? (await github.rest.git.createTree({ ...context.repo, base_tree: headTree, tree: entries })).data.sha
              : headTree;
            if (tree !== TREE) {
              core.setFailed(`GitHub built tree ${tree}, not the checked tree ${TREE}; the merge is not committed`);
              return;
            }
            // A hold placed while the run worked stops it here, before any
            // commit: the kill switch only stops new runs. Labels are read
            // fresh with the job's read-only token.
            // github-script v8.0.0 gives the script no way to build a second
            // client, so the read-only token is used through fetch.
            const labelsResponse = await fetch(
              `${process.env.GITHUB_API_URL}/repos/${context.repo.owner}/${context.repo.repo}/issues/${Number(PR_NUMBER)}/labels?per_page=100`,
              { headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${READ_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28' } },
            );
            if (!labelsResponse.ok) {
              core.setFailed(`Reading the PR labels answered ${labelsResponse.status}; the merge is not committed`);
              return;
            }
            // Only the first page is read; more labels than one page holds
            // could hide a hold, so that fails instead.
            if (/rel="next"/.test(labelsResponse.headers.get('link') ?? '')) {
              core.setFailed('The PR has more labels than one page holds; the merge is not committed');
              return;
            }
            const labels = await labelsResponse.json();
            const held = labels.map((label) => label.name).filter((name) => name === 'do-not-merge' || name === HOLD_LABEL);
            if (held.length) {
              core.info(`The PR is held (${held.join(', ')}); the merge is not committed`);
              core.setOutput('skip-reason', 'awaiting-human');
              return;
            }
            // The trailer is what prepare.sh's repeat cap counts.
            const message = `Merge ${DEFAULT_BRANCH} into ${HEAD_REF}\n\nLane-Activity: pr-unblock/resolve-conflicts\n`;
            const commit = await github.rest.git.createCommit({ ...context.repo, message, tree, parents: [HEAD_SHA, BASE_SHA] });
            // force: false refuses anything but a fast-forward from the gated head.
            await github.rest.git.updateRef({ ...context.repo, ref: laneRef, sha: commit.data.sha, force: false });
            core.setOutput('commit', commit.data.sha);
            core.info(`Committed ${commit.data.sha} (parents ${HEAD_SHA}, ${BASE_SHA}) to ${LANE_BRANCH}`);

      # Fast-forwards the PR branch to the lane's commits only while it is
      # still at the gated SHA; otherwise the commits are dropped and the run
      # the new head started redoes the activity. A pinned action, like the
      # revoke step, since the activity could have changed PATH. The lane
      # branch is deleted either way.
      - name: Move the PR branch to the lane's commits
        id: promote
        if: always() && steps.lane-branch.outputs.branch != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          HEAD_REF: ${{ steps.gate.outputs.head-ref }}
          LANE_BRANCH: ${{ steps.lane-branch.outputs.branch }}
          # merge-base mode moves the PR branch only to the commit step's own
          # commit: the model holds a contents-write token and could have
          # written the lane branch itself.
          MERGE_BASE: ${{ steps.config.outputs.prepare == 'merge-base' }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit }}
        with:
          github-token: ${{ steps.lane-token.outputs.token }}
          retries: 0
          script: |
            const { HEAD_SHA, HEAD_REF, LANE_BRANCH, MERGE_BASE, COMMIT_OUTCOME, COMMIT_SHA } = process.env;
            const tip = async (branch) =>
              (await github.request('GET /repos/{owner}/{repo}/git/ref/{ref}', { ...context.repo, ref: `heads/${branch}` }))
                .data.object.sha;
            try {
              const lane = await tip(LANE_BRANCH);
              if (lane === HEAD_SHA) {
                core.info('The activity made no commits');
                return;
              }
              if (MERGE_BASE === 'true' && (COMMIT_OUTCOME !== 'success' || !COMMIT_SHA || lane !== COMMIT_SHA)) {
                core.setFailed(`The lane branch is at ${lane}, not a merge commit the commit step made; the PR branch is not moved`);
                return;
              }
              const head = await tip(HEAD_REF);
              if (head !== HEAD_SHA) {
                core.setFailed(`The PR branch moved from ${HEAD_SHA} to ${head} during the run, so the lane's commits (${lane}) are not applied; the run for the new head redoes the activity`);
                return;
              }
              // force: false refuses anything but a fast-forward.
              await github.rest.git.updateRef({ ...context.repo, ref: `heads/${HEAD_REF}`, sha: lane, force: false });
              // The push is confirmed from git/ref, which GET /pulls can lag.
              const moved = await tip(HEAD_REF);
              if (moved !== lane) {
                core.setFailed(`The PR branch reads ${moved} after the update to ${lane}`);
                return;
              }
              core.info(`Moved ${HEAD_REF} from ${HEAD_SHA} to ${lane}`);
            } finally {
              // A failed cleanup must not fail an activity whose commits landed.
              await github.rest.git
                .deleteRef({ ...context.repo, ref: `heads/${LANE_BRANCH}` })
                .catch((error) => core.warning(`Could not delete ${LANE_BRANCH}: ${error.message}`));
            }

      # A script that gets GH_TOKEN must not execute code from the PR head.
      - name: Run the script activity
        id: act-script
        if: steps.head-recheck.outputs.proceed == 'true' && steps.config.outputs.kind == 'script'
        env:
          SCRIPT: ${{ steps.config.outputs.script }}
          RESOLVED: ${{ runner.temp }}/resolved-config.json
          LANE_TOKEN: ${{ steps.lane-token.outputs.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr-number }}
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          BASE_SHA: ${{ steps.trusted-base.outputs.commit }}
          # Checked against the escalation enum by the job's first step.
          ESCALATION_REASON: ${{ inputs.escalation-reason }}
          TRACKER_CONFIG: ${{ runner.temp }}/base-script/.work-item-tracker.json
          TRACKER_SHA256: ${{ steps.tracker-config.outputs.sha256 }}
          SKIP_REASON_FILE: ${{ runner.temp }}/skip-reason
        run: |
          if [ "$TRACKER_SHA256" = absent ]; then
            if [ -e "$TRACKER_CONFIG" ]; then
              echo "::error::a tracker config appeared that the base does not have"
              exit 1
            fi
          else
            sum=$(sha256sum <"$TRACKER_CONFIG")
            if [ "${sum%% *}" != "$TRACKER_SHA256" ]; then
              echo "::error::the tracker config does not match the SHA-256 recorded when it was copied from the base"
              exit 1
            fi
          fi
          ACTIVITY_ARGS=$(jq -r '.selected.args // ""' "$RESOLVED")
          export ACTIVITY_ARGS
          unset GH_TOKEN GITHUB_TOKEN
          if [ -n "$LANE_TOKEN" ]; then
            export GH_TOKEN="$LANE_TOKEN"
          fi
          unset LANE_TOKEN RESOLVED
          rm -f "$SKIP_REASON_FILE"
          "$RUNNER_TEMP/base-script/$(basename "$SCRIPT")"
          reason=""
          if [ -s "$SKIP_REASON_FILE" ]; then
            reason=$(head -n 1 "$SKIP_REASON_FILE" | tr -d '\r')
            if ! [[ $reason =~ ^[a-z]+(-[a-z]+)*$ ]]; then
              echo "::error::the skip reason file holds no skip reason"
              exit 1
            fi
          fi
          echo "skip-reason=$reason" >>"$GITHUB_OUTPUT"

      # Written after head code ran, so the report job only cross-checks it.
      - name: Write the verdict
        if: always()
        env:
          LANE: ${{ inputs.lane }}
          ACTIVITY: ${{ inputs.activity }}
          KILL_PROCEED: ${{ steps.kill.outputs.proceed }}
          KILL_REASON: ${{ steps.kill.outputs.reason }}
          TRIGGER_PROCEED: ${{ steps.gate.outputs.proceed }}
          TRIGGER_REASON: ${{ steps.gate.outputs.reason }}
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          SKIP_REASON: >-
            ${{ steps.config.outputs.skip-reason || steps.head-recheck.outputs.skip-reason
            || steps.prepare.outputs.skip-reason || steps.post.outputs.skip-reason
            || steps.commit.outputs.skip-reason || steps.act-script.outputs.skip-reason }}
          ACT_OUTCOME: >-
            ${{ steps.act-skill.outcome == 'skipped' && steps.prepare.outputs.merge-state == 'clean'
            && ((steps.post.outputs.escalation-reason != ''
            || steps.commit.outcome == 'success' && steps.promote.outcome == 'success') && 'success' || 'failure')
            || steps.act-skill.outcome == 'success'
            && (steps.config.outputs.gating == 'gate' && steps.skill-verdict.outcome != 'success'
            || steps.promote.outcome == 'failure' || steps.act-turns.outcome != 'success'
            || steps.commit.outcome == 'failure'
            || steps.post.outputs.tree != '' && steps.commit.outcome != 'success') && 'failure'
            || steps.act-skill.outcome != 'skipped' && steps.act-skill.outcome
            || steps.act-script.outcome }}
          VERDICT_DIR: ${{ runner.temp }}/verdict
        run: |
          mkdir -p "$VERDICT_DIR"
          jq -n \
            --arg lane "$LANE" \
            --arg activity "$ACTIVITY" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg head "$HEAD_SHA" \
            --arg kill_proceed "$KILL_PROCEED" --arg kill_reason "$KILL_REASON" \
            --arg trigger_proceed "$TRIGGER_PROCEED" --arg trigger_reason "$TRIGGER_REASON" \
            --arg config "$CONFIG_OUTCOME" \
            --arg skip "$SKIP_REASON" \
            --arg act "$ACT_OUTCOME" \
            'def gate($proceed; $reason): if $proceed == "" then null else {proceed: $proceed, reason: $reason} end;
            def nullable: if . == "" then null else . end;
            {
              version: 1,
              lane: $lane,
              activity: $activity,
              "run-url": $run_url,
              "head-sha": ($head | nullable),
              gates: {"kill-switch": gate($kill_proceed; $kill_reason), trigger: gate($trigger_proceed; $trigger_reason)},
              config: ({success: "valid", failure: "invalid"}[$config] // "not-read"),
              "skip-reason": ($skip | nullable),
              outcome: (if $act == "success" or $act == "failure" or $act == "skipped" then $act else "not-run" end),
              "dirty-tree": null
            }' >"$VERDICT_DIR/verdict.json"

      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdict-${{ inputs.lane }}-${{ inputs.activity }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verdict/verdict.json
          if-no-files-found: error

      # The token would live an hour; revoking it ends it now (probe P5 found
      # revocation immediate). A pinned action rather than a shell step, so no
      # binary resolved through PATH or BASH_ENV, which the activity could have
      # changed, runs with the token. The step fails red unless the revoke
      # returns 204 and a later call with the token is refused with 401.
      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ steps.lane-token.outputs.token }}
          retries: 0
          script: |
            const status = async (route) => {
              try {
                return (await github.request(route)).status;
              } catch (error) {
                return error.status ?? `error: ${error.message}`;
              }
            };
            const revoke = await status('DELETE /installation/token');
            const after = await status('GET /installation/repositories');
            core.info(`DELETE /installation/token: ${revoke}; then GET /installation/repositories: ${after}`);
            if (revoke !== 204 || after !== 401) {
              core.setFailed(`the lane token was not confirmed revoked (DELETE ${revoke}, GET ${after}); it expires within the hour`);
            }

  report:
    needs: run
    # Fork PRs get a read-only GITHUB_TOKEN that cannot write checks, and the
    # lanes App's own pull_request events skip the run job.
    if: >-
      always()
      && !(github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && !(github.event_name == 'pull_request'
      && format('{0}', github.event.sender.id) == vars.AUTOMATION_LANES_APP_SENDER_ID)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      # The default branch tip, then the run job's base SHA only when the
      # default branch holds it. The event's base SHA is never checked out:
      # a PR into another branch would choose the actions that post its check.
      - name: Assert the default branch is set
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error::the event names no default branch"
            exit 1
          fi

      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the run job's base SHA when the default branch holds it
        env:
          BASE_SHA: ${{ needs.run.outputs.base-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ $BASE_SHA =~ ^[0-9a-f]{40}$ ]] &&
            git -C .base merge-base --is-ancestor "$BASE_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            git -C .base checkout -q --detach "$BASE_SHA"
          else
            echo "No base SHA on the default branch; staying on the default branch tip"
          fi

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # A run job that never uploaded a verdict is already a failure, or a
      # neutral superseded-sha on a cancel, in report-check-run's decision.
      - name: Download the verdict
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verdict-${{ inputs.lane }}-${{ inputs.activity }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verdict

      - name: Check the lane's commits are signed
        id: signed
        if: >-
          always()
          && needs.run.outputs.can-commit != 'false'
          && needs.run.outputs.pr-number != ''
        uses: ./.base/.github/actions/check-signed-commits # zizmor: ignore[self-repository]
        with:
          pr-number: ${{ needs.run.outputs.pr-number }}
          since-sha: ${{ needs.run.outputs.head-sha }}
          github-token: ${{ github.token }}

      # A cancelled run is superseded only when the PR has a newer head.
      # GET /pulls can lag a push such as the promote step's, so when the
      # branch's git/ref is readable the pull is re-read until its head
      # matches, at most 5 reads 2 s apart; the last read stands.
      - name: Read the PR's current head SHA
        id: pr-head
        if: always()
        env:
          PR_NUMBER: ${{ needs.run.outputs.pr-number || github.event.pull_request.number || inputs.pr-number }}
          HEAD_REF: ${{ needs.run.outputs.head-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=""
          if [[ $PR_NUMBER =~ ^[1-9][0-9]*$ ]]; then
            ref_sha=""
            if [ -n "$HEAD_REF" ]; then
              ref=$(jq -rn --arg ref "$HEAD_REF" '$ref | split("/") | map(@uri) | join("/")')
              ref_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --jq .object.sha) || ref_sha=""
            fi
            for attempt in 1 2 3 4 5; do
              sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha) || sha=""
              if [ -z "$ref_sha" ] || [ "$sha" = "$ref_sha" ] || [ "$attempt" = 5 ]; then
                break
              fi
              sleep 2
            done
          fi
          if ! [[ $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "No PR head SHA read"
            sha=""
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # Off pull_request, an empty run head SHA would fall back to github.sha,
      # the dispatch ref, which is not the PR's commit, so nothing is posted.
      - name: Note that no check is posted without a head SHA
        if: >-
          always() && github.event_name != 'pull_request'
          && needs.run.outputs.head-sha == ''
        run: echo "The run job gated no head SHA, so no check run is posted." >>"$GITHUB_STEP_SUMMARY"

      - name: Post the check run
        if: >-
          always() && !(github.event_name != 'pull_request'
          && needs.run.outputs.head-sha == '')
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: ${{ inputs.lane }}
          activity: ${{ inputs.activity }}
          run-result: ${{ needs.run.result }}
          act-outcome: ${{ needs.run.outputs.act-outcome }}
          gate-reason: ${{ needs.run.outputs.gate-reason }}
          head-sha: ${{ needs.run.outputs.head-sha }}
          pr-head-sha: ${{ steps.pr-head.outputs.sha }}
          can-commit: ${{ needs.run.outputs.can-commit }}
          all-verified: ${{ steps.signed.outputs.all-verified }}
          verdict-path: ${{ runner.temp }}/verdict/verdict.json
          base-path: .base
          head-sha-fallback: ${{ github.event.pull_request.head.sha || github.sha }}
          github-token: ${{ github.token }}
