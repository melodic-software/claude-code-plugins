name: pr-run-activity-write

# Runs one write activity (any effect but `read`) of one PR pipeline lane and
# reports it as the check run `<lane> / <activity>`. The run job gates,
# resolves the base-SHA config, fails red on a `read` effect, gets the App
# token the effect grants from the lanes token broker with its OIDC token
# before any head checkout, runs a skill or a script, and revokes the token;
# the report job writes the check from the run job's runner-computed outputs.
# In issue mode it runs scripts only (apply-issue-patch, report-outcome); an
# issue's skill runs in pr-run-activity-read.yml with no write token.
# Neither file references the App key. Read activities run in
# pr-run-activity-read.yml, whose head-code job holds no OIDC token.
# Job contract: docs/conventions/pr-pipeline/pr-run-activity.md.
#
# Every action runs from the base-SHA checkout at ./.base. zizmor's
# self-repository advice (`$/...`) is ignored on those lines: `$/` loads the
# action from this workflow's own commit, which on pull_request is the PR's
# merge commit, not the base.

on:
  workflow_call:
    inputs:
      lane:
        description: The lane, its caller workflow's file stem.
        required: true
        type: string
      activity:
        description: The activity to run from the lane's slots.
        required: true
        type: string
      config-path:
        description: The config, relative to the base checkout. For test callers only.
        required: false
        type: string
        default: docs/conventions/pr-pipeline.yaml
      pr-number:
        description: The PR on workflow_dispatch; ignored for other events.
        required: false
        type: string
        default: ""
      issue-number:
        description: >-
          Issue mode: the issue an issues lane works, on an issues event only.
          There is no PR: the trusted base is the default branch tip, a skill
          commits to a new branch, and no check run is posted.
        required: false
        type: string
        default: ""
      app-label:
        description: >-
          Issue mode: the one label the lanes App may apply to start the lane.
          Empty keeps every App event stopped.
        required: false
        type: string
        default: ""
      reuse-branch:
        description: >-
          Issue mode, report-outcome: the lane branch the resolve-issue run
          found an earlier run left with commits and no report, so it ran only
          the read-only summary pass; its reuse-branch output. Empty otherwise.
        required: false
        type: string
        default: ""
      runner-checks:
        description: >-
          Issue mode, report-outcome: the caller's run-checks job output, the
          activity's checks as the runner ran them, set only when that job
          succeeded. Empty otherwise.
        required: false
        type: string
        default: ""
      dimension-skip:
        description: >-
          Issue mode, report-outcome: the issue-dimension skip reason
          (split-required, research-first or probe-first) that
          kept the run from starting; report-outcome hands the issue to a
          person with the next step. Empty otherwise.
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: The run job's timeout in minutes.
        required: false
        type: number
        default: 30
      issue-dimensions:
        description: >-
          Issue mode: the dimensions the caller resolved when it set
          timeout-minutes (models.issue-dimensions); the run takes them
          instead of reading the issue's fields again. Empty reads them.
        required: false
        type: string
        default: ""
      dispatcher-run-id:
        description: >-
          On a workflow_dispatch sent by github-actions[bot], the
          pr-unblock-dispatch.yml or pr-feedback-dispatch.yml run that sent
          it; empty otherwise.
        required: false
        type: string
        default: ""
      trusted-base:
        description: >-
          pr-base trusts the PR's base SHA; default-tip trusts the default
          branch tip, for a lane whose PR keeps a stale base (a merge conflict).
        required: false
        type: string
        default: pr-base
      escalation-reason:
        description: >-
          For a report-escalation script activity, the escalation-reason output
          of the run that escalated; in issue mode, for report-outcome,
          apply-issue-patch's (a patch-* reason). Exported to the script as
          ESCALATION_REASON.
        required: false
        type: string
        default: ""
      review-replies:
        description: >-
          For the reply script of an address-feedback round: download the
          review-thread replies the model run uploaded in this workflow run
          and pass them to the script as FEEDBACK_REPLIES_DIR.
        required: false
        type: boolean
        default: false
      review-run-sha256:
        description: >-
          With review-replies, the SHA-256 of the run.json the caller's select
          job wrote (pr-unblock's address-feedback-select run-sha256); the
          reply script refuses a run.json with any other SHA-256.
        required: false
        type: string
        default: ""
      expected-upstream-head:
        description: >-
          For a job after pr-unblock's model job on a pr-feedback-dispatch.yml
          dispatch, that job's head-sha output: the gate and the broker accept
          the review of that head when only commits GitHub signed for the lanes App during the run
          follow it. Empty otherwise.
        required: false
        type: string
        default: ""
      review-run-attempt:
        description: >-
          With review-replies, the select job's context-attempt output: the
          attempt whose feedback-context-<attempt> artifact holds run.json.
          Empty downloads nothing, which the reply script refuses as
          feedback-invalid.
        required: false
        type: string
        default: ""
      review-replies-attempt:
        description: >-
          With review-replies, the read runner's feedback-attempt output, set
          only by its scan job: the attempt whose
          feedback-replies-<lane>-address-feedback-<attempt> artifact holds
          the scanned replies, and the model run the round marker names. Empty
          downloads none: with no replies, no patch and no scan refusal, the
          reply script posts a no-model-turn skip.
        required: false
        type: string
        default: ""
      review-replies-sha256:
        description: >-
          With review-replies, the read runner's feedback-sha256 output, set
          only by its scan job from the replies it uploaded. A replies file
          with another SHA-256 is refused as feedback-invalid.
        required: false
        type: string
        default: ""
      review-patch-state:
        description: >-
          With review-replies, the same read runner call's scan-patch-state.
          With no replies, the reply script skips no-model-turn only when this,
          review-replies-attempt and review-replies-sha256 are empty and no
          scan refusal marker downloaded.
        required: false
        type: string
        default: ""
      review-adjudication-attempt:
        description: >-
          With review-replies, pr-unblock's adjudicate-feedback job's attempt
          output: the attempt whose feedback-adjudication-<attempt> artifact
          holds the verdicts on the round's INCORRECT replies. Empty downloads
          none, and the reply script escalates each INCORRECT thread as
          feedback-unadjudicated.
        required: false
        type: string
        default: ""
      review-adjudication-sha256:
        description: >-
          With review-replies, that job's sha256 output, from the verdicts it
          uploaded. Verdicts with another SHA-256 read as none.
        required: false
        type: string
        default: ""
      dependency-verdict:
        description: >-
          For the verdict script of a review-dependency round: download the
          select job's context.json and the verdict the read runner's scan job
          uploaded in this workflow run, and pass both to the script as
          DEPENDENCY_VERDICT_DIR.
        required: false
        type: boolean
        default: false
      dependency-context-attempt:
        description: >-
          With dependency-verdict, the select job's context-attempt output: the
          attempt whose dependency-context-<attempt> artifact holds
          context.json. Empty downloads nothing, which the verdict script
          refuses as dependency-invalid.
        required: false
        type: string
        default: ""
      dependency-run-sha256:
        description: >-
          With dependency-verdict, the SHA-256 of the context.json the caller's
          select job wrote (pr-unblock's review-dependency-select run-sha256);
          the verdict script refuses a context.json with any other SHA-256.
        required: false
        type: string
        default: ""
      dependency-head-sha:
        description: >-
          With dependency-verdict, the head the select job read, which the
          verdict script requires context.json to name.
        required: false
        type: string
        default: ""
      dependency-run-attempt:
        description: >-
          With dependency-verdict, the read runner's dependency-attempt output,
          set only by its scan job: the attempt whose
          dependency-verdict-<lane>-review-dependency-<attempt> artifact holds
          the scanned verdict, and the model run the round marker names. Empty
          downloads none: no verdict arrived.
        required: false
        type: string
        default: ""
      dependency-verdict-sha256:
        description: >-
          With dependency-verdict, the read runner's dependency-sha256 output,
          set only by its scan job from the verdict it uploaded. A verdict with
          another SHA-256 is refused as dependency-invalid.
        required: false
        type: string
        default: ""
      dependency-patch-state:
        description: >-
          With dependency-verdict, the same read runner call's scan-patch-state.
          With no verdict, the verdict script skips no-model-turn only when
          this is empty and no scan refusal marker downloaded.
        required: false
        type: string
        default: ""
      patch-state:
        description: >-
          For a prepare: apply-patch script, the model job's patch-state
          output (written or empty); anything else escalates ci-fix-invalid.
        required: false
        type: string
        default: ""
      patch-sha256:
        description: With patch-state written, the model job's patch-sha256 output.
        required: false
        type: string
        default: ""
      patch-attempt:
        description: >-
          With patch-state written, the model job's patch-attempt output: the
          attempt whose patch-<lane>-<activity>-<attempt> artifact to download.
        required: false
        type: string
        default: ""
      patch-activity:
        description: The activity that wrote the patch and the report, which names both artifacts.
        required: false
        type: string
        default: ""
      patch-prepare:
        description: >-
          The patch-activity's prepare mode in the base config (ci-context for
          fix-ci), which picks its patch-rules.json row; empty for none.
        required: false
        type: string
        default: ""
      patch-head-sha:
        description: >-
          The model job's head-sha output: the head the patch was made on. A
          gated head that differs skips superseded-sha.
        required: false
        type: string
        default: ""
      patch-merge-base-sha:
        description: >-
          apply-patch with patch-prepare merge-base: the default branch commit
          the caller's select job pinned and merged, the merge commit's second
          parent; it must be on the default branch.
        required: false
        type: string
        default: ""
      patch-merge-state:
        description: >-
          apply-patch with patch-prepare merge-base: the select job's
          merge-state, clean (committed with no patch) or conflicted.
        required: false
        type: string
        default: ""
      patch-conflict-tree:
        description: >-
          apply-patch with patch-prepare merge-base: the conflict tree the
          select job's merge reached. This job merges patch-merge-base-sha into
          the gated head again and fails red unless it reaches the same state
          and tree, then applies the patch to that tree.
        required: false
        type: string
        default: ""
      patch-threads-attempt:
        description: >-
          apply-patch with patch-prepare review-threads: the attempt whose
          feedback-context-<attempt> artifact holds the caller's select job's
          thread file, whose kept threads the kept-threads rule reads.
        required: false
        type: string
        default: ""
      patch-threads-sha256:
        description: With patch-threads-attempt, that thread file's SHA-256.
        required: false
        type: string
        default: ""
      patch-verdict-attempt:
        description: >-
          apply-patch with patch-prepare dependency-review: the read runner's
          dependency-attempt output, the attempt whose
          dependency-verdict-<lane>-review-dependency-<attempt> artifact holds
          the scanned verdict the row's dependency-verdict requirement reads.
        required: false
        type: string
        default: ""
      patch-verdict-sha256:
        description: With patch-verdict-attempt, that verdict's SHA-256 from the scan job.
        required: false
        type: string
        default: ""
      patch-fix-requested:
        description: >-
          apply-patch: a base-code job's verdict on the human-gated label.
          `true` leaves the label out of the holds: under review-threads the
          select job kept only threads a trusted person with write access
          asked the lane to fix, or a lane escalation put the label on; under
          another row another lane's escalation put it on (lane-hold.mjs,
          fix-ci-context.mjs).
        required: false
        type: string
        default: ""
      patch-model-rung:
        description: >-
          apply-patch: the model rung the patch's producer ran at, empty or 0
          its profile's, 1 the rung above. At 0 an empty fix-ci patch whose
          report escalated only unfixed or not-reproducible checks skips
          rung-up instead of escalating, so the caller runs the producer once
          more at rung 1. A rung-1 run's verdict artifact carries its own name.
        required: false
        type: string
        default: ""
      patch-base-sha:
        description: >-
          Issue mode, apply-patch: the read runner's scan-base-sha output, the
          default branch commit a new run's patch was made on, as its
          issue-fields job checked it; the new lane branch starts there.
        required: false
        type: string
        default: ""
      patch-resume-tip:
        description: >-
          Issue mode, apply-patch: the read runner's scan-resume-tip output,
          the earlier lane branch tip a resumed run's patch was made on, as its
          issue-fields job re-derived it; the new lane branch starts there
          instead. Empty otherwise.
        required: false
        type: string
        default: ""
      reply-attempt:
        description: >-
          The model job's reply-attempt output: the attempt whose skill-reply
          artifact holds its report. Empty reads no report.
        required: false
        type: string
        default: ""
      role:
        description: >-
          The funding role whose secret the caller passes, as in
          docs/conventions/pr-pipeline.yaml `funding:`.
        required: true
        type: string
    secrets:
      claude-code-oauth-token:
        description: Claude Code OAuth token for skill activities.
        required: false
    outputs:
      escalation-reason:
        description: >-
          Why the activity handed the PR to a person: for the
          review-replies script feedback-uncertain, feedback-not-landed or
          feedback-invalid, feedback-partial, feedback-incomplete,
          feedback-disputed, feedback-unadjudicated, feedback-question-intent,
          feedback-question-design or feedback-question-security; for the
          dependency-verdict script
          dependency-invalid, dependency-fix-not-landed, dependency-config-unreadable,
          dependency-files-truncated, dependency-control-uncited,
          dependency-workflow-unpinned, dependency-fix-refused,
          dependency-security-close or dependency-escalate; for apply-patch, before the mint,
          ci-fix-empty, ci-fix-invalid or ci-fix-escalated, and from its
          script ci-fix-invalid, ci-fix-protected-path or ci-fix-not-applied;
          for issue-mode apply-patch, patch-empty, patch-invalid,
          patch-not-applied or patch-protected-path; for apply-patch under
          patch-prepare merge-base, unresolved-conflict, workflow-staged,
          unexpected-path-staged, conflict-patch-invalid,
          conflict-patch-not-applied or conflict-patch-protected-path; empty
          otherwise.
          Set only by runner steps and the base's reply and verdict scripts.
        value: ${{ jobs.run.outputs.escalation-reason }}
      rung-up:
        description: >-
          apply-patch: `true` when the patch's select skipped rung-up, so the
          caller runs the producer once more one model rung up; else `false`.
        value: ${{ jobs.run.outputs.rung-up }}
      patch-skip-reason:
        description: >-
          apply-patch: the skip reason the patch's select gave, empty when it
          proceeded.
        value: ${{ jobs.run.outputs.patch-skip-reason }}
      head-sha:
        description: The PR head the gate passed, before any push of this run. Set only by runner steps.
        value: ${{ jobs.run.outputs.head-sha }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  run:
    # The lanes App's own pull_request events never start a lane.
    if: >-
      !(github.event_name == 'pull_request'
      && format('{0}', github.event.sender.id) == vars.AUTOMATION_LANES_APP_SENDER_ID)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # id-token: write is only for the broker request. Any step of this job can
    # request an OIDC token for another audience: an accepted residual (ADR
    # 0058), bounded by the broker's one mint per job.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    # The report job trusts only these, all computed by runner steps. Every
    # one but act-outcome and escalation-reason is a step outcome or an
    # output of a step that ran before any PR head code. act-outcome reads
    # steps that run after the skill: for a gate skill the verdict step, so a
    # gate skill must not execute head code; its promote and turn terms only
    # turn a success into a failure. The act-result step turns a failed skill
    # step into a success only when the execution file's result message is a
    # success over the turn cap, a shape the CLI writes and a finished run
    # could report anyway. escalation-reason comes from the base's reply,
    # verdict and apply-patch scripts, which run no model and no head code.
    outputs:
      base-sha: ${{ steps.trusted-base.outputs.commit }}
      head-sha: ${{ steps.gate.outputs.head-sha }}
      head-ref: ${{ steps.gate.outputs.head-ref }}
      pr-number: ${{ steps.gate.outputs.pr-number }}
      gate-reason: >-
        ${{ steps.kill.outputs.proceed != 'true' && steps.kill.outputs.reason
        || steps.gate.outputs.proceed != 'true' && steps.gate.outputs.reason
        || '' }}
      can-commit: ${{ steps.config.outputs.can-commit }}
      escalation-reason: >-
        ${{ steps.act-script.outputs.escalation-reason || steps.patch-select.outputs.escalation-reason }}
      rung-up: ${{ steps.patch-select.outputs.skip-reason == 'rung-up' }}
      patch-skip-reason: ${{ steps.patch-select.outputs.skip-reason }}
      # The base action's own failure text, so the report names why the run
      # job failed before its act step.
      run-failure: ${{ steps.lane-token.outputs.failure-reason }}
      # The lane record, from steps that read the execution file after the
      # skill. A forged limit stop can only restart the lane after a reset
      # limit-stop.mjs and report-outcome clamp to at least
      # `limits.reset-clamp-min` hours away, at
      # most `limits.limit-stops-per-head` (a PR) or
      # `limits.limit-stops-per-issue` (an issue) times.
      lane-class: ${{ steps.lane-record.outputs.failure-class }}
      lane-resets: ${{ steps.lane-record.outputs.resets-at }}
      lane-turns: ${{ steps.lane-record.outcome == 'success' && steps.act-turns.outputs.turns || '' }}
      lane-max-turns: ${{ steps.lane-record.outcome == 'success' && steps.config.outputs.max-turns || '' }}
      lane-models: ${{ steps.lane-record.outcome == 'success' && steps.act-turns.outputs.models || '' }}
      lane-profile: ${{ steps.lane-record.outcome == 'success' && steps.config.outputs.profile || '' }}
      # A gate skill succeeds only on a `pass` verdict, a skill that took no
      # model turn fails, and a skill whose commits could not be moved onto
      # the PR branch fails. A skill step that failed only on the turn cap
      # counts as succeeded (act-result). The verdict step's ACT_OUTCOME repeats this
      # expression: runner-policy refuses YAML aliases.
      act-outcome: >-
        ${{ steps.act-result.outputs.outcome == 'success'
        && (steps.config.outputs.gating == 'gate' && steps.skill-verdict.outcome != 'success'
        || steps.promote.outcome == 'failure' || steps.act-turns.outcome != 'success') && 'failure'
        || steps.act-skill.outcome != 'skipped' && (steps.act-result.outputs.outcome || steps.act-skill.outcome)
        || steps.act-script.outcome }}
    steps:
      # The job if: above cannot match an unset variable, so the guard would
      # silently let the App's own events through. An empty default branch
      # would make the checkout below fall back to the event's ref.
      # The escalation-reason input reaches a script as ESCALATION_REASON, so
      # only the runner output's own values pass.
      - name: Assert the lanes App sender id, default branch and inputs are set
        env:
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ESCALATION_REASON: ${{ inputs.escalation-reason }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ inputs.pr-number }}
          DISPATCHER_RUN_ID: ${{ inputs.dispatcher-run-id }}
          TRUSTED_BASE: ${{ inputs.trusted-base }}
          REUSE_BRANCH: ${{ inputs.reuse-branch }}
          PATCH_BASE_SHA: ${{ inputs.patch-base-sha }}
          PATCH_RESUME_TIP: ${{ inputs.patch-resume-tip }}
          DIMENSION_SKIP: ${{ inputs.dimension-skip }}
          PATCH_PREPARE: ${{ inputs.patch-prepare }}
          PATCH_MERGE_BASE_SHA: ${{ inputs.patch-merge-base-sha }}
          PATCH_MERGE_STATE: ${{ inputs.patch-merge-state }}
          PATCH_CONFLICT_TREE: ${{ inputs.patch-conflict-tree }}
        run: |
          # Issue mode runs only on the issues event that names that issue,
          # trusting the default branch tip, with none of the PR inputs.
          if [ -n "$ISSUE_NUMBER" ] || [ "$EVENT_NAME" = issues ]; then
            if ! [[ $ISSUE_NUMBER =~ ^[1-9][0-9]{0,9}$ ]] || [ "$EVENT_NAME" != issues ] ||
              [ "$ISSUE_NUMBER" != "$EVENT_ISSUE" ] || [ "$TRUSTED_BASE" != default-tip ] ||
              [ -n "$PR_NUMBER$DISPATCHER_RUN_ID" ]; then
              echo "::error::issue mode needs an issues event, the event's issue number, trusted-base default-tip, and no pr-number or dispatcher-run-id"
              exit 1
            fi
          fi
          # A reused branch is only ever this issue's lane branch.
          if [ -n "$REUSE_BRANCH" ] && { [ -z "$ISSUE_NUMBER" ] ||
            ! [[ $REUSE_BRANCH =~ ^work-resolve-issue/issue-${ISSUE_NUMBER}-[1-9][0-9]*-[1-9][0-9]*$ ]]; }; then
            echo "::error::reuse-branch must be this issue's work-resolve-issue lane branch"
            exit 1
          fi
          # An issue patch's start commits are commit ids, only in issue mode.
          if [ -n "$PATCH_BASE_SHA$PATCH_RESUME_TIP" ] && { [ -z "$ISSUE_NUMBER" ] ||
            ! [[ $PATCH_BASE_SHA =~ ^[0-9a-f]{40}$ ]] || ! [[ $PATCH_RESUME_TIP =~ ^([0-9a-f]{40})?$ ]]; }; then
            echo "::error::patch-base-sha and patch-resume-tip are an issue patch's commit ids"
            exit 1
          fi
          # The merge inputs go with patch-prepare merge-base, in PR mode: a
          # pinned base commit, a clean or conflicted state, and its conflict
          # tree.
          if [ "$PATCH_PREPARE" = merge-base ] || [ -n "$PATCH_MERGE_BASE_SHA$PATCH_MERGE_STATE$PATCH_CONFLICT_TREE" ]; then
            if [ "$PATCH_PREPARE" != merge-base ] || [ -n "$ISSUE_NUMBER" ] ||
              ! [[ $PATCH_MERGE_BASE_SHA =~ ^[0-9a-f]{40}$ && $PATCH_CONFLICT_TREE =~ ^[0-9a-f]{40}$ ]] ||
              ! [[ $PATCH_MERGE_STATE =~ ^(clean|conflicted)$ ]]; then
              echo "::error::patch-prepare merge-base needs patch-merge-base-sha, patch-merge-state and patch-conflict-tree, in PR mode, and they go with nothing else"
              exit 1
            fi
          fi
          # A dimension skip is one of the four issue-dimension reasons, only in issue mode.
          if [ -n "$DIMENSION_SKIP" ] && { [ -z "$ISSUE_NUMBER" ] ||
            ! [[ $DIMENSION_SKIP =~ ^(split-required|research-first|probe-first)$ ]]; }; then
            echo "::error::dimension-skip must be an issue-dimension skip reason, in issue mode"
            exit 1
          fi
          if ! [[ $APP_SENDER_ID =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the AUTOMATION_LANES_APP_SENDER_ID variable must hold the lanes App bot's numeric user id"
            exit 1
          fi
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error::the event names no default branch"
            exit 1
          fi
          case $ESCALATION_REASON in
            "" | protected-path-conflict | workflow-staged | unexpected-path-staged | repeat-cap | unresolved-conflict) ;;
            feedback-protected-path | feedback-round-cap | feedback-not-converging | feedback-uncertain | feedback-not-landed | feedback-invalid) ;;
            feedback-partial | feedback-incomplete | feedback-disputed) ;;
            feedback-unadjudicated | feedback-question-intent | feedback-question-design) ;;
            feedback-question-security) ;;
            dependency-round-cap | dependency-invalid | dependency-fix-not-landed) ;;
            dependency-security-close | dependency-escalate | dependency-config-unreadable) ;;
            dependency-files-truncated | dependency-control-uncited | dependency-workflow-unpinned) ;;
            dependency-fix-refused) ;;
            ci-fix-round-cap | ci-fix-empty | ci-fix-invalid | ci-fix-escalated) ;;
            ci-fix-protected-path | ci-fix-not-applied) ;;
            conflict-patch-invalid | conflict-patch-not-applied | conflict-patch-protected-path) ;;
            patch-empty | patch-invalid | patch-not-applied | patch-protected-path)
              if [ -z "$ISSUE_NUMBER" ]; then
                echo "::error::a patch-* escalation-reason input is for issue mode only"
                exit 1
              fi
              ;;
            *)
              echo "::error::the escalation-reason input is not a known escalation reason"
              exit 1
              ;;
          esac

      # The kill switch and the trigger gate run from the default branch tip,
      # never from a base the PR chose. Full history lets the next check test
      # the gated base SHA's ancestry.
      - name: Check out the default branch tip
        id: base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # The lanes App bot never starts a write activity, on any event, so one
      # write cannot chain into the next; a re-run must be started by a listed
      # account. One exception, in issue mode: the App applying the caller's
      # app-label to an issue.
      - name: Check the trigger
        id: gate
        if: steps.kill.outputs.proceed == 'true'
        uses: ./.base/.github/actions/check-trusted-trigger # zizmor: ignore[self-repository]
        with:
          trusted-actors-path: .base/.github/standards/trusted-actors/trusted-actors.json
          pr-number: ${{ inputs.pr-number }}
          denied-actor-ids: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          triggering-actor: ${{ github.triggering_actor }}
          # A dispatch from github-actions[bot] proceeds only when it names a
          # pr-unblock-dispatch.yml run on the default branch, or a
          # pr-feedback-dispatch.yml run whose recorded review run reviewed the
          # PR's current head, that sent it to pr-unblock.yml; any other run
          # passes no id and the bot stays unlisted.
          dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
          dispatcher-workflow: .github/workflows/pr-unblock-dispatch.yml
          run-dispatcher-workflow: .github/workflows/pr-feedback-dispatch.yml
          run-dispatcher-upstreams: >-
            .github/workflows/pr-review-hosted.yml
            .github/workflows/pr-review-security-hosted.yml
          # A job after the model job: the review was of the head that job
          # gated, and only the lanes App's signed commits may follow it.
          expected-upstream-head: ${{ inputs.expected-upstream-head }}
          lanes-app-id: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          # A dispatcher sends pr-refine.yml for the pr-refine lane, pr-unblock.yml otherwise.
          dispatched-workflow: ${{ inputs.lane == 'pr-refine' && '.github/workflows/pr-refine.yml' || '.github/workflows/pr-unblock.yml' }}
          # Issue mode reads no PR: the account that applied the label, and
          # any re-runner, must be listed as a human.
          require-pr: ${{ inputs.issue-number == '' }}
          require-kind: ${{ inputs.issue-number != '' && 'human' || '' }}
          app-label: ${{ inputs.issue-number != '' && inputs.app-label || '' }}

      # The trusted base is the config, actions and trusted-actor source.
      - name: Assert the base is on the default branch
        id: trusted-base
        if: steps.gate.outputs.proceed == 'true'
        uses: ./.base/.github/actions/check-trusted-base # zizmor: ignore[self-repository]
        with:
          base-sha: ${{ steps.gate.outputs.base-sha }}
          pr-number: ${{ steps.gate.outputs.pr-number }}
          mode: ${{ inputs.trusted-base }}

      - name: Resolve the config
        id: config
        if: steps.trusted-base.outcome == 'success'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: ${{ inputs.lane }}
          activity: ${{ inputs.activity }}
          base-path: .base
          config-path: ${{ inputs.config-path }}
          output-path: ${{ runner.temp }}/resolved-config.json
          pr-number: ${{ steps.gate.outputs.pr-number }}
          head-sha: ${{ steps.gate.outputs.head-sha }}
          issue-dimensions: ${{ inputs.issue-dimensions }}
          # This file performs prepare: apply-patch, under the merge-base row
          # too (the merge steps below), and refuses a skill's merge-base,
          # review-threads and dependency-review.
          prepare-supported: "true"

      # An issue's skill runs model-chosen commands, so it runs in
      # pr-run-activity-read.yml with no write token; issue mode here runs
      # only the scripts that apply and report its work.
      - name: Assert an issue skill runs in the read runner
        if: inputs.issue-number != '' && steps.config.outcome == 'success' && steps.config.outputs.kind == 'skill'
        run: |
          echo "::error::issue-skill-in-write-runner: an issue skill runs in pr-run-activity-read.yml, which holds no write token"
          exit 1

      # review-threads runs in pr-run-activity-read.yml, after its caller's
      # select job kept the threads: this file keeps none and collects no
      # replies.
      - name: Assert review-threads runs in the read runner
        if: steps.config.outcome == 'success' && steps.config.outputs.prepare == 'review-threads'
        run: |
          echo "::error::review-threads-in-write-runner: a review-threads skill runs in pr-run-activity-read.yml after its caller's select job"
          exit 1

      # merge-base runs in pr-run-activity-read.yml, after its caller's select
      # job merged the base: this file commits a merge only as apply-patch.
      - name: Assert merge-base runs in the read runner
        if: steps.config.outcome == 'success' && steps.config.outputs.prepare == 'merge-base'
        run: |
          echo "::error::merge-base-in-write-runner: a merge-base skill runs in pr-run-activity-read.yml after its caller's select job; apply-patch commits the merge"
          exit 1

      # dependency-review runs in pr-run-activity-read.yml, after its
      # caller's select job wrote the context: this file selects nothing and
      # collects no verdict.
      - name: Assert dependency-review runs in the read runner
        if: steps.config.outcome == 'success' && steps.config.outputs.prepare == 'dependency-review'
        run: |
          echo "::error::dependency-review-in-write-runner: a dependency-review skill runs in pr-run-activity-read.yml after its caller's select job"
          exit 1

      # Issue mode, apply-patch, before the mint: the new lane branch starts
      # at the commit the model job's patch was made on, the default branch
      # commit it checked (which must be on the default branch) or the
      # resumed lane branch tip its issue-prior step chose.
      - name: Check the issue patch's start commit
        id: issue-start
        if: >-
          inputs.issue-number != '' && steps.config.outputs.applies == 'true'
          && steps.config.outputs.prepare == 'apply-patch'
        env:
          PATCH_BASE_SHA: ${{ inputs.patch-base-sha }}
          PATCH_RESUME_TIP: ${{ inputs.patch-resume-tip }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! [[ $PATCH_BASE_SHA =~ ^[0-9a-f]{40}$ ]] ||
            ! git -C .base merge-base --is-ancestor "$PATCH_BASE_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::the issue patch's base commit is not on the default branch"
            exit 1
          fi
          echo "sha=${PATCH_RESUME_TIP:-$PATCH_BASE_SHA}" >>"$GITHUB_OUTPUT"

      # apply-patch under the merge-base row, before the mint: the base the
      # select job pinned must be on the default branch.
      - name: Check the merge patch's pinned base
        if: >-
          steps.config.outputs.applies == 'true' && steps.config.outputs.prepare == 'apply-patch'
          && inputs.patch-prepare == 'merge-base'
        env:
          MERGE_BASE_SHA: ${{ inputs.patch-merge-base-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git -C .base merge-base --is-ancestor "$MERGE_BASE_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::the merge patch's pinned base is not on the default branch"
            exit 1
          fi

      # apply-patch, before the mint: the patch and the report the read model
      # job of this workflow run uploaded, each downloaded by that job's
      # attempt, so a re-run of this job alone still finds them. A missing
      # artifact leaves its directory empty: the select step refuses a missing
      # patch and reads a missing report as no escalation.
      - name: Download the patch
        if: >-
          steps.config.outputs.applies == 'true' && steps.config.outputs.prepare == 'apply-patch'
          && inputs.patch-state == 'written' && inputs.patch-attempt != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: patch-${{ inputs.lane }}-${{ inputs.patch-activity }}-${{ inputs.patch-attempt }}
          path: ${{ runner.temp }}/lane-patch

      - name: Download the model job's report
        if: >-
          steps.config.outputs.applies == 'true' && steps.config.outputs.prepare == 'apply-patch'
          && inputs.reply-attempt != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skill-reply-${{ inputs.lane }}-${{ inputs.patch-activity }}-${{ inputs.reply-attempt }}
          path: ${{ runner.temp }}/lane-patch-report

      # apply-patch under the review-threads row, before the mint: the
      # caller's select job's thread file, by that job's attempt, and its
      # SHA-256; the script's kept-threads rule reads the threads from it. A
      # missing or altered file fails the job, so nothing is minted.
      - name: Download the kept threads
        if: >-
          steps.config.outputs.applies == 'true' && steps.config.outputs.prepare == 'apply-patch'
          && inputs.patch-prepare == 'review-threads'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feedback-context-${{ inputs.patch-threads-attempt }}
          path: ${{ runner.temp }}/lane-patch-threads

      - name: Check the kept threads
        id: patch-threads
        if: >-
          steps.config.outputs.applies == 'true' && steps.config.outputs.prepare == 'apply-patch'
          && inputs.patch-prepare == 'review-threads'
        env:
          THREADS_FILE: ${{ runner.temp }}/lane-patch-threads/threads.json
          THREADS_SHA256: ${{ inputs.patch-threads-sha256 }}
        run: |
          if [ -L "$THREADS_FILE" ] || [ ! -f "$THREADS_FILE" ] || [ "$(stat -c %s "$THREADS_FILE")" -gt 1048576 ]; then
            echo "::error::the feedback-context artifact holds no thread file of at most 1 MiB"
            exit 1
          fi
          sum=$(sha256sum <"$THREADS_FILE")
          if ! [[ $THREADS_SHA256 =~ ^[0-9a-f]{64}$ ]] || [ "${sum%% *}" != "$THREADS_SHA256" ]; then
            echo "::error::the thread file does not match the SHA-256 the select job recorded"
            exit 1
          fi
          echo "file=$THREADS_FILE" >>"$GITHUB_OUTPUT"

      # apply-patch under the dependency-review row, before the mint: the
      # verdict the read runner's scan job uploaded, by its attempt, and its
      # SHA-256; the row's dependency-verdict requirement reads its verdict
      # field. A missing or altered file fails the job, so nothing is
      # minted and no patch applies without a scanned verdict.
      - name: Download the dependency verdict for the patch
        if: >-
          steps.config.outputs.applies == 'true' && steps.config.outputs.prepare == 'apply-patch'
          && inputs.patch-prepare == 'dependency-review'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-verdict-${{ inputs.lane }}-${{ inputs.patch-activity }}-${{ inputs.patch-verdict-attempt }}
          path: ${{ runner.temp }}/lane-patch-verdict

      - name: Check the dependency verdict for the patch
        id: patch-verdict
        if: >-
          steps.config.outputs.applies == 'true' && steps.config.outputs.prepare == 'apply-patch'
          && inputs.patch-prepare == 'dependency-review'
        env:
          VERDICT_FILE: ${{ runner.temp }}/lane-patch-verdict/dependency-verdict.json
          VERDICT_SHA256: ${{ inputs.patch-verdict-sha256 }}
        run: |
          if [ -L "$VERDICT_FILE" ] || [ ! -f "$VERDICT_FILE" ] || [ "$(stat -c %s "$VERDICT_FILE")" -gt 49152 ]; then
            echo "::error::the dependency-verdict artifact holds no verdict of at most 49152 bytes"
            exit 1
          fi
          sum=$(sha256sum <"$VERDICT_FILE")
          if ! [[ $VERDICT_SHA256 =~ ^[0-9a-f]{64}$ ]] || [ "${sum%% *}" != "$VERDICT_SHA256" ]; then
            echo "::error::the verdict does not match the SHA-256 the scan job recorded"
            exit 1
          fi
          # Model output, held to the closed set before it becomes an output.
          verdict=$(jq -r 'if type == "object" and (.verdict | type) == "string" then .verdict else "" end' "$VERDICT_FILE") || verdict=""
          case $verdict in
            merge | fix | close | escalate) ;;
            *) verdict="" ;;
          esac
          echo "verdict=$verdict" >>"$GITHUB_OUTPUT"

      # apply-patch, before the mint and the head checkout, with no token:
      # the activity's script, from the base, checks the patch artifact
      # against the model job's SHA-256 and head, and reads its report. Under
      # a skip-moved-head row (ci-context) a moved head skips superseded-sha,
      # and the script takes it with --3way otherwise; an empty or invalid patch escalates
      # with nothing minted, unless at patch-model-rung 0 every check it
      # escalated is unfixed or not-reproducible, which skips rung-up for one
      # retry a rung up; a written patch escalates nothing, so the pushed
      # head's own CI decides. An issue patch's head is its start commit.
      - name: Select the patch
        id: patch-select
        if: steps.config.outputs.applies == 'true' && steps.config.outputs.prepare == 'apply-patch'
        env:
          SCRIPT: ${{ steps.config.outputs.script }}
          BASE_DIR: .base
          PATCH_TARGET: ${{ inputs.issue-number != '' && 'issue' || 'pr' }}
          PATCH_PREPARE: ${{ inputs.patch-prepare }}
          PATCH_STATE: ${{ inputs.patch-state }}
          PATCH_SHA256: ${{ inputs.patch-sha256 }}
          PATCH_HEAD_SHA: ${{ inputs.issue-number != '' && steps.issue-start.outputs.sha || inputs.patch-head-sha }}
          HEAD_SHA: ${{ inputs.issue-number != '' && steps.issue-start.outputs.sha || steps.gate.outputs.head-sha }}
          PATCH_DIR: ${{ runner.temp }}/lane-patch
          REPORT_DIR: ${{ runner.temp }}/lane-patch-report
          MODEL_RUNG: ${{ inputs.patch-model-rung }}
          # Under the merge-base row: clean commits with no patch.
          MERGE_STATE: ${{ inputs.patch-merge-state }}
        run: node ".base/$SCRIPT" select

      # A read activity belongs in pr-run-activity-read.yml, whose run holds no
      # App key; the caller chose the wrong file.
      - name: Assert the effect is not read
        if: steps.config.outcome == 'success' && steps.config.outputs.effect == 'read'
        run: |
          echo "::error::effect-read: a read activity runs in pr-run-activity-read.yml, not pr-run-activity-write.yml"
          exit 1

      # A branch-writing activity re-reads the PR branch from git/ref before
      # the mint (GET /pulls can lag a push), and a moved branch skips it
      # neutral superseded-sha with nothing minted: the run the newer head
      # starts redoes it. Other effects never write the branch and proceed
      # on the gated head. The mint keys on proceed.
      - name: Re-read the PR head before the mint
        id: head-recheck
        if: >-
          steps.config.outputs.applies == 'true' && steps.config.outputs.effect != 'read'
          && steps.patch-select.outputs.proceed != 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EFFECT: ${{ steps.config.outputs.effect }}
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          HEAD_REF: ${{ steps.gate.outputs.head-ref }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
        with:
          retries: 0
          script: |
            const { EFFECT, HEAD_SHA, HEAD_REF, ISSUE_NUMBER } = process.env;
            // Issue mode has no PR branch: apply-patch makes a new one.
            if (EFFECT !== 'mutate-branch' || ISSUE_NUMBER) {
              core.setOutput('proceed', 'true');
              return;
            }
            const { data } = await github.request('GET /repos/{owner}/{repo}/git/ref/{ref}', {
              ...context.repo,
              ref: `heads/${HEAD_REF}`,
            });
            if (data.object.sha === HEAD_SHA) {
              core.setOutput('proceed', 'true');
              return;
            }
            core.info(`The PR branch moved from ${HEAD_SHA} to ${data.object.sha} before the mint; skipping as superseded`);
            core.setOutput('proceed', 'false');
            core.setOutput('skip-reason', 'superseded-sha');

      # The broker mints once per job, and this runs before any head checkout,
      # so a second request from this job is denied already-minted. It fails
      # red on an empty LANES_BROKER_URL or LANES_BROKER_AUDIENCE, on any
      # answer but 200, and on a grant other than the one resolved above. One
      # exception, on pull_request only (a dispatched run executes main's
      # files, so its refusal means main moved): a workflow-modified refusal
      # of a workflow file that GitHub's compare of the default branch with
      # the gated head lists as changed by this PR ends it green with no token
      # and skip reason workflow-modified, so every later step skips and the
      # check is neutral. Every later step keys on the token.
      - name: Request the lane token
        id: lane-token
        if: steps.head-recheck.outputs.proceed == 'true'
        uses: ./.base/.github/actions/request-lane-token # zizmor: ignore[self-repository]
        with:
          pr-workflow-change-ok: ${{ inputs.issue-number == '' && github.event_name == 'pull_request' }}
          head-sha: ${{ steps.gate.outputs.head-sha }}
          default-branch: ${{ github.event.repository.default_branch }}
          github-token: ${{ github.token }}
          broker-url: ${{ vars.LANES_BROKER_URL }}
          audience: ${{ vars.LANES_BROKER_AUDIENCE }}
          lane: ${{ inputs.lane }}
          activity: ${{ inputs.activity }}
          pr-number: ${{ steps.gate.outputs.pr-number }}
          issue-number: ${{ inputs.issue-number }}
          dispatcher-run-id: ${{ inputs.dispatcher-run-id }}
          expected-upstream-head: ${{ inputs.expected-upstream-head }}
          effect: ${{ steps.config.outputs.effect }}
          contents: ${{ steps.config.outputs.contents }}
          pull-requests: ${{ steps.config.outputs.pull-requests }}
          issues: ${{ steps.config.outputs.issues }}

      - name: Select the trusted PR text
        if: >-
          steps.lane-token.outputs.token != '' && steps.config.outputs.reads-untrusted == 'true'
          && inputs.issue-number == ''
        uses: ./.base/.github/actions/select-trusted-text # zizmor: ignore[self-repository]
        with:
          pr-number: ${{ steps.gate.outputs.pr-number }}
          trusted-actors-path: .base/.github/standards/trusted-actors/trusted-actors.json
          output-path: ${{ runner.temp }}/trusted-context.json
          github-token: ${{ steps.lane-token.outputs.token }}

      # The head checkout below replaces .base, so what the activity runs from
      # the base is copied out first.
      - name: Stage the activity from the base
        id: stage
        if: steps.lane-token.outputs.token != ''
        uses: ./.base/.github/actions/collect-base-activity # zizmor: ignore[self-repository]
        with:
          kind: ${{ steps.config.outputs.kind }}
          script: ${{ steps.config.outputs.script }}
          skill: ${{ steps.config.outputs.skill }}
          gating: ${{ steps.config.outputs.gating }}
          effect: ${{ steps.config.outputs.effect }}
          can-commit: ${{ steps.config.outputs.can-commit }}
          prepare: ${{ steps.config.outputs.prepare }}
          resolved-path: ${{ runner.temp }}/resolved-config.json
          issue-number: ${{ inputs.issue-number }}

      # The run-test-file verify-script runs test_*.py under pytest, which the
      # runner image lacks. When the stage granted its wrapper, install the
      # base's hash-pinned CI requirements, before the head checkout replaces
      # .base.
      - name: Set up Python for the test-file runner
        if: contains(steps.stage.outputs.claude-args, '/lane-verify/bin/run-test-file ')
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .base/.python-version
      - name: Install the pinned pytest for the test-file runner
        if: contains(steps.stage.outputs.claude-args, '/lane-verify/bin/run-test-file ')
        run: python -m pip install --only-binary ':all:' --require-hashes --requirement .base/.github/requirements-ci.txt

      # A script reads the base's work-item tracker config (report-escalation's
      # human-gated role label), which the head checkout would replace. Its
      # SHA-256, or `absent`, is checked by the script step.
      - name: Copy the tracker config from the base
        id: tracker-config
        if: steps.lane-token.outputs.token != '' && steps.config.outputs.kind == 'script'
        env:
          COPY: ${{ runner.temp }}/base-script/.work-item-tracker.json
        run: |
          rm -f "$COPY"
          if [ -f .base/.work-item-tracker.json ]; then
            cp .base/.work-item-tracker.json "$COPY"
            sum=$(sha256sum <"$COPY")
            echo "sha256=${sum%% *}" >>"$GITHUB_OUTPUT"
          else
            echo "sha256=absent" >>"$GITHUB_OUTPUT"
          fi

      # review-replies: the reply script reads run.json, the select job's,
      # and the replies the read runner's scan job uploaded, both from this
      # workflow run, and the base's trusted-actors list for the reviewer
      # bot's id, all before the head checkout replaces .base. A missing
      # artifact leaves its file absent; the script still records the round,
      # then skips no-model-turn for missing replies and refuses a missing
      # run.json as feedback-invalid.
      - name: Download the review-thread run record
        if: >-
          steps.lane-token.outputs.token != '' && inputs.review-replies
          && steps.config.outputs.kind == 'script' && inputs.review-run-attempt != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # The other jobs' attempts, not this one: "Re-run failed jobs" on
          # this job alone keeps their outputs from their attempt.
          name: feedback-context-${{ inputs.review-run-attempt }}
          path: ${{ runner.temp }}/feedback-replies

      - name: Download the review-thread replies
        if: >-
          steps.lane-token.outputs.token != '' && inputs.review-replies
          && steps.config.outputs.kind == 'script' && inputs.review-replies-attempt != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feedback-replies-${{ inputs.lane }}-address-feedback-${{ inputs.review-replies-attempt }}
          path: ${{ runner.temp }}/feedback-replies

      - name: Download the adjudication verdicts
        if: >-
          steps.lane-token.outputs.token != '' && inputs.review-replies
          && steps.config.outputs.kind == 'script' && inputs.review-adjudication-attempt != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feedback-adjudication-${{ inputs.review-adjudication-attempt }}
          path: ${{ runner.temp }}/feedback-adjudication

      # dependency-verdict: the verdict script reads context.json, the select
      # job's, and the verdict the read runner's scan job uploaded, both from
      # this workflow run, before the head checkout replaces .base. A missing
      # artifact leaves its file absent; the script still records the round,
      # then refuses a missing context.json as dependency-invalid and reads a
      # missing verdict as no model turn only on the scan's own evidence.
      - name: Download the dependency context
        if: >-
          steps.lane-token.outputs.token != '' && inputs.dependency-verdict
          && steps.config.outputs.kind == 'script' && inputs.dependency-context-attempt != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # The other jobs' attempts, not this one: "Re-run failed jobs" on
          # this job alone keeps their outputs from their attempt.
          name: dependency-context-${{ inputs.dependency-context-attempt }}
          path: ${{ runner.temp }}/dependency-verdict

      - name: Download the dependency verdict
        if: >-
          steps.lane-token.outputs.token != '' && inputs.dependency-verdict
          && steps.config.outputs.kind == 'script' && inputs.dependency-run-attempt != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-verdict-${{ inputs.lane }}-review-dependency-${{ inputs.dependency-run-attempt }}
          path: ${{ runner.temp }}/dependency-verdict

      # review-replies and dependency-verdict: every attempt's marker the read
      # runner's scan-refusal job uploaded for the model call in this run, by
      # name, never a job output (a failed job's outputs are not documented to
      # reach this caller). A pattern that matches nothing downloads nothing
      # and succeeds; a failed download reads as a refusal. An earlier
      # attempt's marker after a re-run only hands the round to a person.
      - name: Download the scan refusal markers
        id: scan-refused
        if: >-
          steps.lane-token.outputs.token != '' && (inputs.review-replies || inputs.dependency-verdict)
          && steps.config.outputs.kind == 'script'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scan-refused-${{ inputs.lane }}-${{ inputs.review-replies && 'address-feedback' || 'review-dependency' }}-*
          path: ${{ runner.temp }}/scan-refused
          merge-multiple: true

      # Also issue mode: report-outcome trusts a merge: human label only from
      # a listed human or the lanes App.
      - name: Copy the trusted actors for the reply script
        id: reply-actors
        if: >-
          steps.lane-token.outputs.token != ''
          && (inputs.review-replies || inputs.issue-number != '')
          && steps.config.outputs.kind == 'script'
        env:
          COPY: ${{ runner.temp }}/base-script/.trusted-actors.json
        run: cp .base/.github/standards/trusted-actors/trusted-actors.json "$COPY"

      # apply-patch under the merge-base row runs the base's merge scripts and
      # the base's version-bump script, never the head's: copied out here,
      # each with its SHA-256 as a step output that every later step checks
      # its copy against before running it. The repeat cap reads
      # loop.no-progress from the resolved config now, before the head
      # checkout replaces .base.
      - name: Copy the merge scripts from the base
        id: merge-bin
        if: >-
          steps.lane-token.outputs.token != '' && steps.config.outputs.prepare == 'apply-patch'
          && inputs.patch-prepare == 'merge-base'
        env:
          BIN: ${{ runner.temp }}/merge-base-bin
          RESOLVED: ${{ runner.temp }}/resolved-config.json
        run: |
          mkdir -p "$BIN"
          for file in .base/.github/scripts/merge-base/{prepare,run-prepare,tree-entries}.sh \
            .base/plugins/source-control/scripts/resolve-version-bump-conflict.sh; do
            name=$(basename "$file" .sh)
            cp "$file" "$BIN/$name.sh"
            sum=$(sha256sum <"$BIN/$name.sh")
            echo "$name-sha256=${sum%% *}" >>"$GITHUB_OUTPUT"
          done
          no_progress=$(jq -r '.loop["no-progress"] // empty' "$RESOLVED")
          if ! [[ $no_progress =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the resolved config holds no loop.no-progress"
            exit 1
          fi
          echo "no-progress=$no_progress" >>"$GITHUB_OUTPUT"

      # The labels the commit, promote and apply-patch steps treat as a hold,
      # as a JSON array: do-not-merge, the human-gated role label resolved from the base
      # the way report-escalation.sh does, and the activity's labels-absent
      # list, all read before the head checkout replaces .base. The
      # human-gated label is left out only for apply-patch when the caller's
      # base-code job says so (patch-fix-requested): under the review-threads
      # row it kept nothing but threads a trusted person with write access
      # asked the lane to fix on a PR carrying it, or a lane escalation put it
      # on; under another row another lane's escalation put it on. Either way
      # labels-absent may still list it.
      - name: Read the hold labels from the base
        id: hold-label
        if: >-
          steps.head-recheck.outputs.proceed == 'true' && steps.lane-token.outputs.token != ''
          && (steps.config.outputs.kind == 'skill' || steps.config.outputs.prepare == 'apply-patch')
        env:
          RESOLVED: ${{ runner.temp }}/resolved-config.json
          FIX_REQUESTED: ${{ steps.config.outputs.prepare == 'apply-patch' && inputs.patch-fix-requested || '' }}
        run: |
          hold_label=needs-human
          if [ -f .base/.work-item-tracker.json ]; then
            hold_label=$(jq -er '.config.role_labels // {}
              | if has("human-gated") then .["human-gated"] | strings | select(length > 0) else "needs-human" end' \
              .base/.work-item-tracker.json) || {
              echo "::error::cannot read the human-gated role label from the base .work-item-tracker.json"
              exit 1
            }
          fi
          if ! [[ $hold_label =~ ^[A-Za-z0-9][A-Za-z0-9\ ._:/-]*$ ]]; then
            echo "::error::the human-gated role label is malformed"
            exit 1
          fi
          labels=$(jq -ce --arg human "$hold_label" --arg requested "$FIX_REQUESTED" \
            '["do-not-merge"] + (if $requested == "true" then [] else [$human] end)
              + [(.selected["applies-when"]["labels-absent"] // [])[] | strings] | unique' \
            "$RESOLVED") || {
            echo "::error::cannot read the activity's labels-absent list from the resolved config"
            exit 1
          }
          echo "labels=$labels" >>"$GITHUB_OUTPUT"

      # Issue mode, apply-patch: the labels the activity needs present (an
      # issue's agent-ready), read before the head checkout replaces .base.
      - name: Read the required labels
        id: required-labels
        if: >-
          steps.head-recheck.outputs.proceed == 'true' && steps.lane-token.outputs.token != ''
          && inputs.issue-number != '' && steps.config.outputs.prepare == 'apply-patch'
        env:
          RESOLVED: ${{ runner.temp }}/resolved-config.json
        run: |
          required=$(jq -ce '[(.selected["applies-when"].labels // [])[] | strings]' "$RESOLVED") || {
            echo "::error::cannot read the activity's labels list from the resolved config"
            exit 1
          }
          echo "required=$required" >>"$GITHUB_OUTPUT"

      # apply-patch: the head checkout replaces .base, so the script's sibling
      # imports (thread-scope.mjs and dependency-classify.mjs, beside the
      # script's base-script copy), the patch-rules.json it reads, and the
      # dependabot.yml whose pairs the dependency-manifests rule reads are
      # copied out of the base first.
      - name: Copy the apply-patch base files
        id: apply-base
        if: steps.lane-token.outputs.token != '' && steps.config.outputs.prepare == 'apply-patch'
        env:
          RULES: .github/actions/resolve-config/patch-rules.json
          DEST: ${{ runner.temp }}/apply-patch-base
        run: |
          mkdir -p "$RUNNER_TEMP/pr-unblock" "$DEST/$(dirname "$RULES")"
          cp .base/.github/scripts/pr-unblock/thread-scope.mjs "$RUNNER_TEMP/pr-unblock/"
          cp .base/.github/scripts/pr-unblock/dependency-classify.mjs "$RUNNER_TEMP/pr-unblock/"
          cp ".base/$RULES" "$DEST/$RULES"
          # A base without one leaves the rule's pairs unreadable: a row that
          # needs them fails before any write.
          if [ -f .base/.github/dependabot.yml ]; then
            cp .base/.github/dependabot.yml "$DEST/.github/dependabot.yml"
          fi
          echo "dir=$DEST" >>"$GITHUB_OUTPUT"

      # Nothing after this step needs sudo or docker.
      - name: Isolate the runner
        if: steps.lane-token.outputs.token != ''
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: ${{ steps.config.outputs.kind == 'skill' }}

      # Issue mode checks out the trusted base, the default branch tip, or for
      # apply-patch the issue patch's start commit, never the model job's
      # workspace.
      # The head checkout replaces .base, so the base's scripts/setup-env.sh
      # and the files it installs from are copied out first; a base that
      # predates the script skips the install.
      - name: Copy the dependency setup from the base
        id: setup-env
        if: steps.lane-token.outputs.token != '' && steps.config.outputs.kind == 'skill'
        env:
          DEST: ${{ runner.temp }}/setup-env
        run: |
          if [ ! -f .base/scripts/setup-env.sh ]; then
            echo "::notice::the base has no scripts/setup-env.sh; the skill runs without its dependencies"
            exit 0
          fi
          policy=.github/standards/runner-policy
          mkdir -p "$DEST/scripts" "$DEST/$policy"
          for file in scripts/setup-env.sh .python-version .github/requirements-ci.txt \
            package.json package-lock.json "$policy/package.json" "$policy/package-lock.json"; do
            cp ".base/$file" "$DEST/$file"
          done
          echo "ready=true" >>"$GITHUB_OUTPUT"

      - name: Check out the PR head
        if: steps.lane-token.outputs.token != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{ inputs.issue-number != ''
            && (steps.issue-start.outputs.sha || steps.trusted-base.outputs.commit)
            || steps.gate.outputs.head-sha }}
          token: ${{ steps.lane-token.outputs.token }}
          persist-credentials: false
          # A merge needs the history back to the merge base and the pinned
          # base commit, and an issue patch the history back to where its start
          # commit forked from the default branch. Written as != so the 0 is
          # not read as false.
          fetch-depth: >-
            ${{ !(inputs.issue-number != '' && steps.config.outputs.prepare == 'apply-patch')
            && !(steps.config.outputs.prepare == 'apply-patch' && inputs.patch-prepare == 'merge-base') && 1 || 0 }}

      # The activity judges exactly the commit the check is posted on.
      - name: Assert the head is the gated SHA
        if: steps.lane-token.outputs.token != ''
        env:
          HEAD_SHA: >-
            ${{ inputs.issue-number != ''
            && (steps.issue-start.outputs.sha || steps.trusted-base.outputs.commit)
            || steps.gate.outputs.head-sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::the checked-out head is not the gated head SHA"
            exit 1
          fi

      # apply-patch under the merge-base row: merge the select job's pinned
      # base into the gated head without committing and run the base's
      # version-bump script, through run-prepare.sh, which fails red unless
      # the merge reaches the select job's state and conflict tree;
      # apply-patch.mjs then applies the patch to that tree. Only whitelisted,
      # validated key=value lines become outputs. The identity is the lanes
      # bot's: git refuses even a --no-commit merge without one, and the
      # repeat cap counts commits by that author name.
      - name: Start the merge of the pinned base
        id: prepare
        if: >-
          steps.lane-token.outputs.token != '' && steps.config.outputs.prepare == 'apply-patch'
          && inputs.patch-prepare == 'merge-base'
        env:
          GIT_AUTHOR_NAME: melodic-automation-lanes[bot]
          GIT_AUTHOR_EMAIL: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}+melodic-automation-lanes[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: melodic-automation-lanes[bot]
          GIT_COMMITTER_EMAIL: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}+melodic-automation-lanes[bot]@users.noreply.github.com
          LOOP_NO_PROGRESS: ${{ steps.merge-bin.outputs.no-progress }}
          # Replace refs from the head's history never stand in for objects.
          GIT_NO_REPLACE_OBJECTS: "1"
          BIN: ${{ runner.temp }}/merge-base-bin
          OUT: ${{ runner.temp }}/merge-base-out
          PREPARE_SHA256: ${{ steps.merge-bin.outputs.prepare-sha256 }}
          BUMP_SHA256: ${{ steps.merge-bin.outputs.resolve-version-bump-conflict-sha256 }}
          RUN_PREPARE_SHA256: ${{ steps.merge-bin.outputs.run-prepare-sha256 }}
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          BASE_SHA: ${{ inputs.patch-merge-base-sha }}
          EXPECT_STATE: ${{ inputs.patch-merge-state }}
          EXPECT_TREE: ${{ inputs.patch-conflict-tree }}
        run: |
          sum=$(sha256sum <"$BIN/run-prepare.sh")
          if [ "${sum%% *}" != "$RUN_PREPARE_SHA256" ]; then
            echo "::error::run-prepare.sh does not match the SHA-256 recorded when it was copied from the base"
            exit 1
          fi
          bash "$BIN/run-prepare.sh"

      # claude-code-action's commit_files builds each commit on the live tip of
      # CLAUDE_BRANCH with file bytes from this checkout
      # (src/mcp/github-file-ops-server.ts:226-367 at ed670b4), so a push to
      # the PR branch during the run would have its edits to the same files
      # overwritten. The skill commits to a branch made at the gated SHA
      # instead, and a later step moves the PR branch to it only while the PR
      # branch is still at the gated SHA.
      - name: Make the lane's commit branch at the gated SHA
        id: lane-branch
        if: >-
          steps.lane-token.outputs.token != '' && steps.config.outputs.kind == 'skill'
          && steps.config.outputs.can-commit == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          LANE_BRANCH: ${{ format('lane-commits/{0}/{1}/{2}-{3}', inputs.lane, inputs.activity, github.run_id, github.run_attempt) }}
        with:
          github-token: ${{ steps.lane-token.outputs.token }}
          retries: 0
          script: |
            const { HEAD_SHA, LANE_BRANCH } = process.env;
            await github.rest.git.createRef({ ...context.repo, ref: `refs/heads/${LANE_BRANCH}`, sha: HEAD_SHA });
            core.setOutput('branch', LANE_BRANCH);

      - name: Set up Python for the skill
        if: >-
          steps.setup-env.outputs.ready == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ${{ runner.temp }}/setup-env/.python-version

      # The install reads only the base copies, so no head code runs: pytest
      # and the Node tools land on PATH for the base wrappers.
      - name: Install the skill's dependencies
        if: >-
          steps.setup-env.outputs.ready == 'true'
        env:
          SETUP_ENV_VENV: ${{ runner.temp }}/setup-env-venv
        run: |
          bash "$RUNNER_TEMP/setup-env/scripts/setup-env.sh" --root "$RUNNER_TEMP/setup-env"
          # Node resolves a package from the importing file's directory, so the
          # base-built trees are copied into the checkout, where node_modules
          # is ignored.
          for dir in . .github/standards/runner-policy; do
            [ -d "$GITHUB_WORKSPACE/$dir" ] || continue
            rm -rf "${GITHUB_WORKSPACE:?}/$dir/node_modules"
            cp -R "$RUNNER_TEMP/setup-env/$dir/node_modules" "$GITHUB_WORKSPACE/$dir/"
          done

      # A failure does not stop the job here: the next step fails it unless the failure
      # is only the turn cap on a successful result.
      - name: Run the skill activity
        id: act-skill
        if: >-
          steps.lane-token.outputs.token != '' && steps.config.outputs.kind == 'skill'
        continue-on-error: true
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        env:
          # Strips the OAuth token and other credentials from Bash, hook and
          # MCP subprocesses and gives Bash its own PID namespace, so /proc
          # shows no ancestor's env. It keeps GH_TOKEN and GITHUB_TOKEN, so a
          # subprocess still holds this activity's GitHub token
          # (code.claude.com/docs/en/env-vars, as of 2026-10-04; recheck when
          # the CLAUDE_CODE_SUBPROCESS_ENV_SCRUB row stops listing GH_TOKEN
          # and GITHUB_TOKEN as kept).
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          # The action stops reading at Claude's first result message
          # (base-action/src/run-claude-sdk.ts:198-209), so background work
          # that reports in a later turn is lost. This runs every subagent in
          # the foreground and turns off run_in_background
          # (code.claude.com/docs/en/env-vars, CLAUDE_CODE_DISABLE_BACKGROUND_TASKS
          # row, as of 2026-10-15; recheck on a claude-code-action bump that
          # drops that break, or when the row stops naming run_in_background).
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          CLAUDE_BRANCH: ${{ steps.lane-branch.outputs.branch || steps.gate.outputs.head-ref }}
          TRUSTED_CONTEXT_FILE: >-
            ${{ steps.config.outputs.reads-untrusted == 'true' && inputs.issue-number == ''
            && format('{0}/trusted-context.json', runner.temp) || '' }}
        with:
          claude_code_oauth_token: ${{ secrets.claude-code-oauth-token }}
          github_token: ${{ steps.lane-token.outputs.token }}
          use_commit_signing: true
          # The action refuses a bot actor unless it is listed. The trigger
          # gate has already decided both bot cases: the lanes App passes it
          # only by applying the app-label in issue mode, and github-actions
          # only on a dispatcher run it verified, whose id this names.
          allowed_bots: >-
            ${{ inputs.dispatcher-run-id != '' && 'melodic-automation-lanes[bot],github-actions'
            || 'melodic-automation-lanes[bot]' }}
          plugin_marketplaces: ${{ runner.temp }}/base-marketplace
          plugins: ${{ steps.stage.outputs.plugins }}
          prompt: ${{ steps.stage.outputs.prompt }}
          # The model, turns and effort come from the base config's models
          # profile (resolve-config), never from text the run reads.
          settings: ${{ steps.config.outputs.settings-json }}
          claude_args: >-
            --setting-sources user
            --permission-mode dontAsk
            ${{ steps.config.outputs.claude-args }}
            ${{ steps.stage.outputs.claude-args }}

      # claude-code-action fails the step on a `success` result whose
      # num_turns is over --max-turns, after the CLI has finished the work
      # (base-action/src/run-claude-sdk.ts:241-250 at the pinned SHA). Such a
      # run counts as a success: the last result message in the execution
      # file must say subtype `success`, is_error false, and num_turns over
      # the cap. Any other failure, or a missing or unreadable file, fails
      # the job here, as the skill step itself did before.
      - name: Check the skill's failure is only the turn cap
        id: act-result
        if: always() && (steps.act-skill.outcome == 'success' || steps.act-skill.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ACT_OUTCOME: ${{ steps.act-skill.outcome }}
          EXECUTION_FILE: >-
            ${{ steps.act-skill.outputs.execution_file
            || format('{0}/claude-execution-output.json', runner.temp) }}
          MAX_TURNS: ${{ steps.config.outputs.max-turns }}
        with:
          retries: 0
          script: |
            const fs = require('fs');
            const { ACT_OUTCOME, EXECUTION_FILE, MAX_TURNS } = process.env;
            if (ACT_OUTCOME === 'success') {
              core.setOutput('outcome', 'success');
              return;
            }
            let result = null;
            try {
              const messages = JSON.parse(fs.readFileSync(EXECUTION_FILE, 'utf8'));
              result = Array.isArray(messages) ? messages.filter((m) => m?.type === 'result').at(-1) ?? null : null;
            } catch (error) {
              core.setFailed(`the skill step failed and its execution file is not readable: ${error.code ?? error.name}`);
              return;
            }
            const cap = /^[1-9][0-9]*$/.test(MAX_TURNS ?? '') ? Number(MAX_TURNS) : null;
            const turns = result?.num_turns;
            if (
              result?.subtype === 'success' && result.is_error === false && cap !== null
              && Number.isSafeInteger(turns) && turns > cap
            ) {
              core.notice(`the skill finished with a successful result after ${turns} turns, over the ${cap}-turn cap; counted as a success`);
              core.setOutput('outcome', 'success');
              return;
            }
            core.setFailed(
              `the skill step failed: result subtype=${JSON.stringify(result?.subtype ?? null)} ` +
                `is_error=${JSON.stringify(result?.is_error ?? null)} num_turns=${JSON.stringify(turns ?? null)} max-turns=${cap ?? 'unset'}`,
            );

      # The reply is untrusted model text: it is read with jq and printed as
      # data, never interpolated into a command. The file path falls back to
      # the action's fixed location (base-action/src/execution-file.ts:6-13).
      # It is also uploaded below as audit evidence, since the REST API cannot
      # read step summaries; nothing in this workflow reads that artifact.
      - name: Show the skill's final reply
        if: always() && (steps.act-skill.outcome == 'success' || steps.act-skill.outcome == 'failure')
        env:
          EXECUTION_FILE: >-
            ${{ steps.act-skill.outputs.execution_file
            || format('{0}/claude-execution-output.json', runner.temp) }}
          REPLY_DIR: ${{ runner.temp }}/skill-reply
          # The model can read the lane token, so its reply could quote it;
          # the token is cut out before the reply is shown or uploaded.
          LANE_TOKEN: ${{ steps.lane-token.outputs.token }}
        run: |
          mkdir -p "$REPLY_DIR"
          if [ ! -f "$EXECUTION_FILE" ]; then
            echo "No execution file to summarize" | tee "$REPLY_DIR/reply.txt"
            exit 0
          fi
          jq -r --arg token "$LANE_TOKEN" '[.[] | select(.type == "result")] | last | (.result // "")
            | if $token == "" then . else split($token) | join("[REDACTED]") end
            | .[:4000] | gsub("`"; "'"'"'")' \
            "$EXECUTION_FILE" >"$REPLY_DIR/reply.txt"
          {
            echo "### Skill reply"
            echo
            echo '```text'
            cat "$REPLY_DIR/reply.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # A slash command whose expansion fails, such as a skill pre-compute line
      # the permission mode denies, ends with a `success` result and no model
      # turn, so the act did nothing. This fails it and records why. The same
      # step runs in pr-run-activity-read.yml, which holds no lane token.
      - name: Check the skill took a model turn
        id: act-turns
        if: always() && (steps.act-skill.outcome == 'success' || steps.act-skill.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXECUTION_FILE: >-
            ${{ steps.act-skill.outputs.execution_file
            || format('{0}/claude-execution-output.json', runner.temp) }}
          REPLY_DIR: ${{ runner.temp }}/skill-reply
          LANE_TOKEN: ${{ steps.lane-token.outputs.token }}
        with:
          retries: 0
          script: |
            const fs = require('fs');
            const { EXECUTION_FILE, REPLY_DIR, LANE_TOKEN } = process.env;
            // Head code could have planted one; only this step's copy is uploaded.
            fs.rmSync(`${REPLY_DIR}/act-turns.json`, { force: true });
            const redact = (text) => (LANE_TOKEN ? text.split(LANE_TOKEN).join('[REDACTED]') : text);
            let messages = [];
            try {
              messages = JSON.parse(fs.readFileSync(EXECUTION_FILE, 'utf8'));
            } catch (error) {
              core.setFailed(`No readable execution file: ${error.code ?? error.name}`);
              return;
            }
            const result = messages.filter((m) => m.type === 'result').at(-1) ?? {};
            const textOf = (content) =>
              typeof content === 'string' ? content : (content ?? []).map((block) => block?.text ?? '').join('\n');
            const stderr = messages
              .filter((m) => m.type === 'user')
              .map((m) => textOf(m.message?.content))
              .filter((text) => text.includes('<local-command-stderr>'));
            const models = Object.keys(result.modelUsage ?? {});
            const diag = {
              subtype: result.subtype == null ? null : String(result.subtype).slice(0, 100),
              is_error: result.is_error ?? null,
              num_turns: result.num_turns ?? null,
              duration_ms: result.duration_ms ?? null,
              models: models.slice(0, 10).map((name) => name.slice(0, 100)),
              // The CLI's own report of a failed slash command expansion: the
              // first 4, each cut to 2000 characters; local_command_stderr_total
              // counts them all.
              local_command_stderr: stderr.slice(0, 4).map((text) => redact(text).slice(0, 2000)),
              local_command_stderr_total: stderr.length,
              // The first 20 calls the permission mode denied, each with its tool
              // name cut to 100 characters and its command, file_path, path or
              // pattern cut to 300, so a denial can be diagnosed; denied_total
              // counts them all. Entries drop from the end until denied serializes
              // to at most 8192 bytes (a JSON-escaped control character is 6 bytes).
              denied: (() => {
                const kept = (result.permission_denials ?? []).slice(0, 20).map((d) => {
                  const i = d?.tool_input ?? {};
                  const input = i.command ?? i.file_path ?? i.path ?? i.pattern ?? null;
                  return { tool_name: String(d?.tool_name ?? '').slice(0, 100), input: input == null ? null : redact(String(input)).slice(0, 300) };
                });
                while (Buffer.byteLength(JSON.stringify(kept), 'utf8') > 8192) kept.pop();
                return kept;
              })(),
              denied_total: (result.permission_denials ?? []).length,
            };
            // The written file stays within the 32768-byte cap the read file's
            // scan job carries it under: the oldest stderr entries drop first,
            // then denials from the end.
            let turns = `${JSON.stringify(diag, null, 2)}\n`;
            while (Buffer.byteLength(turns, 'utf8') > 32768 && (diag.local_command_stderr.length > 0 || diag.denied.length > 0)) {
              if (diag.local_command_stderr.length > 0) diag.local_command_stderr.shift();
              else diag.denied.pop();
              turns = `${JSON.stringify(diag, null, 2)}\n`;
            }
            fs.mkdirSync(REPLY_DIR, { recursive: true });
            fs.writeFileSync(`${REPLY_DIR}/act-turns.json`, turns);
            const more = diag.denied_total - diag.denied.length;
            const shown = {
              ...diag,
              denied: [
                ...diag.denied.map((d) => (d.input == null ? d.tool_name : `${d.tool_name}: ${d.input}`)),
                ...(more > 0 ? [`(+${more} more)`] : []),
              ],
            };
            await core.summary
              .addHeading('Skill run', 3)
              // addCodeBlock does not escape its text.
              .addCodeBlock(JSON.stringify(shown, null, 2).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'), 'json')
              .write();
            // JSON escapes newlines, so no field can start a workflow command.
            core.info(JSON.stringify({ subtype: diag.subtype, is_error: diag.is_error, num_turns: diag.num_turns, models: models.length }));
            if (Number.isSafeInteger(diag.num_turns) && diag.num_turns >= 0) {
              core.setOutput('turns', String(diag.num_turns));
            }
            // The CLI's modelUsage keys, the models the run used; the report
            // job's lane-record.mjs drops a list that fails its shape.
            core.setOutput('models', models.join(','));
            if (!(diag.num_turns > 0) || models.length === 0) {
              core.setFailed(
                'no-model-turn: the skill ended without a model turn, so it did nothing; ' +
                  'the step summary and the skill-reply artifact hold the result fields and any local-command stderr',
              );
            }

      # The lane record: the run's failure class and, on a usage limit, when it
      # resets, read from the execution file's structured fields by
      # ci-workflows' classifier, never from model text. The report job copies
      # it onto the posted check run, and issue mode writes it into lane.json,
      # where the limit-stop restarts read it.
      # The secret the caller passed, named from its funding role:
      # `issue-lane` reports ISSUE_LANE_CLAUDE_CODE_OAUTH_TOKEN.
      - name: Name the run's credential
        id: credential
        if: always() && (steps.act-skill.outcome == 'success' || steps.act-skill.outcome == 'failure')
        env:
          ROLE: ${{ inputs.role }}
        run: |
          if [[ ! "$ROLE" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::role must be lowercase letters, digits and hyphens"
            exit 1
          fi
          role=${ROLE^^}
          echo "name=${role//-/_}_CLAUDE_CODE_OAUTH_TOKEN" >>"$GITHUB_OUTPUT"

      - name: Record the lane outcome
        id: lane-record
        if: always() && (steps.act-skill.outcome == 'success' || steps.act-skill.outcome == 'failure')
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@78ee7a2609a84b0073c5e09dfe3bc59613e689dc # v0.65.12
        with:
          outcome: ${{ steps.act-result.outputs.outcome || steps.act-skill.outcome }}
          execution-file: >-
            ${{ steps.act-skill.outputs.execution_file
            || format('{0}/claude-execution-output.json', runner.temp) }}
          lane: ${{ inputs.lane }}
          lane-id: ${{ inputs.lane }}
          credential: ${{ steps.credential.outputs.name }}
          max-turns: ${{ steps.config.outputs.max-turns }}

      - name: Upload the skill's final reply
        if: always() && (steps.act-skill.outcome == 'success' || steps.act-skill.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-reply-${{ inputs.lane }}-${{ inputs.activity }}-${{ github.run_attempt }}
          # Named files only: head code can write into this directory.
          path: |
            ${{ runner.temp }}/skill-reply/reply.txt
            ${{ runner.temp }}/skill-reply/act-turns.json
          retention-days: 7
          if-no-files-found: error

      # The verdict comes from the action's structured_output, read through env
      # and parsed by jq. Anything but exactly `pass` fails the activity; the
      # summary is model text, printed as data.
      - name: Check the gate skill's verdict
        id: skill-verdict
        if: always() && steps.act-result.outputs.outcome == 'success' && steps.config.outputs.gating == 'gate'
        env:
          STRUCTURED_OUTPUT: ${{ steps.act-skill.outputs.structured_output }}
        run: |
          verdict=$(jq -r 'if type == "object" and (.verdict | type) == "string" then .verdict else "" end' <<<"$STRUCTURED_OUTPUT") || verdict=""
          summary=$(jq -r 'if type == "object" then (.summary // "" | tostring)[:4000] | gsub("`"; "'"'"'") else "" end' <<<"$STRUCTURED_OUTPUT") || summary=""
          {
            echo "### Gate verdict"
            echo
            echo '```text'
            printf 'verdict: %s\n\n%s\n' "$verdict" "$summary"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$verdict" != pass ]; then
            echo "::error::the gate skill's verdict is not pass"
            exit 1
          fi

      # Fast-forwards the PR branch to the lane's commits only while it is
      # still at the gated SHA; otherwise the commits are dropped and the run
      # the new head started redoes the activity. A do-not-merge or human-gated
      # label, or a draft, set during the run drops them (awaiting-human). A
      # pinned action, like the revoke step, since the activity could have
      # changed PATH. The lane branch is deleted either way.
      - name: Move the PR branch to the lane's commits
        id: promote
        if: always() && steps.lane-branch.outputs.branch != '' && inputs.issue-number == ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          HEAD_REF: ${{ steps.gate.outputs.head-ref }}
          LANE_BRANCH: ${{ steps.lane-branch.outputs.branch }}
          PR_NUMBER: ${{ steps.gate.outputs.pr-number }}
          HOLD_LABELS: ${{ steps.hold-label.outputs.labels }}
          READ_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.lane-token.outputs.token }}
          retries: 0
          script: |
            const { HEAD_SHA, HEAD_REF, LANE_BRANCH } = process.env;
            const { PR_NUMBER, HOLD_LABELS, READ_TOKEN } = process.env;
            core.setOutput('skip-reason', '');
            const tip = async (branch) =>
              (await github.request('GET /repos/{owner}/{repo}/git/ref/{ref}', { ...context.repo, ref: `heads/${branch}` }))
                .data.object.sha;
            try {
              const lane = await tip(LANE_BRANCH);
              if (lane === HEAD_SHA) {
                core.info('The activity made no commits');
                return;
              }
              // A hold or a draft set while the model worked stops the push:
              // the config decided the hold
              // predicates only at the start of the job. Read fresh with the
              // job's read-only token through fetch, since github-script gives
              // the script no second client.
              if (!HOLD_LABELS) {
                core.setFailed('No hold labels were read from the base; the PR branch is not moved');
                return;
              }
              const holds = new Set(['do-not-merge', ...JSON.parse(HOLD_LABELS)]);
              const read = async (path) => {
                const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${context.repo.owner}/${context.repo.repo}/${path}`, {
                  headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${READ_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28' },
                });
                if (!response.ok) {
                  throw new Error(`Reading ${path} answered ${response.status}; the PR branch is not moved`);
                }
                // More labels than one page holds could hide a hold.
                if (/rel="next"/.test(response.headers.get('link') ?? '')) {
                  throw new Error(`${path} has more than one page; the PR branch is not moved`);
                }
                return response.json();
              };
              const pull = await read(`pulls/${Number(PR_NUMBER)}`);
              const labels = await read(`issues/${Number(PR_NUMBER)}/labels?per_page=100`);
              const held = labels.map((label) => label.name).filter((name) => holds.has(name));
              if (held.length || pull.draft !== false) {
                core.info(`The PR is ${held.length ? `held (${held.join(', ')})` : 'a draft'}; the lane's commits (${lane}) are dropped`);
                core.setOutput('skip-reason', 'awaiting-human');
                return;
              }
              // The last read before the move, to keep its window short.
              const head = await tip(HEAD_REF);
              if (head !== HEAD_SHA) {
                core.setFailed(`The PR branch moved from ${HEAD_SHA} to ${head} during the run, so the lane's commits (${lane}) are not applied; the run for the new head redoes the activity`);
                return;
              }
              // force: false refuses anything but a fast-forward.
              await github.rest.git.updateRef({ ...context.repo, ref: `heads/${HEAD_REF}`, sha: lane, force: false });
              // The push is confirmed from git/ref, which GET /pulls can lag.
              const moved = await tip(HEAD_REF);
              if (moved !== lane) {
                core.setFailed(`The PR branch reads ${moved} after the update to ${lane}`);
                return;
              }
              core.info(`Moved ${HEAD_REF} from ${HEAD_SHA} to ${lane}`);
            } finally {
              // A failed cleanup must not fail an activity whose commits landed.
              await github.rest.git
                .deleteRef({ ...context.repo, ref: `heads/${LANE_BRANCH}` })
                .catch((error) => core.warning(`Could not delete ${LANE_BRANCH}: ${error.message}`));
            }

      # Issue mode, script activity: what the resolve-issue run left. A
      # missing artifact leaves the directory empty, which reads as stopped.
      - name: Download the issue outcome
        if: >-
          steps.lane-token.outputs.token != '' && inputs.issue-number != ''
          && steps.config.outputs.kind == 'script'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: work-outcome-${{ inputs.issue-number }}
          path: ${{ runner.temp }}/work-outcome

      # Issue mode, reuse: the summary pass's file, if it left one. A missing
      # artifact leaves the directory empty, which keeps the fixed text.
      - name: Download the reused branch's summary
        if: >-
          steps.lane-token.outputs.token != '' && inputs.issue-number != ''
          && steps.config.outputs.kind == 'script' && inputs.reuse-branch != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reuse-summary-${{ inputs.issue-number }}
          path: ${{ runner.temp }}/reuse-summary

      # A script that gets GH_TOKEN must not execute code from the PR head.
      - name: Run the script activity
        id: act-script
        if: steps.lane-token.outputs.token != '' && steps.config.outputs.kind == 'script'
        env:
          SCRIPT: ${{ steps.config.outputs.script }}
          RESOLVED: ${{ runner.temp }}/resolved-config.json
          LANE_TOKEN: ${{ steps.lane-token.outputs.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr-number }}
          HEAD_SHA: ${{ inputs.issue-number != '' && steps.issue-start.outputs.sha || steps.gate.outputs.head-sha }}
          BASE_SHA: ${{ steps.trusted-base.outputs.commit }}
          # Checked against the escalation enum by the job's first step.
          ESCALATION_REASON: ${{ inputs.escalation-reason }}
          TRACKER_CONFIG: ${{ runner.temp }}/base-script/.work-item-tracker.json
          TRACKER_SHA256: ${{ steps.tracker-config.outputs.sha256 }}
          SKIP_REASON_FILE: ${{ runner.temp }}/skip-reason
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          WORK_OUTCOME_DIR: ${{ runner.temp }}/work-outcome
          # Checked against this issue's lane branch by the job's first step.
          REUSE_BRANCH: ${{ inputs.reuse-branch }}
          REUSE_SUMMARY_DIR: ${{ inputs.reuse-branch != '' && format('{0}/reuse-summary', runner.temp) || '' }}
          # Parsed and checked against the lane branch by report-outcome.
          RUNNER_CHECKS: ${{ inputs.runner-checks }}
          # Checked against the four reasons by the job's first step.
          DIMENSION_SKIP: ${{ inputs.dimension-skip }}
          # review-replies only; empty otherwise.
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          FEEDBACK_REPLIES_DIR: ${{ inputs.review-replies && format('{0}/feedback-replies', runner.temp) || '' }}
          TRUSTED_ACTORS: ${{ (inputs.review-replies || inputs.issue-number != '') && format('{0}/base-script/.trusted-actors.json', runner.temp) || '' }}
          RUN_SHA256: ${{ inputs.review-run-sha256 }}
          REPLIES_SHA256: ${{ inputs.review-replies-sha256 }}
          REVIEW_PATCH_STATE: ${{ inputs.review-replies && inputs.review-patch-state || '' }}
          ADJUDICATION_DIR: ${{ inputs.review-replies && inputs.review-adjudication-attempt != '' && format('{0}/feedback-adjudication', runner.temp) || '' }}
          ADJUDICATION_SHA256: ${{ inputs.review-replies && inputs.review-adjudication-sha256 || '' }}
          # Issue mode, apply-patch: the new lane branch, named by the model
          # job's patch attempt so a re-run of this job names the same one.
          HEAD_REF: >-
            ${{ inputs.issue-number != ''
            && format('{0}/issue-{1}-{2}-{3}', inputs.lane, inputs.issue-number, github.run_id, inputs.patch-attempt)
            || steps.gate.outputs.head-ref }}
          MODEL_RUN_ATTEMPT: ${{ inputs.review-replies-attempt }}
          # dependency-verdict only; empty otherwise.
          DEPENDENCY_VERDICT_DIR: ${{ inputs.dependency-verdict && format('{0}/dependency-verdict', runner.temp) || '' }}
          DEPENDENCY_RUN_SHA256: ${{ inputs.dependency-run-sha256 }}
          DEPENDENCY_VERDICT_SHA256: ${{ inputs.dependency-verdict-sha256 }}
          DEPENDENCY_HEAD_SHA: ${{ inputs.dependency-head-sha }}
          DEPENDENCY_RUN_ATTEMPT: ${{ inputs.dependency-run-attempt }}
          DEPENDENCY_PATCH_STATE: ${{ inputs.dependency-verdict && inputs.dependency-patch-state || '' }}
          # review-replies and dependency-verdict: the scan refusal markers
          # and whether their download failed (address-feedback.mjs
          # scanRefusal).
          SCAN_REFUSED_DIR: ${{ (inputs.review-replies || inputs.dependency-verdict) && format('{0}/scan-refused', runner.temp) || '' }}
          SCAN_REFUSED_READ: ${{ steps.scan-refused.outcome }}
          # apply-patch only; empty otherwise. The select step checked the
          # patch before the mint; the script checks its SHA-256 again.
          PREPARE: ${{ steps.config.outputs.prepare }}
          PATCH_FILE: ${{ steps.config.outputs.prepare == 'apply-patch' && format('{0}/lane-patch/patch.diff', runner.temp) || '' }}
          PATCH_SHA256: ${{ steps.config.outputs.prepare == 'apply-patch' && inputs.patch-sha256 || '' }}
          HOLD_LABELS: ${{ steps.hold-label.outputs.labels }}
          ESCALATION_REASON_FILE: ${{ runner.temp }}/escalation-reason
          # apply-patch.mjs only: the trusted rules copy, the target, and what
          # names the commit; the issue target's required labels.
          BASE_DIR: ${{ steps.apply-base.outputs.dir }}
          PATCH_TARGET: ${{ inputs.issue-number != '' && 'issue' || 'pr' }}
          PATCH_PREPARE: ${{ inputs.patch-prepare }}
          PATCH_HEAD_SHA: ${{ inputs.issue-number != '' && steps.issue-start.outputs.sha || inputs.patch-head-sha }}
          # Issue mode: the default-branch commit the issue-start step checked;
          # the refusals cover everything the new branch adds since it.
          PATCH_BASE_SHA: ${{ inputs.issue-number != '' && inputs.patch-base-sha || '' }}
          LANE: ${{ inputs.lane }}
          PATCH_ACTIVITY: ${{ inputs.patch-activity }}
          REQUIRED_LABELS: ${{ steps.required-labels.outputs.required }}
          # Under the review-threads row: the thread file the check step
          # matched to the select job's SHA-256; empty otherwise.
          KEPT_THREADS_FILE: ${{ steps.patch-threads.outputs.file }}
          # Under the dependency-review row: the verdict field of the scanned
          # verdict the check step matched to the scan job's SHA-256.
          DEPENDENCY_VERDICT: ${{ steps.patch-verdict.outputs.verdict }}
          # Under the merge-base row: the pinned base, the state and conflict
          # tree the prepare step reached (the select job's, or it failed),
          # the default branch's name for the message, and the base copy of
          # tree-entries.sh with its SHA-256.
          MERGE_BASE_SHA: ${{ inputs.patch-prepare == 'merge-base' && inputs.patch-merge-base-sha || '' }}
          MERGE_STATE: ${{ inputs.patch-prepare == 'merge-base' && steps.prepare.outputs.merge-state || '' }}
          CONFLICT_TREE: ${{ inputs.patch-prepare == 'merge-base' && steps.prepare.outputs.conflict-tree || '' }}
          BASE_REF: ${{ inputs.patch-prepare == 'merge-base' && github.event.repository.default_branch || '' }}
          TREE_ENTRIES_SCRIPT: ${{ inputs.patch-prepare == 'merge-base' && format('{0}/merge-base-bin/tree-entries.sh', runner.temp) || '' }}
          TREE_ENTRIES_SHA256: ${{ inputs.patch-prepare == 'merge-base' && steps.merge-bin.outputs.tree-entries-sha256 || '' }}
        run: |
          if [ "$TRACKER_SHA256" = absent ]; then
            if [ -e "$TRACKER_CONFIG" ]; then
              echo "::error::a tracker config appeared that the base does not have"
              exit 1
            fi
          else
            sum=$(sha256sum <"$TRACKER_CONFIG")
            if [ "${sum%% *}" != "$TRACKER_SHA256" ]; then
              echo "::error::the tracker config does not match the SHA-256 recorded when it was copied from the base"
              exit 1
            fi
          fi
          ACTIVITY_ARGS=$(jq -r '.selected.args // ""' "$RESOLVED")
          export ACTIVITY_ARGS
          REVIEW_ROUNDS=$(jq -r '.loop["review-rounds"]' "$RESOLVED")
          export REVIEW_ROUNDS
          unset GH_TOKEN GITHUB_TOKEN
          if [ -n "$LANE_TOKEN" ]; then
            export GH_TOKEN="$LANE_TOKEN"
          fi
          unset LANE_TOKEN RESOLVED
          rm -f "$SKIP_REASON_FILE" "$ESCALATION_REASON_FILE"
          "$RUNNER_TEMP/base-script/$(basename "$SCRIPT")"
          reason=""
          if [ -s "$SKIP_REASON_FILE" ]; then
            reason=$(head -n 1 "$SKIP_REASON_FILE" | tr -d '\r')
            if ! [[ $reason =~ ^[a-z]+(-[a-z]+)*$ ]]; then
              echo "::error::the skip reason file holds no skip reason"
              exit 1
            fi
          fi
          echo "skip-reason=$reason" >>"$GITHUB_OUTPUT"
          # Only the reply, verdict and apply-patch scripts escalate from
          # here, each with its own reasons.
          escalation=""
          if [ -s "$ESCALATION_REASON_FILE" ]; then
            escalation=$(head -n 1 "$ESCALATION_REASON_FILE" | tr -d '\r')
            # apply-patch under the merge-base row gives the merge's reasons alone.
            if [ "$PREPARE:$PATCH_PREPARE" = apply-patch:merge-base ]; then
              case $escalation in
                unresolved-conflict | workflow-staged | unexpected-path-staged) ;;
                conflict-patch-invalid | conflict-patch-not-applied | conflict-patch-protected-path) ;;
                *) echo "::error::the escalation reason file holds no reason this script may give"; exit 1 ;;
              esac
              echo "escalation-reason=$escalation" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            case "$FEEDBACK_REPLIES_DIR:$escalation" in
              ?*:feedback-uncertain | ?*:feedback-not-landed | ?*:feedback-invalid) ;;
              ?*:feedback-partial | ?*:feedback-incomplete | ?*:feedback-disputed) ;;
              ?*:feedback-unadjudicated | ?*:feedback-question-intent | ?*:feedback-question-design) ;;
              ?*:feedback-question-security) ;;
              :ci-fix-invalid | :ci-fix-protected-path | :ci-fix-not-applied | :patch-invalid | :patch-protected-path | :patch-not-applied | :patch-empty)
                [ "$PREPARE" = apply-patch ] || { echo "::error::the escalation reason file holds no reason this script may give"; exit 1; }
                ;;
              *)
                # The verdict script's reasons, only in dependency-verdict mode.
                case "$FEEDBACK_REPLIES_DIR:$DEPENDENCY_VERDICT_DIR:$escalation" in
                  :?*:dependency-invalid | :?*:dependency-fix-not-landed) ;;
                  :?*:dependency-security-close | :?*:dependency-escalate | :?*:dependency-config-unreadable) ;;
                  :?*:dependency-files-truncated | :?*:dependency-control-uncited | :?*:dependency-workflow-unpinned) ;;
                  :?*:dependency-fix-refused) ;;
                  *) echo "::error::the escalation reason file holds no reason this script may give"; exit 1 ;;
                esac
                ;;
            esac
          fi
          echo "escalation-reason=$escalation" >>"$GITHUB_OUTPUT"

      # Issue mode, apply-patch: the model job's lane.json names no branch,
      # since that job made none; the branch this job made is written into it
      # and the outcome uploaded again for run-checks and report-outcome. The
      # name comes from the script's output, which the shape check below
      # holds to this run's own lane branch. A run that made no branch leaves
      # the outcome as the model job wrote it.
      - name: Name the issue branch in the outcome
        if: >-
          inputs.issue-number != '' && steps.config.outputs.prepare == 'apply-patch'
          && steps.act-script.outcome == 'success' && steps.act-script.outputs.branch != ''
        env:
          BRANCH: ${{ steps.act-script.outputs.branch }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          LANE: ${{ inputs.lane }}
          OUT_DIR: ${{ runner.temp }}/work-outcome
        run: |
          shape="^$LANE/issue-$ISSUE_NUMBER-$GITHUB_RUN_ID-[1-9][0-9]*$"
          if ! [[ $BRANCH =~ $shape ]] || [ ! -f "$OUT_DIR/lane.json" ] || [ -L "$OUT_DIR/lane.json" ]; then
            echo "::error::no lane.json to name this run's lane branch in"
            exit 1
          fi
          jq --arg branch "$BRANCH" '.branch = $branch' "$OUT_DIR/lane.json" >"$OUT_DIR/lane.json.new"
          mv "$OUT_DIR/lane.json.new" "$OUT_DIR/lane.json"

      - name: Upload the named issue outcome
        if: >-
          inputs.issue-number != '' && steps.config.outputs.prepare == 'apply-patch'
          && steps.act-script.outcome == 'success' && steps.act-script.outputs.branch != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: work-outcome-${{ inputs.issue-number }}
          path: |
            ${{ runner.temp }}/work-outcome/lane.json
            ${{ runner.temp }}/work-outcome/work-outcome.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      # Written after head code ran, so the report job only cross-checks it.
      - name: Write the verdict
        if: always()
        env:
          LANE: ${{ inputs.lane }}
          ACTIVITY: ${{ inputs.activity }}
          KILL_PROCEED: ${{ steps.kill.outputs.proceed }}
          KILL_REASON: ${{ steps.kill.outputs.reason }}
          TRIGGER_PROCEED: ${{ steps.gate.outputs.proceed }}
          TRIGGER_REASON: ${{ steps.gate.outputs.reason }}
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          SKIP_REASON: >-
            ${{ steps.config.outputs.skip-reason || steps.head-recheck.outputs.skip-reason
            || steps.lane-token.outputs.skip-reason
            || steps.prepare.outputs.skip-reason || steps.promote.outputs.skip-reason
            || steps.act-script.outputs.skip-reason
            || steps.patch-select.outputs.skip-reason }}
          ACT_OUTCOME: >-
            ${{ steps.act-result.outputs.outcome == 'success'
            && (steps.config.outputs.gating == 'gate' && steps.skill-verdict.outcome != 'success'
            || steps.promote.outcome == 'failure' || steps.act-turns.outcome != 'success') && 'failure'
            || steps.act-skill.outcome != 'skipped' && (steps.act-result.outputs.outcome || steps.act-skill.outcome)
            || steps.act-script.outcome }}
          VERDICT_DIR: ${{ runner.temp }}/verdict
        run: |
          mkdir -p "$VERDICT_DIR"
          jq -n \
            --arg lane "$LANE" \
            --arg activity "$ACTIVITY" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg head "$HEAD_SHA" \
            --arg kill_proceed "$KILL_PROCEED" --arg kill_reason "$KILL_REASON" \
            --arg trigger_proceed "$TRIGGER_PROCEED" --arg trigger_reason "$TRIGGER_REASON" \
            --arg config "$CONFIG_OUTCOME" \
            --arg skip "$SKIP_REASON" \
            --arg act "$ACT_OUTCOME" \
            'def gate($proceed; $reason): if $proceed == "" then null else {proceed: $proceed, reason: $reason} end;
            def nullable: if . == "" then null else . end;
            {
              version: 1,
              lane: $lane,
              activity: $activity,
              "run-url": $run_url,
              "head-sha": ($head | nullable),
              gates: {"kill-switch": gate($kill_proceed; $kill_reason), trigger: gate($trigger_proceed; $trigger_reason)},
              config: ({success: "valid", failure: "invalid"}[$config] // "not-read"),
              "skip-reason": ($skip | nullable),
              outcome: (if $act == "success" or $act == "failure" or $act == "skipped" then $act else "not-run" end),
              "dirty-tree": null
            }' >"$VERDICT_DIR/verdict.json"

      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdict-${{ inputs.lane }}-${{ inputs.activity }}-${{ github.run_attempt }}${{ inputs.patch-model-rung == '1' && '-rung-up' || '' }}
          path: ${{ runner.temp }}/verdict/verdict.json
          retention-days: 1
          if-no-files-found: error

      # The token would live an hour; revoking it ends it now (probe P5 found
      # revocation immediate). A pinned action rather than a shell step, so no
      # binary resolved through PATH or BASH_ENV, which the activity could have
      # changed, runs with the token. A backstop, not a control (ADR 0058), so
      # it never fails the job: a DELETE other than 204 is a warning, and a 204
      # whose read-back is not yet refused with 401 is a notice.
      - name: Revoke the lane token
        if: always() && steps.lane-token.outputs.token != ''
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.lane-token.outputs.token }}
          retries: 0
          script: |
            const status = async (route) => {
              try {
                return (await github.request(route)).status;
              } catch (error) {
                return error.status ?? `error: ${error.message}`;
              }
            };
            const revoke = await status('DELETE /installation/token');
            const after = await status('GET /installation/repositories');
            core.info(`DELETE /installation/token: ${revoke}; then GET /installation/repositories: ${after}`);
            if (revoke !== 204) {
              core.warning(`the lane token was not revoked (DELETE ${revoke}); it expires within the hour`);
            } else if (after !== 401) {
              core.notice(`DELETE returned 204 but the read-back was not yet refused (GET ${after}); the lane token expires within the hour`);
            } else {
              core.info('the lane token is confirmed revoked (DELETE 204, GET 401)');
            }

  report:
    needs: run
    # Fork PRs get a read-only GITHUB_TOKEN that cannot write checks, and the
    # lanes App's own pull_request events skip the run job. Issue mode has no
    # PR head to post a check on.
    if: >-
      always() && inputs.issue-number == ''
      && !(github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && !(github.event_name == 'pull_request'
      && format('{0}', github.event.sender.id) == vars.AUTOMATION_LANES_APP_SENDER_ID)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # issues: write lets check-signed-commits add its label and comment. Every
    # caller job grants it; no job that runs the model holds it.
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      # The default branch tip, then the run job's base SHA only when the
      # default branch holds it. The event's base SHA is never checked out:
      # a PR into another branch would choose the actions that post its check.
      - name: Assert the default branch is set
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error::the event names no default branch"
            exit 1
          fi

      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .base
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the run job's base SHA when the default branch holds it
        env:
          BASE_SHA: ${{ needs.run.outputs.base-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ $BASE_SHA =~ ^[0-9a-f]{40}$ ]] &&
            git -C .base merge-base --is-ancestor "$BASE_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            git -C .base checkout -q --detach "$BASE_SHA"
          else
            echo "No base SHA on the default branch; staying on the default branch tip"
          fi

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # A run job that never uploaded a verdict is already a failure, or a
      # neutral superseded-sha on a cancel, in report-check-run's decision.
      - name: Download the verdict
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verdict-${{ inputs.lane }}-${{ inputs.activity }}-${{ github.run_attempt }}${{ inputs.patch-model-rung == '1' && '-rung-up' || '' }}
          path: ${{ runner.temp }}/verdict

      - name: Check the lane's commits are signed
        id: signed
        if: >-
          always()
          && needs.run.outputs.can-commit != 'false'
          && needs.run.outputs.pr-number != ''
        uses: ./.base/.github/actions/check-signed-commits # zizmor: ignore[self-repository]
        with:
          pr-number: ${{ needs.run.outputs.pr-number }}
          since-sha: ${{ needs.run.outputs.head-sha }}
          github-token: ${{ github.token }}

      # A cancelled run is superseded only when the PR has a newer head.
      # GET /pulls can lag a push such as the promote step's, so when the
      # branch's git/ref is readable the pull is re-read until its head
      # matches, at most 5 reads 2 s apart; the last read stands.
      - name: Read the PR's current head SHA
        id: pr-head
        if: always()
        env:
          PR_NUMBER: ${{ needs.run.outputs.pr-number || github.event.pull_request.number || inputs.pr-number }}
          HEAD_REF: ${{ needs.run.outputs.head-ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=""
          if [[ $PR_NUMBER =~ ^[1-9][0-9]*$ ]]; then
            ref_sha=""
            if [ -n "$HEAD_REF" ]; then
              ref=$(jq -rn --arg ref "$HEAD_REF" '$ref | split("/") | map(@uri) | join("/")')
              ref_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --jq .object.sha) || ref_sha=""
            fi
            for attempt in 1 2 3 4 5; do
              sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha) || sha=""
              if [ -z "$ref_sha" ] || [ "$sha" = "$ref_sha" ] || [ "$attempt" = 5 ]; then
                break
              fi
              sleep 2
            done
          fi
          if ! [[ $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "No PR head SHA read"
            sha=""
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # Off pull_request, an empty run head SHA would fall back to github.sha,
      # the dispatch ref, which is not the PR's commit, so nothing is posted.
      - name: Note that no check is posted without a head SHA
        if: >-
          always() && github.event_name != 'pull_request'
          && needs.run.outputs.head-sha == ''
        run: echo "The run job gated no head SHA, so no check run is posted." >>"$GITHUB_STEP_SUMMARY"

      - name: Post the check run
        if: >-
          always() && !(github.event_name != 'pull_request'
          && needs.run.outputs.head-sha == '')
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: ${{ inputs.lane }}
          activity: ${{ inputs.activity }}
          run-result: ${{ needs.run.result }}
          act-outcome: ${{ needs.run.outputs.act-outcome }}
          run-failure: ${{ needs.run.outputs.run-failure }}
          gate-reason: ${{ needs.run.outputs.gate-reason }}
          head-sha: ${{ needs.run.outputs.head-sha }}
          pr-head-sha: ${{ steps.pr-head.outputs.sha }}
          can-commit: ${{ needs.run.outputs.can-commit }}
          all-verified: ${{ steps.signed.outputs.all-verified }}
          unverified: ${{ steps.signed.outputs.unverified }}
          lane-class: ${{ needs.run.outputs.lane-class }}
          lane-resets: ${{ needs.run.outputs.lane-resets }}
          lane-turns: ${{ needs.run.outputs.lane-turns }}
          lane-max-turns: ${{ needs.run.outputs.lane-max-turns }}
          lane-models: ${{ needs.run.outputs.lane-models }}
          lane-profile: ${{ needs.run.outputs.lane-profile }}
          verdict-path: ${{ runner.temp }}/verdict/verdict.json
          base-path: .base
          head-sha-fallback: ${{ github.event.pull_request.head.sha || github.sha }}
          github-token: ${{ github.token }}
