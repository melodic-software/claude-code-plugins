name: PR Unblock Dispatch

# GitHub runs no pull_request workflow on a PR with a merge conflict, so the
# pr-unblock lane is started from here instead: each push to main lists the
# open PRs GitHub reports as conflicting and dispatches pr-unblock.yml for
# them (.github/scripts/pr-unblock/dispatch.mjs). A queue merge of several
# PRs raises one push, so the listing reads main as it is now, not the push.
# The same run dispatches review-dependency for each open Dependabot PR the
# classifier sorts `review` whose head has no review-dependency check run yet
# (.github/scripts/pr-unblock/dependency-dispatch.mjs), and fix-ci for each
# open lanes App PR, or idle PR of an owner in the config's `adoption`
# section, whose head's ci-status failed (or passed while its pr-test-platforms
# run failed), with no re-run of that run going and no infra-only first
# failure's reconciler re-run still due, and has no fix-ci run yet,
# at most limits.fix-ci-per-run per run, from one GraphQL query whose
# rateLimit.cost it logs (.github/scripts/pr-unblock/fix-ci-dispatch.mjs).
# pr-refine.yml's fix-docs is started only by the PR's own event, in the refine
# job below: once per open, ready PR into main that changes a Markdown file,
# carries no hold label and never had a fix-docs check run, when the event's
# sender is the lanes App or a listed human (no other sender's PR gets one),
# except Dependabot, the release App and the standards-sync App, and not for a
# work-resolve-issue PR tidied in its own run (within the tidy cutoffs)
# (.github/scripts/pr-unblock/refine-event-dispatch.mjs over
# fix-docs-dispatch.mjs); limits.fix-docs-per-run 0 turns it off. The same
# job starts each pr-refine activity refine-dispatch.activities lists on a
# listed human's event, never the lanes App's; the list is empty by default.
#
# It also runs half-hourly, five minutes after each
# maintenance-reconcile-lost-runs tick, so a PR whose reconciler re-run failed
# gets fix-ci at the first tick after that failure, not at the next push to
# main. A tick runs the same listings as a push run and, like it, starts no
# fix-docs; heads the dispatch record
# holds are not read again. pr-unblock.yml's trigger gate and the broker accept
# a dispatcher run started by a push, a schedule or a listed human, and for
# pr-refine.yml alone a pull_request_target run (the refine job, ADR 0090).
#
# No model and no App token: the job's GITHUB_TOKEN can only read and start
# workflow runs. A run started by hand, or a re-run of a push run, must come
# from a listed trusted human. A re-run of a scheduled run fails at the trigger
# check, which handles no schedule event; the next tick replaces it. The
# dispatched lane runs its own trigger gate, kill switch and config. Only
# fix-ci and fix-docs filter by author and hold label: fix-ci to spend no
# model run on a PR the lane would skip, fix-docs to leave alone PRs whose
# files are generated or synced.
#
# The job token's rate-limit readings, from the script's own responses, are
# logged at the end of the job (.github/actions/log-api-budget), and the
# script logs its own call counts.
# The heads whose check runs already handle them for good are carried from
# run to run in the Actions cache (dispatch-record.mjs), so a later run skips
# their reads; a head a resolve-conflicts select job's stop handles is kept
# with the base tip it was judged against, and read again once main moves. A
# run only skips work on the record, never dispatches on it.

# API_BUDGET_HOLD (outage posture element 2): only the dispatch step sets it; the trigger check
# and the pace step are gates.
# A step opts in only once its script is shown to hold green with a notice on
# a refused call (rate-guard.mjs createRateLimitLatch); a gate never does, since
# a hold would pass what it could not read, so the rest still end red on a
# rate limit past the guard's budget.
on:
  push:
    branches: [main]
  # Minutes 9 and 39: five after the reconciler's 4 and 34, and used by no
  # other schedule here.
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch: {}
  # Starts fix-docs on a PR's own event, the only start it has: the refine
  # job below. From 2026-12-02 GitHub blocks pull_request_target in public
  # repositories unless an Actions event policy allows it for this file;
  # without one, fix-docs stops while reviews still run. pull_request_target runs this file and its checkout from main,
  # never the PR's copy (ADR 0090). Opened, reopened or turned ready, and a
  # push, which may add the PR's first Markdown file; a draft is skipped.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]

permissions: {}

jobs:
  dispatch:
    # A dispatch on another branch would run that branch's copy of this file.
    # A pull_request_target run also reports main as its ref; the refine job
    # takes it.
    name: Dispatch
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target'
    # A burst of pushes collapses into one listing: a push cancels the run
    # going, since the newest listing reads main as it is now. A tick or a
    # hand run never cancels one going; it waits, and only replaces a run
    # still waiting. The record steps run on cancel too (always()), so a run
    # cancelled after a dispatch still records the runs it started; its
    # dispatch-record changes are not saved, so the next run reads those heads
    # again, and its in-flight check skips a PR whose dispatched run is queued.
    concurrency:
      group: pr-unblock-dispatch
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out main
      pull-requests: read # list open PRs and their mergeable state
      checks: read # skip a PR whose head already has a pr-unblock check run; read ci-status
      actions: write # list and dispatch pr-unblock.yml runs
    env:
      npm_config_audit: "false"
      npm_config_fetch_timeout: "60000"
      npm_config_fund: "false"
      # npm's fetch timeout and retries, from the one file that sets them.
      npm_config_globalconfig: ${{ github.workspace }}/.base/.github/npm-fetch.npmrc
    steps:
      - name: Resolve main's tip
        id: tip
        env:
          TIP_BRANCH: main
          GIT_TERMINAL_PROMPT: "0"
        run: |
          until sha=$(timeout 60 git -C "$RUNNER_TEMP" ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TIP_BRANCH" |
              awk -v ref="refs/heads/$TIP_BRANCH" '$2 == ref { print $1 }') && [[ $sha =~ ^[0-9a-f]{40}$ ]]; do
            ((++i < 3)) || { echo "::error::the tip of $TIP_BRANCH did not resolve"; exit 1; }
            sleep "$((RANDOM % (2 * i + 1)))"
          done
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Check out the default branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Log the checked-out main tip
        run: echo "main tip $(git -C .base rev-parse HEAD)"

      - name: Set up Node
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # Skips the run while Actions or npm installs report a degraded component,
      # with a logged reason; fails open (.github/actions/check-upstream-status).
      - name: Check upstream status
        id: upstream
        if: steps.kill.outputs.proceed == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.base/.github/actions/check-upstream-status # zizmor: ignore[self-repository]

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
        run: |
          echo "::notice::the lanes kill switch stops this run (reason: ${REASON:-unreadable}); nothing dispatched"

      # A push or scheduled run on its first attempt was started by the event
      # itself. A hand run, or any re-run, is checked against the base list:
      # the sender and the re-runner must be listed, and the lanes App bot is
      # denied. A scheduled run's re-run stops here with no-pr.
      - name: Check the trigger
        id: gate
        if: >-
          steps.kill.outputs.proceed == 'true'
          && (github.event_name == 'workflow_dispatch' || github.run_attempt != '1')
        env:
          API_BUDGET_TOKEN: github-token
        uses: ./.base/.github/actions/check-trusted-trigger # zizmor: ignore[self-repository]
        with:
          require-pr: false
          require-kind: human
          dispatched-workflow: .github/workflows/pr-unblock.yml
          trusted-actors-path: .base/.github/standards/trusted-actors/trusted-actors.json
          denied-actor-ids: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          triggering-actor: ${{ github.triggering_actor }}

      - name: Stop on an untrusted trigger
        if: steps.gate.outcome != 'skipped' && steps.gate.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "::error::${REASON:-no-pr}: a re-run of a scheduled run is not supported; run the workflow by hand or wait for the next tick"
            exit 1
          fi
          echo "::error::${REASON:-untrusted-actor}: this run was not started by a listed trusted human"
          exit 1

      # The base config's limits.api, in resolve-config's output shape, for
      # the pacer; a failed read leaves rate-limits.json's defaults.
      - name: Read the pace override from the base config
        if: steps.kill.outputs.proceed == 'true' && steps.upstream.outputs.degraded != 'true'
        continue-on-error: true
        run: |
          yq -o=json '{"limits": {"api": (.limits.api // {})}}' .base/docs/conventions/pr-pipeline.yaml >"$RUNNER_TEMP/pace-config.json"

      # A schedule tick skips its work while the GITHUB_TOKEN pool's remaining
      # at reset, projected at this window's burn rate, is under limits.api
      # github-token pace (pr-pipeline.yaml over rate-limits.json; 0 is off),
      # and only when the previous scheduled run marked a clean pass, so the timer
      # lanes slow to half cadence before the breaker stops every lane. Any
      # other event, or a read that fails, runs as before
      # (.github/actions/log-api-budget/pace.mjs).
      - name: Pace the tick on the GITHUB_TOKEN burn rate
        id: pace
        if: steps.kill.outputs.proceed == 'true' && steps.upstream.outputs.degraded != 'true'
        continue-on-error: true
        env:
          RESOLVED_CONFIG: ${{ runner.temp }}/pace-config.json
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PACE_WORK_STEP: Mark this tick's work done
        run: node .base/.github/actions/log-api-budget/pace.mjs

      # dispatch.mjs reads the base config's `limits` through the base's
      # resolve-config, which needs its dependencies.
      - name: Install resolve-config's dependencies
        timeout-minutes: 5
        if: >-
          steps.kill.outputs.proceed == 'true' && steps.upstream.outputs.degraded != 'true'
          && (steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true')
          && steps.pace.outputs.paced != 'true'
        run: npm ci --ignore-scripts --omit=dev --prefix .base/.github/actions/resolve-config

      # The newest record a run of this workflow saved; none on the first run.
      - name: Restore the dispatch record
        if: >-
          steps.kill.outputs.proceed == 'true' && steps.upstream.outputs.degraded != 'true'
          && (steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true')
          && steps.pace.outputs.paced != 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pr-unblock-dispatch-record.json
          key: pr-unblock-dispatch-record-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pr-unblock-dispatch-record-

      # The gate's verifier reader (babysit_verify_evidence.py), which the
      # dispatch reads for a pull request whose pr-verify FAILs are at the cap
      # (verify-cap.mjs): the repository's pinned interpreter and PyYAML entry.
      # A failed install warns; the reader then fails and the round runs.
      # Both steps take the dispatch step's gate, so a paced tick installs
      # nothing it would not use.
      - name: Set up Python
        if: >-
          steps.kill.outputs.proceed == 'true' && steps.upstream.outputs.degraded != 'true'
          && (steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true')
          && steps.pace.outputs.paced != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .base/.python-version

      - name: Install the pinned YAML reader
        if: >-
          steps.kill.outputs.proceed == 'true' && steps.upstream.outputs.degraded != 'true'
          && (steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true')
          && steps.pace.outputs.paced != 'true'
        continue-on-error: true
        run: |
          awk '/^pyyaml==/ { keep = 1 } keep { print } keep && !/\\$/ { exit }' \
            .base/.github/requirements-ci.txt >"$RUNNER_TEMP/pyyaml-requirements.txt"
          python3 -m pip install --disable-pip-version-check --only-binary=:all: \
            --require-hashes --requirement "$RUNNER_TEMP/pyyaml-requirements.txt" || {
            echo "::warning::PyYAML did not install; the FAIL-cap read fails and rounds run under their own caps"
            exit 1
          }

      - name: Dispatch pr-unblock for conflicting, review-tier Dependabot and failing lanes App PRs
        id: dispatch
        if: >-
          steps.kill.outputs.proceed == 'true' && steps.upstream.outputs.degraded != 'true'
          && (steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true')
          && steps.pace.outputs.paced != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The review lanes' comment records (actions: read).
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          # A rate limit past the guard's budget refuses the call with a notice
          # (rate-guard.mjs): the refusal carries rateLimited, so a refused
          # listing dispatches nothing and a refused read skips its PR, each
          # with a warning, and a refused dispatch still ends the run red.
          API_BUDGET_HOLD: "1"
          # fix-ci skips a PR whose pr-verify FAILs are at the cap (verify-cap.mjs).
          VERIFY_EVIDENCE_SCRIPT: .base/plugins/source-control/skills/babysit-prs/scripts/babysit_verify_evidence.py
          # The reader reads the FAIL index by exact name; a pull request with
          # more index names than one whole listing costs reads that listing,
          # saved here for the next such read instead of every page again.
          BABYSIT_VERIFY_LISTING: ${{ runner.temp }}/verify-listing.json
          # The FAIL run records, run heads on main and head refs pr-merge's
          # last scheduled or hand-started run on main kept, which
          # verify-cap.mjs fetches on the first FAIL-cap read only, so a run
          # that reads no FAIL cap spends none of their calls: the reader
          # otherwise reads them for every FAIL it counts, and each read shares
          # what it adds here.
          BABYSIT_RUN_CACHE: ${{ runner.temp }}/babysit-run-cache.json
          BABYSIT_VERIFY_HEAD_REFS: ${{ runner.temp }}/head-refs-in.json
          # The reader's gh calls, with this job's read scopes.
          GH_TOKEN: ${{ github.token }}
          # fix-ci starts on PRs the lanes App opened, matched by this id, and
          # on idle PRs of the owners in the config's `adoption` section.
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          RUN_IDS_FILE: ${{ runner.temp }}/pr-unblock-run-ids
          DISPATCH_RECORD: ${{ runner.temp }}/pr-unblock-dispatch-record.json
        run: node .base/.github/scripts/pr-unblock/dispatch.mjs

      - name: Save the dispatch record
        if: always() && steps.dispatch.outputs.record-changed == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pr-unblock-dispatch-record.json
          key: pr-unblock-dispatch-record-${{ github.run_id }}-${{ github.run_attempt }}

      # The record of which runs this run dispatched: an artifact only steps of
      # this run can upload, named with every id so a reader needs one list
      # call and no download. It outlives the 10-minute dispatch window and
      # runs after a partial dispatch failure, which still sent the others,
      # and after a cancel mid-dispatch: dispatch.mjs appends each id to the
      # file as soon as its dispatch returns.
      - name: Name the dispatched-runs record
        id: record
        if: always() && steps.dispatch.outcome != 'skipped'
        env:
          RUN_IDS_FILE: ${{ runner.temp }}/pr-unblock-run-ids
        run: |
          RUN_IDS=$(tr '\n' ' ' <"$RUN_IDS_FILE" 2>/dev/null | sed 's/ *$//') || RUN_IDS=""
          if [ -z "$RUN_IDS" ]; then
            echo "no run dispatched"
            exit 0
          fi
          if [[ ! "$RUN_IDS" =~ ^[1-9][0-9]{0,14}(\ [1-9][0-9]{0,14})*$ ]]; then
            echo "::error::run-ids is not a list of run ids"
            exit 1
          fi
          printf '{"dispatcher_run_id":%s,"run_ids":[%s]}\n' "$GITHUB_RUN_ID" "${RUN_IDS// /,}" \
            >"$RUNNER_TEMP/pr-unblock-dispatched.json"
          echo "name=pr-unblock-dispatched-${RUN_IDS// /-}" >>"$GITHUB_OUTPUT"

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          always() && steps.record.outputs.name != '' && steps.record.outcome == 'success'
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/pr-unblock-dispatched.json

      - name: Record the dispatched runs
        if: >-
          (always() && steps.record.outputs.name != '' && steps.record.outcome == 'success') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.record.outputs.name }}
          path: ${{ runner.temp }}/pr-unblock-dispatched.json
          retention-days: 1
          if-no-files-found: error

      # A green run that listed the open pull requests (a failed listing
      # holds green and writes no listed). A held read for one PR or one
      # activity is read again on the next run that reaches it. The pacer
      # paces the next scheduled tick only after this step
      # (.github/actions/log-api-budget/pace.mjs).
      - name: Mark this tick's work done
        if: steps.dispatch.outputs.listed == 'true'
        run: echo "pr-unblock-dispatch listed the open pull requests"

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  # Dispatches pr-refine.yml's fix-docs for this PR under fix-docs-dispatch.mjs's
  # rule, and each refine-dispatch.activities id on a listed human's event
  # (refine-event-dispatch.mjs), and records each dispatch for the
  # trusted-trigger gate and the broker (ADR 0090). Four invariants, each
  # pinned in workflow-gates.test.mjs: main's code only, checked out at the
  # commit this file ran from, never the PR head; no PR text reaches a step,
  # only the PR number and SHAs through env:; exactly the two permissions
  # below; no secret and no App token. A burst of pushes cancels the run
  # going, and the record steps run on cancel too (always()), so a run
  # cancelled after its dispatch still records it.
  refine:
    name: Refine
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: pr-unblock-dispatch-refine-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # list and dispatch pr-refine.yml runs
      contents: read # check out main
    env:
      npm_config_audit: "false"
      npm_config_fetch_timeout: "60000"
      npm_config_fund: "false"
      # npm's fetch timeout and retries, from the one file that sets them.
      npm_config_globalconfig: ${{ github.workspace }}/.base/.github/npm-fetch.npmrc
    steps:
      # The record names this commit, which the gate and the broker check is
      # on main and holds main's copy of this file.
      - name: Check out the commit this workflow ran from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: ./.base/.github/actions/setup-pinned-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      # refine-event-dispatch.mjs reads the base config's `limits` through the
      # base's resolve-config, which needs its dependencies.
      - name: Install resolve-config's dependencies
        if: steps.kill.outputs.proceed == 'true'
        timeout-minutes: 5
        run: npm ci --ignore-scripts --omit=dev --prefix .base/.github/actions/resolve-config

      - name: Dispatch pr-refine for this PR
        id: dispatch
        if: steps.kill.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_BUDGET_TOKEN: github-token
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SENDER_ID: ${{ github.event.sender.id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_IDS_FILE: ${{ runner.temp }}/pr-refine-run-id
        run: node .base/.github/scripts/pr-unblock/refine-event-dispatch.mjs

      # Named from the commit this file ran from and the id the dispatch API
      # returned, nothing else: pr-unblock-target-dispatched-<commit>-<run id>.
      - name: Name the dispatched-run record
        id: record
        if: always() && steps.dispatch.outcome != 'skipped'
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_IDS_FILE: ${{ runner.temp }}/pr-refine-run-id
        run: |
          RUN_ID=$(head -n 1 "$RUN_IDS_FILE" 2>/dev/null) || RUN_ID=""
          if [ -z "$RUN_ID" ]; then
            echo "no run dispatched"
            exit 0
          fi
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]{0,14}$ || ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the run id or the workflow commit is malformed"
            exit 1
          fi
          printf '{"dispatcher_run_id":%s,"workflow_sha":"%s","run_id":%s}\n' "$GITHUB_RUN_ID" "$WORKFLOW_SHA" "$RUN_ID" \
            >"$RUNNER_TEMP/pr-unblock-target-dispatched.json"
          echo "name=pr-unblock-target-dispatched-$WORKFLOW_SHA-$RUN_ID" >>"$GITHUB_OUTPUT"

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          always() && steps.record.outputs.name != '' && steps.record.outcome == 'success'
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/pr-unblock-target-dispatched.json

      - name: Record the dispatched run
        if: >-
          (always() && steps.record.outputs.name != '' && steps.record.outcome == 'success') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.record.outputs.name }}
          path: ${{ runner.temp }}/pr-unblock-target-dispatched.json
          retention-days: 1
          if-no-files-found: error

      # The second dispatch of the run, when refine-dispatch.activities names
      # one, in its own record of the same form: the gate and the broker each
      # read the record naming their own run id. Two slots hold fix-docs's
      # dispatch and one per REFINE_ACTIVITIES id (refine-event-dispatch.mjs).
      - name: Name the second dispatched-run record
        id: record-2
        if: always() && steps.dispatch.outcome != 'skipped'
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_IDS_FILE: ${{ runner.temp }}/pr-refine-run-id
        run: |
          if [ -n "$(sed -n 3p "$RUN_IDS_FILE" 2>/dev/null)" ]; then
            echo "::error::more runs were dispatched than the record slots hold"
            exit 1
          fi
          RUN_ID=$(sed -n 2p "$RUN_IDS_FILE" 2>/dev/null) || RUN_ID=""
          if [ -z "$RUN_ID" ]; then
            echo "no second run dispatched"
            exit 0
          fi
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]{0,14}$ || ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the run id or the workflow commit is malformed"
            exit 1
          fi
          printf '{"dispatcher_run_id":%s,"workflow_sha":"%s","run_id":%s}\n' "$GITHUB_RUN_ID" "$WORKFLOW_SHA" "$RUN_ID" \
            >"$RUNNER_TEMP/pr-unblock-target-dispatched-2.json"
          echo "name=pr-unblock-target-dispatched-$WORKFLOW_SHA-$RUN_ID" >>"$GITHUB_OUTPUT"

      - name: Scan the second upload for credentials
        id: scan-upload-2
        if: >-
          always() && steps.record-2.outputs.name != '' && steps.record-2.outcome == 'success'
        uses: ./.base/.github/actions/scan-upload # zizmor: ignore[self-repository]
        with:
          path: ${{ runner.temp }}/pr-unblock-target-dispatched-2.json

      - name: Record the second dispatched run
        if: >-
          (always() && steps.record-2.outputs.name != '' && steps.record-2.outcome == 'success') && steps.scan-upload-2.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.record-2.outputs.name }}
          path: ${{ runner.temp }}/pr-unblock-target-dispatched-2.json
          retention-days: 1
          if-no-files-found: error

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token
