name: PR Dispatch Feedback

on:
  # workflow_run runs this file from the default branch, never a PR's copy.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [PR Review Hosted, PR Review Security Hosted, PR Verify, PR Unblock Dispatch, PR Merge, PR Review Approved, PR Review Comment Relay]
    types: [completed]

permissions: {}

concurrency:
  group: >-
    pr-dispatch-feedback-${{ github.event.workflow_run.path == '.github/workflows/pr-verify.yml'
    && format('verify-{0}', github.event.workflow_run.id)
    || github.event.workflow_run.path == '.github/workflows/pr-unblock-dispatch.yml' && 'sweep'
    || github.event.workflow_run.head_sha }}
  cancel-in-progress: false
  queue: max

env:
  # The legacy FAILs file the verdict reader takes from the default branch:
  # https://github.com/melodic-software/claude-code-plugins/blob/main/docs/conventions/pr-pipeline/README.md
  BABYSIT_VERIFY_LEGACY_FAILS: ${{ github.workspace }}/.base/.github/verify-legacy-fails.json

jobs:
  post-verify-notes:
    name: Post Verify Notes
    if: >-
      github.ref == 'refs/heads/main'
      && github.event.workflow_run.path == '.github/workflows/pr-verify.yml'
      && github.event.workflow_run.event == 'workflow_run'
      && github.event.workflow_run.conclusion != 'skipped'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.repository.full_name == github.repository
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out main
      actions: read # the pr-verify run's verdict
      pull-requests: write # read the PR and its threads; post a fail's notes; add or remove pr-verify-failed
    outputs:
      pr-number: ${{ steps.post.outputs.pr-number }}
      head-sha: ${{ steps.post.outputs.head-sha }}
      pass-head-sha: ${{ steps.post.outputs.pass-head-sha }}
      standards-sha: ${{ steps.standards.outputs.sha }}
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/
            /docs/conventions/
            /lib/publish-gate.mjs
            /plugins/multi-agent/reference/defaults.yaml
            /plugins/work-items/scripts/charge-words.json
            /.node-version
          sparse-checkout-cone-mode: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Stop on the kill switch
        if: steps.kill.outputs.proceed != 'true' && github.event.workflow_run.conclusion == 'success'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
        run: |
          echo "::error::the lanes kill switch stops this run (reason: ${REASON:-unreadable}); the verdict is applied when the lost-run reconciler re-runs this job"
          exit 1

      - name: Download the verdict
        id: verdict
        if: steps.kill.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]{0,14}$ ]]; then
            echo "::error::the upstream run id is not a run id"
            exit 1
          fi
          # shellcheck source=/dev/null
          { . .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null && api_budget_wrap_gh github-token; } || true
          # Every verdict-shaped name, then the ones the readers take (the
          # grammar write-verdict.mjs NAME and babysit_verify_evidence.NAME_RE
          # hold: at most 194 characters, the digest optional, `-i` on a FAIL
          # only, its issues ascending and once each). A verdict-shaped name
          # no reader takes fails the run rather than being skipped.
          listing=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")
          listed=$(jq -r '.artifacts[] | select(.expired == false) | .name | select(test("\\Apr-verify-[0-9]+-[0-9a-f]{40}-(fail|pass)"))' <<<"$listing")
          names=$(jq -Rr 'select(length <= 194 and (test("\\Apr-verify-[1-9][0-9]{0,9}-[0-9a-f]{40}-fail(-[0-9a-f]{16})?(-i[1-9][0-9]{0,9}([.][1-9][0-9]{0,9}){0,9})?\\z") or test("\\Apr-verify-[1-9][0-9]{0,9}-[0-9a-f]{40}-pass(-notes)?(-[0-9a-f]{16})?\\z")) and ((capture("-i(?<n>[0-9.]+)\\z") // {n: ""}).n | . == "" or ((split(".") | map(tonumber)) as $a | $a == ($a | unique))))' <<<"$listed")
          if [ "$names" != "$listed" ]; then
            echo "::error::run $RUN_ID uploaded a verdict whose name no reader takes"
            exit 1
          fi
          if [ -z "$names" ]; then
            echo "::notice::run $RUN_ID uploaded no verdict; nothing to post"
            exit 0
          fi
          name=$(head -n 1 <<<"$names")
          # The listing names the artifact's id, so the download is one call;
          # `gh run download --name` would list the run's artifacts again.
          id=$(jq -r --arg name "$name" 'first(.artifacts[] | select(.expired == false and .name == $name) | .id)' <<<"$listing")
          if [[ ! "$id" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "::error::run $RUN_ID listed $name with no artifact id"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/verdict"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" >"$RUNNER_TEMP/verdict.zip"
          unzip -p "$RUNNER_TEMP/verdict.zip" verdict.json >"$RUNNER_TEMP/verdict/verdict.json"
          echo "name=$name" >>"$GITHUB_OUTPUT"

      - name: Post a fail's notes, or find a pass's stale ones
        id: post
        if: steps.verdict.outputs.name != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          ARTIFACT_NAME: ${{ steps.verdict.outputs.name }}
          VERDICT_FILE: ${{ runner.temp }}/verdict/verdict.json
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/pr-unblock/verify-notes.mjs

      - name: Name the deferred verdict
        id: deferred
        # The actor test only saves a write: recoverDeferred re-reads the uploading run's actor.
        if: github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]' && (steps.post.outputs.head-sha != '' || steps.post.outputs.pass-head-sha != '') # zizmor: ignore[bot-conditions]
        env:
          FAIL_HEAD: ${{ steps.post.outputs.head-sha }}
          PASS_HEAD: ${{ steps.post.outputs.pass-head-sha }}
        run: |
          head=${FAIL_HEAD:-$PASS_HEAD} verdict=fail
          [ -n "$FAIL_HEAD" ] || verdict=pass
          if [[ ! $head =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the posted head is not a commit SHA"
            exit 1
          fi
          echo "$head" >"$RUNNER_TEMP/pr-feedback-deferred.txt"
          echo "name=pr-feedback-deferred-$head-$verdict" >>"$GITHUB_OUTPUT"

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          steps.deferred.outputs.name != ''
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/pr-feedback-deferred.txt

      - name: Record the deferred verdict
        if: >-
          (steps.deferred.outputs.name != '') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.deferred.outputs.name }}
          path: ${{ runner.temp }}/pr-feedback-deferred.txt
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  dispatch:
    name: Dispatch
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/main'
      && ((needs.post-verify-notes.outputs.head-sha != ''
      || needs.post-verify-notes.outputs.pass-head-sha != '')
      && (github.run_attempt == '1' || github.triggering_actor != 'github-actions[bot]')
      || github.event.workflow_run.path == '.github/workflows/pr-unblock-dispatch.yml'
      && github.event.workflow_run.event == 'schedule'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.repository.full_name == github.repository
      || github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && !startsWith(github.event.workflow_run.head_branch, 'dependabot/')
      && github.event.workflow_run.conclusion != 'skipped'
      && github.event.workflow_run.conclusion != 'cancelled'
      || github.event.workflow_run.path == '.github/workflows/pr-merge.yml'
      && github.event.workflow_run.event == 'pull_request_target'
      && github.event.workflow_run.repository.full_name == github.repository
      && github.event.workflow_run.head_repository.full_name == github.repository
      && startsWith(github.event.workflow_run.head_branch, 'work-resolve-issue/issue-')
      || github.event.workflow_run.path == '.github/workflows/pr-review-comment-relay.yml'
      && github.event.workflow_run.event == 'pull_request_review_comment'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.repository.full_name == github.repository
      && github.event.workflow_run.head_repository.full_name == github.repository
      && startsWith(github.event.workflow_run.head_branch, 'work-resolve-issue/issue-')
      && github.event.workflow_run.actor.type == 'User') }}
    needs: post-verify-notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out main
      pull-requests: read # the PR, its comments and review threads
      checks: read # skip a head that already has an address-feedback check run; a refused round's annotations
      statuses: read # the sweep's read of a head's pr-unblock/address-feedback stop
      actions: write # list pr-unblock runs; dispatch pr-unblock.yml
    env:
      npm_config_audit: "false"
      npm_config_fetch_timeout: "60000"
      npm_config_fund: "false"
      npm_config_globalconfig: ${{ github.workspace }}/.base/.github/npm-fetch.npmrc
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/
            /docs/conventions/
            /lib/publish-gate.mjs
            /plugins/multi-agent/reference/defaults.yaml
            /plugins/source-control/lib/yaml-subset.awk
            /plugins/source-control/skills/babysit-prs/scripts/
            /plugins/work-items/scripts/charge-words.json
            /.node-version
            /.python-version
          sparse-checkout-cone-mode: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.post-verify-notes.outputs.standards-sha }}

      - name: Write the source-control trust settings
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@main
        with:
          drop-in-file: .base/.github/source-control-settings.json
          drop-in-name: 50-source-control

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Check upstream status
        id: upstream
        if: steps.kill.outputs.proceed == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.base/.github/actions/check-upstream-status # zizmor: ignore[self-repository]

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
        run: |
          echo "::notice::the lanes kill switch stops this run (reason: ${REASON:-unreadable}); nothing dispatched"

      - name: Install resolve-config's dependencies
        timeout-minutes: 5
        if: steps.kill.outputs.proceed == 'true' && steps.upstream.outputs.degraded != 'true'
        run: npm ci --ignore-scripts --omit=dev --prefix .base/.github/actions/resolve-config

      - name: Set up Python
        if: steps.kill.outputs.proceed == 'true' && steps.upstream.outputs.degraded != 'true'
        uses: actions/setup-python@v7
        with:
          python-version-file: .base/.python-version

      - name: Install the pinned YAML reader
        if: steps.kill.outputs.proceed == 'true' && steps.upstream.outputs.degraded != 'true'
        continue-on-error: true
        run: bash .base/.github/scripts/lib/install-pinned-pyyaml.sh 'PyYAML did not install; the FAIL-cap read fails and rounds run under their own caps'

      - name: Dispatch address-feedback
        id: dispatch
        if: steps.kill.outputs.proceed == 'true' && steps.upstream.outputs.degraded != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          VERIFY_EVIDENCE_SCRIPT: .base/plugins/source-control/skills/babysit-prs/scripts/babysit_verify_evidence.py
          BABYSIT_VERIFY_LISTING: ${{ runner.temp }}/verify-listing.json
          BABYSIT_RUN_CACHE: ${{ runner.temp }}/babysit-run-cache.json
          BABYSIT_VERIFY_HEAD_REFS: ${{ runner.temp }}/head-refs-in.json
          GH_TOKEN: ${{ github.token }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          TRUSTED_ACTORS: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          DISPATCH_RECORD: ${{ runner.temp }}/pr-dispatch-feedback-record.json
          FEEDBACK_LANE_RECORDS_PATH: ${{ runner.temp }}/feedback-lane-records.json
          VERIFY_HEAD_SHA: ${{ needs.post-verify-notes.outputs.head-sha }}
          VERIFY_PASS_HEAD_SHA: ${{ needs.post-verify-notes.outputs.pass-head-sha }}
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: |
          REVIEWER_IDS=$(yq '."review-threads"."reviewer-ids" // [] | .[]' .base/docs/conventions/pr-pipeline.yaml)
          export REVIEWER_IDS
          node .base/.github/scripts/pr-unblock/feedback-dispatch.mjs

      - name: Name the dispatched-run record
        id: record
        if: always() && steps.dispatch.outputs.run-id != ''
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run-id }}
          UPSTREAM_RUN_ID: ${{ steps.dispatch.outputs.upstream-run-id }}
          REFIRE_OF: ${{ steps.dispatch.outputs.refire-of }}
        run: |
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]{0,14}$ || ! "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]{0,14}$ || ! "$REFIRE_OF" =~ ^([1-9][0-9]{0,14})?$ ]]; then
            echo "::error::run-id, the upstream run id or refire-of is not a run id"
            exit 1
          fi
          printf '{"dispatcher_run_id":%s,"upstream_run_id":%s,"run_id":%s%s}\n' \
            "$GITHUB_RUN_ID" "$UPSTREAM_RUN_ID" "$RUN_ID" "${REFIRE_OF:+,\"refire_of_run_id\":$REFIRE_OF}" >"$RUNNER_TEMP/pr-feedback-dispatched.json"
          echo "name=pr-feedback-dispatched-$UPSTREAM_RUN_ID-$RUN_ID" >>"$GITHUB_OUTPUT"

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          always() && steps.dispatch.outputs.run-id != '' && steps.record.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/pr-feedback-dispatched.json

      - name: Record the dispatched run
        if: >-
          (always() && steps.dispatch.outputs.run-id != '' && steps.record.outcome == 'success') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.record.outputs.name }}
          path: ${{ runner.temp }}/pr-feedback-dispatched.json
          retention-days: 1
          if-no-files-found: error

      - name: Name the dispatched-run record 2
        id: record-2
        if: always() && steps.dispatch.outputs.run-id-2 != ''
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run-id-2 }}
          UPSTREAM_RUN_ID: ${{ steps.dispatch.outputs.upstream-run-id-2 }}
          REFIRE_OF: ${{ steps.dispatch.outputs.refire-of-2 }}
        run: |
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]{0,14}$ || ! "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]{0,14}$ || ! "$REFIRE_OF" =~ ^([1-9][0-9]{0,14})?$ ]]; then
            echo "::error::run-id-2, the upstream run id or refire-of-2 is not a run id"
            exit 1
          fi
          printf '{"dispatcher_run_id":%s,"upstream_run_id":%s,"run_id":%s%s}\n' \
            "$GITHUB_RUN_ID" "$UPSTREAM_RUN_ID" "$RUN_ID" "${REFIRE_OF:+,\"refire_of_run_id\":$REFIRE_OF}" >"$RUNNER_TEMP/pr-feedback-dispatched-2.json"
          echo "name=pr-feedback-dispatched-$UPSTREAM_RUN_ID-$RUN_ID" >>"$GITHUB_OUTPUT"

      - name: Scan upload 2 for credentials
        id: scan-upload-2
        if: >-
          always() && steps.dispatch.outputs.run-id-2 != '' && steps.record-2.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/pr-feedback-dispatched-2.json

      - name: Record dispatched run 2
        if: >-
          (always() && steps.dispatch.outputs.run-id-2 != '' && steps.record-2.outcome == 'success') && steps.scan-upload-2.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.record-2.outputs.name }}
          path: ${{ runner.temp }}/pr-feedback-dispatched-2.json
          retention-days: 1
          if-no-files-found: error

      - name: Name the dispatched-run record 3
        id: record-3
        if: always() && steps.dispatch.outputs.run-id-3 != ''
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run-id-3 }}
          UPSTREAM_RUN_ID: ${{ steps.dispatch.outputs.upstream-run-id-3 }}
          REFIRE_OF: ${{ steps.dispatch.outputs.refire-of-3 }}
        run: |
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]{0,14}$ || ! "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]{0,14}$ || ! "$REFIRE_OF" =~ ^([1-9][0-9]{0,14})?$ ]]; then
            echo "::error::run-id-3, the upstream run id or refire-of-3 is not a run id"
            exit 1
          fi
          printf '{"dispatcher_run_id":%s,"upstream_run_id":%s,"run_id":%s%s}\n' \
            "$GITHUB_RUN_ID" "$UPSTREAM_RUN_ID" "$RUN_ID" "${REFIRE_OF:+,\"refire_of_run_id\":$REFIRE_OF}" >"$RUNNER_TEMP/pr-feedback-dispatched-3.json"
          echo "name=pr-feedback-dispatched-$UPSTREAM_RUN_ID-$RUN_ID" >>"$GITHUB_OUTPUT"

      - name: Scan upload 3 for credentials
        id: scan-upload-3
        if: >-
          always() && steps.dispatch.outputs.run-id-3 != '' && steps.record-3.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/pr-feedback-dispatched-3.json

      - name: Record dispatched run 3
        if: >-
          (always() && steps.dispatch.outputs.run-id-3 != '' && steps.record-3.outcome == 'success') && steps.scan-upload-3.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.record-3.outputs.name }}
          path: ${{ runner.temp }}/pr-feedback-dispatched-3.json
          retention-days: 1
          if-no-files-found: error

      - name: Name the dispatched-run record 4
        id: record-4
        if: always() && steps.dispatch.outputs.run-id-4 != ''
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run-id-4 }}
          UPSTREAM_RUN_ID: ${{ steps.dispatch.outputs.upstream-run-id-4 }}
          REFIRE_OF: ${{ steps.dispatch.outputs.refire-of-4 }}
        run: |
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]{0,14}$ || ! "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]{0,14}$ || ! "$REFIRE_OF" =~ ^([1-9][0-9]{0,14})?$ ]]; then
            echo "::error::run-id-4, the upstream run id or refire-of-4 is not a run id"
            exit 1
          fi
          printf '{"dispatcher_run_id":%s,"upstream_run_id":%s,"run_id":%s%s}\n' \
            "$GITHUB_RUN_ID" "$UPSTREAM_RUN_ID" "$RUN_ID" "${REFIRE_OF:+,\"refire_of_run_id\":$REFIRE_OF}" >"$RUNNER_TEMP/pr-feedback-dispatched-4.json"
          echo "name=pr-feedback-dispatched-$UPSTREAM_RUN_ID-$RUN_ID" >>"$GITHUB_OUTPUT"

      - name: Scan upload 4 for credentials
        id: scan-upload-4
        if: >-
          always() && steps.dispatch.outputs.run-id-4 != '' && steps.record-4.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/pr-feedback-dispatched-4.json

      - name: Record dispatched run 4
        if: >-
          (always() && steps.dispatch.outputs.run-id-4 != '' && steps.record-4.outcome == 'success') && steps.scan-upload-4.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.record-4.outputs.name }}
          path: ${{ runner.temp }}/pr-feedback-dispatched-4.json
          retention-days: 1
          if-no-files-found: error

      - name: Name the dispatched-run record 5
        id: record-5
        if: always() && steps.dispatch.outputs.run-id-5 != ''
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run-id-5 }}
          UPSTREAM_RUN_ID: ${{ steps.dispatch.outputs.upstream-run-id-5 }}
          REFIRE_OF: ${{ steps.dispatch.outputs.refire-of-5 }}
        run: |
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]{0,14}$ || ! "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]{0,14}$ || ! "$REFIRE_OF" =~ ^([1-9][0-9]{0,14})?$ ]]; then
            echo "::error::run-id-5, the upstream run id or refire-of-5 is not a run id"
            exit 1
          fi
          printf '{"dispatcher_run_id":%s,"upstream_run_id":%s,"run_id":%s%s}\n' \
            "$GITHUB_RUN_ID" "$UPSTREAM_RUN_ID" "$RUN_ID" "${REFIRE_OF:+,\"refire_of_run_id\":$REFIRE_OF}" >"$RUNNER_TEMP/pr-feedback-dispatched-5.json"
          echo "name=pr-feedback-dispatched-$UPSTREAM_RUN_ID-$RUN_ID" >>"$GITHUB_OUTPUT"

      - name: Scan upload 5 for credentials
        id: scan-upload-5
        if: >-
          always() && steps.dispatch.outputs.run-id-5 != '' && steps.record-5.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/pr-feedback-dispatched-5.json

      - name: Record dispatched run 5
        if: >-
          (always() && steps.dispatch.outputs.run-id-5 != '' && steps.record-5.outcome == 'success') && steps.scan-upload-5.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.record-5.outputs.name }}
          path: ${{ runner.temp }}/pr-feedback-dispatched-5.json
          retention-days: 1
          if-no-files-found: error

      - name: Scan the lane record cache for credentials
        id: scan-lane-records
        if: always() && steps.dispatch.outputs.lane-records == 'true'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/feedback-lane-records.json

      - name: Carry the lane record cache
        if: >-
          (always() && steps.dispatch.outputs.lane-records == 'true') && steps.scan-lane-records.outputs.clean == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pr-feedback-lane-records
          path: ${{ runner.temp }}/feedback-lane-records.json
          retention-days: 1
          if-no-files-found: error

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  rerun-ci-status:
    name: Rerun CI Status
    if: >-
      github.ref == 'refs/heads/main'
      && ((github.event.workflow_run.path == '.github/workflows/pr-review-hosted.yml'
      || github.event.workflow_run.path == '.github/workflows/pr-review-security-hosted.yml')
      && github.event.workflow_run.event == 'pull_request'
      || github.event.workflow_run.path == '.github/workflows/pr-review-approved.yml'
      && github.event.workflow_run.event == 'pull_request_review')
      && github.event.workflow_run.conclusion != 'skipped'
      && github.event.workflow_run.repository.full_name == github.repository
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the default branch's trusted-actors list
      actions: write # list review and pr-require-checks runs and jobs; re-run the ci-status job
      pull-requests: read # the PR's state and live head
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Resolve main's tip
        id: tip
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main
      - name: Check out the re-run scripts
        if: steps.tip.outputs.sha != ''
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/log-api-budget/
            /.github/actions/check-trusted-trigger/
            /.github/scripts/lib/github-client.mjs
            /.github/scripts/lib/trusted-actors.mjs
            /.github/actions/check-kill-switch/
            /.github/scripts/pr-dispatch-feedback/
            /lib/publish-gate.mjs
            /.node-version
          sparse-checkout-cone-mode: false

      - name: Download standards
        id: standards
        if: steps.tip.outputs.sha != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main

      - name: Set up Node
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        continue-on-error: true
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Find the ci-status to re-run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          LANES_PROCEED: ${{ steps.kill.outputs.proceed }}
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          LANE_PATH: ${{ github.event.workflow_run.path }}
          LANE_DONE_AT: ${{ github.event.workflow_run.updated_at }}
          POLL_SECONDS: '60'
          POLL_LIMIT_SECONDS: '600'
          RATE_WAIT_SECONDS: '720'
          RECORD_FILE: ${{ runner.temp }}/rerun-ci-status-record.json
          REVIEW_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REVIEW_RERUNNER_ID: ${{ github.event.workflow_run.triggering_actor.id }}
          REVIEW_RUN_ID: ${{ github.event.workflow_run.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRUSTED_ACTORS: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          RECONCILER_WORKFLOW: .github/workflows/maintenance-reconcile-lost-runs.yml
          RECONCILER_RECORD: .base/.github/actions/check-trusted-trigger/reconciler-record.mjs
        run: bash .base/.github/scripts/pr-dispatch-feedback/rerun-ci-status.sh

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          steps.find.outputs.record != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/rerun-ci-status-record.json

      - name: Record the re-run
        if: >-
          (steps.find.outputs.record != '') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.find.outputs.record }}
          path: ${{ runner.temp }}/rerun-ci-status-record.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Re-run ci-status
        if: steps.find.outputs.job-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ steps.find.outputs.job-id }}
        run: |
          if [[ ! $JOB_ID =~ ^[1-9][0-9]{0,14}$ ]]; then
            echo "::error::'$JOB_ID' is not a job id."
            exit 1
          fi
          # shellcheck source=/dev/null
          { . .base/.github/actions/log-api-budget/api-budget.bash 2>/dev/null && api_budget_wrap_gh github-token; } || true
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/rerun" >/dev/null
          echo "Re-ran ci-status (job $JOB_ID)."

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token
