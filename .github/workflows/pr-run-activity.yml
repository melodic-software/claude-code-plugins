name: pr-run-activity

# Runs one activity of one PR pipeline lane and reports it as the check run
# `<lane> / <activity>`. The run job gates, resolves the base-SHA config, mints
# the App token the activity's effect grants, and runs a skill or a script; the
# report job writes the check from the run job's runner-computed outputs.
# Job contract: docs/conventions/pr-pipeline/pr-run-activity.md.
#
# Every action runs from the base-SHA checkout at ./.base. zizmor's
# self-repository advice (`$/...`) is ignored on those lines: `$/` loads the
# action from this workflow's own commit, which on pull_request is the PR's
# merge commit, not the base.

on:
  workflow_call:
    inputs:
      lane:
        description: The lane, its caller workflow's file stem.
        required: true
        type: string
      activity:
        description: The activity to run from the lane's slots.
        required: true
        type: string
      config-path:
        description: The config, relative to the base checkout. For test callers only.
        required: false
        type: string
        default: docs/conventions/pr-pipeline.yaml
      pr-number:
        description: The PR on workflow_dispatch; ignored for other events.
        required: false
        type: string
        default: ""
      default-model:
        description: The model when the activity sets none; empty omits --model.
        required: false
        type: string
        default: ""
      default-max-turns:
        description: The turn budget when the activity sets none.
        required: false
        type: number
        default: 75
    secrets:
      claude-code-oauth-token:
        description: Claude Code OAuth token for skill activities.
        required: false
      app-private-key:
        description: Private key of the lanes GitHub App.
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  run:
    # The lanes App's own pull_request events never start a lane.
    if: >-
      !(github.event_name == 'pull_request'
      && format('{0}', github.event.sender.id) == vars.AUTOMATION_LANES_APP_SENDER_ID)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    # The report job trusts only these. Each is a step outcome or an output of a
    # step that ran before any PR head code.
    outputs:
      base-sha: ${{ steps.rebase.outputs.commit || steps.base.outputs.commit }}
      head-sha: ${{ steps.gate.outputs.head-sha }}
      pr-number: ${{ steps.gate.outputs.pr-number }}
      gate-reason: >-
        ${{ steps.kill.outputs.proceed != 'true' && steps.kill.outputs.reason
        || steps.gate.outputs.proceed != 'true' && steps.gate.outputs.reason
        || '' }}
      can-commit: ${{ steps.config.outputs.can-commit }}
      applies: ${{ steps.config.outputs.applies }}
      act-outcome: >-
        ${{ steps.act-skill.outcome != 'skipped' && steps.act-skill.outcome
        || steps.act-script.outcome }}
    steps:
      # The job if: above cannot match an unset variable, so the guard would
      # silently let the App's own events through.
      - name: Assert the lanes App sender id is set
        env:
          APP_SENDER_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
        run: |
          if ! [[ $APP_SENDER_ID =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the AUTOMATION_LANES_APP_SENDER_ID variable must hold the lanes App bot's numeric user id"
            exit 1
          fi

      - name: Check out the base SHA
        id: base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}

      - name: Check the trigger
        id: gate
        if: steps.kill.outputs.proceed == 'true'
        uses: ./.base/.github/actions/check-trusted-trigger # zizmor: ignore[self-repository]
        with:
          trusted-actors-path: .base/.github/standards/trusted-actors/trusted-actors.json
          pr-number: ${{ inputs.pr-number }}

      - name: Check out the PR's base SHA
        id: rebase
        if: >-
          steps.gate.outputs.proceed == 'true'
          && steps.gate.outputs.base-sha != steps.base.outputs.commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.base-sha }}
          path: .base
          persist-credentials: false

      - name: Resolve the config
        id: config
        if: steps.gate.outputs.proceed == 'true'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          lane: ${{ inputs.lane }}
          activity: ${{ inputs.activity }}
          base-path: .base
          config-path: ${{ inputs.config-path }}
          output-path: ${{ runner.temp }}/resolved-config.json
          pr-number: ${{ steps.gate.outputs.pr-number }}

      # An empty permission-* input is skipped, and a mint with all of them
      # empty inherits every installation permission.
      - name: Assert the App grant
        if: steps.config.outputs.applies == 'true'
        env:
          CONTENTS: ${{ steps.config.outputs.contents }}
          PULL_REQUESTS: ${{ steps.config.outputs.pull-requests }}
          ISSUES: ${{ steps.config.outputs.issues }}
        run: |
          for value in "$CONTENTS" "$PULL_REQUESTS" "$ISSUES"; do
            case "$value" in
              read | write) ;;
              *)
                echo "::error::the App grant must be read or write for contents, pull-requests and issues"
                exit 1
                ;;
            esac
          done

      - name: Mint the lane App token
        id: app-token
        if: steps.config.outputs.applies == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_LANES_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: ${{ steps.config.outputs.contents }}
          permission-pull-requests: ${{ steps.config.outputs.pull-requests }}
          permission-issues: ${{ steps.config.outputs.issues }}

      - name: Select the trusted PR text
        if: steps.config.outputs.applies == 'true' && steps.config.outputs.reads-untrusted == 'true'
        uses: ./.base/.github/actions/select-trusted-text # zizmor: ignore[self-repository]
        with:
          pr-number: ${{ steps.gate.outputs.pr-number }}
          trusted-actors-path: .base/.github/standards/trusted-actors/trusted-actors.json
          output-path: ${{ runner.temp }}/trusted-context.json
          github-token: ${{ steps.app-token.outputs.token }}

      # The head checkout below replaces .base, so what the activity runs from
      # the base is copied out first.
      - name: Copy the script's base directory
        if: steps.config.outputs.applies == 'true' && steps.config.outputs.kind == 'script'
        env:
          SCRIPT: ${{ steps.config.outputs.script }}
          SCRIPT_DIR: ${{ runner.temp }}/base-script
        run: |
          case "/$SCRIPT/" in
            //* | */../* | *//)
              echo "::error::the script path must be repository-relative"
              exit 1
              ;;
            /*/*/) ;;
            *)
              echo "::error::the script must sit in a subdirectory, not at the repository root"
              exit 1
              ;;
          esac
          mkdir -p "$SCRIPT_DIR"
          cp -R ".base/$(dirname "$SCRIPT")/." "$SCRIPT_DIR/"

      - name: Stage the base marketplace and the skill prompt
        id: stage-skill
        if: steps.config.outputs.applies == 'true' && steps.config.outputs.kind == 'skill'
        env:
          MARKETPLACE: ${{ runner.temp }}/base-marketplace
          RESOLVED: ${{ runner.temp }}/resolved-config.json
          SKILL: ${{ steps.config.outputs.skill }}
          MODEL: ${{ steps.config.outputs.model || inputs.default-model }}
          MAX_TURNS: ${{ steps.config.outputs.max-turns || inputs.default-max-turns }}
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }
          mkdir -p "$MARKETPLACE"
          cp -R .base/plugins .base/.claude-plugin "$MARKETPLACE/"
          marketplace=$(jq -r '.name' "$MARKETPLACE/.claude-plugin/marketplace.json")
          name='^[a-z0-9][a-z0-9-]*$'
          [[ $marketplace =~ $name ]] || fail "the base marketplace name is malformed"
          [[ $SKILL =~ ^[a-z0-9-]+:[a-z0-9-]+$ ]] || fail "the skill must be <plugin>:<skill>"
          [[ $MAX_TURNS =~ ^[1-9][0-9]*$ ]] || fail "max-turns must be a positive integer"
          claude_args="--max-turns $MAX_TURNS --allowedTools \"Skill($SKILL)\""
          if [ -n "$MODEL" ]; then
            model='^[A-Za-z0-9][]A-Za-z0-9._[-]*$'
            [[ $MODEL =~ $model ]] || fail "the model name is malformed"
            claude_args="$claude_args --model $MODEL"
          fi
          args=$(jq -r '.selected.args // ""' "$RESOLVED")
          delimiter="prompt_$(openssl rand -hex 16)"
          {
            echo "plugin=${SKILL%%:*}@$marketplace"
            echo "claude-args=$claude_args"
            echo "prompt<<$delimiter"
            printf '/%s %s\n' "$SKILL" "$args"
            echo "$delimiter"
          } >>"$GITHUB_OUTPUT"

      - name: Check out the PR head
        if: steps.config.outputs.applies == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.head-sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # The activity judges exactly the commit the check is posted on.
      - name: Assert the head is the gated SHA
        if: steps.config.outputs.applies == 'true'
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::the checked-out head is not the gated head SHA"
            exit 1
          fi

      - name: Run the skill activity
        id: act-skill
        if: steps.config.outputs.applies == 'true' && steps.config.outputs.kind == 'skill'
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        env:
          CLAUDE_BRANCH: ${{ steps.gate.outputs.head-ref }}
        with:
          claude_code_oauth_token: ${{ secrets.claude-code-oauth-token }}
          github_token: ${{ steps.app-token.outputs.token }}
          use_commit_signing: true
          plugin_marketplaces: ${{ runner.temp }}/base-marketplace
          plugins: ${{ steps.stage-skill.outputs.plugin }}
          prompt: ${{ steps.stage-skill.outputs.prompt }}
          claude_args: >-
            --setting-sources user
            --permission-mode dontAsk
            ${{ steps.stage-skill.outputs.claude-args }}

      # The reply is untrusted model text: it is read with jq and printed as
      # data, never interpolated into a command. The file path falls back to
      # the action's fixed location (base-action/src/execution-file.ts:6-13).
      - name: Show the skill's final reply
        if: always() && (steps.act-skill.outcome == 'success' || steps.act-skill.outcome == 'failure')
        env:
          EXECUTION_FILE: >-
            ${{ steps.act-skill.outputs.execution_file
            || format('{0}/claude-execution-output.json', runner.temp) }}
        run: |
          if [ ! -f "$EXECUTION_FILE" ]; then
            echo "No execution file to summarize"
            exit 0
          fi
          reply=$(jq -r '[.[] | select(.type == "result")] | last | (.result // "")[:4000] | gsub("`"; "'"'"'")' "$EXECUTION_FILE")
          {
            echo "### Skill reply"
            echo
            echo '```text'
            printf '%s\n' "$reply"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # On pull_request events the action replaces these paths with the base
      # branch's copies when the PR head is untrusted (claude-code-action
      # src/github/operations/restore-config.ts:26-35 lists them, :269-349
      # restores them and unstages). Put back only what that restore changed,
      # so a file the skill created or edited under them still shows as dirty.
      - name: Undo the action's restore of base config paths
        if: >-
          steps.config.outputs.applies == 'true' && steps.config.outputs.kind == 'skill'
          && steps.config.outputs.effect == 'read' && github.event.pull_request.base.ref != ''
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          base="refs/remotes/origin/$BASE_REF"
          if ! git rev-parse -q --verify "$base^{commit}" >/dev/null; then
            echo "The action fetched no base branch, so it restored nothing"
            exit 0
          fi
          same_as_base() {
            git cat-file -e "$base:$1" 2>/dev/null && [ -f "$1" ] && [ ! -L "$1" ] &&
              [ "$(git hash-object -- "$1")" = "$(git rev-parse "$base:$1")" ]
          }
          for path in .claude .mcp.json .claude.json .gitmodules .ripgreprc CLAUDE.md CLAUDE.local.md .husky; do
            while IFS= read -r -d '' file; do
              if ! git cat-file -e "$HEAD_SHA:$file" 2>/dev/null && same_as_base "$file"; then
                rm -f -- "$file"
              fi
            done < <(git ls-tree -r -z --name-only "$base" -- "$path")
            while IFS= read -r -d '' file; do
              if { [ ! -e "$file" ] && [ ! -L "$file" ]; } || same_as_base "$file"; then
                git checkout "$HEAD_SHA" -- "$file"
              fi
            done < <(git ls-tree -r -z --name-only "$HEAD_SHA" -- "$path")
          done

      - name: Run the script activity
        id: act-script
        if: steps.config.outputs.applies == 'true' && steps.config.outputs.kind == 'script'
        env:
          SCRIPT: ${{ steps.config.outputs.script }}
          RESOLVED: ${{ runner.temp }}/resolved-config.json
          LANE_TOKEN: ${{ steps.config.outputs.effect != 'read' && steps.app-token.outputs.token || '' }}
          PR_NUMBER: ${{ steps.gate.outputs.pr-number }}
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          BASE_SHA: ${{ steps.rebase.outputs.commit || steps.base.outputs.commit }}
          SKIP_REASON_FILE: ${{ runner.temp }}/skip-reason
        run: |
          ACTIVITY_ARGS=$(jq -r '.selected.args // ""' "$RESOLVED")
          export ACTIVITY_ARGS
          unset GH_TOKEN GITHUB_TOKEN
          if [ -n "$LANE_TOKEN" ]; then
            export GH_TOKEN="$LANE_TOKEN"
          fi
          unset LANE_TOKEN RESOLVED
          rm -f "$SKIP_REASON_FILE"
          "$RUNNER_TEMP/base-script/$(basename "$SCRIPT")"
          reason=""
          if [ -s "$SKIP_REASON_FILE" ]; then
            reason=$(head -n 1 "$SKIP_REASON_FILE" | tr -d '\r')
            if ! [[ $reason =~ ^[a-z]+(-[a-z]+)*$ ]]; then
              echo "::error::the skip reason file holds no skip reason"
              exit 1
            fi
          fi
          echo "skip-reason=$reason" >>"$GITHUB_OUTPUT"

      - name: Check the working tree is clean
        id: tree
        if: steps.config.outputs.applies == 'true' && steps.config.outputs.effect == 'read'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "dirty-tree=true" >>"$GITHUB_OUTPUT"
          else
            echo "dirty-tree=false" >>"$GITHUB_OUTPUT"
          fi

      # Written after head code ran, so the report job only cross-checks it.
      - name: Write the verdict
        if: always()
        env:
          LANE: ${{ inputs.lane }}
          ACTIVITY: ${{ inputs.activity }}
          KILL_PROCEED: ${{ steps.kill.outputs.proceed }}
          KILL_REASON: ${{ steps.kill.outputs.reason }}
          TRIGGER_PROCEED: ${{ steps.gate.outputs.proceed }}
          TRIGGER_REASON: ${{ steps.gate.outputs.reason }}
          HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          SKIP_REASON: ${{ steps.config.outputs.skip-reason || steps.act-script.outputs.skip-reason }}
          ACT_OUTCOME: >-
            ${{ steps.act-skill.outcome != 'skipped' && steps.act-skill.outcome
            || steps.act-script.outcome }}
          DIRTY_TREE: ${{ steps.tree.outputs.dirty-tree }}
          VERDICT_DIR: ${{ runner.temp }}/verdict
        run: |
          mkdir -p "$VERDICT_DIR"
          jq -n \
            --arg lane "$LANE" \
            --arg activity "$ACTIVITY" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg head "$HEAD_SHA" \
            --arg kill_proceed "$KILL_PROCEED" --arg kill_reason "$KILL_REASON" \
            --arg trigger_proceed "$TRIGGER_PROCEED" --arg trigger_reason "$TRIGGER_REASON" \
            --arg config "$CONFIG_OUTCOME" \
            --arg skip "$SKIP_REASON" \
            --arg act "$ACT_OUTCOME" \
            --arg dirty "$DIRTY_TREE" \
            'def gate($proceed; $reason): if $proceed == "" then null else {proceed: $proceed, reason: $reason} end;
            def nullable: if . == "" then null else . end;
            {
              version: 1,
              lane: $lane,
              activity: $activity,
              "run-url": $run_url,
              "head-sha": ($head | nullable),
              gates: {"kill-switch": gate($kill_proceed; $kill_reason), trigger: gate($trigger_proceed; $trigger_reason)},
              config: ({success: "valid", failure: "invalid"}[$config] // "not-read"),
              "skip-reason": ($skip | nullable),
              outcome: (if $act == "success" or $act == "failure" or $act == "skipped" then $act else "not-run" end),
              "dirty-tree": {"true": true, "false": false}[$dirty]
            }' >"$VERDICT_DIR/verdict.json"

      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verdict-${{ inputs.lane }}-${{ inputs.activity }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verdict/verdict.json
          if-no-files-found: error

  report:
    needs: run
    # Fork PRs get a read-only GITHUB_TOKEN that cannot write checks, and the
    # lanes App's own pull_request events skip the run job.
    if: >-
      always()
      && !(github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
      && !(github.event_name == 'pull_request'
      && format('{0}', github.event.sender.id) == vars.AUTOMATION_LANES_APP_SENDER_ID)
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      # Exactly the run job's base; the event's base only when the run job
      # stopped before its checkout, so the PR head is never checked out here.
      - name: Check out the base SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{ needs.run.outputs.base-sha
            || github.event.pull_request.base.sha
            || github.event.repository.default_branch }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download the verdict
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verdict-${{ inputs.lane }}-${{ inputs.activity }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verdict

      - name: Check the lane's commits are signed
        id: signed
        if: >-
          always()
          && needs.run.outputs.can-commit != 'false'
          && needs.run.outputs.pr-number != ''
        uses: ./.base/.github/actions/check-signed-commits # zizmor: ignore[self-repository]
        with:
          pr-number: ${{ needs.run.outputs.pr-number }}
          since-sha: ${{ needs.run.outputs.head-sha }}
          github-token: ${{ github.token }}

      - name: Post the check run
        if: always()
        uses: ./.base/.github/actions/report-check-run # zizmor: ignore[self-repository]
        with:
          lane: ${{ inputs.lane }}
          activity: ${{ inputs.activity }}
          run-result: ${{ needs.run.result }}
          act-outcome: ${{ needs.run.outputs.act-outcome }}
          gate-reason: ${{ needs.run.outputs.gate-reason }}
          head-sha: ${{ needs.run.outputs.head-sha }}
          can-commit: ${{ needs.run.outputs.can-commit }}
          all-verified: ${{ steps.signed.outputs.all-verified }}
          verdict-path: ${{ runner.temp }}/verdict/verdict.json
          base-path: .base
          head-sha-fallback: ${{ github.event.pull_request.head.sha || github.sha }}
          github-token: ${{ github.token }}
