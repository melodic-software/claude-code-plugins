name: PR Check Managed Files Hosted

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read # check-managed-files lists the PR commits to skip all-Dependabot PRs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-check-managed-files:
    name: PR Check Managed Files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Guard managed files
        uses: melodic-software/ci-workflows/.github/actions/check-managed-files@main
        with:
          standards-ref: main
