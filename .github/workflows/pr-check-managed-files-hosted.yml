name: PR Check Managed Files Hosted

# SYNC-MANAGED FILE: DO NOT EDIT IN THE CONSUMING REPOSITORY.
# Source of truth: melodic-software/standards,
# components/managed-files-guard/managed-files-guard.yml (the
# `managed-files-guard-caller` component in distribution/sync-manifest.yml).
# Downstream edits are overwritten by the next sync PR; change the component
# upstream, or move the component to `locally-owned` in the manifest to
# customize.
#
# Thin caller for the org's check-managed-files composite action
# (melodic-software/ci-workflows, ci-workflows#208). The action resolves this
# repository's sync-manifest-managed destination paths from the standards ref
# it is given and fails the pull request when the diff hand-edits one of them
# (ADR-0007: a managed file is byte-exact with its standards source; the fix
# path is a standards change, never a downstream edit). Pull requests opened
# by the sync itself (authored by `melodic-standards-sync[bot]` and
# labeled `standards-sync`) are exempt inside the action.
#
# ADVISORY during soak (standards#496): this check is NOT aggregated into
# `ci-status` and is not a required context. Promotion is a per-target
# decision taken after a clean soak, recorded in the component README.
#
# Hosted-only shape: `runs-on` names the approved hosted label directly, so the
# same bytes serve public and un-enrolled private targets. A private target
# enrolled for local CI routing takes the fleet-routed sibling,
# components/managed-files-guard/managed-files-guard-fleet.yml, instead.

# The guard fails only on an exact managed destination path, so the workflow
# runs only when the pull request touches one. `paths` is the sorted union of
# the managed destinations (`sync-manifest.sh dest-paths`) of every sync target
# that receives this file, this workflow included; the contract test fails
# when the manifest moves that union and this list does not follow. `types`
# restates the documented pull_request default.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .claude/cloud-bootstrap.sh
      - .claude/rules/pr-body-contract.md
      - .editorconfig
      - .editorconfig-checker.json
      - .gitattributes
      - .github/ISSUE_TEMPLATE/agent-ready.yml
      - .github/ISSUE_TEMPLATE/bug-report.yml
      - .github/ISSUE_TEMPLATE/feature-request.yml
      - .github/ISSUE_TEMPLATE/task.yml
      - .github/actionlint.yaml
      - .github/standards/dependabot-policy/policy.json
      - .github/standards/github-actions-conventions/vocabulary.json
      - .github/standards/github-actions-conventions/vocabulary.schema.json
      - .github/standards/issue-body-contract/contract.json
      - .github/standards/pyright/pyrightconfig.json
      - .github/standards/runner-policy/package-lock.json
      - .github/standards/runner-policy/package.json
      - .github/standards/runner-policy/policy.json
      - .github/standards/runner-policy/policy.schema.json
      - .github/standards/runner-policy/repository-policy.schema.json
      - .github/standards/runner-policy/runner-policy.mjs
      - .github/standards/trusted-actors/trusted-actors.json
      - .github/standards/trusted-actors/trusted-actors.schema.json
      - .github/workflows/maintenance-check-links-online.yml
      - .github/workflows/pr-check-managed-files-hosted.yml
      - .github/workflows/pr-review-hosted.yml
      - .github/workflows/pr-review-security-hosted.yml
      - .github/zizmor.yml
      - .gitleaks.toml
      - .golangci.yml
      - .lefthook/base.yml
      - .lefthook/dotnet-format-staged.mjs
      - .lefthook/dotnet.yml
      - .markdownlint-cli2.jsonc
      - .node-version
      - .shellcheckrc
      - REVIEW.md
      - _typos.toml
      - docs/contracts/issue-body/contract.json
      - docs/conventions/source-control/commit-convention.yml
      - docs/standards/README.md
      - docs/standards/bulk-mutation.md
      - docs/standards/concise-prose.md
      - docs/standards/design-for-change.md
      - docs/standards/deterministic-work-execution.md
      - docs/standards/documentation-and-citations.md
      - docs/standards/issue-tracker.md
      - docs/standards/reference-dont-duplicate.md
      - docs/standards/simpler-code.md
      - docs/standards/source-authority-tiers.md
      - eng/dotnet-analysis/Directory.Build.props
      - eng/dotnet-analysis/dotnet.globalconfig
      - lychee.toml
      - plugins/guardrails/lib/path-detection/machine-path-patterns.sh

permissions:
  contents: read
  pull-requests: read # check-managed-files lists the PR commits to skip all-Dependabot PRs

# Canonical block from the standards `concurrency-policy` component: a newer
# push to the same pull request cancels the in-flight guard run; the
# `run_id` fallback keeps non-PR runs unique and never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-check-managed-files:
    # The check context is this Title Case name (org naming lint, job-name);
    # zizmor's pedantic `anonymous-definition` audit also flags an unnamed job.
    name: PR Check Managed Files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No checkout step: the action checks out this repository itself, with
    # full history and no persisted credentials (ci-workflows#881).
    steps:
      - name: Guard managed files
        # The org requires actions pinned to a full commit SHA (reusable
        # workflows may float on main); this pin moves by hand.
        uses: melodic-software/ci-workflows/.github/actions/check-managed-files@8e1076f6c33cb9ca3544a1ad2a215fd2262b4a72 # v0.71.0
        with:
          # `main` for the soak, per the action's own input contract ("Pin to
          # a full SHA in callers once soak completes"): the guard must read
          # the manifest that is live for this repository, and a fixed
          # standards SHA would stop tracking target roster and component
          # changes the moment it landed. `standards-ref` is a workflow input
          # naming a ref of a different repository, so the ci-workflows
          # pin-comment convention does not apply to it.
          standards-ref: main
