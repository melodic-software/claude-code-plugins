      # job's 30. The launcher's --restricted keeps the file tools inside the
      # working directory, which holds the data and the checkout; the allow
      # rules name those two, and under dontAsk nothing else is readable. The
      # deny rules keep the process environment, the home directory's dot
      # files (the workspace is under home, so not all of it) and the runner's
      # temp files out if the tools or the working directory change
      # (code.claude.com/docs/en/permissions, "Read and Edit").
      - name: Judge the unit
        id: judge
        if: steps.credential.outputs.present == 'true' && steps.prompt.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@30b251532b2e9f7e0c4215e1dee5be0d3c688743 # v0.65.15
        env:
          # No work may outlive the result message the launcher reads.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: lane-sweep
          role: automations
          prompt-file: ${{ runner.temp }}/lane-sweep-prompt.md
          preamble: >-
            You run unattended; return only the findings the schema asks for;
            nothing you write is posted.
          fallback-token: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: |
            Read
            Grep
            Glob
          allowed-tools: |
            Read(./.lane-sweep-data/**)
            Read(./.base/**)
          disallowed-tools: |
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            mcp__*
            Read(//proc/**)
            Read(//sys/**)
            Read(~/.*)
            Read(~/.*/**)
            Read(/${{ runner.temp }}/**)
          json-schema-file: ${{ runner.temp }}/lane-sweep-schema.json
          leg-timeout-minutes: "20"

      - name: Report the judgment's outcome
        if: steps.judge.outcome == 'success' || steps.judge.outcome == 'failure'
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@30b251532b2e9f7e0c4215e1dee5be0d3c688743 # v0.65.15
        with:
          outcome: ${{ steps.judge.outcome }}
          execution-file: ${{ steps.judge.outputs.execution-file }}
          log-file: ${{ steps.judge.outputs.log-file }}
          lane: lane-sweep
          lane-id: lane-sweep
          step-started-at: ${{ steps.prompt.outputs.started-at }}
          step-timeout-minutes: 25
          credential: ${{ steps.judge.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.judge.outputs.lane-class }}
          # Why this leg ran, for the unit's one lane record.
          fallback-reason: ${{ matrix.reason == 'limit-stop' && 'limit-stop' || matrix.reason == 'credit-stop' && 'credit-stop' || matrix.reason == 'auth' && 'auth' || '' }}

