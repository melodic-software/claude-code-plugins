name: Maintenance Audit Lane Runs

on:
  schedule:
    - cron: "33 6 * * *"
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: maintenance-audit-lane-runs-${{ github.event.schedule == '17 * * * *' && 'triage' || 'audit' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  collect:
    name: Collect
    if: github.ref == 'refs/heads/main' && github.event.schedule != '17 * * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      units: ${{ steps.collect.outputs.units }}
      next-leg: ${{ steps.credit.outputs.next-leg }}
      standards-sha: ${{ steps.standards.outputs.sha }}
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Check out the run's main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .base
          persist-credentials: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}
          budget: "true"

      - name: Report the kill switch
        if: steps.kill.outputs.proceed != 'true'
        env:
          REASON: ${{ steps.kill.outputs.reason }}
          CAUSE: ${{ steps.kill.outputs.cause }}
          WHY: ${{ steps.kill.outputs.cause == 'budget' && format('the GITHUB_TOKEN budget is low until {0} (epoch seconds), which stops', steps.kill.outputs.reset) || 'the lanes kill switch stops' }}
        run: echo "::notice::${WHY} this run (reason ${REASON:-unreadable}, cause ${CAUSE:-unreadable}); nothing read or filed"

      - name: Collect the units
        id: collect
        if: steps.kill.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_ACTORS_PATH: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          LANES_APP_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          OUT_DIR: ${{ runner.temp }}/lane-sweep
          CALL_BUDGET: "350"
          WINDOW_HOURS: "24"
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/maintenance-audit-lane-runs/collect.mjs

      - name: Read the key's credit history
        id: credit
        if: steps.collect.outputs.units != '' && steps.collect.outputs.units != '[]'
        continue-on-error: true
        timeout-minutes: 2
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          leg: start
          role: automations
          key-job: judge
          window-hours: ${{ vars.KEY_CREDIT_WINDOW_HOURS }}
          reset-at: ${{ vars.KEY_CREDIT_RESET_AT }}
          probe-minutes: "0"

      - name: Report the skipped key leg
        if: steps.credit.outputs.next-leg == 'subscription'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: skipped
          lane: lane-sweep
          lane-id: lane-sweep
          credential: AUTOMATIONS_CLAUDE_API_KEY
          known-failure-class: credit-stop
          handoff: "true"

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          steps.collect.outcome == 'success' && steps.collect.outputs.units != '[]'
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/lane-sweep

      - name: Upload the units
        if: >-
          (steps.collect.outcome == 'success' && steps.collect.outputs.units != '[]') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lane-sweep-units
          path: ${{ runner.temp }}/lane-sweep
          if-no-files-found: error
          retention-days: 3

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  assess-units:
    name: Assess Units
    needs: collect
    if: needs.collect.outputs.units != '' && needs.collect.outputs.units != '[]' && needs.collect.outputs.next-leg != 'subscription'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    cache-mode: read
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        unit: ${{ fromJson(needs.collect.outputs.units) }}
    env:
      API_BUDGET_TOKEN: github-token
    outputs:
      standards-sha: ${{ steps.standards.outputs.sha }}
    steps:
      - name: Check out the run's main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .base
          persist-credentials: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.collect.outputs.standards-sha }}

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Check the unit id
        id: unit
        if: steps.kill.outputs.proceed == 'true'
        env:
          UNIT: ${{ matrix.unit }}
        run: |
          [[ $UNIT =~ ^[acd][1-8]$ ]] || { echo "::error::unit id '$UNIT' is not a collector id"; exit 1; }

      - name: Download the units
        if: steps.unit.outcome == 'success'
        uses: actions/download-artifact@v8
        with:
          name: lane-sweep-units
          path: ${{ github.workspace }}/.lane-sweep-data

      - name: Resolve the model
        id: models
        if: steps.unit.outcome == 'success'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: triage-issue
          output-path: ${{ runner.temp }}/lane-sweep-models.json
          standards-path: ${{ steps.standards.outputs.path }}

      - name: Check the credential
        id: credential
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          leg: key
          role: automations
          credential-set: ${{ secrets.AUTOMATIONS_CLAUDE_API_KEY != '' }}
          key-off: ${{ vars.CLAUDE_API_KEYS_DISABLED == 'true' }}

      - name: Apply the Claude managed settings
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@main

      - name: Isolate the runner
        if: steps.models.outcome == 'success'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: true

      - name: Write the prompt and schema
        id: prompt
        if: steps.models.outcome == 'success'
        env:
          DATA: ${{ github.workspace }}/.lane-sweep-data
          BASE: ${{ github.workspace }}/.base
          UNIT: ${{ matrix.unit }}
          MODEL: ${{ steps.models.outputs.model }}
          SETTINGS_JSON: ${{ steps.models.outputs.settings-json }}
          PROMPT_FILE: ${{ runner.temp }}/lane-sweep-prompt.md
          SCHEMA_FILE: ${{ runner.temp }}/lane-sweep-schema.json
        run: |
          [ -z "$SETTINGS_JSON" ] || { echo "::error::the triage profile sets subagent-model, which this lane does not support"; exit 1; }
          [ -n "$MODEL" ] || { echo "::error::the triage profile's model is default, which run-claude-cli cannot pass; name an alias"; exit 1; }
          prompt=$(<.base/.github/scripts/maintenance-audit-lane-runs/prompt.md)
          prompt=${prompt//UNIT_FILE/$DATA/units/$UNIT.json}
          prompt=${prompt//OPEN_ITEMS_FILE/$DATA/open-items.json}
          prompt=${prompt//BASE_DIR/$BASE}
          printf '%s\n' "$prompt" >"$PROMPT_FILE"
          jq -c . .base/.github/scripts/maintenance-audit-lane-runs/lane-sweep.schema.json >"$SCHEMA_FILE"
          echo "started-at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Judge the unit
        id: judge
        if: steps.credential.outputs.present == 'true' && steps.prompt.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@main
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: lane-sweep
          role: automations
          prompt-file: ${{ runner.temp }}/lane-sweep-prompt.md
          preamble: >-
            You run unattended; return only the findings the schema asks for;
            nothing you write is posted.
          api-key: ${{ secrets.AUTOMATIONS_CLAUDE_API_KEY }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: |
            Read
            Grep
            Glob
          allowed-tools: |
            Read(./.lane-sweep-data/**)
            Read(./.base/**)
          disallowed-tools: |
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            mcp__*
            Read(//proc/**)
            Read(//sys/**)
            Read(~/.*)
            Read(~/.*/**)
            Read(/${{ runner.temp }}/**)
          json-schema-file: ${{ runner.temp }}/lane-sweep-schema.json
          leg-timeout-minutes: "20"
          otel-receiver: "true"

      - name: Upload the sealed transcript
        if: always() && steps.judge.outputs.execution-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          hide-trace-ids: "true"
          execution-file: ${{ steps.judge.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}-${{ matrix.unit }}
          otel-file: ${{ steps.judge.outputs.otel-file }}

      - name: Check the key leg
        id: key-leg
        if: steps.judge.outputs.handoff == 'true'
        continue-on-error: true
        env:
          LOG_FILE: ${{ steps.judge.outputs.log-file }}
          LANE_CLASS: ${{ steps.judge.outputs.lane-class }}
        run: |
          case "$LANE_CLASS" in
            auth) echo "::warning::the API refused the automations role's API key (AUTOMATIONS_CLAUDE_API_KEY), class auth; the owner must replace the secret" ;;
            *) echo "::warning::the automations role's API key (AUTOMATIONS_CLAUDE_API_KEY) hit a credit stop; rotate a spare key in" ;;
          esac
          node .base/.github/scripts/maintenance-audit-lane-runs/handoff.mjs check-leg

      - name: Pick the next leg
        id: next
        continue-on-error: true
        timeout-minutes: 1
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          state: ${{ steps.credential.outputs.state }}
          handoff: ${{ steps.judge.outputs.handoff == 'true' && steps.key-leg.outputs.clean == 'true' }}
          handoff-reason: ${{ steps.judge.outputs.handoff-reason }}

      - name: Record the handoff
        id: handoff
        if: steps.next.outputs.next-leg == 'subscription'
        env:
          LEG: key
          UNIT: ${{ matrix.unit }}
          REASON: ${{ steps.next.outputs.next-reason }}
          HANDOFF_DIR: ${{ runner.temp }}/lane-sweep-handoff
        run: node .base/.github/scripts/maintenance-audit-lane-runs/handoff.mjs record

      - name: Scan the upload for credentials
        id: scan-handoff
        if: >-
          steps.handoff.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/lane-sweep-handoff/judge-handoff-${{ matrix.unit }}.json

      - name: Upload the handoff
        if: >-
          (steps.handoff.outcome == 'success') && steps.scan-handoff.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: judge-handoff-${{ matrix.unit }}
          path: ${{ runner.temp }}/lane-sweep-handoff/judge-handoff-${{ matrix.unit }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Report the judgment's outcome
        if: steps.judge.outcome == 'success' || steps.judge.outcome == 'failure'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: ${{ steps.judge.outcome }}
          execution-file: ${{ steps.judge.outputs.execution-file }}
          log-file: ${{ steps.judge.outputs.log-file }}
          lane: lane-sweep
          lane-id: lane-sweep
          step-started-at: ${{ steps.prompt.outputs.started-at }}
          step-timeout-minutes: 25
          credential: ${{ steps.judge.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.judge.outputs.lane-class }}
          handoff: ${{ steps.judge.outputs.handoff == 'true' && steps.key-leg.outcome != 'failure' }}

      - name: Write the findings
        id: findings
        if: steps.judge.outcome == 'success'
        env:
          STRUCTURED_OUTPUT_FILE: ${{ steps.judge.outputs.structured-output-file }}
          UNIT_ID: ${{ matrix.unit }}
          FINDINGS_PATH: ${{ runner.temp }}/lane-sweep-findings/findings.json
        run: node .base/.github/scripts/maintenance-audit-lane-runs/write-findings.mjs

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          steps.findings.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/lane-sweep-findings/findings.json

      - name: Upload the findings
        if: >-
          (steps.findings.outcome == 'success') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: findings-${{ matrix.unit }}
          path: ${{ runner.temp }}/lane-sweep-findings/findings.json
          if-no-files-found: error
          retention-days: 3

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

      - name: Fail without findings
        if: always() && steps.unit.outcome == 'success' && steps.findings.outcome != 'success' && steps.handoff.outcome != 'success'
        run: |
          echo "::error::the judgment left no findings for this unit"
          exit 1

  collect-key-handoffs:
    name: Collect Key Handoffs
    needs: [collect, assess-units]
    if: >-
      ${{ !cancelled() && (needs.assess-units.result != 'skipped'
      || needs.collect.outputs.next-leg == 'subscription' && needs.collect.outputs.units != '' && needs.collect.outputs.units != '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.route.outputs.matrix || steps.route-skipped.outputs.matrix }}
      count: ${{ steps.route.outputs.count || steps.route-skipped.outputs.count }}
      standards-sha: ${{ needs.collect.outputs.standards-sha }}
    steps:
      - name: Check out the run's main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Download the handoff markers
        id: download
        if: steps.kill.outputs.proceed == 'true' && needs.collect.outputs.next-leg != 'subscription'
        uses: actions/download-artifact@v8
        with:
          pattern: judge-handoff-*
          path: ${{ runner.temp }}/lane-sweep-handoffs
          merge-multiple: true

      - name: Route the handed-off units to assess-units-subscription
        id: route
        if: steps.download.outcome == 'success'
        env:
          LEG: key
          HANDOFF_DIR: ${{ runner.temp }}/lane-sweep-handoffs
        run: node .base/.github/scripts/maintenance-audit-lane-runs/handoff.mjs route

      - name: Route every unit past the skipped key
        id: route-skipped
        if: steps.kill.outputs.proceed == 'true' && needs.collect.outputs.next-leg == 'subscription'
        env:
          UNITS: ${{ needs.collect.outputs.units }}
        run: node .base/.github/scripts/maintenance-audit-lane-runs/handoff.mjs route-skipped

      - name: Write the key's credit-stop marker
        id: credit-marker
        if: steps.route.outputs.credit-stop == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/key-credit-stop"
          echo "$GITHUB_RUN_ID" >"$RUNNER_TEMP/key-credit-stop/run-id"

      - name: Scan the key's credit-stop marker for credentials
        id: credit-marker-scan
        if: steps.credit-marker.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/key-credit-stop/run-id

      - name: Upload the key's credit-stop marker
        if: (steps.credit-marker.outcome == 'success') && steps.credit-marker-scan.outputs.clean == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: key-credit-stop-AUTOMATIONS_CLAUDE_API_KEY
          overwrite: true
          path: ${{ runner.temp }}/key-credit-stop/run-id
          if-no-files-found: error
          retention-days: 1

  assess-units-subscription:
    name: Assess Units Subscription
    needs: collect-key-handoffs
    if: ${{ !cancelled() && needs.collect-key-handoffs.result == 'success' && needs.collect-key-handoffs.outputs.count != '' && needs.collect-key-handoffs.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    cache-mode: read
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.collect-key-handoffs.outputs.matrix) }}
    env:
      API_BUDGET_TOKEN: github-token
    outputs:
      standards-sha: ${{ steps.standards.outputs.sha }}
    steps:
      - name: Check out the run's main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .base
          persist-credentials: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.collect-key-handoffs.outputs.standards-sha }}

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Check the unit id
        id: unit
        if: steps.kill.outputs.proceed == 'true'
        env:
          UNIT: ${{ matrix.unit }}
        run: |
          [[ $UNIT =~ ^[acd][1-8]$ ]] || { echo "::error::unit id '$UNIT' is not a collector id"; exit 1; }

      - name: Download the units
        if: steps.unit.outcome == 'success'
        uses: actions/download-artifact@v8
        with:
          name: lane-sweep-units
          path: ${{ github.workspace }}/.lane-sweep-data

      - name: Resolve the model
        id: models
        if: steps.unit.outcome == 'success'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: triage-issue
          output-path: ${{ runner.temp }}/lane-sweep-models.json
          standards-path: ${{ steps.standards.outputs.path }}

      - name: Check the credential
        id: credential
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          leg: subscription
          role: automations
          credential-set: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN != '' }}
          fallback-set: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
          reason: ${{ matrix.reason }}

      - name: Apply the Claude managed settings
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@main

      - name: Isolate the runner
        if: steps.models.outcome == 'success'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: true

      - name: Write the prompt and schema
        id: prompt
        if: steps.models.outcome == 'success'
        env:
          DATA: ${{ github.workspace }}/.lane-sweep-data
          BASE: ${{ github.workspace }}/.base
          UNIT: ${{ matrix.unit }}
          MODEL: ${{ steps.models.outputs.model }}
          SETTINGS_JSON: ${{ steps.models.outputs.settings-json }}
          PROMPT_FILE: ${{ runner.temp }}/lane-sweep-prompt.md
          SCHEMA_FILE: ${{ runner.temp }}/lane-sweep-schema.json
        run: |
          [ -z "$SETTINGS_JSON" ] || { echo "::error::the triage profile sets subagent-model, which this lane does not support"; exit 1; }
          [ -n "$MODEL" ] || { echo "::error::the triage profile's model is default, which run-claude-cli cannot pass; name an alias"; exit 1; }
          prompt=$(<.base/.github/scripts/maintenance-audit-lane-runs/prompt.md)
          prompt=${prompt//UNIT_FILE/$DATA/units/$UNIT.json}
          prompt=${prompt//OPEN_ITEMS_FILE/$DATA/open-items.json}
          prompt=${prompt//BASE_DIR/$BASE}
          printf '%s\n' "$prompt" >"$PROMPT_FILE"
          jq -c . .base/.github/scripts/maintenance-audit-lane-runs/lane-sweep.schema.json >"$SCHEMA_FILE"
          echo "started-at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Judge the unit
        id: judge
        if: steps.credential.outputs.present == 'true' && steps.prompt.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@main
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: lane-sweep
          role: automations
          prompt-file: ${{ runner.temp }}/lane-sweep-prompt.md
          preamble: >-
            You run unattended; return only the findings the schema asks for;
            nothing you write is posted.
          subscription-token: ${{ secrets.AUTOMATIONS_CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: |
            Read
            Grep
            Glob
          allowed-tools: |
            Read(./.lane-sweep-data/**)
            Read(./.base/**)
          disallowed-tools: |
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            mcp__*
            Read(//proc/**)
            Read(//sys/**)
            Read(~/.*)
            Read(~/.*/**)
            Read(/${{ runner.temp }}/**)
          json-schema-file: ${{ runner.temp }}/lane-sweep-schema.json
          fallback-ready: ${{ steps.credential.outputs.fallback-ready }}
          leg-timeout-minutes: "20"
          otel-receiver: "true"

      - name: Upload the sealed transcript
        if: always() && steps.judge.outputs.execution-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          hide-trace-ids: "true"
          execution-file: ${{ steps.judge.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}-${{ matrix.unit }}
          otel-file: ${{ steps.judge.outputs.otel-file }}

      - name: Check the subscription leg
        id: sub-leg
        if: steps.judge.outputs.handoff == 'true'
        continue-on-error: true
        env:
          LOG_FILE: ${{ steps.judge.outputs.log-file }}
          HANDOFF_REASON: ${{ steps.judge.outputs.handoff-reason }}
        run: |
          node .base/.github/scripts/maintenance-audit-lane-runs/handoff.mjs check-leg
          echo "::notice::the subscription leg handed off (${HANDOFF_REASON}); assess-units-fallback judges on the fallback token"

      - name: Pick the next leg
        id: next
        continue-on-error: true
        timeout-minutes: 1
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          state: ${{ steps.credential.outputs.state }}
          handoff: ${{ steps.judge.outputs.handoff == 'true' && steps.sub-leg.outputs.clean == 'true' }}
          handoff-reason: ${{ steps.judge.outputs.handoff-reason }}

      - name: Record the handoff
        id: handoff
        if: steps.next.outputs.next-leg == 'fallback'
        env:
          LEG: subscription
          UNIT: ${{ matrix.unit }}
          REASON: ${{ steps.next.outputs.next-reason }}
          HANDOFF_DIR: ${{ runner.temp }}/lane-sweep-handoff
        run: node .base/.github/scripts/maintenance-audit-lane-runs/handoff.mjs record

      - name: Scan the upload for credentials
        id: scan-handoff
        if: >-
          steps.handoff.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/lane-sweep-handoff/judge-subscription-handoff-${{ matrix.unit }}.json

      - name: Upload the handoff
        if: >-
          (steps.handoff.outcome == 'success') && steps.scan-handoff.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: judge-subscription-handoff-${{ matrix.unit }}
          path: ${{ runner.temp }}/lane-sweep-handoff/judge-subscription-handoff-${{ matrix.unit }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Report the judgment's outcome
        if: steps.judge.outcome == 'success' || steps.judge.outcome == 'failure'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: ${{ steps.judge.outcome }}
          execution-file: ${{ steps.judge.outputs.execution-file }}
          log-file: ${{ steps.judge.outputs.log-file }}
          lane: lane-sweep
          lane-id: lane-sweep
          step-started-at: ${{ steps.prompt.outputs.started-at }}
          step-timeout-minutes: 25
          credential: ${{ steps.judge.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.judge.outputs.lane-class }}
          handoff: ${{ steps.judge.outputs.handoff == 'true' && steps.sub-leg.outcome != 'failure' }}
          fallback-reason: ${{ steps.credential.outputs.fallback-reason }}

      - name: Write the findings
        id: findings
        if: steps.judge.outcome == 'success'
        env:
          STRUCTURED_OUTPUT_FILE: ${{ steps.judge.outputs.structured-output-file }}
          UNIT_ID: ${{ matrix.unit }}
          FINDINGS_PATH: ${{ runner.temp }}/lane-sweep-findings/findings.json
        run: node .base/.github/scripts/maintenance-audit-lane-runs/write-findings.mjs

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          steps.findings.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/lane-sweep-findings/findings.json

      - name: Upload the findings
        if: >-
          (steps.findings.outcome == 'success') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: findings-${{ matrix.unit }}
          path: ${{ runner.temp }}/lane-sweep-findings/findings.json
          if-no-files-found: error
          retention-days: 3

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

      - name: Fail without findings
        if: always() && steps.unit.outcome == 'success' && steps.findings.outcome != 'success' && steps.handoff.outcome != 'success'
        run: |
          echo "::error::the judgment left no findings for this unit"
          exit 1

  collect-subscription-handoffs:
    name: Collect Subscription Handoffs
    needs: assess-units-subscription
    if: ${{ !cancelled() && needs.assess-units-subscription.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.route.outputs.matrix }}
      count: ${{ steps.route.outputs.count }}
      standards-sha: ${{ needs.assess-units-subscription.outputs.standards-sha }}
    steps:
      - name: Check out the run's main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .base
          persist-credentials: false

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Download the handoff markers
        id: download
        if: steps.kill.outputs.proceed == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: judge-subscription-handoff-*
          path: ${{ runner.temp }}/lane-sweep-handoffs
          merge-multiple: true

      - name: Route the handed-off units to assess-units-fallback
        id: route
        if: steps.download.outcome == 'success'
        env:
          LEG: subscription
          HANDOFF_DIR: ${{ runner.temp }}/lane-sweep-handoffs
        run: node .base/.github/scripts/maintenance-audit-lane-runs/handoff.mjs route

  assess-units-fallback:
    name: Assess Units Fallback
    needs: collect-subscription-handoffs
    if: ${{ !cancelled() && needs.collect-subscription-handoffs.result == 'success' && needs.collect-subscription-handoffs.outputs.count != '' && needs.collect-subscription-handoffs.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    cache-mode: read
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.collect-subscription-handoffs.outputs.matrix) }}
    env:
      API_BUDGET_TOKEN: github-token
    outputs:
      standards-sha: ${{ steps.standards.outputs.sha }}
    steps:
      - name: Check out the run's main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .base
          persist-credentials: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.collect-subscription-handoffs.outputs.standards-sha }}

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Check the unit id
        id: unit
        if: steps.kill.outputs.proceed == 'true'
        env:
          UNIT: ${{ matrix.unit }}
        run: |
          [[ $UNIT =~ ^[acd][1-8]$ ]] || { echo "::error::unit id '$UNIT' is not a collector id"; exit 1; }

      - name: Download the units
        if: steps.unit.outcome == 'success'
        uses: actions/download-artifact@v8
        with:
          name: lane-sweep-units
          path: ${{ github.workspace }}/.lane-sweep-data

      - name: Resolve the model
        id: models
        if: steps.unit.outcome == 'success'
        uses: ./.base/.github/actions/resolve-config # zizmor: ignore[self-repository]
        with:
          model-route: triage-issue
          output-path: ${{ runner.temp }}/lane-sweep-models.json
          standards-path: ${{ steps.standards.outputs.path }}

      - name: Check the credential
        id: credential
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/select-model-credential@main
        with:
          leg: fallback
          role: automations
          credential-set: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN != '' }}
          reason: ${{ matrix.reason }}

      - name: Apply the Claude managed settings
        if: steps.models.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/apply-claude-managed-settings@main

      - name: Isolate the runner
        if: steps.models.outcome == 'success'
        uses: ./.base/.github/actions/setup-runner-isolation # zizmor: ignore[self-repository]
        with:
          install-subprocess-isolation: true

      - name: Write the prompt and schema
        id: prompt
        if: steps.models.outcome == 'success'
        env:
          DATA: ${{ github.workspace }}/.lane-sweep-data
          BASE: ${{ github.workspace }}/.base
          UNIT: ${{ matrix.unit }}
          MODEL: ${{ steps.models.outputs.model }}
          SETTINGS_JSON: ${{ steps.models.outputs.settings-json }}
          PROMPT_FILE: ${{ runner.temp }}/lane-sweep-prompt.md
          SCHEMA_FILE: ${{ runner.temp }}/lane-sweep-schema.json
        run: |
          [ -z "$SETTINGS_JSON" ] || { echo "::error::the triage profile sets subagent-model, which this lane does not support"; exit 1; }
          [ -n "$MODEL" ] || { echo "::error::the triage profile's model is default, which run-claude-cli cannot pass; name an alias"; exit 1; }
          prompt=$(<.base/.github/scripts/maintenance-audit-lane-runs/prompt.md)
          prompt=${prompt//UNIT_FILE/$DATA/units/$UNIT.json}
          prompt=${prompt//OPEN_ITEMS_FILE/$DATA/open-items.json}
          prompt=${prompt//BASE_DIR/$BASE}
          printf '%s\n' "$prompt" >"$PROMPT_FILE"
          jq -c . .base/.github/scripts/maintenance-audit-lane-runs/lane-sweep.schema.json >"$SCHEMA_FILE"
          echo "started-at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Judge the unit
        id: judge
        if: steps.credential.outputs.present == 'true' && steps.prompt.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        uses: melodic-software/ci-workflows/.github/actions/run-claude-cli@main
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          lane: lane-sweep
          role: automations
          prompt-file: ${{ runner.temp }}/lane-sweep-prompt.md
          preamble: >-
            You run unattended; return only the findings the schema asks for;
            nothing you write is posted.
          fallback-token: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.models.outputs.model }}
          effort: ${{ steps.models.outputs.effort }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          permission-mode: dontAsk
          tools: |
            Read
            Grep
            Glob
          allowed-tools: |
            Read(./.lane-sweep-data/**)
            Read(./.base/**)
          disallowed-tools: |
            Bash
            Edit
            Write
            NotebookEdit
            WebFetch
            WebSearch
            Agent
            mcp__*
            Read(//proc/**)
            Read(//sys/**)
            Read(~/.*)
            Read(~/.*/**)
            Read(/${{ runner.temp }}/**)
          json-schema-file: ${{ runner.temp }}/lane-sweep-schema.json
          leg-timeout-minutes: "20"
          otel-receiver: "true"

      - name: Upload the sealed transcript
        if: always() && steps.judge.outputs.execution-file != ''
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/upload-lane-transcript@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          hide-trace-ids: "true"
          execution-file: ${{ steps.judge.outputs.execution-file }}
          public-key: ${{ vars.LANE_TRANSCRIPT_PUBLIC_KEY }}
          job-id: ${{ github.job }}-${{ matrix.unit }}
          otel-file: ${{ steps.judge.outputs.otel-file }}

      - name: Report the judgment's outcome
        if: steps.judge.outcome == 'success' || steps.judge.outcome == 'failure'
        continue-on-error: true
        uses: melodic-software/ci-workflows/.github/actions/report-lane-outcome@main
        with:
          outcome: ${{ steps.judge.outcome }}
          execution-file: ${{ steps.judge.outputs.execution-file }}
          log-file: ${{ steps.judge.outputs.log-file }}
          lane: lane-sweep
          lane-id: lane-sweep
          step-started-at: ${{ steps.prompt.outputs.started-at }}
          step-timeout-minutes: 25
          credential: ${{ steps.judge.outputs.credential }}
          max-turns: ${{ steps.models.outputs.max-turns }}
          known-failure-class: ${{ steps.judge.outputs.lane-class }}
          fallback-reason: ${{ steps.credential.outputs.fallback-reason }}

      - name: Write the findings
        id: findings
        if: steps.judge.outcome == 'success'
        env:
          STRUCTURED_OUTPUT_FILE: ${{ steps.judge.outputs.structured-output-file }}
          UNIT_ID: ${{ matrix.unit }}
          FINDINGS_PATH: ${{ runner.temp }}/lane-sweep-findings/findings.json
        run: node .base/.github/scripts/maintenance-audit-lane-runs/write-findings.mjs

      - name: Scan the upload for credentials
        id: scan-upload
        if: >-
          steps.findings.outcome == 'success'
        uses: melodic-software/ci-workflows/.github/actions/scan-upload@main
        with:
          gate-path: .base/lib/publish-gate.mjs
          path: ${{ runner.temp }}/lane-sweep-findings/findings.json

      - name: Upload the findings
        if: >-
          (steps.findings.outcome == 'success') && steps.scan-upload.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: findings-${{ matrix.unit }}
          path: ${{ runner.temp }}/lane-sweep-findings/findings.json
          if-no-files-found: error
          retention-days: 3

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

      - name: Fail without findings
        if: always() && steps.unit.outcome == 'success' && steps.findings.outcome != 'success'
        run: |
          echo "::error::the judgment left no findings for this unit"
          exit 1

  file:
    name: File
    needs: [collect, assess-units, assess-units-subscription, assess-units-fallback]
    if: ${{ !cancelled() && needs.collect.result == 'success' && needs.collect.outputs.units != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      API_BUDGET_TOKEN: github-token
      npm_config_audit: "false"
      npm_config_fetch_timeout: "60000"
      npm_config_fund: "false"
      npm_config_globalconfig: ${{ github.workspace }}/.base/.github/npm-fetch.npmrc
    steps:
      - name: Check out the run's main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .base
          persist-credentials: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main
        with:
          ref: ${{ needs.collect.outputs.standards-sha }}

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}

      - name: Download the units
        if: steps.kill.outputs.proceed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: lane-sweep-units
          path: ${{ runner.temp }}/lane-sweep

      - name: Download the findings
        id: download
        if: steps.kill.outputs.proceed == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: findings-*
          path: ${{ runner.temp }}/lane-sweep-findings

      - name: Install resolve-config's packages
        timeout-minutes: 5
        if: steps.download.outcome == 'success'
        run: npm ci --ignore-scripts --omit=dev --prefix .base/.github/actions/resolve-config

      - name: File the findings
        if: steps.download.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_DIR: .base
          FINDINGS_DIR: ${{ runner.temp }}/lane-sweep-findings
          UNITS_DIR: ${{ runner.temp }}/lane-sweep/units
          COLLECT_STATUS_PATH: ${{ runner.temp }}/lane-sweep/collect-status.json
          OPEN_ITEMS_PATH: ${{ runner.temp }}/lane-sweep/open-items.json
          CALL_BUDGET: "50"
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: |
          mkdir -p "$FINDINGS_DIR"
          node .base/.github/scripts/maintenance-audit-lane-runs/file-findings.mjs

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token

  triage-sweep:
    name: Triage Sweep
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: maintenance-audit-lane-runs-triage-sweep
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      issues: write
    env:
      API_BUDGET_TOKEN: github-token
      npm_config_audit: "false"
      npm_config_fetch_timeout: "60000"
      npm_config_fund: "false"
      npm_config_globalconfig: ${{ github.workspace }}/.base/.github/npm-fetch.npmrc
    steps:
      - name: Check out the run's main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .base
          persist-credentials: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Check the kill switch
        id: kill
        uses: ./.base/.github/actions/check-kill-switch # zizmor: ignore[self-repository]
        with:
          value: ${{ vars.CLAUDE_LANES_DISABLED }}
          repo-value: ${{ vars.CLAUDE_LANES_REPO_DISABLED }}
          budget: "true"

      - name: Install resolve-config's packages
        timeout-minutes: 5
        if: steps.kill.outputs.proceed == 'true'
        run: npm ci --ignore-scripts --omit=dev --prefix .base/.github/actions/resolve-config

      - name: Sweep for untriaged issues
        if: steps.kill.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_ACTORS_PATH: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          LANES_APP_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          CALL_BUDGET: "120"
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/maintenance-audit-lane-runs/triage-sweep.mjs

      - name: List the issues parked for a done-check, on the daily run only
        if: ${{ !cancelled() && steps.kill.outputs.proceed == 'true' && github.event.schedule != '17 * * * *' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_ACTORS_PATH: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          LANES_APP_ID: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/maintenance-audit-lane-runs/done-check.mjs

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token
