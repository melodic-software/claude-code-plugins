        if: steps.judge.outcome == 'success'
        env:
          STRUCTURED_OUTPUT_FILE: ${{ steps.judge.outputs.structured-output-file }}
          UNIT_ID: ${{ matrix.unit }}
          FINDINGS_PATH: ${{ runner.temp }}/lane-sweep-findings/findings.json
        run: node .base/.github/scripts/maintenance-audit-lane-runs/write-findings.mjs

      - name: Upload the findings
        if: steps.findings.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ matrix.unit }}
          path: ${{ runner.temp }}/lane-sweep-findings/findings.json
          if-no-files-found: error
          retention-days: 7

      - name: Fail without findings
        if: always() && steps.unit.outcome == 'success' && steps.findings.outcome != 'success'
        run: |
          echo "::error::the judgment left no findings for this unit"
          exit 1

  file:
    needs: [collect, judge, judge-subscription, judge-fallback]
    # A failed leg loses its own unit's findings only.
    if: ${{ !cancelled() && needs.collect.result == 'success' && needs.collect.outputs.units != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # download the findings artifacts
      contents: read # check out main for the claim check
      issues: write # file, rewrite and comment on the digest issue
    env:
      API_BUDGET_TOKEN: github-token
    steps:
      - name: Check out the run's main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .base
