name: Intake Label Outside Actor Activity

on:
  issues:
    types: [opened, edited, reopened, unlabeled]
  # Runs from the default branch; checks out main only and passes no event text to a shell.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  # Never checks out the pull request head.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, synchronize, reopened, unlabeled]

permissions: {}

jobs:
  label-outside-actor:
    name: Label Outside Actor
    if: >-
      (github.event.action == 'unlabeled'
        && github.event.label.name == 'security: outside-actor')
      || (github.event.action != 'unlabeled'
        && (github.event.sender.type != 'Bot'
          || (github.event_name == 'pull_request_target'
            && github.event.pull_request.head.repo.full_name != github.repository))
        && ((contains(fromJSON('["edited", "synchronize", "reopened"]'), github.event.action)
             && github.event.sender.id != (github.event.comment.user.id
               || github.event.review.user.id
               || github.event.pull_request.user.id
               || github.event.issue.user.id))
          || !contains(fromJSON('["OWNER", "MEMBER"]'),
               github.event.comment.author_association
               || github.event.review.author_association
               || github.event.pull_request.author_association
               || github.event.issue.author_association)))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: security-outside-actor-${{ github.event.issue.number || github.event.pull_request.number }}
      queue: max
    env:
      API_BUDGET_TOKEN: github-token
      npm_config_audit: "false"
      npm_config_fetch_timeout: "60000"
      npm_config_fund: "false"
      npm_config_globalconfig: ${{ github.workspace }}/.base/.github/npm-fetch.npmrc
    steps:
      - name: Resolve main's tip
        id: tip
        uses: melodic-software/ci-workflows/.github/actions/resolve-branch-tip@main
        with:
          branch: main
      - name: Check out the default branch tip
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tip.outputs.sha }}
          path: .base
          persist-credentials: false

      - name: Download standards
        id: standards
        uses: melodic-software/ci-workflows/.github/actions/download-standards@main

      - name: Set up Node
        uses: melodic-software/ci-workflows/.github/actions/setup-pinned-node@main
        with:
          node-version-file: .base/.node-version

      - name: Install resolve-config's packages
        continue-on-error: true
        timeout-minutes: 3
        run: npm ci --ignore-scripts --omit=dev --prefix .base/.github/actions/resolve-config

      - name: Flag an outside actor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_ACTORS_PATH: ${{ steps.standards.outputs.path }}/components/trusted-actors/trusted-actors.json
          STANDARDS_DIR: ${{ steps.standards.outputs.path }}
        run: node .base/.github/scripts/security-outside-actor/flag.mjs

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          tokens: github-token
