name: bench-harness

# Weekly run of the rate-limit-guard statusline bench lanes.
# plugins/rate-limit-guard/bench/bench.test.sh asserts the harness still RUNS
# from a clean checkout — the defect that made #2521's measurements
# unreproducible (#2582) — by spawning bench-idle.sh, bench-load.sh and
# trace-probe.sh at tiny parameters. Spawning a lane is running a benchmark
# whatever the parameters, so those runs are gated on BENCH_LANES and every
# ordinary run of the suite reports them as deferred; this lane is where they
# actually run. Advisory by construction, like hook-utils-timing: nothing
# aggregates this workflow into ci-status, and a flake here blocks no merge.
#
# Linux only, because the contract corpus that carries this suite runs in
# test-linux; ci.yml's test-windows job runs named scripts/ suites, not
# scripts/run-plugin-tests.sh, so no Windows coverage of the lanes is lost.
on:
  schedule:
    - cron: "43 6 * * 1" # Mondays 06:43 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the bench harness suite with the lanes enabled
        env:
          BENCH_LANES: "1"
        run: bash plugins/rate-limit-guard/bench/bench.test.sh
