name: PR Review Comment Relay

on:
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  relay:
    name: Relay
    if: >-
      github.event.comment.user.type == 'User'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'work-resolve-issue/issue-')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Relay the comment
        run: echo "A person's review comment; pr-dispatch-feedback.yml decides from this run's own facts."
