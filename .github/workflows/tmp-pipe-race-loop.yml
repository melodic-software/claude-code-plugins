name: tmp-pipe-race-loop

# TEMPORARY: loop proof for #4458, reverted before the PR is marked ready.
# Runs every suite this branch touched, at the base commit and at HEAD,
# interleaved, three suites at a time (the test-linux --jobs 3 load shape).

on:
  push:
    branches: [fix/test-stdin-pipe-race]

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        leg: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - uses: melodic-software/ci-workflows/.github/actions/shellcheck@4610c31e92eb1c4b24981e2f200ac87bdb2a1753 # v0.27.1
        with:
          paths: plugins/bash-format
          rcfile: .shellcheckrc
      - name: Install locked plugin test toolchains
        run: |
          npm ci
          python -m pip install --user --only-binary=:all: --require-hashes \
            --requirement .github/requirements-ci.txt
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Loop base vs fixed
        env:
          BASE: 6cd0ae314243ccd3b31e582229d7c8b3713b21b7
          ITER: 8
          LEG: ${{ matrix.leg }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          mapfile -t suites < <(git diff --name-only "$BASE" HEAD -- '*.test.sh')
          for s in "${suites[@]}"; do
            git show "$BASE:$s" >"${s%.test.sh}.basecopy.test.sh"
            chmod +x "${s%.test.sh}.basecopy.test.sh"
          done
          res="$RUNNER_TEMP/results.tsv"
          : >"$res"
          mkdir -p "$RUNNER_TEMP/fail"
          # Three lanes, each owning a disjoint set of suites, so no suite ever
          # runs concurrently with itself; base and fixed alternate per iteration.
          lane() {
            local k="$1" i s v f idx out
            for ((i = 0; i < ITER; i++)); do
              idx=0
              for s in "${suites[@]}"; do
                if ((idx++ % 3 == k)); then
                  for v in base fixed; do
                    f="$s"
                    [[ "$v" == base ]] && f="${s%.test.sh}.basecopy.test.sh"
                    out="$RUNNER_TEMP/fail/$v.${s//\//_}.$i.log"
                    if timeout 600 bash "$f" >"$out" 2>&1 </dev/null; then
                      printf '%s\t%s\tPASS\n' "$v" "$s" >>"$res"
                      rm -f "$out"
                    else
                      printf '%s\t%s\tFAIL\n' "$v" "$s" >>"$res"
                    fi
                  done
                fi
              done
            done
          }
          lane 0 &
          lane 1 &
          lane 2 &
          wait
          echo "leg $LEG: pass counts over $ITER iterations (base = $BASE, fixed = HEAD)"
          awk -F'\t' '{t[$1"\t"$2]++; if ($3=="PASS") p[$1"\t"$2]++} END {for (k in t) printf "%s\t%d/%d\n", k, p[k], t[k]}' "$res" | sort -k2 | tee -a "$GITHUB_STEP_SUMMARY"
          for f in "$RUNNER_TEMP"/fail/*.log; do
            [[ -e "$f" ]] || continue
            echo "::group::${f##*/}"
            grep -E 'FAIL|Broken pipe|write error' "$f" | head -20
            echo "::endgroup::"
          done
          for s in "${suites[@]}"; do rm -f "${s%.test.sh}.basecopy.test.sh"; done
