name: intake-label-needs-triage

# Applies the bare floor label `needs-triage` to an issue opened or
# reopened with no `priority:*` label, via the shared intake-label-needs-triage
# reusable from ci-workflows. The floor is not a priority value. Non-gating:
# never blocks a merge. `reopened` is
# included so a reopened issue re-acquires the floor if its tier was cleared
# while closed. See ci-workflows' intake-label-needs-triage.yml for the mechanism,
# loop-safety, and fail-closed label-existence contract. Settled per #506.
on:
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  # Skips the floor label for an issue /work-items:decompose published
  # already triaged; see .github/actions/check-born-triaged. A failed gate
  # leaves skip empty, so the label lane runs. It runs on opened only, so a
  # reopened issue still re-acquires the floor.
  born-triaged:
    if: github.event.action == 'opened'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the default branch for the trusted-actor list
      issues: read # read the issue's current body, type and labels
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .base
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/check-born-triaged/
            /.github/standards/trusted-actors/
            /.node-version
          sparse-checkout-cone-mode: false
      - name: Log the API budget at the start
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          phase: start
          tokens: github-token ${{ github.token }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .base/.node-version
          package-manager-cache: false

      - name: Check whether the issue was born triaged
        id: check
        uses: ./.base/.github/actions/check-born-triaged # zizmor: ignore[self-repository]
        with:
          lanes-app-id: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}

      - name: Log the API budget at the end
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.base/.github/actions/log-api-budget # zizmor: ignore[self-repository]
        with:
          phase: end
          tokens: github-token ${{ github.token }}

  intake-label-needs-triage:
    needs: born-triaged
    if: ${{ !cancelled() && needs.born-triaged.outputs.skip != 'true' }}
    permissions:
      issues: write # passed to the reusable, which reads and adds issue labels
    uses: melodic-software/ci-workflows/.github/workflows/intake-label-needs-triage.yml@5e18f3d6cebd6fa5e66b0941ee0f7ed6ba288d6c # v0.58.0
    with:
      runner: ubuntu-24.04
      label: needs-triage
