name: pr-require-checks-trust-paths

# Posts a failing `ci-status` commit status when the agent App touched a
# pull request that changes a path in .github/trust-path-hold.json, so a
# person merges it. pull_request_target runs this caller and reads the config
# from the base branch, so a pull request cannot edit its own hold. The config
# is generated by scripts/sync-hold-floor.py; the inline hold in
# pr-require-checks.yml stays beside it.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr-require-checks-trust-paths:
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: melodic-software/ci-workflows/.github/workflows/pr-require-checks-trust-paths.yml@4ad14b4f1b4868aa5362590299c93d9117b629f1 # v0.67.1
    with:
      runner: ubuntu-24.04
