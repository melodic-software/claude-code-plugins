name: pr-require-checks-trust-paths

# Posts a failing `ci-status` commit status when the agent App touched a
# pull request that changes a path in .github/trust-path-hold.json, so a
# person merges it. pull_request_target runs this caller and reads the config
# at the default branch's last commit, so a pull request cannot edit its own
# hold. The config
# is generated by scripts/sync-hold-floor.py; the inline hold in
# pr-require-checks.yml stays beside it.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr-require-checks-trust-paths:
    # Off while the trust-path hold is off (docs/conventions/pr-pipeline.yaml
    # merge.trust-path-hold-apps names no App): its success `ci-status`
    # commit status met the required check before the ci-status check run
    # existed, so the merge queue took an unchecked head. To restore the hold,
    # list the App in merge.trust-path-hold-apps, run scripts/sync-hold-floor.py
    # and set the repository variable TRUST_PATH_HOLD to `on`.
    if: vars.TRUST_PATH_HOLD == 'on'
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: melodic-software/ci-workflows/.github/workflows/pr-require-checks-trust-paths.yml@main
    with:
      runner: ubuntu-24.04
