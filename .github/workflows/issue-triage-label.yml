name: issue-triage-label

# Applies the bare floor label `needs-triage` to an issue opened or
# reopened with no `priority:*` label, via the shared issue-triage-label
# reusable from ci-workflows. The floor is not a priority value. Non-gating:
# never blocks a merge. `reopened` is
# included so a reopened issue re-acquires the floor if its tier was cleared
# while closed. See ci-workflows' issue-triage-label.yml for the mechanism,
# loop-safety, and fail-closed label-existence contract. Settled per #506.
on:
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  issue-triage-label:
    permissions:
      issues: write # passed to the reusable, which reads and adds issue labels
    # Stays on v0.27.1, the newest SHA with a reviewed contract in
    # .github/standards/runner-policy/policy.json. The runner-policy gate
    # declines to auto-approve a newer SHA for a reusable that carries an
    # allowedCallerPermissions grant, so a repin waits on a reviewed contract
    # for the new SHA in melodic-software/standards.
    uses: melodic-software/ci-workflows/.github/workflows/issue-triage-label.yml@4610c31e92eb1c4b24981e2f200ac87bdb2a1753 # v0.27.1
    with:
      runner: ubuntu-24.04
      label: needs-triage
