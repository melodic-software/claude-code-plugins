name: issue-triage-label

# Applies the bare floor label `needs-triage` to an issue opened or
# reopened with no `priority:*` label, via the shared issue-triage-label
# reusable from ci-workflows. The floor is not a priority value. Non-gating:
# never blocks a merge. `reopened` is
# included so a reopened issue re-acquires the floor if its tier was cleared
# while closed. See ci-workflows' issue-triage-label.yml for the mechanism,
# loop-safety, and fail-closed label-existence contract. Settled per #506.
on:
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  issue-triage-label:
    permissions:
      issues: write # passed to the reusable, which reads and adds issue labels
    uses: melodic-software/ci-workflows/.github/workflows/issue-triage-label.yml@2c1de45aa0e1b1489afb8edfebc12cb3a4fa6ac3 # v0.24.0
    with:
      runner: ubuntu-24.04
      label: needs-triage
