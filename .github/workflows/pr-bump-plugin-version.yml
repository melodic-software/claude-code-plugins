name: pr-bump-plugin-version

# Dependabot can edit package manifests and lockfiles under plugins/** but cannot
# bump plugins/<name>/.claude-plugin/plugin.json or write CHANGELOG.md. The
# changelog-parity --check-bump gate correctly requires those (Claude Code
# delivers updates only when the plugin version string changes). This workflow
# supplies the bump on Dependabot PRs for a plugin not yet in changelog-fragment
# mode. A plugin in fragment mode (ADR 0048) gets no commit here: every run on a
# commit this workflow makes waits at action_required (#5786, below), so
# dependabot-fragments.yml writes its fragment after the merge instead, and
# check-changelog-fragments.sh --check-required exempts the Dependabot-only pull
# request. Once every plugin is in fragment mode this workflow commits nothing.
#
# Commit messages include [dependabot skip] so Dependabot may force-push over
# the bot commit when rebasing (GitHub docs: Managing pull requests for
# dependency updates; verified 2026-09-27; recheck when that page stops
# naming `[dependabot skip]` as the way to let Dependabot rebase over a
# commit). The bump is created through the
# GraphQL createCommitOnBranch mutation, not a local git commit and push, so
# GitHub signs the commit and marks it Verified, which a required_signatures
# ruleset accepts. A local commit pushed with GITHUB_TOKEN is unsigned.
# Per the GitHub docs page "Triggering a workflow", a pull_request event from a
# pull request that GITHUB_TOKEN updated creates runs in an approval-required
# state, so every run on the bump commit waits in action_required (#5786). No
# App token is used here: a Dependabot-triggered run sees only Dependabot
# secrets, and the owner declined a dedicated bump App; the fragment path above
# removes the commit instead.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - plugins/**

permissions:
  contents: read

concurrency:
  group: pr-bump-plugin-version-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  bump-plugin-version:
    # zizmor: ignore[bot-conditions] dependabot-only job; login is read from the PR user, not github.actor
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    # The token can write contents, so no code from the pull request runs here:
    # its checkout is data that git, jq and main's scripts read and edit. Every
    # script comes from main's checkout in .base. The script still reads
    # github.base_ref's fragment-plugins.txt and manifests, as data; the pull
    # request picks that ref. A local action would load from the pull request,
    # so the job uses none. scripts/pr-bump-plugin-version.test.sh holds the
    # allowlist of what this job may run. actions/checkout writes only inside
    # the workspace, so .base sits in the pull request's tree and must not
    # already exist there.
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a pull request that tracks .base
        run: test ! -e .base
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: .base
          persist-credentials: false
      - name: Bump legacy plugin manifests and changelogs
        id: bump
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash .base/scripts/dependabot-plugin-bump.sh "origin/$BASE_REF" --pr "$PR_NUMBER" --title "$PR_TITLE"
      - name: Commit release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git add -u -- plugins
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          # File contents go through stdin and files, never argv, so a large file fits.
          adds="$RUNNER_TEMP/additions.jsonl"
          dels="$RUNNER_TEMP/deletions.json"
          payload="$RUNNER_TEMP/payload.json"
          : >"$adds"
          while IFS= read -r -d '' path; do
            git show ":$path" | base64 -w0 | jq -Rsc --arg path "$path" '{path: $path, contents: .}' >>"$adds"
          done < <(git diff --cached --name-only --diff-filter=AM -z)
          git diff --cached --name-only --diff-filter=D -z |
            jq -Rs 'split("\u0000") | map(select(length > 0) | {path: .})' >"$dels"
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$HEAD_REF" \
            --arg oid "$(git rev-parse HEAD)" \
            --arg headline "chore(plugins): release bump for Dependabot update [dependabot skip]" \
            --slurpfile additions "$adds" \
            --slurpfile deletions "$dels" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: $headline},
                fileChanges: {additions: $additions, deletions: $deletions[0]}
              }}
            }' >"$payload"
          gh api graphql --input - <"$payload" | jq -e '.data.createCommitOnBranch.commit.oid'
