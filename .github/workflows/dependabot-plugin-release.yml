name: dependabot-plugin-release

# Dependabot can edit package manifests and lockfiles under plugins/** but cannot
# bump plugins/<name>/.claude-plugin/plugin.json or write CHANGELOG.md. The
# changelog-parity --check-bump gate correctly requires those (Claude Code
# delivers updates only when the plugin version string changes). This workflow
# supplies the bump on Dependabot PRs and keeps regenerating the miro bundle.
#
# Commit messages include [dependabot skip] so Dependabot may force-push over
# the bot commit when rebasing (GitHub docs: Managing pull requests for
# dependency updates; verified 2026-09-27). The bump is created through the
# GraphQL createCommitOnBranch mutation, not a local git commit and push, so
# GitHub signs the commit and marks it Verified, which a required_signatures
# ruleset accepts. A local commit pushed with GITHUB_TOKEN is unsigned.
# Per the GitHub docs page "Triggering a workflow", events triggered by the
# GITHUB_TOKEN do not create new workflow runs (workflow_dispatch and
# repository_dispatch excepted), and a pull_request opened, synchronize or
# reopened event from a pull request the token created or updated creates runs
# in an approval-required state. CI on the release-bump commit therefore may
# wait for a maintainer to approve the run or for a re-trigger.
#
# Recheck: whether CI starts on the bump commit without approval. If it waits,
# pick a token or trigger that starts it.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - plugins/**

permissions:
  contents: read

concurrency:
  group: dependabot-plugin-release-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  release-for-dependabot:
    # zizmor: ignore[bot-conditions] dependabot-only job; login is read from the PR user, not github.actor
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch base
        uses: ./.github/actions/checkout-with-base # zizmor: ignore[self-repository]
      - name: Switch to PR head
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin "$HEAD_REF":"refs/remotes/origin/$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
      - name: Detect miro server manifest changes
        id: miro
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF"...HEAD | grep -qE '^plugins/miro/server/package(-lock)?\.json$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.miro.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: plugins/miro/server/package-lock.json
      - name: Install and regenerate miro bundle
        if: steps.miro.outputs.changed == 'true'
        working-directory: plugins/miro/server
        run: |
          npm ci
          npm run bundle
          npm run verify-bundle
      - name: Bump plugin manifests and changelogs
        id: bump
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Prefer the base tip's copy of the bump script so a Dependabot branch
          # that has not yet rebased still runs the landed implementation.
          bump_script=scripts/dependabot-plugin-bump.sh
          if git cat-file -e "origin/$BASE_REF:$bump_script" 2>/dev/null; then
            git show "origin/$BASE_REF:$bump_script" > /tmp/dependabot-plugin-bump.sh
            bump_script=/tmp/dependabot-plugin-bump.sh
            chmod +x "$bump_script"
          fi
          bash "$bump_script" "origin/$BASE_REF" --pr "$PR_NUMBER" --title "$PR_TITLE"
      - name: Commit release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git add -u -- plugins
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          # File contents go through stdin and files, never argv, so a large bundle fits.
          adds="$RUNNER_TEMP/additions.jsonl"
          dels="$RUNNER_TEMP/deletions.json"
          payload="$RUNNER_TEMP/payload.json"
          : >"$adds"
          while IFS= read -r -d '' path; do
            git show ":$path" | base64 -w0 | jq -Rc --arg path "$path" '{path: $path, contents: .}' >>"$adds"
          done < <(git diff --cached --name-only --diff-filter=AM -z)
          git diff --cached --name-only --diff-filter=D -z |
            jq -Rs 'split("\u0000") | map(select(length > 0) | {path: .})' >"$dels"
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$HEAD_REF" \
            --arg oid "$(git rev-parse HEAD)" \
            --arg headline "chore(plugins): release bump for Dependabot update [dependabot skip]" \
            --slurpfile additions "$adds" \
            --slurpfile deletions "$dels" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: $headline},
                fileChanges: {additions: $additions, deletions: $deletions[0]}
              }}
            }' >"$payload"
          gh api graphql --input - <"$payload" | jq -e '.data.createCommitOnBranch.commit.oid'
