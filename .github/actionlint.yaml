# Self-hosted fleet labels. actionlint validates every `runs-on` value against
# its built-in list of GitHub-hosted labels and fails an unknown one with
# `label "..." is unknown ... [runner-label]`. Phase 4 of the ci-perf program
# (melodic-software/github-iac#378) replaced the governed selector's routed
# expression with the fleet label written literally, so every label the program
# writes has to be declared here or every job naming it fails the lint.
self-hosted-runner:
  labels:
    - melodic-ubuntu-24.04-x64
    - melodic-review-ubuntu-24.04-x64
