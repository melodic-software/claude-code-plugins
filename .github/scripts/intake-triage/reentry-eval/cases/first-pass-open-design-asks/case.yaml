schema_version: "1.1"
name: first-pass-open-design-asks
description: 'A first triage of an issue that lists two primary designs and picks neither: Flags intent, needs-owner-decision, a numbered question with RECOMMENDED and the decision reply line, needs_human false'
tags: [intake, first-pass]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Filled by build-suite.mjs from the ci-workflows reusable."
  allowed_tools: [Read, Grep, Glob]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: flags-intent
    type: regex
    pattern: '(?:^|\\n|\n)Flags: (?:[a-z]+,\s*)*intent\s*(?:,\s*[a-z]+\s*)*(?:\\n|\n|"|$)'
    target: last_message
    arm: both
  - name: applies-needs-decision
    type: regex
    pattern: '"labels"\s*:\s*\[[^\]]*"needs-owner-decision"'
    target: last_message
    arm: both
  - name: asks-with-recommendation
    type: regex
    pattern: 'RECOMMENDED:'
    target: last_message
    arm: both
  - name: ends-with-reply-line
    type: regex
    pattern: 'To answer, post a comment that starts with this line:'
    target: last_message
    arm: both
  - name: keeps-needs-human-false
    type: regex
    pattern: '"needs_human"\s*:\s*false'
    target: last_message
    arm: both
