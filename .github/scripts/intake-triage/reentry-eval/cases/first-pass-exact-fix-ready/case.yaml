schema_version: "1.1"
name: first-pass-exact-fix-ready
description: 'A first triage of an owner-filed, exact, small fix: verdict lines with Flags none, the blast radius and reversibility lines, no hold label, needs_human false'
tags: [intake, first-pass]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Filled by build-suite.mjs from the ci-workflows reusable."
  allowed_tools: [Read, Grep, Glob]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: flags-none
    type: regex
    pattern: '(?:^|\\n|\n)Flags: none(?:\\n|\n|"|$)'
    target: last_message
    arm: both
  - name: writes-blast-radius
    type: regex
    pattern: '(?:^|\\n|\n)Blast radius: \S'
    target: last_message
    arm: both
  - name: writes-reversible
    type: regex
    pattern: '(?:^|\\n|\n)Reversible: (?:yes|partly|no)\b'
    target: last_message
    arm: both
  - name: no-needs-decision
    type: regex
    pattern: '"labels"\s*:\s*\[[^\]]*"needs-owner-decision"'
    match: not_contains
    target: last_message
    arm: both
  - name: keeps-needs-human-false
    type: regex
    pattern: '"needs_human"\s*:\s*false'
    target: last_message
    arm: both
