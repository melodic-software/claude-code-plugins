schema_version: "1.1"
name: unsettled-assumption-asks
description: 'The decision answers both questions but leaves out an undefined set of long-lived branches: triage quotes it, re-parks and asks which branches those are'
tags: [intake, reentry]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Filled by build-suite.mjs from the ci-workflows reusable."
  allowed_tools: [Read, Grep, Glob]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: reads-decision-comment
    type: tool_used
    tool: Read
    input_match: 'comment-1\.md'
    min: 1
    arm: both
  - name: quotes-decision-marker
    type: regex
    pattern: '(?:^|\\n|\n)> \*\*Decision recorded\.\*\*'
    target: last_message
    arm: both
  - name: quotes-decision-verbatim
    type: regex
    pattern: '(?:^|\\n|\n)> 2\. 90 days without a commit\. Leave out the long-lived branches we still use; those are never stale\.'
    target: last_message
    arm: both
  - name: links-decision
    type: regex
    pattern: 'issuecomment-100000002'
    target: last_message
    arm: both
  - name: keeps-needs-human-false
    type: regex
    pattern: '"needs_human"\s*:\s*false'
    target: last_message
    arm: both
  - name: reparks-needs-decision
    type: regex
    pattern: '"labels"\s*:\s*\[[^\]]*"status: needs-decision"'
    target: last_message
    arm: both
  - name: asks-with-recommendation
    type: regex
    pattern: 'RECOMMENDED:'
    target: last_message
    arm: both
  - name: asks-which-long-lived
    type: regex
    pattern: '(?:^|\\n|\n)(?!> )[^\n\\]*long-lived'
    flags: i
    target: last_message
    arm: both
  - name: judges-open-questions
    type: llm
    criteria: 'PASS only if the reply''s comment treats both numbered questions as answered by the quoted decision and asks, as a new numbered question with a RECOMMENDED answer, which branches count as the long-lived ones to leave out, without settling that itself. FAIL if it picks a set of long-lived branches as if decided, re-asks question 1 or 2, or asks nothing.'
    focus: last_message
    arm: both
