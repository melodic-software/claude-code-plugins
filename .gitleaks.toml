# gitleaks: https://github.com/gitleaks/gitleaks
# Config reference: https://github.com/gitleaks/gitleaks#configuration
#
# Root-canonical policy: inherit the upstream default ruleset and add only
# rules that are broadly valid, none repo-specific. Managed consumers do not edit this file. Intentional findings
# use a repository-owned .gitleaksignore or inline `gitleaks:allow` comment.

# Floor the engine version: silences the "no minVersion specified" debug
# warning (v8.29.0+) and pins the feature baseline this config relies on
# (`[extend].useDefault`, `[[allowlists]]`).
minVersion = "v8.25.0"

[extend]
useDefault = true

# GitHub App installation tokens in both formats: the classic `ghs_` + 36
# characters and the stateless `ghs_<appid>_<jwt>`. The default
# `github-app-token` rule stops at the `_` after the app id and the default
# `jwt` rule's `\b` cannot match between `_` and `eyJ`. GitHub's recommended
# regex: https://github.blog/changelog/2026-05-15-github-app-installation-tokens-per-request-override-header/
# The leading `\b` keeps words that end in "ghs" (`highs_and_lows_...`) from matching.
[[rules]]
id = "github-app-installation-token"
description = "GitHub App installation token, classic and stateless (ghs_<appid>_<jwt>) formats"
regex = '''\bghs_[A-Za-z0-9._-]{36,}'''
keywords = ["ghs_"]
