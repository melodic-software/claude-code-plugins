schema_version: "1.1"
name: compress-lint-unscoped-unresolved
context:
  scaffold_script: scaffold.sh
graders:
  - name: edited-target
    type: tool_used
    tool: Edit
    input_match: 'onboarding\.md'
    min: 1
    arm: with-only
  - name: compressed-lint-unresolved
    type: regex
    pattern: '\bcompressed\b[^\n]*\blint\W{1,4}unresolved\b'
    target: last_message
    arm: with-only
  - name: no-shipped-linter
    type: tool_used
    tool: Bash
    input_match: '(?<![.\w])markdownlint'
    min: 0
    max: 0
    arm: both
