schema_version: "1.1"
name: compress-lint-unscoped-exit-status-fails
context:
  scaffold_script: scaffold.sh
graders:
  - name: edited-target
    type: tool_used
    tool: Edit
    input_match: 'onboarding\.md'
    min: 1
    arm: with-only
  - name: reverted-on-exit-status
    type: regex
    pattern: '\breverted\b[^\n]*\blint\W{1,4}FAIL\b'
    target: last_message
    arm: with-only
  - name: no-shipped-linter
    type: tool_used
    tool: Bash
    input_match: '(?<!\.)markdownlint'
    min: 0
    max: 0
    arm: both
