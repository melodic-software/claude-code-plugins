description: "Gap probe for the grounding rule write-for-humans carries since #12098: introduce each concept before a sentence relies on it, or name it as assumed reader knowledge. Edge: the notes say checkpoint one line before they define it and never define collector or tail set, so a README that keeps the notes' order relies on a term before its reader has it. A with-arm fail shows the rule does not yet hold. Probe result: gap shown (Claude Code 2.1.316, main f7dde4f0e4, #12025): with the rule from #12098 loaded, terms-grounded with-arm 0/3 and without-arm 0/3; #12085 tracks the fix"
tags: [write-for-humans, grounding, gap-probe]
runs: 3
expected_outcome: "The fenced README introduces checkpoint, collector and tail set (in a definition, an apposition or a glossary) at or before the first sentence that relies on each, or names a term as knowledge it assumes the reader has; every fact in the notes is kept"
