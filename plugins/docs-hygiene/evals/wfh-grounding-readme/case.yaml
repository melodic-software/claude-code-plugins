schema_version: "1.1"
name: wfh-grounding-readme
description: "Gap probe for a grounding rule write-for-humans does not carry yet: introduce each concept before a sentence relies on it, or name it as assumed reader knowledge. Edge: the notes say checkpoint one line before they define it and never define collector or tail set, so a README that keeps the notes' order relies on a term before its reader has it. Both arms are expected to score alike unless the skill already grounds terms; a with-arm fail is the evidence that would justify adding the rule"
tags: [write-for-humans, grounding, gap-probe]
runs: 3
expected_outcome: "The fenced README introduces checkpoint, collector and tail set (in a definition, an apposition or a glossary) at or before the first sentence that relies on each, or names a term as knowledge it assumes the reader has; every fact in the notes is kept"
