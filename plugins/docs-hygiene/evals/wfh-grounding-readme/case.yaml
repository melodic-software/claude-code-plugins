schema_version: "1.1"
name: wfh-grounding-readme
description: "Gap probe for the grounding rule write-for-humans carries since #12098: introduce each concept before a sentence relies on it, or name it as assumed reader knowledge. Edge: the notes say checkpoint one line before they define it and never define collector or tail set, so a README that keeps the notes' order relies on a term before its reader has it. A with-arm fail shows the rule does not yet hold. Probe result: gap shown (Claude Code 2.1.316, main f7dde4f0e4, #12025): with the rule from #12098 loaded, terms-grounded with-arm 0/3 and without-arm 0/3; #12085 tracks the fix. terms-grounded is a regex, the skill's own test (SKILL.md: the definition goes in the first sentence that uses the term or an earlier one, never the next): the first prose sentence using each term (headings are not sentences) must gloss it right after the term (colon, parenthesis, dash, apposition with the/a/which/meaning, is/are a/the, means), label it ((the collector), is the checkpoint), or define or assume it before the term (assumes, called, named, known as, makes up, forms). The LLM judge it replaces split on the same one-sentence-late opening (#12085, 2026-11-02 19:30Z)"
tags: [write-for-humans, grounding, gap-probe]
runs: 3
expected_outcome: "The fenced README introduces checkpoint, collector and tail set (in a definition, an apposition or a glossary) in or before the first sentence that uses each, or names a term as knowledge it assumes the reader has; every fact in the notes is kept"
