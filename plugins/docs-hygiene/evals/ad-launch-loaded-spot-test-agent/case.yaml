schema_version: "1.1"
name: ad-launch-loaded-spot-test-agent
context:
  scaffold_script: scaffold.sh
graders:
  - name: spot-test-on-clean-agent
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:Explore|Plan|(?:docs-hygiene:)?derivability-spot-tester)"'
    min: 1
  - name: no-spot-test-on-loaded-agent
    type: tool_used
    tool: Agent
    input_match: '^(?!.*"subagent_type"\s*:\s*"(?:Explore|Plan|(?:docs-hygiene:)?derivability-spot-tester)")'
    min: 0
    max: 0
