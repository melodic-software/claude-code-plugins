schema_version: "1.1"
name: compress-lint-fails-on-other-file
context:
  scaffold_script: scaffold.sh
graders:
  - name: edited-target
    type: tool_used
    tool: Edit
    input_match: 'onboarding\.md'
    min: 1
    arm: with-only
  - name: ran-repo-lint
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|&(`]|(?<!\\\\)\\n|\b(?:bash|zsh|dash|sh)(?:\s|\\t|\\\\(?:\\r)?\\n)+(?:-\S+(?:\s|\\t|\\\\(?:\\r)?\\n)+)*?-\w*c(?:\s|\\t|\\\\(?:\\r)?\\n)+(?:\\"|\x27)))?(?:\s|\\t|\\\\(?:\\r)?\\n)*(?:(?:if|elif|while|until|then|do|else|!|\{)(?:\s|\\t|\\\\(?:\\r)?\\n)+)*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s"\\;&|()]*(?:\s|\\t|\\\\(?:\\r)?\\n)+)*(?:(?:[^\s"\\;&|()]*/)?(?:sudo|npx|exec|time|env|nohup|command|xargs|timeout|nice|stdbuf)(?:\s|\\t|\\\\(?:\\r)?\\n)+(?:(?:-\S+(?:(?:\s|\\t|\\\\(?:\\r)?\\n)+[^-\s"\\;&|()]\S*)?|\d\S*)(?:\s|\\t|\\\\(?:\\r)?\\n)+)*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s"\\;&|()]*(?:\s|\\t|\\\\(?:\\r)?\\n)+)*)?(?:[^\s"\\;&|()]*/)?(?:(?:npm|pnpm|yarn)\s+(?:run(?:-script)?\s+)?lint:md\b|(?:(?:bash|sh)\s+(?:[^\s"\\;&|()]*/)?)?lint-md\.sh\b)'
    min: 1
    arm: with-only
  - name: shipped-with-lint-pass
    type: regex
    pattern: '\bcompressed\b[^\n]*\blint\W{1,4}PASS\b'
    target: last_message
    arm: with-only
  - name: no-shipped-linter
    type: tool_used
    tool: Bash
    input_match: 'markdownlint'
    min: 0
    max: 0
    arm: both
