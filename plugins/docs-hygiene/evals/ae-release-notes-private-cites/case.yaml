schema_version: "1.1"
name: ae-release-notes-private-cites
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:docs-hygiene:)?audit-encapsulation"'
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: names-reference-cite
    type: regex
    pattern: 'reference/changelog-format\.md'
    arm: both
  - name: names-anchor-cite
    type: regex
    pattern: '#version-bump-rules'
    arm: both
