schema_version: "1.1"
name: 'setup-check-surfaces-the-silent-git-dependency'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'status-table'
    type: 'regex'
    pattern: '^[ \t]*\|?[ \t]*:?-+:?[ \t]*\|(?=[\s\S]*?^(?=[^\n]*\|)(?=[^\n]*?(?:^|\|)[^|\n]*?\bjq\b(?![\w.\-/])[^|\n]*(?:\||$))[^\n]*?(?:\b(?:PASS|FAIL|INFO|WARN|Pass|Fail|Info|Warn)\b|✅|❌|⚠))(?=[\s\S]*?^(?=[^\n]*\|)(?=[^\n]*?(?:^|\|)[^|\n]*?\b[Gg]it\b(?![\w.\-/]|\s+(?:[Rr]epo|check-attr|root|work))[^|\n]*(?:\||$))[^\n]*?(?:\b(?:PASS|FAIL|INFO|WARN|Pass|Fail|Info|Warn)\b|✅|❌|⚠))(?=[\s\S]*?^(?=[^\n]*\|)(?=[^\n]*?(?:^|\|)[^|\n]*?\b[Nn]ode(?:\.js)?(?![\w.\-/])[^|\n]*(?:\||$))[^\n]*?(?:\b(?:PASS|FAIL|INFO|WARN|Pass|Fail|Info|Warn)\b|✅|❌|⚠))'
    flags: 'm'
    target: 'last_message'
  - name: 'git-only-visibility'
    type: 'llm'
    criteria: 'The reply says a missing git produces no notice of any kind (git check-attr fails silently and the hook does nothing), so this check is the only place a missing git shows up.'
    focus: 'last_message'
  - name: 'plugin-installed-registration'
    type: 'regex'
    pattern: '/plugin(?![\w:/-])[^\n]*\b(?:Installed|installed)\b|\b(?:Installed|installed)\b[^\n]*/plugin(?![\w:/-])'
    target: 'last_message'
  - name: 'read-sourced-library'
    type: 'tool_used'
    tool: 'Read'
    input_match: 'normalize-eol\.sh'
    arm: 'with-only'
  - name: 'no-settings-read'
    type: 'tool_used'
    tool: 'Read'
    input_match: 'settings(?:\.local)?\.json'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
