schema_version: "1.1"
name: 'setup-no-eol-rule-is-the-opt-out-not-a-defect'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'inert-by-design-info'
    type: 'llm'
    criteria: 'The reply says the plugin is not broken: with no eol=lf or eol=crlf rule in the repository''s .gitattributes the hook is inert by design, and the check reports that as INFO, not FAIL, because the repository''s own .gitattributes is the whole opt-in.'
    focus: 'last_message'
  - name: 'distinguishes-not-a-repo'
    type: 'llm'
    criteria: 'The reply separates this case from the other non-failure case: git present but the path not inside a git repository, which is not applicable (nothing to normalize against) rather than a repository with no eol rule.'
    focus: 'last_message'
  - name: 'no-repair-offer'
    type: 'llm'
    criteria: 'The reply does not offer to add an eol rule or write .gitattributes on the user''s behalf. Pointing the user at their own .gitattributes as the place to declare a policy is allowed.'
    focus: 'last_message'
  - name: 'ran-check-attr'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|&(`]|(?<!\\\\)\\n|\b(?:bash|zsh|dash|sh)(?:\s|\\t|\\\\(?:\\r)?\\n)+(?:-\S+(?:\s|\\t|\\\\(?:\\r)?\\n)+)*?-\w*c(?:\s|\\t|\\\\(?:\\r)?\\n)+(?:\\"|\x27)))?(?:\s|\\t|\\\\(?:\\r)?\\n)*(?:(?:if|elif|while|until|then|do|else|!|\{)(?:\s|\\t|\\\\(?:\\r)?\\n)+)*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s"\\;&|()]*(?:\s|\\t|\\\\(?:\\r)?\\n)+)*(?:(?:[^\s"\\;&|()]*/)?(?:sudo|npx|exec|time|env|nohup|command|xargs|timeout|nice|stdbuf)(?:\s|\\t|\\\\(?:\\r)?\\n)+(?:(?:-\S+(?:(?:\s|\\t|\\\\(?:\\r)?\\n)+[^-\s"\\;&|()]\S*)?|\d\S*)(?:\s|\\t|\\\\(?:\\r)?\\n)+)*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s"\\;&|()]*(?:\s|\\t|\\\\(?:\\r)?\\n)+)*)?(?:[^\s"\\;&|()]*/)?git(?:\.exe)?(?![\w.\-/])(?:\\\\(?:\\r)?\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?\bcheck-attr\b'
    arm: 'both'
  - name: 'no-gitattributes-created'
    type: 'file_exists'
    path: '**/.gitattributes'
    exists: false
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
