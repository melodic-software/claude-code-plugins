schema_version: "1.1"
name: au-diff-run-reports-and-stops
description: 'Legacy audit 1, 10. phase0-snapshot, baseline-run and triage-dispatched grade the run''s steps, no-findings-file the report-and-stop default; legacy-audit-1 and legacy-audit-10 (llm) quote the legacy expectations. Needs --scaffold --allow-tools Bash Agent.'
tags: [audit, scaffold, no-network, legacy]
runs: 3
expected_outcome: 'A Phase 0 snapshot and baseline, one mutant per changed line, fresh-context triage, a per-file report, and no findings file or memory-tier write; tracked source restored.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Run mutation testing on my changes with /mutation-testing:audit.'
  allowed_tools: [Skill, Bash, Read, Glob, Grep, Agent]
  max_turns: 60
  timeout_seconds: 1500
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'phase0-snapshot'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'git status --porcelain'
  - name: 'baseline-run'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '-m\s+unittest\b'
  - name: 'triage-dispatched'
    type: 'tool_used'
    tool: 'Agent'
    input_match: '.'
  - name: 'no-findings-file'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'mutation-survivors|\.work/reviews'
    min: 0
    max: 0
    arm: 'both'
  - name: 'legacy-audit-1'
    type: 'llm'
    criteria: 'The run is /mutation-testing:audit on a scaffolded repository, asked: “Run mutation testing on my changes with /mutation-testing:audit.”. It meets the legacy expectation: "Preflights (config resolved across its layers with the contributing layer of each value named, tool available, tree clean in targets, baseline suite green with wall-clock recorded, the `git status --porcelain` Phase 0 snapshot captured, and the tool''s write regime resolved from the project''s config), scopes to changed lines vs the configured diff-target, applies the arid suppression record, selects covering tests ONCE and caches the selection, reports the planned scope and estimated cost before running, generates at most one mutant per changed line, executes with guaranteed revert and verifies restoration against the Phase 0 snapshot at the earliest point the resolved regime permits, delegates survivor triage to a fresh-context subagent, and reports per file ranked by oracle gap. Writes no tests, and either leaves tracked source byte-identical or ends in failure naming what it could not restore."'
    focus: 'trace'
  - name: 'legacy-audit-10'
    type: 'llm'
    criteria: 'The run is /mutation-testing:audit on a scaffolded repository, asked: “Run mutation testing on my changes with /mutation-testing:audit.”. It meets the legacy expectation: "Runs Phases 0-5 and stops. Persists no findings file: the flag is opt-in and bare invocation is report-and-stop. Leaves `git status --porcelain` matching the Phase 0 snapshot with no memory-tier write at all."'
    focus: 'trace'
