schema_version: "1.1"
name: au-rank-by-oracle-gap
description: 'Legacy audit 7. gap-formula grades the formula''s direction, most-negative-first (llm) the order; legacy-audit-7 (llm) quotes the legacy expectation. Needs --allow-tools Bash.'
tags: [audit, no-network, legacy]
runs: 3
expected_outcome: 'Rank by oracle gap, mutation score minus code coverage, ascending, most negative first, as metrics.md defines it.'
execution:
  prompt: 'Which files should I fix first, going by the /mutation-testing:audit report?'
  allowed_tools: [Skill, Bash, Read, Glob, Grep]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'gap-formula'
    type: 'regex'
    pattern: 'mutation score\s*(?:[-−]|minus)\s*(?:code\s+)?coverage'
    flags: 'i'
    target: 'last_message'
  - name: 'most-negative-first'
    type: 'llm'
    criteria: 'PASS only if the reply ranks files by oracle gap ascending, most negative first, and says a file with high coverage and a low score (for example 95% coverage, 45% score) is the one misleading the reader. FAIL if it ranks by lowest score or lowest coverage alone, or puts the largest positive gap first.'
    focus: 'last_message'
  - name: 'legacy-audit-7'
    type: 'llm'
    criteria: 'The run is a question about /mutation-testing:audit asked with no repository to run on: “Which files should I fix first, going by the /mutation-testing:audit report?”. It meets the legacy expectation: "Ranks by oracle gap as defined once in principles/reference/metrics.md -- `mutation score - code coverage` -- ascending, most negative first, because a large negative gap is the exercised-but-not-checked direction. Does not restate or invert the formula. Explains that the top row is where the reader''s belief about the suite is most wrong, and that a file at 30% coverage and 30% score has an honest problem already visible in a coverage report while a file at 95% coverage and 45% score is the one lying to them."'
    focus: 'last_message'
