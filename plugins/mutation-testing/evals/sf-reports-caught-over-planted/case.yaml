schema_version: "1.1"
name: sf-reports-caught-over-planted
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:seed-faults"'
  - name: 'worktree-attempted'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'git(?:\s+-C\s+\S+)?\s+worktree\s+add\b'
    min: 1
    arm: 'both'
  - name: 'no-commit'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'git(?:\s+-C\s+\S+)?\s+commit\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'tests-not-edited'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path"\s*:\s*"[^"]*/tests/'
    min: 0
    max: 0
    arm: 'both'
  - name: 'source-restored'
    type: 'regex'
    pattern: 'if weight_kg >= 20:\n        return 0\n    return 4\n\n\ndef apply_discount\(total, code\):\n    if code == "SAVE10" and total >= 50:\n        return round\(total \* 0\.9, 2\)\n    return total\n\n\ndef parse_quantity\(text\):\n    value = int\(text\.strip\(\)\)\n    if value < 1:'
    target: { source: file, path: src/pricing.py }
  - name: 'reports-ratio'
    type: 'regex'
    pattern: '\b[0-3]\**\s*(?:/|of|out of)\s*(?:the\s+)?3\b'
    flags: 'i'
    target: 'last_message'
  - name: 'names-survivor-line'
    type: 'regex'
    pattern: '\bpricing\.py:\d+'
    target: 'last_message'
  - name: 'says-estimate'
    type: 'regex'
    pattern: '\bestimat\w*'
    flags: 'i'
    target: 'last_message'
