schema_version: "1.1"
name: au-persist-nothing-survived
description: 'Legacy audit 12. One llm grader per question asked; legacy-audit-12 (llm) quotes the legacy expectation. Needs --allow-tools Bash.'
tags: [audit, no-network, legacy]
runs: 3
expected_outcome: 'Yes when a mutant was examined (a file with the header row and the Surfaces line), nothing when none was; the audit stays read-only for tracked source, writing only to a memory tier proven outside tracked space.'
execution:
  prompt: 'Using /mutation-testing:audit: I ran it with --persist-findings and nothing survived. Did it write a file? And does this still count as a read-only audit?'
  allowed_tools: [Skill, Bash, Read, Glob, Grep]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'file-iff-examined'
    type: 'llm'
    criteria: 'PASS only if the reply says the file is written, with no data rows, when at least one mutant was examined, and nothing is written when no mutant was examined. FAIL if it says nothing is written whenever nothing survived, or that a file is always written.'
    focus: 'last_message'
  - name: 'read-only-tracked-source'
    type: 'llm'
    criteria: 'PASS only if the reply says the audit is still read-only with respect to tracked source, which stays byte-identical, because the opt-in write lands outside tracked space. FAIL if it says the run is no longer read-only or that the write may land in tracked space.'
    focus: 'last_message'
  - name: 'legacy-audit-12'
    type: 'llm'
    criteria: 'The run is a question about /mutation-testing:audit asked with no repository to run on: “Using /mutation-testing:audit: I ran it with --persist-findings and nothing survived. Did it write a file? And does this still count as a read-only audit?”. It meets the legacy expectation: "Answers both. (1) Yes, if at least one mutant was examined: the file is written with the `## Findings` header row and no data rows, because the payload is the `## Surfaces` line and the consumer unions `## Surfaces` across producers -- a surface that ran and returned nothing is coverage information a silent run destroys. If NO mutant was examined (empty scope, everything dropped by coverage/suppression/cap, or a Phase 0 refusal) it writes nothing, because claiming the surface ran would fabricate coverage never attempted. (2) Yes: the invariant is read-only with respect to TRACKED SOURCE, which stays byte-identical; the opt-in writes land in a memory tier proven to sit outside tracked space and are the explicit user override the naming doctrine''s verb table already sanctions. If the destination cannot be PROVEN outside tracked space -- the probe reports it tracked, the probe could not evaluate the path, the self-ignore guard could not be established, or the resolved root is invalid -- it does not write, and reports which of those it was rather than collapsing them."'
    focus: 'last_message'
