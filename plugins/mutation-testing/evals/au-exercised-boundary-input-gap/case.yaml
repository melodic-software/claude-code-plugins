schema_version: "1.1"
name: au-exercised-boundary-input-gap
description: 'Legacy audit boundary. line-8-only (llm) grades the one survivor and its cause; legacy-audit-boundary (llm) quotes the legacy expectation. Needs --scaffold --allow-tools Bash Agent.'
plugins: ["../..", "testing-stub"]
tags: [audit, scaffold, no-network, legacy]
runs: 3
expected_outcome: 'The line 8 removal survives as productive with cause input-gap; lines 7, 9 and 10 are killed; exercised scope line, coverage and gap unknown, blind-spot line.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Run /mutation-testing:audit --exercised. app.py and docs/conventions/mutation-testing.yaml are committed on main; this branch adds scenarios/boundary/test_app.py, which asserts price_with_tax(50) == 60.0.'
  allowed_tools: [Skill, Bash, Read, Glob, Grep, Agent]
  max_turns: 80
  timeout_seconds: 1800
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'testing-audit-called'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"testing:audit"'
  - name: 'baseline-run'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '-m\s+unittest\b'
  - name: 'scope-line'
    type: 'regex'
    pattern: 'Scope[*_`]*:[*_`\s]*exercised,\s*(?:the )?changed tests\b[^\n]{0,120}?as one set'
    flags: 'i'
    target: 'last_message'
  - name: 'cause-input-gap'
    type: 'regex'
    pattern: '\binput[- ]gap\b'
    flags: 'i'
    target: 'last_message'
  - name: 'coverage-gap-unknown'
    type: 'regex'
    pattern: '\b(?:coverage|gap)\b[^\n]{0,60}\bunknown\b|\|\s*`?unknown`?\s*\|'
    flags: 'i'
    target: 'last_message'
  - name: 'blind-spot-line'
    type: 'regex'
    pattern: 'testing/judge/rule-restated-expectation'
    flags: 'i'
    target: 'last_message'
  - name: 'line-8-only'
    type: 'llm'
    criteria: 'PASS only if the report says the statement removal on app.py line 8 (the discount line) survived with cause input-gap because no input is above the threshold, and the mutants on lines 9 and 10 were killed. Line 7 is killed when its comparison is inverted to <=; a run that shifts it to >= instead may report it as a second input-gap survivor, which also passes. FAIL if line 8 is labeled no-assertion, or line 9 or 10 is reported surviving.'
    focus: 'last_message'
  - name: 'legacy-audit-boundary'
    type: 'llm'
    criteria: 'The run is /mutation-testing:audit on a scaffolded repository, asked: “Run /mutation-testing:audit --exercised. app.py and docs/conventions/mutation-testing.yaml are committed on main; this branch adds scenarios/boundary/test_app.py, which asserts price_with_tax(50) == 60.0.”. It meets the legacy expectation: "Maps the test to price_with_tax and runs each mutant against that test alone under the manual protocol. The statement removal on line 8, the discount line, survives and is classed productive with cause `input-gap`: the assertion is an independent literal, quoted with its input 50, and no input is above the threshold of 100, so the discount line never runs; an unreached mutated line is `input-gap`, not `no-assertion`, because an assertion reaches the value. The line 7 comparison inversion (`>` to `<=`) applies the discount at 50 and is killed, as are the removals on lines 9 and 10. The report carries the exercised scope line, coverage and gap as `unknown`, and the blind-spot line naming testing/judge/rule-restated-expectation."'
    focus: 'trace'
