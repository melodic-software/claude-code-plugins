schema_version: "1.1"
name: au-record-replay-lost-kill
description: 'Legacy audit record_replay_lost_kill. One grader per newly surviving line (7, 9, 10) and one that line 8 is not; runs-compare-records (with-only), the two record files, K0/K1 and the Gate line; legacy-audit-record_replay_lost_kill (llm) quotes the legacy expectation. Needs --scaffold --allow-tools Bash Agent Edit.'
plugins: ["../..", "testing-stub"]
tags: [audit, scaffold, no-network, legacy]
runs: 3
expected_outcome: 'The recording reports Record: .work/before.tsv, 4 mutants, K0 3; after the assertion is deleted the replay applies those four rows, runs compare-records.sh and reports K0 3  K1 0, Gate: block, and newly-surviving lines for app.py 7, 9 and 10, not 8.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Run /mutation-testing:audit --exercised scenarios/boundary --record-mutants .work/before.tsv. Then delete the assertEqual line from scenarios/boundary/test_app.py, leaving the test calling price_with_tax(50) with no assertion, and run /mutation-testing:audit --exercised scenarios/boundary --replay-mutants .work/before.tsv --record-mutants .work/after.tsv.'
  allowed_tools: [Skill, Bash, Read, Glob, Grep, Agent, Edit]
  max_turns: 150
  timeout_seconds: 3000
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'runs-compare-records'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'compare-records\.sh'
    arm: 'with-only'
  - name: 'before-record'
    type: 'file_exists'
    path: '.work/before.tsv'
  - name: 'after-record'
    type: 'file_exists'
    path: '.work/after.tsv'
  - name: 'k0-3-k1-0'
    type: 'regex'
    pattern: 'K0\s*3\s+K1\s*0'
    flags: 'i'
    target: 'last_message'
  - name: 'gate-block'
    type: 'regex'
    pattern: 'Gate[*_`]*:[*_`\s]*block'
    flags: 'i'
    target: 'last_message'
  - name: 'newly-surviving-7'
    type: 'regex'
    pattern: 'newly-surviving\s+`?app\.py:7`?\s+`?comparison-inversion'
    flags: 'i'
    target: 'last_message'
  - name: 'newly-surviving-9'
    type: 'regex'
    pattern: 'newly-surviving\s+`?app\.py:9`?\s+`?statement-removal'
    flags: 'i'
    target: 'last_message'
  - name: 'newly-surviving-10'
    type: 'regex'
    pattern: 'newly-surviving\s+`?app\.py:10`?\s+`?statement-removal'
    flags: 'i'
    target: 'last_message'
  - name: 'line-8-not-newly'
    type: 'regex'
    pattern: 'newly-surviving\s+`?app\.py:8\b'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'legacy-audit-record_replay_lost_kill'
    type: 'llm'
    criteria: 'The run is /mutation-testing:audit on a scaffolded repository, asked: “Run /mutation-testing:audit --exercised scenarios/boundary --record-mutants .work/before.tsv. Then delete the assertEqual line from scenarios/boundary/test_app.py, leaving the test calling price_with_tax(50) with no assertion, and run /mutation-testing:audit --exercised scenarios/boundary --replay-mutants .work/before.tsv --record-mutants .work/after.tsv.”. It meets the legacy expectation: "The recording run uses the manual protocol with test-command, writes .work/before.tsv after restoration is verified (first line the HEAD sha, one row per mutant for app.py lines 7-10), and reports `Record: .work/before.tsv, 4 mutants, K0 3`. The replay applies exactly those four rows, with no mapping and no regeneration, writes .work/after.tsv, and runs compare-records.sh. The report shows `K0 3  K1 0`, `Gate: block`, and one newly-surviving line each for app.py:7 comparison-inversion, app.py:9 statement-removal and app.py:10 statement-removal. Line 8 survived both runs and is not newly surviving. app.py is byte-identical at the end."'
    focus: 'trace'
