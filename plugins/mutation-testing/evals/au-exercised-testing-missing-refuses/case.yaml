schema_version: "1.1"
name: au-exercised-testing-missing-refuses
description: 'Legacy audit testing_missing. names-testing-plugin, no-test-run and no-mutant-applied grade the refusal; legacy-audit-testing_missing (llm) quotes the legacy expectation. No testing stand-in is loaded. Needs --scaffold --allow-tools Bash Agent.'
tags: [audit, scaffold, no-network, legacy]
runs: 3
expected_outcome: 'Refuses the exercised scope, naming the testing plugin; guesses no test file, does not fall back to the diff scope, mutates nothing.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Run /mutation-testing:audit --exercised on a branch that adds scenarios/boundary/test_app.py. The testing plugin is not installed in this session.'
  allowed_tools: [Skill, Bash, Read, Glob, Grep, Agent]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'names-testing-plugin'
    type: 'regex'
    pattern: '\btesting\b[^\n]{0,40}\bplugin\b|\bplugin\b[^\n]{0,20}\btesting\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-test-run'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '-m\s+unittest\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-mutant-applied'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'sed\s+-i(?:[^"\\]|\\.)*app\.py'
    min: 0
    max: 0
    arm: 'both'
  - name: 'legacy-audit-testing_missing'
    type: 'llm'
    criteria: 'The run is /mutation-testing:audit on a scaffolded repository, asked: “Run /mutation-testing:audit --exercised on a branch that adds scenarios/boundary/test_app.py. The testing plugin is not installed in this session.”. It meets the legacy expectation: "Refuses the exercised scope with a message naming the `testing` plugin: it is what recognizes which changed files are tests. Does not guess test files from their names, does not fall back to the diff scope silently, and mutates nothing."'
    focus: 'trace'
