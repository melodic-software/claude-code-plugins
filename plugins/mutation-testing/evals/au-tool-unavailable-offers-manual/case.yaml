schema_version: "1.1"
name: au-tool-unavailable-offers-manual
description: 'Legacy audit tool_unavailable. names-install-command, offers-manual and no-install grade the offer; legacy-audit-tool_unavailable (llm) quotes the legacy expectation. The unattended clause is not exercised. Needs --scaffold --allow-tools Bash Agent.'
tags: [audit, scaffold, no-network, legacy]
runs: 3
expected_outcome: 'Names the Stryker.NET install command and offers to continue with tool: manual; installs nothing unasked.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Run mutation testing on my branch with /mutation-testing:audit. The config says `tool: stryker-net`, but dotnet-stryker is not installed.'
  allowed_tools: [Skill, Bash, Read, Glob, Grep, Agent]
  max_turns: 60
  timeout_seconds: 1500
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'names-install-command'
    type: 'regex'
    pattern: 'dotnet tool install[^\n]{0,80}dotnet-stryker'
    flags: 'i'
    target: 'last_message'
  - name: 'offers-manual'
    type: 'regex'
    pattern: '\bmanual\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-install'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'dotnet\s+tool\s+(?:install|update)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'legacy-audit-tool_unavailable'
    type: 'llm'
    criteria: 'The run is /mutation-testing:audit on a scaffolded repository, asked: “Run mutation testing on my branch with /mutation-testing:audit. The config says `tool: stryker-net`, but dotnet-stryker is not installed.”. It meets the legacy expectation: "Does not refuse outright. Names the install command for Stryker.NET, as /mutation-testing:setup check would, and offers to continue this run with `tool: manual`. Refuses only when the user declines both. Does not install the tool unasked. Running unattended, it stops with the install command and the manual offer rather than switching tools on its own."'
    focus: 'trace'
