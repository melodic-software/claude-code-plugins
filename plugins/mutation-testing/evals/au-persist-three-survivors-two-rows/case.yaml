schema_version: "1.1"
name: au-persist-three-survivors-two-rows
description: 'Legacy audit 11. exactly-two-rows (llm) grades the row set and no-confidence-low the forbidden value; legacy-audit-11 (llm) quotes the legacy expectation. Needs --allow-tools Bash.'
tags: [audit, no-network, legacy]
runs: 3
expected_outcome: 'Exactly two rows, both IMPORTANT with Confidence high (the productive and the undemonstrated-equivalence survivor); no row for the demonstrated arid survivor, which the Phase 5 report still shows; never Confidence low.'
execution:
  prompt: 'Using /mutation-testing:audit: Three mutants survived with --persist-findings on: one productive, one arid with a complete proposed suppression entry whose claim names a node kind from the vocabulary and whose reason names the specific behavior the suite leaves unasserted, one you called equivalent but could not demonstrate. What lands in the file?'
  allowed_tools: [Skill, Bash, Read, Glob, Grep]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'exactly-two-rows'
    type: 'llm'
    criteria: 'PASS only if the reply says the findings file gets exactly two rows, the productive survivor and the survivor whose equivalence was not demonstrated, both IMPORTANT, and no row for the arid survivor that has a complete suppression entry. FAIL if it emits three rows, drops the undemonstrated-equivalence survivor, or ranks it below productive.'
    focus: 'last_message'
  - name: 'no-confidence-low'
    type: 'regex'
    pattern: 'Confidence[*_`|:\s]*low\b|\|\s*(?:CRITICAL|IMPORTANT|MINOR|SUGGESTION)\s*\|\s*low\s*\|'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'legacy-audit-11'
    type: 'llm'
    criteria: 'The run is a question about /mutation-testing:audit asked with no repository to run on: “Using /mutation-testing:audit: Three mutants survived with --persist-findings on: one productive, one arid with a complete proposed suppression entry whose claim names a node kind from the vocabulary and whose reason names the specific behavior the suite leaves unasserted, one you called equivalent but could not demonstrate. What lands in the file?”. It meets the legacy expectation: "Emits exactly two rows -- the productive survivor and the undemonstrated-equivalence survivor, both IMPORTANT, both `Confidence: high`. Names the class-keyed map as the source of the tier and does not re-derive severity from the finding''s wording. Explains that productive is IMPORTANT rather than CRITICAL because a survivor proves the suite is blind, not that the source produces a wrong result, and that the unclassified survivor ranks WITH productive rather than below it so an undemonstrated equivalence claim cannot bury a real gap. Emits NO row for the DEMONSTRATED arid survivor, because its only remediation is a suppression entry the user must accept and handing that to an apply relay would launder the consent gate -- while still showing it to the human in the Phase 5 report; an aridity claim with no complete proposed suppression entry binding a node kind is unclassified instead and emits. Never emits `Confidence: low`: a detector''s `Confidence` is `high` or omitted."'
    focus: 'last_message'
