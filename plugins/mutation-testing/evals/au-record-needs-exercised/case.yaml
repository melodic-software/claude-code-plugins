schema_version: "1.1"
name: au-record-needs-exercised
description: 'Legacy audit record_needs_exercised. names-both-flags, no-mutant-applied, no-test-run and no-record-written grade the refusal; legacy-audit-record_needs_exercised (llm) quotes the legacy expectation. Needs --scaffold --allow-tools Bash Agent.'
tags: [audit, scaffold, no-network, legacy]
runs: 3
expected_outcome: 'Refuses before any mutant, naming --record-mutants and --paths; writes no record.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Run /mutation-testing:audit --paths app.py --record-mutants .work/before.tsv on this repo.'
  allowed_tools: [Skill, Bash, Read, Glob, Grep, Agent]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'names-both-flags'
    type: 'regex'
    pattern: '--record-mutants[\s\S]{0,300}--paths|--paths[\s\S]{0,300}--record-mutants'
    flags: 'i'
    target: 'last_message'
  - name: 'no-mutant-applied'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'sed\s+-i[^"]*app\.py'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-test-run'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '-m\s+unittest\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-record-written'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '>\s*\.work/before\.tsv|tee[^"]*before\.tsv'
    min: 0
    max: 0
    arm: 'both'
  - name: 'legacy-audit-record_needs_exercised'
    type: 'llm'
    criteria: 'The run is /mutation-testing:audit on a scaffolded repository, asked: “Run /mutation-testing:audit --paths app.py --record-mutants .work/before.tsv on this repo.”. It meets the legacy expectation: "Refuses before generating any mutant, naming `--record-mutants` and `--paths`: a record is defined over the exercised scope''s mapped-line set, so it runs only with `--exercised`. Writes no record and mutates nothing."'
    focus: 'trace'
