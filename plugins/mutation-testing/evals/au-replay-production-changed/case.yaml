schema_version: "1.1"
name: au-replay-production-changed
description: 'Legacy audit replay_production_changed. names-app-py, no-gate-line, no-mutant-applied and no-after-record grade the refusal; legacy-audit-replay_production_changed (llm) quotes the legacy expectation. The scaffold writes the before record at the boundary commit, then commits the line 9 change. Needs --scaffold --allow-tools Bash Agent.'
plugins: ["../..", "testing-stub"]
tags: [audit, scaffold, no-network, legacy]
runs: 3
expected_outcome: 'Refuses in Phase 0 before any mutant: app.py differs from the recorded sha and line 9''s recorded text no longer matches; names app.py; no after record and no Gate line.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'A record .work/before.tsv was taken over scenarios/boundary at the previous commit. Since then app.py line 9 was changed to multiply by 1.25. Run /mutation-testing:audit --exercised scenarios/boundary --replay-mutants .work/before.tsv --record-mutants .work/after.tsv.'
  allowed_tools: [Skill, Bash, Read, Glob, Grep, Agent]
  max_turns: 60
  timeout_seconds: 1200
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'names-app-py'
    type: 'regex'
    pattern: '\bapp\.py\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-gate-line'
    type: 'regex'
    pattern: 'Gate[*_`]*:[*_`\s]*(?:block|pass)'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'no-mutant-applied'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'sed\s+-i[^"]*app\.py'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-after-record'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '>\s*\.work/after\.tsv|tee[^"]*after\.tsv'
    min: 0
    max: 0
    arm: 'both'
  - name: 'legacy-audit-replay_production_changed'
    type: 'llm'
    criteria: 'The run is /mutation-testing:audit on a scaffolded repository, asked: “A record .work/before.tsv was taken over scenarios/boundary at the previous commit. Since then app.py line 9 was changed to multiply by 1.25. Run /mutation-testing:audit --exercised scenarios/boundary --replay-mutants .work/before.tsv --record-mutants .work/after.tsv.”. It meets the legacy expectation: "Refuses in Phase 0 before applying any mutant: app.py differs from the recorded sha (`git diff --quiet <sha> -- app.py` fails) and the recorded original text of line 9 no longer matches. Names the changed path. Writes no after record and reports no Gate line, because a replay over different production code compares different mutants."'
    focus: 'trace'
