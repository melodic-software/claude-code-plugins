schema_version: "1.1"
name: au-exercised-test-path
description: 'Legacy audit exercised_path. scope-line grades the test-path reading, cause-input-gap the survivor; legacy-audit-exercised_path (llm) quotes the legacy expectation. Needs --scaffold --allow-tools Bash Agent.'
plugins: ["../..", "testing-stub"]
tags: [audit, scaffold, no-network, legacy]
runs: 3
expected_outcome: 'scenarios/boundary is the test path; the mapping starts from it; one baseline; the line 8 input-gap survivor; Scope: exercised, tests under scenarios/boundary as one set.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Run /mutation-testing:audit --exercised scenarios/boundary on this repo. No test changed on this branch.'
  allowed_tools: [Skill, Bash, Read, Glob, Grep, Agent]
  max_turns: 80
  timeout_seconds: 1800
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'testing-audit-called'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"testing:audit"'
  - name: 'baseline-run'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '-m\s+unittest\b'
  - name: 'scope-line'
    type: 'regex'
    pattern: 'Scope[*_`]*:[*_`\s]*exercised,\s*tests under `?scenarios/boundary`? as one set'
    flags: 'i'
    target: 'last_message'
  - name: 'cause-input-gap'
    type: 'regex'
    pattern: '\binput[- ]gap\b'
    flags: 'i'
    target: 'last_message'
  - name: 'legacy-audit-exercised_path'
    type: 'llm'
    criteria: 'The run is /mutation-testing:audit on a scaffolded repository, asked: “Run /mutation-testing:audit --exercised scenarios/boundary on this repo. No test changed on this branch.”. It meets the legacy expectation: "Takes scenarios/boundary as the test path, not as a scope path, because it comes right after the flag. Starts the mapping from the tests under that folder instead of the changed tests, so the empty diff does not end the run. Maps scenarios/boundary/test_app.py to price_with_tax, runs one baseline of that test, and reports the line 8 survivor (the discount line no input reaches) with cause `input-gap`. The scope line reads `Scope: exercised, tests under scenarios/boundary as one set`. The effort cap applies unless `--max` is passed."'
    focus: 'trace'
