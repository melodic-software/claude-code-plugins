schema_version: "1.1"
name: se-untracked-config-offers-add
description: 'Legacy setup 7. probe-ls-files, probe-check-ignore, untracked-fail, offers-git-add and no-git-add-or-commit grade the probes and the offer; legacy-setup-7 (llm) quotes the legacy expectation. The decline branch is not exercised. Needs --scaffold --allow-tools Bash Write Edit.'
tags: [setup, scaffold, no-network, legacy]
runs: 3
expected_outcome: 'Both probes per file (git ls-files --error-unmatch and git check-ignore -v); untracked is a FAIL with the git add that fixes it; the add and commit are offered, neither run.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/mutation-testing:setup check. You just wrote the config and arid record. Confirm they''re team-shared.'
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: 'probe-ls-files'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'ls-files(?:[^"\\]|\\.)*--error-unmatch|--error-unmatch(?:[^"\\]|\\.)*ls-files'
  - name: 'probe-check-ignore'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'check-ignore'
  - name: 'untracked-fail'
    type: 'regex'
    pattern: '\b(?:un)?tracked\b[^\n]{0,80}\bFAIL\b|\bFAIL\b[^\n]{0,80}\buntracked'
    flags: 'i'
    target: 'last_message'
  - name: 'offers-git-add'
    type: 'regex'
    pattern: 'git add\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-git-add-or-commit'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '\bgit(?:\s+-C\s+\S+)?\s+(?:add|commit)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'legacy-setup-7'
    type: 'llm'
    criteria: 'The run is /mutation-testing:setup check run on a scaffolded repository (A Python repo whose config and arid record exist on disk, untracked and not ignored). It meets the legacy expectation: "Runs BOTH probes per file -- `git ls-files --error-unmatch` for tracked and `git check-ignore -v` for ignored -- and reports untracked as FAIL with the git add that fixes it. Does not report success from a silent check-ignore alone: immediately after apply the files are untracked but not ignored, so check-ignore says nothing while no teammate will ever receive them. Offers the git add AND the commit that follows it, running neither without the user''s explicit acceptance and never committing unasked, and does not stop at staging as a matter of course. Says so when the user declines, so the dirty tree they are left with is a choice rather than a surprise."'
    focus: 'trace'
