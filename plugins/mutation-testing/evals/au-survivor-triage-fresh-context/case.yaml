schema_version: "1.1"
name: au-survivor-triage-fresh-context
description: 'Legacy audit 3. fresh-context and names-suppression-lint grade the two mechanisms; legacy-audit-3 (llm) quotes the legacy expectation. A Q&A form: no run here has real survivors, so the subagent dispatch and the piped lint call are not graded. Needs --allow-tools Bash.'
tags: [audit, no-network, legacy]
runs: 3
expected_outcome: 'Triage goes to a fresh-context subagent given the artifact, not the reasoning; an equivalence or aridity claim without its demonstration or a lint-clean suppression entry stays unclassified.'
execution:
  prompt: 'Seven mutants survived in my last /mutation-testing:audit run. Which ones matter?'
  allowed_tools: [Skill, Bash, Read, Glob, Grep]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'fresh-context'
    type: 'regex'
    pattern: 'fresh[- ]context'
    flags: 'i'
    target: 'last_message'
  - name: 'names-suppression-lint'
    type: 'regex'
    pattern: 'suppression-lint(?:\.sh)?\b'
    flags: 'i'
    target: 'last_message'
  - name: 'legacy-audit-3'
    type: 'llm'
    criteria: 'The run is a question about /mutation-testing:audit asked with no repository to run on: “Seven mutants survived in my last /mutation-testing:audit run. Which ones matter?”. It meets the legacy expectation: "Delegates the productive / arid / equivalent classification to a fresh-context (non-fork) subagent rather than judging in the authoring context, naming this as the self-grade bias class. Hands over the artifact (mutated line, surrounding code, covering tests), not the reasoning that produced the mutants. Prefers a cross-vendor advisor for the equivalence call when one is installed, with the same-vendor fresh-context subagent as the stated fallback. Reports any WITHHOLDING claim that cannot cite its evidence as unclassified rather than as the class claimed — equivalence without a differential demonstration, and aridity without a complete proposed suppression entry that `bash "${CLAUDE_PLUGIN_ROOT}/scripts/suppression-lint.sh" -` reports `ok` for, piped in so nothing is written, AND whose `reason` names the behavior the suite deliberately does not assert on. The lint''s verdict is the test, not the model''s own reading of the vocabulary table: a `malformed`, `mismatch`, or `unknown-kind` line leaves the survivor unclassified. Free prose in `claim` fails that way even when the entry is otherwise complete and the reason is good: a survivor fitting no node kind is not arid."'
    focus: 'last_message'
