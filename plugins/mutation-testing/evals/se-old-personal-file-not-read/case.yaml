schema_version: "1.1"
name: se-old-personal-file-not-read
description: 'Old personal file only. old-not-applied (llm) checks that .claude/mutation-testing.local.md is not read (operators stays default, no dual-read warning or move command); no-write and no-edit grade read-only. Needs --scaffold --allow-tools Bash Write Edit.'
tags: [setup, scaffold, no-network]
runs: 3
expected_outcome: 'The old .claude/mutation-testing.local.md is ignored (not read), operators stays at the tool default rather than narrow, no old-file warning or move prompt is printed, and nothing is written.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/mutation-testing:setup check'
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: 'old-not-applied'
    type: 'llm'
    criteria: 'PASS only if the reply does not read or apply .claude/mutation-testing.local.md (does not report narrow from it), prints no dual-read WARN asking to move it with /mutation-testing:setup apply local, and writes nothing. FAIL if operators resolves to narrow from .claude/mutation-testing.local.md or if a dual-read WARN naming /mutation-testing:setup apply local is printed.'
    focus: 'last_message'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
