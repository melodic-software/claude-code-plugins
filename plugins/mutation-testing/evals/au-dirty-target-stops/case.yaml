schema_version: "1.1"
name: au-dirty-target-stops
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'asks-commit-or-stash'
    type: 'regex'
    pattern: '\b(?:commit|stash)\s+or\s+(?:commit|stash)\b|\b(?:commit|stash)\b[^\n]{0,60}\b(?:first|before (?:I|we|re-?running|running|the run))\b|\bgit stash\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-score'
    type: 'regex'
    pattern: '\b(?:mutation|covered[- ]code)\s+score\b[^\n]{0,30}?\d+(?:\.\d+)?\s*(?:%|/\s*\d)|\b\d+\s*(?:/|of)\s*\d+\b[^\n]{0,25}\b(?:killed|surviv\w*|detected)\b|\b(?:killed|survived|survivors?)\b\s*[:=|]\s*\d|\b\d+\s+(?:mutants?\s+)?(?:killed|survived)\b|\|\s*\**(?:killed|survived)\**\s*\|'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'no-git-state-change'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '\bgit(?:\s+-C\s+\S+)?\s+(?:stash(?!\s+(?:list|show)\b)|restore|checkout|reset|commit|add|worktree\s+add)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'legacy-audit-2'
    type: 'llm'
    criteria: 'The run is /mutation-testing:audit on a branch whose file to be mutated also holds an uncommitted edit. It meets the legacy expectation: "Hard-stops at preflight rather than proceeding. Explains that the harness reverts by restoring a known state, so uncommitted edits in the target make revert ambiguous and risk discarding the user''s work. Asks them to commit or stash. Does not proceed with a warning, and does not stash on the user''s behalf."'
    focus: 'trace'
  - name: 'no-test-run'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '-m\s+(?:unittest|pytest)\b(?!\s+--version)|\\?["'']-m\\?["''],\s*\\?["''](?:unittest|pytest)\b|(?:"command":"|&&\s*|;\s*)(?:\S+/)?(?:pytest|mutmut\s+run)\b(?!\s+--version)|python3?\s+(?:\S+/)?tests/test_\w+\.py'
    min: 0
    max: 0
    arm: 'both'
