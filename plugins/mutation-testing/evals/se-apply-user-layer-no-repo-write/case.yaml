schema_version: "1.1"
name: se-apply-user-layer-no-repo-write
description: 'Legacy setup 11. names-plugin-configure grades the interactive save route and names-headless-configure the headless claude plugin configure route the plugin-reconfiguration contract gives, no-write, no-edit, no-git-add-or-commit and no-test-run the no-write rule; legacy-setup-11 (llm) quotes the legacy expectation. The narration stays in the prompt. Needs --scaffold --allow-tools Bash Write Edit.'
tags: [setup, scaffold, no-network, legacy]
runs: 3
expected_outcome: 'Settles operators narrow and max_mutants 20 for userConfig and names /plugin configure mutation-testing@<marketplace> (or a headless route from the plugin-reconfiguration convention); writes nothing, runs no test, states the per-repository keys do not come from userConfig.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/mutation-testing:setup apply user. This is a shared repository and I can''t commit config to it; I want the narrow operator set and a cap of 20 mutants for myself.'
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: 'names-plugin-configure'
    type: 'regex'
    pattern: '/plugin configure mutation-testing@'
    flags: 'i'
    target: 'last_message'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-git-add-or-commit'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '\bgit(?:\s+-C\s+\S+)?\s+(?:add|commit)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-test-run'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '-m\s+(?:unittest|pytest)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'legacy-setup-11'
    type: 'llm'
    criteria: 'The run is /mutation-testing:setup apply user run on a scaffolded repository (A Python repo with no mutation-testing config). It meets the legacy expectation: "Treats the user layer as the plugin''s userConfig, not a ~/.claude/mutation-testing.md file. Settles only operators (narrow) and max_mutants (20) and names `/plugin configure mutation-testing@<marketplace>` as the way to save them, with a headless route from the plugin-reconfiguration convention as the alternative. Writes no pluginConfigs value and no settings file itself, and writes no file in the repository: no docs/conventions/mutation-testing.yaml, no arid record, no .local.md personal override. Runs no test command. Says it skipped the write, tracking and commit steps, so `git status` in the repository is unchanged. States that the tool, diff target, mutate paths and test command are per repository and do not come from userConfig."'
    focus: 'trace'
  - name: 'names-headless-configure'
    type: 'regex'
    pattern: 'claude plugin configure(?:\s+-\S+)*\s+mutation-testing@\S+'
    target: 'last_message'
