schema_version: "1.1"
name: se-check-unconfigured-info
description: 'Legacy setup 10. config-info, names-fallback-manual and names-apply grade the report, no-write and no-edit read-only; legacy-setup-10 (llm) quotes the legacy expectation. Needs --scaffold --allow-tools Bash Write Edit.'
tags: [setup, scaffold, no-network, legacy]
runs: 3
expected_outcome: 'Read-only: config presence is INFO, not FAIL, naming the audit''s fallback (tool manual, diff target from origin/HEAD, the changed source files, the effort cap, a confirmed test command) and apply as the way to make it repeatable.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/mutation-testing:setup check. Nothing has been configured yet.'
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: 'config-info'
    type: 'regex'
    pattern: 'config[^\n]{0,80}\bINFO\b|\bINFO\b[^\n]{0,80}config'
    flags: 'i'
    target: 'last_message'
  - name: 'names-fallback-manual'
    type: 'regex'
    pattern: 'tool:?\s*`?manual'
    flags: 'i'
    target: 'last_message'
  - name: 'names-apply'
    type: 'regex'
    pattern: '/mutation-testing:setup apply|\bapply\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
  - name: 'legacy-setup-10'
    type: 'llm'
    criteria: 'The run is /mutation-testing:setup check run on a scaffolded repository (A Python repo with no mutation-testing config). It meets the legacy expectation: "Runs check read-only. Reports the config-presence probe as INFO, not FAIL, and names the audit''s fallback: `tool: manual`, the diff target from origin/HEAD, the changed source files, the effort cap, and a test command the user supplies or confirms at run time. Names `apply` as the way to make the run repeatable. Writes nothing."'
    focus: 'last_message'
