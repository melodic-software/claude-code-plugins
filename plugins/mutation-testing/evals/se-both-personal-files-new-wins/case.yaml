schema_version: "1.1"
name: se-both-personal-files-new-wins
description: 'Both personal files present. warns-both grades the warning line naming the old file and the new one and saying the new one won; new-wins (llm) checks the new file supplies operators and the old max-mutants is named as not applied; no-write and no-edit grade read-only. Needs --scaffold --allow-tools Bash Write Edit.'
tags: [setup, scaffold, no-network]
runs: 3
expected_outcome: 'docs/conventions/mutation-testing.local.yaml is the personal layer, so operators is narrow; one WARN line names both files and says the YAML file won; max-mutants 3 from the old file is named as not applied. Nothing is written.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/mutation-testing:setup check'
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: 'warns-both'
    type: 'regex'
    pattern: 'WARN[^\n]{0,200}\.claude/mutation-testing\.local\.md[^\n]{0,200}docs/conventions/mutation-testing\.local\.yaml[^\n]{0,200}\bwon\b'
    flags: 'i'
    target: 'last_message'
  - name: 'new-wins'
    type: 'llm'
    criteria: 'PASS only if the reply reports the operator set as narrow from docs/conventions/mutation-testing.local.yaml, says that file won over .claude/mutation-testing.local.md, and names max-mutants 3 from the old file as not applied. FAIL if it reports operators as default, applies max-mutants 3, or does not mention the old file''s max-mutants.'
    focus: 'last_message'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
