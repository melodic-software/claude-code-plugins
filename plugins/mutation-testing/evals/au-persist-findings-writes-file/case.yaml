schema_version: "1.1"
name: au-persist-findings-writes-file
description: 'Legacy audit 9. findings-file-path and branch-verbatim grade the file''s name and frontmatter; legacy-audit-9 (llm) quotes the legacy expectation. Reads the detector-findings contract by URL, so it is not tagged no-network. Needs --scaffold --allow-tools Bash Agent Write WebFetch.'
tags: [audit, scaffold, legacy]
runs: 3
expected_outcome: 'Runs Phase 6 after the report: one <UTC-basic-timestamp>-mutation-survivors.md under .work/reviews/<branch-slug>/, branch frontmatter verbatim, Location a repo-relative file:line, Surface(s) mutation-testing:audit, the covering test named in Action.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Run mutation testing on my changes with /mutation-testing:audit and leave the findings somewhere the fix pass can pick them up.'
  allowed_tools: [Skill, Bash, Read, Glob, Grep, Agent, Write, WebFetch]
  max_turns: 60
  timeout_seconds: 1500
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'findings-file-path'
    type: 'regex'
    pattern: '\.work/reviews/feature-free-shipping-at-10kg/\d{8}T\d{6}Z-mutation-survivors(?:-\d+)?\.md'
    flags: 'i'
    target: 'trace'
  - name: 'branch-verbatim'
    type: 'regex'
    pattern: 'branch:\s*feature/free-shipping-at-10kg\b'
    flags: 'i'
    target: 'trace'
  - name: 'legacy-audit-9'
    type: 'llm'
    criteria: 'The run is /mutation-testing:audit on a scaffolded repository, asked: “Run mutation testing on my changes with /mutation-testing:audit and leave the findings somewhere the fix pass can pick them up.”. It meets the legacy expectation: "Recognizes this as the --persist-findings path and runs Phase 6 after reporting. Reads the detector-findings producer contract at its raw-URL citation before the first write rather than inventing the destination. Composes the findings location from the memory root (`<memory_dir>/reviews/<branch-slug>/`), not a hardcoded path, and runs the self-ignore guard on the RESOLVED memory root -- where a checkout governs that root -- without ever editing the consumer''s root .gitignore, and does not run it at all where no checkout governs the destination -- where a RESOLVED ROOT has no governing checkout it writes nothing at all, neither the guard''s `.gitignore` nor the findings file, reporting the resolved destination instead. Otherwise writes exactly one file named `<UTC-basic-timestamp>-mutation-survivors.md`, and when that path already exists writes `-2`, then `-3`, taking the smallest free integer >= 2 rather than overwriting. Sets frontmatter `branch:` to `git branch --show-current` verbatim rather than the directory slug. Emits `Location` as a repo-relative `file:line` for the mutated line, `Surface(s)` as `mutation-testing:audit`, and escapes literal pipes in the `Finding` and `Action` cells because mutation fragments carry them. Names the covering test file inside `Action` and states that the remediation site is NOT the row''s `Location` -- a mutation finding''s fix lands in the test, not at the mutated node, and a consumer that fences each fix to `Location` would otherwise have to guess the target or breach its own fence. Does not restate the findings-file table anywhere."'
    focus: 'trace'
