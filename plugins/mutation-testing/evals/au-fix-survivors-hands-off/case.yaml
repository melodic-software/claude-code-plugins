schema_version: "1.1"
name: au-fix-survivors-hands-off
description: 'Legacy audit 4. no-write and no-edit grade that no test is authored in-skill, rerun-verifies (llm) the verification route; legacy-audit-4 (llm) quotes the legacy expectation. Needs --allow-tools Write Edit for the two max-0 graders to mean anything. Needs --allow-tools Bash.'
tags: [audit, no-network, legacy]
runs: 3
expected_outcome: 'No test is written inside the audit; survivors go to /testing:write when the testing plugin is installed, or back to the user; verification is re-running the audit scoped to the file.'
execution:
  prompt: 'Just fix the surviving mutants from my last /mutation-testing:audit run for me.'
  allowed_tools: [Skill, Bash, Read, Glob, Grep, Write, Edit]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
  - name: 'rerun-verifies'
    type: 'llm'
    criteria: 'PASS only if the reply says the fix is verified by re-running the mutation audit scoped to the file, because the harness re-running the mutant stops the test author grading its own work. FAIL if it offers no re-run or says a passing test suite proves the fix.'
    focus: 'last_message'
  - name: 'legacy-audit-4'
    type: 'llm'
    criteria: 'The run is a question about /mutation-testing:audit asked with no repository to run on: “Just fix the surviving mutants from my last /mutation-testing:audit run for me.”. It meets the legacy expectation: "Reports the survivors and delegates test authoring to /testing:write when the testing plugin is installed, or hands the survivor list back for the user''s own conventions when it is not. Does not author tests inside this skill. Explains that verification is re-running the audit scoped to that file, because the harness re-running the mutant is what stops the test author from grading its own work."'
    focus: 'last_message'
