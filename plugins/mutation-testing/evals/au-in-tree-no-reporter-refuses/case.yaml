schema_version: "1.1"
name: au-in-tree-no-reporter-refuses
description: 'Legacy audit 14. refuses-not-downgrades and contrast-out-of-tree (llm) grade the refusal and its scope; legacy-audit-14 (llm) quotes the legacy expectation. Needs --allow-tools Bash.'
tags: [audit, no-network, legacy]
runs: 3
expected_outcome: 'No: Phase 0 refuses, since in-tree per-mutant writing needs a comparison after every revert and no reporter API means it cannot run; it does not downgrade to an end-of-run check; out-of-tree or whole-file tools run fine.'
execution:
  prompt: 'Using /mutation-testing:audit: Our tool rewrites the source file in place, one mutant at a time, and has no reporter API. Will this run?'
  allowed_tools: [Skill, Bash, Read, Glob, Grep]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'refuses-not-downgrades'
    type: 'llm'
    criteria: 'PASS only if the reply says the audit refuses to run this tool and does not fall back to a single end-of-run comparison. FAIL if it says the run proceeds with a weaker or end-of-run check.'
    focus: 'last_message'
  - name: 'contrast-out-of-tree'
    type: 'llm'
    criteria: 'PASS only if the reply says a tool that writes mutants out of tree, or rewrites the working file whole once, is gated by an end-of-run comparison and runs. FAIL if it says every in-tree tool is refused.'
    focus: 'last_message'
  - name: 'legacy-audit-14'
    type: 'llm'
    criteria: 'The run is a question about /mutation-testing:audit asked with no repository to run on: “Using /mutation-testing:audit: Our tool rewrites the source file in place, one mutant at a time, and has no reporter API. Will this run?”. It meets the legacy expectation: "No -- Phase 0 REFUSES rather than running with a weaker gate. Identifies the regime as in-tree per mutant, the one regime where pile-on is real: a failed revert leaves the next mutant landing on unrestored source and every later verdict describing a tree nobody wrote. That regime''s gate is a comparison after every revert, and with no per-mutant observability and no interrupt safety the gate cannot be run at all -- a check that cannot run is not a check, so the skill stops instead of reporting an outcome it cannot vouch for. Does not silently downgrade to an end-of-run comparison, which would leave the pile-on undetectable while the run reads as normal. Resolves the regime from the project''s own config rather than from the tool''s reputation, and states the resolved regime in the scope report. Contrast it draws correctly: a tool that writes mutants out of tree, or rewrites the working file whole once, is gated by an end-of-run comparison and runs fine -- the refusal is specific to per-mutant in-tree writing without observability, not to in-tree writing as such."'
    focus: 'last_message'
