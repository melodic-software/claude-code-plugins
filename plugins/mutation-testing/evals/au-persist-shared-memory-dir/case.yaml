schema_version: "1.1"
name: au-persist-shared-memory-dir
description: 'Legacy audit 13. One grader per named mechanism plus no-checkout-writes-nothing (llm); legacy-audit-13 (llm) quotes the legacy expectation. Needs --allow-tools Bash.'
tags: [audit, no-network, legacy]
runs: 3
expected_outcome: 'Yes, once each write is proven outside tracked space before it is made: physical path via pwd -P, two empty signals (a .git walk and git rev-parse --show-toplevel) before writing nothing, ls-files and check-ignore anchored to the governing checkout.'
execution:
  prompt: 'Using /mutation-testing:audit: Our memory_dir points at a shared directory outside this worktree. Will --persist-findings write there?'
  allowed_tools: [Skill, Bash, Read, Glob, Grep]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'pwd-physical'
    type: 'regex'
    pattern: 'pwd -P'
    flags: 'i'
    target: 'last_message'
  - name: 'rev-parse-toplevel'
    type: 'regex'
    pattern: 'rev-parse --show-toplevel'
    flags: 'i'
    target: 'last_message'
  - name: 'check-ignore'
    type: 'regex'
    pattern: 'check-ignore'
    flags: 'i'
    target: 'last_message'
  - name: 'core-worktree'
    type: 'regex'
    pattern: 'core\.worktree'
    flags: 'i'
    target: 'last_message'
  - name: 'no-checkout-writes-nothing'
    type: 'llm'
    criteria: 'PASS only if the reply says that when no governing checkout is found by either signal, the run writes nothing at the resolved root, neither the .gitignore guard nor the findings file, and reports the destination. FAIL if it says the findings file is written there anyway.'
    focus: 'last_message'
  - name: 'legacy-audit-13'
    type: 'llm'
    criteria: 'The run is a question about /mutation-testing:audit asked with no repository to run on: “Using /mutation-testing:audit: Our memory_dir points at a shared directory outside this worktree. Will --persist-findings write there?”. It meets the legacy expectation: "Yes, once EACH write the phase makes -- the findings file, and the self-ignore guard''s `.gitignore` where a governing checkout was found -- is proven outside tracked space before THAT write is made (per-write, not both up front, since on a fresh root the guard''s file is what makes the findings file''s probe pass). Where NO governing checkout is found, the guard does not run at all and the findings file is the only write: there is no repository to keep it out of, and the guard''s create-when-absent rule could otherwise land on a `.gitignore` absent from disk but tracked in an undiscovered checkout, modifying committed content with the tracked-file check never having run. Makes the resolved root physical first via `pwd -P` from its nearest existing ancestor, so a symlinked ancestor cannot hide a checkout. Then resolves the governing checkout from TWO signals that must BOTH come back empty before the permissive branch: a walk of that physical path''s ancestors for a `.git` entry using `test -e` (not `-d`, since a worktree''s `.git` is a file), AND `git rev-parse --show-toplevel` run under the AMBIENT environment. Neither alone: rev-parse cannot distinguish no-repository from a missing directory, a dangling gitdir, or a discovery limit such as GIT_CEILING_DIRECTORIES -- all exit 128 -- while the walk cannot see a working tree designated by GIT_WORK_TREE or GIT_DIR. Names `core.worktree` as a topology defeating both signals, and says that where BOTH signals come back empty the run writes NOTHING at a resolved root -- not the guard''s `.gitignore`, not the findings file -- reporting the resolved destination and stopping. Gives the reason the findings file is withheld too: its destination may be an index-tracked DELETION in the checkout the detection missed, where writing modifies a tracked file rather than creating an untracked one, so ''it lands untracked'' is not universally true. Treats a bare repository reaching that branch as a conservative refusal indistinguishable from `core.worktree`, never as a case to write through. With a governing checkout T: rejects a root-equivalent memory_dir judged against T; proves the guard''s write BEFORE the guard makes it via `git -C T ls-files -- <resolved root>`, requiring exit 0 AND empty output -- a fatal ls-files prints nothing to stdout and exits 128, so reading output alone lets a failure pass for a clean root; only then runs the guard and `git -C T check-ignore -q -- <intended file path>`, writing only on exit 0. Reports exit 1 (''the destination is tracked space'') distinctly from any other exit (''the probe did not evaluate this path''), refusing on both. Anchors the probes to a governing checkout, never the invoking worktree, because check-ignore against an outside path is fatal with exit 128 -- a worktree-anchored probe would refuse every write in a layout the fanout fix action supports explicitly -- and notes that `git -C` alone is not an anchor, since GIT_DIR and GIT_WORK_TREE override it. Not a path-prefix comparison, which would need BOTH paths canonicalized where realpath and readlink''s canonicalizing flag are GNU-only."'
    focus: 'last_message'
