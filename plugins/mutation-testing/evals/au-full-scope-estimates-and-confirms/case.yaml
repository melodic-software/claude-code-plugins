schema_version: "1.1"
name: au-full-scope-estimates-and-confirms
description: 'Legacy audit 5. runs-estimate-script (with-only), asks-before-running and no-mutant-applied grade the confirm gate; legacy-audit-5 (llm) quotes the legacy expectation. The cap-truncation clause is not exercised: this repo has no cap. Needs --scaffold --allow-tools Bash Agent.'
tags: [audit, scaffold, no-network, legacy]
runs: 3
expected_outcome: 'Times one test run, counts the mutants, prints the estimate-run.sh line, and asks before running any mutant.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Run mutation testing across the whole repo with /mutation-testing:audit --full.'
  allowed_tools: [Skill, Bash, Read, Glob, Grep, Agent]
  max_turns: 60
  timeout_seconds: 1500
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'runs-estimate-script'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'estimate-run\.sh[^"]*--mutants'
    arm: 'with-only'
  - name: 'asks-before-running'
    type: 'regex'
    pattern: '\b(?:proceed|continue|go ahead|run (?:it|them|the (?:full|whole))|start)\b[^\n]{0,120}\?|\bconfirm\b[^\n]{0,80}\b(?:before|to (?:run|start|proceed))\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-mutant-applied'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'sed\s+-i[^"]*src/'
    min: 0
    max: 0
    arm: 'both'
  - name: 'legacy-audit-5'
    type: 'llm'
    criteria: 'The run is /mutation-testing:audit on a scaffolded repository, asked: “Run mutation testing across the whole repo with /mutation-testing:audit --full.”. It meets the legacy expectation: "Recognizes --full as expensive, times one build plus test run of the selected tests, takes the mutant count from the tool''s dry run or listing, prints the line `bash "${CLAUDE_PLUGIN_ROOT}/scripts/estimate-run.sh" --mutants <n> --seconds <s>` prints rather than computing the estimate itself, and confirms before running rather than starting silently. If a cap truncates the mutant set, reports what was dropped so a truncated run does not read as a clean one."'
    focus: 'trace'
