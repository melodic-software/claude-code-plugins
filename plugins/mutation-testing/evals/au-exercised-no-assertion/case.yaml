schema_version: "1.1"
name: au-exercised-no-assertion
description: 'Legacy audit no_assertion. testing-audit-called grades test recognition through the stand-in testing plugin; the scope, cause, gap and blind-spot graders the report; legacy-audit-no_assertion (llm) quotes the legacy expectation. Needs --scaffold --allow-tools Bash Agent.'
plugins: ["../..", "testing-stub"]
tags: [audit, scaffold, no-network, legacy]
runs: 3
expected_outcome: 'Four survivors on app.py lines 7-10, each productive with cause no-assertion; the exercised scope line, coverage and gap unknown, the blind-spot line.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Run /mutation-testing:audit --exercised. app.py and docs/conventions/mutation-testing.yaml are committed on main; this branch adds scenarios/no_assertion/test_app.py, which calls price_with_tax(150) and asserts nothing.'
  allowed_tools: [Skill, Bash, Read, Glob, Grep, Agent]
  max_turns: 80
  timeout_seconds: 1800
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"mutation-testing:audit"'
  - name: 'testing-audit-called'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"testing:audit"'
  - name: 'baseline-run'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '-m\s+unittest\b'
  - name: 'scope-line'
    type: 'regex'
    pattern: 'Scope[*_`]*:[*_`\s]*exercised,\s*changed tests as one set'
    flags: 'i'
    target: 'last_message'
  - name: 'cause-no-assertion'
    type: 'regex'
    pattern: '\bno[- ]assertion\b'
    flags: 'i'
    target: 'last_message'
  - name: 'coverage-gap-unknown'
    type: 'regex'
    pattern: '\b(?:coverage|gap)\b[^\n]{0,60}\bunknown\b'
    flags: 'i'
    target: 'last_message'
  - name: 'blind-spot-line'
    type: 'regex'
    pattern: 'testing/judge/rule-restated-expectation'
    flags: 'i'
    target: 'last_message'
  - name: 'four-survivors'
    type: 'llm'
    criteria: 'PASS only if the report lists four surviving mutants on app.py lines 7, 8, 9 and 10 (a comparison inversion on 7, statement removals on 8-10), each with cause no-assertion. FAIL if any of the four is reported killed, missing, or with another cause.'
    focus: 'last_message'
  - name: 'legacy-audit-no_assertion'
    type: 'llm'
    criteria: 'The run is /mutation-testing:audit on a scaffolded repository, asked: “Run /mutation-testing:audit --exercised. app.py and docs/conventions/mutation-testing.yaml are committed on main; this branch adds scenarios/no_assertion/test_app.py, which calls price_with_tax(150) and asserts nothing.”. It meets the legacy expectation: "Recognizes the test file by invoking /testing:audit --file on it through the Skill tool and reading its `adapter:` line. Maps the test to price_with_tax, lines 7-10 of app.py, and lists that function in the scope report. Runs under the manual protocol with `python -m unittest {tests}`, the path quoted as its own argument, after one green baseline of that test alone. Generates one mutant per mapped line (comparison inversion on line 7, statement removal on lines 8-10); all four survive. Each productive survivor gets cause `no-assertion`, quoting the test''s line range and the absence of any assertion. The report carries `Scope: exercised, changed tests as one set`, coverage and gap as `unknown`, a Survivors table with a Cause column, and the blind-spot line naming testing/judge/rule-restated-expectation." The eval host has no bare python, so the configured command is python3 -m unittest {tests}; read python -m unittest in the expectation as python3 -m unittest.'
    focus: 'trace'
