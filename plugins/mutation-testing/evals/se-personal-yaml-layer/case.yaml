schema_version: "1.1"
name: se-personal-yaml-layer
description: 'Personal layer at the new location only. narrow-from-personal grades the merged value and its layer; no-old-path-warning (llm) checks no old-file warning; no-write and no-edit grade read-only. Needs --scaffold --allow-tools Bash Write Edit.'
tags: [setup, scaffold, no-network]
runs: 3
expected_outcome: 'Probe 6 reports operators narrow from the personal file docs/conventions/mutation-testing.local.yaml, prints no old-path warning, and writes nothing.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/mutation-testing:setup check'
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: 'narrow-from-personal'
    type: 'regex'
    pattern: 'narrow[^\n]{0,160}mutation-testing\.local\.yaml|mutation-testing\.local\.yaml[^\n]{0,160}narrow'
    flags: 'i'
    target: 'last_message'
  - name: 'no-old-path-warning'
    type: 'llm'
    criteria: 'PASS only if the reply reports the operator set as narrow, supplied by the personal override docs/conventions/mutation-testing.local.yaml, and prints no warning about an old personal file at .claude/mutation-testing.local.md. FAIL if it ignores the personal file, reports operators as default, or warns about an old personal file that does not exist.'
    focus: 'last_message'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
