schema_version: "1.1"
name: su-check-no-settings-file-opt-out
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'no-settings-file'
    type: 'file_exists'
    path: '**/PSScriptAnalyzerSettings.psd1'
    exists: false
  - name: 'absent-settings-is-info'
    type: 'llm'
    criteria: 'The reply says the plugin is not broken: no settings file is INFO, not FAIL, because absence is the opt-out by design and the plugin stays inert until a repository adopts one.'
    focus: 'last_message'
  - name: 'walks-up-to-closest'
    type: 'llm'
    criteria: 'The reply says a file is checked only when a PSScriptAnalyzerSettings.psd1 governs it, found by walking up from the file to the repository root and stopping at the closest one.'
    focus: 'last_message'
  - name: 'no-settings-offer'
    type: 'llm'
    criteria: 'The reply does not offer to create or write a settings file or to repair anything. Saying the user can add one to opt in is allowed.'
    focus: 'last_message'
  - name: 'absent-tools-are-info'
    type: 'llm'
    criteria: 'The reply says a missing pwsh or PSScriptAnalyzer module is INFO rather than FAIL. Also reporting that they are present on this machine still passes.'
    focus: 'last_message'
  - name: 'no-install'
    type: 'tool_used'
    tool: 'Bash'
