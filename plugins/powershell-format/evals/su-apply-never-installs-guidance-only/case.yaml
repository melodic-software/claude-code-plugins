schema_version: "1.1"
name: su-apply-never-installs-guidance-only
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'no-settings-file'
    type: 'file_exists'
    path: '**/PSScriptAnalyzerSettings.psd1'
    exists: false
  - name: 'points-at-install-page'
    type: 'regex'
    pattern: 'learn\.microsoft\.com/(?:[\w-]+/)?powershell/scripting/install/[\w-]+'
    target: 'last_message'
  - name: 'names-module-command'
    type: 'regex'
    pattern: 'Install-Module\s+(?:-Name\s+)?PSScriptAnalyzer(?![\w-]|\.\w)'
    target: 'last_message'
  - name: 'module-guidance-only'
    type: 'llm'
    criteria: 'The reply says Install-Module PSScriptAnalyzer is for the reader to run, and that the skill does not run it.'
    focus: 'last_message'
  - name: 'settings-file-reason'
    type: 'llm'
    criteria: 'The reply says apply does not write the settings file, and gives the reason: it is the executed-adjacent trust boundary, so the choice and the edit belong to the consumer.'
    focus: 'last_message'
  - name: 'absent-is-valid-end-state'
    type: 'llm'
    criteria: 'The reply says leaving pwsh absent is a valid end state when PowerShell does not apply on this machine: the hooks stay quiet and the once-per-session SessionStart notice is the only signal.'
    focus: 'last_message'
  - name: 'no-install'
    type: 'tool_used'
    tool: 'Bash'
