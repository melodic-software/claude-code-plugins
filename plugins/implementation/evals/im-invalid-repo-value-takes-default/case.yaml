schema_version: "1.1"
name: im-invalid-repo-value-takes-default
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-repo-config
    type: tool_used
    tool: Read
    input_match: 'docs/conventions/implementation\.yaml'
  - name: names-invalid-value
    type: regex
    pattern: '^(?=(?:[^\n]*\n){0,2}[^\n]*implementation\.yaml)(?=(?:[^\n]*\n){0,2}[^\n]*\bcode_writing\b)(?=(?:[^\n]*\n){0,2}[^\n]*\bparallel\b)(?=(?:[^\n]*\n){0,2}[^\n]*\b(?:invalid|not (?:a )?valid|isn[''’]t (?:a )?valid|unrecognized|unknown|unsupported|not (?:one of|allowed|supported|recognized)|isn[''’]t one of)\b)(?!(?:[^\n]*\n){0,2}[^\n]*\b(?:not|isn[''’]t) (?:an? )?invalid\b)'
    flags: 'mi'
    target: last_message
  - name: code-writing-default
    type: regex
    pattern: '\bcode_writing\b[`*]*[ \t]*[:=][ \t]*[`*]*inline\b[`*]*[ \t]*\([ \t]*default\b'
    flags: 'i'
    target: last_message
  - name: posture-from-repo
    type: regex
    pattern: '\bintegration_posture\b[`*]*[ \t]*[:=][ \t]*[`*]*minimal\b[`*]*[ \t]*\([ \t]*(?:from )?`?(?:docs/conventions/)?implementation\.yaml'
    flags: 'i'
    target: last_message
