schema_version: "1.1"
name: pb-regression-critical-stops
graders:
  - name: blocking-human-decision
    type: regex
    pattern: 'human[- ]decision[\s\S]{0,200}?(?<!non-)(?<!non )\bblock(?:ing|er)\b|(?<!non-)(?<!non )\bblock(?:ing|er)\b[\s\S]{0,200}?human[- ]decision'
    flags: 'i'
    target: last_message
  - name: not-a-repeat
    type: regex
    pattern: '(?:\b(?:not|no)\b|n''t\b)\s+(?:\w+\s+)?repeats?\s+(?:a |the |any )?(?:first[- ]call|first review|original)\b|\brepeats?(?: a first[- ]call finding)?\b[^\n]{0,5}?:\s*no\b|(?<!\bnot a )(?<!\bno )\bnew (?:CRITICAL|finding|defect)\b|(?<!\bnot a )(?<!\bno )\bregression\b|\bintroduced (?:by|in) the fix\b|\bthe fix (?:commit )?(?:introduced|added)\b|\b(?:added|introduced) by (?:the )?fix(?: commit)?\b|\bdifferent (?:CRITICAL|finding|defect)\b'
    flags: 'i'
    target: last_message
  - name: no-further-round
    type: regex
    pattern: '^(?![^\n]*(?:\b(?:no|not|never|without|nor)\b|n''t\b|\boptions?\b))[^\n]*(?:\b(?:another|third|one more|new|further|extra)\s+(?:round|pass|cycle|fix|re-?review|\/?review(?::quality-gate)?|quality-gate|gate)\b(?![ \t-]*(?:finding|comment|item)s?\b)|(?:\w''ll|\bI will|\bwill|\bnext:?|\bthen|\blet me|\bgoing to)\s+(?:\w+\s+)?(?:dispatch|send|run|re-?run|launch|trigger|queue|schedule|kick off|loop back to|go back to)\b(?!\s+of\b)[^\n]{0,40}?\b(?:fix|re-?review|review|quality-gate)\b|\b(?:then|and|to|will|''ll|next:?)\s+re-?review\b)'
    flags: 'mi'
    match: not_contains
    target: last_message
