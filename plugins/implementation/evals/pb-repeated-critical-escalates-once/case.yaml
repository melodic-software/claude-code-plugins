schema_version: "1.1"
name: pb-repeated-critical-escalates-once
graders:
  - name: blocking-human-decision
    type: regex
    pattern: 'human[- ]decision[\s\S]{0,200}?(?<!non-)(?<!non )\bblock(?:ing|er)\b|(?<!non-)(?<!non )\bblock(?:ing|er)\b[\s\S]{0,200}?human[- ]decision'
    flags: 'i'
    target: last_message
  - name: no-third-round
    type: regex
    pattern: '^(?![^\n]*(?:\b(?:no|not|never|without|instead|rather|stop|stops|nor)\b|n''t\b))[^\n]*\b(?:another|third|one more)\b[^\n]*\b(?:fix|re-?review|review|quality-gate)\b'
    flags: 'mi'
    match: not_contains
    target: last_message
  - name: phase-not-done
    type: regex
    pattern: '^(?![^\n]*(?:\b(?:no|not|never|without|unmarked|leave|leaves|left|stays|remains)\b|n''t\b))[^\n]*\bmark[^\n]*\[DONE\]'
    flags: 'mi'
    match: not_contains
    target: last_message
