schema_version: "1.1"
name: id-invalid-attempt-count-takes-default
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-repo-config
    type: tool_used
    tool: Read
    input_match: 'docs/conventions/implementation\.yaml'
  - name: names-invalid-count
    type: regex
    pattern: '^(?=(?:[^\n]*\n){0,2}[^\n]*implementation\.yaml)(?=(?:[^\n]*\n){0,2}[^\n]*\bcompeting_attempt_count\b)(?=(?:[^\n]*\n){0,2}[^\n]*(?:[:=`(][ \t]*|\b(?:value|sets?|of|to|is|asks for)[`*]*[ \t]+|_count[`*]*[ \t]+)7\b)(?=(?:[^\n]*\n){0,2}[^\n]*\b(?:invalid|not (?:a )?valid|isn[''’]t (?:a )?valid|out of range|outside|not (?:a whole number )?(?:from|between|in) 2|above (?:the )?(?:2[ \t]*(?:to|[–-])[ \t]*5 |allowed )?(?:range|maximum|max|5)|exceeds|unsupported|not allowed|must be (?:2|between|from|a whole number)|dropped|ignored)\b(?![^\n.!]*\?))(?!(?:[^\n]*\n){0,2}[^\n]*(?:\b(?:no|nothing|none|not|isn[''’]t|never)\b[^\n]{0,20}\b(?:invalid|dropped|ignored)\b|\bbut allowed\b))'
    flags: 'mi'
    target: last_message
  - name: count-default
    type: regex
    pattern: '\bcompeting_attempt_count\b(?:[`*]*[ \t]*[:=][`* \t]*|[`*]*[ \t]+(?:is|resolves to|resolved to)[ \t]+[`*]*)3\b[`*.]*[ \t]*\([ \t]*(?:the |built-in |skill(?:[''’]s)? )?default\b|\|[ \t]*[`*]*competing_attempt_count[`*]*[ \t]*\|[ \t]*[`*]*3[`*]*[ \t]*\|[ \t]*[`*(]*(?:the |built-in |skill(?:[''’]s)? )?default\b'
    flags: 'i'
    target: last_message
  - name: attempts-auto-repo
    type: regex
    pattern: '\bcompeting_attempts\b(?:[`*]*[ \t]*[:=][`* \t]*|[`*]*[ \t]+(?:is|resolves to|resolved to)[ \t]+[`*]*)auto\b[`*.]*[ \t]*\([ \t]*(?:from |(?:the )?repo(?:sitory)?(?: file| layer)?[:,]?[ \t]*)?`?(?:\./)?(?:docs/conventions/)?implementation\.yaml|\|[ \t]*[`*]*competing_attempts[`*]*[ \t]*\|[ \t]*[`*]*auto[`*]*[ \t]*\|[ \t]*[`*(]*(?:from |(?:the )?repo(?:sitory)?(?: file| layer)?[:,]?[ \t]*)?`?(?:\./)?(?:docs/conventions/)?implementation\.yaml'
    flags: 'i'
    target: last_message
