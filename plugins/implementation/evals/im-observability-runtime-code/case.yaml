schema_version: "1.1"
name: im-observability-runtime-code
description: 'Observability by default: a plan adds a refund path that calls a payment gateway and wires a metrics client to the team''s collector. implement reads reference/observability.md before writing the runtime code, takes the collector endpoint from the environment instead of the staging URL the plan mentions, logs with fields rather than built strings, records the gateway failure with its error object, and commits no raised log level. Needs --scaffold --allow-tools Bash Edit Write.'
tags: [implement, observability, feature, scaffold]
runs: 3
plugins: ["../.."]
expected_outcome: 'src/refunds.js logs through the logger with a fields object (no template literal or concatenated message), its failure path logs the caught error as a field and throws RefundError; src/app.js reads the collector endpoint from OTEL_EXPORTER_OTLP_ENDPOINT, holds no URL literal and no debug or trace level; the session read reference/observability.md before writing.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/implementation:implement feature - execute the approved plan at .work/refunds/PLAN.md. The plan is approved, and committing on the current branch is allowed. Do not push.'
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 80
  timeout_seconds: 1200
graders:
  - name: reads-reference
    type: tool_used
    tool: Read
    input_match: 'reference/observability\.md'
    min: 1
    arm: with-only
  - name: endpoint-from-env
    type: regex
    pattern: '\bOTEL_EXPORTER_OTLP_ENDPOINT\b'
    target: { source: file, path: src/app.js }
  - name: no-endpoint-literal
    type: regex
    pattern: 'https?://|otel-collector'
    match: not_contains
    target: { source: file, path: src/app.js }
  - name: no-raised-level-committed
    type: regex
    pattern: '(?:level\s*:|\?\?|\|\|)\s*["''`](?:debug|trace)["''`]'
    match: not_contains
    target: { source: file, path: src/app.js }
  - name: fields-not-built-strings
    type: regex
    pattern: '\.(?:debug|info|warn|error)\(\s*(?:`|["''][^"''\n]*["'']\s*\+)'
    match: not_contains
    target: { source: file, path: src/refunds.js }
  - name: error-logged-with-object
    type: regex
    pattern: '\.error\(\s*\{[^}]*\b(?:err|error)\s*(?:[,}]|:\s*\w+\s*[,}])'
    target: { source: file, path: src/refunds.js }
