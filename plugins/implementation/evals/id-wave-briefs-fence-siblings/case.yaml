schema_version: "1.1"
name: id-wave-briefs-fence-siblings
graders:
  - name: escalation-clause-in-both
    type: regex
    pattern: '(?:if\s+an\s+assumption\s+in\s+this\s+brief\s+proves\s+wrong\s+or\s+the\s+task\s+requires\s+touching\s+anything\s+FORBIDDEN,\s+STOP\s+and\s+report[.;]\s*Do\s+not\s+improvise[\s\S]*?){2}'
    flags: 'i'
    target: last_message
  - name: rounding-row-forbids-tax
    type: regex
    pattern: '(?:FORBIDDEN|Forbidden)(?![ \t]*,)(?:[^\n]|\n(?![ \t]*\n)(?![^\n]*\b(?:ALLOWED|Allowed)\b)){0,600}?billing/tax\.py'
    target: last_message
  - name: tax-row-forbids-rounding
    type: regex
    pattern: '(?:FORBIDDEN|Forbidden)(?![ \t]*,)(?:[^\n]|\n(?![ \t]*\n)(?![^\n]*\b(?:ALLOWED|Allowed)\b)){0,600}?billing/rounding\.py'
    target: last_message
