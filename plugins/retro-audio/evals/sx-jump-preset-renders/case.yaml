schema_version: "1.1"
name: sx-jump-preset-renders
graders:
  - name: sfx-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:retro-audio:)?sfx"'
  - name: music-not-invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:retro-audio:)?music"'
    min: 0
    max: 0
    arm: both
  - name: renders-jump-preset
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:python[\d.]*(?:\.exe)?(?:\s+-\w+)*(?:\s|\\\\\\n)+)?(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?sfx\.py(?:\\\"|'')?(?![\w.-])(?:\\\\(?:\\r)?\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?--preset(?:\s|=)+(?:\\\"|'')?jump(?![\w-])'
    arm: with-only
  - name: reports-jump-length
    type: regex
    pattern: 'jump\.wav \(0\.160s\)'
    target: trace
    arm: with-only
  - name: wav-written
    type: file_exists
    path: 'audio/jump.wav'
    arm: both
