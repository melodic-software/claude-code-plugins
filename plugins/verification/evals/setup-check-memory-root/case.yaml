schema_version: "1.1"
name: setup-check-memory-root
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'runs-check'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?setup-apply\.mjs(?:[^"\\]|\\.)*?--check'
    min: 1
  - name: 'probes-file-path'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?check-ignore(?:[^"\\]|\\.)*?\.work/[^"\s\\]+/[^"\s/\\]+'
    min: 1
  - name: 'memory-root-info'
    type: 'regex'
    pattern: '(?:memory root|memory_dir)[^\n]*INFO[^\n]*\.work/|(?:memory root|memory_dir)[^\n]*\.work/[^\n]*INFO|INFO[^\n]*(?:memory root|memory_dir)[^\n]*\.work/'
    flags: 'i'
    target: 'last_message'
  - name: 'no-settings-file'
    type: 'file_exists'
    path: 'docs/conventions/verification.yaml'
    exists: false
  - name: 'no-ignore-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"[^"]*\.gitignore"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-ignore-shell-write'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:>>?|\btee\b(?:\s+-a)?)\s*(?:\\"|'')?[^\s;|&"''\\]*\.gitignore'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-verification-pass'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill":"verification:(?:confirm|measure)"'
    min: 0
    max: 0
    arm: 'both'
