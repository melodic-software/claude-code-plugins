schema_version: "1.1"
name: confirm-unattended-refresh-passes-unattended
description: When confirm, called with --unattended, refreshes a touched feature itself, it passes --unattended to /app-control:map refresh so the pass never stops to ask
tags: [confirm, app-control, refresh, unattended, invented]
expected_outcome: The reply calls /app-control:map refresh cart/total with --unattended, once, asks nothing, and calls no refresh for checkout.
execution:
  prompt: "/verification:confirm outcome --unattended. Do not read the repository, launch, install or run anything; treat these as facts. Stage 1 already passed. The testing plugin is not installed, so /testing:run-e2e did not run; the live drive of the cart page through the bundled /run is done and showed the total with tax, the PR's acceptance criterion. The app-control plugin is installed: /app-control:drive and /app-control:map resolve in this session. The repository has the control skill .claude/skills/control-shop/ with two features, cart/total and checkout. This branch changes only src/cart/total.ts. The /app-control:drive affected call has already run with --unattended: its affected.json lists one feature, cart/total, and does not list checkout. List every skill call you make from here on, with its exact arguments, then stop."
  allowed_tools: [Read, Glob, Grep]
  max_turns: 8
  timeout_seconds: 300
graders:
  - name: refresh-passes-unattended
    type: regex
    pattern: 'refresh[ `"]+cart/total[^\n]*--unattended|--unattended[^\n]*refresh[ `"]+cart/total'
    arm: both
  - name: unattended-refresh-no-question
    type: llm
    criteria: "PASS only if the reply (1) calls /app-control:map refresh for the feature id cart/total with --unattended as a call this run makes, (2) asks no question and does not wait for an answer, and (3) makes no refresh call for checkout. FAIL if the refresh call omits --unattended, refreshes checkout or every feature, edits a file under .claude/skills/control-shop/ itself, or asks anything."
