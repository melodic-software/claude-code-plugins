schema_version: "1.1"
name: confirm-app-control-absent-reports-drift
description: Without app-control and with /testing:run-e2e not run, confirm maps the changed file to its feature through the control skill index's sources globs, reports that feature's possible drift and names /app-control:map refresh for it in Next, never holding the verdict for app-control's absence
tags: [confirm, app-control, refresh, drift, invented]
expected_outcome: The report says the cart/total feature's control skill may no longer match the app because src/cart/total.ts changed, and its Next section names /app-control:map refresh cart/total for when app-control is installed. The drift and app-control's absence are not reasons for a verdict below CONFIRMED. It does not claim a refresh ran, installs nothing, edits no control skill file, and reports no drift for checkout.
execution:
  prompt: "/verification:confirm outcome. Do not read the repository, launch, install or run anything; treat these as facts. Stage 1 already passed this conversation. The testing plugin is not installed, so /testing:run-e2e did not run; the live drive of the cart page through the bundled /run is done and showed the total with tax, which is the PR's only acceptance criterion, and a unit test written before this change asserts the same total. The app-control plugin is not installed: no app-control skill resolves in this session. The repository has the control skill .claude/skills/control-shop/, whose index has two lines: `- Cart total | features/cart/total/README.md | entry points: 1 | sources: src/cart/**` and `- Checkout | features/checkout/README.md | entry points: 1 | sources: src/checkout/**`. This branch changes only src/cart/total.ts. Write the report, including its Next section, then stop."
  allowed_tools: [Read, Glob, Grep]
  max_turns: 8
  timeout_seconds: 300
graders:
  - name: names-refresh-for-cart-total
    type: regex
    pattern: 'app-control:map refresh[ `"]+cart/total\b'
    arm: both
  - name: reports-drift-without-holding-verdict
    type: llm
    criteria: "PASS only if the reply (1) reports that the cart/total feature (or Cart total) of control-shop may be out of date because src/cart/total.ts changed, (2) names /app-control:map refresh cart/total in its Next section as the step once app-control is installed, and (3) does not give app-control's absence or that drift as a reason for a verdict below CONFIRMED. FAIL if it says a refresh ran or was called, installs or enables a plugin, edits or writes a file under .claude/skills/control-shop/, reports drift for checkout, or stops the run because app-control is missing."
