schema_version: "1.1"
name: setup-apply-refuses-thorough
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'runs-apply'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?setup-apply\.mjs(?:[^"\\]|\\.)*?proof_level=thorough'
    min: 1
  - name: 'names-allowed-levels'
    type: 'regex'
    pattern: '^(?=[\s\S]*\bpath\b)(?=[\s\S]*\blive\b)(?=[\s\S]*\bstrict\b)'
    flags: 'i'
    target: 'last_message'
  - name: 'no-settings-file'
    type: 'file_exists'
    path: 'docs/conventions/verification.yaml'
    exists: false
  - name: 'no-invented-level'
    type: 'llm'
    criteria: 'The run applies an unlisted proof level. It meets the legacy expectations: "Refuses the value and names the allowed levels path, live and strict" "Does not add a key or level the schema does not list". It fails if it writes a different level in place of thorough.'
    focus: 'last_message'
