schema_version: "1.1"
name: confirm-redispatch-brief-facts-only
graders:
  - name: 'quotes-scope-rule'
    type: 'regex'
    pattern: 'edits[\s>]+to[\s>]+existing[\s>]+order[\s>]+tests[\s>]+that[\s>]+exercise[\s>]+the[\s>]+note[\s>]+limit'
    target: { source: file, path: .work/redispatch-brief.md }
  - name: 'names-scope-source'
    type: 'regex'
    pattern: 'PLAN\.md'
    target: { source: file, path: .work/redispatch-brief.md }
  - name: 'no-recommendation'
    type: 'regex'
    pattern: '\brecommended\b|accept (?:the|this) edit'
    flags: 'i'
    match: 'not_contains'
    target: { source: file, path: .work/redispatch-brief.md }
  - name: 'no-wanted-verdict'
    type: 'regex'
    pattern: 'should pass|(?<!no )expected verdict|(?:(?:expect|want|should|likely|probably|hope)\w*\W{1,20}(?:\w+\W{1,5}){0,3}|verdict(?:\*\*|__)?\W{1,8})CONFIRMED(?!\W{1,6}(?:NEEDS WORK|NOT VERIFIED|or|if|when|only)\b|\W{0,6}\((?:every|all|when|if)\b)'
    flags: 'i'
    match: 'not_contains'
    target: { source: file, path: .work/redispatch-brief.md }
