schema_version: "1.1"
name: confirm-new-endpoint-runs-e2e
graders:
  - name: 'calls-run-e2e'
    type: 'regex'
    pattern: '/?testing:run-e2e'
    flags: 'i'
    target: 'last_message'
  - name: 'verified-at-sha'
    type: 'regex'
    pattern: 'verified_at_sha[`*_\"'']*\s*[:=]\s*[`*_\"'']*4f2c9e1'
    flags: 'i'
    target: 'last_message'
  - name: 'manifest-path'
    type: 'regex'
    pattern: '\.work/[^\s/`]+/verification/'
    flags: 'i'
    target: 'last_message'
  - name: 'no-local-path'
    type: 'regex'
    pattern: '(?:/home|/Users)/[\w.-]+/|[A-Za-z]:\\(?:Users|home)\\|/tmp/|/var/folders/'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'manifest-assertions'
    type: 'llm'
    criteria: 'The reply verifies a new API endpoint and writes its evidence manifest. It meets the legacy expectations: "Auto-triggers /testing:run-e2e because the change matches an e2e-* category glob (runtime-affecting)" "Writes the assertion-only manifest with verified_at_sha to the topic''s memory slice (.work/<slug>/verification/, never committed) and pastes it into the PR body or linked issue" "Carries distilled assertions only: no machine-local capture paths in the manifest, because raw captures stay in the memory slice (.work/<slug>/scratch/), never committed".'
    focus: 'last_message'
