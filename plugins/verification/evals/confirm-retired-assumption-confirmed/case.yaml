schema_version: "1.1"
name: confirm-retired-assumption-confirmed
graders:
  - name: 'lists-retired'
    type: 'regex'
    pattern: 'batch[^\n]{0,120}\bretired\b|\bretired\b[^\n]{0,120}batch'
    flags: 'i'
    target: 'last_message'
  - name: 'verdict-confirmed'
    type: 'regex'
    pattern: '[Vv]erdict\W{0,8}CONFIRMED'
    target: 'last_message'
  - name: 'retired-not-falsified'
    type: 'llm'
    criteria: 'The reply verifies a photo-upload change against a Brief with one retired assumption. It meets the legacy expectations: "It lists the batch-upload assumption as retired, not as falsified" "It does not ask the user whether to replan because of the batch-upload assumption" "The verdict is CONFIRMED".'
    focus: 'last_message'
