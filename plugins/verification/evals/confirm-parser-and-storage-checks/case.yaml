schema_version: "1.1"
name: confirm-parser-and-storage-checks
graders:
  - name: 'replays-saved-input'
    type: 'regex'
    pattern: '(?:replay|re-?run|feed)[^\n]{0,80}(?:saved|captured|recorded|real|sample)[^\n]{0,40}(?:csv|input|file)|(?:saved|captured|recorded|real)[^\n]{0,30}(?:csv|input|file)[^\n]{0,80}(?:replay|through the (?:changed |new )?parser)'
    flags: 'i'
    target: 'last_message'
  - name: 'reads-rows-back'
    type: 'regex'
    pattern: 'read(?:ing|s)?[^\n]{0,60}\brows?\b[^\n]{0,30}\bback\b|\bquery[^\n]{0,60}contacts table|\bselect\b[^\n]{0,60}\bcontacts\b'
    flags: 'i'
    target: 'last_message'
  - name: 'check-per-change'
    type: 'llm'
    criteria: 'The reply picks checks for a CSV import change. It meets the legacy expectations: "Maps the parser change to replaying a saved input through the changed parser" "Maps the storage change to reading the written rows back from the table" "Does not treat the import''s success response as proof the rows were stored".'
    focus: 'last_message'
