schema_version: "1.1"
name: wf-draft-routes-to-diagnose
graders:
  - name: invokes-diagnose
    type: tool_used
    tool: Skill
    input_match: 'songwriting:diagnose'
    min: 1
  - name: dominant-problem-named
    type: regex
    pattern: '\b(?:dominant|main|biggest|central|core|primary)\s+(?:problem|issue|weakness)\b|\bdominant next move\b'
    flags: 'i'
    target: last_message
  - name: pattison-lens
    type: regex
    pattern: '\b(?:unstable|stable|repaint(?:s|ed|ing)?|prosody)\b|\bcompositional elements?\b'
    flags: 'i'
    target: last_message
  - name: no-scenario-menu
    type: regex
    pattern: '\b(?:11|eleven) scenarios\b|^[ \t]*(?:\d{1,2}[.)]|[-*])[ \t]*(?:\*\*)?(?:Brand new song|Existing song revision|Writing from a title|Pure brainstorm|Fragment in hand)'
    flags: 'im'
    match: not_contains
    target: last_message
