schema_version: "1.1"
name: mt-loneliness-labeled-menu
graders:
  - name: two-type-labels
    type: regex
    pattern: '\bexpressed identity\b[\s\S]*\b(?:qualifying|verbal)\b|\b(?:qualifying|verbal)\b[\s\S]*\bexpressed identity\b|\bqualifying\b[\s\S]*\bverbal\b|\bverbal\b[\s\S]*\bqualifying\b'
    flags: 'i'
    target: last_message
  - name: family-distance-label
    type: regex
    pattern: '\b(?:family\s+)?distance\b(?:\*\*)?[^\n]{0,40}?\b(?:close|medium|far)\b|\|[ \t]*(?:\*\*)?(?:close|medium|far)(?:\*\*)?[ \t]*\||\b(?:close|medium|far)[- ]distance\b'
    flags: 'i'
    target: last_message
  - name: finder-question-lists
    type: regex
    pattern: '(?=[\s\S]*(?:\bcharacteristics\b|\bwhat\s+(?:is|does)\s+(?:this|the|your|that)\s+loneliness\s+(?:feel\s+)?like\b))(?=[\s\S]*\bwhat else\b)'
    flags: 'i'
    target: last_message
  - name: no-single-winner
    type: llm
    focus: last_message
    criteria: "The writer asked for metaphor options for the loneliness after a divorce, for a slow country ballad, to choose from. PASS if the reply leaves the choice to the writer: a menu, a choosing guide keyed to feelings or moods, or a plain statement that the pick is theirs, with no single option crowned. A guide that maps several moods to options passes, whatever word opens it ('honestly', 'first', 'simple') and however its option numbers are emphasized. FAIL if any part of the reply, even after a full menu or a hedge such as 'if you only want one', presents one option as the answer: a lone pick on a 'How I'd choose' line with or without its option number, 'my pick is X', 'I'd go with X', 'the best metaphor is X', a Pick or Winner line naming one, or a bold lead naming one option, even with a hedge such as 'but only just'. Judge only whether one option is crowned; menu size, types, distances and finder lists are graded elsewhere."
