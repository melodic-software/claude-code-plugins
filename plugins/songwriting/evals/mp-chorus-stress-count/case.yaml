schema_version: "1.1"
name: mp-chorus-stress-count
graders:
  - name: stress-map-marked
    type: regex
    pattern: '\b(?:[a-z]+-)*[A-Z]{2,}(?:-[a-z]+)+\b|\b(?:[a-z]+-)+[A-Z]{2,}\b|\bDUM\b|ˈ|(?:^|[ \t])(?:[u˘x×][ \t]+/|/[ \t]+[u˘x×])(?=[ \t]|$)|\*\*[a-z]+\*\*-[a-z]+|[a-z]+-\*\*[a-z]+\*\*'
    flags: 'm'
    target: last_message
  - name: stress-count-reported
    type: regex
    pattern: '\b(?:[1-6]|one|two|three|four|five|six)\s+(?:strong\s+)?(?:stresses|stressed(?:\s+syllables)?|beats|accents)\b|\b(?:stress(?:es)?|stressed)\s*(?:count)?\s*[:=]\s*[1-6]\b|\b[1-6](?:\s*/\s*[1-6]){3}\b|\|[ \t]*[1-6][ \t]*\|[ \t]*$'
    flags: 'im'
    target: last_message
  - name: raw-count-not-balance
    type: llm
    focus: last_message
    criteria: "The writer counted the four chorus lines at 8, 9, 9 and 8 raw syllables and called the chorus nicely balanced. PASS only if both hold, in any wording: (1) the reply says the raw syllable count (the 8/9/9/8) does not measure, show, prove or decide the chorus's balance or line length, or is the wrong measure for it; (2) the reply points to stressed syllables (stresses) as the measure of balance or line length instead. A reply that says the counts look uneven yet the stresses balance passes, and so does one that finds the chorus unbalanced by stress. FAIL if the reply treats the 8/9/9/8 count as evidence of balance or of imbalance, if it endorses the raw count or calls the stress count the wrong measure, or if it reports stresses but never says the raw syllable count is not the measure of balance."
  - name: no-rewritten-line
    type: regex
    pattern: '^[ \t>*#-]*(?:\*\*)?(?:Rewrite|rewrite|Rewritten|rewritten|Revised|revised|Revision|revision|Suggested|suggested|Try|try|Alternative|alternative)(?: line)?(?:\*\*)?[ \t]*:[ \t]*(?:\*\*)?[ \t]*[\"“_*][A-Za-z]'
    flags: 'm'
    match: not_contains
    target: last_message
