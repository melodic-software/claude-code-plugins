schema_version: "1.1"
name: mp-chorus-stress-count
graders:
  - name: stress-map-marked
    type: regex
    pattern: '\b(?:[a-z]+-)*[A-Z]{2,}(?:-[a-z]+)+\b|\b(?:[a-z]+-)+[A-Z]{2,}\b|\bDUM\b|ˈ|(?:^|[ \t])(?:[u˘x×][ \t]+/|/[ \t]+[u˘x×])(?=[ \t]|$)|\*\*[a-z]+\*\*-[a-z]+|[a-z]+-\*\*[a-z]+\*\*'
    flags: 'm'
    target: last_message
  - name: stress-count-reported
    type: regex
    pattern: '\b(?:[1-6]|one|two|three|four|five|six)\s+(?:strong\s+)?(?:stresses|stressed(?:\s+syllables)?|beats|accents)\b|\b(?:stress(?:es)?|stressed)\s*(?:count)?\s*[:=]\s*[1-6]\b|\b[1-6](?:\s*/\s*[1-6]){3}\b|\|[ \t]*[1-6][ \t]*\|[ \t]*$'
    flags: 'im'
    target: last_message
  - name: raw-count-not-balance
    type: regex
    pattern: '\b(?:not|never|ignore|rather than|instead of|(?:don[''’]t|do not) (?:go by|trust|rely on|use))\s+(?:(?:by|from|on|in|the)\s+)*(?:raw[- ])?syllables?(?:[- ]counts?)?\b|\b(?:raw[- ]syllables?(?:[- ]counts?)?|syllable counts?)\b(?:\s+(?:alone|by (?:itself|themselves)|here|totals?))?\s+(?:doesn[''’]t|does not|don[''’]t|do not|isn[''’]t|is not|aren[''’]t|can[''’]t|cannot|won[''’]t|never|says nothing|tells? you nothing|answers a different question|(?:is|are) (?:a )?misleading)\b(?!\s+(?:perfectly|quite|exactly|entirely|completely|totally)\b)|\b(?:raw[- ]syllables?(?:[- ]counts?)?|syllable counts?|raw counts?|\d+(?:\s*/\s*\d+){3}(?:\s+(?:count|counts|tally|totals?))?)\s+(?:doesn[''’]t|does not|don[''’]t|do not|isn[''’]t|is not|aren[''’]t|are not|can[''’]t|cannot|won[''’]t|never)\s+(?:(?:measure|show|prove|decide|determine|capture|reflect)\s+(?:the\s+)?(?:balance|line length|length|weight|symmetry|evenness)|(?:the|a)\s+(?:measure|metric|yardstick|unit)|what\s+(?:shows|measures|decides|determines|proves))\b|\b(?:raw[- ]syllables?(?:[- ]counts?)?|syllable counts?|raw counts?|\d+(?:\s*/\s*\d+){3}(?:\s+(?:count|counts|tally|totals?))?)[^.!?\n]{0,30}[.!?:;]\s+(?:they|those|these|that count|it)\s+(?:doesn[''’]t|does not|don[''’]t|do not|isn[''’]t|is not|aren[''’]t|are not|can[''’]t|cannot|won[''’]t|never)\s+(?:(?:measure|show|prove|decide|determine|capture|reflect)\s+(?:the\s+)?(?:balance|line length|length|weight|symmetry|evenness)|(?:the|a)\s+(?:measure|metric|yardstick|unit)|what\s+(?:shows|measures|decides|determines|proves))\b'
    flags: 'i'
    target: last_message
  - name: no-rewritten-line
    type: regex
    pattern: '^[ \t>*#-]*(?:\*\*)?(?:Rewrite|rewrite|Rewritten|rewritten|Revised|revised|Revision|revision|Suggested|suggested|Try|try|Alternative|alternative)(?: line)?(?:\*\*)?[ \t]*:[ \t]*(?:\*\*)?[ \t]*[\"“_*][A-Za-z]'
    flags: 'm'
    match: not_contains
    target: last_message
