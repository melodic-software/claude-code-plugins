schema_version: "1.1"
name: rh-window-menu-no-winner
graders:
  - name: tier-labels-span
    type: regex
    pattern: '(?=[\s\S]*(?:\bfamily\b|\bcousins?\b|\b(?:voiced|voiceless|unvoiced)\b))(?=[\s\S]*(?:\b(?:additive|subtractive)\b|\b(?:sound|consonant)s?\s+(?:dropped|added|removed)\b|\b(?:drops?|adds?)\s+(?:a|an|the|one)\s+(?:extra\s+)?(?:sound|consonant)\b|\bextra consonant\b))(?=[\s\S]*(?:\b(?:assonance|consonance)\b|\bvowel[- ](?:match|only)\b|\bsame (?:stressed )?vowel\b))'
    flags: 'i'
    target: last_message
  - name: mosaic-entry
    type: regex
    pattern: '(?<!\bno )(?<!\bnot )\b(?:mosaic|multi-word)\b'
    flags: 'i'
    target: last_message
  - name: eight-plus-candidates
    type: llm
    focus: last_message
    criteria: "The writer asked for rhymes for 'window'. Count the distinct rhyme candidates the reply offers: words or phrases put forward for the writer to use. PASS only if it offers at least eight, however they are laid out: one per list line or table row, several per line or row, or inline and comma-separated. Count each distinct candidate once, and do not judge how well it rhymes. Header rows, bold tier headings and tier labels (such as Family, Additive, Assonance or Mosaic) are not candidates, and neither is a word the reply names only to reject it, for example as an identity; every word or phrase the reply offers counts, even a weak rhyme. FAIL if it offers seven or fewer."
  - name: no-single-winner
    type: llm
    focus: last_message
    criteria: "The writer asked for the single best rhyme for 'window' to end line 4 of a verse. PASS if the reply leaves the choice to the writer: a menu, a choosing guide keyed to feelings or moods, or a plain statement that the pick is theirs, with no single candidate crowned. A guide that maps several moods or endings to options passes, whatever word opens it ('honestly', 'first', 'simple') and however its option numbers are emphasized. FAIL if any part of the reply, even after a full menu or a hedge such as 'if you want one', presents one candidate as the answer: a lone pick on a 'How I'd choose' line with or without its option number, 'my pick is X', 'I'd go with X', 'the best rhyme is X', a Pick or Winner line naming one, or a bold lead naming one candidate, even with a hedge such as 'but only just'. Judge only whether one candidate is crowned; menu size, tiers and labels are graded elsewhere."
