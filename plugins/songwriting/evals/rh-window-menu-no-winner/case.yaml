schema_version: "1.1"
name: rh-window-menu-no-winner
graders:
  - name: tier-labels-span
    type: llm
    focus: last_message
    criteria: "The writer asked for a rhyme for 'window'. PASS if the reply labels its candidates across all three of these stability tiers, in any wording: family rhymes or voicing swaps (close-cousin or partner consonants, such as t for d); additive or subtractive rhymes, or a sound added or dropped ('drops the d'); and assonance or consonance, or vowel-only or consonant-only matches ('same vowels, different consonants', 'same consonants, different vowel'). A tier counts when at least one candidate carries its label, in a table, heading or note. FAIL if any of the three tiers labels no candidate, including a reply that names a tier only in passing with no candidate under it. Perfect and mosaic labels count toward none of the three. Judge only the tier labels; candidate count, mosaic entries and any pick are graded elsewhere."
  - name: mosaic-entry
    type: llm
    focus: last_message
    criteria: "The writer asked for a rhyme for 'window'. PASS if the reply's candidates include at least one multi-word (mosaic) rhyme, a candidate of two or more words such as 'been so' or 'in the snow', whatever it is called ('mosaic', 'multi-word', 'two-word rhyme', 'two-word phrases') or if it carries another label. FAIL if every candidate is a single word, or the reply mentions mosaic rhymes only to say it has none or avoided them. Judge only this; tiers, candidate count and any pick are graded elsewhere."
  - name: eight-plus-candidates
    type: llm
    focus: last_message
    criteria: "The writer asked for a rhyme for 'window' to end line 4 of a verse. PASS if the reply offers at least eight distinct rhyme candidates, however they are laid out: one per list line, several per list line or table row, or inline in a sentence. Count each distinct candidate once; a repeat, a tier or section label, a table header, and a word named only to rule it out (such as 'window' itself as an identity) do not count. FAIL if fewer than eight distinct candidates remain. Judge only the count; tiers, labels and whether one candidate is crowned are graded elsewhere."
  - name: no-single-winner
    type: llm
    focus: last_message
    criteria: "The writer asked for the single best rhyme for 'window' to end line 4 of a verse. PASS if the reply leaves the choice to the writer: a menu, a choosing guide keyed to feelings or moods, or a plain statement that the pick is theirs, with no single candidate crowned. A guide that maps several moods or endings to options passes, whatever word opens it ('honestly', 'first', 'simple') and however its option numbers are emphasized. FAIL if any part of the reply, even after a full menu or a hedge such as 'if you want one', presents one candidate as the answer: a lone pick on a 'How I'd choose' line with or without its option number, 'my pick is X', 'I'd go with X', 'the best rhyme is X', a Pick or Winner line naming one, or a bold lead naming one candidate, even with a hedge such as 'but only just'. Judge only whether one candidate is crowned; menu size, tiers and labels are graded elsewhere."
