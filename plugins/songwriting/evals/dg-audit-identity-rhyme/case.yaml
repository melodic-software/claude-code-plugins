schema_version: "1.1"
name: dg-audit-identity-rhyme
context:
  scaffold_script: scaffold.sh
graders:
  - name: ran-syllable-count
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:datamuse\.sh(?:\\")?\s+syllables\b|\b([A-Za-z_]\w*)=(?:\\"|'')?[^\s"'';\\]*datamuse\.sh(?:[^"\\]|\\.)*?(?:[;&|(]|\\n|\bdo|\bthen)\s*(?:\\")?\$\{?\1\}?(?:\\")?\s+syllables\b)'
    min: 1
  - name: identity-flagged
    type: llm
    focus: last_message
    criteria: "The writer asked for a pre-lock audit of a verse whose line 2 ends on 'delight', paired with 'light' at the end of line 1. PASS if the reply says light / delight is an identity rather than a rhyme, in any wording: calling it an identity, giving the identity check a fail verdict, or explaining that the stressed syllable starts with the same consonant, so the ear hears a repeat, not a rhyme. FAIL if the reply calls the pair a rhyme of any kind, passes it on the identity check, names the check with no verdict, or gives a fail verdict only to another box. Judge only this; the other boxes, the register gate and the tool calls are graded elsewhere."
  - name: box-verdicts
    type: regex
    pattern: '(?:[\s\S]*?(?:\b(?:pass(?:es|ed)?|fail(?:s|ed)?|skip(?:s|ped)?)\b|✅|❌|✓|✗)){3}'
    flags: 'i'
    target: last_message
  - name: register-gate-skipped
    type: regex
    pattern: '\bvoiceprint\b[^\n]{0,80}?(?:(?<!n[''’]t )(?<!not )\bskip(?:s|ped|ping)?|\b(?:can[''’]t|cannot|won[''’]t) (?:judge|rule on|check))\b|\bregister\b[^\n]{0,80}?(?<!n[''’]t )(?<!not )\bskip(?:s|ped|ping)?\b|(?<!n[''’]t )(?<!not )\bskip(?:s|ped|ping)?\b[^\n]{0,80}?\bregister\b'
    flags: 'i'
    target: last_message
