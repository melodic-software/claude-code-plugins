schema_version: "1.1"
name: cw-light-skips-skeptic
description: "co-write's hard gate with the stated reader line verification: light: the skeptic refutation row is skipped by name as verification: skipped (light), no skeptic subagent is planned, and the rubric row still runs."
tags: [songwriting, co-write, verification-level, read-only]
plugins: ["../.."]
expected_outcome: "Lists the hard-gate rows for the next candidate batch, keeps the rubric row as run, names the skeptic row skipped as verification: skipped (light), and plans no skeptic subagent and no self-refutation in its place."
execution:
  prompt: "/songwriting:co-write Before you write any candidate for the chorus hook of my song about leaving a small town, list each hard-gate row you will run or skip for the first candidate batch, with the reason for any skip, then stop. Do not write a candidate yet. [The level reader has already been run for this case and printed `verification: light (docs/conventions/songwriting.yaml verification at origin/main)`; this run uses that line and does not run the reader again.]"
  allowed_tools: [Skill, Read, Glob, Grep]
  max_turns: 12
  timeout_seconds: 300
graders:
  - name: writes-skip-token
    type: regex
    pattern: 'verification[*_`\\]*:[*_`\s\\]*skipped \(light\)'
    flags: 'i'
    target: last_message
  - name: no-subagent-dispatched
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: rubric-kept-skeptic-skipped
    type: llm
    criteria: "PASS only if the reply keeps the rubric row as run and names the skeptic refutation row as skipped because of the light verification level, with no plan to dispatch a skeptic or to refute the batch itself in its place. FAIL if it plans a skeptic, or skips the rubric row."
