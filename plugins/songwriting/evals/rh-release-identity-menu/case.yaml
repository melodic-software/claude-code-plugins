schema_version: "1.1"
name: rh-release-identity-menu
graders:
  - name: identity-flagged
    type: regex
    pattern: '\bidentit(?:y|ies)\b[^\n]{0,80}?(?:\bfail(?:s|ed)?\b|✗|❌|\breject(?:s|ed)?\b|\b(?:not|isn[''’]t|aren[''’]t)\s+(?:a\s+)?(?:true\s+|real\s+)?rhymes?\b)|(?:\bfail(?:s|ed)?\b|✗|❌)[^\n]{0,60}?\bidentit(?:y|ies)\b|\b(?:is|are|it[''’]s|that[''’]s|they[''’]re)\s+(?:an\s+)?identit(?:y|ies)\b(?!\s+check)'
    flags: 'i'
    target: last_message
  - name: eight-plus-candidates
    type: llm
    focus: last_message
    criteria: "The writer asked for rhymes for 'release'. Count the distinct rhyme candidates the reply offers: words or phrases put forward for the writer to use. PASS only if it offers at least eight, however they are laid out: one per list line or table row, several per line or row, or inline and comma-separated. Count each distinct candidate once, and do not judge how well it rhymes. Header rows, bold tier headings and tier labels (such as Perfect, Family, Additive or Mosaic) are not candidates, and neither is a word the reply names only to reject it, as an identity such as 'police' or 'lease'; every word or phrase the reply offers counts, even a weak rhyme. FAIL if it offers seven or fewer."
  - name: no-single-winner
    type: llm
    focus: last_message
    criteria: "The writer offered 'police' or 'lease' to end a chorus line rhyming with 'release' and asked for one to be picked. PASS if the reply leaves the choice to the writer: a menu, a choosing guide keyed to feelings or moods, or a plain statement that the pick is theirs, with no single candidate crowned. A guide that maps several moods to options passes, whatever word opens it ('honestly', 'first', 'simple') and however its option numbers are emphasized. Declining both of the writer's options ('neither') is not a pick. FAIL if any part of the reply, even after a full menu, a hedge, or a 'neither', presents one candidate as the answer: a lone pick on a 'How I'd choose' line with or without its option number, 'my pick is X', 'I'd go with X', 'the answer is X', a Pick or Winner line naming one, or a bold lead naming one, as in naming police or lease as the better one even with a hedge such as 'but only just'. Judge only whether one candidate is crowned; whether police and lease are identities, and menu size and labels, are graded elsewhere."
  - name: no-identity-candidate
    type: llm
    focus: last_message
    criteria: "The writer asked whether 'police' or 'lease' is the better rhyme for 'release'. Both are identities of 'release', not rhymes: the stressed syllable keeps the same l before the same vowel. PASS only if the reply offers neither 'police' nor 'lease' as a usable rhyme candidate; naming them to reject them, or listing them under a rejected or identity heading, is fine. FAIL if either is presented as a candidate the writer could use, or as the better of the two."
