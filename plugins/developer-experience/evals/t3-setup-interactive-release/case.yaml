schema_version: "1.1"
name: t3-setup-interactive-release
context:
  scaffold_script: scaffold.sh
graders:
  - name: conventions-reach-agents
    type: regex
    pattern: '`(?!(?:\./)?(?:scripts/)?(?:AGENTS|CLAUDE|README)\.md`)[\w./-]+\.md`|^#{1,6}[ \t][^\n]*\b(?:conventions?|tooling|tools)\b[^\n]*\n(?:[ \t]*\n)*[ \t]*[-*] \S'
    flags: mi
    target: { source: file, path: AGENTS.md }
  - name: agents-lines-kept
    type: regex
    pattern: '^# brackenfold$[\s\S]*?^Python 3 package `bfk` \(standard library only\): `bfk/cli\.py` is the `bfk` command, `data/accounts\.jsonl`$[\s\S]*?^is the account store, `tests/` holds `unittest` cases\.$[\s\S]*?^## Build and test$[\s\S]*?^- Test: `make test` \(runs `scripts/run_tests\.sh`\)\.$[\s\S]*?^- Run the CLI: `python3 -m bfk\.cli <command>`\.$'
    flags: m
    target: { source: file, path: AGENTS.md }
  - name: one-pointer-line
    type: regex
    pattern: '^- Before creating, changing or cleaning up CLIs, scripts or other developer tools, read `docs/conventions/developer-experience\.md`\. Use /developer-experience:build-cli to create a tool or change its interface, and /developer-experience:audit-tools to take stock of or clean up tools; a bug fix inside one needs neither\.$'
    flags: m
    match: "count:1"
    target: { source: file, path: AGENTS.md }
    arm: with-only
