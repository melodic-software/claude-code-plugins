schema_version: "1.1"
name: sh-per-item-macro-map-routes-work
graders:
  - name: 'rollup-4-of-7'
    type: 'regex'
    pattern: '\b4[\s*_`]{0,4}(?:/|of|out of)[\s*_`]{0,4}7\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:ship session does with the stated state. PASS only if it satisfies every point: (1) Reads the container''s identity, sub-item rollup, and container-scoped frontier through seam verbs (get-item, list-sub-items, list-frontier --parent); (2) Obtains the container''s Brief text through a provider-mechanic read (e.g. gh issue view --json body), NOT by expecting a body field in get-item''s output; (3) Reports the closed/total rollup (4/7) and the workable frontier (the two open, unblocked items, with one blocked) as a compact macro map; (4) States the per-item-PRs discipline: separate branch per item from the default branch, per-item PR closes the item, seam claim as the collision signal between parallel items; (5) Routes execution to /work-items:work (or, for the several ready items, /work-items:ship run #300) instead of claiming or executing an item itself; (6) Performs no tracker mutation. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
