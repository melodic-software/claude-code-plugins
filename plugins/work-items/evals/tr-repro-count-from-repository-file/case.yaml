schema_version: "1.1"
name: tr-repro-count-from-repository-file
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'reads-through-parser'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'parse-concern-value\.sh[^\n]*work-items\.yaml[^\n]*triage_repro_count'
    min: 1
  - name: 'settings-repro'
    type: 'regex'
    pattern: 'triage_repro_count=`?4`?[ \t]*\(repository\b'
    target: 'last_message'
  - name: 'settings-window'
    type: 'regex'
    pattern: 'triage_objection_window_hours=`?0`?[ \t]*\(default\b'
    target: 'last_message'
  - name: 'ran-repro'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '\bpython3?\b[^\n;|&]*\bweek\.py\b'
    min: 1
  - name: 'reproduced-4-of-4'
    type: 'regex'
    pattern: '\bReproduced\**[ \t]+4[ \t]+of[ \t]+4\b'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply and the trace as the account of what /work-items:triage did for #211. PASS only if it satisfies every point: (1) Reads the repository value through the bundled parse-concern-value.sh rather than reading the YAML by eye; (2) Reports triage_repro_count=4 with layer repository; (3) Reports triage_objection_window_hours=0 with layer default; (4) Requires four separate reproductions before confirming the bug. A point counts only when the reply states it or the trace plainly shows it; it need not use the same words. FAIL if any point is missing or contradicted.'
    focus: 'trace'
