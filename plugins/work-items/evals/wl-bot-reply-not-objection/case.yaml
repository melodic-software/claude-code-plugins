schema_version: "1.1"
name: wl-bot-reply-not-objection
graders:
  - name: 'no-objection-escalation'
    type: 'regex'
    pattern: '(?<![\s\S])(?![\s\S]*(?<!\bno )(?<!\bno `)(?<!\bnot )(?<!\bnot `)(?<!\bwithout )(?<!\bwithout `)objection:[\s*_`]{0,6}#?304\b\W{0,4}(?:->|→)\W{0,4}escalated)(?=[\s\S]*#304\b)'
    flags: 'im'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Does not treat the dependabot[bot] comment as an objection; (2) Does not treat the Bot-type account''s comment as an objection; (3) Admits and dispatches #304 since its window is over; (4) Posts no escalation marker for #304. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
