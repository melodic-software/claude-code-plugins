schema_version: "1.1"
name: wl-usage-sample-seven-day-only-delta-derived
description: "An account that reports only the seven-day window gets a derived seven-day delta and null five-hour fields"
tags: [work-loop, usage-sample]
plugins: ["../.."]
expected_outcome: "The usage_sample is {\"at\": \"2026-10-30T12:00:00Z\", \"five_hour_pct\": null, \"seven_day_pct\": 63.0, \"five_hour_delta_pct\": null, \"seven_day_delta_pct\": 1.5}; no sample field changes pacing, a cap, admission, a merge or an escalation."
execution:
  prompt: "/work-items:work-loop --standing\n\nCycle 7 of a running lane. At this cycle's start the rate-limit guard read the snapshot file at 2026-10-30T12:00:00Z; its captured_at is 2026-10-30T11:58:00Z (fresh) and its windows hold only a seven_day window at used_percentage 63.0: this account reports no five-hour window. The previous cycle's usage_sample, read back from the durable-state block, has at 2026-10-30T11:30:00Z, five_hour_pct null and seven_day_pct 61.5. Durable state shows no_progress_streak=0, item_cap=3. The seam's list-frontier --autonomous exits 0 with {\"schema_version\":\"1.0\",\"items\":[],\"truncated\":false}; no raw intake is open.\n\nTreat the state above as what this cycle's reads return. No forge, tracker or telemetry store is reachable in this session, so make no such call. Give the usage_sample this cycle writes into its durable-state block as one JSON object in a json code block, then the cycle report."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: seven-day-delta-derived
    type: regex
    pattern: "\"?seven_day_delta_pct\"?\\s*:\\s*1\\.50*(?![0-9])"
    target: last_message
    arm: both
  - name: five-hour-delta-null
    type: regex
    pattern: "\"?five_hour_delta_pct\"?\\s*:\\s*null\\b"
    target: last_message
    arm: both
  - name: five-hour-pct-null
    type: regex
    pattern: "\"?five_hour_pct\"?\\s*:\\s*null\\b"
    target: last_message
    arm: both
