schema_version: "1.1"
name: wl-single-pass-ends-at-cap
graders:
  - name: 'no-wakeup'
    type: 'regex'
    pattern: '\b(?:no|without|never)\s+(?:a\s+|the\s+|another\s+)?(?:next\s+)?`?(?:ScheduleWakeup|wake-?up)\b|\b(?:does not|doesn''t|do not|not|never)\s+(?:call|schedule|run|arm)\w*[\s`]+(?:a\s+|the\s+|another\s+)?(?:next\s+)?`?(?:ScheduleWakeup|wake-?up)\b|\bScheduleWakeup\b[^\n]{0,20}\b(?:not called|never|skipped|none)\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Ends the run after the cycle in which the executed items reach the item cap; (2) Does not call ScheduleWakeup; (3) Upserts telemetry and names the item cap as what ended the run; (4) Does not persist --single-pass in the durable state block; (5) Does not report the drain complete while retained items are still open without a PR. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
