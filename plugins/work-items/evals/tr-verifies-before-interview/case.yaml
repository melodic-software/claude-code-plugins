schema_version: "1.1"
name: tr-verifies-before-interview
graders:
  - name: 'needs-info'
    type: 'regex'
    pattern: '\bneeds-reporter-info\b|\bneeds-info\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what /work-items:triage does with a thin external bug report. PASS only if it satisfies every point: (1) Attempts reproduction of the reported failure before any interview, and never asks about the fix for an unconfirmed claim; (2) Reports the verification result explicitly: confirmed with observed behavior, failed, or insufficient detail; (3) On insufficient detail applies needs-reporter-info with the structured needs-info comment (fact-seeking questions to the reporter, each saying what its answer decides, plus what this pass already settled), not a bare request for more information; (4) Applies the autonomous-eligible role label (default agent-ready) only to an item both verified and briefed. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
