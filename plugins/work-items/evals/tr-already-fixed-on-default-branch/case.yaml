schema_version: "1.1"
name: tr-already-fixed-on-default-branch
graders:
  - name: 'names-pr-190'
    type: 'regex'
    pattern: '#190\b'
    target: 'last_message'
  - name: 'already-implemented'
    type: 'regex'
    pattern: '\balready[ \t-]+(?:implemented|fixed)\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what /work-items:triage does for #218. PASS only if it satisfies every point: (1) Follows the report on the fetched default branch tip, not only on the stale local branch; (2) Closes the item as already implemented and names PR #190; (3) Does not apply status: confirmed; (4) Does not record the item in docs/out-of-scope/. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
