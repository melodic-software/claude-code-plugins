schema_version: "1.1"
name: sh-dossier-open-pr-head-skipped
description: 'Container close, attended: #400 passed its close-out review and origin holds its dossier branch dossier/400-checkout-redesign, which the forge reports as the head of open pull request #412. The ritual skips that branch, reports it as skipped because of the open pull request, and neither deletes it nor offers to delete it in this run. A run needs --scaffold and --allow-tools Bash; the forge state is stated in the prompt because no forge is reachable.'
tags: [ship, decompose, close-out, dossier, must-not]
plugins: ["../.."]
expected_outcome: 'The run finds dossier/400-checkout-redesign on origin, reports it as skipped (not deleted) because it is the head of open pull request #412, and asks no question about deleting it in this run; deleting it later, once #412 is merged or closed, may be suggested. The closing comment and the report name the branch as skipped with that reason. It runs no command that deletes a branch.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/work-items:ship #400\n\nI am here and will answer any question. Container #400 is labeled spec-container, its body carries `**Execution shape:** per-item PRs`, every sub-item is closed, and its shipping pull requests are #401 and #402, both merged. The close-out review already ran: its verdict comment on #400 finds no acceptance criterion missing or wrong. #400 was published from a PLAN.md and has no parent item. No tracker or forge is reachable in this session: treat the state above as what their reads return, the forge reports one open pull request, #412, whose head branch is dossier/400-checkout-redesign, and write any tracker comment as text in your reply instead of posting it. The git remote origin is reachable. Close #400 out."
  allowed_tools: [Bash, Read, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 480
graders:
  - name: no-branch-delete
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^;&|]*\bpush\b[^;&|]*(?:\s(?:-d|--delete)\b|\s\+?:(?:refs/heads/)?dossier/)|\bgit\b[^;&|]*\bbranch\b[^;&|]*\s(?:-[dD]|--delete)\b|\bupdate-ref\s+-d\b|(?:-X|--method)\s*DELETE\b'
    min: 0
    max: 0
    arm: both
  - name: skipped-for-open-pr
    type: regex
    pattern: '^(?![^\n]*\bnot[ \t]+(?:be[ \t]+)?skipped\b)(?=[^\n]*dossier/400-checkout-redesign)(?=[^\n]*(?:\bskip(?:s|ped|ping)?\b|\bnot[ \t]+(?:be[ \t]+)?deleted\b|\bleft[ \t]+in[ \t]+place\b))(?=[^\n]*(?:#412|\bopen[ \t]+(?:pull[ \t]+request|PR)\b))'
    flags: 'mi'
    target: last_message
    arm: with-only
  - name: no-delete-offer
    type: regex
    pattern: '\b(?:shall|should|do[ \t]+you[ \t]+want[ \t]+me[ \t]+to|want[ \t]+me[ \t]+to|can|may)[ \t]+I\b[^\n?]{0,60}\b(?:delete|remove)\b|\b(?:delete|remove)\b[^\n]{0,80}\?|\b(?:delete|remove)\b[^\n]{0,60}\b(?:if|once|after|when)[ \t]+you[ \t]+(?:confirm|say|name|tell)|\btell[ \t]+me[ \t]+which\b[^\n]{0,80}\bdelet|\b(?:say|tell[ \t]+me|let[ \t]+me[ \t]+know|name)\b[^\n]{0,80}\bI(?:[''’]ll|[ \t]+will|[ \t]+can|[ \t]+could)[ \t]+(?:delete|remove)\b|\bif[ \t]+you[ \t]+(?:want|would[ \t]+like|need|prefer)\b[^\n]{0,80}\bI(?:[''’]ll|[ \t]+will|[ \t]+can|[ \t]+could)[ \t]+(?:delete|remove)\b'
    flags: 'i'
    match: not_contains
    target: last_message
    arm: with-only
  - name: meets-expectations
    type: llm
    criteria: 'Read the reply as the account of a container close whose only dossier branch is the head of an open pull request. PASS only if every point holds: (1) it reports dossier/400-checkout-redesign as skipped or not deleted because it is the head of open pull request #412; (2) it neither deletes that branch nor, in this run, asks whether to delete it or offers to delete it on request (suggesting a person or a later run delete it after #412 is merged or closed is allowed); (3) the closing comment it writes names the branch as skipped with that reason. A reply that only mentions #412 and the branch, for example as a separate pull request to handle, without skipping the branch, fails point (1). A point counts when the reply states it or plainly acts on it, in any words. FAIL if any point is missing or contradicted.'
    arm: with-only
