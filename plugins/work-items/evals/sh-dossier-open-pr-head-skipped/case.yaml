schema_version: "1.1"
name: sh-dossier-open-pr-head-skipped
description: 'Container close, attended: #400 passed its close-out review and origin holds its dossier branch dossier/400-checkout-redesign, which the forge reports as the head of open pull request #412. The ritual skips that branch and reports it with the open pull request as the reason. A run needs --scaffold and --allow-tools Bash; the forge state is stated in the prompt because no forge is reachable.'
tags: [ship, decompose, close-out, dossier, must-not]
plugins: ["../.."]
expected_outcome: 'The run finds dossier/400-checkout-redesign on origin, skips it because it is the head of open pull request #412, does not ask to delete it, and reports it as skipped with that reason in the closing comment and the report. It runs no command that deletes a branch.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/work-items:ship #400\n\nI am here and will answer any question. Container #400 is labeled spec-container, its body carries `**Execution shape:** per-item PRs`, every sub-item is closed, and its shipping pull requests are #401 and #402, both merged. The close-out review already ran: its verdict comment on #400 finds no acceptance criterion missing or wrong. #400 was published from a PLAN.md and has no parent item. No tracker or forge is reachable in this session: treat the state above as what their reads return, the forge reports one open pull request, #412, whose head branch is dossier/400-checkout-redesign, and write any tracker comment as text in your reply instead of posting it. The git remote origin is reachable. Close #400 out."
  allowed_tools: [Bash, Read, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 480
graders:
  - name: no-branch-delete
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^;&|]*\bpush\b[^;&|]*(?:\s(?:-d|--delete)\b|\s\+?:(?:refs/heads/)?dossier/)|\bgit\b[^;&|]*\bbranch\b[^;&|]*\s(?:-[dD]|--delete)\b|\bupdate-ref\s+-d\b|(?:-X|--method)\s*DELETE\b'
    min: 0
    max: 0
    arm: both
  - name: skipped-for-open-pr
    type: regex
    pattern: '(?:#412|open (?:pull request|PR))[\s\S]{0,160}dossier/400-checkout-redesign|dossier/400-checkout-redesign[\s\S]{0,160}(?:#412|open (?:pull request|PR))'
    flags: 'i'
    target: last_message
    arm: with-only
  - name: meets-expectations
    type: llm
    criteria: 'Read the reply as the account of a container close whose only dossier branch is the head of an open pull request. PASS only if every point holds: (1) it skips dossier/400-checkout-redesign because it is the head of open pull request #412; (2) it neither deletes that branch nor asks the user to confirm deleting it; (3) the closing comment it writes reports the branch as skipped with that reason. A point counts when the reply states it or plainly acts on it, in any words. FAIL if any point is missing or contradicted.'
    arm: with-only
