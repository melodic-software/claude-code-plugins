schema_version: "1.1"
name: wl-babysit-keyword-rejected
description: 'Argument fail-closed gate: /work-items:work-loop launched with the babysit tier keyword autopilot stops before telemetry or cycle work with a message that rejects the token and names /source-control:babysit-loop as its owner. No triage, no work invocation, no tracker or telemetry call, no wakeup. A run needs --scaffold and --allow-tools Bash,Write.'
tags: [work-loop, argv-gate, must-not, routing]
plugins: ["../.."]
expected_outcome: 'The run validates its invocation tokens first, rejects autopilot as a babysit tier keyword that belongs to /source-control:babysit-loop rather than silently ignoring it, and stops. It invokes neither /work-items:triage nor /work-items:work, runs no tracker, telemetry or push script, writes no file, and schedules no next cycle.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/work-items:work-loop autopilot --drain'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, ScheduleWakeup]
  max_turns: 12
  timeout_seconds: 300
graders:
  - name: rejects-and-names-owner
    type: regex
    pattern: '^(?![\s\S]*\b(?:do not|don''t|never|no need to)\s+(?:use|run|launch|invoke)\s+`?/?(?:source-control:)?babysit-loop)(?![\s\S]*\b(?:ignore|ignored|ignoring|skipped|skipping)\b[^\n]*\bautopilot\b[^\n]*\b(?:and|then)\s+(?:start|run|began|launch)\w*)(?=[\s\S]*\bautopilot\b)(?=[\s\S]*source-control:babysit-loop)(?=[\s\S]*\b(?:reject(?:ed|ing|s)?|refuse[sd]?|refusing|stop(?:ped|ping)?|not (?:a )?(?:valid|recogni[sz]ed|supported|accepted|a work-loop)|unknown|belongs? to|owned by|(?:does not|doesn''t) (?:accept|take)|cannot|can''t|will not|won''t)\b)'
    flags: 'i'
    target: last_message
    arm: with-only
  - name: no-cycle-skill
    type: tool_used
    tool: Skill
    input_match: 'work-items:(?:triage|work)(?![\w-])'
    min: 0
    max: 0
    arm: both
  - name: no-tracker-or-telemetry
    type: tool_used
    tool: Bash
    input_match: 'work-item-tracker\.sh|lane-telemetry-upsert|lane-push\.sh|first-drain-ratified|rule-admit\.sh|\bgh[ \t]+(?:issue|api|pr|label)\b'
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-wakeup
    type: tool_used
    tool: ScheduleWakeup
    min: 0
    max: 0
    arm: both
