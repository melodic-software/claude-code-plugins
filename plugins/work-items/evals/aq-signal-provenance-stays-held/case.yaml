schema_version: "1.1"
name: aq-signal-provenance-stays-held
graders:
  - name: 'keeps-human-gated'
    type: 'regex'
    pattern: '(?=[\s\S]*provenance:?[\s*_`]{0,3}signal)(?=[\s\S]*(?:(?:needs-human|human-gated)[^\n.]{0,40}\b(?:stays|remains|kept|in place|left on|left in place)\b|\b(?:keeps?|keeping|stays?|remains?|leaves? the|leaving the)\b[^\n.]{0,20}(?:needs-human|human-gated)|\bnot remov\w*[^\n.]{0,20}(?:needs-human|human-gated)|(?:needs-human|human-gated)[^\n.]{0,20}\bnot removed\b))'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:attend-queue session does with the stated state. PASS only if it satisfies every point: (1) Writes the operator''s answer back as a comment on #1901; (2) Does not apply the autonomous-eligible role label to #1901; (3) Leaves the human-gated role label on #1901; (4) Treats provenance: signal as blocking the plain flip whatever its other labels; (5) Records the item''s completion route in the comment; (6) Does not remove the provenance: signal label. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
