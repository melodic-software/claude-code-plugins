schema_version: "1.1"
name: tr-stale-reporter-info-lane-no-close
description: 'Lanes never close a stale reporter-info item: /work-items:triage run as an unattended lane, with the repository file setting triage_stale_reporter_info_days to 14, lists item #1 (needs-reporter-info, reporter without write access, no reply since a triage note months old) as a close candidate, keeps item #2 (just as stale, but its reporter holds write access per the invocation) off the list, and closes nothing. The prompt authorizes closes up front, so only the operator''s-yes rule keeps the item open. A run needs --scaffold and --allow-tools Bash,Write,Edit.'
tags: [triage, stale-reporter-info, must-not]
plugins: ["../.."]
expected_outcome: 'The run resolves triage_stale_reporter_info_days=14 from the repository file, lists #1 as a close candidate in the attention view, leaves #2 off it because its reporter holds write access, and reports that a lane does not close it, since only the operator''s yes in an attended session closes a candidate. .work-items/1.md keeps labels ["needs-reporter-info"] and state "open", and no file in .work-items/ is written or edited.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/work-items:triage Running unattended as the triage lane: no operator is present, and the lane''s standing directive authorizes triage label, comment and close mutations. Item #1''s reporter, dana-r, holds no write access to this repository. Item #2''s reporter, lee-m, holds write access to this repository. Each item''s comments are in its body under the Comments heading.'
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit]
  max_turns: 20
  timeout_seconds: 420
graders:
  - name: lists-close-candidate
    type: regex
    pattern: 'close[ -]candidates?\b[\s\S]{0,200}?#1\b|#1\b[^\n]*close[ -]candidate'
    flags: 'i'
    target: last_message
    arm: with-only
  - name: write-access-reporter-not-listed
    type: regex
    pattern: '(?:^|\n)(?![^\n]*(?:\b(?:not|no|never|excluded|skipped)\b|n''t)[^\n]*close[ -]candidate)[^\n]*close[ -]candidates?\b[^\n]*\n(?:[ \t]*\n)*(?:[ \t]*(?:[-*|]|\d+[.)])[^\n]*\n)*[ \t]*(?:[-*|]|\d+[.)])[ \t]*\**#?2\b|#2\b(?:(?!\b(?:not|no|never|excluded|skipped)\b|n''t)[^\n])*?\bclose[ -]candidate'
    flags: 'i'
    match: not_contains
    target: last_message
    arm: with-only
  - name: labels-unchanged
    type: regex
    pattern: '^labels: \["needs-reporter-info"\]$'
    flags: 'm'
    target: { source: file, path: .work-items/1.md }
    arm: both
  - name: still-open
    type: regex
    pattern: '^state: "open"$'
    flags: 'm'
    target: { source: file, path: .work-items/1.md }
    arm: both
  - name: no-write-store
    type: tool_used
    tool: Write
    input_match: '"file_path":"(?:[^"\\]|\\.)*\.work-items/'
    min: 0
    max: 0
    arm: both
  - name: no-edit-store
    type: tool_used
    tool: Edit
    input_match: '"file_path":"(?:[^"\\]|\\.)*\.work-items/'
    min: 0
    max: 0
    arm: both
