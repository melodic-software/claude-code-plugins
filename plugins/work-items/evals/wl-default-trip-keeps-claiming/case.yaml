schema_version: "1.1"
name: wl-default-trip-keeps-claiming
graders:
  - name: 'three-options'
    type: 'regex'
    pattern: '(?=[\s\S]*\b(?:continue|continues|continued|continuing))(?=[\s\S]*\bswitch\w*\s+(?:the\s+)?accounts?\b)(?=[\s\S]*(?:LOOP_LANE_RATE_LIMIT_PAUSE=1|\bopt(?:-|\s)?in\s+to\s+paus\w*))'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Reads the pause opt-in from its own environment rather than assuming it, and finds it unset; (2) Clears the legacy rate_limit_latch, paused_until and latched_account together at cycle start and sets no new latch; (3) Keeps claiming and dispatching the admitted items under its normal cap without lowering model, effort or review depth; (4) Reports the seven-day window, its used_percentage and its resets_at; (5) Names the options: continue, switch accounts (an operator action the lane never performs), or opt in to pausing. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
