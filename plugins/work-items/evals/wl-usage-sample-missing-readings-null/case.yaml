schema_version: "1.1"
name: wl-usage-sample-missing-readings-null
description: "A stale snapshot leaves both window readings and both deltas null, never a carried-forward value"
tags: [work-loop, usage-sample]
plugins: ["../.."]
expected_outcome: "The usage_sample is {\"at\": \"2026-10-30T14:00:00Z\", \"five_hour_pct\": null, \"seven_day_pct\": null, \"five_hour_delta_pct\": null, \"seven_day_delta_pct\": null}; no sample field changes pacing, a cap, admission, a merge or an escalation."
execution:
  prompt: "/work-items:work-loop --standing\n\nCycle 12 of a running lane. At this cycle's start the rate-limit guard read the snapshot file at 2026-10-30T14:00:00Z; its captured_at is 2026-10-30T13:35:00Z, 25 minutes old, and it holds five_hour used_percentage 34.0 and seven_day used_percentage 52.0. The previous cycle's usage_sample, read back from the durable-state block, has at 2026-10-30T13:30:00Z, five_hour_pct 30.0 and seven_day_pct 50.0. Durable state shows no_progress_streak=0, item_cap=3. The seam's list-frontier --autonomous exits 0 with {\"schema_version\":\"1.0\",\"items\":[],\"truncated\":false}; no raw intake is open.\n\nTreat the state above as what this cycle's reads return. No forge, tracker or telemetry store is reachable in this session, so make no such call. Give the usage_sample this cycle writes into its durable-state block as one JSON object in a json code block, then the cycle report."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: seven-day-delta-null
    type: regex
    pattern: "\"?seven_day_delta_pct\"?\\s*:\\s*null\\b"
    target: last_message
    arm: both
  - name: five-hour-delta-null
    type: regex
    pattern: "\"?five_hour_delta_pct\"?\\s*:\\s*null\\b"
    target: last_message
    arm: both
  - name: seven-day-pct-null
    type: regex
    pattern: "\"?seven_day_pct\"?\\s*:\\s*null\\b"
    target: last_message
    arm: both
