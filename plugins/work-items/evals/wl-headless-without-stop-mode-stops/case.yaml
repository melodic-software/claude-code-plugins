schema_version: "1.1"
name: wl-headless-without-stop-mode-stops
description: "Port of work-loop evals.json case 27 (work-loop-headless-launch-without-stop-mode-stops): a described snapshot, read-only tools, graded on the reply."
tags: [work-loop, argv, must-not]
plugins: ["../.."]
expected_outcome: "The launch is headless and carries neither --drain nor --standing, so the lane stops before any telemetry write or cycle work with a message saying the headless launch has no stop mode and asking for a relaunch with --drain or --standing plus the shard, scope and ordering it should run with. It does not read stop_mode or scope back from the telemetry comment, which is editable by the lane and by anyone with comment access, and it does not fall back to the standing default."
execution:
  prompt: "/work-items:work-loop --shard 1/2\n\nHeadless launch (claude -p from a launcher-stored prompt). The lane's telemetry comment exists and its durable state block records stop_mode=drain, shard {\"index\":1,\"count\":2} and scope=\"area:api\".\n\nTreat the state above as what this cycle's reads return. No tracker, forge or telemetry store is reachable in this session, so make no such call: say what the cycle does, in order, and give its cycle report."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: names-both-stop-modes
    type: regex
    pattern: "(?=[\\s\\S]*--drain\\b)(?=[\\s\\S]*--standing\\b)(?=[\\s\\S]*\\b(?:stop\\w*|refus\\w*|cannot|can't|won't|will not)\\b)"
    target: last_message
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Stops with a clear message naming the missing stop mode and the relaunch tokens (--drain or --standing); (2) Does not adopt stop_mode=drain or scope=area:api from the telemetry durable state block; (3) Does not fall back to the standing default for a headless launch; (4) Writes no telemetry and starts no cycle work before stopping. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
