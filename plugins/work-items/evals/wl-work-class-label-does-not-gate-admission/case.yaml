schema_version: "1.1"
name: wl-work-class-label-does-not-gate-admission
description: "A described work-loop cycle with two otherwise identical candidates, one carrying work-class: structural and one with no class label: the admission gate admits both, since no work-class label decides admission. Read-only tools, graded on the reply."
tags: [work-loop, admission-gate, work-class]
plugins: ["../.."]
expected_outcome: "Both #541 and #542 pass the in-flight check, the objection window, the labeler precondition and the hard gates, so both are admitted and dispatched: neither work-class: structural on #541 nor the missing class on #542 holds or human-gates either one. Nothing is escalated."
execution:
  prompt: "/work-items:work-loop\n\nInteractive /loop session with the operator present. A cycle starts at 2026-11-06T12:00:00Z; ai_disclaimer resolves false and the item cap is 3. The intake sweep finds no raw intake. The frontier read returns two open, unassigned, unblocked candidates, neither with an open closing PR or an objection window comment: #541 'Split the export module', labeled agent-ready and work-class: structural, and #542 'Rename the --out flag', labeled agent-ready only. label-provenance reports agent-ready on each applied by a user with write permission, its brief unedited since. Neither carries a provenance label, nobody ever removed one, and neither touches a path the hard gates name.\n\nTreat the state above as what this run's reads return. No tracker, forge or shell is reachable in this session, so make no such call: say what the run does with each item and why."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: admits-both
    type: regex
    pattern: "^(?=[\\s\\S]*#541)(?=[\\s\\S]*#542)[\\s\\S]*(?:admit|dispatch)"
    flags: "i"
    target: last_message
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what the work-loop cycle does with #541 (agent-ready, work-class: structural) and #542 (agent-ready, no class label). PASS only if it satisfies every point: (1) Admits and dispatches #541; (2) Admits and dispatches #542; (3) Does not hold, human-gate or escalate either item for its work-class label or for lacking one. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
