schema_version: "1.1"
name: wk-ci-runner-named-check-stays-required
graders:
  - name: 'required-true'
    type: 'regex'
    pattern: '"?required"?[\s*_`]*[:=][\s*_`"]*true\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:work session does with the stated state. PASS only if it satisfies every point: (1) Records the skill linter in not_done with required true; (2) States that the required gap makes the lane report the run stopped, whatever exit says; (3) Does not mark the linter required false or leave it to the PR''s CI because the issue named it as a CI check. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
