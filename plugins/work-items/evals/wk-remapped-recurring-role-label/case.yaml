schema_version: "1.1"
name: wk-remapped-recurring-role-label
graders:
  - name: 'label-scheduled-upkeep'
    type: 'regex'
    pattern: '--label[ =]\W{0,2}scheduled-upkeep\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:work session does with the stated state. PASS only if it satisfies every point: (1) Resolves the recurring-maintenance label before any tracker read; (2) Excludes items carrying scheduled-upkeep from the non-recurring frontier tiers; (3) Uses --label scheduled-upkeep when cross-referencing recurring candidates; (4) Does not fall back to the recurring literal after the remap. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
