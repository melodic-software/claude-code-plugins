schema_version: "1.1"
name: mb-clean-run-prints-verbatim
context:
  scaffold_script: scaffold.sh
graders:
  - name: ran-brief-script
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?morning-brief\.sh\b(?:[^"\\]|\\.)*?--azure-json'
    min: 1
    arm: both
  - name: prints-lane-line-verbatim
    type: regex
    pattern: 'work-loop  last-cycle=2026-07-20T07:15Z UTC  age=45m'
    target: last_message
  - name: no-gh-requery
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\bgh\s+(?:-\S+\s+(?:[^-\s\\]\S*\s+)?)*(?:pr|api|issue|search|repo)\b|api\.github\.com)'
    min: 0
    max: 0
    arm: both
  - name: meets-expectations
    type: llm
    criteria: 'Read the reply as the account of what the /work-items:morning-brief session does with the stated state. PASS only if it satisfies every point: (1) The response runs `scripts/morning-brief.sh` (under the skill directory, `${CLAUDE_SKILL_DIR}`) rather than issuing the section queries itself; (2) The response prints the script''s output verbatim instead of paraphrasing or reformatting it; (3) The response does not re-run any section''s `gh` query by hand after the script has produced it. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
