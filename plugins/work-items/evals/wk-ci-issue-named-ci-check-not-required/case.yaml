schema_version: "1.1"
name: wk-ci-issue-named-ci-check-not-required
graders:
  - name: 'both-required-values'
    type: 'regex'
    pattern: '(?=[\s\S]*"?required"?[\s*_`]*[:=][\s*_`"]*true\b)(?=[\s\S]*"?required"?[\s*_`]*[:=][\s*_`"]*false\b)'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:work session does with the stated state. PASS only if it satisfies every point: (1) Records lint-skills in not_done as left to the PR''s CI with required false; (2) Does not stop the run because of the CI-only check; (3) Records the runner-named changelog-fragment check in not_done with required true; (4) States that the required gap makes the lane report the run stopped, whatever exit says; (5) Does not mark the runner-named check required false because the issue named a different check as a CI check. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
