schema_version: "1.1"
name: wl-foreign-window-marker-ignored
graders:
  - name: 'no-window-line'
    type: 'regex'
    pattern: '^(?![\s\S]*objection window open:[\s*_`]{0,6}#?303\b)(?=[\s\S]*#303\b)'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Ignores the window marker because its author is not the write identity; (2) Admits #303 through the rest of the admission gate; (3) Does not list #303 as objection window open. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
