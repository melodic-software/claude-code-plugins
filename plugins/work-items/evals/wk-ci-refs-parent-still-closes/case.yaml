schema_version: "1.1"
name: wk-ci-refs-parent-still-closes
graders:
  - name: 'remaining-empty'
    type: 'regex'
    pattern: '"?remaining"?[\s*_`]*[:=][\s*_`]*\[\s*\]'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:work session does with the stated state. PASS only if it satisfies every point: (1) Writes remaining as an empty array, so the PR closes issue 612; (2) Does not treat the issue''s own Refs: #580 line as a reason to keep the issue open; (3) Does not invent a separate link field to choose Refs. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
