schema_version: "1.1"
name: tr-config-ref-dotdot-rejected
description: 'Pinned-settings ref check: /work-items:triage --config-ref origin/main..HEAD 12 passes the origin/ character class but contains "..", so the triage stops before any settings read or tracker read, reports the ref as rejected, and never puts the ref text on a command line. A run needs --scaffold and --allow-tools Bash,Write,Edit.'
tags: [triage, config-ref, hard-stop, must-not]
plugins: ["../.."]
expected_outcome: 'The answer reports the --config-ref value as rejected (it contains "..") and stops the triage with no mutation. No Bash command carries the ref text, no settings parse runs (pinned or working-tree fallback), no tracker command runs, and no file is written or edited.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/work-items:triage --config-ref origin/main..HEAD 12'
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit]
  max_turns: 10
  timeout_seconds: 240
graders:
  - name: ref-rejected
    type: regex
    pattern: '^(?![^\n]*\b(?:not|isn[''’]t|wasn[''’]t|never)[ \t]+(?:been[ \t]+)?(?:rejected|refused|invalid)\b)(?=[^\n]*(?:config-ref|\bref\b|origin/main\.\.HEAD|\.\.))[^\n]*\b(?:reject(?:ed|s|ing)?|refus(?:e|ed|es|ing)|invalid|not[ \t]+(?:a[ \t]+)?(?:valid|accepted|allowed|permitted)|disallowed)\b'
    flags: 'mi'
    target: last_message
    arm: both
  - name: ref-never-on-command-line
    type: tool_used
    tool: Bash
    input_match: 'main\.\.HEAD'
    min: 0
    max: 0
    arm: both
  - name: no-settings-or-tracker-call
    type: tool_used
    tool: Bash
    input_match: '\bparse-concern-value\b|\bwork-item-tracker\.sh\b|\bgh[ \t]+(?:issue|pr|api|label)\b'
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
