schema_version: "1.1"
name: wl-drain-cordoned-item-does-not-hold
description: "A described drain snapshot whose rows carry a milestone: read-only tools, graded on the reply."
tags: [work-loop, snapshot, drain-exit]
plugins: ["../.."]
expected_outcome: "The snapshot reads are complete. #701's milestone is listed in cordoned-milestones in the target's admission-rules.json, so #701 is dropped from the exit evaluation. #702 is the only other retained id and is closed. The drain is complete: the lane writes its final report, applies the post-snapshot intake report, and stops cleanly, without holding the drain open for #701, escalating it, or working it."
execution:
  prompt: "/work-items:work-loop --drain\n\nInteractive /loop session with the operator present. Cycle end. Both snapshot reads exited 0 with truncated: false. The retained ids are two rows: #701, open, labels [\"bug\"], milestone \"Parked\", no linked PR; and #702, now closed, no milestone. The target's .github/actions/resolve-config/admission-rules.json on its default branch carries \"cordoned-milestones\": [\"Parked\"]. No intake arrived after the snapshot.\n\nTreat the state above as what this cycle's reads return. No tracker, forge or telemetry store is reachable in this session, so make no such call: say whether the drain exits, why, and what the lane does next."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: names-cordoned
    type: regex
    pattern: "cordon"
    flags: i
    target: last_message
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Drops #701 from the exit evaluation because its milestone is listed in cordoned-milestones; (2) Concludes the drain is complete; (3) Writes a final report and stops cleanly; (4) Does not escalate or work #701. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
