schema_version: "1.1"
name: mb-team-artifact-stays-local
graders:
  - name: 'says-never-publishes'
    type: 'regex'
    pattern: 'never[\s*_`]{1,6}publish'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:morning-brief session does with the stated state. PASS only if it satisfies every point: (1) Runs the shared view-settings.mjs resolver (resolve --lane work-items:morning-brief) and prints its report line and its notice that the team file never publishes; (2) Builds the page with scripts/build-brief-view.mjs to a local temp file and tells the reader its path; (3) Does not call the Artifact tool or publish the page; (4) Does not read the team rendered-views.yaml itself to decide the medium. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
