schema_version: "1.1"
name: wk-ci-unrunnable-suite-left-to-ci
graders:
  - name: 'suite-false-exit-done'
    type: 'regex'
    pattern: '(?=[\s\S]*"?required"?[\s*_`]*[:=][\s*_`"]*false\b)(?=[\s\S]*"?exit"?[\s*_`]*[:=][\s*_`"]*done\b)'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:work session does with the stated state. PASS only if it satisfies every point: (1) Records the test suite in not_done as left to the PR''s CI with required false; (2) Does not stop the run, or report it stopped, because the suite could not run; (3) Reports the run as done, with the changelog-fragment check passed. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
