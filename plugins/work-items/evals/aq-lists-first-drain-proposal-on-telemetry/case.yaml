schema_version: "1.1"
name: aq-lists-first-drain-proposal-on-telemetry
description: "Port of attend-queue evals.json case 9 (attend-queue-lists-first-drain-proposal-despite-infrastructure-exclusion): a described snapshot, read-only tools, graded on the reply."
tags: [attend-queue, first-drain, lane-telemetry]
plugins: ["../.."]
expected_outcome: "The view lists #900 as a [ratify] row even though it is a lane telemetry issue, because a kind=ratify-first-drain marker from the write identity on a human-gated telemetry issue is the one exception to the lane-infrastructure exclusion. #901 stays out of the view: it is lane infrastructure and its marker kind is not ratify-first-drain. #950 lists as [escalated] and #960 as [intake]. [ratify] rows sort before [escalated] before [intake] at equal age."
execution:
  prompt: "/work-items:attend-queue\n\nBuild the attention view. Open items: #900 'Lane telemetry: work-loop' carries needs-human and a comment by the tracker's write identity whose first line is <!-- work-items:escalation lane=work-loop kind=ratify-first-drain -->. #901 'Lane telemetry: attend-queue' carries needs-human and a comment by the write identity whose first line is <!-- work-items:escalation lane=work-loop kind=escalated -->. #950 is an ordinary work item with needs-human and a kind=escalated marker from the write identity. #960 is unlabeled raw intake.\n\nTreat the state above as what the session's reads return. No tracker or forge is reachable in this session, so make no such call: say what the session does, in order, and show the attention view."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: lists-900-as-ratify
    type: regex
    pattern: "\\[ratify\\][^\\n]*#900|#900[^\\n]*\\[ratify\\]"
    target: last_message
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what the attend-queue session does with the stated state. PASS only if it satisfies every point: (1) Lists #900 as a [ratify] row; (2) Does not list #901 in any row; (3) Lists #950 as [escalated] and #960 as [intake]; (4) Names the ratify-first-drain marker as the reason #900 appears despite being a telemetry issue. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
