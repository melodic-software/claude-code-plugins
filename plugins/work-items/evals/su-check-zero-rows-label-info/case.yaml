schema_version: "1.1"
name: su-check-zero-rows-label-info
graders:
  - name: 'role-label-info'
    type: 'regex'
    pattern: '(?:role[- ]label|recurring-maintenance|`?recurring`?[\s*_`]{0,4}label)(?:(?!\b(?:INFO|FAIL|PASS|WARN)\b)[^\n.;|]){0,40}(?:\|[\s*_`]{0,6})?\bINFO\b|\bINFO\b(?:(?!\b(?:INFO|FAIL|PASS|WARN)\b)[^\n.;|]){0,40}(?:role[- ]label|recurring-maintenance)'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:setup session does with the stated state. PASS only if it satisfies every point: (1) Reports the recurring-maintenance role-label probe as INFO, not FAIL, when the schedule carries zero rows; (2) Keys the verdict on the schedule''s row count rather than the schedule file''s presence; (3) Notes that the label must exist before the schedule is ever seeded; (4) Reports the present-but-empty schedule as INFO pointing at apply --seed-schedule; (5) Writes no file and creates no label. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
