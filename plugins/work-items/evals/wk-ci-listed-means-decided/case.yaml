schema_version: "1.1"
name: wk-ci-listed-means-decided
graders:
  - name: 'exit-done'
    type: 'regex'
    pattern: '"?exit"?[\s*_`]*[:=][\s*_`"]*done\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:work session does with the stated state. PASS only if it satisfies every point: (1) Does not write exit pushback; (2) Picks one of the listed means itself; (3) Builds the chosen change; (4) States the choice and the evidence behind it in summary. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
