schema_version: "1.1"
name: mb-stuck-threshold-and-limit
graders:
  - name: 'names-stuck-limit'
    type: 'regex'
    pattern: 'stuck[-_]limit\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:morning-brief session does with the stated state. PASS only if it satisfies every point: (1) The response says an item is listed once its newest labeled event for the queue label is older than `--stuck-days` (default 7); (2) The response names `--stuck-days` and `--stuck-limit` (default 20) as the settings, with PARTIAL past the cap; (3) The response says the section is read-only and does not move or relabel the items. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
