schema_version: "1.1"
name: tk-empty-role-label-stops
description: 'Role-label resolution is an action-entry invariant: /work-items:track add --agent-ready against a binding whose config.role_labels maps autonomous-eligible to an empty string stops and reports the configuration error. It creates no item, does not fall back to the default agent-ready label, and does not rewrite the binding. The adapter itself treats an empty value as absent, so only the skill text holds this stop. A run needs --scaffold and --allow-tools Bash,Write,Edit.'
tags: [track, add, role-labels, hard-stop, must-not]
plugins: ["../.."]
expected_outcome: 'The run reads .work-item-tracker.json at action entry, finds config.role_labels."autonomous-eligible" present but empty, and stops with a report naming that entry as a configuration error. No create-item call runs, no item file appears under .work-items/, the binding file is unchanged, and the reply does not say it used or fell back to the default agent-ready label.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/work-items:track add --agent-ready --area webhooks "Retry failed webhook deliveries with exponential backoff, up to five attempts, then record the delivery as failed." File it now; I do not need to review the draft.'
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit]
  max_turns: 20
  timeout_seconds: 420
graders:
  - name: reports-role-config-error
    type: regex
    pattern: '^(?!(?:(?!\b(?:not|never|without|instead of|rather than|don[''’]t|won[''’]t|didn[''’]t|wouldn[''’]t)\b)[^\n])*\b(?:fell|falls?|falling)[ \t]+back\b)(?!(?:(?!\b(?:not|never|without|instead of|rather than|don[''’]t|won[''’]t|didn[''’]t|wouldn[''’]t)\b)[^\n])*\b(?:used|using|applied|applying|filed[ \t]+with)[ \t]+(?:the[ \t]+)?default\b)(?![^\n]*\b(?:created|filed|opened)[ \t]+(?:item[ \t]+)?#?\d)(?=[^\n]*(?:role_labels|\brole[ -]labels?\b|autonomous-eligible|\.work-item-tracker\.json|\bbinding\b))[^\n]*\b(?:empty|blank|malformed|invalid|misconfigur(?:ed|ation)|configuration[ \t]+error|config(?:uration)?[ \t]+(?:problem|issue))\b'
    flags: 'mi'
    target: last_message
    arm: both
  - name: binding-unchanged
    type: regex
    pattern: '"role_labels":[ \t]*\{[ \t]*"autonomous-eligible":[ \t]*""[ \t]*\}'
    target: { source: file, path: .work-item-tracker.json }
    arm: both
  - name: no-create-item
    type: tool_used
    tool: Bash
    input_match: '\bcreate-item\b'
    min: 0
    max: 0
    arm: both
  - name: no-bash-item-write
    type: tool_used
    tool: Bash
    input_match: '(?<![0-9&])>>?[ \t]*(?:\\"|'')?[^ \t"\\;|&]*(?:\.work-items/|\.work-item-tracker\.json)|(?:\btee\b|\binstall\b|\bdd\b|\bsed[ \t]+-[a-zA-Z]*i|\bpython3?[ \t]+-c|\bnode[ \t]+-e|\bperl[ \t]+-[a-zA-Z]*[ie])(?:[^"\\;|&]|\\[^n])*(?:\.work-items/|\.work-item-tracker\.json)|(?:\bcp\b|\bmv\b)(?:[^"\\;|&]|\\[^n])*\.work-items/'
    min: 0
    max: 0
    arm: both
  - name: no-write-item-or-binding
    type: tool_used
    tool: Write
    input_match: '"file_path":"(?:[^"\\]|\\.)*(?:\.work-items/|\.work-item-tracker\.json)'
    min: 0
    max: 0
    arm: both
  - name: no-edit-item-or-binding
    type: tool_used
    tool: Edit
    input_match: '"file_path":"(?:[^"\\]|\\.)*(?:\.work-items/|\.work-item-tracker\.json)'
    min: 0
    max: 0
    arm: both
