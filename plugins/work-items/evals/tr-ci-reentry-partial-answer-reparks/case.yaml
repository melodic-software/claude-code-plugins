schema_version: "1.1"
name: tr-ci-reentry-partial-answer-reparks
description: 'Triage --ci re-entry: the recorded decision answers question 1 only, so the verdict re-parks at needs-owner-decision, keeps needs_human false, and asks question 2 (30 or 90 days) again with a RECOMMENDED answer. Ported from the retired intake reentry-eval case partial-answer-reparks. A run needs --scaffold.'
tags: [triage, ci-mode, intake, reentry]
plugins: ["../.."]
expected_outcome: 'The run reads .lane/scratch/issue.json, treats question 1 as settled by the Decision recorded comment, sets Flags: intent with needs-owner-decision, keeps needs_human false, and asks question 2 as a numbered open question with a RECOMMENDED answer and Basis.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/work-items:triage --issue 99901 --ci\n\nYour scratchpad directory is `.lane/scratch`. The lane's output schema takes these keys: size small, medium or large; complexity low, medium or high; uncertainty known, knowable or unknown; type Bug, Task or Feature. This session has no structured-output channel, so end the run with a reply that is only the verdict: one JSON object in the schema's shape."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: reads-issue-json
    type: 'tool_used'
    tool: 'Read'
    input_match: '\.lane/scratch/issue\.json'
    min: 1
    arm: both
  - name: keeps-needs-human-false
    type: 'regex'
    pattern: '"needs_human"\s*:\s*false'
    target: 'last_message'
    arm: both
  - name: reparks-needs-decision
    type: 'regex'
    pattern: '"labels"\s*:\s*\[[^\]]*"needs-owner-decision"'
    target: 'last_message'
    arm: both
  - name: asks-with-recommendation
    type: 'regex'
    pattern: 'RECOMMENDED:'
    target: 'last_message'
    arm: both
  - name: asks-stale-age
    type: 'regex'
    pattern: '(?:30|90)[ -]days?'
    flags: 'i'
    target: 'last_message'
    arm: both
  - name: judges-open-questions
    type: llm
    criteria: 'PASS only if the verdict''s comment treats question 1 (one pinned issue) as settled by the Decision recorded comment, does not ask it again, and asks question 2 (30 or 90 days) as a numbered open question with a RECOMMENDED answer and a Basis, without deciding it itself. FAIL if it picks a stale age as if decided, re-asks question 1, or asks nothing.'
    focus: last_message
    arm: both
