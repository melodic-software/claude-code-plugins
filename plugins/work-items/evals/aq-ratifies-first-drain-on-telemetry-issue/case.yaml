schema_version: "1.1"
name: aq-ratifies-first-drain-on-telemetry-issue
description: "Port of attend-queue evals.json case 8 (attend-queue-ratifies-first-drain-on-the-telemetry-issue): a described snapshot, read-only tools, graded on the reply."
tags: [attend-queue, first-drain, c3-ratification]
plugins: ["../.."]
expected_outcome: "#900 lists as a [ratify] row. Before asking, the lane restates the item, the decision, and the consequence: ratifying lets that work-loop dispatch unratified C3 bug-fix items without a [ratify] row for each. On the operator's ratification it creates the loop-lane: first-drain-ratified label, then in one edit applies it to #900 and removes needs-human, and records the ratification as a reply comment. It does not apply the autonomous-eligible role label and does not ask for a work class, because #900 is a lane's telemetry issue, not a work item."
execution:
  prompt: "/work-items:attend-queue\n\n#900 'Lane telemetry: work-loop' carries needs-human and a comment authored by the tracker's write identity whose first line is <!-- work-items:escalation lane=work-loop kind=ratify-first-drain -->, proposing that instance melo-lap-001's first drain completed at cycle 41 over a 37-item snapshot. #900 has no work-class: label. The repository has no loop-lane: first-drain-ratified label yet. The operator says: ratify it.\n\nTreat the state above as what the session's reads return. No tracker or forge is reachable in this session, so make no such call: say what the session does, in order, and show the attention view."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: applies-first-drain-label
    type: regex
    pattern: "(?=[\\s\\S]*\\[ratify\\])(?=[\\s\\S]*loop-lane: first-drain-ratified)"
    target: last_message
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what the attend-queue session does with the stated state. PASS only if it satisfies every point: (1) Lists #900 as a [ratify] row from its kind=ratify-first-drain marker; (2) Restates the item, the decision, and what ratifying changes before asking; (3) Creates the loop-lane: first-drain-ratified label because the repository lacks it; (4) Applies loop-lane: first-drain-ratified and removes the human-gated role label in one edit; (5) Does not apply the autonomous-eligible role label or stamp a work class on #900; (6) Records the ratification as a reply comment. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
