schema_version: "1.1"
name: tr-attention-view-blocked-by-wont-do
graders:
  - name: 'lists-62-wont-do'
    type: 'regex'
    pattern: 'won[''’]?t[- ]?do[^\n]*#62\b|#62\b[^\n]*won[''’]?t[- ]?do'
    flags: 'i'
    target: 'last_message'
  - name: 'keeps-raw-buckets'
    type: 'regex'
    pattern: '^(?=[\s\S]*#61\b)[\s\S]*#63\b'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:triage attention view shows. PASS only if it satisfies every point: (1) Lists #62 under a blocked-by-won''t-do bucket, read from blocked_by_wont_do_count above zero; (2) Does not drop #62 by the defensive skip or because it already carries routing labels; (3) Keeps #61 under unlabeled and #63 under raw marker, each listed once; (4) Says #62 waits on a blocker closed as won''t-do and leaves dropping the edge, re-scoping or closing to the operator; (5) Applies no label, edge or state change and does not re-run the state machine on #62. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
