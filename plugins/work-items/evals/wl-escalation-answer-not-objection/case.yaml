schema_version: "1.1"
name: wl-escalation-answer-not-objection
graders:
  - name: 'no-objection-escalation'
    type: 'regex'
    pattern: '^(?![\s\S]*objection:[\s*_`]{0,6}#?306\b\W{0,4}(?:->|→)\W{0,4}escalated)(?=[\s\S]*#306\b)'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Does not treat the operator''s 09:00 comment as a new objection; (2) Does not escalate #306 again; (3) Continues #306 through the rest of the admission gate. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
