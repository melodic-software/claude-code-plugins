schema_version: "1.1"
name: tr-signature-cluster-one-parent
description: "Two open intake items share one error signature: /work-items:triage forms one cluster under the default triage_cluster settings, makes the reproduced item the parent, gives only the parent the autonomous-eligible role label, and closes the other as its duplicate with a seen-again note. Read-only tools, graded on the reply."
tags: [triage, cluster, signature, must-not]
plugins: ["../.."]
expected_outcome: "#487 and #501 share the error text, so they form one signature cluster. With the default parent rule (oldest-reproduced), #501 is the parent: it is the only member with a confirmed reproduction, though #487 is older. #501 takes its briefed outcome with agent-ready. #487 closes as a duplicate of #501, never gets agent-ready, and its sighting is recorded on #501 through add-recurrence; no blocked-by edge links the two."
execution:
  prompt: "/work-items:triage 501\n\nAutonomous lane whose standing directive authorizes triage label, comment and close mutations. GitHub binding. Two open items carry needs-triage: #487 'Export crashes on large ledgers' (created 2026-10-12) and #501 'ledger export fails for 70k rows' (created 2026-10-20). Both report the same error text, `ERR_ROW_OVERFLOW at export.ts:88`. #501 reproduces twice through `ledger export --rows 70000`, so it meets triage_repro_count=2 (default); #487 has no reproduction recorded. The fix is a one-line bound change in export.ts with an existing test, so a brief for it would be delegable. docs/conventions/work-items.yaml sets no triage_cluster, no objection window and no role_labels, so every setting takes its default. Neither item carries provenance: untrusted, and every label the outcome would apply exists.\n\nTreat the state above as what this run's reads return. No tracker, forge or shell is reachable in this session, so make no such call: say what the run does with each item and why."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: names-parent
    type: regex
    pattern: "#501\\s+(?:is|as|becomes)\\s+(?:the\\s+)?(?:cluster(?:'s)?\\s+)?parent\\b|\\bparent\\b(?:\\s*(?:is|:|=|-|,))?\\s*\\(?#501\\b"
    flags: "i"
    target: last_message
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what /work-items:triage does with #487 and #501, two items sharing one error signature. PASS only if it satisfies every point: (1) Treats #487 and #501 as one cluster with a single parent; (2) The parent is #501, the member with a confirmed reproduction; (3) Applies agent-ready (the autonomous-eligible role label) to #501 only; (4) Never applies agent-ready to #487; (5) Closes #487 as a duplicate of #501 and records its sighting on #501 (add-recurrence or a seen-again note); (6) Adds no blocked-by edge between them. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
