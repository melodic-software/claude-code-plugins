schema_version: "1.1"
name: wl-truncated-snapshot-aborts-and-escalates
description: "Port of work-loop evals.json case 26 (work-loop-truncated-snapshot-aborts-without-lifting-the-gate): a described snapshot, read-only tools, graded on the reply."
tags: [work-loop, snapshot, drain-exit]
plugins: ["../.."]
expected_outcome: "The frontier envelope reports truncated: true, so the cycle-start snapshot is unusable and the cycle aborts with no state change. It runs no intake sweep, admission or execution and evaluates no exit condition: the empty item set is not an empty backlog, so the drain is not complete and the lane does not stop. Because truncation does not clear on its own, the cycle raises the stall escalation now, without waiting for the no-progress threshold: a `Lane stall: work-loop` item with the human-gated role label and the machine-marked escalation comment, reporting the truncated frontier read, the github adapter and its list_items_max of 1000. The durable counters (no_progress_streak 1, item_cap 2, clean_streak 0) are written back as read, with only heartbeat_at moving. The cycle report leads with a snapshot-unusable line naming the frontier read and the truncation, and, the launch being interactive, the lane schedules the next cycle instead of stopping."
execution:
  prompt: "/work-items:work-loop --drain\n\nInteractive /loop session with the operator present. Cycle start. Durable state shows clean_streak=0, no_progress_streak=1, item_cap=2. The bound adapter is github, whose capabilities declare limits.list_items_max 1000. The seam's list-frontier --autonomous exits 0 with {\"schema_version\":\"1.0\",\"items\":[],\"truncated\":true}. The open-items read returned no rows. No open `Lane stall: work-loop` item exists.\n\nTreat the state above as what this cycle's reads return. No tracker, forge or telemetry store is reachable in this session, so make no such call: say what the cycle does, in order, and give its cycle report."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: names-truncation-and-stall
    type: regex
    pattern: "(?=[\\s\\S]*\\btruncat\\w*)(?=[\\s\\S]*Lane stall: work-loop)"
    target: last_message
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Treats the truncated frontier envelope as an unusable snapshot rather than an empty backlog; (2) Does not treat the drain as complete and does not stop it; (3) Runs no intake sweep, admission, or execution this cycle; (4) Raises the stall escalation in this cycle without waiting for no_progress_streak to reach the threshold, naming the truncated read, the adapter and its list_items_max; (5) Leaves no_progress_streak, item_cap and the other durable counters as they were read; (6) Reports the snapshot as unusable, naming the read and the truncation, and schedules the next cycle because the launch is interactive. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
