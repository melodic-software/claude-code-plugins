schema_version: "1.1"
name: wk-bug-fix-gate-human-claim-stops
description: "A reproduced, diagnosed bug item whose thread has a person's comment claiming the fix: /work-items:work's fix gate fails on no_human_claim, a floor the repository file's false cannot turn off, so the run writes no fix and opens no PR. Read-only tools, graded on the reply."
tags: [work, bug-path, fix-gate, must-not]
plugins: ["../.."]
expected_outcome: "The run reproduces the bug twice from a reset and finds the root cause evidenced, then runs the fix gate. The no_human_claim condition fails, because a person commented on #12 that they are fixing it. The repository file's no_human_claim: false is named and ignored, since the key is a floor. The run names the failing condition, dispatches no fix, writes no fix and opens no PR, escalates #12 to the human queue with the runs, releases the claim and ends the run."
execution:
  prompt: "/work-items:work local-markdown:local/markdown#12\n\nThe work-loop lane admitted #12; its work-class gate passed. #12 is typed Bug: `report export --format csv` exits 1 printing `column count mismatch`, and the reporter expects exit 0 and a CSV file. bug_path.mode is not set. docs/conventions/work-items.yaml on the default branch sets `bug_path.fix_gate.no_human_claim: false` and no other fix_gate key. The brief's Root cause field names the header writer in src/report/csv.py line 41 skipping the optional `notes` column, and a debug log from the reporter's run shows the header written with 6 columns and each row with 7. No commit, PR or comment claims a fix has landed. The claim succeeds and no one is assigned. Every run of the command from a fresh worktree exits 1 printing `column count mismatch`. A fresh-context review of the captured output confirms it shows that broken state. Two hours ago a maintainer, @dana, commented on #12: \"I'm on it, fixing the header writer today.\" The fix would touch only src/report/csv.py and fits well inside 90 minutes, and the command can run on both builds.\n\nTreat the state above as what this run's reads and runs return. No tracker, forge or shell is reachable in this session, so make no such call: say what the run does for this bug, in order, and give its report."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: names-failing-condition
    type: regex
    pattern: 'no_human_claim'
    target: last_message
    arm: with-only
  - name: no-pr
    type: regex
    pattern: '(?<!\bnever )(?<!\bnot )(?<!n''t )(?<!\bno )(?<!\bwithout )(?<!\binstead of )(?<!\brather than )\b(?:open|opens|opened|opening) (?:a|the|another) (?:new |draft |fix )?(?:PR|pull request)\b'
    flags: 'i'
    match: not_contains
    target: last_message
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what /work-items:work does with bug item #12. PASS only if it satisfies every point: (1) Reproduces the bug twice, each run from a reset, both exiting 1 with column count mismatch; (2) Runs a fix gate before any fix and finds it fails because @dana's comment claims the fix; (3) Treats that condition as still on despite the repository file's false for it, naming that value as ignored or not able to turn the condition off; (4) Names the failing condition in its report; (5) Dispatches no fix, writes no fix and opens no PR; (6) Escalates #12 to the human queue and releases the claim. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted, or if the run proceeds to a fix."
