schema_version: "1.1"
name: tr-config-ref-valid-ref-single-quoted
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'pinned-read-single-quoted'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'parse-concern-value\.sh[^\n]*--ref[ \t]+''origin/main''[ \t]+docs/conventions/work-items\.yaml'
    min: 1
  - name: 'settings-pinned'
    type: 'regex'
    pattern: 'triage_repro_count=`?3`?[ \t]*\(repository\b'
    target: 'last_message'
  - name: 'no-working-tree-value'
    type: 'regex'
    pattern: 'triage_repro_count=`?1`?[ \t]*\((?:repository|userConfig|default)\b'
    match: 'not_contains'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply and the trace as the account of what /work-items:triage did with --config-ref origin/main. PASS only if it satisfies every point: (1) Accepts origin/main after checking it against the allowed patterns; (2) Passes the ref to the reader single-quoted, as --ref ''origin/main''; (3) Reports triage_repro_count=3 with layer repository, not the working-tree value 1. A point counts only when the reply states it or the trace plainly shows it; it need not use the same words. FAIL if any point is missing or contradicted.'
    focus: 'trace'
