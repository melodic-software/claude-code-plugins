schema_version: "1.1"
name: su-apply-stops-on-tracked-override
graders:
  - name: 'rm-cached-remediation'
    type: 'regex'
    pattern: '\brm[\s*_`]{1,4}--cached\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:setup session does with the stated state. PASS only if it satisfies every point: (1) Uses git check-ignore --no-index -q (not a bare git check-ignore, and not -v) to take the ignore verdict, so the index cannot mask the answer and a negation pattern cannot be read as coverage; (2) Runs a separate git ls-files index probe and treats ignored and untracked as two independent conditions; (3) Stops and reports the tracked personal override as a finding, naming git rm --cached as the remediation; (4) Does not append a .gitignore line, and never reports a duplicate ignore line as having fixed a tracked personal override. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
