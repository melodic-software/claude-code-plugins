schema_version: "1.1"
name: mb-local-telemetry-routes-to-observability
graders:
  - name: 'routes-to-observability'
    type: 'regex'
    pattern: 'harness-ops:observability\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:morning-brief session does with the stated state. PASS only if it satisfies every point: (1) The response identifies token burn rate and hook latency as local telemetry outside this skill''s scope; (2) The response routes to `/harness-ops:observability` instead of reading local telemetry itself; (3) The response does not add a local-telemetry section to the brief. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
