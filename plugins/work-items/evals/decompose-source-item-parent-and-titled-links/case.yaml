schema_version: "1.1"
name: decompose-source-item-parent-and-titled-links
graders:
  - name: 'parent-source'
    type: 'regex'
    pattern: '--parent\W{1,3}(github:[\w./-]+)?#?300\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:decompose session does with the stated state. PASS only if it satisfies every point: (1) Takes the build decisions from the map''s closing comment (CSV, one row per invoice line; a download button on the reports page) ; (2) Every published item''s create-item carries --parent naming item 300, so the items become native sub-items of the source map, even with no spec container ; (3) Each item body''s Parent line opens with Refs #300 and follows it with the map''s title linked to its absolute URL (https://example.com/o/r/issues/300) ; (4) The second item''s Depends on line links the first item by its title and absolute URL, not by a bare #<n> alone ; (5) No link written to the tracker is a bare #<n> without the item''s title linked to its URL, apart from the Refs #300 opening. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
