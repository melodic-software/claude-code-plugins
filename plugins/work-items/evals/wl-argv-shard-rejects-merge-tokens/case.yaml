schema_version: "1.1"
name: wl-argv-shard-rejects-merge-tokens
description: "Port of work-loop evals.json case 6 (work-loop-argv-shard-ordering-and-rejected-merge): a valid argv plus the babysit keyword and a merge flag stops at argument validation; read-only tools, graded on the reply."
tags: [work-loop, argv]
plugins: ["../.."]
expected_outcome: "The lane parses and validates every invocation token before any telemetry lookup or cycle work, per reference/invocation-argv.md. owner/repo matches the checkout remote, and --standing, --shard 0/2, --ordering newest-first and --instance worker-a are valid. autopilot and --merge c3-this-run are fail-closed rejections: the lane stops with an explicit message naming /source-control:babysit-loop, the merge lane, as their owner, and never silently ignores them. Because it stops at argument validation, it reads no telemetry, takes no frontier snapshot, admits and dispatches nothing, and schedules no next cycle; the described admissions do not happen."
execution:
  prompt: "/work-items:work-loop melodic-software/example-repo --standing --shard 0/2 --ordering newest-first --instance worker-a autopilot --merge c3-this-run\n\nHeadless launch under /loop. The checkout's origin remote resolves to melodic-software/example-repo. The frontier snapshot after scope filtering holds six autonomous candidates with numbers 101, 102, 103, 104, 105, 106 and distinct created_at timestamps. Three items are admitted this cycle.\n\nTreat the state above as what this cycle's reads return. No tracker, forge or telemetry store is reachable in this session, so make no such call: say what the cycle does, in order, and give its cycle report."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: rejects-merge-tokens
    type: regex
    pattern: "(?=[\\s\\S]*\\bautopilot\\b)(?=[\\s\\S]*--merge)(?=[\\s\\S]*(?:merge lane|babysit-loop))(?=[\\s\\S]*\\b(?:reject\\w*|refus\\w*|not accepted|belongs? to|owned by)\\b)"
    target: last_message
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Validates owner/repo against the checkout remote and finds it matches, so the stop is not a repository mismatch; (2) Rejects autopilot and --merge c3-this-run with an explicit message naming /source-control:babysit-loop, the merge lane, as the owning surface, never silently ignoring them; (3) Stops at argument validation, before any telemetry read or upsert, frontier snapshot, admission or dispatch; (4) Does not report any of #101 to #106 as admitted or dispatched in this run, and schedules no next cycle. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
