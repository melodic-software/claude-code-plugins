schema_version: "1.1"
name: wl-argv-shard-rejects-merge-tokens
description: "Port of work-loop evals.json case 6 (work-loop-argv-shard-ordering-and-rejected-merge): a described snapshot, read-only tools, graded on the reply."
tags: [work-loop, argv]
plugins: ["../.."]
expected_outcome: "The lane parses the invocation surface: validates the optional owner/repo against the checkout (match — proceed), applies shard 0/2 so only even-numbered items (102, 104, 106) remain in the snapshot, orders admitted cap slots newest-first, and binds lane_instance worker-a for telemetry (overriding userConfig). It rejects autopilot and --merge c3-this-run with a clear message — merge authority and babysit tier tokens belong to the merge lane, not this worker lane — and does not silently ignore them. It loads reference/mode-standing.md only (the explicit --standing a headless launch must carry) and does not load reference/mode-drain.md. The cycle report states which source supplied each effective value."
execution:
  prompt: "/work-items:work-loop melodic-software/example-repo --standing --shard 0/2 --ordering newest-first --instance worker-a autopilot --merge c3-this-run\n\nHeadless launch under /loop. The checkout's origin remote resolves to melodic-software/example-repo. The frontier snapshot after scope filtering holds six autonomous candidates with numbers 101, 102, 103, 104, 105, 106 and distinct created_at timestamps. Three items are admitted this cycle.\n\nTreat the state above as what this cycle's reads return. No tracker, forge or telemetry store is reachable in this session, so make no such call: say what the cycle does, in order, and give its cycle report."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: rejects-merge-tokens
    type: regex
    pattern: "(?=[\\s\\S]*\\bautopilot\\b)(?=[\\s\\S]*--merge)(?=[\\s\\S]*(?:merge lane|babysit-loop))(?=[\\s\\S]*\\b(?:reject\\w*|refus\\w*|not accepted|belongs? to|owned by)\\b)"
    target: last_message
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Validates owner/repo against the checkout remote when present and refuses on mismatch rather than guessing; (2) Applies --shard 0/2 before admission and exit evaluation so only item numbers where number % 2 == 0 remain in the lane's snapshot; (3) Fills execute cap slots in newest-first order when multiple items are admitted; (4) Binds --instance worker-a to the durable-state lane_instance and passes it to scripts/lane-telemetry-upsert.sh --instance, which owns the ^[a-z0-9][a-z0-9-]{0,31}$ gate and marker construction, rather than hand-transcribing the upsert; (5) Rejects autopilot and --merge c3-this-run with an explicit message naming the merge lane as the owning surface — never silently ignores inert merge/tier tokens; (6) Loads reference/mode-standing.md for the explicit --standing stop mode and does not load reference/mode-drain.md; (7) Reports the effective shard, ordering, instance, and stop_mode and which invocation tokens supplied each. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
