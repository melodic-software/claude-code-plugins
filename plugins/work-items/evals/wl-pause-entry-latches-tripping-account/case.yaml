schema_version: "1.1"
name: wl-pause-entry-latches-tripping-account
graders:
  - name: 'account-switch-unknown'
    type: 'regex'
    pattern: 'account-switch:[\s*_`]{0,6}unknown\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Records latched_account at pause entry as the fingerprint of the tripping snapshot''s account (A), not of the account .claude.json names now; (2) Compares the .claude.json account with the latched one at pause entry and re-evaluates at once when they differ; (3) Finding no fresh snapshot attributed to B, treats B''s windows as unknown and falls back to reactive-only; (4) Does not pause until account A''s resets_at and leaves no paused_until, rate_limit_latch or latched_account behind; (5) Records an account-switch: unknown line with neither the address nor the fingerprint; (6) Never prints, logs or interpolates the address or the state file. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
