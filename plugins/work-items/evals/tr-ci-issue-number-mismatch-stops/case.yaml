schema_version: "1.1"
name: tr-ci-issue-number-mismatch-stops
description: 'CI mode issue-number stop: /work-items:triage --issue 12 --ci finds issue.json in the scratchpad naming issue 13, so the run stops and returns no verdict, and makes no tracker call. A run needs --scaffold and --allow-tools Bash.'
tags: [triage, ci-mode, hard-stop, must-not]
plugins: ["../.."]
expected_outcome: 'The run reads .lane/scratch/issue.json, sees its number is 13, not 12, and stops: its reply holds no verdict object, and no tracker or forge command runs.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/work-items:triage --issue 12 --ci\n\nYour scratchpad directory is `.lane/scratch`."
  allowed_tools: [Bash, Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 300
graders:
  - name: no-verdict
    type: regex
    pattern: '"needs_human"\s*:'
    match: not_contains
    target: last_message
    arm: both
  - name: no-tracker-call
    type: tool_used
    tool: Bash
    input_match: '\bwork-item-tracker\.sh\b|\bgh[ \t]+(?:issue|pr|api|label)\b'
    min: 0
    max: 0
    arm: both
