schema_version: "1.1"
name: wl-switch-one-window-resumes
graders:
  - name: 'account-switch-resumed'
    type: 'regex'
    pattern: 'account-switch:[\s*_`]{0,6}resumed\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Resumes because every plausible window is below 95, treating the absent seven-day window as unknown rather than a reason to stay paused; (2) Does not fall back to reactive-only, since one window is plausible; (3) Clears rate_limit_latch, paused_until and latched_account together; (4) Takes the fingerprint and the windows from one read of the snapshot file; (5) Records an account-switch: resumed line with neither the address nor the fingerprint. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
