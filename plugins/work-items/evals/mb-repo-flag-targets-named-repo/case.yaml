schema_version: "1.1"
name: mb-repo-flag-targets-named-repo
graders:
  - name: 'names-target-repo'
    type: 'regex'
    pattern: 'acme-co/warehouse-api\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:morning-brief session does with the stated state. PASS only if it satisfies every point: (1) The response targets `acme-co/warehouse-api` because `--repo` was passed; (2) The response does not substitute a hardcoded owner/repo; (3) The response reflects that, absent `--repo`, owner/repo is resolved from `gh repo view` (the checkout''s `origin` remote as a fallback also counts). A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
