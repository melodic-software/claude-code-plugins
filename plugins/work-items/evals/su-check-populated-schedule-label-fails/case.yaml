schema_version: "1.1"
name: su-check-populated-schedule-label-fails
graders:
  - name: 'role-label-fail'
    type: 'regex'
    pattern: '(?:role[- ]label|recurring-maintenance|`?recurring`?[\s*_`]{0,4}label)[^\n]{0,160}\bFAILs?\b|\bFAILs?\b[^\n]{0,160}(?:role[- ]label|recurring-maintenance)'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:setup session does with the stated state. PASS only if it satisfies every point: (1) Reports the recurring-maintenance role-label probe as FAIL when the schedule carries at least one row and the resolved label is absent; (2) Explains that an unlabeled recurring item goes invisible to the next due/work pass; (3) Names the repository''s declared label provisioning process as the remediation, never gh label create ad hoc; (4) Writes no file and creates no label. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
