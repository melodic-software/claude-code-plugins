schema_version: "1.1"
name: aq-post-merge-record-row
graders:
  - name: 'post-merge-row-and-run'
    type: 'regex'
    pattern: '(?=[\s\S]*\[post-merge\])(?=[\s\S]*actions/runs/7002/attempts/2\b)'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:attend-queue session does with the stated state. PASS only if it satisfies every point: (1) Lists #1401 as a [post-merge] row with its link and the failing run it names; (2) Does not exclude #1401 as a parked item for lacking an escalation marker; (3) Keeps no last-pass state to decide whether #1401 lists: the open record is what makes it a row; (4) Does not close the record, revert, or merge, and takes no claim on the row. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
