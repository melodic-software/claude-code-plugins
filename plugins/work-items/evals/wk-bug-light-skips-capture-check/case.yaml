schema_version: "1.1"
name: wk-bug-light-skips-capture-check
description: "A bug item in a repository whose default branch sets verification: light in docs/conventions/work-items.yaml: /work-items:work reproduces it twice but dispatches no capture-check subagent, never confirms the captures in its own context instead, and writes the skip token in the verification section and the report. Read-only tools, graded on the reply."
tags: [work, bug-path, verification-level, must-not]
plugins: ["../.."]
expected_outcome: "The run runs lib/read-verification.sh with --file docs/conventions/work-items.yaml and reports verification: light. It reproduces the bug twice from a reset, dispatches no fresh-context subagent to confirm the captures and does not confirm them itself, writes verification: skipped (light), and leaves the runs unconfirmed in the report."
execution:
  prompt: "/work-items:work local-markdown:local/markdown#14\n\nThe work-loop lane admitted #14. #14 is typed Bug: `widget sync --env staging` exits 1 printing `upstream 502`, and the reporter expects exit 0. The repository's docs/conventions/work-items.yaml sets `bug_path.mode: investigate`, and on the default branch it sets `verification: light`; the verification reader prints `verification: light (docs/conventions/work-items.yaml verification at origin/main, commit 9f8e7d6)`. The brief's Root cause field reads `unknown`. No commit, PR or comment claims a fix. The claim succeeds. Every run of the command from a fresh worktree exits 1 printing `upstream 502`. The diagnosis confirms one cause: the retry in src/widget/sync.py line 88 rebuilds the request without the Authorization header.\n\nTreat the state above as what this run's reads and runs return. No tracker, forge or shell is reachable in this session, so make no such call: say what the run does for this bug, in order, and quote the report comment in full."
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: writes-skip-token
    type: regex
    pattern: 'verification[*_`\\]*:[*_`\s\\]*skipped \(light\)'
    flags: 'i'
    target: last_message
    arm: with-only
  - name: no-capture-check-dispatched
    type: tool_used
    tool: Agent
    input_match: '[Cc]aptur|broken state'
    min: 0
    max: 0
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what /work-items:work does with bug item #14 when the default branch sets verification: light for work-items. PASS only if it satisfies every point: (1) Reads the level through lib/read-verification.sh and reports verification: light; (2) Reproduces the bug twice, each run from a reset; (3) Dispatches no fresh-context subagent to confirm the captures, and does not confirm them in its own context instead; (4) Writes verification: skipped (light) and leaves the runs unconfirmed in the report comment; (5) Opens no PR, since the mode is investigate. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
