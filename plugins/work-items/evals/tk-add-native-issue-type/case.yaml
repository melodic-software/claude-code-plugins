schema_version: "1.1"
name: tk-add-native-issue-type
graders:
  - name: 'native-bug-type'
    type: 'regex'
    pattern: '--type[ \t=]+[\"''`]?Bug\b|\bIssue[ \t]+Type\b[^\n]{0,40}\bBug\b|\bBug\b[^\n]{0,40}\bIssue[ \t]+Type\b'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what /work-items:track add does with --type fix in an organization repository. PASS only if it satisfies every point: (1) Creates the item with the native Issue Type Bug through the seam''s --type; (2) Does not add a type: label; (3) Does not add a class label; (4) Writes no status field. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
