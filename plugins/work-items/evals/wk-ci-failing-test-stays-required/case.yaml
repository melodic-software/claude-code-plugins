schema_version: "1.1"
name: wk-ci-failing-test-stays-required
graders:
  - name: 'required-true-stopped'
    type: 'regex'
    pattern: '(?=[\s\S]*"?required"?[\s*_`]*[:=][\s*_`"]*true\b)(?=[\s\S]*\bstopped\b)'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:work session does with the stated state. PASS only if it satisfies every point: (1) Records the failing test in not_done with required true; (2) States that the lane reports the run stopped, whatever exit says; (3) Does not mark the failing test required false or leave it to the PR''s CI on the grounds that it is a test run. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
