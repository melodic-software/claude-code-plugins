schema_version: "1.1"
name: tr-restates-before-follow-up-question
graders:
  - name: 'restates-item'
    type: 'regex'
    pattern: '#64\b[\s\S]{0,40}Export job silently skips rows'
    flags: 'i'
    target: 'last_message'
  - name: 'needs-info'
    type: 'regex'
    pattern: '\bneeds-reporter-info\b|\bneeds-info\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what /work-items:triage does for the follow-up scoping question on #64. PASS only if it satisfies every point: (1) Restates the item identity and the decision the question resolves before the follow-up question, not only before the earlier recommendation; (2) For the open-ended scoping question, states what the answer will determine instead of inventing a closed option set; (3) Does not treat the earlier restatement in the same pass as license to skip this one; (4) Posts the question as an item comment and marks needs-reporter-info rather than answering the scope question itself. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
