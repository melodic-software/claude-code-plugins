schema_version: "1.1"
name: tr-ci-reentry-person-needed-keeps-needs-human
description: 'Triage --ci re-entry: the recorded decision settles both questions but leaves the first report to the owner''s hand run on their own workstation, so the verdict applies needs-human with needs_human false (the repository''s Re-entry triage rule). Ported from the retired intake reentry-eval case person-needed-keeps-needs-human. A run needs --scaffold.'
tags: [triage, ci-mode, intake, reentry]
plugins: ["../.."]
expected_outcome: 'The run reads .lane/scratch/issue.json, treats both questions as settled, applies the needs-human label with Flags: intent because the decision leaves a step to a person, and keeps needs_human false.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/work-items:triage --issue 99903 --ci\n\nYour scratchpad directory is `.lane/scratch`. The lane's output schema takes these keys: size small, medium or large; complexity low, medium or high; uncertainty known, knowable or unknown; type Bug, Task or Feature. This session has no structured-output channel, so end the run with a reply that is only the verdict: one JSON object in the schema's shape."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: reads-issue-json
    type: 'tool_used'
    tool: 'Read'
    input_match: '\.lane/scratch/issue\.json'
    min: 1
    arm: both
  - name: keeps-needs-human-false
    type: 'regex'
    pattern: '"needs_human"\s*:\s*false'
    target: 'last_message'
    arm: both
  - name: applies-needs-human-label
    type: 'regex'
    pattern: '"labels"\s*:\s*\[[^\]]*"needs-human"'
    target: 'last_message'
    arm: both
  - name: judges-open-questions
    type: llm
    criteria: 'PASS only if the verdict''s comment treats both numbered questions as settled by the Decision recorded comment and says the remaining work waits on a person (the owner''s hand run on their own workstation). FAIL if it re-asks question 1 or 2, invents new open questions about settled points, or says no person is needed.'
    focus: last_message
    arm: both
