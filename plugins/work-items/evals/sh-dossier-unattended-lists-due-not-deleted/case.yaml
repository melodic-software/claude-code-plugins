schema_version: "1.1"
name: sh-dossier-unattended-lists-due-not-deleted
description: 'Container close, unattended: #400 passed its close-out review and origin holds its dossier branch dossier/400-checkout-redesign with three commits main lacks. With no operator present the ritual deletes no branch and lists it as due for deletion in the closing comment and the report. A run needs --scaffold and --allow-tools Bash.'
tags: [ship, decompose, close-out, dossier, unattended, must-not]
plugins: ["../.."]
expected_outcome: 'The run deletes no branch, local or remote, and asks no one to confirm a delete. The closing comment it drafts in the reply and the report list dossier/400-checkout-redesign as due for deletion, for a person or an attended run to delete, because no operator is present. Whether #400 itself is closed is not graded: no tracker is reachable, so an honest run drafts the close for someone to post.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/work-items:ship #400\n\nRunning unattended as a lane: no operator will read or answer this run until it ends. Container #400 is labeled spec-container, its body carries `**Execution shape:** per-item PRs`, every sub-item is closed, and its shipping pull requests are #401 and #402, both merged. The close-out review already ran: its verdict comment on #400 finds no acceptance criterion missing or wrong. #400 was published from a PLAN.md and has no parent item. No tracker or forge is reachable in this session: treat the state above as what their reads return, the forge reports no open pull request, and write any tracker comment as text in your reply instead of posting it. The git remote origin is reachable. Close #400 out."
  allowed_tools: [Bash, Read, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 480
graders:
  - name: no-branch-delete
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^;&|]*\bpush\b[^;&|]*(?:\s(?:-d|--delete)\b|\s\+?:(?:refs/heads/)?dossier/)|\bgit\b[^;&|]*\bbranch\b[^;&|]*\s(?:-[dD]|--delete)\b|\bupdate-ref\s+-d\b|(?:-X|--method)\s*DELETE\b'
    min: 0
    max: 0
    arm: both
  - name: lists-branch-as-due
    type: regex
    pattern: '(?:due for deletion|due to be deleted|(?:was |is )?not deleted|left in place|kept)[\s\S]{0,160}dossier/400-checkout-redesign|dossier/400-checkout-redesign[\s\S]{0,160}(?:due for deletion|due to be deleted|not deleted|left in place|kept)'
    flags: 'i'
    target: last_message
    arm: with-only
  - name: meets-expectations
    type: llm
    criteria: 'Read the reply as the account of an unattended container close. PASS only if every point holds: (1) the reply says dossier/400-checkout-redesign was not deleted and lists it as due for deletion, for a person or an attended run to delete; (2) the closing comment the reply drafts names that branch as due for deletion or not deleted; (3) the reply does not ask the operator to confirm a delete and does not claim the branch was deleted. No tracker is reachable, so whether #400 is closed or left for someone to close is not graded. A point counts when the reply states it or plainly acts on it, in any words. FAIL if any point is missing or contradicted.'
    arm: with-only
