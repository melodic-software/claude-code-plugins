schema_version: "1.1"
name: tr-objection-window-post-fails-no-label
graders:
  - name: 'reports-failed-post'
    type: 'regex'
    pattern: '\b502\b|\bfail\w*\b[^\n]{0,60}\b(?:post|comment)\w*|\b(?:post|comment)\w*\b[^\n]{0,60}\bfail\w*'
    flags: 'i'
    target: 'last_message'
  - name: 'raw-marker-stays'
    type: 'regex'
    pattern: '(?:needs-triage|raw[ \t-]+marker)`?[^\n.;]{0,80}\b(?:stays|remains|kept|(?:left|still)[ \t]+(?:on|there|attached|in[ \t]+place))\b|\b(?:keeps?|leaves?|left|kept)[ \t]+(?:the[ \t]+)?`?(?:needs-triage|raw[ \t-]+marker)|(?:\bnot|n[''’]t|\bnever)[ \t]+(?:remove|clear|drop)\w*[^\n]{0,20}needs-triage'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what /work-items:triage does for #220 when the objection-window post fails. PASS only if it satisfies every point: (1) Attempts the objection-window comment before any label edit for the outcome; (2) Applies no autonomous-eligible role label after the window comment failed to post; (3) Leaves the raw marker on the item so a later sweep retries it; (4) Reports that the window comment could not be posted. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
