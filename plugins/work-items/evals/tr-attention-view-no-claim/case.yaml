schema_version: "1.1"
name: tr-attention-view-no-claim
description: 'Reads never claim: a bare /work-items:triage on an offline local-markdown tracker holding two raw-intake items (#1 unlabeled, #2 with the needs-triage marker) lists both in the attention view and takes no seam claim on either, writing nothing to the item store. A run needs --scaffold and --allow-tools Bash,Edit.'
tags: [triage, attention-view, claim, must-not]
plugins: ["../.."]
expected_outcome: 'The run lists items #1 and #2, #1 under the unlabeled bucket and #2 under the raw-marker bucket. It runs no claim verb on either item and edits no file in .work-items/, since the attention view only reads.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/work-items:triage'
  allowed_tools: [Bash, Read, Glob, Grep, Edit]
  max_turns: 20
  timeout_seconds: 420
graders:
  - name: lists-both-items
    type: regex
    pattern: '^(?=[\s\S]*(?:#1\b|header row))(?=[\s\S]*(?:#2\b|--since))'
    target: last_message
    arm: with-only
  - name: no-claim
    type: tool_used
    tool: Bash
    input_match: '(?:work-item-tracker\.sh|\$\{?[A-Za-z_]\w*\}?)(?:\\")?[ \t]+claim\b|local-markdown/claim\.sh'
    min: 0
    max: 0
    arm: both
  - name: no-edit-store
    type: tool_used
    tool: Edit
    input_match: '"file_path":"(?:[^"\\]|\\.)*\.work-items/'
    min: 0
    max: 0
    arm: both
