schema_version: "1.1"
name: decompose-container-offer-and-execution-shape
graders:
  - name: 'shape-line'
    type: 'regex'
    pattern: 'execution\W{0,6}shape\W{0,8}per-item'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:decompose session does with the stated state. PASS only if it satisfies every point: (1) Offers container publish at the approval round for a multi-session source, defaulting to no, and never publishes container or vertical slices without explicit approval ; (2) On container approval, asks the one-line execution-shape follow-up (per-item PRs default vs integration branch -> single PR) and records the choice as an **Execution shape:** line in the container body rather than as any repo-level setting ; (3) Creates the container before the items and passes --parent on each item''s create-item so sub-items are native ; (4) Uses the Brief verbatim as the container body rather than inflating it into a long spec document ; (5) Resolves the container label from the binding''s config.container_label (default spec-container; spec-map here) and adds the human-gated label instead of hard-coding label strings or making the container claimable ; (6) States the close-at-ship ritual (close-out review against the container body, archival by closure) rather than leaving the container open as living documentation. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
