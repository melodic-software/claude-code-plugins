schema_version: "1.1"
name: tr-numbered-states-read-first
description: 'A numbered triage reads the project''s own record before it evaluates and names what it found: /work-items:triage 31, interactive, with the item given in the prompt. The workspace starts empty, so it holds no glossary, no ADRs and no scope statement, and step 1 must record each as none on a Read first: line rather than skip the line or invent a path. A run needs --allow-tools Bash.'
tags: [triage, read-first, numbered]
plugins: ["../.."]
expected_outcome: 'The run searches the workspace for a glossary, ADRs and a scope statement, finds none, and its triage output carries the line Read first: glossary none, ADRs none, scope none before its recommendation. It presents the recommendation and waits: it runs no tracker write (no label, comment or close).'
execution:
  prompt: "/work-items:triage 31\n\nInteractive session. The adapter's \"View item\" read for this repository returns issue #31 'CSV export drops the last row', opened 2026-10-02 by a reporter, with no labels, no comments and no linked pull request. Its body: 'Exporting a report with 10 rows to CSV gives a file with 9 data rows. Expected 10.' Use this item as given; there is no other tracker to read. Present your recommendation only and change nothing."
  allowed_tools: [Bash, Read, Glob, Grep]
  max_turns: 15
  timeout_seconds: 240
graders:
  - name: states-read-first-none
    type: regex
    pattern: '^[^\n]*\bRead first\b\W*glossary\W*none\b[^\n]*?\bADRs?\W*none\b[^\n]*?\bscope\W*none\b'
    flags: 'mi'
    target: last_message
    arm: both
  - name: no-tracker-write
    type: tool_used
    tool: Bash
    input_match: '(?:\b|(?<=\\n))gh[ \t]+(?:issue|pr)[ \t]+(?:edit|comment|close)\b|(?:\b|(?<=\\n))gh[ \t]+label[ \t]+(?:create|edit|delete)\b|(?:\b|(?<=\\n))gh[ \t]+api\b(?:(?:(?!\\n|;|&&|\|)[^\n])*?(?:-(?:X|-method)[ \t=]*(?:POST|PATCH|PUT|DELETE)\b|\bmutation\b)|(?!(?:(?!\\n|;|&&|\|)[^\n])*?-(?:X|-method)[ \t=]*GET\b)(?:(?:(?!\\n|;|&&|\|)[^\n])*?--input\b|(?!(?:(?!\\n|;|&&|\|)[^\n])*?[ \t]graphql\b)(?:(?!\\n|;|&&|\|)[^\n])*?(?:[ \t]-[fF]\b|--(?:raw-)?field\b)))'
    min: 0
    max: 0
    arm: both
