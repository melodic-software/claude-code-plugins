schema_version: "1.1"
name: wk-unbound-binding-routes-to-setup
graders:
  - name: 'routes-to-setup'
    type: 'regex'
    pattern: '/?work-items:setup\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:work session does with the stated state. PASS only if it satisfies every point: (1) Detects the missing tracker binding before the first coordination verb (the reclaim) instead of surfacing a raw seam exit 3; (2) Distinguishes setup never run (run /work-items:setup) from a deliberate gh-native operating mode; (3) Says an unbound lane cannot acquire a race-safe claim or lease, so it does not claim or dispatch; (4) Stops for the remediation and does not fabricate a binding to proceed. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
