schema_version: "1.1"
name: aq-answer-write-back-and-flip
graders:
  - name: 'disclaimer-true'
    type: 'regex'
    pattern: 'ai_disclaimer\b[^\n.]{0,40}\btrue\b|generated by AI during[\s*_`]{0,3}attend-queue'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:attend-queue session does with the stated state. PASS only if it satisfies every point: (1) Acquires the seam claim (assignee + lease, the same protocol as /work-items:work) on the [escalated] row #720 before any comment or label change on it, and leaves the [intake] row''s claim to /work-items:triage, which claims the item it writes to; (2) Uses /planning:interview behind an installed-ness gate, with inline focused questions, one at a time, as the fallback; (3) Writes the operator''s answer back as an issue comment on the escalated item rather than leaving the decision only in the session; (4) Flips the escalated item in ONE edit that applies the autonomous-eligible role and removes the human-gated role while still holding the claim, both resolved from config.role_labels, then clears @me via the adapter assignee edit; never clears the assignee before the flip; (5) Returns the flipped escalated item to the frontier without executing or dispatching it from this lane; (6) Runs intake triage through /work-items:triage''s interactive direction gate: recommend, wait for direction, then mutate; (7) Prefixes agent-authored comments with the AI disclaimer; (8) Never merges a PR and never executes a work item from this lane. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
