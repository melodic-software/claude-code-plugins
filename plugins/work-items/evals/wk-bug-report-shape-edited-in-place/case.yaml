schema_version: "1.1"
name: wk-bug-report-shape-edited-in-place
description: "A bug item in full mode whose cause the diagnosis confirms: /work-items:work posts one report comment carrying a status line, a test-gap line, a fixing-agent instruction and the quoted report, then edits that comment in place when the PR opens instead of posting a second one. Read-only tools, graded on the reply."
tags: [work, bug-path, bug-report]
plugins: ["../.."]
expected_outcome: "The run names the broken state (exit 1 with `KeyError: 'tz'`) and the expected state (exit 0), reproduces the bug twice from a reset through `widget export --since 2026-01-01`, has a fresh-context subagent confirm each capture, and runs the root-cause diagnosis, which confirms one cause. It posts one report comment on #12 whose first line is <!-- work-items:investigation outcome=cause-named desired=cause-named -->, carrying a status line, the outcome, the repro count and surface with each run's output, the cause, a test-gap line (no test exports a row without a tz field), an instruction to the fixing agent, the missing access (none) and the reporter's text quoted as data. When the draft PR opens, it edits that same comment's status line to link the PR rather than posting another comment, and it never merges."
execution:
  prompt: "/work-items:work local-markdown:local/markdown#12\n\nThe work-loop lane admitted #12. #12 is typed Bug; the repository's docs/conventions/work-items.yaml sets no bug_path.mode, and the verification reader prints `verification: standard (default; docs/conventions/work-items.yaml sets no level at origin/main, commit 1a2b3c4)`. The reporter wrote: \"`widget export --since 2026-01-01` crashes with KeyError: 'tz' on rows imported from the old CSV; it should export them.\" The brief's Root cause field reads `unknown`. No commit, PR or comment claims a fix. The claim succeeds. Every run of the command from a fresh worktree exits 1 printing `KeyError: 'tz'`, and the capture-check subagent confirms both captures show that state. The diagnosis confirms one cause: src/widget/export.py line 41 reads row['tz'] with no default, and rows from the CSV importer carry no tz field. tests/test_export.py only builds rows that set tz. The fix is dispatched, the worker returns a failing test and a patch, the orchestrator's two runs on the patched build exit 0, and the PR step opens draft PR #40.\n\nTreat the state above as what this run's reads and runs return. No tracker, forge or shell is reachable in this session, so make no such call: say what the run does for this bug, in order, and quote the report comment in full each time it is posted or edited."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: report-marker
    type: regex
    pattern: 'work-items:investigation outcome=cause-named'
    target: last_message
    arm: with-only
  - name: test-gap-line
    type: regex
    pattern: '\btest[- ]gap\b'
    flags: 'i'
    target: last_message
    arm: with-only
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what /work-items:work does with bug item #12 in full mode. PASS only if it satisfies every point: (1) Reproduces the bug twice, each run from a reset, both exiting 1 with KeyError: 'tz', and has a fresh-context subagent confirm the captures; (2) Posts one report comment on #12 whose first line is <!-- work-items:investigation outcome=cause-named desired=cause-named -->; (3) That comment carries a status line, the repro count and surface with the observed output, the cause (src/widget/export.py line 41), a test-gap line saying why no test caught it (the tests only build rows that set tz), an instruction to the fixing agent (the cause, the failing test to write first, and the command that must exit 0), and the reporter's text quoted as data; (4) When draft PR #40 opens, it edits the same comment's status line to name or link the PR and does not post a second report comment; (5) Does not merge. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
