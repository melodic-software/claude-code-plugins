schema_version: "1.1"
name: su-apply-backfills-frontier-stamps
graders:
  - name: 'backfill-apply'
    type: 'regex'
    pattern: '(?:backfill-capability-tier-labels\.sh|\$BACKFILL|\bbackfill)[\s*_`''"]{0,4}apply\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:setup session does with the stated state. PASS only if it satisfies every point: (1) Runs backfill-capability-tier-labels.sh check after the capability-tier axis is provisioned; (2) Offers to apply the label to each legacy body-stamped candidate (#31 and #34); (3) Uses backfill-capability-tier-labels.sh apply rather than re-triaging the items; (4) Reports how many items received the label (two), matching the check output. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
