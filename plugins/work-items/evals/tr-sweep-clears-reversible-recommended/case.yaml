schema_version: "1.1"
name: tr-sweep-clears-reversible-recommended
graders:
  - name: 'count-line'
    type: 'regex'
    pattern: '\b1[ \t]+of[ \t]+3\b'
    target: 'last_message'
  - name: 'decision-defaulted'
    type: 'regex'
    pattern: 'Decision defaulted:'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what /work-items:triage sweep does. PASS only if it satisfies every point: (1) States the count of items that fail the label test and carry a recommendation before any change; (2) Selects #640 and keeps the label on #641 (irreversible publish) and #642 (no recommendation); (3) Asks the operator once for that count rather than once per item; (4) Posts the comment, with its Decision defaulted line and the failed label test, before removing needs-human from #640; (5) Applies no autonomous-eligible role label or other label in the sweep edit. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
