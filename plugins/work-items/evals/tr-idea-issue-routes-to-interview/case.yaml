schema_version: "1.1"
name: tr-idea-issue-routes-to-interview
description: 'Idea issue: /work-items:triage named on item #1, a raw feature request ("We should add a plugin system to the ledger.") that states no problem, user or outcome, routes the item to /planning:interview and parks it with needs-spec. It runs no exploration first: no code search, no source read, no research. The prompt authorizes mutations up front, so the run is not held at the direction gate. A run needs --scaffold and --allow-tools Bash,Write,Edit.'
tags: [triage, idea-issue, must-not]
plugins: ["../.."]
expected_outcome: 'The run reads item #1, judges it an idea issue because it says nothing about what the plugin system is for, names /planning:interview as the next step and parks the item with needs-spec. It searches no code and reads nothing under src/ before or after routing.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/work-items:triage 1 You have my go-ahead to apply whatever labels, comments or close the outcome calls for without checking back with me.'
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit]
  max_turns: 20
  timeout_seconds: 420
graders:
  - name: routes-to-interview
    type: regex
    pattern: '^(?=[\s\S]*/planning:interview)(?=[\s\S]*\bneeds-spec\b)'
    target: last_message
    arm: both
  - name: no-grep
    type: tool_used
    tool: Grep
    input_match: '^(?![\s\S]*/work-items/)'
    min: 0
    max: 0
    arm: both
  - name: no-glob
    type: tool_used
    tool: Glob
    input_match: '^(?![\s\S]*(?:\.work|/work-items/))'
    min: 0
    max: 0
    arm: both
  - name: no-source-read
    type: tool_used
    tool: Read
    input_match: '"file_path":"(?:[^"\\]|\\.)*/src/'
    min: 0
    max: 0
    arm: both
  - name: no-bash-search
    type: tool_used
    tool: Bash
    input_match: '(?:"command":"|[ \t;&(]|\\[nt])(?:(?:grep|rg|ag)[ \t]|find[ \t]+[./~]|git[ \t]+(?:grep|log)\b)|(?:[ \t/"]|\\[nt])src(?![\w-])'
    min: 0
    max: 0
    arm: both
