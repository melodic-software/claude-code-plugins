schema_version: "1.1"
name: tr-ci-reentry-settled-confirms
description: 'Triage --ci re-entry: the recorded decision settles both questions and no person is needed, so the verdict applies no needs-owner-decision or needs-human label, asks nothing again, and flags no untrusted. Ported from the retired intake reentry-eval case settled-confirms. A run needs --scaffold.'
tags: [triage, ci-mode, intake, reentry]
plugins: ["../.."]
expected_outcome: 'The run reads .lane/scratch/issue.json, quotes the Decision recorded comment verbatim with its link, writes Flags: none and Open questions: none, applies only a priority label, and keeps needs_human false.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/work-items:triage --issue 99904 --ci\n\nYour scratchpad directory is `.lane/scratch`. The lane's output schema takes these keys: size small, medium or large; complexity low, medium or high; uncertainty known, knowable or unknown; type Bug, Task or Feature. This session has no structured-output channel, so end the run with a reply that is only the verdict: one JSON object in the schema's shape."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: reads-issue-json
    type: 'tool_used'
    tool: 'Read'
    input_match: '\.lane/scratch/issue\.json'
    min: 1
    arm: both
  - name: quotes-decision-marker
    type: 'regex'
    pattern: '(?:^|\\n|\n)> \*\*Decision recorded\.\*\*'
    target: 'last_message'
    arm: both
  - name: quotes-decision-verbatim
    type: 'regex'
    pattern: '(?:^|\\n|\n)> 2\. 90 days without a commit\.'
    target: 'last_message'
    arm: both
  - name: links-decision
    type: 'regex'
    pattern: 'issuecomment-100000004'
    target: 'last_message'
    arm: both
  - name: keeps-needs-human-false
    type: 'regex'
    pattern: '"needs_human"\s*:\s*false'
    target: 'last_message'
    arm: both
  - name: no-needs-decision
    type: 'regex'
    pattern: '"labels"\s*:\s*\[[^\]]*"needs-owner-decision"'
    match: 'not_contains'
    target: 'last_message'
    arm: both
  - name: no-needs-human-label
    type: 'regex'
    pattern: '"labels"\s*:\s*\[[^\]]*"needs-human"'
    match: 'not_contains'
    target: 'last_message'
    arm: both
  - name: asks-nothing-again
    type: 'regex'
    pattern: 'RECOMMENDED:|To answer, post a comment'
    match: 'not_contains'
    target: 'last_message'
    arm: both
  - name: no-untrusted-flag
    type: 'regex'
    pattern: '(?:^|\\n|\n)Flags: (?:[a-z]+,\s*)*untrusted\s*(?:,\s*[a-z]+\s*)*(?:\\n|\n|\"|$)'
    match: 'not_contains'
    target: 'last_message'
    arm: both
  - name: judges-open-questions
    type: llm
    criteria: 'PASS only if the verdict''s comment says the quoted decision settles the open questions and asks the owner nothing further. FAIL if it asks any question, re-asks a settled point, or raises a new open question.'
    focus: last_message
    arm: both
