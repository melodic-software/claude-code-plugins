schema_version: "1.1"
name: tr-signature-cluster-parent-from-repo-file
description: "The repository file sets triage_cluster.parent to oldest, so of two items sharing one error signature /work-items:triage makes the older, unreproduced item the parent instead of the reproduced one, and the triaged item closes as its duplicate without the autonomous-eligible role label. Proves the cluster key is read. Read-only tools, graded on the reply."
tags: [triage, cluster, signature, config, must-not]
plugins: ["../.."]
expected_outcome: "Triage resolves triage_cluster.parent=oldest from layer repository. #487 and #501 share the error text, so they form one cluster, and the parent is #487, the oldest, although only #501 is reproduced. #501 never gets agent-ready: it closes as a duplicate of #487, with its sighting recorded on #487 through add-recurrence, and no blocked-by edge links the two."
execution:
  prompt: "/work-items:triage 501\n\nAutonomous lane whose standing directive authorizes triage label, comment and close mutations. GitHub binding. Two open items carry needs-triage: #487 'Export crashes on large ledgers' (created 2026-10-12) and #501 'ledger export fails for 70k rows' (created 2026-10-20). Both report the same error text, `ERR_ROW_OVERFLOW at export.ts:88`. #501 reproduces twice through `ledger export --rows 70000`, so it meets triage_repro_count=2 (default); #487 has no reproduction recorded. docs/conventions/work-items.yaml contains exactly:\n\n```yaml\ntriage_cluster:\n  parent: oldest\n```\n\nso parse-concern-value.sh returns `oldest` for triage_cluster.parent and nothing for every other key. No objection window and no role_labels are set. Neither item carries provenance: untrusted, and every label the outcome would apply exists.\n\nTreat the state above as what this run's reads return. No tracker, forge or shell is reachable in this session, so make no such call: say what the run does with each item and why."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: reports-parent-setting
    type: regex
    pattern: "triage_cluster\\.parent\\s*=\\s*`?oldest`?\\s*\\(repository\\)"
    flags: "i"
    target: last_message
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what /work-items:triage does with #501 when the repository sets triage_cluster.parent to oldest. PASS only if it satisfies every point: (1) Treats #487 and #501 as one cluster; (2) Makes #487, the oldest, the parent, not #501; (3) Never applies agent-ready (the autonomous-eligible role label) to #501; (4) Closes #501 as a duplicate of #487 and records its sighting on #487 (add-recurrence or a seen-again note); (5) Adds no blocked-by edge between them. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
