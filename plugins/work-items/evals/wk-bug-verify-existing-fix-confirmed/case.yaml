schema_version: "1.1"
name: wk-bug-verify-existing-fix-confirmed
description: "A described bug item whose fix already landed on main: /work-items:work runs verify-existing-fix, the baseline reproducing twice and the patched build resolving it twice, ends Confirmed, closes the item with that evidence and opens no competing PR. Read-only tools, graded on the reply."
tags: [work, bug-path, verify-existing-fix, must-not]
plugins: ["../.."]
expected_outcome: "Because commit 4f1c2ab on main claims the fix, the run verifies it rather than writing a new one: it names the broken state (Hello, None) and the expected state (Hello, Ann), runs the command twice on the baseline 9e07d31 (both Hello, None) and twice on 4f1c2ab (both Hello, Ann) in one environment from a reset, reports the outcome Confirmed, and closes #8 with a comment citing 4f1c2ab and the four runs. It writes no fix, opens no PR and merges nothing."
execution:
  prompt: "/work-items:work local-markdown:local/markdown#8\n\nThe work-loop lane admitted #8; its work-class gate passed. #8 is typed Bug: `widget greet --name Ann` prints `Hello, None`, and the reporter expects `Hello, Ann`. After #8 was filed, commit 4f1c2ab `fix(greet): use the passed name` landed on main; its parent is 9e07d31. No open PR touches greet. The claim succeeds. From a fresh worktree, every run of the command at 9e07d31 prints `Hello, None` and every run at 4f1c2ab prints `Hello, Ann`.\n\nTreat the state above as what this run's reads and runs return. No tracker, forge or shell is reachable in this session, so make no such call: say what the run does for this bug, in order, and give its report with the outcome."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: confirmed-outcome
    type: regex
    pattern: '\bConfirmed\b'
    target: last_message
    arm: with-only
  - name: no-competing-pr
    type: regex
    pattern: '(?<!\bnever )(?<!\bnot )(?<!n''t )(?<!\bno )(?<!\bwithout )(?<!\binstead of )(?<!\brather than )\b(?:open|opens|opened|opening) (?:a|the|another) (?:new |competing |draft |second |fresh )?(?:PR|pull request)\b'
    flags: 'i'
    match: not_contains
    target: last_message
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what /work-items:work does with bug item #8, whose fix 4f1c2ab already landed on main. PASS only if it satisfies every point: (1) Names the broken state (Hello, None) and the expected state (Hello, Ann) before the runs; (2) Runs verify-existing-fix: the command twice on the baseline 9e07d31, both printing Hello, None, and twice on the patched build 4f1c2ab, both printing Hello, Ann, in one environment, each run from a reset; (3) Reports the outcome as Confirmed, one of the three outcomes Confirmed, Insufficient fix and Inconclusive; (4) Closes #8 with a comment that cites 4f1c2ab and the runs; (5) Writes no new fix and opens no PR; (6) Does not merge. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
