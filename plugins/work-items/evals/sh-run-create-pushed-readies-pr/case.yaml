schema_version: "1.1"
name: sh-run-create-pushed-readies-pr
graders:
  - name: 'create-pushed-worktree'
    type: 'regex'
    pattern: '\bcreate\b[^\n]{0,40}--pushed\b[^\n]{0,40}--worktree[\s*_`=]{1,4}/work/wt-361\b|\bcreate\b[^\n]{0,40}--worktree[\s*_`=]{1,4}/work/wt-361\b[^\n]{0,40}--pushed\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:ship run session does with the stated state. PASS only if it satisfies every point: (1) Opens the PR with /source-control:pull-request create --pushed --worktree /work/wt-361; (2) Relies on create --pushed to run ready --unattended, without waiting for the user to say land it, and dispatches no second ready; (3) Never flips the draft with a bare forge command; (4) Merges only on the user''s go-ahead. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
