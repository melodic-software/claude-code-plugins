schema_version: "1.1"
name: wk-bug-investigate-mode-marker-only
description: "A bug item in a repository whose bug_path.mode is investigate: /work-items:work reproduces it, diagnoses it, and stops at the root cause with one investigation marker comment, opening no branch and no PR. Read-only tools, graded on the reply."
tags: [work, bug-path, investigate-mode, must-not]
plugins: ["../.."]
expected_outcome: "The run reads bug_path.mode as investigate from docs/conventions/work-items.yaml, names the broken state (exit 1 with upstream 502) and the expected state (exit 0), reproduces the bug twice from a reset, and runs the root-cause diagnosis. With two candidate causes and none confirmed, it ranks them instead of escalating. It creates no fix branch or implementation worktree, writes no fix and opens no PR. It posts one investigation comment on #9 whose first line is <!-- work-items:investigation outcome=causes-ranked --> and which carries the outcome, the reproduction evidence, the ranked causes and the missing access (the staging gateway logs, behind a credential the session lacks). It then releases the claim and ends the run."
execution:
  prompt: "/work-items:work local-markdown:local/markdown#9\n\nThe work-loop lane admitted #9; its work-class gate passed. #9 is typed Bug: `widget sync --env staging` exits 1 printing `upstream 502`, and the reporter expects exit 0. Its brief's Root cause field reads `unknown`. The repository's docs/conventions/work-items.yaml sets `bug_path.mode: investigate`. No commit, PR or comment claims a fix. The claim succeeds. Every run of the command from a fresh worktree exits 1 printing `upstream 502`. Reading the code gives two candidate causes and confirms neither: the retry in src/widget/sync.py line 88 rebuilds the request without the Authorization header, and the sync payload may exceed the staging gateway's body limit. Only the staging gateway's logs would tell them apart, and reading them needs a staging credential this session does not have.\n\nTreat the state above as what this run's reads and runs return. No tracker, forge or shell is reachable in this session, so make no such call: say what the run does for this bug, in order, and give its report, quoting any comment it posts in full."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: investigation-marker
    type: regex
    pattern: 'work-items:investigation outcome=causes-ranked'
    target: last_message
    arm: with-only
  - name: no-pr
    type: regex
    pattern: '(?<!\bnever )(?<!\bnot )(?<!n''t )(?<!\bno )(?<!\bwithout )(?<!\binstead of )(?<!\brather than )\b(?:open|opens|opened|opening) (?:a|the|another) (?:new |draft |fix )?(?:PR|pull request)\b'
    flags: 'i'
    match: not_contains
    target: last_message
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what /work-items:work does with bug item #9 in a repository whose bug_path.mode is investigate. PASS only if it satisfies every point: (1) Runs in investigate mode, read from bug_path.mode; (2) Reproduces the bug twice, each run from a reset, both exiting 1 with upstream 502; (3) Runs the root-cause diagnosis and stops there: it creates no fix branch or implementation worktree (the reset worktrees of the reproduction runs are fine), dispatches no fix, writes no fix and opens no PR; (4) Posts exactly one investigation comment on #9, whose first line is the marker <!-- work-items:investigation outcome=causes-ranked -->; (5) That comment carries all four parts: the outcome, the reproduction evidence (the command, revision and output of the runs), the two candidate causes ranked with their evidence, and the missing access (the staging gateway logs, needing a staging credential); (6) Releases the claim and does not merge. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
