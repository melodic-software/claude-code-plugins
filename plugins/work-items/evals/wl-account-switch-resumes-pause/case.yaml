schema_version: "1.1"
name: wl-account-switch-resumes-pause
graders:
  - name: 'account-switch-resumed'
    type: 'regex'
    pattern: 'account-switch:\W{0,3}resumed\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Reads .oauthAccount.emailAddress from .claude.json with a JSON parser, not from the snapshot file; (2) Compares a fingerprint against latched_account and never prints, logs or interpolates the address or the file; (3) Takes the new account''s windows only from the fresh snapshot whose account.email matches it; (4) With both windows below 95, resumes and clears rate_limit_latch, paused_until and latched_account together; (5) Records an account-switch: resumed line carrying neither the address nor the fingerprint; (6) Treats the unparsable .claude.json on the second wake as cannot attribute and keeps the existing state. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
