schema_version: "1.1"
name: su-check-flags-duplicate-schedule-id
description: 'Setup check: /work-items:setup check in a bound checkout whose tracked .github/recurring-schedule.json carries two rows with the id dependency-review reports the duplicate id as a FAIL, since recheck <id> resolves against that key, and writes nothing. Slash-invoked, so it has no Skill grader (a slash command loads the skill without a Skill call). A run needs --scaffold and --allow-tools Bash,Write,Edit (Write and Edit are granted so the must-not graders can fail).'
tags: [setup, check, must-not]
plugins: ["../.."]
expected_outcome: 'The run resolves the binding and schedule, reports a PASS/FAIL/INFO table whose schedule-validity row FAILs naming the duplicate id dependency-review, and changes no file: no Write or Edit call, and no shell write to the schedule, the binding or .gitignore.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/work-items:setup check'
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit]
  max_turns: 20
  timeout_seconds: 420
graders:
  - name: names-duplicate-id
    type: regex
    pattern: '\bFAIL[^\n]{0,160}(?:(?:[Dd]uplicat\w*|[Cc]ollision|[Cc]ollides|(?:Not|not) unique|[Nn]on-unique|(?:Twice|twice)|[Rr]epeated|[Mm]ore than once)[^\n]{0,120}dependency-review|dependency-review[^\n]{0,120}(?:[Dd]uplicat\w*|[Cc]ollision|[Cc]ollides|(?:Not|not) unique|[Nn]on-unique|twice|[Rr]epeated|more than once))|(?:(?:[Dd]uplicat\w*|[Cc]ollision|[Cc]ollides|(?:Not|not) unique|[Nn]on-unique|(?:Twice|twice)|[Rr]epeated|[Mm]ore than once)[^\n]{0,120}dependency-review|dependency-review[^\n]{0,120}(?:[Dd]uplicat\w*|[Cc]ollision|[Cc]ollides|(?:Not|not) unique|[Nn]on-unique|twice|[Rr]epeated|more than once))[^\n]{0,160}\bFAIL'
    target: last_message
    arm: both
  - name: ran-home-resolver
    type: tool_used
    tool: Bash
    input_match: 'resolve-convention-home\.sh'
    arm: with-only
  - name: no-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*(?:recurring-schedule\.json|work-items(?:\.local)?\.ya?ml|\.gitignore|\.work-items/)'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*(?:recurring-schedule\.json|work-items(?:\.local)?\.ya?ml|\.gitignore|\.work-items/)'
    min: 0
    max: 0
    arm: both
  - name: no-shell-write
    type: tool_used
    tool: Bash
    input_match: '(?:(?<![-=])>>?[ \t]*(?:\\"|'')?[^ \t|;&<>"''\\]*|(?:\btee\b|\bcp\b|\bmv\b|\brm\b|\bsed\b(?:[^|;&\\]|\\(?!n))*[ \t]-i)(?:[^|;&\\]|\\(?!n))*)(?:recurring-schedule\.json|work-items(?:\.local)?\.ya?ml|\.gitignore)'
    min: 0
    max: 0
    arm: both
