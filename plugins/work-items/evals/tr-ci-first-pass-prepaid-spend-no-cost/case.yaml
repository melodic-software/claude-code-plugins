schema_version: "1.1"
name: tr-ci-first-pass-prepaid-spend-no-cost
description: 'Triage --ci first pass on work whose only spend is model runs on the prepaid keys and a cron line a diff shows (the repository''s Cost triage rule): no cost flag, no Cost line, no needs-human label, needs_human false. Ported from the retired intake reentry-eval case first-pass-prepaid-spend-no-cost. A run needs --scaffold.'
tags: [triage, ci-mode, intake, first-pass]
plugins: ["../.."]
expected_outcome: 'The run reads .lane/scratch/issue.json and the repository''s Triage rules, sets no cost flag and writes no Cost line for prepaid eval runs and a cron schedule, applies no needs-human label, and keeps needs_human false.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/work-items:triage --issue 99909 --ci\n\nYour scratchpad directory is `.lane/scratch`. The lane's output schema takes these keys: size small, medium or large; complexity low, medium or high; uncertainty known, knowable or unknown; type Bug, Task or Feature. This session has no structured-output channel, so end the run with a reply that is only the verdict: one JSON object in the schema's shape."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: no-cost-flag
    type: 'regex'
    pattern: '(?:^|\\n|\n)Flags: (?:[a-z]+,\s*)*cost\s*(?:,\s*[a-z]+\s*)*(?:\\n|\n|\"|$)'
    match: 'not_contains'
    target: 'last_message'
    arm: both
  - name: no-cost-line
    type: 'regex'
    pattern: '(?:^|\\n|\n)Cost: '
    match: 'not_contains'
    target: 'last_message'
    arm: both
  - name: no-needs-human-label
    type: 'regex'
    pattern: '"labels"\s*:\s*\[[^\]]*"needs-human"'
    match: 'not_contains'
    target: 'last_message'
    arm: both
  - name: keeps-needs-human-false
    type: 'regex'
    pattern: '"needs_human"\s*:\s*false'
    target: 'last_message'
    arm: both
