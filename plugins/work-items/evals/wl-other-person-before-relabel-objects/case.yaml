schema_version: "1.1"
name: wl-other-person-before-relabel-objects
graders:
  - name: 'objection-line'
    type: 'regex'
    pattern: 'objection:[\s*_`]{0,6}#?307\b\W{0,4}(?:->|→)\W{0,4}escalated'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Treats the outside commenter''s 08:30 comment as a new objection, since its author is not the actor of the trusted agent-ready application; (2) Escalates #307 as kind=escalated naming the objecting comment; (3) Does not admit or dispatch #307; (4) Lists objection: #307 -> escalated in the cycle report. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
