schema_version: "1.1"
name: aq-flip-needs-no-class-label
graders:
  - name: 'both-flip-no-class-gate'
    type: 'regex'
    pattern: '^(?![\s\S]*(?<!not )(?<!n''t )(?<!never )(?<!neither )\b(?:cannot|can''t|must|waits?|blocked|held|won''t|will not|stays?|remains?|keeps?|gated|doesn''t flip|does not flip)[^\n.]{0,20}(?:until|unless)[^\n.]{0,40}(?:reclassif|class label))(?=[\s\S]*#4400)(?=[\s\S]*#4401)(?=[\s\S]*(?:agent-ready|autonomous-eligible))'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:attend-queue session does with the stated state. PASS only if it satisfies every point: (1) Flips #4400 to the autonomous-eligible role without a class label; (2) Flips #4401 without reclassifying it away from its structural class; (3) Applies the role label and removes the human-gated one in a single edit per item, while the claim is held; (4) Writes no class label. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
