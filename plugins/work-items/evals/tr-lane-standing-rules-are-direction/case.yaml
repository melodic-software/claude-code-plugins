schema_version: "1.1"
name: tr-lane-standing-rules-are-direction
graders:
  - name: 'disclaimer-text'
    type: 'regex'
    pattern: 'generated by AI during triage|^(?![^\n]*\b(?:no|without|omit\w*|skip\w*|not|never|drop\w*)\b[^\n]*\bdisclaimer)[^\n]*(?:\b(?:every|each|all)\b[^\n]{0,40}\b(?:comments?|items?|posts?)\b[^\n]{0,60}\bdisclaimer\b|\bdisclaimer\b[^\n]{0,60}\b(?:prefix\w*|start\w*|open\w*|first line)\b)'
    flags: 'im'
    target: 'last_message'
  - name: 'no-question'
    type: 'regex'
    pattern: '\b(?:shall|should|may)[ \t]+I\b[^\n]*\?|\b(?:do you want|want me to)\b[^\n]*\?'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what /work-items:triage does for #71 in an AFK lane with ai_disclaimer true. PASS only if it satisfies every point: (1) Takes the autonomous-lane branch of the direction gate: the lane''s standing rules satisfy it, so mutation proceeds without a human turn; (2) Does not wait for explicit operator direction, since blocking would deadlock the lane; (3) Prefixes every comment and item it creates with the AI disclaimer; (4) Routes label and comment writes through the bound adapter and any item creation through the seam''s create-item, with no inline provider commands. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
