schema_version: "1.1"
name: aq-human-gated-one-at-a-time
graders:
  - name: 'states-count'
    type: 'regex'
    pattern: '\b(?:3|three)\b[\s*_`]{0,6}(?:\[?human-gated\]?[\s*_`]{0,6})?(?:rows?|items?)\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:attend-queue session does with the stated state. PASS only if it satisfies every point: (1) States the count of [human-gated] rows before working any; (2) Offers one item per question, starting with #1201, and never batches two items into one question; (3) Restates the item and the part of the label test it meets before asking about it; (4) Waits for the operator''s answer or skip on one row before offering the next; (5) Leaves needs-human on an item whose answer still meets the label test and records the answer as a comment. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
