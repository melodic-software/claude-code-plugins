schema_version: "1.1"
name: oa-bundled-provider-routes-to-setup
description: 'Bundled-provider route: asked to generate an adapter for jira, which the plugin already bundles, the run says jira is bundled and routes to /work-items:setup instead of generating anything: no generator run, no adapter files written through Bash, and no Write or Edit call. A run needs --scaffold and --allow-tools Bash,Write,Edit.'
tags: [onboard-adapter, routing, must-not]
plugins: ["../.."]
expected_outcome: 'The answer says jira is one of the providers the plugin bundles, so a consumer-owned adapter is not the path, and routes to /work-items:setup to bind it. It does not run generate-adapter.sh, does not write a spec or adapter files, and makes no Write or Edit call.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/work-items:onboard-adapter jira We track work in Jira Cloud at acme.atlassian.net. Generate the work-item adapter for it in this repo now.'
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit]
  max_turns: 12
  timeout_seconds: 300
graders:
  - name: routes-to-setup
    type: regex
    pattern: '^(?![^\n]*\b(?:not|don[''’]t|never|instead of|rather than|skip)\b[^\n]{0,30}work-items:setup)[^\n]*\bwork-items:setup\b'
    flags: 'mi'
    target: last_message
  - name: says-bundled
    type: regex
    pattern: '^(?=[^\n]*\bjira\b)(?![^\n]*\b(?:not|isn[''’]t|no longer|never)\s+(?:\w+\s+){0,2}?(?:bundled|supported|built[- ]in|included|shipped)\b)[^\n]*\b(?:bundled|bundles|built[- ]in|ships (?:with|an?)\b|already (?:supported|ships?|includes?|included|has|bundles?|provides?)|supported providers?|first-party|out of the box)'
    flags: 'mi'
    target: last_message
  - name: no-generate
    type: tool_used
    tool: Bash
    input_match: 'generate-adapter'
    min: 0
    max: 0
    arm: both
  - name: no-adapter-write-bash
    type: tool_used
    tool: Bash
    input_match: '(?:^|[ \t;&|("]|\\n)(?:tee|cp|mv|install|mkdir|touch|dd|ln)\b(?:(?!\\n|;|&&|\|)[^\n])*?\badapters\b|>>?[ \t]*[^ \t;&|]*\badapters/'
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
