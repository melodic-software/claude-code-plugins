schema_version: "1.1"
name: tk-publish-plan-edits-own-comment
graders:
  - name: 'edits-4410'
    type: 'regex'
    pattern: '(?:edit|update[ds]?|updating|replac|patch|rewrit)[^\n]{0,80}\b4410\b|\b4410\b[^\n]{0,80}(?:edit|update[ds]?|updating|replac|in place|patch|rewrit)'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what /work-items:track publish-plan does for #812. PASS only if it satisfies every point: (1) The published body''s first line is exactly <!-- planning:plan v1 --> followed by the unchanged plan text; (2) Matches an earlier plan comment by its first line and by the publishing login, so comment 4502 is ignored; (3) Edits comment 4410 in place rather than posting a second plan comment; (4) Passes the body to the adapter as a file, not as text on a command line; (5) Checks the plan file for an Approval: line before any write. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
