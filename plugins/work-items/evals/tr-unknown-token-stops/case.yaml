schema_version: "1.1"
name: tr-unknown-token-stops
description: 'Unknown-token stop: /work-items:triage --bogus 12 carries a token outside the accepted set, so the triage stops, names the accepted set (sweep, --config-ref, a number, --issue <n> --ci), makes no tracker call and writes no triage-verdict.json. A run needs --scaffold and --allow-tools Bash,Write,Edit.'
tags: [triage, arguments, hard-stop, must-not]
plugins: ["../.."]
expected_outcome: 'The answer stops on --bogus and names the accepted tokens, sweep and --config-ref among them. No tracker or forge command runs, and no triage-verdict.json is created or written.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/work-items:triage --bogus 12'
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit, Skill]
  max_turns: 10
  timeout_seconds: 240
graders:
  - name: names-accepted-set
    type: regex
    pattern: '^(?=[\s\S]*\bsweep\b)(?=[\s\S]*--config-ref)'
    flags: 'i'
    target: last_message
    arm: both
  - name: no-tracker-call
    type: tool_used
    tool: Bash
    input_match: '\bwork-item-tracker\.sh\b|\bgh[ \t]+(?:issue|pr|api|label)\b'
    min: 0
    max: 0
    arm: both
  - name: no-verdict-file
    type: file_exists
    path: '**/triage-verdict.json'
    exists: false
    arm: both
  - name: no-verdict-write
    type: tool_used
    tool: Write
    input_match: 'triage-verdict'
    min: 0
    max: 0
    arm: both
