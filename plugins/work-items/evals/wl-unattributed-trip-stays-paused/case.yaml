schema_version: "1.1"
name: wl-unattributed-trip-stays-paused
graders:
  - name: 'latched-account-null'
    type: 'regex'
    pattern: '^(?=[\s\S]*(?:paused_until[\s*_`]{0,4}(?:=|:|is set to|set to|is|stays at)[\s*_`\"]{0,4}(?!null\b|set\b)[\w<]|rate_limit_latch[\s*_`]{0,4}(?:=|:|is set to|set to|is|stays|remains)?[\s*_`]{0,4}true\b|\bstays\s+paused\b))[\s\S]*latched_account\W{0,6}(?:=|:|stays|remains|is|left(?: as)?|as)?\W{0,6}null\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Leaves latched_account null at pause entry because the tripping snapshot has no account.email; (2) Does not treat the readable .claude.json account as a switch at pause entry and does not drop the pause; (3) Stays paused until the tripped window''s resets_at with rate_limit_latch set, and stops claiming new work; (4) On the first later wake records the .claude.json fingerprint as latched_account and continues the ordinary re-evaluation; (5) Never prints, logs or interpolates the address or the state file. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
