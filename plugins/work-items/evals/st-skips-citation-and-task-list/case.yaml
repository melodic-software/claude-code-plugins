schema_version: "1.1"
name: st-skips-citation-and-task-list
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'one-grep-pass'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '\bgit\b[^\n]*\bgrep\b[^\n]*TODO[^\n]*FIXME'
    min: 1
  - name: 'no-citation-filed-skill'
    type: 'tool_used'
    tool: 'Skill'
    input_match: 'csvkit|\[TODO\]|phase[ \t]+[23]|scheduler|legacy export'
    min: 0
    max: 0
  - name: 'no-citation-filed-bash'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'create-item[^\n]*(?:csvkit|phase[ \t]+[23]|scheduler|legacy export)'
    min: 0
    max: 0
  - name: 'lists-real-groups'
    type: 'regex'
    pattern: '^(?=[\s\S]*\blib\b)[\s\S]*\bsrc\b'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply and the trace as the account of what /work-items:scan-todos did with an upstream citation and a task list it was asked to file. PASS only if it satisfies every point: (1) Does not file the acme/csvkit#12 upstream citation as a work item; (2) Does not treat the [TODO] task-list lines in docs/plan.md as comment markers; (3) Still sweeps the real TODO/FIXME comment markers in lib/ and src/. A point counts only when the reply states it or the trace plainly shows it; it need not use the same words. FAIL if any point is missing or contradicted.'
    focus: 'trace'
