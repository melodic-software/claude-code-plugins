schema_version: "1.1"
name: wk-bug-investigate-not-reproduced-pair
description: "A bug item in investigate mode that does not reproduce: /work-items:work posts one investigation marker whose desired-state/result-state pair reads desired cause-named, outcome not-reproduced, then escalates. Read-only tools, graded on the reply."
tags: [work, bug-path, investigate-mode, prework-pair]
plugins: ["../.."]
expected_outcome: "The run reads bug_path.mode as investigate, names the broken state (exit 1 printing `lock held`) and the expected state (exit 0), and runs the reported command twice from a reset. Both runs exit 0, so the bug does not reproduce: it skips the diagnosis, writes no fix and opens no PR. It posts one investigation comment on #12 whose first line is <!-- work-items:investigation outcome=not-reproduced desired=cause-named -->, so the result state differs from the desired state, and the comment carries the outcome, the reproduction evidence, `none` for ranked causes and the missing access. It then escalates citing that comment and releases the claim."
execution:
  prompt: "/work-items:work local-markdown:local/markdown#12\n\nThe work-loop lane admitted #12. #12 is typed Bug: `cache prune --all` exits 1 printing `lock held`, and the reporter expects exit 0. The repository's docs/conventions/work-items.yaml sets `bug_path.mode: investigate`. No commit, PR or comment claims a fix. The claim succeeds. Both runs of the command, each from a fresh worktree, exit 0 and print `pruned 0 entries`. Nothing the session lacks access to bears on the report.\n\nTreat the state above as what this run's reads and runs return. No tracker, forge or shell is reachable in this session, so make no such call: say what the run does for this bug, in order, and give its report, quoting any comment it posts in full."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: pair-marker
    type: regex
    pattern: 'work-items:investigation outcome=not-reproduced desired=cause-named'
    target: last_message
    arm: with-only
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what /work-items:work does with bug item #12 in a repository whose bug_path.mode is investigate. PASS only if it satisfies every point: (1) Runs in investigate mode, read from bug_path.mode; (2) Runs the reported command twice, each from a reset, and finds both runs exit 0, so the bug does not reproduce; (3) Skips the diagnosis, writes no fix and opens no PR; (4) Posts exactly one investigation comment on #12 whose first line is the marker <!-- work-items:investigation outcome=not-reproduced desired=cause-named -->, the outcome first and the desired state after it; (5) Escalates the item, citing that comment, and releases the claim. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
