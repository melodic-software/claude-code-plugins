schema_version: "1.1"
name: tr-needs-info-clears-raw-marker
graders:
  - name: 'clears-raw-marker'
    type: 'regex'
    pattern: '(?:remov|clear|drop|replac|swap)\w*[^\n]{0,60}(?:needs-triage|raw[ \t-]+marker)|(?:needs-triage|raw[ \t-]+marker)[^\n]{0,60}(?:remov|clear|drop|replac|swap|off\b|gone)'
    flags: 'i'
    target: 'last_message'
  - name: 'needs-info'
    type: 'regex'
    pattern: '\bneeds-reporter-info\b|\bneeds-info\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what /work-items:triage does when parking #42 at needs-info. PASS only if it satisfies every point: (1) Clears needs-triage in the same edit that applies needs-reporter-info; (2) Leaves the open item carrying needs-reporter-info without needs-triage; (3) Says clearing the raw marker does not orphan the item: it re-enters the attention view through the needs-info-reply bucket when the reporter replies; (4) Distinguishes that re-entry from the every-cycle re-selection a leftover raw marker would cause. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
