schema_version: "1.1"
name: wl-headless-truncated-snapshot-stops
description: "Port of work-loop evals.json case 28 (work-loop-headless-truncated-snapshot-escalates-and-stops): a described snapshot, read-only tools, graded on the reply."
tags: [work-loop, snapshot]
plugins: ["../.."]
expected_outcome: "The truncated frontier read makes the snapshot unusable, so the cycle aborts with no state change: no intake sweep, admission, execution or exit evaluation, and the durable counters are written back as read with only heartbeat_at moving. In the same cycle, without waiting for the no-progress threshold, it raises the stall escalation (`Lane stall: work-loop`, human-gated role label, machine-marked escalation comment) naming the truncated read, the linear adapter and its list_items_max of 1000. Because the launch is headless, the lane then stops the loop with a message saying the snapshot was truncated at the linear adapter's list_items_max of 1000 and the lane cannot see its whole backlog, instead of scheduling another cycle."
execution:
  prompt: "/work-items:work-loop --standing\n\nHeadless launch (claude -p from a launcher-stored prompt). Cycle start. Durable state shows no_progress_streak=0, item_cap=3. The bound adapter is linear, whose capabilities declare limits.list_items_max 1000. The seam's list-frontier --autonomous exits 0 with {\"schema_version\":\"1.0\",\"items\":[{\"id\":\"linear:ENG-12\"}],\"truncated\":true}. No open `Lane stall: work-loop` item exists.\n\nTreat the state above as what this cycle's reads return. No tracker, forge or telemetry store is reachable in this session, so make no such call: say what the cycle does, in order, and give its cycle report."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: names-adapter-limit
    type: regex
    pattern: "(?=[\\s\\S]*\\btruncat\\w*)(?=[\\s\\S]*\\blinear\\b)(?=[\\s\\S]*\\b1,?000\\b)"
    target: last_message
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what the work-loop session does with the stated state. PASS only if it satisfies every point: (1) Aborts the cycle on the truncated read and does not admit or execute linear:ENG-12; (2) Raises the stall escalation in this cycle even though no_progress_streak is 0; (3) Leaves the durable counters as they were read; (4) Stops the loop because the launch is headless, with a message naming the linear adapter and the list_items_max of 1000; (5) Does not schedule another cycle. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
