schema_version: "1.1"
name: tr-unsolicited-pr-is-attached-code
graders:
  - name: 'attachment-not-obligation'
    type: 'regex'
    pattern: '\battachment\b|\b(?:no|not|never|nothing)\b[^\n]{0,60}\b(?:oblig\w*|commit\w*)\b[^\n]{0,30}\bmerge\b|\bno[^\n]{0,20}obligation\b'
    flags: 'i'
    target: 'last_message'
  - name: 'waits-for-direction'
    type: 'regex'
    pattern: '\?[ \t*_]*$|\bwait(?:s|ing)?\b[^\n]{0,40}\b(?:direction|go-ahead|confirm\w*|approval|answer|say-so)\b'
    flags: 'im'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what /work-items:triage does with an unsolicited outside pull request. PASS only if it satisfies every point: (1) Treats the PR as an item with attached code entering the same intake as an issue; (2) Evaluates the diff as an attachment (check out, run the relevant tests) rather than as an obligation to merge; (3) Classifies the request bug versus enhancement (Type Bug versus Feature) before recommending a state; (4) Recommends and waits for the operator''s direction before applying labels, commenting or closing; (5) Routes any label, comment or close through the bound adapter and any item creation through the seam''s create-item, with no inline provider commands. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
