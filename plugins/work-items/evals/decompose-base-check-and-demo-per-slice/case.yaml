schema_version: "1.1"
name: decompose-base-check-and-demo-per-slice
graders:
  - name: 'demo-line'
    type: 'regex'
    pattern: '\bdemo\b[\s*_`]{0,6}:'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the /work-items:decompose session does with the stated state. PASS only if it satisfies every point: (1) Flags AC2 as already passing at the base commit and does not flag AC1 ; (2) Asks the user by name whether to sharpen AC2 until it fails at base, leave it out as already met, or keep it with a written reason, rather than dropping or keeping it silently ; (3) Shows a Demo line for each draft item and asks the user what each slice demos ; (4) Publishes nothing before the user approves the breakdown. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
