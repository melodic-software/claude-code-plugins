<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morning Brief</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); }
.page { max-width: 56rem; margin: 0 auto; padding: 0 16px; padding-block: 2rem 3rem; display: grid; gap: 1rem; }
.eyebrow { margin: 0; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1, h2 { font-family: var(--serif); }
h1 { margin: 0.25rem 0 0.5rem; font-size: 1.6rem; line-height: 1.2; text-wrap: balance; }
.notes { list-style: none; margin: 0; padding: 0; color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.75rem; }
.bar input { flex: 1 1 14rem; min-width: 0; padding: 0.5rem 0.65rem; border: var(--border); border-radius: 6px; background: var(--panel); color: var(--fg); font: inherit; }
.sections { display: grid; gap: 1rem; }
details { background: var(--panel); border: var(--border); border-radius: var(--radius-panel); padding: 0.75rem 1rem; }
summary { cursor: pointer; font-weight: 600; }
.lines { list-style: none; margin: 0.75rem 0 0; padding: 0; font-size: 0.85rem; }
.lines li { white-space: pre-wrap; overflow-wrap: anywhere; }
code { font-family: var(--mono); }
input:focus-visible, summary:focus-visible, .actions button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
.actions button { padding: 0.45rem 0.85rem; border: var(--border); border-radius: 6px; background: var(--panel); color: var(--fg); font: inherit; font-weight: 500; cursor: pointer; }
.status { margin: 0.4rem 0 0; font-size: 0.85rem; color: var(--muted); }
.out { margin: 0.5rem 0 0; padding: 0.65rem; border: var(--border); border-radius: 6px; background: var(--panel); font: 0.85rem/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  /* rv-chrome:begin */
  .rv-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: flex-end; }
  .rv-theme { display: inline-flex; border: 1px solid var(--muted); border-radius: 8px; overflow: hidden; }
  .rv-theme button { margin: 0; padding: 0.35rem 0.75rem; border: 0; border-radius: 0; background: transparent; color: var(--fg); font: inherit; font-weight: 500; cursor: pointer; }
  .rv-theme button + button { border-left: 1px solid var(--muted); }
  .rv-theme button[aria-pressed=true] { background: var(--fg); color: var(--bg); }
  .rv-theme button:focus-visible { outline: 3px solid var(--fg); outline-offset: -3px; }
  .rv-comment { display: grid; gap: 0.4rem; }
  .rv-comment h2 { margin: 0; }
  .rv-comment textarea { min-height: 5rem; padding: 0.6rem; border: 1px solid var(--muted); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; resize: vertical; }
  .rv-comment textarea:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  /* rv-chrome:end */
</style>
</head>
<body>
<main class="page">
<div class="rv-bar"><div class="rv-theme" role="group" aria-label="Theme"><button type="button" data-rv-theme="system" aria-pressed="true">System</button><button type="button" data-rv-theme="light" aria-pressed="false">Light</button><button type="button" data-rv-theme="dark" aria-pressed="false">Dark</button></div></div>
<header>
<p class="eyebrow">Operator status report</p>
<h1 data-rv-text="title">Morning brief</h1>
<ol class="notes" data-rv-each="notes"><li data-rv-text="line"></li></ol>
<div class="bar">
<label for="find">Filter</label>
<input id="find" type="search" placeholder="A PR number, issue number, lane or word" data-rv-filter="lines">
</div>
</header>
<div class="sections" data-rv-each="sections">
<section>
<details open>
<summary data-rv-text="name"></summary>
<ol class="lines" data-rv-each="lines"><li><code data-rv-text="line"></code></li></ol>
</details>
</section>
</div>
<section class="rv-comment" aria-labelledby="rv-comment-h">
<h2 id="rv-comment-h">Comment</h2>
<label for="rv-comment-text">Your comment for the session</label>
<textarea id="rv-comment-text" data-rv-note="comment" placeholder="Say what should change, or ask a question"></textarea>
<div class="actions">
<button type="button" data-rv-copy="morning-brief-comment">Copy comment</button>
<button type="button" data-rv-download="morning-brief-comment">Save as file</button>
</div>
<p class="status" role="status" data-rv-status=""></p>
<pre class="out" data-rv-out="" hidden></pre>
</section>
</main>
</body>
</html>
