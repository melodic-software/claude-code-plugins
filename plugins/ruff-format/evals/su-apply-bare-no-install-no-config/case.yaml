schema_version: "1.1"
name: su-apply-bare-no-install-no-config
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'install-needs-argument'
    type: 'llm'
    criteria: 'The reply says bare apply installs nothing, and that apply install-ruff is the explicit argument that authorizes installing Ruff.'
    focus: 'last_message'
  - name: 'no-global-no-new-env'
    type: 'llm'
    criteria: 'The reply says the skill never installs Ruff globally and never creates a virtual environment: even apply install-ruff installs only into a managed environment the repository already uses, which this repository does not have.'
    focus: 'last_message'
  - name: 'config-only-on-ask'
    type: 'llm'
    criteria: 'The reply says apply writes no Ruff config on its own and creates a minimal one only when the user explicitly asks, because the plugin imposes no rules of its own; without a config the plugin stays inert.'
    focus: 'last_message'
  - name: 'no-ruff-toml'
    type: 'file_exists'
    path: '**/ruff.toml'
    exists: false
  - name: 'no-dot-ruff-toml'
    type: 'file_exists'
    path: '**/.ruff.toml'
    exists: false
  - name: 'no-pyproject'
    type: 'file_exists'
    path: '**/pyproject.toml'
    exists: false
  - name: 'no-venv'
    type: 'file_exists'
    path: '**/pyvenv.cfg'
    exists: false
