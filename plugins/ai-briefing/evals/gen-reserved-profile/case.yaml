schema_version: "1.1"
name: gen-reserved-profile
graders:
  - name: rejects-profile
    type: regex
    pattern: '\breserved\b|\bdevice name\b|\bcon\b[^\n]{0,160}?(?:\binvalid\b|\bis not (?:a )?(?:valid|allowed|permitted|usable)\b|\bisn''t (?:a )?(?:valid|allowed|permitted|usable)\b|\bnot allowed\b|\brejected\b|\bcannot be used\b|\bcan''t be used\b)|(?:\binvalid\b|\brejected?\b)[^\n]{0,160}?\bcon\b'
    flags: 'i'
    target: last_message
  - name: no-webfetch
    type: tool_used
    tool: 'WebFetch'
    min: 0
    max: 0
    arm: 'both'
  - name: no-websearch
    type: tool_used
    tool: 'WebSearch'
    min: 0
    max: 0
    arm: 'both'
  - name: no-profile-read
    type: tool_used
    tool: 'Read'
    input_match: 'ai-briefing[/\\]+con(?![\w-])'
    min: 0
    max: 0
    arm: 'both'
  - name: no-profile-glob
    type: tool_used
    tool: 'Glob'
    input_match: 'ai-briefing[/\\]+con(?![\w-])'
    min: 0
    max: 0
    arm: 'both'
