schema_version: "1.1"
name: gen-candidate-batch-ranking
graders:
  - name: partisan-dropped
    type: regex
    pattern: 'newswire\.example/(?:deepfake-meme|partisan-horse-race)|\b(?:deepfake|horse[- ]race)\b'
    flags: 'i'
    match: not_contains
    target: last_message
  - name: vendorco-kept
    type: regex
    pattern: '^[ \t]*(?:#{1,4}[ \t]+[^\n]*\b(?:legal|regulat\w*)\b[^\n]*|\*\*[^*\n]*\b(?:legal|regulat\w*)\b[^*\n]*\*\*[ \t]*$)(?:\n(?![ \t]*(?:#{1,2}[ \t]|\*\*(?!(?:HIGH|MEDIUM|MED|LOW)\*\*[ \t]*$)[^*\n]+\*\*[ \t]*$))[^\n]*){0,20}?\bVendorCo\b'
    flags: 'im'
    target: last_message
  - name: robotics-extras
    type: regex
    pattern: '^[ \t]*(?:#{1,4}[ \t]+[^\n]*\bEXTRAS?\b[^\n]*|\*\*[^*\n]*\bEXTRAS?\b[^*\n]*\*\*[ \t]*$)(?:\n(?![ \t]*(?:#{1,2}[ \t]|\*\*(?!(?:HIGH|MEDIUM|MED|LOW)\*\*[ \t]*$)[^*\n]+\*\*[ \t]*$))[^\n]*){0,20}?\b(?:Anchorpoint|Unit-7)\b'
    flags: 'im'
    target: last_message
  - name: impact-annotation
    type: regex
    pattern: '\bimpact\b\**[ \t]*[:=][ \t]*\**[ \t]*(?:high|medium|low|none)\b'
    flags: 'i'
    target: last_message
  - name: tooling-high
    type: llm
    criteria: "Read each item's rank from the HIGH, MEDIUM/MED or LOW tier heading or label it sits under, in any section or in a summary list such as '- **HIGH:**' followed by item names. PASS only if Solstice Code v3.6, Meridian Agent CLI 0.9 and Northwind IDE 4.1 each sit under HIGH. FAIL if any of them sits under MEDIUM, MED or LOW, appears only in EXTRAS or an excluded list, or is missing, or if the scaling-laws speculation post is ranked above any of them."
    focus: last_message
  - name: speculation-not-high
    type: llm
    criteria: "Read each item's rank from the HIGH, MEDIUM/MED or LOW tier heading or label it sits under, in any section. PASS only if the Meridian scaling-laws speculation post and the 'AGI is basically here' influencer post each sit under MEDIUM or LOW. FAIL if either sits under HIGH, or is missing or appears only in an excluded list."
    focus: last_message
