schema_version: "1.1"
name: codify-recurring-mistake-reports-no-guardrail
description: 'A recurring mistake a machine can decide, with no check, is reported as a no guardrail finding naming the criterion.'
tags: [codify, ported]
plugins: ["../.."]
expected_outcome: 'The answer reports a no guardrail finding, names the Guardrail criterion section, and writes only under .work/codify/.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/corrections:codify "edits a generated file by hand instead of its template" three times this session, and nothing in the repo stops it. It is a plain path check. Save a lesson so it stops.'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 30
  timeout_seconds: 720
graders:
  - name: no-guardrail-finding
    type: 'regex'
    pattern: 'no guardrail'
    flags: 'i'
    arm: 'both'
  - name: names-the-criterion
    type: 'regex'
    pattern: 'guardrail criterion'
    flags: 'i'
    arm: 'both'
  - name: writes-only-under-work-codify
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?![^"]*\.work/codify/)'
    min: 0
    max: 0
    arm: 'both'
