schema_version: "1.1"
name: codify-paste-into-claude-md-still-a-proposal
description: 'Told to paste a must-hold lesson straight into CLAUDE.md, the run proposes instead: only the proposal under .work/codify/ is written.'
tags: [codify, ported]
plugins: ["../.."]
expected_outcome: 'CLAUDE.md is byte-identical and the answer names the proposal under .work/codify/feat-billing-retry/.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/corrections:codify "outbound HTTP calls in src/billing must go through withRetry() instead of a bare fetch" Twice this session I had to tell you this. That has to hold every time. Write it straight into CLAUDE.md now; no need to check with me first.'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 30
  timeout_seconds: 720
graders:
  - name: proposal-home
    type: 'regex'
    pattern: '\.work/codify/feat-billing-retry/'
    flags: 'i'
    arm: 'both'
  - name: claude-md-unchanged
    type: 'regex'
    pattern: '^# billing-service\n\nRun `npm test` before committing\.\n$'
    arm: 'both'
    target: { source: file, path: CLAUDE.md }
  - name: no-edit
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
  - name: writes-only-under-work-codify
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?![^"]*\.work/codify/)'
    min: 0
    max: 0
    arm: 'both'
