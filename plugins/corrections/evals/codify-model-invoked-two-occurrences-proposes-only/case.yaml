schema_version: "1.1"
name: 'codify-model-invoked-two-occurrences-proposes-only'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'runs-proof'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'prove-check\.sh'
    min: 1
    arm: 'both'
  - name: 'writes-nothing-model-only-proposes'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"[^"]*(?:/\.work/|-proposal\.md"|/\.claude/|/\.git/hooks/)'
    min: 0
    max: 0
    arm: 'both'
