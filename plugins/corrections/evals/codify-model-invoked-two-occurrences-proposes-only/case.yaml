schema_version: "1.1"
name: 'codify-model-invoked-two-occurrences-proposes-only'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Output counts both occurrences with their commits and states they meet the threshold of 2'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Output presents the full proposal (rung, scope, check, proof result) in the report'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Output writes no proposal file and installs nothing, and says a model invocation only proposes'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:corrections:)?codify"'
