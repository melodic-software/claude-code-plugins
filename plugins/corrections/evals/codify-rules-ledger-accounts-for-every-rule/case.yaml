schema_version: "1.1"
name: codify-rules-ledger-accounts-for-every-rule
description: 'Gain case: `rules` over two instruction files, one pointing at a third, accounts for every rule in a reconciled ledger: the console.log rule a past commit fixed becomes a proven check with its prose flagged for deletion, the boundary rule nothing ever broke is held as unproven, the naming and one-job rules stay prose, and the npm test line is deleted as derivable. No instruction file is edited.'
tags: [codify, rules]
plugins: ["../.."]
expected_outcome: 'Five rules from three files (.claude/rules/api.md added by following the AGENTS.md pointer). console.log: check, proven against the parent of the fix commit, prose flagged for deletion. Boundary rule: held, no old ref. Naming and one-job rules: prose, needs judgment. npm test: delete, package.json states it. rules-ledger.mjs exits 0 on the written ledger.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/corrections:codify rules AGENTS.md .cursor/rules/boundaries.mdc'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: ledger-reconciled
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'rules-ledger\.mjs'
    min: 1
    arm: 'with-only'
  - name: writes-only-under-work-codify
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?![^"]*\.work/codify/)'
    min: 0
    max: 0
    arm: 'both'
  - name: every-rule-accounted
    type: llm
    focus: last_message
    arm: 'both'
    criteria: 'Five rules were planted across AGENTS.md, .cursor/rules/boundaries.mdc and .claude/rules/api.md (which AGENTS.md points to): (a) never call console.log in src/, broken and then fixed by a past commit; (b) only src/internal/ and src/widget.ts may import from src/internal/, never broken in history; (c) name functions so a reader understands them; (d) run the tests with npm test, which package.json scripts.test already states; (e) keep each exported API function focused on one job. PASS only if all hold: (1) every one of the five rules appears in the reply with an outcome, none left out; (2) rule (a) becomes a check on a named checking rung, with a proof result, and its prose line is flagged for deletion (or removal) once the check lands; (3) rule (b) is not reported as a proven check: it is held, unproven, or pending because no commit broke it; (4) rules (c) and (e) stay prose because they need judgment; (5) rule (d) is deleted, or proposed for deletion, as derivable from package.json. FAIL if any rule is missing, if (c) or (e) becomes a check, or if (b) is reported as a proven check.'
