schema_version: "1.1"
name: 'codify-group-names-its-keys-across-two-sources'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'names-producer-key-and-counts'
    type: 'llm'
    criteria: 'Output names producer as the field grouping key and shows each producer group with its count'
    focus: 'trace'
  - name: 'names-mistake-and-source-id-keys'
    type: 'llm'
    criteria: 'Output names the mistake as the second grouping''s key and source_id as its occurrence key'
    focus: 'trace'
  - name: 'changelog-at-threshold-git-config-below'
    type: 'llm'
    criteria: 'Output shows the changelog-fragment group at 2 of 2 and names /corrections:codify for it, and shows the git-config group at 1 of 2'
    focus: 'trace'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-append-or-proof'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'buffer\.sh\S*\s+append\b|prove-check\.sh'
    min: 0
    max: 0
    arm: 'both'
