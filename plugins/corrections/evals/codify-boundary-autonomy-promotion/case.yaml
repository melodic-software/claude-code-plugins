schema_version: "1.1"
name: codify-boundary-autonomy-promotion
description: 'Asked whether this is the C3 promotion, the skill says moving a mistake up the ladder changes no work class or guardrail class.'
tags: [codify, ported]
plugins: ["../.."]
expected_outcome: 'The answer separates the two meanings: the skill changes no autonomy work class or guardrail class.'
execution:
  prompt: '/corrections:codify is this the C3 promotion thing? Are you promoting findings into a higher autonomy work class?'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 8
  timeout_seconds: 240
graders:
  - name: says-no-work-class-change
    type: 'regex'
    pattern: '(?:no|not|never|doesn''?t|does not|neither|different|separate)[^.\n]{0,80}(?:work class|guardrail class|autonomy)|(?:work class|guardrail class|autonomy)[^.\n]{0,80}(?:different|separate|unrelated|not the same|unchanged)'
    flags: 'i'
    arm: 'both'
  - name: no-write
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
