schema_version: "1.1"
name: codify-reviews-routes-recurring-lessons
description: 'PR review comments are a counting source: lessons at the threshold go on, a one-PR lesson is seen once, and no forge command is named.'
tags: [codify, ported]
plugins: ["../.."]
expected_outcome: 'withRetry (501, 507) and the migration lesson (503, 509) go on; rename-tmp2 (512) is seen once.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/corrections:codify reviews Which review lessons should we encode? This run has no forge access: the review-comments read''s output is in review-comments.jsonl, so read that file instead of calling the read.'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 30
  timeout_seconds: 720
graders:
  - name: both-lessons-with-prs
    type: 'regex'
    pattern: '^(?=[\s\S]*501)(?=[\s\S]*507)(?=[\s\S]*503)(?=[\s\S]*509)'
    flags: 'i'
    arm: 'both'
  - name: seen-once-listed
    type: 'regex'
    pattern: 'seen once[\s\S]{0,300}(?:tmp2|512)|(?:tmp2|512)[\s\S]{0,300}seen once'
    flags: 'i'
    arm: 'both'
  - name: names-no-forge-cli
    type: 'tool_used'
    tool: 'Bash'
    input_match: '\bgh\b'
    min: 0
    max: 0
    arm: 'both'
