schema_version: "1.1"
name: codify-findings-file-input
description: 'A findings file''s seven rows each become a described mistake with a rung and a proposal, strongest rung first; the By dimension section does not double the count.'
tags: [codify, ported]
plugins: ["../.."]
expected_outcome: 'The run reads the seven rows under ## Findings, names a rung for each by strongest first, writes one proposal per row under .work/codify/fixture/ and reports 7 findings to 7 proposals.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/corrections:codify findings findings.md'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: seven-findings-seven-proposals
    type: 'regex'
    pattern: '\b7 findings\s*(?:→|->|to)\s*7 proposals\b'
    flags: 'i'
    arm: 'both'
  - name: names-the-branch-home
    type: 'regex'
    pattern: '\.work/codify/fixture/'
    flags: 'i'
    arm: 'both'
  - name: rungs-by-id
    type: 'llm'
    criteria: 'PASS only if the reply proposes each of editorconfig-severity, analyzer-pack-rule and automated-review as the chosen rung for at least one finding. A rung id that is only listed, rejected, ruled out, set aside or named as an alternative does not count as chosen. FAIL if any of the three is never the chosen rung of a finding, or if the reply proposes no rungs. Judge which rung each statement chooses, not which ids appear. A chosen rung counts even when its check is unproven. An interim or accompanying instruction line is not a second rung.'
    focus: 'last_message'
    arm: 'both'
  - name: seven-proposal-files
    type: 'tool_used'
    tool: 'Write'
    input_match: '-proposal\.md'
    min: 7
    arm: 'both'
