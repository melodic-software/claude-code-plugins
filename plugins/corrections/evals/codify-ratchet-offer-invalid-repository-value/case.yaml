schema_version: "1.1"
name: codify-ratchet-offer-invalid-repository-value
description: 'An invalid team value is named and dropped; the default stands, not the user''s false.'
tags: [codify, ported]
plugins: ["../.."]
expected_outcome: 'An invalid team value is named and dropped; the default stands, not the user''s false.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/corrections:codify findings findings.md The settings reader printed {"min_occurrences":2,"layer":"defaults","path":null,"ratchet_offer":{"value":true,"layer":"defaults","path":null},"review_mining_prs":{"value":20,"layer":"defaults","path":null}} On stderr: team (docs/conventions/corrections.yaml): ratchet_offer: expected boolean, got sometimes. The user option is false. This run has no Bash tool: skip the proof and report each row''s check as unproven, and present the proposals in the report, writing nothing.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 20
  timeout_seconds: 480
graders:
  - name: names-the-invalid-value
    type: 'regex'
    pattern: '^(?=[\s\S]*corrections\.yaml)(?=[\s\S]*sometimes)'
    flags: 'i'
    arm: 'both'
  - name: reports-the-layer
    type: 'regex'
    pattern: 'ratchet_offer:?`?\s*`?true`?\s*\(`?defaults?'
    flags: 'i'
    arm: 'both'
