schema_version: "1.1"
name: codify-invalid-state-lands-on-make-impossible
description: 'An invalid-state row goes to make-impossible with the redesign handed off; a dangerous-call row gets its Semgrep pointer; nothing installs a plugin.'
tags: [codify, ported]
plugins: ["../.."]
expected_outcome: 'Row 1 is make-impossible, handed to /architecture:improve or /planning:design, implementing nothing. Row 2 names Semgrep''s documentation. The report prints no plugin install command.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/corrections:codify findings two-rows.md What rung does each row get, and what is the next step? This run has no Bash tool: skip the proof and report each row''s check as unproven, and present the proposals in the report, writing nothing.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: make-impossible-handed-off
    type: 'regex'
    pattern: '^(?=[\s\S]*make-impossible)(?=[\s\S]*(?:/architecture:improve|/planning:design))'
    flags: 'i'
    arm: 'both'
  - name: semgrep-pointer
    type: 'regex'
    pattern: 'semgrep-rule|docs\.semgrep\.dev'
    flags: 'i'
    arm: 'both'
  - name: prints-no-plugin-install
    type: 'regex'
    pattern: 'plugin install|plugin marketplace add'
    flags: 'i'
    match: 'not_contains'
    arm: 'both'
