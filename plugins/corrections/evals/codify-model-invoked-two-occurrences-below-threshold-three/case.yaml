    type: 'llm'
    criteria: 'Output lists both occurrences with their commits and states the count of 2 next to the threshold of 3'
    focus: 'trace'
  - name: 'threshold-from-team-layer'
    type: 'llm'
    criteria: 'Output says the threshold of 3 came from the team layer (docs/conventions/corrections.yaml)'
    focus: 'trace'
  - name: 'proposes-nothing'
    type: 'llm'
    criteria: 'Output proposes nothing: no rung, no check command and no proof run'
    focus: 'trace'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
