schema_version: "1.1"
name: 'codify-blocking-hook-asks-before-install'
graders:
  - name: 'picks-action-guard-rung'
    type: 'llm'
    criteria: 'Output picks the action-guard rung, a blocking hook, from the ladder'
    focus: 'trace'
  - name: 'writes-proposal-not-hook'
    type: 'llm'
    criteria: 'Output writes the proposal but does NOT install the hook'
    focus: 'trace'
  - name: 'asks-before-install-every-time'
    type: 'llm'
    criteria: 'Output asks the person before installing the blocking check, and says it asks every time'
    focus: 'trace'
