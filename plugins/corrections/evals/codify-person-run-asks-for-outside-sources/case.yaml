schema_version: "1.1"
name: 'codify-person-run-asks-for-outside-sources'
description: 'Routine case, written from the skill''s count rule: a person types the command with no source outside the repository in the prompt. The scaffold holds one commit that fixed a log line printing the whole request body.'
tags: ['codify', 'routine', 'no-network']
plugins: ["../.."]
expected_outcome: 'Before counting, the answer names the kinds of source the skill cannot read (a team meeting''s issue list, stand-up notes, ticket comments) and asks the person once whether to add any they paste or point at.'
context:
  scaffold_script: scaffold.sh
execution:
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: 'names-the-three-sources'
    type: 'regex'
    target: 'last_message'
    pattern: '(?=[\s\S]*meeting)(?=[\s\S]*stand-?\s?ups?\b)(?=[\s\S]*ticket)'
    flags: 'i'
    arm: 'both'
  - name: 'asks-once-for-outside-sources'
    type: 'llm'
    focus: 'trace'
    arm: 'both'
    criteria: 'Judge only the assistant''s own messages, not tool output or the skill text it read. PASS only if the assistant names all three kinds of source it cannot read (a team meeting''s issue list, stand-up notes, ticket comments) and asks the person exactly once whether to add any they paste or point at. FAIL if it never asks, if it names fewer than the three kinds, or if it asks the question more than once.'
