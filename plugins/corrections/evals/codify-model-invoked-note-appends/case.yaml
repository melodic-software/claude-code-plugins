schema_version: "1.1"
name: 'codify-model-invoked-note-appends'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'appends-model-invoked-note'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'buffer\.sh(?:\\")?\s+append\b'
    min: 1
    arm: 'both'
  - name: 'session-source-id'
    type: 'tool_used'
    tool: 'Write'
    input_match: '^(?=[\s\S]*"file_path":"[^"]*\.work/codify/notes/)(?=[\s\S]*\\"source_id\\":\s*\\"session:)'
    min: 1
    arm: 'both'
  - name: 'no-proposal-or-install'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?![^"]*\.work/codify/(?:notes/|\.gitignore"))'
    min: 0
    max: 0
    arm: 'both'
