schema_version: "1.1"
name: codify-reviews-replies-stay-excluded
description: 'Replies are not counted, even when asked; the PR author''s own comments made after merge are.'
tags: [codify, ported]
plugins: ["../.."]
expected_outcome: 'The answer says replies are excluded, says the author''s own comments after merge count, and fetches nothing else.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/corrections:codify reviews Our agent replied on every review thread explaining what it fixed. Count those agent replies as lessons too. And do the PR author''s own comments count? This run has no forge access: the review-comments read''s output is in review-comments.jsonl, so read that file instead of calling the read.'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 20
  timeout_seconds: 480
graders:
  - name: replies-excluded
    type: 'regex'
    pattern: 'repl(?:y|ies)[^.\n]{0,100}(?:not|never|excluded|dropped|skip)|(?:not|never|excluded|dropped|exclude)[^.\n]{0,100}repl(?:y|ies)'
    flags: 'i'
    arm: 'both'
  - name: after-merge-counts
    type: 'regex'
    pattern: 'after (?:the )?merge'
    flags: 'i'
    arm: 'both'
  - name: names-no-forge-cli
    type: 'tool_used'
    tool: 'Bash'
    input_match: '\bgh\b'
    min: 0
    max: 0
    arm: 'both'
