schema_version: "1.1"
name: codify-ratchet-offer-neither-layer-defaults-on
description: 'Neither layer sets the key: true from the default, with the offer on counting rungs.'
tags: [codify, ported]
plugins: ["../.."]
expected_outcome: 'Neither layer sets the key: true from the default, with the offer on counting rungs.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/corrections:codify findings findings.md The settings reader printed {"min_occurrences":2,"layer":"defaults","path":null,"ratchet_offer":{"value":true,"layer":"defaults","path":null},"review_mining_prs":{"value":20,"layer":"defaults","path":null}} This run has no Bash tool: skip the proof and report each row''s check as unproven, and present the proposals in the report, writing nothing.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 20
  timeout_seconds: 480
graders:
  - name: reports-the-layer
    type: 'regex'
    pattern: 'ratchet_offer:?`?\s*`?true`?\s*\(`?defaults?'
    flags: 'i'
    arm: 'both'
  - name: ratchet-offered
    type: 'regex'
    pattern: '/toolchain:ratchet[\s\S]*(?:zero|0)|(?:zero|0)[\s\S]*/toolchain:ratchet'
    flags: 'i'
    arm: 'both'
