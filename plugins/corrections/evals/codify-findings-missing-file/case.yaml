schema_version: "1.1"
name: codify-findings-missing-file
description: 'findings with no path prints the usage line and stops; no directory is globbed and nothing is written.'
tags: [codify, ported]
plugins: ["../.."]
expected_outcome: 'The run prints usage: /corrections:codify findings <findings-file> and stops.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/corrections:codify findings'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 8
  timeout_seconds: 240
graders:
  - name: usage-line
    type: 'regex'
    pattern: 'usage:\s*/corrections:codify findings <findings-file>'
    flags: 'i'
    arm: 'both'
  - name: no-glob
    type: 'tool_used'
    tool: 'Glob'
    min: 0
    max: 0
    arm: 'both'
  - name: no-write
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
