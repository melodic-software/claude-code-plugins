schema_version: "1.1"
name: 'codify-preferences-stops-without-session-flow'
plugins: ["../.."]
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'no-audit-sessions-call'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"[^"]*audit-sessions"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-collect-or-store-read-in-shell'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'collect\.py|\.claude/projects|audit-sessions/store'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-store-read'
    type: 'tool_used'
    tool: 'Read'
    input_match: '\.claude/projects|audit-sessions/store'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-proposal'
    type: 'file_exists'
    path: '.work/codify/*/*-proposal.md'
    exists: false
    arm: 'both'
  - name: 'says-it-needs-session-flow-and-stops'
    type: 'llm'
    focus: 'last_message'
    arm: 'both'
    criteria: 'Only the corrections plugin is loaded, so the preferences action cannot read excerpts. PASS only if the reply says the action needs the session-flow plugin and stops there; telling the person to install it and run the action again still counts as stopping. FAIL if the reply does not name the session-flow plugin as what is needed, if it blames a missing store or an unknown command instead, if it lists, counts or proposes any preference, or if it offers another route to the preferences, such as reading a file or transcripts or asking the person to paste them.'
