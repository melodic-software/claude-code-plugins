schema_version: "1.1"
name: 'codify-direct-codify-one-occurrence-writes-proposal'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'runs-proof'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'prove-check\.sh'
    min: 1
    arm: 'with-only'
  - name: 'writes-proposal'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"[^"]*\.work/codify/(?!notes/)'
    min: 1
    arm: 'with-only'
