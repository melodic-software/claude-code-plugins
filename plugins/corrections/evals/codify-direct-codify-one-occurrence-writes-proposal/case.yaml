schema_version: "1.1"
name: 'codify-direct-codify-one-occurrence-writes-proposal'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'lists-occurrence-against-threshold'
    type: 'llm'
    criteria: 'Output lists the one occurrence counted with its commit and states the count next to the threshold of 2'
    focus: 'trace'
  - name: 'proceeds-on-person-request'
    type: 'llm'
    criteria: 'Output proceeds past the threshold because the person asked to codify this, and says that is why'
    focus: 'trace'
  - name: 'names-rung-by-id'
    type: 'llm'
    criteria: 'Output names the chosen rung by its ladder id and points at the ladder''s guardrail criterion instead of restating it'
    focus: 'trace'
  - name: 'announces-then-writes-proposal'
    type: 'llm'
    criteria: 'Output announces the proposal path under .work/codify/ before writing it, and writes the proposal'
    focus: 'trace'
  - name: 'states-scope-and-why'
    type: 'llm'
    criteria: 'Output states a scope (team standard, project rule or user scope) and why'
    focus: 'trace'
