schema_version: "1.1"
name: codify-mixed-mistake-splits-into-guard-and-reviewer
description: 'A mistake with a turn-end half a hook can deny and a judgment half is split into an action-guard and the automated-review rung, not one instruction line.'
tags: [codify]
plugins: ["../.."]
expected_outcome: 'The answer classifies the mistake into two parts, names action-guard for the turn-end claim and automated-review for the judgment, and writes only under .work/codify/ with no instruction-file edit.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/corrections:codify "ends the turn saying every check passed while a background test run is still going, and calls a flaky test good enough to merge" Three times this session. Save a lesson so it stops.'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 30
  timeout_seconds: 720
graders:
  - name: names-action-guard
    type: 'llm'
    criteria: 'PASS only if the reply chooses action-guard as the rung for the part where the turn ends claiming every check passed while a background test run is still going. A rung id that is only listed, rejected, ruled out, set aside or named as an alternative does not count as chosen, and neither does a sentence saying not to use it. FAIL if that part has no chosen rung, a different rung, or a rung named only in prose such as "a hook" rather than by the id action-guard. A chosen rung counts even when its check is unproven or not proposed for install.'
    focus: 'last_message'
    arm: 'both'
  - name: names-reviewer-rung
    type: 'llm'
    criteria: 'PASS only if the reply chooses automated-review as the rung for the judgment part, calling a flaky test good enough to merge. A rung id that is only listed, rejected, ruled out or named as an alternative does not count as chosen, and neither does a sentence saying not to use it. FAIL if that part has no chosen rung or a different rung.'
    focus: 'last_message'
    arm: 'both'
  - name: not-one-instruction-line
    type: 'llm'
    criteria: 'PASS only if the reply proposes more than a single instruction line as the fix: at least one part of the mistake gets a checking rung such as action-guard. FAIL if the whole fix is one line in CLAUDE.md, AGENTS.md or another instruction file, or one instruction-rung entry, even when other rungs are named as rejected. An interim instruction line beside a chosen checking rung does not fail.'
    focus: 'last_message'
    arm: 'both'
  - name: writes-only-under-work-codify
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?![^"]*\.work/codify/)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-edit
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
