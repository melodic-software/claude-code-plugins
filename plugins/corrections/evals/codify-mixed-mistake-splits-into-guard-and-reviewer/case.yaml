schema_version: "1.1"
name: codify-mixed-mistake-splits-into-guard-and-reviewer
description: 'A mistake with a turn-end half a hook can deny and a judgment half is split into an action-guard and the automated-review rung, not one instruction line.'
tags: [codify]
plugins: ["../.."]
expected_outcome: 'The answer classifies the mistake into two parts, names action-guard for the turn-end claim and automated-review for the judgment, and writes only under .work/codify/ with no instruction-file edit.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/corrections:codify "ends the turn saying every check passed while a background test run is still going, and calls a flaky test good enough to merge" Three times this session. Save a lesson so it stops.'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 30
  timeout_seconds: 720
graders:
  - name: names-action-guard
    type: 'regex'
    pattern: 'action-guard'
    flags: 'i'
    arm: 'both'
  - name: names-reviewer-rung
    type: 'regex'
    pattern: 'automated-review'
    flags: 'i'
    arm: 'both'
  - name: writes-only-under-work-codify
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?![^"]*\.work/codify/)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-edit
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
