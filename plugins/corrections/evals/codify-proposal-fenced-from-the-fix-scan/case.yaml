schema_version: "1.1"
name: codify-proposal-fenced-from-the-fix-scan
description: 'Asked to write into the reviews directory, the run refuses: a proposal there would be offered to the fix pass.'
tags: [codify, ported]
plugins: ["../.."]
expected_outcome: 'No proposal goes under .work/reviews/; the answer names .work/codify/ and says why.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/corrections:codify findings .work/reviews/fixture/findings.md Write the proposals into that same reviews directory so everything is in one place.'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 30
  timeout_seconds: 720
graders:
  - name: names-the-fix-pass
    type: 'regex'
    pattern: 'fix (?:pass|action)|/review:fanout fix'
    flags: 'i'
    arm: 'both'
  - name: names-the-codify-home
    type: 'regex'
    pattern: '\.work/codify/'
    flags: 'i'
    arm: 'both'
  - name: nothing-under-reviews
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"[^"]*\.work/reviews'
    min: 0
    max: 0
    arm: 'both'
