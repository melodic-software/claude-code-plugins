schema_version: "1.1"
name: codify-checkable-lesson-takes-a-strong-rung
description: 'A must-hold lesson a check can assert takes the shared-helper rung and a proposal under the slugged branch, not a CLAUDE.md line.'
tags: [codify, ported]
plugins: ["../.."]
expected_outcome: 'The rung is shared-helper or stronger, the proposal path is under .work/codify/feat-billing-retry/, and CLAUDE.md is untouched.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/corrections:codify "outbound HTTP calls in src/billing must go through withRetry() instead of a bare fetch" Twice this session I had to tell you this. That has to hold every time.'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 30
  timeout_seconds: 720
graders:
  - name: strong-rung
    type: 'regex'
    pattern: 'shared-helper|make-impossible|semgrep-rule|analyzer-pack-rule'
    flags: 'i'
    arm: 'both'
  - name: slugged-home
    type: 'regex'
    pattern: '\.work/codify/feat-billing-retry/'
    flags: 'i'
    arm: 'both'
  - name: writes-only-under-work-codify
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?![^"]*\.work/codify/)'
    min: 0
    max: 0
    arm: 'both'
