schema_version: "1.1"
name: 'codify-escaped-defect-names-missing-context'
graders:
  - name: 'names-missing-pricing-rules'
    type: 'regex'
    pattern: 'pricing rules?(?: file)?[\s\S]{0,200}?(?:never (?:been )?(?:opened|read|loaded)|not (?:been )?(?:opened|read|loaded|in front)|was(?:n.t| not) (?:opened|read|loaded)|\bmissing\b|\babsent\b|\bunread\b|did(?:n.t| not) have)|(?:missing context|not have in front|did(?:n.t| not) have|never (?:opened|read|loaded))[\s\S]{0,200}?pricing rules?'
    flags: 'i'
    target: 'last_message'
  - name: 'missing-context-beside-rung'
    type: 'regex'
    pattern: '\brung\b[\s\S]{0,600}?(?:missing[- ]context|in front of|did(?:n.t| not) have|never (?:opened|loaded|read))|(?:missing[- ]context|in front of|did(?:n.t| not) have|never (?:opened|loaded|read))[\s\S]{0,600}?\brung\b'
    flags: 'i'
    target: 'last_message'
  - name: 'fixes-unloaded-rule-where-it-lives'
    type: 'regex'
    pattern: 'where it lives|(?:never|not|was(?:n.t| not)) (?:been )?(?:loaded|opened)[\s\S]{0,300}?\b(?:move|reword|relocat|load|path-scoped|surface|so (?:the )?(?:reader|model|agent) (?:meets|sees|reads))'
    flags: 'i'
    target: 'last_message'
