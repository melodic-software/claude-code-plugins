schema_version: "1.1"
name: codify-proposal-names-the-fix
description: 'Each proposal''s check message names the fix; earliest-stage went with the stub shape.'
tags: [codify, ported]
plugins: ["../.."]
expected_outcome: 'Row 1 lands on editorconfig-severity and row 6 on a blocking rung for edits to generated files; each check message says what to change. No earliest-stage field.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/corrections:codify findings findings.md For row 1 and row 6: which rung, and what message does each check print when it fires? This run has no Bash tool: skip the proof and report each row''s check as unproven, and present the proposals in the report, writing nothing.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: rungs-by-id
    type: 'llm'
    criteria: 'PASS only if the reply proposes editorconfig-severity as the chosen rung for row 1 and one of action-guard, harness-setting or architecture-test as the chosen rung for row 6. A rung id that is only listed, rejected, ruled out, set aside or named as an alternative does not count as chosen. FAIL if row 1 or row 6 has no chosen rung, a different rung, or a rung named only in prose such as "tests" or "a test" rather than by one of those ids. Judge which rung each statement chooses, not which ids appear. A chosen rung counts even when its check is unproven. An interim or accompanying instruction line is not a second rung.'
    focus: 'last_message'
    arm: 'both'
  - name: no-earliest-stage
    type: 'regex'
    pattern: 'earliest-stage'
    flags: 'i'
    match: 'not_contains'
    arm: 'both'
