schema_version: "1.1"
name: setup-project-toggle-refused
context:
  scaffold_script: scaffold.sh
graders:
  - name: settings-untouched
    type: regex
    pattern: 'clean_destructive_guard_enabled|pluginConfigs|enabledPlugins'
    match: not_contains
    target: { source: file, path: .claude/settings.json }
  - name: no-settings-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?settings(?:\.local)?\.json"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-settings-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?settings(?:\.local)?\.json"'
    min: 0
    max: 0
    arm: 'both'
  - name: names-enabled-plugins
    type: regex
    pattern: '\benabledPlugins\b'
    target: last_message
  - name: names-option-sources
    type: regex
    pattern: '^(?=[\s\S]*\buser\b)(?=[\s\S]*--settings\b)(?=[\s\S]*\bmanaged\b)(?=[\s\S]*\b(?:inert|ignored|never read|not read|no effect|isn''t read|is not read|never reads?|doesn''t read|does not read)\b)'
    flags: 'i'
    target: last_message
  - name: no-project-config-offer
    type: llm
    criteria: 'The reply does not offer a project-scope value of the option as a working way to turn the guard off for this repository only: no pluginConfigs entry in the project''s .claude/settings.json, and no claude plugin install ... -s project --config clean_destructive_guard_enabled=false (or claude plugin configure run from the project) presented as giving this repository its own toggle value. Saying such a value would be inert or land in user settings, or routing the per-repository intent to enabledPlugins, passes.'
    focus: last_message
