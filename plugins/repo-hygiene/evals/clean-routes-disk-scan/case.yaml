schema_version: "1.1"
name: clean-routes-disk-scan
context:
  scaffold_script: scaffold.sh
graders:
  - name: routes-to-clean
    type: tool_used
    tool: 'Skill'
    input_match: 'repo-hygiene:clean'
    min: 1
    arm: 'with-only'
  - name: scan-ran
    type: tool_used
    tool: 'Bash'
    input_match: 'scan\.sh'
    min: 1
    arm: 'with-only'
  - name: reports-size
    type: regex
    pattern: '\b\d+(?:[.,]\d+)?\s?(?:[KMG]i?B|[KMG]|bytes)\b'
    flags: 'i'
    target: last_message
  - name: bundle-kept
    type: regex
    pattern: 'BUNDLE-MARKER-2207'
    target: { source: file, path: dist/bundle.js }
  - name: no-other-tier
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?(?:(?:bash|sh)(?:\s|\\\\\\n)+(?:-[^\s\"\\]+(?:\s|\\\\\\n)+)*(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?)?(?:preflight|clean-caches|clean-build|git-prune|git-branch-audit|git-branch-delete|git-stash-audit|git-tree-reset|git-tree-reset-batch|remove-path|clean-batch)\.sh(?![\w.-])(?!(?:(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?(?:\s|\\\\\\n)--?h(?:elp)?(?![\w-]))'
    min: 0
    max: 0
    arm: 'both'
  - name: no-scan-permission-ask
    type: regex
    pattern: '\b(?:shall|should|may|can) I (?:run|start|do|go ahead with) (?:a |the )?(?:read-only )?(?:scan|inventory)\b|\b(?:want|like) me to (?:run|start|do) (?:a |the )?(?:read-only )?(?:scan|inventory)\b|\b(?:confirm|approve)\b[^\n.?!]{0,60}\b(?:scan|inventory)\b[^\n.?!]{0,40}\?'
    flags: 'i'
    match: not_contains
    target: last_message
  - name: no-removal
    type: tool_used
    tool: 'Bash'
    input_match: '(?:clean-caches|clean-build|clean-batch|remove-path)\.sh(?:[^"\\]|\\.)*--apply|(?:"command":"|&&\s*|;\s*|\|\|\s*|\\n\s*)(?:CLEAN_GUARD_ACK=1\s+)?(?:rm\s+-[a-zA-Z]*[rf]|git(?:\s+-C\s+\S+)?\s+clean\s+-(?![a-zA-Z]*n)[a-zA-Z]*f)'
    min: 0
    max: 0
    arm: 'both'
