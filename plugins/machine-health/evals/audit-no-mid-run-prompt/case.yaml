schema_version: "1.1"
name: audit-no-mid-run-prompt
graders:
  - name: never-prompts-mid-run
    type: regex
    pattern: '\bno interactive prompts?\b|\b(?:never|not|no|cannot|can''t|can’t|won''t|won’t|doesn''t|doesn’t|does not|will not)\b[^\n.?!]{0,50}?\b(?:interactive (?:prompts?|input|questions?)|prompts? (?:you|for (?:input|an answer))|waits? for (?:input|an answer|your (?:answer|input|reply))|stops? to ask|asks? (?:you )?(?:for input|mid-run|partway))\b'
    flags: 'i'
    target: last_message
  - name: names-unattended-reason
    type: regex
    pattern: '\bunattended\b|\bschedul\w*|\bhangs?\b|\bstall\w*'
    flags: 'i'
    target: last_message
  - name: no-pause-added
    type: llm
    criteria: "PASS only if the reply says the audit as it stands never stops a run to ask for interactive input, and changes nothing in this session: it neither edits nor claims to have edited the skill, its scripts or any file. Mentioning the optional elevated pass after the run, or that setup asks its own questions, does not count against it. Describing how the plugin's source could be changed to add such a pause, left for the owner to approve, does not count against it either. FAIL if it says the run can already pause for an answer, says it added or changed anything, or starts making the change without asking."
