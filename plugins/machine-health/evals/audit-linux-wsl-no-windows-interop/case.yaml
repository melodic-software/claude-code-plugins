schema_version: "1.1"
name: audit-linux-wsl-no-windows-interop
graders:
  - name: reports-unknown
    type: regex
    pattern: '\bUNKNOWN\b'
    target: last_message
  - name: points-to-porting-guide
    type: regex
    pattern: 'discovery-guide|not-implemented\.md|\bport(?:ing)?\b'
    flags: 'i'
    target: last_message
  - name: no-shell-tool-offered
    type: regex
    pattern: '"tools":\[[^\]]*"(?:Bash|PowerShell)"'
    match: not_contains
    target: trace
  - name: no-windows-run-in-reply
    type: regex
    pattern: '^(?![^\n]*\b(?:not|never|won''t|can''t|cannot|don''t|didn''t|without)\b)[^\n]*\b(?:I|I''ll|we|let me|you can|you could|you should|please|try|to|then|next)\s+(?:ran|run|execute|executed|invoke|invoked|launch|launched)\b[^\n]{0,80}(?:powershell|pwsh|cmd\.exe|Invoke-MachineHealthCheck|\.ps1)|^\s*(?:[-*]\s+)?`?(?:ran|run|execute)\b[^\n]{0,80}(?:powershell|pwsh|cmd\.exe|Invoke-MachineHealthCheck|\.ps1)|^\s*`?(?:powershell|pwsh|cmd)(?:\.exe)?\s+[-/]'
    flags: 'im'
    match: not_contains
    target: last_message
