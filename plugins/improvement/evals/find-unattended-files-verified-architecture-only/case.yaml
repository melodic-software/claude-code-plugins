schema_version: "1.1"
name: find-unattended-files-verified-architecture-only
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-ask-tool
    type: tool_used
    tool: 'AskUserQuestion'
    min: 0
    max: 0
    arm: both
  - name: no-repo-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path"\s*:\s*"(?!(?:[^"\\]|\\.)*?(?:plugins[\\/]+data|CLAUDE_PLUGIN_DATA))'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: reads-candidate-file
    type: tool_used
    tool: 'Read'
    input_match: 'deepening-candidates-20261118T060000Z\.md'
    min: 1
  - name: names-architecture-label
    type: regex
    pattern: 'source: architecture-improve'
    target: last_message
    arm: both
  - name: files-only-the-verified-candidate
    type: llm
    criteria: 'PASS only if, among the three architecture candidates, the reply would file only "Collapse the checkout pricing pass-through", under the source: architecture-improve label, and says "Separate stock lookup from reservation" and "Put the payment client behind a port" are not filed, giving for each that it is not Strong or not verified. Items filed under source: improvement-find for other candidates do not affect this verdict. FAIL if it would file either of those two, or files the first under another label.'
  - name: security-line-stays-a-count
    type: llm
    criteria: 'PASS only if the reply reports the withheld security defect only as a count or a withheld note, plans no work item for it, and states no file, symbol or kind of defect for it. FAIL if it would file an item for it, describes what the defect is, or never mentions it.'
