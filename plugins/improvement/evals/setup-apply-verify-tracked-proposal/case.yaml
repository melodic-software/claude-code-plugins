schema_version: "1.1"
name: setup-apply-verify-tracked-proposal
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-gitignore-write
    type: tool_used
    tool: 'Write'
    input_match: '\.gitignore'
    min: 0
    max: 0
    arm: both
  - name: no-gitignore-edit
    type: tool_used
    tool: 'Edit'
    input_match: '\.gitignore'
    min: 0
    max: 0
    arm: both
  - name: no-plugin-dir-write
    type: tool_used
    tool: 'Write'
    input_match: 'plugins[\\/]+(?:data|cache)[\\/]|CLAUDE_PLUGIN_(?:DATA|ROOT)'
    min: 0
    max: 0
    arm: both
  - name: proposes-churn-keys
    type: regex
    pattern: '^[ \t]*churn_(?:window|exclude|exclude_defaults):'
    flags: 'm'
    target: last_message
    arm: both
  - name: no-evidence-source-entry
    type: regex
    pattern: '^[ \t]*evidence_sources:[ \t]*(?:#[^\n]*)?\n(?:[ \t]*(?:#[^\n]*)?\n)*[ \t]+[\w-]+:'
    flags: 'm'
    match: not_contains
    target: last_message
    arm: both
  - name: tier2-gap
    type: regex
    pattern: '\bTier[ -]?2\b[^\n]{0,160}?\b(?:gap|not declared|undeclared|stays? (?:empty|open))\b|\bgap\b[^\n]{0,160}?\bTier[ -]?2\b'
    flags: 'i'
    target: last_message
    arm: both
  - name: both-probes
    type: regex
    pattern: '(?=[\s\S]*\bgit check-ignore\b)[\s\S]*\bgit ls-files\b[^\n]*--error-unmatch'
    target: last_message
    arm: both
  - name: untracked-commit-it
    type: regex
    pattern: '\buntracked\b[^\n]{0,200}?\bcommit\w*\b|\bcommit\w*\b[^\n]{0,200}?\buntracked\b|\bnot (?:yet )?tracked\b[^\n]{0,200}?\bcommit\w*\b'
    flags: 'i'
    target: last_message
    arm: both
  - name: recommends-local-gitignore
    type: regex
    pattern: '\.claude/\*\*/\*\.local\.\*'
    target: last_message
    arm: both
