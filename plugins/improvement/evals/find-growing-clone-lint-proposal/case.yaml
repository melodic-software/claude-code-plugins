schema_version: "1.1"
name: find-growing-clone-lint-proposal
description: 'Legacy find case growing-clone-class-hands-off-a-lint-proposal. Narration: code-metrics does not load in a run, so the prompt gives its duplication document as facts. The 6-copy retry helper ranks above the 2-copy date formatter (retry-ranked-above-formatter) because copy count ranks spread (spread-reason); the retry helper is growing and the date formatter is not (retry-growing, formatter-not-growing), read from the trend without opening previous_document (no-previous-document-read). The growing class gets a lint proposal through the findings hand-off under .work/improvement/feature-payments-cleanup/, written or proposed (handoff-path, read over the trace so a Write path or the reply counts), never under reviews/ (no-reviews-write) and never in a tracked file (no-tracked-write, no-edit); the retry candidate row names that file (row-names-handoff-file). The reply offers /corrections:codify without running it (offers-codify, no-codify-run) and recommends against a CI gate on the total clone count with a reason (declines-total-ceiling, llm). Needs --allow-tools Write Edit; no scaffold.'
tags: [find, code-metrics, clone-growth, narration, no-network]
expected_outcome: 'The retry helper class (6 copies, in trend.new_classes) ranks above the date formatter (2 copies, in neither list) on spread; the retry helper is growing and gets a lint proposal whose findings file sits under .work/improvement/feature-payments-cleanup/, named in its row, with /corrections:codify offered and not run; previous_document is not opened; and a CI ceiling on the total clone count is declined with a reason.'
execution:
  prompt: '/improvement:find code dimension only. code-metrics is enabled; its duplication audit (--json --keep --all) on this repo printed a document whose trend reads {"clone_groups": 12, "previous_clone_groups": 9, "delta": 3, "previous_generated_at": "2026-09-27T09:10:00Z", "previous_document": "/tmp/cm/audit-duplication-20260927T091000Z.json", "new_classes": [{"file": "src/billing/retry.ts", "start_line": 14, "copies": 6, "lines": 22}], "grown_classes": []}. Its measures list that retry-helper class with 6 instances (src/billing/retry.ts:14, src/shipping/retry.ts:9, src/search/retry.ts:30, and three more) and a 60-line date formatter class with 2 instances, which appears in neither trend list. We are on branch feature/Payments-Cleanup. Should we add a CI check that fails when the total clone count goes up?'
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 25
  timeout_seconds: 900
graders:
  - name: no-previous-document-read
    type: tool_used
    tool: 'Read'
    input_match: 'audit-duplication-20260927'
    min: 0
    max: 0
    arm: both
  - name: no-reviews-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path"\s*:\s*"(?:[^"\\]|\\.)*?reviews[\\/]'
    min: 0
    max: 0
    arm: both
  - name: no-tracked-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path"\s*:\s*"(?!(?:[^"\\]|\\.)*?\.work[\\/])'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: no-codify-run
    type: tool_used
    tool: 'Skill'
    input_match: 'corrections:codify'
    min: 0
    max: 0
    arm: both
  - name: retry-ranked-above-formatter
    type: regex
    pattern: '(?<![\s\S])(?:(?!^[ \t]*(?:\|\s*\**#?\d{1,2}\**\s*\||[-*]?\s*\**#?\d{1,2}[.)]\**\s|#{1,4}\s*\**(?:#|rank\s*|candidate\s*)?\d{1,2}\b)[^\n]*\bdate[- ]?format)[\s\S])*?^[ \t]*(?:\|\s*\**#?\d{1,2}\**\s*\||[-*]?\s*\**#?\d{1,2}[.)]\**\s|#{1,4}\s*\**(?:#|rank\s*|candidate\s*)?\d{1,2}\b)[^\n]*\bretry'
    flags: 'im'
    target: last_message
    arm: both
  - name: spread-reason
    type: regex
    pattern: '\b(?:spread|copy[- ]count|copies (?:rank|outrank|beat|matter|count|win)\w*|(?:more|most) (?:copies|instances)|ranked (?:on|by) (?:copies|copy count|spread|instances)|rather than (?:line )?length|not (?:by )?(?:line )?length|over (?:line )?length)\b'
    flags: 'i'
    target: last_message
    arm: both
  - name: retry-growing
    type: regex
    pattern: 'retry[^\n]{0,200}?(?<!\bnot\s)(?<!n\x27t\s)\b(?:growing|grew|is new|new (?:clone )?class)\b|(?<!\bnot\s)(?<!n\x27t\s)\b(?:growing|grew)\b[^\n]{0,200}?retry'
    flags: 'i'
    target: last_message
    arm: both
  - name: formatter-not-growing
    type: regex
    pattern: 'date[- ]?format\w*[^\n]{0,200}?\b(?:not growing|isn\x27t growing|is not growing|not a growing|no growth|stable|holding steady|not new or grown|neither new nor grown)\b|\b(?:not growing|isn\x27t growing|not a growing|no growth|stable)\b[^\n]{0,200}?date[- ]?format'
    flags: 'i'
    target: last_message
    arm: both
  - name: handoff-path
    type: regex
    pattern: 'improvement[\\/]+feature-payments-cleanup[\\/]'
    target: trace
    arm: both
  - name: row-names-handoff-file
    type: regex
    pattern: '^[ \t]*(?:\|\s*\**#?\d{1,2}\**\s*\||[-*]?\s*\**#?\d{1,2}[.)]\**\s|#{1,4}\s*\**(?:#|rank\s*|candidate\s*)?\d{1,2}\b)(?=(?:(?!\n[ \t]*(?:\|\s*\**#?\d{1,2}\**\s*\||[-*]?\s*\**#?\d{1,2}[.)]\**\s|#{1,4}\s*\**(?:#|rank\s*|candidate\s*)?\d{1,2}\b))[\s\S]){0,1500}?\bretry)(?:(?!\n[ \t]*(?:\|\s*\**#?\d{1,2}\**\s*\||[-*]?\s*\**#?\d{1,2}[.)]\**\s|#{1,4}\s*\**(?:#|rank\s*|candidate\s*)?\d{1,2}\b))[\s\S]){0,1500}?improvement[\\/]+feature-payments-cleanup[\\/]'
    flags: 'im'
    target: last_message
    arm: both
  - name: offers-codify
    type: regex
    pattern: 'corrections:codify'
    target: last_message
    arm: both
  - name: declines-total-ceiling
    type: llm
    criteria: 'PASS only if the reply recommends against adding a CI check that fails when the total clone count rises, and gives a reason for declining (for example that the trend is a ranking input, not a gate, or that a lint proposal targets one growing class rather than the repository total). FAIL if it recommends, offers or drafts such a total-count gate, or declines without giving any reason.'
