schema_version: "1.1"
name: setup-check-old-file-not-read
description: 'Bare /improvement:setup runs the read-only check on a repository whose only leftover files are the retired .claude/improvement.md (churn_window: "30 days ago") and .claude/improvement.local.md, with no docs/conventions/improvement*.yaml. Because improvement-r001 and improvement-r002 are demoted to report-only, the retirement helper reports both records as INFO history (reports-retirement-records), and the old files are no longer read as config layers (old-value-not-applied), so the effective churn_window stays at the bundled default of 90 days ago. It neither writes, edits nor deletes anything (no-write, no-edit). Slash-invoked (disable-model-invocation), so there is no Skill-fired grader. Needs --scaffold and --allow-tools Write Edit so the write graders can fail.'
tags: [setup, check, config-cascade, retired, no-network]
expected_outcome: 'A PASS/FAIL/WARN/INFO report in which no canonical config layer exists, the effective churn_window is the bundled default 90 days ago (not 30 days ago from .claude/improvement.md), and improvement-r001 and improvement-r002 are reported as report-only INFO history. Nothing is written or deleted.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/improvement:setup'
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Write, Edit]
  max_turns: 15
  timeout_seconds: 600
graders:
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: reports-retirement-records
    type: regex
    pattern: '(?=[\s\S]*improvement-r001)[\s\S]*improvement-r002'
    target: last_message
    arm: both
  - name: old-value-not-applied
    type: regex
    pattern: '(?=[\s\S]*\b90 days\b)[\s\S]*\b(?:INFO|report-only)\b|(?=[\s\S]*\b(?:INFO|report-only)\b)[\s\S]*\b90 days\b'
    flags: 'i'
    target: last_message
    arm: both
