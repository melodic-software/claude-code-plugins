schema_version: "1.1"
name: find-instrument-first
description: 'A find run on a checkout speed question with no telemetry, CI or history ranks an instrument-this candidate first and records the evidence gaps'
tags: [find, instrument-first]
expected_outcome: 'The first ranked candidate proposes instrumenting or baselining checkout timing, the reply lists evidence-gap lines for the missing telemetry, CI or history, and no Write or Edit call is made.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/improvement:find checkout feels slow to customers. What should we improve to make it faster? Only look at the files in this directory.'
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 25
  timeout_seconds: 900
graders:
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: top-candidate-instruments
    type: regex
    pattern: '^[ \t]*(?:\|\s*\**#?1\**\s*\||[-*]?\s*\**#?1[.)]\**\s|#{1,4}\s*\**(?:#|rank\s*|candidate\s*)?1\b)(?:(?!\n[ \t]*(?:\|\s*\**#?\d{1,2}\**\s*\||[-*]?\s*\**#?\d{1,2}[.)]\**\s|#{1,4}\s*\**(?:#|rank\s*|candidate\s*)?\d{1,2}\b))[\s\S]){0,600}?\b(?:instrument|add (?:timing|tracing|metrics|telemetry|latency|logging|spans?)|baseline|measure(?: it| this| that| them)? (?:first|before|checkout|latency|the|each|where|how)|capture (?:timing|latency|durations?)|time (?:`?buildSummary|checkout|each|every|the (?:checkout|whole|pricing|inventory|calls?|requests?|fetch))|(?:record|track|log) (?:timings?|latency|durations?)|start (?:by|with) measuring)'
    flags: 'im'
    arm: both
  - name: records-evidence-gaps
    type: regex
    pattern: '(?<!\bno\s)\b(?:evidence[- ])?gaps?\b[^\n]{0,160}?\b(?:telemetry|CI|history|git|metrics?|latency|GitHub|measurements?|tests?)\b|\bno (?:telemetry|CI|git history|metrics|latency data|measurements?|timing data)\b[^\n]{0,80}?\b(?:available|configured|found|exists?|present|recorded|to rank)\b|\b(?:couldn\x27t|could not|can\x27t|cannot|didn\x27t|did not) see\b[\s\S]{0,400}?\b(?:telemetry|CI|history|git|metrics?|measurements?)\b'
    flags: 'i'
    arm: both
