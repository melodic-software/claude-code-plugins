schema_version: "1.1"
name: imp-no-args-asks-once
description: 'Bare improve with no conversation context asks once for target, focus and done, each with a recommended answer, and edits nothing before the answer'
tags: [improve, no-args]
expected_outcome: 'The reply asks one message of questions covering target, focus and what done looks like, offers a recommended answer, and calls neither Write nor Edit.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/improvement:improve'
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 15
  timeout_seconds: 900
graders:
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: asks-target-focus-done
    type: regex
    pattern: '(?=[\s\S]*\btarget\b)(?=[\s\S]*\bfocus\b)(?=[\s\S]*(?:\bdone\b|\b(?:success|successful)\b|\bgood outcome\b))[\s\S]*(?:\?|\bplease (?:confirm|choose|pick|reply)\b|\bconfirm or (?:redirect|change|correct)\b|\breply with\b|\breply to confirm\b)'
    flags: 'i'
    arm: both
  - name: offers-recommended-answer
    type: regex
    pattern: '(?<!\bno\s)\b(?:recommend(?:ed|ation)?|suggest(?:ed|ion)?|default|propos(?:e|ed|al)|my (?:pick|guess|inference))\b'
    flags: 'i'
    arm: both
