schema_version: "1.1"
name: ranked-options-ask-routes-to-find
description: 'Legacy improve case ranked-list-routes-to-find. A natural-language ask for a ranked list of options invokes /improvement:find (routes-to-find, with-only) and never /improvement:improve (no-improve-skill), shows a ranked list (has-ranked-list), and makes no Write or Edit call. Needs --scaffold and --allow-tools Write Edit so the no-write and no-edit graders can fail.'
tags: [improve, find, routing, no-network]
expected_outcome: 'The run invokes /improvement:find, not /improvement:improve, answers with a ranked list of candidates, and edits nothing.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'What should we improve in this repo? Give me a ranked list of options.'
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 30
  timeout_seconds: 900
graders:
  - name: routes-to-find
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:improvement:)?find"'
    min: 1
    arm: with-only
  - name: no-improve-skill
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:improvement:)?improve"'
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: has-ranked-list
    type: regex
    pattern: '^[ \t]*(?:\|\s*\**#?1\**\s*\||[-*]?\s*\**#?1[.)]\**\s|#{1,4}\s*\**(?:#|rank\s*|candidate\s*)?1\b)'
    flags: 'im'
    target: last_message
    arm: both
