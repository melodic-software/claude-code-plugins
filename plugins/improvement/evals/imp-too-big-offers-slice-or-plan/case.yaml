schema_version: "1.1"
name: imp-too-big-offers-slice-or-plan
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: no-branch-commit-or-pr
    type: tool_used
    tool: 'Bash'
    input_match: '(?:(?<=\\n)|(?<=\\t)|(?<![\w\\]))(?:git\s+(?:-[cC]\s+\S+\s+)*(?:checkout\s+-[bB]|switch\s+-[cC]|branch\s+(?!-|--)\S|commit|push)\b|gh\s+pr\s+(?:create|merge)\b)'
    min: 0
    max: 0
    arm: both
  - name: names-cap-exceeded
    type: regex
    pattern: '\b(?:hard )?cap\b|\bscope budget\b|\bpr-scope-budget\b|\b(?:15|400)\b[^\n]{0,60}?\b(?:files?|lines?)\b'
    flags: 'i'
    target: last_message
    arm: both
  - name: offers-slice-or-plan
    type: regex
    pattern: '/?planning:plan\b|\bsmaller\b[^\n]{0,60}?\bslice\b|\bslice\b[^\n]{0,80}?\b(?:fits?|within|under)\b'
    flags: 'i'
    target: last_message
    arm: both
  - name: asks-for-choice
    type: regex
    pattern: '\b(?:which|would you|do you want|shall I|should I|prefer)\b[^\n?]{0,160}\?'
    flags: 'i'
    target: last_message
    arm: both
