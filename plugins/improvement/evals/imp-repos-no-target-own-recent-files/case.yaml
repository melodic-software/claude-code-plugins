schema_version: "1.1"
name: imp-repos-no-target-own-recent-files
description: 'An unattended dry run given only --repo for a second repository takes the recent-files target from that repository''s own history, never from the invoking repository, and edits nothing. The invoking repository is invoice-service (discount.js, currency.js, late-fee.js); the named one is ledger-cli at peer/ledger-cli (report.js, export.js, balances.js, cli.js), so the two lists share no file name. Needs --scaffold and --allow-tools Bash Edit Write so the must-not graders can fail.'
tags: [improve, several-repositories, unattended, dry-run, no-network]
expected_outcome: 'The run reads ledger-cli''s history with git -C peer/ledger-cli log, picks one ledger-cli file as the target, presents its gap and proposed diff, names no invoice-service file as the target, and asks, edits, writes, branches and commits nothing.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/improvement:improve dry-run --unattended --repo peer/ledger-cli'
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, AskUserQuestion]
  max_turns: 25
  timeout_seconds: 900
graders:
  - name: no-ask-tool
    type: tool_used
    tool: 'AskUserQuestion'
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: no-branch-commit-or-pr
    type: tool_used
    tool: 'Bash'
    input_match: '(?:(?<=\\n)|(?<=\\t)|(?<![\w\\]))(?:git\s+(?:-[cC]\s+\S+\s+)*(?:checkout\s+-[bB]|switch\s+-[cC]|branch\s+(?!-|--)\S|commit|push)\b|gh\s+pr\s+(?:create|merge)\b)'
    min: 0
    max: 0
    arm: both
  - name: reads-named-repo-history
    type: tool_used
    tool: 'Bash'
    input_match: 'git\s+-C\s+(?:\\?["''])?[^\s"''\\]*peer/ledger-cli/?(?:\\?["''])?\s+(?:-c\s+\S+\s+)*log\b'
    min: 1
    arm: both
  - name: targets-named-repo-file
    type: regex
    pattern: '\b(?:report|export|balances|cli)\.js\b'
    target: last_message
    arm: both
  - name: no-invoking-repo-file
    type: regex
    pattern: '\b(?:discount|currency|late-fee)\.js\b'
    match: not_contains
    target: last_message
    arm: both
