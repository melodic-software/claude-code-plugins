schema_version: "1.1"
name: already-built-disconnected-scan
description: 'An improvement sweep scoped to an admin-export fixture whose approved plan says nothing exports orders today must still report the built-but-disconnected export as a ranked candidate ahead of the planned greenfield build, unprompted'
tags: [find, disconnected-scan]
expected_outcome: 'The answer names the unused exportRowsToCsv import, the false adminBulkExport flag gating POST /admin/orders/export, and the never-read export_audit table, ranks the disconnected export ahead of the new export service in docs/bulk-export-plan.md, and edits nothing.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/improvement:find what should we work on next in this service? The bulk export plan in evals/fixtures/disconnected-admin-export/docs/bulk-export-plan.md is approved, so rank it alongside anything else you find. Scope the scan to the files under evals/fixtures/disconnected-admin-export/ and ignore everything outside that directory.'
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 30
  timeout_seconds: 900
graders:
  - name: dead-import-exportRowsToCsv
    type: regex
    pattern: '(?=[\s\S]*routes\.js)(?=[\s\S]*csv-exporter\.js)[\s\S]*?(?:exportRowsToCsv[^\n]{0,240}?(?<!\bnot\s)(?<!n\x27t\s)(?<!\bno\s)\b(?:never (?:call(?:s|ed)?|use[sd]?|invoke[sd]?|wired)|not (?:called|used|invoked|wired)|(?:does not|doesn\x27t|is not|isn\x27t) (?:call|use|invoke)|unused|unreferenced|imported but (?:never|not)|dead (?:import|code)|no (?:callers?|call sites?|calls)|nothing (?:calls|uses|invokes|references))|(?<!\bnot\s)(?<!n\x27t\s)(?<!\bno\s)\b(?:never (?:call(?:s|ed)?|use[sd]?|invoke[sd]?|wired)|not (?:called|used|invoked|wired)|(?:does not|doesn\x27t|is not|isn\x27t) (?:call|use|invoke)|unused|unreferenced|imported but (?:never|not)|dead (?:import|code)|no (?:callers?|call sites?|calls)|nothing (?:calls|uses|invokes|references))[^\n]{0,160}?exportRowsToCsv)'
    flags: 'i'
    arm: both
  - name: dark-flag-adminBulkExport
    type: regex
    pattern: '(?=[\s\S]*/admin/orders/export)(?=[\s\S]*flags\.json)[\s\S]*?(?:adminBulkExport[^\n]{0,160}?(?<!\bnot\s)(?<!n\x27t\s)(?<!\bno\s)\b(?:false|off|disabled|dark|turned off|switched off)\b|(?<!\bnot\s)(?<!n\x27t\s)(?<!\bno\s)\b(?:false|off|disabled|dark|turned off|switched off)\b[^\n]{0,120}?adminBulkExport)'
    flags: 'i'
    arm: both
  - name: unread-table-export-audit
    type: regex
    pattern: 'export_audit[^\n]{0,200}?(?<!\bnot\s)(?<!n\x27t\s)(?<!\bno\s)\b(?:never (?:read|queried|selected|consumed)|not (?:read|queried|selected)|nothing (?:reads|queries|selects)|no (?:readers?|query|queries|consumers?|SELECT)|unread|write-only|only (?:ever )?(?:written|inserted)|written but)\b|(?<!\bnot\s)(?<!n\x27t\s)(?<!\bno\s)\b(?:never (?:read|queried|selected|consumed)|not (?:read|queried|selected)|nothing (?:reads|queries|selects)|no (?:readers?|query|queries|consumers?|SELECT)|unread|write-only|only (?:ever )?(?:written|inserted)|written but)\b[^\n]{0,160}?export_audit'
    flags: 'i'
    arm: both
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: ranked-ahead-of-greenfield
    type: regex
    pattern: '(?<![\s\S])(?:(?!^[ \t]*(?:\|\s*\**#?\d{1,2}\**\s*\||[-*]?\s*\**#?\d{1,2}[.)]\**\s|#{1,4}\s*\**(?:#|rank\s*|candidate\s*)?\d{1,2}\b)(?:(?!\n[ \t]*(?:\|\s*\**#?\d{1,2}\**\s*\||[-*]?\s*\**#?\d{1,2}[.)]\**\s|#{1,4}\s*\**(?:#|rank\s*|candidate\s*)?\d{1,2}\b))(?:(?:instead of|rather than)\b(?:(?!\.\s)[^|\n;,]){0,160}(?=[|\n;,]|\.\s|$)|(?!(?:instead of|rather than)\b)(?!(?:exportRowsToCsv|adminBulkExport|export_audit|csv-exporter|/admin/orders/export|disconnected|already[- ]built|already exists|existing (?:CSV )?export))(?!(?:bulk-export-plan|ordersExportV2|order_exports|src/export/|/admin/export/orders|greenfield|new export service|build(?:ing)? (?:a|the) new export))[\s\S]))*(?:bulk-export-plan|ordersExportV2|order_exports|src/export/|/admin/export/orders|greenfield|new export service|build(?:ing)? (?:a|the) new export))[\s\S])*?^[ \t]*(?:\|\s*\**#?\d{1,2}\**\s*\||[-*]?\s*\**#?\d{1,2}[.)]\**\s|#{1,4}\s*\**(?:#|rank\s*|candidate\s*)?\d{1,2}\b)(?:(?!\n[ \t]*(?:\|\s*\**#?\d{1,2}\**\s*\||[-*]?\s*\**#?\d{1,2}[.)]\**\s|#{1,4}\s*\**(?:#|rank\s*|candidate\s*)?\d{1,2}\b))(?:(?:instead of|rather than)\b(?:(?!\.\s)[^|\n;,]){0,160}(?=[|\n;,]|\.\s|$)|(?!(?:instead of|rather than)\b)(?!(?:exportRowsToCsv|adminBulkExport|export_audit|csv-exporter|/admin/orders/export|disconnected|already[- ]built|already exists|existing (?:CSV )?export))(?!(?:bulk-export-plan|ordersExportV2|order_exports|src/export/|/admin/export/orders|greenfield|new export service|build(?:ing)? (?:a|the) new export))[\s\S])){0,1500}?(?:exportRowsToCsv|adminBulkExport|export_audit|csv-exporter|/admin/orders/export|disconnected|already[- ]built|already exists|existing (?:CSV )?export)'
    flags: 'im'
    arm: both
