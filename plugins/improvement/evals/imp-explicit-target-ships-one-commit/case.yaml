schema_version: "1.1"
name: imp-explicit-target-ships-one-commit
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-ask-tool
    type: tool_used
    tool: 'AskUserQuestion'
    min: 0
    max: 0
    arm: both
  - name: edits-target
    type: tool_used
    tool: 'Edit'
    input_match: 'report\.sh'
    min: 1
    arm: both
  - name: edits-only-target
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path"\s*:\s*"(?!(?:[^"\\]|\\.)*?plugins[\\/]+example[\\/]+scripts[\\/]+report\.sh")'
    min: 0
    max: 0
    arm: both
  - name: one-commit
    type: tool_used
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?(?:(?<=\\n)|(?<=\\t)|(?<![\w\\]))git\s+(?:-[cC]\s+\S+\s+)*commit\b'
    min: 1
    max: 1
    arm: both
  - name: check-before-commit
    type: regex
    pattern: '"command"\s*:\s*"(?:[^"\\]|\\.)*?\b(?:bash|sh)\s+(?:[^\s"\\]*/)?scripts/check\.sh(?:[^"\\]|\\.)*?(?:(?<=\\n)|(?<=\\t)|(?<![\w\\]))git\s+(?:-[cC]\s+\S+\s+)*commit\b|"command"\s*:\s*"(?:[^"\\]|\\.)*?\b(?:bash|sh)\s+(?:[^\s"\\]*/)?scripts/check\.sh(?:[^"\\]|\\.)*"[\s\S]*?"command"\s*:\s*"(?:[^"\\]|\\.)*?(?:(?<=\\n)|(?<=\\t)|(?<![\w\\]))git\s+(?:-[cC]\s+\S+\s+)*commit\b'
    target: trace
    arm: both
  - name: no-target-question
    type: regex
    pattern: '\b(?:which|what)\b[^\n?]{0,80}\b(?:target|focus|file|lens)\b[^\n?]{0,80}\?'
    flags: 'i'
    match: not_contains
    target: last_message
    arm: both
  - name: basis-cites-standard-line
    type: regex
    pattern: 'bash\.md`?(?::|#L|,? line\s*|\s*\(line\s*)\s*\d+'
    flags: 'i'
    target: last_message
    arm: both
  - name: pr-body-shape
    type: llm
    criteria: 'PASS only if the reply shows a pull request title and body, and the body names the gap that was fixed, the standard it rests on (docs/standards/bash.md with a line), how the change was verified (bash scripts/check.sh), and an issue-linkage line (Closes #N, or No related issue: followed by a reason), and any other gap the run found is listed as a candidate rather than fixed in the same change. FAIL if the body lacks the gap, the standard, the verification or the linkage line, if the reply says the change fixed more than one gap, or if it says the check failed and the change was committed anyway.'
