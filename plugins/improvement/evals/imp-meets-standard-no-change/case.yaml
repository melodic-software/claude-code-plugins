schema_version: "1.1"
name: imp-meets-standard-no-change
description: 'Improve on a file that already meets the repo standard reports that it meets the standard, names the standard file, and makes no edit and no PR'
tags: [improve, zero-candidates]
expected_outcome: 'The reply says src/currency.js meets docs/standards/javascript.md, names that file, and calls neither Write nor Edit.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/improvement:improve src/currency.js --focus standards'
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: says-meets-named-standard
    type: regex
    pattern: '(?:(?<!\bnot\s)(?<!n\x27t\s)(?<!\bno\s)(?<!doesn\x27t\s)\b(?:meets|satisfies|complies with|conforms to|already follows|compliant with|in line with|no gaps? (?:against|from|relative to))\b[^\n]{0,160}?javascript\.md|javascript\.md[^\n]{0,160}?(?<!\bnot\s)(?<!n\x27t\s)(?<!\bno\s)\b(?:meets|met|satisfied|complies|conforms|no gaps?|nothing to (?:fix|change|improve)|zero (?:gaps|candidates)|fully compliant|no violations?)\b|(?<!\bnot\s)(?<!n\x27t\s)(?<!\bno\s)\b(?:already (?:meets|follows|complies with|conforms to|satisfies|passes)|meets (?:every|all|each|the|its|your)\b|found nothing to fix|nothing to fix)[\s\S]{0,600}?javascript\.md|javascript\.md[\s\S]{0,600}?(?<!\bnot\s)(?<!n\x27t\s)(?<!\bno\s)\b(?:already (?:meets|follows|complies with|conforms to|satisfies|passes)|meets (?:every|all|each|the|its|your)\b|found nothing to fix|nothing to fix))'
    flags: 'i'
    arm: both
