schema_version: "1.1"
name: setup-check-old-file-warns
description: 'Bare /improvement:setup runs the read-only check on a repository whose only improvement config is the old team file .claude/improvement.md, setting churn_window to 30 days ago, and the old personal file .claude/improvement.local.md, setting find_size_band to small, with no docs/conventions/improvement*.yaml. The dual-read window still applies the old value, reported with the old file as its layer (old-value-applies), and the reply prints a warning naming the old file, its new location docs/conventions/improvement.yaml and /improvement:setup apply (warns-with-new-location). The retirement helper reports both records (reports-retirement-records). It neither writes, edits nor deletes anything (no-write, no-edit). Slash-invoked (disable-model-invocation), so there is no Skill-fired grader. Needs --scaffold and --allow-tools Write Edit so the write graders can fail.'
tags: [setup, check, config-cascade, dual-read, no-network]
expected_outcome: 'A PASS/FAIL/WARN/INFO report in which the effective churn_window is 30 days ago, supplied by the old .claude/improvement.md, and a WARN names that file, says to move it to docs/conventions/improvement.yaml, and names /improvement:setup apply as the command that moves it. Nothing is written or deleted.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/improvement:setup'
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Write, Edit]
  max_turns: 15
  timeout_seconds: 600
graders:
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: old-value-applies
    type: regex
    pattern: '30 days(?: ago)?[^\n]{0,200}?(?<![~\w/])\.claude/improvement\.md|(?<![~\w/])\.claude/improvement\.md[^\n]{0,200}?30 days'
    target: last_message
    arm: both
  - name: warns-with-new-location
    type: regex
    pattern: '(?=[\s\S]*\bWARN)(?=[\s\S]*(?<![~\w/])\.claude/improvement\.md)(?=[\s\S]*docs/conventions/improvement\.yaml)[\s\S]*improvement:setup apply'
    target: last_message
    arm: both
  - name: reports-retirement-records
    type: regex
    pattern: '(?=[\s\S]*improvement-r001)[\s\S]*improvement-r002'
    target: last_message
    arm: both
