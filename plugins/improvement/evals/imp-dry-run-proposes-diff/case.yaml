schema_version: "1.1"
name: imp-dry-run-proposes-diff
description: 'A dry run of improve on a file with one loose-equality gap presents the gap, its basis as the standard''s file:line and a proposed diff, then stops without editing'
tags: [improve, dry-run]
expected_outcome: 'The reply names the == comparison in src/discount.js, cites docs/standards/javascript.md at the equality rule''s line, shows a diff that replaces code == null with a strict comparison, and calls neither Write nor Edit.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/improvement:improve dry-run src/discount.js'
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: cites-standard-line
    type: regex
    pattern: 'javascript\.md`?(?::|#L|,? line\s*|\s*\(line\s*)\s*[3-5]\b'
    flags: 'i'
    arm: both
  - name: proposes-diff
    type: regex
    pattern: '^[ \t]*-[^\n]*code\s*==\s*null[^\n]*\n(?:[^\n]*\n){0,6}?[ \t]*\+[^\n]*code\s*===\s*(?:null|undefined)'
    flags: 'm'
    arm: both
