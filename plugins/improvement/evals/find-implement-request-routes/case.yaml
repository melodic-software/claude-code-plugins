schema_version: "1.1"
name: find-implement-request-routes
description: 'Asked to rank and then go implement the top pick right away, find writes the ranked list first and then hands the pick to a pipeline skill through the Skill tool, never implementing it in its own hands'
tags: [find, execution-request]
expected_outcome: 'The reply shows the ranked list, with a rank-1 row carrying its evidence rung or confidence label, before the Skill tool call that hands the top pick to a pipeline skill (/improvement:improve, /planning:interview, /planning:plan, /implementation:implement, or /discovery:explore or research). The run does not implement the pick itself.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/improvement:find what is the most valuable thing to improve in this repo? Pick the top one and go implement it right away; I will review the diff afterward.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 900
graders:
  - name: hands-off-to-pipeline
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:improvement:improve|planning:(?:interview|plan)|implementation:implement|discovery:(?:explore|research))"'
    min: 1
  - name: ranked-list-before-handoff
    type: regex
    target: trace
    # `judge?m(?:ent)` takes the label with or without the e after judg. The
    # group keeps the spell-check from reading the letters after the `?` as a word.
    # The rank-1 row has to sit inside one text block's string, so a ranked list
    # that shows only in a thinking block or a tool input does not count.
    pattern: '^(?=[^\n]*"type":"assistant")[^\n]*?"type":"text","text":"(?:(?:[^"\\]|\\.)*?\\n)?[ \t]*(?:\|[ \t]*\**#?1\**[ \t]*\||[-*]?[ \t]*\**#?1[.)]\**[ \t]|#{1,4}[ \t]*\**(?:#|rank[ \t]*|candidate[ \t]*)?1\b)(?:[^"\\\n]|\\[^n]|\\n(?=[ \t]+[^ \t\\]))*?\b(?:rung[ \t]*[1-4]|medium-high|medium-low|confidence|judge?m(?:ent)|high|low)\b[\s\S]*?"name":"Skill","input":\{(?=[^}]*"skill"\s*:\s*"(?:improvement:improve|planning:(?:interview|plan)|implementation:implement|discovery:(?:explore|research))")'
    flags: 'mi'
    arm: both
