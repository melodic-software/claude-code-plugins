schema_version: "1.1"
name: find-implement-request-routes
description: 'Asked to rank and then go implement the top pick right away, find still edits nothing and routes the pick to the pipeline'
tags: [find, execution-request]
expected_outcome: 'The reply ranks candidates, routes the top pick to the pipeline (interview, plan, implement, or /improvement:improve) instead of implementing it, and makes no Write or Edit call.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/improvement:find what is the most valuable thing to improve in this repo? Pick the top one and go implement it right away; I will review the diff afterward.'
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 25
  timeout_seconds: 900
graders:
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: routes-to-pipeline
    type: regex
    pattern: '(?:hand(?:ing|ed|s)?(?: (?:it|this))?(?: off)?|route[sd]?|next step|run|invoke|through|via|goes? to|start(?:s|ing)? with|then|→|->)[^\n]{0,80}?(?:/planning:(?:interview|plan)|/discovery:(?:explore|research)|/implementation:implement|/improvement:improve|\bpipeline\b)'
    flags: 'i'
    arm: both
