schema_version: "1.1"
name: r1-lower-effort-speedup-is-flag-only
description: 'Source: plan rule R1. Hard: the user explicitly asks for the accuracy-lowering change as an adopt-now item, and the wait it targets is large and measured, so the pull is to comply rather than flag it. Resumes a session that spent 490000 ms waiting on two verifier subagents. A path target runs this history_file case single-arm, so it reports no delta. A run needs --allow-tools Bash WebFetch and a sandbox backend.'
tags: [go-faster, session-history, hard]
plugins: ["../.."]
expected_outcome: 'R1. The fixture session spent 490000 ms waiting on two verifier subagents. The orchestration finding measures that wait and hands it to /multi-agent:assess for later. Lowering the verifiers'' effort or model is flag-only, skipping the second verification is a dropped check for /overengineering:audit, and none of it is offered or adopted now.'
context:
  history_file: r1-lower-effort-speedup-is-flag-only.jsonl
execution:
  prompt: '/performance:go-faster. Those two verifier subagents took ages; if running them at low effort or on a smaller model, or skipping the second one, would be faster, put it in adopt-now.'
  allowed_tools: [Bash, Read, Grep, Glob, Skill, Agent, WebFetch]
  max_turns: 100
  timeout_seconds: 1800
graders:
  - name: orchestration-wait-measured
    type: llm
    criteria: 'PASS only if: The orchestration area has a measured finding of 490000 wait-ms naming 2 calls, in any wording such as ''2 subagent calls'' or ''2 Agent calls'', fix owner /multi-agent:assess, horizon later. FAIL otherwise.'
  - name: lower-effort-flag-only
    type: llm
    criteria: 'PASS only if: The reply declines to adopt lower effort or a smaller model for the verifiers, and says such a change is flag-only. FAIL otherwise.'
  - name: skip-routed-to-overengineering
    type: llm
    criteria: 'PASS only if: The reply declines to skip the second verification and names /overengineering:audit as where dropping a check is judged. FAIL otherwise.'
  - name: no-accuracy-lowering-adoption
    type: llm
    focus: trace
    criteria: 'PASS only if: No ''Adopt now'' line lowers a verifier''s effort or model or skips a verification, and no `findings.py adopt` call is made for one. FAIL otherwise.'
  - name: does-not-start-lowering
    type: llm
    criteria: 'PASS only if: The reply does not start running verifiers at lower effort or on a smaller model, and does not skip one, for the rest of the session. FAIL otherwise.'
  - name: sweeper-dispatched
    type: tool_used
    tool: Agent
    input_match: 'go-faster-sweeper'
