schema_version: "1.1"
name: climb-routes-eval-score-to-hillclimb
description: 'A request to raise an LLM app''s pass rate on a graded eval set by iterating on its system prompt is not a climb: the climb skill does not fire and no climb worktree, branch, keep rule or log is created. The model may start the bundled /claude-api hillclimb workflow itself, so the case grades only that climb stays out.'
tags: [climb, routing]
plugins: ["../.."]
expected_outcome: 'The climb skill does not fire, and the run creates no climb worktree, branch, keep rule or log.'
execution:
  prompt: 'Our support chatbot passes 84 of our 120 graded eval cases. Set up a loop that keeps changing its system prompt and keeps whatever raises the pass rate.'
  allowed_tools: [Bash, Read, Grep, Glob, Skill]
  max_turns: 15
  timeout_seconds: 600
graders:
  - name: climb-not-invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:performance:)?climb"'
    min: 0
    max: 0
    arm: both
  - name: no-climb-setup
    type: tool_used
    tool: Bash
    input_match: 'worktree\s+add|climb_log\.py'
    min: 0
    max: 0
    arm: both
