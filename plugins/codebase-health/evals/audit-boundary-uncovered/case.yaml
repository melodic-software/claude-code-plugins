schema_version: "1.1"
name: audit-boundary-uncovered
context:
  scaffold_script: scaffold.sh
graders:
  - name: names-owner-lane
    type: regex
    pattern: 'harness-config:audit\b(?!-)'
    flags: 'i'
    target: last_message
  - name: no-harness-run
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"/?harness-config:'
    min: 0
    max: 0
    arm: 'both'
  - name: no-settings-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?settings(?:\.local)?\.json"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-settings-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?settings(?:\.local)?\.json"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-version-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?package\.json"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-version-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?package\.json"'
    min: 0
    max: 0
    arm: 'both'
