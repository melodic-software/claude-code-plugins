schema_version: "1.1"
name: setup-apply-interviews-first
context:
  scaffold_script: scaffold.sh
graders:
  - name: explores-repo
    type: regex
    pattern: '\\?"name\\?":\s*\\?"Read\\?",\s*\\?"input\\?":\s*\{\s*\\?"file_path\\?":\s*\\?"(?![^"\\]*/codebase-health/)(?:[^"\\]|\\.)*?(?:package\.json|README\.md|packages/|docs/)|\\?"name\\?":\s*\\?"Bash\\?",\s*\\?"input\\?":\s*\{\s*\\?"command\\?":\s*\\?"(?=(?:[^"\\]|\\.){0,800}?\b(?:cat|head|tail|sed|awk|less|more|nl|bat)\b)(?:[^"\\]|\\.){0,800}?(?:(?<=[\s''=])|(?<=\\"))(?![^\s"\\]*/codebase-health/)[^\s"\\;|&]*?(?:package\.json|README\.md|packages/|docs/)'
    target: trace
    arm: 'both'
  - name: asks-with-recommendation
    type: llm
    criteria: 'The expectation, verbatim: "Interviews the user per dimension with a recommendation, rather than writing blind." The skill line it rests on, verbatim: "Present each dimension''s drafted globs with a recommendation; let the user accept, edit, or remove the dimension." Pass when the reply presents drafted sources for the documentation dimension together with the option it recommends, and asks the user before anything is written. Fail when it asks with no recommended option, recommends without asking, or says the config was already written.'
    focus: last_message
  - name: no-config-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?codebase-health(?:\.local)?\.md"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-config-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?codebase-health(?:\.local)?\.md"'
    min: 0
    max: 0
    arm: 'both'
  - name: config-not-created
    type: file_exists
    path: '.claude/codebase-health.md'
    exists: false
  - name: no-plugin-dir-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:/codebase-health/(?:skills|lib|evals|\.claude-plugin)/|/plugins/data/)'
    min: 0
    max: 0
    arm: 'both'
