schema_version: "1.1"
name: setup-apply-interviews-first
context:
  scaffold_script: scaffold.sh
graders:
  - name: explores-repo
    type: tool_used
    tool: 'Read'
    input_match: '"file_path":"(?![^"]*/codebase-health/)(?:[^"\\]|\\.)*?(?:package\.json|README\.md|packages/|docs/)'
    min: 1
    arm: 'both'
  - name: asks-with-recommendation
    type: regex
    pattern: '^(?=[\s\S]*\brecommend\w*)(?=[\s\S]*\bdocumentation\b)(?=[\s\S]*\?)'
    flags: 'i'
    target: last_message
  - name: no-config-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?codebase-health(?:\.local)?\.md"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-config-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?codebase-health(?:\.local)?\.md"'
    min: 0
    max: 0
    arm: 'both'
  - name: config-not-created
    type: file_exists
    path: '.claude/codebase-health.md'
    exists: false
  - name: no-plugin-dir-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:/codebase-health/(?:skills|lib|evals|\.claude-plugin)/|/plugins/data/)'
    min: 0
    max: 0
    arm: 'both'
