schema_version: "1.1"
name: audit-planted-drift
context:
  scaffold_script: scaffold.sh
graders:
  - name: finding-row
    type: regex
    pattern: 'README\.md`?(?::|#L|,? ?\(?line |,? ?L ?)\d+[\s\S]{0,300}?\bserve\b[^\n]{0,200}?(?:\bno\b|\bnot\b|\bmissing\b|\babsent\b|\bnon-?existent\b|\bundefined\b|\bdoesn''t\b|\bisn''t\b|\blacks?\b|\bonly\b|\bbut\b|\binstead\b|\bdefines\b[^\n]{0,40}?\bstart\b)|\bserve\b[^\n]{0,200}?(?:\bno\b|\bnot\b|\bmissing\b|\babsent\b|\bnon-?existent\b|\bundefined\b|\bdoesn''t\b|\bisn''t\b|\blacks?\b|\bonly\b|\bbut\b|\binstead\b|\bdefines\b[^\n]{0,40}?\bstart\b)[\s\S]{0,300}?README\.md`?(?::|#L|,? ?\(?line |,? ?L ?)\d+|README\.md`?(?::|#L|,? ?\(?line |,? ?L ?)\d+[\s\S]{0,300}?(?:\bno\b|\bnot\b|\bmissing\b|\babsent\b|\bnon-?existent\b|\bundefined\b|\bdoesn''t\b|\bisn''t\b|\blacks?\b|\bonly\b|\bbut\b|\binstead\b|\bdefines\b[^\n]{0,40}?\bstart\b)[^\n]{0,80}?\bserve\b'
    flags: 'i'
    target: last_message
  - name: verified-non-issues
    type: regex
    pattern: 'verified non-?issues?\b(?:(?!\n[ \t]*(?:#{1,6}[ \t]+|(?:\d+\.[ \t]*)?\*\*[ \t]*)(?:\d+\.[ \t]*)?(?:drift patterns|fix priority|enforcement|config[- ]gap))[\s\S]){0,1500}?(?:package\.json|config\.js|config\.test\.js)'
    flags: 'i'
    target: last_message
  - name: needs-you-line
    type: regex
    pattern: '\bneeds you\b(?:\*\*)?[ \t]*(?::|—|–|-|\|)|^[ \t]*#{1,6}[ \t]+needs you\b'
    flags: 'im'
    target: last_message
  - name: no-repo-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:README\.md|package\.json|src/|test/)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-repo-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:README\.md|package\.json|src/|test/)'
    min: 0
    max: 0
    arm: 'both'
