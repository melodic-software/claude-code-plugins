schema_version: "1.1"
name: setup-check-new-layer-only
description: 'Bare /codebase-health:setup runs the read-only check on a repository whose only codebase-health config is the new team file docs/conventions/codebase-health.md, declaring documentation and a custom api-contracts dimension. The reply reports api-contracts with the team file as its layer (team-layer-applies), prints no dual-read warning about an old .claude/ file (no-old-file-warning), and neither writes nor edits (no-write, no-edit). Slash-invoked (disable-model-invocation), so there is no Skill-fired grader. Needs --scaffold and --allow-tools Write Edit so the write graders can fail.'
tags: [setup, check, config-cascade, no-network]
expected_outcome: 'A PASS/FAIL/WARN/INFO report reading the team layer from docs/conventions/codebase-health.md: the effective config holds the documentation and api-contracts dimensions, supplied by the team file. No old-location file exists, so no dual-read warning names one. Nothing is written.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/codebase-health:setup'
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Write, Edit]
  max_turns: 15
  timeout_seconds: 600
graders:
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: team-layer-applies
    type: regex
    pattern: 'api-contracts[^\n]{0,200}?(?:\bteam\b|docs/conventions/codebase-health\.md)|(?:\bteam\b|docs/conventions/codebase-health\.md)[^\n]{0,200}?api-contracts'
    flags: 'i'
    target: last_message
    arm: both
  - name: no-old-file-warning
    type: regex
    pattern: '\bWARN\b[^\n]{0,200}?(?<![~\w/])\.claude/codebase-health\.|(?<![~\w/])\.claude/codebase-health\.[^\n]{0,200}?\bWARN\b'
    match: not_contains
    target: last_message
    arm: both
