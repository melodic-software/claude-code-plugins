schema_version: "1.1"
name: setup-check-both-new-wins
description: 'Bare /codebase-health:setup runs the read-only check on a repository holding both team files: the new docs/conventions/codebase-health.md (a documentation dimension only) and the old .claude/codebase-health.md (documentation and a custom api-contracts dimension). The new file wins the whole team layer (new-file-wins), so none of the old file''s dimensions apply; the warning names both files and /codebase-health:setup apply (warning-names-both) and lists api-contracts, the dimension only the old file declares, as not applied (lists-unapplied-dimension), so no old setting is dropped silently. It neither writes nor edits (no-write, no-edit). Slash-invoked (disable-model-invocation), so there is no Skill-fired grader. Needs --scaffold and --allow-tools Write Edit so the write graders can fail.'
tags: [setup, check, config-cascade, dual-read, no-network]
expected_outcome: 'A PASS/FAIL/WARN/INFO report in which docs/conventions/codebase-health.md supplies the team layer, a WARN names both .claude/codebase-health.md and docs/conventions/codebase-health.md and says the new file wins, and the old file''s dimensions, api-contracts among them, are listed as not applied. Nothing is written.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/codebase-health:setup'
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Write, Edit]
  max_turns: 15
  timeout_seconds: 600
graders:
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: new-file-wins
    type: regex
    pattern: 'docs/conventions/codebase-health\.md`?[^\n]{0,120}?\b(?:wins|takes precedence|supplies the team layer|is used)|\b(?:wins|takes precedence)[: \t]{1,3}`?docs/conventions/codebase-health\.md'
    flags: 'i'
    target: last_message
    arm: both
  - name: warning-names-both
    type: regex
    pattern: '(?=[\s\S]*\bWARN)(?=[\s\S]*(?<![~\w/])\.claude/codebase-health\.md)(?=[\s\S]*codebase-health:setup apply)[\s\S]*docs/conventions/codebase-health\.md'
    target: last_message
    arm: both
  - name: lists-unapplied-dimension
    type: regex
    pattern: 'api-contracts[^\n]{0,200}?(?:not appl|does not apply|doesn''t apply|ignored|unapplied|not used|overridden|shadowed)|(?:not appl|does not apply|doesn''t apply|ignored|unapplied|not used|overridden|shadowed)[^\n]{0,200}?api-contracts'
    flags: 'i'
    target: last_message
    arm: both
