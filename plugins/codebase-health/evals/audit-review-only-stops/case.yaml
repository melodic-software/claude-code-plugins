schema_version: "1.1"
name: audit-review-only-stops
context:
  scaffold_script: scaffold.sh
graders:
  - name: finding-row
    type: regex
    pattern: 'README\.md`?(?::|#L|,? ?\(?line |,? ?L ?)\d+[\s\S]{0,300}?\bserve\b[^\n]{0,200}?(?:\bno\b|\bnot\b|\bmissing\b|\babsent\b|\bnon-?existent\b|\bundefined\b|\bdoesn''t\b|\bisn''t\b|\blacks?\b|\bonly\b|\bbut\b|\binstead\b|\bdefines\b[^\n]{0,40}?\bstart\b)|\bserve\b[^\n]{0,200}?(?:\bno\b|\bnot\b|\bmissing\b|\babsent\b|\bnon-?existent\b|\bundefined\b|\bdoesn''t\b|\bisn''t\b|\blacks?\b|\bonly\b|\bbut\b|\binstead\b|\bdefines\b[^\n]{0,40}?\bstart\b)[\s\S]{0,300}?README\.md`?(?::|#L|,? ?\(?line |,? ?L ?)\d+|README\.md`?(?::|#L|,? ?\(?line |,? ?L ?)\d+[\s\S]{0,300}?(?:\bno\b|\bnot\b|\bmissing\b|\babsent\b|\bnon-?existent\b|\bundefined\b|\bdoesn''t\b|\bisn''t\b|\blacks?\b|\bonly\b|\bbut\b|\binstead\b|\bdefines\b[^\n]{0,40}?\bstart\b)[^\n]{0,80}?\bserve\b'
    flags: 'i'
    target: last_message
  - name: verified-non-issues
    type: regex
    pattern: '(?:verified non-?issues?\b|^[ \t]*(?:#{1,6}[ \t]+|(?:\d+\.[ \t]*)?\*\*[ \t]*|\d+\.[ \t]+)(?:\d+\.[ \t]*)?claims? (?:that )?(?:checked out|(?:were |I )?(?:checked|verified) (?:and (?:found )?|as )?(?:correct|accurate|true))\b)(?:(?!\n[ \t]*(?:#{1,6}[ \t]+|(?:\d+\.[ \t]*)?\*\*[ \t]*)(?:\d+\.[ \t]*)?(?:drift patterns|fix priority|enforcement|config[- ]gap|settings worth|coverage gaps? worth))[\s\S]){0,1500}?(?:package\.json|config\.js|config\.test\.js)'
    flags: 'im'
    target: last_message
  - name: no-implement-run
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"/?(?:implementation:)?implement"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-confirm-run
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"/?(?:verification:)?confirm"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
  - name: no-docs-read
    type: tool_used
    tool: 'Read'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?docs/topic-'
    min: 0
    max: 0
    arm: 'both'
  - name: no-docs-agent
    type: tool_used
    tool: 'Agent'
    input_match: 'docs/topic-'
    min: 0
    max: 0
    arm: 'both'
