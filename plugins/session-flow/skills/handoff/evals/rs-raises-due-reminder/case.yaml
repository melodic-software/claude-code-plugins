schema_version: "1.1"
name: rs-raises-due-reminder
description: 'The relative Read directive exercises the fallback clause to raise due Reminders. The first reply gives the exact command to publish the overdue 1.4.0 release and withholds the command to delete an old release in 2099. A run needs --scaffold and --allow-tools Bash Write Edit.'
tags: [resume, reminders, handoff]
plugins: ["../../../.."]
expected_outcome: 'The reply names [M1] as due (overdue since 2026-01-05) with the command `gh release create v1.4.0 --notes-file CHANGELOG.md` verbatim, says one reminder is not yet due without printing its command, appends the CHANGELOG line, and never edits the handoff file.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Read @.work/handoffs/20261124T100000Z-handoff-release-notes.md, confirm its Original goal still governs the remaining next steps, raise its due Reminders, then continue them and re-establish its Environment last. For the next save-point invoke /session-flow:handoff via the Skill tool; never write a handoff file free-hand.\nPrior session: 5d0c2a7e-91b4-4f3e-8a26-7c1e9b4d0f53.\nHandoff origin: ssh://git@github.com/example/repo .work/handoffs/20261124T100000Z-handoff-release-notes.md\nNext:\nAppend the 1.4.0 CHANGELOG line"
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: raises-due-command
    type: regex
    pattern: 'gh release create v1\.4\.0 --notes-file CHANGELOG\.md'
    arm: with-only
  - name: withholds-not-due-command
    type: regex
    pattern: 'gh release delete v0\.9\.0'
    match: 'not_contains'
    arm: with-only
  - name: no-handoff-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*-handoff-[^"/]*\.md"'
    min: 0
    max: 0
    arm: with-only
