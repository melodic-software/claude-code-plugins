schema_version: "1.1"
name: rs-rearms-loop-after-continuation
description: 'The fixture submits the absolute Read directive before the acknowledgment. The resume hook supplies the ordering rule. The session writes QUEUE.md, lists its scheduled tasks, then re-arms the missing ten-minute loop with its recorded prompt verbatim. A run needs --scaffold and --allow-tools Bash Write Edit Skill ToolSearch CronList CronCreate.'
tags: [resume, re-arm, loop, handoff]
plugins: ["../../../..", "resume-paste"]
expected_outcome: 'The session writes QUEUE.md, then calls CronList (after a ToolSearch load), finds no matching job, and invokes the loop skill with args `10m Check inbox/ once and append its file count to QUEUE.md; do not schedule anything.`, in that order.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Thanks.'
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill, ToolSearch, CronList, CronCreate]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: rearms-loop-verbatim
    type: tool_used
    tool: Skill
    input_match: '"loop"[\s\S]*10m Check inbox/ once and append its file count to QUEUE\.md; do not schedule anything\.'
    min: 1
    arm: with-only
  - name: continuation-before-rearm
    type: tool_order
    before:
      tool: Write
      input_match: 'QUEUE\.md'
    after:
      tool: Skill
      input_match: '"loop"'
    arm: with-only
  - name: lists-before-rearm
    type: tool_order
    before:
      tool: CronList
    after:
      tool: Skill
      input_match: '"loop"'
    arm: with-only
  - name: no-handoff-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*-handoff-[^"/]*\.md"'
    min: 0
    max: 0
    arm: with-only
