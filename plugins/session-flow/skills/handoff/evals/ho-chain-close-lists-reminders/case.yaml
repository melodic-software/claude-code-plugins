schema_version: "1.1"
name: ho-chain-close-lists-reminders
description: 'Closing handoff with an at-close reminder: the predecessor carries [M1], an agent reminder to delete the local branch scratch/latency-probe at chain close. The closing turn lists it, deletes the branch, and retires [M1] through the slots'' retire list before writing ''Next: none (closed)''. A run needs --scaffold, --allow-tools Bash Write Edit, and a session UUID.'
tags: [handoff, reminders, chain-close]
plugins: ["../../../.."]
expected_outcome: 'The session deletes scratch/latency-probe (git branch -D), writes a slots file whose retire list holds [M1] and whose next value is ''Next: none (closed)'', names the reminder in its reply, and fills the closing handoff.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The probe work is finished. Run /session-flow:handoff file probe-cleanup as the closing handoff of this chain, continuing .work/handoffs/20261124T100000Z-handoff-probe-cleanup.md."
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: retires-m1-in-slots
    type: tool_used
    tool: Write
    input_match: '^(?=.*"file_path":"[^"]*\.slots\.json")(?=.*\\"retire\\")(?=.*\[M1\])'
    min: 1
    arm: with-only
  - name: deletes-scratch-branch
    type: tool_used
    tool: Bash
    input_match: 'git[^\n]*branch[^\n]*-[dD][^\n]*scratch/latency-probe'
    min: 1
    arm: with-only
  - name: lists-reminder
    type: regex
    pattern: 'scratch/latency-probe'
    arm: with-only
  - name: no-handoff-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*-handoff-[^"/]*\.md"'
    min: 0
    max: 0
    arm: with-only
