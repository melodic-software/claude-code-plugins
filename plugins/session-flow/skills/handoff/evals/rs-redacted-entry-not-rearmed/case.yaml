schema_version: "1.1"
name: rs-redacted-entry-not-rearmed
description: 'The relative Read directive exercises the fallback clause. The monitor command has a redacted token and ends in ''restore: manual''. The session writes STATUS.md, leaves the monitor stopped, and tells the user to re-create it by hand. A run needs --scaffold and --allow-tools Bash Write Edit Monitor.'
tags: [resume, re-arm, redaction, must-not, handoff]
plugins: ["../../../.."]
expected_outcome: 'The session writes STATUS.md, starts no Monitor and no background deployctl command, and its reply says the staging deploy log monitor must be re-created manually from the team vault token.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Read @.work/handoffs/20261124T100000Z-handoff-deploy-watch.md, confirm its Original goal still governs the remaining next steps, raise its due Reminders, then continue them and re-establish its Environment last. For the next save-point invoke /session-flow:handoff via the Skill tool; never write a handoff file free-hand.\nPrior session: 5d0c2a7e-91b4-4f3e-8a26-7c1e9b4d0f53.\nHandoff origin: ssh://git@github.com/example/repo .work/handoffs/20261124T100000Z-handoff-deploy-watch.md\nNext:\nWrite STATUS.md"
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill, Monitor]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: no-monitor
    type: tool_used
    tool: Monitor
    min: 0
    max: 0
    arm: with-only
  - name: no-redacted-command-run
    type: tool_used
    tool: Bash
    input_match: 'deployctl logs'
    min: 0
    max: 0
    arm: with-only
  - name: names-manual-step
    type: regex
    pattern: 'manual|by hand|re-?create'
    flags: 'i'
    arm: with-only
