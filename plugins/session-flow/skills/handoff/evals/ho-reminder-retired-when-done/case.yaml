schema_version: "1.1"
name: ho-reminder-retired-when-done
description: 'Handoff with a done reminder: the predecessor carries [M1], a user reminder to run npm publish, and the user says they ran it. The next handoff retires [M1] through the slots'' retire list with a reason, never by deleting the line or hand-editing a handoff file. A run needs --scaffold, --allow-tools Bash Write Edit, and a session UUID.'
tags: [handoff, reminders, retire]
plugins: ["../../../.."]
expected_outcome: 'The session runs save_point.py new with --previous on the package-publish handoff, writes a slots file whose retire list holds [M1] with a reason such as ''ran h2'', and fills and validates the new handoff.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "I just ran npm publish --access public and 2.0.0 is live. Run /session-flow:handoff file package-publish, continuing .work/handoffs/20261124T100000Z-handoff-package-publish.md."
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: retires-m1-in-slots
    type: tool_used
    tool: Write
    input_match: '^(?=.*"file_path":"[^"]*\.slots\.json")(?=.*\\"retire\\")(?=.*\[M1\])'
    min: 1
    arm: with-only
  - name: no-handoff-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*-handoff-[^"/]*\.md"'
    min: 0
    max: 0
    arm: with-only
