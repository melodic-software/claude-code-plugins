schema_version: "1.1"
name: rs-goal-redraft-offered
description: 'The relative Read directive exercises the fallback clause. The first remaining action is to re-draft a goal that depends on the earlier conversation. The session offers a condition tied to the recorded commit, leaves arming it to the user, and writes NOTES.md. A run needs --scaffold and --allow-tools Bash Write Edit.'
tags: [resume, goal, handoff]
plugins: ["../../../.."]
expected_outcome: 'The reply offers a re-drafted condition that names commit 4be1c9a (or an evidence file) instead of ''output you produced in this conversation'', leaves arming to the user, and the session writes NOTES.md.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Read @.work/handoffs/20261124T100000Z-handoff-parser-tests.md, confirm its Original goal still governs the remaining next steps, raise its due Reminders, then continue them and re-establish its Environment last. For the next save-point invoke /session-flow:handoff via the Skill tool; never write a handoff file free-hand.\nPrior session: 5d0c2a7e-91b4-4f3e-8a26-7c1e9b4d0f53.\nHandoff origin: ssh://git@github.com/example/repo .work/handoffs/20261124T100000Z-handoff-parser-tests.md\nNext:\nRe-draft the carried /goal condition\nWrite NOTES.md"
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: offers-commit-bound-condition
    type: regex
    pattern: '(?:/goal|[Cc]ondition)[^\n]*4be1c9a'
    arm: with-only
  - name: writes-notes
    type: tool_used
    tool: Write
    input_match: 'NOTES\.md'
    min: 1
    arm: with-only
