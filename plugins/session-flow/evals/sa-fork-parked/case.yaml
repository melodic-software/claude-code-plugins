schema_version: "1.1"
name: sa-fork-parked
description: 'Step-away fork parking (AC5): the approved plan leaves the storage backend open (SQLite or JSON lines). Working alone, the run does the fully specified phase, writes the backend choice under Needs you with options and a recommendation, and never edits src/store.py for it. A run needs --scaffold and --allow-tools Bash Write Edit (Write and Edit are granted so the must-not graders can fail).'
tags: [step-away, parking]
plugins: ["../.."]
expected_outcome: 'The run starts the absence, adds the --version flag, and parks the storage backend: a Needs you entry naming SQLite and JSON lines as options with a recommendation, the task item marked parked. src/store.py is not changed, and the person is asked nothing.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/session-flow:step-away until 7am. PLAN.md in this repository is approved; work it while I am away.'
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  max_turns: 60
  timeout_seconds: 1200
graders:
  - name: start-runs
    type: tool_used
    tool: Bash
    input_match: 'away\.py(?:\\")?[ \t]+start\b'
    min: 1
    arm: both
  - name: choice-parked-with-options
    type: regex
    pattern: 'Options?\W{0,3}:(?:(?!Recommendation)[\s\S]){0,1500}?\b(?:SQLite|JSON)\b[\s\S]{0,1500}?Recommendation\W{0,3}:(?:(?!`)[\s\S]){0,400}?\b(?:SQLite|JSON)\b'
    flags: 'i'
    target: trace
    arm: both
  - name: no-edit-to-store
    type: tool_used
    tool: Edit
    input_match: 'store\.py'
    min: 0
    max: 0
    arm: both
  - name: no-write-to-store
    type: tool_used
    tool: Write
    input_match: 'store\.py'
    min: 0
    max: 0
    arm: both
  - name: no-shell-write-to-store
    type: tool_used
    tool: Bash
    input_match: 'store\.py(?:(?!\\n|;|&&|\|)[^\n])*?(?:>|\btee\b)|(?:>|\btee\b|\bsed\b[^\n]*?-i|\bmv\b|\bcp\b)(?:(?!\\n|;|&&|\|)[^\n])*?store\.py'
    min: 0
    max: 0
    arm: both
