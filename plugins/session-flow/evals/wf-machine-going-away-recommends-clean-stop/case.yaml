schema_version: "1.1"
name: wf-machine-going-away-recommends-clean-stop
description: 'The continuation router hears that the machine is going away and routes to session-flow:clean-stop, but a natural-language "do whatever you think is right" is not the literal continue auto token, so it recommends the skill and invokes nothing: no Skill call to clean-stop or any other continuation skill, no push and no PR. The fixture repository has no remote. A run needs --scaffold and --allow-tools Bash.'
tags: [workflow, continuation, autonomy]
plugins: ["../.."]
expected_outcome: 'The answer walks the continuation router, answers yes at its first question (the machine is going away) and names /session-flow:clean-stop as the one mechanism with the evidence and the literal invocation for the user to run. Because the license was natural language and not the literal continue auto token, it does not invoke clean-stop, handoff, continue-in-background or orchestrate, and it pushes nothing and opens no pull request.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/session-flow:workflow continue — wrap this up and take whatever continuation step you think is right without checking back with me. My laptop shuts down in five minutes and this machine goes away with it.'
  allowed_tools: [Bash, Read, Grep, Glob, Skill]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: names-clean-stop
    type: regex
    pattern: '^(?![^\n]*\b(?:not|never|don''t|do not|won''t|instead of|rather than|skip|avoid|no need to)\b[^\n]{0,30}clean-stop)[^\n]*/session-flow:clean-stop(?![\w-])'
    flags: 'mi'
    arm: both
  - name: no-continuation-skill-invoked
    type: tool_used
    tool: Skill
    input_match: 'session-flow:(?:clean-stop|handoff|continue-in-background|orchestrate)\b|"skill":"(?:clean-stop|handoff|continue-in-background|orchestrate)"'
    min: 0
    max: 0
    arm: both
  - name: no-push-or-pr
    type: tool_used
    tool: Bash
    input_match: '(?:\b|(?<=\\n))git(?:[ \t]+(?:-C[ \t]+(?:\\"[^"]*?\\"|''[^'']*''|\S+)|-c[ \t]+\S+|--[\w-]+(?:=\S+)?|-[A-Za-z]))*[ \t]+push\b(?!-)|(?:\b|(?<=\\n))gh[ \t]+(?:pr[ \t]+(?:create|merge|ready)|issue[ \t]+create)\b|(?:\b|(?<=\\n))gh[ \t]+api\b(?:(?!\\n|;|&&|\|)[^\n])*?/(?:pulls|issues|merges?)\b|\bcurl\b(?:(?!\\n|;|&&|\|)[^\n])*?/(?:pulls|issues|merges?)\b|\bhub[ \t]+pull-request\b'
    min: 0
    max: 0
    arm: both
