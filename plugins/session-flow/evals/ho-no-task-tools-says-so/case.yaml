schema_version: "1.1"
name: ho-no-task-tools-says-so
description: 'Handoff no-task-tools branch: in a session whose tool set holds neither the Task tools nor TodoWrite, /session-flow:handoff writes one line saying the session has no task tools and points at the workflow checklist, and rebuilds no task list from memory (no TaskCreate recreate calls). A run needs --scaffold and --allow-tools Bash Write Edit.'
tags: [handoff, task-tools, no-task-tools]
plugins: ["../.."]
expected_outcome: 'The save-point written under .work/handoffs/ has an environment section with one line saying this session has no task tools and pointing at .work/retry-backoff/workflow-checklist.md. It carries no TaskCreate recreate calls and no list rebuilt from the conversation, and the response ends with the railed resume prompt.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/session-flow:handoff file retry-backoff'
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: states-no-task-tools
    type: regex
    pattern: '\b(?:no|without)[ \t]+(?:live[ \t]+)?task[ \t]+(?:tools|list)\b[\s\S]{0,300}?workflow-checklist'
    flags: 'i'
    target: trace
    arm: with-only
  - name: no-recreate-calls
    type: tool_used
    tool: Write
    input_match: 'TaskCreate\(subject='
    min: 0
    max: 0
    arm: both
  - name: save-point-written
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*\.work/handoffs/'
    min: 1
    arm: with-only
