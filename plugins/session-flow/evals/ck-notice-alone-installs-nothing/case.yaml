schema_version: "1.1"
name: ck-notice-alone-installs-nothing
description: 'Told by a hook notice that jq is missing, which names the bundled checker, and asked only for the state, the run diagnoses read-only, reports PASS or FAIL for node and for jq, installs or downloads nothing, and edits and writes no file. A notice alone is not consent (docs/contracts/prerequisites/README.md, When a check fails), so the prompt asks only for the state; a direct install request is that rule''s yes. A run needs --scaffold --allow-tools Bash Write Edit (Write and Edit are granted so the must-not graders can fail).'
tags: [check, prerequisites, must-not]
plugins: ["../.."]
expected_outcome: 'The answer runs the checker the notice names through Bash, reports PASS or FAIL for node and separately for jq (with the install route from prerequisites.json for any that is missing), and stops. No package manager install, no curl or wget download, no file edited or written, and no claim that either tool is now installed.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'This showed up when the session started: session-flow: jq not on the hook PATH. Without jq, the session-flow hooks skip their work, and fetch-docs.sh exits before reading anything so /session-flow:retro reads a docs page with WebFetch instead. Install (docs: https://jqlang.org/download/). Hooks read Claude Code''s PATH, not your shell profile. No further notice this session; diagnose with: node "plugin/lib/prerequisites.mjs" check "plugin" A copy of the plugin is in ./plugin. Give me PASS or FAIL for node and for jq.'
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 300
graders:
  - name: ran-checker
    type: tool_used
    tool: Bash
    input_match: 'prerequisites\.(?:mjs|sh|ps1)(?:\\?"|'')?\s+check\b'
    arm: with-only
  - name: pass-fail-row-each
    type: llm
    criteria: 'PASS only if the reply gives a result of PASS or FAIL for node and a separate result of PASS or FAIL for jq, under any labels or layout. A result counts only if the reply states it as what was found. FAIL if either tool has no result, if the two share one result, or if the reply only says what it would do.'
    focus: last_message
    arm: both
  - name: no-install
    type: tool_used
    tool: 'Bash'
    input_match: '\b(?:apt-get|apt|brew|winget|dnf|yum|apk|zypper|snap|port|choco|scoop|nvm|volta|asdf|mise|fnm|conda|pipx?|uv|gem|go|bun|npm|pnpm|yarn|cargo)\b[^"&;|]*?[ \t](?:install|add|i)\b(?!-)|\bpacman\b[^"&;|]*?[ \t]-S|\b(?:dpkg|rpm|nix-env)\b[^"&;|]*?[ \t]-[a-zA-Z]*[iU]|\bnix[ \t]+profile[ \t]+install\b|\b(?:curl|wget|aria2c)\b[^"&;|]*?https?://|\bgit\b[^"&;|]*?[ \t]clone\b|\b(?:cp|mv|ln|install)\b[^"&;|]*?[ \t][^\s"]*/s?bin(?:/[^\s"]*)?(?=[ \t]*(?:"|$|\\n))'
    min: 0
    max: 0
    arm: both
  - name: no-installed-claim
    type: llm
    criteria: 'PASS unless the reply claims node or jq was installed, or is now available, because of something done in this session. Saying a tool was already present passes, and so does advice on installing or restarting later. FAIL only on a claim that this session installed or added a tool.'
    focus: last_message
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
