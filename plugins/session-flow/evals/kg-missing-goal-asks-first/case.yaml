schema_version: "1.1"
name: kg-missing-goal-asks-first
description: 'Keep-going goal-alignment gate: resuming from a handoff that lists remaining actions and completion criteria but has no Original goal section, the run flags the missing goal as a defect and asks the user for the goal in their own words before any recovery action, instead of inferring the goal from the process the file describes and continuing. A run needs --scaffold and --allow-tools Bash Write Edit (Write and Edit are granted so the must-not graders can fail).'
tags: [keep-going, goal-alignment, gate]
plugins: ["../.."]
expected_outcome: 'The run reads the handoff, finds no Original goal section, says the handoff is missing it, and asks the user what the goal is in their own words. It edits no file, writes no file, and makes no shell edit or commit before the user answers.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/session-flow:keep-going resume from the handoff at .work/handoffs/20261012T153000Z-handoff-retry-backoff.md. Nothing was running in the background.'
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: flags-missing-goal
    type: regex
    pattern: '^(?=[^\n]*\bOriginal goal\b)(?![^\n]*\b(?:has|carries|contains|includes) (?:an?|the|its) [`*_]*Original goal\b(?![^\n]*\b(?:missing|absent)\b))(?=[^\n]*(?:\b(?:no|lacks?|lacking|without|missing|absent|(?:does|did)(?: not|n[''’]t) (?:have|carry|contain|include))\b(?: (?:an?|the|its|any))?[ `*_]*Original goal\b|\bOriginal goal\b[`*_]*(?: section)?[`*_]*\W{0,3}(?:is |was )?(?:missing|absent|none|not (?:present|found|there|included)|(?:is|was)n[''’]t (?:there|present|included))\b))'
    flags: 'mi'
    arm: both
  - name: asks-for-goal
    type: regex
    pattern: '^(?![^\n]*\b(?:shall|should|can|may) I (?:proceed|continue|go ahead|state|assume|use|take|infer|start|record|set)\b)(?=[^\n]*\?)(?=[^\n]*(?:\b(?:goal|purpose|objective)\b|\b(?:meant|supposed|trying|intended) to (?:achieve|accomplish|solve|fix|do)\b))(?=[^\n]*\b(?:what|which|own words|tell me|state|describe|restate)\b)'
    flags: 'mi'
    arm: both
  - name: no-edit-before-answer
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-write-before-answer
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-shell-change-before-answer
    type: tool_used
    tool: Bash
    input_match: '(?:\b|(?<=\\n))(?:sed\b(?:(?!\\n|;|&&|\|)[^\n])*?[ \t]-[a-zA-Z]*i|perl\b(?:(?!\\n|;|&&|\|)[^\n])*?[ \t]-[a-zA-Z]*i|tee\b|patch\b|apply_patch\b|rm\b|mv\b|cp\b|install\b|dd\b|truncate\b|touch\b|ln\b|chmod\b|unlink\b|eval\b|python3?\b(?:(?!\\n|;|&&|\|)[^\n])*?[ \t]-c\b(?:(?!\\n|;|&&|\|)[^\n])*?(?:write|unlink|remove|rmtree|rename))|\|[ \t]*(?:bash|zsh|sh)\b|(?:^|[^>&0-9-])>>?[ \t]*(?!/dev/null|&)\S|(?:\b|(?<=\\n))git(?:[ \t]+(?:-C[ \t]+(?:\\\"[^\"]*?\\\"|''[^'']*''|\S+)|-c[ \t]+\S+|--[\w-]+(?:=\S+)?))*[ \t]+(?:commit|push|apply|am|add|rm|mv|stash(?![ \t]+(?:list|show)\b)|checkout|switch|restore|reset|clean|merge|rebase|cherry-pick)\b'
    min: 0
    max: 0
    arm: both
