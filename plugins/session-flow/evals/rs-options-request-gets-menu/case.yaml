schema_version: "1.1"
name: rs-options-request-gets-menu
description: 'Guard for the question-mode boundary of /session-flow:recommend-skills. A free-text argument that asks for the options themselves ("what are my options") states no task, so it gets the five-bucket menu, not a one-skill answer with an example prompt. A run needs --scaffold and --allow-tools Bash Write.'
tags: [recommend-skills, question-mode, menu]
plugins: ["../.."]
expected_outcome: 'The answer renders the Now, Next, Skipped upstream, Later and Spotlight buckets and gives no one-skill answer with a labeled Pass/fail check line.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/session-flow:recommend-skills what are my options'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: five-buckets
    type: regex
    pattern: '(?=[\s\S]*^\W*Now\b)(?=[\s\S]*^\W*Next\b)(?=[\s\S]*^\W*Skipped upstream\b)(?=[\s\S]*^\W*Later\b)(?=[\s\S]*^\W*Spotlight\b)'
    flags: 'm'
    arm: with-only
  - name: no-example-prompt
    type: regex
    pattern: '^\W*Pass/fail check\b'
    flags: 'mi'
    match: 'not_contains'
    arm: with-only
