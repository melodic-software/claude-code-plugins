schema_version: "1.1"
name: wf-phase-boundary-hands-off
description: 'The continuation router hears that a plan phase has merged and the next phase in the same plan starts now: a phase boundary, next in sequence, so it routes to session-flow:handoff and then /clear rather than /compact. The window is moderate, which does not change a boundary route. A natural-language license is not the literal continue auto token, so it recommends and invokes nothing. A run needs --scaffold and --allow-tools Bash.'
tags: [workflow, continuation]
plugins: ["../.."]
expected_outcome: 'The answer walks the continuation router and recommends /session-flow:handoff followed by /clear for the user to run, because Phase 2 is merged and Phase 3 is the next phase in sequence. It does not recommend /compact or continuing in session, and it invokes no continuation skill.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/session-flow:workflow continue: Phase 2 of PLAN.md just merged. Phase 3 is next in the plan, same goal. context-usage reports zone moderate. Pick the continuation step you think is right.'
  allowed_tools: [Bash, Read, Grep, Glob, Skill]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: names-handoff
    type: regex
    pattern: '^(?![^\n]*\b(?:not|never|no|skip|don''t|do not|instead of|rather than|no need to)\b[^\n]{0,30}/session-flow:handoff)[^\n]*(?<![\w/-])/session-flow:handoff(?![\w-])'
    flags: 'mi'
    arm: both
  - name: one-recommendation
    type: llm
    criteria: 'PASS only if the reply recommends writing a handoff (session-flow:handoff) and then /clear as the one continuation step at this phase boundary. FAIL if it recommends /compact, a plain /clear with no handoff, or continuing in session as the step, or gives no single recommendation.'
    focus: last_message
    arm: both
  - name: no-continuation-skill-invoked
    type: tool_used
    tool: Skill
    input_match: 'session-flow:(?:clean-stop|handoff|continue-in-background|orchestrate)\b|"skill":"(?:clean-stop|handoff|continue-in-background|orchestrate)"'
    min: 0
    max: 0
    arm: both
