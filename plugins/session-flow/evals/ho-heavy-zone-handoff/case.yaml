schema_version: "1.1"
name: ho-heavy-zone-handoff
description: The user asks for a handoff with one small follow-up. The status tool reports a heavy zone. Run with --scaffold, --allow-tools Bash Write Edit, and a session UUID.
tags: [handoff, urgent, context-usage]
plugins: ["../.."]
expected_outcome: The file is written and validated, and its resume prompt is shown without a position panel or checklist.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/session-flow:handoff color-index The only remaining action is to check the blue entry in the index.'
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill, ToolSearch, mcp__context-usage__status]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: reads-zone-once
    type: tool_used
    tool: mcp__context-usage__status
    min: 1
    max: 1
  - name: handoff-file
    type: file_exists
    path: '.work/handoffs/*-handoff-color-index.md'
  - name: fills-once
    type: tool_used
    tool: Bash
    input_match: 'save_point\.py(?:\\"|''|")?[ \t]+fill\b'
    min: 1
    max: 1
  - name: validated-handoff
    type: regex
    target: trace
    pattern: '^(?=[^\n]*"type"\s*:\s*"tool_result")[^\n]*?validate: (?:PASS|WARN)(?: \(\d+\))? [^"\\\r\n]*-handoff-color-index\.md\b'
    flags: m
  - name: resume-rails
    type: regex
    pattern: '/clear`?, then copy everything between the dashed lines:\s*─+\r?\nRead @[^\n]+-handoff-color-index\.md\b[\s\S]*?\n─+'
  - name: no-panel-or-checklist
    type: regex
    pattern: 'you are here|done this session:|where we are:|checklist:|^[ \t]*[-*]?[ \t]*\[[ x~!]\]'
    flags: im
    match: not_contains
