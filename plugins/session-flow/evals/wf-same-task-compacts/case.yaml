schema_version: "1.1"
name: wf-same-task-compacts
description: 'The continuation router hears that the context window is heavy in the middle of one task, with the next step in the same file and plan step, and routes to /compact with a focus: the same task keeps its context, so neither a handoff nor a clear. A natural-language license is not the literal continue auto token, so it invokes nothing. A run needs --scaffold and --allow-tools Bash.'
tags: [workflow, continuation]
plugins: ["../.."]
expected_outcome: 'The answer walks the continuation router and recommends `/compact <focus>` for the user to type, the focus naming the currency filter and the next step (the average helper in src/report.py). It does not recommend session-flow:handoff or /clear, and it invokes no continuation skill.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/session-flow:workflow continue: context-usage reports zone heavy. I''m halfway through step 2 of PLAN.md, adding the currency filter to src/report.py; the next step is the average() helper in the same file, same step. Pick the continuation step you think is right.'
  allowed_tools: [Bash, Read, Grep, Glob, Skill]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: names-compact
    type: regex
    pattern: '^(?![^\n]*\b(?:not|never|no|skip|don''t|do not|instead of|rather than|no need to)\b(?:\s+(?:run|use|do|try|need|needed))?[\s`]*/compact)[^\n]*(?<![\w/-])/compact(?![\w-])'
    flags: 'mi'
    arm: both
  - name: one-recommendation
    type: llm
    criteria: 'PASS only if the reply recommends /compact (with or without a focus) as the one continuation step for this session. FAIL if it recommends session-flow:handoff, /clear, or continuing without compacting as the step, or gives no single recommendation.'
    focus: last_message
    arm: both
  - name: no-continuation-skill-invoked
    type: tool_used
    tool: Skill
    input_match: 'session-flow:(?:clean-stop|handoff|continue-in-background|orchestrate)\b|"skill":"(?:clean-stop|handoff|continue-in-background|orchestrate)"'
    min: 0
    max: 0
    arm: both
