schema_version: "1.1"
name: recall-states-scope-searched
description: Recall on a topic opens its report with the transcript scope it searched, the directory and transcript counts and the terms, after resolving transcript_scope and scanning through recall_scan.py
tags: [recall, transcript-scope]
expected_outcome: The answer resolves transcript_scope and names the layer that supplied it, lists directories with transcript_dirs.sh, scans them with recall_scan.py, and opens the report with the scope actually searched (the scope level reached, how many directories and transcripts were read, and the search terms), never describing a narrower or capped scan as a search of everything. It writes no file.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/session-flow:recall invoice export timeout. Search only the default scope; if nothing turns up there or in this repository's other worktrees, just tell me rather than looking further."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: scope-resolved
    type: regex
    pattern: 'transcript_scope'
    arm: with-only
  - name: scope-stated
    type: llm
    arm: both
    criteria: "PASS only if the reply states which transcript scope it searched (this worktree, the repository's worktrees, or every project), how many directories or transcripts that covered (zero counts as a number), and the search terms it used, before or alongside any findings. FAIL if the reply gives findings or says nothing was found without saying where it looked."
  - name: dirs-listed
    type: tool_used
    tool: Bash
    input_match: 'transcript_dirs\.sh'
    arm: with-only
  - name: scan-ran
    type: tool_used
    tool: Bash
    input_match: 'recall_scan\.py'
    arm: with-only
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:session-flow:)?recall"'
    arm: with-only
