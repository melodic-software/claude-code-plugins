schema_version: "1.1"
name: recall-reports-tried-kept-reverted
description: Recall on a topic with a reverted attempt in git history reports what was tried, what stayed and what was reverted, citing commits, and names any source it could not use
tags: [recall, git-history]
expected_outcome: The git history holds a token-bucket rate limiter that was reverted because it dropped requests during bursts, then a sliding-window rate limiter that is still in place. The answer searches git for the topic and its reverts, tries closed unmerged pull requests through gh, and reports Tried (both attempts), Kept (sliding window), and Dropped or reverted (token bucket, with the burst reason), each cited by commit SHA. It names any source it could not use, such as gh or the tracker.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/session-flow:recall rate limiter. Have we tried replacing the in-memory one before, and how did it go?"
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: git-searched
    type: tool_used
    tool: Bash
    input_match: '(?:\b|(?<=\\n))git(?:[ \t]+(?:-C[ \t]+(?:\\"[^"]*?\\"|''[^'']*''|\S+)|-c[ \t]+\S+|--[\w-]+(?:=\S+)?|-[A-Za-z]))*[ \t]+log\b'
    arm: with-only
  - name: names-both-attempts
    type: regex
    pattern: '(?=[\s\S]*token[- ]bucket)(?=[\s\S]*sliding[- ]window)'
    flags: i
    arm: both
  - name: cites-commit-and-burst
    type: regex
    pattern: '^(?=[\s\S]*\b(?=[0-9a-f]*[0-9])[0-9a-f]{7,40}\b)(?=[\s\S]*\bburst)'
    flags: 'i'
    arm: both
  - name: token-bucket-reverted-sliding-window-kept
    type: llm
    focus: last_message
    criteria: "Judge only what the reply says happened to the two rate limiters, the token bucket and the sliding window. PASS only if the reply says the token bucket was reverted (or dropped, removed or backed out) because of traffic bursts, such as dropping requests during bursts, and says the sliding window is the one kept: current, still in place, in use, or the one that replaced the token bucket or the in-memory limiter and stayed. A sentence that names the token bucket and then says the sliding window is current counts for the sliding window. FAIL if anything in the reply, a closing summary included, says the token bucket is current, kept, still in place, remains or is in use, or that it was re-applied, re-adopted or restored after its revert. Also FAIL if the reply says the sliding window was reverted or dropped, gives no reason for the token bucket's revert, gives the bursts as a problem of anything other than the token bucket, names both without saying which was reverted and which was kept, or does not say what happened to the rate limiters. Do not judge commit hashes, dates, file paths, or what the reply says about other sources such as pull requests or the tracker."
    arm: both
  - name: unavailable-prs-named
    type: llm
    focus: last_message
    criteria: "Judge only what the reply says about closed pull requests, which are searched through gh or the /source-control:pull-request skill. PASS only if the reply says pull requests could not be searched or were not searched, and it reports no pull request and no pull-request search that ran. Saying gh or that skill is unavailable, unauthenticated or not installed counts as saying pull requests could not be searched. So does a pull-request read that was attempted and failed, errored or exited non-zero (for example with no GitHub remote); a search that ran means one that returned results or a count, zero included. FAIL if the reply lists or counts any pull request, or says a pull-request search ran or returned results. Also FAIL if what it says is unavailable or unsearched is only another source (such as the tracker or work items), code not yet in a branch, or a narrower check on pull requests while pull requests are still reported."
    arm: with-only
  - name: unavailable-tracker-named
    type: llm
    focus: last_message
    criteria: "Judge only what the reply says about the work-item tracker (tracker items, work items, the /work-items:track skill). PASS only if the reply says the tracker could not be searched or was not searched, and it reports no tracker item and no tracker search that ran. Saying the tracker or /work-items:track is unavailable, not installed, not configured or not set up counts as saying the tracker could not be searched. So does a tracker read that was attempted and failed, errored or exited non-zero; a search that ran means one that returned results or a count, zero included. FAIL if the reply lists or counts any tracker item, or says a tracker search ran or returned results. Also FAIL if what it says is unavailable or unsearched is only another source (such as pull requests or gh), or a narrower detail about tracker items while tracker items are still reported."
    arm: with-only
