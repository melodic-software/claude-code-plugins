schema_version: "1.1"
name: recall-reports-tried-kept-reverted
description: Recall on a topic with a reverted attempt in git history reports what was tried, what stayed and what was reverted, citing commits, and names any source it could not use
tags: [recall, git-history]
expected_outcome: The git history holds a token-bucket rate limiter that was reverted because it dropped requests during bursts, then a sliding-window rate limiter that is still in place. The answer searches git for the topic and its reverts, tries closed unmerged pull requests through gh, and reports Tried (both attempts), Kept (sliding window), and Dropped or reverted (token bucket, with the burst reason), each cited by commit SHA. It names any source it could not use, such as gh or the tracker.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/session-flow:recall rate limiter. Have we tried replacing the in-memory one before, and how did it go?"
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: git-searched
    type: tool_used
    tool: Bash
    input_match: '(?:\b|(?<=\\n))git(?:[ \t]+(?:-C[ \t]+(?:\\"[^"]*?\\"|''[^'']*''|\S+)|-c[ \t]+\S+|--[\w-]+(?:=\S+)?|-[A-Za-z]))*[ \t]+log\b'
    arm: with-only
  - name: names-both-attempts
    type: regex
    pattern: '(?=[\s\S]*token[- ]bucket)(?=[\s\S]*sliding[- ]window)'
    flags: i
    arm: both
  - name: tried-kept-reverted
    type: regex
    pattern: '^(?=[\s\S]*(?:token[- ]bucket[^\n]*\brevert|\brevert[^\n]*token[- ]bucket|(?:^|\n)[ \t#*_>-]*(?:dropped or reverted|reverted|dropped)\b[ \t*_:]*\n(?:[ \t]*\n)?[^\n]*token[- ]bucket))(?=[\s\S]*\bburst)(?=[\s\S]*(?:sliding[- ]window[^\n]*\b(?:kept|current|still|in place|stayed|stays|remains|in use)\b|\b(?:kept|current|still in place|in place|remains)\b[^\n]*sliding[- ]window|(?:^|\n)[ \t#*_>-]*kept\b[ \t*_:]*\n(?:[ \t]*\n)?[^\n]*sliding[- ]window))(?=[\s\S]*\b(?=[0-9a-f]*[0-9])[0-9a-f]{7,40}\b)(?![\s\S]*token[- ]bucket[^\n]*\bis\s+(?:still\s+)?(?:current|in place|live|kept|in use)\b)'
    flags: 'i'
    arm: both
  - name: unavailable-source-named
    type: regex
    pattern: '^[^\n]*(?:\b(?:gh|pull requests?|PRs?|tracker|work items?)\b[^\n]*\b(?:could ?n[o'']t|cannot|unavailable|not (?:available|authenticated|configured|installed|searched|checked|run)|unauthenticated|no (?:git ?hub |origin )?remote|skipped|failed|errored|returned nothing|came back (?:with nothing|empty)|no results?|none found|found none|zero)|\b(?:could ?n[o'']t (?:search|reach|query|use)|cannot (?:search|reach|query|use)|unavailable|not searched|skipped)\b[^\n]*\b(?:gh|pull requests?|PRs?|tracker|work items?)\b)'
    flags: 'mi'
    arm: with-only
