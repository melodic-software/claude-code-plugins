schema_version: "1.1"
name: wf-disabled-plugin-takes-fallback
description: 'Default config, corrections plugin installed but switched off in this session: wrap-up after a repeated mistake takes the gate''s fallback, /session-flow:retro, and never sends the work to /corrections:codify.'
tags: [workflow, wrap-up, retro, seam-gate, plugin-disabled]
plugins: ["../.."]
expected_outcome: 'The wrap-up offers /session-flow:retro for the repeated mistake and does not route it to /corrections:codify, because the corrections plugin is installed but not enabled here, so its skills are not among the available skills.'
execution:
  prompt: '/session-flow:workflow wrap-up The fix is merged, but along the way I ran the tests against the wrong fixture path three times before noticing. The corrections plugin is installed on this machine, but my plugin profile switched it off for this session. Anything to do before I close this session?'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 600
graders:
  - name: offers-retro
    type: regex
    pattern: '^(?![^\n]*\b(?:not|never|no|skip|without|don''t|do not|no need to)\b[^\n]{0,20}session-flow:retro)[^\n]*/session-flow:retro(?![\w-])'
    flags: 'mi'
    arm: both
  - name: no-codify-route
    type: regex
    pattern: '^(?![\s\S]*\b(?:run|invoke|use|try|hand (?:it|this) to)\s+`?/corrections:codify)[\s\S]+'
    flags: 'i'
    arm: both
