schema_version: "1.1"
name: ho-task-tools-recreate-calls
description: 'Regression guard for the handoff TaskList branch: in a session whose tool set includes the Task tools, /session-flow:handoff reads the live list with a TaskList call and writes literal TaskCreate recreate calls into the save-point''s environment section. A run needs --scaffold and --allow-tools Bash Write Edit TaskCreate TaskList TaskUpdate TaskGet.'
tags: [handoff, task-tools, regression-guard]
plugins: ["../.."]
expected_outcome: 'The session puts two items on its task list, then the handoff calls TaskList and writes a save-point whose Environment to re-establish section carries a "Recreate before resuming" block of TaskCreate(subject=...) lines for those items, not a list rebuilt from memory, and ends with the railed resume prompt.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'First put two items on your task list with TaskCreate: "Cap retry delay at 30 seconds" and "Run ./test.sh". Then run /session-flow:handoff file retry-backoff'
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill, TaskCreate, TaskList, TaskUpdate, TaskGet]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: recreate-calls-written
    type: regex
    pattern: 'TaskCreate\(subject=\\?"[^"\n]*(?:30|test)'
    flags: 'i'
    target: trace
    arm: both
  - name: task-list-read-live
    type: tool_used
    tool: TaskList
    min: 1
    arm: with-only
