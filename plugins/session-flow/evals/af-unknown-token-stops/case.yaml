schema_version: "1.1"
name: af-unknown-token-stops
description: 'Argument gate: /session-flow:audit-friction reads $ARGUMENTS whole and stops on any token outside its accepted set. Given --apply-fixes, which it does not accept, it names that token and the accepted set and runs neither the collector nor friction.py. A run needs --allow-tools Bash.'
tags: [audit-friction, arguments, stop, must-not]
plugins: ["../.."]
expected_outcome: 'The answer says --apply-fixes is not an accepted argument, names the accepted set (remeasure, --days, --project, --source, --verify, and the full-form flags), and stops. It runs no collect.py and no friction.py command.'
execution:
  prompt: '/session-flow:audit-friction --days 7 --apply-fixes'
  allowed_tools: [Bash, Read, Glob, Grep, Skill]
  max_turns: 8
  timeout_seconds: 240
graders:
  - name: no-pipeline-run
    type: tool_used
    tool: 'Bash'
    input_match: '\b(?:friction|collect)\.py\b'
    min: 0
    max: 0
    arm: both
  - name: rejects-bad-token
    type: regex
    pattern: '--apply-fixes`?\W{0,4}(?:\s+(?:is|was)(?:\s+not|n''t)\s+(?:an?\s+|one of the\s+|in the\s+|part of the\s+|among the\s+)?(?:accepted|recogni[sz]ed|supported|valid)|\s+(?:is|was|falls)\s+outside\s+the\s+accepted|\s*[(:,-]?\s*(?:unknown|unrecogni[sz]ed|unsupported|invalid|not accepted|not in the accepted)\b(?!\s+(?!(?:argument|token|flag|option|set|to|for|here)s?\b)[a-z]))|\b(?:unknown|unrecogni[sz]ed|unsupported|invalid|unexpected)\s+(?:argument|token|flag|option)s?\W{0,6}--apply-fixes'
    flags: 'i'
    arm: both
  - name: names-accepted-set
    type: regex
    pattern: '(?=[\s\S]*\bremeasure\b)(?=[\s\S]*--days\b)(?=[\s\S]*--project\b)(?=[\s\S]*--source\b)(?=[\s\S]*--verify\b)'
    arm: with-only
