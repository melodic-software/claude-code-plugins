schema_version: "1.1"
name: ho-disabled-profile-plugin-no-entry
description: 'Handoff plugin-profile gate, installed-but-disabled case: the scaffold writes a user-scope install record in the run''s home for a stub plugin-profiles plugin with a profile skill, and its project settings switch that plugin off, so /plugin-profiles:profile is not among the available skills. /session-flow:handoff takes the fallback the structure reference sets: it makes no plugin-profiles Skill call and writes nothing about plugin profiles into the save-point, while still writing the save-point. Written from MB:plugins/session-flow/reference/structure.md "Plugin profile" and MB:docs/contracts/seam-phrasing/README.md "The shape". A run needs --scaffold and --allow-tools Bash Write Edit.'
tags: [handoff, seam-phrasing, availability-gate, plugin-profiles]
runs: 4
plugins: ["../.."]
expected_outcome: 'The save-point written under .work/handoffs/ carries no plugin profile entry and no mention of plugin-profiles, the session makes no Skill call naming plugin-profiles, and the response ends with the railed resume prompt.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/session-flow:handoff file retry-backoff'
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: no-profile-skill-call
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"plugin-profiles:'
    min: 0
    max: 0
    arm: both
  - name: no-profile-entry
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*\.work/handoffs/[^"]*"[\s\S]*(?:[Pp]lugin[- ][Pp]rofiles?\b|[Pp]rofile status)'
    min: 0
    max: 0
    arm: both
  - name: save-point-written
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*\.work/handoffs/'
    min: 1
    arm: with-only
