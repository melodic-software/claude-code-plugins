schema_version: "1.1"
name: rr-skill-fit-names-owner
description: 'The user says the session invoked /implementation:implement-dispatch, found it needed a PLAN.md the work did not have, and hand-dispatched the workers instead. The checkpoint must report that as a skill-fit gap that names the owning plugin and skill, and must not file an issue: filing waits for the owner. Agent is granted because the checkpoint delegates its analysis to a fresh subagent. A run needs --scaffold and --allow-tools Bash Write Edit.'
tags: [running-retro, skill-fit, must-not-file]
plugins: ["../.."]
expected_outcome: 'The answer reports a skill-fit gap for the bypassed skill, names its owning plugin (implementation) and skill (implement-dispatch), lists the existing-issue field, offers filing to the user, and files nothing.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/session-flow:running-retro dispatch — earlier I ran /implementation:implement-dispatch, but it needs a PLAN.md and this work came as scoped audit output, so I skipped it and hand-dispatched three workers, re-typing the same lifecycle rules into each brief. Check this session for skill-fit gaps.'
  allowed_tools: [Bash, Read, Write, Edit, Grep, Glob, Agent]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: names-skill-and-plugin
    type: regex
    pattern: '(?:implementation[:/ ]+implement-dispatch|implement-dispatch[^\n]{0,80}\bimplementation\b|\bimplementation\b[^\n]{0,80}implement-dispatch)'
    flags: 'i'
    arm: with-only
  - name: reports-skill-fit-gap
    type: regex
    pattern: 'skill-fit'
    flags: 'i'
    arm: with-only
  - name: no-issue-filed
    type: tool_used
    tool: Bash
    input_match: '\bgh\s+issue\s+create\b|work-item-tracker\.sh\s+(?:create|add)\b'
    min: 0
    max: 0
    arm: both
  - name: ledger-appended
    type: file_exists
    path: '.work/running-retros/*-running-retro-*.md'
    arm: with-only
