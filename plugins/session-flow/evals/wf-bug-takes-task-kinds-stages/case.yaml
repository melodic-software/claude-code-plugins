schema_version: "1.1"
name: wf-bug-takes-task-kinds-stages
description: 'Default mode of /session-flow:workflow on "fix bug X": the stage list comes from the Bug row of the Task kinds table in context/steps.md (Explore, Implement, Test, Review, Verify outcome, Ship), and the answer names the stages that row skips.'
tags: [workflow, task-kinds, bug]
plugins: ["../.."]
expected_outcome: 'The answer gives the Bug row''s stages in order, Explore then Implement, Test, Review, Verify outcome and Ship, with no interview, design or plan stage between Explore and Implement, and says which stages the bug skips.'
execution:
  prompt: '/session-flow:workflow Fix bug X: exporting a report to CSV drops the last row, and I do not know why yet. Which stages does this take, in order, and which does it skip?'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 600
graders:
  - name: bug-stage-list
    type: regex
    pattern: '\bExplore\b(?:(?!\b(?:Interview|Research|PRD|Design|Plan|Decompose)\b)[\s\S]){0,400}?\bImplement\b[\s\S]{0,400}?\bTest\b[\s\S]{0,400}?\bReview\b[\s\S]{0,400}?\bVerif\w*[\s\S]{0,400}?\b(?:Ship|PR|pull request)\b'
    flags: 'm'
    arm: with-only
  - name: names-skipped-stages
    type: regex
    pattern: '^(?![^\n]*\b(?:not|never|no|don''t|do not)\b[^\n]{0,15}\bskip)(?:[^\n]*\b[Ss]kip(?:s|ped|ping)?\b[^\n]*\b(?:Interview|Design|Plan)\b|[^\n]*\b(?:Interview|Design|Plan)\b[^\n]*\b(?:skipped|SKIPPED)\b)'
    flags: 'm'
    arm: with-only
