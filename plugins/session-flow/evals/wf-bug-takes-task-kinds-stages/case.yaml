schema_version: "1.1"
name: wf-bug-takes-task-kinds-stages
description: 'Default mode of /session-flow:workflow on "fix bug X": the stage list comes from the Bug row of the Task kinds table in context/steps.md (the full path less the PRD), and the answer names the PRD as the stage that row skips.'
tags: [workflow, task-kinds, bug]
plugins: ["../.."]
expected_outcome: 'The answer gives the Bug row''s stages in order, from Interview to Implement with no PRD between them, then Test, Review, Verify outcome and Ship, and says the bug skips the PRD.'
execution:
  prompt: '/session-flow:workflow Fix bug X: exporting a report to CSV drops the last row, and I do not know why yet. Which stages does this take, in order, and which does it skip?'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 600
graders:
  - name: bug-stage-list
    type: regex
    pattern: '\bInterview\b(?:(?!\bPRD\b)[\s\S]){0,600}?\bImplement\b[\s\S]{0,400}?\bTest\b[\s\S]{0,400}?\bReview\b[\s\S]{0,400}?\bVerif\w*[\s\S]{0,400}?\b(?:Ship|PR|pull request)\b'
    flags: 'm'
    arm: with-only
  - name: names-skipped-stages
    type: regex
    pattern: '^(?![^\n]*\b(?:not|never|no|don''t|do not)\b[^\n]{0,15}\bskip)(?:[^\n]*\b[Ss]kip(?:s|ped|ping)?\b[^\n]*\bPRD\b|[^\n]*\bPRD\b[^\n]*\b(?:skipped|SKIPPED)\b)'
    flags: 'm'
    arm: with-only
