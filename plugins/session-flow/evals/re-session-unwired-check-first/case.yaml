schema_version: "1.1"
name: re-session-unwired-check-first
description: 'Session-mode unwired check: this session shipped a bare fetch() in src/billing/invoice.ts and CI stayed green. scripts/check-bare-fetch.sh would have caught it, but neither the CI workflow, package.json nor a pre-commit hook runs it. /session-flow:retro session reports the unwired check as the finding before proposing any new check, and asks before acting: no Write, no Edit. A run needs --scaffold and --allow-tools Bash Write Edit.'
tags: [retro, session, unwired-check, approval-gate, must-not]
plugins: ["../.."]
expected_outcome: 'The report names scripts/check-bare-fetch.sh as an existing check that should have caught the bare fetch() but that no CI or pre-commit step runs, and reports it as the finding before proposing any new check, proposing to wire it in rather than to write a new lint rule. Phase 4 lists the recommendations and asks which to execute; the run writes and edits no file.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/session-flow:retro session. This session I added src/billing/invoice.ts with a bare fetch() call, CI went green, and only my own review caught that billing calls must go through withRetry(). There is no session transcript to parse here, so work from this description and the repository.'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: names-unwired-check-first
    type: regex
    pattern: '^(?:(?!\b(?:add|write|create|introduce|propos)\w*\s+(?:a\s+)?(?:new\s+)?\S*(?:lint|check|rule|hook|test)\b(?!-bare-fetch))[\s\S])*?(?:check-bare-fetch\.sh[^\n]*\b(?:unwired|not wired|neither\b[^\n]*\bnor|never (?:runs?|run by|called|invoked|executed|referenced)|(?:is ?n[o'']t|does ?n[o'']t|not) (?:runs?|wired|called|invoked|executed|referenced)|no (?:CI|pre-commit))|\b(?:unwired|not wired|neither\b[^\n]*\bnor|never (?:runs?|called|invoked|executed|referenced)|(?:is ?n[o'']t|does ?n[o'']t|not) (?:runs?|wired|called|invoked|executed|referenced)|no (?:CI|pre-commit))\b[^\n]*check-bare-fetch\.sh)'
    flags: 'i'
    arm: with-only
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: no-bash-writes
    type: tool_used
    tool: 'Bash'
    input_match: '(?:^|[^>&0-9=-])>>?[ \t]*(?!/dev/null\b|&|\d)[^\s|&;]|\btee\b|\bsed\b[^|;&]*[ \t]-[a-zA-Z]*i|\bperl\b[^|;&]*[ \t]-[a-zA-Z]*i|\bpython3?\b[^|;&]*[ \t]-c\b[^|;&]*(?:write|unlink|remove|rmtree|rename)|\|[ \t]*(?:bash|zsh|sh)\b|(?:"command":"|[;&|(]|\\n|\bxargs\b)[ \t]*(?:(?:command|exec|sudo(?:[ \t]+-\S+)*|env|nohup)[ \t]+)*(?:touch|mkdir|rm|mv|cp|truncate|install|dd|ln|chmod|unlink|patch)[ \t]|(?:\b|(?<=\\n))git(?:[ \t]+(?:-C[ \t]+(?:\\"[^"]*?\\"|''[^'']*''|\S+)|-c[ \t]+\S+|--[\w-]+(?:=\S+)?|-[A-Za-z]))*[ \t]+(?:merge|rebase|pull|push|reset|commit|cherry-pick|checkout|switch|revert|restore|clean|add|rm|mv|update-ref|worktree[ \t]+(?:add|remove|move|prune)|stash(?![ \t]+(?:list|show)\b))\b(?!-)'
    min: 0
    max: 0
    arm: both
