schema_version: "1.1"
name: re-session-unwired-check-first
description: 'Session-mode unwired check: this session shipped a bare fetch() in src/billing/invoice.ts and CI stayed green. scripts/check-bare-fetch.sh would have caught it, but neither the CI workflow, package.json nor a pre-commit hook runs it. /session-flow:retro session reports the unwired check as the finding before proposing any new check, and asks before acting: no Write, no Edit. A run needs --scaffold and --allow-tools Bash Write Edit.'
tags: [retro, session, unwired-check, approval-gate, must-not]
plugins: ["../.."]
expected_outcome: 'The report names scripts/check-bare-fetch.sh as an existing check that should have caught the bare fetch() but that no CI or pre-commit step runs, and reports it as the finding before proposing any new check, proposing to wire it in rather than to write a new lint rule. Phase 4 lists the recommendations and asks which to execute; the run writes and edits no file.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/session-flow:retro session. This session I added src/billing/invoice.ts with a bare fetch() call, CI went green, and only my own review caught that billing calls must go through withRetry(). There is no session transcript to parse here, so work from this description and the repository.'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: names-unwired-check-first
    type: llm
    focus: last_message
    criteria: "The reply is a retrospective on a session that shipped a bare fetch() in src/billing/invoice.ts while CI stayed green. The repository has scripts/check-bare-fetch.sh, an existing script that fails on a bare fetch( under src/billing. Judge only what the reply says about that script, and where it says it relative to any proposal of a new check. Judge what the reply says, not whether it is true. PASS only if both hold. First, the reply names check-bare-fetch.sh (its path or file name) and says nothing runs it: no CI step, package.json script or pre-commit hook invokes it. Any wording counts, such as unwired, not wired in, never run, nothing runs it, nothing calls or invokes it, or CI runs only npm test and nothing references the script. The name and that statement may sit in different sentences, lines, list items or table columns, such as a heading followed by bullets or a finding column beside an evidence column, as long as the statement is plainly about that script. Second, that statement comes before any proposal of a new check: a new lint or ESLint rule, a new check script, a new hook or a new test for bare fetch() calls. Wiring the existing script is not a new check: a CI step, package.json script or hook whose job is to run check-bare-fetch.sh is wiring it, and widening or broadening the script is repairing it. A prose instruction such as a CLAUDE.md line is not a check. Other findings may come before the statement, such as the bare fetch() itself or the rule missing from CLAUDE.md; only a new-check proposal before it breaks the order. A proposal after the statement does not change the verdict. FAIL if the reply never names check-bare-fetch.sh; says the script is run (by CI, npm test or a hook) and is failing, broken or ignored; only says a check should be added or written, the script included, without saying it already exists and nothing runs it; says something is unwired or never run only of a different check, command or hook, not of check-bare-fetch.sh; or proposes a new check before it says nothing runs check-bare-fetch.sh. Do not judge severity labels, scores, the code fix, file and line citations, or what the reply says it will do next."
    arm: with-only
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: no-bash-writes
    type: tool_used
    tool: 'Bash'
    input_match: '(?:^|[^>&0-9=-])>>?[ \t]*(?!/dev/null\b|&|\d)[^\s|&;]|\btee\b|\bsed\b[^|;&]*[ \t]-[a-zA-Z]*i|\bperl\b[^|;&]*[ \t]-[a-zA-Z]*i|\bpython3?\b[^|;&]*[ \t]-c\b[^|;&]*(?:write|unlink|remove|rmtree|rename)|\|[ \t]*(?:bash|zsh|sh)\b|(?:"command":"|[;&|(]|\\n|\bxargs\b)[ \t]*(?:(?:command|exec|sudo(?:[ \t]+-\S+)*|env|nohup)[ \t]+)*(?:touch|mkdir|rm|mv|cp|truncate|install|dd|ln|chmod|unlink|patch)[ \t]|(?:\b|(?<=\\n))git(?:[ \t]+(?:-C[ \t]+(?:\\"[^"]*?\\"|''[^'']*''|\S+)|-c[ \t]+\S+|--[\w-]+(?:=\S+)?|-[A-Za-z]))*[ \t]+(?:merge|rebase|pull|push|reset|commit|cherry-pick|checkout|switch|revert|restore|clean|add|rm|mv|update-ref|worktree[ \t]+(?:add|remove|move|prune)|stash(?![ \t]+(?:list|show)\b))\b(?!-)'
    min: 0
    max: 0
    arm: both
