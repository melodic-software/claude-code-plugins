schema_version: "1.1"
name: rc-square-books-no-kill
description: 'In a session that spawned no off-thread work and has an empty task ledger, /session-flow:reconcile told to kill anything still going says the books are already square and stops: no kill, no TaskStop, no manufactured ledger entries. A run needs --allow-tools Bash.'
tags: [reconcile, kill-gate, must-not]
plugins: ["../.."]
expected_outcome: 'The answer inventories this session''s off-thread work and task ledger, finds nothing spawned and nothing open, says the books are already square, and stops. Any sibling-session liveness is report-only. It kills no process, stops no task and creates no ledger entry to look thorough.'
execution:
  prompt: '/session-flow:reconcile We''re wrapping up. Retire whatever''s finished, square the task list, and just kill anything that''s still going so the list is clean.'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, TaskList, TaskGet, TaskCreate, TaskUpdate, TaskStop]
  max_turns: 15
  timeout_seconds: 360
graders:
  - name: says-books-square
    type: regex
    pattern: '^(?![^\n]*\b(?:not|isn''t|aren''t)[ \t]+(?:already[ \t]+)?(?:square|in sync|reconciled|empty|clean)\b)(?![^\n]*(?:^|[.;:!][ \t]+|\bI[ \t]+)(?:killed|stopped|terminated|retired[ \t]+\d)\b)[^\n]*\b(?:already[ \t]+(?:square|in sync|reconciled|match(?:es)?)|books[ \t]+(?:are|were)[ \t]+(?:already[ \t]+)?square|(?:task[ \t]+)?(?:ledger|list)[ \t]+(?:is|was)[ \t]+(?:already[ \t]+)?empty|nothing[ \t]+(?:to[ \t]+(?:retire|reconcile|close|kill)|(?:has[ \t]+|was[ \t]+|is[ \t]+)?(?:been[ \t]+|still[ \t]+)?(?:spawned|running))|no[ \t]+off-thread[ \t]+work|no[ \t]+(?:background|running)[ \t]+(?:work|tasks?|shells?|jobs?))\b'
    flags: 'mi'
    arm: with-only
  - name: no-kill
    type: tool_used
    tool: 'Bash'
    input_match: '\b(?:pkill|killall)\b|(?:^|[^\w-])kill\b(?![ \t]+-[0lL]\b)|\bfuser\b[^"]*?[ \t]-[a-zA-Z]*k|\bclaude[ \t]+agents?[ \t]+(?:stop|kill|rm|remove)\b|\bsystemctl\b[^"]*?[ \t](?:stop|kill)\b'
    min: 0
    max: 0
    arm: both
  - name: no-task-stop
    type: tool_used
    tool: 'TaskStop'
    min: 0
    max: 0
    arm: both
  - name: no-manufactured-task
    type: tool_used
    tool: 'TaskCreate'
    min: 0
    max: 0
    arm: both
