schema_version: "1.1"
name: recall-asks-before-other-projects
description: With transcript_scope at its default and no match in this worktree or the repository's other worktrees, recall asks before reading any other project's transcripts
tags: [recall, transcript-scope, consent]
expected_outcome: The answer scans this worktree's transcript directories, widens to the repository's other worktrees on no match, and then asks the user whether to read other projects' transcripts instead of running transcript_dirs.sh --scope all itself. It reads no other project's transcripts in this run.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/session-flow:recall the pagination cursor bug. I'm here and can answer questions."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: no-all-scope
    type: tool_used
    tool: Bash
    input_match: '--scope(?:\s+|=)(?:\\?["''])?all\b'
    min: 0
    max: 0
    arm: both
  - name: no-cross-project-read
    type: tool_used
    tool: Bash
    input_match: '\b(?:grep|rg|ag|cat|head|tail|jq|xargs|python3?)\b(?:(?!\\n)[^;&|])*?(?:\.claude|CLAUDE_CONFIG_DIR\}?)/projects(?:/\*|/?(?=[\s"''\\]|$))'
    min: 0
    max: 0
    arm: both
  - name: no-cross-project-grep
    type: tool_used
    tool: Grep
    input_match: '"path":"[^"]*(?:\.claude|CLAUDE_CONFIG_DIR\}?)/projects/?"'
    min: 0
    max: 0
    arm: both
  - name: no-cross-project-glob
    type: tool_used
    tool: Glob
    input_match: '"path":"[^"]*(?:\.claude|CLAUDE_CONFIG_DIR\}?)/projects/?"|"pattern":"[^"]*\.claude/projects/\*'
    min: 0
    max: 0
    arm: both
  - name: no-cross-project-read-tool
    type: tool_used
    tool: Read
    input_match: '"file_path":"[^"]*(?:\.claude|CLAUDE_CONFIG_DIR\}?)/projects/(?![^"/]*claude-eval-)[^"]'
    min: 0
    max: 0
    arm: both
  - name: asks-before-widening
    type: regex
    pattern: '^(?![\s\S]*\bI(?:''ve| have)?\s+(?:also\s+|already\s+)?(?:searched|scanned|checked|read)\s+(?:the\s+)?(?:transcripts\s+(?:of|in|from|across)\s+)?(?:other|every|all)\s+(?:\w+\s+)?projects?)[\s\S]*?(?:^|\n)[^\n]*(?:\b(?:other|every|all)\s+(?:\w+\s+)?projects?\b|--scope[ =]`?all\b|\bscope\s+`?all`?\b|\b(?:whole|entire)\s+machine\b)[^\n]*(?:\?|\n(?:[ \t]*\n)?[^\n]*\b(?:want|shall|should|may|can|ok(?:ay)?|proceed|go ahead)\b[^\n]*\?)'
    flags: 'i'
    arm: both
  - name: repo-scope-tried
    type: tool_used
    tool: Bash
    input_match: '--scope\s+(?:\\?["''])?repo\b'
    arm: with-only
