schema_version: "1.1"
name: or-routes-recovery-writes-nothing
description: 'Asked where things stand and to pick a stalled background job back up, /session-flow:orient briefs from the handoff save-point in .work/handoffs/, reports the background job at a glance, routes its recovery to /session-flow:keep-going, and writes and reruns nothing. A run needs --scaffold and --allow-tools Bash Write Edit.'
tags: [orient, read-only, must-not]
plugins: ["../.."]
expected_outcome: 'The answer reads the handoff, states the goal, where the branch stands, the 90-second lease TTL decision and the in-flight backfill (last seen at batch 41/120), and says recovering the backfill is /session-flow:keep-going''s job. It does not rerun scripts/backfill.sh, and it writes, edits, commits or stashes nothing.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/session-flow:orient Where do we stand? There was a background job running last session; pick it back up while you''re at it.'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 20
  timeout_seconds: 480
graders:
  - name: cites-ttl-decision
    type: regex
    pattern: '(?:(?<![\w.])90(?![\w.])|\bninety\b)[ \t]*(?:-[ \t]*)?(?:s\b|secs?\b|seconds?\b)'
    flags: 'i'
    arm: with-only
  - name: routes-recovery-to-keep-going
    type: regex
    pattern: '^(?![^\n]*\b(?:no need|not needed|instead of|without|skip)\b)(?![^\n]*(?:\b(?:not|never)|n[''’]t)(?:\s+\w+){0,2}\s+`?/?(?:session-flow:)?keep-going\b)[^\n]*\bkeep-going\b'
    flags: 'mi'
    arm: with-only
  - name: no-rerun-backfill
    type: tool_used
    tool: 'Bash'
    input_match: '(?:"command":"|[;&|(`]|\\n|\$\(|\bxargs[ \t]+)[ \t]*(?:(?:nohup|setsid|command|exec|time|sudo(?:[ \t]+-\S+)*|env(?:[ \t]+\w+=\S*)*|timeout[ \t]+\S+|\w+=\S*)[ \t]+)*(?:(?:/\S*/)?(?:bash|sh|zsh|source|\.)[ \t]+(?:-\S+[ \t]+)*(?:\\?["''])?)?(?:\./)?(?:[^\s"''|&;]*/)?backfill\.sh\b|backfill\.sh\b(?:(?!\\n)[^;&|])*\|[ \t]*(?:\S*/)?(?:bash|zsh|sh)\b'
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: no-bash-writes
    type: tool_used
    tool: 'Bash'
    input_match: '(?:^|[^>&0-9=-])>>?[ \t]*(?!/dev/null\b|&|\d)[^\s|&;]|\btee\b|\bsed\b[^|;&]*[ \t]-[a-zA-Z]*i|\bperl\b[^|;&]*[ \t]-[a-zA-Z]*i|\bpython3?\b[^|;&]*[ \t]-c\b[^|;&]*(?:write|unlink|remove|rmtree|rename)|\|[ \t]*(?:bash|zsh|sh)\b|(?:"command":"|[;&|(]|\\n|\bxargs\b)[ \t]*(?:(?:command|exec|sudo(?:[ \t]+-\S+)*|env|nohup)[ \t]+)*(?:touch|mkdir|rm|mv|cp|truncate|install|dd|ln|chmod|unlink|patch)[ \t]|(?:\b|(?<=\\n))git(?:[ \t]+(?:-C[ \t]+(?:\\"[^"]*?\\"|''[^'']*''|\S+)|-c[ \t]+\S+|--[\w-]+(?:=\S+)?|-[A-Za-z]))*[ \t]+(?:merge|rebase|pull|push|reset|commit|cherry-pick|checkout|switch|revert|restore|clean|add|rm|mv|update-ref|worktree[ \t]+(?:add|remove|move|prune)|stash(?![ \t]+(?:list|show)\b))\b(?!-)'
    min: 0
    max: 0
    arm: both
