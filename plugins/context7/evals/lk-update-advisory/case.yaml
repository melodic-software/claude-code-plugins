schema_version: "1.1"
name: lk-update-advisory
graders:
  - name: update-check-ran
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?\bupdate\.sh\b'
    min: 1
  - name: no-fix-or-refresh
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:--fix\b|--refresh-baseline\b|\bnpm\s+(?:(?:-g|--global)\s+)?(?:i|install)\b)'
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
