schema_version: "1.1"
name: ck-read-only
graders:
  - name: version-checked
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?\bctx7(?:@[\w.-]+)?\s+--version\b'
    min: 1
  - name: no-install
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\b(?:npm|pnpm|yarn|bun)\s+(?:(?:-g|--global|global)\s+)?(?:i|install|add|update|upgrade)\b|\bnpx\s+(?:(?:-y|--yes)\s+)?ctx7)'
    min: 0
    max: 0
    arm: both
  - name: status-table
    type: regex
    pattern: '^[ \t]*\|?[ \t]*:?-{3,}:?[ \t]*\|[\s\S]*?^(?=[^\n]*\|)[^\n]*\b(?:PASS|FAIL|INFO|Pass|Fail|Info)\b'
    flags: m
    target: last_message
