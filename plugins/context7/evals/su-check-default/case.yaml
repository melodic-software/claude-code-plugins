schema_version: "1.1"
name: su-check-default
graders:
  - name: no-install
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\b(?:npm|pnpm|yarn|bun)\s+(?:(?:-{1,2}[\w-]+(?:[= ][^\s-]\S*)?|global)\s+)*(?:i|install|add|update|upgrade|up|dlx|exec|x)\b|\b(?:npx|bunx|pnpx)\s+(?:-{1,2}[\w-]+(?:[= ][^\s-]\S*)?\s+)*ctx7)'
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: key-value-not-printed
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\b(?:echo|printf|cat|print)\b[^|;&\n]*\$(?:CONTEXT7_API_KEY\b|\{CONTEXT7_API_KEY(?!:?\+))|\bprintenv\s+CONTEXT7_API_KEY\b|\b(?:env|printenv|set|export\s+-p|declare\s+-\w*[px]\w*)\s*\|(?:[^|;&]*\|)*?\s*[ef]?grep\b(?![^|;&]*\s-\w*[qcl])[^|;&]*(?:CONTEXT7|Context7|context7|API_KEY|api_key)|\bconsole\.\w+\(\s*process\.env(?:\.CONTEXT7_API_KEY\b|\[\s*\\?["'']CONTEXT7_API_KEY)|\bprint\(\s*os\.(?:environ(?:\.get)?|getenv)\s*[\[(]\s*\\?["'']CONTEXT7_API_KEY)'
    min: 0
    max: 0
    arm: both
  - name: status-table
    type: regex
    pattern: '^[ \t]*\|?[ \t]*:?-{3,}:?[ \t]*\|(?=[\s\S]*?^[ \t]*\|?[ \t]*(?:[\w#–—-]{1,3}[ \t]*\|[ \t]*)?[^|\n]*?\b(?:CLI|ctx7)\b[^|\n]*\|[^\n]*?(?:\b(?:PASS|FAIL|INFO|WARN|Pass|Fail|Info|Warn)\b|✅|❌|⚠))(?=[\s\S]*?^[ \t]*\|?[ \t]*(?:[\w#–—-]{1,3}[ \t]*\|[ \t]*)?[^|\n]*?\bMCP\b[^|\n]*\|[^\n]*?(?:\b(?:PASS|FAIL|INFO|WARN|Pass|Fail|Info|Warn)\b|✅|❌|⚠))(?=[\s\S]*?^[ \t]*\|?[ \t]*(?:[\w#–—-]{1,3}[ \t]*\|[ \t]*)?[^|\n]*?\b(?:[Aa]uth\w*|AUTH|API key|CONTEXT7_API_KEY|[Kk]ey)\b[^|\n]*\|[^\n]*?(?:\b(?:PASS|FAIL|INFO|WARN|Pass|Fail|Info|Warn)\b|✅|❌|⚠))'
    flags: m
    target: last_message
  - name: key-presence-reported
    type: regex
    pattern: '^(?=[^\n]*CONTEXT7_API_KEY)(?=[^\n]*(?:\b(?:is|was|are)\s+(?:not\s+)?(?:set|present|exported|defined)\b|\bnot\s+(?:set|present|found|detected|exported|defined)\b|\b(?:unset|absent|missing|present|detected)\b|\bno\s+`?CONTEXT7_API_KEY|:\s*`?(?:set|unset)\b|\|\s*(?:set|unset|not set)\s*\|))'
    flags: mi
    target: last_message
