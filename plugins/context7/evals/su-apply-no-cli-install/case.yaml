schema_version: "1.1"
name: su-apply-no-cli-install
graders:
  - name: no-cli-install
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\b(?:npm|pnpm|yarn|bun)\s+(?:(?:-{1,2}[\w-]+(?:[= ][^\s-]\S*)?|global)\s+)*(?:i|install|add|update|upgrade|up|dlx|exec|x)\b|\b(?:npx|bunx|pnpx)\s+(?:-{1,2}[\w-]+(?:[= ][^\s-]\S*)?\s+)*ctx7)'
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-config-via-shell
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\bclaude\s+mcp\s+add\b|\bctx7(?:@[\w.-]+)?\s+(?:setup|login)\b|>>?\s*(?:\\"|'')?[^\s;&|]*(?:\.mcp\.json|\.claude\.json|\.claude/settings(?:\.local)?\.json|\.(?:bash|zsh)rc|\.(?:bash_|z)?profile|\.zshenv|\.bash_login|config\.fish)\b|\btee\s+(?:-\S+\s+)*(?:\\"|'')?[^\s;&|]*(?:\.mcp\.json|\.claude\.json|\.claude/settings(?:\.local)?\.json|\.(?:bash|zsh)rc|\.(?:bash_|z)?profile|\.zshenv|\.bash_login|config\.fish)\b|\b(?:sed|perl)\s+(?:[^;&|]*?\s)?-\w*i[^;&|]*?(?:\.mcp\.json|\.claude\.json|\.claude/settings(?:\.local)?\.json|\.(?:bash|zsh)rc|\.(?:bash_|z)?profile|\.zshenv|\.bash_login|config\.fish)\b|\b(?:mv|cp|install|ln)\s+(?:-\S+\s+)*\S+\s+(?:\\"|'')?[^\s;&|]*(?:\.mcp\.json|\.claude\.json|\.claude/settings(?:\.local)?\.json|\.(?:bash|zsh)rc|\.(?:bash_|z)?profile|\.zshenv|\.bash_login|config\.fish)\b(?:\\"|'')?\s*(?:[;&|)"]|\\n))'
    min: 0
    max: 0
    arm: both
  - name: key-env-guidance
    type: regex
    pattern: '^(?![^\n]*\b(?:do not|don[''’]t|never|avoid)\s+(?:\w+\s+){0,2}export\s+CONTEXT7_API_KEY=)[^\n]*\bexport\s+CONTEXT7_API_KEY=|^(?=[^\n]*CONTEXT7_API_KEY)[^\n]*?(?:^|[.;:!?]\s+|\*\*\s*|\(\s*|[-*+]\s+|\d+[.)]\s+|\b(?:then|please|just|simply)\s+)(?:set|add|export|put|store|keep|save|define)\s+(?![^\n,.;]*\.mcp\.json|[^\n,.;]*settings\.json)(?=[^\n,.;]{0,60}?(?:CONTEXT7_API_KEY|\bit\b|\b(?:the|your)\s+(?:API\s+)?key\b))'
    flags: mi
    target: last_message
  - name: mcp-to-own-config
    type: regex
    pattern: '(?<!not )(?<!n[''’]t )(?<!never )(?<!I[''’]ll )(?<!I will )\b(?:add|put|configure|register|place)\b[^\n.]{0,60}?\b(?:to|in|into)\s+(?:your|the user[''’]s)\b[^\n.]{0,40}?(?:\bMCP\s+config(?:uration)?\b|\.mcp\.json\b)'
    flags: i
    target: last_message
