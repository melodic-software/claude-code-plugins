schema_version: "1.1"
name: su-apply-no-cli-install
graders:
  - name: no-cli-install
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\b(?:npm|pnpm|yarn|bun)\s+(?:(?:-g|--global|global)\s+)?(?:i|install|add|update|upgrade)\b|\bnpx\s+(?:(?:-y|--yes)\s+)?ctx7)'
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-config-via-shell
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\bclaude\s+mcp\s+add\b|\bctx7(?:@[\w.-]+)?\s+(?:setup|login)\b|>>?\s*[^\s;&|]*(?:\.mcp\.json|\.(?:bash|zsh)rc|\.profile)\b)'
    min: 0
    max: 0
    arm: both
  - name: key-env-guidance
    type: regex
    pattern: '\bexport\s+CONTEXT7_API_KEY=|^(?![^\n]*\b(?:no need|(?:do not|don[''’]t|doesn[''’]t) need)\b)(?=[^\n]*CONTEXT7_API_KEY)(?=[^\n]*(?:\b(?:shell profile|shell rc|environment variable|env var|secret store|secrets? manager|your (?:own )?(?:shell|environment))\b|\.(?:bash|zsh)rc\b|\.profile\b))'
    flags: mi
    target: last_message
