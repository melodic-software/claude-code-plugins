schema_version: "1.1"
name: sdw-lever-default
graders:
  - name: scope-default
    type: regex
    pattern: 'lever_scope[`*]*\s*[:=][`*\s]*deterministic[`*]*\s*\([^)\n]*\bdefault\b'
    flags: 'i'
    target: last_message
  - name: answers-build
    type: regex
    pattern: '\banswer[`*]*\s*[:=][`*\s]*build-a-lever\b'
    flags: 'i'
    target: last_message
  - name: pilot-diff
    type: regex
    pattern: '\b(?:pilot\w*|first (?:class|site|call site|file|fixture|handler)|one (?:class|site|call site|file|fixture))\b[\s\S]{0,300}?\bdiff\w*\b'
    flags: 'i'
    target: last_message
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: mechanical-and-pilot
    type: llm
    criteria: 'The reply meets the legacy expectations "Classifies the rename as mechanical and answers build-a-lever" and "States the pilot: one file by hand, the script''s result on it diffed, before the other files".'
    focus: last_message
