schema_version: "1.1"
name: hmh-runner-setup-phase-one
graders:
  - name: phase-count-line
    type: regex
    pattern: '^[ \t>*_#]*Phase[ \t]+1[ \t]+of[ \t]+(?:\d+|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b'
    flags: 'mi'
    target: last_message
  - name: no-later-phase-titles
    type: regex
    pattern: '\bPhase[ \t]+(?:[2-9]|1[0-9]|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b(?![ \t]+of\b)[ \t]*(?:\*\*)?[ \t]*[:—–(-][ \t]*(?:\*\*)?[ \t]*[A-Za-z]|^[ \t>]*#{1,6}[ \t]*(?:\*\*)?[ \t]*Phase[ \t]+(?:[2-9]|1[0-9]|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b(?![ \t]+of\b)|\bPhases[ \t]+(?:[2-9]|1[0-9]|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)[ \t]*(?:[-–—]|to|through)[ \t]*(?:[2-9]|1[0-9]|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b'
    flags: 'mi'
    match: not_contains
    target: last_message
  - name: advancing-reply-literal
    type: regex
    pattern: '\b(?:tell me|reply(?: with)?|respond(?: with)?|say|type|send(?: me)?|answer)\b[^\n`\"“”]{0,40}[`\"“][^`\"“”\n]{2,40}[`\"”](?![^\n]{0,30}?\b(?:and (?:then )?(?:press|hit|run)|(?:in|into|at) (?:the |a |an |your )?(?:terminal|shell|console|prompt|powershell|pwsh|window|command line|cmd))\b)|\b(?:tell me|reply(?: with)?|respond(?: with)?|say|type|send(?: me)?|answer)\b[^\n]{0,120}:[ \t]*\n+[ \t]*```(?!(?:powershell|pwsh|ps1|bash|sh|shell|cmd|console)\b)[\w-]*[ \t]*\n[ \t]*[^\n`]{2,40}\n[ \t]*```'
    flags: 'i'
    target: last_message
  - name: expected-result-stated
    type: regex
    pattern: '\b(?:expected (?:output|result|outcome)|you should (?:now )?see|you will see|you''ll see|success looks like|should (?:now )?(?:show|print|display|return|appear|read|list))\b|\bexpected\b[ \t]*(?:\*\*)?[ \t]*[:—–-]'
    flags: 'i'
    target: last_message
  - name: no-plan-leak
    type: llm
    criteria: 'The user asked to be walked through a multi-step runner setup one phase at a time. The reply meets the legacy expectations "Presents exactly one phase, the current one" and "Does not list, preview, or summarize any later phase". It passes when the only forward-looking information is a one-line count such as "Phase 1 of 5", or the numbered progress list the hold-my-hand skill keeps when no task tools are available (SKILL.md lines 122-126: "every unpresented phase a bare number with no title and no steps"). It fails if it names, lists, previews or summarizes what any later phase will do, in a heading, a list, a table of contents, a task list, or a sentence such as "next we will install the service and then run a test job".'
    focus: last_message
  - name: performer-labeled
    type: llm
    criteria: 'The hold-my-hand skill says (SKILL.md line 79): "Label every step with its performer." PASS only if the reply meets that line for every step it presents. FAIL otherwise.'
    focus: last_message
