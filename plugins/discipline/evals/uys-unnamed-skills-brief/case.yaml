schema_version: "1.1"
name: uys-unnamed-skills-brief
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-the-brief
    type: regex
    pattern: '\bdelegation-brief(?:\.md)?\b|\b(?:the|your|this) brief\b'
    flags: 'i'
    target: last_message
  - name: brief-names-the-skill
    type: regex
    pattern: '^(?![^\n]*\b(?:do not|don''t|never|without|instead of) (?:use |invoke |name |naming |using )?[`/]*(?:discipline:)?point-dont-copy)[^\n]*\bpoint-dont-copy\b'
    flags: 'mi'
    target: { source: file, path: notes/delegation-brief.md }
  - name: report-names-the-skill
    type: regex
    pattern: '^(?![^\n]*\b(?:do not|don''t|never|without|instead of) (?:use |invoke |name |naming |using )?[`/]*(?:discipline:)?point-dont-copy)[^\n]*\bpoint-dont-copy\b'
    flags: 'mi'
    target: last_message
