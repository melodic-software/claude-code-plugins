schema_version: "1.1"
name: sdw-lever-repo-file-only
context:
  scaffold_script: scaffold.sh
graders:
  - name: scope-repo-non-trivial
    type: regex
    pattern: 'lever_scope[`*]*\s*[:=][`*\s]*non-trivial[`*]*\s*\([^)\n]*docs/conventions/discipline\.yaml'
    flags: 'i'
    target: last_message
  - name: answers-build
    type: regex
    pattern: '\banswer[`*]*\s*[:=][`*\s]*build-a-lever\b'
    flags: 'i'
    target: last_message
  - name: pilot-first-fixture
    type: regex
    pattern: '\bpilot\w*\b|\b(?:first|one) (?:site|call site|fixture|file)\b[\s\S]{0,200}?\b(?:before|then)\b'
    flags: 'i'
    target: last_message
  - name: placeholder-unset
    type: llm
    criteria: 'The reply meets the legacy expectation "Treats the unexpanded ${user_config.lever_scope} placeholder as unset, not as a value": it never reports the user option as the supplying layer or as a value. It also meets "States the pilot on the first fixture before the lever runs on the rest".'
    focus: last_message
