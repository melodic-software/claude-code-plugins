schema_version: "1.1"
name: dyr-light-session-stays-inline
context:
  history_file: history.jsonl
graders:
  - name: no-fan-out-tier-read
    type: regex
    pattern: '"name":"(?:Read|Bash|Grep)","input":\{[^\n]*?fan-out-tier\.md'
    match: 'not_contains'
    target: 'trace'
    arm: 'both'
  - name: no-agent
    type: tool_used
    tool: 'Agent'
    min: 0
    max: 0
    arm: 'both'
  - name: cost-not-justified
    type: llm
    criteria: 'Legacy expectation: "Recognizes the accumulated claims do not justify the fan-out''s subagent cost". PASS only if the reply says, in some form, that one already-sourced claim does not warrant a subagent fan-out. FAIL if it runs or proposes the fan-out without weighing the cost.'
    focus: 'last_message'
    arm: 'both'
  - name: no-big-pass
    type: llm
    criteria: 'Legacy expectations: "Runs the inline audit rather than the fan-out tier" and "Does not manufacture a large verification pass where an inline check suffices". PASS only if the reply checks the single 429 claim inline and keeps the report short. FAIL if it builds a typed inventory, a multi-row ledger or a broad verification pass.'
    focus: 'last_message'
    arm: 'both'
