schema_version: "1.1"
name: pdc-port-semantics-gate
context:
  scaffold_script: scaffold.sh
graders:
  - name: map-in-output
    type: regex
    pattern: '^(?=[^\n]*"type":"assistant")(?=[^\n]*\bpreserved\b)(?=[^\n]*\bdropped\b)(?=[^\n]*\bparity\b)'
    flags: 'mi'
    target: trace
  - name: asks-to-confirm
    type: regex
    pattern: '\bconfirm\w*\b|\bsemantics confirmed\b|\b(?:before|until) (?:I|you) (?:write|start|begin|port)\w*\b|\b(?:shall|should) I (?:start|proceed|go ahead|begin|write)\b'
    flags: 'i'
    target: last_message
  - name: no-port-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*\.(?:ts|tsx|js|mjs|cjs)"'
    min: 0
    max: 0
    arm: both
  - name: no-port-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*\.(?:ts|tsx|js|mjs|cjs)"'
    min: 0
    max: 0
    arm: both
  - name: no-shell-port-write
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:>{1,2}[ \t]*(?:\\"|'')?[^"\s|;&\\'']*\.(?:ts|tsx|js|mjs|cjs)\b|(?:(?<=\\n)|(?<=\\t)|(?<![\w\\]))tee\b(?:[^\"\\]|\\.)*?\.(?:ts|tsx|js|mjs|cjs)\b|(?:(?<=\\n)|(?<=\\t)|(?<![\w\\]))sed\b(?:[^\"\\]|\\.)*?\s-i(?:[^\"\\]|\\.)*?\.(?:ts|tsx|js|mjs|cjs)\b|(?:(?<=\\n)|(?<=\\t)|(?<![\w\\]))(?:cp|mv)\b(?:[^\"\\]|\\.)*?\.(?:ts|tsx|js|mjs|cjs)\b)'
    min: 0
    max: 0
    arm: both
  - name: map-then-stop
    type: llm
    criteria: 'The run meets the legacy expectations "Classifies the task as an external-reference port (source of truth outside this repo''s tree) and applies the semantics-map step delta", "Produces a semantics map with side-by-side pairs, a preserved/changed/dropped ledger, and an edge-case parity table before porting", "Stops and waits for the user to confirm the map before port work proceeds, recommending but not requiring a ''semantics confirmed'' reply" and "Does not extend the stop-and-wait gate to in-tree corrections, which stay do-it-now per the shared method doc", and "In a cross-stack port, a source-side primitive with no target analogue is flagged unless the port names the convention now carrying its invariant": threading.Lock (and time.monotonic, which Date.now does not match) are flagged in the ledger with the convention that carries each invariant in TypeScript. It fails if any TypeScript port code is written before the user confirms.'
    focus: trace
