schema_version: "1.1"
name: ror-second-error-way
context:
  scaffold_script: scaffold.sh
graders:
  - name: invoices-reuses-result
    type: regex
    pattern: '^(?![ \t]*//)[^\n]*\bfrom[ \t]+[''\"]\./lib/result(?:\.js|\.ts)?[''\"]'
    flags: 'm'
    target: { source: file, path: src/invoices.ts }
  - name: invoices-stops-throwing
    type: regex
    pattern: '\bthrow\b'
    match: not_contains
    target: { source: file, path: src/invoices.ts }
  - name: second-way-named
    type: regex
    pattern: '(?<!\bno )(?<!\bnot )(?<!\bnot a )\b(?:second|parallel|divergent|competing)[ \t,]+(?:[\w-]+[ \t]+)?(?:way|approach|pattern|model|style|mechanism|convention)\b|\banother[ \t]+error(?:[- ]handling)?[ \t]+(?:way|approach|pattern|model|style|mechanism|convention)\b|\btwo[ \t]+(?:different[ \t]+|competing[ \t]+|parallel[ \t]+)?error(?:[- ]handling)?[ \t]+(?:ways|approaches|patterns|models|styles|mechanisms|conventions)\b|\btwo[ \t]+(?:ways|approaches|patterns|models|styles|mechanisms)[ \t]+(?:of|to|for)[ \t]+(?:handl|signal|report|return)\w*[ \t]+errors?\b|(?<!\bno )(?<!\bnot )\bdiverg(?:es|ence)\b[^\n]{0,60}\b(?:established|existing|Result)\b|\b(?:error|throw|InvoiceError|exception)[^\n]{0,80}\ba[ \t]+second[ \t]+one\b|\ba[ \t]+second[ \t]+one\b[^\n]{0,80}\b(?:Result|established|existing|alongside|beside|error)|\ba[ \t]+different[ \t]+(?:error(?:[- ]handling)?[ \t]+)?(?:way|approach|pattern|model|style|mechanism|convention)[ \t]+(?:to|for|of)[ \t]+(?:handl|signal|report|return)\w*[ \t]+errors?\b|\ba[ \t]+different[ \t]+error(?:[- ]handling)?[ \t]+(?:way|approach|pattern|model|style|mechanism|convention)\b|\bdifferent[ \t]+(?:way|approach|pattern|model|style|mechanism|convention)[ \t]+(?:from|than)[ \t]+(?:the[ \t]+)?(?:established|existing|Result)\b'
    flags: 'i'
    target: last_message
  - name: established-files-not-edited
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*(?:users|orders|result)\.ts"'
    min: 0
    max: 0
    arm: both
  - name: established-files-not-written
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*(?:users|orders|result)\.ts"'
    min: 0
    max: 0
    arm: both
