schema_version: "1.1"
name: ww-no-glossary
context:
  history_file: history.jsonl
graders:
  - name: silent-no-glossary
    type: regex
    pattern: '\bglossar(?:y|ies)\b|\bcontext map\b|\bubiquitous language\b'
    flags: 'i'
    match: 'not_contains'
    target: last_message
  - name: premise-restored
    type: regex
    pattern: '(?=[\s\S]*\b(?:many|all|lots of|hundreds of|thousands of|a flood of)\b[^\n.]{0,60}\b(?:requests?|calls?|clients?)\b)(?=[\s\S]*\b(?:at (?:the same time|once)|simultaneous\w*|together|in the same (?:moment|second))\b)'
    flags: 'i'
    target: last_message
  - name: short-sentences
    type: regex
    pattern: '(?:[^\s.!?;:|]+[ \t]+){34,}[^\s.!?;:|]+'
    match: 'not_contains'
    target: last_message
