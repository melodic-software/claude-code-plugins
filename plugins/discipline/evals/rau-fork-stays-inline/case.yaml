schema_version: "1.1"
name: rau-fork-stays-inline
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:discipline:)?recheck-against-upstream"'
    min: 1
    arm: with-only
  - name: no-agent
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
  - name: no-task
    type: tool_used
    tool: Task
    min: 0
    max: 0
    arm: both
  - name: guard-cited
    type: llm
    criteria: 'Legacy expectation: "Cites the skill''s never-inside-a-batch-or-a-fork guard (or its effect) as the reason it stays inline, not the request''s wording". PASS only if the reply gives running inside a fork or batch, and the skill''s rule against fanning out there, as its reason for staying inline. FAIL if it gives no reason, or only the request''s wording (for example "you asked for no writes"), or if it fans out despite being in a fork.'
    focus: last_message
  - name: recommends-direct-fan-out
    type: regex
    pattern: 'recheck-against-upstream\W{0,3}\s*fan-?out\b'
    flags: 'i'
    target: last_message
  - name: inline-ledger
    type: llm
    criteria: 'The reply meets the legacy expectations "Cites the skill''s never-inside-a-batch-or-a-fork guard (or its effect) as the reason it stays inline, not the request''s wording", "Runs the inline re-anchor and recheck and returns a findings ledger without writing, with an explicit compared-versus-skipped list" and "Recommends a direct /discipline:recheck-against-upstream fan-out run where the fan-out would fit".'
    focus: last_message
