schema_version: "1.1"
name: swa-fork-off-degrades
graders:
  - name: first-line-token
    type: regex
    pattern: '^SWEEP-ALL: DEGRADED \(fork-unavailable\)'
    target: last_message
  - name: no-dispatch
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
  - name: zero-audits-stated
    type: regex
    pattern: '(?=[\s\S]*\b(?:no audits?|zero audits?|nothing (?:was )?audited|no (?:member )?(?:forks?|subagents?) (?:were )?dispatched)\b)(?=[\s\S]*\b(?:no corrections?|zero corrective writes|nothing (?:was )?corrected|no corrective writes)\b)'
    flags: 'i'
    target: last_message
  - name: digest-tiers
    type: regex
    pattern: '(?=[\s\S]*\bcore\b)(?=[\s\S]*\bsituational\b)(?=[\s\S]*(?:\bnever[- ]?(?:batch(?:ed)?|tier|run)\b|`never`|\*\*never\*\*|\bnever\b[ \t]*(?:\*\*)?[ \t]*[:|(—–-]|\bnot batched\b|\binvoked directly\b))'
    flags: 'i'
    target: last_message
  - name: no-inline-correctors
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:discipline:)?(?:be-ambitious|do-your-research|follow-our-standards|hold-my-hand|mind-your-maxims|pick-for-the-problem|point-dont-copy|reason-dont-recite|recheck-against-upstream|reuse-or-replace|script-the-deterministic-work|scrutinize-dont-coast|tighten-your-output|use-your-skills|wait-what)"'
    min: 0
    max: 0
    arm: both
  - name: no-corrector-body-read
    type: tool_used
    tool: Read
    input_match: '"file_path":"[^"]*/skills/(?!sweep-all/)[^"/]+/SKILL\.md"(?![^}]*"limit":(?:[1-9]|[1-3]\d|40)\b)'
    min: 0
    max: 0
    arm: both
