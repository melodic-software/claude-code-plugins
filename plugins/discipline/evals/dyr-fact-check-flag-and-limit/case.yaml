schema_version: "1.1"
name: dyr-fact-check-flag-and-limit
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:discipline:)?do-your-research"'
    min: 1
    arm: 'with-only'
  - name: located-findings
    type: llm
    criteria: 'Legacy expectations: "Treats the ''fact-check'' request as research/verification discipline and re-anchors it" and "Names the unverified flag and the unverified limit as concrete, located findings". PASS only if the reply treats the request as a research/verification check and names both claims (the --parallel flag and the 100-requests-a-day limit) as findings. FAIL if it names only one, or answers without treating them as claims to check.'
    focus: 'last_message'
    arm: 'both'
  - name: checks-workspace
    type: regex
    pattern: '"name":"(?:Read|Grep|Glob)","input":\{[^\n]*?(?:cli\.py|limits\.md|synccli|parallel|--jobs|requests per day|"path":"[^"]*docs)'
    target: 'trace'
  - name: flag-corrected
    type: regex
    pattern: '(?<![\w-])--jobs(?![\w-])'
    target: 'last_message'
  - name: limit-corrected
    type: regex
    pattern: '(?<![\d,.])1,?000\b[^\n]{0,40}\b(?:requests?|calls?|a day|per day|/day|daily)'
    flags: 'i'
    target: 'last_message'
  - name: stays-inline
    type: regex
    pattern: '"name":"(?:Read|Bash|Grep)","input":\{[^\n]*?fan-out-tier\.md'
    match: 'not_contains'
    target: 'trace'
    arm: 'both'
  - name: stays-inline-reply
    type: llm
    criteria: 'Legacy expectation: "Stays inline for a small fact-check rather than taking the fan-out tier". PASS only if the reply handles the two claims in an inline audit and does not report taking the fan-out tier (a typed full inventory of the session''s claims with per-item subagent verification and a ledger). One fresh-context confirmation subagent is not the fan-out tier. FAIL if it says it took or ran the fan-out tier.'
    focus: 'last_message'
    arm: 'both'
