schema_version: "1.1"
name: status-says-no-profile-recorded
graders:
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:plugin-profiles:)?profile"'
    min: 1
    arm: 'with-only'
  - name: status-ran
    type: tool_used
    tool: 'Bash'
    input_match: 'profiles\.mjs(?:\\"|'')?\s+status\b'
    min: 1
    arm: 'with-only'
  - name: no-write
    type: tool_used
    tool: 'Bash'
    input_match: 'profiles\.mjs(?:\\"|'')?\s+(?:apply|clear|save|install)\b(?:[^"\\]|\\.)*--yes'
    min: 0
    max: 0
    arm: 'both'
  - name: no-profile-recorded
    type: regex
    pattern: '\bno (?:plugin )?profile\b[^\n]*\b(?:recorded|applied|set)\b'
    flags: 'i'
    target: last_message
