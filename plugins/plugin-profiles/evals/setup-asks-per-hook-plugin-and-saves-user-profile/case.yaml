schema_version: "1.1"
name: setup-asks-per-hook-plugin-and-saves-user-profile
context:
  scaffold_script: scaffold.sh
graders:
  - name: inventory-ran
    type: tool_used
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?=(?:[^"\\]|\\.)*?profiles\.mjs)(?:[^"\\]|\\.)*?(?:profiles\.mjs|\$\{?[A-Za-z_][A-Za-z0-9_]*\}?)(?:\\"|'')?\s+inventory\b'
    min: 1
    arm: 'with-only'
  - name: usage-ran
    type: tool_used
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?=(?:[^"\\]|\\.)*?profiles\.mjs)(?:[^"\\]|\\.)*?(?:profiles\.mjs|\$\{?[A-Za-z_][A-Za-z0-9_]*\}?)(?:\\"|'')?\s+usage\b'
    min: 1
    arm: 'with-only'
  - name: per-hook-question-asked
    type: regex
    target: last_message
    flags: 'i'
    pattern: '^(?=[\s\S]*notes-hooks)[\s\S]*?(?:always[ -]on[^.?!\n]*\bor\b[^.?!\n]*(?:per[ -]profile|only (?:on |loaded )?(?:in|by) (?:the |some )?profiles)[^.!\n]*\?|(?:per[ -]profile|only (?:on |loaded )?(?:in|by) (?:the |some )?profiles)[^.?!\n]*\bor\b[^.?!\n]*always[ -]on[^.!\n]*\?|always[ -]on[^.?!\n]*\bor\b[^.?!\n]*\?[^\n]*(?:\n[^\n]*){0,5}?\n[^\n]*per[ -]profile)'
  - name: no-profile-saved-before-answer
    type: tool_used
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?=(?:[^"\\]|\\.)*?profiles\.mjs)(?:[^"\\]|\\.)*?(?:profiles\.mjs|\$\{?[A-Za-z_][A-Za-z0-9_]*\}?)(?:\\"|'')?\s+save\b(?=(?:[^"\\;&|]|\\[^n])*?--yes\b)'
    min: 0
    max: 0
    arm: 'with-only'
  - name: no-hand-written-profile
    type: tool_used
    tool: 'Write'
    input_match: 'plugin-profiles'
    min: 0
    max: 0
    arm: 'both'
