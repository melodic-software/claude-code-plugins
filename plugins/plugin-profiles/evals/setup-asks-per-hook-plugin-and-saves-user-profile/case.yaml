schema_version: "1.1"
name: setup-asks-per-hook-plugin-and-saves-user-profile
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:plugin-profiles:)?profile"'
    min: 1
    arm: 'with-only'
  - name: inventory-ran
    type: tool_used
    tool: 'Bash'
    input_match: 'profiles\.mjs(?:\\"|'')?\s+inventory\b'
    min: 1
    arm: 'with-only'
  - name: usage-ran
    type: tool_used
    tool: 'Bash'
    input_match: 'profiles\.mjs(?:\\"|'')?\s+usage\b'
    min: 1
    arm: 'with-only'
  - name: save-previewed
    type: tool_used
    tool: 'Bash'
    input_match: 'profiles\.mjs(?:\\"|'')?\s+save\s+docs\b(?:[^"\\]|\\.)*--dry-run'
    min: 1
    arm: 'with-only'
  - name: save-written-at-user-level
    type: tool_used
    tool: 'Bash'
    input_match: 'profiles\.mjs(?:\\"|'')?\s+save\s+docs\b(?=(?:[^"\\]|\\.)*--level\s+user\b)(?=(?:[^"\\]|\\.)*--yes\b)'
    min: 1
    arm: 'with-only'
  - name: no-hand-written-profile
    type: tool_used
    tool: 'Write'
    input_match: 'plugin-profiles'
    min: 0
    max: 0
    arm: 'both'
