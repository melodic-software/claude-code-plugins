schema_version: "1.1"
name: setup-installs-only-after-yes
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:plugin-profiles:)?profile"'
    min: 1
    arm: 'with-only'
  - name: install-previewed
    type: tool_used
    tool: 'Bash'
    input_match: 'profiles\.mjs(?:\\"|'')?\s+install\s+draw@fixture-market\b(?:[^"\\]|\\.)*--dry-run'
    min: 1
    arm: 'with-only'
  - name: install-on-yes
    type: tool_used
    tool: 'Bash'
    input_match: 'profiles\.mjs(?:\\"|'')?\s+install\s+draw@fixture-market\b(?:[^"\\]|\\.)*--yes'
    min: 1
    max: 1
    arm: 'with-only'
  - name: no-direct-install
    type: tool_used
    tool: 'Bash'
    input_match: '\bclaude(?:\\"|'')?\s+plugin\s+(?:install|i|update|uninstall|enable|disable)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: ends-off-at-user-level
    type: regex
    pattern: 'Installed draw@fixture-market; it is off in'
    target: trace
