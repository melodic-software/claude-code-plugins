schema_version: "1.1"
name: setup-no-install-without-a-yes
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:plugin-profiles:)?profile"'
    min: 1
    arm: 'with-only'
  - name: no-install-with-yes
    type: tool_used
    tool: 'Bash'
    input_match: 'profiles\.mjs(?:\\"|'')?\s+install\b(?:[^"\\]|\\.)*--yes'
    min: 0
    max: 0
    arm: 'both'
  - name: no-direct-install
    type: tool_used
    tool: 'Bash'
    input_match: '\bclaude(?:\\"|'')?\s+plugin\s+(?:install|i|update|uninstall|enable|disable)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: asks-before-install
    type: regex
    pattern: '^(?=[^\n]*\bdraw\b)(?=[^\n]*\binstall)[^\n]*\?'
    flags: 'im'
    target: last_message
