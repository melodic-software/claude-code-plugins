schema_version: "1.1"
name: fanout-require-unattended-keeps-findings
context:
  scaffold_script: scaffold.sh
graders:
  - name: opens-with-nothing-checked
    type: tool_used
    tool: Write
    input_match: '^(?=.*\.work/reviews/[^"]*\.md")(?=.*type: review-findings)(?=.*---(?:\\n| )*Nothing could be checked)'
  - name: dismissed-not-reproduced
    type: tool_used
    tool: Write
    input_match: '^(?=.*\.work/reviews/[^"]*\.md")(?=.*type: review-findings)(?=.*## Dismissed(?:(?!\\n## ).)*not reproduced)'
  - name: dismissed-says-nothing-ran
    type: tool_used
    tool: Write
    input_match: '^(?=.*\.work/reviews/[^"]*\.md")(?=.*type: review-findings)(?=.*## Dismissed(?:(?!\\n## ).)*not reproduced: unattended run, nothing ran)'
  # runs-no-reviewed-code counts the Bash calls in the main session's transcript only: the docs page
  # (https://code.claude.com/docs/en/plugin-evals#what-a-grader-can-look-at) does not say a tool_used
  # grader sees a subagent's calls, so this proves the orchestrator ran no reviewed code, not that
  # its reviewers ran none. A node script is allowed only under a /review/.../scripts/ path or
  # ${CLAUDE_PLUGIN_ROOT}, so a script the agent writes under such a path would pass.
  - name: runs-no-reviewed-code
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\'']|\\[^"]|\\"(?:[^"\\]|\\[^"])*\\"|''[^'']*''|'')*?(?:(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s))|(?:\b(?:bash|dash|zsh|sh)(?:\s+-[^\s"\\]+)*?\s+-\w*c\w*|\b(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|\bcmd(?:\.exe)?\s+/[cC]|\beval)\s+(?:\\"(?:[^"\\]|\\[^"])*?|''[^'']*?)(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s))|\\"(?:[^"\\]|\\[^"])*?(?:\$\(|`)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|env(?:\s+-[^\s"\\]+)*?\s+(?:-C|--chdir)(?:=|\s+)[^\s"\\;&|]+(?:\s+-[^\s"\\]+)*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!|corepack)(?:\s+-[^\s"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\"|'')?(?:\s|\\\\\\n)*)*(?:\\"|'')?(?:[^\s"\\;&|='']*/)?(?:(?:npm|pnpm|yarn|bun)(?:\.(?:exe|cmd))?(?:\s+(?:--prefix|-C|--dir|--cwd|--filter|-F|--workspace|-w)(?:=|\s+)[^\s"\\;&|]+|\s+-[^\s"\\]+)*\s+(?:run(?:-script)?|test|tst|t|it|cit|install-test|clean-install-test|start|restart|install|i|ci|add|rebuild|build|exec|x|dlx)\b|yarn(?:\.cmd)?(?:\s+-[^\s"\\]+)*\s*(?=["`;&|)]|\\n)|(?:npx|bunx|pnpx)(?:\.cmd)?\b|(?:jest|vitest|mocha|ava|tsx|ts-node|c8|nyc)\b|(?:node|nodejs|bun)(?:\.exe)?(?![\w.-])(?!(?:\s+-[^\s"\\]+)*?\s+(?:-v|--version|-h|--help|-c|--check)(?![^\s"\\]))(?:(?:\s+-[^\s"\\]+)*?(?:\s+(?:--test|--input-type|--run)(?![\w-])|\s+-(?=[\s"`;&|)<]|\\n)|\s*<|\s*(?=["`;&|)]|\\n))|(?:\s+-[^\s"\\]+)*?\s+(?:-[ep]|--eval|--print)(?:=|\s+)(?:\\"|'')?(?=(?:[^"\\]|\\[^"])*?(?:\bimport\b|\brequire\s*\((?!\s*(?:''[^''\\]*\.json''|\\"[^"\\]*\.json\\")\s*\))))|(?:\s+-[^\s"\\]+)*?\s+(?!(?:\\"|'')?(?:\$\{?CLAUDE_PLUGIN_ROOT\}?|/(?:[^\s"\\;&|'']*/)?review)/(?:[^\s"\\;&|'']*/)?scripts/[^\s"\\;&|''/]+(?:\\"|'')?(?=[\s;&|)`"]|\\n))(?:\\"|'')?(?:[^\s"\\;&|''<>]*\.[cm]?[jt]sx?(?![\w.])|\.{1,2}/|(?:src|test)(?:/|(?=[\s"\\;&|)])))))'
    min: 0
    max: 0
  - name: both-planted-findings-listed
    type: llm
    focus: { source: file, path: .work/eval/findings.md }
    criteria: "The file is the run's persisted findings report, copied byte for byte. PASS only if its ## Findings table has a row for each of the two defects the branch planted: isWeekend in src/calendar.js treating 6 and 7 as the weekend, so Sunday (getDay() returns 0) is missed; and src/export-orders.js writing each customer's raw email address into the CSV export (any wording: personal data, PII, an unmasked or unredacted address). A row of any tier or confidence counts, Act on yes or no. FAIL if either defect appears only under ## Dismissed, ## Unparsed or another section and not as a ## Findings row, if the file is missing or empty, or if the two defects are merged into one row."
