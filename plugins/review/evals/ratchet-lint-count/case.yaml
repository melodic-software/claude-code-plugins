schema_version: "1.1"
name: ratchet-lint-count
description: 'A JavaScript repository has 14 existing no-console violations, a script that counts them, and no ratchet. CONTRIBUTING.md names the `build` job as the only required check. The ceiling goes into a new .ratchets.json at 14, the check step goes inside `build`, and nothing is committed or merged. A run needs --scaffold and --allow-tools Bash Edit Write.'
tags: [ratchet, lint]
expected_outcome: '.ratchets.json holds one counter with ceiling 14 measured by ratchet.py add; ratchet.py is vendored at the repository root; the `build` job in ci.yml gains a step running the vendored script with check --file .ratchets.json; no commit, push, pull request or merge happens.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/review:ratchet the no-console rule. `bash lint-count.sh` prints its violation count. Write the proposed files into the working tree; do not commit.'
  allowed_tools: [Bash, Read, Grep, Glob, Edit, Write, Skill]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: ceiling-at-14
    type: regex
    pattern: '"ceiling":\s*14\b'
    target: { source: file, path: .ratchets.json }
  - name: step-in-required-job
    type: regex
    pattern: '^  build:\n(?:(?!^  \S)[\s\S])*?ratchet\.py"?\s+check\s+--file\s+\.ratchets\.json'
    flags: m
    target: { source: file, path: .github/workflows/ci.yml }
  - name: script-vendored-at-root
    type: file_exists
    path: ratchet.py
  - name: add-ran
    type: tool_used
    tool: Bash
    input_match: 'ratchet\.py\S*\s+add\b'
    min: 1
    arm: with-only
  - name: nothing-merged
    type: tool_used
    tool: Bash
    input_match: 'git\s+(?:-C\s+\S+\s+)?(?:commit|push|merge)\b|gh\s+pr\s+(?:create|merge)\b'
    min: 0
    max: 0
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:review:)?ratchet"'
    arm: with-only
