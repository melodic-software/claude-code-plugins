schema_version: "1.1"
name: fanout-spec-first-email-redaction
context:
  scaffold_script: scaffold.sh
graders:
  - name: spec-before-standards
    type: tool_used
    tool: Write
    input_match: '^(?=.*\.work/reviews/[^"]*\.md")(?=.*## By axis(?:(?!\\n## ).)*### Spec(?:(?!\\n## ).)*### Standards)'
  - name: missing-goal-under-spec
    type: tool_used
    tool: Write
    input_match: '^(?=.*\.work/reviews/[^"]*\.md")(?=.*## By axis(?:(?!\\n## ).)*### Spec(?:(?!### Standards)(?!\\n## ).)*(?:[Rr]edact|REDACT|[Mm]ask|MASK|PII|[Pp]ersonal data))'
  - name: defect-under-standards
    type: tool_used
    tool: Write
    input_match: '^(?=.*\.work/reviews/[^"]*\.md")(?=.*## By axis(?:(?!\\n## ).)*### Standards(?:(?!\\n## ).)*(?:[Ii]sWeekend|[Ww]eekend|WEEKEND|[Ss]unday|SUNDAY))'
