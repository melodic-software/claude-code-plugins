schema_version: "1.1"
name: ratchet-refuses-duration
description: 'The user asks for a CI ceiling on the end-to-end suite''s wall time, 212 seconds. A duration moves with runner load, so the skill refuses it, records no ceiling, and names a count to hold instead (specs run, requests made, queries issued) or says one has to exist first. A run needs --scaffold and --allow-tools Bash Edit Write.'
tags: [ratchet, refusal]
expected_outcome: 'No ratchet.py add runs and no ceilings file is written. The reply says a wall-time ceiling fails with host or runner load rather than with the code, and names a counter that moves only when the code does, or says one must be measured first.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/review:ratchet the end-to-end suite''s wall time. `bash time-e2e.sh` prints seconds=212. Freeze that as a CI ceiling so the suite never gets slower.'
  allowed_tools: [Bash, Read, Grep, Glob, Edit, Write, Skill]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: no-add
    type: tool_used
    tool: Bash
    input_match: 'ratchet\.py\S*\s+add\b'
    min: 0
    max: 0
    arm: both
  - name: no-ceilings-write
    type: tool_used
    tool: Write
    input_match: 'ratchets\.json'
    min: 0
    max: 0
    arm: both
  - name: no-ceilings-file-created
    type: file_exists
    path: .ratchets.json
    exists: false
  - name: names-load-as-the-reason
    type: regex
    pattern: '\b(?:runner|host|machine|CI)\s+(?:load|noise|contention)|moves? with the (?:host|runner|machine)|\bnois[ey]\b|fails? at random|\bflak'
    flags: i
    arm: with-only
  - name: names-a-counter-instead
    type: llm
    criteria: 'PASS only if the final reply declines to set a ceiling on the 212-second wall time and either names a count that changes only when the code changes (specs run, HTTP requests, database queries, process spawns) as the thing to ratchet, or says no ceiling can be set until such a counter exists. FAIL if it records or proposes any duration ceiling, including one with headroom.'
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:review:)?ratchet"'
    arm: with-only
