schema_version: "1.1"
name: una-routes-2fa
graders:
  - name: routes-generate
    type: regex
    pattern: 'wizard:generate\b'
    target: last_message
  - name: no-ps-script
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?\.ps1"'
    min: 0
    max: 0
    arm: 'both'
