schema_version: "1.1"
name: gen-routes-elevated
graders:
  - name: routes-unattended
    type: regex
    pattern: 'wizard:unattended|\bunattended\b|\bresult (?:file|JSON)\b[^\n.;]{0,80}?\bI(?: can|''ll| will) read\b'
    flags: 'i'
    target: last_message
  - name: no-bash-script
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?\.sh"'
    min: 0
    max: 0
    arm: 'both'
