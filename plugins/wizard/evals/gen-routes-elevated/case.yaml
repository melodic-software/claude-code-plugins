schema_version: "1.1"
name: gen-routes-elevated
graders:
  - name: routes-unattended
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:wizard:)?unattended"'
    arm: 'both'
  - name: no-bash-script
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?\.sh"'
    min: 0
    max: 0
    arm: 'both'
