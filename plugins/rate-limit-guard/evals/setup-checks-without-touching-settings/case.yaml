schema_version: "1.1"
name: 'setup-checks-without-touching-settings'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Reads settings files only; never writes settings, pluginConfigs, a wrapper script, or the contract directory'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Reports each row as PASS, FAIL or INFO, or as UNKNOWN for an option whose value still shows its literal user_config token (or a check that could not run in this environment), with one remediation line per FAIL'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Reports each of rate_limit_guard_enabled, model_notices, rate_limit_report_mode, rate_limit_line_threshold, rate_limit_approach_pct, rate_limit_line_data, rate_limit_guard_band and rate_limit_guard_toast as its own row with its value'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Does not tell the person to wire anything into their statusLine: the plugin needs no wiring'
    focus: 'trace'
