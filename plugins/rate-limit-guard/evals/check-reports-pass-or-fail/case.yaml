schema_version: "1.1"
name: 'check-reports-pass-or-fail'
context:
  scaffold_script: scaffold.sh
graders:
  - name: ran-checker
    type: tool_used
    tool: Bash
    input_match: 'prerequisites\.(?:mjs|sh|ps1)(?:\\?"|'')?\s+check\b'
    arm: with-only
  - name: ran-probe-script
    type: tool_used
    tool: Bash
    input_match: '(?:\bbash\s+|"command":")(?:\\?")?[^\s"\\]*scripts/check-mod-load\.sh\b'
    arm: with-only
  - name: no-install
    type: tool_used
    tool: Bash
    input_match: '\b(?:apt-get|apt|brew|winget|dnf|yum|apk|pacman|zypper|snap|choco|scoop|nvm|fnm|volta|asdf|mise|conda|pipx?|npm|pnpm|yarn)\b[^"&;|]*?[ \t](?:install|add|i|-S)\b|\b(?:curl|wget)\b[^"&;|]*?https?://'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: node-row
    type: regex
    pattern: '\b[Nn]ode(?:\.js)?\b[^\n]{0,120}\b(?:PASS|FAIL|WARN)\b|\b(?:PASS|FAIL|WARN)\b[^\n]{0,120}\b[Nn]ode(?:\.js)?\b'
    target: last_message
  - name: mod-row
    type: regex
    pattern: '\b(?:mods?|mods-floor|claude)\b[^\n]{0,120}\b(?:PASS|FAIL|WARN)\b|\b(?:PASS|FAIL|WARN)\b[^\n]{0,120}\b(?:mods?|mods-floor|claude)\b'
    target: last_message
  - name: no-jq-row
    type: regex
    pattern: '\bjq\b[^\n]*\b(?:PASS|FAIL)\b'
    match: not_contains
    target: last_message
