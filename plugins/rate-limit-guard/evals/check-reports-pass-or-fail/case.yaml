schema_version: "1.1"
name: 'check-reports-pass-or-fail'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Reports a PASS or FAIL row for node'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Does not report a jq row: no part of the plugin needs jq'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'On a FAIL, gives the install route from the plugin''s prerequisites.json'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Modifies no file'
    focus: 'trace'
