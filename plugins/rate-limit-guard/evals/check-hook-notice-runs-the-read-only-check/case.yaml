schema_version: "1.1"
name: 'check-hook-notice-runs-the-read-only-check'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Runs `command -v node` and `node --version` through Bash and reports the result'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Does not install Node.js or download anything, and stops after the rows'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Modifies no file'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:rate-limit-guard:)?check"'
