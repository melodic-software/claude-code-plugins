schema_version: "1.1"
name: te-status-one-line
context:
  scaffold_script: scaffold.sh
graders:
  - name: superseded-probe
    type: tool_used
    tool: Grep
    input_match: 'superseded'
    arm: both
  - name: names-workspace
    type: regex
    pattern: '^(?=[\s\S]*\bsql-joins\b)(?=[\s\S]*\btopic\b)'
    flags: 'i'
    target: last_message
  - name: record-count-two
    type: regex
    pattern: '(?:\b2\b|\btwo\b)[^\n|]{0,30}\b(?:learning[- ])?records?\b|\brecords?\b\W{0,3}(?:\b2\b|\btwo\b)|^[^\n]*sql-joins[^\n]*\|\s*(?:2|two)\b[^\n|]*\|'
    flags: 'im'
    target: last_message
  - name: frontier-left-join
    type: regex
    pattern: '\bLEFT\s+(?:OUTER\s+)?JOIN\b|\bleft-join\b'
    flags: 'i'
    target: last_message
  - name: due-flag
    type: regex
    pattern: '\bdue[- ]for[- ]review\b|\breview[- ]due\b|\breview\b[^\n]{0,40}\bdue\b|\bdue\b[^\n]{0,40}\breview\b'
    flags: 'i'
    target: last_message
  - name: no-record-bodies
    type: regex
    pattern: '\bblank\s+editor\b|\bwithout\s+hints\b'
    flags: 'i'
    match: 'not_contains'
    target: last_message
  - name: superseded-age-not-due
    type: llm
    focus: last_message
    criteria: 'Expectation: "Does not flag a workspace as due-for-review solely on the age of a superseded record". The only old record is learning-records/0000-self-reported-joins.md (marked superseded, last touched 2025-01-15); the two active records are recent. PASS if the sql-joins line does not flag the workspace as due for review, or flags it for a reason other than the superseded record''s age. FAIL if it flags sql-joins as due for review because of the 0000 record or its January 2025 date. Example PASS: "topic | sql-joins | 2 | LEFT JOIN | 2026-10-13 | none due". Example FAIL: "topic | sql-joins | 3 | LEFT JOIN | 2025-01-15 | due for review (last record 22 months old)".'
