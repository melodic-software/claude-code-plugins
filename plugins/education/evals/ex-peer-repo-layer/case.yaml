schema_version: "1.1"
name: ex-peer-repo-layer
context:
  scaffold_script: scaffold.sh
graders:
  - name: read-repo-layer
    type: tool_used
    tool: Bash
    input_match: 'parse-concern-value\.sh|conventions/education\.yaml'
  - name: opens-with-definition
    type: regex
    pattern: '^\s*(?:#[^\n]*\n\s*)?[^\n.]{0,60}?\bbackpressure\b(?:\*\*)?\s+(?:is|means|refers to)\b'
    flags: 'i'
    target: last_message
  - name: no-analogy-opener
    type: regex
    pattern: '^\s*(?:#[^\n]*\n\s*)?(?:imagine|think of|picture|it(?:''|’)s like|like a)\b'
    flags: 'i'
    match: 'not_contains'
    target: last_message
  - name: offers-plain-version
    type: regex
    pattern: '\bplain(?:er)? (?:version|one|rung|take|words)\b'
    flags: 'i'
    target: last_message
  - name: no-higher-rung-offer
    type: regex
    pattern: '\bhigh[- ]school\b|\bmore advanced version\b|\bexpert (?:version|rung)\b'
    flags: 'i'
    match: 'not_contains'
    target: last_message
  - name: rung-report-peer-repo
    type: regex
    pattern: 'explain_starting_rung\W{0,4}peer\W{1,4}(?:[^\n]{0,30}?)(?:docs/conventions/education\.yaml|\brepositor(?:y|ies)\b|\brepo\b)[^\n]{0,80}\s*$'
    flags: 'i'
    target: last_message
