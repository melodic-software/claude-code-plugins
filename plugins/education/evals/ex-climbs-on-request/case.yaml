schema_version: "1.1"
name: ex-climbs-on-request
description: "A user who says they know the basics and asks for the real version gets explain climbing the rung ladder, with real terms of art defined as they appear, instead of the rung-1 analogy"
tags: [education, explain, outcome, altitude]
expected_outcome: "The CAP theorem explanation works at a higher rung: it uses terms of art such as linearizability, partition tolerance or PACELC, defines them as it introduces them, and any rung-2 term arrives with a 'you can now say' sentence."
execution:
  prompt: "/education:explain the CAP theorem, and I already know distributed systems basics, give me the real version."
  allowed_tools: [Skill, Read, Glob, Grep]
  max_turns: 8
  timeout_seconds: 300
graders:
  - name: terms-of-art
    type: regex
    pattern: '\b(?:linearizab\w*|PACELC|quorums?|eventual(?:ly)?[- ](?:consistent|consistency)|consensus|split[- ]brain)\b'
    flags: 'i'
    target: last_message
  - name: climbs-rung
    type: llm
    focus: last_message
    criteria: 'Expectation: "Recognizes the explicit request for higher altitude and climbs the rung ladder rather than staying pinned at rung 1". The user said they know distributed-systems basics and asked for the real version of the CAP theorem. PASS if the explanation works at the high-school or peer rung: it states the theorem precisely (during a network partition a system must give up consistency or availability) and works with real terms of art. FAIL if it stays at rung 1: an everyday analogy carries the whole answer and no term of art is used. Example PASS: "CAP says that under a network partition, a replicated store must either refuse some requests (giving up availability) or serve possibly stale reads (giving up linearizable consistency)." Example FAIL: "Imagine three friends keeping a shared shopping list by text message..." with nothing more precise.'
  - name: terms-defined
    type: llm
    focus: last_message
    criteria: 'Expectations: "Introduces real terms of art with definitions as altitude increases rather than assuming them silently" and "Rung-2 terms arrive as vocabulary-ladder entries: the term, an ordinary-words definition, and a modeled ''you can now say'' sentence the user can reuse in their next prompt". PASS if each term of art the reply introduces beyond the theorem''s own three words (for example linearizability, PACELC, quorum) gets a definition where it first appears, and, when the reply presents high-school (rung-2) vocabulary entries, each entry carries a "you can now say" style sentence. A reply that goes to peer level with every introduced term defined passes. FAIL if terms of art appear with no definition, or rung-2 entries lack the modeled sentence. Example PASS: "Linearizability: every read sees the latest completed write, as if there were one copy. You can now say: we need linearizable reads on the balance table." Example FAIL: "Under PACELC, choose PC/EC with quorum reads" with none of those terms defined.'
