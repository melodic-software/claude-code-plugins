schema_version: "1.1"
name: ex-model-override-from-route
description: "A personal-override layer sets the retrieval role's model to opus, so route reports it with basis config and the explorer spawn passes model opus in place of its sonnet pin. multi-agent-stub stands in for the multi-agent plugin and prints that map. A run needs --scaffold --allow-tools Bash,Edit,Write and --ablation none, because the baseline arm cannot dispatch the agent."
tags: [explore, agent-model, multi-agent]
plugins: ["../..", "multi-agent-stub"]
runs: 3
expected_outcome: "The skill runs /multi-agent:route, sees the retrieval role's model opus with basis config, and dispatches discovery:explorer with model opus."
context:
  scaffold_script: scaffold.sh
execution:
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write, Agent]
  max_turns: 40
  timeout_seconds: 1200
graders:
  - name: route-consulted
    type: tool_used
    tool: Skill
    input_match: '"skill":"(?:multi-agent:)?route"'
    min: 1
    arm: with-only
  - name: explorer-with-config-model
    type: tool_used
    tool: Agent
    input_match: '^(?=.*"subagent_type":"discovery:explorer")(?=.*"model":"opus")'
    min: 1
    arm: with-only
