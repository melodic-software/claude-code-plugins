schema_version: "1.1"
name: bs-cards-prompt-fix-and-copy-block
description: 'blindspot SKILL.md "Output format" (and Workflow step 3): with the starting point already given and a codebase-only target, the run returns blindspot cards typed Landmine / History / Convention / Missing concept, each with why it matters and a copyable prompt-fix line, then ONE improved prompt between copy-start and copy-end markers, a one-line scan-scope disclosure, and no EXPLORE.md. A run needs --scaffold; Bash, Write and Edit are listed so the must-not graders can fail when the suite grants them.'
tags: [blindspot, report-shape, must-not]
plugins: ["../.."]
expected_outcome: 'The reply holds blindspot cards for adding partial refunds (for example the reconcile.py caller that zeroes the balance on any refund, the integer-cents history in git, the money.py convention), each card naming its type from the four, why it matters here, and a prompt-fix line; then one improved implementation prompt wrapped in explicit copy-start / copy-end marker lines; then one line saying which lane ran and what was and was not scanned. It writes no EXPLORE.md and edits no source file.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/discovery:blindspot src/payments partial refunds\n\nMy starting point: I know Python and I have shipped Stripe refunds elsewhere, so the refund domain is familiar. I have never opened this repository, its src/payments package or its ledger. Next I want to ask an agent to \"add partial refunds to refund_order\". Take this as my answer to your intake question and go straight to the scan; I will not be around to answer more questions."
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: typed-cards-with-fixes
    type: regex
    pattern: '(?=[\s\S]*\b(?:Landmine|History|Convention|Missing concept)\b)(?=[\s\S]*\bwhy (?:it|this) matters\b)(?=(?:[\s\S]*?\bprompt[- ]?fix\b){2})'
    flags: 'i'
    arm: both
  - name: landmine-card-present
    type: regex
    pattern: '\b(?:Landmine|Missing concept)\b'
    arm: both
  - name: copy-markers-wrap-prompt
    type: regex
    pattern: '(?:copy[ _-]?(?:start|begin)|(?:start|begin)[ _-]?(?:of[ _-])?copy|copy (?:from|below) here)[^\n]*\n[\s\S]*?\S[\s\S]*?(?:copy[ _-]?(?:end|stop)|(?:end|stop)[ _-]?(?:of[ _-])?copy|copy (?:to|above) here)'
    flags: 'i'
    arm: both
  - name: scan-scope-line
    type: regex
    pattern: '^(?=[^\n]*\b(?:scanned|scanning|scan|scope|lanes?)\b)(?=[^\n]*\b(?:codebase|domain)\b)[^\n]+$'
    flags: 'mi'
    arm: both
  - name: no-explore-md-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*EXPLORE[^"]*\.md"'
    min: 0
    max: 0
    arm: both
  - name: no-source-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*(?:src/|tests/)'
    min: 0
    max: 0
    arm: both
  - name: no-shell-write
    type: tool_used
    tool: Bash
    input_match: '(?:\bsed\b(?:(?!\\n)[^;&|])*?\s-[a-zA-Z]*i|\bperl\b(?:(?!\\n)[^;&|])*?\s-\w*i|\b(?:tee|truncate|rm|mv|dd|patch|touch)\b|>)(?:(?!\\n)[^;&|])*?(?:\bsrc/|\btests/|EXPLORE[\w-]*\.md)|\b(?:cp|install|ln)\b(?:(?!\\n)[^;&|])*?\s\S+\s+\S*(?:\bsrc/|\btests/|EXPLORE[\w-]*\.md)|\b(?:python3?|node)\b(?=(?:(?!\\n)[^&|])*?(?:\bsrc/|\btests/|EXPLORE[\w-]*\.md))(?=(?:(?!\\n)[^&|])*?(?:write|unlink|rename|replace\())|\|[ \t]*(?:bash|zsh|sh)\b'
    min: 0
    max: 0
    arm: both
