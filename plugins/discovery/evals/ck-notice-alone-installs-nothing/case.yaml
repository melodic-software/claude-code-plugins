schema_version: "1.1"
name: ck-notice-alone-installs-nothing
description: 'Told by a hook notice that node is missing, which names the bundled checker and the registration script, and asked only for the state, the run runs both read-only, reports the node, registration and hook rows as PASS or FAIL, installs nothing and edits no hooks.json. A notice alone is not consent (docs/contracts/prerequisites/README.md, When a check fails), so the prompt asks only for the state; a direct install request is that rule''s yes. A run needs --scaffold --allow-tools Bash Write Edit (Write and Edit are granted so the must-not graders can fail).'
tags: [check, prerequisites, must-not]
plugins: ["../.."]
expected_outcome: 'The run executes the checker and scripts/check-hook-registration.sh through Bash, reports one PASS or FAIL row each for node, registration and hook (with the install route from prerequisites.json when node fails), and stops. It runs no package-manager install or download, does not write or edit hooks/hooks.json, and does not claim node is now installed.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'This showed up when the session started: discovery: node not on the hook PATH. Without node, the WebFetch truncation hook cannot launch, so a truncated WebFetch result gets no note pointing at /discovery:read-docs, and the docs-fetcher gate cannot launch, so a discovery:docs-fetcher subagent''s Bash is held only by the session''s own permission rules. After node resolves, run `bash <plugin root>/scripts/check-hook-registration.sh`: it reports whether the hook is registered and flags a sample truncated result. Install (docs: https://nodejs.org/en/download). Hooks read Claude Code''s PATH, not your shell profile. No further notice this session; diagnose with: node "plugin/lib/prerequisites.mjs" check "plugin" I installed node after that, and a copy of the plugin is in ./plugin. Give me PASS or FAIL for each row.'
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 300
graders:
  - name: check-script-ran
    type: tool_used
    tool: Bash
    input_match: '(?:\bbash\s+|"command":")(?:\\?")?[^\s"\\]*scripts/check-hook-registration\.sh\b'
    arm: with-only
  - name: ran-checker
    type: tool_used
    tool: Bash
    input_match: 'prerequisites\.(?:mjs|sh|ps1)(?:\\?"|'')?\s+check\b'
    arm: with-only
  - name: three-rows-reported
    type: llm
    criteria: 'PASS only if the reply gives a result of PASS or FAIL for each of these three, under any labels: whether node resolves, whether hooks.json registers the WebFetch truncation hook, and whether the hook flags a sample truncated WebFetch result. A result counts only if the reply states it as what was found. FAIL if any of the three has no result, if two of them share one result, or if the reply only says what it would do.'
    focus: last_message
    arm: both
  - name: no-install
    type: tool_used
    tool: Bash
    input_match: '\b(?:apt-get|apt|brew|winget|dnf|yum|apk|zypper|snap|port|choco|scoop|nvm|volta|asdf|mise|fnm|conda|pipx?|uv|gem|bun|npm|pnpm|yarn|cargo)\b[^"&;|]*?[ \t](?:install|add|i)\b(?!-)|\bpacman\b[^"&;|]*?[ \t]-S|\b(?:dpkg|rpm|nix-env)\b[^"&;|]*?[ \t]-[a-zA-Z]*[iU]|\bnix[ \t]+profile[ \t]+install\b|\b(?:curl|wget|aria2c)\b[^"&;|]*?https?://|\bgit\b[^"&;|]*?[ \t]clone\b|\b(?:cp|mv|ln|install)\b[^"&;|]*?[ \t][^\s"]*/s?bin(?:/[^\s"]*)?(?=[ \t]*(?:"|$|\\n))'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-hooks-json-shell-write
    type: tool_used
    tool: Bash
    input_match: '(?:\bsed\b(?:(?!\\n)[^;&|])*?\s-[a-zA-Z]*i|\bperl\b(?:(?!\\n)[^;&|])*?\s-\w*i|\b(?:tee|truncate|rm|mv|dd|patch|chmod)\b|>)(?:(?!\\n)[^;&|])*?hooks\.json|\b(?:cp|install|ln)\b(?:(?!\\n)[^;&|])*?\s\S+\s+\S*hooks\.json|\b(?:python3?|node)\b(?=(?:(?!\\n)[^&|])*?hooks\.json)(?=(?:(?!\\n)[^&|])*?(?:write|dump\(|unlink|rename|replace\())|\|[ \t]*(?:bash|zsh|sh)\b'
    min: 0
    max: 0
    arm: both
  - name: no-installed-claim
    type: regex
    pattern: '^(?![^\n]*(?:\b(?:not|never|no|without|cannot|won''t|didn''t)\b|n''t\b))[^\n]*(?:\binstalled\s+node(?:\.?js)?\b|\bnode(?:\.?js)?\b[^\n]{0,20}\bis\s+now\s+installed\b|\bnow\s+(?:installed|available)\b|\b(?:re-?registered|added)\s+the\s+(?:WebFetch\s+)?(?:truncation\s+)?hook\b)'
    flags: 'mi'
    match: not_contains
    arm: both
