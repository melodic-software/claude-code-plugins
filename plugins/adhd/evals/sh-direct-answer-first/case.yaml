schema_version: "1.1"
name: sh-direct-answer-first
graders:
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:adhd:)?shape"'
    min: 1
    arm: 'with-only'
  - name: verdict-first-line
    type: regex
    pattern: '^\s*(?:#{1,6}\s*)?(?:\*\*)?(?![^\n]*\?[ \t*]*(?:\n|$))[^\n]{0,60}?\b(?:no|not|unsafe|risky|yes|don(?:''|’)t|do not|avoid|never|only (?:if|after|when))\b'
    flags: 'i'
    target: 'last_message'
  - name: no-preamble-opener
    type: regex
    pattern: '^\s*(?:#{1,6}\s*)?(?:\*\*)?(?:great|sure|certainly|of course|absolutely|happy to|good question|let me|let(?:''|’)s|i(?:''|’)ll|i will|here(?:''|’)s how|here is how|okay|ok\b|alright|got it|(?:adhd|shape|shaping)\b[^\n]*\b(?:on|active|enabled|applied)\b|looking at|first,? some (?:context|background))'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: no-closer-or-recap
    type: regex
    pattern: 'hope (?:this|that|it) helps|let me know if|feel free to|happy to help|anything else\b|good luck|happy coding|(?:^|\n)[ \t]*(?:\*\*)?(?:in summary|to summari[sz]e|to recap|recap|tl;dr)\b'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
