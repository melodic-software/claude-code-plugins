schema_version: "1.1"
name: sh-conflicting-shaper-asks
context:
  history_file: history.jsonl
graders:
  - name: names-caveman
    type: regex
    pattern: '\bcaveman\b'
    flags: 'i'
    target: 'last_message'
  - name: asks-to-pick
    type: regex
    pattern: '\b(?:which (?:one|discipline|style|mode|of (?:the|these) two)|pick|choose|prefer|keep (?:caveman|shap\w*|adhd)|(?:caveman|shap\w*|adhd)\b[^\n?]{0,40}\bor\b[^\n?]{0,40}\b(?:caveman|shap\w*|adhd|the other))\b[^\n?]*\?'
    flags: 'i'
    target: 'last_message'
  - name: no-disable-claim
    type: regex
    pattern: '\bI(?:(?:''|’)ve| have)? (?:just )?(?:disabled|turned off|switched off|stopped|deactivated|removed|overrode|overridden|dropped)\b[^\n.]{0,40}\bcaveman\b|\bcaveman(?: mode)? (?:is|has been) (?:now )?(?:off|disabled|deactivated|removed)\b|\bI(?: can| could| will|(?:''|’)ll) (?:now )?(?:disable|turn off|switch off|deactivate|remove|override|mute)\b[^\n.]{0,40}\bcaveman\b|\blet me (?:disable|turn off|switch off|deactivate|remove)\b[^\n.]{0,40}\bcaveman\b|(?:^|[\n.!?]\s*)(?:disabling|turning off|switching off|deactivating|removing)\s+(?:the\s+)?caveman(?:\s+(?:mode|hook))?(?:\s*(?:[.!\n]|$)|\s+(?:and|now)\b)'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: conflict-before-applying
    type: llm
    criteria: 'The session context holds a hook-injected caveman instruction (drop articles and filler to save tokens), and the user then invoked /adhd:shape. The reply meets the legacy expectations: "Surfaces the conflict before applying the shaping rules, rather than silently activating alongside the terse shaper"; "Names the conflicting source found in session context"; "Asks the user to choose one discipline for the session"; "Does not claim it can mechanically disable the other shaper (advisory only)". It fails if it announces shaping as active before the user picks, or silently applies both disciplines instead of asking the user to pick one.'
    focus: 'last_message'
