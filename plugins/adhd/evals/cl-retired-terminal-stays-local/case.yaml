schema_version: "1.1"
name: cl-retired-terminal-stays-local
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
graders:
  - name: skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:adhd:)?clarify"'
    min: 1
    arm: 'with-only'
  - name: resolver-ran
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|&(`]|(?<!\\\\)\\n|\b(?:bash|zsh|dash|sh)(?:\s|\\t|\\\\(?:\\r)?\\n)+(?:-\S+(?:\s|\\t|\\\\(?:\\r)?\\n)+)*?-\w*c(?:\s|\\t|\\\\(?:\\r)?\\n)+(?:\\"|\x27)))?(?:\s|\\t|\\\\(?:\\r)?\\n)*(?:(?:if|elif|while|until|then|do|else|!|\{)(?:\s|\\t|\\\\(?:\\r)?\\n)+)*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s"\\;&|()]*(?:\s|\\t|\\\\(?:\\r)?\\n)+)*(?:(?:[^\s"\\;&|()]*/)?(?:sudo|npx|exec|time|env|nohup|command|xargs|timeout|nice|stdbuf)(?:\s|\\t|\\\\(?:\\r)?\\n)+(?:(?:-\S+(?:(?:\s|\\t|\\\\(?:\\r)?\\n)+[^-\s"\\;&|()]\S*)?|\d\S*)(?:\s|\\t|\\\\(?:\\r)?\\n)+)*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s"\\;&|()]*(?:\s|\\t|\\\\(?:\\r)?\\n)+)*)?(?:[^\s"\\;&|()]*/)?node(?:\.exe)?(?:\\\\(?:\\r)?\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?view-settings\.mjs(?:\\\\(?:\\r)?\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?\bresolve\b(?:\\\\(?:\\r)?\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?--lane(?:\s|=)+(?:\\"|'')?adhd:clarify\b'
    min: 1
    arm: 'with-only'
  - name: no-convention-read
    type: tool_used
    tool: 'Read'
    input_match: 'rendered-views'
    min: 0
    max: 0
    arm: 'both'
  - name: no-convention-shell-read
    type: tool_used
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?rendered-views'
    min: 0
    max: 0
    arm: 'both'
  - name: retired-notice
    type: regex
    pattern: 'is retired but still keeps the view local\b[^\n]*\bset it in [^\n]+? instead\b'
    flags: 'i'
    target: 'last_message'
  - name: report-line-retired
    type: regex
    pattern: 'view: terminal \(retired ~/\.claude/rendered-views\.md\)'
    flags: 'i'
    target: 'last_message'
  - name: table-in-terminal
    type: regex
    pattern: '\bItem\b[^\n]*\bRecommendation\b[^\n]*\bAlternative\b[^\n]*\bWhat you(?:''|’)re deciding\b'
    flags: 'i'
    target: 'last_message'
  - name: no-html-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?\.html?"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-html-shell-write
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:>>?(?:\s|\\t)*(?:\\"|'')?[^\s"\\;&|<>()]*\.html?\b|(?:(?<=\\n)|(?<=\\t)|(?<![\w\\]))(?:tee|mktemp)\b(?:[^"\\;&|]|\\.)*?\.html?\b)'
    min: 0
    max: 0
    arm: 'both'
