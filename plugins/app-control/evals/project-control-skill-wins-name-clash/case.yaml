schema_version: "1.1"
name: project-control-skill-wins-name-clash
description: A project control-shop skill wins over a plugin skill of the same control-shop name, and the run asks nothing
tags: [drive, control-skill-resolution, unattended]
expected_outcome: "Drive finds the project skill .claude/skills/control-shop, treats any plugin skill named <plugin>:control-shop as the same candidate and loses it to the project skill, reads features/checkout/README.md under the project skill's folder, and writes a report under evidence/ whose steps carry the project code HERON-12, never the code WREN-58, blocking any step it cannot run. It asks nothing."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:drive shop checkout --unattended --out ./evidence"
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: project-drive-steps-in-report
    type: regex
    target: { source: file, path: evidence/report.json }
    pattern: 'HERON-12'
    arm: both
  - name: plugin-skill-steps-not-taken
    type: regex
    target: { source: file, path: evidence/report.json }
    pattern: 'WREN-58'
    match: not_contains
    arm: both
  - name: reads-project-readme
    type: tool_used
    tool: Read
    input_match: '\.claude/skills/control-shop/features/checkout/README\.md'
    min: 1
    arm: both
  - name: loads-no-plugin-control-skill
    type: tool_used
    tool: Skill
    input_match: ':control-shop'
    min: 0
    max: 0
    arm: both
  - name: asks-nothing
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
