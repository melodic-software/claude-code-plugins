schema_version: "1.1"
name: map-refresh-unreached-feature-names-prerequisite-and-command
description: An unattended refresh whose live pass could not reach a feature's only entry point reports it not reached with the unmet prerequisite and the command tried, from drive's blocked entry, never as driven, and classes its prerequisite-free `not driven` reason as doc drift. Source invented, converted from map evals.json id 33. A run needs --scaffold, which seeds the control skill and drive's report
tags: [map, refresh, triage, unattended, invented, routine, no-network]
expected_outcome: "The reply reports the export feature (or its `cli/shop export --env staging` entry point) as not reached or blocked, naming the unmet prerequisite, the staging write grant, and the command tried, `cli/shop export --env staging`, taken from drive's blocked entry in out/billing.export/report.json, and never reports it as driven. Its entry point's `not driven: pending` reason, and the Preconditions line and Gotchas, name no write grant, so it classes that as doc drift whose correction names the staging write grant. Nothing is switched, written or committed in this session."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:map refresh .claude/skills/control-shop --unattended. There is no shell in this session. Read the control skill and the drive report, but do not drive the app, switch branches, write or commit anything. The pass starts on main and `git status --porcelain` prints nothing; treat the decide step as printing `run`. The source wave found no drift. In the live pass Ready passed, and drive ran the export feature once with `--out out/billing.export`, then cleaned up; its report is out/billing.export/report.json. Triage what the passes show and give me the pass's report, then stop."
  allowed_tools: [Read, Glob, Grep]
  max_turns: 15
  timeout_seconds: 500
graders:
  - name: names-prerequisite-and-command
    type: regex
    flags: i
    pattern: '^(?=[\s\S]*cli/shop export --env staging)(?=[\s\S]*(?:write (?:grant|access|permission)s? (?:for|on|to|in) (?:the )?staging|staging(?:''s|’s)? (?:environment )?write (?:grant|access|permission)|(?:grant|permission) to write (?:to )?staging))(?=[\s\S]*(?:\bnot (?:reached|driven)\b|(?<!not )(?<!n''t )(?<!never )\bblocked\b))'
    arm: both
  - name: classes-doc-drift
    type: regex
    flags: i
    pattern: '(?:\b(?:class(?:ification|(?: it| this)? as)?|triage(?:d)?(?: class)?|verdict|class(?:es|ed)(?: it| this| the (?:entry point|reason|line))?(?: as)?|classif(?:y|ies|ied)(?: it| this)?(?: as)?)\b[\s*_`:#>=|—–-]*(?:(?:is|as)\s+)?(?:(?:an?|the)\s+)?[*_`]*doc(?:umentation)?[ -]drift|\b(?:this|it|that)(?:''s|’s| is)\s+(?:an?\s+)?[*_`]*doc(?:umentation)?[ -]drift|\b(?:is|as)\s+(?:an?\s+)?[*_`]*doc(?:umentation)?[ -]drift|(?:^|\n)[ \t#>*_|-]*(?:\d+[.)][ \t]*)?[*_`]*doc(?:umentation)?[ -]drift)'
    arm: both
  - name: never-reports-driven
    type: regex
    flags: i
    match: not_contains
    pattern: '(?<!not )(?<!n''t )(?<!never )\b(?:mark(?:ed|s)?|record(?:ed|s)?|report(?:ed|s)?|list(?:ed|s)?)\s+(?:it|the (?:export )?(?:feature|entry point|step))\s+as\s+[*_`]*driven\b|:[ \t]*[*_`]*driven[*_`]*[ \t]*(?=\n|$)'
    arm: both
