schema_version: "1.1"
name: skills-folder-plugin-keeps-project-source
description: A plugin kept in the repository's skills folder (folder shop-tools, manifest name shopkit) ships the repository's only control skill, control-shop. Drive keeps it as a project control skill, so an unattended run with no app named uses it instead of stopping on a lone plugin match
tags: [drive, control-skill, unattended, regression-guard]
expected_outcome: "Drive reads .claude/skills/shop-tools/skills/control-shop/SKILL.md from disk as the control skill, records its source as project in evidence/report.json, writes no `blocked: plugin control skill` line, never loads a control skill through the Skill tool, and asks nothing."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:drive ready --unattended --out ./evidence"
  allowed_tools: [Read, Glob, Grep, Skill, AskUserQuestion, Bash, Write]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: reads-skill-file
    type: tool_used
    tool: Read
    input_match: '\.claude/skills/shop-tools/skills/control-shop/SKILL\.md'
    min: 1
    arm: both
  - name: source-is-project
    type: regex
    target: { source: file, path: evidence/report.json }
    pattern: '"control_skill":\s*"[^"]*\(project:'
    arm: both
  - name: no-lone-plugin-stop
    type: regex
    target: { source: file, path: evidence/report.json }
    pattern: 'blocked: plugin control skill'
    match: not_contains
    arm: both
  - name: control-skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: 'control-'
    min: 0
    max: 0
    arm: both
  - name: asks-nothing
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
