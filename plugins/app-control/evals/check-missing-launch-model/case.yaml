schema_version: "1.1"
name: check-missing-launch-model
description: Check reports a hub whose Launch does not state whether two instances can run side by side, edits nothing, and gives no verdict word
tags: [map, check, launch]
expected_outcome: "The reply reports that the hub's ## Launch has no Side by side line, in the <rule> | <path> | <detail> form under the launch-model rule, and reports no finding for the Data line, the cart feature or the export feature. No file is written or edited, and the reply gives no overall verdict word."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:map check .claude/skills/control-shop. Report what you find."
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: reports-launch-model-line
    type: regex
    pattern: 'launch-model \| SKILL\.md \| [^\n]*[Ss]ide by side'
    arm: both
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: reports-finding
    type: llm
    criteria: "PASS only if the reply reports that the hub's ## Launch does not say whether two instances can run side by side, does not report the Data line, the cart feature or the export feature as having a problem, and does not say it changed any file. It gives no overall verdict word such as pass, fail, clean, healthy or valid. FAIL if it misses the side-by-side finding, invents a problem in the Data line, cart or export, says it added the line or edited a file, or ends with a verdict such as clean, pass or fail."
