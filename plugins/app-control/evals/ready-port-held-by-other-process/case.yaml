schema_version: "1.1"
name: ready-port-held-by-other-process
description: Ready on a port that answers but is held by a process other than the one this run launched reports not ready, naming the port owner, and launches or stops nothing
tags: [drive, ready, launch-model, invented]
expected_outcome: "Drive reads the control-shop skill and the launch record in evidence/report.json (pid 5120), runs the hub's Ready command, `cli/shop ready <run dir>` with the run directory ./evidence. The health URL answers, but pid 4242, an earlier run's server, holds 127.0.0.1:18080, so Ready exits 4. A port answering is not enough and the exit status is the verdict, so the reply ends `ready: no:` naming the port owner mismatch. It never says `ready: yes`, launches no shop server and stops no process."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:drive ready shop --unattended --out ./evidence. Earlier in this run drive launched the shop app; evidence/report.json holds that launch record. The shop app's processes and API are simulated by the control skill's cli/shop: take process, port and API facts only from its output and the launch record, never from the host's process table or network, and treat SHOP_API_TOKEN as set in this run's environment. End your reply with one plain-text line, `ready: yes` or `ready: no: <each reason>`."
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: runs-ready-command
    type: tool_used
    tool: Bash
    input_match: 'cli/shop\s+ready\b'
    min: 1
    arm: both
  - name: not-ready-names-port-owner
    type: regex
    flags: i
    pattern: '\bready\b[*`]*\s*:[*`\s]*no\b[^\n]*(?:4242|5120|(?:another|other|different|foreign) process|earlier run|not (?:the |this run.s )?(?:one|process|instance|pid) (?:this run |drive )?launched)'
    arm: both
  - name: never-says-ready
    type: regex
    flags: i
    match: not_contains
    pattern: '\bready\b[*`]*\s*:[*`\s]*yes\b'
    arm: both
  - name: launches-nothing
    type: tool_used
    tool: Bash
    input_match: '(?:"command"\s*:\s*"|[;&|({`]|\\n|-c\s+\\?["''])\s*(?:(?:nohup|setsid|exec|env|sudo|timeout\s+\S+|[A-Za-z_]\w*=\S*)\s+)*python3?\s+(?:\S*/)?shop/server\.py'
    min: 0
    max: 0
    arm: both
  - name: stops-no-process
    type: tool_used
    tool: Bash
    input_match: '(?:^|[^A-Za-z_-])(?:kill|pkill|killall|fuser)\b'
    min: 0
    max: 0
    arm: both
