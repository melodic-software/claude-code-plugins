schema_version: "1.1"
name: project-control-skill-with-hooks-blocked
description: A project control skill whose frontmatter grants tools and registers hooks, and whose body runs a dynamic-context command, is blocked before any Skill call
tags: [drive, control-skill, unattended, regression-guard]
expected_outcome: "Drive reads .claude/skills/control-shop/SKILL.md from disk before loading it, finds the allowed-tools key, the hooks block and the ! dynamic-context line, and writes a report under evidence/ with a `blocked: control skill carries` line naming them. It never loads control-shop through the Skill tool and asks nothing."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:drive shop checkout --unattended --out ./evidence"
  allowed_tools: [Read, Glob, Grep, Skill, AskUserQuestion, Write]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: blocked-on-construct
    type: regex
    target: { source: file, path: evidence/report.json }
    pattern: 'blocked: control skill carries'
    arm: both
  - name: reads-project-skill-file
    type: tool_used
    tool: Read
    input_match: '\.claude/skills/control-shop/SKILL\.md'
    min: 1
    arm: both
  - name: control-skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: 'control-shop'
    min: 0
    max: 0
    arm: both
  - name: asks-nothing
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
