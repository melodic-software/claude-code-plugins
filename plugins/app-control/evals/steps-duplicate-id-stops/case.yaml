schema_version: "1.1"
name: steps-duplicate-id-stops
description: Drive stops a feature whose steps file includes one month-picker file twice without prefixes, naming the repeated step id, before launching anything
tags: [drive, steps-files, invented]
expected_outcome: "The reply says the expanded steps repeat the ids open-picker and choose-month, because features/billing/export/pick-month.yaml is included twice with no prefix, names at least one of those ids as repeated, stops the feature before launching or driving anything, and does not rename or drop a step to make the run go."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:drive billing/export --unattended --out ./evidence. Launch nothing and run nothing. Read the control skill and the feature's steps file, expand its includes, and say whether the run can start and what it would perform. Then stop."
  allowed_tools: [Read, Glob, Grep]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: reads-included-steps
    type: tool_used
    tool: Read
    input_match: 'billing/export/pick-month\.yaml'
    min: 1
    arm: both
  - name: names-repeated-id
    type: regex
    flags: i
    pattern: '(repeat|duplicat)[^\n]*(open-picker|choose-month)|(open-picker|choose-month)[^\n]*(repeat|duplicat)'
    arm: both
  - name: stops-before-start
    type: llm
    criteria: "PASS only if the reply (1) says the expanded steps repeat a step id, naming open-picker or choose-month, (2) traces it to features/billing/export/pick-month.yaml being included twice with no prefix, and (3) says the feature does not start: nothing is launched or driven. FAIL if it lists a run that performs both copies anyway, invents prefixes or renames steps itself so the run can go ahead, reports the steps file as fine, or says it launched the app."
