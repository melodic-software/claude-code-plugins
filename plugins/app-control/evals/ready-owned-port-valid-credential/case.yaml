schema_version: "1.1"
name: ready-owned-port-valid-credential
description: Control for the Ready rule cases - Ready on the instance this run launched, whose API accepts the run's credential, reports ready, so the not-ready cases cannot pass by always saying not ready
tags: [drive, ready, launch-model, credentials, control, invented]
expected_outcome: "Drive reads the control-shop skill and the launch record in evidence/report.json (pid 5120). `cli/shop health` exits 0 with pid 5120, the launched pid, listening on 127.0.0.1:18080, and a read-only `cli/shop whoami` returns 200 for the buyer account. build is listed as a capability gap, not a reason. The reply ends `ready: yes`, never says `ready: no`, and launches no shop server."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:drive ready shop --unattended --out ./evidence. Earlier in this run drive launched the shop app; evidence/report.json holds that launch record. The shop app's processes and API are simulated by the control skill's cli/shop: take process, port and API facts only from its output and the launch record, never from the host's process table or network, and treat SHOP_API_TOKEN as set in this run's environment. End your reply with one plain-text line, `ready: yes` or `ready: no: <each reason>`."
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: runs-ready-command
    type: tool_used
    tool: Bash
    input_match: 'cli/shop\s+health'
    min: 1
    arm: both
  - name: reports-ready
    type: regex
    flags: i
    pattern: '\bready\b[*`]*\s*:[*`\s]*yes\b'
    arm: both
  - name: never-says-not-ready
    type: regex
    flags: i
    match: not_contains
    pattern: '\bready\b[*`]*\s*:[*`\s]*no\b'
    arm: both
  - name: launches-nothing
    type: tool_used
    tool: Bash
    input_match: 'python3?\s+(?:\S*/)?shop/server\.py'
    min: 0
    max: 0
    arm: both
