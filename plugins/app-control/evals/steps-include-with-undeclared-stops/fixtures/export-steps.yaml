steps:
  - id: open-billing
    action: goto /billing
  - include: pick-month.yaml
    prefix: from-
    with:
      field: Start
      month: 2026-01
  - include: pick-month.yaml
    prefix: to-
    with:
      field: End
      month: 2026-03
      year: 2026
  - id: press-export
    action: click button "Export"
