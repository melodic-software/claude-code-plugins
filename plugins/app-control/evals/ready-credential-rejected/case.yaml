schema_version: "1.1"
name: ready-credential-rejected
description: Ready on the instance this run launched, whose API rejects the run's credential, reports not ready from the Ready command's exit status, naming the credential failure
tags: [drive, ready, credentials, invented]
expected_outcome: "Drive reads the control-shop skill, its config (credentials.buyer names SHOP_API_TOKEN) and the launch record in evidence/report.json (pid 5120), and runs the hub's Ready command, `cli/shop ready <run dir>` with the run directory ./evidence. It exits 3: pid 5120, the launched pid, holds 127.0.0.1:18080, but the read-only GET /api/me call returns 401 token rejected. A set variable is not a valid credential and the exit status is the verdict, so the reply ends `ready: no:` naming the rejected credential, never says `ready: yes`, and launches no shop server."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:drive ready shop --unattended --out ./evidence. Earlier in this run drive launched the shop app; evidence/report.json holds that launch record. The shop app's processes and API are simulated by the control skill's cli/shop: take process, port and API facts only from its output and the launch record, never from the host's process table or network, and treat SHOP_API_TOKEN as set in this run's environment. End your reply with one plain-text line, `ready: yes` or `ready: no: <each reason>`."
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: runs-ready-command
    type: tool_used
    tool: Bash
    input_match: 'cli/shop\s+ready\b'
    min: 1
    arm: both
  - name: not-ready-names-credential
    type: regex
    flags: i
    pattern: '\bready\b[*`]*\s*:[*`\s]*no\b[^\n]*(?:credential|token|401|whoami|SHOP_API_TOKEN)'
    arm: both
  - name: never-says-ready
    type: regex
    flags: i
    match: not_contains
    pattern: '\bready\b[*`]*\s*:[*`\s]*yes\b'
    arm: both
  - name: launches-nothing
    type: tool_used
    tool: Bash
    input_match: '(?:"command"\s*:\s*"|[;&|({`]|\\n|-c\s+\\?["''])\s*(?:(?:nohup|setsid|exec|env|sudo|timeout\s+\S+|[A-Za-z_]\w*=\S*)\s+)*python3?\s+(?:\S*/)?shop/server\.py'
    min: 0
    max: 0
    arm: both
