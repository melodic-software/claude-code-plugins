schema_version: "1.1"
name: ready-credential-rejected
description: Ready on the instance this run launched, whose API rejects the run's credential, reports not ready, naming the credential failure, after a read-only call that needs the credential
tags: [drive, ready, credentials, invented]
expected_outcome: "Drive reads the control-shop skill, its config (credentials.buyer names SHOP_API_TOKEN) and the launch record in evidence/report.json (pid 5120). `cli/shop health` exits 0 with pid 5120 listening on 127.0.0.1:18080, so the port is this run's. A set variable is not a valid credential, so drive makes one read-only call that needs it, `cli/shop whoami`, which exits 3 with 401 token rejected. The reply ends `ready: no:` naming the rejected credential, never says `ready: yes`, and launches no shop server."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:drive ready shop --unattended --out ./evidence. Earlier in this run drive launched the shop app; evidence/report.json holds that launch record. The shop app's processes and API are simulated by the control skill's cli/shop: take process, port and API facts only from its output and the launch record, never from the host's process table or network, and treat SHOP_API_TOKEN as set in this run's environment. End your reply with one plain-text line, `ready: yes` or `ready: no: <each reason>`."
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: checks-credential
    type: tool_used
    tool: Bash
    input_match: 'cli/shop\s+whoami'
    min: 1
    arm: both
  - name: not-ready-names-credential
    type: regex
    flags: i
    pattern: '\bready\b[*`]*\s*:[*`\s]*no\b[^\n]*(?:credential|token|401|whoami|SHOP_API_TOKEN)'
    arm: both
  - name: never-says-ready
    type: regex
    flags: i
    match: not_contains
    pattern: '\bready\b[*`]*\s*:[*`\s]*yes\b'
    arm: both
  - name: launches-nothing
    type: tool_used
    tool: Bash
    input_match: 'python3?\s+(?:\S*/)?shop/server\.py'
    min: 0
    max: 0
    arm: both
