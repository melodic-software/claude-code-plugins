schema_version: "1.1"
name: check-copied-recipe
description: Check reports a hub Launch section that copies the run-shop recipe instead of naming it, edits nothing, and gives no verdict word
tags: [map, check]
expected_outcome: "The reply reports that the hub's Launch section repeats the run-shop skill's four start steps instead of naming that skill, as a copied-recipe finding in the <rule> | <path> | <detail> form, and does not call the one-command Ready section a copied recipe. No file is written or edited, and the reply gives no overall verdict word."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:map check .claude/skills/control-shop. Bash is not available in this session. Report what you find."
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: names-run-shop
    type: regex
    pattern: 'run-shop'
    arm: both
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: reports-finding
    type: llm
    criteria: "PASS only if the reply reports that the Launch section of .claude/skills/control-shop/SKILL.md copies the steps of the run-shop skill instead of pointing to it, does not report the Ready section's single curl command as a copied recipe, and does not say it changed any file. It gives no overall verdict word such as pass, fail, clean, healthy or valid. FAIL if it misses the copied Launch steps, says it replaced them with a pointer or edited a file, or ends with a verdict such as clean, pass or fail."
