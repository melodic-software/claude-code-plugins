schema_version: "1.1"
name: check-over-size-budget
description: Check reports a feature file over its size budget, edits nothing, and gives no verdict word
tags: [map, check]
expected_outcome: "The reply reports features/cart/README.md under the size-budget rule, in the <rule> | <path> | <detail> form, with its character count and the 4000-character budget, and reports no finding for the hub or the export feature. No file is written or edited, and the reply gives no overall verdict word."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:map check .claude/skills/control-shop. Report what you find."
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: reports-size-budget-line
    type: regex
    pattern: 'size-budget \| features/cart/README\.md \| [0-9,]+ characters, budget 4,?000'
    arm: both
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: reports-finding
    type: llm
    criteria: "PASS only if the reply reports that features/cart/README.md is over its 4000-character size budget, does not report the hub SKILL.md or features/billing/export/README.md as over budget or as having any other problem, and does not say it changed any file. It gives no overall verdict word such as pass, fail, clean, healthy or valid. FAIL if it misses the cart file, invents a problem in the hub or export, says it trimmed or edited a file, or ends with a verdict such as clean, pass or fail."
