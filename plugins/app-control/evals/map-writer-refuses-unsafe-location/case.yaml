schema_version: "1.1"
name: map-writer-refuses-unsafe-location
description: The control-skill writer refuses a location inside a run-<name> recipe directory, falls back to the default control-<app> directory without stopping, and names a feature folder by the slug rule
tags: [map, location, slug, invented]
expected_outcome: The reply refuses .claude/skills/run-storefront/features because a segment starts with run-, names --dir and the value, does not stop, and says the control skill goes to .claude/skills/control-storefront/. It names the folder for `Billing / Export!` features/billing-export. Nothing is written.
execution:
  prompt: "/app-control:map create storefront --dir .claude/skills/run-storefront/features. Do not read the repository or write any file yet. First tell me the directory the control skill will be written to and why, and the folder the feature `Billing / Export!` will get, then stop."
  allowed_tools: [Read, Glob, Grep]
  max_turns: 6
  timeout_seconds: 300
graders:
  - name: slug-folder-name
    type: regex
    pattern: 'features/billing-export'
    arm: both
  - name: default-directory
    type: regex
    pattern: '\.claude/skills/control-storefront'
    arm: both
  - name: no-write-into-recipe
    type: tool_used
    tool: Write
    input_match: 'run-storefront'
    min: 0
    max: 0
    arm: both
  - name: refuses-recipe-directory
    type: llm
    criteria: "PASS only if the reply refuses .claude/skills/run-storefront/features as the control skill's location because it sits in a run-<name> launch recipe's directory (a segment starting with run-), names the --dir value it refused, continues rather than stopping, and says the control skill will go to the default .claude/skills/control-storefront/ instead. FAIL if it accepts the run-storefront location, stops the run over it, or picks a directory other than the default."
