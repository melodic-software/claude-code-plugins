schema_version: "1.1"
name: integrated-app-composes
description: A feature that includes an integrated app's sign-in steps by reference expands them in place from that app's own control skill, and ready checks the identity service at the url that app's committed config names
tags: [drive, integrated-apps, environments, invented]
expected_outcome: "The reply resolves checkouts.identity to checkouts/identity, reads control-identity's steps/sign-in.yaml there, and lists the steps in order as login-open-login, login-fill-user, login-submit (from control-identity) then open-history and check-first-order (from control-shop). Before the first step, ready checks the shop at http://127.0.0.1:8080 and the identity service at http://127.0.0.1:9100, the url taken from control-identity's own committed config, and checks that the app's /health identity field names that url. It launches the identity server with control-identity's own Launch because the local environment runs it locally."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:drive orders/history --out ./evidence. Launch nothing and run nothing. Read the control skills, configs and steps files involved. Treat every config/defaults.json as committed at HEAD. List, in order, the step ids the run expands to and which control skill each comes from, then what ready checks before the first step, with each URL. Then stop."
  allowed_tools: [Read, Glob, Grep]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: reads-identity-steps
    type: tool_used
    tool: Read
    input_match: 'checkouts/identity/\.claude/skills/control-identity/steps/sign-in\.yaml'
    min: 1
    arm: both
  - name: names-prefixed-include
    type: regex
    pattern: 'login-submit'
    arm: both
  - name: checks-identity-service
    type: regex
    pattern: '127\.0\.0\.1:9100'
    arm: both
  - name: composes-integrated-app
    type: llm
    criteria: "PASS only if the reply (1) lists login-open-login, login-fill-user and login-submit, in that order, as coming from control-identity, followed by open-history and check-first-order from control-shop, (2) has ready check the identity service at http://127.0.0.1:9100, taken from control-identity's config, as well as the shop at http://127.0.0.1:8080, and (3) does not copy or rewrite the identity steps into the shop's control skill. FAIL if the included steps keep their unprefixed ids, the identity url is invented or missing, ready checks only the shop, or the reply treats the include as unresolvable."
