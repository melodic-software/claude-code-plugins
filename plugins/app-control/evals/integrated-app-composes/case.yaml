schema_version: "1.1"
name: integrated-app-composes
description: A feature that includes an integrated app's sign-in steps by reference expands them in place from that app's own control skill, and ready checks the identity service at the url that app's committed config names
tags: [drive, integrated-apps, environments, invented]
expected_outcome: "The reply resolves checkouts.identity to checkouts/identity, reads control-identity's steps/sign-in.yaml there, and lists the steps in order as login-open-login, login-fill-user, login-submit (from control-identity) then open-history and check-first-order (from control-shop). The ready object names the environment local and lists the identity service under services at http://127.0.0.1:9100, the url taken from control-identity's own committed config, with whether the app's exposed target matches it; the shop surface is http://127.0.0.1:8080. The checkout matches pins.identity, and login-submit runs identity's cli/ (sign-in shopper) reading IDP_SHOPPER_PASSWORD, not the shop's CLI or variable."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:drive orders/history --out ./evidence. Launch nothing and run nothing. Read the control skills, configs and steps files involved. Treat every config/defaults.json as committed at HEAD, each checkout's working tree as identical to the commit its HEAD names, every step's target as present, and every step that is performed as acting as written. Give each cli step the exact command it runs and the credential variable that command reads. Reply with one fenced JSON block holding the `ready` object and the `steps` list this run's report.json would hold, steps in order, performed or not. Then stop."
  allowed_tools: [Read, Glob, Grep]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: reads-identity-steps
    type: tool_used
    tool: Read
    input_match: 'checkouts/identity/\.claude/skills/control-identity/steps/sign-in\.yaml'
    min: 1
    arm: both
  - name: names-prefixed-include
    type: regex
    pattern: '\{(?=(?:[^{}]|\{[^{}]*\})*"id"\s*:\s*"login-submit")(?:[^{}]|\{[^{}]*\})*\}'
    arm: both
  - name: checks-identity-service
    type: regex
    pattern: '"services"\s*:\s*(?:\[(?:[\s,]|\{(?:[^{}]|\{[^{}]*\})*\})*?\{(?=(?:[^{}]|\{[^{}]*\})*"identity")(?=(?:[^{}]|\{[^{}]*\})*127\.0\.0\.1:9100\b)|\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*?"identity"\s*:\s*\{(?=(?:[^{}]|\{[^{}]*\})*127\.0\.0\.1:9100\b))'
    arm: both
  - name: composes-integrated-app
    type: llm
    criteria: "PASS only if the reply's JSON (1) lists steps with ids login-open-login, login-fill-user and login-submit, in that order, followed by open-history and check-first-order, (2) has a ready object whose services entry for identity carries http://127.0.0.1:9100, taken from control-identity's committed config, and says whether the app's exposed target (its /health identity field or the sign-in redirect) matches it, is not exposed, or was not checked because nothing ran, (3) does not copy or rewrite the identity steps into the shop's control skill, and (4) gives login-submit a command from the identity app's cli/ (such as cli/identity sign-in shopper) reading IDP_SHOPPER_PASSWORD. FAIL if the included steps keep their unprefixed ids, the identity url is invented or missing, ready lists only the shop, the reply treats the include as unresolvable or stops on the pin, or login-submit's command is the shop's CLI or its credential is SHOP_SHOPPER_PASSWORD. Naming SHOP_SHOPPER_PASSWORD only to say login-submit does not read it is not a failure, and neither is reporting the target as matching on the premise that every performed step acts as written."
