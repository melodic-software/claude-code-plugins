schema_version: "1.1"
name: check-dead-index-line
description: Check reports an index line whose feature file does not exist, edits nothing, and gives no verdict word
tags: [map, check]
expected_outcome: "The reply reports that the hub's index line for features/refunds/README.md names a file that does not exist, in the <rule> | <path> | <detail> form, and reports no finding for the cart or export features. No file is written or edited, and the reply gives no overall verdict word."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:map check .claude/skills/control-shop. Bash is not available in this session. Report what you find."
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: reports-index-dead-line
    type: regex
    pattern: 'index-dead \| SKILL\.md \| features/refunds/README\.md'
    arm: both
  - name: writes-nothing
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: edits-nothing
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: reports-finding
    type: llm
    criteria: "PASS only if the reply reports that the index line naming features/refunds/README.md points at a file that does not exist, does not report the cart or export features as having a problem, and does not say it changed any file. It gives no overall verdict word such as pass, fail, clean, healthy or valid. FAIL if it misses the refunds line, invents a problem in cart or export, says it fixed or edited a file, or ends with a verdict such as clean, pass or fail."
