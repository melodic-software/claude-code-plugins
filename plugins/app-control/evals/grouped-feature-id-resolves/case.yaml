schema_version: "1.1"
name: grouped-feature-id-resolves
description: A module-qualified feature id resolves to the grouped feature folder's README.md, and the run launches nothing
tags: [drive, feature-resolution]
expected_outcome: "Drive reads the control-shop skill, resolves the id billing/export to .claude/skills/control-shop/features/billing/export/README.md, reads that file, names it in the answer, and launches nothing."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:drive billing/export --unattended --out ./evidence. Only resolve the feature file and say which file you read and how many entry points it lists. Launch nothing and run nothing."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: reads-grouped-readme
    type: tool_used
    tool: Read
    input_match: 'features/billing/export/README\.md'
    min: 1
    arm: both
  - name: reads-no-legacy-file
    type: tool_used
    tool: Read
    input_match: 'features/billing/export\.md|features/export\.md'
    min: 0
    max: 0
    arm: both
  - name: launches-nothing
    type: tool_used
    tool: Bash
    input_match: 'shop/server\.py'
    min: 0
    max: 0
    arm: both
  - name: asks-nothing
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
