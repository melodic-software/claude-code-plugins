schema_version: "1.1"
name: session-plugin-names-do-not-block-project-match
description: Guards against a wrong stop, not the session-only stop itself. Two plugins kept in the skills folder (manifest names shopkit and otherkit) ship control-shop and an unrelated control-other; drive uses the repository control-shop for shop and writes no session-only blocked line. The eval sandbox loads no session-only plugin, so the stop itself is proven by the headless --plugin-dir check in PR #9615
tags: [drive, control-skill, unattended, regression-guard]
expected_outcome: "Drive reads .claude/skills/shop-tools/skills/control-shop/SKILL.md from disk as the repository control skill for shop, never loads a control skill through the Skill tool, writes a report under evidence/ with no session-only blocked line for shopkit:control-shop or otherkit:control-other, and asks nothing."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:drive ready shop --unattended --out ./evidence"
  allowed_tools: [Read, Glob, Grep, Skill, AskUserQuestion, Bash, Write]
  max_turns: 25
  timeout_seconds: 600
graders:
  - name: reads-project-skill-file
    type: tool_used
    tool: Read
    input_match: '\.claude/skills/shop-tools/skills/control-shop/SKILL\.md'
    min: 1
    arm: both
  - name: no-session-only-stop
    type: regex
    target: { source: file, path: evidence/report.json }
    pattern: 'session-only plugin'
    match: not_contains
    arm: both
  - name: names-shop-skill-in-report
    type: regex
    target: { source: file, path: evidence/report.json }
    pattern: 'control-shop'
    arm: both
  - name: control-skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: 'control-'
    min: 0
    max: 0
    arm: both
  - name: asks-nothing
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
