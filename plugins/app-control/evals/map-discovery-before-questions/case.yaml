schema_version: "1.1"
name: map-discovery-before-questions
description: Create runs discovery over the repository before asking anything, and asks only what the repository cannot answer
tags: [map, create, discovery]
expected_outcome: "The reply reports what discovery found in the repository (start command python3 server.py, port 8080, health endpoint /healthz, mail on every run) before any question, and asks nothing the repository already answered; its questions cover the residue such as the features to seed and the recipient allowlist for password reset mail. Nothing is written."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:map create shop. Bash is not available in this session, so take the README's start command as already proven to start the app. Run discovery, then list every question you would still ask me, each with your recommendation, and stop there without writing anything."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: reads-repository
    type: tool_used
    tool: Read
    input_match: 'README\.md|server\.py|mail\.json'
    min: 1
    arm: both
  - name: names-port
    type: regex
    pattern: '8080'
    arm: both
  - name: asks-only-residue
    type: llm
    criteria: "PASS only if the reply first reports what it found in the repository, including the start command python3 server.py, port 8080 and the /healthz health check, and then lists questions that ask only what the repository cannot show (for example which features to seed, the recipient allowlist or never-send choice for password reset mail, test accounts, write policy). FAIL if any question asks the person for the start command, the port or the health check, or if the reply asks questions without reporting any discovery findings first."
