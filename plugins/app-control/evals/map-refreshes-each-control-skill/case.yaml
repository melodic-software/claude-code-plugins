schema_version: "1.1"
name: map-refreshes-each-control-skill
description: A bare unattended refresh over two control skills refreshes each in turn on its own upkeep branch and returns to the starting branch between them. A run needs --scaffold, which seeds both control skills on main
tags: [map, refresh, branch, unattended, invented]
expected_outcome: "The reply finds both control skills and, without asking which, plans them one after the other: control-admin's correction committed on control-skill-upkeep/control-admin and control-shop's on control-skill-upkeep/control-shop, each branch created from the default branch main's fetched tip (origin/main, FETCH_HEAD), each commit holding only that skill's files and going out in that skill's own pull request. Between the two skills it switches back to main, the branch the pass started on, so the second skill is never refreshed on the first skill's upkeep branch. Nothing is switched, written or committed in this session."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:map refresh --unattended. Read the control skills, but do not drive the app, switch branches, write or commit anything in this session. The pass starts on main. `origin` is the only remote, its default branch is main, and `git fetch origin main` succeeds. There is no shell: `git ls-files` lists every control skill file, and `git status --porcelain --untracked-files=all` from the repository root prints nothing, before and between the two skills. For each control skill, treat the decide step as printing `run` and the source wave and live pass as already run: control-admin's users feature now lives at `/admin/users` (admin/users.py:4), which works, and `/admin/people` returns 404; control-shop's cart button is now labeled `Add to cart` (shop/cart.py:9) and works. Nothing else differs. In order, name each branch you would be on for each control skill, where each commit goes, which pull request each change goes in, and what happens between the two skills, then stop."
  allowed_tools: [Read, Glob, Grep]
  max_turns: 10
  timeout_seconds: 400
graders:
  - name: names-both-branches
    type: regex
    pattern: '^(?=[\s\S]*control-skill-upkeep/control-admin(?![\w-]))(?=[\s\S]*control-skill-upkeep/control-shop(?![\w-]))'
    arm: both
  - name: one-branch-per-skill
    type: llm
    criteria: "The prompt forbids switching, writing or committing, so the reply is a plan and each clause is judged on what it plans; that nothing was executed is expected, never a reason to FAIL. PASS only if the reply (1) plans both control skills in turn without asking which, (2) plans control-admin's correction committed only on control-skill-upkeep/control-admin and control-shop's only on control-skill-upkeep/control-shop, each commit holding only that skill's files, (3) plans each upkeep branch created from the default branch main's tip, or that tip merged into an existing one (main, origin/main, the fetched FETCH_HEAD or 'the fetched default-branch tip' all name this tip; saying it is not a stale local main is correct), and plans each skill its own pull request, opened or updated, or, when it says the pull-request tool is unavailable, says each skill's commit still needs its own pull request, and (4) plans switching back to main, the starting branch, after the first skill and before the second skill's work starts. FAIL if the plan has both skills share one branch or one pull request, if the second skill's branch is created from or merges the first skill's upkeep branch, if the second skill is edited or committed on the first skill's upkeep branch, if it never returns to main between the two skills, or if it stops to ask which skill to refresh."
