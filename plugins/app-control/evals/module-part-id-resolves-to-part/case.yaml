schema_version: "1.1"
name: module-part-id-resolves-to-part
description: An id <module>/<part> with no feature file of its own resolves to the part listed under the module file's Parts, and an unknown part stops, naming where it looked
tags: [drive, feature-resolution, invented]
expected_outcome: "Drive reads the control-repo skill, finds no features/testing/run-e2e/README.md and no features/testing/run-e2e.md, resolves testing/run-e2e to the part run-e2e of .claude/skills/control-repo/features/testing/README.md, and names that file and part. For testing/no-such-part it finds neither file and no such line under that file's ## Parts, stops that id, and names each place it looked. It launches nothing and asks nothing."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:drive repo testing/run-e2e --unattended --out ./evidence, then /app-control:drive repo testing/no-such-part --unattended --out ./evidence-2. Launch nothing and run nothing; stop each run once its feature id is resolved, and show its report lines."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: reads-module-readme
    type: tool_used
    tool: Read
    input_match: 'features/testing/README\.md'
    min: 1
    arm: both
  - name: names-file-and-part
    type: regex
    flags: i
    pattern: 'resolved:\s*`?testing/run-e2e`?\s*->\s*`?([^\s`,]*/)?features/testing/README\.md`?,\s*part\s+`?run-e2e\b'
    arm: both
  - name: unknown-part-blocked
    type: regex
    flags: i
    pattern: 'blocked:[^\n]*features/testing/no-such-part/README\.md[^\n]*features/testing/no-such-part\.md[^\n]*Parts'
    arm: both
  - name: unknown-part-not-resolved
    type: regex
    flags: i
    match: not_contains
    pattern: 'resolved:\s*`?testing/no-such-part'
    arm: both
  - name: launches-nothing
    type: tool_used
    tool: Bash
    input_match: 'app/session\.py'
    min: 0
    max: 0
    arm: both
  - name: asks-nothing
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
  - name: part-resolves-unknown-stops
    type: llm
    criteria: "PASS only if the reply (1) says testing/run-e2e resolved to the part run-e2e listed under ## Parts in features/testing/README.md, because no features/testing/run-e2e/README.md or features/testing/run-e2e.md exists, and (2) says testing/no-such-part matched no feature file and no Parts line, so that id stops, naming at least the paths or the Parts section it looked in. FAIL if it says testing/run-e2e has no feature file and stops, resolves testing/no-such-part to some other part or file, invents a feature file, or says it launched the app."
    arm: both
