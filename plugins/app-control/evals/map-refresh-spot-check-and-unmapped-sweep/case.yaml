schema_version: "1.1"
name: map-refresh-spot-check-and-unmapped-sweep
description: An unattended refresh whose source wave reports a renamed button, citing a line that still shows the old name, and an unmapped route with its source path opens the cited line before the live pass, drops the claim its citation does not support, and reports the route as not mapped with its source path. Source invented. A run needs --scaffold, which seeds the control skill and src/
tags: [map, refresh, source-wave, unattended, invented, routine, no-network]
expected_outcome: "The reply opens src/cart.tsx, finds line 14 still reads `Add to cart`, and drops the source wave's claim that the button was renamed `Add to basket` as unsupported by its citation, proposing no rename. It reports the `/returns` route as a user-facing surface no feature lists, with its source path src/routes/returns.ts. It drives nothing and writes nothing."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:map refresh .claude/skills/control-shop --unattended. There is no shell in this session. The pass starts on main and `git status --porcelain` prints nothing; treat the decide step as printing `run`. The source wave has run, and its tripwire status is unchanged. The cart subagent answered: the `Add to cart` button was renamed `Add to basket`, citing src/cart.tsx:14. The first subagent's unmapped-surface sweep answered: the changed files add a `/returns` page, citing src/routes/returns.ts:5. Carry the pass on up to the start of the live pass, without driving anything, and give me what the report would say so far, then stop."
  allowed_tools: [Read, Glob, Grep]
  max_turns: 15
  timeout_seconds: 500
graders:
  - name: opens-cited-source
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*src/cart\.tsx"'
    min: 1
    arm: both
  - name: drops-unsupported-claim
    type: regex
    flags: i
    pattern: '(?:^|\n)(?=[^\n]*(?:Add to basket|cart\.tsx:14|rename))[^\n]*\b(?:drop(?:ped|s)?|not supported|unsupported|does(?: not|n''t) support|still (?:says|reads|shows|renders)|not (?:confirmed|borne out)|refuted|is false|fail(?:s|ed)? (?:the |its )?spot-check)\b'
    arm: both
  - name: unmapped-with-path
    type: regex
    flags: i
    pattern: '^(?=[\s\S]*/returns\b)(?=[\s\S]*src/routes/returns\.ts)'
    arm: both
  - name: drives-nothing
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:app-control:)?drive"'
    min: 0
    max: 0
    arm: both
