schema_version: "1.1"
name: flat-legacy-feature-id-resolves
description: A feature id with only a legacy flat file resolves to features/<id>.md after the grouped folder is found missing, and the run launches nothing
tags: [drive, feature-resolution, legacy]
expected_outcome: "Drive reads the control-shop skill, finds no features/cart/README.md, resolves the id cart to .claude/skills/control-shop/features/cart.md, reads that file, names it in the answer, and launches nothing."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/app-control:drive cart --unattended --out ./evidence. Only resolve the feature file and say which file you read and how many entry points it lists. Launch nothing and run nothing."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: reads-legacy-file
    type: tool_used
    tool: Read
    input_match: 'features/cart\.md'
    min: 1
    arm: both
  - name: launches-nothing
    type: tool_used
    tool: Bash
    input_match: 'shop/server\.py'
    min: 0
    max: 0
    arm: both
  - name: asks-nothing
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
