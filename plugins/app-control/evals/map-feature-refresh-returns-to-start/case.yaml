schema_version: "1.1"
name: map-feature-refresh-returns-to-start
description: A one-feature refresh started on a ticket branch commits its correction on the upkeep branch, then switches back to the ticket branch before it reports, so the caller resumes where it started
tags: [map, refresh, branch, unattended, invented]
expected_outcome: "The reply commits the cart/total correction on control-skill-upkeep/control-shop, created from main, and opens or updates that skill's pull request. After that, before the pass reports, it switches back to feat/cart-tax, the branch the pass started on, and ends there, never on the upkeep branch. Nothing is switched, written or committed in this session."
execution:
  prompt: "/app-control:map refresh cart/total --unattended. Do not read the repository, drive the app, switch branches, write or commit anything in this session; treat these as facts. The pass starts on feat/cart-tax, a ticket branch with a clean working tree, and /testing:run-e2e called this refresh for a feature its change touched. The repository control skill .claude/skills/control-shop/ holds features/cart/total/README.md. The source wave and live pass already ran: the cart total's handle is now labeled `Total with tax` (src/cart/total.ts:7) and works; the README still says `Total`. Nothing else differs. In order, name each branch you are on, where the commit goes, which pull request it goes in, and which branch you are on when the pass ends, then stop."
  allowed_tools: [Read, Glob, Grep]
  max_turns: 8
  timeout_seconds: 300
graders:
  - name: names-upkeep-branch
    type: regex
    pattern: 'control-skill-upkeep/control-shop(?![\w-])'
    arm: both
  - name: returns-to-ticket-branch
    type: llm
    criteria: "PASS only if the reply (1) commits the cart/total correction on control-skill-upkeep/control-shop, created or updated from main, and sends it through that skill's one upkeep pull request, and (2) switches back to feat/cart-tax after that step and ends the pass on feat/cart-tax. FAIL if it ends the pass on control-skill-upkeep/control-shop or main, commits the correction to feat/cart-tax, or asks anything."
