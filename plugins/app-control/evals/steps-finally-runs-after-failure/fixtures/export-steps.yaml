steps:
  - id: open-billing
    action: goto /billing
  - id: add-test-invoice
    action: click button "New invoice"; fill "Amount" with 1.00; click button "Save"
  - id: press-export
    action: click button "Export"
  - id: check-download
    action: expect download invoices.csv with a row of amount 1.00
  - include: reset.yaml
    finally: true
