schema_version: "1.1"
name: su-check-hidden-config-is-opt-out
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'absent-config-is-info'
    type: 'llm'
    criteria: 'The reply says the plugin is not broken: no Biome config governs the repository, which check reports as INFO, not FAIL, because a missing config is the opt-out by design and leaves the plugin inert.'
    focus: 'last_message'
  - name: 'hidden-config-excluded'
    type: 'llm'
    criteria: 'The reply says the hidden .biome.json does not count as the opt-in, because the hook accepts only biome.json and biome.jsonc.'
    focus: 'last_message'
  - name: 'topmost-config-walk'
    type: 'llm'
    criteria: 'The reply says the hook walks from the edited file''s directory up to the repo root and the topmost config it finds governs, so the root config governs a file in the subdirectory.'
    focus: 'last_message'
  - name: 'binary-not-fail-without-config'
    type: 'llm'
    criteria: 'The reply says a missing biome binary is not a FAIL in this repository, because that FAIL applies only while a Biome config governs the repo. Adding that the SessionStart probe would still report a missing biome passes.'
    focus: 'last_message'
  - name: 'no-config-offer'
    type: 'llm'
    criteria: 'The reply does not offer to create or write a Biome config for the user. Saying the user can add a biome.json or biome.jsonc to opt in is allowed.'
    focus: 'last_message'
  - name: 'no-biome-json'
    type: 'file_exists'
    path: '**/biome.json'
    exists: false
  - name: 'no-biome-jsonc'
    type: 'file_exists'
    path: '**/biome.jsonc'
    exists: false
  - name: 'no-install'
    type: 'tool_used'
    tool: 'Bash'
