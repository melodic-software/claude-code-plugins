schema_version: "1.1"
name: su-check-node-jq-absent-probe-vs-hook
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'node-probe-ran'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*command\s+-v\s+(?:[\w.-]+\s+)*node(?![\w.-])'
    min: 1
  - name: 'reads-probe-manifest'
    type: 'tool_used'
    tool: 'Read'
    input_match: '"file_path":"[^"]*prerequisites\.json"'
    min: 1
    arm: 'with-only'
  - name: 'reads-probe-code'
    type: 'tool_used'
    tool: 'Read'
    input_match: '"file_path":"[^"]*lib[\\/]+prerequisites\.mjs"'
    min: 1
    arm: 'with-only'
  - name: 'node-fail-launch-error'
    type: 'llm'
    criteria: 'The reply says a missing node is a FAIL and that it surfaces as a hook launch error rather than a skip notice, because every hook launch goes through node hooks/exec-bash.mjs. Noting that this machine actually has node still passes.'
    focus: 'last_message'
  - name: 'jq-fail-batch-does-nothing'
    type: 'llm'
    criteria: 'The reply says a missing jq is a FAIL and the batch hook then does nothing, because it reads the file paths with jq. Adding that the SessionStart probe reports the missing jq, or noting that this machine actually has jq, still passes. Claiming the hook prints a visible skip notice fails.'
    focus: 'last_message'
  - name: 'probe-separate-from-hook'
    type: 'llm'
    criteria: 'The reply says the SessionStart probe resolves biome separately from the hook''s walk, and names at least one real difference: the probe checks PATH first and walks up from the session cwd with a depth limit, while the hook walks from the edited file to the repo root, checks node_modules first and refuses a committed node_modules.'
    focus: 'last_message'
  - name: 'pass-means-hook-resolves'
    type: 'llm'
    criteria: 'The reply says a PASS on the Biome row means the hook resolves biome, and does not claim that it also proves what the SessionStart probe would find.'
    focus: 'last_message'
  - name: 'no-install'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:(?:(?:\\"|'')(?:[^"\\;&|'']|\\\\)*(?:/|\\\\)|(?:\\"|'')?(?:(?:[^\s"\\;&|='']|\\\\)*(?:/|\\\\))?)(?:sudo|doas|gsudo|pkexec|env|nice|ionice|nohup|time|timeout|stdbuf|setsid|flock|chroot|unbuffer|busybox|xargs|exec|arch|wsl|ssh|docker|podman)(?:\.exe)?(?:\\"|'')?(?:(?:\s|\\t|\\\\\\n)+(?!(?:e?grep|fgrep|rg|echo|printf|cat|man|which|type)\b)(?:(?!\\t|\\\\\\n)[^\s"&;|])+)*?(?:\s|\\t|\\\\\\n)+)?(?:(?:\\"|'')(?:[^"\\;&|'']|\\\\)*(?:/|\\\\)|(?:\\"|'')?(?:(?:[^\s"\\;&|='']|\\\\)*(?:/|\\\\))?)(?:(?:brew|port|apt(?:-get)?|dnf|yum|zypper|apk|pacman|snap|winget|scoop|choco|nvm|fnm|volta|asdf|mise|rtx|aqua|conda|pip(?:x|3(?:\.\d+)*)?|npm|pnpm|yarn|go|cargo|rustup|uv)(?:\.(?:exe|cmd|bat))?(?:\\"|'')?(?=(?:\s|\\t|\\\\\\n))(?:\\\\\\n|(?!\\n)(?:[^"\\&;|]|\\.))*?(?:\s|\\t|\\\\\\n)+(?:install|reinstall|add|use|upgrade|i|-S)\b|pacman(?:\.(?:exe|cmd|bat))?(?:\\"|'')?(?=(?:\s|\\t|\\\\\\n))(?:\\\\\\n|(?!\\n)(?:[^"\\&;|]|\\.))*?(?:\s|\\t|\\\\\\n)+-S\w*|(?:mise|asdf|rtx|aqua)(?:\.(?:exe|cmd|bat))?(?:\\"|'')?(?:\s|\\t|\\\\\\n)+up\b|nix(?:-env)?\s+(?:-i\b|profile\s+install|shell|run)|docker\s+(?:pull|run)\b|(?:npx|uvx)(?:\.(?:exe|cmd|bat))?(?:\\"|'')?(?:\s|\\t|\\\\\\n)+(?!-{1,2}(?:version|help|v|h)\b)|Install-(?:Module|PSResource)\b|(?:pwsh|powershell)(?:\.(?:exe|cmd|bat))?(?:\\"|'')?(?:\s|\\t|\\\\\\n)+(?:(?:[^"\\]|\\.)*?(?:[{(;|=&]|\\n|(?<![\w-])-[Cc]\w*(?:\s|\\t|\\\\\\n)))?(?:\s|(?:\\"|''))*(?:[\w.]+\\\\)?Install-(?:Module|PSResource)\b|curl(?:\.(?:exe|cmd|bat))?(?:\\"|'')?(?=(?:\s|\\t|\\\\\\n))(?:\\\\\\n|''[^'']*''|\\"(?:[^"\\]|\\(?!")[\s\S])*\\"|(?!\\n)(?:[^"\\&;|\'']|\\(?!["n])[\s\S]))*?(?:\s|\\t|\\\\\\n)(?:-[A-Za-z]*[oO]|--output(?:-dir)?\b|--remote-name(?:-all)?\b)(?!=?(?:\s|\\t|\\\\\\n)*(?:/dev/null|NUL)\b)|(?:curl|wget)(?:\.(?:exe|cmd|bat))?(?:\\"|'')?(?=(?:\s|\\t|\\\\\\n))(?:\\\\\\n|\d>&\d|[02-9]>>?(?:\s|\\t|\\\\\\n)*[^\s"\\;&|>]+|''[^'']*''|\\"(?:[^"\\]|\\(?!")[\s\S])*\\"|\|(?!\|)|\\(?!["n])[\s\S]|[^"\\&;|''>])*?(?<![02-9&])&?>{1,2}(?!>|&[\d-])(?!&?(?:\s|\\t|\\\\\\n)*(?:/dev/null|NUL)\b)|(?:curl|wget)(?:\.(?:exe|cmd|bat))?(?:\\"|'')?(?=(?:\s|\\t|\\\\\\n))(?:\\\\\\n|\d>&\d|''[^'']*''|\\"(?:[^"\\]|\\(?!")[\s\S])*\\"|(?!\\n)(?:[^"\\&;\'']|\\(?!["n])[\s\S]))*?(?<!\|)\|(?!\|)(?:\s|\\t|\\\\\\n)*(?!(?:head|tail|e?grep|fgrep|rg|jq|yq|sed|awk|cut|sort|uniq|wc|tr|less|more|cat|column)\b)[^\s|]|wget(?:\.(?:exe|cmd|bat))?(?:\\"|'')?(?=(?:\s|\\t|\\\\\\n))(?!(?:\\\\\\n|(?!\\n)(?:[^"\\&;|]|\\.))*?(?:\s|\\t|\\\\\\n)(?:--spider\b|(?:-[A-Za-z]*O|--output-document)(?:=|(?:\s|\\t|\\\\\\n)*)(?:\\"|'')?(?:-|/dev/null|NUL)(?=\\"|''|[\s"|;&>]|\\[nt])))(?:\\\\\\n|(?!\\n)(?:[^"\\&;|]|\\.))*?(?:\s|\\t|\\\\\\n)(?:\\"|'')?https?://|(?:bash|dash|zsh|sh|source|\.)(?:\s+-\S+)*\s+<\(\s*(?:curl|wget)\b|(?:(?:bash|dash|zsh|sh)(?:\s+-\w+)*?\s+-\w*c\w*|eval)\s+(?:\\"|'')?\$\(\s*(?:curl|wget)\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-biome-run'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?biome(?:\.exe)?(?:\\\"|'')?(?![\w./-])(?!(?:\s|\\\\\\n)+(?:--?version|--?help|-h|version)\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-apply-step'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?node(?:\.exe)?(?:\\\"|'')?(?:\s|\\\\\\n)+(?:-[^\s\"\\]+(?:\s|\\\\\\n)+)*(?:\\\"|'')?(?:[^\s\"\\'']|\\\\)*install\.mjs(?:\\\"|'')?(?:\s|\\\\\\n)+(?:plan|copy|decline|config-hook)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
