schema_version: "1.1"
name: su-check-gitignored-option-not-a-defect
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'verify-ran'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?node(?:\.exe)?(?:\\\"|'')?(?:\s|\\\\\\n)+(?:-[^\s\"\\]+(?:\s|\\\\\\n)+)*(?:\\\"|'')?(?:[^\s\"\\'']|\\\\)*install\.mjs(?:\\\"|'')?(?:\s|\\\\\\n)+verify\b'
    min: 1
    arm: 'with-only'
  - name: 'effective-values'
    type: 'llm'
    criteria: 'The reply reports the effective values of both javascript_format_enabled (true by default) and javascript_format_lint_gitignored (false by default).'
    focus: 'last_message'
  - name: 'empty-means-default'
    type: 'llm'
    criteria: 'The reply says an unexpanded or empty value means the option''s default, and does not treat it as a failure.'
    focus: 'last_message'
  - name: 'not-a-defect'
    type: 'llm'
    criteria: 'The reply says the untouched file is not a defect: by default the hook leaves a gitignored file alone, so .work/scratch.ts was skipped.'
    focus: 'last_message'
  - name: 'opt-in-route'
    type: 'llm'
    criteria: 'The reply names setting javascript_format_lint_gitignored to true as the way to act on gitignored files, through the plugin''s own settings flow: /plugin configure, or a headless route it takes from or points at in the plugin-reconfiguration convention.'
    focus: 'last_message'
  - name: 'biome-json-not-the-route'
    type: 'llm'
    criteria: 'The reply says changing biome.json is not how to get gitignored files rewritten, since the skip comes from the plugin option. Telling the user to edit biome.json for this fails.'
    focus: 'last_message'
