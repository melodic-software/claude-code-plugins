schema_version: "1.1"
name: ck-check-gate-fail-verbatim
context:
  scaffold_script: scaffold.sh
graders:
  - name: ran-gate
    type: tool_used
    tool: Bash
    input_match: 'check-skill\.sh'
    arm: with-only
  - name: fail-line-verbatim
    type: regex
    pattern: 'FAIL: broken skill-internal ref: reference/style-guide\.md|\bFAIL\b[^\n]*\n(?:[^\n]*\n){0,3}?[^\n]*broken skill-internal ref: reference/style-guide\.md \(no such file under the skill dir; cited at SKILL\.md:8'
    target: last_message
  - name: reports-fail-verdict
    type: regex
    pattern: 'CHECK-SKILL my-skill: FAIL|\bmy-skill\b[^\n]{0,40}\bFAIL(?:ED|S)?\b|\bFAIL(?:ED|S)?\b[^\n]{0,20}\bmy-skill\b|\b(?:Verdict|verdict|Result|result|Status|status)\b\W{0,6}FAIL(?:ED|S)?\b'
    target: last_message
  - name: warns-after-fails
    type: regex
    pattern: 'broken skill-internal ref: reference/style-guide\.md[\s\S]*?(?:\bWARN\b|\b[Ww]arnings?\b|\b[Aa]dvisory\b)[\s\S]*?(?:\bGotchas\b|\bdisable-model-invocation\b)'
    target: last_message
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
