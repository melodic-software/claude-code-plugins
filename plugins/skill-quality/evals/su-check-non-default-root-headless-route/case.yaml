schema_version: "1.1"
name: su-check-non-default-root-headless-route
context:
  scaffold_script: scaffold.sh
graders:
  - name: counts-two-skills
    type: regex
    pattern: 'packages/agent/skills\b[^\n]{0,80}?(?<!rung )(?<!rung #)\b(?:2|two)\b[^\n]{0,20}\b(?:skills?|SKILL\.md)\b|(?<!rung )(?<!rung #)\b(?:2|two)\s+(?:child\s+)?(?:skills?|`?SKILL\.md`?\s+files?)\b[^\n]{0,60}packages/agent/skills'
    flags: 'i'
    target: last_message
  - name: no-ask
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
  - name: configure-route
    type: regex
    pattern: '(?:/plugin|claude plugin) configure skill-quality@\S+'
    target: last_message
  - name: values-skills-root
    type: regex
    pattern: '\bskills_root\b[^\n]{0,40}?\bpackages/agent/skills\b'
    target: last_message
  - name: names-reconfiguration-convention
    type: regex
    pattern: '\bplugin-reconfiguration\b|\bverified-version record\b'
    flags: 'i'
    target: last_message
  - name: fresh-session
    type: regex
    pattern: '\b(?:fresh|new|next)\s+(?:Claude(?: Code)?\s+)?session\b|\brestart\w*\s+(?:Claude(?: Code)?|the session|your session)\b'
    flags: 'i'
    target: last_message
  - name: routes-through-claude-code
    type: llm
    focus: last_message
    criteria: "PASS only if the reply verifies packages/agent/skills as the skills root with its skill count, without asking the user to confirm first; routes the persistent skills_root change through Claude Code's native configure flow for skill-quality@<marketplace> (interactive /plugin configure or a headless route), setting skills_root to packages/agent/skills; points at the marketplace's plugin-reconfiguration convention for the headless routes; never prescribes `claude plugin uninstall` to reconfigure; and says to verify by rerunning check in a fresh session. Explaining the one-run CHECK_SKILL_SKILLS_ROOT override is optional. FAIL if it edits or proposes editing settings.json, settings.local.json or pluginConfigs directly, says it changed the setting itself, exports or persists CHECK_SKILL_SKILLS_ROOT (a shell profile, settings env or .envrc), prescribes uninstall then reinstall, or leaves out any route requirement above."
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
