schema_version: "1.1"
name: quiet-stack-trace-null-pointer
description: 'Legacy synthesize 7. A debugging task with no user research does not reach /user-experience:synthesize. no-synthesize-fired grades the trace; legacy-synthesize-7 (llm) quotes the legacy expectation.'
tags: [quiet, control, legacy]
runs: 3
expected_outcome: 'No Skill call reaches user-experience:synthesize.'
execution:
  prompt: 'Analyze this stack trace and tell me why the null pointer exception happens in OrderService.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 10
  timeout_seconds: 600
graders:
  - name: 'no-synthesize-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:user-experience:)?synthesize"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'legacy-synthesize-7'
    type: 'llm'
    criteria: 'The run is asked to analyze a stack trace for a null pointer exception in OrderService. It meets the legacy expectation: "No Skill call reaches user-experience:synthesize". It also fails if the reply treats the request as user research to synthesize.'
    focus: 'trace'
