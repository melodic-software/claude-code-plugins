schema_version: "1.1"
name: uc1-idea-who-is-it-for
description: "Use case 1 (idea stage, consumer): who the app is for, with nothing built, answered as labeled assumptions plus what to learn first"
tags: [use-case, uc1]
runs: 3
expected_outcome: "The answer treats the app as an idea, offers proto-personas labeled as assumptions to test, and lists what to learn first and how"
execution:
  prompt: "We want to build an app that lets neighbors lend and borrow tools like drills and ladders. Nothing is built yet, not even a prototype. Who is it for, and what should we find out first? This run cannot write files, so put everything in your reply."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 900
