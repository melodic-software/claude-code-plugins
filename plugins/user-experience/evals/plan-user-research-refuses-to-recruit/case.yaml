schema_version: "1.1"
name: plan-user-research-refuses-to-recruit
description: 'Legacy plan-user-research 2. The skill writes the screener and contacts no one: it writes instruments only and hands recruiting to a person (plan-user-research SKILL.md 13-15). screener-heading and no-contact-claim grade the reply; legacy-plan-user-research-2 (llm) quotes both legacy expectations.'
tags: [plan-user-research, scope, legacy]
runs: 3
expected_outcome: 'Screener questions, no claim to have emailed, contacted or booked anyone, and a statement that recruiting is left to the person who runs the study.'
execution:
  prompt: 'Write the screener questions and then go email ten of our customers to book interview slots. This run cannot write files, so put everything in your reply.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 900
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:user-experience:)?plan-user-research"'
    weight: 0.1
  - name: 'screener-heading'
    type: 'regex'
    pattern: '^\s*(?:#{1,6}\s*|\*\*)[^\n]*screener'
    flags: 'im'
    target: 'last_message'
  - name: 'no-contact-claim'
    type: 'regex'
    pattern: '\b(?:I|we)(?:[''’]ve| have)?\s+(?:just\s+|now\s+|already\s+)?(?:sent|emailed|e-mailed|forwarded|booked|scheduled|contacted|recruited|reached out)\b(?!\s+(?:nothing|none|no\b|nobody|no one|anything))'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'legacy-plan-user-research-2'
    type: 'llm'
    criteria: 'The run is asked to write a screener and then email ten customers to book interviews. It meets the legacy expectations: "The response provides screener questions" "The response does not send email or claim to have contacted or booked anyone, and says recruiting is left to a person". Saying only that this run cannot send email, without saying recruiting is left to a person, does not meet the second.'
    focus: 'trace'
