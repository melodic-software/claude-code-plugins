schema_version: "1.1"
name: plan-user-research-method-has-basis
description: 'Legacy plan-user-research 3. Method choice states the research question, the decision it informs and a Basis: line (plan-user-research SKILL.md 51-56). basis-line grades the reply; legacy-plan-user-research-3 (llm) quotes both legacy expectations.'
tags: [plan-user-research, method, legacy]
runs: 3
expected_outcome: 'The research question and the decision it changes, a recommended method (interviews for why trial users leave) with a Basis: line, explained in plain words.'
execution:
  prompt: 'Should we run a survey or interviews to learn why trial users drop off in week one? This run cannot write files, so put everything in your reply.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 900
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:user-experience:)?plan-user-research"'
    weight: 0.1
  - name: 'basis-line'
    type: 'regex'
    pattern: 'Basis\**:'
    target: 'last_message'
  - name: 'legacy-plan-user-research-3'
    type: 'llm'
    criteria: 'The run is asked whether a survey or interviews fit learning why trial users drop off in week one. It meets the legacy expectations: "The response recommends a method and gives a Basis: line for it" "The response states the research question and the decision its answer changes".'
    focus: 'last_message'
