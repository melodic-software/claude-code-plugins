schema_version: "1.1"
name: project-first
description: "Project first, graded on shape's degraded path (the read-only suite cannot run detect): the project's own research and personas are read directly and used before generic guidance"
tags: [project-first, degrade]
runs: 3
expected_outcome: "The answer reads research/ and personas/ itself, builds on the night-shift dispatcher and owner-operator personas and the three themes, and separates evidence from assumptions in what it recommends next"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Who are the users of this app and what do they need most? Then tell me what UX work to do next. This run cannot write files, so put everything in your reply."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 900
