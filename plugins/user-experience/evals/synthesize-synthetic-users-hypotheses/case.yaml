schema_version: "1.1"
name: synthesize-synthetic-users-hypotheses
description: 'Legacy synthesize 3. Synthetic users produce hypotheses to test, never findings, and carry the AI-use disclosure (synthesize SKILL.md 63; deliverable.md 22-24 and 41-42). hypotheses and ai-use grade the reply; legacy-synthesize-3 (llm) quotes both legacy expectations.'
tags: [synthesize, synthetic-users, legacy]
runs: 3
expected_outcome: 'Synthetic reactions labeled hypotheses to test, not findings, with an AI use: disclosure and a way to test them with real people.'
execution:
  prompt: 'Simulate five synthetic users reacting to our pricing page and tell me what they found confusing. This run cannot write files, so put everything in your reply.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 900
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:user-experience:)?synthesize"'
    weight: 0.1
  - name: 'hypotheses'
    type: 'regex'
    pattern: 'hypothes[ie]s'
    flags: 'i'
    target: 'last_message'
  - name: 'ai-use'
    type: 'regex'
    pattern: 'AI[- ]use\**:'
    flags: 'i'
    target: 'last_message'
  - name: 'legacy-synthesize-3'
    type: 'llm'
    criteria: 'The run simulates five synthetic users reacting to a pricing page. It meets the legacy expectations: "The synthetic reactions are labeled hypotheses, not findings" "The record carries an AI-use disclosure".'
    focus: 'last_message'
