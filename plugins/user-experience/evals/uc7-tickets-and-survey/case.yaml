schema_version: "1.1"
name: uc7-tickets-and-survey
description: "Use case 7 (live): summarize support tickets and open survey answers into themes traced to their sources, with AI-suggested codes and no identifying data"
tags: [use-case, uc7]
runs: 3
expected_outcome: "Themes traced to ticket and survey ids with counts, offered as AI-suggested codes for a person to review, carrying an AI-use disclosure and no names or emails"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Summarize the support tickets and survey answers in research/ for our product team: what are the main themes, and how strong is each? This run cannot write files, so put everything in your reply."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 900
