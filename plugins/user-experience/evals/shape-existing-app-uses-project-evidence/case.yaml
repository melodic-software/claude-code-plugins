schema_version: "1.1"
name: shape-existing-app-uses-project-evidence
description: 'Legacy shape 2. For a shipping app with a research folder and an analytics SDK, shape states the stage as existing with those signals, lists the research as evidence and skips new research because the interview notes cover it (shape SKILL.md 46-55 and 82-83). The read-only suite cannot run detect, so shape takes its degraded path (shape SKILL.md 37-40). The scaffold writes the folder and package.json the legacy prompt describes. stage-existing and reads-notes grade the reply, no-new-research the trace; legacy-shape-2 (llm) quotes the three legacy expectations.'
tags: [shape, existing, project-first, legacy]
runs: 3
expected_outcome: 'Stage stated as existing (mixpanel in package.json, research/ notes), research/onboarding-interviews.md listed as evidence before any new research, no plan-user-research call, and the notes handed to synthesis for onboarding needs.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Our app already ships and the repo has a research/ folder with onboarding interview notes and mixpanel in package.json. Who are our users and what do they need from onboarding? This run cannot write files, so put everything in your reply.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 900
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:user-experience:)?shape"'
    weight: 0.1
  - name: 'stage-existing'
    type: 'regex'
    pattern: '\bstage\b\W{0,6}(?:is\s+)?\W{0,4}existing\b'
    flags: 'i'
    target: 'last_message'
  - name: 'reads-notes'
    type: 'regex'
    pattern: 'onboarding-interviews'
    flags: 'i'
    target: 'last_message'
  - name: 'no-new-research'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:user-experience:)?plan-user-research"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'legacy-shape-2'
    type: 'llm'
    criteria: 'The run is asked who a shipping app''s users are and what they need from onboarding; the repository has research/onboarding-interviews.md and mixpanel-browser in package.json. It meets the legacy expectations: "The response states the stage as existing and cites the analytics SDK or the research folder as a signal" "The response lists the project''s research folder as evidence before recommending any new research" "The response says the existing interview notes cover the research step instead of planning new interviews".'
    focus: 'last_message'
