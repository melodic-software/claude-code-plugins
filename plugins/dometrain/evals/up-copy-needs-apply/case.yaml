schema_version: "1.1"
name: up-copy-needs-apply
graders:
  - name: 'ran-update'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?!(?:[^"\\]|\\.)*?--apply)(?:(?:[^"\\]|\\.)*?(?:[;&|(`]|\\n))?\s*(?:\w+=\S*\s+)*(?:(?:\S*/)?(?:bash|sh)\s+(?:-\S+\s+)*)?\\?["\x27]?(?:[^\s=]*/)?update\.sh(?![\w.])'
    min: 1
    arm: 'with-only'
  - name: 'no-apply'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?update\.sh(?![\w.])(?:\\"|\x27)?(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?--apply'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-vendor-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:skills/update/vendor/|grounding/SKILL\.md")'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-vendor-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:skills/update/vendor/|grounding/SKILL\.md")'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-shell-vendor-write'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:(?<=[\s"])&?>>?(?!&)[ \t]*(?:\\")?[^\s;|&"\\]*(?:vendor/SKILL|grounding/SKILL)\.md|\b(?:tee|truncate)\b(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:vendor/SKILL|grounding/SKILL)\.md|\bsed\b(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:\s-[a-zA-Z]*i(?![a-zA-Z])|\s--in-place)(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:vendor/SKILL|grounding/SKILL)\.md|\bperl\s+-[a-zA-Z]*i(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:vendor/SKILL|grounding/SKILL)\.md|\b(?:cp|mv|install)\s(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?\s(?:\\")?[^\s;|&"\\]*(?:vendor/SKILL|grounding/SKILL)\.md(?:\\")?(?=\s*(?:[;&|"]|\\n))|\b(?:curl|wget)\b(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:\s-[a-zA-Z]*[oO][ \t]*|\s--output(?:-document)?[= ][ \t]*)(?:\\")?(?![a-z]+://)[^\s;|&"\\]*(?:vendor/SKILL|grounding/SKILL)\.md)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'points-maintainer-path'
    type: 'regex'
    pattern: '(?<![\w-])--apply\b|\bmaintainers?\b|\bworking clone\b|\bcontext/update\.md\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-refresh-claim'
    type: 'regex'
    pattern: '(?<!n[''’]t )(?<!\bnot )(?<!\bnever )(?<!\bbe )\b(?:refreshed|updated|overwrote|overwritten|re-?synced|replaced)\s+(?:the\s+|our\s+|your\s+)?(?:vendor(?:ed)?\s+)?(?:baseline|copy|snapshot|vendor/SKILL\.md)\b|(?<!\bonce the )(?<!\buntil the )(?<!\bafter the )(?<!\bwhen the )(?<!\bif the )\bbaseline\s+(?:is\s+|was\s+|has\s+been\s+)?(?:now\s+)?(?:refreshed|updated|overwritten)\b'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'reports-fetch-failure'
    type: 'regex'
    pattern: '(?<!\bwould )(?<!\bwill )(?<!\bcan )(?<!\bmay )(?<!\bmight )(?<!\bcould )\bexit(?:ed)?(?:\s+(?:with\s+)?[`*]*(?:code|status))?\b[\s:|=*`]*(?:(?:of|was|is|with)\s+)?[`*]*2\b(?![`*]*\s*(?:means\b|=|is for\b|stands for\b|indicates\b|signals\b|would\b|if\b|when\b))|\b(?:result|state|status|verdict|outcome)\s*(?:is\s+|was\s+|:\s*|=\s*|-\s*|—\s*)?[`*]*unverifiable\b|(?<!\b2 )\b(?:is|was|came back|reported|reports|returned)\s+[`*]*unverifiable\b|\b(?:fail|failed|failure|fails)\s+(?:to\s+)?(?:fetch|download|reach)\b|(?<!\bif the )(?<!\bwhen the )(?<!\bmean the )(?<!\bmeans the )\bfetch\s+failed\b|\bcould(?:n[''’]t| not)\s+(?:fetch|reach|download|connect to)\b|\b(?:there is|there[''’]s|has|with)\s+no network\b|\bnetwork (?:access\s+)?(?:is\s+|was\s+)?(?:unavailable|blocked|denied|disabled)\b'
    flags: 'i'
    target: 'last_message'
