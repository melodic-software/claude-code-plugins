schema_version: "1.1"
name: x-share-link-rebuild
graders:
  - name: 'routes-x-read'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:x:)?read"'
    arm: 'with-only'
  - name: 'uses-xtomd'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?=(?:[^"\\]|\\.)*?xtomd\.com/api/(?:markdown|fetch)\b)(?=(?:[^"\\]|\\.)*?https://x\.com/fakehandle/status/1234567890123456789(?![0-9?&]))'
    min: 1
    arm: 'both'
  - name: 'no-token-shell'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|&(`]|(?<!\\\\)\\n|\b(?:bash|zsh|dash|sh)(?:\s|\\t|\\\\(?:\\r)?\\n)+(?:-\S+(?:\s|\\t|\\\\(?:\\r)?\\n)+)*?-\w*c(?:\s|\\t|\\\\(?:\\r)?\\n)+(?:\\"|\x27)))?(?:\s|\\t|\\\\(?:\\r)?\\n)*(?:(?:if|elif|while|until|then|do|else|!|\{)(?:\s|\\t|\\\\(?:\\r)?\\n)+)*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s"\\;&|()]*(?:\s|\\t|\\\\(?:\\r)?\\n)+)*(?:(?:[^\s"\\;&|()]*/)?(?:sudo|npx|exec|time|env|nohup|command|xargs|timeout|nice|stdbuf)(?:\s|\\t|\\\\(?:\\r)?\\n)+(?:(?:-\S+(?:(?:\s|\\t|\\\\(?:\\r)?\\n)+[^-\s"\\;&|()]\S*)?|\d\S*)(?:\s|\\t|\\\\(?:\\r)?\\n)+)*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s"\\;&|()]*(?:\s|\\t|\\\\(?:\\r)?\\n)+)*)?(?:[^\s"\\;&|()]*/)?(?:curl|wget|xh|http|python3?|node)\b(?:\\\\(?:\\r)?\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?AbCdEfGhIjKlMnOp'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-token-webfetch'
    type: 'tool_used'
    tool: 'WebFetch'
    input_match: '"url":"(?:[^"\\]|\\.)*?AbCdEfGhIjKlMnOp'
    min: 0
    max: 0
    arm: 'both'
