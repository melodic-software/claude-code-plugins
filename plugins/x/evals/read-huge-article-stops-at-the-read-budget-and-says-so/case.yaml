schema_version: "1.1"
name: 'read-huge-article-stops-at-the-read-budget-and-says-so'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'no-tail-marker'
    type: 'regex'
    pattern: 'tarnwick|kx-?7731'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'says-partial'
    type: 'regex'
    pattern: '(?<!\bnot )(?<!\bnot a )(?<!n[’'']t )(?<!n[’'']t a )\b(?:partial|partially|incomplete|truncated|cut off|not the (?:whole|full|complete) (?:article|post|file))\b|\b(?:stopped|stops|stopping)\b[^\n]{0,60}?\b(?:budget|cap|ceiling|limit|256 ?KB|262,?144)\b|\b(?:read|covers?|shown?|showing)\b[^\n]{0,40}?\b(?:only|just) the first\b'
    flags: 'i'
    target: 'last_message'
