schema_version: "1.1"
name: 'read-nonzero-curl-exit-is-a-failure-despite-a-200'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Checks curl''s exit status before the HTTP code and before validating the body'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Does not read the spool file when the exit status is nonzero'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Never reports a truncated prefix as a complete post merely because it parses as Markdown'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Deletes the spool on the failure path'
    focus: 'trace'
