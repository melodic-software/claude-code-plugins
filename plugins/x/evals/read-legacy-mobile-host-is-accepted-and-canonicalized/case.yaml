schema_version: "1.1"
name: 'read-legacy-mobile-host-is-accepted-and-canonicalized'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Accepts the mobile.twitter.com host form rather than refusing it at the gate'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Rebuilds to the canonical https://x.com/<handle>/status/<id> form'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'The legacy host never appears in the emitted command or the attribution'
    focus: 'trace'
  - name: 'no-legacy-host-in-command'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'mobile\.twitter\.com'
    min: 0
    max: 0
    arm: 'both'
