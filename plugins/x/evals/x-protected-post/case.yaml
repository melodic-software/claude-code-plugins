schema_version: "1.1"
name: x-protected-post
graders:
  - name: 'says-unreachable'
    type: 'regex'
    pattern: '\b(?:protected|private)\b[^\n]{0,160}?(?:\bcan(?:not|[’'']t)\b|\bcan not\b|\bunable\b|\bunreachable\b|\binaccessible\b|\bno (?:converter|tool|service|way)\b|\bnot (?:be )?(?:reachable|readable|accessible|available|public|visible)\b|\bonly (?:visible|available) to\b|\brequires? (?:a |an )?(?:login|sign[- ]in|account)\b|\bwon[’'']t (?:work|return|reach)\b)|(?:\bcan(?:not|[’'']t)\b|\bcan not\b|\bunable\b|\bunreachable\b|\binaccessible\b|\bno (?:converter|tool|service|way)\b|\bnot (?:be )?(?:reachable|readable|accessible|available|public|visible)\b|\bonly (?:visible|available) to\b|\brequires? (?:a |an )?(?:login|sign[- ]in|account)\b|\bwon[’'']t (?:work|return|reach)\b)[^\n]{0,160}?\b(?:protected|private)\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-converter-call'
    type: 'tool_used'
    tool: 'WebFetch'
    input_match: '"url":"https?://(?:[\w-]+\.)*(?:xtomd\.com|threadreaderapp\.com)(?=[/"?:])'
    min: 0
    max: 0
    arm: 'both'
