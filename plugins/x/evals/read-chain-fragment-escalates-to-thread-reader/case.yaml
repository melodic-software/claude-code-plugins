schema_version: "1.1"
name: 'read-chain-fragment-escalates-to-thread-reader'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Reuses the numeric id from the X URL as the thread id'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Checks the Thread Reader App page''s final URL for an /error suffix before trusting the page, since a miss also returns 200'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'States that step 2 produced the assembled chain rather than presenting it as one fetch'
    focus: 'trace'
  - name: 'reads-thread-page'
    type: 'tool_used'
    tool: 'Read'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?threadreader-1234567890123456789\.html"'
    min: 1
    arm: 'both'
  - name: 'reports-later-post'
    type: 'regex'
    pattern: '\bcopperfold\b|\b05[:.]52\b'
    flags: 'i'
    target: 'last_message'
