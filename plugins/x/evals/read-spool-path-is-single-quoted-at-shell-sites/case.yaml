schema_version: "1.1"
name: 'read-spool-path-is-single-quoted-at-shell-sites'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Single-quotes the substituted path at the shell sites rather than double-quoting it'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'The $user segment and the backtick are never expanded — the emitted path matches the printed directory exactly'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Uses the same escaped form for both shell sites: the -o target and the delete'
    focus: 'trace'
  - name: 'no-unescaped-apostrophe'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'kai''dev'
    min: 0
    max: 0
    arm: 'both'
  - name: 'single-quotes-path'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'kai''(?:\\\\''''|\\"''\\"'')dev\$user`date`/tmp\.k3Qx9aZbTw'
    min: 1
    arm: 'both'
