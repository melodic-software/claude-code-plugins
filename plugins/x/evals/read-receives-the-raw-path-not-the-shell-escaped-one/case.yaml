schema_version: "1.1"
name: 'read-receives-the-raw-path-not-the-shell-escaped-one'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Passes Read a bare filesystem path with no surrounding quote characters'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Still single-quotes the path at the shell site it emits, the delete of the spool file and directory'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Does not pass the ''...''\''''...'' shell escape form to Read'
    focus: 'trace'
  - name: 'reads-raw-path'
    type: 'tool_used'
    tool: 'Read'
    input_match: '"file_path":"/(?:[^"\\'']|\\.)*?/\.tmp/kai''dev\$user`date`/tmp\.k3Qx9aZbTw/x-1593572469-r2\.md"'
    min: 1
    arm: 'both'
  - name: 'no-quoted-read-path'
    type: 'tool_used'
    tool: 'Read'
    input_match: '"file_path":"(?:''|\\")|"file_path":"(?:[^"\\]|\\.)*?''\\\\'''''
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-unescaped-apostrophe'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'kai''dev'
    min: 0
    max: 0
    arm: 'both'
  - name: 'reports-post'
    type: 'regex'
    pattern: '\bhollowmere\b'
    flags: 'i'
    target: 'last_message'
