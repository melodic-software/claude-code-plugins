schema_version: "1.1"
name: 'read-missing-curl-does-not-route-a-single-post-to-step-2'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'no-thread-reader-fetch'
    type: 'tool_used'
    tool: 'WebFetch'
    input_match: '"url":"(?:[^"\\]|\\.)*?threadreaderapp\.com'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-thread-reader-bash'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?threadreaderapp\.com'
    min: 0
    max: 0
    arm: 'both'
  - name: 'says-curl-missing'
    type: 'regex'
    pattern: '\bcurl\b[^\n]{0,60}?(?<!\bnot )(?<!n[’'']t )\b(?:is (?:missing|absent|unavailable)|(?:is|was) (?:not|n[’'']t) (?:installed|available|found|on (?:the |your )?PATH)|not installed|not available|not found|command not found|unavailable|missing|exit(?:ed)?(?: with| code| status)? 127)\b|\b(?:no|without|missing|absent) (?:a |working )?`?curl\b'
    flags: 'i'
    target: 'last_message'
