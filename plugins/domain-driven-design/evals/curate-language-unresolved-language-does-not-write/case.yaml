schema_version: "1.1"
name: 'curate-language-unresolved-language-does-not-write'
graders:
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Does not arbitrarily choose Account, Customer, or Tenant as canonical'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Uses a domain scenario or boundary test to expose the ambiguity'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Asks one focused resolution question rather than batching unrelated questions'
    focus: 'trace'
  - name: 'no-md-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"[^"]*\.md"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-md-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"[^"]*\.md"'
    min: 0
    max: 0
    arm: 'both'
