schema_version: "1.1"
name: 'curate-language-preserves-consumer-glossary-convention'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Updates the supplied custom-terms.md rather than creating or prescribing a different glossary file'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Defines Claimant as what the project concept IS and records ''insured organization'' as a rejected name'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Does not add implementation details, requirements, or general dictionary content'
    focus: 'trace'
  - name: 'header-kept'
    type: 'regex'
    pattern: '^\|\s*Preferred term\s*\|\s*Meaning\s*\|\s*Rejected names\s*\|\s*$'
    flags: 'm'
    target: { source: 'file', path: 'docs/language/custom-terms.md' }
  - name: 'claimant-rejects-insured-org'
    type: 'regex'
    pattern: '^\|\s*\**Claimant\**\s*\|[^|\n]*\|[^|\n]*\binsured organi[sz]ation\b[^|\n]*\|\s*$'
    flags: 'mi'
    target: { source: 'file', path: 'docs/language/custom-terms.md' }
