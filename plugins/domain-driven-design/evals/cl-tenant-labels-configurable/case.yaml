schema_version: "1.1"
name: cl-tenant-labels-configurable
description: "Tenants that rename a concept on their own screens get one model term plus a Shown to users as: configurable per tenant line, never synonyms. glossary-contract.md Entry discipline, Shown to users as. Hard because the easy writes are the tenant words on Order's Avoid line or a new Purchase or Requisition entry."
tags: [domain-driven-design, ubiquitous-language, outcome, shown-to-users, scaffold]
expected_outcome: "docs/glossary.md gains, under the Order entry, the line Shown to users as: configurable per tenant; Order's Avoid line is unchanged and no Purchase or Requisition entry is added."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/domain-driven-design:ubiquitous-language curate Each tenant can rename orders on their own screens: one shows 'purchase', another 'requisition'. The data and the code stay the same. Record that in the glossary."
  allowed_tools: [Skill, Read, Glob, Grep, Write, Edit]
  max_turns: 15
  timeout_seconds: 600
graders:
  - name: tenant-line-under-order
    type: regex
    pattern: '\*\*Order\*\*(?:(?!\*\*Shipment\*\*)[\s\S])*?Shown to users as:\s*configurable per tenant'
    flags: 'i'
    target: { source: file, path: docs/glossary.md }
  - name: order-avoid-unchanged
    type: regex
    pattern: '\*\*Order\*\*(?:(?!\*\*Shipment\*\*)[\s\S])*?^Avoid: basket, cart[ \t]*$'
    flags: 'm'
    target: { source: file, path: docs/glossary.md }
  - name: no-tenant-word-entry
    type: regex
    pattern: '^\*\*(Purchase|Requisition)\*\*'
    flags: 'im'
    match: not_contains
    target: { source: file, path: docs/glossary.md }
