schema_version: "1.1"
name: cl-declared-path-outside-repo-not-written
context:
  scaffold_script: scaffold.sh
graders:
  - name: local-claimant-entry
    type: regex
    pattern: 'Claimant[\s\S]{0,200}files a claim'
    flags: 'i'
    target: { source: file, path: docs/glossary.md }
  - name: policyholder-kept
    type: regex
    pattern: 'The party that owns the insurance contract\.'
    target: { source: file, path: docs/glossary.md }
  - name: no-cross-repo-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?platform-docs'
    min: 0
    max: 0
    arm: both
  - name: no-cross-repo-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?platform-docs'
    min: 0
    max: 0
    arm: both
