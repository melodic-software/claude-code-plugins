schema_version: "1.1"
name: su-check-gitignored-skipped-by-default
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'verify-ran'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?node(?:\.exe)?(?:\\\"|'')?(?:\s|\\\\\\n)+(?:-[^\s\"\\]+(?:\s|\\\\\\n)+)*(?:\\\"|'')?(?:[^\s\"\\'']|\\\\)*install\.mjs(?:\\\"|'')?(?:\s|\\\\\\n)+verify\b'
    min: 1
    arm: 'with-only'
  - name: 'effective-values'
    type: 'llm'
    criteria: 'The reply reports the effective value of bash_format_lint_gitignored (false, the manifest default, when unexpanded or empty) alongside the effective value of bash_format_enabled.'
    focus: 'last_message'
  - name: 'gitignored-skip-info'
    type: 'llm'
    criteria: 'The reply says bash-format is not broken: with the option not true, the batch row silently skips an edit to a gitignored file, with no format and no notice, and this is INFO rather than FAIL.'
    focus: 'last_message'
  - name: 'opt-in-routes'
    type: 'llm'
    criteria: 'The reply names the opt-in, setting bash_format_lint_gitignored to true, through the native configure flow (/plugin configure, or for a headless session a route it takes from or points at in the plugin-reconfiguration convention), and says to confirm the new value in a fresh session.'
    focus: 'last_message'
  - name: 'tracked-and-undecidable'
    type: 'llm'
    criteria: 'The reply says a tracked file that matches an ignore pattern stays in scope, and that when git cannot decide (git absent, no repository, an error) the hook acts as before, so the file is not skipped for being ignored.'
    focus: 'last_message'
