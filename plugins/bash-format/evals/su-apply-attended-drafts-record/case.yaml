schema_version: "1.1"
name: su-apply-attended-drafts-record
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'drafts-both-commands'
    type: 'llm'
    criteria: 'The reply drafts a fix-cmd that formats with beautysh and a lint-cmd that lints with bashate, each holding the <files> placeholder.'
    focus: 'last_message'
  - name: 'routes-to-toolchain'
    type: 'llm'
    criteria: 'The reply says /toolchain:setup apply bash writes the record, and hands it the drafted values, rather than writing the record itself.'
    focus: 'last_message'
  - name: 'hooks-never-run-it'
    type: 'llm'
    criteria: 'The reply says bash-format''s hooks will not run beautysh or bashate: they run only the shipped shfmt and ShellCheck adapters, and the drafted record runs only through /toolchain:lint and /toolchain:check, on request.'
    focus: 'last_message'
  - name: 'lint-report-only'
    type: 'llm'
    criteria: 'The drafted lint-cmd only reports: it carries no fix or rewrite flag.'
    focus: 'last_message'
  - name: 'no-file-1'
    type: 'file_exists'
    path: '**/docs/conventions/ecosystems/bash.yaml'
    exists: false
  - name: 'no-legacy-file'
    type: 'file_exists'
    path: '**/.claude/ecosystems/bash.yaml'
    exists: false
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
