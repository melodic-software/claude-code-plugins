schema_version: "1.1"
name: ratchet-eslint-native-baseline
description: 'Legacy ratchet 8. An ESLint rule with 37 violations and no autofix takes the per-file baseline path at error severity, and since ESLint has a native per-file baseline the skill points at ESLint''s suppressions docs instead of writing a ceilings entry. No packages are installed and the sandbox has no network, so the counts come from the prompt. cites-docs reads the reply, rule-error eslint.config.mjs, no-add the Bash calls; meets-expectations (llm) quotes the legacy expectations. A run needs --scaffold and --allow-tools Bash Edit Write.'
tags: [ratchet, lint, native-baseline, scaffold, no-network]
expected_outcome: 'eslint.config.mjs sets @typescript-eslint/no-floating-promises to error; the reply cites https://eslint.org/docs/latest/use/suppressions for the baseline; no ratchet.py add runs and no ceilings entry is written.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/toolchain:ratchet the eslint rule no-floating-promises. `npx eslint --rule ''{"@typescript-eslint/no-floating-promises": "error"}'' .` reports 37 violations across 12 files today, and the rule has no autofix. Write the proposed files into the working tree; do not commit.'
  allowed_tools: [Bash, Read, Grep, Glob, Edit, Write, Skill]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: cites-docs
    type: regex
    pattern: 'eslint\.org/docs/latest/use/suppressions\b'
    target: last_message
  - name: rule-error
    type: regex
    pattern: '["'']@typescript-eslint/no-floating-promises["'']\s*:\s*(?:["'']error["'']|2\b|\[\s*(?:["'']error["'']|2\b))'
    target: { source: file, path: eslint.config.mjs }
  - name: no-add
    type: tool_used
    tool: Bash
    input_match: 'ratchet\.py\S*\s+add\b'
    min: 0
    max: 0
    arm: both
  - name: meets-expectations
    type: llm
    criteria: 'The run ratchets the ESLint rule no-floating-promises, which has 37 violations across 12 files and no autofix. It meets the legacy expectations: "Uses ESLint''s native suppressions baseline and cites its docs page" "Turns the rule on at error severity, not warn" "Runs no ratchet.py add and writes no ceilings entry".'
