schema_version: "1.1"
name: ck-unattended-tie-unresolved
description: 'A JavaScript package with no .claude/ecosystems record and no instructions file, whose files imply two test commands with nothing to choose between them: the package.json test script and a Makefile test target (each logs to .calls.log through tools/run.sh). One .js file changed.'
context:
  scaffold_script: scaffold.sh
graders:
  - name: test-unresolved
    type: regex
    pattern: 'skip\W{0,4}\(\s*unresolved:\s*[`*]{0,2}typescript\.test-cmd'
    flags: i
    target: last_message
  - name: names-both-candidates
    type: regex
    pattern: '(?:npm (?:run )?test|package\.json[\s\S]{0,120}?test|test[\s\S]{0,120}?package\.json)[\s\S]{0,400}?(?:make test|Makefile[\s\S]{0,120}?test|test[\s\S]{0,120}?Makefile)|(?:make test|Makefile[\s\S]{0,120}?test|test[\s\S]{0,120}?Makefile)[\s\S]{0,400}?(?:npm (?:run )?test|package\.json[\s\S]{0,120}?test|test[\s\S]{0,120}?package\.json)'
    target: last_message
  - name: neither-ran
    type: file_exists
    path: .calls.log
    exists: false
  - name: overall-incomplete
    type: regex
    pattern: 'Overall\W{0,8}INCOMPLETE\b'
    target: last_message
