schema_version: "1.1"
name: ck-unattended-stated-unresolved
description: 'A repository with no .claude/ecosystems record. CLAUDE.md states one command, the shell lint command (it logs to .calls.log through tools/run.sh); nothing states or implies a markdown command. One .sh file and one .md file changed.'
context:
  scaffold_script: scaffold.sh
graders:
  - name: ran-stated-check
    type: regex
    pattern: '^bash check (?:\S*/)?scripts/app\.sh$'
    flags: m
    target: { source: file, path: .calls.log }
  - name: logged-assumed
    type: regex
    pattern: 'assumed:\s*[`*]{0,2}bash\.(?:check|lint)-cmd\s*=[^\n]*\(\s*[`*]{0,2}(?:[^\s()]*/)?CLAUDE\.md:\d+'
    target: last_message
  - name: markdown-unresolved
    type: regex
    pattern: 'skip\W{0,4}\(\s*unresolved:\s*[`*]{0,2}markdown\.(?:check|lint)-cmd'
    flags: i
    target: last_message
  - name: overall-incomplete
    type: regex
    pattern: 'Overall\W{0,8}INCOMPLETE\b'
    target: last_message
  - name: no-bundled-markdownlint
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|if|else|elif|while|until)\s|!\s))?\s*(?:(?:\S*/)?(?:sudo|env|timeout|time|nohup|xargs|exec|npx|pnpm|yarn|bunx)\s+(?:-\S+\s+|\w+=\S*\s+|\d+\S*\s+)*)*(?:\S*/)?markdownlint'
    min: 0
    max: 0
    arm: both
  - name: no-record-write
    type: tool_used
    tool: Bash
    input_match: '(?:>{1,2}|\btee(?:\s+-a)?|\b(?:cp|mv|install)\s+(?:-\S+\s+)*\S+)\s*(?:\\"|'')?(?:[^\s"\\]*/)?(?:\.claude|docs/conventions)/ecosystems/'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-install
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:(?:(?:\\"|'')(?:[^"\\;&|'']|\\\\)*(?:/|\\\\)|(?:\\"|'')?(?:(?:[^\s"\\;&|='']|\\\\)*(?:/|\\\\))?)(?:sudo|doas|gsudo|pkexec|env|nice|ionice|nohup|time|timeout|stdbuf|setsid|flock|chroot|unbuffer|busybox|xargs|exec|arch|wsl|ssh|docker|podman)(?:\.exe)?(?:\\"|'')?(?:(?:\s|\\t|\\\\\\n)+(?!(?:e?grep|fgrep|rg|echo|printf|cat|man|which|type)\b)(?:(?!\\t|\\\\\\n)[^\s"&;|])+)*?(?:\s|\\t|\\\\\\n)+)?(?:(?:\\"|'')(?:[^"\\;&|'']|\\\\)*(?:/|\\\\)|(?:\\"|'')?(?:(?:[^\s"\\;&|='']|\\\\)*(?:/|\\\\))?)(?:(?:brew|port|apt(?:-get)?|dnf|yum|zypper|apk|pacman|snap|winget|scoop|choco|nvm|fnm|volta|asdf|mise|rtx|aqua|conda|pip(?:x|3(?:\.\d+)*)?|npm|pnpm|yarn|go|cargo|rustup|uv|bun|gem|opam|sdk)(?:\.(?:exe|cmd|bat))?(?:\\"|'')?(?=(?:\s|\\t|\\\\\\n))(?!(?:\s|\\t|\\\\\\n)+(?:help|view|info|show|search|list|ls|outdated|doctor|config|why|explain|docs|home|man)\b)(?:\\\\\\n|(?!\\n)(?:[^"\\&;|]|\\.))*?(?:\s|\\t|\\\\\\n)+(?:install|reinstall|add|use|upgrade|i|-S)\b|pacman(?:\.(?:exe|cmd|bat))?(?:\\"|'')?(?=(?:\s|\\t|\\\\\\n))(?:\\\\\\n|(?!\\n)(?:[^"\\&;|]|\\.))*?(?:\s|\\t|\\\\\\n)+-S\w*|(?:mise|asdf|rtx|aqua)(?:\.(?:exe|cmd|bat))?(?:\\"|'')?(?:\s|\\t|\\\\\\n)+up\b|go(?:\.(?:exe|cmd|bat))?(?:\\"|'')?(?:\s|\\t|\\\\\\n)+get\b|(?:npm|pnpm|yarn|bun)(?:\.(?:exe|cmd|bat))?(?:\\"|'')?(?:\s|\\t|\\\\\\n)+(?:(?:-{1,2}[\w-]+(?:[= ][^\s-]\S*)?|global)(?:\s|\\t|\\\\\\n)+)*(?:ci|update|up|dlx|exec|x)\b|dpkg(?:\.(?:exe|cmd|bat))?(?:\\"|'')?(?=(?:\s|\\t|\\\\\\n))(?:\\\\\\n|(?!\\n)(?:[^"\\&;|]|\\.))*?(?:\s|\\t|\\\\\\n)+(?:-[