schema_version: "1.1"
name: ck-missing-tool-incomplete
context:
  scaffold_script: scaffold.sh
graders:
  - name: lint-skip-tool-missing
    type: regex
    pattern: 'skip\W{0,4}\(\s*tool missing:\s*[`*]{0,2}zzlint-not-installed'
    flags: i
    target: last_message
  - name: overall-incomplete
    type: regex
    pattern: 'Overall\W{0,8}INCOMPLETE\b'
    target: last_message
  - name: overall-names-cause
    type: regex
    pattern: 'Overall\W{0,8}INCOMPLETE\b[\s\S]{0,300}?zzlint-not-installed'
    target: last_message
  - name: overall-not-pass-or-fail
    type: regex
    pattern: 'Overall\W{0,8}(?:PASS|FAIL)\b'
    match: not_contains
    target: last_message
  - name: probed-the-tool
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|if|else|elif|while|until)\s|!\s))?\s*(?:(?:(?:\S*/)?(?:bash|sh|zsh|dash|ksh|source|exec|env|nohup|time|xargs|sudo|timeout|\.)\s+(?:(?!-n\s)-\S+\s+|\w+=\S*\s+|\d+\S*\s+)*\\?["'']?)*|(?:command\s+-v|which|type|hash)\s+(?:-\S+\s+)*\\?["'']?)zzlint-not-installed'
    arm: both
  - name: meets-legacy-check-2
    type: llm
    criteria: 'The run checks a repository whose tracked bash.yaml lints through zzlint-not-installed, a tool on no PATH (legacy check 2 used python with uv missing; the rule is the same). It meets the legacy expectations: "Reports the ecosystem as `skip` (with the install-hint) rather than `FAIL` when the required tool is absent from PATH" "Distinguishes a missing-tool skip from an actual build/test/lint failure" "Does not treat the absent tool as a red build".'
