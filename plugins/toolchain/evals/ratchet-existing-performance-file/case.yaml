schema_version: "1.1"
name: ratchet-existing-performance-file
description: 'The repository already ratchets one counter: CI''s required `tests` job runs `python3 .performance/ratchet.py check` with no --file, so the ceilings live in .performance/ratchets.json. A new count of `type: ignore` comments (9) joins that file next to the existing counter. No .ratchets.json is proposed and no second CI step is added. A run needs --scaffold and --allow-tools Bash Edit Write.'
tags: [ratchet, ceilings-file]
expected_outcome: '.performance/ratchets.json keeps import-spawns and gains a counter on the ignores field with ceiling 9, added by ratchet.py add; no .ratchets.json is written or passed to any call; ci.yml still has exactly one ratchet.py call.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/toolchain:ratchet the count of `type: ignore` comments. `bash count-ignores.sh` prints it. Write the proposed files into the working tree; do not commit.'
  allowed_tools: [Bash, Read, Grep, Glob, Edit, Write, Skill]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: joins-performance-file
    type: regex
    pattern: '(?=[\s\S]*"name":\s*"import-spawns")(?=[\s\S]*\{(?=[^{}]*"field":\s*"ignores")[^{}]*"ceiling":\s*9\b)'
    target: { source: file, path: .performance/ratchets.json }
  - name: no-second-file-bash
    type: tool_used
    tool: Bash
    input_match: '\.ratchets\.json'
    min: 0
    max: 0
    arm: both
  - name: no-second-file-write
    type: tool_used
    tool: Write
    input_match: '\.ratchets\.json'
    min: 0
    max: 0
    arm: both
  - name: one-ci-step
    type: regex
    pattern: 'ratchet\.py'
    match: 'count:1'
    target: { source: file, path: .github/workflows/ci.yml }
  - name: add-ran
    type: tool_used
    tool: Bash
    input_match: 'ratchet\.py\S*\s+add\b'
    min: 1
    arm: with-only
  - name: meets-legacy-ratchet-4
    type: llm
    criteria: 'The repository''s required CI job already runs `python3 .performance/ratchet.py check` with no --file, and the user asks to ratchet a count of `type: ignore` comments that reads 9. The run meets the legacy expectations: "Adds the counter to .performance/ratchets.json" "Does not propose .ratchets.json or a second ceilings file" "Adds no new CI step, because the existing check covers the file" "Records a ceiling of 9".'
