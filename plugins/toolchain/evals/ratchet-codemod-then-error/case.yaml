schema_version: "1.1"
name: ratchet-codemod-then-error
description: 'Legacy ratchet 9, rewritten off ruff so the run does not depend on a host tool: the in-house rule no-legacy-typing (builtin generics in annotations, as ruff UP006) has 54 violations and a safe autofix. The codemod path applies the autofix across the repository in the same change and turns the rule on at error severity, with no ceiling. rule-on-error reads tools/lint.toml, codemod-applied src/orders.py, no-add the Bash calls; meets-expectations (llm) quotes the legacy expectations. A run needs --scaffold and --allow-tools Bash Edit Write.'
tags: [ratchet, lint, codemod, scaffold, no-network]
expected_outcome: 'tools/lint.py --fix rewrites every violation (src/orders.py holds no List[ or Dict[), tools/lint.toml sets no-legacy-typing to error, no ratchet.py add runs and no ceilings file is written.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/toolchain:ratchet our in-house lint rule no-legacy-typing (use builtin generics in type annotations). `python3 tools/lint.py --rule no-legacy-typing --statistics` reports 54 violations today, and `python3 tools/lint.py --rule no-legacy-typing --fix` rewrites every one of them safely with no judgment call. Rule severities live in tools/lint.toml. Write the proposed files into the working tree; do not commit.'
  allowed_tools: [Bash, Read, Grep, Glob, Edit, Write, Skill]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: rule-on-error
    type: regex
    pattern: '^no-legacy-typing\s*=\s*"error"'
    flags: m
    target: { source: file, path: tools/lint.toml }
  - name: codemod-applied
    type: regex
    pattern: '\b(?:List|Dict)\['
    match: not_contains
    target: { source: file, path: src/orders.py }
  - name: no-add
    type: tool_used
    tool: Bash
    input_match: 'ratchet\.py\S*\s+add\b'
    min: 0
    max: 0
    arm: both
  - name: meets-expectations
    type: llm
    criteria: 'The run ratchets a lint rule with 54 violations whose autofix rewrites every one safely (legacy: ruff UP006; here the in-house no-legacy-typing rule). It meets the legacy expectations: "Applies the autofix to every violation in the same change" "Turns the rule on at error severity, not warn" "Runs no ratchet.py add and writes no ceilings entry".'
