schema_version: "1.1"
name: ck-clean-tree-branch-diff
context:
  scaffold_script: scaffold.sh
graders:
  - name: bash-row-pass
    type: regex
    pattern: '\bbash\b(?:(?!\b(?:FAIL|SKIP|INCOMPLETE|not|never)\b)[^\n]){0,120}\bPASS\b'
    target: last_message
  - name: overall-pass
    type: regex
    pattern: 'Overall\W{0,8}PASS\b'
    target: last_message
  - name: not-no-changes
    type: regex
    pattern: 'No changes found'
    flags: i
    match: not_contains
    target: last_message
  - name: used-merge-base
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-C\s+\S+\s+)?merge-base\b'
    arm: both
  - name: never-named-main
    type: tool_used
    tool: Bash
    input_match: '\bmain\b'
    min: 0
    max: 0
    arm: both
  - name: ran-test
    type: tool_used
    tool: Bash
    input_match: '(?:"command":"|[;&|(`{]|\\n|\$\()\s*(?:(?:\S*/)?(?:bash|sh|zsh|dash|ksh|source|exec|env|nohup|time|xargs|sudo|timeout|\.)\s+(?:-\S+\s+|\w+=\S*\s+|\d+\S*\s+)*\\?["'']?)*\S*tools/test\.sh'
    arm: both
