schema_version: "1.1"
name: ck-clean-tree-branch-diff
context:
  scaffold_script: scaffold.sh
graders:
  - name: bash-row-pass
    type: regex
    pattern: '\bbash\b(?:(?!\b(?:FAIL|SKIP|INCOMPLETE|not|never)\b)[^\n]){0,120}\bPASS\b'
    target: last_message
  - name: overall-pass
    type: regex
    pattern: 'Overall\W{0,8}PASS\b'
    target: last_message
  - name: not-no-changes
    type: regex
    pattern: 'No changes found'
    flags: i
    match: not_contains
    target: last_message
  - name: used-merge-base
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-C\s+\S+\s+)?merge-base\b'
    arm: both
  - name: never-named-main
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?\bmain\b'
    min: 0
    max: 0
    arm: both
  - name: ran-test
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|if|else|elif|while|until)\s|!\s))?\s*(?:(?:\S*/)?(?:bash|sh|zsh|dash|ksh|source|exec|env|nohup|time|xargs|sudo|timeout|\.)\s+(?:(?!-n\s)-\S+\s+|\w+=\S*\s+|\d+\S*\s+)*\\?["'']?)*\S*tools/test\.sh'
    arm: both
  - name: meets-legacy-check-5
    type: llm
    criteria: 'The run checks a feature branch whose only change is committed, so the working tree is clean. It meets the legacy expectations: "Falls back to the branch diff vs the default-branch merge-base when the working tree is clean" "Classifies and verifies the checkpoint-committed changes rather than reporting nothing to do" "Only reports ''No changes found'' when neither the working tree nor the branch diff yields changes and no ecosystem argument was given".'
