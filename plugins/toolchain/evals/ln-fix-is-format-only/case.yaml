schema_version: "1.1"
name: ln-fix-is-format-only
context:
  scaffold_script: scaffold.sh
graders:
  - name: format-marker-present
    type: regex
    pattern: '^# format: applied$'
    flags: m
    target: { source: file, path: app.sh }
  - name: trailing-whitespace-gone
    type: regex
    pattern: '[ \t]$'
    flags: m
    match: not_contains
    target: { source: file, path: app.sh }
  - name: app-still-legacy
    type: regex
    pattern: 'legacy_greeting'
    match: "count:2"
    target: { source: file, path: app.sh }
  - name: no-code-fix-marker
    type: regex
    pattern: 'code-fix applied'
    match: not_contains
    target: { source: file, path: app.sh }
  - name: ran-format
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|if|else|elif|while|until)\s|!\s))?\s*(?:(?:\S*/)?(?:bash|sh|zsh|dash|ksh|source|exec|env|nohup|time|xargs|sudo|timeout|\.)\s+(?:(?!-n\s)-\S+\s+|\w+=\S*\s+|\d+\S*\s+)*\\?["'']?)*\S*format\.sh'
    arm: both
  - name: never-ran-code-fix
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|if|else|elif|while|until)\s|!\s))?\s*(?:(?:\S*/)?(?:bash|sh|zsh|dash|ksh|source|exec|env|nohup|time|xargs|sudo|timeout|\.)\s+(?:(?!-n\s)-\S+\s+|\w+=\S*\s+|\d+\S*\s+)*\\?["'']?)*\S*semantic-fix\.sh'
    min: 0
    max: 0
    arm: both
  - name: meets-legacy-lint-2
    type: llm
    criteria: 'The run is `/toolchain:lint --fix` in a repository whose tracked bash.yaml has a format-only fix-cmd and a separate code-fix-cmd (legacy lint 2 used `/toolchain:lint python --fix` with ruff; the rule is the same, and with no filter the bash ecosystem is the one detected). It meets the legacy expectations: "Parses --fix as format-only fix mode (not code-changing) and python as the ecosystem filter" "Runs the resolved fix-cmd only — does NOT run code-fix-cmd / ruff check --fix / golangci-lint --fix / biome check --write" "Reports which ecosystems were format-fixed vs which are check-only (no non-null fix-cmd)". Read "python as the ecosystem filter" as the detected bash ecosystem here.'
