schema_version: "1.1"
name: ck-unattended-inferred-runs
context:
  scaffold_script: scaffold.sh
graders:
  - name: ran-inferred-test
    type: regex
    pattern: '^typescript test$'
    flags: m
    target: { source: file, path: .calls.log }
  - name: logged-assumed
    type: regex
    pattern: 'assumed:\s*[`*]{0,2}typescript\.test-cmd\s*=\s*[`*]{0,2}npm (?:run )?test\b[^\n]*\(\s*[`*]{0,2}(?:[^\s()]*/)?package\.json(?::\d+)?'
    target: last_message
  - name: build-unresolved
    type: regex
    pattern: 'skip\W{0,4}\(\s*unresolved:\s*[`*]{0,2}typescript\.build-cmd'
    flags: i
    target: last_message
  - name: no-bundled-typescript
    type: tool_used
    tool: Bash
    input_match: 'npx\s+(?:-\S+\s+)*(?:@biomejs/biome|tsc|biome|eslint|vitest|jest)\b|"command":"\s*(?:tsc|biome|eslint|vitest|jest)\b'
    min: 0
    max: 0
    arm: both
  - name: no-install
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?(?:(?:brew|port|apt(?:-get)?|dnf|yum|zypper|apk|snap|winget|scoop|choco|pipx?|pip3|npm|pnpm|yarn|cargo)(?:\.exe)?(?:\\\"|'')?(?:\s|\\\\\\n)+(?:-{1,2}[\w-]+(?:[= ][^\s-]\S*)?(?:\s|\\\\\\n)+)*(?:install|reinstall|add|upgrade|i|ci)\b|pacman\s+-S|go(?:\s|\\\\\\n)+install\b|uv(?:\s|\\\\\\n)+(?:tool|pip)(?:\s|\\\\\\n)+install\b|(?:mise|asdf|rtx|aqua)(?:\s|\\\\\\n)+(?:install|use|upgrade|up|plugin\s+add)\b|nix(?:-env)?\s+(?:-i\b|profile\s+install|shell|run)|docker\s+(?:pull|run)\b|(?:curl|wget)\b(?:[^\"\\]|\\.)*?\|\s*(?:sudo(?:\s+-\S+)*\s+)?(?:bash|dash|zsh|sh)\b|(?:bash|zsh|sh)\s+<\(\s*(?:curl|wget)\b|(?:(?:bash|dash|zsh|sh)(?:\s+-\w+)*?\s+-\w*c\w*|eval)\s+(?:\\\"|'')?\$\(\s*(?:curl|wget)\b)'
    min: 0
    max: 0
    arm: both
