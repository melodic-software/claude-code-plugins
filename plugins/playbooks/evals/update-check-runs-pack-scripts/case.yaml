schema_version: "1.1"
name: update-check-runs-pack-scripts
description: "/playbooks:update --check dispatches to the boris then the skill-authoring scripts/update.sh in check mode, runs no --apply, and reports fable-5 as self-authored with no upstream (SKILL.md How to run, steps 2-3). The run grants no Bash, so the reply lists the commands instead of running them. No skill-fired grader: the skill sets disable-model-invocation, so only a slash command loads it, and a slash command makes no Skill call (plugins/evals/skills/plugin-eval/reference/case-authoring.md, Graders). No process grader either: the slash command loads the hub, which carries both commands and the fable-5 status, so a correct run needs no tool call; a tool_used on Read of a pack script would fail correct runs, and a must-not-invoke check on Bash or Write, which the run does not grant, passes in both arms and measures nothing. Limit: a correct reply that leaves --check off and relies on the default fails runs-both-checks."
tags: [update, drift-check]
expected_outcome: "The reply gives, in order, the boris and skill-authoring scripts/update.sh commands with --check, gives no --apply command, and says fable-5 is self-authored with no upstream, so nothing runs for it."
execution:
  prompt: "/playbooks:update --check. This is a working-tree checkout of the plugin, but this run cannot run commands: list the exact commands you would run in one bash code block, then say what you do for each pack."
  allowed_tools: [Read, Glob, Grep]
  max_turns: 15
  timeout_seconds: 300
graders:
  - name: runs-both-checks
    type: regex
    pattern: 'skills/boris/scripts/update\.sh"?\s+--check\b[\s\S]*skills/skill-authoring/scripts/update\.sh"?\s+--check\b'
    target: last_message
    arm: both
  - name: no-apply-command
    type: regex
    pattern: '^\s*(?:bash\s+)?\S*update\.sh"?\s+--apply\b'
    flags: 'm'
    match: not_contains
    target: last_message
    arm: both
  - name: fable-5-no-upstream
    type: regex
    pattern: 'fable-5[^\n]{0,200}\b(?:self-authored|no upstream)'
    flags: 'i'
    target: last_message
    arm: both
