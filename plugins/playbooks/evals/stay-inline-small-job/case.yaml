schema_version: "1.1"
name: stay-inline-small-job
description: "fable-5 delegation case 22 from skills/fable-5/evals/evals.json"
tags: [fable-5, orchestration, delegation]
expected_outcome: "Plans to stay inline: three one-search items is a job of a few tool calls, so a worker spec would cost more than the work. It plans to run the three searches itself and starts none of them."
execution:
  prompt: "/playbooks:fable-5. Plan this, do not start yet: check whether each of these three config keys is read anywhere under src/: `retry.max_attempts`, `retry.backoff_ms`, `retry.jitter`, and tell me the file for each hit. Say how you will run it."
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: expectation-1
    type: llm
    arm: both
    criteria: "PASS only if the final reply meets this expectation: Plans to run the searches itself in the main session. Context, the reference answer: Plans to stay inline: three one-search items is a job of a few tool calls, so a worker spec would cost more than the work. It plans to run the three searches itself and starts none of them. FAIL if the reply does not meet the expectation, contradicts it, or leaves it unstated."
  - name: expectation-2
    type: llm
    arm: both
    criteria: "PASS only if the final reply meets this expectation: Does not plan a worker or a workflow for any of the three keys. Context, the reference answer: Plans to stay inline: three one-search items is a job of a few tool calls, so a worker spec would cost more than the work. It plans to run the three searches itself and starts none of them. FAIL if the reply does not meet the expectation, contradicts it, or leaves it unstated."
  - name: dispatches-no-worker
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
