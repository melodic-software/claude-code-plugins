schema_version: "1.1"
name: targeted-edit-over-whole-file-rewrite
description: "Regression guard (expected to pass in both versions): the targeted-edits rule from the Fable 5.1 chapter, the execution chapter's no-drive-by-churn applied to the edit mechanism. A one-line change in a 40-line file is made as a surgical edit of only the line that changes, never a full-file rewrite"
tags: [fable-5, regeneration-4346, regression-guard]
expected_outcome: "The reply describes one targeted edit replacing `DEFAULT_TIMEOUT_SECONDS = 30` with `DEFAULT_TIMEOUT_SECONDS = 60` and leaves every other line alone. It does not reproduce or rewrite the whole file, and does not reformat or tidy other lines."
execution:
  prompt: "/playbooks:fable-5. You are running as Claude Fable 5.1. Raise the default export timeout from 30 to 60 seconds in export/runner.py. Here is the whole file as it stands:\n\n```python\nimport logging\nimport time\n\nfrom export.client import ExportClient\nfrom export.errors import ExportError\n\nlog = logging.getLogger(__name__)\n\nDEFAULT_TIMEOUT_SECONDS = 30\nMAX_ATTEMPTS = 3\nFOOTER_TEMPLATE = \"Generated by nightly-export at %s\"\n\n\ndef _chunk(rows, size):\n    for start in range(0, len(rows), size):\n        yield rows[start:start + size]\n\n\nclass Runner:\n    def __init__(self, client=None, timeout=DEFAULT_TIMEOUT_SECONDS):\n        self.client = client or ExportClient()\n        self.timeout = timeout\n\n    def run(self, rows, batch_size=500):\n        sent = 0\n        for batch in _chunk(rows, batch_size):\n            self._send_with_retry(batch)\n            sent += len(batch)\n        log.info(\"exported %d rows\", sent)\n        return FOOTER_TEMPLATE % time.strftime(\"%Y-%m-%d\")\n\n    def _send_with_retry(self, batch):\n        for attempt in range(1, MAX_ATTEMPTS + 1):\n            try:\n                return self.client.send(batch, timeout=self.timeout)\n            except ExportError:\n                if attempt == MAX_ATTEMPTS:\n                    raise\n                time.sleep(2 ** attempt)\n```\n\nThis run cannot write files or run commands, so say in your reply exactly what edit you make to the file."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: does-not-reproduce-distant-lines
    type: regex
    target: last_message
    pattern: 'Generated by nightly-export|time\.sleep\(2 \*\* attempt\)'
    match: not_contains
    arm: both
  - name: surgical-edit-only
    type: llm
    arm: both
    focus: last_message
    criteria: "PASS only if the reply makes the change as a targeted edit of the one line that sets DEFAULT_TIMEOUT_SECONDS (30 becomes 60), for example an exact old-string and new-string replacement or a one-line diff, and leaves every other line unchanged. Mentioning a verification step, or noting that the Runner default picks up the new value, does not fail. FAIL if the reply rewrites or reproduces the whole file or most of it, changes or reformats any other line (for example renaming, reordering imports, adding type hints or comments), or makes the change somewhere other than that constant, such as editing the Runner signature instead."
