schema_version: "1.1"
name: delegate-isolation-fresh-verifier-small-batch
description: "fable-5 delegation case 19 from skills/fable-5/evals/evals.json"
tags: [fable-5, orchestration, delegation]
expected_outcome: "Plans a fresh-context verifier in addition to its own self-review before declaring the task done, because the batch spans several files and changed behavior. It plans to hand the verifier the changed files and yes/no criteria checkable by reading or searching (zero hits for handle_refund, every caller uses process_refund, the retry path matches the new rule) and to withhold its own rationale. The small size of the change does not excuse the verifier."
execution:
