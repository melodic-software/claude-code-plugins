<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>repo-sweep plan</title>
<style>
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  body {
    font-family: var(--sans); max-width: 900px; margin: 2rem auto;
    padding: 0 1rem 4rem; line-height: 1.5; background: var(--bg); color: var(--fg);
  }
  h1, h2 { font-family: var(--serif); }
  h1 { font-size: 1.5rem; margin-bottom: .25rem; }
  p.lead { color: var(--muted); margin-top: 0; }
  h2.phase { font-size: 1rem; margin: 1.5rem 0 .5rem; border-bottom: var(--border); padding-bottom: .25rem; color: var(--muted); }
  a { color: var(--link); }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 2px;
  }
  /* rv-chrome:begin */
  .rv-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: flex-end; }
  .rv-theme { display: inline-flex; border: 1px solid var(--muted); border-radius: 8px; overflow: hidden; }
  .rv-theme button { margin: 0; padding: 0.35rem 0.75rem; border: 0; border-radius: 0; background: transparent; color: var(--fg); font: inherit; font-weight: 500; cursor: pointer; }
  .rv-theme button + button { border-left: 1px solid var(--muted); }
  .rv-theme button[aria-pressed=true] { background: var(--fg); color: var(--bg); }
  .rv-theme button:focus-visible { outline: 3px solid var(--fg); outline-offset: -3px; }
  .rv-comment { display: grid; gap: 0.4rem; }
  .rv-comment h2 { margin: 0; }
  .rv-comment textarea { min-height: 5rem; padding: 0.6rem; border: 1px solid var(--muted); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; resize: vertical; }
  .rv-comment textarea:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  /* rv-chrome:end */
  ul#list { list-style: none; margin: 0; padding: 0; }
  li.row {
    display: grid; grid-template-columns: auto auto 1fr auto; gap: .5rem .75rem;
    align-items: start; border: var(--border); border-radius: var(--radius-row);
    padding: .6rem .8rem; margin-bottom: .5rem; cursor: grab; background: var(--panel);
  }
  li.row.dimmed { opacity: .55; }
  li.row.dragover { outline: 2px dashed currentColor; }
  li.row .id { font-family: var(--mono); font-weight: 600; }
  li.row .meta { font-size: .85rem; color: var(--muted); margin-top: .2rem; }
  .badge { font-size: .75rem; padding: .1rem .5rem; border-radius: 1rem; border: 1px solid currentColor; white-space: nowrap; height: fit-content; }
  .badge.run, .badge.rerun { color: #2f6b2f; border-color: #2f6b2f; }
  .badge.rerun-optional { color: #8a6d00; border-color: #8a6d00; }
  .badge.not-applicable { color: #8a3b3b; border-color: #8a3b3b; }
  .order-buttons { display: flex; flex-direction: column; gap: .15rem; }
  .order-buttons button { font: inherit; cursor: pointer; }
  #copy-row { display: flex; gap: .5rem; align-items: center; margin: 1.5rem 0; flex-wrap: wrap; }
  #line { flex: 1 1 320px; font-family: var(--mono); font-size: .85rem; }
</style>
</head>
<body>
<div class="rv-bar"><div class="rv-theme" role="group" aria-label="Theme"><button type="button" data-rv-theme="system" aria-pressed="true">System</button><button type="button" data-rv-theme="light" aria-pressed="false">Light</button><button type="button" data-rv-theme="dark" aria-pressed="false">Dark</button></div></div>
<h1 id="title">repo-sweep plan</h1>
<p class="lead">Check the entries to run, drag a row or use its arrows to reorder, then copy the selection line back into chat.</p>
<div id="groups"></div>
<div id="copy-row">
  <button id="copy-btn" type="button">Copy selection</button>
  <textarea id="line" readonly rows="2" aria-label="Selection line"></textarea>
</div>
<section class="rv-comment" aria-labelledby="rv-comment-h">
  <h2 id="rv-comment-h">Comment</h2>
  <label for="rv-comment-text">Your comment for the session</label>
  <textarea id="rv-comment-text" data-rv-note="comment" placeholder="Say what should change, or ask a question"></textarea>
</section>
<script type="application/json" id="repo-sweep-data">__REPO_SWEEP_DATA__</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('repo-sweep-data').textContent);
  var order = data.entries.slice();
  document.getElementById('title').textContent = 'repo-sweep plan: ' + data.playbook;

  document.addEventListener('click', function (event) {
    var button = event.target.closest && event.target.closest('button[data-rv-theme]');
    if (!button) return;
    var choice = button.getAttribute('data-rv-theme');
    if (choice === 'system') document.documentElement.removeAttribute('data-theme');
    else if (choice === 'light' || choice === 'dark') document.documentElement.setAttribute('data-theme', choice);
    else return;
    document.querySelectorAll('button[data-rv-theme]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b === button));
    });
  });

  function badge(rec) {
    var span = document.createElement('span');
    span.className = 'badge ' + rec;
    span.textContent = rec;
    return span;
  }

  function indexOf(id) {
    for (var i = 0; i < order.length; i++) if (order[i].id === id) return i;
    return -1;
  }

  function move(id, delta) {
    var i = indexOf(id), j = i + delta;
    if (i < 0 || j < 0 || j >= order.length) return;
    var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    render();
  }

  function reorder(sourceId, targetId) {
    var from = indexOf(sourceId), to = indexOf(targetId);
    if (from < 0 || to < 0 || from === to) return;
    var entry = order.splice(from, 1)[0];
    order.splice(to, 0, entry);
    render();
  }

  function updateLine() {
    var ids = order.filter(function (e) { return e.checked; }).map(function (e) { return e.id; });
    document.getElementById('line').value = 'repo-sweep-selection: ' + ids.join(',');
  }

  function buildRow(entry) {
    var li = document.createElement('li');
    li.className = 'row' + (entry.recommendation === 'not-applicable' ? ' dimmed' : '');
    li.draggable = true;
    li.dataset.id = entry.id;

    var label = document.createElement('label');
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = entry.checked;
    cb.setAttribute('aria-label', 'Select ' + entry.id);
    cb.addEventListener('change', function () { entry.checked = cb.checked; updateLine(); });
    label.appendChild(cb);

    var info = document.createElement('div');
    var idLine = document.createElement('div');
    idLine.className = 'id';
    idLine.textContent = entry.id + ' - ' + entry.skills.join(', ');
    info.appendChild(idLine);
    var bits = [];
    if (entry.args) bits.push('args: ' + entry.args);
    bits.push('applies when: ' + entry.appliesWhen);
    if (entry.issue) bits.push('issue: ' + entry.issue);
    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = bits.join(' · ');
    info.appendChild(meta);
    if (entry.reason) {
      var reason = document.createElement('div');
      reason.className = 'meta';
      reason.textContent = entry.reason;
      info.appendChild(reason);
    }

    var buttons = document.createElement('div');
    buttons.className = 'order-buttons';
    var up = document.createElement('button');
    up.type = 'button'; up.textContent = '▲';
    up.setAttribute('aria-label', 'Move ' + entry.id + ' up');
    up.addEventListener('click', function () { move(entry.id, -1); });
    var down = document.createElement('button');
    down.type = 'button'; down.textContent = '▼';
    down.setAttribute('aria-label', 'Move ' + entry.id + ' down');
    down.addEventListener('click', function () { move(entry.id, 1); });
    buttons.appendChild(up); buttons.appendChild(down);

    li.appendChild(label);
    li.appendChild(badge(entry.recommendation));
    li.appendChild(info);
    li.appendChild(buttons);

    li.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', entry.id); });
    li.addEventListener('dragover', function (e) { e.preventDefault(); li.classList.add('dragover'); });
    li.addEventListener('dragleave', function () { li.classList.remove('dragover'); });
    li.addEventListener('drop', function (e) {
      e.preventDefault();
      li.classList.remove('dragover');
      reorder(e.dataTransfer.getData('text/plain'), entry.id);
    });
    return li;
  }

  function render() {
    var host = document.getElementById('groups');
    host.textContent = '';
    var list = document.createElement('ul');
    list.id = 'list';
    var lastPhase = null;
    order.forEach(function (entry) {
      if (entry.phase !== lastPhase) {
        var h = document.createElement('h2');
        h.className = 'phase';
        h.textContent = entry.phase;
        list.appendChild(h);
        lastPhase = entry.phase;
      }
      list.appendChild(buildRow(entry));
    });
    host.appendChild(list);
    updateLine();
  }

  document.getElementById('copy-btn').addEventListener('click', function () {
    var line = document.getElementById('line').value;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(line).catch(function () {});
    }
    document.getElementById('line').select();
  });

  render();
})();
</script>
</body>
</html>
