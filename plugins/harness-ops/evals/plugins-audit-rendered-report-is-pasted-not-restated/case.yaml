schema_version: "1.1"
name: 'plugins-audit-rendered-report-is-pasted-not-restated'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'The response reproduces the rendered report verbatim rather than summarizing it in its own words'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'The response does not restate a number, id, scope, or version that the render already printed (no separate ''three plugins would be updated'' sentence, no re-listing of gamma@market1''s versions)'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'The response does not add a row, section, or count the render omitted, and does not recompute the Divergences split from the digest'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'The only line the response adds after the render is the reload guidance, stated as the docs'' two-step: bare /reload-plugins first, /reload-plugins --force only if the bare command warns about re-reading the conversation'
    focus: 'trace'
  - name: 'expectation-5'
    type: 'llm'
    criteria: 'The response does not append its own monitor restart call-out; that bullet comes from the render''s Action needed when updated_with_monitors is non-empty'
    focus: 'trace'
