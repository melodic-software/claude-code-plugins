  - name: names-broken-lane
    type: regex
    pattern: '\bbundled[_ -]skills?\b(?:(?!\bbuilt-?in[_ ]commands?\b|\bbuiltin[_ ]commands?\b)[^\n]){0,160}?(?:(?<!\bnot )(?<!n[''’]t )(?<!\bnever )(?<!nothing is )(?<!nothing was )(?<!nothing )\bbroken\b|(?<!\bno )\bcanar(?:y|ies)\b[^\n]{0,40}?\b(?:not (?:resolved|found)|unresolved|missing|failed|did(?: not|n[''’]t) (?:resolve|appear))|\bsimplify\b[^\n]{0,30}?\b(?:not (?:resolved|found)|unresolved|missing|failed|did(?: not|n[''’]t) resolve)|\b0 of 3\b|\bno canar(?:y|ies)\b[^\n]{0,20}?\b(?:found|resolved))|(?<!\bnot )(?<!n[''’]t )\bbroken\b[^.;\n]{0,80}?\bbundled[_ -]skills?\b'
    flags: 'mi'
    target: last_message
  - name: no-inventory-rerun
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?\bpython3?(?:\.\d+)?\s+(?:-\S+\s+)*\\?["'']?[^\s"''\\]*inventory\.py|(?:(?:[^"\\]|\\.)*?(?:[;&|(]|\\n)\s*)?\\?["'']?[^\s"''\\]*/inventory\.py\b)'
