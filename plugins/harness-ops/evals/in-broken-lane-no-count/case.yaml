  - name: bundled-count-withheld
    type: regex
    pattern: '(?<![.\d])(?<!\bof )\b(?:\d+|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b(?![.\d])[*`]*[ \t]+(?:[\w`*]+[ \t]+){0,2}[*`]*bundled[_ -]skills?\b|\bbundled[_ -]skills?\b(?:(?!\b(?:canar\w*|of|commands?|built-?in|builtin\w*)\b)[^.;,\n\d]){0,40}?(?<![.\d])(?<!\bof )\b(?:\d+|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b(?![.\d])(?![ \t]+(?:of\b|canar|problems?\b|advisor))'
