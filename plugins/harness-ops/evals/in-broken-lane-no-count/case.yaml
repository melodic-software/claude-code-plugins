schema_version: "1.1"
name: in-broken-lane-no-count
context:
  scaffold_script: scaffold.sh
graders:
  - name: commands-as-floor
    type: regex
    pattern: '(?<!\bnot )(?<!n[''’]t )\b(?:at least|a floor of|no fewer than|a minimum of)[ \t]*\**12\b|(?:≥|>=)[ \t]*\**12\b|\b12[ \t]*\+|\b12\b[^.;\n]{0,60}?(?<!\bnot a )(?<!\bnot )(?<!n[''’]t a )(?<!n[''’]t )\b(?:floor|lower bound|minimum)\b|\b(?:floor|lower bound)s?\b(?:(?!\b(?:not|never)\b|n[''’]t\b)[^.;\n]){0,40}?\b12\b'
    flags: 'mi'
