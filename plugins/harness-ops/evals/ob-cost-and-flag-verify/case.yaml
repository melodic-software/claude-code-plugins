schema_version: "1.1"
name: ob-cost-and-flag-verify
graders:
  - name: cost-is-list-estimate
    type: regex
    pattern: '\blist[- ]?(?:rate|price|pric\w*)\b|\bestimat\w*\b[^.\n]{0,80}\bnot\b[^.\n]{0,30}\bbill|\bnot (?:a|your|the) bill\b|\bnot what you(?:[’'']ll| will| are)? (?:be )?(?:billed|charged|pay)'
    flags: 'i'
    target: last_message
  - name: no-posttooluse-claim
    type: regex
    pattern: '\bcli-flag-verify\b(?:(?![.!?;](?:\s|$))[^\n]){0,200}?(?<!not a )(?<!not an )(?<!not as a )(?<!longer a )(?<!longer an )(?<!n''t a )(?<!n’t a )(?<! run as a )(?<!than a )(?<!than as a )(?<!stead of a )(?<!not )(?<!never )(?<!no )(?<!No )\bPostToolUse\b|(?<!not a )(?<!not an )(?<!not as a )(?<!longer a )(?<!longer an )(?<!n''t a )(?<!n’t a )(?<! run as a )(?<!than a )(?<!than as a )(?<!stead of a )(?<!not )(?<!never )(?<!no )(?<!No )\bPostToolUse\b(?:(?![.!?;](?:\s|$))[^\n]){0,200}?\bcli-flag-verify\b'
    flags: 'im'
    match: not_contains
    target: last_message
  - name: names-push-time
    type: regex
    pattern: '\bpush(?:-time| time)\b|\bpre-push\b|\bat push\b|\bon (?:git )?push\b|\breference-verify\b'
    flags: 'i'
    target: last_message
