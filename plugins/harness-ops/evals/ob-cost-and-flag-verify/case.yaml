schema_version: "1.1"
name: ob-cost-and-flag-verify
graders:
  - name: cost-is-list-estimate
    type: regex
    pattern: '\blist[- ]?(?:rate|price|pric\w*)\b|\bestimat\w*\b[^.\n]{0,80}\bnot\b[^.\n]{0,30}\bbill|\bnot (?:a|your|the) bill\b|\bnot what you(?:[’'']ll| will| are)? (?:be )?(?:billed|charged|pay)'
    flags: 'i'
    target: last_message
  - name: no-posttooluse-claim
    type: regex
    pattern: '(?:^|[.!?][ \t]+)(?![^.!?\n]*\b(?:not|no longer|never|rather than|instead of|isn[’'']t|doesn[’'']t|wasn[’'']t)\b)[^.!?\n]*(?:\bcli-flag-verify\b[^.!?\n]*\bPostToolUse\b|\bPostToolUse\b[^.!?\n]*\bcli-flag-verify\b)'
    flags: 'im'
    match: not_contains
    target: last_message
  - name: names-push-time
    type: regex
    pattern: '\bpush(?:-time| time)\b|\bpre-push\b|\bat push\b|\bon (?:git )?push\b|\breference-verify\b'
    flags: 'i'
    target: last_message
