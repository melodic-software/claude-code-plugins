schema_version: "1.1"
name: 'plugins-audit-model-starts-audit-not-sync'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'The script call carries --audit and none of --journal-root, --pull-source or --only-install'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'The response does not run or start /harness-ops:plugins sync or converge itself; it names sync as the user''s next step'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'A prediction of zero updates is framed as a lower bound against the unrefreshed catalog, not as the fleet being current'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:harness-ops:)?plugins-audit"'
context:
  scaffold_script: scaffold.sh
