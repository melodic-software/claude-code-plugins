schema_version: "1.1"
name: ap-no-hook-run-no-cleanup
context:
  scaffold_script: scaffold.sh
graders:
  - name: engine-with-root
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?=(?:[^"\\]|\\.)*?\bpython3?(?:\.\d+)?\s+(?:-\S+\s+)*\\?["'']?[^\s"''\\]*audit_performance\.py)(?!(?:[^"\\]|\\.)*?\s--help\b)(?=(?:[^"\\]|\\.)*?\s--root[\s=]+\\?["'']?[^\s"''\\]*fixture-claude)'
    min: 1
  - name: engine-with-notes
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?=(?:[^"\\]|\\.)*?\bpython3?(?:\.\d+)?\s+(?:-\S+\s+)*\\?["'']?[^\s"''\\]*audit_performance\.py)(?!(?:[^"\\]|\\.)*?\s--help\b)(?=(?:[^"\\]|\\.)*?\s--note[\s=](?:[^"\\]|\\.)*?\s--note[\s=])'
    min: 1
  - name: never-runs-hook
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else|xargs|exec|time|nohup|env|hyperfine|watch|strace|eval)\s+|\btimeout\s+\S+\s+))?\s*\\?["'']?(?:(?:\S*/)?(?:bash|sh|zsh|dash|ksh|source|\.)\s+(?:-\S+\s+)*\\?["'']?)?(?:[^\s"''\\]*/)?slow-hook\.sh|(?=(?:[^"\\]|\\.)*?slow-hook\.sh)(?:[^"\\]|\\.)*?(?:subprocess|os\.system|Popen|execSync|spawnSync|child_process|-exec(?:dir)?\s+(?:(?:\S*/)?(?:bash|sh|zsh|dash)\s+)?\{\}|slow-hook\.sh(?:[^"\\]|\\.)*?\|\s*(?:(?:\S*/)?(?:sudo|env)\s+(?:-\S+\s+)*)*(?:\S*/)?(?:bash|sh|zsh|dash|ksh)\b|\b(?:bash|sh|zsh|dash|ksh)\s+(?:-\S+\s+)*<\s*\\?["'']?[^\s"''\\]*slow-hook\.sh))'
    min: 0
    max: 0
    arm: 'both'
  - name: no-shell-mutation
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?=(?:[^"\\]|\\.)*?(?:fixture-claude))(?:[^"\\]|\\.)*?(?:\brm\b|\brmdir\b|\bunlink\b|-delete\b|\bshred\b|\btruncate\b|\bmv\s|\bgit\s+(?:-\S+\s+(?:[^-\s]\S*\s+)?)*(?:clean|rm)\b|rmtree|os\.remove|\.unlink\(|\bsed\s+(?:-\S+\s+)*-[a-zA-Z]*i|\bperl\s+-\S*i|\btee\s+(?:-\S+\s+)*\\?["'']?[^\s"''\\]*(?:fixture-claude)|>>?\s*\\?["'']?[^\s"''\\]*(?:fixture-claude)|\bclaude\s+purge\b|write_text|write_bytes|writeFileSync|\.write\(|open\([^)]*,\s*\\?["'']?[wa]|\bcp\s+(?:-\S+\s+)*\S+\s+\\?["'']?[^\s"''\\]*(?:fixture-claude))'
    min: 0
    max: 0
    arm: 'both'
  - name: no-write-in-root
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:fixture-claude/)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-edit-in-root
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:fixture-claude/)'
    min: 0
    max: 0
    arm: 'both'
  - name: routes-deletion
    type: 'regex'
    pattern: '^(?![^\n]*\b(?:no need|not needed|unnecessary|skip(?:ped)?|instead of|rather than|without)\b)(?![^\n]*\bI(?:\s+have|[''’]ve)?\s+(?:ran|run|invoked|called|used)\s+`?/?disk-hygiene)[^\n]*(?<![/`\w-])(?<!\bnot )(?<!n[’'']t )(?<!never )`?/?disk-hygiene:clean\b'
    flags: 'im'
    target: 'last_message'
