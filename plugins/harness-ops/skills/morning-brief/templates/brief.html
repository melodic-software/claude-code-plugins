<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morning Brief</title>
<style>
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --fg: #1b2330;
  --muted: #566173;
  --line: #d6dce4;
  --accent: #2b59c3;
  --sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #12161d;
    --surface: #1a2029;
    --fg: #e4e9f0;
    --muted: #9aa5b5;
    --line: #2c3542;
    --accent: #86a8f0;
    color-scheme: dark;
  }
}
:root[data-theme=dark] {
  --bg: #12161d;
  --surface: #1a2029;
  --fg: #e4e9f0;
  --muted: #9aa5b5;
  --line: #2c3542;
  --accent: #86a8f0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); }
.page { max-width: 56rem; margin: 0 auto; padding: 0 16px; padding-block: 2rem 3rem; display: grid; gap: 1rem; }
.eyebrow { margin: 0; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0.25rem 0 0.5rem; font-size: 1.6rem; line-height: 1.2; text-wrap: balance; }
.notes { list-style: none; margin: 0; padding: 0; color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.75rem; }
.bar input { flex: 1 1 14rem; min-width: 0; padding: 0.5rem 0.65rem; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); font: inherit; }
.sections { display: grid; gap: 1rem; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0.75rem 1rem; }
summary { cursor: pointer; font-weight: 600; }
.lines { list-style: none; margin: 0.75rem 0 0; padding: 0; font-size: 0.85rem; }
.lines li { white-space: pre-wrap; overflow-wrap: anywhere; }
code { font-family: var(--mono); }
input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none; animation: none; } }
</style>
</head>
<body>
<main class="page">
<header>
<p class="eyebrow">Operator status report</p>
<h1 data-rv-text="title">Morning brief</h1>
<ol class="notes" data-rv-each="notes"><li data-rv-text="line"></li></ol>
<div class="bar">
<label for="find">Filter</label>
<input id="find" type="search" placeholder="A PR number, issue number, lane or word" data-rv-filter="lines">
</div>
</header>
<div class="sections" data-rv-each="sections">
<section>
<details open>
<summary data-rv-text="name"></summary>
<ol class="lines" data-rv-each="lines"><li><code data-rv-text="line"></code></li></ol>
</details>
</section>
</div>
</main>
</body>
</html>
