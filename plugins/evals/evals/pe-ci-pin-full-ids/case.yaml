schema_version: "1.1"
name: pe-ci-pin-full-ids
graders:
  - name: 'pins-model-full-id'
    type: 'regex'
    pattern: '(?<![\w-])--model(?:[ \t]+|=)[\"'']?(?:claude-[a-z]+-\d[\w.-]*|<[^>\n]*\bid\b[^>\n]*>)'
    flags: 'i'
  - name: 'pins-judge-full-id'
    type: 'regex'
    pattern: '--judge-model(?:[ \t]+|=)[\"'']?(?:claude-[a-z]+-\d[\w.-]*|<[^>\n]*\bid\b[^>\n]*>)'
    flags: 'i'
  - name: 'no-alias-pin'
    type: 'regex'
    pattern: '--(?:judge-)?model(?:[ \t]+|=)[\"'']?(?:sonnet|opus|haiku|fable|default|best|opusplan)(?![\w.-])'
    flags: 'i'
    match: 'not_contains'
  - name: 'trust-plugin'
    type: 'regex'
    pattern: '--trust-plugin'
  - name: 'reads-json'
    type: 'regex'
    pattern: '(?:^|[.;!?:]|\b(?:so|then|and|but)\b)[ \t*_>`-]*(?:(?![.;!?\n])(?!\b(?:not|never|no|cannot|without|nothing|rather than|instead of)\b)(?![A-Za-z]*n[''’]t\b)[^\n])*?\b(?:read|parse|check|inspect|look at|examine|load)\b[^\n.]{0,60}\b(?:JSON|results?\.json|out\.json|aggregate-result\.json)\b|\bjq\b|\bJSON\b[^\n.]{0,40}\b(?:tells|shows|says|distinguishes|explains|reveals)\b'
    flags: 'mi'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:evals:)?(?:plugin-eval)"'
