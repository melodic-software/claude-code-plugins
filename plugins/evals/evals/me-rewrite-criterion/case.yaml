schema_version: "1.1"
name: me-rewrite-criterion
graders:
  - name: 'relative-to-baseline'
    type: 'regex'
    pattern: '\b(?:half|a third|a quarter|\d+(?:\.\d+)?[ \t]?(?:%|percent\b)|\d+(?:\.\d+)?[ \t]?[x×](?!\w)|\d+-fold)[^\n]{0,80}?\b(?:baseline|current(?:ly)?|today(?:[''’]s)?|existing|measured (?:rate|level))\b|\b(?:baseline|current|existing)\b[^\n]{0,80}?(?:\bhalf\b|\ba third\b|\ba quarter\b|\b\d+(?:\.\d+)?[ \t]?(?:%|percent\b)|\b\d+(?:\.\d+)?[ \t]?[x×](?!\w)|\bby \d+)'
    flags: 'i'
  - name: 'trial-set-size'
    type: 'regex'
    pattern: '(?<![\d.])\d[\d,]*\+?[ \t]+(?:[\w-]+[ \t]+){0,3}?(?:conversations|chats|transcripts|interactions|requests|queries|cases|tickets|sessions|dialogues|trials|samples|examples|prompts|questions|refunds|exchanges|replies|responses)\b|\bn[ \t]?=[ \t]?\d+'
    flags: 'i'
  - name: 'no-invented-baseline'
    type: 'regex'
    pattern: '\b(?:baseline|current(?:ly)?|today)\b[^\n.]{0,30}?\b(?:is|of|at|sits at|runs at|around|about)\b[ \t:(~≈]*(?:roughly |about |around |approximately )?\d+(?:\.\d+)?[ \t]?%|\b(?:baseline|current rate)\b[ \t]*[:(=][ \t]*(?:e\.g\.,?[ \t]*|~|≈)?\d+(?:\.\d+)?[ \t]?%'
    flags: 'i'
    match: 'not_contains'
  - name: 'no-placeholders'
    type: 'regex'
    pattern: '(?<![\w$])[XYZN][ \t]?%|\bX/Y\b|\bTBD\b|\btarget later\b|\[(?:X|Y|Z|N|target|threshold|number|value)\]|<(?:X|Y|Z|N|target|threshold|number|value)>'
    flags: 'i'
    match: 'not_contains'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:evals:)?(?:methodology)"'
