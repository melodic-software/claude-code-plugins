schema_version: "1.1"
name: me-rewrite-criterion
graders:
  - name: 'relative-to-baseline'
    type: 'regex'
    pattern: '\b(?:half|a third|a quarter|\d+(?:\.\d+)?[ \t]?(?:%|percent\b)|\d+(?:\.\d+)?[ \t]?[x×](?!\w)|\d+-fold)(?:[ \t]+[\w-]+){0,2}?[ \t]+(?:of|from|below|than|relative to|compared (?:to|with)|vs\.?|versus|the)[ \t]+(?:(?:the|a|your|our|measured)[ \t]+)?(?:baseline|current(?:ly)?|today(?:[''’]s)?|existing|measured (?:rate|level))\b|\b(?:baseline|current|existing)\b(?:[ \t]+[\w%-]+){0,3}?[ \t]+(?:by|in)[ \t]+(?:half\b|a third\b|a quarter\b|\d+(?:\.\d+)?[ \t]?(?:%|percent\b))|\bhalv(?:e|es|ed|ing)[ \t]+(?:the|your|our)[ \t]+(?:current|baseline|existing)\b'
    flags: 'i'
  - name: 'trial-set-size'
    type: 'regex'
    pattern: '(?<![\d.])\d[\d,]*\+?[ \t]+(?:[\w-]+[ \t]+){0,3}?(?:conversations|chats|transcripts|interactions|requests|queries|cases|tickets|sessions|dialogues|trials|samples|examples|prompts|questions|refunds|exchanges|replies|responses)\b|\bn[ \t]?=[ \t]?\d+'
    flags: 'i'
  - name: 'no-invented-baseline'
    type: 'regex'
    pattern: '\b(?:baseline|current|today[''’]s|existing)[ \t]+(?:rate[ \t]+(?:of[ \t]+)?)?[~≈]?\d+(?:\.\d+)?[ \t]?%|\b(?:baseline|current(?:ly)?|today)\b[^\n.]{0,30}?\b(?:is|of|at|sits at|runs at|around|about)\b[ \t:(~≈]*(?:roughly |about |around |approximately )?\d+(?:\.\d+)?[ \t]?%|\b(?:baseline|current rate)\b[ \t]*[:(=][ \t]*(?:e\.g\.,?[ \t]*|~|≈)?\d+(?:\.\d+)?[ \t]?%'
    flags: 'i'
    match: 'not_contains'
  - name: 'no-placeholders'
    type: 'regex'
    pattern: '(?<![\w$])[XYZN][ \t]?%|\bX/Y\b|\bTBD\b|\btarget later\b|\[(?:X|Y|Z|N|target|threshold|number|value)\]|<(?:X|Y|Z|N|target|threshold|number|value)>'
    flags: 'i'
    match: 'not_contains'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:evals:)?(?:methodology)"'
