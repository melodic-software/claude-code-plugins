schema_version: "1.1"
name: pe-preflight-report
description: "Hard case. Source: legacy plugin-eval cases 1 (preflight-reports-before-spending) and 11 (same-model-judge-warned-not-blocked), whose prompts differ only by the model flags; case 11's not-a-refusal expectation is graded in default-judge-same-model. The scaffold seeds a notes plugin; run with --scaffold. The run has no Bash, so the host probes (claude --version, the temp directory) cannot run and their fields read unknown. Why hard: the base model has no preflight report; this plugin's field order, the same_model line and its warning are its own."
tags: [preflight, hard, self-reference]
runs: 3
expected_outcome: "The reply prints the preflight fields in order (cli_version through tmp_free) with no invented version number or free-space value, target_type: plugin, same_model: yes naming haiku as both models, and the warning to pass a different --judge-model; it says preflight removes nothing"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "With the evals:plugin-eval skill: preflight plugins/notes. I'll run it with --model haiku --judge-model haiku to keep it cheap."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 10
graders:
  - name: fields-in-order
    type: regex
    pattern: '\bcli_version[`*]*[ \t]*[:|][\s\S]*?\bfloor_met[`*]*[ \t]*[:|][\s\S]*?\bgit_version[`*]*[ \t]*[:|][\s\S]*?\bplatform[`*]*[ \t]*[:|][\s\S]*?\bsandbox_backend[`*]*[ \t]*[:|][\s\S]*?\btarget_type[`*]*[ \t]*[:|][\s\S]*?\bsuite_tools[`*]*[ \t]*[:|][\s\S]*?\bsame_model[`*]*[ \t]*[:|][\s\S]*?\bestimate_usd[`*]*[ \t]*[:|][\s\S]*?\bceiling[`*]*[ \t]*[:|][\s\S]*?\bleftover_sandboxes[`*]*[ \t]*[:|][\s\S]*?\btmp_free[`*]*[ \t]*[:|]'
  - name: no-invented-free-space
    type: regex
    pattern: '\btmp_free[`*]*[ \t]*[:|][ \t`*|]*\d'
    match: not_contains
  - name: cli-version-not-asserted
    type: regex
    pattern: '\bcli_version[`*]*[ \t]*[:|][ \t`*|]*v?\d+\.\d+'
    match: not_contains
  - name: target-type-plugin
    type: regex
    pattern: '\btarget_type[`*]*[ \t]*[:|][ \t`*|]*plugin(?![\w-])'
  - name: same-model-haiku
    type: regex
    pattern: '\bsame_model[`*]*[ \t]*[:|][ \t`*|]*yes\b[^\n]*\bhaiku\b[^\n]*\bhaiku\b'
    flags: i
  - name: judge-warning
    type: regex
    pattern: '\bdifferent[ \t]+`?--judge-model\b|--judge-model\b[^\n]{0,40}\bdifferent\b'
    flags: i
  - name: removes-nothing
    type: llm
    focus: last_message
    criteria: 'Expectation: "No sandbox directory is deleted; if any are left, a per-sandbox cleanup loop that runs chmod 700 on the sandbox and its sealed directory, then chmod -R u+rwx and rm -rf, is printed for the user, and the response says preflight removes nothing" (graded here: the response says preflight removes nothing and claims no deletion; the loop needs leftover sandboxes on a real host). PASS if the reply says the preflight removes or deletes nothing, does not claim to have removed any sandbox, and, if it reports leftover sandboxes above zero, gives the cleanup for the user to run. FAIL if it says it removed or will remove sandbox directories itself, or never says that preflight removes nothing. Example PASS: "Preflight removes nothing; leftover_sandboxes: unknown." Example FAIL: "Cleaned up 3 old claude-eval directories before the report."'
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evals:)?plugin-eval"'
    min: 1
    arm: with-only
