schema_version: "1.1"
name: pe-rules-target
graders:
  - name: 'not-yes'
    type: 'regex'
    pattern: '^[ \t*_#>]*You can(?![''’]t|not)\b|(?:^|\n)[ \t*_#>]*(?:Yes|Yeah|Yep|Yup|Sure|Absolutely|Definitely|Certainly|Of course)\b'
    flags: 'i'
    match: 'not_contains'
  - name: 'refuses'
    type: 'regex'
    pattern: '^[ \t*_#>]*(?:No|Not)\b|\b(?:can[''’]t|cannot|can not|won[''’]t|doesn[''’]t|does not|unable to)\b[^\n.]{0,30}\b(?:measure|test|evaluate|eval|target|do that|do this)\b|\brefuses?\b'
    flags: 'mi'
  - name: 'no-ab-test'
    type: 'regex'
    pattern: '(?:^|[.;!?:]|\b(?:so|then|and|but)\b)[ \t*_>`-]*(?:(?![.;!?\n])(?!\b(?:not|never|no|cannot|without|nothing|rather than|instead of)\b)(?![A-Za-z]*n[''’]t\b)[^\n])*?(?:\bA/B\b|\bwith(?:[ \t-]+and[ \t-]+|[ \t]*/[ \t]*|[ \t-]+(?:vs\.?|versus)[ \t-]+)without\b(?![ \t-]+(?:the |this |a |your )?plugin)|\bwith(?:out)?[ \t]+(?:the |your )?(?:rules?|CLAUDE\.md)\b[^\n.]{0,40}\bwith(?:out)?[ \t]+(?:them|it|the rules?|CLAUDE\.md)\b)(?![^\n.;]*\b(?:can[''’]t|cannot|won[''’]t|doesn[''’]t|does not|isn[''’]t|is not)\b)'
    flags: 'mi'
    match: 'not_contains'
  - name: 'throwaway-home'
    type: 'regex'
    pattern: '\b(?:throwaway|throw-away|clean|fresh|empty|isolated|blank|temporary|temp|scratch)\b[^\n.]{0,30}\b(?:home|config(?:uration)?|environment|profile|settings|directory)\b'
    flags: 'i'
  - name: 'claude-md-absent'
    type: 'regex'
    pattern: 'CLAUDE\.md\b(?:[^\n.]|\.(?=[\w/])){0,80}?\b(?:absent|(?:is|are)n[''’]t (?:loaded|present|there|read)|(?:is|are) not (?:loaded|present|read)|never (?:loads?|loaded|read)|(?:does|do)(?:n[''’]t| not) (?:load|get loaded|exist|apply)|not loaded|stripped|excluded|left out|missing|ignored|dropped)|\bno[ \t]+[`*]?CLAUDE\.md|\b(?:absent|missing|stripped|excluded)\b[^\n.]{0,60}\bCLAUDE\.md\b|\b(?:rules|instructions)\b[^\n.]{0,20}\bnever load'
    flags: 'i'
  - name: 'routes-unhobble'
    type: 'regex'
    pattern: 'harness-config:unhobble|\bunhobble\b|(?:^|[.;!?:]|\b(?:so|then|and|but)\b)[ \t*_>`-]*(?:(?![.;!?\n])(?!\b(?:not|never|no|cannot|without|nothing|rather than|instead of)\b)(?![A-Za-z]*n[''’]t\b)[^\n])*?\b(?:strip|remove|delete|disable|drop|turn off)\w*\b[^\n]{0,80}\b(?:stumbl|struggl|trip|mistake|go(?:es)? wrong|break|regress)\w*'
    flags: 'mi'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:evals:)?(?:plugin-eval)"'
