schema_version: "1.1"
name: pe-rules-target
graders:
  - name: 'not-yes'
    type: 'regex'
    pattern: '^[ \t*_#>]*Yes\b'
    flags: 'm'
    match: 'not_contains'
  - name: 'throwaway-home'
    type: 'regex'
    pattern: '\b(?:throwaway|throw-away|clean|fresh|empty|isolated|blank|temporary|temp|scratch)\b[^\n.]{0,30}\b(?:home|config(?:uration)?|environment|profile|settings|directory)\b'
    flags: 'i'
  - name: 'claude-md-absent'
    type: 'regex'
    pattern: 'CLAUDE\.md\b[^\n.]{0,60}\b(?:absent|(?:is|are)n[''’]t (?:loaded|present|there|read)|(?:is|are) not (?:loaded|present|read)|never (?:loads?|loaded|read)|(?:does|do)(?:n[''’]t| not) (?:load|get loaded|exist|apply)|not loaded|stripped|excluded|left out|missing|ignored|dropped)|\bno[ \t]+[`*]?CLAUDE\.md|\b(?:absent|missing|stripped|excluded)\b[^\n.]{0,60}\bCLAUDE\.md\b|\b(?:rules|instructions)\b[^\n.]{0,20}\bnever load'
    flags: 'i'
  - name: 'routes-unhobble'
    type: 'regex'
    pattern: 'harness-config:unhobble|\bunhobble\b|(?:^|[.;!?:]|\b(?:so|then|and|but)\b)[ \t*_>`-]*(?:(?![.;!?\n])(?!\b(?:not|never|no|cannot|without|nothing|rather than|instead of)\b)(?![A-Za-z]*n[''’]t\b)[^\n])*?\b(?:strip|remove|delete|disable|drop|turn off)\w*\b[^\n]{0,80}\b(?:stumbl|struggl|trip|mistake|go(?:es)? wrong|break|regress)\w*'
    flags: 'mi'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:evals:)?(?:plugin-eval)"'
