schema_version: "1.1"
name: pe-invalid-no-number
graders:
  - name: 'reports-invalid'
    type: 'regex'
    pattern: '\bINVALID\b'
  - name: 'reason-run-errors'
    type: 'regex'
    pattern: '\b(?:run )?errors?\b|\berrored\b'
    flags: 'i'
  - name: 'reason-traces'
    type: 'regex'
    pattern: '\btraces?\b|--keep-temp|permission denials'
    flags: 'i'
  - name: 'no-number'
    type: 'regex'
    pattern: '(?<![\d.])\+?0?\.(?:27|83|56)(?!\d)|(?<![\d.])(?:27|83|56)[ \t-]?(?:%|percent|points?|pp)\b'
    flags: 'i'
    match: 'not_contains'
  - name: 'post-invalid-instead'
    type: 'regex'
    pattern: '(?<!n[''’]t )(?<!not )(?<!never )\b(?:post|share|paste|publish|report)\b(?:verdict: ?|[^\n.;:,—!?]){0,60}?\bINVALID\b|\bINVALID\b[^\n.;]{0,60}\b(?:is what (?:you|to) (?:post|share)|to post|to share)\b'
    flags: 'i'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:evals:)?(?:plugin-eval)"'
