schema_version: "1.1"
name: pe-invalid-no-number
graders:
  - name: 'reports-invalid'
    type: 'regex'
    pattern: '\bINVALID\b(?!-)'
    flags: 'i'
  - name: 'reason-run-errors'
    type: 'regex'
    pattern: '\b(?:run )?errors?\b|\berrored\b'
    flags: 'i'
  - name: 'reason-traces'
    type: 'regex'
    pattern: '\btraces?\b|--keep-temp|permission denials'
    flags: 'i'
  - name: 'no-number'
    type: 'regex'
    pattern: '(?<![\d.])\+?0?\.(?:27|83|56)0*(?!\d)|(?<![\d.])(?:27|83|56)[ \t-]?(?:%|percent(?:age)?(?:[ \t-]?points?)?|points?|pp)\b|(?<![\w.])[+±][ \t]?(?:27|83|56)(?![\d])|(?<![\d.])(?:27|83|56)[ \t]*(?:vs\.?|versus|to|/)[ \t]*(?:27|83|56)(?![\d])|\b(?:twenty[ \t-]seven|eighty[ \t-]three|fifty[ \t-]six)\b'
    flags: 'i'
    match: 'not_contains'
  - name: 'post-invalid-instead'
    type: 'regex'
    pattern: '(?:^|[.;!?:]|\b(?:so|then|and|but)\b)[ \t*_>`-]*(?:(?![.;!?\n])(?!\b(?:not|never|no|cannot|without|nothing|rather than|instead of)\b)(?![A-Za-z]*n[''’]t\b)[^\n])*?\b(?:post|share|paste|publish|send)[ \t]+(?:(?:just |only )?(?:the|that|this|your|its|an?)[ \t]+)?[`*"“'']*(?:verdict\b|INVALID\b(?![ \t]+run\b|[''’]s\b))|\bwhat (?:you|to) (?:can |should )?(?:post|share)\b[^\n.]{0,40}\b(?:INVALID|verdict)\b|\b(?:INVALID|verdict)(?:[ \t]+(?:line|verdict))?\b[`*"”'']*[ \t]+is what (?:you|to) (?:post|share)\b'
    flags: 'mi'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:evals:)?(?:plugin-eval)"'
