schema_version: "1.1"
name: pe-partial-cost-ceiling
description: "Hard case. Source: legacy plugin-eval case 6 (partial-result-not-read-as-a-score). Why hard: asked how the plugin did, the base model reads whatever scores the file holds; this plugin's read order checks partial first, and a partial suite reports no score or delta and stays out of any trend."
tags: [reading-results, hard]
runs: 3
expected_outcome: "The reply checks partial before any score, says the suite did not finish because of cost_ceiling so its scores belong in no trend, and reports no suite score or delta"
execution:
  prompt: "With the evals:plugin-eval skill: my suite exited 2, and its results.json has partial: true with partialReason: cost_ceiling. Read it for me: how did my plugin do?"
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 10
graders:
  - name: names-cost-ceiling
    type: regex
    pattern: '\bcost[_ ]ceiling\b|\bspending (?:cap|ceiling)\b|--max-cost-usd\b'
    flags: i
  - name: partial-first
    type: llm
    focus: last_message
    criteria: 'Expectation: "partial is checked before any score is reported". PASS if the reply deals with partial: true (the suite did not finish) before, or instead of, reporting any score. FAIL if it reports a score or delta first and mentions the partial run only afterward, or never mentions it. Example PASS: "partial is true, so this suite did not finish; there is no result to read." Example FAIL: "Your with-plugin score is 0.81. Note the run was partial."'
  - name: no-score
    type: llm
    focus: last_message
    criteria: 'Expectation: "Does not present a suite score or delta as a result of the run". PASS if the reply gives no suite score, arm score or delta as the outcome of this run, and says the incomplete run belongs in no trend or must be rerun. FAIL if it states a score or delta as how the plugin did, even with a caveat. Example PASS: "The ceiling stopped the suite early, so its scores are not comparable and belong in no trend; raise the ceiling or narrow the run and rerun." Example FAIL: "Roughly +0.2 so far, with the caveat that it stopped early."'
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:evals:)?plugin-eval"'
    min: 1
    arm: with-only
