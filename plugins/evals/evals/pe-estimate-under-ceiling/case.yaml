schema_version: "1.1"
name: pe-estimate-under-ceiling
graders:
  - name: 'estimate-usd'
    type: 'regex'
    pattern: '(?<![\d.])(?:\$[ \t]?[34](?:\.\d{1,2})?(?![\d.]*\d)|\bUSD[ \t]?[34](?:\.\d{1,2})?(?![\d.]*\d)|[34](?:\.\d{1,2})?[ \t]*\((?:USD|US dollars|dollars)\)|[34](?:\.\d{1,2})?[ \t]?(?:USD|US dollars|dollars)\b|[34](?:\.\d{1,2})?[ \t]?(?:-|–|to)[ \t]?\$?[3-5](?:\.\d{1,2})?[ \t]?(?:USD|dollars)\b)'
    flags: 'i'
  - name: 'passes-ceiling'
    type: 'regex'
    pattern: '--max-cost-usd(?:[ \t]+|=)5(?:\.0+)?(?![\d.])'
  - name: 'no-confirmation-ask'
    type: 'regex'
    pattern: '\b(?:shall|should) I\b[^\n]*\?|\bwant me to\b[^\n]*\?|\bwould you like\b|\bdo you want\b[^\n]*\?|\b(?:ok|okay|alright|fine)\b[^\n?]{0,40}\?|\bsound (?:good|ok|okay|right)[ \t]*\?|(?:^|[\n.;!?:]|\b(?:so|then|and|but)\b)[ \t*_>`-]*(?:(?![.;!?\n])(?!\b(?:not|never|no|cannot|without|nothing|rather than|instead of)\b)(?![A-Za-z]*n[''’]t\b)[^\n])*?\bconfirm\b[^\n.]{0,40}\b(?:before (?:I|we)|and I(?:[''’]ll)?|so I|then I)\b|\b(?:once|when|after|as soon as|if) you(?:[ \t]+\w+)?[ \t]+(?:confirm|approve|okay|OK|say (?:so|yes|go)|give (?:me )?(?:the|a|your) (?:go[- ]ahead|OK|okay|word|green light))\b|\b(?:reply|respond|answer|say)[ \t]+(?:with[ \t]+)?["“'']?(?:yes|go|ok|okay|y)\b["”'']?[^\n.]{0,30}\b(?:I[''’]ll|I will|and I)\b|\bwait(?:ing)?[ \t]+for[ \t]+(?:your|a|the)[ \t]+(?:OK|okay|go[- ]ahead|approval|confirmation|green light|sign[- ]off|word)\b|\bplease confirm\b|\bgo[- ]ahead[ \t]*\?|\b(?:proceed|start|run(?: it)?|launch|kick (?:it )?off)[ \t]*\?|\bready(?: to (?:go|run|start|launch))?[ \t]*\?|\blet me know\b[^\n.]{0,40}\b(?:proceed|go ahead|start|run|launch|kick)\b|\bgive me (?:the|a) (?:go[- ]ahead|green light|thumbs up)\b|\bsay (?:the word|go|yes)\b'
    flags: 'i'
    match: 'not_contains'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:evals:)?(?:plugin-eval)"'
