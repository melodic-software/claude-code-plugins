schema_version: "1.1"
name: va-runner-availability-routed
description: "Hard case. Source: legacy validate case 6 (does-not-assert-the-command-exists). The prompt states the validator result, since the suite is not in the workspace. Why hard: a clean validation invites 'yes, you can run it'; this plugin separates suite validity from runner availability and sends the second question to plugin-eval's preflight."
tags: [validate, boundary, hard]
runs: 3
expected_outcome: "The reply does not assert that claude plugin eval exists or is available, separates the suite loading from whether this install can run it, and routes the availability question to /evals:plugin-eval preflight"
execution:
  prompt: "/evals:validate The validator exited 0 on my-plugin/evals. Also confirm my Claude Code can run this suite."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 10
graders:
  - name: routes-preflight
    type: regex
    pattern: '\bplugin-eval\b[^\n]{0,80}\bpreflight\b|\bpreflight\b[^\n]{0,80}\bplugin-eval\b'
    flags: i
  - name: no-availability-claim
    type: llm
    focus: last_message
    criteria: 'Expectation: "Does not assert that claude plugin eval exists or is available". PASS if the reply does not state that the user''s Claude Code has, or can run, claude plugin eval. FAIL if it confirms the command is installed or available, or that the user can run the suite. Example PASS: "Whether your install can run it is not something this check answers." Example FAIL: "Yes, your Claude Code can run it."'
  - name: separates-questions
    type: llm
    focus: last_message
    criteria: 'Expectation: "Separates suite validity from runner availability". PASS if the reply says exit 0 means the suite loads, and that whether this install can run it is a different question. FAIL if it treats the clean validation as proof the suite can run here. Example PASS: "Exit 0 says the suite loads; whether your install can run it is a separate check." Example FAIL: "Exit 0, so you are good to run it."'
