scope:
  default: change
  base: auto
  exclude: ["**/node_modules/**", "**/vendor/**", "**/dist/**", "**/build/**"]
  registries: []

complexity:
  cyclomatic:
    reference: 20
  cognitive:
    reference: null
  halstead:
    difficulty: null

size:
  mode: file-lines
  file_lines: 1000
  function_lines_pct: 5
  check: report
  copies_manifest: null

duplication:
  min_tokens: 50
  min_lines: 5
  ignore: []
  registries: []
  max_lines: null
  max_size: 1mb
  rollup_depth: 2

coverage:
  artifacts: []
  path_prefix_strip: []
  reference: null
  crap:
    reference: null

type_debt:
  reference: null

suppressions:
  correctness_rules: []

languages:
  typescript:
    enabled: true
  python:
    enabled: true
  bash:
    enabled: true
  go:
    enabled: true
  dotnet:
    enabled: true
  other:
    enabled: true
