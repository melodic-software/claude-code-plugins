schema_version: "1.1"
name: audit-suppressions-reason-told-apart
description: an eslint-disable with no reason and a noqa with one are reported as unjustified and justified
tags: [audit-suppressions, invented]
expected_outcome: The report lists two suppressions. log.js line 2 (eslint, rule no-console) has no reason and is not justified; settings.py line 1 (noqa, rule E501) is justified with the reason "a URL cannot be wrapped". No file is edited.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-metrics:audit-suppressions --all
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: ran-the-entry-script
    type: tool_used
    tool: Bash
    input_match: audit-suppressions\.sh
  - name: names-both-files
    type: regex
    pattern: 'log\.js[\s\S]*settings\.py|settings\.py[\s\S]*log\.js'
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: told-apart
    type: llm
    criteria: PASS when the final reply reports the eslint-disable-line no-console suppression in log.js as having no reason (unjustified, or not justified) and the noqa E501 suppression in settings.py as justified, with its reason about the URL. FAIL when both are given the same status, when either is missing, or when the reply says a suppression was removed or edited.
