schema_version: "1.1"
name: audit-size-reports-the-change-with-provenance-and-no-verdict
description: on a scaffolded repository with a default branch and an uncommitted change (one edited file, two new ones, one of them 1200 lines), the size report measures the change
tags: [audit, size, change-scope]
expected_outcome: 'Runs the bundled audit-size.sh against the change (merge-base diff plus uncommitted files), presents the markdown report with its Coverage of this run table and the 1000-line reference labeled as the plugin''s own number rather than ISO-backed, and renders no pass/fail verdict.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-metrics:audit size
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: ran-the-entry-script
    type: tool_used
    tool: Bash
    input_match: audit-size\.sh
  - name: expectation-1
    type: llm
    criteria: 'Invokes the skill''s scripts/audit-size.sh rather than counting lines by hand'
    focus: trace
  - name: expectation-2
    type: llm
    criteria: 'Presents the Coverage of this run table naming the collector used (scc or the bundled counter) per lane'
    focus: trace
  - name: expectation-3
    type: llm
    criteria: 'States the reference''s provenance: 1000 is the plugin''s own number, not ISO-backed'
    focus: trace
  - name: expectation-4
    type: llm
    criteria: 'Does not declare any file a failure, defect, or violation'
    focus: trace
