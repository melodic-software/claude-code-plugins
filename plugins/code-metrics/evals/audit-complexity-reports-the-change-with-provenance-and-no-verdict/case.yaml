schema_version: "1.1"
name: audit-complexity-reports-the-change-with-provenance-and-no-verdict
description: on a scaffolded repository with a default branch and an uncommitted change (a Python function with several branches, in the lane lizard and radon serve), the complexity report measures the change
tags: [audit, complexity, change-scope]
expected_outcome: 'Runs the bundled audit-complexity.sh against the change (merge-base diff plus uncommitted files), presents the markdown report with its Coverage of this run table, the cyclomatic reference of 20 cited to ISO/IEC 5055:2021 section 8.2.117, and no reference for cognitive complexity or Halstead difficulty, and renders no pass/fail verdict.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-metrics:audit complexity
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: ran-the-entry-script
    type: tool_used
    tool: Bash
    input_match: audit-complexity\.sh
  - name: expectation-1
    type: llm
    criteria: 'Invokes the skill''s scripts/audit-complexity.sh rather than estimating complexity by reading the code'
    focus: trace
  - name: expectation-2
    type: llm
    criteria: 'Presents the Coverage of this run table naming the collector and version used per lane and measure'
    focus: trace
  - name: expectation-3
    type: llm
    criteria: 'Cites ISO/IEC 5055:2021 section 8.2.117 for the cyclomatic reference of 20'
    focus: trace
  - name: expectation-4
    type: llm
    criteria: 'States that cognitive complexity and Halstead difficulty carry no reference because no standard sets one'
    focus: trace
  - name: expectation-5
    type: llm
    criteria: 'Does not declare any function a failure, defect, or violation'
    focus: trace
