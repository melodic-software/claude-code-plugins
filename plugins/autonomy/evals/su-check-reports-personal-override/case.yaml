schema_version: "1.1"
name: su-check-reports-personal-override
description: 'Setup check: /autonomy:setup check in a checkout whose tracked .claude/autonomy/binding.json says budget_posture free and whose ignored binding.local.json personal override says paid-opt-in reports the effective budget_posture as paid-opt-in, contributed by the personal override (the binding-seam ladder merges additively, the personal override last), probes node on PATH, and writes nothing. Slash-invoked, so it has no Skill grader (a slash command loads the skill without a Skill call). A run needs --scaffold and --allow-tools Bash,Write,Edit (Write and Edit are granted so the must-not graders can fail).'
tags: [setup, check, must-not]
plugins: ["../.."]
expected_outcome: 'The run resolves the binding across the ladder, reports that budget_posture resolves to paid-opt-in from the personal override (binding.local.json) over the project layer value free, notes no org_policy_home pointer so the org rung is not considered, reports whether node resolves on PATH, and changes no file.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/autonomy:setup check'
  allowed_tools: [Bash, Read, Glob, Grep, Write, Edit]
  max_turns: 15
  timeout_seconds: 360
graders:
  - name: names-overlay-value
    type: regex
    pattern: 'paid-opt-in[^\n]{0,160}(?:\blocal\b(?!-machine)|personal override|binding\.local\.json)|(?:\blocal\b(?!-machine)|personal override|binding\.local\.json)[^\n]{0,160}paid-opt-in'
    flags: 'i'
    target: last_message
    arm: both
  - name: probed-node
    type: tool_used
    tool: Bash
    input_match: '\bcommand[ \t]+-v[ \t]+node\b|\bwhich[ \t]+node\b|\btype[ \t]+(?:-[a-zA-Z]+[ \t]+)?node\b'
    arm: with-only
  - name: no-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*(?:binding(?:\.local)?\.json|\.claude/|\.gitignore)'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*(?:binding(?:\.local)?\.json|\.claude/|\.gitignore)'
    min: 0
    max: 0
    arm: both
  - name: no-shell-write
    type: tool_used
    tool: Bash
    input_match: '(?:(?<![-=])>>?[ \t]*(?:\\"|'')?[^ \t|;&<>"''\\]*|(?:\btee\b|\bcp\b|\bmv\b|\brm\b|\bmkdir\b|\bsed\b(?:[^|;&\\]|\\(?!n))*[ \t]-i)(?:[^|;&\\]|\\(?!n))*)(?:binding(?:\.local)?\.json|\.claude/autonomy|\.gitignore)'
    min: 0
    max: 0
    arm: both
