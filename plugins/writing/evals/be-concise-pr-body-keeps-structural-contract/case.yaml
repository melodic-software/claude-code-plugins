schema_version: "1.1"
name: 'be-concise-pr-body-keeps-structural-contract'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'No required section is dropped, renamed, or folded into another (Verification is not merged into Fix, Related is not merged into Summary)'
    focus: 'trace'
  - name: 'expectation-5'
    type: 'llm'
    criteria: 'The Summary section leads with what changes for customers (stale prices, up to fifteen minutes observed) rather than with the July import-job history'
    focus: 'trace'
  - name: 'expectation-6'
    type: 'llm'
    criteria: 'Each section''s prose is materially shorter than the original, so the condensation happened inside the contract rather than by deleting parts of it'
    focus: 'trace'
  - name: 'expectation-7'
    type: 'llm'
    criteria: 'The reply reports before and after word counts as plain counts'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:writing:)?be-concise"'
  - name: 'closes-line'
    type: 'regex'
    pattern: '^[ \t>]*(?:\*\*|__)?Closes #123\b'
    flags: 'm'
    target: 'last_message'
  - name: 'named-sections'
    type: 'regex'
    pattern: '^(?=[\s\S]*^[ \t>]*## Summary\b)(?=[\s\S]*^[ \t>]*## Fix\b)(?=[\s\S]*^[ \t>]*## Verification\b)(?=[\s\S]*^[ \t>]*## Related\b)'
    flags: 'm'
    target: 'last_message'
  - name: 'values-kept'
    type: 'regex'
    pattern: '^(?=[\s\S]*pricing\.tier\.imported)(?=[\s\S]*PRICE_CACHE_TTL_SECONDS)(?=[\s\S]*\b3600\b)(?=[\s\S]*\b900\b)(?=[\s\S]*pytest tests/pricing/test_cache\.py)(?=[\s\S]*#118\b)(?=[\s\S]*#131\b)'
    target: 'last_message'
