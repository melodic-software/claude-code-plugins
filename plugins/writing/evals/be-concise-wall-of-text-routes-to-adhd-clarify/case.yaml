schema_version: "1.1"
name: 'be-concise-wall-of-text-routes-to-adhd-clarify'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Output routes to `adhd:clarify` by name, gated on the `adhd` plugin being enabled'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Output states the distinguishing reason: clarify restructures without shortening, while this skill shortens'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'No condensed or reshaped version of the memo is produced'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'No before and after word counts are reported, because no reshape happened'
    focus: 'trace'
  - name: 'expectation-5'
    type: 'llm'
    criteria: 'Output does not treat the memo''s length as filler to cut; it recognizes the content as dense (four interacting decisions with named constraints such as the 2026-10-02 reservation window and the 30-minute quarterly downtime cap)'
    focus: 'trace'
  - name: 'expectation-6'
    type: 'llm'
    criteria: 'Output offers this skill as the follow-on only if the user''s actual goal is a shorter version for another reader'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:writing:)?be-concise"'
  - name: 'names-adhd-clarify'
    type: 'regex'
    pattern: '\badhd:clarify\b'
    flags: 'i'
    target: 'last_message'
