schema_version: "1.1"
name: 'be-concise-bare-invocation-sets-standing-posture'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'No file is read, no text is rewritten, and nothing is edited'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Output states that the posture is now on and names what it applies to: reader-facing prose written for the rest of the session'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'The empty argument is treated as the posture mode, not as a missing argument, an error, or a request to choose a target'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Output does not ask the user which text to reshape'
    focus: 'trace'
  - name: 'expectation-5'
    type: 'llm'
    criteria: 'No before and after word counts are reported, because nothing was reshaped'
    focus: 'trace'
  - name: 'expectation-6'
    type: 'llm'
    criteria: 'The announcement is made once and is not repeated as running narration'
    focus: 'trace'
  - name: 'no-read'
    type: 'tool_used'
    tool: 'Read'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
