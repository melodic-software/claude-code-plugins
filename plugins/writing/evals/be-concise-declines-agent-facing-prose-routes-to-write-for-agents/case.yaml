schema_version: "1.1"
name: 'be-concise-declines-agent-facing-prose-routes-to-write-for-agents'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Output declines to apply the human-only scannability properties (bottom line first, front-loaded headings, lists for scanning) to agent-facing instruction text'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Output names `docs-hygiene:write-for-agents` as the owner of agent-facing instruction prose, citing the skill by name only; it does not link or name a file inside the docs-hygiene plugin'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Output distinguishes the two universal properties (word economy, factual tone), which do apply here, from the two human-only properties, which do not'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'No bulleted, BLUF-reordered rewrite of the excerpt is produced, so the requested reshape is refused rather than delivered with a caveat'
    focus: 'trace'
  - name: 'expectation-5'
    type: 'llm'
    criteria: 'The stop-and-report rule in the excerpt (do not repair a mismatched table, report it and let the operator decide) is not treated as removable verbosity'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:writing:)?be-concise"'
  - name: 'names-write-for-agents'
    type: 'regex'
    pattern: '\bwrite-for-agents\b'
    flags: 'i'
    target: 'last_message'
