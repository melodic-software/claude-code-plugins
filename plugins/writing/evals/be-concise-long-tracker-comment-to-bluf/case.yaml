schema_version: "1.1"
name: 'be-concise-long-tracker-comment-to-bluf'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'The first sentence of the rewrite carries the decision (staged rollout behind a feature flag, big-bang cutover rejected) or the outstanding ask, so a reader who stops there still has the bottom line; it does not open with the ''wanted to give everybody an update'' preamble'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'The rejected option is still identified as rejected, not silently dropped as background now that the decision is stated'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'The explicit ask (per-ring metrics dashboard provisioned before the 2026-09-18 ship date, confirmed by end of week) appears near the top, not stranded in a final paragraph'
    focus: 'trace'
  - name: 'expectation-5'
    type: 'llm'
    criteria: 'A fresh-context semantic-diff subagent is dispatched because the input is longer than a few paragraphs, and its brief includes the ''dropped decision, number, or ask'' class; the model that wrote the rewrite does not grade its own output'
    focus: 'trace'
  - name: 'expectation-6'
    type: 'llm'
    criteria: 'The fixture file is not edited in place and the posted comment is not silently overwritten; the reshaped version is offered for the user to post'
    focus: 'trace'
  - name: 'expectation-7'
    type: 'llm'
    criteria: 'The reply reports before and after word counts as plain counts, and makes no percentage-improvement or usability claim about this rewrite'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:writing:)?be-concise"'
  - name: 'values-kept'
    type: 'regex'
    pattern: '^(?=[\s\S]*\b2\.14\.0\b)(?=[\s\S]*2026-09-18)(?=[\s\S]*2026-11-30)(?=[\s\S]*Priya Raman)'
    flags: 'i'
    target: 'last_message'
  - name: 'semantic-diff-dispatched'
    type: 'tool_used'
    tool: 'Agent'
    input_match: '.'
