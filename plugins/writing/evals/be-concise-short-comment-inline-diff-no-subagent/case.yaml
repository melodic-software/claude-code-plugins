schema_version: "1.1"
name: 'be-concise-short-comment-inline-diff-no-subagent'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'No subagent is dispatched for a semantic diff; the before and after are shown inline in the reply'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'The inline before and after stands as the verification for an input this short; the reply does not hand the rewrite over as unverified, and does not claim a subagent checked it'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'All three facts survive: the retry patch is merged, it is healthy in staging, and the author is asking for concerns'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'The filler and hedging are cut, including ''just wanted to quickly mention'', ''actually'', ''obviously'', ''so far as I can tell'', and ''at all'''
    focus: 'trace'
  - name: 'expectation-5'
    type: 'llm'
    criteria: 'The rewrite is materially shorter than the original rather than a reworded version of the same length'
    focus: 'trace'
  - name: 'expectation-6'
    type: 'llm'
    criteria: 'The reply reports before and after word counts as plain counts'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:writing:)?be-concise"'
  - name: 'no-subagent'
    type: 'tool_used'
    tool: 'Agent'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
