schema_version: "1.1"
name: 'name-it-better-tournament-preserves-reject-and-collision-filters'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Carries `OrderManager` as a main-thread reject list even in tournament mode'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Disqualifies the rejected incumbent and any candidate colliding with `OrderService` BEFORE the elimination rounds begin, not just at the finalist'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Neither the rejected incumbent nor a colliding candidate appears as the finalist or among the runners-up'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Still widens to ~5 generators, runs elimination rounds with independent judges, and ends at a human pick'
    focus: 'trace'
