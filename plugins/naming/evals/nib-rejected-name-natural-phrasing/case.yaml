schema_version: "1.1"
name: nib-rejected-name-natural-phrasing
context:
  scaffold_script: scaffold.sh
graders:
  - name: routes-name-it-better
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:naming:)?name-it-better"'
    arm: 'both'
  - name: fans-out-three
    type: tool_used
    tool: 'Agent'
    min: 3
    arm: 'both'
  - name: brief-omits-incumbent
    type: tool_used
    tool: 'Agent'
    input_match: '[Ll]edger[-_ ]?[Ss]ync'
    min: 0
    max: 0
    arm: 'both'
  - name: brief-carries-blocklist-word
    type: tool_used
    tool: 'Agent'
    input_match: '[Hh]elper'
    min: 3
    arm: 'both'
  - name: no-fork-generator
    type: tool_used
    tool: 'Agent'
    input_match: '"subagent_type"\s*:\s*"fork"'
    min: 0
    max: 0
    arm: 'both'
  - name: shortlist-no-helper-compound
    type: regex
    pattern: '`(?:[A-Za-z]+Helper[A-Za-z]*|Helper[A-Za-z]+)`'
    match: not_contains
    target: last_message
