schema_version: "1.1"
name: 'name-it-better-rejection-reason-becomes-next-round-constraint'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Captures the rejection reason as explicit new brief constraints (a scope-boundary correction plus word-level blocklist entries), not a one-off filter'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Blocklists `Store` and `Manager` with their reasons so neither re-enters any later round'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Runs a fresh blind fan-out on the corrected brief rather than patching the previous round''s candidates'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Ends at a human pick over the new shortlist'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:naming:)?name-it-better"'
