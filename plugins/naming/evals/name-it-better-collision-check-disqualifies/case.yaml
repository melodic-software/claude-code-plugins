schema_version: "1.1"
name: 'name-it-better-collision-check-disqualifies'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Collision-checks candidates against the existing vocabulary before scoring'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Disqualifies a colliding candidate rather than ranking it'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Still ends at a human choice over the surviving shortlist'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:naming:)?name-it-better"'
