schema_version: "1.1"
name: 'name-it-better-rejected-name-blind-retry-to-human-pick'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Builds a structured context brief with named fields (responsibility, firing/usage context, scope boundaries, collision vocabulary, word-level blocklist carrying the abstracted rejection reason) and seeds the generators with the brief ONLY (blind to the conversation) — the rejected name itself never appears in the brief'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Fans out ~3 fresh-context generators across distinct lenses (responsibility-literal, moment-of-use, domain-lore)'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Carries `DataManager` as a main-thread reject list and disqualifies it at merge time, even if a generator independently re-derives it'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'The rejected incumbent (`DataManager`) does not appear in the final shortlist'
    focus: 'trace'
  - name: 'expectation-5'
    type: 'llm'
    criteria: 'Presents a ranked shortlist with one marked RECOMMENDED pick listed first'
    focus: 'trace'
  - name: 'expectation-6'
    type: 'llm'
    criteria: 'STOPS for the human to choose — does not auto-lock or apply a name'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:naming:)?name-it-better"'
  - name: 'fans-out'
    type: 'tool_used'
    tool: 'Agent'
    input_match: '.'
