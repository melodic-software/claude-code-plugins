schema_version: "1.1"
name: 'name-it-better-missing-criterion-routes-upstream'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Does not bake the new criterion into the skill itself'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Routes the missing criterion up into the consuming org''s naming conventions (a standards change)'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Proceeds with generation and scoring against the resolved source of truth, ending at a human pick'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:naming:)?name-it-better"'
