schema_version: "1.1"
name: 'name-it-better-tournament-honest-framing'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Widens to ~5 generators and runs elimination rounds with independent judges'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'States the scoring criteria and their relative weight BEFORE the candidate pool comes back — never settles or re-weights the rubric after seeing the candidates'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Draws those criteria from the resolved source of truth rather than inventing them, even while deciding which ones decide this name'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Explicitly frames tournament mode as an adaptation, not an established naming standard'
    focus: 'trace'
  - name: 'expectation-5'
    type: 'llm'
    criteria: 'Presents the finalist plus runners-up for the human to pick'
    focus: 'trace'
