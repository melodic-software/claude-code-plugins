schema_version: "1.1"
name: au-x-mcp-header-c20
context:
  scaffold_script: scaffold.sh
graders:
  - name: resize-c20-fail
    type: regex
    pattern: '(?:^|\n)#{1,6}[^\n]*\bresize_cluster\b[^\n]*\n(?:(?!#{1,6}\s)[^\n]*\n){0,40}?[^\n]*(?:\bC20\b|x-mcp-header)[^\n]*\|\s*\**FAIL\**\s*\||(?:^|\n)(?=[^\n]*\bresize_cluster\b)(?=[^\n]*(?:\bC20\b|x-mcp-header))(?=[^\n]*\bFAIL(?:s|ed|ing|ures?)?\b)'
    flags: 'i'
    target: last_message
  - name: names-number-param
    type: regex
    pattern: '(?:^|\n)(?=[^\n]*\bscale\b)(?=[^\n]*\b(?:number|numeric|non-string|not\s+(?:a\s+)?string|integer|z\.number)\b)'
    flags: 'i'
    target: last_message
  - name: names-case-collision
    type: regex
    pattern: '(?:^|\n)(?=[^\n]*\bcluster\b[^\n]*\bcluster\b)(?=[^\n]*\b(?:case|duplicate?\w*|unique\w*|collid\w*|collision|conflict\w*|clash\w*|same\s+header)\b)'
    flags: 'i'
    target: last_message
  - name: export-c20-warn
    type: regex
    pattern: '(?:^|\n)#{1,6}[^\n]*\bexport_report\b[^\n]*\n(?:(?!#{1,6}\s)[^\n]*\n){0,40}?[^\n]*(?:\bC20\b|x-mcp-header)[^\n]*\|\s*\**WARN\**\s*\||(?:^|\n)(?=[^\n]*\bexport_report\b)(?=[^\n]*(?:\bC20\b|x-mcp-header))(?=[^\n]*\bWARN(?:s|ed|ing|ings)?\b)'
    flags: 'i'
    target: last_message
  - name: export-c20-not-fail
    type: regex
    pattern: '(?:^|\n)#{1,6}[^\n]*\bexport_report\b[^\n]*\n(?:(?!#{1,6}\s)[^\n]*\n){0,40}?[^\n]*(?:\bC20\b|x-mcp-header)[^\n]*\|\s*\**FAIL\**\s*\||(?:^|\n)(?=[^\n]*\bexport_report\b)(?=[^\n]*(?:\bC20\b|x-mcp-header)[^\n]*\|\s*\**FAIL\**\s*\|)|\bexport_report\b[^\n.;|]{0,60}?(?:\bC20\b|x-mcp-header)[^\n.;|]{0,30}?(?<!\bnot)(?<!\bno)(?:\s|→|->|:|=)\s*\**FAIL\b'
    match: 'not_contains'
    target: last_message
  - name: run-query-c20-pass
    type: regex
    pattern: '(?:^|\n)#{1,6}[^\n]*\brun_query\b[^\n]*\n(?:(?!#{1,6}\s)[^\n]*\n){0,40}?[^\n]*(?:\bC20\b|x-mcp-header)[^\n]*\|\s*\**PASS\**\s*\||(?:^|\n)(?=[^\n]*\brun_query\b)(?=[^\n]*(?:\bC20\b|x-mcp-header))(?=[^\n]*\bPASS(?:es|ed|ing)?\b)'
    flags: 'i'
    target: last_message
  - name: list-reports-not-flagged
    type: regex
    pattern: '(?:^|\n)#{1,6}[^\n]*\blist_reports\b[^\n]*\n(?:(?!#{1,6}\s)[^\n]*\n){0,40}?[^\n]*(?:\bC20\b|x-mcp-header)[^\n]*\|\s*\**(?:WARN|FAIL)\**\s*\||(?:^|\n)(?=[^\n]*\blist_reports\b)(?=[^\n]*(?:\bC20\b|x-mcp-header)[^\n]*\|\s*\**(?:WARN|FAIL)\**\s*\|)|\blist_reports\b[^\n.;|]{0,60}?(?:\bC20\b|x-mcp-header)[^\n.;|]{0,30}?(?<!\bnot)(?<!\bno)(?:\s|→|->|:|=)\s*\**(?:WARN|FAIL)\b'
    match: 'not_contains'
    target: last_message
  - name: fail-first
    type: llm
    criteria: "PASS only if the reply's fix guidance (what to fix first, a priority list, or a recommended order) puts every FAIL item ahead of every WARN and info item, or explicitly labels the FAIL items as the first to fix. FAIL if a WARN or info item is recommended before a FAIL item, or the reply gives no fix order at all (legacy expectation: FAIL items are prioritized ahead of WARN and info items)."
  - name: audit-skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:mcp-tools:)?audit"'
    min: 1
