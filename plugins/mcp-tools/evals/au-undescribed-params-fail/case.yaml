schema_version: "1.1"
name: au-undescribed-params-fail
context:
  scaffold_script: scaffold.sh
graders:
  - name: c6-fail
    type: regex
    pattern: '(?:^|\n)(?=[^\n]*(?:\bC6\b|\bparameters?\s+(?:has\s+|have\s+)?(?:a\s+)?descriptions?\b|\bundescribed\b))(?=[^\n]*\bFAIL(?:s|ed|ing|ures?)?\b)'
    flags: 'i'
  - name: c6-fail-not-negated
    type: regex
    pattern: '(?:^|\n)(?=[^\n]*\bC6\b)(?=[^\n]*\b(?:not|never|no|doesn''t|does\s+not|didn''t|did\s+not|won''t|wouldn''t|isn''t)\s+(?:an?\s+)?FAIL)'
    flags: 'i'
    match: 'not_contains'
  - name: names-undescribed-params
    type: regex
    pattern: '(?:^|\n)(?=[^\n]*(?:`(?:query|limit)`|\b(?:query|limit)\s+(?:param(?:eter)?s?\b|and\s+`?(?:query|limit)\b)))(?=[^\n]*(?:\b(?:lacks?|lacking|missing|no|without|undescribed|needs?\s+an?)\b|\bneither\s+\S+\s+nor\s+\S+\s+ha(?:s|ve)\s+(?:an?\s+)?`?(?:\.describe|descriptions?)\b|\badd\s+(?:an?\s+)?(?:`?\.describe\(\)`?|descriptions?)\s+(?:calls?\s+)?(?:to|for|on)\b))(?=[^\n]*(?:\bdescription\b|\bdescriptions\b|\bdescribed\b|\bdescribe\b|\.describe\b))'
    flags: 'i'
  - name: audit-skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:mcp-tools:)?audit"'
    min: 1
