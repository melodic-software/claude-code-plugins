schema_version: "1.1"
name: au-fork-no-parent-scope
context:
  scaffold_script: scaffold.sh
graders:
  - name: names-payments-tool
    type: regex
    pattern: '\bpayments_charge_card\b'
    target: last_message
  - name: names-other-server-tool
    type: regex
    pattern: '\binventory_list_items\b'
    target: last_message
  - name: identifies-blocking-fork
    type: regex
    pattern: '\bblocking\s+fork\b|\bcontext:\s*`?fork\b|\bbackground:\s*`?false\b|\bfork(?:ed)?\b[^\n.]{0,80}?\b(?:no|without|cannot|can''t|doesn''t|does\s+not|never)\b[^\n.]{0,40}?\b(?:parent|prior|earlier|previous|conversation|chat|history)\b'
    flags: 'i'
    target: last_message
  - name: skill-called-without-path
    type: tool_used
    tool: 'Skill'
    input_match: '"skill":"mcp-tools:audit"(?:,"args":"\s*")?\}'
    min: 1
    arm: 'with-only'
  - name: audit-skill-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:mcp-tools:)?audit"'
    min: 1
