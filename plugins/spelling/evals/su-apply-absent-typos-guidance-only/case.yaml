schema_version: "1.1"
name: su-apply-absent-typos-guidance-only
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'no-config-typos-toml'
    type: 'file_exists'
    path: '**/typos.toml'
    exists: false
  - name: 'no-config-underscore'
    type: 'file_exists'
    path: '**/_typos.toml'
    exists: false
  - name: 'no-config-dotfile'
    type: 'file_exists'
    path: '**/.typos.toml'
    exists: false
  - name: 'install-page'
    type: 'regex'
    pattern: 'github\.com/crate-ci/typos#install(?![\w-]|\.\w)'
    target: 'last_message'
  - name: 'guidance-for-reader'
    type: 'llm'
    criteria: 'The reply says apply itself installs nothing, and gives at least one official install method (cargo, Homebrew, Conda, pacman or a pre-built binary) for the reader to run.'
    focus: 'last_message'
  - name: 'two-refusal-reasons'
    type: 'llm'
    criteria: 'The reply gives both reasons apply installs nothing: every install is machine-level rather than a dependency recorded through the repository''s package manager, and typos publishes several official install methods, so the choice is the consumer''s.'
    focus: 'last_message'
  - name: 'config-only-if-asked'
    type: 'llm'
    criteria: 'The reply says apply does not create a typos config on its own: a minimal one is created only on an explicit ask, because the plugin imposes no rules of its own.'
    focus: 'last_message'
  - name: 'no-install'
    type: 'tool_used'
    tool: 'Bash'
