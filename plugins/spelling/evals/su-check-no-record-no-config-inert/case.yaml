schema_version: "1.1"
name: su-check-no-record-no-config-inert
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'lint-unresolved-info'
    type: 'llm'
    criteria: 'The reply reports the lint concern as unresolved (or INFO): no typos config governs the repository, so the hooks run nothing.'
    focus: 'last_message'
  - name: 'not-broken'
    type: 'llm'
    criteria: 'The reply says the plugin is not broken: resolving to nothing is the opt-out by design.'
    focus: 'last_message'
  - name: 'routes-forward'
    type: 'llm'
    criteria: 'The reply names at least one way forward without writing anything: a typos config opts the hooks in, or a spelling record written by /toolchain:setup apply spelling, which /toolchain:lint and /toolchain:check run on request (the hooks never run a record).'
    focus: 'last_message'
  - name: 'no-file-1'
    type: 'file_exists'
    path: '**/.claude/ecosystems/spelling.yaml'
    exists: false
  - name: 'no-file-2'
    type: 'file_exists'
    path: '**/_typos.toml'
    exists: false
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
