schema_version: "1.1"
name: dl-old-team-path-still-read-with-warning
graders:
  - name: 'old-path-warning'
    type: 'regex'
    pattern: '^(?=[^\n]*\.claude/instruction-placement\.md\b)(?=[^\n]*\binstruction-placement\.yaml\b)(?=[^\n]*\bmigrate-config\b)'
    flags: 'im'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the delta run does with only the old team file present. PASS only if it satisfies every point: (1) Reads the old .claude/instruction-placement.md and suppresses the Deploy conventions finding, with reason, date and layer; (2) Prints a warning naming the old file and docs/conventions/instruction-placement.yaml as where it moves; (3) Names /instruction-placement:setup apply migrate-config as the command that moves it; (4) Still reports the Lint rules finding and writes neither file. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
