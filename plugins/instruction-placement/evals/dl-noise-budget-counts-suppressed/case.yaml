schema_version: "1.1"
name: dl-noise-budget-counts-suppressed
graders:
  - name: 'suppressed-four'
    type: 'regex'
    pattern: '^(?=[^\n]*\bsuppressed\b)(?=[^\n]*(?:\b4\b|\bfour\b))'
    flags: 'im'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the delta run reports for the stated state. PASS only if it satisfies every point: (1) Reports the suppressed count explicitly; (2) Shows movement above the budget; (3) States that hiding the filtering would defeat the skill''s purpose. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
