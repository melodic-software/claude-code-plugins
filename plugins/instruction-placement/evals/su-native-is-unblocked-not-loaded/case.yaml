schema_version: "1.1"
name: su-native-is-unblocked-not-loaded
graders:
  - name: 'reports-native'
    type: 'regex'
    pattern: '\bNATIVE\b'
    target: 'last_message'
  - name: 'names-verify-load'
    type: 'regex'
    pattern: '\bverify-load\.sh\b'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the setup run reports for the stated repository. PASS only if it satisfies every point: (1) Reports NATIVE, not UNREACHABLE and not LOADED; (2) Proposes no @AGENTS.md import or symlink for this repository; (3) States that NATIVE means unblocked rather than proven loaded, naming version, session kind, or a CLAUDE.md above the repository root as what it cannot see; (4) Names verify-load.sh as the empirical proof of an actual load. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
