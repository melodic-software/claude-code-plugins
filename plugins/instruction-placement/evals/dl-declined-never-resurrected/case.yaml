schema_version: "1.1"
name: dl-declined-never-resurrected
graders:
  - name: 'declined-stands'
    type: 'regex'
    pattern: '^(?=[^\n]*(?:testing conventions|IP-004))(?=[^\n]*(?:\b(?:stays|remains|still|left) (?:`)?declined\b|\bdecision (?:stands|holds)\b|\b(?:not|never|won''t|will not) (?:be )?re-?(?:propos|open)\w*|\bnot resurrect\w*))'
    flags: 'im'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the delta run reports for the stated state. PASS only if it satisfies every point: (1) Does not re-propose the declined finding in any shape; (2) Leaves the declined status intact in the artifact; (3) Explains why declined decisions are not reopened by a re-run. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
