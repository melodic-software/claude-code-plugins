schema_version: "1.1"
name: ra-nested-agents-md-gets-shim
graders:
  - name: 'names-billing-shim'
    type: 'regex'
    pattern: '\bsrc/billing/CLAUDE\.md\b'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the realign run does with IP-002. PASS only if it satisfies every point: (1) Creates both the nested AGENTS.md and the CLAUDE.md shim; (2) Ties the shim to the root CLAUDE.md being read instead of the AGENTS.md, rather than calling it unconditional; (3) Creates the destination before excising the source; (4) Regenerates the index and verifies the result before marking the finding applied. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
