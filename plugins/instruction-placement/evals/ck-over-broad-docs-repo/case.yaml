schema_version: "1.1"
name: ck-over-broad-docs-repo
graders:
  - name: 'names-breadth-max'
    type: 'regex'
    pattern: '--breadth-max\b|\bbreadth_max\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the check run does with the over-broad result. PASS only if it satisfies every point: (1) States that over-broad does not fail the gate; (2) Accepts the repository context instead of insisting on a narrower glob; (3) Names the --breadth-max lever concretely; (4) Confirms the exit code is unaffected. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
