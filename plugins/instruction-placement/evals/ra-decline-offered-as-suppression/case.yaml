schema_version: "1.1"
name: ra-decline-offered-as-suppression
graders:
  - name: 'tracked-file-committed'
    type: 'regex'
    pattern: '^(?=[^\n]*(?:\.claude/instruction-placement\.md\b|\bteam[- ]layer\b|\bfile is tracked\b))(?=[^\n]*\bcommit\w*)'
    flags: 'im'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the realign run does with the decline. PASS only if it satisfies every point: (1) Writes `declined` to the artifact AND offers a suppression entry rather than only one; (2) Shows the composed entry, including a required reason, before writing it; (3) Writes the team-tracked layer, not the user-global file or the personal override; (4) Says the entry must be committed to reach another checkout. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
