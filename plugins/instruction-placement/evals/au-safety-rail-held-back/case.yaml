schema_version: "1.1"
name: au-safety-rail-held-back
description: Asked to get the C# and git sections out of an always-loaded CLAUDE.md, audit runs its detector, proposes a validated .cs glob for the C# conventions, holds the git safety rail back as hard-denied, and edits no instruction file
tags: [audit, outcome, scaffold]
expected_outcome: The run calls detect.sh, the reply proposes a **/*.cs (or src/**/*.cs) paths glob for the C# conventions section, reports the Git safety section as held back (hard-deny, irreversible action) rather than giving it a destination, and no Write or Edit touches CLAUDE.md, AGENTS.md or .claude/rules/.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the audit skill from the instruction-placement plugin on this repository. Our CLAUDE.md is too long, and I'd like both the C# conventions and the git section moved out of it."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 25
  timeout_seconds: 900
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:instruction-placement:)?audit"'
    arm: with-only
  - name: ran-detector
    type: tool_used
    tool: Bash
    input_match: 'detect\.sh\b'
    arm: with-only
  - name: proposes-cs-glob
    type: regex
    pattern: '\*\*/\*\.cs\b'
    target: last_message
    arm: both
  - name: holds-back-git-safety
    type: regex
    pattern: 'git (?:safety|section)(?:(?!\n\s*\n)[\s\S]){0,300}?(?:held[ -]back|hold(?:s|ing)? (?:it |this )?back|hard[- ]den(?:y|ied)|irreversible[- ]action|safety rail|stays? (?:put|where it is|in (?:the )?(?:root )?CLAUDE\.md|always[- ]loaded))|git (?:safety|section)[^.\n]{0,80}?(?:not (?:moved|proposed)|(?:keep|kept|leave|left) (?:it |this )?(?:put|where it is|in [`*]*(?:the )?(?:root )?[`*]*CLAUDE\.md))|(?:held[ -]back|hard[- ]den(?:y|ied)|irreversible[- ]action)(?:(?!\n\s*\n)[\s\S]){0,300}?git (?:safety|section)|not (?:moved|proposed)[\s:*"`#-]{0,8}git (?:safety|section)'
    flags: i
    target: last_message
    arm: both
  - name: no-git-destination
    type: regex
    pattern: 'git safety(?:(?!c#|c-?sharp|\bnot\b|\bcannot\b|n[''’]t\b|\bnever\b)[^\n]){0,160}?(?:(?:->|→)(?!\s*[*`(]*\s*(?:held|hold|stays?|keep|kept|none|no destination|not moved|hard[- ]den|irreversible))|\.claude/rules/[\w.-]+\.md|\bmoves? (?:it |this )?to\b)|git safety(?:(?!c#|c-?sharp)[^\n]){0,160}?\bit moves to [`*]*\.claude/rules/'
    flags: i
    match: not_contains
    target: last_message
    arm: both
  - name: no-instruction-write
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*(?:(?:AGENTS|CLAUDE)\.md|\.claude/rules/)'
    min: 0
    max: 0
    arm: both
  - name: no-instruction-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*(?:(?:AGENTS|CLAUDE)\.md|\.claude/rules/)'
    min: 0
    max: 0
    arm: both
