schema_version: "1.1"
name: au-checkable-rule-hands-to-codify
graders:
  - name: rung-2
    type: regex
    pattern: '^[\s>*`_-]*RUNG[*`_\s]*:[*`_\s]*2\b'
    flags: 'im'
    target: 'last_message'
    arm: both
  - name: route-hands-to-codify
    type: regex
    pattern: '^[\s>*`_-]*ROUTE[*`_\s]*:[^\n]*corrections:codify\b'
    flags: 'im'
    target: 'last_message'
    arm: both
  - name: mechanism-none
    type: regex
    pattern: '^[\s>*`_-]*MECHANISM[*`_\s]*:[*`_\s]*(?:none|n/?a|nothing)\b'
    flags: 'im'
    target: 'last_message'
    arm: both
  - name: prose-kept
    type: regex
    pattern: '^[\s>*`_-]*PROSE[*`_\s]*:[*`_\s]*kept\b'
    flags: 'im'
    target: 'last_message'
    arm: both
  - name: no-codify-run
    type: tool_used
    tool: Skill
    input_match: '"skill":"/?(?:corrections:)?codify"'
    min: 0
    max: 0
    arm: with-only
  - name: no-unavailable-claim
    type: regex
    pattern: '^[\s>*`_-]*ROUTE[*`_\s]*:[^\n]*?corrections:codify\b[^\n]{0,80}?(?:\b(?:was not|wasn''t|is not|isn''t|not)[ \t]+(?:available|installed|loaded)\b|\bunavailable\b)'
    flags: 'im'
    match: 'not_contains'
    target: 'last_message'
    arm: both
