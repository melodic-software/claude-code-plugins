schema_version: "1.1"
name: ra-no-artifact-names-audit
graders:
  - name: 'names-audit'
    type: 'regex'
    pattern: '/instruction-placement:audit\b'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the realign run does with the stated state. PASS only if it satisfies every point: (1) Reads the branch''s memory-tier home rather than assuming a fixed path; (2) Stops and names the audit skill as the producer of the artifact; (3) Refuses a fallback artifact from another home or branch, explaining the stale-line-range risk; (4) Mutates nothing. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
