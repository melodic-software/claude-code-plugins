schema_version: "1.1"
name: su-migrate-config-preview-before-write
graders:
  - name: 'preview-asks-first'
    type: 'regex'
    pattern: '^(?=[^\n]*\bdocs/conventions/instruction-placement\.yaml\b)(?=[^\n]*(?:\byes\b|\bconfirm|\bapprov|\bgo ahead\b|\bproceed\b))'
    flags: 'im'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the setup apply migrate-config run does with the two old files and no answer from the operator yet. PASS only if it satisfies every point: (1) Names .claude/instruction-placement.md and its target docs/conventions/instruction-placement.yaml, and shows the target as it will read, carrying the 9c1e0b7a44d2f310 entry; (2) Asks for an explicit yes for that file before writing it, and writes and deletes nothing in this run; (3) Says the old file is deleted only after the new file is written and read back resolving the same entries, never before; (4) For .claude/instruction-placement.local.md, says the target docs/conventions/instruction-placement.local.yaml is not gitignored, names the missing docs/conventions/**/*.local.* line, and says that file is skipped and left in place (now, or once the check runs after a yes) rather than written. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted, or if the reply reports any file written or deleted.'
