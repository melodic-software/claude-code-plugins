schema_version: "1.1"
name: mg-other-tools-dirs-left-alone
graders:
  - name: 'no-row-by-design'
    type: 'regex'
    pattern: '^(?=[^\n]*(?:\.cursor|\.codex|\bcursor\b|\bcodex\b))(?=[^\n]*(?:\bby design\b|\bdeliberate\w*|\bon purpose\b|\bintentional\w*|\bnot (?:a |an )?(?:miss|gap|oversight)\b))'
    flags: 'im'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the migrate run does with the request. PASS only if it satisfies every point: (1) Creates no CLAUDE.md under .cursor/ or .codex/; (2) Explains that those files are the other tools'', not unshimmed Claude surfaces; (3) Notes that the plan reports no row for them by design; (4) Offers the root AGENTS.md as where genuinely shared content goes. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
