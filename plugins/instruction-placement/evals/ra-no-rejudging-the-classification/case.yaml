schema_version: "1.1"
name: ra-no-rejudging-the-classification
graders:
  - name: 'names-reaudit'
    type: 'regex'
    pattern: '\bre-?audit\w*|\b(?:run|rerun) (?:the )?audit again\b|/instruction-placement:audit\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the realign run does with IP-005. PASS only if it satisfies every point: (1) Refuses to substitute a destination the audit did not classify; (2) Stops on that finding rather than improvising an alternative; (3) Names re-audit as the correct route; (4) States that content is relocated verbatim, not rewritten in transit. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
