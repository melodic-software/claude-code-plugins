schema_version: "1.1"
name: ck-missing-index-is-a-recommendation
graders:
  - name: 'index-recommended'
    type: 'regex'
    pattern: '^(?=[^\n]*\bindex\b)(?=[^\n]*\brecommend\w*)(?![^\n]*\bnot (?:a |just a |only a )?recommend)'
    flags: 'im'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the check run does with the stated script output. PASS only if it satisfies every point: (1) Does not fail the gate solely because no index block exists; (2) Explains the discoverability the index provides, since no deferred surface announces itself; (3) Distinguishes the missing-index case from the drifted-index case; (4) Names which file it resolved as the index target. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
