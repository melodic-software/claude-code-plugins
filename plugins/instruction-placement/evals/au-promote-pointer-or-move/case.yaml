schema_version: "1.1"
name: au-promote-pointer-or-move
graders:
  - name: 'migration-routed-out'
    type: 'regex'
    pattern: '^(?=[^\n]*\bmigration)(?=[^\n]*(?:\bdedup\w*|\bduplicat\w*|\bsingle[- ]source\b|\bssot\b|\brout(?:e|ed|es|ing) (?:it )?out\b|\bnot a placement\b|\bextract-ssot\b))'
    flags: 'im'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the audit run does with the contributor guide. PASS only if it satisfies every point: (1) Distinguishes normative content from tutorial, rationale, and historical prose; (2) Notes that promote candidates carry no presence to lose; (3) Chooses between the pointer variant and the move variant per candidate rather than always copying; (4) Routes already-duplicated content out instead of picking a winner. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
