schema_version: "1.1"
name: dl-broken-glob-despite-untouched-rules
graders:
  - name: 'payments-broken-glob'
    type: 'regex'
    pattern: '^(?=[^\n]*(?:payments\.md|src/payments))(?=[^\n]*\bbroken[- ]glob\b)'
    flags: 'im'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the delta run does with the stated state. PASS only if it satisfies every point: (1) Re-validates globs even when the rules tree is untouched; (2) Reports a glob that stopped resolving as broken-glob; (3) Explains that a refactor elsewhere breaks globs with no signal; (4) Does not accept ''nothing touched the rules folder'' as a reason to skip validation. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
