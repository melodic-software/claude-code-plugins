schema_version: "1.1"
name: capture-request-routes-to-drive
description: A request to profile a running process with no artifact in hand routes the capture to /app-control:drive capture and runs no profiler
tags: [analyze-profile, routing]
expected_outcome: The answer says analyze-profile reads an existing profile, trace or heap snapshot and does not record one, names /app-control:drive capture with a CPU kind as the command for the person to run, and asks the user to come back with the file. No profiler, debugger or attach command runs, and no Skill call invokes app-control:drive.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/debugging:analyze-profile profile this process: our export worker (node workers/export.js orders.json) pins a core at 100% for minutes on every run. We have no profile yet. I'm at my desk; find out why."
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: no-profiler-run
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"(?:[^"\\]|\\.)*?(?:--cpu-prof|--inspect|--prof(?![\w-])|\bperf\s+(?:record|top|stat)\b|\bpy-spy\s+(?:record|dump|top)\b|\bclinic\s+(?:doctor|flame|bubbleprof|heapprofiler)\b|\bkill\s+-(?:s\s+)?(?:SIG)?USR1\b|\bnode\s+inspect\b|\brequire\([^)]*workers/export|\bnode(?:\s+--?(?!-)(?!check\b|c\b)[\w-]+(?:[=\s]+[^-\s=]\S*)?)*\s+(?:\\"|'')?(?:\S*/)?(?:workers/)?export\.js)|"command":\s*"(?:(?:[^"\\]|\\.)*?(?:[;&|(]|\\n|\\"))?\s*(?:(?:timeout\s+\S+|nohup|time|env|exec|xargs)\s+)*(?:sudo|gdb|lldb|strace|0x)\b(?!\s+(?:--version|--help|-h|-v)\b)'
    min: 0
    max: 0
    arm: both
  - name: routes-to-drive-capture
    type: regex
    pattern: '/app-control:drive\s+capture'
    arm: both
  - name: names-cpu-kind
    type: regex
    pattern: '/app-control:drive\s+capture(?:[ \t]+[^\s`()]+)*?[ \t]+--kind(?:=|[ \t]+)cpu\b'
    arm: both
  - name: no-heap-kind
    type: regex
    pattern: '/app-control:drive\s+capture(?:[ \t]+[^\s`()]+)*?[ \t]+--kind(?:=|[ \t]+)heap\b'
    match: not_contains
    arm: both
  - name: drive-not-invoked
    type: tool_used
    tool: Skill
    input_match: 'app-control:drive'
    min: 0
    max: 0
    arm: both
  - name: asks-for-the-file
    type: llm
    criteria: 'PASS when the final reply leaves the recording to the user, asks the user to come back with the recorded file so it can be read, and names no cause in the worker, found, suspected or possible. FAIL when the reply names a specific cause in the worker (a function, loop, file or line) as found, suspected or possible, offers a code fix, or does not ask for the recorded file. A general reason for choosing the CPU kind is not a cause.'
    arm: both
