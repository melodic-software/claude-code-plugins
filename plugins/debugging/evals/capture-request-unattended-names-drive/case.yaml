schema_version: "1.1"
name: capture-request-unattended-names-drive
description: An unattended request to profile a running process with no artifact in hand stops, names /app-control:drive capture for a person to run, and records nothing
tags: [analyze-profile, routing, unattended]
expected_outcome: The answer says no profile, trace or heap snapshot is in hand and analyze-profile does not record one, names /app-control:drive capture with a CPU kind as the command for a person to run, and stops. No profiler, debugger or attach command runs, and no Skill call invokes app-control:drive.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/debugging:analyze-profile This is a scheduled overnight job and nobody is watching it. Our export worker (node workers/export.js orders.json) pins a core at 100% for minutes on every run, and we have no profile of it yet. Find out why."
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: no-profiler-run
    type: tool_used
    tool: Bash
    input_match: '"command":\s*"(?:(?:[^"''\\]|\\[^"\\]|\\\\(?:[^"\\]|\\.)|\\"(?:[^"\\]|\\[^"\\]|\\\\(?:[^"\\]|\\.))*\\"|''(?:[^''"\\]|\\.)*'')*?(?:[;&|(`]|\\n|\\"(?:[^"\\]|\\[^"\\]|\\\\(?:[^"\\]|\\.))*?(?:\$\(|`)))?(?:\s|\\[nt])*(?:(?:[\w.~+-]*/){0,8}(?:(?:(?:bash|zsh|dash|ksh|sh)(?:\s+(?!-\w*c\s)--?\w[-\w]*){0,4}?\s+-\w*c(?:\s+--)?|eval|watch(?:\s+-[-\w]+(?:[=\s]+\d[\d.]*)?){0,4}|hyperfine(?:\s+-[-\w]+(?:[=\s]+\d+)?){0,6}|ssh(?:(?:\s+[^\s"\\-][^\s"\\]*|\s+-\w+){1,8}?(?:\s+--)?(?=\s+(?:(?:\\\\)*\\"|''))|(?:\s+-\w+){0,6}\s+[^\s"\\-][^\s"\\]*(?:\s+--)?(?=\s+(?!(?:\\\\)*\\"|'')))|su(?:\s+(?!-\w*c\s)[^\s"\\]+){0,4}?\s+-\w*c|script(?:\s+-(?!\w*c\s)\w+){0,4}?\s+-\w*c)\s+(?:(?:(?:\\\\)*\\"|'')(?:\s|\\[nt])*)?|(?:timeout(?:\s+-[sk]\s+[^\s"\\;&|()-][^\s"\\;&|()]*|\s+-(?![sk]\s)[^\s"\\;&|()]*){0,4}\s+[^\s"\\;&|()-][^\s"\\;&|()]*\s+|nice(?:\s+-n)?(?:\s+-?\d+)?\s+|xargs(?:\s+-(?:I|n|P|L|d|a|E|s)\s+[^\s"\\;&|()-][^\s"\\;&|()]*|\s+-(?!(?:I|n|P|L|d|a|E|s)\s)[^\s"\\;&|()]*){0,6}\s+|time(?:\s+-[A-Za-z]+){0,4}\s+|env(?:\s+-u\s+[^\s"\\;&|()-][^\s"\\;&|()]*|\s+-(?!u\s)[-\w]+(?:=[^\s"\\;&|()]+)?){0,6}\s+|(?:nohup|exec|command|then|do|else|if|elif|while|until|!|\{)\s+|(?:npx|bunx|(?:npm|pnpm|yarn)(?:\s+-[-\w]+){0,4}\s+(?:exec|dlx)|yarn)(?:\s+-(?!-\s)[-\w]+(?:=[^\s"\\;&|()]+)?){0,6}(?:\s+--)?\s+|kubectl(?:\s+(?!exec\b)[^\s"\\;&|()]+){0,10}?\s+exec(?:\s+(?!--\s)[^\s"\\;&|()]+){0,10}?\s+--\s+))|[A-Za-z_]\w*=(?:[^\s"\\;&|()]|\\[^nt]){0,200}\s+|(?:[^"''\\;&|(`]|\\[^"\\n]|\\\\(?:[^"\\]|\\.)|''(?:[^''"\\]|\\.)*'')*(?:[;&|(`]|\\n)(?:\s|\\[nt])*){0,8}(?:(?:\\\\)*\\"|'')?(?:\\\\)?(?:[\w.~+-]*/){0,8}(?:(?:sudo|doas|gdb(?:-multiarch)?|lldb(?:-\d+)?|strace|0x)(?![\w.-])(?!(?:(?:\\\\)*\\"|'')?\s+(?:--version|--help|-h|-v)\b)|perf\s+(?:record|top|stat)\b|py-spy\s+(?:record|dump|top)\b|clinic\s+(?:doctor|flame|bubbleprof|heapprofiler)\b|kill\s+(?:-[sn]\s+|--signal[=\s]+|-)(?:(?:SIG)?USR1|10)\b|node(?:mon)?(?:\s+inspect\b|(?:\s+--?(?!-)(?!(?:check|c|e|p|pe|eval|print)\b)[\w-]+(?:[=\s]+(?:\\"(?:[^"\\]|\\