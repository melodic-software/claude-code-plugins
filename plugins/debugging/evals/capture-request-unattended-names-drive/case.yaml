?:require|import)\(\s*(?:[\w.$]+\(\s*(?:[\w$]+\s*,\s*)?)?(?:\\+"|''|`)[^''"`\\)]*workers/export|workers/export(?:[^''"\\]|\\.){0,400}?(?:require|import)\(\s*[A-Za-z_$]))))))|"command":\s*"(?:[^"\\]|\\.)*?<<(?=(?:[^"\\]|\\.){0,4000}?workers/export)(?=(?:[^"\\]|\\.){0,4000}?(?:require|import)\b)(?:[^"\\]|\\.){0,4000}?(?:[;&|(`]|\\n)(?:\s|\\[nt])*(?:[\w.~+-]*/){0,8}node(?:mon)?\s+(?:(?:\\\\)*\\"|'')?[^\s"\\''-]'
    min: 0
    max: 0
    arm: both
  - name: names-drive-capture
    type: regex
    pattern: '/app-control:drive\s+capture'
    arm: both
  - name: names-cpu-kind
    type: regex
    pattern: '/app-control:drive\s+capture`?[,:;.]?(?:[ \t]+(?:(?:[Nn]o[t]|NOT|[Nn]ever|[Ww]ithout|[Nn]o|[Dd]on''t|[Aa]void)(?:[ \t]+(?:pass|passing|use|using|add|adding|set|setting))?[ \t]+`?--kind(?:=|[ \t]+)[^\s`()]+(?:`[^\s`()]*)?|(?!(?:[Nn]o[t]|NOT|[Nn]ever|[Ww]ithout|[Nn]o|[Dd]on''t|[Aa]void)(?:[ \t]+(?:pass|passing|use|using|add|adding|set|setting))?[ \t]+`?--kind)(?!`?--kind)[^\s`()]+)){0,40}?[ \t]+\(?`?--kind(?:=|[ \t]+)cpu\b'
    arm: both
  - name: no-heap-kind
    type: regex
    pattern: '/app-control:drive\s+capture`?[,:;.]?(?:[ \t]+(?:(?:[Nn]o[t]|NOT|[Nn]ever|[Ww]ithout|[Nn]o|[Dd]on''t|[Aa]void)(?:[ \t]+(?:pass|passing|use|using|add|adding|set|setting))?[ \t]+`?--kind(?:=|[ \t]+)[^\s`()]+(?:`[^\s`()]*)?|(?!(?:[Nn]o[t]|NOT|[Nn]ever|[Ww]ithout|[Nn]o|[Dd]on''t|[Aa]void)(?:[ \t]+(?:pass|passing|use|using|add|adding|set|setting))?[ \t]+`?--kind)(?!`?--kind)[^\s`()]+)){0,40}?[ \t]+\(?`?--kind(?:=|[ \t]+)heap\b'
    match: not_contains
    arm: both
  - name: drive-not-invoked
    type: tool_used
    tool: Skill
    input_match: 'app-control:drive'
    min: 0
    max: 0
    arm: both
  - name: stops-for-a-person
    type: llm
    criteria: 'PASS when the final reply says no profile, trace or heap snapshot exists yet, leaves the recording to a person or a later attended run, and reports no profiling result of its own. FAIL when the reply says it recorded, started or attached a profiler, or names a cause as found from a recording made in this run.'
    arm: both
