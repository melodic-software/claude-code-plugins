  - name: 'tracked-stays-in-scope'
    type: 'llm'
    criteria: 'The reply says a tracked file that matches an ignore pattern stays in scope.'
    focus: 'last_message'
  - name: 'opt-in-route'
    type: 'llm'
    criteria: 'The reply names setting go_format_lint_gitignored to true as the way to act on gitignored files, through the plugin''s own settings flow: Claude Code''s native plugin configure flow, interactive or headless.'
    focus: 'last_message'
  - name: 'no-repo-config-needed'
    type: 'llm'
    criteria: 'The reply says getting gitignored files formatted needs no repository configuration, since the option is a plugin setting. Telling the user to add repository configuration fails.'
    focus: 'last_message'
