schema_version: "1.1"
name: rd-reversal-asks-before-retiring
context:
  scaffold_script: scaffold.sh
graders:
  - name: old-record-not-edited
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"[^"]*0002-serve-the-public-api'
    min: 0
    max: 0
    arm: both
  - name: old-record-not-overwritten
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"[^"]*0002-serve-the-public-api'
    min: 0
    max: 0
    arm: both
  - name: old-record-not-removed
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\brm\b|\bmv\b|\bunlink\b|\bsed\s+-i)(?:[^"\\]|\\.)*?0002'
    min: 0
    max: 0
    arm: both
  - name: names-old-record
    type: regex
    pattern: '\b(?:ADR[- ]?0*2|0002)\b'
    flags: 'i'
    target: last_message
  - name: asks-before-retiring
    type: regex
    pattern: '\b(?:delete|deleting|remove|removing|retire|retiring|supersede|superseding|archive|archiving)\b[^?]*\?'
    flags: 'is'
    target: last_message
