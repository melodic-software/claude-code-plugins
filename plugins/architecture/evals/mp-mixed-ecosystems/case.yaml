schema_version: "1.1"
name: mp-mixed-ecosystems
context:
  scaffold_script: scaffold.sh
graders:
  - name: ecosystems-per-node
    type: regex
    pattern: '^(?![\s\S]*"id"\s*:\s*"[^"]*(?:Gemfile|rake))(?=[\s\S]*"result"\s*:\s*"ok")(?=[\s\S]*"ecosystem"\s*:\s*"mixed")(?=[\s\S]*\{"id":"a/package\.json",[^\n]*"ecosystem":"node")(?=[\s\S]*\{"id":"b/package\.json",[^\n]*"ecosystem":"node")(?=[\s\S]*\{"id":"c/go\.mod",[^\n]*"ecosystem":"go")'
    target: { source: file, path: docs/architecture/dependency-graph.json }
  - name: edges-cite-manifests
    type: regex
    pattern: '^(?=[\s\S]*\{"from":"a/package\.json","to":"b/package\.json","kind":"project","status":"resolved","evidence":"a/package\.json: \\"b\\": \\"file:\.\./b\\""\})(?=[\s\S]*\{"from":"c/go\.mod","to":"a/go\.mod","kind":"project","status":"resolved","evidence":"c/go\.mod: replace example\.com/foo => \.\./a"\})'
    target: { source: file, path: docs/architecture/dependency-graph.json }
  - name: reply-names-gemfile-unread
    type: regex
    pattern: '\bGemfile\b[^\n]{0,200}?(?:\bnot read\b|\bunread\b|\bno (?:shipped )?adapter\b|\bdeclined\b|n''t read\b)|(?:\bnot read\b|\bunread\b|\bdeclined\b)[^\n]{0,200}?\bGemfile\b'
    flags: 'i'
    target: last_message
  - name: no-per-ecosystem-run
    type: tool_used
    tool: 'Bash'
    input_match: 'dependency-graph\.sh(?:\\"|'')?(?:[ \t]+--(?:out|generated-on)[ \t=]+\S+)*[ \t]+(?:\\"|'')?(?:[^\s"\\]*/)?(?:a|b|c)/?(?:\\"|'')?(?:[ \t;&|]|")'
    min: 0
    max: 0
    arm: both
  - name: no-record-write
    type: tool_used
    tool: 'Write'
    input_match: 'dependency-graph\.json'
    min: 0
    max: 0
    arm: both
  - name: no-record-edit
    type: tool_used
    tool: 'Edit'
    input_match: 'dependency-graph\.json'
    min: 0
    max: 0
    arm: both
