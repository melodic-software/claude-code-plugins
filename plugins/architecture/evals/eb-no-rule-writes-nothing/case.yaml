schema_version: "1.1"
name: eb-no-rule-writes-nothing
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-write
    type: tool_used
    tool: 'Write'
    input_match: '.'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    input_match: '.'
    min: 0
    max: 0
    arm: both
  - name: no-shell-write
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\bmkdir\b|\btouch\b|\btee\b|\bcp\b|\bmv\b|\brm\b|\bsed\s+-i|>>?\s*(?!/dev/null|&)\S+|\b(?:python3?\s+-c|node\s+-e)\b|\bgit\s+(?:add|commit|checkout|restore|stash|reset)\b)'
    min: 0
    max: 0
    arm: both
