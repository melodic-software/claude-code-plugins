schema_version: "1.1"
name: rd-declared-path-outside-repo-not-written
context:
  scaffold_script: scaffold.sh
graders:
  - name: writes-local-record
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?<!platform-docs/)docs/adr/0003-[^"/]*\.md"'
    min: 1
    max: 1
  - name: no-cross-repo-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?platform-docs'
    min: 0
    max: 0
    arm: both
  - name: no-cross-repo-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?platform-docs'
    min: 0
    max: 0
    arm: both
  - name: no-cross-repo-shell-write
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\bmkdir\b|\btouch\b|\btee\b|\bcp\b|\bmv\b|\bgit\s+clone\b|>)(?:[^"\\]|\\.)*?platform-docs'
    min: 0
    max: 0
    arm: both
