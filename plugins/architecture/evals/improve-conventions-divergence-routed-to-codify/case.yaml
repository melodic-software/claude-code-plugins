schema_version: "1.1"
name: 'improve-conventions-divergence-routed-to-codify'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Lists the OrderStore owner entry as already recorded, citing docs/standards/paved-paths.md, and does not propose it again'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Reports ShipmentJob.cs:42 and RefundService.cs:77 as a divergence from the recorded owner'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'On the yes, invokes /corrections:codify through the Skill tool with a description naming the convention, its source and both departing places'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Writes no check, no boundary rule and no paved-path entry itself'
    focus: 'trace'
