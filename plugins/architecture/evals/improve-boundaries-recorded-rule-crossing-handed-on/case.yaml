schema_version: "1.1"
name: 'improve-boundaries-recorded-rule-crossing-handed-on'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Takes the rule sources from the ''Where boundary rules live'' list in the enforcement-ladder copy rather than a list of its own'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Reports the src/Billing.Reports to src/Billing.Ledger edge as crossing the rule, citing ARCHITECTURE.md:14 and the manifest declaration the edge''s evidence names'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Writes the findings file under .work/improve/feature-billing-split/ and not under .work/reviews/'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'The findings file has type: review-findings frontmatter and places the confirmed rule''s row under a ''### architecture'' heading'
    focus: 'trace'
  - name: 'expectation-5'
    type: 'llm'
    criteria: 'Names the findings file in the report and offers /corrections:codify findings <file> without invoking it'
    focus: 'trace'
  - name: 'expectation-6'
    type: 'llm'
    criteria: 'Writes no architecture test and edits no source file'
    focus: 'trace'
