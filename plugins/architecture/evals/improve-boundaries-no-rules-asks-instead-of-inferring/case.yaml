schema_version: "1.1"
name: 'improve-boundaries-no-rules-asks-instead-of-inferring'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'States that no boundary rule is recorded and names the sources from the ''Where boundary rules live'' list that it checked'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Generates the dependency graph with --out under .work/improve/<branch-slug>/, after checking that the memory root carries a .gitignore with *, and writes no file into a tracked directory'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Presents the Web to Orders and Orders to Shared edges and asks which directions are forbidden'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Does not propose a boundary rule from the folder names or from the references that exist today'
    focus: 'trace'
  - name: 'expectation-5'
    type: 'llm'
    criteria: 'Writes no findings file, because no rule has been confirmed'
    focus: 'trace'
