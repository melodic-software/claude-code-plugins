schema_version: "1.1"
name: rd-provisional-on-unrun-prototype-offers-skip
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-record-written
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"[^"]*docs/adr/'
    min: 0
    max: 0
    arm: both
  - name: no-record-edited
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"[^"]*docs/adr/'
    min: 0
    max: 0
    arm: both
  - name: no-shell-write
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\bmkdir\b|\btouch\b|\btee\b|\bcp\b|\bmv\b|\binstall\b|\bdd\b[^"]*\bof=|\bsed\s+-i|>>?\s*(?!/dev/null|&)\S*\.(?:md|markdown|txt|adoc|rst|yaml|yml)\b|\b(?:python3?\s+-c|node\s+-e)\b(?:[^"\\]|\\.)*?(?:write|dump|shutil\.(?:move|copy\w*)|os\.(?:rename|replace)|\.rename\(|\.replace\((?=\s*[^,()]*(?:\([^()]*\)[^,()]*)?\))|copyFile(?:Sync)?|rename(?:Sync)?|cp(?:Sync)?\(|(?:os|fs)\.(?:sym)?link(?:Sync)?|''[wa]\+?''|\\"[wa]\+?\\")|\|\s*(?:bash|zsh|dash|sh)\b|\bgit\s+(?:add|commit)\b)'
    min: 0
    max: 0
    arm: both
  - name: names-unrun-prototype
    type: regex
    pattern: '\b(?:prototype|spike)\b[^.\n]*\b(?:not (?:yet )?run|hasn.t (?:yet )?run|has not (?:yet )?run|unrun|provisional|pending|verdict|until)\b|\b(?:provisional|not yet eligible)\b[^.\n]*\b(?:prototype|spike)\b'
    flags: 'i'
    target: last_message
  - name: offers-skip
    type: regex
    pattern: '\b(?:skip|hold|wait|defer|still want|anyway)\b[^?\n]*\?'
    flags: 'i'
    target: last_message
