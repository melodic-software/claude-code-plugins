schema_version: "1.1"
name: 'improve-conventions-proposes-and-writes-nothing-without-yes'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Checks the boundary-rule sources from the enforcement ladder''s ''Where boundary rules live'' list and the standards index for a paved-path row before deriving anything, and names what it checked'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Presents the request-handler building block as a proposal citing the handler files as path:line instances'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Names the proposal''s route as a paved-path entry for /discipline:reuse-or-replace'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Asks which proposals to record'
    focus: 'trace'
  - name: 'expectation-5'
    type: 'llm'
    criteria: 'Writes no file and invokes no other skill, because the user has not said yes to any proposal'
    focus: 'trace'
