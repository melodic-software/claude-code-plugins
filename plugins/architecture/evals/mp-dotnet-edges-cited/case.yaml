schema_version: "1.1"
name: mp-dotnet-edges-cited
context:
  scaffold_script: scaffold.sh
graders:
  - name: collects-to-architecture-dir
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?dependency-graph\.sh(?:\\"|'')?[ \t](?:[^"\\]|\\.)*?(?:--out[\s=]+|>[ \t]*)(?:\\"|'')?(?:[^"\\\s]*/)?docs/architecture/dependency-graph\.json\b'
    min: 1
  - name: edges-cited
    type: regex
    pattern: '^(?=[\s\S]*\n[ \t]*\{"from":"src/App/App\.csproj","to":"src/Lib/Lib\.csproj","kind":"project","status":"resolved","evidence":"src/App/App\.csproj: <ProjectReference Include=\\"\.\./Lib/Lib\.csproj\\" />"\},?\n)(?=[\s\S]*\n[ \t]*\{"from":"src/App/App\.csproj","to":"pkg:Newtonsoft\.Json","kind":"package",[^\n]*\},?\n)'
    target: { source: file, path: docs/architecture/dependency-graph.json }
  - name: renders-with-script
    type: tool_used
    tool: 'Bash'
    input_match: 'render-dependencies\.sh(?:\\"|'')?[ \t](?:[^"\\]|\\.)*?--record\b'
    min: 1
  - name: package-not-in-flowchart
    type: regex
    pattern: '^(?![\s\S]*```mermaid\n(?:(?!```)[\s\S])*Newtonsoft)[\s\S]*```mermaid\nflowchart [^\n]*\n(?:(?!```)[\s\S])*\["src/App/App\.csproj"\](?:(?!```)[\s\S])*\["src/Lib/Lib\.csproj"\](?:(?!```)[\s\S])*-->'
    target: { source: file, path: docs/architecture/dependency-graph.md }
  - name: no-hand-write
    type: tool_used
    tool: 'Write'
    input_match: 'dependency-graph\.(?:md|json)'
    min: 0
    max: 0
    arm: both
  - name: no-hand-edit
    type: tool_used
    tool: 'Edit'
    input_match: 'dependency-graph\.(?:md|json)'
    min: 0
    max: 0
    arm: both
  - name: no-shell-flowchart-write
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:(?:\bcp\b|\bmv\b|\binstall\b|\bdd\b|\bsed\s+-i|\bperl\s+-\S*i|\btee\b|>\||>>?)(?:[^"\\|;&]|\\.)*?dependency-graph\.md|\b(?:python3?\s+-c|node\s+-e)\b(?:[^"\\]|\\.)*?(?:(?:write|dump|shutil\.(?:move|copy\w*)|os\.(?:rename|replace)|\.rename\(|\.replace\((?=\s*[^,()]*(?:\([^()]*\)[^,()]*)?\))|copyFile(?:Sync)?|rename(?:Sync)?|cp(?:Sync)?\(|(?:os|fs)\.(?:sym)?link(?:Sync)?|''[wa]\+?''|\\"[wa]\+?\\")(?:[^"\\]|\\.)*?dependency-graph\.md|dependency-graph\.md(?:[^"\\]|\\.)*?(?:write|dump|shutil\.(?:move|copy\w*)|os\.(?:rename|replace)|\.rename\(|\.replace\((?=\s*[^,()]*(?:\([^()]*\)[^,()]*)?\))|copyFile(?:Sync)?|rename(?:Sync)?|cp(?:Sync)?\(|(?:os|fs)\.(?:sym)?link(?:Sync)?|''[wa]\+?''|\\"[wa]\+?\\"))|\|\s*(?:bash|zsh|dash|sh)\b)'
    min: 0
    max: 0
    arm: both
  - name: quotes-summary-line
    type: regex
    pattern: '\bresult=ok\b[\s\S]{0,200}?\bnodes=3\b[\s\S]{0,200}?\binternal_edges=1\b[\s\S]{0,200}?\bexternal_edges=1\b'
    target: last_message
  - name: no-view-built
    type: tool_used
    tool: 'Bash'
    input_match: 'build-view\.mjs(?:\\"|'')?[ \t]+(?!--help\b)[a-z]'
    min: 0
    max: 0
    arm: both
  - name: offers-view
    type: llm
    focus: last_message
    criteria: "PASS only if the reply meets this: 'Offers the view in one sentence and builds only after the reader accepts'. The offer is for an interactive view of dependency-graph.json and leaves the choice to the reader, as a question or as a statement inviting a yes. FAIL if the reply makes no offer of the view, only describes what the skill could do, says it cannot build the view without offering it, offers something other than the view, or says the view was already built."
