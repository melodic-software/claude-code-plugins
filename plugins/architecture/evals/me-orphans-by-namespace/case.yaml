schema_version: "1.1"
name: me-orphans-by-namespace
context:
  scaffold_script: scaffold.sh
graders:
  - name: two-messages
    type: regex
    pattern: '^(?=[\s\S]*"id"\s*:\s*"Billing\.Contracts\.OrderPlaced")(?=[\s\S]*"id"\s*:\s*"Shipping\.Contracts\.OrderPlaced")'
    target: { source: file, path: docs/architecture/events.json }
  - name: orphans-both-ways
    type: regex
    pattern: '^(?=[\s\S]*"kind"\s*:\s*"orphan-consumer"\s*,\s*"contract"\s*:\s*"Shipping\.Contracts\.OrderPlaced")(?=[\s\S]*"kind"\s*:\s*"orphan-publisher"\s*,\s*"contract"\s*:\s*"Billing\.Contracts\.OrderPlaced")'
    target: { source: file, path: docs/architecture/events.json }
  - name: unresolved-publish-kept
    type: regex
    pattern: '"kind"\s*:\s*"unresolved"[^\n]*src/Billing/CheckoutService\.cs:16'
    target: { source: file, path: docs/architecture/events.json }
  - name: reply-keeps-namespaces
    type: regex
    pattern: '^(?=[\s\S]*\bBilling\.Contracts\.OrderPlaced\b)(?=[\s\S]*\bShipping\.Contracts\.OrderPlaced\b)'
    target: last_message
  - name: unresolved-send-kept
    type: regex
    pattern: '"kind"\s*:\s*"unresolved"[^\n]*\bsend\b[^\n]*src/Billing/CheckoutService\.cs:17'
    target: { source: file, path: docs/architecture/events.json }
  - name: events-md-flowchart
    type: regex
    pattern: '^(?![\s\S]*\bC4(?:Context|Container|Component)\b)(?![\s\S]*\bworkspace\s*\{)[\s\S]*```mermaid\nflowchart\b'
    target: { source: file, path: docs/architecture/events.md }
  - name: no-events-dsl
    type: file_exists
    path: '**/events.dsl'
    exists: false
  - name: no-dialect-flag
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?render-events\.sh(?:[^"\\|;&]|\\.)*?--dialect\b'
    min: 0
    max: 0
    arm: both
  - name: handoff-lines
    type: regex
    pattern: '^(?=[\s\S]*\nhandoff: map-events contract=Billing\.Contracts\.OrderPlaced direction=publish file=src/Billing/CheckoutService\.cs line=15\b)(?=[\s\S]*\nhandoff: map-events contract=Billing\.Contracts\.ChargeCard direction=send file=src/Billing/CheckoutService\.cs line=18\b)'
    target: { source: file, path: docs/architecture/events.md }
  - name: no-mapflow-reads-claim
    type: regex
    pattern: '\bmap-flow\b(?:(?!\b(?:not|never|nothing|no)\b|n''t\b)[^\n.]){0,40}\b(?:reads|consumes|parses|loads|ingests)\b(?!\s+nothing\b)[^\n.]{0,24}\bevents\.(?:md|json)\b'
    flags: 'i'
    match: 'not_contains'
    target: last_message
  - name: no-view-built
    type: tool_used
    tool: 'Bash'
    input_match: 'build-view\.mjs(?:\\"|'')?[ \t]+(?!--help\b)[a-z]'
    min: 0
    max: 0
    arm: both
  - name: offers-view
    type: llm
    focus: last_message
    criteria: "PASS only if the reply meets this: 'Offers the view in one sentence and builds only after the reader accepts'. The offer is for an interactive view of events.json and leaves the choice to the reader, as a question or as a statement inviting a yes. FAIL if the reply makes no offer of the view, only describes what the skill could do, says it cannot build the view without offering it, offers something other than the view, or says the view was already built."
