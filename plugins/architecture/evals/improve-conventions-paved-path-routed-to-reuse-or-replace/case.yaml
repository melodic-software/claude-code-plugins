schema_version: "1.1"
name: 'improve-conventions-paved-path-routed-to-reuse-or-replace'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Cites the three commits by hash and subject as the blueprint''s evidence'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Classifies the blueprint as a paved-path entry, not a boundary rule'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Drafts the entry with the concern, a pointer to the chosen way, the four building blocks without claiming an order, and the enforcing check or none'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Hands the draft to /discipline:reuse-or-replace through the Skill tool and writes no paved-path entry or standards file itself'
    focus: 'trace'
