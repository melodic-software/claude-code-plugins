schema_version: "1.1"
name: rd-two-way-door-declined
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-record-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?docs/adr/'
    min: 0
    max: 0
    arm: both
  - name: no-record-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?docs/adr/'
    min: 0
    max: 0
    arm: both
  - name: no-record-shell-write
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\btouch\b|\btee\b|\bcp\b|\bmv\b|>)(?:[^"\\]|\\.)*?docs/adr/0002'
    min: 0
    max: 0
    arm: both
  - name: names-two-way-door
    type: regex
    pattern: '\btwo-way door|\b(?:not|isn[''’]t) (?:a )?one-way door'
    flags: 'i'
    target: last_message
