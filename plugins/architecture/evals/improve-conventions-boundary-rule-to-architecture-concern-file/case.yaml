schema_version: "1.1"
name: 'improve-conventions-boundary-rule-to-architecture-concern-file'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Classifies the rule as a boundary rule and states it in the forbidden-reference form: no project other than Billing.Ledger references Billing.Ledger.Data'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Writes only after the user''s yes, announcing docs/conventions/architecture/README.md before the write'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Appends a ''## Boundary rules'' section with one entry carrying the rule, its evidence and the date'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Changes nothing outside that section: the architecture_dir key and the surrounding prose are untouched'
    focus: 'trace'
  - name: 'expectation-5'
    type: 'llm'
    criteria: 'Reads the file back, reports the line the rule landed on, and names /architecture:improve boundaries as the next step'
    focus: 'trace'
