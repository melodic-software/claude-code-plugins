schema_version: "1.1"
name: layout-unattended-stops-after-report
context:
  scaffold_script: scaffold.sh
graders:
  - name: cites-adr-line
    type: regex
    pattern: '0004-folder-per-feature\.md:9'
    target: 'last_message'
  - name: artifact-written
    type: file_exists
    path: '.work/**/layout-candidates-*.md'
  - name: no-skill-call
    type: tool_used
    tool: 'Skill'
    min: 0
    max: 0
    arm: both
  - name: cart-totals-kept
    type: file_exists
    path: 'src/shared/cartTotals.ts'
  - name: use-cart-kept
    type: file_exists
    path: 'src/hooks/useCart.ts'
  - name: cart-api-kept
    type: file_exists
    path: 'src/api/cart.ts'
  - name: layout-and-trees
    type: llm
    criteria: "PASS only if the cart card in the reply proposes a target layout in a sentence and shows a before folder tree and an after folder tree for the cluster's files. FAIL if either tree is missing or there is no proposed layout."
  - name: stops-after-report
    type: llm
    criteria: "This run is unattended. PASS only if the reply ends after the report: it asks the user no question and starts no interview about the target layout. FAIL if it asks a question or begins an interview."
