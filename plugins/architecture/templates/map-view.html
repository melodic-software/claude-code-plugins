<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Architecture Map View</title>
<style>
:root {
  --ivory: #FAF9F5;
  --slate: #141413;
  --clay: #D97757;
  --oat: #E3DACC;
  --olive: #788C5D;
  --white: #FFFFFF;
  --gray-100: #F0EEE6;
  --gray-300: #D1CFC5;
  --gray-500: #87867F;
  --gray-700: #3D3D3A;
  --serif: ui-serif, Georgia, serif;
  --sans: system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, monospace;
  --clay-deep: #A0512E;
  --clay-soft: #E89B7E;
  --radius-panel: 12px;
  --radius-row: 8px;
  --border: 1.5px solid var(--gray-300);
  --bg: var(--ivory);
  --fg: var(--slate);
  --panel: var(--white);
  --muted: var(--gray-500);
  --accent: var(--clay);
  --link: var(--clay-deep);
  --focus: var(--clay-deep);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: var(--slate);
    --fg: var(--ivory);
    --panel: var(--gray-700);
    --muted: var(--gray-300);
    --accent: var(--clay);
    --border: 1.5px solid var(--gray-500);
    --link: var(--clay-soft);
    --focus: var(--clay-soft);
    color-scheme: dark;
  }
}
:root[data-theme=dark] {
  --bg: var(--slate);
  --fg: var(--ivory);
  --panel: var(--gray-700);
  --muted: var(--gray-300);
  --accent: var(--clay);
  --border: 1.5px solid var(--gray-500);
  --link: var(--clay-soft);
  --focus: var(--clay-soft);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); }
.page { max-width: 56rem; margin: 0 auto; padding: 0 16px; padding-block: 2rem 3rem; display: grid; gap: 1.5rem; }
.eyebrow { margin: 0; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0.25rem 0 0.5rem; font-family: var(--serif); font-size: 1.6rem; line-height: 1.2; text-wrap: balance; }
.meta { margin: 0.5rem 0 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.facts { list-style: none; margin: 0.5rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; color: var(--muted); font-family: var(--mono); font-size: 0.85rem; }
.bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.bar input { flex: 1 1 14rem; min-width: 0; padding: 0.5rem 0.65rem; border: var(--border); border-radius: var(--radius-row); background: var(--panel); color: var(--fg); font: inherit; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
.row { padding: 0.6rem 0.9rem; background: var(--panel); border: var(--border); border-radius: var(--radius-row); }
.row[hidden] { display: none; }
summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: baseline; }
.chip { padding: 0.05rem 0.5rem; border-radius: 4px; background: var(--bg); border: 1.5px solid var(--accent); color: var(--fg); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.fields { margin: 0.6rem 0 0; padding-left: 1.1rem; font-family: var(--mono); font-size: 0.85rem; overflow-wrap: anywhere; }
summary:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none; animation: none; } }
  /* rv-chrome:begin */
  .rv-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: flex-end; }
  .rv-theme { display: inline-flex; border: 1px solid var(--muted); border-radius: 8px; overflow: hidden; }
  .rv-theme button { margin: 0; padding: 0.35rem 0.75rem; border: 0; border-radius: 0; background: transparent; color: var(--fg); font: inherit; font-weight: 500; cursor: pointer; }
  .rv-theme button + button { border-left: 1px solid var(--muted); }
  .rv-theme button[aria-pressed=true] { background: var(--fg); color: var(--bg); }
  .rv-theme button:focus-visible { outline: 3px solid var(--fg); outline-offset: -3px; }
  .rv-comment { display: grid; gap: 0.4rem; }
  .rv-comment h2 { margin: 0; }
  .rv-comment textarea { min-height: 5rem; padding: 0.6rem; border: 1px solid var(--muted); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; resize: vertical; }
  .rv-comment textarea:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  /* rv-chrome:end */
</style>
</head>
<body>
<main class="page">
<div class="rv-bar"><div class="rv-theme" role="group" aria-label="Theme"><button type="button" data-rv-theme="system" aria-pressed="true">System</button><button type="button" data-rv-theme="light" aria-pressed="false">Light</button><button type="button" data-rv-theme="dark" aria-pressed="false">Dark</button></div></div>
<header>
<p class="eyebrow">Interactive view. The markdown and the JSON record are authoritative.</p>
<h1 data-rv-text="title">Architecture map</h1>
<ul class="facts" data-rv-each="facts"><li data-rv-text="item"></li></ul>
<p class="meta"><span data-rv-count="rows">0</span> rows. Open a row for its fields. Type an id or a name in the filter to trace every row that names it.</p>
</header>
<div class="bar">
<label for="find">Filter</label>
<input id="find" type="search" placeholder="A node id, a name, or any word from a field" data-rv-filter="rows">
</div>
<ol class="rows" data-rv-each="rows">
<li class="row">
<details>
<summary><span class="chip" data-rv-text="kind"></span><strong data-rv-text="name"></strong></summary>
<ul class="fields" data-rv-each="fields"><li data-rv-text="item"></li></ul>
</details>
</li>
</ol>
</main>
</body>
</html>
