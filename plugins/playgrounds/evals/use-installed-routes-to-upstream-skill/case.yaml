schema_version: "1.1"
name: 'use-installed-routes-to-upstream-skill'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Presence is judged from the marketplace-qualified install record, not from description wording'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'The invocation uses the namespaced playground:playground form, not the ambiguity-dependent bare name'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'The upstream skill is invoked with the user''s brief; template choice is left to it'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'No HTML is authored by this skill in any branch'
    focus: 'trace'
