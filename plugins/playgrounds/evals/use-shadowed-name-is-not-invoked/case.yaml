schema_version: "1.1"
name: 'use-shadowed-name-is-not-invoked'
plugins: ["../..", "playground-stub"]
graders:
  - name: 'mismatch-read-as-shadow'
    type: 'llm'
    criteria: 'The description mismatch is treated as a shadow signal, not as proof upstream is absent'
    focus: 'trace'
  - name: 'invokes-namespaced-despite-shadow'
    type: 'llm'
    criteria: 'With the install record present, the namespaced playground:playground form is invoked despite the shadow'
    focus: 'trace'
  - name: 'shadow-never-invoked'
    type: 'llm'
    criteria: 'The shadowing skill is not invoked in any branch'
    focus: 'trace'
  - name: 'names-what-shadows-what'
    type: 'llm'
    criteria: 'The user is told what is shadowing what'
    focus: 'trace'
