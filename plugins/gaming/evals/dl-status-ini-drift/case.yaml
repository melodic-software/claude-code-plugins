schema_version: "1.1"
name: dl-status-ini-drift
graders:
  - name: ini-drift-expected
    type: llm
    focus: last_message
    criteria: 'Expectation: "Explains that OptiScaler.ini drift is expected and does not make status exit 1". The user asked whether a changed OptiScaler.ini means the install is broken. PASS if the reply says a changed OptiScaler.ini is expected or normal (for example because the overlay''s Save Settings rewrites it) and that it does not make status fail or exit 1. FAIL if the reply says the change means the install is broken or damaged, tells the user to reinstall or verify files because of it, or never says the ini change is expected. Example PASS: "Not broken. The overlay''s Save Settings rewrites OptiScaler.ini, so status treats that change as expected and still exits 0." Example FAIL: "A changed OptiScaler.ini means the install drifted; remove and apply again."'
  - name: exit-1-meaning
    type: llm
    focus: last_message
    criteria: 'Expectation: "States what an exit code of 1 would mean". PASS if the reply says what makes status exit 1: a pre-install (game) file modified or removed, or a manifest file other than OptiScaler.ini missing or changed (either is enough), or no snapshot because the mod was never applied there. FAIL if the reply says nothing about exit 1 or what real drift would look like, or names only the OptiScaler.ini change as the cause. Example PASS: "Exit 1 would mean a game file from before the install changed or vanished, or a mod file other than the ini is missing or changed." Example FAIL: "Your install is fine, enjoy."'
  - name: no-status-loop
    type: tool_used
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?-Verb\s+status\b'
    min: 0
    max: 1
    arm: 'both'
