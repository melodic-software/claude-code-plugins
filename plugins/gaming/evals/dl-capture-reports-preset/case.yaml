schema_version: "1.1"
name: dl-capture-reports-preset
graders:
  - name: reports-captured
    type: regex
    pattern: '^(?=[\s\S]*\bLocalTone\b)(?=[\s\S]*\bWhitePointScale\b)(?=[\s\S]*\bcyberpunk-2077\.json\b)'
    flags: 'i'
    target: last_message
  - name: reports-not-captured
    type: regex
    pattern: '^(?=[\s\S]*\bLogLevel\b)(?=[\s\S]*\bAutoCapture\b)'
    flags: 'i'
    target: last_message
  - name: suggests-contributing
    type: llm
    focus: last_message
    criteria: 'Expectation: "Suggests contributing the preset with evidence, not as a runtime download". PASS if the reply suggests sharing the captured preset with the plugin through an issue or pull request, carrying evidence such as the game, build, driver or what the user saw. FAIL if the reply suggests publishing the preset somewhere the plugin downloads from at runtime, suggests contributing it with no evidence, or does not suggest contributing it at all. Example PASS: "If it looks right, open an issue on the plugin repository with the preset file, the game, build wilsjo2 v0.8.3, your driver, and what you saw." Example FAIL: "Upload the JSON to a gist and the plugin will fetch it next time."'
  - name: no-hand-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path"\s*:\s*"[^"]*(?:presets|OptiScaler\.ini|Cyberpunk 2077)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-hand-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path"\s*:\s*"[^"]*(?:presets|OptiScaler\.ini|Cyberpunk 2077)'
    min: 0
    max: 0
    arm: 'both'
