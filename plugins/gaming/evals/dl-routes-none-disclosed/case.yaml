schema_version: "1.1"
name: dl-routes-none-disclosed
graders:
  - name: routes-dlss5
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:gaming:)?dlss5"'
    arm: 'with-only'
  - name: not-proof-of-none
    type: llm
    focus: last_message
    criteria: "The assess output's anti-cheat status was none-disclosed. PASS if the reply says none-disclosed means no kernel anti-cheat was disclosed or found, not that the game has none, or that it is not proof or a guarantee of no anti-cheat. FAIL if the reply reads none-disclosed as the game having no anti-cheat, calls the game safe on that basis, or never says the status falls short of proof. Judge only how the reply reads the anti-cheat status."
  - name: solo-or-offline
    type: regex
    pattern: '\b(?:solo|offline|single[- ]player)\b'
    flags: 'i'
    target: last_message
  - name: names-launcher-and-status
    type: regex
    pattern: '^(?=[\s\S]*\bSteam\b)(?=[\s\S]*(?:\bnone[- ]disclosed\b|\bno\b[^\n]{0,60}\banti-?cheat\b[^\n]{0,40}\bdisclosed\b))'
    flags: 'i'
    target: last_message
  - name: no-config-token
    type: tool_used
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?\$\{user_config\.'
    min: 0
    max: 0
    arm: 'both'
  - name: no-apply-run
    type: tool_used
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?-Verb\s+apply\b'
    min: 0
    max: 0
    arm: 'both'
