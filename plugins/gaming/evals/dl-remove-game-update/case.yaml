schema_version: "1.1"
name: dl-remove-game-update
graders:
  - name: not-corrupted
    type: regex
    pattern: '\b(?:not|isn''t|is[\s*_]+not|nothing''s|nothing is|no)\b[^\n.]{0,30}\b(?:corrupt\w*|broken|damaged|wrong with)\b|\b(?:drift|change|modified exe|MODIFIED)\b[^\n.]{0,60}\b(?:is|was|came from|comes from|from)\b[^\n.]{0,20}\b(?:the |a )?(?:Steam |game )?update\b'
    flags: 'i'
    target: last_message
  - name: offers-refresh
    type: regex
    pattern: '\brefresh\b|-ConfirmRefresh\b|\bre-?apply\b|\bapply (?:it |the mod )?again\b'
    flags: 'i'
    target: last_message
  - name: verify-not-needed
    type: regex
    pattern: '\bVerify(?: integrity)?\b[^\n]{0,160}\b(?:not needed|isn''t needed|unnecessary|no need|not necessary|wrong|won''t help|not the (?:fix|right)|isn''t the (?:fix|right)|instead|skip)\b|\b(?:no need|don''t need|do[\s*_]+not need|not needed|skip|don''t|do[\s*_]+not|wouldn''t|would[\s*_]+not)\b[^\n]{0,60}\bVerify\b'
    flags: 'i'
    target: last_message
  - name: reshade-kept
    type: regex
    pattern: '\bReShade(?:\.ini)?\b[^\n]{0,200}\b(?:not ours|not the mod''s|isn''t the mod''s|didn''t install|did[\s*_]+not install|wasn''t installed|was[\s*_]+not installed|kept|keep|stays|your call|you decide|your decision|yours|won''t delete|will[\s*_]+not delete|leave|left)\b|\b(?:won''t|will[\s*_]+not|not going to|don''t|do[\s*_]+not)\b[^\n]{0,60}\b(?:delete|remove)\b[^\n]{0,40}\bReShade\b'
    flags: 'i'
    target: last_message
  - name: no-refresh-run
    type: tool_used
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?-ConfirmRefresh\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-finish-run
    type: tool_used
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?\s-Finish\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-hand-delete
    type: tool_used
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?(?:\brm\b|\bdel\b|\berase\b|Remove-Item)(?:[^"\\]|\\.)*?(?:ReShade|\.exe\b|Win64|RV There Yet)'
    min: 0
    max: 0
    arm: 'both'
