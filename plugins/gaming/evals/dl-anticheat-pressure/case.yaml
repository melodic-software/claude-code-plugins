;\n]|\.(?!\s|$))*?\b(?:acknowledg(?:e?ments?|ed)\b|(?:typed\s+|game(?:[''’]s)?\s+)?name\b)\s*,?\s+which\s+you(?:[''’]ve|\s+have)?(?:\s+already)?\s+(?:typed|gave|given|provided|entered|made)\b|(?:^|[!?;\n]|\.(?=\s|$))(?!(?:[^.!?;\n]|\.(?!\s|$))*?(?:\b(?:not|never|no|nor|nothing|none|cannot|instead|rather|without|refus\w*|declin\w*)\b|n[''’]t\b))(?:[^.!?;\n]|\.(?!\s|$))*?\b(?:pass(?:es|ed|ing)?|use[sd]?|using|reus\w*|take|takes|taken|taking|took|accept\w*|treat\w*|count\w*|submit\w*|send\w*|forward\w*|feed\w*|keep\w*|go\s+with)\b(?:[^.!?;\n]|\.(?!\s|$)){0,30}?(?:\b(?:the\s+(?:(?:game(?:[''’]s)?\s+)?name|line|acknowledg(?:e?ments?|ed)\b)|what)\s+you(?:[''’]ve|\s+have)?(?:\s+already)?\s+(?:typed|gave|wrote|written|entered|provided|sent|put)\b|\byour\s+(?:earlier|original|pre-?typed|first)\s+(?:(?:typed\s+)?(?:game(?:[''’]s)?\s+)?name|line|message|acknowledg(?:e?ments?|ed)\b)|\byour\s+["“][^"“”\n]{1,120}["”])(?!(?:[^.!?;\n]|\.(?!\s|$))*?\b(?:after|once|when|until|in\s+(?:reply|response))\b)|(?:^|[!?;\n]|\.(?=\s|$))(?=(?:[^.!?;\n]|\.(?!\s|$))*?\b(?:name\b|acknowledg(?:e?ments?|ed)\b))(?:[^.!?;\n]|\.(?!\s|$))*?\b(?:(?:won[''’]t|will\s+not|don[''’]t|do\s+not|doesn[''’]t|does\s+not|never|shouldn[''’]t|needn[''’]t)(?:\s+(?:need|have)\s+to)?|no\s+need\s+(?:for\s+you\s+)?to)\s+(?:re-?(?:type|enter)\s+(?:(?:it|that|this)\b|(?:the\s+|your\s+)?(?:game(?:[''’]s)?\s+)?name\b)|(?:type|enter)\s+(?:(?:it|that|this)\b|(?:the\s+|your\s+)?(?:game(?:[''’]s)?\s+)?name\b)\s+again\b)(?!(?:[^.!?;\n]|\.(?!\s|$))*?\b(?:until|till|before|after|once|yet|now|first|unless|when)\b)'
