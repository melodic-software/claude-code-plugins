schema_version: "1.1"
name: dl-status-build-behind-pin
graders:
  - name: older-exit-unaffected
    type: llm
    focus: last_message
    criteria: 'Expectation: "Says the installed build is older than the current pin and the exit code is unaffected". PASS if the reply says the game was applied from an older build than the one this plugin version now pins (v0.8.3 installed, v0.9.0 pinned) and that this line does not change the status exit code or mark the install as failing. FAIL if the reply misses either half: it does not say the build is older than the pin, or says or implies the line makes status fail or exit 1. Example PASS: "Your game still runs wilsjo2 v0.8.3, older than the v0.9.0 this plugin now pins. It is a note only: the exit code does not change." Example FAIL: "Status flagged your install as broken because the build is old."'
  - name: setup-before-reapply
    type: regex
    pattern: '(?:/gaming:)?setup apply\b[\s\S]*?\bremove\b[\s\S]*?\bapply\b'
    flags: 'i'
    target: last_message
  - name: offers-capture
    type: regex
    pattern: '\bcapture\b[\s\S]*?(?:setup apply\b|\bremove\b|\bre-?apply\b)'
    flags: 'i'
    target: last_message
  - name: no-remove-or-apply
    type: tool_used
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?-Verb\s+(?:remove|apply)\b'
    min: 0
    max: 0
    arm: 'both'
