schema_version: "1.1"
name: dl-update-check-pin-advice
graders:
  - name: reports-pin-advice
    type: regex
    pattern: '\bv?0\.9\.0\b'
    flags: 'i'
    target: last_message
  - name: pin-is-release
    type: llm
    focus: last_message
    criteria: 'Expectation: "Says a new pin is a plugin release and edits no pin, ledger row or installed file". PASS if the reply says moving to the new release is a plugin release (an update to the plugin itself, through the Updating a pin steps), not something changed here, and does not claim to have edited a pin, a ledger row or an installed file. FAIL if the reply says it changed or will change the pin, the ledger or the installed script now, tells the user to edit the pin in the installed plugin, or never says the new release needs a plugin release. Example PASS: "wilsjo2 v0.9.0 is out (pin v0.8.3). A new pin is a plugin release, so nothing changes here." Example FAIL: "I updated the pin in Invoke-Dlss5Mod.ps1 to v0.9.0."'
  - name: no-mutating-verb
    type: tool_used
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?-Verb\s+(?:remove|apply|reset)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-pin-or-ledger-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path"\s*:\s*"[^"]*(?:LEDGER\.md|Invoke-Dlss5Mod|skills[\\/]+dlss5|Gaming[\\/]+dlss5|Cyberpunk 2077)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-pin-or-ledger-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path"\s*:\s*"[^"]*(?:LEDGER\.md|Invoke-Dlss5Mod|skills[\\/]+dlss5|Gaming[\\/]+dlss5|Cyberpunk 2077)'
    min: 0
    max: 0
    arm: 'both'
