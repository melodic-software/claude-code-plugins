schema_version: "1.1"
name: dl-no-upscaler-apply
graders:
  - name: no-upscaler-plain
    type: llm
    focus: last_message
    criteria: 'Expectation: "Says in plain words that the game has no upscaler for the mod to hook, so the mod will not help". Assess reported not-a-candidate because Stardew Valley has no DLSS, FSR 2+ or XeSS DLL. PASS if the reply says, in words a player understands, that the game has no upscaler (DLSS, FSR or XeSS) for the mod to hook into and so the mod will not help or change anything. FAIL if the reply only quotes the verdict code without saying why, says the mod could still help, or presents the install as possible. Example PASS: "Stardew Valley has no DLSS, FSR or XeSS for the mod to hook, so it would not change the picture." Example FAIL: "Verdict: not-a-candidate."'
  - name: no-flag-offer
    type: llm
    focus: last_message
    criteria: 'Expectation: "Does not offer -Force or any other flag as a way past the verdict". PASS unless the reply offers, suggests or mentions as an option -Force, -AllowUnknownRuntime or any other flag or switch to get past the not-a-candidate verdict. Saying plainly that no flag clears the verdict passes. Example PASS: "No flag overrides this verdict." Example FAIL: "If you still want it, rerun apply with -Force."'
  - name: no-apply-run
    type: tool_used
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?-Verb\s+apply\b'
    min: 0
    max: 0
    arm: 'both'
