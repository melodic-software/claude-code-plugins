schema_version: "1.1"
name: dl-capture-hotkey-conflict
graders:
  - name: reports-style-and-file
    type: regex
    pattern: '^(?=[\s\S]*\bStyle\b)(?=[\s\S]*\bcyberpunk-2077\.json\b)'
    flags: 'i'
    target: last_message
  - name: names-both-bindings
    type: regex
    pattern: '^(?=[\s\S]*\bFGShortcutKey\b)(?=[\s\S]*\blocal[- ]base\b)(?=[\s\S]*\bToggleKey\b)(?=[\s\S]*(?:\bgame(?:''|’)?s?\s+(?:OptiScaler\.)?ini\b|\bOptiScaler\.ini\b|\boverlay\b))(?=[\s\S]*(?:=\s*-1\b|\bdefault\b))'
    flags: 'i'
    target: last_message
  - name: asks-which-action
    type: llm
    focus: last_message
    criteria: 'Expectation: "Asks the user which action should own the key rather than choosing for them". F16 (0x7F) is bound both as the Neural Rendering toggle (ToggleKey, from the game''s ini) and as the frame-generation shortcut (FGShortcutKey, from the local base). PASS if the reply, at its opening or its close, asks the user which action they want on that key or which binding to move. FAIL if the reply picks for them (for example says it will move ToggleKey or FGShortcutKey to another key, or edits a preset to do so) without asking, or never puts the choice to the user; a question that appears only mid-explanation as a rhetorical aside does not count. Example PASS: "...Which do you want on F16: the Neural Rendering toggle or the frame-generation shortcut? Rebind the other, then run capture again." Example FAIL: "I''ll move the frame-generation shortcut to F15 so ToggleKey can keep F16."'
  - name: no-preset-write
    type: tool_used
    tool: 'Write'
    input_match: '^(?=[\s\S]*"file_path"\s*:\s*"[^"]*presets)(?=[\s\S]*ToggleKey)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-preset-edit
    type: tool_used
    tool: 'Edit'
    input_match: '^(?=[\s\S]*"file_path"\s*:\s*"[^"]*presets)(?=[\s\S]*ToggleKey)'
    min: 0
    max: 0
    arm: 'both'
