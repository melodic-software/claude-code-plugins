schema_version: "1.1"
name: 'reach-cross-machine-wsl-poll'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'expected-output'
    type: 'llm'
    criteria: 'Uses the cross-machine WSL row through the Windows OpenSSH client and the laptop''s wsl-shell alias from FLEET.md. Sends to lap-wsl with a relay turn, and does not rely on notify_when_idle from a -p sender, whose turn ends before the notice arrives. Gets the answer by polling claude agents --json in that lane until the session is idle, then reading the reply with --resume or a second relay turn.'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:fleet:)?reach"'
  - name: 'polls-agents'
    type: 'regex'
    pattern: 'claude agents --json'
    flags: 'i'
    target: 'last_message'
