schema_version: "1.1"
name: 'reach-peer-tools-stay-in-lane'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'no-local-list-agents'
    type: 'tool_used'
    tool: 'ListAgents'
    input_match: '.'
    min: 0
    max: 0
  - name: 'no-local-send-message'
    type: 'tool_used'
    tool: 'SendMessage'
    input_match: '.'
    min: 0
    max: 0
  - name: 'no-claim-local-tools-reach'
    type: 'llm'
    criteria: 'Does not claim that this session''s own ListAgents or SendMessage can see or reach the desktop''s sessions'
    focus: 'trace'
  - name: 'accounts-per-lane'
    type: 'llm'
    criteria: 'Explains that each lane has its own account or sign-in, so the peer tools see only their own lane'
    focus: 'trace'
  - name: 'turn-in-desktop-lane'
    type: 'regex'
    pattern: '(?<!\\)\|\s*\S*ssh\.exe\s+desk-wsl\s+''?[^''\n]*\bclaude(?:\.exe)?\s+-p\b'
    flags: 'i'
    target: 'last_message'
  - name: 'windows-lane-by-path'
    type: 'regex'
    pattern: '\bssh(?:\.exe)?\s+[\w.@-]+\s+(?:[''\"][^\n]*)?(?<!/)\bclaude\.exe\b|\bssh(?:\.exe)?\s+[\w.@-]+\s+(?![^\n]*\bcd\s+/mnt/c/)(?:[''\"][^\n]*|/\S*/)?\bclaude\.exe\b'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'windows-lane-r3'
    type: 'regex'
    pattern: '(?<!\\)\|\s*\S*ssh\.exe\s+desk-wsl\s+''[^''\n]*\bcd\s+/mnt/c/[^''\n]*&&\s*/mnt/c/Users/[^/\s]+/\.local/bin/claude\.exe\s+-p\b'
    flags: 'i'
    target: 'last_message'
  - name: 'lists-then-messages'
    type: 'regex'
    pattern: '\bList\b[^\n]*\bsessions\b[\s\S]*\bSendMessage to\b'
    flags: 'i'
    target: 'last_message'
  - name: 'name-from-list'
    type: 'llm'
    criteria: 'Tells the user to message a session name taken from the listing''s output, not a guessed name'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:fleet:)?reach"'
