schema_version: "1.1"
name: 'reach-run-a-script-no-agent'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'no-agent-in-command'
    type: 'regex'
    pattern: '\bssh(?:\.exe)?\s+[\w.@-]+\s+[''\"][^\n]*\bclaude(?:\.exe)?\b'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'port-22-alias'
    type: 'regex'
    pattern: '\bssh(?:\.exe)?\s+laptop-win\b'
    flags: 'i'
    target: 'last_message'
  - name: 'ssh-admin'
    type: 'regex'
    pattern: '\bssh-admin\b'
    flags: 'i'
    target: 'last_message'
  - name: 'pwsh-quoting'
    type: 'llm'
    criteria: 'Writes the remote command in PowerShell and quotes it for pwsh, the windows-shell account''s shell, not as a claude prompt'
    focus: 'trace'
  - name: 'notes-no-dpapi'
    type: 'regex'
    pattern: '\bDPAPI\b'
    flags: 'i'
    target: 'last_message'
  - name: 'on-demand-tasks'
    type: 'regex'
    pattern: '\bon-demand tasks?\b'
    flags: 'i'
    target: 'last_message'
