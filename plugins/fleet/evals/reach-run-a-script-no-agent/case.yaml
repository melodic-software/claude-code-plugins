schema_version: "1.1"
name: 'reach-run-a-script-no-agent'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'no-agent-in-command'
    type: 'regex'
    pattern: '\bssh(?:\.exe)?\s+[\w.@-]+\s+[''\"][^\n]*\bclaude(?:\.exe)?\b'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'port-22-alias'
    type: 'regex'
    pattern: '\bssh(?:\.exe)?\s+laptop-win\b'
    flags: 'i'
    target: 'last_message'
  - name: 'ssh-admin'
    type: 'regex'
    pattern: '\bssh-admin\b'
    flags: 'i'
    target: 'last_message'
  - name: 'pwsh-quoting'
    type: 'llm'
    criteria: 'Sends the command over ssh to the windows-shell alias, written in PowerShell and quoted for pwsh, that account''s shell, not as a claude prompt'
    focus: 'trace'
  - name: 'ssh-admin-limit'
    type: 'llm'
    criteria: 'Says ssh-admin cannot use the console user''s Windows credentials (no DPAPI, in any wording), so anything needing them goes through an on-demand task'
    focus: 'trace'
