schema_version: "1.1"
name: 'reach-run-a-script-no-agent'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'no-agent-in-command'
    type: 'regex'
    pattern: '\bssh(?:\.exe)?\s+(?:-\w+\s+)*[\w.@-]+\s+(?:(?:''[^''\n]*|\"[^\"\n]*)\bclaude(?:\.exe)?\b|claude(?:\.exe)?\s+-)'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'port-22-alias'
    type: 'regex'
    pattern: '\bssh(?:\.exe)?\s+(?:-\w+\s+)*laptop-win\b'
    flags: 'i'
    target: 'last_message'
  - name: 'ssh-admin'
    type: 'regex'
    pattern: '\bssh-admin\b'
    flags: 'i'
    target: 'last_message'
  - name: 'pwsh-quoting'
    type: 'llm'
    criteria: 'Sends the command over ssh to the windows-shell alias, written in PowerShell and quoted for pwsh, that account''s shell, not as a claude prompt'
    focus: 'trace'
  - name: 'ssh-admin-limit'
    type: 'llm'
    criteria: 'Says ssh-admin cannot use the console user''s Windows credentials (no DPAPI, in any wording), so anything needing them goes through an on-demand task'
    focus: 'trace'
  - name: 'port-22-not-agent-lane'
    type: 'regex'
    pattern: '\bno\s+Claude\s+sign-?in\b|not\s+an?\s+agent\s+lane\b|(?:can[''’]?t|cannot)\s+run\s+`?claude'
    flags: 'i'
    target: 'last_message'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:fleet:)?reach"'
