schema_version: "1.1"
name: 'reach-start-in-profile-windows'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'windows-plugin-list'
    type: 'regex'
    pattern: 'claude(?:\.exe)?["'']?\s+plugin\s+list\s+--json'
    flags: 'i'
    target: 'last_message'
  - name: 'powershell-stdin-script'
    type: 'regex'
    pattern: 'powershell(?:\.exe)?\s[^\n]*-Command\s+-(?=\s|''|$)'
    flags: 'im'
    target: 'last_message'
  - name: 'launch-unattended'
    type: 'regex'
    pattern: 'profiles\.mjs\S*\s+launch\s+["'']?build\b[^\n]*--unattended'
    flags: 'i'
    target: 'last_message'
  - name: 'clears-without-env'
    type: 'regex'
    pattern: 'Remove-Item\s+["'']?Env:'
    flags: 'i'
    target: 'last_message'
  - name: 'no-env-before-claude-exe'
    type: 'regex'
    pattern: '\benv\s+-u\b[^\n]*claude\.exe'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'array-enumerated-before-filter'
    type: 'regex'
    pattern: 'ConvertFrom-Json\s*\|\s*Where-Object'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'says-profile-not-applied'
    type: 'regex'
    pattern: '\bprofile\b[^\n]{0,80}\bnot\s+applied\b'
    flags: 'i'
    target: 'last_message'
  - name: 'launch-refusal-stops'
    type: 'regex'
    pattern: '\$LASTEXITCODE\s*\)\s*\{[^}\n]*(?:\$stop\s*=|\bexit\s+1\b)'
    flags: 'i'
    target: 'last_message'
  - name: 'prompt-from-file'
    type: 'regex'
    pattern: '-RedirectStandardInput\s+\S'
    flags: 'i'
    target: 'last_message'
  - name: 'no-prompt-in-script'
    type: 'regex'
    pattern: '''[^''\n]*''\s*\|\s*&\s*\$claude\b'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'background-prompt-through-q'
    type: 'regex'
    pattern: '&\s*\$claude\b[^\n]*--bg\b|\+\s*(?:''\s''\s*\+\s*)?\[IO\.File\]::ReadAllText'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'background-dash-guard'
    type: 'regex'
    pattern: '^(?![\s\S]*--bg\b)|StartsWith\(\s*''-''\s*\)\)\s*\{\s*\$stop\s*='
    flags: 'i'
    target: 'last_message'
  - name: 'removes-prompt-file-before-exit'
    type: 'regex'
    pattern: '^Remove-Item\s+\$p\b'
    flags: 'im'
    target: 'last_message'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:fleet:)?reach"'
