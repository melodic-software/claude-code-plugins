schema_version: "1.1"
name: 'reach-wsl-from-powershell'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'expected-output'
    type: 'llm'
    criteria: 'Uses row R4: resolves the distro name from wsl.exe -l -q rather than guessing, then wsl.exe -d <distro> --cd /tmp --exec <shell> -lc (--exec, not --) with claude -p "<prompt>" < /dev/null inside single quotes. Gives the prompt the whole task and a stop condition. Escapes any apostrophe by doubling it, which is the pwsh rule; notes that Git Bash (a native-Windows Claude''s Bash tool) needs ''\'''' instead, because doubling drops the apostrophe there. Prefers WSL as the agent lane since the repos and toolchain live there.'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:fleet:)?reach"'
  - name: 'lists-distros'
    type: 'regex'
    pattern: 'wsl(?:\.exe)? -l -q'
    flags: 'i'
    target: 'last_message'
  - name: 'uses-exec'
    type: 'regex'
    pattern: '--exec\b'
    flags: 'i'
    target: 'last_message'
