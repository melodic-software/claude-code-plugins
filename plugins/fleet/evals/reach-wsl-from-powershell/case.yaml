schema_version: "1.1"
name: 'reach-wsl-from-powershell'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'distro-not-guessed'
    type: 'llm'
    criteria: 'Takes the distro name from the fleet manifest (FLEET.md) or from `wsl.exe -l -q`, never from a guess'
    focus: 'trace'
  - name: 'r4-shape'
    type: 'regex'
    pattern: 'wsl\.exe\s+-d\s+\S+\s+--cd\s+\S+\s+--exec\s+\S+\s+-lc\s+''[^\n]*\bclaude\s+-p\b[^\n]*<\s*/dev/null[^\n]*'''
    flags: 'i'
    target: 'last_message'
  - name: 'uses-exec'
    type: 'regex'
    pattern: '--exec\b'
    flags: 'i'
    target: 'last_message'
  - name: 'whole-task-and-stop'
    type: 'llm'
    criteria: 'The prompt passed to `claude -p` states the whole task (run the test suite and report the results) and says when to stop and report'
    focus: 'trace'
  - name: 'pwsh-apostrophe-rule'
    type: 'regex'
    pattern: '-lc\s+''[^"\n]*(?:''''[^"\n]*what''''\\''''''''s\b|\$''''[^"\n]*what\\''''s\b)'
    flags: 'i'
    target: 'last_message'
  - name: 'agent-stays-in-wsl'
    type: 'llm'
    criteria: 'Runs the agent in the laptop''s WSL lane, where the repos and toolchain live, not in native Windows'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:fleet:)?reach"'
