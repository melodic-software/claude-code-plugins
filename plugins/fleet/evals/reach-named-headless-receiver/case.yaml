schema_version: "1.1"
name: 'reach-named-headless-receiver'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'expected-output'
    type: 'llm'
    criteria: 'Starts a named headless receiver: claude.exe -p -n <name> --settings with crossSessionInbound set to accept, with standing instructions saying what to do with messages and when to stop. Handles the JSON quoting inside an outer single-quoted remote command (escaped double quotes). States that the receiver lives only as long as its turn; for a session that must stay up, offers a background session (claude --bg --name, which needs a trusted directory) or --resume for durable multi-turn work. Does not use --bare for a receiver, since a bare session binds no inbox socket.'
    focus: 'trace'
  - name: 'cross-session-inbound'
    type: 'regex'
    pattern: 'crossSessionInbound'
    flags: 'i'
    target: 'last_message'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:fleet:)?reach"'
