schema_version: "1.1"
name: 'reach-named-headless-receiver'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'names-the-session'
    type: 'regex'
    pattern: 'claude\.exe\s+(?:--bg\s+--name|-p\s+-n)\s+\S'
    flags: 'i'
    target: 'last_message'
  - name: 'cross-session-inbound'
    type: 'regex'
    pattern: 'crossSessionInbound\\?"?\s*:\s*\\?"?accept|claude\.exe\s+--bg\b'
    flags: 'i'
    target: 'last_message'
  - name: 'escaped-settings-json'
    type: 'regex'
    pattern: '^(?![\s\S]*crossSessionInbound)|"\{\\"crossSessionInbound\\":\\"accept\\"\}"|''\\''''\{"crossSessionInbound":"accept"\}''\\'''''
    flags: 'i'
    target: 'last_message'
  - name: 'standing-instructions'
    type: 'llm'
    criteria: 'The command it gives (receiver or background session) carries standing instructions that say what to do with each incoming message and when to stop'
    focus: 'trace'
  - name: 'stay-up-bg-with-instructions'
    type: 'regex'
    pattern: 'claude(?:\.exe)?\s[^\n]*--bg\b[^\n]*\s(?:"|'''')[A-Za-z][^"\n]{20,}'
    flags: 'i'
    target: 'last_message'
  - name: 'offers-bg-or-resume'
    type: 'regex'
    pattern: '--bg\b|--resume\b'
    flags: 'i'
    target: 'last_message'
  - name: 'bg-needs-trusted-dir'
    type: 'regex'
    pattern: '^(?![\s\S]*--bg\b)|\btrust(?:ed)?\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-bare-receiver'
    type: 'regex'
    pattern: 'claude(?:\.exe)?\s+(?:--bare\b|-[^\n]*?\s--bare\b)'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:fleet:)?reach"'
