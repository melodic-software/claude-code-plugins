schema_version: "1.1"
name: 'session-start-peer-list'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'names-the-listed-peer'
    type: 'regex'
    pattern: '\bfleet-peer-[0-9a-f]{8}\b'
    target: 'last_message'
  - name: 'no-bash'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-read'
    type: 'tool_used'
    tool: 'Read'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
