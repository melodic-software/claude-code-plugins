schema_version: "1.1"
name: 'reach-one-shot-wsl-hop'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'reads-fleet-manifest'
    type: 'tool_used'
    tool: 'Read'
    input_match: 'FLEET\.md'
  - name: 'windows-ssh-client-and-alias'
    type: 'regex'
    pattern: 'ssh\.exe\s+desk-(?:wsl|win)\b'
    flags: 'i'
    target: 'last_message'
  - name: 'one-shot-turn-over-wsl-hop'
    type: 'regex'
    pattern: '(?<!\\)\|\s*\S*ssh\.exe\s+desk-wsl\s+''?[^''\n]*\bclaude\s+-p\b'
    flags: 'i'
    target: 'last_message'
  - name: 'turn-states-whole-task'
    type: 'llm'
    criteria: 'The `claude -p` turn on the desktop has a prompt that states the whole task (report the free space on its D drive) and what to reply with'
    focus: 'trace'
  - name: 'prompt-on-stdin'
    type: 'regex'
    pattern: '\bssh(?:\.exe)?\s+(?:-\w+\s+)*[\w.@-]+\s+[^\n]*\bclaude(?:\.exe)?\s+-p\b[^\n|;&`]*\s[''\"]|\bssh(?:\.exe)?\s+-n\b[^\n]*\bclaude(?:\.exe)?\s+-p\b'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'turn-runs-on-desktop-account'
    type: 'llm'
    criteria: 'Says the `claude -p` turn runs under the desktop lane''s own Claude account (its usage)'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:fleet:)?reach"'
