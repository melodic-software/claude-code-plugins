schema_version: "1.1"
name: 'reach-one-shot-wsl-hop'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'reads-fleet-manifest'
    type: 'tool_used'
    tool: 'Read'
    input_match: 'FLEET\.md'
  - name: 'windows-ssh-client-and-alias'
    type: 'regex'
    pattern: 'ssh\.exe\s+desk-(?:wsl|win)\b'
    flags: 'i'
    target: 'last_message'
  - name: 'script-or-one-shot-turn'
    type: 'llm'
    criteria: 'Answers with either a plain script over the hop to the desktop (no agent) or a one-shot headless `claude -p` turn on the desktop whose prompt states the whole task'
    focus: 'trace'
  - name: 'stdin-redirect'
    type: 'regex'
    pattern: '\bssh(?:\.exe)?\s+(?!-n\b)[\w.@-]+\s+[''\"][^\n]*\bclaude(?:\.exe)?\s+-p\b(?![^\n]*<\s*/dev/null)'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'turn-runs-on-desktop-account'
    type: 'llm'
    criteria: 'If the reply gives a `claude -p` turn on the desktop, it says that turn runs under the desktop lane''s own Claude account (its usage); a reply with no such turn passes'
    focus: 'trace'
  - name: 'turn-prompts-under-auto-mode'
    type: 'llm'
    criteria: 'If the reply gives a `claude -p` turn on the desktop, it says running it brings up a permission prompt under auto mode; a reply with no such turn passes'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:fleet:)?reach"'
