schema_version: "1.1"
name: 'reach-same-repo-session-picks-lane'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'names-both-lane-routes'
    type: 'regex'
    pattern: '^(?=[\s\S]*\b(?:ListAgents|SendMessage|peer tools?)\b)(?=[\s\S]*(?:\bR1\b|claude\.exe|powershell|native Windows|Windows (?:lane|side|session)))(?=[\s\S]*\blanes?\b)'
    flags: 'i'
    target: 'last_message'
  - name: 'no-ssh-on-this-machine'
    type: 'regex'
    pattern: '\bssh(?:\.exe)?\s+(?:-\S+\s+)*[\w.@-]*(?:lap|desk)-01\b'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
