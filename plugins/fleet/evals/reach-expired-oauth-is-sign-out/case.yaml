schema_version: "1.1"
name: 'reach-expired-oauth-is-sign-out'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'expected-output'
    type: 'llm'
    criteria: 'Diagnoses a signed-out Windows lane on the target, not a routing fault: the hop reached claude.exe. The fix is /login at that machine''s console or over RDP. Does not change the route, does not try to copy or send credentials, and does not propose sharing an account.'
    focus: 'trace'
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:fleet:)?reach"'
