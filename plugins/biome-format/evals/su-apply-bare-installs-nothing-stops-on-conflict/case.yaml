schema_version: "1.1"
name: su-apply-bare-installs-nothing-stops-on-conflict
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'install-needs-argument'
    type: 'llm'
    criteria: 'The reply says bare apply installs nothing, and that apply install-biome is the explicit argument that authorizes installing Biome.'
    focus: 'last_message'
  - name: 'stops-on-manager-conflict'
    type: 'llm'
    criteria: 'The reply says apply install-biome would not install in this repository: the package-lock.json contradicts the packageManager field, so it stops with manager-specific guidance instead of guessing a manager, and it never introduces a competing lockfile.'
    focus: 'last_message'
  - name: 'config-only-on-ask'
    type: 'llm'
    criteria: 'The reply says apply writes no biome.json on its own and creates a minimal one only when the user explicitly asks.'
    focus: 'last_message'
  - name: 'no-system-no-settings'
    type: 'llm'
    criteria: 'The reply says the skill never installs system packages such as jq, only points at install instructions, and never writes Claude Code user settings or pluginConfigs.'
    focus: 'last_message'
  - name: 'no-biome-json'
    type: 'file_exists'
    path: '**/biome.json'
    exists: false
  - name: 'no-biome-jsonc'
    type: 'file_exists'
    path: '**/biome.jsonc'
    exists: false
  - name: 'no-pnpm-lock'
    type: 'file_exists'
    path: '**/pnpm-lock.yaml'
    exists: false
  - name: 'no-yarn-lock'
    type: 'file_exists'
    path: '**/yarn.lock'
    exists: false
  - name: 'no-local-biome'
    type: 'file_exists'
    path: '**/node_modules/.bin/biome'
    exists: false
