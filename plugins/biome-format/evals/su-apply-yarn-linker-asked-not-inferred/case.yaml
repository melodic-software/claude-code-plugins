schema_version: "1.1"
name: su-apply-yarn-linker-asked-not-inferred
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'yarn-probe-ran'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?yarn(?:\.(?:exe|cmd))?(?:\\\"|'')?(?:\s+-{1,2}[^\s\"\\]+(?:\s+[^\s\"\\-][^\s\"\\]*)?)*?\s+config\s+get\s+nodeLinker\b'
    min: 1
  - name: 'linker-not-inferred'
    type: 'llm'
    criteria: 'The reply takes this repository''s linker from what yarn config get nodeLinker returned, or says Yarn could not be run so the linker is not known here. Stating the linker as a fact from the yarn.lock or from a default, with no such probe result, fails.'
    focus: 'last_message'
  - name: 'pnp-skips-with-reason'
    type: 'llm'
    criteria: 'The reply says that on pnp the install is skipped, because Plug''n''Play generates a loader file rather than the node_modules/.bin shim the hook resolves, and it offers installing Biome on PATH or switching the linker.'
    focus: 'last_message'
  - name: 'other-linkers-install'
    type: 'llm'
    criteria: 'The reply says that on node-modules, pnpm or Yarn Classic apply install-biome goes ahead with the install, and that it states the change before running it.'
    focus: 'last_message'
  - name: 'reverifies-after-install'
    type: 'llm'
    criteria: 'The reply says that after an install the relevant check probe is re-run live and its actual result reported, rather than claiming success on the install command''s exit code.'
    focus: 'last_message'
  - name: 'no-yarnrc'
    type: 'file_exists'
    path: '**/.yarnrc.yml'
    exists: false
  - name: 'no-local-biome'
    type: 'file_exists'
    path: '**/node_modules/.bin/biome'
    exists: false
