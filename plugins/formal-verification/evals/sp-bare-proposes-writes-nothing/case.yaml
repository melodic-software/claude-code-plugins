schema_version: "1.1"
name: sp-bare-proposes-writes-nothing
graders:
  - name: proposal-fields
    type: regex
    pattern: '(?=[\s\S]*\bPromise\b)(?=[\s\S]*\bHarm\b)(?=[\s\S]*\bTool\b)(?=[\s\S]*\bformal-[a-z0-9-]+)'
    target: last_message
    arm: with-only
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-install
    type: tool_used
    tool: Bash
    input_match: '\b(?:npm|pip|pipx|cargo|brew|apt(?:-get)?|winget|mise|sdk|opam|go)\s+(?:install|add|get)\b'
    min: 0
    max: 0
    arm: both
