schema_version: "1.1"
name: ch-unattended-blocked-installs-nothing
graders:
  - name: resolves-toolchain
    type: tool_used
    tool: Bash
    input_match: 'toolchain\.mjs(?:\\?"|'')?\s+resolve\b'
    arm: with-only
  - name: reports-blocked
    type: regex
    pattern: 'blocked: toolchain missing'
    target: last_message
    arm: with-only
  - name: no-install
    type: tool_used
    tool: Bash
    input_match: '(?:toolchain\.mjs(?:\\?"|'')?\s+install\b|\b(?:mise|apt(?:-get)?|brew|winget|sdk)\s+install\b)'
    min: 0
    max: 0
    arm: both
