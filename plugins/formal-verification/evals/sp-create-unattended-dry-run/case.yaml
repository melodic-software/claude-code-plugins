schema_version: "1.1"
name: sp-create-unattended-dry-run
graders:
  - name: lists-open-questions
    type: regex
    pattern: 'open question'
    flags: i
    target: last_message
    arm: with-only
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-worktree
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^\n]*\bworktree\s+add\b'
    min: 0
    max: 0
    arm: both
