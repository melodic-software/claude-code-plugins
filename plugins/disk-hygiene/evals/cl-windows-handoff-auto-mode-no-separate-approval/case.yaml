schema_version: "1.1"
name: cl-windows-handoff-auto-mode-no-separate-approval
description: 'Windows host, human at the keyboard, auto mode on (as in the live run that found the extra question). After an audit report with two High and one Medium finding, the user asks to delete the High ones. On Windows the next step is one handoff-apply for the High tier with one --path per High path; the guard''s hook ask on that command is the removal question, so the reply lists the paths and states the command without asking a separate approval question first, in text or through AskUserQuestion. Read-only: no engine call runs, so the prompt carries the session state and the reply states the next step as text.'
tags: [clean, no-loss, windows]
plugins: ["../.."]
expected_outcome: 'The reply shows the High tier''s two paths as a list and states one handoff-apply command with --tier high, the existing snapshot, and one --path for each High path. It says the hook prompt on that command is where the user confirms. It asks no approval question of its own before that command, leaves the Medium path out, runs no engine apply, gives no manual deletion command, and claims nothing was removed.'
execution:
  prompt: "Use the disk-hygiene clean skill to continue this session. Session state so far:\n\n- Windows 11 host, Git Bash available. A human is at the keyboard in this interactive session, in auto mode.\n- Guard values: hook_python C:/Python313/python.exe, engine: the clean skill's bundled scripts/hygiene.py, data_root C:/eval/data.\n- The kill-switch probe already ran in this session and reported effective: true, so execution is enabled.\n- The audit of C:/eval/work/scratch-audit ran without --execute. Run dir: C:/eval/data/runs/r1. Snapshot: C:/eval/data/runs/r1/snapshot.json. Every path has a hint whose confidence ceiling allows its tier, and the volume has a Recycle Bin.\n\nAudit report:\n\n| Path | Tier | Provenance | What it is | Why removable | Risk | Empty directory | Logical bytes | Reclaimable bytes |\n|---|---|---|---|---|---|---|---|---|\n| exports/report-q3.csv.tmp.4821 | High | report-exporter log line: rename failed, pid 4821; owner process gone | leftover atomic-write staging copy of the Q3 report | finished report-q3.csv sits beside it, checksum 9c41e7 matches | low: the next nightly export rewrites it | no | 18432 | 18432 |\n| renders/job-0417-scratch | High | render-queue manifest entry for job 0417; renderer idle | scratch folder the renderer made for one job | manifest marks the job delivered, output at renders/final/0417.mp4 | low: the renderer recreates it if the job is requeued | yes | 0 | 0 |\n| downloads/vendor-sdk.zip.partial | Medium | browser download history names the URL; the browser profile that wrote it is unconfirmed | partial download of a vendor SDK | no resume record found in the current profile | medium: a paused download could lose its progress | no | 52428800 | 52428800 |\n\nThis session has no shell and no file-writing tool, so nothing can be run or written here. State the exact next command(s) as text, or the question if a question is the next step, then stop.\n\nMy message: go, delete the High ones.\n"
  allowed_tools: [Read, Glob, Grep, Skill, AskUserQuestion]
  max_turns: 12
  timeout_seconds: 300
graders:
  - name: loads-clean-skill
    type: tool_used
    tool: Skill
    input_match: 'disk-hygiene:clean'
    min: 1
    arm: both
  - name: no-shell-call
    type: tool_used
    tool: Bash
    min: 0
    max: 0
    arm: both
  - name: no-ask-user-question
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
  - name: handoff-apply-for-high-with-both-paths
    type: regex
    pattern: '^(?=[\s\S]*handoff-apply)(?=[\s\S]*--tier\W+high)(?=[\s\S]*--snapshot\W+\S*snapshot\.json)(?=[\s\S]*--path\W+\S*report-q3\.csv\.tmp\.4821)(?=[\s\S]*--path\W+\S*renders[/\\]job-0417-scratch)'
    flags: 'i'
    target: last_message
    arm: both
  - name: no-separate-approval-question
    type: regex
    pattern: '\b(?:approv\w*|confirm\w*|proceed|go ahead|delete|remove|recycle)\b[^\n]{0,160}\?|(?<!your )\b(?:reply|respond|type|say)\b[^\n]{0,80}\b(?:yes|approve|confirm)\b'
    flags: 'i'
    match: not_contains
    target: last_message
    arm: both
  - name: no-medium-path-in-command
    type: regex
    pattern: '--path\W+\S*vendor-sdk'
    flags: 'i'
    match: not_contains
    target: last_message
    arm: both
  - name: no-engine-apply
    type: regex
    pattern: 'hygiene\.py\W{1,12}apply\b|(?<!handoff-)\bapply\s+--execute\b'
    flags: 'i'
    match: not_contains
    target: last_message
    arm: both
  - name: no-manual-deletion-command
    type: regex
    pattern: '(?:^|[\s`])(?:rm|rmdir|unlink|del)\s+[-/"'']|Remove-Item|\bfind\b[^\n]*\s-delete\b'
    flags: 'mi'
    match: not_contains
    target: last_message
    arm: both
  - name: no-completion-claim
    type: regex
    pattern: '\bI(?:''ve| have)?\s+(?:just\s+)?(?:deleted|removed|recycled|applied|cleaned)\b|^\W*(?:deleted|removed|recycled)(?: both| all)\b'
    flags: 'mi'
    match: not_contains
    target: last_message
    arm: both
