schema_version: "1.1"
name: au-unwalked-child-is-coverage-gap
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:disk-hygiene:)?audit"'
    arm: with-only
  - name: no-shell-call
    type: tool_used
    tool: Bash
    min: 0
    max: 0
    arm: both
  - name: hints-quoted-as-rate
    type: regex
    pattern: '\b3\s+(?:\w+\s+){0,2}of\s+(?:the\s+)?240\b|\b3\s*/\s*240\b'
    flags: 'i'
    target: last_message
    arm: both
  - name: unwalked-child-is-coverage-gap
    type: regex
    pattern: 'locked-share[^\n]{0,200}(?:not (?:walked|scanned)|wasn[''’]t (?:walked|scanned)|unwalked|walked:\s*false|coverage gap|size (?:is )?unknown|unknown size|(?:could not|couldn[''’]t) be (?:read|walked|scanned))|(?:not (?:walked|scanned)|unwalked|coverage gaps?)[^\n]{0,200}locked-share|coverage gaps?\W*\n[\s\S]{0,300}locked-share'
    flags: 'i'
    target: last_message
    arm: both
  - name: hands-off-to-clean
    type: regex
    pattern: 'disk-hygiene:clean'
    target: last_message
    arm: both
  - name: names-snapshot-path
    type: regex
    pattern: '/eval/data/runs/a1/snapshot\.json'
    target: last_message
    arm: both
  - name: no-safe-deletion-count
    type: regex
    pattern: '\b\d+\s+safe\s+(?:deletions?|removals?)\b|(?:^|[.!:;]\s+|\n\W*)(?:all\s+)?\d+\s+(?:\w+\s+)?(?:entries|files|items|paths)\s+(?:are\s+)?safe\s+to\s+(?:delete|remove)'
    flags: 'i'
    match: not_contains
    target: last_message
    arm: both
  - name: no-removal-engine-call
    type: regex
    pattern: 'hygiene\.py\W{1,12}(?:plan|preview|apply)\b'
    flags: 'i'
    match: not_contains
    target: last_message
    arm: both
  - name: no-manual-deletion-command
    type: regex
    pattern: '(?:^|[\s`])(?:rm|rmdir|unlink)\s+[-/"'']|Remove-Item|\bfind\b[^\n]*\s-delete\b'
    flags: 'mi'
    match: not_contains
    target: last_message
    arm: both
