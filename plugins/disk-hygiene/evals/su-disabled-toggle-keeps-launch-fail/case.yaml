schema_version: "1.1"
name: su-disabled-toggle-keeps-launch-fail
description: 'Legacy setup 5, facts as data: a Windows machine with disk_hygiene_enabled configured false whose interpreter ladder is exhausted (python3 and python are zero-length WindowsApps alias stubs, no py launcher), given in the prompt with no shell. Refit: the legacy prompt names only the python3 stub, but a stub beside a working python or py -3 is a WARN, not a failure (setup SKILL.md lines 52-53), so the prompt exhausts the ladder to keep the legacy FAIL. The interpreter step stays FAIL under the disabled toggle (lines 42-50): a guard that never launches cannot read or enforce the configured false. python-row-fail and no-python-info-row grade the row; keeps-fail-semantics (llm) quotes the legacy expectations. Slash-invoked, so no Skill grader. Read-only: no tool grant needed; run with --disallow-tools Grep if a Grep on the plugin dir reads INVALID.'
tags: [setup, check, windows, read-only, no-network]
plugins: ["../.."]
expected_outcome: 'The Python interpreter row is FAIL, not INFO, even though the toggle is disabled, because no rung of the ladder runs the guard, so audit-only mode cannot be enforced. The store-alias-stub verdict is treated as part of that guard-launch failure. The reply notes that re-enabling the toggle restores FAIL semantics for the probes that do downgrade.'
execution:
  prompt: "/disk-hygiene:setup check\n\nThe check is for another machine, not this session. This session has no shell and no file-writing tool, so nothing can be probed or written here. Report the check table from these facts, gathered on that machine, then stop.\n\n- Windows 11 host. node resolves to C:\\Program Files\\nodejs\\node.exe (v22.11.0). Git for Windows is installed and CLAUDE_CODE_GIT_BASH_PATH is C:\\Program Files\\Git\\bin\\bash.exe.\n- The plugin's disk_hygiene_enabled is set to false in the user settings.\n- `Get-Command python3` resolves to %LOCALAPPDATA%\\Microsoft\\WindowsApps\\python3.exe; `Get-Item -Force` on it shows Length 0 and the ReparsePoint attribute. No interpreter other than the bare name python3 was available to run the alias probe.\n- `Get-Command python` resolves to %LOCALAPPDATA%\\Microsoft\\WindowsApps\\python.exe, also Length 0 with the ReparsePoint attribute. `Get-Command py` finds nothing.\n- git 2.47.1 is on PATH.\n- With no interpreter, the kill-switch probe could not run; the user settings.json on that machine holds \"disk_hygiene_enabled\": \"false\" under the plugin's options.\n- That machine's copy of the plugin is unmodified, the same files as the plugin loaded in this session.\n"
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: python-row-fail
    type: regex
    pattern: '\bpython[^\n]{0,160}\bFAIL\b|\bFAIL\b[^\n]{0,160}\bpython'
    flags: 'i'
    target: last_message
    arm: both
  - name: no-python-info-row
    type: regex
    pattern: '^\|[^\n|]*\b(?:python|interpreter)[^\n|]*\|\s*\**INFO\**\s*\|'
    flags: 'mi'
    match: not_contains
    target: last_message
    arm: both
  - name: keeps-fail-semantics
    type: llm
    criteria: 'Pass only if all three legacy expectations hold. "Does not downgrade a step-1 or step-2 failure to INFO because the plugin is disabled": the interpreter failure stays FAIL. "Treats the store-alias-stub alias-probe verdict as a guard-launch failure": the stubs are part of why no guard can launch, not a harmless WARN. "Notes that re-enabling restores FAIL semantics for the downgraded probes." Fail if the reply says the disabled toggle makes the missing interpreter informational or harmless.'
    focus: last_message
    arm: both
