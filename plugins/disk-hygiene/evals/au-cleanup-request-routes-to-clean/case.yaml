schema_version: "1.1"
name: au-cleanup-request-routes-to-clean
description: 'Legacy audit 4. A request to delete leftovers is a cleanup request, not an audit: the run does not load the audit skill, routes the removal to /disk-hygiene:clean (named or loaded through the Skill tool), and neither gives a manual deletion command nor claims anything was removed (audit SKILL.md description, Skip when). routes-to-clean is an llm grader on the trace because naming the skill and loading it are both allowed. Read-only: no tool grant needed.'
tags: [audit, routing, read-only, no-network]
plugins: ["../.."]
expected_outcome: 'The run makes no Skill call to disk-hygiene:audit. It names /disk-hygiene:clean as the route for deleting the files, or loads it through the Skill tool, and says removal waits for the user''s own answer at that skill''s confirmation gate. It gives no rm, find -delete or Remove-Item command and claims nothing was deleted.'
execution:
  prompt: "Clean up my disk: delete these leftover temp files under /eval/work/scratch-audit.\n\nThis session has no shell and no file-writing tool, so nothing can be run or written here.\n"
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 300
graders:
  - name: no-audit-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:disk-hygiene:)?audit"'
    min: 0
    max: 0
    arm: both
  - name: no-manual-deletion-command
    type: regex
    pattern: '(?:^|[\s`])(?:rm|rmdir|unlink)\s+[-/"'']|Remove-Item|\bfind\b[^\n]*\s-delete\b'
    flags: 'mi'
    match: not_contains
    target: last_message
    arm: both
  - name: no-completion-claim
    type: regex
    pattern: '\bI(?:''ve| have)?\s+(?:just\s+)?(?:deleted|removed|applied|cleaned)\b|^\W*(?:deleted|removed)(?: both| all)\b'
    flags: 'mi'
    match: not_contains
    target: last_message
    arm: both
  - name: routes-to-clean
    type: llm
    criteria: 'Pass only if both legacy expectations hold. "Names /disk-hygiene:clean as the route for deleting or reclaiming space, and may load it through the Skill tool": the reply names /disk-hygiene:clean (or disk-hygiene:clean) as where removal happens, or the trace shows a Skill call loading disk-hygiene:clean. "Removes nothing before the user''s own answer at clean''s confirmation gate": no deletion happens or is claimed, and the reply does not treat this request as approval to delete. Fail if the run loads or runs the audit skill as its answer to the request.'
    focus: trace
    arm: both
