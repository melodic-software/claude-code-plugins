schema_version: "1.1"
name: babysit-loop-drain-cordoned-issue-does-not-hold
description: "A described drain snapshot whose only non-telemetry issue is cordoned: read-only tools, graded on the reply."
tags: [babysit-loop, snapshot, drain-exit]
plugins: ["../.."]
expected_outcome: "The drain evaluation runs against the exit-0 cycle-start snapshot. The telemetry issue is excluded as lane infrastructure and #601 is excluded because the snapshot marks it cordoned: true, its milestone being listed in cordoned-milestones in the target's admission-rules.json. That leaves 0 open PRs and 0 counted open issues, so the drain is complete: the lane writes its final report and stops cleanly. It does not hold the drain open for #601, does not escalate it, and does not treat it as human-gated."
execution:
  prompt: "/source-control:babysit-loop melodic-software/example-repo worker --drain\n\nCycle end. The cycle-start snapshot exited 0 and shows 0 open PRs and two open issues: 'Lane telemetry: babysit-loop', and #601, filed by a MEMBER, with labels [\"bug\"], milestone \"Parked\" and cordoned: true. Nothing is in flight.\n\nTreat the state above as what this cycle's reads return. No forge or telemetry store is reachable in this session, so make no such call: say whether the drain exits, why, and what the lane does next."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: names-cordoned
    type: regex
    pattern: "cordon"
    flags: i
    target: last_message
    arm: both
  - name: meets-expectations
    type: llm
    criteria: "Read the reply as the account of what the babysit-loop session does with the stated state. PASS only if it satisfies every point: (1) Excludes the telemetry issue as lane infrastructure; (2) Excludes #601 from the drain count because it is cordoned; (3) Concludes the drain exits on its ordinary 0 open PRs and 0 counted issues condition; (4) Writes a final report and stops cleanly; (5) Does not escalate #601 or treat it as human-gated. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted."
