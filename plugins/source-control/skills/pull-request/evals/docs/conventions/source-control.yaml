# Eval fixture: a repository's docs/conventions/source-control.yaml team layer declaring
# Conventional Commits with the bundled type list and pr_body_attribution: none.
subject_pattern: Conventional Commits
type_list:
  - build
  - chore
  - ci
  - docs
  - feat
  - fix
  - perf
  - refactor
  - revert
  - style
