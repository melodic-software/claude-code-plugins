# Eval fixture: a repository's docs/conventions/source-control.yaml team layer declaring
# Conventional Commits with the bundled type list and a Co-Authored-By trailer template.
subject_pattern: Conventional Commits
type_list:
  - build
  - chore
  - ci
  - docs
  - feat
  - fix
  - perf
  - refactor
  - revert
  - style
  - test
pr_title_pattern: Same as `subject_pattern`.
trailer_policy: "Co-Authored-By: Claude <model> (<context>) <noreply@anthropic.com>"
