schema_version: "1.1"
name: 'setup-check-shows-role-map-and-ignore-gap'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'ran-setup-check'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?setup\.sh(?:\\")?(?:(?:[^"\\]|\\.)*?\$\{?\w+\}?(?:\\")?)?[ \t]+check\b'
    arm: 'with-only'
  - name: 'no-apply'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:--write\b|setup\.sh(?:\\")?(?:(?:[^"\\]|\\.)*?\$\{?\w+\}?(?:\\")?)?[ \t]+apply\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-shell-gitignore-write'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:(?<=[\s"])&?>>?[ \t]*(?:\\")?[^\s;|&"\\]*\.gitignore\b|(?:\btee\b|\bsed\s+-i)(?:[^"\\]|\\.)*?\.gitignore\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'role-lines'
    type: 'regex'
    pattern: '^(?:(?=[\s\S]*?\borchestrator\b[^\n]*?\bsingle\b[^\n]*?@[^\n]*?\bfan-?out\b[^\n]*?@)(?=[\s\S]*?\bworker\b[^\n]*?\bsingle\b[^\n]*?@[^\n]*?\bfan-?out\b[^\n]*?@)(?=[\s\S]*?\bverifier\b[^\n]*?\bsingle\b[^\n]*?@[^\n]*?\bfan-?out\b[^\n]*?@)(?=[\s\S]*?\bretrieval\b[^\n]*?\bsingle\b[^\n]*?@[^\n]*?\bfan-?out\b[^\n]*?@)|(?=[\s\S]*?(?:^|\n)[ \t]*\|[^|\n]*\|[ \t]*[`*]*single[`*]*[ \t]*\|[ \t]*[`*]*fan-?out[`*]*[ \t]*\|)(?=[\s\S]*?(?:^|\n)[ \t]*\|[ \t]*[`*]*orchestrator[`*]*[ \t]*\|[^|\n]*@[^|\n]*\|[^|\n]*@[^|\n]*\|)(?=[\s\S]*?(?:^|\n)[ \t]*\|[ \t]*[`*]*worker[`*]*[ \t]*\|[^|\n]*@[^|\n]*\|[^|\n]*@[^|\n]*\|)(?=[\s\S]*?(?:^|\n)[ \t]*\|[ \t]*[`*]*verifier[`*]*[ \t]*\|[^|\n]*@[^|\n]*\|[^|\n]*@[^|\n]*\|)(?=[\s\S]*?(?:^|\n)[ \t]*\|[ \t]*[`*]*retrieval[`*]*[ \t]*\|[^|\n]*@[^|\n]*\|[^|\n]*@[^|\n]*\|))'
    flags: 'i'
    target: 'last_message'
  - name: 'recommends-local-ignore-line'
    type: 'regex'
    pattern: '\.claude/\*\*/\*\.local\.\*'
    target: 'last_message'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
  - name: 'ran-check-session-opus'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?=(?:[^"\\]|\\.)*?setup\.sh)(?=(?:[^"\\]|\\.)*?[ \t]check\b)(?=(?:[^"\\]|\\.)*?\bsession=opus\b)'
    min: 1
    arm: 'with-only'
  - name: 'inherit-wording'
    type: 'regex'
    pattern: '^[^\n]*\b(?:orchestrator|worker|verifier)\b[^\n]*\binherit: omit the model option\b'
    flags: 'm'
    target: 'last_message'
  - name: 'no-bare-inherit'
    type: 'regex'
    pattern: '^[ \t]*(?:[-*|][ \t]*)?[`*]*(?:orchestrator|worker|verifier|retrieval)\b[^\n]*\binherit\b(?!: omit the model option)'
    flags: 'm'
    match: 'not_contains'
    target: 'last_message'
