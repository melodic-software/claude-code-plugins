schema_version: "1.1"
name: 'setup-check-shows-role-map-and-ignore-gap'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'ran-setup-check'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?setup\.sh(?:\\")?(?:(?:[^"\\]|\\.)*?\$\{?\w+\}?(?:\\")?)?[ \t]+check\b'
    arm: 'with-only'
  - name: 'no-apply'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:--write\b|setup\.sh(?:\\")?(?:(?:[^"\\]|\\.)*?\$\{?\w+\}?(?:\\")?)?[ \t]+apply\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-shell-gitignore-write'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:(?<=[\s"])&?>>?[ \t]*(?:\\")?[^\s;|&"\\]*\.gitignore\b|(?:\btee\b|\bsed\s+-i)(?:[^"\\]|\\.)*?\.gitignore\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'role-lines'
    type: 'regex'
    pattern: '^(?=[\s\S]*?\borchestrator\b[^\n]*?\bsingle\b[^\n]*?@[^\n]*?\bfan-?out\b[^\n]*?@)(?=[\s\S]*?\bworker\b[^\n]*?\bsingle\b[^\n]*?@[^\n]*?\bfan-?out\b[^\n]*?@)(?=[\s\S]*?\bverifier\b[^\n]*?\bsingle\b[^\n]*?@[^\n]*?\bfan-?out\b[^\n]*?@)(?=[\s\S]*?\bretrieval\b[^\n]*?\bsingle\b[^\n]*?@[^\n]*?\bfan-?out\b[^\n]*?@)'
    flags: 'i'
    target: 'last_message'
  - name: 'recommends-local-ignore-line'
    type: 'regex'
    pattern: '\.claude/\*\*/\*\.local\.\*'
    target: 'last_message'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
