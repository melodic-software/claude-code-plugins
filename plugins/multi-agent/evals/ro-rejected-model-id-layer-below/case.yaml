schema_version: "1.1"
name: 'ro-rejected-model-id-layer-below'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'invoked-route'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:multi-agent:)?route"'
    min: 1
    arm: 'with-only'
  - name: 'ran-route-worker-research'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?=(?:[^"\\]|\\.)*?route\.sh)(?=(?:[^"\\]|\\.)*?[ \t]worker\b)(?=(?:[^"\\]|\\.)*?[ \t]research\b)'
    min: 1
    arm: 'with-only'
  - name: 'worker-effort-medium'
    type: 'regex'
    pattern: '^[ \t]*(?:[-*][ \t]+)?`?worker: single [^\n@]*@ medium; fanout [^\n@]*@ medium\b'
    flags: 'm'
    target: 'last_message'
  - name: 'json-model-source-bundled'
    type: 'regex'
    pattern: '"worker"\s*:\s*\{\s*"role"\s*:\s*"worker"\s*,\s*"single"\s*:\s*\{[^{}]*\}\s*,\s*"fanout"\s*:\s*\{[^{}]*\}\s*,\s*"source"\s*:\s*\{\s*"model"\s*:\s*"bundled"'
    target: 'last_message'
  - name: 'note-rejected-relayed'
    type: 'regex'
    pattern: 'roles\.worker\.model[`*]*[ \t]+rejected\b'
    target: 'last_message'
  - name: 'alias-reason'
    type: 'regex'
    pattern: '\bonly[ \t]+(?:model[ \t]+)?aliases\b|\b(?:not|isn[''’]t)[ \t]+an?[ \t]+alias\b|\balias(?:es)?\b[^\n.]{0,60}?\b(?:accepted|allowed|required|valid)\b|\b(?:accepts?|allows?|requires?|takes?)\b[^\n.]{0,30}?\balias(?:es)?\b'
    flags: 'i'
    target: 'last_message'
  - name: 'layer-below-named'
    type: 'regex'
    pattern: '^(?![ \t]*[{}"\[])[^\n]*\b(?:layer below|lower layer|bundled[ \t]+(?:defaults?|layer|value)s?|defaults?\.yaml)\b'
    flags: 'im'
    target: 'last_message'
  - name: 'no-override-model-claim'
    type: 'regex'
    pattern: '^[ \t]*(?:[-*][ \t]+)?`?worker: single claude-|"model"\s*:\s*"claude-|\bworker\b[^\n.]{0,40}?(?<!not )(?<!n''t )(?<!n’t )(?<!never )\b(?:runs?|running|ran|uses?|using|used|(?:resolves?|resolving|resolved)[ \t]+to)[ \t]+(?:on[ \t]+)?`?claude-opus-5-5'
    flags: 'im'
    match: 'not_contains'
    target: 'last_message'
  - name: 'override-file-kept'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:(?<=[\s"])&?>>?(?!&)[ \t]*(?:\\")?[^\s;|&"\\]*multi-agent\.local\.yaml|(?:(?<=\\n)|(?<=\\t)|(?<![\w\\-]))(?:tee|sed[ \t]+-i|mv|rm|unlink|truncate|perl[ \t]+-\w*i|yq[ \t]+-i)\b(?:[^"\\]|\\.)*?multi-agent\.local\.yaml|multi-agent\.local\.yaml(?:[^"\\]|\\.)*?(?:(?<=[\s"])&?>>?(?!&)|\btee\b(?:[ \t]+-a)?)[ \t]*(?:\\")?\$)'
    min: 0
    max: 0
