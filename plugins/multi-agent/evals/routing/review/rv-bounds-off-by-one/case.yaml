schema_version: "1.1"
name: rv-bounds-off-by-one
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'names-defect'
    type: 'regex'
    pattern: '^\W*(?:\d+[.)]\W*)?finding\W*:[^\n]*\b(?:bound_problem|check_bounds)\b'
    flags: 'im'
    target: 'last_message'
  - name: 'one-finding'
    type: 'regex'
    pattern: '^\W*(?:\d+[.)]\W*)?finding\W*:'
    flags: 'im'
    match: 'count:1'
    target: 'last_message'
