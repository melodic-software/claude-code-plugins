schema_version: "1.1"
name: rt-frontier-guard
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'names-file'
    type: 'regex'
    pattern: 'resolve-roles\.sh'
    target: 'last_message'
  - name: 'names-function'
    type: 'regex'
    pattern: '\brole_json\b'
    target: 'last_message'
  - name: 'fallback-opus'
    type: 'regex'
    pattern: '^[^\n]*\bfallback\b[^\n]*\bopus\b'
    flags: 'im'
    target: 'last_message'
