schema_version: "1.1"
name: ad-repo-no-workflow-stops
graders:
  - name: 'says-workflows-unavailable'
    type: 'regex'
    pattern: '(?:(?:`?\bWorkflow`?(?:[ \t]+tool)?`?[^\n.;?]{0,30}?\b(?:(?:is|was|are)[ \t]+not|(?:is|was|are)n[''’]?t|not)[ \t]+(?:callable|available|present|listed|loaded|exposed|(?:in|among|part[ \t]+of)[ \t]+(?:this|the|my)[ \t]+(?:[\w''’]+[ \t]+)?(?:session|toolset|tools?)\b|(?:one|a[ \t]+tool|something|anything)[ \t]+I[ \t]+(?:can|could)[ \t]+(?:call|use|load|invoke)|a[ \t]+callable[ \t]+tool)|`?\bWorkflow`?(?:[ \t]+tool)?`?[^\n.;?]{0,30}?\b(?:can(?:not|[''’]?t)|can[ \t]+not|could(?:n[''’]?t|[ \t]+not))[ \t]+be[ \t]+(?:called|used|loaded|invoked)|`?\bWorkflow`?(?:[ \t]+tool)?`?[^\n.;?]{0,30}?(?<!not )(?<!n''t )(?<!n’t )\b(?:unavailable|missing|absent)\b|\b(?:(?:[Nn]o|[Ww]ithout|[Ll]acks?|[Ll]acking|[Mm]issing|[Aa]bsent)[ \t]+(?:(?:the|a|an|any)[ \t]+)?(?:(?:callable|usable|loaded)[ \t]+)?|(?:do(?:es)?n[''’]?t|do(?:es)?[ \t]+not|did(?:n[''’]?t|[ \t]+not))[ \t]+have[ \t]+(?:(?:the|a|an|any)[ \t]+)?(?:(?:callable|usable|loaded)[ \t]+)?|(?:(?:can(?:not|[''’]?t)|can[ \t]+not|could(?:n[''’]?t|[ \t]+not))|[Uu]nable[ \t]+to)[ \t]+(?:call|use|load|invoke)[ \t]+(?:(?:the|a|an|any)[ \t]+)?(?:(?:callable|usable|loaded)[ \t]+)?)`?Workflow\b`?(?=[ \t]+(?:tools?|callable|available|in|here)\b|[ \t]*(?:[.,;:!)]|$))(?![ \t]+(?:tools?[ \t]+)?(?:is[ \t]+)?(?:needed|required|necessary)\b))(?![^\n.!?]*\?)|\b[Ww]orkflows?[ \t]+(?:(?:are|is)[ \t]+)?(?:unavailable|not[ \t]+available|not[ \t]+callable)|\b[Ww]orkflows?(?:,?[ \t]+(?:and|but)[ \t]+they)?[ \t]+(?:are|is)n[''’]?t[ \t]+(?:available|callable))(?![^\n.!?]*\?)'
    target: 'last_message'
  - name: 'says-repo-mode-stops'
    type: 'regex'
    pattern: '(?<!n''t )(?<!n’t )(?<!not )(?<!never )(?<!to )(?<!without )\b(?:stop(?:s|ped|ping)?|halt(?:s|ed)?|(?:can(?:not|[''’]t|[ \t]+not)|won[''’]t|will[ \t]+not|did(?:n[''’]t|[ \t]+not)|does(?:n[''’]t|[ \t]+not))[ \t]+run)\b(?![^\n.!?]*\?)'
    flags: 'i'
    target: 'last_message'
  - name: 'no-findings-table'
    type: 'regex'
    pattern: '^\|[^\n]*\b[\w./-]+\.md:\d+'
    flags: 'm'
    match: 'not_contains'
    target: 'last_message'
  - name: 'no-grep'
    type: 'tool_used'
    tool: 'Grep'
    min: 0
    max: 0
  - name: 'no-glob'
    type: 'tool_used'
    tool: 'Glob'
    min: 0
    max: 0
  - name: 'no-webfetch'
    type: 'tool_used'
    tool: 'WebFetch'
    min: 0
    max: 0
  - name: 'no-shell-sweep'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:(?<![\w.-])(?:[ez]?grep|ugrep|rg|ag|ack|find|fd|tree)\b|(?<![\w.-])ls(?:[ \t]+[^\s;|&]+)*?[ \t]+(?:-[A-Za-z]*R|--recursive)\b|\bgit\s+(?:grep|ls-files|ls-tree)\b|list-targets\.sh)'
    min: 0
    max: 0
  - name: 'no-repo-read'
    type: 'tool_used'
    tool: 'Read'
    input_match: '"file_path":"(?!(?:[^"\\]|\\.)*/multi-agent/)'
    min: 0
    max: 0
