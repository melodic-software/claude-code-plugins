schema_version: "1.1"
name: 'ro-vendor-heavy-above-default'
graders:
  - name: 'invoked-route'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:multi-agent:)?route"'
    min: 1
    arm: 'with-only'
  - name: 'claude-line-raised'
    type: 'regex'
    pattern: '^[ \t]*(?:[-*][ \t]+)?`?claude:\s*model\s+\S+\s*@\s*effort\s+(?:high|xhigh|max)\b[^\n]*basis:\s*(?!default)\S'
    flags: 'mi'
    target: 'last_message'
  - name: 'cites-effort-table'
    type: 'regex'
    pattern: 'model-config#choose-an-effort-level|choose an effort level'
    flags: 'i'
    target: 'last_message'
