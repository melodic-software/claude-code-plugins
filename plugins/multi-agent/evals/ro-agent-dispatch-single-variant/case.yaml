schema_version: "1.1"
name: 'ro-agent-dispatch-single-variant'
graders:
  - name: 'invoked-route'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:multi-agent:)?route"'
    min: 1
    arm: 'with-only'
  - name: 'ran-route-worker-fable'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?=(?:[^"\\]|\\.)*?route\.sh)(?=(?:[^"\\]|\\.)*?[ \t]worker\b)(?=(?:[^"\\]|\\.)*?\bsession=fable\b)'
    min: 1
    arm: 'with-only'
  - name: 'says-omit-model'
    type: 'regex'
    pattern: '^(?![ \t]*(?:[-*][ \t]+)?`?(?:orchestrator|worker|verifier|retrieval):)[^\n]*?(?:\b(?:omit(?:ting)?|leave[ \t]+out|leave[ \t]+off|drop|skip)\b[^\n.]{0,20}?`?\bmodel\b`?|`?\bmodel\b`?[^\n.]{0,30}?\b(?:omitted|left[ \t]+(?:out|off)|unset)\b|\bleave\b[^\n.]{0,12}?`?\bmodel\b`?[ \t]+(?:off|out)\b|\b(?:do(?:n[''’]t|[ \t]+not)|never)[ \t]+(?:pass|set|include|send|add)\b[^\n.]{0,20}?`?\bmodel\b`?|\bno[ \t]+`?model`?[ \t]+(?:parameter|field|option|argument|key)\b)'
    flags: 'im'
    target: 'last_message'
  - name: 'no-model-in-agent-snippet'
    type: 'regex'
    pattern: '\bAgent\b[^\n]{0,20}?[({][^)}]*?["'']?\bmodel\b["'']?\s*:'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'no-model-on-call'
    type: 'regex'
    pattern: '\bmodel\b`?\s*[:=]\s*["''`]?(?:fable|inherit)\b'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: 'passes-effort-medium'
    type: 'regex'
    pattern: '^(?![ \t]*(?:[-*][ \t]+)?`?(?:orchestrator|worker|verifier|retrieval):)[^\n]*?(?<!")\beffort\b(?!")[`''"]?\s*[:=]?\s*[^\n.]{0,40}?\bmedium\b'
    flags: 'im'
    target: 'last_message'
