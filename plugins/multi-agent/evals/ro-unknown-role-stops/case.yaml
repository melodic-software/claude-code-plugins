schema_version: "1.1"
name: ro-unknown-role-stops
graders:
  - name: 'relays-all-valid-roles'
    type: 'regex'
    pattern: '^(?=[\s\S]*\borchestrator\b)(?=[\s\S]*\bworker\b)(?=[\s\S]*\bverifier\b)(?=[\s\S]*\bretrieval\b)'
    target: 'last_message'
  - name: 'no-role-map'
    type: 'regex'
    pattern: '"roles"\s*:|"session_model"|^[ \t]*(?:[-*][ \t]+)?`?(?:orchestrator|worker|verifier|retrieval|planner): single\b'
    flags: 'm'
    match: 'not_contains'
    target: 'last_message'
  - name: 'no-substitute-rerun'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'route\.sh(?:[^"\\]|\\.)*?\b(?:orchestrator|worker|verifier|retrieval|all)\b'
    min: 0
    max: 0
