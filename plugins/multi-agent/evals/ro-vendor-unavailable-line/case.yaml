schema_version: "1.1"
name: 'ro-vendor-unavailable-line'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'ran-vendor-decide'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?vendor-decide\b'
    min: 1
    arm: 'with-only'
  - name: 'claude-line-present'
    type: 'regex'
    pattern: '^[ \t]*(?:[-*][ \t]+)?`?claude:\s*model\s+\S+[^@\n]*@\s*effort\s+\S+[^\n]*basis:'
    flags: 'mi'
    target: 'last_message'
  - name: 'codex-unavailable-line'
    type: 'regex'
    pattern: "^[ \\t]*(?:[-*][ \\t]+)?`?codex\\b[^\\n]*(?:unavailable|not\\s+available|isn't\\s+available|isn't\\s+installed|not\\s+found)"
    flags: 'mi'
    target: 'last_message'
  - name: 'antigravity-skipped-silently'
    type: 'regex'
    pattern: '^[ \t]*(?:[-*][ \t]+)?`?(?:gemini|antigravity):\s*(?:model|unavailable)'
    flags: 'mi'
    match: 'not_contains'
    target: 'last_message'
