schema_version: "1.1"
name: 'ad-fanout-fallback-unread'
graders:
  - name: 'ran-list-pointers-fanout'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'list-pointers\.sh(?:\\?")?(?:[ \t]+--json)?[ \t]+fanout\b'
    min: 1
    arm: 'with-only'
  - name: 'no-other-owner-arg'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'list-pointers\.sh(?:\\?")?(?:[ \t]+--json)?[ \t]+(?:defaults|orchestrator|worker|verifier|retrieval)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-workflow-launch'
    type: 'tool_used'
    tool: 'Workflow'
    min: 0
    max: 0
    arm: 'both'
  - name: 'says-fallback-ran'
    type: 'regex'
    pattern: '(?<!not )(?<!n''t )(?<!n’t )\b(?:main[- ]thread[ \t]+)?fallback\b[^\n.]{0,60}?\b(?:ran|runs|run|running|took|taken|used|applied|applies)\b|\b(?:ran|running|took|taking|used|using|via|through)\b[^\n.]{0,30}?\b(?:the[ \t]+)?(?:main[- ]thread[ \t]+)?fallback\b|\bmain[- ]thread\b[^\n.]{0,40}?\b(?:ran|run|runs|audit|pass|path)\b'
    flags: 'i'
    target: 'last_message'
  - name: 'marks-unread'
    type: 'regex'
    pattern: '\bunread\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-current-verdict'
    type: 'regex'
    pattern: '^[ \t]*\|(?:[^\n|]*\|)*?[ \t]*[`*]*current[`*]*[ \t]*\|(?![^\n]*\n[ \t]*\|[ \t]*:?-+:?[ \t]*(?:\|[ \t]*:?-+:?[ \t]*)*\|?[ \t]*$)'
    flags: 'im'
    match: 'not_contains'
    target: 'last_message'
  - name: 'no-changes-proposed'
    type: 'regex'
    pattern: '\bNo changes proposed\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-diff-block'
    type: 'regex'
    pattern: '```diff'
    match: 'not_contains'
    target: 'last_message'
  - name: 'no-other-owner-rows'
    type: 'regex'
    pattern: '^[ \t]*\|[ \t]*[`*]*(?:orchestrator|worker|verifier|retrieval)\b'
    flags: 'm'
    match: 'not_contains'
    target: 'last_message'
  - name: 'no-guard-off-proposal'
    type: 'regex'
    pattern: '^[ \t]*\+[^\n]*frontier_guard[^\n]*\bfalse\b|^[ \t]*\|[^\n]*frontier_guard[^\n]*\bfalse\b'
    flags: 'm'
    match: 'not_contains'
    target: 'last_message'
  - name: 'names-both-fanout-pointers'
    type: 'regex'
    pattern: '^(?=[\s\S]*workflows#cost)(?=[\s\S]*orchestrator-strategy)'
    target: 'last_message'
  - name: 'counts-sources'
    type: 'regex'
    pattern: '\b(?:\d+|zero|one|two|three|no)\b[^\n.\d|]{0,25}?\b(?:unread|not[ \t]+read)\b|\b(?:unread|not[ \t]+read)\b[^\n.\d|]{0,15}?\b(?:\d+|zero|one|two|three|none)\b'
    flags: 'i'
    target: 'last_message'
