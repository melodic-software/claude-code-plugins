schema_version: "1.1"
name: 'ro-vendor-routing-off'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'ran-route'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?route\.sh\b'
    min: 1
    arm: 'with-only'
  - name: 'ran-vendor-decide'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?vendor-decide\b'
    min: 1
    arm: 'with-only'
  - name: 'no-fetch-boards'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?fetch-boards\b'
    min: 0
    max: 0
    arm: 'with-only'
  - name: 'says-routing-off'
    type: 'regex'
    pattern: '\brouting\b[^\n.]{0,30}\b(?:is\s+off|off|disabled)\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-vendor-recommendation'
    type: 'regex'
    pattern: '^[ \t]*(?:[-*][ \t]+)?`?(?:claude|codex|gemini):\s*model\s+\S+\s*@\s*effort\s+\S+'
    flags: 'mi'
    match: 'not_contains'
    target: 'last_message'
