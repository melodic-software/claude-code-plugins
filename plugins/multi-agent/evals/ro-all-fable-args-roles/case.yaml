schema_version: "1.1"
name: 'ro-all-fable-args-roles'
graders:
  - name: 'invoked-route'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:multi-agent:)?route"'
    min: 1
    arm: 'with-only'
  - name: 'ran-route-all-fable'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?=(?:[^"\\]|\\.)*?route\.sh)(?=(?:[^"\\]|\\.)*?[ \t]all\b)(?=(?:[^"\\]|\\.)*?\bsession=fable\b)'
    min: 1
    arm: 'with-only'
  - name: 'fenced-json-block'
    type: 'regex'
    pattern: '```json[ \t]*\n\s*\{[\s\S]*"roles"[\s\S]*\}\s*\n```'
    target: 'last_message'
  - name: 'json-worker-fanout-opus'
    type: 'regex'
    pattern: '"worker"\s*:\s*\{\s*"role"\s*:\s*"worker"\s*,\s*"single"\s*:\s*\{[^{}]*\}\s*,\s*"fanout"\s*:\s*\{\s*"model"\s*:\s*"opus"'
    target: 'last_message'
  - name: 'orchestrator-line-opus'
    type: 'regex'
    pattern: '^[ \t]*(?:[-*][ \t]+)?`?orchestrator: single inherit: omit the model option @ high; fanout opus @ high\b'
    flags: 'm'
    target: 'last_message'
  - name: 'worker-line-opus'
    type: 'regex'
    pattern: '^[ \t]*(?:[-*][ \t]+)?`?worker: single inherit: omit the model option @ medium; fanout opus @ medium\b'
    flags: 'm'
    target: 'last_message'
  - name: 'verifier-line-opus'
    type: 'regex'
    pattern: '^[ \t]*(?:[-*][ \t]+)?`?verifier: single inherit: omit the model option @ high; fanout opus @ high\b'
    flags: 'm'
    target: 'last_message'
  - name: 'no-bare-inherit'
    type: 'regex'
    pattern: '^[ \t]*(?:[-*][ \t]+)?`?(?:orchestrator|worker|verifier|retrieval):[^\n]*\binherit\b(?!: omit the model option)'
    flags: 'm'
    match: 'not_contains'
    target: 'last_message'
