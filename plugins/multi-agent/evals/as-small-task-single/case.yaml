schema_version: "1.1"
name: as-small-task-single
graders:
  - name: 'verdict-single'
    type: 'regex'
    pattern: '^verdict:[ \t]*`?single`?[ \t]*$'
    flags: 'm'
    target: 'last_message'
  - name: 'no-shape-line'
    type: 'regex'
    pattern: '^\s*`?shape\s*:'
    flags: 'im'
    match: 'not_contains'
    target: 'last_message'
  - name: 'only-two-line-block'
    type: 'regex'
    pattern: '^\s*(?:```[a-z]*[ \t]*\n)?verdict:[ \t]*`?single`?[ \t]*\nreason:[ \t]*[^\n]+\n?(?:```)?\s*$'
    target: 'last_message'
  - name: 'no-agent-spawned'
    type: 'tool_used'
    tool: 'Agent'
    min: 0
    max: 0
  - name: 'reason-dependent-shape'
    type: 'regex'
    pattern: '^reason:[^\n]*(?<!\bno )(?<!without )(?<!not )(?<!n''t )(?<!n’t )\b(?:depend\w*|chain\w*|sequential\w*|in[ \t]+sequence|one[ \t]+after[ \t]+another|coupled|serial)\b'
    flags: 'im'
    target: 'last_message'
  - name: 'reason-names-size'
    type: 'regex'
    pattern: '^reason:[^\n]*\b(?:small|tiny|short|trivial|minor|few|little|quick)\b'
    flags: 'im'
    target: 'last_message'
  - name: 'no-workflow-launch'
    type: 'tool_used'
    tool: 'Workflow'
    min: 0
    max: 0
    arm: 'both'
