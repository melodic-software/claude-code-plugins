# Bundled role map: the bottom layer of the multi-agent cascade.
# Keys and layering: reference/config.md. A consumer layer overrides per key.
#
# model: an alias (opus, sonnet, haiku, fable) or `inherit`. `inherit`
#   means a workflow omits opts.model on a generic agent() call
#   (reference/config.md).
# effort: low | medium | high | xhigh | max. Always passed explicitly.
# pointer*, as_of, recheck: where the default's basis lives, read by
#   /multi-agent:audit-defaults. The resolver never emits them.
# basis_<field>: per role, `upstream` or `judgment` for that role's <field>
#   (model or effort). `upstream` names pointer_<field>, the section whose
#   statement sets the value or the rule it follows from, and claim_<field>,
#   which statement in it. `judgment` names reason_<field>: no upstream
#   statement sets the value, and why it is what it is. The resolver emits the
#   basis beside each value; the audit checks that an upstream pointer states it.
#   A workloads.<w>.<field> value records its basis on the role as
#   basis_<w>_<field>, with pointer_<w>_<field> and claim_<w>_<field> or
#   reason_<w>_<field>.
# Which roles may route to haiku, and at what effort: reference/routing-rubric.md.
schema: 1

# Workloads a role may set values for (roles.<r>.workloads.<w>). A consumer
# layer declares its own the same way, or withdraws one with false.
workloads:
  code: true
  research: true
  mechanical: true

# Session model aliases treated as frontier by the fan-out guard.
frontier: fable

# The fan-out guard: the resolver names no frontier model for a stage that runs
# more than one agent. Under a frontier session, or when the caller does not name
# the session model, every role's fan-out variant names fanout.model where it
# would otherwise inherit (or name) a frontier model. Single-agent stages keep
# the role's own model. Turning frontier_guard off is an explicit opt-in to
# frontier fan-outs.
fanout:
  frontier_guard: true
  model: opus
  pointer: https://code.claude.com/docs/en/workflows#cost
  pointer_cost: https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence#orchestrator-strategy-delegate-bulk-work
  as_of: 2026-11-09
  recheck: a new model named on the cost page, or a workflows Cost section change to how a stage's model is chosen

roles:
  orchestrator:
    model: inherit
    effort: high
    basis_model: judgment
    reason_model: the orchestrator is the session itself, so it runs on the model the user chose; the cost page's orchestrator strategy puts a frontier model in the loop, which inherit follows only when the session is frontier, and no upstream statement sets the orchestrator's model for other sessions
    basis_effort: judgment
    reason_effort: no upstream statement sets this orchestrator's effort; the model guide's task table (https://claude.dev/blog/which-claude-model-should-you-build-with#pick-a-model-by-task) starts a Fable lead of many subagents at medium, then high, while this orchestrator inherits the session model and merges every worker's result, so it takes the second step, which pointer_levels' effort table gives to work where verification matters or edge cases are likely
    pointer_levels: https://code.claude.com/docs/en/model-config#choose-an-effort-level
    pointer_skill: /workflow-authoring (bundled first-party skill, agent() opts.model and opts.effort)
    as_of: 2026-11-09
    recheck: the guide's task table changes the starting effort for leading many subagents, model-config's effort table changes the row for verification-heavy work, the cost page's orchestrator-strategy section changes which model holds the loop, or a Claude Code release edits the bundled /workflow-authoring skill
  worker:
    model: inherit
    effort: medium
    workloads:
      mechanical:
        model: sonnet
    basis_model: judgment
    reason_model: the cost page's orchestrator strategy delegates to lower-cost workers, and the fan-out guard applies that under a frontier session; under any other session no cheaper alias is set, because the same page measured delegation paying only in named cases
    basis_effort: upstream
    pointer_effort: https://code.claude.com/docs/en/model-config#choose-an-effort-level
    claim_effort: the effort table's row for day-to-day engineering work with a clear scope
    basis_mechanical_model: judgment
    reason_mechanical_model: mechanical work needs no Opus-level reasoning; the model guide's task table (https://claude.dev/blog/which-claude-model-should-you-build-with#pick-a-model-by-task) starts well-scoped coding, such as bug fixes, feature iteration and spec-driven work, on Sonnet, but sits on a host the drift audit does not fetch, so it is recorded as context rather than an upstream pointer
    pointer_skill: /workflow-authoring (bundled first-party skill, agent() opts.model and opts.effort)
    pointer_spawn: https://code.claude.com/docs/en/sub-agents#choose-an-effort-level
    as_of: 2026-11-09
    recheck: model-config's effort table changes the row for clear-scope engineering work, the cost page's orchestrator strategy changes its worker-model advice, a new model is named on the cost page, the guide's task table changes its row for well-scoped coding, the Agent tool's per-spawn effort parameter changes, or a role is proposed for haiku (see routing-rubric.md)
  verifier:
    model: inherit
    effort: high
    basis_model: judgment
    reason_model: no upstream statement sets a verifier model; a verifier judges the other stages' work, so it is not one of the stages that can drop to a smaller model
    basis_effort: upstream
    pointer_effort: https://code.claude.com/docs/en/model-config#choose-an-effort-level
    claim_effort: the effort table's row for work where verification matters or edge cases are likely
    pointer_skill: /workflow-authoring (bundled first-party skill, agent() opts.model and opts.effort)
    pointer_spawn: https://code.claude.com/docs/en/sub-agents#choose-an-effort-level
    as_of: 2026-11-09
    recheck: model-config's effort table changes the row for verification-heavy work, an upstream page states a model for a verifying or judging agent, or the Agent tool's per-spawn effort parameter changes
  retrieval:
    model: sonnet
    effort: medium
    basis_model: judgment
    reason_model: the model guide's task table (https://claude.dev/blog/which-claude-model-should-you-build-with#pick-a-model-by-task) starts subagents that search files, read logs or summarize on Haiku or Sonnet; Haiku is excluded by owner rule (routing-rubric.md), so sonnet; the guide sits on a host the drift audit does not fetch, so it is recorded as context rather than an upstream pointer
    basis_effort: upstream
    pointer_effort: https://code.claude.com/docs/en/model-config#choose-an-effort-level
    claim_effort: the effort table's medium row names it the default on the Sonnet 5.5 model
    pointer_skill: /workflow-authoring (bundled first-party skill, agent() opts.model and opts.effort)
    pointer_spawn: https://code.claude.com/docs/en/sub-agents#choose-an-effort-level
    as_of: 2026-11-09
    recheck: the guide's task table changes its row for search, log and summary subagents, the workflows Cost section changes its smaller-model advice, a model-config change to the sonnet alias or its default effort, the Agent tool's per-spawn effort parameter changes, or a role is proposed for haiku (see routing-rubric.md)
