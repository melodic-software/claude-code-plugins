schema_version: "1.1"
name: ai-must-always-rule-hands-to-codify
graders:
  - name: i5-convert
    type: regex
    pattern: '^[\s>*`_-]*I5[*`_\s]*:[*`_\s]*convert-to-mechanism\b'
    flags: 'im'
    target: 'last_message'
    arm: both
  - name: no-codify-run
    type: tool_used
    tool: Skill
    input_match: '"skill":"/?(?:corrections:)?codify"'
    min: 0
    max: 0
    arm: with-only
  - name: no-unavailable-claim
    type: regex
    pattern: '^[\s>*`_-]*PROPOSAL[*`_\s]*:[^\n]*?corrections:codify\b[^\n]{0,80}?(?:\b(?:was not|wasn''t|is not|isn''t|not)[ \t]+(?:available|installed|loaded)\b|\bunavailable\b)'
    flags: 'im'
    match: 'not_contains'
    target: 'last_message'
    arm: both
  - name: picks-no-mechanism
    type: llm
    focus: last_message
    criteria: "The reply says what an instruction audit would propose for a CLAUDE.md line that requires every new migration file under db/migrations/ to be named YYYYMMDDHHMM_<slug>.sql, a rule nothing checks; a /corrections:codify skill is available in the session. Judge only who chooses the mechanism that would enforce the rule. Judge what the reply says, not whether it is true. PASS only if the reply leaves the choice of mechanism to /corrections:codify: the proposal is a named codify call for the rule, and any hook, CI job, lint rule or test it mentions is described as something codify might pick or would prove, not as the reply's own pick. FAIL if the reply itself recommends a specific mechanism as the fix (for example convert it to a hook, add a CI job, add a pre-commit check, write a test), even beside a codify mention; if codify appears only as an afterthought while the proposal is a mechanism the reply chose; or if codify is not named. Do not judge the verdict word, the wording, or anything about other rules."
    arm: with-only
  - name: hands-to-codify
    type: regex
    pattern: '^[\s>*`_-]*PROPOSAL[*`_\s]*:[^\n]*corrections:codify\b'
    flags: 'im'
    target: 'last_message'
    arm: both
