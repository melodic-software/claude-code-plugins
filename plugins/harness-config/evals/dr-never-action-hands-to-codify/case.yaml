schema_version: "1.1"
name: dr-never-action-hands-to-codify
graders:
  - name: section-hard-deny
    type: regex
    pattern: '^[\s>*`_-]*SECTION[*`_\s]*:[*`_\s]*hard_deny\b'
    flags: 'im'
    target: 'last_message'
    arm: both
  - name: no-codify-run
    type: tool_used
    tool: Skill
    input_match: '"skill":"/?(?:corrections:)?codify"'
    min: 0
    max: 0
    arm: with-only
  - name: no-unavailable-claim
    type: regex
    pattern: '^[\s>*`_-]*PROPOSAL[*`_\s]*:[^\n]*?corrections:codify\b[^\n]{0,80}?(?:\b(?:was not|wasn''t|is not|isn''t|not)[ \t]+(?:available|installed|loaded)\b|\bunavailable\b)'
    flags: 'im'
    match: 'not_contains'
    target: 'last_message'
    arm: both
  - name: picks-no-mechanism
    type: llm
    focus: last_message
    criteria: "The reply says what an auto-mode rule drafting skill tells a user who wants auto mode never to force-push to main, an action that cannot be undone; a /corrections:codify skill is available in the session. Judge only who chooses the harness-level mechanism beyond the classifier entry. Judge what the reply says, not whether it is true. PASS only if the reply leaves that choice to /corrections:codify: it names a codify call for the rule for the user to run, and any permissions.deny rule, PreToolUse hook, branch protection or other mechanism it mentions is described as something codify might pick or would prove, not as the reply's own pick. FAIL if the reply itself recommends a specific mechanism as the fix (for example 'put it in permissions.deny', 'prefer a PreToolUse hook', 'turn on branch protection'), even beside a codify mention; if codify appears only as an afterthought while the recommendation is a mechanism the reply chose; or if codify is not named. Do not judge the section named, the wording, or the classifier entry itself."
    arm: with-only
  - name: hands-to-codify
    type: regex
    pattern: '^[\s>*`_-]*PROPOSAL[*`_\s]*:[^\n]*corrections:codify\b'
    flags: 'im'
    target: 'last_message'
    arm: both
