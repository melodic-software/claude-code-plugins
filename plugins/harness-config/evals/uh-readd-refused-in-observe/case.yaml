schema_version: "1.1"
name: uh-readd-refused-in-observe
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'names-phase'
    type: 'regex'
    pattern: '\bobserve\b'
    target: 'last_message'
    flags: 'i'
  - name: 'names-row-count'
    type: 'regex'
    pattern: '\b(?:3|three)\b[\s\S]{0,40}?\b(?:rows?|entries|stumbles)\b|\b(?:rows?|entries|stumbles)\b[\s\S]{0,40}?\b(?:3|three)\b'
    target: 'last_message'
    flags: 'i'
  - name: 'no-restore'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'instruction-files\.sh(?:\\\")?\s+restore|\bgit\s+(?:restore|checkout)\b(?:\\"|[^"])*?(?:CLAUDE\.md|python-style\.md)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-manifest-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?manifest\.json"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-manifest-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?manifest\.json"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-instruction-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:(?:CLAUDE|AGENTS)\.md"|\.claude/(?:skills|rules|agents)/)'
    min: 0
    max: 0
    arm: 'both'
