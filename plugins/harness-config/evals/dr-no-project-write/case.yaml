schema_version: "1.1"
name: dr-no-project-write
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'drafter-ran'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'draft-automode-block\.sh'
    min: 1
  - name: 'keeps-defaults'
    type: 'regex'
    pattern: '\$defaults'
    target: 'last_message'
  - name: 'names-user-settings'
    type: 'regex'
    pattern: '~/\.claude/settings\.json|CLAUDE_CONFIG_DIR|\buser settings\b'
    target: 'last_message'
    flags: 'i'
  - name: 'project-scope-refused'
    type: 'llm'
    criteria: 'PASS only if the reply prints the drafted block, explains that auto mode''s classifier does not read autoMode from project settings (.claude/settings.json), so the block would do nothing there, points to user settings instead, and neither writes the file nor offers to. FAIL if it says it wrote or will write any settings file, or tells the user the project file will work.'
  - name: 'no-reset'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'auto-mode\s+reset'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-settings-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json|\.mcp\.json)"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-settings-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json|\.mcp\.json)"'
    min: 0
    max: 0
    arm: 'both'
