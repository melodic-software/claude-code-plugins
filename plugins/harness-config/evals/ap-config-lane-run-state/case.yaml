schema_version: "1.1"
name: ap-config-lane-run-state
context:
  scaffold_script: scaffold.sh
graders:
  - name: run-dir-derived
    type: tool_used
    tool: 'Bash'
    input_match: 'run-state\.sh.*?\bpaths\b.*?--plugin-data|run-state\.sh.*?--plugin-data.*?\bpaths\b'
    min: 1
  - name: lease-acquired
    type: tool_used
    tool: 'Bash'
    input_match: '\blease\s+acquire\b'
    min: 1
  - name: config-lane-dispatched
    type: tool_used
    tool: 'Skill'
    input_match: '"skill":"(?:harness-config:)?audit"'
    min: 1
  - name: guarded-append-used
    type: tool_used
    tool: 'Bash'
    input_match: '\bguarded-append\b'
    min: 1
  - name: opinion-line
    type: regex
    pattern: '--opinion'
    target: 'last_message'
  - name: no-target-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json|\.mcp\.json|CLAUDE\.md|SKILL\.md)"'
    min: 0
    max: 0
    arm: 'both'
