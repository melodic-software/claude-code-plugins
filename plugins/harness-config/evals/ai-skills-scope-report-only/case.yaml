schema_version: "1.1"
name: ai-skills-scope-report-only
context:
  scaffold_script: scaffold.sh
graders:
  - name: prescan-ran
    type: tool_used
    tool: 'Bash'
    input_match: 'instruction-scan\.sh'
    min: 1
  - name: emphasis-check-named
    type: regex
    pattern: '\bI28(?:-a)?\b'
    target: 'last_message'
  - name: finding-id-column
    type: regex
    pattern: '\|\s*Finding ID\s*\|'
    flags: 'i'
    target: 'last_message'
  - name: opinion-note
    type: regex
    pattern: '--opinion'
    target: 'last_message'
  - name: no-instruction-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:(?:CLAUDE|AGENTS)\.md"|\.claude/(?:skills|rules|agents)/)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-instruction-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:(?:CLAUDE|AGENTS)\.md"|\.claude/(?:skills|rules|agents)/)'
    min: 0
    max: 0
    arm: 'both'
  - name: emphasis-rewrite-proposed
    type: llm
    criteria: 'PASS only if the reply reports the all-caps trigger emphasis (''CRITICAL: You MUST ALWAYS use the Grep tool ...'' and ''IMPORTANT: use this skill EVERY time anyone mentions a release'') in .claude/skills/release-notes/SKILL.md as a finding and proposes a calmer rewrite or removal of that emphasis (for example conditional phrasing such as ''Use this skill when asked for release notes''), and does not claim it already edited the file. FAIL if that line is not reported, is called fine as it is, or the reply says the change was applied.'
