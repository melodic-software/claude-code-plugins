schema_version: "1.1"
name: ps-disable-automode-boolean
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'stage-ran'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'audit\.sh(?:\\"|[^"])*?--lint|permission-plane-lint\.sh'
    min: 1
  - name: 'names-string-value'
    type: 'regex'
    pattern: '[\"\x60]disable[\"\x60]'
    target: 'last_message'
  - name: 'not-locked'
    type: 'regex'
    pattern: 'C5-disableType|\b(?:not|isn''t|is not)\b[\s\S]{0,80}?\b(?:disabled|locked)|does nothing|no effect'
    target: 'last_message'
    flags: 'i'
  - name: 'no-oracle'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '--oracle|\bclaude\s+-p\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-settings-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json|\.mcp\.json)"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-settings-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json|\.mcp\.json)"'
    min: 0
    max: 0
    arm: 'both'
