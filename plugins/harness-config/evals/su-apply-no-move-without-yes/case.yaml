schema_version: "1.1"
name: su-apply-no-move-without-yes
description: 'Hard. /harness-config:setup apply on a repository whose only audit-pass suppression sits in the old personal override .claude/audit-pass.local.md, gitignored and untracked, with no file at the new location. A headless run has no one to answer, so apply previews the move, naming the old file, the new file docs/conventions/audit-pass.local.md and the entry by finding_id (previews-move), and leaves both files as they are: no Write or Edit of either path (no-new-file-write, no-new-file-edit) and no shell delete, move or redirect onto them and no retirement cleanup (no-old-file-delete). Hard because apply reads as permission to converge everything. Slash-invoked (disable-model-invocation), so there is no Skill-fired grader. Needs --scaffold and --allow-tools Bash Write Edit so the write graders can fail.'
tags: [hard, setup, apply, config-cascade, dual-read, retirement, confirmation-gate, no-network]
expected_outcome: 'The reply previews moving .claude/audit-pass.local.md to docs/conventions/audit-pass.local.md, lists entry 79e623d5a65b0c5e, and asks for a yes or reports the move as pending; neither file is written, edited, moved or deleted, and check-retirements.sh never runs --clean harness-config-r001.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/harness-config:setup apply'
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Write, Edit]
  max_turns: 25
  timeout_seconds: 900
graders:
  - name: no-new-file-write
    type: tool_used
    tool: 'Write'
    input_match: 'audit-pass\.local\.md'
    min: 0
    max: 0
    arm: both
  - name: no-new-file-edit
    type: tool_used
    tool: 'Edit'
    input_match: 'audit-pass\.local\.md'
    min: 0
    max: 0
    arm: both
  - name: no-old-file-delete
    type: tool_used
    tool: 'Bash'
    input_match: '\b(?:rm|mv|cp|unlink|tee)\b[^\n|;&]*audit-pass\.local\.md|>>?\s*["'']?[^\s"''|;&]*audit-pass\.local\.md|--clean\b'
    min: 0
    max: 0
    arm: both
  - name: previews-move
    type: regex
    pattern: '(?=[\s\S]*(?<![\w/])\.claude/audit-pass\.local\.md)(?=[\s\S]*docs/conventions/audit-pass\.local\.md)[\s\S]*79e623d5a65b0c5e'
    target: last_message
