schema_version: "1.1"
name: pp-missing-gate-hands-to-codify
graders:
  - name: p7-missing
    type: regex
    pattern: '^[\s>*`_-]*P7[*`_\s]*:[*`_\s]*MISSING\b'
    flags: 'im'
    target: 'last_message'
    arm: both
  - name: no-codify-run
    type: tool_used
    tool: Skill
    input_match: '"skill":"/?(?:corrections:)?codify"'
    min: 0
    max: 0
    arm: with-only
  - name: no-unavailable-claim
    type: regex
    pattern: 'corrections:codify\b[^\n]{0,80}?\b(?:was not|wasn''t|is not|isn''t|not)[ \t]+(?:available|installed|loaded)\b'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
    arm: both
  - name: picks-no-mechanism
    type: llm
    focus: last_message
    criteria: "The reply says what a prompting-posture audit would propose for a skill that deletes every folder under build/ and dist/ with rm -rf, with no confirmation step, no settings deny or ask rule, no hook and no script gate; a /corrections:codify skill is available in the session. Judge only who chooses the mechanism that would guard the deletion. Judge what the reply says, not whether it is true. PASS only if the reply leaves the choice of mechanism to /corrections:codify: the proposal is a named codify call for the rule, and any confirmation line, permissions deny or ask rule, hook or script gate it mentions is described as something codify might pick or would prove, not as the reply's own pick. FAIL if the reply itself proposes a specific mechanism as the fix (for example a diff adding a confirmation step, a permissions.deny or ask rule, a PreToolUse hook), even beside a codify mention; if codify appears only as an afterthought while the proposal is a mechanism the reply chose; or if codify is not named. Do not judge the verdict word, the wording, or other postures."
    arm: with-only
  - name: hands-to-codify
    type: regex
    pattern: '^[\s>*`_-]*PROPOSAL[*`_\s]*:[^\n]*corrections:codify\b'
    flags: 'im'
    target: 'last_message'
    arm: both
