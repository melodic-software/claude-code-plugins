schema_version: "1.1"
name: pg-fragile-grants-report
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'detector-ran'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'permission-rule-check\.sh'
    min: 1
  - name: 'names-python-wildcard'
    type: 'regex'
    pattern: 'python3 \*'
    target: 'last_message'
  - name: 'names-machine-path'
    type: 'regex'
    pattern: 'release\.sh[\s\S]{0,300}?(?:P2|machine|user ?name|home|portab)|(?:P2|machine|user ?name|home|portab)[\s\S]{0,300}?release\.sh'
    target: 'last_message'
    flags: 'i'
  - name: 'names-plugin-self-grant'
    type: 'regex'
    pattern: 'quay-tools/settings\.json'
    target: 'last_message'
  - name: 'no-settings-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json|\.mcp\.json)"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-grant-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json|\.mcp\.json)|SKILL\.md"'
    min: 0
    max: 0
    arm: 'both'
