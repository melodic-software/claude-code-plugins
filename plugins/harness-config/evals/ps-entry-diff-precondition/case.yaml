schema_version: "1.1"
name: ps-entry-diff-precondition
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'stage-ran'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'audit\.sh(?:\\"|[^"])*?--entry-diff|automode-entry-diff\.sh'
    min: 1
  - name: 'names-python-dropped'
    type: 'regex'
    pattern: 'python3 \*'
    target: 'last_message'
  - name: 'names-npx-dropped'
    type: 'regex'
    pattern: 'npx \*'
    target: 'last_message'
  - name: 'names-kept'
    type: 'regex'
    pattern: 'ruff check \.'
    target: 'last_message'
  - name: 'precondition-stated'
    type: 'llm'
    criteria: 'PASS only if the reply (1) says Bash(python3 *) and Bash(npx *) are set aside while a session is in auto mode and Bash(pytest) and Bash(ruff check .) carry over, (2) says the dropped rules come back when the session leaves auto mode and no settings file is changed, and (3) says this applies only to sessions that actually enter auto mode, naming at least one kind of session that does not. FAIL if any part is missing or if the reply says the rules are deleted from settings.'
  - name: 'no-oracle'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '--oracle|\bclaude\s+-p\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-settings-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json|\.mcp\.json)"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-settings-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json|\.mcp\.json)"'
    min: 0
    max: 0
    arm: 'both'
