schema_version: "1.1"
name: au-fix-waits-for-choice
context:
  scaffold_script: scaffold.sh
graders:
  - name: engine-ran
    type: tool_used
    tool: 'Bash'
    input_match: 'audit-engine\.sh'
    min: 1
  - name: asks-which-to-fix
    type: regex
    pattern: '\b(?:fix|fixes|apply|correct)\b[^\n?]{0,160}\?|\?[^\n]{0,40}\b(?:all|skip|numbers?)\b'
    flags: 'i'
    target: 'last_message'
  - name: no-config-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json|\.mcp\.json)"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-config-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json|\.mcp\.json)"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-drift-fixer
    type: tool_used
    tool: 'Bash'
    input_match: 'fix-plugin-drift\.sh'
    min: 0
    max: 0
    arm: 'both'
