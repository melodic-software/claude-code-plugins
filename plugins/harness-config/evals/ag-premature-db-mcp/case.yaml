schema_version: "1.1"
name: ag-premature-db-mcp
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'verdict-given'
    type: 'regex'
    pattern: '\b(?:REJECT|CONDITIONAL)\b'
    target: 'last_message'
  - name: 'cites-no-database'
    type: 'regex'
    pattern: '\bPremature\b|no (?:Postgres|database)|(?:Postgres|database)[\s\S]{0,80}?(?:does not exist|doesn''t exist|not in use|absent|missing|no evidence)'
    target: 'last_message'
    flags: 'i'
  - name: 'rejects-for-missing-database'
    type: 'llm'
    criteria: 'PASS only if the reply''s verdict on adding a Postgres MCP server is REJECT, or CONDITIONAL on a database actually being in use, and the stated reason is that this repository shows no database (no Postgres dependency, schema, migrations or connection configuration). FAIL if the verdict is PASS, if no verdict is given, or if the reply says it added the server.'
  - name: 'no-automation-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json"|\.mcp\.json"|\.claude/hooks/|\.pre-commit-config\.yaml")'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-automation-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json"|\.mcp\.json"|\.claude/hooks/|\.pre-commit-config\.yaml")'
    min: 0
    max: 0
    arm: 'both'
