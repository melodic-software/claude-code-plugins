schema_version: "1.1"
name: ps-deny-outranks-local-allow
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'stage-ran'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'audit-permission-state/scripts/(?:audit|permission-merge|permission-state)\.sh'
    min: 1
  - name: 'names-local-allow'
    type: 'regex'
    pattern: 'settings\.local\.json'
    target: 'last_message'
  - name: 'deny-wins'
    type: 'regex'
    pattern: '\binert\b|outranked|\bbeat(?:s|en)?\b|deny[\s\S]{0,200}?\b(?:wins|takes precedence|is evaluated first|blocks)\b'
    target: 'last_message'
    flags: 'i'
  - name: 'evaluation-order-explained'
    type: 'llm'
    criteria: 'PASS only if the reply says the allow for Bash(git push:*) in .claude/settings.local.json is not in effect because .claude/settings.json denies the same rule, and explains it by deny being evaluated before allow (from any scope), not by one settings file overriding the other. FAIL if it says the local allow is in effect, attributes the result to the local file being outranked by scope precedence, or says it edited a settings file.'
  - name: 'no-oracle'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '--oracle|\bclaude\s+-p\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-settings-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json|\.mcp\.json)"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-settings-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json|\.mcp\.json)"'
    min: 0
    max: 0
    arm: 'both'
