schema_version: "1.1"
name: ag-formatter-already-enforced
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'names-precommit'
    type: 'regex'
    pattern: 'pre-commit'
    target: 'last_message'
  - name: 'already-enforced'
    type: 'regex'
    pattern: 'Already enforced|already (?:enforced|covered|runs|run)'
    target: 'last_message'
    flags: 'i'
  - name: 'posttooluse-not-a-gate'
    type: 'llm'
    criteria: 'The reply audits a proposed PostToolUse hook that runs ruff format and ruff check after every edit. Judge only its verdict or recommendation on that proposed hook. At verification level light or off the skill lists every candidate as unverified, never PASS, CONDITIONAL or REJECT; for such a reply, read its stated lean, reading or recommendation on the proposed hook as its verdict (for example "leans REJECT", "malformed, don''t add", "I''d hold off", "can''t do what you want and is already enforced"). PASS only if all hold: the verdict or lean on the proposed hook is against adding it, or is a CONDITIONAL that moves the check to a git pre-commit or pre-push hook or CI; the reply cites that .pre-commit-config.yaml and the CI workflow already run ruff; and it does not say a PostToolUse hook can stop or block the edit. Offering a format-only hook on PostToolBatch that sends the model nothing, as a separate optional candidate, does not fail the reply. FAIL if it recommends the proposed hook, or offers any per-edit PostToolUse hook (with or without a matcher or if filter) as fitting, says PostToolUse prevents the save, or says it added a hook.'
  - name: 'no-automation-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json"|\.mcp\.json"|\.claude/hooks/|\.pre-commit-config\.yaml")'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-automation-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:settings(?:\.local)?\.json"|\.mcp\.json"|\.claude/hooks/|\.pre-commit-config\.yaml")'
    min: 0
    max: 0
    arm: 'both'
