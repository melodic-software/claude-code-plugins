schema_version: "1.1"
name: su-check-names-old-file
description: 'Bare /harness-config:setup runs the read-only check on a repository that has a retired .claude/audit-pass.local.md file, gitignored and untracked, with no docs/conventions/audit-pass.local.md. The check runs the retirement helper (runs-retirement-helper) and the reply names the retired file and its replacement docs/conventions/audit-pass.local.md (names-old-and-new) plus the report-only retirement record id (reports-record). It neither writes, edits nor deletes anything (no-write, no-edit, no-old-file-delete). Slash-invoked (disable-model-invocation), so there is no Skill-fired grader. Needs --scaffold and --allow-tools Bash Write Edit so the write graders can fail.'
tags: [setup, check, config-cascade, retirement, no-network]
expected_outcome: 'A PASS/FAIL/WARN/INFO report whose retired-conventions row reports harness-config-r001 as INFO, naming .claude/audit-pass.local.md as no longer read and pointing to docs/conventions/audit-pass.local.md. Nothing is written, edited or deleted.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/harness-config:setup'
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Write, Edit]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: both
  - name: no-old-file-delete
    type: tool_used
    tool: 'Bash'
    input_match: '\b(?:rm|mv|unlink)\b[^\n|;&]*audit-pass\.local\.md|--clean\b'
    min: 0
    max: 0
    arm: both
  - name: runs-retirement-helper
    type: tool_used
    tool: 'Bash'
    input_match: 'check-retirements\.sh'
    min: 1
  - name: names-old-and-new
    type: regex
    pattern: '(?=[\s\S]*(?<![\w/])\.claude/audit-pass\.local\.md)[\s\S]*(?:docs/conventions|<home>)/audit-pass\.local\.md'
    target: last_message
  - name: reports-record
    type: regex
    pattern: 'harness-config-r001'
    target: last_message
