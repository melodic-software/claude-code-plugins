schema_version: "1.1"
name: guidance-value-duplication
graders:
  - name: 'loads-guidance'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:engineering-concepts:)?design-guidance"'
    arm: 'with-only'
  - name: 'extract-now'
    type: 'regex'
    pattern: '(?:extract|move|pull)\w*[^.\n]{0,40}(?:now|today|this week|right away|immediately)|(?:don''t|do not) wait'
    flags: 'i'
    target: 'last_message'
