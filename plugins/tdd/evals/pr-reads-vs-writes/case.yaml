schema_version: "1.1"
name: pr-reads-vs-writes
graders:
  - name: 'routes-principles'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:tdd:)?principles"'
    arm: 'both'
  - name: 'writes-first'
    type: 'regex'
    pattern: '\b(?:writes?|write operations?|state[- ]changing(?: operations?)?|mutations?|mutating operations?|commands?)\b[^\n]{0,100}?\b(?:first|priority|priorities|prioriti[sz]\w*|always|higher|more important|most important|top|thoroughly)\b|\b(?:start with|begin with|cover first|first cover|prioriti[sz]e|priority 1|top priority)\b[^\n]{0,60}?\b(?:writes?|write operations?|state[- ]changing|mutations?|commands?|CreateAccount|ChangeEmail|CloseAccount)\b'
    flags: 'i'
    target: 'last_message'
  - name: 'reads-selective'
    type: 'regex'
    pattern: '\b(?:reads?|read operations?|queries|read[- ]only operations?)\b[^\n]{0,120}?\b(?:selectiv\w*|most complex|higher (?:bar|threshold)|lower priority|deprioriti\w*|skip\w*|only (?:the )?(?:most )?(?:complex|important|critical|tricky)|only (?:when|if))\b'
    flags: 'i'
    target: 'last_message'
