schema_version: "1.1"
name: pr-run-filter-control
graders:
  - name: 'no-principles'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:tdd:)?principles"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'gives-filter'
    type: 'regex'
    pattern: '--filter\b'
    target: 'last_message'
