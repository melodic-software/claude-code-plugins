schema_version: "1.1"
name: pr-precondition-significance
graders:
  - name: 'routes-principles'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:tdd:)?principles"'
    arm: 'both'
  - name: 'skips-technical'
    type: 'regex'
    pattern: '(?:\(b\)|^[\s>*_#|]*b[).:]|CsvRowParser|field[- ]count|Split\()(?:(?!\(a\)|^[\s>*_#|]*a[).:]|Account\.Withdraw|\byes\b)[\s\S]){0,160}?(?:(?:^|[\s:*|(—–-])no\b(?!\s+(?:harm|downside|reason|matter))|(?<!n[''’]t )(?<!not )\bskip\b|\bnot worth\b|\bunnecessary\b)'
    flags: 'im'
    target: 'last_message'
  - name: 'tests-domain'
    type: 'regex'
    pattern: '(?:\(a\)|^[\s>*_#|]*a[).:]|Withdraw|overdraft)(?:(?!\(b\)|^[\s>*_#|]*b[).:]|CsvRowParser|\bno\b)[\s\S]){0,160}?(?:^|[\s:*|(—–-])yes\b'
    flags: 'im'
    target: 'last_message'
