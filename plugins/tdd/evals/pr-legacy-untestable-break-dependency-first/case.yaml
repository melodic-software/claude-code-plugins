schema_version: "1.1"
name: pr-legacy-untestable-break-dependency-first
graders:
  - name: 'routes-principles'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:tdd:)?principles"'
    arm: 'with-only'
  - name: 'dependency-break-first-and-alone'
    type: 'regex'
    pattern: '\b(?:only|just|smallest|minimal|minimum|nothing (?:else|more)|no (?:other|cleanup|clean-up))\b[^\n]{0,160}\b(?:dependency[- ]breaking|break(?:s|ing)? (?:the |that |its |this )?dependenc(?:y|ies)|seam)\b|\b(?:dependency[- ]breaking|break(?:s|ing)? (?:the |that |its |this )?dependenc(?:y|ies))\b[^\n]{0,160}\b(?:only|alone|nothing else|by itself|and no(?:thing)? more|smallest|minimal|without tests)\b'
    flags: 'i'
    target: 'last_message'
  - name: 'characterize-before-refactor'
    type: 'regex'
    pattern: 'characteri[sz]\w*[\s\S]{0,600}?\b(?:then|before|after that|only then|next|3\.|third)\b[\s\S]{0,200}?\brefactor|\brefactor\w*[^\n]{0,120}\b(?:after|once|only after|only once)\b[^\n]{0,120}characteri[sz]'
    flags: 'i'
    target: 'last_message'
