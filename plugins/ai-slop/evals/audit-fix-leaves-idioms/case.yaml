schema_version: "1.1"
name: audit-fix-leaves-idioms
description: "The fix must make one real figure literal ('stale lockfiles murder the nightly build') and leave four lines alone whose only figurative words are an everyday relation verb or a field's own term (a setting that lives in a file, a queue that drains, a thread that starves, a warm cache); rewording any of them is an over-edit. Synthetic fixture. Written from MB:plugins/ai-slop/skills/audit/reference/catalog.md:1024-1054, MB:plugins/ai-slop/skills/audit/reference/rewrite-guide.md:181-195."
tags: [fix, rewrite-guide, figure-for-fact, over-edit]
runs: 3
expected_outcome: "After an explicit fix, docs/worker-notes.md no longer says 'murder', and the four lines about the retry limit, the upload queue, the export thread and the thumbnail cache are byte-for-byte unchanged. The fix reads reference/rewrite-guide.md first."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/ai-slop:audit fix docs/worker-notes.md"
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write, Agent]
  max_turns: 80
  timeout_seconds: 1500
