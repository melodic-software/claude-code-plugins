schema_version: "1.1"
name: audit-over-compression-boundary
description: "Audit reports clipped prose for people under rule-over-compression and leaves terse option and command tables alone. Written from MB:plugins/ai-slop/skills/audit/reference/catalog.md:1031-1056, MB:plugins/ai-slop/skills/audit/SKILL.md:296-297 (the base contract). Bash, Edit and Write are listed so the no-edit, no-write and fixture-unchanged graders can fail."
tags: [audit, rubric, over-compression]
runs: 3
expected_outcome: "The audit reports the 'When an export fails' paragraph of docs/exporter.md (line 19: the arrow, 'creds', 'w/', 'Retry = rerun job') under rule-over-compression. It reports no rule-over-compression finding for the Options table or the Commands table, and none for the full sentence about /var/log/exporter.log. No file is edited."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/ai-slop:audit docs/exporter.md"
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 40
  timeout_seconds: 900
