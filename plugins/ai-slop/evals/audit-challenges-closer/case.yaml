schema_version: "1.1"
name: audit-challenges-closer
description: "Audit reports the formulaic challenges closer as a detector finding and leaves a dated closing line alone. Written from MB:plugins/ai-slop/skills/audit/reference/catalog.md:267-272, MB:plugins/ai-slop/skills/audit/SKILL.md:116-118 and 296-297 (the base contract). Bash, Edit and Write are listed so the no-edit, no-write and fixture-unchanged graders can fail."
