schema_version: "1.1"
name: audit-curly-quotes-markdown
description: "Audit reports curly quotes and apostrophes in a markdown file as rule-curly-artifacts findings, read-only. Written from MB:plugins/ai-slop/skills/audit/reference/catalog.md:434-440, MB:plugins/ai-slop/skills/audit/SKILL.md:55-58 and 296-297 (the base contract). Bash, Edit and Write are listed so the no-edit, no-write and fixture-unchanged graders can fail."
tags: [audit, detector, typography]
runs: 3
expected_outcome: "The audit reports two rule-curly-artifacts findings in docs/upgrade.md: line 3 (the curly apostrophe in 'It’s') and line 5 (the curly double quotes around 'fast mode'). No file is edited."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/ai-slop:audit docs/upgrade.md"
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 40
  timeout_seconds: 900
