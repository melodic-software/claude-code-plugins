schema_version: "1.1"
name: su-apply-attended-drafts-record
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'drafts-both-commands'
    type: 'llm'
    criteria: 'The reply drafts a fix-cmd that formats with prettier and a lint-cmd that lints with remark (remark-cli or remark-lint), each holding the <files> placeholder.'
    focus: 'last_message'
  - name: 'routes-to-toolchain'
    type: 'llm'
    criteria: 'The reply says /toolchain:setup apply markdown writes the record, and hands it the drafted values, rather than writing the record itself.'
    focus: 'last_message'
  - name: 'hooks-never-run-it'
    type: 'llm'
    criteria: 'The reply says markdown-format''s hooks will not run prettier or remark: they run only the shipped markdownlint-cli2 adapter, and the drafted record runs only through /toolchain:lint and /toolchain:check, on request.'
    focus: 'last_message'
  - name: 'lint-report-only'
    type: 'llm'
    criteria: 'The drafted lint-cmd only reports: it carries no fix, write or output-to-file flag.'
    focus: 'last_message'
  - name: 'no-file-1'
    type: 'file_exists'
    path: '**/docs/conventions/ecosystems/markdown.yaml'
    exists: false
  - name: 'no-legacy-file'
    type: 'file_exists'
    path: '**/.claude/ecosystems/markdown.yaml'
    exists: false
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
