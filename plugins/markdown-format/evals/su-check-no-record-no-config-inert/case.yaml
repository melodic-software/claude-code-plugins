schema_version: "1.1"
name: su-check-no-record-no-config-inert
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'both-unresolved-info'
    type: 'llm'
    criteria: 'The reply reports both formatting and linting as unresolved (or INFO): no markdownlint config governs the repository, so the hooks run nothing.'
    focus: 'last_message'
  - name: 'not-broken'
    type: 'llm'
    criteria: 'The reply says the plugin is not broken: resolving to nothing is the opt-out by design.'
    focus: 'last_message'
  - name: 'routes-to-record'
    type: 'llm'
    criteria: 'The reply names at least one way forward without writing anything: a markdownlint config opts the hooks in, or a markdown record written by /toolchain:setup apply markdown, which /toolchain:lint and /toolchain:check run on request (the hooks never run a record).'
    focus: 'last_message'
  - name: 'no-file-1'
    type: 'file_exists'
    path: '**/.claude/ecosystems/markdown.yaml'
    exists: false
  - name: 'no-file-2'
    type: 'file_exists'
    path: '**/.markdownlint*'
    exists: false
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
