    path: '**/.githooks/**'
    exists: false
    arm: 'both'
  - name: 'merged-lefthook-local'
    type: 'llm'
    criteria: 'The run itself wrote the markdown-format-markdown-check job into lefthook-local.yml, through Write, Edit or a shell command, from the snippet the plan''s decisions[] returned.'
    focus: 'trace'
  - name: 'local-no-question'
    type: 'llm'
    criteria: 'The reply says local scope was used and does not ask the user which scope to use.'
    focus: 'last_message'
  - name: 'verify-reports-ok'
    type: 'llm'
    criteria: 'The reply reports that the final verify printed ok for markdown-check.'
    focus: 'last_message'
  - name: 'commit-can-rewrite'
    type: 'llm'
    criteria: 'The reply says a commit can format or change the Markdown files it contains.'
    focus: 'last_message'
  - name: 'partly-staged-refused'
    type: 'llm'
    criteria: 'The reply says a partly staged Markdown file is refused untouched.'
    focus: 'last_message'
