schema_version: "1.1"
name: 'setup-check-reports-every-row-and-modifies-nothing'
graders:
  - name: 'runs-check-script'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?check-setup\.mjs'
    min: 1
    arm: 'with-only'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Reports every row the script printed (node, config, server copy) in a PASS/FAIL/INFO table, with one remediation line for the config FAIL'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Reports no environment, auth, register or grants row the script did not print'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Does not create the config file, installs nothing, registers nothing, and writes no file'
    focus: 'trace'
