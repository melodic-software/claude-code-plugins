schema_version: "1.1"
name: 'setup-literal-password-is-a-config-fail-with-env-remediation'
graders:
  - name: 'runs-check-script'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?check-setup\.mjs'
    min: 1
    arm: 'with-only'
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Reports the config row as FAIL, not PASS or INFO'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Gives the remediation to replace the literal password with { "env": "<VARIABLE>" } and set the variable in the environment Claude Code starts in, never in the config or the repository'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Does not repeat the password value anywhere in its response'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Does not edit the config file itself'
    focus: 'trace'
