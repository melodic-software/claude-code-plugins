schema_version: "1.1"
name: 'reduce-full-pass-splits-lanes-and-ledgers'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'applies-contained-reduction'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"[^"]*/src/[^"]*"[\s\S]*archived'
    min: 1
    arm: 'with-only'
  - name: 'short-lived-branch'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '\bgit\b(?:[^"\\]|\\.)*\b(?:checkout\s+-[bB]|switch\s+-[cC]|worktree\s+add\b(?:[^"\\]|\\.)*\s-[bB])\s'
    min: 1
    arm: 'with-only'
