schema_version: "1.1"
name: 'reduce-dry-run-makes-no-changes'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'no-edit-branch-or-pr'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?![^"]*/\.work/)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-write-outside-ledger'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?![^"]*/\.work/)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-branch-or-push'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '\bgit\b[^"]*\b(?:checkout\s+-b|switch\s+-c|push)\b'
    min: 0
    max: 0
    arm: 'both'
