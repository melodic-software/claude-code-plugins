schema_version: "1.1"
name: 'reduce-collision-hotspots-ranked-beside-co-change'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Uses scripts/collision-hotspots.sh with a --prs value derived from the stated merge rate times a number of days, not an ad-hoc gh or git loop'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Ranks files from the script''s conflicts and pairs columns and verifies each before it reaches the ledger'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Reports changelogs, lockfiles and version manifests from the known bump hotspots line without ledgering them as coupling findings'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Carries the script''s gap: lines into the report and edits no repository file'
    focus: 'trace'
  - name: 'runs-collision-hotspots'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'collision-hotspots\.sh'
