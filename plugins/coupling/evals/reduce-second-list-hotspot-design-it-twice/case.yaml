schema_version: "1.1"
name: 'reduce-second-list-hotspot-design-it-twice'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Checks the ranked file with derivable-list.py or the same 80%-of-at-least-5-entries rule rather than by eye'
    focus: 'trace'
  - name: 'expectation-2'
    type: 'llm'
    criteria: 'Puts the second list in the route lane and does not edit, delete or regenerate config/services.json in this run'
    focus: 'trace'
  - name: 'expectation-3'
    type: 'llm'
    criteria: 'Compares all three designs: keep the list, discover at build time, generate with a drift check'
    focus: 'trace'
  - name: 'expectation-4'
    type: 'llm'
    criteria: 'Says build-time discovery needs a loader the stack does not have, and that the owner-team field must move into each service folder first'
    focus: 'trace'
  - name: 'expectation-5'
    type: 'llm'
    criteria: 'Ends with one recommendation and leaves the choice to the human'
    focus: 'trace'
