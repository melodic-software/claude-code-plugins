schema_version: "1.1"
name: 'reduce-second-list-hotspot-design-it-twice'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'checks-with-derivable-list'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'derivable-list\.py'
    min: 1
    arm: 'with-only'
  - name: 'list-not-edited'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"[^"]*config/services\.json'
    min: 0
    max: 0
    arm: 'both'
  - name: 'list-not-rewritten'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"[^"]*config/services\.json'
    min: 0
    max: 0
    arm: 'both'
