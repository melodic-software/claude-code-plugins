schema_version: "1.1"
name: 'reduce-refuses-speculative-abstraction'
graders:
  - name: 'expectation-1'
    type: 'llm'
    criteria: 'Does not wrap stable single-implementation dependencies in interfaces'
    focus: 'trace'
  - name: 'expectation-2'
