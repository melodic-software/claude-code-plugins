schema_version: "1.1"
name: 'reduce-refuses-speculative-abstraction'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'no-interface-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"(?:content|new_string)":"(?:[^"\\]|\\.)*(?:\binterface\s+I?[A-Z]\w*|\bEventBus\b|\bEventEmitter\b|\bMediator\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-interface-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"(?:content|new_string)":"(?:[^"\\]|\\.)*(?:\binterface\s+I?[A-Z]\w*|\bEventBus\b|\bEventEmitter\b|\bMediator\b)'
    min: 0
    max: 0
    arm: 'both'
