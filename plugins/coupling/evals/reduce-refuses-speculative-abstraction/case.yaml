schema_version: "1.1"
name: 'reduce-refuses-speculative-abstraction'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'no-interface-write'
    type: 'tool_used'
    tool: 'Write'
    input_match: '^(?=[\s\S]*"file_path":"(?![^"]*/\.work/))(?=[\s\S]*"(?:content|new_string)":"(?:[^"\\]|\\.)*?(?:\b|(?<=\\[nrt]))(?:interface\s+I?[A-Z]\w*|EventBus\b|EventEmitter\b|Mediator\b))'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-interface-edit'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '^(?=[\s\S]*"file_path":"(?![^"]*/\.work/))(?=[\s\S]*"(?:content|new_string)":"(?:[^"\\]|\\.)*?(?:\b|(?<=\\[nrt]))(?:interface\s+I?[A-Z]\w*|EventBus\b|EventEmitter\b|Mediator\b))'
    min: 0
    max: 0
    arm: 'both'
