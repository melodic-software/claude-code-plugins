schema_version: "1.1"
name: 'reduce-duplicate-writer-ledgered-and-handed-off'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'edits-no-writer'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"[^"]*/app/'
    min: 0
    max: 0
    arm: 'both'
  - name: 'findings-under-coupling'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"[^"]*/coupling/[^"/]+/[^"]+'
    min: 1
    arm: 'both'
  - name: 'findings-not-under-reviews'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"[^"]*/reviews/'
    min: 0
    max: 0
    arm: 'both'
