schema_version: "1.1"
name: 'reduce-duplicate-writer-ledgered-and-handed-off'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'duplicate-writers-in-route-lane'
    type: 'llm'
    criteria: 'Classifies each value with two writers as a duplicate writer and puts it in the route lane, never the apply batch'
    focus: 'trace'
  - name: 'no-writer-edits'
    type: 'llm'
    criteria: 'Edits no writer code, schema or file-writing script'
    focus: 'trace'
  - name: 'findings-file-under-coupling-slug'
    type: 'llm'
    criteria: 'Writes the findings file under the coupling/<branch-slug>/ memory directory, not under reviews/, and names it in the ledger and the report'
    focus: 'trace'
  - name: 'offers-codify-findings-unrun'
    type: 'llm'
    criteria: 'Offers /corrections:codify findings for the file when that skill is available and does not invoke it unasked'
    focus: 'trace'
