schema_version: "1.1"
name: 'reduce-collision-hotspots-fall-back-without-gh'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'mines-co-change'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '(?:\b|(?<=\\[nrt]))git\b(?:[^"\\]|\\.)*\b(?:log|diff-tree|show)\b(?:[^"\\]|\\.)*--(?:name-only|name-status|numstat|stat)\b'
    min: 1
    arm: 'with-only'
  - name: 'completes-dry-run-without-edits'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?![^"]*/\.work/)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'gap-line-names-missing-gh'
    type: 'llm'
    criteria: 'Pass if the reply or the ledger it writes records a gap, as a `gap:` line or an entry under a Gaps heading, saying collision hotspots were not measured and naming the missing gh as the reason. Fail if the run only mentions that gh is unavailable without saying the collision-hotspot measure was skipped.'
    focus: 'trace'
