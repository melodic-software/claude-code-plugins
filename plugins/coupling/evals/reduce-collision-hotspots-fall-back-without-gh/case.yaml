schema_version: "1.1"
name: 'reduce-collision-hotspots-fall-back-without-gh'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'falls-back-to-co-change'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '\bgit\b(?:[^"\\]|\\.)*\b(?:log|diff-tree|show)\b(?:[^"\\]|\\.)*--(?:name-only|name-status|numstat|stat)\b'
    min: 1
    arm: 'with-only'
  - name: 'completes-dry-run-without-edits'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?![^"]*/\.work/)'
    min: 0
    max: 0
    arm: 'both'
