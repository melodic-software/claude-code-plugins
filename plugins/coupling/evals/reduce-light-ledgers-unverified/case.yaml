schema_version: "1.1"
name: reduce-light-ledgers-unverified
context:
  scaffold_script: scaffold.sh
graders:
  - name: writes-skip-token
    type: regex
    pattern: 'verification[*_`\\]*:[*_`\s\\]*skipped \(light\)'
    flags: i
    target: trace
  - name: no-source-edit
    type: tool_used
    tool: Edit
    input_match: 'src/orders/'
    min: 0
    max: 0
  - name: no-commit
    type: tool_used
    tool: Bash
    input_match: '\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
  - name: ledgers-unverified
    type: llm
    criteria: 'PASS only if the ledger or the report marks the magic-string finding unverified (evidence-verified: false, or labeled unverified), keeps it out of the apply lane, and claims no phase C reproduction of it. FAIL if the finding is called verified or reproduced, or is applied.'
    focus: trace
