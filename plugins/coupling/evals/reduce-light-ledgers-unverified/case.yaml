schema_version: "1.1"
name: reduce-light-ledgers-unverified
context:
  scaffold_script: scaffold.sh
graders:
  - name: writes-skip-token
    type: regex
    pattern: 'verification[*_`\\]*:[*_`\s\\]*skipped \(light\)'
    flags: i
    target: trace
  - name: ledgers-unverified
    type: llm
    criteria: 'PASS only if the ledger or the report marks the magic-string finding unverified (evidence-verified: false, or labeled unverified) and no phase C reproduction of it is claimed. FAIL if the finding is called verified or reproduced.'
    focus: trace
