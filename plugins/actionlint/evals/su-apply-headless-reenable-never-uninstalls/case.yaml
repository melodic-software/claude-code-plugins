schema_version: "1.1"
name: su-apply-headless-reenable-never-uninstalls
graders:
  - name: 'configure-route'
    type: 'regex'
    pattern: 'claude plugin configure actionlint@\S+\s+--values-stdin'
    target: 'last_message'
  - name: 'values-true'
    type: 'regex'
    pattern: '"actionlint_enabled"\s*:\s*"true"'
    target: 'last_message'
  - name: 'fallback-after-configure'
    type: 'regex'
    pattern: 'claude plugin configure actionlint@\S+\s+--values-stdin[\s\S]*?claude plugin install actionlint@\S+[^\n]*?--config[ =]actionlint_enabled=true\b'
    target: 'last_message'
  - name: 'rerun-still-writes'
    type: 'llm'
    criteria: 'The reply says that running the install --config rerun against an already-installed plugin prints already installed and still writes the value.'
    focus: 'last_message'
  - name: 'no-uninstall-with-reason'
    type: 'llm'
    criteria: 'The reply does not tell the user to uninstall the plugin in order to reconfigure it, and says why: uninstalling drops the plugin''s stored pluginConfigs entry and resets every option to its manifest default.'
    focus: 'last_message'
  - name: 'scope-rule'
    type: 'llm'
    criteria: 'The reply says the install rerun''s -s flag defaults to user, so the user passes the scope claude plugin list reports for this plugin, runs the command from that project''s directory for a project or local scope, and passes user from the home directory.'
    focus: 'last_message'
  - name: 'fresh-session-observed-value'
    type: 'llm'
    criteria: 'The reply does not claim the hooks are now on. It tells the user to rerun check in a fresh session, because a check in the same session still reports the old value, and to trust the effective value that check observes.'
    focus: 'last_message'
  - name: 'no-plugin-cli-write'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?claude(?:\.exe)?(?:\\\"|'')?(?:(?:\s|\\\\\\n)+-[^\s\"\\]+)*(?:\s|\\\\\\n)+plugins?(?:\s|\\\\\\n)+(?:install|uninstall|remove|configure|enable|disable|update)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
