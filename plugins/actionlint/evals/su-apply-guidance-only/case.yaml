schema_version: "1.1"
name: su-apply-guidance-only
graders:
  - name: 'no-install'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\b(?:brew|port|apt(?:-get)?|dnf|yum|zypper|apk|snap|winget|scoop|choco|pipx?|pip3|npm|pnpm|yarn|cargo)(?:\.exe)?\s+(?:-{1,2}[\w-]+(?:[= ][^\s-]\S*)?\s+)*(?:install|reinstall|add|upgrade|i)\b|\bpacman\s+-S|\bgo\s+install\b|\b(?:mise|asdf|rtx|aqua)\s+(?:install|use|plugin\s+add)\b|\bnix(?:-env)?\s+(?:-i\b|profile\s+install|shell|run)|\bdocker\s+(?:pull|run)\b|\b(?:curl|wget)\b(?:[^"\\]|\\.)*?\|\s*(?:sudo\s+)?(?:bash|dash|zsh|sh)\b|\b(?:bash|zsh|sh)\s+<\(\s*(?:curl|wget)\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-apply-step'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?\bnode(?:\.exe)?\s+(?:\\"|'')?[^\s"\\'']*install\.mjs(?:\\"|'')?\s+(?:plan|copy|decline|config-hook)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-linter-run'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|(`]|\$\(|\\n))?\s*(?:(?:\w+=\S*|sudo|command|exec|env|time|nice|timeout(?:\s+-\S+)*\s+\S+)\s+)*(?:(?:[^\s"\\;&|=]*/)?actionlint(?:\.exe)?(?![\w.\-/])(?!\s+-{1,2}version\b)|(?:(?:bash|dash|zsh|sh)\s+(?:-\w+\s+)*)?(?:\\"|'')?[^\s"\\;&|='']*(?:git-)?hooks/actionlint-check\.sh)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-plugin-cli-write'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?\bclaude\s+plugins?\s+(?:install|uninstall|remove|configure|enable|disable|update)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'apply-outcome'
    type: 'regex'
    pattern: 'already (?:configured|set up|in place)|github\.com/rhysd/actionlint|rhysd/actionlint/blob/main/docs/install\.md'
    flags: 'i'
    target: 'last_message'
