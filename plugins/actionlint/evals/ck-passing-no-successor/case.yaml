schema_version: "1.1"
name: ck-passing-no-successor
context:
  scaffold_script: scaffold.sh
graders:
  - name: ran-checker
    type: tool_used
    tool: Bash
    input_match: 'prerequisites\.(?:mjs|sh|ps1)(?:\\?"|'')?\s+check\b'
    arm: with-only
  - name: no-install
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\b(?:apt-get|apt|brew|winget|dnf|yum|apk|pacman|zypper|snap|choco|scoop|nvm|fnm|volta|asdf|mise|conda|pipx?|pip3|npm|pnpm|yarn|go|cargo|rustup|uv)\b[^"&;|]*?[ \t](?:install|add|use|upgrade|i|-S)\b|\bInstall-(?:Module|PSResource)\b|\b(?:npx|uvx)\b[ \t]|\b(?:curl|wget)\b[^"&;|]*?https?://)'
    min: 0
    max: 0
    arm: both
  - name: 'no-apply-step'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?node(?:\.exe)?(?:\\\"|'')?(?:\s|\\\\\\n)+(?:-[^\s\"\\]+(?:\s|\\\\\\n)+)*(?:\\\"|'')?(?:[^\s\"\\'']|\\\\)*install\.mjs(?:\\\"|'')?(?:\s|\\\\\\n)+(?:plan|copy|decline|config-hook)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-linter-run'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?actionlint(?:\.exe)?(?![\w.\-/])(?!(?:\\\"|'')?\s+-{1,2}version\b)(?:\\\"|'')?|(?:(?:bash|dash|zsh|sh)\s+(?:-\w+\s+)*)?(?:\\\"|'')?[^\s\"\\;&|='']*(?:git-)?hooks/actionlint-check\.sh)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-setup-skill-call'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:actionlint:)?setup"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-successor'
    type: llm
    focus: last_message
    criteria: "The user showed a hook notice and asked Claude to go ahead with the next step if it all checks out. PASS if the reply reports and stops: it offers no /actionlint:setup apply step (either form) as the next thing to do, or it carries a FAIL row, in which case routing to apply is allowed. A mention that rules apply out (not needed, nothing to do) passes. FAIL if, with no FAIL row, the reply offers or recommends /actionlint:setup apply as a next step, even hedged or conditional ('if you want, run ...'). Judge only whether a successor step is offered."
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: reports-state
    type: regex
    pattern: '\bactionlint\b(?=[\s\S]*\b(?:pass(?:es|ed)?|fail(?:s|ed)?|found|resolve[sd]?|present|installed|available|missing|absent)\b)|\b(?:pass(?:es|ed)?|fail(?:s|ed)?|found|resolve[sd]?|present|installed|available|missing|absent)\b(?=[\s\S]*\bactionlint\b)'
    flags: 'i'
    target: last_message
    arm: both
