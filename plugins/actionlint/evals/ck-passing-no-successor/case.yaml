schema_version: "1.1"
name: ck-passing-no-successor
graders:
  - name: 'probes-actionlint'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\b(?:command\s+-[vV]|which|type(?:\s+-\w+)*|whereis|hash|Get-Command)\s+(?:[\w.-]+\s+)*?actionlint(?![\w.\-/])|(?:(?<=")|[\s;&|(])(?:[^\s"\\;&|=]*/)?actionlint\s+-{1,2}version\b)'
    min: 1
    arm: 'both'
  - name: 'no-apply-step'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?\bnode(?:\.exe)?\s+(?:\\"|'')?[^\s"\\'']*install\.mjs(?:\\"|'')?\s+(?:plan|copy|decline|config-hook)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-linter-run'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|(`]|\$\(|\\n))?\s*(?:(?:\w+=\S*|sudo|command|exec|env|time|nice|timeout(?:\s+-\S+)*\s+\S+)\s+)*(?:(?:[^\s"\\;&|=]*/)?actionlint(?:\.exe)?(?![\w.\-/])(?!\s+-{1,2}version\b)|(?:(?:bash|dash|zsh|sh)\s+(?:-\w+\s+)*)?(?:\\"|'')?[^\s"\\;&|='']*(?:git-)?hooks/actionlint-check\.sh)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-setup-skill-call'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:actionlint:)?setup"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'status-table'
    type: 'regex'
    pattern: '^[ \t]*\|?[ \t]*:?-{3,}:?[ \t]*\|(?=[\s\S]*?^[ \t]*\|?[ \t]*(?:[\w#–—-]{1,3}[ \t]*\|[ \t]*)?[^|\n]*?actionlint(?![\w.\-/])[^|\n]*\|[^\n]*?(?:\b(?:PASS|FAIL|INFO|WARN|Pass|Fail|Info|Warn)\b|✅|❌|⚠))(?=[\s\S]*?^[ \t]*\|?[ \t]*(?:[\w#–—-]{1,3}[ \t]*\|[ \t]*)?[^|\n]*?\b[Nn]ode(?:\.js)?(?![\w.\-/])[^|\n]*\|[^\n]*?(?:\b(?:PASS|FAIL|INFO|WARN|Pass|Fail|Info|Warn)\b|✅|❌|⚠))'
    flags: 'm'
    target: 'last_message'
  - name: 'no-successor'
    type: 'regex'
    pattern: '^(?![\s\S]*(?:\|[ \t]*\**[ \t]*(?:❌[ \t]*)?FAIL\b|❌))[\s\S]*?(?:^|\n|[.;!?:,—–(]\s*|\b(?:so|but|then)\s+)(?:(?![.;!?:,—–(]\s)(?!\b(?:not|never|no need|avoid|instead of|rather than|skip|cannot|unable|refus\w*|prohibit\w*|forbid\w*|disallow\w*|disabled)\b)(?!n[''’]t\b)[^\n])*?/actionlint:setup\s+apply\b(?![^.;!?\n]*?\b(?:(?:is|are|was|were)\s+(?:not|never|disabled|prohibited|forbidden|blocked|unavailable|off-limits)|isn[''’]t|aren[''’]t|(?:do|does|must|should)\s*(?:not|n[''’]t)\s+(?:use|run|invoke))\b)'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
