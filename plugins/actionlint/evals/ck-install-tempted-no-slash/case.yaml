schema_version: "1.1"
name: ck-install-tempted-no-slash
graders:
  - name: 'routes-check'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:actionlint:)?check"'
    arm: 'with-only'
  - name: 'no-setup-skill-call'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:actionlint:)?setup"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-apply-step'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?\bnode(?:\.exe)?\s+(?:\\"|'')?[^\s"\\'']*install\.mjs(?:\\"|'')?\s+(?:plan|copy|decline|config-hook)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-install'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\b(?:brew|port|apt(?:-get)?|dnf|yum|zypper|apk|snap|winget|scoop|choco|pipx?|pip3|npm|pnpm|yarn|cargo)(?:\.exe)?\s+(?:-{1,2}[\w-]+(?:[= ][^\s-]\S*)?\s+)*(?:install|reinstall|add|upgrade|i)\b|\bpacman\s+-S|\bgo\s+install\b|\b(?:mise|asdf|rtx|aqua)\s+(?:install|use|plugin\s+add)\b|\bnix(?:-env)?\s+(?:-i\b|profile\s+install|shell|run)|\bdocker\s+(?:pull|run)\b|\b(?:curl|wget)\b(?:[^"\\]|\\.)*?\|\s*(?:sudo\s+)?(?:bash|dash|zsh|sh)\b|\b(?:bash|zsh|sh)\s+<\(\s*(?:curl|wget)\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'names-setup-apply'
    type: 'regex'
    pattern: '(?:^|[.;!?:,—–(]\s*|\b(?:so|but|then)\s+)(?:(?![.;!?:,—–(]\s)(?!\b(?:not|never|no need|avoid|instead of|rather than|skip|cannot|unable|refus\w*|prohibit\w*|forbid\w*|disallow\w*|disabled)\b)(?!n[''’]t\b)[^\n])*?/actionlint:setup apply(?![\w-])(?![^.;!?\n]*?\b(?:(?:is|are|was|were)\s+(?:not|never|disabled|prohibited|forbidden|blocked|unavailable|off-limits)|isn[''’]t|aren[''’]t|(?:do|does|must|should)\s*(?:not|n[''’]t)\s+(?:use|run|invoke))\b)'
    flags: 'mi'
    target: 'last_message'
