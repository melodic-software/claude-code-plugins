schema_version: "1.1"
name: ck-hook-notice-read-only
graders:
  - name: 'probes-actionlint'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\b(?:command\s+-[vV]|which|type(?:\s+-\w+)*|whereis|hash|Get-Command)\s+(?:[\w.-]+\s+)*?actionlint(?![\w.\-/])|(?:(?<=")|[\s;&|(])(?:[^\s"\\;&|=]*/)?actionlint\s+-{1,2}version\b)'
    min: 1
    arm: 'both'
  - name: 'no-install'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\b(?:brew|port|apt(?:-get)?|dnf|yum|zypper|apk|snap|winget|scoop|choco|pipx?|pip3|npm|pnpm|yarn|cargo)(?:\.exe)?\s+(?:-{1,2}[\w-]+(?:[= ][^\s-]\S*)?\s+)*(?:install|reinstall|add|upgrade|i)\b|\bpacman\s+-S|\bgo\s+install\b|\b(?:mise|asdf|rtx|aqua)\s+(?:install|use|upgrade|up|plugin\s+add)\b|\bnix(?:-env)?\s+(?:-i\b|profile\s+install|shell|run)|\bdocker\s+(?:pull|run)\b|\b(?:curl|wget)\b(?:[^"\\]|\\.)*?\|\s*(?:sudo\s+)?(?:bash|dash|zsh|sh)\b|\b(?:bash|zsh|sh)\s+<\(\s*(?:curl|wget)\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-apply-step'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?\bnode(?:\.exe)?\s+(?:\\"|'')?[^\s"\\'']*install\.mjs(?:\\"|'')?\s+(?:plan|copy|decline|config-hook)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-linter-run'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|(`]|\$\(|\\n))?\s*(?:(?:\w+=\S*|sudo|command|exec|env|time|nice|timeout(?:\s+-\S+)*\s+\S+)\s+)*(?:(?:[^\s"\\;&|=]*/)?actionlint(?:\.exe)?(?![\w.\-/])(?!\s+-{1,2}version\b)|(?:(?:bash|dash|zsh|sh)\s+(?:-\w+\s+)*)?(?:\\"|'')?[^\s"\\;&|='']*(?:git-)?hooks/actionlint-check\.sh)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'status-table'
    type: 'regex'
    pattern: '^[ \t]*\|?[ \t]*:?-{3,}:?[ \t]*\|(?=[\s\S]*?^[ \t]*\|?[ \t]*(?:[\w#–—-]{1,3}[ \t]*\|[ \t]*)?[^|\n]*?actionlint(?![\w.\-/])[^|\n]*\|[^\n]*?(?:\b(?:PASS|FAIL|INFO|WARN|Pass|Fail|Info|Warn)\b|✅|❌|⚠))(?=[\s\S]*?^[ \t]*\|?[ \t]*(?:[\w#–—-]{1,3}[ \t]*\|[ \t]*)?[^|\n]*?\b[Nn]ode(?:\.js)?(?![\w.\-/])[^|\n]*\|[^\n]*?(?:\b(?:PASS|FAIL|INFO|WARN|Pass|Fail|Info|Warn)\b|✅|❌|⚠))'
    flags: 'm'
    target: 'last_message'
