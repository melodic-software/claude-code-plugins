schema_version: "1.1"
name: pr-recorded-narration-cues-every-beat
context:
  scaffold_script: scaffold.sh
graders:
  - name: scene-imports-beat
    type: regex
    pattern: '^[ \t]*from narration import (?:[\w, ]*\b)?beat\b'
    flags: 'm'
    target: { source: file, path: video/scene.py }
    arm: both
  - name: scene-cues-beats-in-order
    type: regex
    pattern: '\bbeat\(\s*self\s*,\s*0\b[\s\S]*\bbeat\(\s*self\s*,\s*1\b[\s\S]*\bbeat\(\s*self\s*,\s*2\b[\s\S]*\bbeat\(\s*self\s*,\s*3\b'
    target: { source: file, path: video/scene.py }
    arm: both
  - name: no-add-sound
    type: regex
    pattern: '\badd_sound\('
    match: not_contains
    target: { source: file, path: video/scene.py }
    arm: both
  - name: render-passes-narration
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:python[\d.]*(?:\.exe)?(?:\s+-\w+)*(?:\s|\\\\\\n)+)?(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?pydeps\.py(?:\\\"|'')?(?![\w.-])(?:\\\\(?:\\r)?\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?--narration(?:\s|=|\\\\\\n)+(?:\\\"|'')?[^\s\"\\;&|='']*narration\b'
    arm: with-only
