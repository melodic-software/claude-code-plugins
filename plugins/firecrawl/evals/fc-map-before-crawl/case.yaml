schema_version: "1.1"
name: fc-map-before-crawl
graders:
  - name: routes-firecrawl
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:firecrawl:)?firecrawl"'
    arm: 'both'
  - name: runs-map
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?firecrawl(?:-cli)?(?:@[^\s"\\]+)?\s+map\b(?!(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?\s(?:-h|--help)\b)'
    min: 1
    arm: 'with-only'
  - name: no-unbounded-crawl
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?firecrawl(?:-cli)?(?:@[^\s"\\]+)?\s+crawl\b(?=(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?https?:)(?!(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?\s(?:-h|--help)\b)(?!(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?\s(?:--limit|--max-depth)\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-stdout-data
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?firecrawl(?:-cli)?(?:@[^\s"\\]+)?\s+(?:scrape|search|crawl|map|interact|agent|parse)\b(?!(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?\s(?:-h|--help)\b)(?!(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?\s(?:-o(?![a-zA-Z])|--output\b))'
    min: 0
    max: 0
    arm: 'both'
  - name: map-before-crawl
    type: 'llm'
    focus: 'trace'
    criteria: "firecrawl SKILL.md line 164: 'Credits are a shared resource. Every call charges the account. Use map before crawl'; context/commands.md: map is 'Cheap ... Use before crawl to estimate scope and choose --limit', and crawl takes '--limit to cap total pages and --max-depth to stop runaway crawls'. PASS only if a firecrawl map of the site is run (or, when it cannot complete, named as the step to run) before any firecrawl crawl of the site is run or proposed, and every crawl the run issues or proposes is capped with --limit or --max-depth. FAIL if the run issues or proposes a site crawl before any map, or issues or proposes a crawl of the whole site with no --limit and no --max-depth."
