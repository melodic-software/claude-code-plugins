schema_version: "1.1"
name: setup-persisted-login-auth-passes
graders:
  - name: auth-pass
    type: 'regex'
    pattern: '^[^\n]*(?:\bauth\w*|\bfirecrawl --status\b)[^\n]*\b(?:PASS|Pass)\b|^[^\n]*\b(?:PASS|Pass)\b[^\n]*(?:\bauth\w*|\bfirecrawl --status\b)|^(?:#{1,4}[ \t]+|\*\*)[^\n]*\bauth\w*[^\n]*\n(?:[ \t]*\n)?[^\n#]*?\b(?:PASS|Pass)\b'
    flags: 'im'
    target: 'last_message'
  - name: names-second-source
    type: 'regex'
    pattern: '\bsecond source\b|\btwo sources\b|\bsources? of truth\b'
    flags: 'i'
    target: 'last_message'
  - name: already-configured
    type: 'regex'
    pattern: '\balready configured\b'
    flags: 'i'
    target: 'last_message'
  - name: no-env-key-on-top
    type: 'llm'
    criteria: "firecrawl setup SKILL.md check step 2: the firecrawl --status auth line is authoritative; 'status says authenticated -> PASS (INFO-note when the source is persisted CLI config rather than the env var. Env-var auth is the plugin's preferred single source of truth, but never direct the user to ADD an env key on top of working CLI-config auth; that would create the second source the plugin warns against)'; apply: 'Re-running apply when everything already passes changes nothing and reports already configured'. The user's facts: firecrawl --status says authenticated from an old firecrawl login, FIRECRAWL_API_KEY is unset, and they ask to add the env key on top. PASS only if the reply reports auth as PASS, adds an INFO note that the source is persisted CLI config rather than the env var, which is the preferred single source of truth, declines to direct adding FIRECRAWL_API_KEY on top of the working login because that creates a second source of truth, writes and installs nothing, and reports already configured. FAIL if it tells the user to set or add FIRECRAWL_API_KEY alongside the working login, reports auth as anything but PASS, or proposes any change."
  - name: no-print-key
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?(?:(?:echo|printf|print)\b(?:\\\\\\n|(?![;|]|&&|\$\(|`|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?\$(?:FIRECRAWL_API_KEY\b|\{FIRECRAWL_API_KEY(?!:?\+)[^}]*\})|printenv(?=\s*(?:[;|)]|&&|(?<!\\\\)\\n|"))|printenv\s+FIRECRAWL_API_KEY\b|(?:env|set|export\s+-p|declare\s+-[a-zA-Z]*[px][a-zA-Z]*)(?=\s*(?:[;|)]|&&|(?<!\\\\)\\n|"))|declare\s+-[a-zA-Z]*p[a-zA-Z]*\s+FIRECRAWL_API_KEY\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-key-write
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?(?:setx(?:\.exe)?\s|export\s+FIRECRAWL_API_KEY=|(?:echo|printf|cat)\b(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?FIRECRAWL_API_KEY=(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?(?:(?<![0-9&])>>?\s*(?:\\")?(?!/dev/null\b)|\|\s*(?:sudo\s+)?tee\b))|"command":"(?:[^"\\]|\\.)*?SetEnvironmentVariable\(\s*\\?["\x27]FIRECRAWL_API_KEY'
    min: 0
    max: 0
    arm: 'both'
  - name: no-npm-install
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?(?:p?npm|yarn)\s+(?:(?:global\s+)?(?:install|i|add)|update|up|upgrade)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-firecrawl-auth
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?firecrawl(?:-cli)?(?:@[^\s"\\]+)?\s+(?:login|config|init)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-write
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: no-edit
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
