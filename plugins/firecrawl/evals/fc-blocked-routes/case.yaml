schema_version: "1.1"
name: fc-blocked-routes
graders:
  - name: routes-firecrawl
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:firecrawl:)?firecrawl"'
    arm: 'both'
  - name: no-stdout-data
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?firecrawl(?:-cli)?(?:@[^\s"\\]+)?\s+(?:scrape|search|crawl|map|interact|agent|parse)\b(?!(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?\s(?:-h|--help)\b)(?!(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?\s(?:-o(?![a-zA-Z])|--output\b))'
    min: 0
    max: 0
    arm: 'both'
