schema_version: "1.1"
name: setup-bare-defaults-to-check
graders:
  - name: reads-main-skill
    type: 'tool_used'
    tool: 'Read'
    input_match: '"file_path"\s*:\s*"(?:[^"\\]|\\.)*?skills[\\/]+firecrawl[\\/]+SKILL\.md"'
    min: 1
    arm: 'with-only'
  - name: reads-configuration
    type: 'tool_used'
    tool: 'Read'
    input_match: '"file_path"\s*:\s*"(?:[^"\\]|\\.)*?skills[\\/]+firecrawl[\\/]+context[\\/]+configuration\.md"'
    min: 1
    arm: 'with-only'
  - name: reads-before-probing
    type: 'tool_order'
    before:
      tool: 'Read'
      input_match: '"file_path"\s*:\s*"(?:[^"\\]|\\.)*?skills[\\/]+firecrawl[\\/]+SKILL\.md"'
    after:
      tool: 'Bash'
      input_match: '"command":"(?:[^"\\]|\\.)*?(?:FIRECRAWL_API_KEY|firecrawl(?:-cli)?\s+--(?:status|version)\b)'
    arm: 'with-only'
  - name: no-action-question
    type: 'regex'
    pattern: '\b(?:which|what)\s+action\b[^\n?]*\?|\bcheck\s+or\s+apply\b[^\n?]*\?|\bshould I (?:run )?(?:check|apply)\b[^\n?]*\?'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: no-ask-user
    type: 'tool_used'
    tool: 'AskUserQuestion'
    min: 0
    max: 0
    arm: 'both'
  - name: gives-verdict
    type: 'regex'
    pattern: '\b(?:PASS|FAIL|INFO|INDETERMINATE|Pass|Fail|Info|Indeterminate)\b'
    target: 'last_message'
  - name: reports-key-state
    type: 'regex'
    pattern: 'FIRECRAWL_API_KEY\b[^\n]{0,40}?\b(?:un|not[ -])?set\b|^(?:#{1,4}[ \t]+|\*\*)[^\n]*FIRECRAWL_API_KEY[^\n]*\n(?:[ \t]*\n)?[^\n#]*?\b(?:un|not[ -])?set\b'
    flags: 'im'
    target: 'last_message'
  - name: names-cli-binary
    type: 'regex'
    pattern: '\bfirecrawl-cli\b|\bfirecrawl\b[^\n]{0,20}?\b(?:binary|CLI)\b|\bCLI binary\b'
    flags: 'i'
    target: 'last_message'
  - name: names-api-url
    type: 'regex'
    pattern: '\bFIRECRAWL_API_URL\b'
    target: 'last_message'
  - name: names-no-telemetry
    type: 'regex'
    pattern: '\bFIRECRAWL_NO_TELEMETRY\b'
    target: 'last_message'
  - name: names-install-flow
    type: 'regex'
    pattern: 'skills[\\/]+firecrawl[\\/]+SKILL\.md|/firecrawl:firecrawl\b|\bmain (?:firecrawl )?skill\b'
    flags: 'i'
    target: 'last_message'
  - name: no-firecrawl-api-call
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?firecrawl(?:-cli)?(?:@[^\s"\\]+)?\s+(?:scrape|batch-scrape|search|crawl|map|parse|interact|agent|monitor|developer|research|search-feedback|credit-usage)\b(?!(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?\s(?:-h|--help)\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-print-key
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?(?:(?:echo|printf|print)\b(?:\\\\\\n|(?![;|]|&&|\$\(|`|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?\$(?:FIRECRAWL_API_KEY\b|\{FIRECRAWL_API_KEY(?!:?\+)[^}]*\})|printenv(?=\s*(?:[;|)]|&&|(?<!\\\\)\\n|"))|printenv\s+FIRECRAWL_API_KEY\b|(?:env|set|export\s+-p|declare\s+-[a-zA-Z]*[px][a-zA-Z]*)(?=\s*(?:[;|)]|&&|(?<!\\\\)\\n|"))|declare\s+-[a-zA-Z]*p[a-zA-Z]*\s+FIRECRAWL_API_KEY\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-key-write
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?(?:setx(?:\.exe)?\s|export\s+FIRECRAWL_API_KEY=|(?:echo|printf|cat)\b(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?FIRECRAWL_API_KEY=(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?(?:(?<![0-9&])>>?\s*(?:\\")?(?!/dev/null\b)|\|\s*(?:sudo\s+)?tee\b))|"command":"(?:[^"\\]|\\.)*?SetEnvironmentVariable\(\s*\\?["\x27]FIRECRAWL_API_KEY'
    min: 0
    max: 0
    arm: 'both'
  - name: no-npm-install
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?(?:p?npm|yarn)\s+(?:(?:global\s+)?(?:install|i|add)|update|up|upgrade)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-firecrawl-auth
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?firecrawl(?:-cli)?(?:@[^\s"\\]+)?\s+(?:login|config|init)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-write
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: no-edit
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
