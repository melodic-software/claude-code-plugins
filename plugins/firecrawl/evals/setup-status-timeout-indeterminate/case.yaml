schema_version: "1.1"
name: setup-status-timeout-indeterminate
graders:
  - name: indeterminate
    type: 'regex'
    pattern: '\bINDETERMINATE\b'
    flags: 'i'
    target: 'last_message'
  - name: reports-error
    type: 'regex'
    pattern: 'connect ETIMEDOUT 104\.18\.20\.191:443'
    target: 'last_message'
  - name: retry-status
    type: 'regex'
    pattern: '\b(?:re-?run(?:s|ning)?|retr(?:y|ies|ied|ying)|try(?:ing)? (?:it )?again)\b[^\n]{0,60}?firecrawl --status\b|firecrawl --status\b[^\n]{0,60}?\b(?:again|retr(?:y|ies|ying)|re-?run(?:s|ning)?)\b'
    flags: 'i'
    target: 'last_message'
  - name: no-key-change
    type: 'llm'
    criteria: "firecrawl setup SKILL.md check step 2: 'Status CANNOT answer (error, timeout, network failure) -> INDETERMINATE regardless of the key's state, never a FAIL: persisted login/config credentials may be valid and an unanswered probe proves nothing either way. Report the status error verbatim, suggest retrying firecrawl --status, and direct no key change or key creation off an unanswered probe.' Only an answered unauthenticated status routes to a key remediation: with the key set, the invalid-key remediation (mint a fresh key on the firecrawl.dev dashboard and replace the stored value); with it unset, the unset-key remediation. The user's facts: firecrawl --status timed out and FIRECRAWL_API_KEY is set; they ask whether to mint a replacement key. PASS only if the reply classifies auth as INDETERMINATE and not FAIL, says the timeout means the probe could not answer and persisted login/config credentials may still be valid, advises against minting or replacing a key on this evidence, and says only an answered unauthenticated status would route to the invalid-key remediation (key set) or the unset-key remediation (key unset). FAIL if it reports auth as FAIL, tells the user to mint, rotate or replace the key now, or gives no distinction between this unanswered probe and an answered unauthenticated one."
  - name: no-print-key
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?(?:(?:echo|printf|print)\b(?:\\\\\\n|(?![;|]|&&|\$\(|`|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?\$(?:FIRECRAWL_API_KEY\b|\{FIRECRAWL_API_KEY(?!:?\+)[^}]*\})|printenv(?=\s*(?:[;|)]|&&|(?<!\\\\)\\n|"))|printenv\s+FIRECRAWL_API_KEY\b|(?:env|set|export\s+-p|declare\s+-[a-zA-Z]*[px][a-zA-Z]*)(?=\s*(?:[;|)]|&&|(?<!\\\\)\\n|"))|declare\s+-[a-zA-Z]*p[a-zA-Z]*\s+FIRECRAWL_API_KEY\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-key-write
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?(?:setx(?:\.exe)?\s|export\s+FIRECRAWL_API_KEY=|(?:echo|printf|cat)\b(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?FIRECRAWL_API_KEY=(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?(?:(?<![0-9&])>>?\s*(?:\\")?(?!/dev/null\b)|\|\s*(?:sudo\s+)?tee\b))|"command":"(?:[^"\\]|\\.)*?SetEnvironmentVariable\(\s*\\?["\x27]FIRECRAWL_API_KEY'
    min: 0
    max: 0
    arm: 'both'
  - name: no-npm-install
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?(?:p?npm|yarn)\s+(?:(?:global\s+)?(?:install|i|add)|update|up|upgrade)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-firecrawl-auth
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?firecrawl(?:-cli)?(?:@[^\s"\\]+)?\s+(?:login|config|init)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-write
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: no-edit
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
