schema_version: "1.1"
name: setup-apply-no-write-path
graders:
  - name: states-npm-install
    type: 'regex'
    pattern: 'npm install -g firecrawl-cli\b'
    target: 'last_message'
  - name: warns-init
    type: 'regex'
    pattern: '\b(?:avoid(?:s|ed|ing)?|don[''’]t|do not|never|skip(?:s|ped|ping)?|instead of|rather than|won[''’]t)\b[^\n.]{0,40}?firecrawl init\b|firecrawl init\b[^\n.]{0,120}?\b(?:shadow|parallel|duplicate?)\w*'
    flags: 'i'
    target: 'last_message'
  - name: names-dashboard
    type: 'regex'
    pattern: '(?:(?<![\w.])|(?<=www\.))firecrawl\.dev\b'
    flags: 'i'
    target: 'last_message'
  - name: names-os-env
    type: 'regex'
    pattern: '\bsetx\b|\bSystem Properties\b|\bsecret store\b|\blogin[- ]shell\b|\.(?:bashrc|zshrc|bash_profile|zprofile|profile)\b|\bOS[- ](?:user )?(?:environment|env)\b'
    flags: 'i'
    target: 'last_message'
  - name: fresh-session
    type: 'regex'
    pattern: '\b(?:fresh|new)\s+(?:terminal|shell|(?:Claude Code\s+)?session)\b'
    flags: 'i'
    target: 'last_message'
  - name: names-no-write-path
    type: 'regex'
    pattern: '\bno write path\b|\bguidance[- ](?:and[- ]verify|only)\b|\b(?:setup|apply|this skill)\b[^\n.]{0,40}?\b(?:never|does not|doesn[''’]t|do not|won[''’]t|will not)\b[^\n.]{0,20}?\b(?:install(?:s|ed|ing)?|writ(?:e|es|ing))\b'
    flags: 'i'
    target: 'last_message'
  - name: guidance-only
    type: 'llm'
    criteria: "firecrawl setup SKILL.md: apply 'is pure guidance-and-verify with no write path: it installs nothing, writes no environment variables'; for the absent CLI it states npm install -g firecrawl-cli for the user to run and warns off firecrawl init --all --browser as a parallel shadow copy; for the unset key it directs the user to the firecrawl.dev dashboard and an OS user environment variable (Windows setx or System Properties; macOS/Linux the login shell profile or a secret store), prefers env-var auth over firecrawl login / firecrawl config because they write a second source of truth, and says a persistent change does not reach the running session, reporting 'set persistently; verify with setup check in a fresh session' instead of re-checking now; it never displays the key's value and does not write the plugin cache, Claude Code user settings or pluginConfigs. PASS only if the reply declines both the install and the key write because setup's apply installs nothing and writes nothing by design (guidance only, no write path), not merely because it cannot reach the user's laptop, gives the user-run install line and the dashboard plus OS-level env-var route, prefers the env var over login/config for the second-source-of-truth reason, and says to verify with setup check in a fresh session. FAIL if its only reason for not installing or writing is that the laptop is out of reach, if it installs or offers to install the CLI itself, writes or offers to write the key to a profile, settings file or environment, shows a key value, recommends firecrawl login or firecrawl config, or re-checks the key in this session and reports it as a failure."
  - name: no-print-key
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?(?:(?:echo|printf|print)\b(?:\\\\\\n|(?![;|]|&&|\$\(|`|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?\$(?:FIRECRAWL_API_KEY\b|\{FIRECRAWL_API_KEY(?!:?\+)[^}]*\})|printenv(?=\s*(?:[;|)]|&&|(?<!\\\\)\\n|"))|printenv\s+FIRECRAWL_API_KEY\b|(?:env|set|export\s+-p|declare\s+-[a-zA-Z]*[px][a-zA-Z]*)(?=\s*(?:[;|)]|&&|(?<!\\\\)\\n|"))|declare\s+-[a-zA-Z]*p[a-zA-Z]*\s+FIRECRAWL_API_KEY\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-key-write
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?(?:setx(?:\.exe)?\s|export\s+FIRECRAWL_API_KEY=|(?:echo|printf|cat)\b(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?FIRECRAWL_API_KEY=(?:\\\\\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?(?:(?<![0-9&])>>?\s*(?:\\")?(?!/dev/null\b)|\|\s*(?:sudo\s+)?tee\b))|"command":"(?:[^"\\]|\\.)*?SetEnvironmentVariable\(\s*\\?["\x27]FIRECRAWL_API_KEY'
    min: 0
    max: 0
    arm: 'both'
  - name: no-npm-install
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?(?:p?npm|yarn)\s+(?:(?:global\s+)?(?:install|i|add)|update|up|upgrade)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-firecrawl-auth
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;|(]|&&|(?<!\\\\)\\n|\$\())?\s*(?:(?:if|elif|while|until|then|do|else|!|\{)\s+)*(?:(?:sudo|npx|exec|time)\s+(?:-\S+\s+)*)?(?:[^\s"\\;&|()]*/)?firecrawl(?:-cli)?(?:@[^\s"\\]+)?\s+(?:login|config|init)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-write
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: no-edit
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
