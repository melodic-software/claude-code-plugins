schema_version: "1.1"
name: simulation-evaluate-markdown-board
description: "An evaluation of a completed Big Picture markdown board (the scaffold writes evals/fixtures/big-picture-board-export.md to docs/event-storming/courses-20261118-a7f2/big-picture.md). simulation SKILL.md 'Board backend': a .md board reference is the markdown backend, and an existing markdown board is read with the Read tool, with no Miro; 'Running an Evaluation': read_board each board before scoring. Natural-language prompt so the Skill call is visible; it never names Miro. reads-board needs a Read of the board file; no-miro-ask (the pattern of simulation-discover-bcs-export) fails asking to install, enable or connect Miro or saying it cannot proceed without it; cites-board needs an item that is only on the board (the Refund disputes hot spot or the Chargeback Filed event); no-write fails any Write, since evaluating changes no board. The grant has no Bash, so the run cannot resolve the verification level; whether it scores is not graded. Needs --scaffold and --allow-tools Write."
tags: [event-storming, simulation, outcome, backend, scaffold, no-network]
expected_outcome: "The model loads the simulation skill, reads the markdown board file, never asks for Miro, discusses items from that board, and writes nothing."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the event-storming simulation skill to evaluate the Big Picture board at docs/event-storming/courses-20261118-a7f2/big-picture.md against its Big Picture rubric. Put what you find in your reply and do not change the board."
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  max_turns: 14
  timeout_seconds: 400
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:event-storming:)?simulation"'
    arm: with-only
  - name: reads-board
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*docs/event-storming/courses-20261118-a7f2/big-picture\.md"'
  - name: no-miro-ask
    type: regex
    pattern: '(?:^|[\n.!?;:]\s*|,(?!\s*(?:or\s+|and\s+)?(?:install|enable|connect|set up|sets up|setting up|configure|configures|configuring))\s*)(?:(?!\bwithout\b|\bno need to\b|n''t need to\b|\bnot need to\b)[^\n.!?;:])*?\b(?:install|installs|installing|enable|enables|enabling|connect|connects|connecting|set up|sets up|setting up|configure|configures|configuring)\b[^\n.]{0,40}\bmiro\b|\b(?:cannot|can''t|can not|unable to)\s+(?:proceed|continue|run|start)\b(?!\s+(?:step\s*\d+\s*\((?:the\s+)?board[- ]label\w*\)|(?:the\s+)?board[- ]label\w*(?:\s+step)?)\s+without\b)[^\n.]{0,60}\bmiro\b'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: cites-board
    type: regex
    pattern: '\brefund disputes\b|\bchargeback filed\b'
    flags: 'i'
    target: 'last_message'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
