schema_version: "1.1"
name: simulation-discover-bcs-export
description: "Legacy simulation discover-bcs-offline-export-mechanical-output. --discover-bcs with no board URL and a structured-markdown export of a completed Big Picture board in the workspace (the scaffold writes evals/fixtures/big-picture-board-export.md there, since the eval dir is hidden from the agent). simulation SKILL.md 'Bounded Context Discovery Protocol' (lines 130-148): a supplied export substitutes for the live read and needs no Miro; apply the 6 heuristics mechanically; a table '# | BC Name (2-3 words) | Key Events | Primary Personas | Heuristic Evidence'; 'the architect's post-workshop homework, not a workshop phase'; mark the BC the arrow-voting winner scopes to as the next target. Slash-invoked, so no Skill grader. reads-export needs a Read of the export; no-miro-ask fails asking to install, enable or connect Miro or saying it cannot proceed without it (exempt only when 'without', 'no need to' or 'n't need to' opens the clause of the verb list, or when the cannot-run clause names only the board-label step); applies-six-heuristics needs each of H1 to H6 by number or name; evidence-column needs a table header with Evidence; post-workshop-homework needs homework or post-workshop; short-bc-names fails a numbered table row whose BC name has one word or four or more; enrollment-divergence needs Enrollment tied to two meanings or a divergence; refund-winner-next needs a line tying the refund winner to the next exploration; homework-not-workshop (llm) holds expectation 4's negative half and expectation 8. Needs --scaffold."
tags: [event-storming, simulation, outcome, bounded-contexts, scaffold, no-network]
expected_outcome: "The model reads the export, runs bounded-context discovery without asking for Miro, and gives a table of short-named contexts with per-heuristic evidence, framed as post-workshop homework; it flags the two meanings of Enrollment and recommends the context the refund-disputes winner scopes to as the next exploration."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/event-storming:simulation --discover-bcs\n\nNo Miro MCP server is available this session, and no board URL is being given. Instead, treat ./big-picture-board-export.md as an already-exported set of board items from a completed Big Picture board (People & Systems and Walk-through phases done). Run bounded-context discovery against that export."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 400
graders:
  - name: reads-export
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*big-picture-board-export\.md"'
  - name: no-miro-ask
    type: regex
    pattern: '(?:^|[\n.!?;:]\s*|,(?!\s*(?:or\s+|and\s+)?(?:install|enable|connect|set up|sets up|setting up|configur))\s*)(?:(?!\bwithout\b|\bno need to\b|n''t need to\b|\bnot need to\b)[^\n.!?;:])*?\b(?:install|installs|installing|enable|enables|enabling|connect|connects|connecting|set up|sets up|setting up|configure|configures|configuring)\b[^\n.]{0,40}\bmiro\b|\b(?:cannot|can''t|can not|unable to)\s+(?:proceed|continue|run|start)\b(?!\s+(?:step\s*\d+\s*\((?:the\s+)?board[- ]label\w*\)|(?:the\s+)?board[- ]label\w*(?:\s+step)?)\s+without\b)[^\n.]{0,60}\bmiro\b'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: applies-six-heuristics
    type: regex
    pattern: '^(?=[\s\S]*(?:\bH1\b|\bbusiness phases?\b|\bpivotal\b))(?=[\s\S]*(?:\bH2\b|\bswim ?lanes?\b|\bparallel (?:swim ?lanes?|tracks?|flows?|processes|zones?|timelines?)\b))(?=[\s\S]*(?:\bH[34]\b|\bhovering\b|\bownership\b|\bdensity\b))(?=[\s\S]*(?:\bH5\b|\bhot ?spots?\b))(?=[\s\S]*(?:\bH6\b|\blanguage divergence\b|\bdivergent language\b|\bsame word\b|\bmeans? (?:two|different)\b))'
    flags: 'i'
    target: 'last_message'
  - name: evidence-column
    type: regex
    pattern: '^\|[^\n]*\bevidence\b[^\n]*\|'
    flags: 'im'
    target: 'last_message'
  - name: post-workshop-homework
    type: regex
    pattern: '\bhomework\b|\bpost-workshop\b|\bafter the workshop\b'
    flags: 'i'
    target: 'last_message'
  - name: short-bc-names
    type: regex
    pattern: '^\|\s*\d+\s*\|\s*\**\s*(?:[^|\s*&/+]+\s+(?:[&/+]\s+)?){3,}[^|\s*&/+]+\s*\**\s*\||^\|\s*\d+\s*\|\s*\**\s*[^|\s*&/+]+\s*\**\s*\|'
    flags: 'im'
    match: 'not_contains'
    target: 'last_message'
  - name: enrollment-divergence
    type: regex
    pattern: '\benrollment\b[^\n]{0,160}\b(?:two (?:different )?(?:meanings|things|senses)|means? (?:two|different)|divergen\w*|ambiguous|H6|same word|homonym\w*|overloaded)|\b(?:two (?:different )?(?:meanings|things|senses)|divergen\w*|H6|same word|overloaded|ambiguous)\b[^\n]{0,160}\benrollment\b'
    flags: 'i'
    target: 'last_message'
  - name: refund-winner-next
    type: regex
    pattern: '^(?=[^\n]*\b(?:winner|winning|arrow[- ]vot\w*|most votes)\b)(?=[^\n]*\b(?:next|recommend\w*|explore|deep[- ]dive)\b)(?=[^\n]*\brefund)'
    flags: 'im'
    target: 'last_message'
  - name: homework-not-workshop
    type: llm
    criteria: 'Legacy simulation 8: "Frames bounded-context discovery as the architect''s post-workshop homework, NOT as a workshop phase or participant output" and "Does not contradict the board-URL scenario: a live Miro board reached by URL still requires Miro to read, but a directly-supplied export does not". PASS when the reply presents the analysis as post-workshop work by the architect or facilitator and says nothing implying a board URL could be read without Miro. FAIL when it presents the contexts as an output of the workshop participants or a workshop phase, or claims Miro is never needed to read a live board.'
    focus: 'last_message'
