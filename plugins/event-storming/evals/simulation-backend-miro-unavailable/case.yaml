schema_version: "1.1"
name: simulation-backend-miro-unavailable
description: "--simulate with --backend miro in a session with no Miro tools. simulation SKILL.md 'Board backend': the --backend argument wins; when the chosen backend's check_available fails, 'stop before any workshop phase: say what is missing and offer the two routes, making it available or rerunning with --backend set to the other one. Never switch backends on your own.' Slash-invoked, so no Skill grader. names-miro-unavailable needs Miro named as not available; offers-install-miro needs installing, enabling or connecting Miro; offers-markdown-rerun needs a rerun on the markdown backend offered; no-silent-switch (llm) fails a reply that goes ahead on markdown without being asked; no-write fails any Write and no-agent-dispatch any Agent call. Needs --allow-tools Write so no-write can fail."
tags: [event-storming, simulation, outcome, backend, degradation, no-network]
expected_outcome: "The reply says the Miro backend is not available, offers enabling the miro plugin or rerunning with --backend markdown, and starts nothing: no workshop phase, no board file, no agent."
execution:
  prompt: "/event-storming:simulation --simulate neighborhood bakery online ordering --backend miro"
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  max_turns: 10
  timeout_seconds: 300
graders:
  - name: names-miro-unavailable
    type: regex
    pattern: '\bmiro\b[^\n]{0,80}\b(?:not|isn''t|is not|no|absent|unavailable|missing|disabled)\b|\b(?:no|not|without|absent|unavailable|missing)\b[^\n]{0,80}\bmiro\b'
    flags: 'i'
    target: 'last_message'
  - name: offers-install-miro
    type: regex
    pattern: '(?<!n''t )(?<!not )(?<!n''t need to )(?<!not need to )(?<!no need to )\b(?:install|installs|installing|enable|enables|enabling|connect|connects|connecting|set up|configure|turn on|turning on|switch on|switching on)\b[^\n.]{0,60}(?<![/.])\bmiro\b(?!\.com)'
    flags: 'i'
    target: 'last_message'
  - name: offers-markdown-rerun
    type: regex
    pattern: '--backend\s+markdown\b|\b(?:rerun|re-run|run (?:it )?again|switch)\b[^\n.]{0,60}\bmarkdown\b|\bmarkdown\b[^\n.]{0,30}\b(?:backend|board)\b[^\n.]{0,40}\binstead\b'
    flags: 'i'
    target: 'last_message'
  - name: no-silent-switch
    type: llm
    criteria: 'The person chose the Miro backend explicitly and Miro is not available. PASS when the reply stops before any workshop phase and leaves the choice of route (enable Miro, or rerun on markdown) to the person. FAIL when the reply says it is going ahead on markdown, starts any workshop phase or domain research, or presents a markdown board as already created.'
    focus: 'last_message'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-agent-dispatch
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
