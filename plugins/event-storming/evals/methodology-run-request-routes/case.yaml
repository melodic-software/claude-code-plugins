schema_version: "1.1"
name: methodology-run-request-routes
description: "Legacy methodology agentic-request-routes-to-simulation. The methodology skill is asked to run an agentic multi-persona simulation on a Miro board; methodology SKILL.md line 31 says to run an agentic workshop 'invoke /event-storming:simulation via the Skill tool' rather than read facilitation guidance. Slash-invoked, so no Skill grader. routes-to-simulation needs the reply to name event-storming:simulation, --simulate or the simulation skill; no-placed-claim fails a reply claiming it placed stickies or created a board; no-agent-dispatch fails any Agent call (no persona fan-out); reference-vs-agentic (llm) needs the facilitation-reference versus agentic-driver distinction."
tags: [event-storming, methodology, outcome, routing, no-network]
expected_outcome: "The reply routes the user to /event-storming:simulation for the agentic run, runs no simulation and places no stickies, and makes clear the methodology skill is facilitation reference while simulation is the agentic driver."
execution:
  prompt: "/event-storming:methodology Run an agentic multi-persona EventStorming simulation of a developer-conference domain on a Miro board for me."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 10
  timeout_seconds: 300
graders:
  - name: routes-to-simulation
    type: regex
    pattern: '\bevent-storming:simulation\b|(?<![\w-])--simulate\b|\bsimulation skill\b'
    flags: 'i'
    target: 'last_message'
  - name: no-placed-claim
    type: regex
    pattern: '\bI(?:''ve|’ve| have)?\s+(?:just\s+|now\s+|already\s+)?(?:placed|added|put|posted)\b[^\n.]{0,60}\bstick(?:y|ies)\b|\bI(?:''ve|’ve| have)?\s+(?:just\s+|now\s+|already\s+)?(?:created|set up|opened)\s+(?:a|the|your)\s+(?:new\s+)?(?:miro\s+)?board\b|\bstick(?:y|ies)\b[^\n.]{0,40}\b(?:have been|are now)\s+(?:placed|added|posted)\b'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: no-agent-dispatch
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
  - name: reference-vs-agentic
    type: llm
    criteria: 'Legacy methodology 2: "Output makes the reference-vs-agentic distinction clear (this skill is facilitation knowledge; simulation is the agentic driver)" and "Output does NOT itself execute an agentic multi-persona simulation". PASS when the reply says the methodology skill (the facilitation reference) gives guidance while the simulation skill or /event-storming:simulation runs the agentic workshop. FAIL when the reply runs or narrates a simulated workshop itself, or never distinguishes the two.'
    focus: 'last_message'
