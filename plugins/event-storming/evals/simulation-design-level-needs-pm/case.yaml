schema_version: "1.1"
name: simulation-design-level-needs-pm
description: "Legacy simulation design-level-missing-prerequisite. --design-level with a bounded-context name and no prior run. simulation SKILL.md lines 109-110: read the run-state store (${CLAUDE_PLUGIN_DATA}/history.jsonl) for the Process Modeling board; 'If no prior Process Modeling board exists for the BC, surface the missing prerequisite and offer to run --process-model first. Never fabricate a process model or aggregates from scratch'; lines 69-72: that lookup needs no Miro and comes before any Miro gating; lines 197-199: read the store with the Read tool, a missing history.jsonl meaning no prior run. Slash-invoked, so no Skill grader. reads-history (with-only indicator: the without-plugin arm cannot know the store) needs a Read of history.jsonl; surfaces-missing-prereq (expectation 2's positive half) is held on #8635: the sandbox denies every Read of the plugin-data directory, so the run cannot learn that no board exists; names-design-level needs Design-Level or Blank Aggregates in prose (the prompt's --design-level flag cannot pass it); no-fabricated-model (llm) holds expectation 2's offer of --process-model first and its no-fabrication half, and expectation 3; expectation 2's report that no board exists is held on #8635 for the same reason as surfaces-missing-prereq; no-agent-dispatch fails any Agent call."
tags: [event-storming, simulation, outcome, prerequisite, no-network]
expected_outcome: "The model looks up history.jsonl, is denied the plugin-data read, treats the request as Design-Level, offers --process-model first, and drafts no process model or aggregates. Whether it reports that no Process Modeling board exists is held on #8635."
execution:
  prompt: "/event-storming:simulation --design-level Enrollment"
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 10
  timeout_seconds: 300
graders:
  - name: reads-history
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*history\.jsonl"'
    arm: with-only
  - name: names-design-level
    type: regex
    pattern: '(?<!--)\bdesign[- ]level\b|\bblank aggregates?\b'
    flags: 'i'
    target: 'last_message'
  - name: no-fabricated-model
    type: llm
    criteria: 'Legacy simulation 7: "On finding no prior Process Modeling board, surfaces the missing prerequisite (offering to run --process-model first) instead of fabricating a process model or aggregates from scratch" and "Routes to Design-Level behavior (e.g. Blank Aggregates), not to Big Picture or the no-args interactive discovery flow". PASS when the reply treats the request as Design-Level for Enrollment and stops at offering --process-model first. Do not judge whether the reply reports that no Process Modeling board exists: the run cannot read the plugin-data directory, so that half is held on #8635. FAIL when the reply drafts events, commands, policies or aggregates for Enrollment, starts a Big Picture session, or asks the interactive-discovery goal questions instead.'
    focus: 'last_message'
  - name: no-agent-dispatch
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
