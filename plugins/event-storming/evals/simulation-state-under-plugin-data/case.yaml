schema_version: "1.1"
name: simulation-state-under-plugin-data
description: "Legacy simulation state-persists-outside-install-dir. A question about where a --simulate run keeps its state. simulation SKILL.md 'Cross-run state': boards live where their backend keeps them (markdown boards in the board directory); all other run state, session archives, board references and version metrics, goes under ${CLAUDE_PLUGIN_DATA}/ (sessions/<session-id>/, history.jsonl), and 'Never write run state inside the plugin's own installed directory (${CLAUDE_PLUGIN_ROOT}) or into the consumer's project tree'. Claude Code substitutes both variables in the loaded skill text, so the model sees resolved paths, not the tokens. names-plugin-data needs ${CLAUDE_PLUGIN_DATA} or its resolved form (a /plugins/data/<id> path); avoids-plugin-root needs CLAUDE_PLUGIN_ROOT, or that section's 'the plugin's own installed directory' (legacy: 'plugin install directory'), after a never, not, avoid, outside or nor in the same clause, or CLAUDE_PLUGIN_ROOT followed by is, stays, must, should or will be and a read-only, never, not, off-limits, wiped or replaced; no-project-tree (llm) fails a reply that puts the archive, references or metrics in the project or repository tree; naming the board directory as where board files go passes. Natural-language prompt so the Skill call is visible."
tags: [event-storming, simulation, outcome, state, no-network]
expected_outcome: "The model loads the simulation skill and directs the state to ${CLAUDE_PLUGIN_DATA}/, says it never goes inside ${CLAUDE_PLUGIN_ROOT}, and keeps it out of the project tree."
execution:
  prompt: "Use the event-storming plugin's simulation skill. Where should a --simulate run write its session archive, its board references, and its version-comparison metrics?"
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 8
  timeout_seconds: 300
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:event-storming:)?simulation"'
    arm: with-only
  - name: names-plugin-data
    type: regex
    pattern: '\$\{?CLAUDE_PLUGIN_DATA\b|/plugins/data/[\w.@-]+'
    target: 'last_message'
  - name: avoids-plugin-root
    type: regex
    pattern: '(?:\bnever\b|\bnot\b|n''t\b|\bavoid\w*|\boutside\b|\bnor\b)[^\n.,;]{0,80}\bCLAUDE_PLUGIN_ROOT\b|(?:\bnever\b|\bnot\b|n[''’]t\b|\bavoid\w*|\boutside\b|\bnor\b)[^\n.,;]{0,80}\bplugin(?:[''’]s)?\s+(?:own\s+)?install(?:ed|ation)?\s+director(?:y|ies)\b|\bCLAUDE_PLUGIN_ROOT\b[}`)]*\s+(?:is|stays|must|should|will be)\b[^\n.,;]{0,40}\b(?:read[- ]only|never|not|off[- ]limits|wiped|replaced)\b'
    flags: 'i'
    target: 'last_message'
  - name: no-project-tree
    type: llm
    criteria: 'Legacy simulation 5: "Output does not write session state into the consumer''s project/repository tree". PASS when the reply keeps the session archive, the board references and the metrics under the plugin data directory; naming the project tree as a place that state must not go passes, and so does saying the markdown board files themselves go to the repository''s board directory (docs/event-storming by default). FAIL when the reply recommends writing the session archive, the board references or the metrics inside the consumer''s project or repository (for example a sessions/ or .event-storming/ directory in the repo, or a history file in the board directory).'
    focus: 'last_message'
