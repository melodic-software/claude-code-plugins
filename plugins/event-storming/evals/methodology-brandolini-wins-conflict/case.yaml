schema_version: "1.1"
name: methodology-brandolini-wins-conflict
description: "Legacy methodology brandolini-wins-on-source-conflict. A practitioner blog orders timeline enforcement before chaotic exploration. methodology SKILL.md 'Source authority hierarchy' (lines 130-139): Brandolini's book is the canonical source, secondary sources are enrichments tagged [BOURGAU] or [SUPPLEMENTED], 'When sources conflict, Brandolini wins', and secondary authors publish 'interpretations'. brandolini-canonical needs Brandolini named canonical, authoritative or winning; secondary-is-enrichment needs enrichment, interpretation or a BOURGAU/SUPPLEMENTED tag (case-sensitive for the tags, so the prompt's 'Bourgau' cannot pass it); no-secondary-canonical (llm) fails a reply that prescribes the blog's order, since a correct reply restates that order to reject it. Natural-language prompt so the Skill call is visible."
tags: [event-storming, methodology, outcome, source-authority, no-network]
expected_outcome: "The model loads the methodology skill, treats Brandolini's book as canonical and resolves the conflict in his favor, calls the blog an enrichment or interpretation, and does not prescribe the blog's ordering."
execution:
  prompt: "Use the EventStorming facilitation reference from the event-storming plugin. I read a practitioner blog (Paul Rayner / Bourgau) that says you should enforce the timeline BEFORE chaotic exploration. That contradicts what I remember of Brandolini's ordering. Which sequence should the methodology follow?"
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 10
  timeout_seconds: 300
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:event-storming:)?methodology"'
    arm: with-only
  - name: brandolini-canonical
    type: regex
    pattern: '\bbrandolini\w*\b[^\n.]{0,80}\b(?:canonical|wins|takes precedence|prevails|authoritative|is the authority)\b|\b(?:canonical|takes precedence|prevails|authoritative)\b[^\n.]{0,80}\bbrandolini'
    flags: 'i'
    target: 'last_message'
  - name: secondary-is-enrichment
    type: regex
    pattern: '\b[Ee]nrich(?:es|ed|ing|ments?)?\b|\b[Ii]nterpretations?\b|\[?BOURGAU\]|\[SUPPLEMENTED\]|\bSUPPLEMENTED\b'
    target: 'last_message'
  - name: no-secondary-canonical
    type: llm
    criteria: 'Legacy methodology 4: "Output does NOT adopt the secondary practitioner ordering as the canonical/prescribed sequence". The methodology skill holds Brandolini canonical and says that when sources conflict, Brandolini wins. PASS when the reply prescribes Brandolini''s ordering (chaotic exploration first, then enforcing the timeline) as the sequence to follow; describing the blog''s timeline-first order in order to reject it, or as an optional enrichment, passes. FAIL when the reply prescribes enforcing the timeline before chaotic exploration as the sequence, or calls the two orders equally canonical.'
    focus: 'last_message'
