schema_version: "1.1"
name: simulation-default-domain
description: "Legacy simulation no-domain-defaults-to-developer-conference. --simulate with no domain and no backend named. simulation SKILL.md 'Argument Parsing': 'Domain defaults to \"Developer Conference\" if not specified'; 'Board backend': with no --backend, no board reference and no board_backend option the backend is markdown, and the first reply names it. The prompt asks the model to stop before any phase, so the case reads the setup reply. Slash-invoked, so no Skill grader. names-developer-conference needs the default domain; markdown-default (the pattern of simulation-default-markdown) needs markdown called the default; no-write fails any Write, and no-agent-dispatch any Agent call, before the go-ahead. Needs --allow-tools Write so no-write can fail."
tags: [event-storming, simulation, outcome, backend, no-network]
expected_outcome: "The reply names Developer Conference as the domain and markdown as the default backend, and writes nothing and dispatches no agent before the user says go."
execution:
  prompt: "/event-storming:simulation --simulate\n\nBefore any workshop phase runs, tell me the domain and where the board will go, then stop and wait for my go-ahead."
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  max_turns: 10
  timeout_seconds: 300
graders:
  - name: names-developer-conference
    type: regex
    pattern: '\bdeveloper[- ]conference\b'
    flags: 'i'
    target: 'last_message'
  - name: markdown-default
    type: regex
    pattern: '\brecommend\w*\s+(?:the\s+|using\s+)?(?:structured[- ])?markdown\b|\bmarkdown\b(?:(?!\bmiro\b)[^\n.,;]){0,40}\b(?:default|recommended)\b|\b(?:default|recommended)\b[^\n.,;]{0,10}\b(?:structured[- ])?markdown\b'
    flags: 'i'
    target: 'last_message'
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-agent-dispatch
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
