schema_version: "1.1"
name: vd-watch-prereq-stop-no-fallback
graders:
  - name: reports-stop
    type: regex
    pattern: '(?:^|[.;:!?,—(]|\b(?:so|but|because|since)\b)[ \t*_`]*(?:(?![.;:!?,—(\n])(?!\b(?:not|never|no|nothing|without|rather|instead of|skip(?:ping)?)\b)(?!\w+n[’'']t\b)[^\n])*?\b(?:stopped|stopping|halted|halting|blocked|fails? closed|failed closed|can(?:not|[’'']t)\s+(?:proceed|continue|run|start)|unable to (?:proceed|continue|run|start)|(?:did|could)(?:n[’'']t| not)\s+(?:run|start|proceed|continue))\b'
    flags: 'mi'
    target: last_message
  - name: names-fix-path
    type: regex
    pattern: '(?:^|[.;:!?,—(]|\b(?:so|but|because|since)\b)[ \t*_`]*(?:(?![.;:!?,—(\n])(?!\b(?:not|never|no|nothing|without|rather|instead of|skip(?:ping)?)\b)(?!\w+n[’'']t\b)[^\n])*?(?:setup-deps(?:\.mjs\b|(?![.\w-]))|\b(?:install|upgrade)\b[^\n.;]{0,40}\b(?:yt-dlp|ffmpeg|ImageMagick|magick)\b)(?![^.;!?,\n]*\b(?:not needed|unnecessary|is(?:n[’'']t| not) (?:needed|required)|already (?:installed|current))\b)'
    flags: 'mi'
    target: last_message
  - name: no-transcript-fallback
    type: tool_used
    tool: Bash
    input_match: 'run-transcript\.js'
    min: 0
    max: 0
    arm: both
  - name: no-improvised-download
    type: tool_used
    tool: Bash
    input_match: '\b(?:yt-dlp|youtube-dl|curl|wget)\b(?:[^\x22\\]|\\.)*?(?:youtube\.com|youtu\.be)'
    min: 0
    max: 0
    arm: both
