schema_version: "1.1"
name: au-absolute-out-kept
context:
  scaffold_script: scaffold.sh
graders:
  - name: keeps-absolute-out
    type: regex
    pattern: '^(?=[\s\S]*?/srv/repos/acme-corpus/docs/upstream\b)(?=[\s\S]*?\bargument\b)(?![\s\S]*?/srv/repos/acme-corpus/docs/upstream\b[^\n]{0,80}?(?<!\bnot )(?<!n[’'']t )\b(?:invalid|dropped|rejected|ignored)\b)(?![\s\S]*?(?<!\bnot )\b(?:invalid|dropped|rejected|ignored)\b[^\n]{0,80}?/srv/repos/acme-corpus)'
    flags: 'i'
    target: last_message
  - name: checks-out-visibility
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?repo-visibility\.mjs(?:[^"\\]|\\.)*?/srv/repos/acme-corpus'
    min: 1
  - name: reports-visibility
    type: regex
    pattern: '^(?=[\s\S]*?\bsource\b[^\n]{0,80}?\b(?:private|unknown)\b)(?=[\s\S]*?\b(?:destination|--out|record directory|/srv/repos/acme-corpus)\b[^\n]{0,80}?\b(?:private|local)\b)'
    flags: 'i'
    target: last_message
  - name: no-write-in-this-repo
    type: tool_used
    tool: Write
    input_match: '"file_path":"(?!/srv/repos/acme-corpus/)'
    min: 0
    max: 0
    arm: both
