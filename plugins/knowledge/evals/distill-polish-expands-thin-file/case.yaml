schema_version: "1.1"
name: distill-polish-expands-thin-file
context:
  scaffold_script: scaffold.sh
graders:
  - name: thin-file-named
    type: regex
    pattern: 'idempotency\.md[\s\S]*(?:Idempotency-Key|24 hours|24-hour|409|422)|(?:Idempotency-Key|24 hours|24-hour|409|422)[\s\S]*idempotency\.md'
    target: last_message
