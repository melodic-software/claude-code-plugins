schema_version: "1.1"
name: au-default-layer-url-stops
context:
  scaffold_script: scaffold.sh
graders:
  - name: reports-default-dir
    type: regex
    pattern: '^(?![^\n]*\?[ \t*_]*$)[^\n]*?(?:docs/upstream\b[^\n]{0,120}?(?<!\bnot )(?<!\bnot the )\bdefault\b|(?<!\bnot )(?<!\bnot the )\bdefault\b[^\n]{0,120}?docs/upstream\b)'
    flags: 'mi'
    target: last_message
  - name: no-clone
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\bgit(?:[ \t]+-[cC][ \t]+[^ \t"\\]+|[ \t]+-{1,2}[\w-]+(?:=[^ \t"\\]+)?)*[ \t]+clone\b|\bgh[ \t]+repo[ \t]+clone\b|clone-cli\.js)'
    min: 0
    max: 0
    arm: both
  - name: no-source-read
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:repos/acme/agent-skills/(?:contents|git/(?:trees|blobs)|tarball|zipball|readme)\b|raw\.githubusercontent\.com/acme/agent-skills/)'
    min: 0
    max: 0
    arm: both
  - name: no-record-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*docs/upstream/'
    min: 0
    max: 0
    arm: both
  - name: names-local-checkout
    type: regex
    pattern: '\blocal[ \t]+(?:git[ \t]+)?(?:checkout|clone)\b'
    flags: 'i'
    target: last_message
