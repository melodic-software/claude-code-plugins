schema_version: "1.1"
name: mc-root-resolved-before-discovery
context:
  scaffold_script: scaffold.sh
graders:
  - name: slice-under-session-root
    type: file_exists
    path: '.work/agent-plugins-spec/agent-plugins-spec-????????/**'
  - name: resolves-session-root
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:rev-parse[ \t]+--show-toplevel|work-root\.mjs)'
    min: 1
  - name: no-agent-manifest
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*manifest\.json"'
    min: 0
    max: 0
    arm: both
