schema_version: "1.1"
name: ju-planned-known-repetition-keeps
description: Justify given a proposal to add an interface whose second consumer is a stated requirement with the same namable shape keeps it, rather than calling it speculative generality, writing nothing
tags: [overengineering, justify, outcome, planned-mode, read-only]
runs: 3
expected_outcome: The run judges the proposal in planned mode. The Notifier interface is kept, citing the stated second consumer (R2, SMS, in docs/requirements.md) and the shared send(recipient, message) shape as namable and stable. It is not dropped as speculative generality or YAGNI, and the run does not demand a third occurrence first. It makes no Write or Edit call.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/overengineering:justify Proposal: before writing the email confirmation in src/orders.py, add a `Notifier` interface with one method, `send(recipient, message)`, and write the email sender as its first implementation. The SMS sender in docs/requirements.md becomes the second."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: keeps-known-repetition
    type: llm
    focus: last_message
    criteria: "PASS only if all hold: (1) the verdict on the Notifier interface is keep (or an equivalent: needed, justified, not overengineering); (2) the reason cites the stated second consumer, the SMS requirement R2 in docs/requirements.md, as a requirement that already exists rather than a someday one; (3) it treats the shared send(recipient, message) shape as namable or stable. FAIL if the interface is dropped or called speculative generality, YAGNI or premature abstraction, if the run asks for a third occurrence before extracting, or if it keeps the interface without citing the stated second consumer."
