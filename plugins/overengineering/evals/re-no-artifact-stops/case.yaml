schema_version: "1.1"
name: re-no-artifact-stops
description: Realign asked to clean up CI with no findings artifact on the branch stops, names the resolved home and both producing skills, and changes nothing
tags: [overengineering, realign, outcome, refusal, write-posture]
runs: 3
expected_outcome: No Write or Edit call and no destructive Bash command. The reply says no findings artifact exists, names the resolved home .work/overengineering/feat-ci-cleanup, and names both overengineering:audit and overengineering:justify as the skills that produce one.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/overengineering:realign go ahead and clean up our CI, retire whatever is dead in there."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 15
  timeout_seconds: 600
graders:
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-destructive-bash
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:\brm\b|\bmv\b|\bcp\b|\bchmod\b|\bunlink\b|\bshred\b|\btruncate\b|\btee\b|\bsed\b(?:[^"\\]|\\.)*?\s-i|\bperl\b(?:[^"\\]|\\.)*?\s-[a-z]*i|-delete\b|\bgit\s+(?:-C\s+\S+\s+)?(?:checkout|restore|reset|clean|commit|update-index)\b|(?<![0-9&>])>{1,2}\s*(?!/dev/null)[^\s&|;])'
    min: 0
    max: 0
  - name: says-no-artifact
    type: regex
    pattern: '(?<!\bif )(?<!\bwhen )\bno (?:findings )?artifact\b|\bno findings(?:\.md| file)\b|\b(?:findings artifact|findings\.md)`?[^\n]{0,60}\b(?:does not|doesn''t|did not|didn''t) exist|\b(?:findings artifact|findings\.md)`?[^\n]{0,40}\b(?:is |was )?(?:absent|missing|not found|not present)\b|\bnothing (?:at|in) `?\.work/overengineering/'
    flags: i
  - name: names-resolved-home
    type: regex
    pattern: '\.work/overengineering/feat-ci-cleanup(?![a-z0-9_-])'
  - name: names-audit
    type: regex
    pattern: '\boverengineering:audit\b'
  - name: names-justify
    type: regex
    pattern: '\boverengineering:justify\b'
