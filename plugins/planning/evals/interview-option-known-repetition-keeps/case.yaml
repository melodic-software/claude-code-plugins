schema_version: "1.1"
name: interview-option-known-repetition-keeps
description: An interview over an option to add an interface whose second consumer is a stated requirement with the same send shape recommends keeping the interface rather than calling it speculative
tags: [interview, recommendation, known-repetition, scaffold]
expected_outcome: The first decision round, headed by a Scope check: line, gives a recommendation on how to structure the senders keeps the Notifier interface (or an equivalent shared abstraction), citing the stated SMS requirement R2 in docs/requirements.md as the second consumer and the shared send(recipient, message) shape. It does not call the interface speculative generality or YAGNI and does not ask to wait for a third channel. No Write or Edit touches PLAN.md.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the interview skill from the planning plugin, topic order-confirmations. Problem: requirement R1 in docs/requirements.md, the email order confirmation, is next. Options I am weighing: (a) add a `Notifier` interface with one method, `send(recipient, message)`, now, with the email sender as its first implementation; (b) write the email sender directly and extract an interface later. Settle mechanism decisions in this interview. Round 1 is answered: Q1, the problem is as stated above; Q2, the users are shoppers who place orders and need a confirmation. I'm here and will answer; ask me round 2."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent, Write, Edit]
  max_turns: 30
  timeout_seconds: 900
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?interview"'
    arm: with-only
  - name: keeps-known-repetition
    type: llm
    arm: both
    focus: trace
    criteria: "PASS only if all hold: (1) where the reply recommends how to structure the senders, the recommendation keeps the Notifier interface or an equivalent shared abstraction; (2) its printed reason cites the stated SMS requirement (R2 in docs/requirements.md) as a second consumer that already exists; (3) no recommendation drops the interface as speculative generality, YAGNI or premature abstraction, and none asks to wait for a third channel. FAIL if the reply recommends dropping or deferring the interface, or keeps it without citing the stated second consumer."
  - name: scope-check-line
    type: regex
    pattern: '(?:^|\n)[^\n]{0,6}Scope check:'
    target: last_message
    arm: both
  - name: no-plan-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
  - name: no-plan-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
