schema_version: "1.1"
name: interview-tiny-diff-not-cheap-to-retry
description: "A one-constant change whose diff is quick to review but whose wrong build deletes data that cannot be restored is interview-first: it fails the cheap-to-retry test, so the quick-change skip does not apply. The case sits at the boundary where the entry gate decides; the two interview-skips-quick-* cases cover the side where both tests pass. On Sonnet this case also passed with the retry-cost test removed from the skill, so it guards against the skill skipping the interview on this request and does not show that the test causes the interview."
tags: [interview, routing, quick-change, boundary, scaffold, no-network]
expected_outcome: The reply does not treat the one-line diff as a quick change; it opens the interview with a numbered question round before building, and no Write or Edit touches a file under src/.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the interview skill from the planning plugin. Change RETENTION_DAYS in src/jobs/purge-audit-log.ts from 90 to 30. It is one constant in one file, so the diff is a one-line review. The job runs every hour against production once this merges, and the rows it deletes cannot be restored. I'm here and will answer."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?interview"'
    arm: with-only
  - name: asks-question-round
    type: regex
    pattern: '\bQ[1-9]\d*\s*[:.)\]|]|(?:^|\n)[ \t]*(?:[-*][ \t]+)?\d+[.)][ \t][^\n]*\?'
    match: contains
    arm: both
  - name: no-src-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"(?:[^"]*/)?src/'
    min: 0
    max: 0
    arm: both
  - name: no-src-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"(?:[^"]*/)?src/'
    min: 0
    max: 0
    arm: both
