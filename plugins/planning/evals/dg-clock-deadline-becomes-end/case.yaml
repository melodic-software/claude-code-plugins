schema_version: "1.1"
name: dg-clock-deadline-becomes-end
description: An intent that asks for a results line timestamped before a clock time the run will likely pass gets that time as an end of its own, an OR branch on date -u naming the full date and time, never as a deadline an element must beat
tags: [draft-goal-condition, outcome, no-network]
expected_outcome: The reply holds a paste region whose condition ends with an OR branch on date -u showing a full UTC date and time (tomorrow's 06:00Z or an earlier buffer) or later, and the condition does not require a line timestamped before that time.
execution:
  prompt: "Use the draft-goal-condition skill from the planning plugin. I want Claude to keep working through the import queue in this one session until it is empty, and before it stops, append a results line to notes/status.md timestamped before 06:00 UTC tomorrow. Some days the queue clears in an hour; some days it runs much longer. If the /goal docs page can't be fetched from here, use what I copied from it this morning: a condition should state one end state Claude can show in the conversation (for example a command it ran and that command's output), plus any constraint on how to get there, and a condition can be at most 4000 characters."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, WebFetch]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?draft-goal-condition"'
    arm: with-only
  - name: goal-line-time-is-end
    type: llm
    arm: both
    criteria: "Judge only the condition: the text the reply tells the user to paste after typing /goal (between the dashed lines, or in the fenced block after that instruction). PASS only if (1) that condition itself holds an end, offered as an alternative to the queue-empty end (an or, otherwise, alternatively, or a second labeled end state used only if the first is not reached), that is met once a clock command such as date -u shows a full UTC date and time, date included (2026-11-27T06:00Z, or an earlier buffer such as 2026-11-27T05:30Z), or later; AND (2) no element of the condition requires the results line, or anything else, to be timestamped, written or done before a clock time. FAIL if there is no paste region; if the clock end is missing from the condition, including when the reply offers it only as a clause the user may append; if the clock end names a time of day with no date, or a date already past when the run starts (earlier than the date the reply or trace states for today or tomorrow; where none is stated, earlier than 2026-11-27; any later date is acceptable); or if any element is a deadline that must be beaten, such as a timestamp earlier than 06:00Z."
