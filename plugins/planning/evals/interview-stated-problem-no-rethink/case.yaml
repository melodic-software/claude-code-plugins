schema_version: "1.1"
name: interview-stated-problem-no-rethink
description: A request that states its problem and a solution gets the problem restated and confirmed, and no rethink-or-accept question
tags: [interview, problem-framing, stated-problem, scaffold]
expected_outcome: The reply asks no rethink-or-accept question and does not question the retry wrapper as the fix; it may restate the stated problem (webhook deliveries dropped when customer endpoints return 503 during their deploys) and ask the user to confirm it now or in a later round; no Write or Edit touches PLAN.md.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the interview skill from the planning plugin, topic webhook-retry. Problem: we drop webhook deliveries when a customer's endpoint returns 503 during their deploys; logs/webhook-failures.log shows 214 dropped deliveries last week across 9 customers. Fix: add a retry wrapper around the webhook sender in src/webhooks/sender.py. I'm here and will answer."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?interview"'
    arm: with-only
  - name: confirms-without-rethink
    type: llm
    arm: both
    criteria: "PASS only if the reply does NOT ask the user whether to rethink the approach or accept the retry wrapper, does not otherwise question whether a retry wrapper is the right fix, and does not argue for a different approach. Restating the stated problem (webhook deliveries dropped when customer endpoints return 503 during deploys) and asking the user to confirm it is expected, but a first turn that asks ordinary questions without confirming the problem yet still passes, since outside lock the confirmation may come in a later round. Ordinary questions about the wrapper's details (retry count, backoff, which errors to retry) are allowed. FAIL if the reply asks a rethink-or-accept question or argues for a different approach, or if it writes a Brief or plan."
  - name: no-plan-write
    type: tool_used
    tool: Write
    input_match: 'PLAN\.md'
    min: 0
    max: 0
    arm: both
  - name: no-plan-edit
    type: tool_used
    tool: Edit
    input_match: 'PLAN\.md'
    min: 0
    max: 0
    arm: both
