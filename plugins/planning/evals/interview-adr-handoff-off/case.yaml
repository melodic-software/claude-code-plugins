schema_version: "1.1"
name: interview-adr-handoff-off
description: "domain_docs: off in docs/conventions/planning.yaml, with an architecture stand-in loaded beside planning (eval runs start with other plugins absent) so only the setting can stop the handoff: the same last-round reply as interview-adr-handoff-auto, accepting a hard-to-reverse partner-facing event id over a weighed alternative, and confirming. Grades that /architecture:adr is never invoked and that Q3's register row records an ADR candidate instead. Why hard: the decision passes the admission test and the ADR skill is listed, so the easy path hands it over anyway and ignores the repository's setting."
tags: [interview, adr, domain-docs, decision-record]
plugins: ["../..", "architecture-stub"]
expected_outcome: "/architecture:adr is not invoked; the Q3 row in .work/webhook-retries/interview-checklist.md records the decision (UUIDv7 X-Event-Id, the outbox bigint row id weighed) as an ADR candidate."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/planning:interview Add retries to the partner webhook sender. Use the topic slug `webhook-retries`.\n\nWhere we are: an engineering session. Round 1 (Q1, Q2) is answered and recorded in .work/webhook-retries/interview-checklist.md. Your round 2 asked:\n\nQ3. What identifier goes in the X-Event-Id header that partners deduplicate retries on? My recommendation: a UUIDv7 minted when the event is enqueued and stored with it. Alternatives: the outbox table's bigint row id. Partners persist this id in their own stores, so changing its shape later breaks every partner's deduplication.\n\nQ4. Who is alerted when an event exhausts its attempts? My recommendation: the integrations chat channel.\n\nMy reply: Q3: accept, UUIDv7; the row id leaks our volume and changes if we re-shard. Q4: accept. That answers every question and I have nothing to add. Confirmed: write the Brief."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: adr-not-invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:architecture:)?adr"'
    min: 0
    max: 0
    arm: with-only
  - name: q3-recorded-as-candidate
    type: regex
    pattern: '^[^\n]*\bQ3\b[^\n]*\bADR candidate\b'
    flags: mi
    arm: with-only
    target: { source: file, path: .work/webhook-retries/interview-checklist.md }
