schema_version: "1.1"
name: de-sms-channel-first-round
description: Module-scope design for adding a Twilio SMS channel to an email-only module opens with a numbered round of recommendations that each carry a Basis line, recommends containing the Twilio integration rather than abstracting it, opens a test-seam thread, and stops for the user without running the handoff gate or writing code
tags: [design, outcome, scaffold]
expected_outcome: The reply presents at least two numbered design questions each with a recommendation, at least two Basis lines labeled verified or judgment, a variation-point verdict that contains Twilio (not abstract now), and a test-seam thread. No Skill call reaches design-handoff or plan, and no Write or Edit touches a .py file.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the design skill from the planning plugin, module scope, for the topic sms-notifications: we're adding SMS through Twilio next to the existing email channel in notifications/. The Brief is in .work/sms-notifications/PLAN.md. Run the first discussion round, then wait for my answers. Don't write any code."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?design"'
    arm: with-only
  - name: numbered-recommendations
    type: regex
    pattern: '^[ \t]*(?:#{1,4}[ \t]*)?(?:\*\*)?(?:Q|T)?\d+[.):][\s\S]*?(?<!no )(?<!not )(?<!never )(?<!n''t )\brecommend[\s\S]*?^[ \t]*(?:#{1,4}[ \t]*)?(?:\*\*)?(?:Q|T)?\d+[.):][\s\S]*?(?<!no )(?<!not )(?<!never )(?<!n''t )\brecommend'
    flags: mi
    arm: both
  - name: basis-lines
    type: regex
    pattern: '\bBasis(?:\*\*)?[ \t]*:(?:\*\*)?[ \t]*(?:\*\*|_|`)?(?:verified|judgment)\b[\s\S]*\bBasis(?:\*\*)?[ \t]*:(?:\*\*)?[ \t]*(?:\*\*|_|`)?(?:verified|judgment)\b'
    flags: i
    arm: both
  - name: twilio-contained
    type: regex
    pattern: '^(?=[^\n]*\b(?:Twilio|SMS (?:provider|gateway|vendor|integration))\b)(?=[^\n]*\b(?:contain|contained|contains|containment)\b)(?![^\n]*(?<!\bnot )(?<!n''t )\babstract(?:ion)?(?: it)? now\b)(?![^\n]*\b(?:not|never|no need to|rather than|instead of|won''t|don''t)\s+(?:\w+\s+)?contain)[^\n]*'
    flags: mi
    arm: both
  - name: test-seam-thread
    type: regex
    pattern: '(?<!no )(?<!without a )\btest[- ]seams?\b|\bwhere (?:the )?(?:\w+ )?tests? (?:will |would |should )?attach'
    flags: i
    arm: both
  - name: no-gate-or-plan
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?(?:design-handoff|plan)"'
    min: 0
    max: 0
    arm: both
  - name: no-code-write
    type: tool_used
    tool: Write
    input_match: '\.py"'
    min: 0
    max: 0
    arm: both
  - name: no-code-edit
    type: tool_used
    tool: Edit
    input_match: '\.py"'
    min: 0
    max: 0
    arm: both
  - name: no-bash-code-write
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:(?:>>?|\btee\b(?:\s+-{1,2}[\w-]+)*)\s*(?:\\"|'')?[^\s"''|;&<>]*\.py\b|\b(?:sed|perl)\b(?:[^"\\|;&]|\\.)*?\s(?:-[a-zA-Z]*i|--in-place)\b(?:[^"\\|;&]|\\.)*?\.py\b|\b(?:mv|rm|truncate)\b(?:[^"\\|;&]|\\.)*?\.py\b|\b(?:cp|install|ln)\b(?:[^"\\|;&]|\\.)*?\s(?:\\"|'')?[^\s"''|;&]*\.py\b(?:\\"|'')?\s*(?:"|[|;&)]|\\n)|\bdd\b(?:[^"\\|;&]|\\.)*?\bof=[^\s"]*\.py\b|\.py\b(?:[^"\\]|\\.)*?\|\s*(?:bash|zsh|dash|sh)\b|\b(?:python3?|node|ruby|deno|bun|perl)\b(?=(?:[^"\\]|\\.)*?\.py\b)(?=(?:[^"\\]|\\.)*?(?:write|[''"][wa]\+?[''"]|\\"[wa]\+?\\"|rename|unlink|replace\(|appendFile)))'
    min: 0
    max: 0
    arm: both
