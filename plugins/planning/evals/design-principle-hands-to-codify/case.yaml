schema_version: "1.1"
name: design-principle-hands-to-codify
graders:
  - name: route-hands-to-codify
    type: regex
    pattern: '^[\s>*`_-]*ROUTE[*`_\s]*:[^\n]*corrections:codify\b'
    flags: 'im'
    target: 'last_message'
    arm: both
  - name: route-writes-no-rules-file
    type: regex
    pattern: '^[\s>*`_-]*ROUTE[*`_\s]*:(?:[^\w\n''’-]*|[^\n]*?[^\w\n''’-](?:(?!(?:not|never|without|no|nor|cannot|\w*n[''’]t)(?![\w''’-])|(?:adds?|added|adding|writes?|writing|written|puts?|putting|touch(?:es|ing)?|edits?|editing|creat(?:e|es|ing)|updates?|updating|a|an|the|any|it|its|to|into|in|line|entry|rule|than|of)(?![\w''’-]))[\w''’-]+|(?!(?:rather|instead)(?![\w''’-]))[\w''’-]+[^\w\n''’-]+(?:than|of)(?![\w''’-]))[^\w\n''’-]+)(?:(?:adds?|added|adding|writes?|writing|written|puts?|putting|touch(?:es|ing)?|edits?|editing|creat(?:e|es|ing)|updates?|updating|a|an|the|any|it|its|to|into|in|line|entry|rule)(?![\w''’-])[^\w\n''’-]+)*(?:\brules?[ -]files?\b|CLAUDE\.md|AGENTS\.md|\.claude/rules|\bown rules\b)'
    flags: 'im'
    match: 'not_contains'
    target: 'last_message'
    arm: both
  - name: no-codify-run
    type: tool_used
    tool: Skill
    input_match: '"skill":"/?(?:corrections:)?codify"'
    min: 0
    max: 0
    arm: with-only
  - name: no-unavailable-claim
    type: regex
    pattern: '^[\s>*`_-]*ROUTE[*`_\s]*:[^\n]*?corrections:codify\b[^\n]{0,80}?(?:\b(?:was not|wasn''t|is not|isn''t|not)[ \t]+(?:available|installed|loaded)\b|\bunavailable\b)'
    flags: 'im'
    match: 'not_contains'
    target: 'last_message'
    arm: both
