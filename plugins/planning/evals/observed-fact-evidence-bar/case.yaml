schema_version: "1.1"
name: observed-fact-evidence-bar
description: A brainstorm on a vague speed-up ask over a small ETL repository must tie every candidate to an observed, falsifiable fact in that repository
tags: [brainstorm, evidence]
expected_outcome: Multiple ordered candidates, each naming a file or mechanism in the repository and the observed fact that justifies it, ending with an invitation to react rather than a unilateral pick.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/planning:brainstorm we should speed up nightly ETL — I think we need a bigger warehouse or more workers."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 900
graders:
  - name: names-repo-files
    type: regex
    pattern: '(?=[\s\S]*load\.py)(?=[\s\S]*(?:transform|extract|run_nightly|config)\.py)'
    arm: both
  - name: cites-observed-fact
    type: regex
    pattern: 'BATCH_SIZE|executemany|row[- ]by[- ]row|per[- ]row|TRUNCATE|SELECT \*|full (?:reload|refresh|table)|WORKERS\s*=|linear scan|O\(n'
    flags: i
    arm: both
  - name: multiple-candidates
    type: regex
    pattern: '(?=[\s\S]*(?:^|\n)\s*(?:#+\s*|\*\*)?1[.)])(?=[\s\S]*\n\s*(?:#+\s*|\*\*)?2[.)])(?=[\s\S]*\n\s*(?:#+\s*|\*\*)?3[.)])'
    arm: both
  - name: invites-reaction
    type: regex
    pattern: '(?:resonat|react|mark (?:which|what|the)|stand out|appeal)[\s\S]{0,500}$'
    flags: i
    arm: both
  - name: no-unilateral-pick
    type: regex
    pattern: '\bI(?: have|''ve)? (?:chose|chosen|picked|selected)\b|\bI(?: will|''ll) (?:go with|proceed with|start implementing)\b'
    match: not_contains
    flags: i
    arm: both
  - name: each-candidate-grounded
    type: llm
    arm: both
    criteria: "PASS only if the answer lists several candidate approaches ordered from cheapest to most ambitious AND every candidate names a concrete file, module, or mechanism in the repository it would touch AND ties that candidate to an observed fact about the repository that reading the code could confirm or refute (for example a constant, a loop, or a query a file actually contains), not only a plausible improvement story. FAIL if any candidate is justified only by general ETL folklore, if candidates carry no repository evidence, or if the answer picks one option for the user instead of asking what resonates."
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?brainstorm"'
