schema_version: "1.1"
name: interview-skips-quick-behavior-change
description: "A behavior change whose diff is quick to review and cheap to retry is not gated by an interview; the user is told to build it, review the diff and align there. On Sonnet this case also passed with the skip rule removed from the skill, so it guards against the skill forcing an interview on a quick change and does not show that the rule causes the skip."
tags: [interview, routing, quick-change, scaffold, no-network]
expected_outcome: The reply does not treat the behavior change alone as a reason to interview; it says the change can be built directly (or makes it) and aligned on once the diff is reviewed, asks no numbered question round, writes no interview ledger, and no Write or Edit touches PLAN.md.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the interview skill from the planning plugin. Change the default page size in listUsers() from 20 to 50. It is one constant in one file, and we can flip it back in a minute if anyone complains. I'm here and will answer."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?interview"'
    arm: with-only
  - name: no-question-round
    type: regex
    pattern: '\bQ[1-9]\d*\s*[:.)\]|]|(?:^|\n)[ \t]*(?:[-*][ \t]+)?\d+[.)][ \t][^\n]*\?'
    match: not_contains
    arm: both
  - name: no-ledger-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*interview-checklist\.md"'
    min: 0
    max: 0
    arm: both
  - name: no-plan-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
  - name: no-plan-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
  - name: build-then-align
    type: llm
    arm: both
    criteria: "PASS only if the reply says the change can be built directly, or makes it, and that alignment happens on the resulting diff (review the diff, check it, flip it back if wrong), without first running an interview or asking for a Brief. FAIL if the reply treats the behavior change as a reason to interview, asks scoping or acceptance-criteria questions before building, or writes or proposes a Brief."
