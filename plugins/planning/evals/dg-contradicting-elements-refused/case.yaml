schema_version: "1.1"
name: dg-contradicting-elements-refused
description: An intent whose required elements contradict each other through a gate the repository holds, not the prompt (its one required check, in .github/workflows/required-checks.yml, fails on the hold label the intent also requires), is refused, the conflict named, and no condition requiring both is emitted. The prompt never states the gate, so only a draft that checks the elements against the repository's own gates finds it.
tags: [draft-goal-condition, outcome, no-network, scaffold]
expected_outcome: The reply names the conflict between the hold label and the required CI Status check, which fails any pull request carrying that label, asks which element gives way or offers the waiting-on-the-user OR exit for the pair, and holds no paste region whose condition requires both the hold label and every required check green.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the draft-goal-condition skill from the planning plugin. This workspace is a checkout of our release repository. I want Claude to keep going in this one session until the release pull request for branch release/2.4 is open with the hold label on it, and every required check on it is green. If the /goal docs page can't be fetched from here, use what I copied from it this morning: a condition should state one end state Claude can show in the conversation (for example a command it ran and that command's output), plus any constraint on how to get there, and a condition can be at most 4000 characters."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, WebFetch]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?draft-goal-condition"'
    arm: with-only
  - name: conflict-named
    type: regex
    pattern: '^(?![\s\S]*?\b(?:no|not|isn[''’]?t|aren[''’]?t|doesn[''’]?t|don[''’]?t|never|nothing|without)\b(?:[^\w\n]+\w+){0,3}?[^\w\n]+(?:conflict\w*|contradict\w*|incompatible|mutually exclusive)\b)(?=[\s\S]*?(?:\bhold\b[\s\S]{0,400}?(?<!\bno )(?<!\bnot a )(?<!\bwithout )(?<!\bnot )(?<!n''t )(?<!’t )(?<!\bnever )(?<!n''t a )(?<!’t a )(?<!n''t any )(?<!’t any )(?<!\bno real )(?<!\bno actual )(?<!\bnot in )(?<!\bnot a real )(?<!\bnot really )\b(?:conflict\w*|contradict\w*|can(?:no|''|’)?t (?:both|coexist|exist)|can never (?:both|be reached)|never both|incompatible|mutually exclusive|fight each other|no run (?:can )?satisf\w+ both|never be (?:green|met|satisf\w+))\b|(?<!\bno )(?<!\bnot a )(?<!\bwithout )(?<!\bnot )(?<!n''t )(?<!’t )(?<!\bnever )(?<!n''t a )(?<!’t a )(?<!n''t any )(?<!’t any )(?<!\bno real )(?<!\bno actual )(?<!\bnot in )(?<!\bnot a real )(?<!\bnot really )\b(?:conflict\w*|contradict\w*|can(?:no|''|’)?t (?:both|coexist|exist)|can never (?:both|be reached)|never both|incompatible|mutually exclusive|fight each other|no run (?:can )?satisf\w+ both|never be (?:green|met|satisf\w+))\b[\s\S]{0,400}?\bhold\b))(?=[\s\S]*?(?:\b(?:checks?|CI Status)\b[\s\S]{0,400}?(?<!\bno )(?<!\bnot a )(?<!\bwithout )(?<!\bnot )(?<!n''t )(?<!’t )(?<!\bnever )(?<!n''t a )(?<!’t a )(?<!n''t any )(?<!’t any )(?<!\bno real )(?<!\bno actual )(?<!\bnot in )(?<!\bnot a real )(?<!\bnot really )\b(?:conflict\w*|contradict\w*|can(?:no|''|’)?t (?:both|coexist|exist)|can never (?:both|be reached)|never both|incompatible|mutually exclusive|fight each other|no run (?:can )?satisf\w+ both|never be (?:green|met|satisf\w+))\b|(?<!\bno )(?<!\bnot a )(?<!\bwithout )(?<!\bnot )(?<!n''t )(?<!’t )(?<!\bnever )(?<!n''t a )(?<!’t a )(?<!n''t any )(?<!’t any )(?<!\bno real )(?<!\bno actual )(?<!\bnot in )(?<!\bnot a real )(?<!\bnot really )\b(?:conflict\w*|contradict\w*|can(?:no|''|’)?t (?:both|coexist|exist)|can never (?:both|be reached)|never both|incompatible|mutually exclusive|fight each other|no run (?:can )?satisf\w+ both|never be (?:green|met|satisf\w+))\b[\s\S]{0,400}?\b(?:checks?|CI Status)\b))'
    flags: i
    arm: both
  - name: no-goal-line-with-both
    type: regex
    pattern: '^(?![\s\S]*Type[ \t]+`/goal[ \t]*`[^\n]*\n(?:[ \t]*(?:─+|`{3,}\w*)?[ \t]*\n)*[ \t>]*(?![^\n]*\bor\b[^\n]*\bwaiting\b)(?=[^\n]*\bhold\b)(?=[^\n]*\b(?:green|pass\w*)\b)[^\n]+)[\s\S]+'
    flags: i
    arm: both
