schema_version: "1.1"
name: interview-bare-vague-explore-no-extra
description: A bare vague exploratory question gets an answer, not scoping questions or an interview
tags: [interview, bare-prompt, negative, scaffold]
expected_outcome: The reply explains what the retry code in src/ does (retries a call up to 3 times with a doubling delay on ConnectionError) without asking the user scoping questions and without starting an interview.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "what does the retry code in src/ do?"
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: answers-without-scoping
    type: llm
    arm: both
    criteria: "PASS only if the reply explains what the retry code does (with_retry calls the function up to 3 times with a doubling delay from 0.5 seconds, catching ConnectionError) and asks the user no scoping or requirements questions about a change or goal. Extra observations pass, such as a bug it found (for example that requests raises its own ConnectionError, which this except clause does not catch) or a suggested fix, and so does an optional closing offer such as 'want me to change it?'. FAIL if the reply asks questions about the problem, goal, users or scope before or instead of answering, starts an interview, or does not explain the code."
  - name: no-interview
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?interview"'
    min: 0
    max: 0
    arm: both
