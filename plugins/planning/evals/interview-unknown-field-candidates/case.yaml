schema_version: "1.1"
name: interview-unknown-field-candidates
description: A Problem field the request leaves unstated gets candidate values from the repository, each with its source, for the user to confirm or correct, instead of a bare unknown or a guess stated as fact
tags: [interview, problem-framing, unknown-field, scaffold]
expected_outcome: The reply proposes at least one candidate value for a Problem field the request did not state (for example the cost, from the 5 percent credit in docs/service-levels.md, or who and how many, from the accounts in logs/export.log), names its source, and asks the user to confirm or correct it; no Write or Edit touches PLAN.md.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the interview skill from the planning plugin, topic invoice-export-timeout. Our nightly invoice export times out for large accounts; logs/export.log shows it. Make the export finish for large accounts, because finance needs the files every morning. This is production work. I'm here and will answer."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?interview"'
    arm: with-only
  - name: proposes-candidates
    type: llm
    arm: both
    criteria: "PASS only if the reply proposes at least one candidate value for a problem field the user's request did not state (such as what the timeouts cost, who or how many accounts are affected, how often it happens, or whether it is growing), says where the value comes from (a repository file such as docs/service-levels.md or logs/export.log, or the conversation), and asks the user to confirm or correct it. The candidate may sit inside the problem restatement the user is asked to confirm. FAIL if the reply asks about such fields only as open questions with no proposed value, states a value for such a field with no source and no request to confirm it, or writes a Brief or plan."
  - name: no-plan-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
  - name: no-plan-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
