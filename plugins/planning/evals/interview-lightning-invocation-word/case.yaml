schema_version: "1.1"
name: interview-lightning-invocation-word
description: "`lightning` as the first argument word turns on the condensed style. Why hard: the default interview layout is long and familiar, so the easy path ignores the word or reads it as the topic."
tags: [interview, lightning, no-network]
expected_outcome: "Round 1 prints each question as a condensed entry (bold answer, basis after a dash) with no Context block, ending with the more-Q<N> hint."
execution:
  prompt: "/planning:interview lightning Add a nightly job that deletes expired password-reset tokens from the database."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 30
  timeout_seconds: 900
graders:
  - name: condensed-answer-line
    type: regex
    pattern: "^\\S*\\s*\\*\\*[^*\\n]{1,80}\\*\\* - \\S"
    flags: m
    arm: with-only
  - name: more-hint
    type: regex
    pattern: "say \"more Q"
    arm: with-only
  - name: no-context-block
    type: regex
    pattern: "^Context:"
    flags: m
    match: not_contains
    arm: with-only
