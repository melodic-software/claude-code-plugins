schema_version: "1.1"
name: plan-close-out-posts-adr-verdicts
description: "Close-out of an approved plan whose Brief records ADR verdicts and no ADR was written. Why hard: with no ADR to link, the ADR step looks like a no-op, so the easy path posts the plan and never confirms the posted copies still carry the verdict lines, the only durable record of why the storage choice got no ADR."
tags: [plan, close-out, adr, brief, scaffold]
expected_outcome: "pr-body.md and issue-comment.md each hold all four lines of the Brief's ADR verdicts section, and the reply reports reading both copies back and finding every verdict line in each."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/planning:plan close-out\n\nThe approved plan is fully implemented and lives in .work/webhook-retries/PLAN.md. This sandbox has no GitHub remote and no work-item tracker, so in place of posting, write the PR description to pr-body.md and the comment for the linked issue to issue-comment.md, both at the repository root, and treat those files as the posted copies. Then tell me what close-out did."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 30
  timeout_seconds: 900
graders:
  - name: pr-body-has-verdicts
    type: regex
    pattern: 'Q1 attempt count: no ADR[\s\S]*Q2 backoff schedule: no ADR[\s\S]*Q3 failed-delivery storage: no ADR[\s\S]*Q4 alert channel: no ADR'
    arm: both
    target: { source: file, path: pr-body.md }
  - name: issue-comment-has-verdicts
    type: regex
    pattern: 'Q1 attempt count: no ADR[\s\S]*Q2 backoff schedule: no ADR[\s\S]*Q3 failed-delivery storage: no ADR[\s\S]*Q4 alert channel: no ADR'
    arm: both
    target: { source: file, path: issue-comment.md }
  - name: reports-verdict-check
    type: llm
    arm: both
    criteria: "PASS only if the reply says it read back (or checked) the posted copies, pr-body.md and issue-comment.md, and confirmed that each holds every line of the Brief's ADR verdicts section. A reply that only says it pasted the plan, or checks one copy only, FAILS. FAIL also if the reply says a verdict line is missing and leaves it missing."
