schema_version: "1.1"
name: interview-prescribed-solution-rethink
description: A request that prescribes a solution and states no problem gets its problem worked back out with an evidence rating and one rethink-or-accept question, and no Brief is written
tags: [interview, problem-framing, prescribed-solution, scaffold]
expected_outcome: The reply states the problem the retry wrapper would fix (for example, webhook deliveries lost on transient endpoint failures), rates its evidence observed, reported or inferred, and asks whether to rethink the approach against that problem or accept the retry wrapper; no Write or Edit touches PLAN.md.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the interview skill from the planning plugin, topic webhook-retry: add a retry wrapper around the webhook sender in src/webhooks/sender.py. I'm here and will answer."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?interview"'
    arm: with-only
  - name: evidence-rated
    type: regex
    pattern: '(?<![a-z])(?:evidence|rating)(?![a-z])(?:[\W_]{0,6}|\s+(?:is|rated)\s+[*_]{0,2})(?:observed|reported|inferred)(?![a-z])|\([*_]{0,2}(?:observed|reported|inferred)(?![a-z])[^)\n]{0,120}\)|\b(?:problem|gap)\b[^\n.?]{0,80}\b(?:is|was|rated)\s+[*_]{0,2}(?:observed|reported|inferred)(?![a-z])'
    flags: i
    arm: both
  - name: rethink-or-accept-asked
    type: llm
    arm: both
    criteria: "PASS only if the reply states a problem that adding a retry wrapper would fix (a failure or gap, not the wrapper itself), labels how well that problem is evidenced (observed, reported or inferred), and asks the user one question that offers both choices: rethink the approach against that problem, or accept the retry wrapper as prescribed. FAIL if the reply goes straight to questions about retry count, backoff or other wrapper details without asking whether the wrapper is the right approach, if it never names the problem, or if it writes a Brief or plan."
  - name: no-plan-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
  - name: no-plan-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
