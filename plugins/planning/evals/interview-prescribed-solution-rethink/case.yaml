schema_version: "1.1"
name: interview-prescribed-solution-rethink
description: A request that prescribes a solution and states no problem gets, as the intake round's first question, one open rethink-or-accept question that asks what problem the work solves and states no inferred problem, and no Brief is written
tags: [interview, problem-framing, prescribed-solution, scaffold, no-network]
expected_outcome: Round 1's first question asks what problem the work solves, its Context names the retry wrapper and states no inferred problem or evidence rating, and its Discovery line says the answer decides whether to rethink the approach against that problem or accept the retry wrapper; no Write or Edit touches PLAN.md.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the interview skill from the planning plugin, topic webhook-retry: add a retry wrapper around the webhook sender in src/webhooks/sender.py. I'm here and will answer."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?interview"'
    arm: with-only
  - name: rethink-or-accept-asked
    type: regex
    pattern: '❓\s*[*_]{0,2}Q1:(?=[^\n]*\bwh(?:at|ich)\b[^\n?]{0,160}\bproblem\b[^\n?]{0,200}\?)(?!(?:(?!\n[^\n]{0,6}❓|\n[^\S\n]*---)[\s\S])*?(?:\([*_`]{0,2}(?:observed|reported|inferred)\b|\b(?:evidence|rating|rated)\b\W{0,6}(?:is\s+)?[*_`]{0,2}(?:observed|reported|inferred)\b))(?:(?!\n[^\n]{0,6}❓|\n[^\S\n]*---)[\s\S])*?\n[^\S\n]*[*_]{0,2}Discovery:(?=[^\n]*\brethink)(?=[^\n]*\b(?:accept|keep|go (?:ahead )?with|proceed with|stick with)\s+(?:the\s+)?(?:named\s+|prescribed\s+)?(?:retry\s+)?(?:solution|approach|it|wrapper)\b)'
    flags: i
    arm: both
  - name: no-plan-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
  - name: no-plan-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
