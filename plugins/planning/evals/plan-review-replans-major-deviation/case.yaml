schema_version: "1.1"
name: plan-review-replans-major-deviation
description: A plan review invoked after implementation stopped reads the DEVIATIONS.md beside the plan, treats its Major entry as a falsified load-bearing assumption, and re-plans the phase for re-approval instead of only grading completeness
tags: [plan, review, deviations, assumptions, scaffold]
expected_outcome: The plan skill fires in review mode, reads .work/photo-backup/DEVIATIONS.md, names its Major entry (the storage SDK has no batch upload), marks the batch-upload load-bearing assumption falsified, re-checks that the revised phases still serve the Brief's Problem of lost photos, revises Phase 2 to upload one file per call, and asks for approval of the revised plan. It edits no .py file.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/planning:plan review The plan is .work/photo-backup/PLAN.md. Implementation stopped during Phase 2. Show me the result and stop at any approval request."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent, Write, Edit]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: reads-deviations
    type: tool_used
    tool: Read
    input_match: 'photo-backup/DEVIATIONS\.md'
    arm: both
  - name: revises-upload
    type: regex
    pattern: '(?:#{2,4}[ \t]*Phase 2:[^\n]*|\brevised Phase 2\b[^\n]*|\bPhase 2 \(revised\)[^\n]*)(?:\n[^\n]*){0,5}?\b(?:upload_file|one (?:file|photo) (?:per|at a time)|per[- ](?:file|photo))\b'
    flags: i
    arm: both
  - name: no-code-edit
    type: tool_used
    tool: Edit
    input_match: '\.py"'
    min: 0
    max: 0
    arm: both
  - name: replan-judge
    type: llm
    arm: both
    criteria: "PASS only if the answer names the Major DEVIATIONS.md entry (the storage SDK has no batch upload), says the plan's batch-upload load-bearing assumption is false, confirms the revised plan still serves the Brief's Problem of photos lost when a laptop fails, revises Phase 2 to upload photos one file per call (or an equivalent that meets the acceptance criteria without a batch call), and asks the user to approve the revised plan before implementation resumes. FAIL if it only lists completeness gaps against the template, tells implementation to continue with the batch call, or never mentions the deviation."
