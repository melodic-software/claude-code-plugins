schema_version: "1.1"
name: interview-reported-problem-instance-question
description: A stated problem whose only evidence is what support reported gets one instance question (last concrete instance, what it cost, who hit it), never a why chain and never a question reopening the named solution
tags: [interview, problem-framing, reported-evidence, scaffold]
expected_outcome: The reply asks the user, in one question, for the last concrete time the CSV export was slow, what it cost or how long it took, and which customer hit it; it asks no chain of why questions, does not ask whether to keep or replace streaming, and no Write or Edit touches PLAN.md.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the interview skill from the planning plugin, topic csv-export-speed. Problem: support tells me customers say the CSV export of their order history is too slow. Fix: stream the export instead of building it in memory in src/export/orders.py. I want it fixed because those complaints take up support's time. This is production work. I'm here and will answer."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?interview"'
    arm: with-only
  - name: one-instance-question
    type: llm
    arm: both
    criteria: "PASS only if the reply asks the user for a concrete instance of the slow export: at least one of the last time it happened, how long it took or what it cost, or which customer or account hit it. FAIL if (a) the reply asks for no such instance, (b) it asks for the instance in two or more separately numbered questions, (c) it asks a chain of why questions about the problem (for example why slowness matters, then why customers export), (d) it asks whether to keep streaming or rethink or replace it, or recommends a different approach, or (e) it writes a Brief or plan. Questions about the streaming fix's details (chunk size, which endpoint, file size limits) pass, and so does a request to confirm the restated problem."
  - name: no-plan-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
  - name: no-plan-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
