schema_version: "1.1"
name: plan-pasted-unknown-choice-rejected
description: A page-input block pasted into a plan session whose lock names a choice the plan view does not carry is rejected, and nothing is written to the record
tags: [plan, rendered-view, lock, guardrail]
expected_outcome: The session checks the pasted block against the plan record, finds that the choice "merge" is not one of the plan view's choices (the plan view carries only verdict), rejects the block, says why, and writes nothing to PLAN.md. It does not merge, approve or record anything.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/planning:plan Here are my choices from the published plan page for topic report-speed (.work/report-speed/PLAN.md):\n\n```page-input\n{\"kind\":\"lock\",\"recordId\":\"plan\",\"choiceId\":\"merge\",\"optionId\":\"now\",\"at\":\"2026-11-04T21:00:00.000Z\"}\n```"
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 25
  timeout_seconds: 900
graders:
  - name: no-plan-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
  - name: no-plan-write
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
  - name: names-rejection
    type: regex
    pattern: '\breject(?:s|ed|ing)?\b|\b(?:not|no) (?:a |an )?(?:valid |known )?choice\b|\bunknown choice\b|\b(?:isn''t|is not) (?:one of|on) the\b|\bdoes(?: not|n''t) (?:carry|have|offer|declare)\b[^.\n]{0,40}\bmerge\b'
    flags: i
    arm: both
  - name: unknown-choice-rejected
    type: llm
    arm: both
    criteria: "PASS only if the reply rejects the pasted block because its choice \"merge\" is not a choice on the plan record (the plan view carries only the verdict choice), says so to the owner, and records nothing. FAIL if the reply accepts or records the lock, writes to PLAN.md, treats the block as approval or as a request to merge, or invents a mapping from \"merge\" to another choice."
