schema_version: "1.1"
name: interview-lightning-confirmation-full
description: "Lightning condenses rounds but never the confirmation gate: with every question answered, the restatement opens with the problem and asks for confirmation. Why hard: a condensed session pulls toward a one-line wrap-up."
tags: [interview, lightning, no-network]
expected_outcome: "The reply is the confirmation restatement in full, opening with the problem and asking the user to confirm."
execution:
  prompt: "/planning:interview lightning Add a nightly job that deletes expired password-reset tokens from the database. Use the topic slug `token-cleanup`.\n\nWhere we are: rounds 1 and 2 are answered. Problem: expired reset tokens accumulate and are never removed. Quality bar: production. Schedule: 03:00 UTC. Retention: delete at expiry. Owner: the platform team. Every question is answered and I have nothing to add. Wrap up."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 30
  timeout_seconds: 900
graders:
  - name: confirmation-in-full
    type: regex
    pattern: "\\bProblem\\b[\\s\\S]*\\bconfirm\\b"
    flags: i
    arm: with-only
