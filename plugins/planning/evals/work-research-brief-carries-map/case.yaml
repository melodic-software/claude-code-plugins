schema_version: "1.1"
name: work-research-brief-carries-map
description: Working a research item, the brief handed to the research step carries the map's destination, its decisions so far, and its out-of-scope lines, not the item alone
tags: [wayfind, pocock-33]
expected_outcome: The brief for 'Pick the change-feed wire format' names the destination (a push-based shipment feed for three partners before the 2027 Q3 peak), at least one settled decision (the Debezium change source on Postgres logical replication), and the exclusion of partner client SDKs.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the wayfind skill in work mode on our decision map 'Map: partner shipment feed' (#300). The tracker is unreachable from here, so I exported the map issue and its sub-issues to the files under tracker-export/ in the working directory; read those instead of calling the tracker, and do not try to claim anything. Take the research item 'Pick the change-feed wire format' (#306). Before any research runs, show me the exact brief you would hand the research subagent, then stop."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 900
graders:
  - name: names-settled-change-source
    type: regex
    pattern: 'Debezium|logical replication'
    flags: i
    arm: both
  - name: names-destination
    type: regex
    pattern: 'Q3|peak|Northwind|Blue Heron|Kestrel|three (?:logistics )?partners|CSV drop|nightly (?:partner )?CSV'
    flags: i
    arm: both
  - name: names-sdk-exclusion
    type: regex
    pattern: '(?:SDK|client (?:librar|code))(?:(?!,\s*(?:but|while|whereas|although|though|however|separately|yet)\b|(?:,\s*|\s+)and\s+(?:the|a|an|our|we|they|it|this|that|its|their)\b)[^.!?;\n]){0,200}(?:out of scope|out-of-scope|excluded|exclusion|not (?:in scope|ship|build|provide)|never ship|won''t ship|will not ship)|(?:out of scope|out-of-scope|excluded|exclusion|not (?:in scope|ship|build|provide)|never ship|won''t ship|will not ship)(?:\s*:(?:(?!,\s*(?:but|while|whereas|although|though|however|separately|yet)\b|,\s*and\s+(?:the|a|an|our|we|they|it|this|that|its|their)\b)[^.!?;\n]){0,200}(?:SDK|client (?:librar|code))(?![^.!?;,\n]*\bin scope\b)|(?:(?!,\s*(?:but|while|whereas|although|though|however|separately|yet)\b|(?:,\s*|\s+)and\s+(?:the|a|an|our|we|they|it|this|that|its|their)\b)[^.!?;\n]){0,200}(?:SDK|client (?:librar|code)))|(?:^|\n)[ \t]*(?:#+[ \t]*|\*\*)?(?:out of scope|out-of-scope|exclusions?)[*_:]*[ \t]*\n\s*(?:(?:[-*+]|\d+\.)[^\n]*\n\s*){0,5}(?:[-*+]|\d+\.)[^\n]*?(?:SDK|client (?:librar|code))'
    flags: i
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?wayfind"'
