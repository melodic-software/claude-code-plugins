schema_version: "1.1"
name: brainstorm-react-records-criteria
description: At the reaction step, a brainstorm records the reason a candidate resonates as a criterion and asks why when the user gave none
tags: [brainstorm, react, criteria]
expected_outcome: The reply records "no new service to run" as a criterion for candidate 2, asks why candidate 5 resonates, and does not pick a candidate for the user.
execution:
  prompt: "/planning:brainstorm topic report-speed. Intake is done: the reports page takes 40 seconds for large accounts, and I want it under 5 because account managers open it in client calls. Your candidates were: 1. add an index on report_rows.account_id; 2. cache the rendered report for an hour; 3. paginate the table; 4. precompute daily aggregates; 5. move reports to a separate read replica; 6. rewrite reports on a columnar store. 2 and 5 resonate. 2 because we can't run another service."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: records-no-new-service-criterion
    type: regex
    arm: both
    flags: i
    pattern: '\b(?:criteri(?:on|a)|requirements?|constraints?)\b[^.!?]{0,200}?(?:\bno (?:new |other |another |extra |additional |second )?services?\b|\b(?:can(?:no|''|’)t|can not) run (?:another|a new|an extra|any new|a second) service|\bwithout (?:a |any )?(?:new |another |extra )?service)|(?:\bno (?:new |another |extra |additional )?services?\b|\b(?:can(?:no|''|’)t|can not) run (?:another|a new|an extra|any new) service)(?:[^.!?\n]{0,120}|[^.!?\n]{0,60}\.\s+(?:that|this|it)\b[^.!?\n]{0,60})\b(?:criteri(?:on|a)|requirements?|constraints?)\b'
  - name: asks-why-candidate-5
    type: regex
    arm: both
    flags: i
    pattern: '(?:\b(?:candidate|option|idea|approach)\s*#?5\b|\(5\)|#5\b|\breplica\b)[\s\S]{0,300}?\b(?:why(?!\s+not\b)|what)\b[^?\n.]{0,120}?\b(?:it|replica|resonat\w*|draws?|appeals?|attracts?|like about|offers?|give you|gives you|buy you|buys you|5(?!\s*(?:s\b|sec)))\b[^?\n]{0,200}\?|(?:\bwhy\b(?!\s+not\b)|\bwhat\b[^?\n]{0,60}\b(?:draws?|appeals?|attracts?|resonat\w*|like about|offers?|give you|gives you|buy you|buys you)\b)[^?\n]{0,200}(?:\b(?:candidate|option|idea|approach)\s*#?5\b|\(5\)|#5\b|\breplica\b|\b5\b(?!\s*(?:s\b|sec)))[^?\n]{0,100}\?'
  - name: does-not-decide-for-user
    type: llm
    arm: both
    criteria: "The user marked candidates 2 and 5 as resonating and gave a reason only for 2 (they cannot run another service). PASS if the reply neither records a reason for candidate 5 that the user never gave nor chooses one candidate for the user. FAIL if it records an invented reason for candidate 5 as the user's criterion, or picks a candidate for the user instead of leaving the choice to them."
