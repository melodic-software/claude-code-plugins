schema_version: "1.1"
name: interview-lock-restates-problem
description: Under lock, a task that states its problem still gets a one-line problem restatement and one confirmation question before any Brief is written
tags: [interview, problem-framing, lock, scaffold]
expected_outcome: The reply restates the problem (the nightly invoice export timing out for accounts with more than 10,000 invoices) in one line and asks the user to confirm it with a yes, and no Write or Edit touches PLAN.md.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the interview skill from the planning plugin with the lock action, topic invoice-export-timeout. Our nightly invoice export times out for accounts with more than 10,000 invoices: logs/export.log shows the timeouts, and support has three tickets about it this month. Make the export finish for large accounts. I'm clear, lock the brief. I'm here and will answer."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?interview"'
    arm: with-only
  - name: restates-problem-and-asks
    type: regex
    pattern: '^(?=[\s\S]*\bproblem\b[\s\S]{0,300}\b(?:time[sd]?[ -]?outs?|timing out|large accounts?|10,?000)\b)(?=[\s\S]*(?:\b(?:confirm|yes|correct|right|accurate)\b[^\n]{0,160}\?|\?[^\n]{0,40}\b(?:yes|confirm)))'
    flags: i
    arm: both
  - name: no-plan-write
    type: tool_used
    tool: Write
    input_match: 'PLAN\.md'
    min: 0
    max: 0
    arm: both
  - name: no-plan-edit
    type: tool_used
    tool: Edit
    input_match: 'PLAN\.md'
    min: 0
    max: 0
    arm: both
