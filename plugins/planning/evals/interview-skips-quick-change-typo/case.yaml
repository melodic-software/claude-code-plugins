schema_version: "1.1"
name: interview-skips-quick-change-typo
description: "A comment typo fix, quick to review and cheap to retry, is not gated by an interview; the user is told it needs no interview or Brief. On Sonnet this case also passed with the skip rule removed from the skill, so it guards against the skill forcing an interview on a quick change and does not show that the rule causes the skip."
tags: [interview, routing, quick-change, scaffold]
expected_outcome: The reply treats the typo fix as quick to review and cheap to retry and says it needs no interview or Brief (it may make the fix itself); it asks no numbered question round, writes no interview ledger, and no Write or Edit touches PLAN.md.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Use the interview skill from the planning plugin. I need to fix a single spelling typo in a code comment in src/utils.ts, no behavior change, just correcting one misspelled word. I'm here and will answer."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 900
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:planning:)?interview"'
    arm: with-only
  - name: no-question-round
    type: regex
    pattern: '\bQ[1-9]\d*\s*[:.)\]|]|(?:^|\n)[ \t]*(?:[-*][ \t]+)?\d+[.)][ \t][^\n]*\?'
    match: not_contains
    arm: both
  - name: no-ledger-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*interview-checklist\.md"'
    min: 0
    max: 0
    arm: both
  - name: no-plan-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
  - name: no-plan-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*PLAN\.md"'
    min: 0
    max: 0
    arm: both
  - name: says-no-interview-needed
    type: llm
    arm: both
    criteria: "PASS only if the reply tells the user this typo fix does not need an interview or a Brief (in any wording: too small to interview, just fix it, no spec needed), whether or not it also makes the fix. FAIL if the reply starts an interview, asks scoping or acceptance-criteria questions about the fix, or writes or proposes a Brief for it."
