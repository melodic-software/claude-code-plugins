# session-bridge settings for watch.sh and wake.sh (both generated from lib/session-bridge/).
# NAME names the session files and the token header; it matches NAME in server.py.
NAME=interview
# The control script beside watch.sh: ensure-running, stop, lease, and apply for wake.sh.
CONTROL=round.sh
# A control subcommand wake.sh runs after each apply: it compares the page with its ledger.
AFTER_APPLY=ledger-check
