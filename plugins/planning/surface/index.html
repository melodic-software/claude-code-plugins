<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="interview-token" content="%%TOKEN%%">
<title>Interview</title>
<link rel="icon" href="data:,">
<style>
:root{
  color-scheme:light;
  --ground:#f3f4f6; --panel:#ffffff; --ink:#1a2130; --muted:#5d6678; --faint:#657082;
  --line:#dde1e8; --line-strong:#c6ccd6; --accent:#2f5d8a; --accent-soft:#e6eef7;
  --ok:#2d7a4b; --ok-soft:#e3f2e8; --chg:#9a5b00; --chg-soft:#fbefd9;
  --def:#62489a; --def-soft:#eee8f8; --wait:#5f6878; --wait-soft:#eceef1;
  --warn:#a3382b; --warn-soft:#fbe7e4; --res:#0f766e; --res-soft:#dcf2ef;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --rail-w:310px; --fly-w:440px; --strip-w:42px; --min-text:14px;
  --pad:18px; --gap:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#12151b; --panel:#1a1f27; --ink:#e7eaf0; --muted:#a3abb9; --faint:#8b93a2;
    --line:#2a313c; --line-strong:#3a4250; --accent:#8fb6e0; --accent-soft:#1f2c3b;
    --ok:#7fcf9c; --ok-soft:#18301f; --chg:#f0b766; --chg-soft:#35270f;
    --def:#b9a3ec; --def-soft:#2a2240; --wait:#9aa1ad; --wait-soft:#232830;
    --warn:#f09a8c; --warn-soft:#3a1d19; --res:#5fd3c4; --res-soft:#12302d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#12151b; --panel:#1a1f27; --ink:#e7eaf0; --muted:#a3abb9; --faint:#8b93a2;
  --line:#2a313c; --line-strong:#3a4250; --accent:#8fb6e0; --accent-soft:#1f2c3b;
  --ok:#7fcf9c; --ok-soft:#18301f; --chg:#f0b766; --chg-soft:#35270f;
  --def:#b9a3ec; --def-soft:#2a2240; --wait:#9aa1ad; --wait-soft:#232830;
  --warn:#f09a8c; --warn-soft:#3a1d19; --res:#5fd3c4; --res-soft:#12302d;
}
body.comfy{--pad:24px; --gap:20px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 var(--sans);overflow:hidden}
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:12px;padding:14px 16px 12px;max-width:1600px;margin:0 auto}
header.top{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;border-bottom:1px solid var(--line-strong);padding-bottom:8px}
.hrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.hrow2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-height:28px;font-size:13px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#roundLbl:not(:empty)+#eyebrow:not(:empty)::before{content:" \00b7  "}
.mlink{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.mlink.sep::before{content:"\00b7  ";color:var(--faint)}
#pendBtn{color:var(--res)}
.cline{flex:1 1 12em;min-width:0;text-align:left;border:0;background:none;padding:2px 0;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cline .age{color:var(--faint);font:12px var(--mono);margin-left:6px}
.cline .age:empty{display:none}
.notice{display:flex;gap:8px;align-items:center;margin-left:auto;border:1px solid var(--chg);background:var(--chg-soft);border-radius:6px;padding:3px 8px;max-width:55%;white-space:nowrap}
.notice[hidden]{display:none}
.notice span{overflow:hidden;text-overflow:ellipsis}
#reBanner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
#reBanner[hidden],.ntoast[hidden]{display:none}
.ntoast{position:fixed;left:16px;bottom:16px;z-index:40;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:min(440px,calc(100vw - 32px));border:1px solid var(--chg);background:var(--panel);border-radius:8px;padding:8px 12px;box-shadow:0 4px 18px rgba(0,0,0,.25);font-size:13.5px;pointer-events:none}
.ntoast button{pointer-events:auto}
.rediff .diff{white-space:pre-wrap;max-height:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{font:600 26px/1.1 var(--display);margin:6px 0 0;text-wrap:balance}
.hright{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:flex-end}
.meter{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.meter button{white-space:nowrap}
.meter button.long{white-space:normal;text-align:left;max-width:100%}
.bar{width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.pill{display:inline-flex;align-items:center;gap:7px;font:500 12.5px/1 var(--sans);padding:6px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);background:var(--panel)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.listening{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.listening::before,.pill.working::before{animation:pulse 1.6s ease-in-out infinite}
.pill.reading,.pill.working{color:var(--chg);border-color:var(--chg);background:var(--chg-soft)}
.pill.idle{color:var(--wait);background:var(--wait-soft)}
.pill.offline{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
@keyframes pulse{50%{opacity:.35}}
button{font:inherit;color:inherit}
.tbtn{font:500 13px var(--sans);padding:5px 10px;border-radius:6px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);cursor:pointer}
.tbtn:hover:not(:disabled){border-color:var(--ink)}
.tbtn:disabled{opacity:.45;cursor:not-allowed}
.tbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tbtn.primary{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.tbtn.small{font-size:12px;padding:2px 7px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.layout{position:relative;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr) var(--strip-w);gap:var(--gap);min-height:0}
.layout.pinned{grid-template-columns:var(--rail-w) minmax(0,1fr) var(--fly-w) var(--strip-w)}
.layout.norail{grid-template-columns:minmax(0,1fr) var(--strip-w)}
.layout.norail.pinned{grid-template-columns:minmax(0,1fr) var(--fly-w) var(--strip-w)}
.layout.norail nav.rail{display:none}

nav.rail{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;min-height:0}
.toolbar{display:grid;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 4px;font:500 12.5px var(--sans);cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.trow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--muted)}
.trow select{font:12.5px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:5px;padding:3px 4px}
.order-note{font:500 11.5px/1.3 var(--mono);color:var(--faint)}
.rail-list{overflow-y:auto;overscroll-behavior:contain;display:grid;align-content:start;gap:12px;padding:2px 6px 24px 2px}
.sumbtn{width:100%;text-align:left;border:1px dashed var(--line-strong);border-radius:6px;background:transparent;padding:7px 10px;font:500 13px var(--sans);cursor:pointer;color:var(--muted)}
.sumbtn[aria-current="true"]{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sumbtn.done{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.sec{display:grid;gap:6px}
.sec-top{display:flex;align-items:center;gap:6px}
.sec-h{display:flex;align-items:center;gap:8px;flex:1;min-width:0;border:0;background:none;padding:2px 0;cursor:pointer;text-align:left;color:var(--muted)}
.sec-h .caret{font:12px var(--mono);width:12px;transition:transform .15s}
.sec[data-collapsed="true"] .caret{transform:rotate(-90deg)}
.sec-h h2{font:500 12px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;margin:0;flex:1}
.sec-h .cnt{font:500 11.5px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.sec.pin .sec-h h2{color:var(--chg)}
.sec.locked .sec-h h2{color:var(--faint)}
.sec-hint{font-size:12px;color:var(--faint);margin:-2px 0 0 20px}
.lock{font:500 11.5px var(--mono);color:var(--wait);margin:-2px 0 0 20px}
.qlist{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.sec[data-collapsed="true"] .qlist,.sec[data-collapsed="true"] .sec-hint{display:none}
.qbtn{width:100%;text-align:left;display:grid;grid-template-columns:3.2ch minmax(0,1fr);gap:2px 10px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;position:relative}
.qbtn:hover{border-color:var(--line-strong)}
.qbtn[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.qbtn.dim{opacity:.55}
.qbtn.archived{filter:grayscale(1)}
.qid{font:600 13px var(--mono);grid-row:1;align-self:start;padding-top:1px;max-width:8ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbody{min-width:0;display:flex;flex-direction:column;gap:2px}
.qtitle{font-size:13.5px;line-height:1.35}
.qmeta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;min-width:0}
.qmeta .chip{white-space:normal;overflow-wrap:anywhere;line-height:1.3;max-width:100%}
.needs{font:11.5px var(--mono);color:var(--faint);display:flex;gap:4px;align-items:center}
.needs::before{content:"";width:9px;height:8px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;margin-top:-5px}
.needs.unmet{color:var(--chg)}
.newdot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--chg)}
.tree{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.tree .tree{margin:5px 0 0 12px;padding-left:10px;border-left:1.5px solid var(--line-strong)}
.tree .qbtn.onpath{border-color:var(--accent)}
.tree .qbtn.onpath .qtitle{font-weight:600}
.tree .also{font:11px var(--mono);color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--mono);padding:4px 7px;border-radius:4px;white-space:nowrap}
.chip::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:currentColor}
.s-open{color:var(--accent);background:var(--accent-soft)}
.s-accept,.s-hedged{color:var(--ok);background:var(--ok-soft)}
.s-alt,.s-own{color:var(--chg);background:var(--chg-soft)}
.s-defer{color:var(--def);background:var(--def-soft)}
.s-sup,.s-arch,.s-blocked{color:var(--wait);background:var(--wait-soft)}
.s-wait{color:var(--res);background:var(--res-soft)}
.s-need{color:var(--warn);background:var(--warn-soft)}
.qbtn.st-wait{border-left:3px solid var(--res)}
.qbtn.st-need{border-left:3px solid var(--warn)}
.qprev{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.waitban{border-left:3px solid var(--res);background:var(--res-soft);padding:9px 14px;border-radius:0 6px 6px 0;font-size:14px}
.waitban.need{border-color:var(--warn);background:var(--warn-soft)}
.sec.fresh{outline:2px solid var(--chg);outline-offset:3px;border-radius:6px}
.latest{border-left:3px solid var(--accent);padding:6px 12px;font-size:14px;max-width:80ch}
.latest .who{font:500 12.5px var(--sans);color:var(--muted)}
.act-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.act-list li{display:grid;gap:2px;font-size:13.5px;border-left:2px solid var(--line);padding-left:10px}
.act-list li.unseen{border-color:var(--chg)}
.act-h,#actLog>summary{font:500 12px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:12px 0 8px}
#actLog>summary{cursor:pointer}
#actLog[open]>summary{margin-bottom:10px}
.nudge-q{font-size:13px;color:var(--chg);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ustate textarea{display:block;width:100%;margin-top:8px;min-height:56px}
.chip.plain{color:var(--muted);background:transparent;border:1px solid var(--line-strong)}
.chip.plain::before{display:none}
.chip.hot{color:var(--chg);background:transparent;border:1px solid var(--chg)}
.chip.hot::before{display:none}
.chip.aside{color:var(--muted);background:none;border:0;padding-inline:0;font-style:italic;cursor:default}
.chip.aside::before{display:none}

main.detail{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0;overflow:hidden}
.dscroll{overflow-y:auto;overscroll-behavior:contain;padding:18px var(--pad) 22px;display:grid;align-content:start;gap:16px;overflow-wrap:anywhere}
.dscroll.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
.dhead{display:grid;gap:6px}
.dids{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:500 13px var(--mono);color:var(--muted)}
.dids b{font:600 20px var(--mono);color:var(--ink)}
.dids .grow{flex:1}
.dhead h3{font:600 22px/1.25 var(--display);margin:0;text-wrap:balance;max-width:48ch}
.youans{margin:4px 0 0;font-size:13px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.links span{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.ref{display:inline-flex;gap:5px;align-items:baseline;border:1px solid var(--line-strong);background:var(--ground);border-radius:4px;padding:1px 6px;font:13px var(--sans);cursor:pointer;color:var(--ink)}
.ref b{font:600 12px var(--mono)}
.rrange{display:inline-flex;align-items:baseline;gap:3px;white-space:nowrap;border:1px solid var(--line-strong);background:var(--ground);border-radius:4px;padding:0 3px}
.rrange .ref{border:0;background:none;padding:1px 3px}
.rrange .ref:hover{border:0;text-decoration:underline}
.ref:hover{border-color:var(--accent)}
.sup-banner,.banner,.lockban{border-left:3px solid var(--chg);background:var(--chg-soft);padding:9px 14px;border-radius:0 6px 6px 0;font-size:14px}
.sup-banner,.lockban{border-color:var(--wait);background:var(--wait-soft)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:9px 14px;border-radius:0 6px 6px 0;font-size:14px}
section.blk{display:grid;gap:8px}
section.blk>h4,details.more>summary{font:500 12px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
details.more{display:grid;gap:12px}
details.more>summary{cursor:pointer;padding:4px 0}
details.more[open]>summary{margin-bottom:10px}
details.more>section+section{margin-top:12px}
.md{max-width:72ch}
.md p{margin:0 0 .5em}.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 .5em;padding-left:20px}
.md blockquote{margin:0 0 .5em;padding:2px 0 2px 12px;border-left:3px solid var(--line-strong)}
.md h3,.md h4,.md h5{font:600 16px var(--sans);margin:.6em 0 .3em}
code{font:13px var(--mono);background:var(--ground);padding:1px 4px;border-radius:3px}
a{color:var(--accent)}
.recbox{border:1px solid var(--ok);background:var(--ok-soft);border-radius:6px;padding:10px 16px;max-width:80ch;display:grid;gap:6px}
details.why summary{cursor:pointer;font:500 12.5px var(--mono);color:var(--muted)}
details.why .md{margin-top:6px;font-size:14px}
.crows{display:grid;gap:4px;max-width:80ch}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13.5px}
.crow input{margin:0;accent-color:var(--ok)}
.crow.ok{border-color:var(--ok);background:var(--ok-soft)}
.md pre{margin:0 0 .5em;overflow:auto;background:var(--ground);padding:8px 10px;border-radius:4px}
.md pre code{padding:0;background:none}
.assume{font:500 12.5px var(--mono);color:var(--chg)}
.pill code{font-size:12px;background:none;padding:0}
/* A grid track sized auto grows to its widest unbreakable child; every single-column grid caps it at the container. */
nav.rail,.toolbar,.rail-list,.sec,.qlist,.tree,.act-list,.act-list li,main.detail,.dscroll,.dhead,section.blk,details.more,.recbox,.crows,.alts,ol.hist,ol.hist li,section.answer,.choices,.compose,.conflict,aside.fly,.fhead,.fbody,.nthread,.nmsg,.fs,ul.loose{grid-template-columns:minmax(0,1fr)}
.alts{display:grid;gap:8px;max-width:80ch}
.alt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.alt .k{font:600 13px var(--mono)}
.alt.chosen{border-color:var(--chg);background:var(--chg-soft)}
ol.hist{list-style:none;margin:0;padding:0 0 0 14px;display:grid;gap:10px;border-left:2px solid var(--line)}
ol.hist li{font-size:13.5px;position:relative;display:grid;gap:2px}
ol.hist li::before{content:"";position:absolute;left:-19px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
ol.hist li.by-claude::before{background:var(--accent)}
ol.hist li.by-term::before{background:var(--chg)}
ol.hist li.undone .hb{text-decoration:line-through;color:var(--faint)}
.hl{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.hl .who{font:500 12.5px var(--sans);color:var(--muted)}
.hl .dot{color:var(--faint)}
.hl time{font:12px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.rcpt{display:inline-flex;gap:6px;flex-wrap:wrap;font:11.5px var(--mono);color:var(--faint)}
.rcpt span.on{color:var(--ok)}
.rcpt span.no{color:var(--chg)}
.empty{color:var(--faint);font-size:14px}

section.answer{border-top:1px solid var(--line-strong);background:var(--panel);padding:10px var(--pad) 10px;display:grid;gap:8px;box-shadow:0 -6px 14px -12px rgba(0,0,0,.25)}
section.answer[hidden]{display:none}
.cur{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;min-height:22px}
.cur q{color:var(--muted)}
.cur .when{font-size:12.5px;color:var(--faint)}
.cur .earlier{flex:1 0 100%;display:grid;gap:2px;max-height:9em;overflow-y:auto;overflow-wrap:anywhere}
.cur .earlier q{white-space:pre-wrap;color:var(--ink)}
.cur .aside-why{flex:1 1 20em}
.agrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}
fieldset{border:1px solid var(--line);border-radius:6px;margin:0;padding:6px 10px 8px;min-width:0}
legend{font:500 11.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.choices{display:grid;gap:4px;max-height:26vh;overflow-y:auto;padding:2px}
.choice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:13.5px}
.choice:hover{border-color:var(--line-strong)}
.choice input{margin:0;accent-color:var(--accent)}
.choice .t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.choice.armed{border-color:var(--accent);background:var(--accent-soft)}
.choice.rec .t b{color:var(--ok)}
.choice .yours{font-size:11px;font-weight:600;color:var(--accent);margin-right:6px}
.choices.nudge{animation:flash 1.2s ease-out}
.arow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.compose{display:grid;gap:8px}
textarea{width:100%;min-height:64px;max-height:40vh;resize:none;overflow-y:auto;font:14px/1.5 var(--sans);color:var(--ink);background:var(--ground);border:1px solid var(--line-strong);border-radius:6px;padding:8px 12px}
button.act{font:500 13.5px var(--sans);padding:6px 12px;border-radius:6px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
button.act:hover:not(:disabled){border-color:var(--ink)}
button.act.primary{background:var(--ok);border-color:var(--ok);color:var(--panel)}
button.act.soft{color:var(--accent);border-color:var(--accent)}
button.act:disabled{opacity:.45;cursor:not-allowed}
.talk .arow{margin-top:2px}
.toast{font-size:13px;color:var(--ok);min-height:1.2em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast.bad{color:var(--warn)}
.kbd{font:11.5px var(--mono);color:var(--faint)}
.conflict{border:1px solid var(--chg);background:var(--chg-soft);border-radius:6px;padding:8px 12px;display:grid;gap:6px;font-size:13.5px}
.conflict[hidden]{display:none}
.diff{max-height:18vh;overflow:auto;background:var(--panel);border-radius:4px;padding:6px 8px;font-size:13px}
.diff del{color:var(--warn);background:var(--warn-soft)}
.diff ins{color:var(--ok);background:var(--ok-soft);text-decoration:none}

.strip{display:flex;flex-direction:column;gap:6px;align-items:center;padding-top:2px}
.strip button{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);cursor:pointer;position:relative}
.strip button:hover{border-color:var(--line-strong);color:var(--ink)}
.strip button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.strip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.strip .badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--chg);color:var(--panel);font:600 10px/16px var(--mono);padding:0 3px}
.strip hr{width:24px;border:0;border-top:1px solid var(--line);margin:2px 0}

aside.fly{display:none;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;min-height:0;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
aside.fly.open{display:grid;position:absolute;top:0;right:calc(var(--strip-w) + var(--gap));bottom:0;width:min(var(--fly-w),calc(100% - var(--strip-w) - 40px));box-shadow:-10px 0 30px -18px rgba(0,0,0,.45);animation:slide .2s ease-out;z-index:5}
.layout.pinned aside.fly.open{position:static;width:auto;box-shadow:none;animation:none}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.fhead{display:grid;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.frow{display:flex;gap:6px;align-items:center}
.frow .ttl{flex:1;font:500 12px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{border:1px solid var(--line);background:var(--ground);border-radius:5px;padding:4px 8px;font:12.5px var(--sans);cursor:pointer}
.tgroup{margin-bottom:6px}
.tgh{font:600 11px var(--mono);color:var(--faint);margin-bottom:3px}
.tabs button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.fbody{overflow:auto;padding:12px 14px;display:grid;gap:10px;align-content:start;overflow-wrap:anywhere}
.fbody .md,.fsstage .md{font-size:max(var(--min-text),14px)}
.fbody iframe{width:100%;height:min(56vh,420px);border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.fscope{font:11.5px var(--mono);color:var(--faint)}
.vimg{max-width:100%}
.gstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.gstrip button{flex:none;border:2px solid var(--line);background:var(--ground);border-radius:5px;padding:2px;cursor:pointer;font:11px var(--mono);color:var(--muted)}
.gstrip button[aria-current="true"]{border-color:var(--accent)}
.gstrip button.b{border-style:dashed;border-color:var(--chg)}
.gstrip img{display:block;height:52px;width:auto;max-width:120px;object-fit:cover}
.gpair{display:flex;gap:10px;align-items:flex-start}
.gfig{flex:1;min-width:0;margin:0;display:grid;gap:4px}
.gfig figcaption{font:11.5px var(--mono);color:var(--muted)}
.fsstage .gpair{height:100%;box-sizing:border-box;padding:16px;align-items:center}
.fsstage .gfig img{max-height:calc(100vh - 120px)}
.nthread{display:grid;gap:10px}
.nmsg{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:4px;font-size:13.5px}
.nmsg.claude{border-color:var(--accent);background:var(--accent-soft)}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.setrow .src{grid-column:1/-1;font:11px var(--mono);color:var(--faint)}
.setrow select,.setrow input[type=number]{font:13px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:5px;padding:3px 6px}
.setrow input[type=number]{width:70px}
.keys{font-size:12.5px;color:var(--muted);display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px}
.keys kbd{font:11.5px var(--mono);border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;justify-self:start}

.fs{position:fixed;inset:0;z-index:50;background:var(--ground);display:grid;grid-template-rows:auto minmax(0,1fr)}
.fs[hidden]{display:none}
.fsbar{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line-strong);background:var(--panel)}
.fsbar .ttl{flex:1;font:500 13px var(--mono);color:var(--muted)}
.fsview{overflow:hidden;position:relative;cursor:grab;touch-action:none}
.fsview.drag{cursor:grabbing}
.fsstage{position:absolute;left:0;top:0;transform-origin:0 0;width:100%;height:100%}
.fsstage iframe{width:100%;height:100%;border:0;pointer-events:none;background:var(--panel)}
.fsstage .md{background:var(--panel);padding:24px;max-width:90ch;margin:0 auto}

.done-h{font:600 24px/1.2 var(--display);margin:0}
.sumwrap{overflow-x:auto}
table.sum{border-collapse:collapse;width:100%;max-width:90ch;font-size:13.5px;overflow-wrap:normal}
table.sum .ref b{flex:none;white-space:nowrap}
table.sum td.dec,table.sum th{white-space:nowrap}
table.sum td .kbd{display:block;overflow-wrap:break-word}
#restate h5{font:600 16px var(--sans);margin:.8em 0 .3em}
#sumRest{display:grid;gap:var(--gap)}
table.sum th,table.sum td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.sum th{font:500 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
ul.loose .ask{padding:6px 8px;border:1px solid var(--chg);border-radius:6px;background:var(--chg-soft);display:grid;gap:6px}
ul.loose textarea{width:100%;box-sizing:border-box;font:inherit}
ul.loose{margin:0;padding-left:20px;display:grid;gap:4px}
dialog{border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);color:var(--ink);max-width:560px;width:92vw;padding:16px 18px}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 8px;font:600 18px var(--display)}
dialog ul{max-height:40vh;overflow:auto;padding-left:20px;font-size:13.5px}

.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--chg);background-color:var(--chg-soft)}100%{box-shadow:0 0 0 0 transparent}}

@media (max-width:1200px){ .agrid{grid-template-columns:minmax(0,1fr)} }
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh}
  .layout,.layout.pinned,.layout.norail,.layout.norail.pinned{grid-template-columns:minmax(0,1fr)}
  .strip{flex-direction:row;order:-1}
  nav.rail{max-height:none;padding-bottom:12px;border-bottom:1px solid var(--line-strong);box-shadow:0 12px 10px -10px var(--line)}
  .rail-list{overflow:visible}
  h1{font-size:20px;margin-top:2px}
  header.top{gap:4px;padding-bottom:4px}
  .cline{white-space:normal;overflow-wrap:anywhere;overflow:visible;text-overflow:clip}
  .notice{max-width:100%}
  aside.fly.open{position:fixed;inset:0;width:auto;border-radius:0}
}
@media (max-height:800px){ .choices{max-height:calc(40vh - 90px)} fieldset.decide{max-height:40vh;overflow-y:auto} }
@media (prefers-reduced-motion: reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="hrow">
      <div>
        <div class="eyebrow"><span id="roundLbl"></span><span id="eyebrow">Interview</span></div>
        <h1 id="title">Interview</h1>
      </div>
      <div class="hright">
        <div class="meter"><button class="mlink" id="meterText" title="Next item needing you (n)">0 of 0 answered</button><span class="bar"><i id="meterBar" style="width:0%"></i></span>
          <button class="mlink sep" id="pendBtn" title="Show the questions pending Claude's research" hidden></button>
          <button class="mlink sep assume" id="assumeCount" hidden></button>
          <button class="mlink sep assume" id="wrapChip" hidden title="Open the list of what is still undone"></button></div>
        <button class="tbtn" id="sumBtn" title="Summary and wrap-up (w)" aria-keyshortcuts="w">Summary</button>
      </div>
    </div>
    <div class="hrow2">
      <span class="pill offline" id="pill" aria-live="off">Connecting</span>
      <button class="cline" id="claudeLine" aria-live="polite" title="Open the Activity panel (l)" hidden><span id="clText"></span><span class="age" id="clAge" aria-hidden="true"></span></button>
      <div class="notice" id="notice" hidden></div>
    </div>
    <div class="banner" id="reBanner" hidden></div>
  </header>
  <div class="layout" id="layout">
    <nav class="rail" aria-label="Questions">
      <div class="toolbar">
        <div class="seg" role="group" aria-label="View">
          <button data-view="groups">Groups</button><button data-view="rounds">Rounds</button><button data-view="tree">Tree</button>
        </div>
        <div class="trow">
          <label>Show <select id="filter" aria-keyshortcuts="/"><option value="all">All</option><option value="open">Open</option><option value="pending">Pending</option><option value="answered">Answered</option></select></label>
          <span class="order-note" id="orderNote"></span>
        </div>
      </div>
      <div class="rail-list" id="railList"></div>
    </nav>
    <main class="detail">
      <div class="dscroll" id="dscroll"><p class="empty">Loading questions.</p></div>
      <section class="answer" id="answer" aria-label="Your response">
        <div class="cur" id="cur"></div>
        <div class="conflict" id="conflict" hidden></div>
        <div class="agrid">
          <fieldset class="decide"><legend>Decide</legend>
            <div class="choices" id="choices" role="radiogroup" aria-label="Choices"></div>
            <div class="arow" id="decideRow"></div>
          </fieldset>
          <div class="compose">
            <textarea id="note" rows="2" placeholder="Note, caveat, own answer, or a question for Claude. Enter adds a line; Ctrl+Enter saves."></textarea>
            <fieldset class="talk"><legend>Talk (records no decision)</legend>
              <div class="arow" id="talkRow"></div>
            </fieldset>
          </div>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </section>
    </main>
    <aside class="fly" id="fly" aria-label="Side panel">
      <div class="fhead">
        <div class="frow"><span class="ttl" id="flyTitle"></span>
          <button class="tbtn small" id="pinBtn" aria-pressed="false" title="Split the screen instead of overlaying">Pin</button>
          <button class="tbtn small" id="flyClose" title="Close (Esc)" aria-keyshortcuts="Escape">Close</button></div>
        <div class="tabs" id="tabs" role="tablist"></div>
      </div>
      <div class="fbody" id="fbody"></div>
    </aside>
    <div class="strip" role="toolbar" aria-label="Panels" aria-orientation="vertical">
      <button id="railBtn" aria-label="Question list" title="Question list ([)" aria-pressed="true" aria-keyshortcuts="["><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <hr>
      <button data-panel="visuals" aria-label="Visuals" title="Visuals (v)" aria-pressed="false" aria-keyshortcuts="v"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg><span class="badge" id="visBadge" hidden></span></button>
      <button data-panel="notes" aria-label="Notes to Claude" title="Notes to Claude (m)" aria-pressed="false" aria-keyshortcuts="m"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="badge" id="noteBadge" hidden></span></button>
      <button data-panel="activity" aria-label="Activity" title="Activity (l)" aria-pressed="false" aria-keyshortcuts="l"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span class="badge" id="actBadge" hidden></span></button>
      <button data-panel="settings" aria-label="Settings" title="Settings (,)" aria-pressed="false" aria-keyshortcuts=","><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </div>
</div>
<div class="fs" id="fs" hidden role="dialog" aria-label="Full-screen visual">
  <div class="fsbar"><span class="ttl" id="fsTitle"></span>
    <button class="tbtn small" data-z="out" title="Zoom out (-)" aria-keyshortcuts="-">-</button><span class="kbd" id="fsZ">100%</span>
    <button class="tbtn small" data-z="in" title="Zoom in (+)" aria-keyshortcuts="+">+</button>
    <button class="tbtn small" data-z="fit" title="Fit (0)" aria-keyshortcuts="0">Fit</button>
    <button class="tbtn small" id="fsCmp" data-gcompare="1" hidden>Compare</button>
    <button class="tbtn small" id="fsTab" data-vopen="">Open in new tab</button>
    <button class="tbtn small" id="fsClose" title="Close (Esc)" aria-keyshortcuts="Escape">Close</button></div>
  <div class="fsview" id="fsView"><div class="fsstage" id="fsStage"></div></div>
</div>
<div class="ntoast" id="needToast" role="status" aria-live="polite" hidden></div>
<dialog id="dlg"><h3 id="dlgTitle"></h3><div id="dlgBody"></div>
  <div class="arow"><button class="act primary" id="dlgOk" data-submit="1">Accept these</button><button class="act" id="dlgAlt" hidden></button><button class="act" id="dlgCancel">Cancel</button></div></dialog>
<dialog id="finDlg" aria-labelledby="finTitle"><h3 id="finTitle">Interview complete</h3><div id="finBody"></div>
  <div class="arow"><button class="act primary" id="finClose">Close</button></div></dialog>
<dialog id="keysDlg" aria-labelledby="keysTitle"><h3 id="keysTitle">Keyboard shortcuts</h3><div class="keys" id="keysBody"></div>
  <p class="kbd">Single keys work only outside text boxes and only when shortcuts are on. Plain Enter never saves.</p>
  <div class="arow"><button class="act" id="keysClose" aria-keyshortcuts="Escape">Close</button></div></dialog>
<script>
(function(){
  "use strict";
  const TOKEN = document.querySelector('meta[name="interview-token"]').content;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const byIdCmp = (a, b) => String(a.id).localeCompare(String(b.id), undefined, {numeric: true});
  const idCmp = (a, b) => String(a).localeCompare(String(b), undefined, {numeric: true});
  const fmt = iso => { const d = new Date(iso); return isNaN(d) ? String(iso || "") : d.toLocaleString([], {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}); };
  const fmtT = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}); };
  const trunc = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "..." : s; };
  const LABEL = {open: "Open", accept: "Accepted", hedged: "Hedged", alt: "Alternative", own: "Own answer", defer: "Deferred", wait: "Pending research", need: "Needs your answer", sup: "Superseded", arch: "Archived"};
  const DEC = new Set(["accept", "alt", "own", "defer", "hedged", "reopen"]);
  const SUMMARY = "__summary";
  const DEFAULTS = {shortcuts: true, undoSeconds: 5, checkpoint: 0, theme: "auto", density: "compact", minText: 14, displayName: "You", waitTimeout: 90, staleDepth: "direct", port: 0, openBrowser: true, leaseTimeout: 600};
  const RESTART = "Restart the server to enable this.";
  const DEAF_AFTER = 30; // seconds with no watcher poll before the rung 5 message
  const LINE_CAP = 500; // the server's one-line cap, which a hedged condition must fit
  const FREEZE_MS = 10000; // longest wrap-up freeze on decision saves
  const KEYS = [["Ctrl/Cmd+Enter", "Save the armed choice with the note"], ["Ctrl/Cmd+Shift+Enter", "Ask Claude, no decision"], ["1 to 9", "Arm the Nth row of Decide, counted from the top"],
    ["a", "Arm Rec; on a stale question with a decision, Reconfirm it (the first row)"], ["o", "Arm Own answer and focus the note"], ["d", "Arm Defer"], ["h", "Arm Hedged (accept with a condition) and focus the note"], ["r", "Reopen"], ["i", "Focus the note"],
    ["Esc", "Leave the note and keep the draft; again to close the panel"], ["n / Shift+N", "Next / previous item needing you"], ["j / k, Alt+Down / Alt+Up", "Next / previous question"],
    ["[", "Hide or show the question list"], ["v / m / l / ,", "Visuals / Notes to Claude / Activity / Settings"], ["f", "Full-screen visual"], ["Left / Right", "Previous / next image in a gallery, while the visuals panel or full screen has focus"], ["w", "Summary and wrap-up"],
    ["u", "Undo, during the undo window"], ["/", "Filter"], ["?", "This sheet"]];
  const LOADED_AT = Date.now();

  const S = {doc: {meta: {}, groups: [], questions: [], visuals: [], notes: []}, resp: {seq: 0, responses: {}, history: {}, events: []},
    listener: {state: "idle"}, online: false, session: "", sel: null, busy: false, toast: "", toastBad: false, toastUndo: false,
    view: "groups", filter: "all", fly: null, pinned: false, railHidden: false, vtab: null, api: 1, settings: {}, watchSeq: 0, stateAt: 0,
    instance: "", restarted: false, finished: null, need: null, actKeys: null,
    armed: null, snap: {}, conflict: null, undo: null, revs: null, themeSig: "", loaded: false, replies: {}, noteSeen: 0, hiddenBase: null, vfiles: {}, gal: {a: null, b: null, on: false}};
  let Q = {};

  // ---------- storage (every access guarded) ----------
  const lsGet = (k, d) => { try { const v = localStorage.getItem("iv2:" + S.session + ":" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  const lsSet = (k, v) => { try { if (v === undefined || v === null) localStorage.removeItem("iv2:" + S.session + ":" + k); else localStorage.setItem("iv2:" + S.session + ":" + k, JSON.stringify(v)); } catch (e) {} };
  const finLoad = () => { try { return JSON.parse(localStorage.getItem("iv2:finish") || "null"); } catch (e) { return null; } }; // one key per origin, which is one data dir's port; it carries the data-dir id
  const finSave = v => { try { if (v) localStorage.setItem("iv2:finish", JSON.stringify(v)); else localStorage.removeItem("iv2:finish"); } catch (e) {} };
  function localSettings(){ try { return JSON.parse(localStorage.getItem("iv2:settings") || "{}") || {}; } catch (e) { return {}; } }
  function setLocal(k, v){ const o = localSettings(); if (v === undefined) delete o[k]; else o[k] = v; try { localStorage.setItem("iv2:settings", JSON.stringify(o)); } catch (e) {} applySettings(); }
  function setting(k){ const l = localSettings(); return k in l ? l[k] : S.settings[k] ? S.settings[k].value : DEFAULTS[k]; }
  function settingSrc(k){ return k in localSettings() ? "this browser" : (S.settings[k] || {}).layer || "default"; }
  const who = () => setting("displayName") || "You";

  // ---------- markdown subset (escape first) ----------
  function refHtml(id){ const q = Q[id]; return '<button type="button" class="ref" data-q="' + esc(id) + '"><b>' + esc(id) + '</b>' + esc(q ? (q.short || q.title) : "unknown") + '</button>'; }
  function inline(raw){
    return String(raw ?? "").split(/(`[^`\n]+`)/).map((part, i) => {
      if (i % 2) return "<code>" + esc(part.slice(1, -1)) + "</code>";
      const keep = [];
      let e = esc(part).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, t, u) => { keep.push('<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + t + '</a>'); return "\u0000" + (keep.length - 1) + "\u0000"; });
      const link = (t, repo, n) => { keep.push('<a href="https://github.com/' + repo + '/issues/' + n + '" target="_blank" rel="noopener noreferrer">' + t + '</a>'); return "\u0000" + (keep.length - 1) + "\u0000"; };
      e = e.replace(/(^|[^\w/.&#-])([\w.-]+\/[\w.-]+)#(\d+)\b/g, (m, pre, repo, n) => pre + link(repo + "#" + n, repo, n));
      const base = /^[\w.-]+\/[\w.-]+$/.test(S.doc.meta.repo || "") ? S.doc.meta.repo : "";
      if (base) e = e.replace(/(^|[^\w/&#-])#(\d+)\b/g, (m, pre, n) => pre + link("#" + n, base, n));
      e = e.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>");
      const end = id => '<button type="button" class="ref" data-q="' + id + '"><b>' + id + "</b></button>";
      e = e.replace(/\b([A-Z]{1,3})(\d{1,4})\s?(?:-|&ndash;|–)\s?\1?(\d{1,4})\b/g, (m, p, a, b) => { // Qa-Qb: one chip-range, not two chips and a bare hyphen
        if (!Q[p + a] || !Q[p + b]) return m;
        keep.push('<span class="rrange" title="' + p + a + " to " + p + b + '">' + end(p + a) + "<span>&ndash;</span>" + end(p + b) + "</span>");

    const fresh = S.actKeys ? acts().filter(e => !S.actKeys.has(actKey(e)) && needsAct(e)) : []; // only what needs the user, and never what the first load already held
    S.actKeys = new Set(acts().map(actKey));
    S.replies = {};
    S.doc.questions.forEach(q => (q.history || []).forEach(h => { if (h.by === "claude" && h.replyTo) S.replies[h.replyTo] = h; }));
    (S.doc.notes || []).forEach(h => { if (h.replyTo) S.replies[h.replyTo] = h; });
    applyTheme(data.theme); applySettings();
    clearTimeout(thawTimer); const thaw = wrapFreeze(); if (thaw) thawTimer = setTimeout(renderAll, thaw + 50);
    const changed = [];
    if (S.revs) S.doc.questions.forEach(q => { if (!(q.id in S.revs) || (q.rev || 0) > S.revs[q.id]) changed.push(q.id); });
    S.revs = {}; S.doc.questions.forEach(q => S.revs[q.id] = q.rev || 0);
    if (first) {
      S.loaded = true;
      S.view = lsGet("view", "groups"); if (!["groups", "rounds", "tree"].includes(S.view)) S.view = "groups";
      S.filter = lsGet("filter", "all"); if (!["all", "open", "pending", "answered"].includes(S.filter)) S.filter = "all";
      S.fly = lsGet("fly", null); if (!["visuals", "notes", "activity", "settings"].includes(S.fly)) S.fly = null;
      S.pinned = lsGet("pinned", false); S.railHidden = lsGet("railHidden", false); S.noteSeen = lsGet("noteSeen", 0);
      if (lsGet("actSeen", null) === null) markSeen(); // a new browser starts with everything seen
      const saved = lsGet("sel", null);
      const pick = saved === SUMMARY || (saved && Q[saved]) ? saved : allDone() ? SUMMARY : firstNeeding();
      if (pick) select(pick); else { renderRail(); renderDetail(); }
      if (document.hidden) S.hiddenBase = arrivalKeys(); // a tab opened in the background fires no visibilitychange
      renderHeader(); renderFly(); showFinish();
      return;
    }
    if (S.sel && S.sel !== SUMMARY && !Q[S.sel]) S.sel = railOrder()[0] || null;
    const q = Q[S.sel], f = focusKey();
    if (q && !S.conflict && !S.armed && !$("note").value.trim()) S.snap[q.id] = snapOf(q); // not answering yet: follow the latest wording
    renderHeader(); renderRail(changed);
    const typing = document.activeElement === $("note");
    if (!S.busy && q && lsGet("draft:" + S.sel, null) === null && !typing) fillNote();
    renderDetail({flash: changed.includes(S.sel)});
    if (S.fly && (S.fly !== "settings")) {
      const nt = $("noteText"), keep = nt && document.activeElement === nt;
      if (!keep) renderFly();
    }
    restoreFocus(f); // a state push keeps focus on the same control
    showFinish();
    if (fresh.length) needToast(fresh);
  }
  function restoreFinish(){ // the state call failed before the first state arrived: show the finish this browser kept
    const k = finLoad(); if (S.loaded || !k || !k.finished) return;
    S.session = k.session || ""; S.finished = k.finished;
    $("answer").hidden = true; $("dscroll").innerHTML = finishedHtml(S.finished);
    renderHeader(); showFinish();
  }
  function renderAll(){ renderHeader(); renderRail(); renderDetail(); if (S.fly) renderFly(); }
  let thawTimer = null;
  async function refresh(){
    const res = await fetch("/api/state", {cache: "no-store"});
    if (!res.ok) throw new Error(res.status);
    apply(await res.json());
  }
  let pollTimer = null, es = null, lastFrame = 0;
  // The server pings every 15 s; past two missed pings the stream counts as dead. A test may
  // shorten it with ?silentMs=<1000 to 35000>, never lengthen it.
  const SILENT_MS = (() => { const v = Number(new URLSearchParams(location.search).get("silentMs")); return Number.isInteger(v) && v >= 1000 && v <= 35000 ? v : 35000; })();
  function setOnline(v){ if (S.online !== v) { S.online = v; renderHeader(); } }
  function connect(){ // every (re)opened stream re-fetches /api/state, so nothing that happened meanwhile is missed
    if (!window.EventSource) { startPoll(); return; }
    if (es) es.close();
    es = new EventSource("/events"); lastFrame = Date.now();
    const alive = () => { lastFrame = Date.now(); setOnline(true); stopPoll(); };
    es.addEventListener("state", e => { alive(); try { apply(JSON.parse(e.data)); } catch (err) { console.error(err); } });
    es.addEventListener("ping", alive);
    es.onopen = () => { alive(); refresh().catch(() => {}); };
    es.onerror = () => { setOnline(false); startPoll(); };
  }
  function catchUp(){ refresh().then(() => setOnline(true)).catch(() => setOnline(false)); if (!es || es.readyState === 2) connect(); }
  function startPoll(){ if (pollTimer) return; pollTimer = setInterval(() => refresh().then(() => { setOnline(true); if (!es || es.readyState === 2) connect(); }).catch(() => setOnline(false)), 3000); }
  function stopPoll(){ if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  setInterval(() => { if (es && Date.now() - lastFrame > SILENT_MS) { es.close(); es = null; startPoll(); } }, 5000);
  $("finDlg").addEventListener("close", () => lsSet("finSeen", $("finDlg").dataset.at)); // closing by the button or Escape both count as seen
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { S.hiddenBase = arrivalKeys(); return; }
    S.hiddenBase = null; renderHeader();
    if (document.visibilityState === "visible") catchUp();
  });

  // ---------- events ----------
  document.addEventListener("click", e => {
    const t = e.target;
    if (t.name === "choice") { arm(+t.value); return; } // click, not change: the pre-checked Your answer row fires no change
    const cb = t.closest("[data-confirm]"); if (cb) { e.preventDefault(); confirmCommit(cb.dataset.cq, cb.dataset.confirm); return; } // the next state render ticks it
    if (t.closest("[data-confirmall]")) { confirmAll(); return; }
    const un = t.closest("[data-understand]"); if (un) { confirmUnderstanding(un.dataset.understand); return; }
    const nt = t.closest("#needToast button");
    if (nt) { if (nt.dataset.notify) { enableNotify(); return; } S.need = null; renderNeedToast(); if (nt.dataset.ntgo) goTo(nt.dataset.ntgo); return; }
    const go = t.closest("[data-go]"); if (go) { goTo(go.dataset.go); return; }
    if (t.closest("[data-allact], #claudeLine")) { showFly("activity"); return; }
    if (t.closest("#meterText")) { const n = nextNeeding(1); if (n) select(n, {animate: true}); else select(SUMMARY, {animate: true}); return; }
    if (t.closest("#pendBtn")) { S.filter = "pending"; lsSet("filter", S.filter); S.railHidden = false; lsSet("railHidden", false); renderFly(); renderRail(); return; }
    const tc = t.closest("#assumeCount, [data-toconfirm]"); // the list, or one question's entries in it
    if (tc) { select(SUMMARY, {animate: true}); const c = $("tc-" + (tc.dataset.toconfirm || "")) || $("toConfirm"); if (c) c.scrollIntoView({block: "start"}); return; }
    if (t.closest("[data-again]")) { const r = document.querySelector('#choices input[type="radio"]'); if (r) r.focus(); return; }
    const ar = t.closest("[data-acceptround]"); if (ar) { const s = sections().secs.find(x => x.round === ar.dataset.acceptround); if (s) acceptAllDialog(s.items, s.title); return; }
    const ch = t.closest("[data-challenge]"); if (ch) { challenge(+ch.dataset.challenge); return; }
    if (t.closest("[data-sheet]")) { openSheet(); return; }
    if (t.closest("#keysClose")) { $("keysDlg").close(); return; }
    if (t.closest("#finClose")) { $("finDlg").close(); return; }
    if (t.closest("[data-sum]")) { select(SUMMARY, {animate: true}); return; }
    const ref = t.closest(".ref[data-q], .qbtn"); if (ref) { select(ref.dataset.q, {animate: true}); return; }
    const au = t.closest("[data-auditround]"); if (au) { const s = sections().secs.find(x => x.round === au.dataset.auditround); if (s) acceptAllDialog(s.items, s.title, s.round); return; }
    const aa = t.closest("[data-acceptall]"); if (aa) { acceptAllDialog(S.doc.questions.filter(q => q.group === aa.dataset.acceptall), groupTitle(aa.dataset.acceptall)); return; }
    const sh = t.closest(".sec-h");
    if (sh) { const sec = sh.closest(".sec"), c = sec.dataset.collapsed !== "true"; sec.dataset.collapsed = String(c); sh.setAttribute("aria-expanded", String(!c)); lsSet("col:" + sec.dataset.key, {c, d: sec.dataset.dflt === "true"}); return; }
    const v = t.closest(".seg button"); if (v) { S.view = v.dataset.view; lsSet("view", S.view); renderRail(); return; }
    if (t.closest("[data-save]")) { submitArmed(); return; }
    const a = t.closest("button[data-act]"); if (a && !a.disabled) { send(a.dataset.act); return; }
    const rb = t.closest("button[data-research]"); if (rb && !rb.disabled) { researchNow(rb.dataset.research); return; }
    const cl = t.closest("button[data-clear]"); if (cl && !cl.disabled) { clearNote(); return; }
    if (t.closest("[data-undo]")) { doUndo(); return; }
    const cf = t.closest("[data-conflict]");
    if (cf && S.conflict) {
      const c = S.conflict;
      if (cf.dataset.conflict === "new") { S.snap[c.id] = snapOf(Q[c.id]); S.conflict = null; toast("Showing the new version. Your note and choice are kept."); renderDetail(); }
      else { S.conflict = null; send(c.kind, c.alt, c.data.contentRev, c.keep, c.noted); }
      return;
    }
    if (t.closest("[data-wrapup], #wrapChip")) { wrapUp(); return; }
    if (t.closest("[data-sendnote]")) { sendNote(); return; }
    if (t.closest("[data-looseans]")) { const v = (($("looseReply") || {}).value || "").trim(); if (v) sendFree("note", v).then(ok => { if (ok) { S.looseDraft = ""; renderSummary(); } }); return; }
    const p = t.closest("[data-panel]"); if (p) { if (p.closest("#tabs") || p.closest(".loose")) showFly(p.dataset.panel); else openPanel(p.dataset.panel); return; }
    if (t.closest("#railBtn")) { S.railHidden = !S.railHidden; lsSet("railHidden", S.railHidden); renderFly(); return; }
    if (t.closest("#sumBtn")) { select(SUMMARY, {animate: true}); return; }
    if (t.closest("#flyClose")) { showFly(null); return; }
    if (t.closest("#pinBtn")) { S.pinned = !S.pinned; lsSet("pinned", S.pinned); renderFly(); return; }
    const vt = t.closest("[data-vtab]"); if (vt) { S.vtab = vt.dataset.vtab; renderFly(); return; }
    if (t.closest("[data-replay]")) { renderFly(); return; }
    const gt = t.closest("[data-gthumb]"); if (gt) { S.gal.a = gt.dataset.gthumb; galRefresh(); return; }
    const gf = t.closest("[data-gflip]"); if (gf) { galFlip(+gf.dataset.gflip); return; }
    if (t.closest("[data-gcompare]")) { S.gal.on = !S.gal.on; galRefresh(); return; }
    if (t.closest("[data-full]")) { fsOpen(); return; }
    const vo = t.closest("[data-vopen]"); if (vo) { openTab(vo.dataset.vopen); return; }
    const z =t.closest("[data-z]"); if (z) { if (z.dataset.z === "fit") { FS.z = 1; FS.x = 0; FS.y = 0; fsApply(); } else fsZoom(z.dataset.z === "in" ? 1.25 : 0.8); return; }
    if (t.closest("#fsClose")) { fsClose(); return; }
    const rs = t.closest("[data-reset]"); if (rs) { setLocal(rs.dataset.reset, undefined); renderFly(); renderAll(); return; }
    const cp = t.closest("[data-cpdismiss]"); if (cp) { lsSet("cpDismissed", +cp.dataset.cpdismiss); renderDetail(); return; }
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset && t.dataset.gcmp) { S.gal.b = t.value; galRefresh(); return; }
    if (t.id === "filter") { S.filter = t.value; lsSet("filter", S.filter); renderRail(); return; }
    if (t.dataset && t.dataset.set) {
      const k = t.dataset.set; let v = t.value;
      if (k === "shortcuts") v = v === "true"; else if (t.type === "number") v = Math.max(+t.min, Math.min(+t.max, +v || 0));
      setLocal(k, v); renderFly(); renderAll();
    }
  });
  document.addEventListener("toggle", e => { if (e.target.id === "more") lsSet("moreOpen", e.target.open); }, true);
  document.addEventListener("input", e => {
    if (e.target.id === "note") { if (S.sel && Q[S.sel]) lsSet("draft:" + S.sel, e.target.value); grow(e.target); renderAnswer(); }
    else if (e.target.id === "noteText") { lsSet("noteDraft", e.target.value); grow(e.target); }
    else if (e.target.id === "offText") S.offDraft = e.target.value;
    else if (e.target.id === "looseReply") S.looseDraft = e.target.value;
  });
  document.addEventListener("keydown", e => {
    if (e.isComposing || e.keyCode === 229) return; // IME composition, including Safari
    const inText = textFocused();
    const modal = $("dlg").open || $("keysDlg").open || $("finDlg").open, fullScreen = !$("fs").hidden;
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      if (modal || fullScreen) return; // never save behind a dialog or a full-screen visual
      if (e.target.id === "noteText") sendNote();
      else if (S.sel === SUMMARY || !Q[S.sel]) return;
      else if (e.shiftKey) { if ($("note").value.trim()) send("ask"); else toast("Write your question in the note first.", true); }
      else submitArmed();
      return;
    }
    if (e.key === "Escape") {
      if (fullScreen) { fsClose(); e.preventDefault(); return; }
      if (modal) return;
      if (inText) { document.activeElement.blur(); e.preventDefault(); return; }
      if (S.fly && !S.pinned) showFly(null);
      return;
    }
    if (e.key === "Enter" && !e.ctrlKey && !e.metaKey && e.target.closest && e.target.closest("[data-submit]")) { e.preventDefault(); return; } // dictation: plain Enter never submits
    const flip = (e.key === "ArrowLeft" || e.key === "ArrowRight") && !e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey ? (e.key === "ArrowRight" ? 1 : -1) : 0;
    if (flip && (fullScreen || (S.fly === "visuals" && $("fly").contains(document.activeElement))) && !(e.target.closest && e.target.closest("select")) && curGallery()) { e.preventDefault(); galFlip(flip); return; }
    if (fullScreen) {
      if (e.key === "+" || e.key === "=") fsZoom(1.25); else if (e.key === "-") fsZoom(0.8); else if (e.key === "0") { FS.z = 1; FS.x = 0; FS.y = 0; fsApply(); }
      return;
    }
    if (modal || inText) return;
    if (e.altKey && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); step(e.key === "ArrowDown" ? 1 : -1); return; }
    if (e.ctrlKey || e.metaKey || e.altKey || !setting("shortcuts")) return;
    const k = e.key, q = Q[S.sel];
    if (/^[1-9]$/.test(k)) arm(+k);
    else if (k === "a") armKind("accept"); else if (k === "d") armKind("defer"); else if (k === "o") armKind("own"); else if (k === "h") armKind("hedged");
    else if (k === "r") { const d = q && decisionOf(q); if (d && d.decision && !d.aside) send("reopen"); }
    else if (k === "j") step(1); else if (k === "k") step(-1);
    else if (k === "n" || k === "N") { const n = nextNeeding(k === "N" ? -1 : 1); if (n) select(n, {animate: true}); else if (k === "n" && allDone()) select(SUMMARY, {animate: true}); }
    else if (k === "i") $("note").focus();
    else if (k === "/") $("filter").focus();
    else if (k === "?") openSheet();
    else if (k === "u") doUndo();
    else if (k === "w") select(SUMMARY, {animate: true});
    else if (k === "[") { S.railHidden = !S.railHidden; lsSet("railHidden", S.railHidden); renderFly(); }
    else if (k === "v") openPanel("visuals"); else if (k === "m") openPanel("notes"); else if (k === "l") openPanel("activity"); else if (k === ",") openPanel("settings");
    else if (k === "f" && S.fly === "visuals") fsOpen();
    else return;
    e.preventDefault(); // a key that moved focus into a text box must not type itself there
  });
  window.addEventListener("resize", () => grow($("note")));
  setInterval(() => { if (S.loaded) renderHeader(); }, 2000);

  applySettings();
  refresh().then(() => setOnline(true)).catch(() => { setOnline(false); restoreFinish(); }).finally(connect);
})();
</script>
