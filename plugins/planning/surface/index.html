<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="interview-token" content="%%TOKEN%%">
<title>Interview</title>
<link rel="icon" href="data:,">
<style>
:root{
  color-scheme:light;
  --ground:#f3f4f6; --panel:#ffffff; --ink:#1a2130; --muted:#5d6678; --faint:#8a93a3;
  --line:#dde1e8; --line-strong:#c6ccd6; --accent:#2f5d8a; --accent-soft:#e6eef7;
  --ok:#2d7a4b; --ok-soft:#e3f2e8; --chg:#9a5b00; --chg-soft:#fbefd9;
  --def:#62489a; --def-soft:#eee8f8; --wait:#6b7280; --wait-soft:#eceef1;
  --warn:#a3382b; --warn-soft:#fbe7e4;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --rail-w:310px; --fly-w:440px; --strip-w:42px; --min-text:14px;
  --pad:18px; --gap:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#12151b; --panel:#1a1f27; --ink:#e7eaf0; --muted:#a3abb9; --faint:#78808f;
    --line:#2a313c; --line-strong:#3a4250; --accent:#8fb6e0; --accent-soft:#1f2c3b;
    --ok:#7fcf9c; --ok-soft:#18301f; --chg:#f0b766; --chg-soft:#35270f;
    --def:#b9a3ec; --def-soft:#2a2240; --wait:#9aa1ad; --wait-soft:#232830;
    --warn:#f09a8c; --warn-soft:#3a1d19;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#12151b; --panel:#1a1f27; --ink:#e7eaf0; --muted:#a3abb9; --faint:#78808f;
  --line:#2a313c; --line-strong:#3a4250; --accent:#8fb6e0; --accent-soft:#1f2c3b;
  --ok:#7fcf9c; --ok-soft:#18301f; --chg:#f0b766; --chg-soft:#35270f;
  --def:#b9a3ec; --def-soft:#2a2240; --wait:#9aa1ad; --wait-soft:#232830;
  --warn:#f09a8c; --warn-soft:#3a1d19;
}
body.comfy{--pad:24px; --gap:20px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 var(--sans);overflow:hidden}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:14px 16px 12px;max-width:1600px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;border-bottom:1px solid var(--line-strong);padding-bottom:10px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:600 26px/1.1 var(--display);margin:6px 0 0;text-wrap:balance}
.hright{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:flex-end}
.meter{display:flex;align-items:center;gap:10px;font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.pill{display:inline-flex;align-items:center;gap:7px;font:500 12.5px/1 var(--sans);padding:6px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);background:var(--panel)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.listening{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.listening::before,.pill.working::before{animation:pulse 1.6s ease-in-out infinite}
.pill.reading,.pill.working{color:var(--chg);border-color:var(--chg);background:var(--chg-soft)}
.pill.idle{color:var(--wait);background:var(--wait-soft)}
.pill.offline{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
@keyframes pulse{50%{opacity:.35}}
button{font:inherit;color:inherit}
.tbtn{font:500 13px var(--sans);padding:5px 10px;border-radius:6px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);cursor:pointer}
.tbtn:hover:not(:disabled){border-color:var(--ink)}
.tbtn:disabled{opacity:.45;cursor:not-allowed}
.tbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tbtn.primary{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.tbtn.small{font-size:12px;padding:2px 7px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.layout{position:relative;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr) var(--strip-w);gap:var(--gap);min-height:0}
.layout.pinned{grid-template-columns:var(--rail-w) minmax(0,1fr) var(--fly-w) var(--strip-w)}
.layout.norail{grid-template-columns:minmax(0,1fr) var(--strip-w)}
.layout.norail.pinned{grid-template-columns:minmax(0,1fr) var(--fly-w) var(--strip-w)}
.layout.norail nav.rail{display:none}

nav.rail{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;min-height:0}
.toolbar{display:grid;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 4px;font:500 12.5px var(--sans);cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.trow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--muted)}
.trow select{font:12.5px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:5px;padding:3px 4px}
.order-note{font:500 11.5px/1.3 var(--mono);color:var(--faint)}
.rail-list{overflow-y:auto;overscroll-behavior:contain;display:grid;align-content:start;gap:12px;padding:2px 6px 24px 2px}
.sumbtn{width:100%;text-align:left;border:1px dashed var(--line-strong);border-radius:6px;background:transparent;padding:7px 10px;font:500 13px var(--sans);cursor:pointer;color:var(--muted)}
.sumbtn[aria-current="true"]{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sumbtn.done{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.sec{display:grid;gap:6px}
.sec-top{display:flex;align-items:center;gap:6px}
.sec-h{display:flex;align-items:center;gap:8px;flex:1;min-width:0;border:0;background:none;padding:2px 0;cursor:pointer;text-align:left;color:var(--muted)}
.sec-h .caret{font:12px var(--mono);width:12px;transition:transform .15s}
.sec[data-collapsed="true"] .caret{transform:rotate(-90deg)}
.sec-h h2{font:500 12px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;margin:0;flex:1}
.sec-h .cnt{font:500 11.5px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.sec.pin .sec-h h2{color:var(--chg)}
.sec.locked .sec-h h2{color:var(--faint)}
.sec-hint{font-size:12px;color:var(--faint);margin:-2px 0 0 20px}
.lock{font:500 11.5px var(--mono);color:var(--wait);margin:-2px 0 0 20px}
.qlist{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.sec[data-collapsed="true"] .qlist,.sec[data-collapsed="true"] .sec-hint{display:none}
.qbtn{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;position:relative}
.qbtn:hover{border-color:var(--line-strong)}
.qbtn[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.qbtn.dim{opacity:.55}
.qid{font:600 13px var(--mono);grid-row:span 3;align-self:start;padding-top:1px}
.qtitle{font-size:13.5px;line-height:1.35}
.qmeta{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.needs{font:11.5px var(--mono);color:var(--faint);display:flex;gap:4px;align-items:center}
.needs::before{content:"";width:9px;height:8px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;margin-top:-5px}
.needs.unmet{color:var(--chg)}
.newdot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--chg)}
.tree{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.tree .tree{margin:5px 0 0 12px;padding-left:10px;border-left:1.5px solid var(--line-strong)}
.tree .qbtn.onpath{border-color:var(--accent)}
.tree .qbtn.onpath .qtitle{font-weight:600}
.tree .also{font:11px var(--mono);color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--mono);padding:4px 7px;border-radius:4px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-open{color:var(--accent);background:var(--accent-soft)}
.s-accept{color:var(--ok);background:var(--ok-soft)}
.s-alt,.s-own{color:var(--chg);background:var(--chg-soft)}
.s-defer{color:var(--def);background:var(--def-soft)}
.s-wait,.s-sup{color:var(--wait);background:var(--wait-soft)}
.chip.plain{color:var(--muted);background:transparent;border:1px solid var(--line-strong)}
.chip.plain::before{display:none}
.chip.hot{color:var(--chg);background:transparent;border:1px solid var(--chg)}
.chip.hot::before{display:none}

main.detail{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0;overflow:hidden}
.dscroll{overflow-y:auto;overscroll-behavior:contain;padding:18px var(--pad) 22px;display:grid;align-content:start;gap:16px}
.dscroll.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
.dhead{display:grid;gap:6px}
.dids{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:500 13px var(--mono);color:var(--muted)}
.dids b{font:600 20px var(--mono);color:var(--ink)}
.dids .grow{flex:1}
.dhead h3{font:600 22px/1.25 var(--display);margin:0;text-wrap:balance;max-width:48ch}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.links span{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.ref{display:inline-flex;gap:5px;align-items:baseline;border:1px solid var(--line-strong);background:var(--ground);border-radius:4px;padding:1px 6px;font:13px var(--sans);cursor:pointer;color:var(--ink)}
.ref b{font:600 12px var(--mono)}
.ref:hover{border-color:var(--accent)}
.sup-banner,.banner,.lockban{border-left:3px solid var(--chg);background:var(--chg-soft);padding:9px 14px;border-radius:0 6px 6px 0;font-size:14px}
.sup-banner,.lockban{border-color:var(--wait);background:var(--wait-soft)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:9px 14px;border-radius:0 6px 6px 0;font-size:14px}
section.blk{display:grid;gap:8px}
section.blk>h4,details.more>summary{font:500 12px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
details.more{display:grid;gap:12px}
details.more>summary{cursor:pointer;padding:4px 0}
details.more[open]>summary{margin-bottom:10px}
details.more>section+section{margin-top:12px}
.md{max-width:72ch}
.md p{margin:0 0 .5em}.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 .5em;padding-left:20px}
.md h3,.md h4,.md h5{font:600 16px var(--sans);margin:.6em 0 .3em}
code{font:13px var(--mono);background:var(--ground);padding:1px 4px;border-radius:3px}
a{color:var(--accent)}
.recbox{border:1px solid var(--ok);background:var(--ok-soft);border-radius:6px;padding:10px 16px;max-width:80ch;display:grid;gap:6px}
details.why summary{cursor:pointer;font:500 12.5px var(--mono);color:var(--muted)}
details.why .md{margin-top:6px;font-size:14px}
ul.commits{margin:0;padding-left:20px;display:grid;gap:4px;max-width:72ch}
.alts{display:grid;gap:8px;max-width:80ch}
.alt{display:grid;grid-template-columns:auto 1fr;gap:10px;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.alt .k{font:600 13px var(--mono)}
.alt.chosen{border-color:var(--chg);background:var(--chg-soft)}
ol.hist{list-style:none;margin:0;padding:0 0 0 14px;display:grid;gap:10px;border-left:2px solid var(--line)}
ol.hist li{font-size:13.5px;position:relative;display:grid;gap:2px}
ol.hist li::before{content:"";position:absolute;left:-19px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
ol.hist li.by-claude::before{background:var(--accent)}
ol.hist li.by-term::before{background:var(--chg)}
ol.hist li.undone .hb{text-decoration:line-through;color:var(--faint)}
.hl{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.hl .who{font:500 12.5px var(--sans);color:var(--muted)}
.hl .dot{color:var(--faint)}
.hl time{font:12px var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.rcpt{display:inline-flex;gap:6px;flex-wrap:wrap;font:11.5px var(--mono);color:var(--faint)}
.rcpt span.on{color:var(--ok)}
.rcpt span.no{color:var(--chg)}
.empty{color:var(--faint);font-size:14px}

section.answer{border-top:1px solid var(--line-strong);background:var(--panel);padding:10px var(--pad) 10px;display:grid;gap:8px;box-shadow:0 -6px 14px -12px rgba(0,0,0,.25)}
section.answer[hidden]{display:none}
.cur{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;min-height:22px}
.cur q{color:var(--muted)}
.cur .when{font-size:12.5px;color:var(--faint)}
.agrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}
fieldset{border:1px solid var(--line);border-radius:6px;margin:0;padding:6px 10px 8px;min-width:0}
legend{font:500 11.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.choices{display:grid;gap:4px;max-height:26vh;overflow-y:auto;padding:2px}
.choice{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:13.5px}
.choice:hover{border-color:var(--line-strong)}
.choice input{margin:0;accent-color:var(--accent)}
.choice .n{font:600 11.5px/1.5 var(--mono);min-width:1.6em;text-align:center;border:1px solid var(--line-strong);border-radius:4px;color:var(--muted)}
.choice .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.choice.armed{border-color:var(--accent);background:var(--accent-soft)}
.choice.rec .t b{color:var(--ok)}
.choice.current .t::after{content:" (current)";color:var(--faint)}
.choices.nudge{animation:flash 1.2s ease-out}
.arow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.compose{display:grid;gap:8px}
textarea{width:100%;min-height:64px;max-height:40vh;resize:none;overflow-y:auto;font:14px/1.5 var(--sans);color:var(--ink);background:var(--ground);border:1px solid var(--line-strong);border-radius:6px;padding:8px 12px}
button.act{font:500 13.5px var(--sans);padding:6px 12px;border-radius:6px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
button.act:hover:not(:disabled){border-color:var(--ink)}
button.act.primary{background:var(--ok);border-color:var(--ok);color:var(--panel)}
button.act.soft{color:var(--accent);border-color:var(--accent)}
button.act:disabled{opacity:.45;cursor:not-allowed}
.talk .arow{margin-top:2px}
.toast{font-size:13px;color:var(--ok);min-height:1.2em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast.bad{color:var(--warn)}
.kbd{font:11.5px var(--mono);color:var(--faint)}
.conflict{border:1px solid var(--chg);background:var(--chg-soft);border-radius:6px;padding:8px 12px;display:grid;gap:6px;font-size:13.5px}
.conflict[hidden]{display:none}
.diff{max-height:18vh;overflow:auto;background:var(--panel);border-radius:4px;padding:6px 8px;font-size:13px}
.diff del{color:var(--warn);background:var(--warn-soft)}
.diff ins{color:var(--ok);background:var(--ok-soft);text-decoration:none}

.strip{display:flex;flex-direction:column;gap:6px;align-items:center;padding-top:2px}
.strip button{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);cursor:pointer;position:relative}
.strip button:hover{border-color:var(--line-strong);color:var(--ink)}
.strip button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.strip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.strip .badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--chg);color:var(--panel);font:600 10px/16px var(--mono);padding:0 3px}
.strip hr{width:24px;border:0;border-top:1px solid var(--line);margin:2px 0}

aside.fly{display:none;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;min-height:0;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
aside.fly.open{display:grid;position:absolute;top:0;right:calc(var(--strip-w) + var(--gap));bottom:0;width:min(var(--fly-w),calc(100% - var(--strip-w) - 40px));box-shadow:-10px 0 30px -18px rgba(0,0,0,.45);animation:slide .2s ease-out;z-index:5}
.layout.pinned aside.fly.open{position:static;width:auto;box-shadow:none;animation:none}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.fhead{display:grid;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.frow{display:flex;gap:6px;align-items:center}
.frow .ttl{flex:1;font:500 12px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{border:1px solid var(--line);background:var(--ground);border-radius:5px;padding:4px 8px;font:12.5px var(--sans);cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.fbody{overflow:auto;padding:12px 14px;display:grid;gap:10px;align-content:start}
.fbody .md,.fsstage .md{font-size:max(var(--min-text),14px)}
.fbody iframe{width:100%;height:min(56vh,420px);border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.fscope{font:11.5px var(--mono);color:var(--faint)}
.nthread{display:grid;gap:10px}
.nmsg{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:4px;font-size:13.5px}
.nmsg.claude{border-color:var(--accent);background:var(--accent-soft)}
.setrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.setrow .src{grid-column:1/-1;font:11px var(--mono);color:var(--faint)}
.setrow select,.setrow input[type=number]{font:13px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:5px;padding:3px 6px}
.setrow input[type=number]{width:70px}
.keys{font-size:12.5px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.keys kbd{font:11.5px var(--mono);border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;justify-self:start}

.fs{position:fixed;inset:0;z-index:50;background:var(--ground);display:grid;grid-template-rows:auto minmax(0,1fr)}
.fs[hidden]{display:none}
.fsbar{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line-strong);background:var(--panel)}
.fsbar .ttl{flex:1;font:500 13px var(--mono);color:var(--muted)}
.fsview{overflow:hidden;position:relative;cursor:grab;touch-action:none}
.fsview.drag{cursor:grabbing}
.fsstage{position:absolute;left:0;top:0;transform-origin:0 0;width:100%;height:100%}
.fsstage iframe{width:100%;height:100%;border:0;pointer-events:none;background:var(--panel)}
.fsstage .md{background:var(--panel);padding:24px;max-width:90ch;margin:0 auto}

.done-h{font:600 24px/1.2 var(--display);margin:0}
table.sum{border-collapse:collapse;width:100%;max-width:90ch;font-size:13.5px}
table.sum th,table.sum td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.sum th{font:500 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
ul.loose{margin:0;padding-left:20px;display:grid;gap:4px}
dialog{border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);color:var(--ink);max-width:560px;width:92vw;padding:16px 18px}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 8px;font:600 18px var(--display)}
dialog ul{max-height:40vh;overflow:auto;padding-left:20px;font-size:13.5px}

.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--chg);background-color:var(--chg-soft)}100%{box-shadow:0 0 0 0 transparent}}

@media (max-width:1000px){ .agrid{grid-template-columns:1fr} }
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh}
  .layout,.layout.pinned,.layout.norail,.layout.norail.pinned{grid-template-columns:1fr}
  .strip{flex-direction:row;order:-1}
  nav.rail{max-height:45vh}
  aside.fly.open{position:fixed;inset:0;width:auto;border-radius:0}
}
@media (prefers-reduced-motion: reduce){*,*::before{animation:none!important;transition:none!important}}

<style id="themeOverride"></style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="eyebrow" id="eyebrow">Interview</div>
      <h1 id="title">Interview</h1>
    </div>
    <div class="hright">
      <div class="meter"><span id="meterText">0 of 0 answered</span><span class="bar"><i id="meterBar" style="width:0%"></i></span></div>
      <span class="pill offline" id="pill" role="status" aria-live="polite">Connecting</span>
      <button class="tbtn" id="sumBtn" title="Summary and wrap-up (w)">Wrap up</button>
    </div>
  </header>
  <div class="layout" id="layout">
    <nav class="rail" aria-label="Questions">
      <div class="toolbar">
        <div class="seg" role="group" aria-label="View">
          <button data-view="groups">Groups</button><button data-view="rounds">Rounds</button><button data-view="tree">Tree</button>
        </div>
        <div class="trow">
          <label>Show <select id="filter"><option value="all">All</option><option value="open">Open</option><option value="waiting">Waiting</option><option value="answered">Answered</option></select></label>
          <span class="order-note" id="orderNote"></span>
        </div>
      </div>
      <div class="rail-list" id="railList"></div>
    </nav>
    <main class="detail">
      <div class="dscroll" id="dscroll"><p class="empty">Loading questions.</p></div>
      <section class="answer" id="answer" aria-label="Your response">
        <div class="cur" id="cur"></div>
        <div class="conflict" id="conflict" hidden></div>
        <div class="agrid">
          <fieldset class="decide"><legend>Decide</legend>
            <div class="choices" id="choices" role="radiogroup" aria-label="Choices"></div>
            <div class="arow" id="decideRow"></div>
          </fieldset>
          <div class="compose">
            <textarea id="note" rows="2" placeholder="Note, caveat, own answer, or a question for Claude. Enter adds a line; Ctrl+Enter saves."></textarea>
            <fieldset class="talk"><legend>Talk (records no decision)</legend>
              <div class="arow" id="talkRow"></div>
            </fieldset>
          </div>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </section>
    </main>
    <aside class="fly" id="fly" aria-label="Side panel">
      <div class="fhead">
        <div class="frow"><span class="ttl" id="flyTitle"></span>
          <button class="tbtn small" id="pinBtn" aria-pressed="false" title="Split the screen instead of overlaying">Pin</button>
          <button class="tbtn small" id="flyClose" title="Close (Esc)">Close</button></div>
        <div class="tabs" id="tabs" role="tablist"></div>
      </div>
      <div class="fbody" id="fbody"></div>
    </aside>
    <div class="strip" role="toolbar" aria-label="Panels" aria-orientation="vertical">
      <button id="railBtn" title="Question list ([)" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <hr>
      <button data-panel="visuals" title="Visuals (v)" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg><span class="badge" id="visBadge" hidden></span></button>
      <button data-panel="notes" title="Notes to Claude (m)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="badge" id="noteBadge" hidden></span></button>
      <button data-panel="settings" title="Settings (,)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </div>
</div>
<div class="fs" id="fs" hidden role="dialog" aria-label="Full-screen visual">
  <div class="fsbar"><span class="ttl" id="fsTitle"></span>
    <button class="tbtn small" data-z="out" title="Zoom out (-)">-</button><span class="kbd" id="fsZ">100%</span>
    <button class="tbtn small" data-z="in" title="Zoom in (+)">+</button>
    <button class="tbtn small" data-z="fit" title="Fit (0)">Fit</button>
    <button class="tbtn small" id="fsClose" title="Close (Esc)">Close</button></div>
  <div class="fsview" id="fsView"><div class="fsstage" id="fsStage"></div></div>
</div>
<dialog id="dlg"><h3 id="dlgTitle"></h3><div id="dlgBody"></div>
  <div class="arow"><button class="act primary" id="dlgOk" data-submit="1">Accept these</button><button class="act" id="dlgCancel">Cancel</button></div></dialog>
<script>
(function(){
  "use strict";
  const TOKEN = document.querySelector('meta[name="interview-token"]').content;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const byIdCmp = (a, b) => String(a.id).localeCompare(String(b.id), undefined, {numeric: true});
  const idCmp = (a, b) => String(a).localeCompare(String(b), undefined, {numeric: true});
  const fmt = iso => { const d = new Date(iso); return isNaN(d) ? String(iso || "") : d.toLocaleString([], {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}); };
  const fmtT = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}); };
  const trunc = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "..." : s; };
  const LABEL = {open: "Open", accept: "Accepted", alt: "Alternative", own: "Own answer", defer: "Deferred", wait: "Waiting", sup: "Superseded"};
  const DEC = new Set(["accept", "alt", "own", "defer", "reopen"]);
  const SUMMARY = "__summary";
  const DEFAULTS = {shortcuts: true, undoSeconds: 5, checkpoint: 0, theme: "auto", density: "compact", minText: 14};
  const RESTART = "Restart the server to enable this.";

  const S = {doc: {meta: {}, groups: [], questions: [], visuals: [], notes: []}, resp: {seq: 0, responses: {}, history: {}, events: []},
    listener: {state: "idle"}, online: false, session: "", sel: null, busy: false, toast: "", toastBad: false, toastUndo: false,
    view: "groups", filter: "all", fly: null, pinned: false, railHidden: false, vtab: null, api: 1, dataSettings: {}, watchSeq: 0,
    armed: null, snap: {}, conflict: null, undo: null, revs: null, themeSig: "", loaded: false, replies: {}, noteSeen: 0};
  let Q = {};

  // ---------- storage (every access guarded) ----------
  const lsGet = (k, d) => { try { const v = localStorage.getItem("iv2:" + S.session + ":" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  const lsSet = (k, v) => { try { if (v === undefined || v === null) localStorage.removeItem("iv2:" + S.session + ":" + k); else localStorage.setItem("iv2:" + S.session + ":" + k, JSON.stringify(v)); } catch (e) {} };
  function localSettings(){ try { return JSON.parse(localStorage.getItem("iv2:settings") || "{}") || {}; } catch (e) { return {}; } }
  function setLocal(k, v){ const o = localSettings(); if (v === undefined) delete o[k]; else o[k] = v; try { localStorage.setItem("iv2:settings", JSON.stringify(o)); } catch (e) {} applySettings(); }
  function setting(k){ const l = localSettings(), d = S.dataSettings || {}; return k in l ? l[k] : k in d ? d[k] : DEFAULTS[k]; }
  function settingSrc(k){ return k in localSettings() ? "your browser" : k in (S.dataSettings || {}) ? ({user: "user settings", repo: "repo settings"}[(S.settingLayer || {})[k]] || "settings.json") : "default"; }

  // ---------- markdown subset (escape first) ----------
  function refHtml(id){ const q = Q[id]; return '<button type="button" class="ref" data-q="' + esc(id) + '"><b>' + esc(id) + '</b>' + esc(q ? (q.short || q.title) : "unknown") + '</button>'; }
  function inline(raw){
    return String(raw ?? "").split(/(`[^`\n]+`)/).map((part, i) => {
      if (i % 2) return "<code>" + esc(part.slice(1, -1)) + "</code>";
      const keep = [];
      let e = esc(part).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, t, u) => { keep.push('<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + t + '</a>'); return "\u0000" + (keep.length - 1) + "\u0000"; });
      e = e.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>");
      e = e.replace(/\b([A-Z]{1,3}\d{1,4})\b/g, (m, id) => Q[id] ? refHtml(id) : m);
      return e.replace(/\u0000(\d+)\u0000/g, (m, n) => keep[+n]);
    }).join("");
  }
  function md(src){
    const lines = String(src ?? "").replace(/\r/g, "").split("\n"), out = [];
    let para = [], list = null;
    const flushP = () => { if (para.length) out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; };
    const flushL = () => { if (list) out.push("<" + list.t + ">" + list.items.map(x => "<li>" + inline(x) + "</li>").join("") + "</" + list.t + ">"); list = null; };
    for (const ln of lines) {
      let m;
      if (!ln.trim()) { flushP(); flushL(); }
      else if ((m = ln.match(/^\s*[-*]\s+(.*)$/)) || (m = ln.match(/^\s*\d+[.)]\s+(.*)$/))) {
        const t = /^\s*\d/.test(ln) ? "ol" : "ul"; flushP();
        if (!list || list.t !== t) { flushL(); list = {t, items: []}; }
        list.items.push(m[1]);
      } else if ((m = ln.match(/^(#{1,4})\s+(.*)$/))) { flushP(); flushL(); const h = Math.min(5, m[1].length + 2); out.push("<h" + h + ">" + inline(m[2]) + "</h" + h + ">"); }
      else { flushL(); para.push(ln.trim()); }
    }
    flushP(); flushL();
    return '<div class="md">' + out.join("") + "</div>";
  }
  function firstLine(s){ return String(s || "").replace(/[*`#]/g, "").split(/\n|(?<=[.!?])\s/)[0].trim(); }

  // ---------- derived state ----------
  function decisionOf(q){
    const page = S.resp.responses[q.id], term = q.terminal;
    const c = [page && Object.assign({src: "page"}, page), term && Object.assign({src: "terminal"}, term)].filter(x => x && x.updatedAt);
    c.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
    return c[0] || null;
  }
  function stateOf(q){
    const d = decisionOf(q);
    if (d && d.decision) return d.decision;
    if (q.supersededBy) return "sup";
    if (q.waiting) return "wait";
    return "open";
  }
  const isAnswered = st => !["open", "wait"].includes(st);
  const live = q => stateOf(q) !== "sup" && !q.waiting;
  const stageLabel = s => ((S.doc.meta || {}).stages || {})[s] || (s ? s[0].toUpperCase() + s.slice(1) : "Round");
  const roundLabel = q => stageLabel(q.stage) + " round " + (q.round ?? 1);
  function parents(q){ return [...new Set([...(q.dependsOn || []), ...(q.followUpOf ? [q.followUpOf] : [])])].filter(id => Q[id] && id !== q.id); }
  const isHandled = seq => seq <= (S.doc.handledSeq || 0) || (S.doc.handled || []).includes(seq);
  const delivered = e => !!e.deliveredAt || (S.watchSeq > 0 && e.seq <= S.watchSeq) || isHandled(e.seq);
  const events = () => S.resp.events || [];
  function crev(q){ return (q.contentRev || 0) + events().filter(e => e.id === q.id && (DEC.has(e.kind) || e.kind === "undo")).length; }
  function pending(){ return events().filter(e => !isHandled(e.seq) && !e.withdrawn); }
  function lastEventSeq(id){ let s = 0; for (const e of events()) if (e.id === id && e.seq > s) s = e.seq; return s; }
  const allDone = () => { const l = S.doc.questions.filter(live); return l.length > 0 && l.every(q => isAnswered(stateOf(q))); };
  const groupById = id => (S.doc.groups || []).find(g => g.id === id);
  const groupDone = gid => S.doc.questions.filter(q => q.group === gid && live(q)).every(q => isAnswered(stateOf(q)));
  const lockedBy = gid => ((groupById(gid) || {}).dependsOn || []).filter(p => groupById(p) && !groupDone(p));
  const groupTitle = gid => (groupById(gid) || {}).title || gid;
  function carryOver(){
    const max = {}, out = {};
    S.doc.questions.forEach(q => { const s = q.stage || ""; max[s] = Math.max(max[s] || 0, q.round || 1); });
    S.doc.questions.forEach(q => { const n = (max[q.stage || ""] || 0) - (q.round || 1); if (n > 0 && stateOf(q) === "open") out[q.id] = n; });
    return out;
  }
  function passes(q){
    const st = stateOf(q);
    return S.filter === "all" || (S.filter === "open" && st === "open") || (S.filter === "waiting" && st === "wait") || (S.filter === "answered" && isAnswered(st));
  }
  const opened = () => new Set(lsGet("opened", []));

  // ---------- rail ----------
  function sections(){
    const carry = carryOver(), qs = S.doc.questions.slice().sort(byIdCmp), secs = [];
    if (S.view === "groups") {
      const gs = S.doc.groups || [];
      gs.forEach(g => secs.push({key: "g:" + g.id, gid: g.id, title: g.title || g.id, hint: g.summary, items: qs.filter(q => q.group === g.id), lock: lockedBy(g.id)}));
      const known = new Set(gs.map(g => g.id)), un = qs.filter(q => !known.has(q.group));
      if (un.length) secs.push({key: "g:-", title: "Ungrouped", items: un, lock: []});
    } else if (S.view === "rounds") {
      const carried = qs.filter(q => carry[q.id]), rest = qs.filter(q => !carry[q.id]);
      if (carried.length) secs.push({key: "carry", title: "Carry-over", hint: "Open from earlier rounds. Pinned.", items: carried, pin: true, lock: []});
      const stages = Object.keys((S.doc.meta || {}).stages || {}), keys = [];
      rest.forEach(q => { const k = (q.stage || "") + ":" + (q.round || 1); if (!keys.includes(k)) keys.push(k); });
      keys.sort((a, b) => { const [sa, ra] = a.split(":"), [sb, rb] = b.split(":"); return (stages.indexOf(sa) - stages.indexOf(sb)) || (ra - rb); });
      keys.forEach(k => { const items = rest.filter(q => (q.stage || "") + ":" + (q.round || 1) === k); secs.push({key: "r:" + k, title: roundLabel(items[0]), items, lock: []}); });
    }
    secs.forEach(s => {
      s.open = s.items.filter(q => ["open", "wait"].includes(stateOf(q))).length;
      s.done = s.items.length > 0 && s.open === 0;
      const o = lsGet("col:" + s.key, null), dflt = s.done || s.lock.length > 0;
      s.collapsed = o && o.d === dflt ? o.c : dflt;
    });
    return {secs, carry};
  }
  function treeData(){
    const qs = S.doc.questions.slice().sort(byIdCmp), kids = {}, prim = {}, extra = {}, ups = {};
    qs.forEach(q => { kids[q.id] = []; });
    qs.forEach(q => {
      const ps = [...parents(q), ...(q.supersedes && Q[q.supersedes] ? [q.supersedes] : [])].filter((v, i, a) => a.indexOf(v) === i).sort(idCmp);
      ups[q.id] = ps;
      if (ps.length) { prim[q.id] = ps[0]; kids[ps[0]].push(q.id); extra[q.id] = ps.slice(1); }
    });
    return {roots: qs.filter(q => !prim[q.id]).map(q => q.id), kids, extra, ups};
  }
  function pathOf(t, id){
    const on = new Set();
    const up = x => (t.ups[x] || []).forEach(p => { if (!on.has(p)) { on.add(p); up(p); } });
    const down = x => (t.kids[x] || []).forEach(k => { if (!on.has(k)) { on.add(k); down(k); } });
    if (Q[id]) { on.add(id); up(id); down(id); }
    return on;
  }
  function railItem(q, sec, carry){
    const st = stateOf(q), d = decisionOf(q), chips = [];
    chips.push('<span class="chip s-' + st + '">' + LABEL[st] + (st === "alt" && d ? " (" + esc(d.alt) + ")" : "") + "</span>");
    if (carry[q.id]) chips.push('<span class="chip hot">open ' + carry[q.id] + (carry[q.id] > 1 ? " rounds" : " round") + "</span>");
    if (q.revised && st === "open") chips.push('<span class="chip plain">Revised</span>');
    if (lastEventSeq(q.id) && !isHandled(lastEventSeq(q.id))) chips.push('<span class="chip plain">With Claude</span>');
    if (d && d.src === "terminal" && d.decision) chips.push('<span class="chip plain">terminal</span>');
    if (sec && sec.pin && q.group) chips.push('<span class="chip plain">' + esc(groupTitle(q.group)) + "</span>");
    const needs = (q.dependsOn || []).filter(p => Q[p]).map(p => '<span class="needs' + (isAnswered(stateOf(Q[p])) ? "" : " unmet") + '">needs ' + esc(p) + "</span>").join("");
    const seen = lsGet("seen", {}), unseen = (q.rev || 0) > (seen[q.id] ?? 0) && S.sel !== q.id;
    return '<button class="qbtn' + (st === "sup" || q.offPath ? " dim" : "") + '" data-q="' + esc(q.id) + '" aria-current="' + (S.sel === q.id) + '">' +
      '<span class="qid">' + esc(q.id) + '</span><span class="qtitle">' + esc(q.short || q.title) + "</span>" + needs +
      '<span class="qmeta">' + chips.join("") + "</span>" + (unseen ? '<span class="newdot" title="Changed by Claude"></span>' : "") + "</button>";
  }
  function treeHtml(clickable){
    const t = treeData(), on = pathOf(t, S.sel), seen = new Set();
    const node = id => {
      if (seen.has(id)) return ""; seen.add(id);
      const q = Q[id]; if (!passes(q) && S.filter !== "all" && !(t.kids[id] || []).length) return "";
      let h = railItem(q, null, {});
      h = h.replace('class="qbtn', 'class="qbtn' + (on.has(id) && S.sel && S.sel !== SUMMARY ? " onpath" : ""));
      if (!clickable) h = h.replace("<button", '<button tabindex="-1"');
      const also = (t.extra[id] || []).length ? '<div class="also">also after ' + t.extra[id].map(esc).join(", ") + "</div>" : "";
      const kids = (t.kids[id] || []).map(node).join("");
      return "<li>" + h + also + (kids ? '<ul class="tree">' + kids + "</ul>" : "") + "</li>";
    };
    return '<ul class="tree">' + t.roots.map(node).join("") + "</ul>";
  }
  function renderRail(flashIds){
    const list = $("railList"), top = list.scrollTop;
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === S.view)));
    $("filter").value = S.filter;
    $("orderNote").textContent = S.view === "tree" ? "By depends and follow-up links" : "By number";
    const done = allDone();
    let html = '<button class="sumbtn' + (done ? " done" : "") + '" data-sum="1" aria-current="' + (S.sel === SUMMARY) + '">' + (done ? "All answered: summary and wrap-up" : "Summary and wrap-up") + "</button>";
    if (S.view === "tree") html += treeHtml(true);
    else {
      const {secs, carry} = sections(), op = opened();
      for (const s of secs) {
        const items = s.items.filter(passes);
        if (!items.length && S.filter !== "all") continue;
        const elig = s.gid ? s.items.filter(q => op.has(q.id) && stateOf(q) === "open" && q.recommendation) : [];
        html += '<div class="sec' + (s.pin ? " pin" : "") + (s.lock.length ? " locked" : "") + '" data-key="' + esc(s.key) + '" data-collapsed="' + s.collapsed + '" data-dflt="' + (s.done || s.lock.length > 0) + '">' +
          '<div class="sec-top"><button class="sec-h" aria-expanded="' + !s.collapsed + '"><span class="caret">&#9662;</span><h2>' + esc(s.title) + '</h2><span class="cnt">' + s.open + " open / " + s.items.length + "</span></button>" +
          (elig.length ? '<button class="tbtn small" data-acceptall="' + esc(s.gid) + '" data-submit="1" title="Accept the recommendation on the open questions you have opened in this group">Accept all (' + elig.length + ")</button>" : "") + "</div>" +
          (s.lock.length ? '<div class="lock">Locked: opens after ' + s.lock.map(g => esc(groupTitle(g))).join(", ") + "</div>" : "") +
          (s.hint ? '<div class="sec-hint">' + esc(s.hint) + "</div>" : "") +
          '<ul class="qlist">' + (items.length ? items.map(q => "<li>" + railItem(q, s, carry) + "</li>").join("") : '<li class="empty">None.</li>') + "</ul></div>";
      }
    }
    list.innerHTML = html;
    list.scrollTop = top;
    (flashIds || []).forEach(id => list.querySelectorAll('.qbtn[data-q="' + CSS.escape(id) + '"]').forEach(el => el.classList.add("flash")));
  }
  function railOrder(){
    if (S.view === "tree") { const t = treeData(), out = [], walk = id => { if (out.includes(id)) return; out.push(id); t.kids[id].forEach(walk); }; t.roots.forEach(walk); return out.filter(id => passes(Q[id])); }
    return sections().secs.flatMap(s => s.items.filter(passes).map(q => q.id));
  }
  function revealInRail(id){
    const list = $("railList"), el = list.querySelector(id === SUMMARY ? ".sumbtn" : '.qbtn[data-q="' + CSS.escape(id) + '"]');
    if (!el) return;
    const lr = list.getBoundingClientRect(), er = el.getBoundingClientRect();
    if (er.top < lr.top) list.scrollTo({top: list.scrollTop + er.top - lr.top - 40, behavior: "smooth"});
    else if (er.bottom > lr.bottom) list.scrollTo({top: list.scrollTop + er.bottom - lr.bottom + 40, behavior: "smooth"});
  }

  // ---------- header ----------
  function subject(e){ return e.id ? e.id : e.kind === "note" ? "your note" : e.kind === "wrapup" ? "the wrap-up" : "an event"; }
  function status(){

  // ---------- detail ----------

  // ---------- conflict (409) ----------
  function snapOf(q){ return {rev: crev(q), title: q.title, recommendation: q.recommendation || "", alternatives: (q.alternatives || []).map(a => "(" + a.key + ") " + a.text).join("\n")}; }
  function wordDiff(a, b){
    const x = String(a || "").split(/(\s+)/), y = String(b || "").split(/(\s+)/);
    if (x.length * y.length > 250000) return "<del>" + esc(a) + "</del> <ins>" + esc(b) + "</ins>";
    const L = Array.from({length: x.length + 1}, () => new Uint16Array(y.length + 1));
    for (let i = x.length - 1; i >= 0; i--) for (let j = y.length - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    let i = 0, j = 0, out = "";
    while (i < x.length && j < y.length) {
      if (x[i] === y[j]) { out += esc(x[i]); i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) out += "<del>" + esc(x[i++]) + "</del>";
      else out += "<ins>" + esc(y[j++]) + "</ins>";
    }
    while (i < x.length) out += "<del>" + esc(x[i++]) + "</del>";

  }

  // ---------- summary / completion ----------
  const DANGLING = /(?:[,\-(]|\b(?:and|but|or|so|the|a|an|to|of|with|for|that|which|because|if|then|like|in|on|at|as|is|are|was|we|i|it|my|our|your|this|these|about|from|into|than|when|where|while|just|maybe))$/i;

  function noteThread(){

    const claude = (S.doc.notes || []).map(n => Object.assign({by: "claude"}, n));

  function renderSummary(){

  // ---------- flyout ----------

    if (t.closest("#pinBtn")) { S.pinned = !S.pinned; lsSet("pinned", S.pinned); renderFly(); return; }
    const vt = t.closest("[data-vtab]"); if (vt) { S.vtab = vt.dataset.vtab; renderFly(); return; }
    if (t.closest("[data-replay]")) { renderFly(); return; }
    if (t.closest("[data-full]")) { fsOpen(); return; }
    const z = t.closest("[data-z]"); if (z) { if (z.dataset.z === "fit") { FS.z = 1; FS.x = 0; FS.y = 0; fsApply(); } else fsZoom(z.dataset.z === "in" ? 1.25 : 0.8); return; }
    if (t.closest("#fsClose")) { fsClose(); return; }
    const rs = t.closest("[data-reset]"); if (rs) { setLocal(rs.dataset.reset, undefined); renderFly(); renderAll(); return; }
    const cp = t.closest("[data-cpdismiss]"); if (cp) { lsSet("cpDismissed", +cp.dataset.cpdismiss); renderDetail(); return; }
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.name === "choice") { arm(+t.value); return; }
    if (t.id === "filter") { S.filter = t.value; lsSet("filter", S.filter); renderRail(); return; }
    if (t.dataset && t.dataset.set) {
      const k = t.dataset.set; let v = t.value;
      if (k === "shortcuts") v = v === "true"; else if (t.type === "number") v = Math.max(+t.min, Math.min(+t.max, +v || 0));
      setLocal(k, v); renderFly(); renderAll();
    }
  });
  document.addEventListener("toggle", e => { if (e.target.id === "more") lsSet("moreOpen", e.target.open); }, true);
  document.addEventListener("input", e => {
    if (e.target.id === "note") { if (S.sel && Q[S.sel]) lsSet("draft:" + S.sel, e.target.value); grow(e.target); renderAnswer(); }
    else if (e.target.id === "noteText") { lsSet("noteDraft", e.target.value); grow(e.target); }
  });
  document.addEventListener("keydown", e => {
    if (e.isComposing || e.keyCode === 229) return; // IME composition, including Safari
    const inText = textFocused();
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      if (e.target.id === "noteText") sendNote();
      else if (S.sel === SUMMARY || !Q[S.sel]) return;
      else if (e.shiftKey) { if ($("note").value.trim()) send("ask"); else toast("Write your question in the note first.", true); }
      else submitArmed();
      return;
    }
    if (e.key === "Escape") {
      if (!$("fs").hidden) { fsClose(); e.preventDefault(); return; }
      if ($("dlg").open) return;
      if (inText) { document.activeElement.blur(); e.preventDefault(); return; }
      if (S.fly && !S.pinned) { S.fly = null; lsSet("fly", null); renderFly(); renderHeader(); }
      return;
    }
    if (e.key === "Enter" && !e.ctrlKey && !e.metaKey && e.target.closest && e.target.closest("[data-submit]")) { e.preventDefault(); return; } // dictation: plain Enter never submits
    if (!$("fs").hidden) {
      if (e.key === "+" || e.key === "=") fsZoom(1.25); else if (e.key === "-") fsZoom(0.8); else if (e.key === "0") { FS.z = 1; FS.x = 0; FS.y = 0; fsApply(); }
      return;
    }
    if ($("dlg").open || inText) return;
    if (e.altKey && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); step(e.key === "ArrowDown" ? 1 : -1); return; }
    if (e.ctrlKey || e.metaKey || e.altKey || !setting("shortcuts")) return;
    const k = e.key;
    if (/^[1-9]$/.test(k)) { arm(+k); e.preventDefault(); }
    else if (k === "j") step(1); else if (k === "k") step(-1);
    else if (k === "n") { const n = nextOpen(); if (n) select(n, {animate: true}); else if (allDone()) select(SUMMARY, {animate: true}); }
    else if (k === "i") { e.preventDefault(); $("note").focus(); }
    else if (k === "u") doUndo();
    else if (k === "w") select(SUMMARY, {animate: true});
    else if (k === "[") { S.railHidden = !S.railHidden; lsSet("railHidden", S.railHidden); renderFly(); }
    else if (k === "v") openPanel("visuals"); else if (k === "m") openPanel("notes"); else if (k === ",") openPanel("settings");
    else if (k === "f" && S.fly === "visuals") fsOpen();
  });
  window.addEventListener("resize", () => grow($("note")));
  setInterval(() => { if (S.loaded) renderHeader(); }, 5000);

  applySettings();
  refresh().then(() => setOnline(true)).catch(() => setOnline(false)).finally(connect);
})();
</script>
</body>
