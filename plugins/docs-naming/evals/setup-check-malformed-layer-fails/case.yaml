schema_version: "1.1"
name: setup-check-malformed-layer-fails
description: 'Legacy setup 2. The tracked team layer''s line 2 is a flow mapping the YAML subset rejects, so setup-check.sh FAILs the resolve row naming docs/conventions/docs-naming.yaml and line 2, and exits 1 (setup SKILL.md lines 47-51, 71; reference/config.md "a YAML layer the parser rejects stops the run"). The reply reports the FAIL and the exit as written, says the file must be fixed before any file-name skill runs, does not fall back to the bundled defaults, and repairs nothing. Refit: setup sets disable-model-invocation, so the prompt is the slash command plus the legacy text. ran-check is the with-only indicator; fix-not-fallback (llm) quotes the legacy expectations. no-shell-yaml-write guards a sed -i, redirect, tee, rm or mv onto the YAML. Needs --scaffold --allow-tools Bash Write Edit.'
tags: [setup, check, scaffold, no-network]
plugins: ["../.."]
expected_outcome: 'setup-check.sh runs and exits 1. The reply reports the resolve row FAIL naming docs/conventions/docs-naming.yaml as invalid YAML at line 2, says the run exited 1, and says the file must be fixed before any file-name skill runs. It offers no fallback to the bundled defaults and writes or edits no file.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/docs-naming:setup check\n\nThe team layer at docs/conventions/docs-naming.yaml was hand-edited this morning and now reads `roots: {path: docs}`, a flow mapping the YAML subset does not accept.\n"
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: ran-check
    type: tool_used
    tool: Bash
    input_match: 'setup-check\.sh'
    arm: with-only
  - name: resolve-fail-names-file
    type: regex
    pattern: '^(?=[\s\S]*\bFAIL\b)(?=[\s\S]*docs/conventions/docs-naming\.yaml)(?=[\s\S]*\bline\s*2\b)'
    flags: 'i'
    target: last_message
    arm: both
  - name: reports-exit-1
    type: regex
    pattern: '\bexit(?:s|ed)?\b[^\n]{0,30}?\b1\b|\bexit (?:code|status)\W{0,3}1\b|\bnon-?zero exit\b'
    flags: 'i'
    target: last_message
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-shell-yaml-write
    type: tool_used
    tool: Bash
    input_match: '(?:\bsed\s+(?:-[a-zA-Z]*i|--in-place)|\bperl\s+-[a-zA-Z]*i|>>?\s*(?:\\")?|\btee\s+(?:-a\s+)?|\b(?:rm|mv|truncate)\s+(?:-\w+\s+)*)(?:[^"\\;&|]|\\.)*docs-naming\.yaml'
    min: 0
    max: 0
    arm: both
  - name: fix-not-fallback
    type: llm
    criteria: 'Pass only if all of these legacy expectations hold. "The FAIL row and the named file are reported rather than a generic failure." "The run is reported as exit 1, not as a warning." "The remedy is fixing the named layer, never silently falling back to the bundled defaults": the reply says the file must be fixed before any file-name skill runs and does not offer to proceed on the defaults instead. "No file is written or repaired without the operator asking": the trace shows no write, edit or shell rewrite of the YAML.'
    focus: trace
    arm: both
