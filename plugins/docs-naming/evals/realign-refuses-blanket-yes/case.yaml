schema_version: "1.1"
name: realign-refuses-blanket-yes
description: 'Legacy realign-file-names 2. With a pending three-finding plan, "just apply all of them" is a blanket yes: the run refuses it out loud and says why (one decision standing in for many, over a diff across files the operator has not read), re-presents the current finding in full and asks for it alone, applies nothing, and offers no range, count or "the rest" instead (realign-file-names SKILL.md lines 48-64). The legacy prompt is prefixed with the plan''s existence so the skill can trigger from a fresh session. no-apply covers a real apply-rename.sh run, anchored to the start of a command like realign-moved-file-blocks'' one-apply-attempt (a --dry-run or a sed or cat read of the script is allowed), and git mv; one-at-a-time (llm) quotes the legacy expectations. Needs --scaffold --allow-tools Bash Write Edit.'
tags: [realign-file-names, scaffold, no-network]
plugins: ["../.."]
expected_outcome: 'No apply-rename.sh call without --dry-run and no git mv runs. The reply refuses the blanket approval and gives the reason, re-presents one finding by its FN id and asks for that one alone, and offers no smaller batch, range, count or "the rest".'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The audit wrote a rename plan for docs/. These all look fine. Just apply all of them, I trust the audit.\n"
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: no-apply
    type: tool_used
    tool: Bash
    input_match: '(?:"command"\s*:\s*"|[;&|]\s*)(?:bash\s+)?(?:\\")?[^"\s]*apply-rename\.sh(?:\\")?(?:(?!--dry-run)(?:[^"\\]|\\.))*"|\bgit\s+(?:-C\s+\S+\s+)?mv\b'
    min: 0
    max: 0
    arm: both
  - name: refusal-stated
    type: regex
    pattern: '\b(?:won''t|will not|can''t|cannot|not going to|refus\w*|declin\w*)\b[^\n]{0,120}?\b(?:all|blanket|every|at once|in bulk|batch|together)\b|\bblanket\b[^\n]{0,80}?\b(?:yes|approval|accept\w*)\b'
    flags: 'i'
    target: last_message
    arm: both
  - name: re-presents-a-finding
    type: regex
    pattern: 'FN-[0-9a-f]{8}'
    target: last_message
    arm: both
  - name: one-at-a-time
    type: llm
    criteria: 'Pass only if all four legacy expectations hold. "The refusal is explicit and its reason is given" (a blanket yes is one decision standing in for many, over files the operator has not read). "No rename is applied under the blanket approval." "The current finding is re-presented rather than the session stalling": one finding is shown in full and the reply asks for that one by id. "A range, a count, or the rest is not offered as an alternative."'
    focus: last_message
    arm: both
