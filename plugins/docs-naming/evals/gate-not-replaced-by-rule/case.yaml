schema_version: "1.1"
name: gate-not-replaced-by-rule
description: "The Purpose section's 'the gate is the deliverable': a teammate proposes a path-scoped rule file alone; the run still emits the checker without opting into the rule file. Source: written from the skill's Purpose section. Hard because the prompt argues for the cheaper answer, and a run can agree with the teammate. The prompt rules out writing under .claude/ because the eval sandbox denies those writes, which would invalidate the run. The rule-file question itself is graded by gate-emitted-rule-file-hands-to-codify."
tags: [generate-file-name-gate, docs-naming, hard]
expected_outcome: "emit-gate.sh runs without --rule and creates scripts/check-file-names.sh; no Write touches .claude/rules."
context:
  scaffold_script: scaffold.sh
execution:
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:docs-naming:)?generate-file-name-gate"'
    arm: with-only
  - name: ran-emitter
    type: tool_used
    tool: Bash
    input_match: 'emit-gate\.sh'
    min: 1
    arm: with-only
  - name: checker-created
    type: file_exists
    path: scripts/check-file-names.sh
    arm: both
  - name: no-rule-flag
    type: tool_used
    tool: Bash
    input_match: 'emit-gate\.sh(?:[^"\\;&|]|\\.)*?--rule'
    min: 0
    max: 0
    arm: both
  - name: no-rule-write
    type: tool_used
    tool: Write
    input_match: '\.claude/rules'
    min: 0
    max: 0
    arm: both
