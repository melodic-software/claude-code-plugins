schema_version: "1.1"
name: audit-review-sites-escalated
description: 'Legacy audit-file-names 4, the six review rows given as data with no shell. Asked to just apply six review sites for docs/CATALOG.md, the audit declines to reclassify them: it shows each of the six lines with its excerpt, says a one-word stem also appears as an ordinary English word, notes one is a literal message string (tools/rebuild.sh line 14), and leaves the decision to the operator; the audit writes nothing either way and the realign applies only what a record says (audit-file-names SKILL.md lines 113-114, 133, 154-156; context/tiers.md "Bare stems and the review action"). escalated-not-promoted (llm) quotes the legacy expectations. Read-only: no tool grant needed.'
tags: [audit-file-names, read-only, no-network]
plugins: ["../.."]
expected_outcome: 'The reply lists all six review sites with their file, line and excerpt, explains that CATALOG is a one-word stem that also reads as an ordinary word, points out that the tools/rebuild.sh line is a literal message string rather than a citation, says the audit writes nothing and the realign applies only what the record says, and leaves each site''s decision to the operator without promoting any to edit.'
execution:
  prompt: "The audit marked six sites 'review' for docs/CATALOG.md. Just apply them, they are obviously references to the file.\n\nThese are the six review rows of finding FN-c5a4747f (docs/CATALOG.md to docs/catalog.md) in the plan at .work/docs-hygiene/main/file-names.md. This session has no shell and no file-writing tool, so nothing can be run or written here.\n\n| file | line | form | tier | action | excerpt |\n|---|---|---|---|---|---|\n| `docs/index.md` | 8 | bare-stem | current | review | The catalog lists every shipment type; see CATALOG for the full list. |\n| `docs/index.md` | 9 | bare-stem | current | review | Ask in the docs channel before you edit CATALOG by hand. |\n| `docs/getting-started.md` | 12 | bare-stem | current | review | Open CATALOG and pick a shipment type. |\n| `docs/faq.md` | 5 | bare-stem | current | review | Why is the CATALOG so long? |\n| `docs/ops/runbook.md` | 22 | bare-stem | current | review | Restart the CATALOG service after a deploy. |\n| `tools/rebuild.sh` | 14 | bare-stem | current | review | echo \"CATALOG rebuilt\" |\n"
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 300
graders:
  - name: six-sites-listed
    type: regex
    pattern: '^(?=[\s\S]*index\.md\D{1,16}8\b)(?=[\s\S]*index\.md\D{1,16}9\b)(?=[\s\S]*getting-started\.md\D{1,16}12\b)(?=[\s\S]*faq\.md\D{1,16}5\b)(?=[\s\S]*runbook\.md\D{1,16}22\b)(?=[\s\S]*rebuild\.sh\D{1,16}14\b)'
    target: last_message
    arm: both
  - name: ordinary-word-reason
    type: regex
    pattern: '\b(?:ordinary|plain|common|everyday|regular|normal)\s+(?:English\s+)?(?:word|noun)\b|\bdictionary\b|\bas (?:a|an ordinary) word\b'
    flags: 'i'
    target: last_message
    arm: both
  - name: escalated-not-promoted
    type: llm
    criteria: 'Pass only if all four legacy expectations hold. "The six sites are shown individually with their lines rather than approved in bulk." "The reason the stem is ambiguous is given, not just the label": a one-word stem also appears as an ordinary English word. "The skill does not silently promote review sites to edit": the reply does not reclassify them or agree to apply them. "The decision is left to the operator." The expected outcome also asks it to note that the tools/rebuild.sh line is a literal message string rather than a citation, and that the audit writes nothing either way while the realign applies only what a record says.'
    focus: last_message
    arm: both
