schema_version: "1.1"
name: audit-plans-renames-tiers-frozen
description: 'Legacy audit-file-names 1 and 3, merged on one fixture: three offending names (docs/Release_Notes.md, docs/Rate_Limits.md, docs/CATALOG.md) cited from current files, an ADR in the historical tier (links-and-paths) and CHANGELOG.md in the released tier (none). The run inventories, sweeps and emits the plan into .work/docs-hygiene/main/file-names.md, prints the form table before the findings, lists both review sites (docs/index.md lines 8 and 9) singly, states the 4 report sites plainly (report-count-stated ties the 4 to its report or left-as-written words, so a prose site total or the 4 in a 1.4.0 heading does not count), says the tree is unchanged, and names /docs-naming:realign-file-names (audit-file-names SKILL.md lines 47-126; context/tiers.md). Nothing is renamed or edited. Every grader is deterministic: the fixture fixes each finding''s site count and tier breakdown (row-release-notes, row-catalog, row-rate-limits match them on the finding''s own line) and each review site''s excerpt (review-excerpts), so a match is grounded in the sweep output without a judge. ran-inventory is the with-only indicator; ran-sweep and ran-emit are with-only indicators beside ran-inventory. Needs --scaffold --allow-tools Bash Write Edit.'
tags: [audit-file-names, scaffold, no-network]
plugins: ["../.."]
expected_outcome: 'inventory.sh, sweep.sh and emit-findings.sh run and the plan lands at .work/docs-hygiene/main/file-names.md. The reply shows the form table (released none, historical links-and-paths, current all) before the three findings, quotes each site''s form, tier and action from the sweep, lists docs/index.md lines 8 and 9 as review sites individually, says the 4 report sites (CHANGELOG.md and the ADR''s prose) are left as written, says nothing was renamed or edited, and names /docs-naming:realign-file-names as the next step. No git mv, mv or Edit runs.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Our docs/ tree has a few files that break our lower-kebab naming rule. Audit the file names and tell me what a rename would touch. Our released CHANGELOG entries must not be rewritten, and our ADRs should keep their narrative. No one is around to answer questions while this runs.\n"
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 30
  timeout_seconds: 900
graders:
  - name: ran-inventory
    type: tool_used
    tool: Bash
    input_match: 'inventory\.sh'
    arm: with-only
  - name: plan-written
    type: file_exists
    path: .work/docs-hygiene/main/file-names.md
    arm: both
  - name: form-table-first
    type: regex
    pattern: '^(?:(?!(?:FN-[0-9a-f]{8}[^\n]{0,80}?(?:Release_Notes|Rate_Limits|CATALOG)\.md|(?:Release_Notes|Rate_Limits|CATALOG)\.md[^\n]{0,40}?(?:release-notes|rate-limits|catalog)\.md))[\s\S])*?\blinks-and-paths\b'
    target: last_message
    arm: both
  - name: form-table-mappings
    type: regex
    pattern: '^(?:(?=(?:(?!(?:FN-[0-9a-f]{8}[^\n]{0,80}?(?:Release_Notes|Rate_Limits|CATALOG)\.md|(?:Release_Notes|Rate_Limits|CATALOG)\.md[^\n]{0,40}?(?:release-notes|rate-limits|catalog)\.md))[\s\S])*?(?:`all`|\|\s*all\s*\|)(?:(?!(?:FN-[0-9a-f]{8}[^\n]{0,80}?(?:Release_Notes|Rate_Limits|CATALOG)\.md|(?:Release_Notes|Rate_Limits|CATALOG)\.md[^\n]{0,40}?(?:release-notes|rate-limits|catalog)\.md))[^\n]){0,80}?\bevery\b)(?=(?:(?!(?:FN-[0-9a-f]{8}[^\n]{0,80}?(?:Release_Notes|Rate_Limits|CATALOG)\.md|(?:Release_Notes|Rate_Limits|CATALOG)\.md[^\n]{0,40}?(?:release-notes|rate-limits|catalog)\.md))[\s\S])*?\blinks-and-paths\b(?:(?!(?:FN-[0-9a-f]{8}[^\n]{0,80}?(?:Release_Notes|Rate_Limits|CATALOG)\.md|(?:Release_Notes|Rate_Limits|CATALOG)\.md[^\n]{0,40}?(?:release-notes|rate-limits|catalog)\.md))[^\n]){0,160}?\bprose\b)(?=(?:(?!(?:FN-[0-9a-f]{8}[^\n]{0,80}?(?:Release_Notes|Rate_Limits|CATALOG)\.md|(?:Release_Notes|Rate_Limits|CATALOG)\.md[^\n]{0,40}?(?:release-notes|rate-limits|catalog)\.md))[\s\S])*?(?:`none`|\|\s*none\s*\|)(?:(?!(?:FN-[0-9a-f]{8}[^\n]{0,80}?(?:Release_Notes|Rate_Limits|CATALOG)\.md|(?:Release_Notes|Rate_Limits|CATALOG)\.md[^\n]{0,40}?(?:release-notes|rate-limits|catalog)\.md))[^\n]){0,80}?\b(?:nothing|everything)\b)|(?=(?:(?!(?:FN-[0-9a-f]{8}[^\n]{0,80}?(?:Release_Notes|Rate_Limits|CATALOG)\.md|(?:Release_Notes|Rate_Limits|CATALOG)\.md[^\n]{0,40}?(?:release-notes|rate-limits|catalog)\.md))[\s\S])*?(?:(?:\bcurrent\b|\beverything else\b|\ball other files\b)(?:(?!\b(?:historical|released)\b)[^\n;]){0,60}?\ball\b|\ball\b(?:(?!\b(?:links-and-paths|none)\b)[^\n;]){0,60}?(?:\bcurrent\b|\beverything else\b)))(?=(?:(?!(?:FN-[0-9a-f]{8}[^\n]{0,80}?(?:Release_Notes|Rate_Limits|CATALOG)\.md|(?:Release_Notes|Rate_Limits|CATALOG)\.md[^\n]{0,40}?(?:release-notes|rate-limits|catalog)\.md))[\s\S])*?(?:(?:\bhistorical\b|\bADRs?\b|docs/adr\b)(?:(?!\b(?:current|released)\b)[^\n;]){0,60}?\blinks-and-paths\b|\blinks-and-paths\b(?:(?!\b(?:all|none)\b)[^\n;]){0,60}?(?:\bhistorical\b|\bADRs?\b|docs/adr\b)))(?=(?:(?!(?:FN-[0-9a-f]{8}[^\n]{0,80}?(?:Release_Notes|Rate_Limits|CATALOG)\.md|(?:Release_Notes|Rate_Limits|CATALOG)\.md[^\n]{0,40}?(?:release-notes|rate-limits|catalog)\.md))[\s\S])*?(?:(?:\breleased\b|\bCHANGELOG\b)(?:(?!\b(?:current|historical)\b)[^\n;]){0,60}?\bnone\b|\bnone\b(?:(?!\b(?:all|links-and-paths)\b)[^\n;]){0,60}?(?:\breleased\b|\bCHANGELOG\b))))'
    flags: 'i'
    target: last_message
    arm: both
  - name: review-sites-listed
    type: regex
    pattern: '^(?=[\s\S]*(?:(?:index\.md\D{1,16}|\b[Ll]ine\s+)8\b|see [*_`]*CATALOG[*_`]* for the full list))(?=[\s\S]*(?:(?:index\.md\D{1,16}|\b[Ll]ine\s+)9\b|edit [*_`]*CATALOG[*_`]* by hand))'
    target: last_message
    arm: both
  - name: report-count-stated
    type: regex
    pattern: '(?<![\d.])\b(?:4|four)\b(?!\.\d)[*_`]*\s+(?:(?:sites?|site\(s\))[*_`]*\s+(?:\([^)\n]{0,60}\)\s+|(?:in|across|from)\s[^\n\d;|,]{1,60}?\s)?)?(?:(?:are|is|will(?:\s+be)?|stay|stays|remain|remains)\s+)?(?:marked\s+)?[*_`]*(?:(?:report(?:ed)?|frozen)\b|untouched\b|unchanged\b|alone\b|as[ -]written\b|(?:not|never|won(?:''|’)t)[*_`]*\s+(?:be\s+)?[*_`]*(?:edited|rewritten|touched|changed|modified)\b|(?:left|stays?|remains?|kept)\s+(?:alone|as[ -]written|as[ -]is|unchanged|untouched)\b|listed\s+(?:only|and)\b)|\b(?:report|frozen)\b[^\n\d;]{0,40}?\bsites?\b(?:\s*\([^)\n]{0,20}\))?[^\n\d;]{0,20}?(?<![\d.])\b(?:4|four)\b(?!\.\d)|\breport[*_`]*\s*[:|]\s*[*_`]*(?:4|four)\b(?!\.\d)'
    flags: 'i'
    target: last_message
    arm: both
  - name: says-unchanged
    type: regex
    pattern: '\b(?:nothing\s+(?:was|has\s+been|got)\s+(?:renamed|edited|changed|touched|modified)|(?:renamed|edited|changed|touched|modified)\s+(?:and\s+(?:renamed|edited|changed|touched|modified)\s+)?nothing|no\s+files?\s+(?:was|were|has\s+been|have\s+been)\s+(?:renamed|edited|changed|touched|modified)|(?:did\s+not|didn[''’]t|have\s+not|haven[''’]t|has\s+not|hasn[''’]t|never)\s+(?:renamed?|edit(?:ed)?|changed?|touch(?:ed)?|modif(?:y|ied))(?:,?\s+(?:or|and|nor)\s+(?:renamed?|edit(?:ed)?|changed?|touch(?:ed)?|modif(?:y|ied)))?\s+(?:anything|any\s+files?|a\s+(?:single\s+)?file)|made\s+no\s+changes|no\s+changes\s+(?:were|have\s+been)\s+made|(?:working\s+)?tree\s+(?:is|was|stays|remains)\s+(?:unchanged|untouched))\b'
    flags: 'i'
    target: last_message
    arm: both
  - name: names-realign
    type: regex
    pattern: '\brealign-file-names\b'
    target: last_message
    arm: both
  - name: no-rename
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-C\s+\S+\s+)?mv\b|(?:"command"\s*:\s*"|[;&|]\s*)mv\s'
    min: 0
    max: 0
    arm: both
  - name: no-doc-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: ran-sweep
    type: tool_used
    tool: Bash
    input_match: 'sweep\.sh'
    arm: with-only
  - name: ran-emit
    type: tool_used
    tool: Bash
    input_match: 'emit-findings\.sh'
    arm: with-only
  - name: row-release-notes
    type: regex
    pattern: '(?:^|\n)(?=[^\n]*Release_Notes\.md[^\n]{0,40}?release-notes\.md)(?=[^\n]*?(?<![\d.])5[*_`]*\s*(?:sites?\b|site\(s\)|in\s+\d|\|))(?=[^\n]*\b2\s+current\s*\(`?edit`?\))(?=[^\n]*\b1\s+historical\s*\(`?edit`?\))(?=[^\n]*\b1\s+historical\s*\(`?report`?\))(?=[^\n]*\b1\s+released\s*\(`?report`?\))'
    target: last_message
    arm: both
  - name: row-catalog
    type: regex
    pattern: '(?:^|\n)(?=[^\n]*CATALOG\.md[^\n]{0,40}?\bcatalog\.md)(?=[^\n]*?(?<![\d.])4[*_`]*\s*(?:sites?\b|site\(s\)|in\s+\d|\|))(?=[^\n]*\b1\s+current\s*\(`?edit`?\))(?=[^\n]*\b2\s+(?:current\s+\(`?)?review)(?=[^\n]*\b1\s+released\s*\(`?report`?\))'
    target: last_message
    arm: both
  - name: row-rate-limits
    type: regex
    pattern: '(?:^|\n)(?=[^\n]*Rate_Limits\.md[^\n]{0,40}?rate-limits\.md)(?=[^\n]*?(?<![\d.])2[*_`]*\s*(?:sites?\b|site\(s\)|in\s+\d|\|))(?=[^\n]*\b1\s+current\s*\(`?edit`?\))(?=[^\n]*\b1\s+released\s*\(`?report`?\))'
    target: last_message
    arm: both
  - name: no-generated
    type: regex
    pattern: '(?:(?<!\bdo\s)\b(?:no|none|not|zero|without)\b(?!\s+(?:sure|check(?:ed)?|verif(?:y|ied)|know)\b)|(?<!\bdo)n(?:''|’)t\b(?!\s+(?:sure|check(?:ed)?|verif(?:y|ied)|know)\b))[^\n.;,]{0,30}\bgenerated\s+(?:files?|records?)\b|\bgenerated(?:\s+(?:files?|records?))?\s*[:|]\s*(?:none|no|0)\b|\bno\b[^\n.;,]{0,20}\bregenerate\b'
    flags: 'i'
    target: last_message
    arm: both
  - name: review-excerpts
    type: regex
    pattern: '^(?=[\s\S]*(?:(?:index\.md\D{1,16}|\bline\s+|\n\|\s*)8\b[^\n]*(?:\n[ \t]+>?[^\n]*|\n>[^\n]*)?see [*_`]*CATALOG[*_`]* for the full list|see [*_`]*CATALOG[*_`]* for the full list[^\n]*(?:index\.md\D{1,16}|\bline\s+|\n\|\s*)8\b))(?=[\s\S]*(?:(?:index\.md\D{1,16}|\bline\s+|\n\|\s*)9\b[^\n]*(?:\n[ \t]+>?[^\n]*|\n>[^\n]*)?edit [*_`]*CATALOG[*_`]* by hand|edit [*_`]*CATALOG[*_`]* by hand[^\n]*(?:index\.md\D{1,16}|\bline\s+|\n\|\s*)9\b))'
    flags: 'i'
    target: last_message
    arm: both
  - name: released-untouched
    type: regex
    pattern: '\breleased\b(?:(?!\b(?:while|but|whereas)\b|;(?=[^\n]{0,20}\b(?:historical|current|ADRs?|prose)\b)|\.\s)[^\n]){0,100}?(?:(?<!not\s)(?<!n[''’]t\s)frozen|un(?:touched|rewritten|edited|changed)|never\s+(?:touched|rewritten|edited|changed)|(?:not|n(?:''|’)t)\s+(?:be\s+)?(?:rewritten|touched|edited|changed|modified)|(?:left|kept)\s+(?:alone|as\s+written|unchanged)|(?:stays?|remains?)\s+as\s+(?:published|written)|only\s+listed|listed\s+only|do\s+not\s+touch)|\bnothing\b[^\n.;]{0,40}?\breleased\b[^\n.;]{0,60}?\b(?:rewritten|edited|touched|changed)\b|^(?=[\s\S]*?(?:`none`|\|\s*none\s*\|)[^\n]{0,80}?\b(?:never\s+touched|everything)\b)(?=[\s\S]*?\breleased\s*\(report\))(?![\s\S]*?\breleased\s*\(edit\))'
    flags: 'i'
    target: last_message
    arm: both
  - name: historical-links-only
    type: regex
    pattern: '(?:^|\n)(?![^\n]*(?:(?<!never\s)(?<!not\s)(?<!no\s)(?<!n''t\s)\b(?:rewrit\w*|edits?|edited|updates?|updated|changes?|changed|repoint\w*|touch(?:es|ed)?)\b(?!(?=(?:(?!\b(?:prose|narrative|sentences?)\b)[^\n;.|]){0,40}?\bonly\b)(?:(?!\b(?:prose|narrative|sentences?)\b)[^\n;.|]){0,40}?\b(?:links?|paths?)\b(?:(?!\b(?:prose|narrative|sentences?)\b)[^\n;.|]){0,40}?(?:,|\b(?:while|but|leaving|leaves)\b)(?:(?!\b(?:links?|paths?|prose|narrative|sentences?|and|or)\b)[^\n;.|]){0,40}?\b(?:prose|narrative|sentences?)\b)(?:(?!\b(?:while|but|whereas|leaving|leaves|not|never|no|stays?|left|kept|preserved|untouched|unchanged|alone)\b|n''t\b)[^\n;.|]){0,40}?\b(?:prose|narrative|sentences?)\b|\b(?:prose|narrative|sentences?)\b(?:(?!\b(?:while|but|whereas|leaving|leaves|not|never|no|stays?|left|kept|preserved|untouched|unchanged|alone)\b|n''t\b)[^\n;.|]){0,40}\b(?:rewrit\w*|edits?|edited|updates?|updated|changes?|changed|repoint\w*|touch(?:es|ed)?)\b))(?=[^\n]*links-and-paths)(?=[^\n]*\b(?:prose|narrative|sentences?)\b)[^\n]*(?:\b(?:left|leaves?|stays?|kept|keeps?|untouched|unchanged|preserved|alone|never)\b|\bas written\b|(?:\bnot|n''t)\s+(?:be\s+)?(?:rewritten|edited|touched|changed|updated)\b|\|[^|\n]*\b(?:prose|narrative|sentences?)\b[^|\n]*\|[ \t]*(?=\n|$)|\blinks-and-paths\b[^|\n]*\|[^|\n]*\|[^|\n]*\b(?:prose|narrative|sentences?)\b)'
    flags: 'i'
    target: last_message
    arm: both
