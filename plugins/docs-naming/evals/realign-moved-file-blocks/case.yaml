schema_version: "1.1"
name: realign-moved-file-blocks
description: 'Legacy realign-file-names 3. Refit: the legacy placeholder id FN-43878f0d is the fixture plan''s FN-c60eb30e; the scaffold moves docs/Release_Notes.md to docs/guides/notes.md in a commit after the audit. apply-rename.sh exits 1 ("no longer tracked at this root; the fix is a re-audit, not a guess"); the reply reports the block as written, names the gone path, gives re-auditing as the remedy, and neither retries with other arguments, guesses or searches for the new location, nor edits anything (realign-file-names SKILL.md lines 111-113; context/apply-recipe.md step 2). no-guess (llm, trace) quotes the legacy expectations. no-write guards Write; no-file-search rejects a find -name/-path, a git log or git show --follow, --stat, --name-status, --name-only or --find-renames hunt, or a git ls-files piped to grep, for the moved file. Needs --scaffold --allow-tools Bash Write Edit.'
tags: [realign-file-names, scaffold, no-network]
plugins: ["../.."]
expected_outcome: 'apply-rename.sh runs once for FN-c60eb30e and exits 1. The reply says docs/Release_Notes.md is no longer tracked, names a re-audit (/docs-naming:audit-file-names) as the remedy, does not guess where the file went or look for it, and makes no edit or git mv.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Apply FN-c60eb30e. I moved some files around in docs/ this morning, by the way. No one is around to answer questions while this runs.\n"
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: one-apply-attempt
    type: tool_used
    tool: Bash
    input_match: '(?:"command"\s*:\s*"|[;&|]\s*)(?:bash\s+)?(?:\\")?[^"\s]*apply-rename\.sh(?:\\")?\s+--'
    min: 0
    max: 1
    arm: both
  - name: names-reaudit
    type: regex
    pattern: '\bre-?audit|audit-file-names'
    flags: 'i'
    target: last_message
    arm: both
  - name: names-gone-path
    type: regex
    pattern: 'Release_Notes\.md[^\n]{0,160}?(?:no longer tracked|not tracked|(?:is |was )?gone|(?:was )?moved|missing|no longer (?:in|exists))|(?:no longer tracked|not tracked|missing|no longer exists)[^\n]{0,160}?Release_Notes\.md'
    flags: 'i'
    target: last_message
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-rename
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-C\s+\S+\s+)?mv\b|(?:"command"\s*:\s*"|[;&|]\s*)mv\s'
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: no-file-search
    type: tool_used
    tool: Bash
    input_match: '\bfind\b(?:[^"\\]|\\.)*-i?(?:name|path)\b|\bgit\s+(?:-C\s+\S+\s+)?(?:log|show)\b(?:[^"\\;&|]|\\.)*--(?:follow|stat|name-status|name-only|find-renames)\b|\bgit\s+(?:-C\s+\S+\s+)?ls-files\b[^"\\;&|]*\|\s*grep\b'
    min: 0
    max: 0
    arm: both
  - name: no-guess
    type: llm
    criteria: 'Pass only if all four legacy expectations hold. "The exit-1 block is reported rather than retried with different arguments." "Re-auditing is named as the remedy." "No guess is made about the file''s new location": the reply does not name docs/guides/notes.md or any other path as where the file probably went, and the trace shows no search for it (find, git log --follow, a ls-files or Glob hunt). "Nothing in the tree is edited."'
    focus: trace
    arm: both
