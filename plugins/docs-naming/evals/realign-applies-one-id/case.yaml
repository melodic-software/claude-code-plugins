schema_version: "1.1"
name: realign-applies-one-id
description: 'Legacy realign-file-names 1. Refit: the legacy placeholder id FN-9a1c4e70 is the fixture plan''s real id FN-c60eb30e (docs/Release_Notes.md to docs/release-notes.md; ids are content hashes the audit''s emitter computes). The run presents that finding (pair, site counts by tier, review sites, form table) before acting, applies only that id with apply-rename.sh, reports the APPLIED, EDITED, SKIPPED, DRIFTED and REGENERATED rows as written, runs the orphan sweep (git grep for the old name, since docs-hygiene is not loaded), and leaves the two sibling findings pending with their files unmoved (realign-file-names SKILL.md lines 48-102; context/apply-recipe.md). applied-the-id is the with-only indicator; present-first (llm, trace) grades the order. Needs --scaffold --allow-tools Bash Write Edit.'
tags: [realign-file-names, scaffold, no-network]
plugins: ["../.."]
expected_outcome: 'FN-c60eb30e is presented, then apply-rename.sh runs with that one id and docs/release-notes.md exists. The reply reports the five output rows as the script wrote them, and a git grep for docs/Release_Notes.md or Release_Notes.md runs as the orphan sweep. No apply-rename.sh call names another id, and docs/Rate_Limits.md and docs/CATALOG.md are not moved; their records stay pending.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The audit wrote a plan with three findings. Apply FN-c60eb30e. No one is around to answer questions while this runs.\n"
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 30
  timeout_seconds: 900
graders:
  - name: applied-the-id
    type: tool_used
    tool: Bash
    input_match: 'apply-rename\.sh(?:[^"\\]|\\.)*--id\W+FN-c60eb30e\b'
    arm: with-only
  - name: no-other-id
    type: tool_used
    tool: Bash
    input_match: 'apply-rename\.sh(?:[^"\\]|\\.)*--id\W+FN-(?!c60eb30e\b)'
    min: 0
    max: 0
    arm: both
  - name: new-path-created
    type: file_exists
    path: docs/release-notes.md
    arm: both
  - name: rows-reported
    type: regex
    pattern: '^(?=[\s\S]*\bAPPLIED\b)(?=[\s\S]*\bEDITED\b)(?=[\s\S]*\bSKIPPED\b)(?=[\s\S]*\bDRIFTED\b)(?=[\s\S]*\bREGENERATED\b)'
    target: last_message
    arm: both
  - name: orphan-sweep
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:-C\s+\S+\s+)?grep\b(?:[^"\\]|\\.)*Release_Notes'
    min: 1
    arm: both
  - name: no-sibling-move
    type: tool_used
    tool: Bash
    input_match: '\bmv\b(?:[^"\\]|\\.)*(?:Rate_Limits|CATALOG)\.md'
    min: 0
    max: 0
    arm: both
  - name: present-first
    type: llm
    criteria: 'Pass only if all five legacy expectations hold. "The finding is presented before the acceptance is acted on, not after": the trace shows FN-c60eb30e''s pair, site counts and form table in an assistant message before the apply-rename.sh call. "Exactly one --id is passed to apply-rename.sh." "The other findings'' files are not renamed and their records stay pending." "The script''s output rows are reported rather than summarized as done." "The orphan sweep runs for the applied pair."'
    focus: trace
    arm: both
