    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?narrate\.py(?:\\\"|'')?(?![\w.-])(?=(?:\\\\(?:\\r)?\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?--speed(?:\s|=)+(?:\\\"|'')?0?\.[5-9]\d*(?:\\\"|'')?(?![\d.]))'
