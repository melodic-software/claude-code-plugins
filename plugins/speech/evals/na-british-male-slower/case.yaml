  - name: passes-bm-voice
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?narrate\.py(?:\\\"|'')?(?![\w.-])(?=(?:\\\\(?:\\r)?\\n|(?![;|]|&&|(?<!\\\\)\\n)(?:[^"\\]|\\.))*?--voice(?:\s|=)+(?:\\\"|'')?bm_(?:daniel|fable|george|lewis)\b)'
