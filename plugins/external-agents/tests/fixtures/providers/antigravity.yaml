schema: 1
product: antigravity
docs_index: https://antigravity.google/docs/cli
help:
  agy: [--help]
models:
  args: [models]
  format: tab_lines
  effort_help: agy
binary:
  name: agy
  candidates:
    win32:
      - "{LOCALAPPDATA}/agy/bin/agy.exe"
    linux:
      - "{HOME}/.local/bin/agy"
    darwin:
      - "{HOME}/.local/bin/agy"
version:
  args: [--version]
  sources:
    standalone: github:google-antigravity/antigravity-cli
unset_model: cli-default
model_flag: --model
effort_flag: --effort
always_args: [--output-format, json, --disable-slash-commands]
prompt:
  form: "-p={prompt}"
resume:
  args: [--conversation, "{thread}"]
output:
  kind: json_envelope
  status_field: status
  success_value: SUCCESS
  message_field: response
  thread_field: conversation_id
  error_field: error
review:
  kind: diff_file
  dir_arg: --add-dir
  config_paths: [.agents/]
modes:
  read-only:
    enforcement: approval-denial
    settings:
      agentMode: ""
      allowNonWorkspaceAccess: false
    settings_arg: --settings
    prompt_preface: "This run is read-only: every shell command, search commands such as grep, find and ls included, and every file write is refused. Read files by path with your file-reading tool."
  write:
    enforcement: sandbox
    args:
      run: [--mode, accept-edits]
      resume: [--mode, accept-edits]
    settings:
      enableTerminalSandbox: true
      toolPermission: proceed-in-sandbox
      allowNonWorkspaceAccess: false
    settings_arg: --settings
    add_dir:
      arg: --add-dir
      commands: [run, resume]
    unsandboxed:
      auto:
        args:
          run: [--mode, auto]
          resume: [--mode, auto]
        settings:
          allowNonWorkspaceAccess: false
        fallback_warning:
          pattern: "--mode auto is not available"
          severity: notice
          log_arg: --log-file
          applied: "SetCycleMode called: auto"
soft_deny:
  - kind: json_array_nonempty
    field: denied_actions
  - kind: stderr_substring
    text: "permission that headless mode cannot prompt for"
unavailable:
  - class: auth
    patterns:
      - "authentication failed or timed out"
  - class: usage-limit
    patterns:
      - "RESOURCE_EXHAUSTED"
