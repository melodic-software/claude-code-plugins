---
id: code-tidying-r001
retired: 2026-11-28
plugin_version: 2.3.0
kind: block
path: docs/conventions/code-tidying.yaml
match: '^(comment_(posture|keep_list|lint(_allow|_exclude|_keep_opening)?|adr_dir)|class_c_max_lines)[[:space:]]*:'
action: migrate
successor: "The comment lint and /code-tidying:remove-comments read the comment policy keys from comment-policy.yaml in the same convention home. Copy each top-level block this record's match finds (the key with its indented list items and their indented reason comments), unchanged, to the top level of docs/conventions/comment-policy.yaml (create the file when it is absent; keep its other keys; where both files set a key, keep the comment-policy.yaml value, which already wins). Confirm with the operator that comment-settings.sh names comment-policy.yaml for every moved key, then clean: the clean removes only those blocks and keeps every other key of code-tidying.yaml, after which comment-settings.sh prints no move warning for it. When code-tidying.yaml holds no other key, rename it to comment-policy.yaml and point its schema line at comment-policy.schema.json instead; nothing is left to clean"
note: "the comment policy keys moved from code-tidying.yaml to comment-policy.yaml; the remover and upkeep keys of code-tidying.yaml stay in use. The record checks docs/conventions only; a repository with another convention home is told by comment-settings.sh's move warning"
---
id: code-tidying-r002
retired: 2026-11-28
plugin_version: 2.3.0
kind: block
path: docs/conventions/code-tidying.local.yaml
match: '^(comment_(posture|keep_list|lint(_allow|_exclude|_keep_opening)?|adr_dir)|class_c_max_lines)[[:space:]]*:'
action: migrate
successor: "/code-tidying:remove-comments and the comment lint read the personal comment policy keys (comment_posture, comment_keep_list and class_c_max_lines) from comment-policy.local.yaml in the same convention home. Copy each of those top-level blocks this record's match finds (the key with its indented lines), unchanged, to the top level of docs/conventions/comment-policy.local.yaml (create the file when it is absent; keep its other keys; where both files set a key, keep the comment-policy.local.yaml value, which already wins). Copy no comment_lint, comment_adr_dir or comment_lint list block: those are read from the team layer only, so the clean deletes them. Confirm with the operator that comment-settings.sh names comment-policy.local.yaml for every copied key, then clean: the clean removes every block the match finds and keeps every other key of code-tidying.local.yaml, and removes the file when nothing else is left; comment-settings.sh then prints no warning for it"
note: "the personal comment policy keys moved from code-tidying.local.yaml to comment-policy.local.yaml; the personal remover keys of code-tidying.local.yaml stay in use. The record checks docs/conventions only; a repository with another convention home is told by comment-settings.sh's move warning"
