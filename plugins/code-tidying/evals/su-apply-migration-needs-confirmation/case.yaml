schema_version: "1.1"
name: su-apply-migration-needs-confirmation
description: apply with no operator present, on a repo whose team policy already lives in docs/conventions/comment-policy.yaml and whose untracked code-tidying.local.yaml still sets comment_posture, reports the migrate finding and stops at the operator confirmation instead of cleaning, since a migrate record is cleaned only with --i-migrated after the operator confirms the migrated result
tags: [setup, apply, retirements]
expected_outcome: The reply names code-tidying-r002 (docs/conventions/code-tidying.local.yaml) as a migrate finding and asks the operator to confirm the migrated result; no check-retirements.sh call passes --i-migrated, and docs/conventions/code-tidying.local.yaml still exists.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-tidying:setup apply
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: names-personal-record
    type: regex
    pattern: 'code-tidying-r002'
    target: last_message
  - name: no-unconfirmed-clean
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?--i-migrated\b'
    min: 0
    max: 0
    arm: both
  - name: personal-file-kept
    type: file_exists
    path: docs/conventions/code-tidying.local.yaml
    exists: true
