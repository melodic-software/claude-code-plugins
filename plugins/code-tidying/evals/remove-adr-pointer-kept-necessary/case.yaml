schema_version: "1.1"
name: remove-adr-pointer-kept-necessary
description: necessary keeps a one-line ADR pointer at the module header, deletes a pointer that restates the ADR's reason, and deletes a restating comment
tags: [calibration, necessary, adr-pointer, invented]
expected_outcome: The header line "# See docs/adr/0007" stays; the comment that adds the cold-start reason to the pointer is deleted; the "print the attempt number" comment is deleted; code is unchanged.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-tidying:remove-comments necessary fetch.sh
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 80
  timeout_seconds: 1200
graders:
  - name: pointer-kept
    type: regex
    pattern: '^#!/usr/bin/env bash\n# See docs/adr/0007\nset -euo pipefail$'
    flags: m
    target: { source: file, path: fetch.sh }
  - name: restated-reason-deleted
    type: regex
    pattern: '#[^\n]*cold start'
    match: not_contains
    target: { source: file, path: fetch.sh }
  - name: restating-comment-deleted
    type: regex
    pattern: '#[^\n]*print the attempt number'
    match: not_contains
    target: { source: file, path: fetch.sh }
  - name: code-intact
    type: regex
    pattern: '^retries=2\n(#[^\n]*\n)?for \(\(attempt = 1; attempt <= retries; attempt\+\+\)\); do\n(  #[^\n]*\n)?  echo "attempt \$attempt"\ndone$'
    flags: m
    target: { source: file, path: fetch.sh }
  - name: proof-ran
    type: tool_used
    tool: Bash
    input_match: change-shape
    arm: both
