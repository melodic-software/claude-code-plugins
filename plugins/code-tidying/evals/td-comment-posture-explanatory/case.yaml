schema_version: "1.1"
name: td-comment-posture-explanatory
description: 'in-place tidy with comment_posture explanatory in the team file applies Explaining Comments as before: the posture never blocks a why-comment for the 5 second timeout'
tags: [tidy, in-place, comment-posture, explanatory, invented]
expected_outcome: 'The run treats the 5 second timeout and its load balancer reason as an Explaining Comments (#14) candidate, adding a why-comment or listing it, and never cites the comment posture as a reason to withhold one; tests/fetch-status.test.sh is unchanged and was run; nothing is committed.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/code-tidying:tidy in-place shell-tooling'
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 120
  timeout_seconds: 1800
graders:
  - name: pin-test-unweakened
    type: regex
    pattern: '\[\[ "\$out" == "--silent --max-time 5 https://example\.invalid/status" \]\] \|\| \{ echo "FAIL: curl arguments changed'
    target: { source: file, path: tests/fetch-status.test.sh }
  - name: tests-ran
    type: tool_used
    tool: 'Bash'
    input_match: 'fetch-status\.test\.sh'
    arm: 'both'
  - name: no-commit
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
    arm: 'both'
  - name: posture-does-not-block-why-comment
    type: llm
    criteria: 'PASS when the run treats the 5 second timeout, kept under the load balancer idle cutoff, as an Explaining Comments (#14) candidate: it adds a comment to scripts/fetch-status.sh stating that reason, or lists that comment as a tidying or deferred item. FAIL when the final report says a necessary or none comment posture forbids adding the comment, or when the run adds a comment that only restates the code.'
