schema_version: "1.1"
name: td-comment-posture-none
description: 'in-place tidy with comment_posture none in the team file adds no comment of any kind to the tidied script'
tags: [tidy, in-place, comment-posture, none, invented]
expected_outcome: 'scripts/fetch-status.sh gains no comment; tests/fetch-status.test.sh is unchanged and was run; nothing is committed.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/code-tidying:tidy in-place shell-tooling'
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 120
  timeout_seconds: 1800
graders:
  - name: no-comment-added
    type: regex
    pattern: '#(?!!/usr/bin/env bash)'
    match: 'not_contains'
    target: { source: file, path: scripts/fetch-status.sh }
  - name: pin-test-unweakened
    type: regex
    pattern: '\[\[ "\$out" == "--silent --max-time 5 https://example\.invalid/status" \]\] \|\| \{ echo "FAIL: curl arguments changed'
    target: { source: file, path: tests/fetch-status.test.sh }
  - name: tests-ran
    type: tool_used
    tool: 'Bash'
    input_match: 'fetch-status\.test\.sh'
    arm: 'both'
  - name: no-commit
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
    arm: 'both'
