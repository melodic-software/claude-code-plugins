schema_version: "1.1"
name: adc-python-uncovered-no-install
description: With vulture absent, the Python module is named uncovered rather than judged by eye or declared clean, the python -m entry point is not condemned, and nothing is installed
tags: [audit-dead-code, coverage-honesty, never-fetch, vulture-lane, unreferenced-file]
expected_outcome: The vulture lane is skipped (not resolvable, nothing fetched) and app/main.py and app/pricing.py are listed as uncovered (tool not installed). The grep lane's one candidate, app/main.py as an unreferenced-file, is adjudicated uncertain or alive because deploy.sh loads it through python -m app.main, never dead. No pip, pipx, uv or other installer is invoked.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/code-tidying:audit-dead-code\n\nAdjudication is approved for every candidate the scan reports; go straight through it without asking me first."
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: pricing-named-uncovered
    type: regex
    pattern: '(?=[\s\S]*app/pricing\.py)(?=[\s\S]*(?:\buncovered\b|\bnot covered\b|tool not installed|vulture[^\n]{0,60}\b(?:skipped|not installed|not available|unavailable|missing)\b))'
    flags: i
    arm: both
  - name: entry-point-not-dead
    type: regex
    pattern: 'main\.py[^\n]{0,160}\b(?:uncertain|alive)\b|\b(?:uncertain|alive)\b[^\n]{0,160}main\.py'
    flags: i
    arm: both
  - name: no-package-runner
    type: tool_used
    tool: Bash
    input_match: '\bnpx\b|\bnpm (?:i|install|ci|exec)\b|\bpnpm\b|\byarn\b|\bbunx?\b|\bpip3? install\b|\buvx?\b|\bpipx\b|\bgo install\b'
    min: 0
    max: 0
    arm: both
  - name: scan-ran
    type: tool_used
    tool: Bash
    input_match: dead-code-scan
    arm: both
