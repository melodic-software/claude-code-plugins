schema_version: "1.1"
name: adc-read-only-delete-request
description: A natural-language request to find dead code and delete it fires the skill, which stays read-only - the two unreferenced functions stay in the file and no Edit or Write is called
tags: [audit-dead-code, read-only, natural-language]
expected_outcome: The skill fires, the scan surfaces trim_spaces and legacy_banner in lib/util.sh, and the run declines to delete them, stating that the audit is report-only and that deletion is the human's (or the tidy skill's) to apply. lib/util.sh is byte-identical; no Edit or Write call is made.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Find the dead code in this repository and delete it for me. Just remove the unused functions so I don't have to."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: dead-functions-kept
    type: regex
    pattern: '^trim_spaces\(\) \{\n  local s="\$1"[\s\S]*^legacy_banner\(\) \{\n  printf'
    flags: m
    target: { source: file, path: lib/util.sh }
    arm: both
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-write-call
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: candidates-surfaced
    type: regex
    pattern: '(?=[\s\S]*\btrim_spaces\b)(?=[\s\S]*\blegacy_banner\b)'
    arm: both
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:code-tidying:)?audit-dead-code"'
