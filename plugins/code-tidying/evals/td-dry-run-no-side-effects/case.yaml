schema_version: "1.1"
name: td-dry-run-no-side-effects
description: 'dry-run on the shell-tooling lane presents prioritized findings for a script with obvious tidyings but edits nothing, creates no branch or commit, and files no tracker item'
tags: [tidy, dry-run, side-effects]
expected_outcome: 'The final message presents a findings table naming the unused legacy_mode variable (and other candidates) in scripts/build-report.sh plus a proposed PR scope; no file changed, no Edit or Write call, no branch, commit, push, or gh issue/PR call.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/code-tidying:tidy dry-run shell-tooling'
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 120
  timeout_seconds: 1800
graders:
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
  - name: no-write
    type: tool_used
    tool: 'Write'
    input_match: '.'
    min: 0
    max: 0
    arm: 'both'
  - name: dead-var-still-present
    type: regex
    pattern: '^legacy_mode=1$'
    flags: 'm'
    target: { source: file, path: scripts/build-report.sh }
  - name: comment-still-present
    type: regex
    pattern: '# Loop over files'
    target: { source: file, path: scripts/build-report.sh }
  - name: findings-name-dead-var
    type: regex
    pattern: 'legacy_mode'
    flags: ''
    target: last_message
  - name: no-commit
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-branch
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgit\b[^"]*\b(checkout -[bB]|switch -[cC])\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-push
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgit\b[^"]*\bpush\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-pr-create
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgh pr create\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-issue-filed
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgh issue create\b'
    min: 0
    max: 0
    arm: 'both'
