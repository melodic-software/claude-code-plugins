schema_version: "1.1"
name: td-comment-posture-necessary
description: 'in-place tidy under the default necessary posture adds no explaining comment for the 5 second timeout, whose outside reason has no link, and routes it to a named constant or the findings instead'
tags: [tidy, in-place, comment-posture, necessary, invented]
expected_outcome: 'scripts/fetch-status.sh gains no comment; the timeout reason is applied or listed as an extract (a named constant) rather than a comment; tests/fetch-status.test.sh is unchanged and was run; nothing is committed.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/code-tidying:tidy in-place shell-tooling'
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 120
  timeout_seconds: 1800
graders:
  - name: no-comment-added
    type: regex
    pattern: '#(?!!/usr/bin/env bash)'
    match: 'not_contains'
    target: { source: file, path: scripts/fetch-status.sh }
  - name: pin-test-unweakened
    type: regex
    pattern: '\[\[ "\$out" == "--silent --max-time 5 https://example\.invalid/status" \]\] \|\| \{ echo "FAIL: curl arguments changed'
    target: { source: file, path: tests/fetch-status.test.sh }
  - name: tests-ran
    type: tool_used
    tool: 'Bash'
    input_match: 'fetch-status\.test\.sh'
    arm: 'both'
  - name: no-commit
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
    arm: 'both'
  - name: reason-routed-not-commented
    type: llm
    criteria: 'PASS when the final report gives the 5 second timeout no explaining comment and instead applies or lists a rename or extract for it (such as a named constant), or says the necessary posture keeps no such comment because the note has no link. FAIL when the report says it added an explaining comment to scripts/fetch-status.sh.'
