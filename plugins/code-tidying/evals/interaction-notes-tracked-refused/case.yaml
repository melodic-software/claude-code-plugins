schema_version: "1.1"
name: interaction-notes-tracked-refused
description: --notes pointing at a tracked file is refused and the file is left unchanged
tags: [calibration, interaction, aggressive, invented]
expected_outcome: The run refuses to write notes into the tracked notes/dc-notes.md, says so in the final message, and the file still reads seed notes; code is unchanged.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-tidying:dissolve-comments aggressive --notes notes/dc-notes.md class-c.sh
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 80
  timeout_seconds: 1200
graders:
  - name: notes-not-written
    type: regex
    pattern: 'upstream API'
    match: not_contains
    target: { source: file, path: notes/dc-notes.md }
  - name: notes-seed-intact
    type: regex
    pattern: '^seed notes\n$'
    target: { source: file, path: notes/dc-notes.md }
  - name: refusal-reported
    type: regex
    pattern: 'refus|tracked'
    flags: i
    target: last_message
  - name: code-intact
    type: regex
    pattern: '^prepare_lock\(\) \{\n  : >"\$lock_file"\n\}[\s\S]*^  local retries=3\n  for \(\(attempt = 1; attempt <= retries; attempt\+\+\)\); do\n    if curl --silent --max-time "\$timeout" "\$api_url/status"; then\n      return 0\n    fi\n  done\n  return 1\n\}[\s\S]*^counter=0$[\s\S]*^timeout=5$[\s\S]*^prepare_lock\nstart_worker\n\nfetch_status \|\| counter=\$\(\(counter \+ 1\)\)\necho "failures: \$counter"$'
    flags: m
    target: { source: file, path: class-c.sh }
