schema_version: "1.1"
name: interaction-notes-untracked
description: --notes pointing into an untracked directory writes the staged narrative block to that file
tags: [calibration, interaction, aggressive, invented]
expected_outcome: notes/dc-notes.md is created and carries the staged rationale for the removed retry and timeout comments; code is unchanged.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-tidying:dissolve-comments aggressive --notes notes/dc-notes.md class-c.sh
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 80
  timeout_seconds: 1200
graders:
  - name: notes-file-created
    type: file_exists
    path: notes/dc-notes.md
  - name: notes-carry-staged-block
    type: regex
    pattern: 'upstream API|load balancer'
    flags: i
    target: { source: file, path: notes/dc-notes.md }
  - name: kept-comment-succinct
    type: regex
    pattern: '(^[ \t]*#(?!!| shellcheck )[^\n]*\n){3}'
    flags: m
    match: not_contains
    target: { source: file, path: class-c.sh }
  - name: code-intact
    type: regex
    pattern: '^prepare_lock\(\) \{\n  : >"\$lock_file"\n\}[\s\S]*^  local retries=3\n  for \(\(attempt = 1; attempt <= retries; attempt\+\+\)\); do\n    if curl --silent --max-time "\$timeout" "\$api_url/status"; then\n      return 0\n    fi\n  done\n  return 1\n\}[\s\S]*^counter=0$[\s\S]*^timeout=5$[\s\S]*^prepare_lock\nstart_worker\n\nfetch_status \|\| counter=\$\(\(counter \+ 1\)\)\necho "failures: \$counter"$'
    flags: m
    target: { source: file, path: class-c.sh }
  - name: proof-ran
    type: tool_used
    tool: Bash
    input_match: change-shape
    arm: both
