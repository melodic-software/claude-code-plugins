schema_version: "1.1"
name: real-hook-utils-header-strip
description: strip on the lib/hook-utils.sh header deletes every comment but the shellcheck directive, rewrites no code, and stages the narrative
tags: [calibration, strip, real]
expected_outcome: Only the shellcheck shell=bash directive remains as a comment; the guard and both function bodies are byte-identical; the removed narrative, including the SSOT warning, is staged in the report.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-tidying:dissolve-comments strip hook-utils-header.sh
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 80
  timeout_seconds: 1200
graders:
  - name: directive-kept
    type: regex
    pattern: '^# shellcheck shell=bash\n'
    target: { source: file, path: hook-utils-header.sh }
  - name: only-directive-left
    type: regex
    pattern: '^\s*#(?! shellcheck shell=bash)'
    flags: m
    match: not_contains
    target: { source: file, path: hook-utils-header.sh }
  - name: code-intact
    type: regex
    pattern: '\[\[ -n "\$\{_HOOK_UTILS_LOADED:-\}" \]\] && return 0\nreadonly _HOOK_UTILS_LOADED=1[\s\S]*hook::is_enabled\(\) \{\n  local var_name="CLAUDE_PLUGIN_OPTION_\$\{1\}_ENABLED"\n  \[\[ "\$\{!var_name:-true\}" == "true" \]\]\n\}\n\nhook::check_enabled\(\) \{\n  hook::is_enabled "\$1" \|\| exit 0\n\}'
    target: { source: file, path: hook-utils-header.sh }
  - name: proof-ran
    type: tool_used
    tool: Bash
    input_match: change-shape
    arm: both
  - name: narrative-staged
    type: llm
    criteria: PASS when the final report contains a proposed commit-message block that preserves the removed information, including the SSOT warning (lib/hook-utils.sh is the source, the plugin copies are never edited, scripts/sync-hook-utils.sh propagates it, and CI rejects drifted copies). FAIL when that warning appears nowhere in the report.
