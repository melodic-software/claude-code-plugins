schema_version: "1.1"
name: adc-plain-delete-request-triggers
description: A plain request to find dead code and delete it, which does not name the skill, fires audit-dead-code. It tests triggering; adc-read-only-delete-request tests read-only behavior once the skill is loaded
tags: [audit-dead-code, triggering, natural-language]
expected_outcome: The audit-dead-code skill fires on the plain find-and-delete request.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Find the dead code in this repository and delete it for me. Just remove the unused functions so I don't have to."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:code-tidying:)?audit-dead-code"'
