schema_version: "1.1"
name: tidy-diff-wrapper-inlined-only-in-rows
description: 'the simplify pass inlines a private one-call wrapper whose definition and only caller sit in the listed lines, and leaves the same shape outside the listed lines untouched. Written from MB:plugins/code-tidying/skills/tidy-diff/SKILL.md:50-55, 88-89 and 92 (the base contract).'
tags: [tidy-diff, simplify, scope]
expected_outcome: 'In src/report.py the listed `_load_rows` wrapper is gone and `summarize(path)` calls `read_csv_rows(path)` directly, keeping its name and signature; the unlisted `_load_events` and `count_events` block (lines 1-9) is byte-identical; nothing is committed.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/code-tidying:tidy-diff changed-lines.tsv'
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 60
  timeout_seconds: 1200
graders:
  - name: listed-wrapper-inlined
    type: regex
    pattern: 'def _load_rows\b|_load_rows\('
    match: not_contains
    target: { source: file, path: src/report.py }
  - name: summarize-calls-reader
    type: regex
    pattern: '^def summarize\(path\):\n(    [^\n]*\n)*?    [^\n]*read_csv_rows\(path\)'
    flags: m
    target: { source: file, path: src/report.py }
  - name: unlisted-block-unchanged
    type: regex
    pattern: '^from csvtools import read_csv_rows, read_json_rows\n\n\ndef _load_events\(path\):\n    return read_json_rows\(path\)\n\n\ndef count_events\(path\):\n    return len\(_load_events\(path\)\)\n'
    target: { source: file, path: src/report.py }
  - name: no-commit
    type: tool_used
    tool: Bash
    input_match: '"command":"[^"]*\bgit\b[^"]*\b(commit|add|push)\b'
    min: 0
    max: 0
    arm: both
