schema_version: "1.1"
name: td-in-place-structure-only
description: 'in-place run on a feature branch tidies scripts/build-report.sh structurally: public function names and output format unchanged, the behavior-pin test untouched and run, nothing committed or branched, untracked WIP never staged'
tags: [tidy, in-place, structure-only, staging]
expected_outcome: 'legacy_mode is gone, count_lines and render_report still exist, the REPORT printf format and error path are unchanged, tests/build-report.test.sh is unchanged and was run, changes are left staged by path with no commit, branch, or PR, and notes/wip-draft.md is never staged.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/code-tidying:tidy in-place shell-tooling'
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 120
  timeout_seconds: 1800
graders:
  - name: dead-var-removed
    type: regex
    pattern: 'legacy_mode'
    match: 'not_contains'
    target: { source: file, path: scripts/build-report.sh }
  - name: count-lines-name-kept
    type: regex
    pattern: '^count_lines\(\) \{'
    flags: 'm'
    target: { source: file, path: scripts/build-report.sh }
  - name: render-report-name-kept
    type: regex
    pattern: '^render_report\(\) \{'
    flags: 'm'
    target: { source: file, path: scripts/build-report.sh }
  - name: output-format-kept
    type: regex
    pattern: 'printf ''REPORT %s %s\\n'''
    target: { source: file, path: scripts/build-report.sh }
  - name: error-path-kept
    type: regex
    pattern: 'no such directory: \$dir" >&2\n\s*return 1'
    target: { source: file, path: scripts/build-report.sh }
  - name: pin-test-unweakened
    type: regex
    pattern: '\[\[ "\$out" == "\$expected" \]\] \|\| \{ echo "FAIL: report output'
    target: { source: file, path: tests/build-report.test.sh }
  - name: tests-ran
    type: tool_used
    tool: 'Bash'
    input_match: 'build-report\.test\.sh'
    arm: 'both'
  - name: wip-never-staged
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgit\b[^"]*\badd\b[^"]*wip-draft'
    min: 0
    max: 0
    arm: 'both'
  - name: no-commit
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-branch
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgit\b[^"]*\b(checkout -[bB]|switch -[cC])\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-pr-create
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgh pr create\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-git-add-all
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgit\b[^"]*\badd (-A|--all|-u|\.(?=[ ;&|"]|$))'
    min: 0
    max: 0
    arm: 'both'
