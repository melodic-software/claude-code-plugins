schema_version: "1.1"
name: interaction-dot-aggressive-path
description: ./aggressive is read as a directory target under the default posture, not as the aggressive mode
tags: [calibration, interaction, invented]
expected_outcome: aggressive/class-c.sh is triaged under default strict; the set-the-counter comment is deleted; the retry rationale, absent from history, is kept; code is unchanged.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-tidying:dissolve-comments ./aggressive
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 80
  timeout_seconds: 1200
graders:
  - name: class-a-deleted
    type: regex
    pattern: '#[^\n]*set the counter to zero'
    match: not_contains
    target: { source: file, path: aggressive/class-c.sh }
  - name: retry-rationale-kept
    type: regex
    pattern: '#[^\n]*upstream API'
    target: { source: file, path: aggressive/class-c.sh }
  - name: kept-comment-succinct
    type: regex
    pattern: '(^[ \t]*#(?!!| shellcheck )[^\n]*\n){3}'
    flags: m
    match: not_contains
    target: { source: file, path: aggressive/class-c.sh }
  - name: code-intact
    type: regex
    pattern: '^prepare_lock\(\) \{\n  : >"\$lock_file"\n\}[\s\S]*^  local retries=3\n  for \(\(attempt = 1; attempt <= retries; attempt\+\+\)\); do\n    if curl --silent --max-time "\$timeout" "\$api_url/status"; then\n      return 0\n    fi\n  done\n  return 1\n\}[\s\S]*^counter=0$[\s\S]*^timeout=5$[\s\S]*^prepare_lock\nstart_worker\n\nfetch_status \|\| counter=\$\(\(counter \+ 1\)\)\necho "failures: \$counter"$'
    flags: m
    target: { source: file, path: aggressive/class-c.sh }
  - name: path-triaged
    type: tool_used
    tool: Bash
    input_match: aggressive/class-c
    arm: both
  - name: proof-ran
    type: tool_used
    tool: Bash
    input_match: change-shape
    arm: both
