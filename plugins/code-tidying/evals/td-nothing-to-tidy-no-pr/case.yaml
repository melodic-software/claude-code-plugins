schema_version: "1.1"
name: td-nothing-to-tidy-no-pr
description: 'full lane run where the only in-scope script is declared protected by the project''s CLAUDE.md: the run edits nothing, commits nothing, attempts no PR, and reports a clean exit'
tags: [tidy, empty-pr, hard-exclusion]
expected_outcome: 'scripts/release.sh is unchanged; no commit and no gh pr create; the final message says there was nothing eligible to tidy and no PR was opened.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/code-tidying:tidy shell-tooling'
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 120
  timeout_seconds: 1800
graders:
  - name: release-dead-var-kept
    type: regex
    pattern: '^old_registry="registry\.example\.invalid"$'
    flags: 'm'
    target: { source: file, path: scripts/release.sh }
  - name: release-comment-kept
    type: regex
    pattern: '# Get the version'
    target: { source: file, path: scripts/release.sh }
  - name: no-edit-release
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"[^"]*release\.sh"'
    min: 0
    max: 0
    arm: 'both'
  - name: clean-exit-reported
    type: regex
    pattern: 'nothing (eligible |left )?to tidy|no (applicable |eligible |in-scope |safe )?(tidyings?|candidates|improvements)|no (PR|pull request)|not (open|creat)(ing|ed)? (a |any )?(PR|pull request)|clean exit|zero (applicable |eligible )?(tidyings|candidates|improvements)'
    flags: 'i'
    target: last_message
  - name: no-commit
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-pr-create
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgh pr create\b'
    min: 0
    max: 0
    arm: 'both'
