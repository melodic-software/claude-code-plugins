schema_version: "1.1"
name: td-hook-wired-script-excluded
description: 'in-place shell-tooling run leaves scripts/hooks/check-bash.sh untouched because .claude/settings.json wires it as a hook command (GLOBAL HARD), while still tidying the ordinary script in the lane'
tags: [tidy, in-place, hard-exclusion]
expected_outcome: 'scripts/hooks/check-bash.sh is byte-identical (hook_version and the redundant comment remain) and no Edit or Write targets it; scripts/build-report.sh loses legacy_mode; the report says the hook script was excluded.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/code-tidying:tidy in-place shell-tooling'
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 120
  timeout_seconds: 1800
graders:
  - name: hook-dead-var-kept
    type: regex
    pattern: '^hook_version=2$'
    flags: 'm'
    target: { source: file, path: scripts/hooks/check-bash.sh }
  - name: hook-comment-kept
    type: regex
    pattern: '# Read stdin'
    target: { source: file, path: scripts/hooks/check-bash.sh }
  - name: no-edit-hook-script
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"[^"]*check-bash\.sh"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-write-hook-script
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"[^"]*check-bash\.sh"'
    min: 0
    max: 0
    arm: 'both'
  - name: lane-script-tidied
    type: regex
    pattern: 'legacy_mode'
    match: 'not_contains'
    target: { source: file, path: scripts/build-report.sh }
  - name: exclusion-reported
    type: regex
    pattern: 'check-bash\.sh[\s\S]{0,400}(exclu|hook|HARD|skip|untouched)|(exclu|HARD)[\s\S]{0,400}check-bash\.sh'
    flags: 'i'
    target: last_message
  - name: no-commit
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
    arm: 'both'
