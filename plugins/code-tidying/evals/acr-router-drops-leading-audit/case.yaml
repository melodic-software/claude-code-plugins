schema_version: "1.1"
name: acr-router-drops-leading-audit
description: the audit-comment-residue router, given its optional leading audit token, runs the remove-comments audit action once with that token not doubled, and edits nothing
tags: [acr, outcome, explicit, read-only, audit-comment-residue]
expected_outcome: The router runs /code-tidying:remove-comments with the arguments "audit src/cache.ts", the detector runs on src/cache.ts, and no Edit or Write call is made.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-tidying:audit-comment-residue audit src/cache.ts
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 80
  timeout_seconds: 1200
graders:
  - name: audit-action-forwarded
    type: tool_used
    tool: Skill
    input_match: 'remove-comments","args":"audit src/cache\.ts"'
  - name: detector-ran
    type: tool_used
    tool: Bash
    input_match: 'detect\.sh'
    arm: both
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-write-call
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
