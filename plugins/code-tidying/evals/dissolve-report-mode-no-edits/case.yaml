schema_version: "1.1"
name: dissolve-report-mode-no-edits
description: report on the class-C script proposes every treatment and edits no file
tags: [calibration, report, invented]
expected_outcome: Every comment and every code line in class-c.sh is unchanged; the report proposes deleting the set-the-counter comment and names its class; the run asks no question and reports no census delta.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-tidying:dissolve-comments report class-c.sh
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 60
  timeout_seconds: 900
graders:
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: class-a-comment-still-present
    type: regex
    pattern: '#[^\n]*set the counter to zero'
    target: { source: file, path: class-c.sh }
  - name: warning-still-present
    type: regex
    pattern: '#[^\n]*deadlock'
    flags: i
    target: { source: file, path: class-c.sh }
  - name: retry-rationale-still-present
    type: regex
    pattern: '#[^\n]*upstream API'
    target: { source: file, path: class-c.sh }
  - name: timeout-rationale-still-present
    type: regex
    pattern: '#[^\n]*load balancer'
    target: { source: file, path: class-c.sh }
  - name: code-intact
    type: regex
    pattern: '^prepare_lock\(\) \{\n  : >"\$lock_file"\n\}[\s\S]*^  local retries=3\n  for \(\(attempt = 1; attempt <= retries; attempt\+\+\)\); do\n    if curl --silent --max-time "\$timeout" "\$api_url/status"; then\n      return 0\n    fi\n  done\n  return 1\n\}[\s\S]*^counter=0$[\s\S]*^timeout=5$[\s\S]*^prepare_lock\nstart_worker\n\nfetch_status \|\| counter=\$\(\(counter \+ 1\)\)\necho "failures: \$counter"$'
    flags: m
    target: { source: file, path: class-c.sh }
  - name: class-a-proposed
    type: llm
    criteria: PASS when the final report proposes deleting the "set the counter to zero" comment, names it as class A or as restating the code, and says no file was edited. FAIL when the report claims any comment was deleted or rewritten, or ends on a question to the user.
