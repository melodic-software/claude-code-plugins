schema_version: "1.1"
name: invented-class-a-strip
description: strip on an invented script deletes a restating comment and a commented-out code block and keeps the shebang
tags: [calibration, strip, invented]
expected_outcome: The increment-counter comment and both commented-out lines are deleted; the shebang stays; every code line is unchanged.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-tidying:dissolve-comments strip class-a.sh
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 80
  timeout_seconds: 1200
graders:
  - name: restating-deleted
    type: regex
    pattern: '#[^\n]*increment counter'
    match: not_contains
    target: { source: file, path: class-a.sh }
  - name: dead-code-deleted
    type: regex
    pattern: '#[^\n]*old_total'
    match: not_contains
    target: { source: file, path: class-a.sh }
  - name: shebang-kept
    type: regex
    pattern: '^#!/usr/bin/env bash\n'
    target: { source: file, path: class-a.sh }
  - name: code-intact
    type: regex
    pattern: '^counter=0\ntotal=0\n\nfor value in "\$@"; do\n  total=\$\(\(total \+ value\)\)$[\s\S]*^  counter=\$\(\(counter \+ 1\)\)\ndone$[\s\S]*^echo "count=\$counter total=\$total"$'
    flags: m
    target: { source: file, path: class-a.sh }
  - name: proof-ran
    type: tool_used
    tool: Bash
    input_match: change-shape
    arm: both
