schema_version: "1.1"
name: su-check-no-lanes
description: check on a repo with no project lanes and no overrides file reports the absence as INFO, never FAIL, names the bundled scaffold sources and the stored hard_exclusions posture, and writes nothing
tags: [setup, check, read-only]
expected_outcome: The report marks the missing .claude/tidy-lanes/ as INFO (tidy falls back to the bundled lanes), lists the bundled lanes shell-tooling and docs-prose and the four templates as scaffold sources, reports the absent exclusion-overrides file as INFO, reports hard_exclusions as enforce, and creates or edits no file.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-tidying:setup check
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: absence-reported-as-info
    type: regex
    pattern: 'INFO[^\n]{0,250}(project lanes?|tidy-lanes)|(project lanes?|tidy-lanes)[^\n]{0,250}INFO'
    flags: i
  - name: absence-not-a-fail
    type: regex
    pattern: '\bFAIL\b[^\n]{0,150}([Pp]roject lanes?|[Tt]idy-lanes)|([Pp]roject lanes?|[Tt]idy-lanes)[^\n]{0,150}\bFAIL\b'
    match: not_contains
  - name: bundled-lanes-named
    type: regex
    pattern: '(?=[\s\S]*shell-tooling)(?=[\s\S]*docs-prose)'
  - name: templates-named
    type: regex
    pattern: '(?=[\s\S]*host-wiring)(?=[\s\S]*polyglot-services)'
  - name: overrides-file-reported
    type: regex
    pattern: 'exclusion-overrides'
  - name: hard-exclusions-posture
    type: regex
    pattern: 'hard_exclusions[\s\S]{0,250}enforce'
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
