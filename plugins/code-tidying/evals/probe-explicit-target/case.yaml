schema_version: "1.1"
name: probe-explicit-target
description: Confirms the slash invocation fires dissolve-comments, its proof script runs, and file graders read the edited file
tags: [probe]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-tidying:dissolve-comments app.sh
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 80
  timeout_seconds: 1200
graders:
  - name: class-a-deleted
    type: regex
    pattern: "#[^\\n]*increment counter"
    match: not_contains
    target: { source: file, path: app.sh }
  - name: directive-kept
    type: regex
    pattern: "# shellcheck disable=SC2034"
    target: { source: file, path: app.sh }
  - name: code-kept
    type: regex
    pattern: "counter=\\$\\(\\(counter \\+ 1\\)\\)"
    target: { source: file, path: app.sh }
  - name: proof-ran
    type: tool_used
    tool: Bash
    input_match: change-shape
    arm: both
