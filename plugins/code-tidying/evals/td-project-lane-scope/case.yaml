schema_version: "1.1"
name: td-project-lane-scope
description: 'a project .claude/tidy-lanes/shell-tooling.md declaring Merge semantics and Scope ops/**/*.sh retargets the lane: ops/rotate-logs.sh is tidied and scripts/build-report.sh (bundled scope only) is left alone'
tags: [tidy, in-place, lane-resolution]
expected_outcome: 'The run reads the project lane file, removes keep_days_old from ops/rotate-logs.sh, and makes no change to scripts/build-report.sh; nothing is committed.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/code-tidying:tidy in-place shell-tooling'
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 120
  timeout_seconds: 1800
graders:
  - name: project-lane-read
    type: tool_used
    tool: 'Read'
    input_match: 'tidy-lanes/shell-tooling\.md'
    arm: 'both'
  - name: in-lane-script-tidied
    type: regex
    pattern: 'keep_days_old'
    match: 'not_contains'
    target: { source: file, path: ops/rotate-logs.sh }
  - name: out-of-lane-dead-var-kept
    type: regex
    pattern: '^legacy_mode=1$'
    flags: 'm'
    target: { source: file, path: scripts/build-report.sh }
  - name: out-of-lane-comment-kept
    type: regex
    pattern: '# Loop over files'
    target: { source: file, path: scripts/build-report.sh }
  - name: no-edit-out-of-lane
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"[^"]*build-report\.sh"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-commit
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"[^"]*\bgit\b[^"]*\bcommit\b'
    min: 0
    max: 0
    arm: 'both'
