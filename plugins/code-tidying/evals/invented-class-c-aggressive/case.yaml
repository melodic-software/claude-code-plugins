schema_version: "1.1"
name: invented-class-c-aggressive
description: necessary on an invented script deletes the our-code deadlock warning as a reshape flag, keeps two outside-constraint comments, and deletes a restating comment
tags: [calibration, necessary, invented]
expected_outcome: The lock-deadlock warning is deleted and reported as a reshape flag or an unenforced constraint naming prepare_lock or start_worker; the retry rationale (the upstream API's behavior) and the timeout rationale (the load balancer's limit) survive as outside-constraint comments; the set-the-counter comment is deleted; code is unchanged.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-tidying:remove-comments necessary class-c.sh
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 80
  timeout_seconds: 1200
graders:
  - name: warning-deleted
    type: regex
    pattern: '#[^\n]*deadlock'
    flags: i
    match: not_contains
    target: { source: file, path: class-c.sh }
  - name: warning-flagged
    type: regex
    pattern: '(reshape|unenforced)[\s\S]{0,600}(prepare_lock|start_worker)|(prepare_lock|start_worker)[\s\S]{0,600}(reshape|unenforced)'
    flags: i
    target: last_message
  - name: retry-rationale-kept
    type: regex
    pattern: '#[^\n]*upstream API'
    target: { source: file, path: class-c.sh }
  - name: timeout-rationale-kept
    type: regex
    pattern: '#[^\n]*load balancer'
    target: { source: file, path: class-c.sh }
  - name: class-a-deleted
    type: regex
    pattern: '#[^\n]*set the counter to zero'
    match: not_contains
    target: { source: file, path: class-c.sh }
  - name: kept-comment-succinct
    type: regex
    pattern: '(^[ \t]*#(?!!| shellcheck )[^\n]*\n){3}'
    flags: m
    match: not_contains
    target: { source: file, path: class-c.sh }
  - name: code-intact
    type: regex
    pattern: '^prepare_lock\(\) \{\n  : >"\$lock_file"\n\}[\s\S]*^  local retries=3\n  for \(\(attempt = 1; attempt <= retries; attempt\+\+\)\); do\n    if curl --silent --max-time "\$timeout" "\$api_url/status"; then\n      return 0\n    fi\n  done\n  return 1\n\}[\s\S]*^counter=0$[\s\S]*^timeout=5$[\s\S]*^prepare_lock\nstart_worker\n\nfetch_status \|\| counter=\$\(\(counter \+ 1\)\)\necho "failures: \$counter"$'
    flags: m
    target: { source: file, path: class-c.sh }
  - name: proof-ran
    type: tool_used
    tool: Bash
    input_match: change-shape
    arm: both
  - name: no-intentional-removal-trailer
    type: regex
    pattern: '^[ \t]*Intentional-removal:'
    flags: m
    match: not_contains
    target: last_message
