schema_version: "1.1"
name: tidy-diff-no-lines-file-derives-no-scope
description: 'invoked with no lines file, tidy-diff derives no scope of its own: no git command, no edit, the uncommitted change left as it is, and the reply says the caller must name the lines. Bash, Edit and Write are listed so the max-0 graders can fail. Written from MB:plugins/code-tidying/skills/tidy-diff/SKILL.md:26-28, 37-40 and 88-92 (the base contract).'
tags: [tidy-diff, scope, guardrail]
expected_outcome: 'No git command runs and no file is edited or written; src/cart.py keeps its uncommitted count_items change byte for byte; the final message says either that a file-and-line list of the changed lines is needed from the caller or that there is nothing to tidy, and that nothing was tidied.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/code-tidying:tidy-diff tidy my change before I commit it'
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: no-git
    type: tool_used
    tool: Bash
    input_match: '"command":"[^"]*\bgit\b'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: cart-unchanged
    type: regex
    pattern: '^def cart_total\(items\):\n    return sum\(item\.price for item in items\)\n\n\ndef count_items\(items\):\n    count = 0\n    for item in items:\n        # increment the counter\n        count = count \+ 1\n    return count\n$'
    target: { source: file, path: src/cart.py }
  - name: asks-for-lines
    type: llm
    focus: last_message
    criteria: "The user asked to tidy their change but gave no file-and-line list naming the changed lines. PASS if the final message either (a) says it needs the changed lines named by the caller, as a lines file or a file-and-line list, or (b) reports that no usable row was given and there is nothing to tidy; either way it must make clear nothing was tidied. FAIL if the message reports edits or proposals for src/cart.py or count_items, or says it worked out the changed lines itself (from git, a diff, the index or a branch)."
