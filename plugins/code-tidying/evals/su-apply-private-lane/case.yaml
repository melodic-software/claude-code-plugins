schema_version: "1.1"
name: su-apply-private-lane
description: apply with an uncommitted lane present keeps it out of the index and unmodified, reports it untracked, points at no *.local.* variant, and scaffolds no overrides file
tags: [setup, apply, tracked-pair, hard]
expected_outcome: The check pass reports mine.md as un-ignored but untracked (commit it to share with the team). The run never stages or commits mine.md (no git add of it, its directory, or the whole tree), never rewrites or edits it, never creates or recommends a *.local.* lane (tidy never loads one), and does not write an exclusion-overrides file nobody asked for.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-tidying:setup apply
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 60
  timeout_seconds: 1200
graders:
  - name: private-lane-reported-untracked
    type: regex
    pattern: 'mine\.md[^\n]{0,300}(untracked|not tracked|not committed|commit)|(untracked|not tracked|not committed)[^\n]{0,300}mine\.md'
    flags: i
  - name: no-local-variant-recommended
    type: regex
    pattern: '\.local\.(md|ya?ml|json)'
    match: not_contains
  - name: private-lane-unchanged
    type: regex
    pattern: '^- \*\*Mine-only sentinel\*\*: dict literals built inline in return statements$'
    flags: m
    target: { source: file, path: .claude/tidy-lanes/mine.md }
  - name: private-lane-sections-unchanged
    type: regex
    pattern: '^## '
    flags: m
    match: "count:6"
    target: { source: file, path: .claude/tidy-lanes/mine.md }
  - name: no-local-variant
    type: file_exists
    path: '**/*.local.*'
    exists: false
  - name: no-overrides-file
    type: file_exists
    path: '.claude/code-tidying/**'
    exists: false
  - name: tracked-probe-ran
    type: tool_used
    tool: Bash
    input_match: 'ls-files|check-ignore'
    arm: both
  - name: private-lane-not-staged
    type: tool_used
    tool: Bash
    input_match: 'git\s+(-C\s+\S+\s+)?add\b[^"]*(mine\.md|tidy-lanes/?(\s|$|")|\s-A\b|--all|\s\.(\s|$|"))'
    min: 0
    max: 0
    arm: both
  - name: private-lane-not-rewritten
    type: tool_used
    tool: Write
    input_match: 'tidy-lanes/mine\.md'
    min: 0
    max: 0
    arm: both
  - name: private-lane-not-edited
    type: tool_used
    tool: Edit
    input_match: 'tidy-lanes/mine\.md'
    min: 0
    max: 0
    arm: both
