schema_version: "1.1"
name: real-silent-revert-design-strip
description: strip on the check-silent-revert.sh design block deletes every comment, rewrites no code, and stages the narrative
tags: [calibration, strip, real]
expected_outcome: All 34 comment lines are deleted; die() is unchanged; the removed design history and threshold warning are staged in the report.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /code-tidying:dissolve-comments strip silent-revert-design.sh
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 80
  timeout_seconds: 1200
graders:
  - name: no-comments-left
    type: regex
    pattern: '^\s*#'
    flags: m
    match: not_contains
    target: { source: file, path: silent-revert-design.sh }
  - name: code-intact
    type: regex
    pattern: 'die\(\) \{\n  echo "check-silent-revert: \$\*" >&2\n  exit 2\n\}'
    target: { source: file, path: silent-revert-design.sh }
  - name: proof-ran
    type: tool_used
    tool: Bash
    input_match: change-shape
    arm: both
  - name: narrative-staged
    type: llm
    criteria: PASS when the final report contains a proposed commit-message block that preserves the removed design history (the rejected alternatives and the chosen blame-of-deleted-lines design) and the warning that no volume threshold separates incidents from routine deletions. FAIL when either appears nowhere in the report.
