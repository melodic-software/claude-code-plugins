schema_version: "1.1"
name: su-apply-headless-master-key-configure
graders:
  - name: 'configure-route'
    type: 'regex'
    pattern: 'claude plugin configure desktop-notification@\S+\s+--values-stdin'
    target: 'last_message'
  - name: 'values-false'
    type: 'regex'
    pattern: '\"desktop_notification_enabled\"\s*:\s*\"false\"'
    target: 'last_message'
  - name: 'fallback-after-configure'
    type: 'regex'
    pattern: 'claude plugin configure desktop-notification@\S+\s+--values-stdin[\s\S]*?claude plugin install desktop-notification@\S+[^\n]*?--config[ =]desktop_notification_enabled=false\b'
    target: 'last_message'
  - name: 'rerun-still-writes'
    type: 'llm'
    criteria: 'The reply says that running the install --config rerun against an already-installed plugin prints already installed and still writes the value.'
    focus: 'last_message'
  - name: 'one-channel-own-key'
    type: 'llm'
    criteria: 'The reply says one channel is muted the same way through that channel''s own key, naming at least one of desktop_notification_bell_enabled, desktop_notification_terminal_notify_enabled or desktop_notification_os_toast_enabled.'
    focus: 'last_message'
  - name: 'no-uninstall-with-reason'
    type: 'llm'
    criteria: 'The reply does not tell the user to uninstall the plugin in order to reconfigure it, and says why: uninstalling drops the plugin''s stored pluginConfigs entry and resets every option to its manifest default.'
    focus: 'last_message'
  - name: 'scope-rule'
    type: 'llm'
    criteria: 'The reply says to run the command from the project the plugin is installed in (claude plugin configure has no scope flag), and that the install rerun''s -s flag defaults to user, so the user passes the scope claude plugin list reports for this plugin.'
    focus: 'last_message'
  - name: 'fresh-session-observed-value'
    type: 'llm'
    criteria: 'The reply does not claim the hook is now off. It tells the user to rerun check in a fresh session, because a check in the same session still reports the old value, and to trust the effective value that check observes.'
    focus: 'last_message'
  - name: 'no-plugin-cli-write'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?claude(?:\.exe)?(?:\\\"|'')?(?:(?:\s|\\\\\\n)+-[^\s\"\\]+)*(?:\s|\\\\\\n)+plugins?(?:\s|\\\\\\n)+(?:install|uninstall|remove|configure|enable|disable|update)\b(?!\s+--help\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
