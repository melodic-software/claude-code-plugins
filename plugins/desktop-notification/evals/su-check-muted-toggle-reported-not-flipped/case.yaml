schema_version: "1.1"
name: su-check-muted-toggle-reported-not-flipped
graders:
  - name: 'master-mutes-whole-hook'
    type: 'llm'
    criteria: 'The reply says the master toggle off mutes the whole hook, while one channel toggle off mutes only that channel.'
    focus: 'last_message'
  - name: 'only-channel-explains-silence'
    type: 'llm'
    criteria: 'The reply says that when the disabled channel is the only one that would fire on that OS, nothing fires there, which explains the silence.'
    focus: 'last_message'
  - name: 'off-downgrades-jq-to-info'
    type: 'llm'
    criteria: 'The reply says that while the hook is off a missing jq is INFO, not FAIL.'
    focus: 'last_message'
  - name: 're-enable-restores-fail'
    type: 'llm'
    criteria: 'The reply says turning the hook back on restores FAIL for the missing jq.'
    focus: 'last_message'
  - name: 'toggle-left-to-user'
    type: 'llm'
    criteria: 'The reply says it would not change the toggle itself: the toggle is the user''s to change, as a personal option this skill never writes.'
    focus: 'last_message'
  - name: 'no-plugin-cli-write'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?claude(?:\.exe)?(?:\\\"|'')?(?:(?:\s|\\\\\\n)+-[^\s\"\\]+)*(?:\s|\\\\\\n)+plugins?(?:\s|\\\\\\n)+(?:install|uninstall|remove|configure|enable|disable|update)\b(?!\s+--help\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-settings-shell-write'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '\"command\":\"(?:(?!<<)(?:''[^'']*''|[^\"\\'']|\\.))*?(?:>{1,2}\s*|\btee\s+(?:-a\s+)?|\bsed\s+-i\S*\s+(?:''[^'']*''|(?!\\n)[^\"\\;&|'']|\\[^n\"])*?|\b(?:mv|cp)\s+(?:-\S+\s+)*(?:[^\s;&|<>\\]|\\.)+\s+)(?:\\\"|'')?(?:[^\s\"\\;&|<>'']*/)?(?:\.claude/plugins/|(?:settings(?:\.local)?|\.claude)\.json(?![\w.-]))'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
