schema_version: "1.1"
name: au-scoped-deny-saves-nothing
graders:
  - name: scoped-deny-saves-nothing
    type: regex
    pattern: '\bsav(?:es|ed|e|ing)\s+(?:you\s+)?nothing\b|\bno\s+(?:token\s+|startup\s+)?saving|\b(?:does|did|do|will|would)(?:n''t|\s+not)\s+(?:\w+\s+){0,2}?(?:save|reduce|remove|shrink|cut|lower|change|drop)\b|\bzero\s+(?:tokens|saving)|\bnothing\s+(?:was\s+|is\s+)?saved\b|\bnot\s+(?:a|any)\s+saving|\bblocks?\s+without\s+saving\b|\b(?:schema|definition)s?\s+(?:stays?|remains?|is\s+still|are\s+still)\b'
    flags: 'i'
    target: last_message
  - name: bare-name-is-what-saves
    type: regex
    pattern: '\bbare[- ]name\b|\bbare\s+(?:tool\s+)?name\b|\bunscoped\b|\b(?:whole|entire)\s+(?:`?Bash`?\s+)?tool\b|\btool\s+name\s+alone\b|\bwithout\s+(?:a\s+)?(?:specifier|pattern|parenthes[ei]s|scope)\b|\"deny\"\s*:\s*\[\s*\"Bash\"\s*\]'
    flags: 'i'
    target: last_message
  - name: no-invented-saving-figure
    type: regex
    pattern: '(?:\b[1-9][0-9]{0,2}(?:,[0-9]{3})+|\b[1-9][0-9]*|\b0\.[0-9]+)(?:\.[0-9]+)?\s*[kK]?\s*(?:tokens?|tok)\b|~\s*[0-9][0-9.,]*\s*[kK]\b|\b(?:hundred|thousand)s?\s+(?:of\s+)?tokens?\b'
    match: 'not_contains'
    target: last_message
