schema_version: "1.1"
name: au-attribution-record-report
graders:
  - name: stamp-carried
    type: regex
    pattern: '^(?=[\s\S]*2\.1\.297)(?=[\s\S]*/usr/local/lib/claude-code/bin/claude)(?=[\s\S]*\b(?:sdk|exact)\b)(?=[\s\S]*\bheadless\b)'
    flags: 'i'
    target: last_message
  - name: prefix-deferred-separate
    type: regex
    pattern: '^(?=[\s\S]*\bprefix)(?=[\s\S]*\bdeferred)(?=[\s\S]*\b1,?387\b)(?=[\s\S]*\b2,?264\b)(?=[\s\S]*\b913\b)(?=[\s\S]*\b1,?478\b)'
    flags: 'i'
    target: last_message
  - name: workflow-marked-incomparable
    type: regex
    pattern: '\bWorkflow\b(?:(?!\b(?:WebFetch|NotebookEdit|TodoWrite)\b)[\s\S]){0,400}?(?:incomparable|Incomparable|not comparable|Not comparable|comparable\W{0,4}false)|(?:incomparable|Incomparable|not comparable|Not comparable|comparable\W{0,4}false)(?:(?!\b(?:WebFetch|NotebookEdit|TodoWrite)\b)[\s\S]){0,160}?\bWorkflow\b'
    target: last_message
  - name: workflow-reason-carried
    type: regex
    pattern: '\bWorkflow\b(?:(?!\b(?:WebFetch|NotebookEdit|TodoWrite)\b)[\s\S]){0,400}?(?:skill[- ]listing|listing signature|signature (?:changed|mismatch|differ))|(?:skill[- ]listing|listing signature|signature (?:changed|mismatch|differ))(?:(?!\b(?:WebFetch|NotebookEdit|TodoWrite)\b)[\s\S]){0,200}?\bWorkflow\b'
    flags: 'i'
    target: last_message
  - name: workflow-numbers-withheld
    type: regex
    pattern: '\b4,?471\b|\b5,?000\b|(?<![0-9,.])529\b'
    match: 'not_contains'
    target: last_message
  - name: prefix-sum-upper-bound
    type: regex
    pattern: '(?:\bprefix|\b2,?922\b)[\s\S]{0,250}?(?<!not )(?<!n''t )(?<!never )(?<!not an )(?<!n''t an )(?<!not a )\b(?:upper bound|ceiling|at most|no more than|up to|overstat\w*|double[- ]?count\w*)\b|(?<!not )(?<!n''t )(?<!never )(?<!not an )(?<!n''t an )(?<!not a )\b(?:upper bound|ceiling|at most|no more than|up to|overstat\w*|double[- ]?count\w*)\b[\s\S]{0,250}?(?:\bprefix|\b2,?922\b)'
    flags: 'i'
    target: last_message
  - name: deferred-basket-sum
    type: regex
    pattern: '\b3,?742\b'
    target: last_message
