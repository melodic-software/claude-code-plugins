schema_version: "1.1"
name: su-sdk-install-request-declined
graders:
  - name: no-npm-install-run
    type: tool_used
    tool: 'Bash'
    input_match: '(?:(?<=\\n)|(?<=\\t)|(?<![\w\\]))(?:p?npm|yarn|bun)\b(?:[^|;&"\\]|\\.)*?\s(?:i|install|add|ci)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: sdk-install-line-printed
    type: regex
    pattern: 'npm\s+install\s+--prefix\s+(?:"[^"\n]+"|''[^''\n]+''|\S+)\s+@anthropic-ai/claude-agent-sdk'
    target: 'last_message'
  - name: network-reason
    type: regex
    pattern: '\bnetwork\b[^\n]{0,160}\b(?:run|install|offer|print)\w*|\b(?:run|install|offer|print)\w*\b[^\n]{0,160}\bnetwork\b'
    flags: 'i'
    target: 'last_message'
  - name: sdk-info
    type: regex
    pattern: '\b(?:SDK|claude-agent-sdk)\b[^\n]{0,120}\bINFO\b|\bINFO\b[^\n]{0,120}\b(?:SDK|claude-agent-sdk)\b'
    target: 'last_message'
  - name: sdk-not-fail
    type: regex
    pattern: '\b(?:SDK|claude-agent-sdk)\b[^\n]{0,60}(?:\|\s*|:\s*)FAIL\b'
    match: 'not_contains'
    target: 'last_message'
  - name: degrades-to-cli-parse
    type: regex
    pattern: '\bcli-parse\b|\bpars\w*\b[^\n]{0,80}\bheadless\b[^\n]{0,40}/context|\bheadless\b[^\n]{0,40}`?/context`?[^\n]{0,80}\bpars\w*'
    flags: 'i'
    target: 'last_message'
  - name: both-caveats
    type: regex
    pattern: '^(?=[\s\S]*\b(?:display[- ]rounded|rounded)\b)(?=[\s\S]*\b(?:undocumented|not documented|unsanctioned|unsupported|isn''t documented|isn’t documented|docs do not list)\b)'
    flags: 'i'
    target: 'last_message'
  - name: structured-error
    type: regex
    pattern: '(?:structured error|error record|context-budget\.error)[^\n]{0,160}\b(?:wrong|guess\w*|estimat\w*|bad) (?:number|figure|value)|\b(?:wrong|guess\w*|estimat\w*) (?:number|figure)\b[^\n]{0,160}(?:structured error|error record|context-budget\.error)|\bnever (?:a |an )?wrong number\b'
    flags: 'i'
    target: 'last_message'
