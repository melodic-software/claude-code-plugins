schema_version: "1.1"
name: su-bare-check-read-only
graders:
  - name: status-table-all-rows
    type: regex
    pattern: '^(?=[\s\S]*^\|[^|\n]*\b[Nn]ode(?:\.js)?\b[^|\n]*\|[^\n]*\b(?:PASS|FAIL|INFO)\b|[\s\S]*^\|\s*(?:PASS|FAIL|INFO)\s*\|[^|\n]*\b[Nn]ode(?:\.js)?\b)(?=[\s\S]*^\|[^|\n]*(?:\bCLI\b|[Cc]laude(?: Code)?(?![- ]?[Aa]gent)\b)[^|\n]*\|[^\n]*\b(?:PASS|FAIL|INFO)\b|[\s\S]*^\|\s*(?:PASS|FAIL|INFO)\s*\|[^|\n]*(?:\bCLI\b|[Cc]laude(?: Code)?(?![- ]?[Aa]gent)\b))(?=[\s\S]*^\|[^|\n]*(?:\bSDK\b|claude-agent-sdk)[^|\n]*\|[^\n]*\b(?:PASS|FAIL|INFO)\b|[\s\S]*^\|\s*(?:PASS|FAIL|INFO)\s*\|[^|\n]*(?:\bSDK\b|claude-agent-sdk))(?=[\s\S]*^\|[^|\n]*(?:[Tt]oggle|[Ss]ettings[\s_-]*write)[^|\n]*\|[^\n]*\b(?:PASS|FAIL|INFO)\b|[\s\S]*^\|\s*(?:PASS|FAIL|INFO)\s*\|[^|\n]*(?:[Tt]oggle|[Ss]ettings[\s_-]*write))'
    flags: 'm'
    target: 'last_message'
  - name: reads-audit-prereqs
    type: regex
    pattern: '\\?"name\\?":\s*\\?"Read\\?",\s*\\?"input\\?":\s*\{[^\n]{0,200}?skills/audit/SKILL\.md|\\?"name\\?":\s*\\?"Bash\\?",\s*\\?"input\\?":\s*\{\s*\\?"command\\?":\s*\\?"(?:[^"\\]|\\.){0,400}?(?:(?<=\\n)|(?<=\\t)|(?<![\w\\]))(?:cat|head|tail|sed|awk|less|more|nl|bat|grep|rg)\b(?:[^"\\]|\\.){0,400}?skills/audit/SKILL\.md'
    target: 'trace'
    arm: 'with-only'
  - name: reads-engine-header
    type: regex
    pattern: '\\?"name\\?":\s*\\?"Read\\?",\s*\\?"input\\?":\s*\{[^\n]{0,200}?skills/audit/scripts/measure\.mjs|\\?"name\\?":\s*\\?"Bash\\?",\s*\\?"input\\?":\s*\{\s*\\?"command\\?":\s*\\?"(?:[^"\\]|\\.){0,400}?(?:(?<=\\n)|(?<=\\t)|(?<![\w\\]))(?:cat|head|tail|sed|awk|less|more|nl|bat|grep|rg)\b(?:[^"\\]|\\.){0,400}?skills/audit/scripts/measure\.mjs'
    target: 'trace'
    arm: 'with-only'
  - name: no-ask-tool
    type: tool_used
    tool: 'AskUserQuestion'
    min: 0
    max: 0
    arm: 'both'
  - name: no-install
    type: tool_used
    tool: 'Bash'
    input_match: '(?:(?<=\\n)|(?<=\\t)|(?<![\w\\]))(?:(?:apt(?:-get)?|brew|dnf|yum|choco|winget|scoop|pacman|apk|snap|nvm|fnm|volta|asdf|mise)\s+(?:-\S+\s+)*(?:install|add)\b|(?:p?npm|yarn|bun)\b(?:[^|;&"\\]|\\.)*?\s(?:i|install|add|ci)\b|(?:curl|wget)\b(?:[^"\\]|\\.)*\|\s*(?:sudo\s+(?:-\S+\s+)*)?(?:bash|zsh|sh)\b|n\s+(?:lts|latest)\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-plugin-command-run
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?claude(?:\.exe)?(?:\\\"|'')?(?:(?:\s|\\\\\\n)+-[^\s\"\\]+)*(?:\s|\\\\\\n)+plugins?(?:\s|\\\\\\n)+(?:install|uninstall|remove|configure|enable|disable|update)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-edit
    type: tool_used
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
  - name: no-write
    type: tool_used
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
