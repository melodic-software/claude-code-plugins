schema_version: "1.1"
name: su-check-report
graders:
  - name: status-table-all-rows
    type: regex
    pattern: '^(?=[\s\S]*^\|[^|\n]*\b[Nn]ode(?:\.js)?\b[^|\n]*\|[^\n]*\b(?:PASS|FAIL|INFO)\b|[\s\S]*^\|\s*(?:PASS|FAIL|INFO)\s*\|[^|\n]*\b[Nn]ode(?:\.js)?\b)(?=[\s\S]*^\|[^|\n]*(?:\bCLI\b|[Cc]laude(?: Code)?(?![- ]?[Aa]gent)\b)[^|\n]*\|[^\n]*\b(?:PASS|FAIL|INFO)\b|[\s\S]*^\|\s*(?:PASS|FAIL|INFO)\s*\|[^|\n]*(?:\bCLI\b|[Cc]laude(?: Code)?(?![- ]?[Aa]gent)\b))(?=[\s\S]*^\|[^|\n]*(?:\bSDK\b|claude-agent-sdk)[^|\n]*\|[^\n]*\b(?:PASS|FAIL|INFO)\b|[\s\S]*^\|\s*(?:PASS|FAIL|INFO)\s*\|[^|\n]*(?:\bSDK\b|claude-agent-sdk))'
    flags: 'm'
    target: last_message
  - name: sdk-install-line-printed
    type: regex
    pattern: 'npm\s+install\s+--prefix\s+(?:"[^"\n]+"|''[^''\n]+''|\S+)\s+@anthropic-ai/claude-agent-sdk'
    target: last_message
  - name: no-npm-install-run
    type: tool_used
    tool: 'Bash'
    input_match: '\b(?:p?npm|yarn|bun)\b(?:[^|;&"\\]|\\.)*?\s(?:i|install|add|ci)\b'
    min: 0
    max: 0
    arm: 'both'
