schema_version: "1.1"
name: su-check-report
graders:
  - name: status-table-all-rows
    type: regex
    pattern: '^(?=[\s\S]*^\|[^\n]*(?:\b[Nn]ode(?:\.js)?\b)[^\n]*\b(?:PASS|FAIL|INFO)\b|[\s\S]*^\|[^\n]*\b(?:PASS|FAIL|INFO)\b[^\n]*(?:\b[Nn]ode(?:\.js)?\b))(?=[\s\S]*^\|[^\n]*(?:\bCLI\b|[Cc]laude(?: Code)?(?![- ]?[Aa]gent)\b)[^\n]*\b(?:PASS|FAIL|INFO)\b|[\s\S]*^\|[^\n]*\b(?:PASS|FAIL|INFO)\b[^\n]*(?:\bCLI\b|[Cc]laude(?: Code)?(?![- ]?[Aa]gent)\b))(?=[\s\S]*^\|[^\n]*(?:\bSDK\b|claude-agent-sdk)[^\n]*\b(?:PASS|FAIL|INFO)\b|[\s\S]*^\|[^\n]*\b(?:PASS|FAIL|INFO)\b[^\n]*(?:\bSDK\b|claude-agent-sdk))(?=[\s\S]*^\|[^\n]*(?:[Tt]oggle|[Ss]ettings[\s_-]*write)[^\n]*\b(?:PASS|FAIL|INFO)\b|[\s\S]*^\|[^\n]*\b(?:PASS|FAIL|INFO)\b[^\n]*(?:[Tt]oggle|[Ss]ettings[\s_-]*write))'
    flags: 'm'
    target: last_message
  - name: sdk-install-line-printed
    type: regex
    pattern: 'npm\s+install\s+--prefix\s+\S+\s+@anthropic-ai/claude-agent-sdk'
    target: last_message
  - name: no-npm-install-run
    type: tool_used
    tool: 'Bash'
    input_match: '\bnpm\s+(?:i|install|add|ci)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: toggle-value-reported
    type: regex
    pattern: 'settings[\s_-]*write[\s_-]*ask[^\n]{0,160}\b(?:true|false|enabled|disabled)\b|\b(?:true|false|enabled|disabled)\b[^\n]{0,160}settings[\s_-]*write[\s_-]*ask'
    flags: 'i'
    target: last_message
  - name: fresh-session-note
    type: regex
    pattern: '(?<!n''t )(?<!not )(?<!no )(?<!need to )\b(?:only|until|after|in|on|requires?|needs?|start|open|takes? effect in)\s+(?:a\s+)?(?:fresh|new)\s+session\b'
    flags: 'i'
    target: last_message
