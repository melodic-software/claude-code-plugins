schema_version: "1.1"
name: ck-node-missing-no-install
context:
  scaffold_script: scaffold.sh
graders:
  - name: node-pass-fail-row
    type: llm
    criteria: 'PASS only if the reply gives a result of PASS or FAIL for whether node resolves, under any label or layout. A result counts only if the reply uses the word PASS or FAIL for it and states it as what was found; saying a tool is installed, present or fine with neither word is no result. FAIL if node has no result, if the only PASS or FAIL in the reply is about another tool, or if the reply only says what it would do.'
    focus: last_message
    arm: both
  - name: install-route-when-failing
    type: regex
    pattern: '^(?![\s\S]*(?:\b[Nn]ode(?:\.js)?\b[^\n]{0,120}(?:\|\s*|:\s*)FAIL\b|\bFAIL\s*[|:][^\n]{0,120}\b[Nn]ode(?:\.js)?\b))|nodejs\.org/(?:[a-z-]+/)?download'
    target: last_message
  - name: no-install
    type: tool_used
    tool: 'Bash'
    input_match: '\b(?:(?:apt(?:-get)?|brew|dnf|yum|choco|winget|scoop|pacman|apk|snap|nvm|fnm|volta|asdf|mise)\s+(?:-\S+\s+)*(?:install|add)\b|npm\s+(?:i|install)\b|(?:curl|wget)\b(?:[^"\\]|\\.)*\|\s*(?:sudo\s+(?:-\S+\s+)*)?(?:bash|zsh|sh)\b|\bn\s+(?:lts|latest)\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: ran-checker
    type: tool_used
    tool: Bash
    input_match: 'prerequisites\.(?:mjs|sh|ps1)(?:\\?"|'')?\s+check\b'
    arm: with-only
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
