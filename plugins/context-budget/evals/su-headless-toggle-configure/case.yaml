schema_version: "1.1"
name: su-headless-toggle-configure
graders:
  - name: configure-route
    type: regex
    pattern: 'claude plugin configure context-budget@\S+'
    target: 'last_message'
  - name: string-false-value
    type: regex
    pattern: '\bsettings_write_ask_enabled\b[^\n]{0,40}?\bfalse\b'
    target: 'last_message'
  - name: no-uninstall
    type: llm
    criteria: 'The reply does not tell the user to uninstall the plugin (for example claude plugin uninstall, then reinstall) in order to reconfigure it, and rules uninstalling out as a way to reconfigure.'
    focus: 'last_message'
  - name: cites-reconfiguration-convention
    type: regex
    pattern: '\bplugin[- ]reconfiguration\b|\breconfiguration[- ](?:convention|contract|routes|guide)\b'
    flags: 'i'
    target: 'last_message'
  - name: no-restated-versions
    type: regex
    pattern: '\b(?:verified|measured|tested|confirmed)\b[^\n]{0,80}\b2\.1\.(?!285\b)\d{3}\b|\b2\.1\.(?!285\b)\d{3}\b[^\n]{0,80}\b(?:verified|measured|tested|confirmed)\b'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
  - name: fresh-session-observed-value
    type: llm
    criteria: 'The reply does not claim the checkpoint is now off. It tells the user to confirm the change by rerunning the setup check in a fresh session, because a same-session check can still report the old value.'
    focus: 'last_message'
  - name: no-plugin-command-run
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|\|\||[;|&(`]|\{(?=\s)|\$\(|\\n|\s-exec(?:dir)?(?=\s)))?(?:\s|\\\\\\n)*(?:(?:\w+=\S*|(?:sudo|doas|env|exec|eval|time|nice|nohup|xargs|then|do|else|!)(?:\s+-[^\s\"\\]+)*|command(?:\s+-p)?|(?:python[\d.]*|py)(?:\.exe)?(?:\s+-\w+)*?\s+-m|timeout(?:\s+-\S+)*\s+\S+)(?:\s|\\\\\\n)+|(?:(?:bash|dash|zsh|sh)(?:\s+-[^\s\"\\]+)*?\s+-\w*c\w*|(?:powershell|pwsh)(?:\.exe)?(?:\s+-\w+)*?\s+-(?:Command|c)|cmd(?:\.exe)?\s+/[cC])\s+(?:\\\"|'')?(?:\s|\\\\\\n)*)*(?:\\\"|'')?(?:[^\s\"\\;&|='']*/)?claude(?:\.exe)?(?:\\\"|'')?(?:(?:\s|\\\\\\n)+-[^\s\"\\]+)*(?:\s|\\\\\\n)+plugins?(?:\s|\\\\\\n)+(?:install|uninstall|remove|configure|enable|disable|update)\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'fallback-after-configure'
    type: 'regex'
    pattern: 'claude plugin configure(?:\s+-\S+)*\s+context\-budget@\S+[\s\S]*?claude plugin install(?:\s+-\S+(?:\s+(?!context\-budget@)(?:\w+|<[^>\s]+>))?)*\s+context\-budget@\S+(?:\\\n|[^\n])*?--config[ =]settings_write_ask_enabled=false\b'
    target: 'last_message'
  - name: 'already-installed-still-writes'
    type: 'regex'
    pattern: '\balready[- ]installed\b[^\n]{0,160}\b(?:still|also)\b[^\n]{0,40}\b(?:writes?|saves?)\b|\bstill (?:writes?|saves?)\b[^\n]{0,160}\balready[- ]installed\b'
    target: 'last_message'
  - name: 'scope-rule'
    type: 'llm'
    criteria: 'The reply says to run claude plugin configure from the project the plugin is installed in, since it has no scope flag, and to pass the install --config rerun the scope claude plugin list reports for this plugin, since a rerun at another scope adds an install record there.'
    focus: 'last_message'
