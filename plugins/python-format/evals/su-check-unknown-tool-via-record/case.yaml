schema_version: "1.1"
name: su-check-unknown-tool-via-record
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'record-tool-resolved'
    type: 'llm'
    criteria: 'The reply says formatting resolves to the python record''s formatter, blackish, even though the plugin ships no adapter for it.'
    focus: 'last_message'
  - name: 'missing-tool-fail'
    type: 'llm'
    criteria: 'The reply grades the format concern FAIL (or says the hooks cannot run it) because blackish is not installed, and gives the record''s install hint (pip install blackish) as the remediation.'
    focus: 'last_message'
  - name: 'lint-unresolved-info'
    type: 'llm'
    criteria: 'The reply reports the lint concern as unresolved or INFO: the record names no lint command and no Ruff config governs the repository, so nothing lints.'
    focus: 'last_message'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
