schema_version: "1.1"
name: su-check-unapproved-record-runs-nothing
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'unapproved-reported'
    type: 'llm'
    criteria: 'The reply reports the python record as unapproved (or not approved, not yet trusted) because it differs from the default branch.'
    focus: 'last_message'
  - name: 'runs-nothing'
    type: 'llm'
    criteria: 'The reply says that while the record is unapproved the hooks run nothing for those concerns, and that the Ruff config does not take over in its place.'
    focus: 'last_message'
  - name: 'approval-routes'
    type: 'llm'
    criteria: 'The reply names how to make it run: merge the record to the default branch, or approve it for this clone with apply approve-record after reading it.'
    focus: 'last_message'
  - name: 'no-approve'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '--approve'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
