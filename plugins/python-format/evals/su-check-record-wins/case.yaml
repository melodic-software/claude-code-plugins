schema_version: "1.1"
name: su-check-record-wins
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'format-from-record'
    type: 'llm'
    criteria: 'The reply says formatting resolves to the repository''s python record, naming tools/fmt.sh (or fmt.sh), and not to Ruff.'
    focus: 'last_message'
  - name: 'lint-from-record'
    type: 'llm'
    criteria: 'The reply says linting resolves to the record''s lint command, naming tools/lint.sh (or lint.sh), and not to Ruff.'
    focus: 'last_message'
  - name: 'record-beats-ruff-config'
    type: 'llm'
    criteria: 'The reply says the record takes precedence over the Ruff config: the ruff.toml does not decide what runs while the record names a command for that concern.'
    focus: 'last_message'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
