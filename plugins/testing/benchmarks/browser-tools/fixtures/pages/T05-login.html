<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>T05 Sign in</title><script src="/fx.js"></script></head>
<body>
<!-- Posts to /login, which sets an HttpOnly session cookie and redirects to /account. The server
     counts logins per run, so a second login is visible to the grader. -->
<main>
  <h1>Sign in</h1>
  <form id="f" method="post">
    <label>Username <input name="username" autocomplete="username"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
</main>
<script>
  document.getElementById("f").action = `/login?run=${fx.run}`;
</script>
</body>
</html>
