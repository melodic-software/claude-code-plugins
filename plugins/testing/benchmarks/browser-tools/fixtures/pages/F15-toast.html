<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>F15 Toast</title><script src="/fx.js"></script>
<style>#toast{position:fixed;bottom:1rem;right:1rem;background:#222;color:#fff;padding:.75rem}#pricing-card{border:1px solid #ccc;padding:1rem;width:260px;margin:1rem 0}</style></head>
<body>
<!-- Saving shows a toast carrying a confirmation code that is removed after 2 s. The pricing card
     is a stable element for element-scoped screenshots. -->
<main>
  <h1>Plan settings</h1>
  <section id="pricing-card" aria-label="Pricing card"><h2>Pro plan</h2><p>$12 per month</p><p>Unlimited projects</p></section>
  <button type="button" id="save">Save plan</button>
  <pre id="result"></pre>
</main>
<script>
  document.getElementById("save").addEventListener("click", async () => {
    fx.record("saved", 1, "inc");
    const c = await fx.code("toa");
    const t = document.createElement("div");
    t.id = "toast"; t.setAttribute("role", "status");
    t.textContent = `Saved. Confirmation ${c}`;
    document.body.append(t);
    setTimeout(() => t.remove(), 2000);
  });
</script>
</body>
</html>
