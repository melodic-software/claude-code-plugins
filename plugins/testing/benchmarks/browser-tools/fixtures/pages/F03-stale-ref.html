<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>F03 Re-render invalidates references</title><script src="/fx.js"></script></head>
<body>
<!-- Typing in the filter re-renders the list by replacing every row node (same text, new elements),
     after `delay`. A reference taken before the re-render points at a detached node. -->
<main>
  <h1>Fruit stock</h1>
  <label>Filter <input id="filter" type="text" autocomplete="off"></label>
  <ul id="list"></ul>
  <p id="status"></p>
  <pre id="result"></pre>
</main>
<script>
  const all = ["Apple", "Banana", "Blackberry", "Blueberry", "Cherry", "Elderberry", "Grape", "Strawberry"];
  const list = document.getElementById("list");
  function render(filter) {
    const rows = all.filter((n) => n.toLowerCase().includes(filter.toLowerCase())).map((n) => {
      const li = document.createElement("li");
      li.textContent = n + " ";
      const b = document.createElement("button");
      b.type = "button"; b.textContent = `Delete ${n}`;
      b.addEventListener("click", () => { fx.record("deleted", n, "append"); li.remove(); });
      li.append(b);
      return li;
    });
    list.replaceChildren(...rows);
    document.getElementById("status").textContent = `${rows.length} shown`;
  }
  render("");
  let timer;
  document.getElementById("filter").addEventListener("input", (e) => {
    clearTimeout(timer);
    timer = setTimeout(() => render(e.target.value), fx.delay);
  });
</script>
</body>
</html>
