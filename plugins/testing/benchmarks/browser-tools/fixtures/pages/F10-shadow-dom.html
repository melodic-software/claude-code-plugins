<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>F10 Shadow DOM</title><script src="/fx.js"></script></head>
<body>
<!-- <notify-toggle> keeps its button in an open shadow root. <privacy-toggle> uses a closed root
     and exposes a light-DOM fallback button with the same accessible name. -->
<main>
  <h1>Preferences</h1>
  <notify-toggle></notify-toggle>
  <privacy-toggle><button type="button" slot="fallback" id="privacy-fallback">Hide my profile</button></privacy-toggle>
  <pre id="result"></pre>
</main>
<script>
  customElements.define("notify-toggle", class extends HTMLElement {
    connectedCallback() {
      const root = this.attachShadow({ mode: "open" });
      root.innerHTML = `<button type="button">Enable notifications</button>`;
      root.querySelector("button").addEventListener("click", () => fx.record("notifications", true));
    }
  });
  customElements.define("privacy-toggle", class extends HTMLElement {
    connectedCallback() {
      const root = this.attachShadow({ mode: "closed" });
      root.innerHTML = `<slot name="fallback"></slot>`;
      this.querySelector("#privacy-fallback").addEventListener("click", () => fx.record("privacy", true));
    }
  });
</script>
</body>
</html>
