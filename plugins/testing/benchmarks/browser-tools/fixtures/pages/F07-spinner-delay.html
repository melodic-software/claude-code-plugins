<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>F07 Spinner overlay</title><script src="/fx.js"></script>
<style>#overlay{position:fixed;inset:0;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;transition:opacity .4s}</style></head>
<body>
<!-- A full-page spinner overlay covers the content for `delay` ms, then fades out and is removed.
     The Confirm button exists underneath the whole time; clicks during the overlay hit the overlay. -->
<main>
  <h1>Order review</h1>
  <p>Two items, total $42.</p>
  <button type="button" id="confirm">Confirm order</button>
  <p id="status"></p>
  <pre id="result"></pre>
</main>
<div id="overlay" role="progressbar" aria-label="Loading order">Loading…</div>
<script>
  document.getElementById("confirm").addEventListener("click", () => {
    fx.record("confirmed", 1, "inc");
    document.getElementById("status").textContent = "Order confirmed";
  });
  fx.after(fx.delay, () => {
    const o = document.getElementById("overlay");
    o.style.opacity = "0";
    setTimeout(() => o.remove(), 400);
  });
</script>
</body>
</html>
