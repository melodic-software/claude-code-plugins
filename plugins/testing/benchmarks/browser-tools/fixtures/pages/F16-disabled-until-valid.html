<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>F16 Validated form</title><script src="/fx.js"></script>
<style>.err{color:#b00020}</style></head>
<body>
<!-- Submit stays disabled until every field is valid. Email validates on input; postal code
     validates only on blur, so filling it without leaving the field keeps the button disabled.
     Submitting records the values and shows a confirmation code. -->
<main>
  <h1>Shipping details</h1>
  <form id="f" novalidate>
    <p><label>Email <input id="email" name="email" type="email"></label> <span class="err" id="email-err"></span></p>
    <p><label>Postal code <input id="zip" name="zip" inputmode="numeric"></label> <span class="err" id="zip-err"></span></p>
    <button type="submit" id="submit" disabled>Submit shipping details</button>
  </form>
  <p id="status"></p>
  <pre id="result"></pre>
</main>
<script>
  const email = document.getElementById("email"), zip = document.getElementById("zip"), submit = document.getElementById("submit");
  const valid = { email: false, zip: false };
  const update = () => (submit.disabled = !(valid.email && valid.zip));
  email.addEventListener("input", () => {
    valid.email = /^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email.value);
    document.getElementById("email-err").textContent = valid.email ? "" : "Enter a valid email address";
    update();
  });
  zip.addEventListener("blur", () => {
    valid.zip = /^\d{5}$/.test(zip.value);
    document.getElementById("zip-err").textContent = valid.zip ? "" : "Postal code must be 5 digits";
    update();
  });
  zip.addEventListener("input", () => { valid.zip = false; update(); });
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    fx.record("submitted", { email: email.value, zip: zip.value });
    document.getElementById("status").textContent = `Submitted. Confirmation ${await fx.code("sav")}`; // spellchecker:disable-line
  });
</script>
</body>
</html>
