<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>T07 Reports</title><script src="/fx.js"></script></head>
<body>
<!-- "Generate report" calls /api/report, which returns HTTP 500. The page logs a console error that
     carries a run-specific error id, and shows only a generic message on screen. -->
<main>
  <h1>Reports</h1>
  <button type="button" id="gen">Generate report</button>
  <p id="status"></p>
  <pre id="result"></pre>
</main>
<script>
  document.getElementById("gen").addEventListener("click", async () => {
    fx.record("generateClicked", 1, "inc");
    const res = await fetch(`/api/report?run=${fx.run}&delay=${fx.delay}`);
    if (!res.ok) {
      const id = await fx.code("rpt");
      console.error(`ReportError ${id}: generator returned ${res.status}`);
      document.getElementById("status").textContent = "Something went wrong.";
    }
  });
</script>
</body>
</html>
