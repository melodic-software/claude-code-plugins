<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>F02 Enhanced navigation</title><script src="/fx.js"></script></head>
<body>
<!-- Link clicks are intercepted: the next page is fetched and patched into <main> with
     history.pushState, so no load event fires. An `enhancedload` event is dispatched after the patch. -->
<nav><span data-permanent>Site header (kept across navigations)</span></nav>
<main id="main">
  <h1>Page 1: Inventory</h1>
  <p>Open the archive to see the reference code.</p>
  <a id="next" href="#">Go to archive</a>
</main>
<pre id="result"></pre>
<script>
  const page2 = fx.link("/f/F02-enhanced-nav.html", "&p=2");
  document.getElementById("next").href = page2;
  async function showPage2() {
    const html = await (await fetch(`/api/fragment?p=2&run=${fx.run}&delay=${fx.delay}`)).text();
    document.getElementById("main").innerHTML = html;
    document.title = "F02 Archive";
    fx.record("page", 2);
    document.dispatchEvent(new Event("enhancedload"));
  }
  // A full load of page 2 (no enhancement) still renders it.
  if (fx.q.get("p") === "2") showPage2();
  document.addEventListener("click", async (e) => {
    const a = e.target.closest("a[href]");
    if (a && a.id === "next") {
      e.preventDefault();
      history.pushState({}, "", page2);
      await showPage2();
    }
    const b = e.target.closest("button[data-archive]");
    if (b) {
      fx.record("archived", b.dataset.archive, "append");
      b.closest("li").remove();
    }
  });
</script>
</body>
</html>
