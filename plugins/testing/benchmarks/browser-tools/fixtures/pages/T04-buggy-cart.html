<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>T04 Shopping cart</title><script src="/fx.js"></script></head>
<body>
<!-- Three planted defects for exploratory testing:
     1. "Remove" on a row removes the row below it (off by one).
     2. The total ignores quantity (sums unit prices only).
     3. "Apply coupon" throws a TypeError to the console and the discount never applies. -->
<main>
  <h1>Your cart</h1>
  <table><thead><tr><th>Item</th><th>Unit price</th><th>Qty</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  <p>Total: $<span id="total"></span></p>
  <label>Coupon <input id="coupon" value="SAVE10"></label> <button type="button" id="apply">Apply coupon</button>
  <p id="status"></p>
  <pre id="result"></pre>
</main>
<script>
  let items = [{ name: "Notebook", price: 4, qty: 3 }, { name: "Pen set", price: 9, qty: 1 }, { name: "Desk lamp", price: 30, qty: 2 }];
  function render() {
    const tbody = document.getElementById("rows");
    tbody.replaceChildren(...items.map((it, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${it.name}</td><td>$${it.price}</td><td>${it.qty}</td><td></td>`;
      const b = document.createElement("button");
      b.type = "button"; b.textContent = `Remove ${it.name}`;
      b.addEventListener("click", () => {
        fx.record("removeClicked", it.name, "append");
        items.splice(Math.min(i + 1, items.length - 1), 1);
        render();
      });
      tr.lastChild.append(b);
      return tr;
    }));
    document.getElementById("total").textContent = String(items.reduce((s, it) => s + it.price, 0));
  }
  render();
  document.getElementById("apply").addEventListener("click", () => {
    fx.record("couponClicked", 1, "inc");
    const coupon = null;
    document.getElementById("status").textContent = coupon.code;
  });
</script>
</body>
</html>
