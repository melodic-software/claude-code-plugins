<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>F20 Enhanced form</title><script src="/fx.js"></script></head>
<body>
<!-- Submit is intercepted: the form posts with fetch and the response patches the form region.
     No navigation happens. Server-side validation errors also arrive in the patch. -->
<main>
  <h1>Feedback</h1>
  <div id="region">
    <form id="f" method="post" action="/api/save">
      <label>Your name <input name="name"></label>
      <label>Comment <textarea name="comment"></textarea></label>
      <button type="submit">Send feedback</button>
    </form>
  </div>
  <pre id="result"></pre>
</main>
<script>
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = new URLSearchParams(new FormData(e.target));
    if (!data.get("name")) {
      document.getElementById("region").insertAdjacentHTML("beforeend", `<p role="alert">Name is required</p>`);
      return;
    }
    const html = await (await fetch(`/api/save?run=${fx.run}&delay=${fx.delay}`, { method: "POST", body: data })).text();
    document.getElementById("region").innerHTML = html;
    fx.record("patched", true);
  });
</script>
</body>
</html>
