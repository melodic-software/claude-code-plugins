id: cs-mstest
extends: cs-xunit
detect:
  any_regex:
    - 'Microsoft\.VisualStudio\.TestTools\.UnitTesting'
    - '\[[[:space:]]*([A-Za-z]*Test(Class|Method)|DataRow)([^A-Za-z0-9_]|$)'
test_start:
  - '^[[:space:]]*\[[[:space:]]*[A-Za-z]*TestMethod([^A-Za-z0-9_]|$)'
  - '^[[:space:]]*\[[[:space:]]*(global::)?(Reqnroll\.)?Then(Attribute)?([^A-Za-z0-9_]|$)'
test_skip:
  - 'Ignore'
  - 'ExpectedException'
assertion:
  async:
    - 'Assert[[:space:]]*\.[[:space:]]*(ThrowsExceptionAsync|ThrowsAsync|ThrowsExactlyAsync)[[:space:]]*[<(]'
  inert:
    - '[^=;]*\.[[:space:]]*Should[[:space:]]*\([[:space:]]*\)[[:space:]]*;$'
    - 'Assert[[:space:]]*\.[[:space:]]*(IsTrue[[:space:]]*\([[:space:]]*true|IsFalse[[:space:]]*\([[:space:]]*false)[[:space:]]*[,)]'
    - 'Assert[[:space:]]*\.[[:space:]]*IsNotNull[[:space:]]*\([[:space:]]*(typeof|nameof)[[:space:]]*\([^()]*\)(\.Name)?[[:space:]]*\)'
    - 'Assert[[:space:]]*\.[[:space:]]*(AreEqual|AreNotEqual|AreSame)[[:space:]]*\([[:space:]]*typeof[[:space:]]*\([^()]*\)[[:space:]]*,[[:space:]]*typeof[[:space:]]*\([^()]*\)[[:space:]]*[,)]'
equality:
  call2: [CollectionAssert.AreEqual, CollectionAssert.AreEquivalent, Assert.AreEquivalent, Assert.AreSequenceEqual, assert.equal, assert.strictEqual, assert.deepEqual, assert.deepStrictEqual, assertEqual, assertEquals, assertAlmostEqual, Assert.Equal, Assert.StrictEqual, Assert.Same, Assert.AreEqual, Assert.AreSame]
