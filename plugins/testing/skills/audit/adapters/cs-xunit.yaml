# xUnit, and the default for any C# test file cs-nunit and cs-mstest do not
# detect, so it also knows their test attributes. The assertion tokens cover
# FluentAssertions, Shouldly and Verify snapshots; the mock fields cover Moq,
# NSubstitute and FakeItEasy. cs-nunit and cs-mstest extend this adapter.
# Schema and YAML subset: scripts/adapter-load.awk.
id: cs-xunit
language: cs
block_model: brace
# Reqnroll step definitions and the project template's UnitTest1.cs too.
files: ['*Test.cs', '*Tests.cs', '*StepDefinitions.cs', 'UnitTest*.cs']
# Test attributes; the method signature that follows opens the block.
test_start:
  - '^[[:space:]]*\[[[:space:]]*(Fact|Theory|Test([^A-Za-z0-9_]|$)|TestMethod|TestCase|DataTestMethod)'
# Matched in any attribute of the same stack, before or after the test one.
test_skip:
  - 'Skip[[:space:]]*='
  - 'Ignore'
assertion:
  calls:
    - '[Aa]ssert'
    - '\.Should'
    - 'Should\.'
    - '[Ee]xpect'
    - 'Verify'
    - 'Received'
    - 'MustHaveHappened'
    - 'MustNotHaveHappened'
    - 'Throws'
    - '[Ss]napshot'
    - '[Cc]heck'
    - '[Ee]nsure'
    - '[Vv]alidate'
    # Microsoft.CodeAnalysis.Testing's analyzer and code-fix test types. The
    # engine adds }.RunAsync( on their initializer in a file that imports the
    # harness (cant-fail-scan.awk, BEGIN).
    - 'CSharp(Analyzer|CodeFix|CodeRefactoring|SourceGenerator)Test[[:space:]]*<'
  # xUnit's *Async assertions return a Task (xUnit2021).
  async:
    - 'Assert[[:space:]]*\.[[:space:]]*[A-Za-z]+Async[[:space:]]*[<(]'
  # .Should() with no matcher chained, as a whole statement. A literal
  # condition always passes. typeof, nameof and a type's Name are never null
  # (Namespace and FullName can be), and comparing
  # two of them is settled at compile time. cs-nunit inherits these.
  inert:
    - '[^=;]*\.[[:space:]]*Should[[:space:]]*\([[:space:]]*\)[[:space:]]*;$'
    - 'Assert[[:space:]]*\.[[:space:]]*(True[[:space:]]*\([[:space:]]*true|False[[:space:]]*\([[:space:]]*false)[[:space:]]*[,)]'
    - 'Assert[[:space:]]*\.[[:space:]]*NotNull[[:space:]]*\([[:space:]]*(typeof|nameof)[[:space:]]*\([^()]*\)(\.Name)?[[:space:]]*\)'
    - 'Assert[[:space:]]*\.[[:space:]]*(True|False)[[:space:]]*\([[:space:]]*(typeof|nameof)[[:space:]]*\([^()]*\)(\.(Name|FullName|Namespace))?[[:space:]]*(==|!=)[[:space:]]*(typeof|nameof)[[:space:]]*\([^()]*\)(\.(Name|FullName|Namespace))?[[:space:]]*[,)]'
  # Not null, and a throw of any exception. cs-nunit and cs-mstest inherit these.
  weak:
    - '(Classic)?Assert[[:space:]]*\.[[:space:]]*(NotNull|IsNotNull)[[:space:]]*\([^()]*(\([^()]*\)[^()]*)*\)'
    - 'Assert[[:space:]]*\.[[:space:]]*That[[:space:]]*\([^()]*(\([^()]*\)[^()]*)*,[[:space:]]*Is[[:space:]]*\.[[:space:]]*Not[[:space:]]*\.[[:space:]]*Null[[:space:]]*\)'
    - 'Assert[[:space:]]*\.[[:space:]]*ThrowsAny(Async)?[[:space:]]*<[[:space:]]*(System[[:space:]]*\.[[:space:]]*)?Exception[[:space:]]*>[[:space:]]*\([^()]*(\([^()]*\)[^()]*)*\)'
  # One named value is not null, or has a type: on a value the test built with
  # new, only a throwing constructor fails it. cs-nunit and cs-mstest inherit these.
  exists:
    - '(Classic)?Assert[[:space:]]*\.[[:space:]]*(NotNull|IsNotNull)[[:space:]]*\([[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\)'
    - 'Assert[[:space:]]*\.[[:space:]]*IsType[[:space:]]*<[^<>()]*>[[:space:]]*\([[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\)'
    - 'Assert[[:space:]]*\.[[:space:]]*That[[:space:]]*\([[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*,[[:space:]]*Is[[:space:]]*\.[[:space:]]*Not[[:space:]]*\.[[:space:]]*Null[[:space:]]*\)'
  count:
    - '\.[[:space:]]*(Count|Length|LongLength)([^A-Za-z0-9_]|$)'
    - 'Assert[[:space:]]*\.[[:space:]]*(Single|Empty|NotEmpty)'
    - '(HaveCount|ContainSingle|BeEmpty|ShouldHaveSingleItem|ShouldBeEmpty)'
    - '(Has|Is)[[:space:]]*\.[[:space:]]*(Count|Length|Exactly|Empty|Not[[:space:]]*\.[[:space:]]*Empty)'
  fail:
    - '(Classic)?Assert[[:space:]]*\.[[:space:]]*Fail[[:space:]]*\('
mock:
  create:
    - 'new[[:space:]]+Mock<'
    - 'Mock\.Of<'
    - 'Substitute\.For(PartsOf)?<'
    - 'new[[:space:]]+MockRepository'
    - 'A\.Fake<'
  verify:
    - '\.Verify(Get|Set|Add|Remove)?[[:space:]]*\('
    - '\.VerifyAll'
    - '\.VerifyNoOtherCalls'
    - '\.Received'
    - 'Received\.InOrder'
    - '\.DidNotReceive'
    - 'MustHaveHappened'
    - 'MustNotHaveHappened'
  # Each chain is stripped as a BOUNDED expression, never to end of line, so a
  # same-line real assertion after the chain survives the strip. Verify and
  # Received.InOrder allow parentheses three deep, as in It.IsAny<T>() inside
  # the verified call.
  strip:
    - '\.[[:space:]]*Verify(All|NoOtherCalls|Get|Set|Add|Remove)?(<[^<>]*>)?[[:space:]]*\([^()]*(\([^()]*(\([^()]*\)[^()]*)*\)[^()]*)*\)'
    - 'Received\.InOrder[[:space:]]*\([^()]*(\([^()]*(\([^()]*\)[^()]*)*\)[^()]*)*\)'
    - '\.[[:space:]]*Received(WithAnyArgs)?[[:space:]]*(\([^()]*\))?(\.[A-Za-z_]+[[:space:]]*\([^()]*(\([^()]*\)[^()]*)*\))?'
    - '\.[[:space:]]*DidNotReceive(WithAnyArgs)?[[:space:]]*(\(\))?(\.[A-Za-z_]+[[:space:]]*\([^()]*(\([^()]*\)[^()]*)*\))?'
    - 'MustHaveHappened[A-Za-z]*[[:space:]]*(\([^()]*\))?'
    - 'MustNotHaveHappened[A-Za-z]*[[:space:]]*(\([^()]*\))?'
# Verify, statement-initial: Moq's mock.Verify( is a mock assertion instead.
snapshot:
  - '^[[:space:]]*(return[[:space:]]+|await[[:space:]]+)*(Verifier[[:space:]]*\.[[:space:]]*)?Verify(Json|Xml|File)?[[:space:]]*\('
# FsCheck and CsCheck: the expected value is derived from generated inputs on purpose.
property_markers:
  - '\[[[:space:]]*(FsCheck[[:space:]]*\.[[:space:]]*)?(Xunit[[:space:]]*\.[[:space:]]*)?Property([[:space:]]*[](]|$)'
  - 'Prop[[:space:]]*\.[[:space:]]*ForAll'
  - '(^|[^A-Za-z0-9_])Gen[[:space:]]*\.[[:space:]]*[A-Z]'
equality:
  call2: [assert.equal, assert.strictEqual, assert.deepEqual, assert.deepStrictEqual, assertEqual, assertEquals, assertAlmostEqual, Assert.Equal, Assert.StrictEqual, Assert.Same, Assert.AreEqual, Assert.AreSame, Assert.Equivalent]
# C# constants are PascalCase, so an uppercase name says nothing about constness.
rules_off: [constant-restatement]
suppress_marker: 'cant-fail-ok:'
