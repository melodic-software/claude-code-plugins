# Jest, and the default for any JS/TS test file no other JS adapter detects.
# Schema and YAML subset: scripts/adapter-load.awk. Every regex is a portable ERE.
id: js-jest
language: js
block_model: brace
files:
  - '*.test.js'
  - '*.test.jsx'
  - '*.test.ts'
  - '*.test.tsx'
  - '*.test.mjs'
  - '*.test.cjs'
  - '*.test.mts'
  - '*.test.cts'
  - '*.spec.js'
  - '*.spec.jsx'
  - '*.spec.ts'
  - '*.spec.tsx'
  - '*.spec.mjs'
  - '*.spec.cjs'
  - '*.spec.mts'
  - '*.spec.cts'
detect:
  any_regex:
    - '@jest/globals'
    - 'jest\.(fn|mock|spyOn)'
test_start:
  - '(^|[^A-Za-z0-9_$.])(it|test)[[:space:]]*(\.[[:space:]]*(only|concurrent|failing|sequential))*[[:space:]]*(\.[[:space:]]*each[[:space:]]*\([^)]*\)[[:space:]]*)?\('
test_skip:
  - '(^|[^A-Za-z0-9_$.])(xit|xtest)[[:space:]]*\('
  - '(^|[^A-Za-z0-9_$.])(it|test)[[:space:]]*\.[[:space:]]*(skip|todo)'
suite_skip:
  - '(^|[^A-Za-z0-9_$.])(xdescribe|(describe|context|suite)[[:space:]]*\.[[:space:]]*skip)[[:space:]]*\('  # spellchecker:disable-line
assertion:
  # Matched generously: any helper whose name carries one of these counts. The
  # t.<method> entry is the AVA / node-tap vocabulary, which asserts through
  # the test-context object.
  calls:
    - 'expect[[:space:]]*\('
    - 'expect[[:space:]]*\.[[:space:]]*(poll|soft)[[:space:]]*\('
    - '[Aa]ssert'
    - '[Ss]hould'  # spellchecker:disable-line
    - '[Vv]erify'
    - '[Tt]hrows'
    - 'rejects'
    - 'resolves'
    - '[Ss]napshot'
    # checkout() is a call under test, not a check.
    - '[Cc]heck([^o]|$)'
    - '[Ee]nsure'
    - '[Vv]alidate'
    - 'fail[[:space:]]*\('
    - '(^|[^A-Za-z0-9_$.])t[[:space:]]*\.[[:space:]]*(is|not|deepEqual|notDeepEqual|like|equal|notEqual|same|notSame|strictSame|has|ok|notOk|truthy|falsy|true|false|pass|fail|throws|throwsAsync|notThrows|notThrowsAsync|regex|notRegex|match|snapshot|plan|end|type|emits)([^A-Za-z0-9_]|$)'  # spellchecker:disable-line
  # Statement starts that assert nothing unless awaited or returned; jest-dom's
  # toBeVisible is synchronous here, so only the promise forms are listed.
  async:
    - 'expect[[:space:]]*\(.*\)[[:space:]]*\.[[:space:]]*(resolves|rejects)[[:space:]]*\.'
    - 'expect[[:space:]]*\.[[:space:]]*poll[[:space:]]*\('
  # An expect with no matcher, or a matcher never called: whole statements.
  inert:
    - 'expect[[:space:]]*\([^()]*(\([^()]*\)[^()]*)*\)[[:space:]]*;$'
    - 'expect[[:space:]]*\([^()]*(\([^()]*\)[^()]*)*\)[[:space:]]*(\.[[:space:]]*(not|resolves|rejects)[[:space:]]*)?\.[[:space:]]*to[A-Za-z]*[[:space:]]*;$'
  # Matchers most wrong values pass, and a toThrow that names no error.
  # not.toThrow() passes whatever the call returns; toBeGreaterThan(0), or a
  # "> 0" comparison asserted true, passes for every count but zero. Matcher
  # names: jestjs.io/docs/expect (Jest 30.5) and vitest.dev/api/expect
  # (Vitest 5.0.3, where toThrowError is a deprecated alias), read 2026-10-10;
  # recheck when either page renames or drops one of them.
  weak:
    - 'expect[[:space:]]*\([^()]*(\([^()]*\)[^()]*)*\)[[:space:]]*\.[[:space:]]*(toBeDefined|toBeTruthy|not[[:space:]]*\.[[:space:]]*(toBeNull|toBeUndefined))[[:space:]]*\([[:space:]]*\)'
    - 'expect[[:space:]]*\([^()]*(\([^()]*\)[^()]*)*\)[[:space:]]*\.[[:space:]]*(rejects[[:space:]]*\.[[:space:]]*)?(toThrow|toThrowError)[[:space:]]*\([[:space:]]*\)'
    - 'expect[[:space:]]*\([^()]*(\([^()]*\)[^()]*)*\)[[:space:]]*\.[[:space:]]*not[[:space:]]*\.[[:space:]]*(toThrow|toThrowError)[[:space:]]*\([[:space:]]*\)'
    - 'expect[[:space:]]*\([^()]*(\([^()]*\)[^()]*)*\)[[:space:]]*\.[[:space:]]*toBeGreaterThan[[:space:]]*\([[:space:]]*0[[:space:]]*\)'
    - 'expect[[:space:]]*\(([^()]*\([^()]*\))*[^()=>]*>[[:space:]]*0[[:space:]]*\)[[:space:]]*\.[[:space:]]*(toBe|toEqual|toStrictEqual)[[:space:]]*\([[:space:]]*true[[:space:]]*\)'
  count:
    - 'toHaveLength'
    - 'toHaveCount'
    - '\.[[:space:]]*(length|size)([^A-Za-z0-9_$]|$)'
  fail:
    - '(^|[^A-Za-z0-9_$.])fail[[:space:]]*\('
    - 'assert[[:space:]]*\.[[:space:]]*fail[[:space:]]*\('
mock:
  create:
    - 'jest\.(mock|fn|spyOn)'
    - 'vi\.(mock|fn|spyOn)'
    - 'sinon\.(stub|spy|fake|mock)'
    - 'createMock'
    - '\.mockReturnValue'
    - '\.mockResolvedValue'
    - '\.mockImplementation'
  verify:
    - 'toHaveBeenCalled'
    - 'toBeCalled'
    - 'toHaveReturned'
    - 'toHaveBeenNth'
    - 'toHaveBeenLast'
    - 'sinon\.assert'
    - 'calledOnce'
    - 'calledTwice'
    - 'calledThrice'
    - 'calledWith'
    - 'callCount'
  # Whole mock-interaction chains, removed before deciding whether a value
  # assertion remains. [^()]*(\([^()]*\)[^()]*)* allows one nesting level; a
  # deeper chain survives the strip and reads as a value assertion.
  strip:
    - 'expect[[:space:]]*\([^()]*(\([^()]*\)[^()]*)*\)[[:space:]]*(\.[[:space:]]*not)?[[:space:]]*\.[[:space:]]*(toHaveBeenCalled|toBeCalled|toHaveReturned|toHaveBeenNth|toHaveBeenLast)[A-Za-z]*[[:space:]]*\([^()]*(\([^()]*\)[^()]*)*\)'
    - 'sinon\.assert\.[A-Za-z]+[[:space:]]*\([^()]*(\([^()]*\)[^()]*)*\)'
# Up to the matcher's opening parenthesis, so an inline snapshot whose
# template spans lines still reads as one.
snapshot:
  - 'expect[[:space:]]*\([^()]*(\([^()]*\)[^()]*)*\)[[:space:]]*\.[[:space:]]*(toMatchSnapshot|toMatchInlineSnapshot|toMatchFileSnapshot|toThrowErrorMatchingSnapshot|toThrowErrorMatchingInlineSnapshot)[[:space:]]*\('
# fast-check: the expected value is derived from generated inputs on purpose.
# js-vitest, js-node-test and js-playwright inherit this list. A marker exempts
# only the test whose body holds it.
property_markers:
  - 'fc[[:space:]]*\.[[:space:]]*(assert|property|asyncProperty)[[:space:]]*\('
equality:
  # Inequality asserts are deliberately absent: Assert.NotEqual(f(2), f(2)) is
  # an always-fail defect, not a recomputed expectation.
  call2: [assert.equal, assert.strictEqual, assert.deepEqual, assert.deepStrictEqual, assertEqual, assertEquals, assertAlmostEqual, Assert.Equal, Assert.StrictEqual, Assert.Same, Assert.AreEqual, Assert.AreSame]
  receiver: [expect.toBe, expect.toEqual, expect.toStrictEqual]
suppress_marker: 'cant-fail-ok:'
