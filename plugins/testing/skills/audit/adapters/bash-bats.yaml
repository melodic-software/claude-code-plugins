# bats-core, with the bats-support, bats-assert and bats-file helpers.
# Schema and YAML subset: scripts/adapter-load.awk. Every regex is a portable ERE.
id: bash-bats
language: bash
block_model: brace
advisory: true
files: ['*.bats']
test_start:
  - '^[[:space:]]*@test[[:space:]]'
# skip ends the test from inside its body.
body_skip:
  - '(^|[[:space:];&|{])skip([[:space:];&|}]|$)'
assertion:
  # Tests run under set -e, so a failing test command fails the test.
  calls:
    - '(^|[^A-Za-z0-9_])(assert|refute)(_[A-Za-z0-9_]+)?([^A-Za-z0-9_]|$)'
    - '(^|[[:space:];&|!(])(\[\[?|test)[[:space:]]'
    - '(^|[[:space:];&|!])\(\('
    - '(^|[[:space:];&|])run[[:space:]]+(--?[A-Za-z-]+[[:space:]]+)*(!|-[0-9])'
    - '(^|[[:space:];&|!])(grep[[:space:]]+-[A-Za-z]*q|diff|cmp)[[:space:]]'
    # In command position only, so an expected= assignment is not a check.
    - '(^|[[:space:];&|!])(fail|(check|verify|ensure|validate|expect)[A-Za-z0-9_]*)([[:space:];&|]|$)'
equality:
  call2: [assert_equal]
suppress_marker: 'cant-fail-ok:'
