schema_version: "1.1"
name: run-e2e-flat-feature-id-resolves
description: Without app-control, run-e2e resolves a single-level feature id named in the scenario to the legacy flat file when its folder has no README.md, reports its entry points under the id, not the file name, marks each `no stated results` since the legacy file states none, and refreshes nothing
tags: [run-e2e, run-e2e-feature-id, run-e2e-stated-results, feature-resolution, legacy, unattended, invented]
expected_outcome: "The run takes own driving (app-control not installed, unattended). It finds no features/cart/README.md, resolves cart to .claude/skills/control-shop/features/cart.md, and its report has one line for each of that file's three entry points, the Add to cart button, the basket icon and POST /api/cart/items, each under the id cart (not cart.md) and reported not driven with a reason. The legacy file's `## Drive` step states no `Result:` and no Proof step, so each expected outcome comes from the requirement alone and each report line has `no stated results` on a line under it. It carries `touched features not matched (app-control not installed)`, refreshes nothing, names installing app-control as the next step, launches nothing and asks nothing."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/testing:run-e2e --unattended cart\n\nContext, not part of the scenario: the app-control plugin is not installed. This branch changes only shop/cart/basket.py. Do not launch, install or run anything. Since nothing runs here, report each entry point as not driven, with the reason. Name the feature file this run reads for the scenario, write the expected outcome each entry point would be judged against, and write the report lines the run would produce, then stop."
  allowed_tools: [Read, Glob, Grep]
  max_turns: 12
  timeout_seconds: 300
graders:
  - name: reads-flat-file
    type: tool_used
    tool: Read
    input_match: 'features/cart\.md'
    min: 1
    arm: both
  - name: reports-features-not-matched
    type: regex
    pattern: 'touched features not matched \(app-control not installed\)'
    flags: i
    arm: both
  - name: reports-under-flat-id
    type: regex
    pattern: '^\W*cart[`*\s]*\|'
    flags: m
    arm: both
  - name: reports-no-stated-results
    type: regex
    pattern: '\bno stated results\b'
    flags: i
    arm: both
  - name: reports-flat-entry-points
    type: llm
    criteria: "PASS only if the reply (1) names .claude/skills/control-shop/features/cart.md (or features/cart.md) as the feature file for cart, (2) gives one report line for each of its three entry points, the Add to cart button, the basket icon in the header and POST /api/cart/items, each as passed, failed or not driven with a reason, (3) says the feature file states no results for them, with `no stated results` under each report line, rather than inventing a stated result for the file, and (4) reports that touched features were not matched because app-control is not installed and names installing app-control as the next step. FAIL if it gives /app-control:map refresh as the next step instead of installing app-control, says a refresh ran, says the feature cannot be found because features/cart/README.md is missing, treats features/cart/steps.md as the feature file, reports billing/export as touched, or asks the person anything. Saying what a later run with app-control will refresh is not a failure."
