schema_version: "1.1"
name: e2e-config-layers-delegated
description: 'Legacy run-e2e 3 (prerequisites-pass-config-resolved-drive-delegated). Merges recording and browser_mode across every layer of .claude/testing/e2e.md with each value''s source, delegates the drive to a subagent with those values, and returns evidence paths only. subagent-and-layers reads the reply; meets-expectations (llm) quotes the legacy expectations. Read-only tools, graded on the reply.'
tags: [testing, run-e2e, no-network]
expected_outcome: 'Merges recording and browser_mode across every layer of .claude/testing/e2e.md with each value''s source, delegates the drive to a subagent with those values, and returns evidence paths only.'
execution:
  prompt: '/testing:run-e2e the login flow Do not read the repository, launch, install or run anything; treat these as facts and each step as already run with the result given. Context, not part of the scenario: the app-control plugin is not installed. When the run suggests installing it, the user answers: "No, I''m good. Just use what you have." Say how the run resolves its settings, who drives the browser, and what comes back, then stop.'
  allowed_tools: [Read, Glob, Grep]
  max_turns: 10
  timeout_seconds: 300
graders:
  - name: subagent-and-layers
    type: regex
    pattern: '^(?=[\s\S]*(?:\bsub-?agent\b))(?=[\s\S]*(?:\b(?:layers?|user-global|personal override)\b))'
    flags: i
    target: last_message
  - name: meets-expectations
    type: llm
    criteria: 'The run is /testing:run-e2e on this scenario: /testing:run-e2e the login flow PASS only if the reply satisfies every legacy expectation: "Reads every layer of .claude/testing/e2e.md and merges recording and browser_mode per key" "Reports which layer supplied each effective value" "Delegates the drive loop to a subagent instead of driving the browser in its own context" "Passes the resolved browser_mode and recording through to the executor" "Returns only evidence paths, not browser session output". FAIL if any point is missing or contradicted.'
