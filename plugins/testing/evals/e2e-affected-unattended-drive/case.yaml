schema_version: "1.1"
name: e2e-affected-unattended-drive
description: 'Legacy run-e2e affected-01 (unattended-drive-route-from-affected). Invokes /app-control:drive affected and the cart run with --unattended and --trusted-root /srv/trusted/shop, reports Saved-cart import not driven, writes e2e-summary.json from the drive report''s publishable list, and adds the summary only after scanning it. trusted-root-and-not-driven reads the reply; meets-expectations (llm) quotes the legacy expectations. Read-only tools, graded on the reply.'
tags: [testing, run-e2e, no-network]
expected_outcome: 'Invokes /app-control:drive affected and the cart run with --unattended and --trusted-root /srv/trusted/shop, reports Saved-cart import not driven, writes e2e-summary.json from the drive report''s publishable list, and adds the summary only after scanning it.'
execution:
  prompt: '/testing:run-e2e --unattended app=shop base=main trusted-root=/srv/trusted/shop. Do not read the repository, launch, install or run anything; treat these as facts and each step as already run with the result given. Context, not part of the scenario: the app-control plugin is installed and /app-control:drive resolves; nobody is present to answer. /app-control:drive affected writes an affected.json whose control_skill is `control-shop (project: /srv/trusted/shop/.claude/skills/control-shop/SKILL.md)` and whose features list one entry, id `cart`, matched_files ["shop/cart/basket.py"], with two entry points: `Add to cart button` (driven true) and `Saved-cart import` (driven false, reason `needs a signed-in account`). README.md is in unmatched_files. The /app-control:drive cart run writes report.md and report.json with one screenshot, and its report.json lists `shot-1.png`, `report.public.md` and `report.public.json` in publishable. The hub''s `## Mask` `values:` source resolves, and no value it gives, nor the generic credential pattern, appears in the text of e2e-summary.json. List every skill call with its arguments, the report lines and the e2e-summary.json fields, then stop.'
  allowed_tools: [Read, Glob, Grep]
  max_turns: 10
  timeout_seconds: 300
graders:
  - name: trusted-root-and-not-driven
    type: regex
    pattern: '^(?=[\s\S]*(?:--trusted-root[= ]\s*/srv/trusted/shop))(?=[\s\S]*(?:not driven \(needs a signed-in account\)))'
    target: last_message
  - name: meets-expectations
    type: llm
    criteria: 'The run is /testing:run-e2e on this scenario: /testing:run-e2e --unattended app=shop base=main trusted-root=/srv/trusted/shop. PASS only if the reply satisfies every legacy expectation: "Invokes /app-control:drive affected with shop, --base main, --unattended and --trusted-root /srv/trusted/shop" "Does not match changed files against the control skill''s sources globs itself" "Invokes /app-control:drive for the cart feature with --unattended and --trusted-root /srv/trusted/shop" "Reports Saved-cart import as not driven (needs a signed-in account)" "Writes e2e-summary.json with route drive, app shop, affected ["cart"] and capture status ran" "Takes the publishable paths from the cart report.json''s publishable list rather than scanning the captures itself" "Lists e2e-summary.json in publishable only after scanning it with the hub''s mask values and the generic credential pattern". FAIL if any point is missing or contradicted.'
