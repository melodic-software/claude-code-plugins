schema_version: "1.1"
name: e2e-workspace-id-slug
description: 'Legacy run-e2e own-instance-04 (workspace-id-slugged-into-session-prefix). Uses feature-abc-12-x as the workspace part, composes <workspace part>-<run id>-<scenario part>, and passes only the finished quoted name. workspace-prefixed reads the reply; meets-expectations (llm) quotes the legacy expectations. Read-only tools, graded on the reply.'
tags: [testing, run-e2e, no-network]
expected_outcome: 'Uses feature-abc-12-x as the workspace part, composes <workspace part>-<run id>-<scenario part>, and passes only the finished quoted name.'
execution:
  prompt: '/testing:run-e2e the coupon form. A Workspace environment entry ran up and info, and the run''s WORKSPACE_ID text is `Feature/ABC 12;x`. Do not read the repository, launch, install or run anything; treat these as facts and each step as already run with the result given. Context, not part of the scenario: the app-control plugin is not installed. When the run suggests installing it, the user answers: "No, I''m good. Just use what you have." Give the browser session name and the command that opens it, then stop.'
  allowed_tools: [Read, Glob, Grep]
  max_turns: 10
  timeout_seconds: 300
graders:
  - name: workspace-prefixed
    type: regex
    pattern: 'feature-abc-12-x-(?:\d{14}-[0-9a-f]{4}|<run[ -]id>)-[a-z0-9-]*coupon-form(?![a-z0-9-])'
    target: last_message
  - name: meets-expectations
    type: llm
    criteria: 'The run is /testing:run-e2e on this scenario: /testing:run-e2e the coupon form. A Workspace environment entry ran up and info, and the run''s WORKSPACE_ID text is `Feature/ABC 12;x`. PASS only if the reply satisfies every legacy expectation: "Uses feature-abc-12-x as the workspace part" "Composes names as <workspace part>-<run id>-<scenario part>" "Passes only the finished, quoted name, never the raw WORKSPACE_ID text". FAIL if any point is missing or contradicted.'
