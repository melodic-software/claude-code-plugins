schema_version: "1.1"
name: run-e2e-route-unattended-records-suggestion
description: An unattended run with app-control installed and no control skill asks nothing, takes run-e2e's own driving, and records the onboarding suggestion in its report
tags: [run-e2e, app-control, route, unattended, invented]
expected_outcome: The reply asks no question and does not wait for an answer. It takes run-e2e's own driving and does not run /app-control:map create. Its report records the suggestion to set up a control skill with /app-control:map create.
execution:
  prompt: "/testing:run-e2e --unattended the order history page. Do not read the repository, launch, install or run anything; treat these as facts. The app-control plugin is installed and /app-control:drive resolves in this session. The repository has no control skill. Its README documents `npm run dev` on port 4200. Nobody is present to answer. Tell me how the run proceeds and what its report says about app-control, then stop."
  allowed_tools: [Read, Glob, Grep]
  max_turns: 8
  timeout_seconds: 300
graders:
  - name: names-map-create
    type: regex
    pattern: '/?app-control:map create'
    arm: both
  - name: no-question-fallback-suggestion-recorded
    type: llm
    criteria: "PASS only if the reply (1) asks no question and does not stop to wait for an answer about app-control, (2) proceeds on run-e2e's own driving, (3) does not run /app-control:map create or write a control skill, and (4) says the run's report records the suggestion to set up a control skill with /app-control:map create. FAIL if it asks the person anything, stops to wait for an answer, starts /app-control:map create, or leaves the suggestion out of the report."
