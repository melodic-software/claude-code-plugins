schema_version: "1.1"
name: 'setup-check-reports-missing-lint-rule'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'ran-setup-check'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?setup\.sh(?:\\")?(?:(?:[^"\\]|\\.)*?\$\{?\w+\}?(?:\\")?)?[ \t]+check\b'
    arm: 'with-only'
  - name: 'no-apply'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?setup\.sh(?:\\")?(?:(?:[^"\\]|\\.)*?\$\{?\w+\}?(?:\\")?)?[ \t]+apply\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'pt011-finding'
    type: 'regex'
    pattern: '\bPT011\b[^\n]*?\b(?:FINDING|FAIL|WARN|missing|gap|not\s+(?:selected|enabled|on|turned on))\b|\b(?:FINDING|missing|gap)\b[^\n]*?\bPT011\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
