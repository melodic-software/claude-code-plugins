schema_version: "1.1"
name: 'setup-check-reports-missing-lint-rule'
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'ran-setup-check'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?setup\.sh(?:\\")?(?:(?:[^"\\]|\\.)*?\$\{?\w+\}?(?:\\")?)?[ \t]+check\b'
    arm: 'with-only'
  - name: 'no-apply'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?setup\.sh(?:\\")?(?:(?:[^"\\]|\\.)*?\$\{?\w+\}?(?:\\")?)?[ \t]+apply\b'
    min: 0
    max: 0
    arm: 'both'
  - name: 'pt011-finding'
    type: 'regex'
    pattern: '\bPT011\b[^\n]*?\b(?:FINDING|FAIL|WARN|missing|gap|not\s+(?:selected|enabled|on|turned on))\b|\b(?:FINDING|missing|gap)\b[^\n]*?\bPT011\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-write'
    type: 'tool_used'
    tool: 'Write'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit'
    type: 'tool_used'
    tool: 'Edit'
    min: 0
    max: 0
    arm: 'both'
  - name: 'meets-legacy-setup-1'
    type: 'llm'
    criteria: 'The run is `/testing:setup check` in a repository with one tracked pytest file and a ruff select of E, F and PLR0124 (legacy setup 1 asked in natural words whether the testing plugin is configured and which test lint rules are missing; the skill is disable-model-invocation, so the slash form stands in). PASS only if the run matches the legacy expected output: "Runs setup.sh check read-only and shows its four sections: the resolved testing config (or that no layer exists), one lint row per rule for each language the tracked tests use with every missing rule reported as a finding rather than a neutral absence and Bash, PowerShell and Go marked no maintained rule, the optional instruction line offered for pasting, and the hook-entry section. Writes nothing and does not edit CLAUDE.md or AGENTS.md." The Bash, PowerShell and Go note applies only when such tests exist; this repository has Python tests only. FAIL if any other part is missing or contradicted.'
