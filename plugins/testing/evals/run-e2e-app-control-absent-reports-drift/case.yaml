schema_version: "1.1"
name: run-e2e-app-control-absent-reports-drift
description: Without app-control, run-e2e matches no touched feature, even with a control skill index in reach. It reports that, refreshes nothing and names installing app-control in Next, without stopping, failing or editing the control skill
tags: [run-e2e, app-control, refresh, unattended, invented]
expected_outcome: "The reply takes own driving and finishes the run. It does not match src/cart/total.ts against the control skill index's sources globs: the report carries `touched features not matched (app-control not installed)`, and its Next section names installing app-control and running the skill again. It does not stop or fail the run for app-control's absence, does not claim a refresh ran, installs nothing and edits no control skill file."
execution:
  prompt: "/testing:run-e2e --unattended the cart page. Do not read the repository, launch, install or run anything; treat these as facts. The app-control plugin is not installed: no app-control skill resolves in this session. The repository has the control skill .claude/skills/control-shop/, whose index has two lines: `- Cart total | features/cart/total/README.md | entry points: 1 | sources: src/cart/**` and `- Checkout | features/checkout/README.md | entry points: 1 | sources: src/checkout/**`. This branch changes only src/cart/total.ts. Nobody is present to answer. Assume the cart page's entry point drives and passes. Write the run's final report, including its Next section, then stop."
  allowed_tools: [Read, Glob, Grep]
  max_turns: 8
  timeout_seconds: 300
graders:
  - name: reports-features-not-matched
    type: regex
    pattern: 'touched features not matched \(app-control not installed\)'
    flags: i
    arm: both
  - name: reports-no-match-without-failing
    type: llm
    criteria: "PASS only if the reply (1) reports that touched features were not matched because app-control is not installed, (2) names installing app-control and running the skill again in its Next section, and (3) completes the run with the passing entry point reported rather than stopping or failing it. FAIL if it maps src/cart/total.ts to a feature through the index's sources globs and reports that feature as touched or possibly out of date, gives /app-control:map refresh as the next step instead of running the skill again, says a refresh ran or was called, installs or enables a plugin, edits or writes a file under .claude/skills/control-shop/, reports checkout as touched, or marks the run failed or blocked because app-control is missing. Saying what a later run with app-control will refresh is not a failure."
