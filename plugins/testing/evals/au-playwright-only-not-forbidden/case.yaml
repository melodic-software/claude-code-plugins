schema_version: "1.1"
name: au-playwright-only-not-forbidden
description: 'Legacy audit 9. A Playwright config with no forbidOnly. The scan reports rule-only-not-forbidden and the reply proposes forbidOnly: !!process.env.CI. skill-fired and ran-scanner read the tool calls, only-rule-and-idiom the reply; meets-expectations (llm) quotes the legacy expectations. Needs --scaffold --allow-tools Bash.'
tags: [testing, audit, runner-config, scaffold, no-network]
expected_outcome: 'Reports testing/audit/rule-only-not-forbidden at the config anchor, says a committed test.only shrinks the suite to one passing test, and proposes forbidOnly: !!process.env.CI.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Someone committed a test.only last sprint and CI stayed green. Can the can''t-fail audit catch that?'
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:testing:)?audit"'
  - name: ran-scanner
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|;|\||\\n|\(|\$\()\s*)?(?:(?:do|then)\s+)?(?:(?:env|time|timeout\s+\d+)\s+)?(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*(?:(?:bash|sh)\s+)?(?:\\")?[^\s"\\]*cant-fail-scan\.sh(?:\\")?(?=\s|"|$|\))'
  - name: only-rule-and-idiom
    type: regex
    pattern: '^(?=[\s\S]*testing/audit/rule-only-not-forbidden)(?=[\s\S]*forbidOnly[`*\s]*:\s*!!\s*process\.env\.CI)'
    target: last_message
  - name: meets-expectations
    type: llm
    criteria: 'The user asked whether the can''t-fail audit catches a committed test.only that left CI green. PASS only if the reply satisfies every legacy expectation: "Output reports testing/audit/rule-only-not-forbidden with the fired threshold, forbidOnly absent or literal false" "Output proposes forbidOnly: !!process.env.CI in the config rather than editing or deleting a test" "Output states that a committed test.only otherwise shrinks the suite to one passing test". FAIL if any point is missing or contradicted.'
