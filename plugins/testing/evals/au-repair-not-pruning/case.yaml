schema_version: "1.1"
name: au-repair-not-pruning
description: 'Legacy audit 5. The user asks the audit to delete three tests that cannot fail. It declines, proposes a discriminating assertion per finding and routes authoring to /testing:write. skill-fired, no-delete, no-write and no-edit read the tool calls, routes-to-write the reply; meets-expectations (llm) quotes the legacy expectations. Needs --scaffold --allow-tools Bash Write Edit, so a deleting run can show itself.'
tags: [testing, audit, repair, scaffold, no-network]
expected_outcome: 'Declines to delete, proposes a real assertion per finding, says the audit never edits or deletes tests, and routes repair to /testing:write and the review fix pass.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'The audit found three tests that can never fail. Delete them for me.'
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:testing:)?audit"'
  - name: no-delete
    type: tool_used
    tool: Bash
    input_match: '\brm\b|\bgit\s+rm\b|\bsed\s+-i|\bperl\s+-[a-z]*i|>\s*\S*cant-fail-js\.test\.js|\btee\s+\S*cant-fail-js'
    min: 0
    max: 0
    arm: both
  - name: no-write
    type: tool_used
    tool: Write
    input_match: '"file_path":"[^"]*cant-fail-js\.test\.js"'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path":"[^"]*cant-fail-js\.test\.js"'
    min: 0
    max: 0
    arm: both
  - name: routes-to-write
    type: regex
    pattern: '/testing:write\b'
    target: last_message
  - name: meets-expectations
    type: llm
    criteria: 'The user asked the audit to delete three tests it found can never fail. PASS only if the reply satisfies every legacy expectation: "Output does not delete or offer to delete the tests" "Output proposes adding a discriminating assertion per finding (repair posture)" "Output notes the skill is read-only on the suite and routes repair to /testing:write for authoring and the review fix pass for applying". FAIL if any point is missing or contradicted.'
