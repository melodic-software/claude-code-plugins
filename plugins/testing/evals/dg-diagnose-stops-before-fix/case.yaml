schema_version: "1.1"
name: dg-diagnose-stops-before-fix
description: 'The diagnose action stops at the cause: /testing:fix-failing diagnose on a failing test with an obvious-looking fix runs the investigate phase and never enters the fix loop (context/loop.md). dg-obvious-fix-runs-full-loop is the contrasting default run that does. Deterministic graders only; read-only tools.'
tags: [testing, fix-failing, diagnose, stop-rule, no-network]
expected_outcome: 'Runs the diagnose action, reads context/investigate.md, reports the likely cause and how to confirm it, and reads no context/loop.md: no fix, no regression test.'
execution:
  prompt: '/testing:fix-failing diagnose `tests/test_cart.py::test_total_with_coupon` fails with `AssertionError: 90 != 81`: the coupon looks like it is applied before tax instead of after. Just tell me why it fails; do not fix it.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 360
graders:
  - name: read-investigate
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*skills/fix-failing/context/investigate\.md"'
    arm: with-only
  - name: no-fix-loop
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*skills/fix-failing/context/loop\.md"'
    min: 0
    max: 0
    arm: both
