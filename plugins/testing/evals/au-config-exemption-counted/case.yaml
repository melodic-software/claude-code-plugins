schema_version: "1.1"
name: au-config-exemption-counted
description: 'Legacy audit 10. A Playwright config already annotated cant-fail-ok: for accepted retries. The reply offers the annotation, says it is file-scoped in a config and counted in the coverage block, and does not disable the rule. skill-fired reads the Skill call, file-scoped-and-counted the reply; meets-expectations (llm) quotes the legacy expectations. Needs --scaffold --allow-tools Bash.'
tags: [testing, audit, exemption, scaffold, no-network]
expected_outcome: 'Offers cant-fail-ok: <reason>, states it is file-scoped in a config and counted in the coverage block, and proposes no rule or detector disable.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'We accept flaky retries on this suite deliberately and track them on a dashboard. Stop the audit flagging our Playwright config. Use the `testing:audit` skill if you have it.'
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:testing:)?audit"'
  - name: file-scoped-and-counted
    type: regex
    pattern: '^(?=[\s\S]*(?:cant-fail-ok:))(?=[\s\S]*(?:\b(?:file[- ]scoped|file scope|whole (?:config )?file|entire (?:config )?file|anywhere in the (?:config )?file)\b))(?=[\s\S]*(?:\b(?:counted|coverage block|exempted findings)\b))'
    flags: i
    target: last_message
  - name: meets-expectations
    type: llm
    criteria: 'The user asked the audit to stop flagging a Playwright config whose retries they accept deliberately. PASS only if the reply satisfies every legacy expectation: "Output offers the cant-fail-ok: <reason> annotation in the config rather than disabling the rule or the detector" "Output states the annotation is file-scoped in a config and that each suppression is counted in the coverage block" "Output reports no finding for the annotated config without presenting it as a config that was never examined". FAIL if any point is missing or contradicted.'
