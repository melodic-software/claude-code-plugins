schema_version: "1.1"
name: cl-refuses-no-mutation-setup
description: 'Legacy cleanup refuses_without_mutation_setup. The shop fixture on feat/cleanup with no docs/conventions/mutation-testing.yaml. Step 0 refuses the gated batch pointing to /mutation-testing:setup apply and offers cannot-fail-only mode, editing no test without a yes. The legacy entry has no expectations list, so the llm grader quotes its expected output. no-test-edit reads the tool calls, setup-and-offer the reply. Needs --scaffold --allow-tools Bash Write Edit.'
tags: [testing, cleanup, refuse, scaffold, no-network]
expected_outcome: 'Refuses the gated batch at step 0, points to /mutation-testing:setup apply, offers cannot-fail-only mode and edits no test without a yes.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/testing:cleanup shop_tests'
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: no-test-edit
    type: tool_used
    tool: Edit
    input_match: 'shop_tests/'
    min: 0
    max: 0
    arm: both
  - name: setup-and-offer
    type: regex
    pattern: '^(?=[\s\S]*(?:/mutation-testing:setup apply\b))(?=[\s\S]*(?:\bcannot[- ]fail[- ]only\b))'
    flags: i
    target: last_message
  - name: meets-expectations
    type: llm
    criteria: 'The user ran /testing:cleanup shop_tests on feat/cleanup in a repository with no docs/conventions/mutation-testing.yaml. PASS only if the reply satisfies every legacy expectation: "Refuses the gated batch at step 0, pointing to /mutation-testing:setup apply, and offers cannot-fail-only mode instead, continuing only on the user''s yes. Without that yes it edits no test.". FAIL if any point is missing or contradicted.'
