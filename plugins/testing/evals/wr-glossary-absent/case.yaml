schema_version: "1.1"
name: wr-glossary-absent
context:
  scaffold_script: scaffold.sh
description: "Glossary reader, control. The same workspace and prompt as wr-glossary-root with no glossary anywhere, so canonical-term and no-rejected-term record what the run names the feature on the user's words alone. It has no glossary-read or glossary-line grader: there is no file to read or name. glossary-none checks the skill reports that, printing `Glossary: none`. Read the term graders beside wr-glossary-root's: the cross-case gap is the measurement, since the CLI's delta ablates the plugin, not the glossary. In measured runs the control names the feature loan unprompted, so canonical-term passes here as it does in wr-glossary-root; no-rejected-term (the request says 'check out' throughout) and the glossary line graders are what separate the cases, and a high no-rejected-term pass rate here means the suite has no headroom to show a glossary's effect. Source: the maintainers' own writing, an owner-approved measurement before the glossary capability is restructured. Routine: a control, not a difficulty probe. Needs --scaffold --allow-tools Bash Edit Write."
tags: [testing, write, glossary, control, routine]
runs: 3
execution:
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
expected_outcome: "Prints `Glossary: none`, adds the feature to Library with unittest tests in tests/test_tool_library.py and runs the suite until it passes. With no glossary, naming it after the request (checkout) is the likely result, and the two term graders record how often it happens"
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:testing:)?write"'
  - name: canonical-term
    type: regex
    target:
      source: file
      path: tests/test_tool_library.py
    flags: i
    pattern: 'loan'
  - name: glossary-none
    type: regex
    target: trace
    pattern: '"type":"assistant"[^\n]*?"type":"text","text":"(?:[^"\\]|\\.)*?Glossary:(?:\*\*)? *`?[Nn]one\b'
  - name: no-rejected-term
    type: regex
    target:
      source: file
      path: tests/test_tool_library.py
    flags: i
    match: not_contains
    pattern: 'check(?:ed|s|ing)?[ _-]?outs?|rental|booking'
