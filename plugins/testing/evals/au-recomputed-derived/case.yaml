schema_version: "1.1"
name: au-recomputed-derived
description: 'Legacy audit 15. A calculateTotal test whose expected value is built with items.reduce. The scan reports rule-recomputed-derived and the reply proposes an independent literal, not a deletion. skill-fired and ran-scanner read the tool calls, derived-rule-and-literal the reply; meets-expectations (llm) quotes the legacy expectations. Needs --scaffold --allow-tools Bash.'
tags: [testing, audit, recomputed-derived, scaffold, no-network]
expected_outcome: 'Reports testing/audit/rule-recomputed-derived and proposes stating the total as a literal worked out by hand.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Review Pocock''s calculateTotal test: the expected value is built with items.reduce. Run the audit.'
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:testing:)?audit"'
  - name: ran-scanner
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|;|\||\\n|\(|\$\()\s*)?(?:(?:do|then)\s+)?(?:(?:env|time|timeout\s+\d+)\s+)?(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*(?:(?:bash|sh)\s+)?(?:\\")?[^\s"\\]*cant-fail-scan\.sh(?:\\")?(?=[\s"\\;&|)]|$)'
  - name: derived-rule-and-literal
    type: regex
    pattern: '^(?=[\s\S]*(?:(?:testing/audit/)?rule-recomputed-derived))(?=[\s\S]*(?:\b(?:literal|hand[- ](?:computed|worked|calculated)|worked out by hand|toBe\(\d+(?:\.\d+)?\))))'
    flags: i
    target: last_message
  - name: meets-expectations
    type: llm
    criteria: 'The user asked for an audit of a calculateTotal test whose expected value is built with items.reduce. PASS only if the reply satisfies every legacy expectation: "Output reports testing/audit/rule-recomputed-derived with the fired threshold" "Output proposes stating the expected total as an independent literal" "Output does not propose deleting the test". FAIL if any point is missing or contradicted.'
