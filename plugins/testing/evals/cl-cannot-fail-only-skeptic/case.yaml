schema_version: "1.1"
name: cl-cannot-fail-only-skeptic
description: 'Legacy cleanup cannot_fail_only_skeptic. The C# shop on feat/cleanup run with --cannot-fail-only. It runs no test, dispatches a skeptic that keeps Price_feed_resolves (throw is the only oracle), proposes Wiring_is_sane and Price_feed_type_exists for deletion waiting for a yes, and leaves the weak-oracle and mixed tests alone. The legacy entry has no expectations list, so the llm grader quotes its expected output. skeptic-dispatched, no-test-run and no-test-edit read the tool calls, records-keep-reason the decisions.md write, proposes-two-deletions the reply; the llm grader reads the trace, since the keep reason is written to decisions.md. Needs --scaffold --allow-tools Bash Write Edit Agent.'
tags: [testing, cleanup, cannot-fail-only, scaffold, no-network]
expected_outcome: 'Runs no test, has a fresh-context skeptic keep Price_feed_resolves as throw is the only oracle, proposes Wiring_is_sane and Price_feed_type_exists for deletion pending a yes each, lists the weak-oracle and mixed tests as not in this mode, and commits nothing.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/testing:cleanup Shop.Tests --cannot-fail-only'
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Agent]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: skeptic-dispatched
    type: tool_used
    tool: Agent
    input_match: '.'
  - name: no-test-run
    type: tool_used
    tool: Bash
    input_match: '\bdotnet\s+(?:test|build|run)\b'
    min: 0
    max: 0
    arm: both
  - name: no-test-edit
    type: tool_used
    tool: Edit
    input_match: 'Shop\.Tests/'
    min: 0
    max: 0
    arm: both
  - name: records-keep-reason
    type: tool_used
    tool: Bash
    input_match: '>\s*[^\s"]*\.md\b[^"]*?<<[\s\S]*?keep: throw is the only oracle'
  - name: proposes-two-deletions
    type: regex
    pattern: '^(?=[\s\S]*(?:\bWiring_is_sane\b))(?=[\s\S]*(?:\bPrice_feed_type_exists\b))(?=[\s\S]*(?:\b(?:delete[sd]?|deleting|deletion|remov\w*)\b))'
    flags: i
    target: last_message
  - name: meets-expectations
    type: llm
    criteria: 'The user ran /testing:cleanup Shop.Tests --cannot-fail-only on a C# test project. PASS only if the reply satisfies every legacy expectation: "Runs no test and no mutation tool. Candidates are Price_feed_resolves (zero assertion), Wiring_is_sane and Price_feed_type_exists (inert assertion); Price_feed_is_not_null (weak oracle) and Price_feed_prices_two_letter_sku (an inert Assert.True(true) beside a real Assert.Equal) are listed as not in this mode and never proposed for deletion. A fresh-context skeptic keeps Price_feed_resolves because GetRequiredService<IPriceFeed>() can throw (the PriceFeed constructor at Shop/ServiceRegistration.cs:17-18), recorded as keep: throw is the only oracle. Wiring_is_sane (Assert.True(true)) and Price_feed_type_exists are proposed for deletion and wait for the user''s yes on each. Proposes no rewrite, merge or quarantine, leaves the catch ... when (IsTrialFailure(ex)) guard in Licensed_feed_prices_a_sku untouched, and commits nothing.". FAIL if any point is missing or contradicted.'
    focus: trace
