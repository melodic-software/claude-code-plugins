schema_version: "1.1"
name: au-detect-happy-path
description: 'Legacy audit 1. JS, Python and C# suites with assertion-free bodies, self-identical comparisons and mock-only oracles. The audit runs cant-fail-scan.sh and reports the qualified rule ids with the coverage denominator. skill-fired and ran-scanner read the tool calls, rules-and-denominator the reply; meets-expectations (llm) quotes the legacy expectations. Needs --scaffold --allow-tools Bash.'
tags: [testing, audit, scaffold, no-network]
expected_outcome: 'Runs the bundled scanner and reports findings under testing/audit/rule-zero-assertion, rule-recomputed-expectation and rule-mock-only-oracle with their thresholds, plus the files and blocks examined.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Audit my test suite for tests that cannot fail.'
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:testing:)?audit"'
  - name: ran-scanner
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|;|\||\\n|\(|\$\()\s*)?(?:(?:do|then)\s+)?(?:(?:env|time|timeout\s+\d+)\s+)?(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*(?:(?:bash|sh)\s+)?(?:\\")?[^\s"\\]*cant-fail-scan\.sh(?:\\")?(?=[\s"\\;&|)]|$)'
  - name: rules-and-denominator
    type: regex
    pattern: '^(?=[\s\S]*(?:testing/audit/rule-zero-assertion))(?=[\s\S]*(?:testing/audit/rule-recomputed-expectation))(?=[\s\S]*(?:testing/audit/rule-mock-only-oracle))(?=[\s\S]*(?:(?:\b\d+\s+(?:test\s+)?(?:files?|blocks?)\b[^.;|\n]{0,25}\b(?:examined|scanned|parsed|read|enumerated)\b|\b(?:examined|scanned|parsed|read)\b[^.;|\n]{0,25}\b\d+\s+(?:test\s+)?(?:files?|blocks?)\b|\b\d+\s+examined of \d+|\btest (?:files|blocks)(?: parsed| examined)?[\s*_`:|]{1,8}\d+)))'
    flags: i
    target: last_message
  - name: meets-expectations
    type: llm
    criteria: 'The user asked for an audit of their suite for tests that cannot fail. PASS only if the reply satisfies every legacy expectation: "Output runs the bundled cant-fail-scan.sh script rather than judging test files by reading them" "Output reports findings under the qualified testing/audit/rule-* ids with the threshold that fired" "Output includes the scan''s coverage denominator (files examined, blocks parsed), not findings alone". FAIL if any point is missing or contradicted.'
