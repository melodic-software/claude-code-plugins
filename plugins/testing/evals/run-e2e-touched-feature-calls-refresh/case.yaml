schema_version: "1.1"
name: run-e2e-touched-feature-calls-refresh
description: With app-control installed, run-e2e maps the changed file to its feature through the control skill index's sources globs and, after the run, calls /app-control:map refresh for that feature only, leaving the control skill's files to map
tags: [run-e2e, app-control, refresh, unattended, invented]
expected_outcome: The reply maps src/cart/total.ts to the cart/total feature through the index's sources glob and not to checkout. After the drive and its cleanup, it calls /app-control:map refresh cart/total --unattended, once, and calls no refresh for checkout. It edits no control skill file itself and asks nothing.
execution:
  prompt: "/testing:run-e2e --unattended the cart page. Do not read the repository, launch, install or run anything; treat these as facts. The app-control plugin is installed: /app-control:drive and /app-control:map both resolve in this session. The repository has the control skill .claude/skills/control-shop/, whose index has two lines: `- Cart total | features/cart/total/README.md | entry points: 1 | sources: src/cart/**` and `- Checkout | features/checkout/README.md | entry points: 1 | sources: src/checkout/**`. This branch changes only src/cart/total.ts. Nobody is present to answer. List, in order, every skill call this run makes after choosing who drives, with its exact arguments, then stop."
  allowed_tools: [Read, Glob, Grep]
  max_turns: 8
  timeout_seconds: 300
graders:
  - name: calls-refresh-for-cart-total
    type: regex
    pattern: 'app-control:map refresh[ `"]+cart/total\b'
    arm: both
  - name: refreshes-touched-feature-only-after-run
    type: llm
    criteria: "PASS only if the reply (1) calls /app-control:map refresh with the feature id cart/total (the path-derived id, not the title 'Cart total'), (2) passes --unattended on that refresh call, (3) places the refresh after the drive of the cart page has finished, not instead of it or inside the drive, and (4) makes no refresh call for checkout. FAIL if it refreshes checkout or every feature, refreshes with no feature named, edits or writes a file under .claude/skills/control-shop/ itself, asks the person anything, or skips the refresh."
