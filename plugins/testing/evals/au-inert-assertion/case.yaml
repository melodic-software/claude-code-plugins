schema_version: "1.1"
name: au-inert-assertion
description: 'Legacy audit 11. An unawaited Playwright toBeVisible and a parenthesized pytest tuple assert. The scan reports rule-inert-assertion and the reply proposes awaiting the matcher and dropping the parentheses. Legacy expectation 3 (report-only, never gates --check) contradicts the current skill, which gates the rule, so it is not graded. skill-fired and ran-scanner read the tool calls, inert-rule-and-repairs the reply; meets-expectations (llm) quotes expectations 1 and 2. Needs --scaffold --allow-tools Bash.'
tags: [testing, audit, inert-assertion, scaffold, no-network]
expected_outcome: 'Reports testing/audit/rule-inert-assertion for the unawaited matcher and the tuple assert, and proposes await and assert cond, msg.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'My Playwright and pytest suites are green. Check whether any of their assertions never actually run.'
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:testing:)?audit"'
  - name: ran-scanner
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:&&|;|\||\\n|\(|\$\()\s*)?(?:(?:do|then)\s+)?(?:(?:env|time|timeout\s+\d+)\s+)?(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*(?:(?:bash|sh)\s+)?(?:\\")?[^\s"\\]*cant-fail-scan\.sh(?:\\")?(?=[\s"\\;&|)]|$)'
  - name: inert-rule-and-repairs
    type: regex
    pattern: '^(?=[\s\S]*(?:(?:testing/audit/)?rule-inert-assertion))(?=[\s\S]*(?:\bawait\b))(?=[\s\S]*(?:\bassert\s+(?!\()[^\n,]{1,80},))'
    target: last_message
  - name: meets-expectations
    type: llm
    criteria: 'The user asked whether any assertions in their green Playwright and pytest suites never actually run. PASS only if the reply satisfies every legacy expectation: "Output reports testing/audit/rule-inert-assertion for the unawaited matcher and for the tuple assert" "Output proposes awaiting the matcher and removing the tuple''s parentheses, each in its own language". FAIL if any point is missing or contradicted.'
