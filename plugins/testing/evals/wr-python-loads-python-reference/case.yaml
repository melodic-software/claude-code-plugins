schema_version: "1.1"
name: wr-python-loads-python-reference
description: 'Legacy write 6. In a Python-only repository, a property test for normalize_tags routes to context/property.md and loads only context/property/python.md, never the TypeScript or C# reference, and states idempotence (a second pass changes nothing). skill-fired, read-python and no-other-reference read the tool calls; meets-expectations (llm) quotes the legacy expectations. Needs --scaffold --allow-tools Bash Write Edit.'
tags: [testing, write, property, language-reference, scaffold, no-network]
expected_outcome: 'Reads context/property/python.md and neither typescript.md nor csharp.md; the tests or reply state normalize_tags(normalize_tags(x)) == normalize_tags(x).'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'This repository is Python only: a pyproject.toml and pytest, no package.json and no .csproj. Write a property-based test for normalize_tags in src/tags.py, which lowercases, deduplicates and sorts a list of tags.'
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:testing:)?write"'
  - name: read-python
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*skills/write/context/property/python\.md"'
  - name: no-other-reference
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*skills/write/context/property/(?:typescript|csharp)\.md"'
    min: 0
    max: 0
    arm: both
  - name: meets-expectations
    type: llm
    criteria: 'The user asked for a property-based test of normalize_tags (lowercases, deduplicates and sorts) in a Python-only repository. PASS only if the run meets every legacy expectation: "Loads context/property/python.md" "Does not load context/property/typescript.md or context/property/csharp.md" "States that a second normalize_tags pass leaves the result unchanged". The statement may be in the reply or in the test it writes. FAIL if any point is missing or contradicted.'
