schema_version: "1.1"
name: e2e-worst-case-dirty-refused
description: 'Legacy run-e2e 12 (worst-case-dirty-target-refused). Does not write the dirty fixture file and says it is dirty and why it refused. dirty-refusal reads the reply; meets-expectations (llm) quotes the legacy expectations. Read-only tools, graded on the reply.'
tags: [testing, run-e2e, no-network]
expected_outcome: 'Does not write the dirty fixture file and says it is dirty and why it refused.'
execution:
  prompt: '/testing:run-e2e worst-case the invoices table. Note: I have uncommitted edits in src/fixtures/invoices.json. Do not read the repository, launch, install or run anything; treat these as facts and each step as already run with the result given. Say what happens to src/fixtures/invoices.json, then stop.'
  allowed_tools: [Read, Glob, Grep]
  max_turns: 10
  timeout_seconds: 300
graders:
  - name: dirty-refusal
    type: regex
    pattern: '\bdirty\b'
    flags: i
    target: last_message
  - name: meets-expectations
    type: llm
    criteria: 'The run is /testing:run-e2e on this scenario: /testing:run-e2e worst-case the invoices table. Note: I have uncommitted edits in src/fixtures/invoices.json. PASS only if the reply satisfies every legacy expectation: "The dirty fixture file is not written or overwritten" "The answer says the file is dirty and why it refused". FAIL if any point is missing or contradicted.'
