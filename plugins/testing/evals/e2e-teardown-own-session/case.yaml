schema_version: "1.1"
name: e2e-teardown-own-session
description: 'Legacy run-e2e e2e-rules-04 (teardown-closes-only-own-sessions). Teardown closes only the session this run opened, by name, runs neither close-all nor kill-all, and then checks each evidence path still exists and is not empty. named-close reads the reply; meets-expectations (llm) quotes the legacy expectations. Read-only tools, graded on the reply.'
tags: [testing, run-e2e, no-network]
expected_outcome: 'Teardown closes only the session this run opened, by name, runs neither close-all nor kill-all, and then checks each evidence path still exists and is not empty.'
execution:
  prompt: '/testing:run-e2e the search page. `playwright-cli list` at the start shows two sessions this run did not open, one from another worktree. The run opens one session of its own. Do not read the repository, launch, install or run anything; treat these as facts and each step as already run with the result given. Context, not part of the scenario: the app-control plugin is not installed. When the run suggests installing it, the user answers: "No, I''m good. Just use what you have." Write the teardown commands, then stop.'
  allowed_tools: [Read, Glob, Grep]
  max_turns: 10
  timeout_seconds: 300
graders:
  - name: named-close
    type: regex
    pattern: '-s=[''\"]?[^''\"\s]+[''\"]?\s+close\b'
    target: last_message
  - name: meets-expectations
    type: llm
    criteria: 'The run is /testing:run-e2e on this scenario: /testing:run-e2e the search page. `playwright-cli list` at the start shows two sessions this run did not open, one from another worktree. The run opens one session of its own. PASS only if the reply satisfies every legacy expectation: "Closes only the session this run opened, by its name" "Runs neither `close-all` nor `kill-all`" "Checks after teardown that each reported evidence path still exists and is not empty". FAIL if any point is missing or contradicted.'
