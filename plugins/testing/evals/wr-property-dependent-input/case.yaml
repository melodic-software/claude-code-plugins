schema_version: "1.1"
name: wr-property-dependent-input
description: 'Dependent input. invoice_total accepts only invoices whose every line is in the invoice''s currency, so a property test draws the currency first and feeds it to the line generator (a Hypothesis @st.composite strategy, .flatmap, or st.data() draws), instead of drawing lines freely and throwing mixed-currency invoices away with assume() or .filter(). skill-fired reads the Skill calls; uses-given, builds-dependent-input and no-discarded-draws read tests/test_invoice.py. Needs --scaffold --allow-tools Write Edit.'
tags: [testing, write, property, generators, dependent-input, scaffold, no-network]
expected_outcome: 'tests/test_invoice.py holds a @given property whose invoice strategy draws the currency and builds every line in it (composite, flatmap or data draws), with no assume() or .filter().'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Write a property-based test for invoice_total in src/invoice.py and put it in tests/test_invoice.py. Dependencies are not installed in this checkout, so write the file and do not run it. Use the `testing:write` skill if you have it.'
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:testing:)?write"'
  - name: uses-given
    type: regex
    pattern: '^\s*@(?:hypothesis\.)?given\('
    flags: m
    target: { source: file, path: tests/test_invoice.py }
  - name: builds-dependent-input
    type: regex
    pattern: '^\s*@(?:st\.|strategies\.|hypothesis\.strategies\.)?composite\b|\.flatmap\(|\b(?:st|strategies)\.data\(\s*\)'
    flags: m
    target: { source: file, path: tests/test_invoice.py }
  - name: no-discarded-draws
    type: regex
    pattern: '\bassume\(|\.filter\('
    match: not_contains
    target: { source: file, path: tests/test_invoice.py }
