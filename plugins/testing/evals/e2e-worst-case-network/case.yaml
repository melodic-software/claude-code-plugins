schema_version: "1.1"
name: e2e-worst-case-network
description: 'Legacy run-e2e 10 (worst-case-network-injection). Treats worst-case as the action, injects data at the network boundary rather than editing markup, reports what broke, decisions and what held up, and names the zoom check as an approximation. report-parts reads the reply; meets-expectations (llm) quotes the legacy expectations. Read-only tools, graded on the reply.'
tags: [testing, run-e2e, no-network]
expected_outcome: 'Treats worst-case as the action, injects data at the network boundary rather than editing markup, reports what broke, decisions and what held up, and names the zoom check as an approximation.'
execution:
  prompt: '/testing:run-e2e worst-case the member list on the team settings page. Do not read the repository, launch, install or run anything; treat these as facts and each step as already run with the result given. Write the worst-case report outline and how the data is injected, then stop.'
  allowed_tools: [Read, Glob, Grep]
  max_turns: 10
  timeout_seconds: 300
graders:
  - name: report-parts
    type: regex
    pattern: '^(?=[\s\S]*(?:\bwhat broke\b))(?=[\s\S]*(?:\bwhat held up\b))(?=[\s\S]*(?:\bapproximat))'
    flags: i
    target: last_message
  - name: meets-expectations
    type: llm
    criteria: 'The run is /testing:run-e2e on this scenario: /testing:run-e2e worst-case the member list on the team settings page. PASS only if the reply satisfies every legacy expectation: "The worst-case token is treated as the action, not as part of the scenario" "Data is injected at the data boundary, preferring network mocking, never by editing markup or styles" "The report has the three parts: what broke, decisions, what held up" "The zoom check is named as an approximation". FAIL if any point is missing or contradicted.'
