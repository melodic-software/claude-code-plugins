schema_version: "1.1"
name: tv-absence-with-presence-kept
description: 'Legacy test-value 6. An empty-error-list assertion paired with a noSku case that asserts the exact errors is kept: the absence is the contract for a valid order and the presence case already fails a do-nothing implementation. The prompt names the skill (test-value is not user-invocable), since natural phrasing alone did not load it. skill-fired reads the Skill calls; meets-expectations (llm) quotes the legacy expectations. Read-only tools, graded on the reply.'
tags: [testing, test-value, absence-check, no-network]
expected_outcome: 'Keeps the absence assertion, citing the paired noSku case, and does not ask to delete or rewrite it.'
execution:
  prompt: 'My validateOrder test asserts `expect(validateOrder(valid).errors).toEqual([])` and also `expect(validateOrder(noSku).errors).toEqual([''sku required''])`. A review says absence assertions are weak, so should I delete or rewrite the first one? Use the `testing:test-value` skill if you have it.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 420
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:testing:)?test-value"'
  - name: meets-expectations
    type: llm
    criteria: 'The user asked whether to delete or rewrite an empty-error-list assertion that sits beside a noSku assertion of the exact errors. PASS only if the reply satisfies every legacy expectation: "Output keeps the test" "Output says the paired presence case (the noSku assertion) means a do-nothing implementation fails the test" "Output does not ask to delete or rewrite the absence assertion". FAIL if any point is missing or contradicted.'
