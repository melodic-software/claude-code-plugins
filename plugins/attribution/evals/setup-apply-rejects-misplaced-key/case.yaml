schema_version: "1.1"
name: setup-apply-rejects-misplaced-key
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'no-write-config'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?attribution(?:\.local)?\.(?:ya?ml|json)"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit-config'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?attribution(?:\.local)?\.(?:ya?ml|json)"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-shell-write-config'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:(?<=[\s"])&?>>?(?!&)[ \t]*(?:\\")?(?:[^\s;|&"\\]*/)?attribution(?:\.local)?\.(?:ya?ml|json)|\b(?:tee|truncate)\b(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:[^\s;|&"\\]*/)?attribution(?:\.local)?\.(?:ya?ml|json)|\bsed\b(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:\s-[a-zA-Z]*i(?![a-zA-Z])|\s--in-place)(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:[^\s;|&"\\]*/)?attribution(?:\.local)?\.(?:ya?ml|json)|\bperl\s+-[a-zA-Z]*i(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:[^\s;|&"\\]*/)?attribution(?:\.local)?\.(?:ya?ml|json)|\b(?:cp|mv|install)\s(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?\s(?:\\")?(?:[^\s;|&"\\]*/)?attribution(?:\.local)?\.(?:ya?ml|json)(?:\\")?(?=\s*(?:[;&|"]|\\n)))'
    min: 0
    max: 0
    arm: 'both'
  - name: 'rejects-misplaced-key'
    type: 'regex'
    pattern: 'judge_samples(?:(?![.!?](?:\s|$))[\s\S]){0,200}?(?<!not )(?<!n''t )(?<!n’t )(?<!yet )(?<!never )(?<!no )\b(?:top[- ]level|root[- ]level|no-?op|unknown key|not (?:a |an )?(?:valid|known|recognized|schema) key|not in the schema|outside the schema|reject|rejected|rejecting|refuse|refused|refusing|won''t write|will not write|did not write|didn''t write|not (?:be )?written|not writing)\b|(?<!not )(?<!n''t )(?<!n’t )(?<!yet )(?<!never )(?<!no )\b(?:top[- ]level|unknown key|no-?op|reject|rejected|rejecting|refuse|refused|refusing)\b(?:(?![.!?](?:\s|$))[\s\S]){0,200}?judge_samples'
    flags: 'i'
    target: 'last_message'
