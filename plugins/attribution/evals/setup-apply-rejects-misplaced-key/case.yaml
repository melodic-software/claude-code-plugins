schema_version: "1.1"
name: setup-apply-rejects-misplaced-key
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'no-write-config'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?attribution(?:\.local)?\.(?:ya?ml|json)"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit-config'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?attribution(?:\.local)?\.(?:ya?ml|json)"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-shell-write-config'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:(?<=[\s"])&?>>?(?!&)[ \t]*(?:\\")?(?:[^\s;|&"\\]*/)?attribution(?:\.local)?\.(?:ya?ml|json)|\b(?:tee|truncate)\b(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:[^\s;|&"\\]*/)?attribution(?:\.local)?\.(?:ya?ml|json)|\bsed\b(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:\s-[a-zA-Z]*i(?![a-zA-Z])|\s--in-place)(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:[^\s;|&"\\]*/)?attribution(?:\.local)?\.(?:ya?ml|json)|\bperl\s+-[a-zA-Z]*i(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:[^\s;|&"\\]*/)?attribution(?:\.local)?\.(?:ya?ml|json)|\b(?:cp|mv|install)\s(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?\s(?:\\")?(?:[^\s;|&"\\]*/)?attribution(?:\.local)?\.(?:ya?ml|json)(?:\\")?(?=\s*(?:[;&|"]|\\n)))'
    min: 0
    max: 0
    arm: 'both'
  - name: 'rejects-misplaced-key'
    type: 'regex'
    pattern: 'judge_samples(?:(?![.!?](?:\s|$))[\s\S]){0,200}?(?<!not )(?<!n''t )(?<!n’t )(?<!yet )(?<!never )(?<!no )\b(?:top[- ]level|root[- ]level|no-?op|unknown key|not (?:a |an )?(?:valid|known|recognized|schema) key|not in the schema|outside the schema|reject|rejected|rejecting|refuse|refused|refusing|won''t write|will not write|did not write|didn''t write|not (?:be )?written|not writing)\b|(?<!not )(?<!n''t )(?<!n’t )(?<!yet )(?<!never )(?<!no )\b(?:top[- ]level|unknown key|no-?op|reject|rejected|rejecting|refuse|refused|refusing)\b(?:(?![.!?](?:\s|$))[\s\S]){0,200}?judge_samples'
    flags: 'i'
    target: 'last_message'
  - name: 'says-silent-no-op'
    type: 'llm'
    criteria: 'Legacy expectation: "States that the misplaced key would be a silent no-op, not merely that it is unrecognized". PASS only if the reply says accuracy.judge_samples would be silently ignored (a no-op that leaves the panel at its default while reading like a setting), not only that the key is unknown or outside the schema. FAIL otherwise.'
    focus: 'last_message'
  - name: 'offers-top-level'
    type: 'llm'
    criteria: 'Legacy expectation: "Offers the correct top-level judge_samples form". PASS only if the reply offers or shows top-level judge_samples (for example judge_samples: 5) as the correct form. FAIL otherwise. Whether it is written in this turn is graded by the no-write graders, not here.'
    focus: 'last_message'
