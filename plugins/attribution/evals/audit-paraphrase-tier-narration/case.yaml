schema_version: "1.1"
name: audit-paraphrase-tier-narration
graders:
  - name: 'tier-llm-suspected'
    type: 'llm'
    criteria: 'Legacy expectations: "Assigns tier llm-suspected rather than fingerprint-confirmed, despite unanimity" and "States that the tier is mapped from evidence by fixed rule and is never raised by judge confidence". PASS only if the reply assigns tier llm-suspected and states that the tier is mapped from the evidence by fixed rule, never raised by judge confidence or unanimity. FAIL if it assigns fingerprint-confirmed or says unanimity could raise the tier.'
    focus: 'last_message'
  - name: 'not-fix-eligible'
    type: 'llm'
    criteria: 'Legacy expectation: "Refuses to treat the finding as fix-eligible and does not offer to apply a disposition to it". PASS only if the reply says the finding cannot be fixed automatically and does not offer to apply a disposition to it. FAIL if it says it can be fixed automatically or offers to run fix on it.'
    focus: 'last_message'
  - name: 'human-report-only'
    type: 'llm'
    criteria: 'Legacy expectation: "Keeps the finding out of the relay findings file, naming the human report as its only surface". PASS only if the reply says the finding stays on the human report and does not reach the findings file. FAIL if it says the finding is written to or relayed through the findings file.'
    focus: 'last_message'
  - name: 'names-tier'
    type: 'regex'
    pattern: '(?<!not )(?<!n''t )(?<!n’t )(?<!never )(?<!than )(?<!of )(?<!over )(?<!using )(?<!not `)(?<!n''t `)(?<!n’t `)(?<!never `)(?<!than `)(?<!of `)(?<!over `)(?<!using `)\bllm-suspected\b'
    target: 'last_message'
