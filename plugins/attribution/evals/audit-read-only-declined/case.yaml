schema_version: "1.1"
name: audit-read-only-declined
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'list-corpus-ran'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?!(?:[^"\\]|\\.)*?--(?:show-config|help)\b)(?:[^"\\]|\\.)*?list-corpus\.sh'
    min: 1
    arm: 'with-only'
  - name: 'vendor-declined-reported'
    type: 'regex'
    pattern: '(?:\bvendor/|vendored tree)[\s\S]{0,300}?(?<!not )(?<!n''t )(?<!nothing was )(?<!nothing is )(?<!nothing )(?<!none )\b(?:declined|excluded|skipped|carved out|carve-outs?|not scanned|left out|out of scope)\b|(?<!not )(?<!n''t )(?<!nothing was )(?<!nothing is )(?<!nothing )(?<!none )\b(?:declined|excluded|skipped|carved out|carve-outs?|not scanned|left out|out of scope)\b[\s\S]{0,300}?(?:\bvendor/|vendored tree)'
    flags: 'i'
    target: 'last_message'
  - name: 'attr-declined-reported'
    type: 'regex'
    pattern: '(?:linguist-vendored|third_party/|gitattributes)[\s\S]{0,300}?(?<!not )(?<!n''t )(?<!nothing was )(?<!nothing is )(?<!nothing )(?<!none )\b(?:declined|excluded|skipped|carved out|carve-outs?|not scanned|left out|out of scope)\b|(?<!not )(?<!n''t )(?<!nothing was )(?<!nothing is )(?<!nothing )(?<!none )\b(?:declined|excluded|skipped|carved out|carve-outs?|not scanned|left out|out of scope)\b[\s\S]{0,300}?(?:linguist-vendored|third_party/|gitattributes)'
    flags: 'i'
    target: 'last_message'
  - name: 'no-write-fixture'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:docs/guide|vendor/widget-sdk/README|third_party/gizmo/NOTES)\.md"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit-fixture'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:docs/guide|vendor/widget-sdk/README|third_party/gizmo/NOTES)\.md"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-shell-write-fixture'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:(?<=[\s"])&?>>?(?!&)[ \t]*(?:\\")?(?:[^\s;|&"\\]*/)?(?:docs/guide|vendor/widget-sdk/README|third_party/gizmo/NOTES)\.md|\b(?:tee|truncate)\b(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:[^\s;|&"\\]*/)?(?:docs/guide|vendor/widget-sdk/README|third_party/gizmo/NOTES)\.md|\bsed\b(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:\s-[a-zA-Z]*i(?![a-zA-Z])|\s--in-place)(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:[^\s;|&"\\]*/)?(?:docs/guide|vendor/widget-sdk/README|third_party/gizmo/NOTES)\.md|\bperl\s+-[a-zA-Z]*i(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:[^\s;|&"\\]*/)?(?:docs/guide|vendor/widget-sdk/README|third_party/gizmo/NOTES)\.md|\b(?:cp|mv|install)\s(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?\s(?:\\")?(?:[^\s;|&"\\]*/)?(?:docs/guide|vendor/widget-sdk/README|third_party/gizmo/NOTES)\.md(?:\\")?(?=\s*(?:[;&|"]|\\n)))'
    min: 0
    max: 0
    arm: 'both'
