schema_version: "1.1"
name: setup-check-writes-nothing
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'retirements-checked'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?check-retirements\.sh(?!(?:[^"\\]|\\.)*?--clean\b)'
    min: 1
    arm: 'with-only'
  - name: 'reports-expiry-90'
    type: 'regex'
    pattern: 'stamp[_ ]expiry(?:[_ ]days|[ ]window)?[^\n]{0,160}?\b90\b|\b90\b[^\n]{0,160}?stamp[_ ]expiry'
    flags: 'i'
    target: 'last_message'
  - name: 'names-team-layer'
    type: 'regex'
    pattern: 'docs/conventions/attribution\.yaml'
    target: 'last_message'
  - name: 'no-write-config'
    type: 'tool_used'
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?attribution(?:\.local)?\.(?:ya?ml|json)"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-edit-config'
    type: 'tool_used'
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?attribution(?:\.local)?\.(?:ya?ml|json)"'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-shell-write-config'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:(?<=[\s"])&?>>?(?!&)[ \t]*(?:\\")?(?:[^\s;|&"\\]*/)?attribution(?:\.local)?\.(?:ya?ml|json)|\b(?:tee|truncate)\b(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:[^\s;|&"\\]*/)?attribution(?:\.local)?\.(?:ya?ml|json)|\bsed\b(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:\s-[a-zA-Z]*i(?![a-zA-Z])|\s--in-place)(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:[^\s;|&"\\]*/)?attribution(?:\.local)?\.(?:ya?ml|json)|\bperl\s+-[a-zA-Z]*i(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:[^\s;|&"\\]*/)?attribution(?:\.local)?\.(?:ya?ml|json)|\b(?:cp|mv|install)\s(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?\s(?:\\")?(?:[^\s;|&"\\]*/)?attribution(?:\.local)?\.(?:ya?ml|json)(?:\\")?(?=\s*(?:[;&|"]|\\n)))'
    min: 0
    max: 0
    arm: 'both'
  - name: 'no-remove-retired-config'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:(?:[^"\\]|\\.)*?(?:[;&|(]|\\n)[ \t]*)?(?:sudo[ \t]+)?(?:xargs[ \t]+)?(?:(?:/\S*/)?(?:rm|mv|unlink|shred)|git(?:[ \t]+-C[ \t]+\S+)?[ \t]+(?:rm|mv))\b(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:provenance\.json|\.claude(?:/\*[^\s"\\]*|/?(?=[\s"\\])))|(?:[^"\\]|\\.)*?(?<=\s)--clean\b|(?:(?:[^"\\]|\\.)*?(?:[;&|(]|\\n)[ \t]*)?find\b(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:provenance\.json|\.claude(?:/\*[^\s"\\]*|/?(?=[\s"\\])))(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?\s(?:-delete\b|-exec[ \t]+rm\b))'
    min: 0
    max: 0
    arm: 'both'
  - name: 'show-config-detectors'
    type: 'llm'
    criteria: 'Legacy expectation: "Runs list-corpus.sh --show-config and check-stamps.sh --show-config rather than reading the config files directly". PASS only if the trace runs both list-corpus.sh --show-config and check-stamps.sh --show-config and the effective values the reply reports come from that output, not from a hand parse of the YAML in its place. FAIL if either detector''s --show-config does not run.'
    focus: 'trace'
