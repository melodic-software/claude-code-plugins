schema_version: "1.1"
name: audit-fix-offline-condenses
graders:
  - name: 'condense-not-pointer'
    type: 'llm'
    criteria: 'Legacy expectation: "Chooses condense-to-stamped-record and rejects a bare convert-to-pointer for an offline-load-bearing surface". PASS only if the reply chooses condense-to-stamped-record and rejects a bare convert-to-pointer because the surface must work when the source is unreachable. FAIL if it chooses convert-to-pointer.'
    focus: 'last_message'
  - name: 'record-four-parts'
    type: 'llm'
    criteria: 'Legacy expectation: "Writes the decision, the pointer, the as-of date and a recheck trigger that names an observable event rather than a date or a review cadence, with no source text in the record". PASS only if the record the reply writes or specifies has the surface''s decision in its own words, a pointer to the source section, an as-of date, and a recheck trigger naming an observable event (not a date or a review cadence), and holds no source text. FAIL if a part is missing, the trigger is a date or cadence, or the record quotes source text.'
    focus: 'last_message'
  - name: 'iso-date'
    type: 'llm'
    criteria: 'Legacy expectation: "Uses an ISO 8601 date so check-stamps.sh can parse the record on a later run". PASS only if the record''s as-of date is written as ISO 8601 (YYYY-MM-DD). FAIL if it uses another form or gives no date.'
    focus: 'last_message'
  - name: 'semantic-diff-blind'
    type: 'llm'
    criteria: 'Legacy expectation: "Runs the semantic-diff guard blind to the rewrite rationale and reverts any flagged hunk before closing the file". No file exists in this scenario, so the reply describes the fix run. PASS only if the reply says the rewrite goes through a fresh-context semantic-diff check that is not told the rewrite rationale, and that any flagged hunk is reverted before the file is closed. FAIL if it omits the check, hands the checker the rationale, or keeps flagged hunks.'
    focus: 'last_message'
  - name: 'names-condense'
    type: 'regex'
    pattern: '(?<!not )(?<!n''t )(?<!n’t )(?<!never )(?<!than )(?<!not `)(?<!n''t `)(?<!n’t `)(?<!never `)(?<!than `)\bcondense-to-stamped-record\b'
    target: 'last_message'
  - name: 'iso-date-form'
    type: 'regex'
    pattern: '\b\d{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12]\d|3[01])\b|\bYYYY-MM-DD\b'
    target: 'last_message'
