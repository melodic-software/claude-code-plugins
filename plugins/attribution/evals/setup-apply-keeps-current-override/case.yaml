schema_version: "1.1"
name: setup-apply-keeps-current-override
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'r002-is-fail'
    type: 'llm'
    criteria: 'Legacy expectation: "Reports attribution-r002 as FAIL". PASS only if the reply reports the retired .claude/provenance.local.json (attribution-r002) at FAIL severity. FAIL if it reports it as WARN, INFO or PASS, or not at all.'
    focus: 'last_message'
  - name: 'r002-fail-label'
    type: 'regex'
    pattern: '^(?![^\n]*\b(?:WARN|INFO)\b)[^\n]*(?:attribution-r002|\.claude/provenance\.local\.json)[^\n]*(?:\n[^\n]*)?\b(?:FAIL|Fail)\b|^(?![^\n]*\b(?:WARN|INFO)\b)[^\n]*\b(?:FAIL|Fail)\b[^\n]*(?:attribution-r002|\.claude/provenance\.local\.json)'
    flags: 'm'
    target: 'last_message'
  - name: 'keeps-current-adds-missing'
    type: 'llm'
    criteria: 'Legacy expectations: "Keeps judge_samples at 5 in docs/conventions/attribution.local.yaml rather than overwriting it with the retired file''s 3" and "Adds trigger_less_stamp_check from the retired file". PASS only if every write to docs/conventions/attribution.local.yaml in the trace keeps judge_samples 5 and adds trigger_less_stamp_check true or, when nothing is written, the reply proposes exactly that per key. FAIL if any write or proposal sets judge_samples to 3 or leaves out trigger_less_stamp_check.'
    focus: 'trace'
  - name: 'no-clean'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command":"(?:(?:(?:[^"\\]|\\.)*?(?:[;&|(]|\\n)[ \t]*)?(?:sudo[ \t]+)?(?:xargs[ \t]+)?(?:(?:/\S*/)?(?:rm|mv|unlink|shred)|git(?:[ \t]+-C[ \t]+\S+)?[ \t]+(?:rm|mv))\b(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:(?:provenance|attribution)(?:\.local)?\.json|\.claude(?:/\*[^\s"\\]*|/?(?=[\s"\\])))|(?:[^"\\]|\\.)*?(?<=\s)--clean\b|(?:(?:[^"\\]|\\.)*?(?:[;&|(]|\\n)[ \t]*)?find\b(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?(?:(?:provenance|attribution)(?:\.local)?\.json|\.claude(?:/\*[^\s"\\]*|/?(?=[\s"\\])))(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?\s(?:-delete\b|-exec[ \t]+rm\b))'
    min: 0
    max: 0
    arm: 'both'
