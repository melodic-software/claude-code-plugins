schema_version: "1.1"
name: pres-outline-record
graders:
  - name: slide-headings
    type: regex
    pattern: '^(?:[\s\S]*?^[ \t]*(?:#{2,6}[ \t]+\S|(?:\*\*)?Slide[ \t]+\d|\d+[.)][ \t]+\*\*\S)[^\n]*){3}'
    flags: im
    target: last_message
  - name: speaker-notes
    type: regex
    pattern: '^(?:[\s\S]*?(?:^[ \t]*(?:[-*+>][ \t]+|\d+[.)][ \t]+)?|[.!?|][ \t]+)(?:\*\*|__|\*|_)?(?:(?:speaker|presenter|slide)(?:''s|s'')?[ \t]+notes?|notes)[ \t]*(?:\*\*|__|\*|_)?[ \t]*(?:[:\-–—]|$)){3}'
    flags: im
    target: last_message
  - name: no-deck-page
    type: regex
    pattern: '<!doctype\s+html|<html\b|<body\b|<head\b|<div\b|<section\b|<svg\b|<x-embed\b|<script\b'
    flags: i
    match: not_contains
    target: last_message
