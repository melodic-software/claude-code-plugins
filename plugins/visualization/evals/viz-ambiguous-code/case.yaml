schema_version: "1.1"
name: viz-ambiguous-code
graders:
  - name: asks-one-question
    type: regex
    pattern: '\?'
    match: 'count:1'
    target: last_message
  - name: recommended-first
    type: regex
    pattern: '^(?:(?!(?:^|\n)[ \t]*(?:\d+[.)]|[-*+]|\(?[A-Da-d][.)])[ \t])[\s\S])*?(?:^|\n)[ \t]*(?:1[.)]|[-*+]|\(?[Aa][.)])[ \t][^\n]*recommend|(?:^|\n)[^\n]*?[ \t:?]1[.)][ \t]+(?:(?![ \t]2[.)])[^\n])*?recommend'
    flags: i
    target: last_message
  - name: renders-nothing
    type: regex
    pattern: '^[ \t]*(?:```|~~~)|[├└│┌┬┼]|^[ \t|]*[+`\\|]--|^[ \t]+[A-Za-z_]\w*(?:\.\w+)+(?:\([^)\n]*\))?[ \t]*$|^[ \t]*(?:class|def)[ \t]+[A-Za-z_]\w*[ \t]*[(:]|^[ \t]*[\w.-]+(?:/[\w.-]+)*(?:/|\.py)[ \t]*$|^[ \t]*\|[^\n]*\|[ \t]*\n[ \t]*\|?[ \t]*:?-+:?[ \t]*\|'
    flags: m
    match: not_contains
    target: last_message
  - name: names-two-forms
    type: regex
    pattern: '\b(call[- ]tree|types?(?:[ \t]+and[ \t]+|[ \t]*[/&][ \t]*|[ \t]+)signatures?|(?:shallow[ \t]+)?file[ \t]+tree|pseudo-?code|component[ \t]+tree|whole[ \t]+(?:code[ \t]+)?block|diff(?:-shaped)?(?:[ \t]+delta)?)\b[\s\S]*?\b(?!\1\b)(call[- ]tree|types?(?:[ \t]+and[ \t]+|[ \t]*[/&][ \t]*|[ \t]+)signatures?|(?:shallow[ \t]+)?file[ \t]+tree|pseudo-?code|component[ \t]+tree|whole[ \t]+(?:code[ \t]+)?block|diff(?:-shaped)?(?:[ \t]+delta)?)\b'
    flags: 'i'
    target: last_message
  - name: at-most-four-forms
    type: regex
    pattern: '\b(call[- ]tree|types?(?:[ \t]+and[ \t]+|[ \t]*[/&][ \t]*|[ \t]+)signatures?|(?:shallow[ \t]+)?file[ \t]+tree|pseudo-?code|component[ \t]+tree|whole[ \t]+(?:code[ \t]+)?block|diff(?:-shaped)?(?:[ \t]+delta)?)\b[\s\S]*?\b(?!\1\b)(call[- ]tree|types?(?:[ \t]+and[ \t]+|[ \t]*[/&][ \t]*|[ \t]+)signatures?|(?:shallow[ \t]+)?file[ \t]+tree|pseudo-?code|component[ \t]+tree|whole[ \t]+(?:code[ \t]+)?block|diff(?:-shaped)?(?:[ \t]+delta)?)\b[\s\S]*?\b(?!(?:\1|\2)\b)(call[- ]tree|types?(?:[ \t]+and[ \t]+|[ \t]*[/&][ \t]*|[ \t]+)signatures?|(?:shallow[ \t]+)?file[ \t]+tree|pseudo-?code|component[ \t]+tree|whole[ \t]+(?:code[ \t]+)?block|diff(?:-shaped)?(?:[ \t]+delta)?)\b[\s\S]*?\b(?!(?:\1|\2|\3)\b)(call[- ]tree|types?(?:[ \t]+and[ \t]+|[ \t]*[/&][ \t]*|[ \t]+)signatures?|(?:shallow[ \t]+)?file[ \t]+tree|pseudo-?code|component[ \t]+tree|whole[ \t]+(?:code[ \t]+)?block|diff(?:-shaped)?(?:[ \t]+delta)?)\b[\s\S]*?\b(?!(?:\1|\2|\3|\4)\b)(call[- ]tree|types?(?:[ \t]+and[ \t]+|[ \t]*[/&][ \t]*|[ \t]+)signatures?|(?:shallow[ \t]+)?file[ \t]+tree|pseudo-?code|component[ \t]+tree|whole[ \t]+(?:code[ \t]+)?block|diff(?:-shaped)?(?:[ \t]+delta)?)\b'
    flags: 'i'
    match: not_contains
    target: last_message
