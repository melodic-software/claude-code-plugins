schema_version: "1.1"
name: viz-reset-button-diff
context:
  history_file: history.jsonl
graders:
  - name: diff-adds-reset
    type: 'regex'
    pattern: '```diff[ \t]*\n(?:(?!```)[\s\S])*?^\+[^\n]*\breset'
    flags: 'im'
    target: 'last_message'
  - name: anchored-on-tree
    type: 'regex'
    pattern: '```diff[ \t]*\n(?:(?!```)[\s\S])*?^(?![+-])[^\n]*(?:SettingsPage|SaveButton|SettingsForm|useSettings)'
    flags: 'm'
    target: 'last_message'
  - name: no-unrelated-branch
    type: 'regex'
    pattern: '```diff[ \t]*\n(?:(?!```)[\s\S])*?(?:AvatarUpload|EmailToggle|ProfileSection|NotificationsSection)'
    match: 'not_contains'
    target: 'last_message'
  - name: no-page
    type: 'regex'
    pattern: '<!doctype\s+html|<html\b|<body\b|<head\b|<div\b|<section\b|<svg\b|<x-embed\b|<script\b|visualize\.html|claude\.ai/(?:code/)?artifact'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
