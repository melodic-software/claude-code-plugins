schema_version: "1.1"
name: viz-diagram-target-file-no-repo
graders:
  - name: fallback-notice
    type: 'regex'
    pattern: 'diagram_target: excalidraw-file unavailable \([^\n]*\brepo[^\n]*\); using auto'
    flags: 'i'
    target: 'last_message'
  - name: no-diagram-file
    type: file_exists
    path: '**/*.excalidraw'
    exists: false
  - name: local-diagram
    type: 'regex'
    pattern: '^(?:(?:(?!```)[\s\S])*?```[^\n]*\n(?:(?!```)[\s\S])*?```)*?(?:(?!```)[\s\S])*?```[^\n]*\n(?=(?:(?!```)[\s\S])*?\btoken)(?=(?:(?!```)[\s\S])*?\brevok)'
    flags: 'i'
    target: 'last_message'
    arm: 'both'
