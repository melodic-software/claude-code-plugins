    pattern: 'churn[^\n]{0,60}?\d+(?:\.\d+)?[ \t]?(?:%|per ?cent\b)|\d+(?:\.\d+)?[ \t]?(?:%|per ?cent\b)[^\n]{0,30}?churn'
