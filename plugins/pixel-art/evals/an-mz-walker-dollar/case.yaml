schema_version: "1.1"
name: an-mz-walker-dollar
graders:
  - name: kit-used
    type: regex
    pattern: '\\?"name\\?":\s*\\?"Read\\?",\s*\\?"input\\?":\s*\{\s*\\?"file_path\\?":\s*\\?"[^"\\]*\bkit\.py\\?"|\\?"name\\?":\s*\\?"Bash\\?",\s*\\?"input\\?":\s*\{\s*\\?"command\\?":\s*\\?"(?:[^"\\]|\\.){0,400}?(?:\b|(?<=\\n))(?:cp|rsync|install|python[0-9.]*|cat|head|sed|awk|less)\b(?:[^"\\;&|]|\\(?!\\n)[^n]){0,400}?\bkit\.py\b'
    target: trace
  - name: backends-ran
    type: tool_used
    tool: Bash
    input_match: '(?:\b|(?<=\\n))(?:python[0-9.]*|uv run(?: python[0-9.]*)?)\s+(?:-\S+\s+)*\\?["'']?[^\s"''\\]*\bbackends\.py\b(?:[^\\";&|]|\\")*?\s--out\b|(?:"command":"|[;&|(]\s*|\\n\s*|(?:\b|(?<=\\n))(?:then|do)\s+)\\?["'']?(?:\./|/|\$\{?\w+\}?/)[^\s"''\\]*\bbackends\.py\b(?:[^\\";&|]|\\")*?\s--out\b|^(?!.*(?:__doc__|help\())(?=.*(?:\b|(?<=\\n))(?:import\s+backends\b|from\s+backends\s+import\b))|(?:\b|(?<=\\n))(?:python[0-9.]*|uv run(?: python[0-9.]*)?)\s+(?:-\S+\s+)*\\?["'']?[^\s"''\\]*\.py\\?["'']?(?:\s+[^\s;&|<>\\]+)*?\s+\\?["'']?[^\s"''\\]*\bbackends\.py\b|^(?=.*\bbackends\.py\b)(?=.*(?:\b|(?<=\\n))subprocess\.(?:run|call|check_call|check_output|Popen)\()(?=.*\\?["'']--out\\?["''])(?=.*(?:\b|(?<=\\n))python[0-9.]*\s+[^\s;&|]*\.py\b)'
  - name: dollar-sheet-created
    type: file_exists
    path: '**/mage/$*.png'
  - name: names-dollar-file
    type: regex
    pattern: '(?:^|[.?!;]\s+|\n)(?:(?!\b(?:not|no|never|cannot)\b|n[''’]t\b)(?:[^\n.?!;]|\.(?=\S)))*?\$[a-z][\w-]*\.png\b'
    flags: 'i'
    target: last_message
