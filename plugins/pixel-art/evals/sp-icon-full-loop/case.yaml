schema_version: "1.1"
name: sp-icon-full-loop
graders:
  - name: brief-written
    type: file_exists
    path: '**/potion/brief.md'
  - name: palette-named-preset
    type: regex
    pattern: '^\{"type":"assistant".*?"type":"tool_use","id":"[^"]*","name":"(?:Write|Bash)","input":\{(?:"file_path":"(?:[^"\\]|\\.)*",)?"(?:content|command)":"(?:[^"\\]|\\.)*?palette\\?["'']?\s*[:=]\s*\\?["''][^"''\\]*pico-8(?:\.json)?\\?["'']'
    flags: 'm'
    target: trace
  - name: backends-ran
    type: tool_used
    tool: Bash
    input_match: '(?:\b|(?<=\\n))(?:python[0-9.]*|uv run(?: python[0-9.]*)?)\s+(?:-\S+\s+)*\\?["'']?[^\s"''\\]*\bbackends\.py\b|(?:"command":"|[;&|(]\s*|\\n\s*|(?:\b|(?<=\\n))(?:then|do)\s+)\\?["'']?(?:\./|/|\$\{?\w+\}?/)[^\s"''\\]*\bbackends\.py\b|^(?!.*(?:__doc__|help\())(?=.*(?:\b|(?<=\\n))(?:import\s+backends\b|from\s+backends\s+import\b))|(?:\b|(?<=\\n))(?:python[0-9.]*|uv run(?: python[0-9.]*)?)\s+(?:-\S+\s+)*\\?["'']?[^\s"''\\]*\.py\\?["'']?(?:\s+[^\s;&|<>\\]+)*?\s+\\?["'']?[^\s"''\\]*\bbackends\.py\b'
  - name: gallery-ran
    type: tool_used
    tool: Bash
    input_match: '(?:\b|(?<=\\n))(?:python[0-9.]*|uv run(?: python[0-9.]*)?)\s+(?:-\S+\s+)*\\?["'']?[^\s"''\\]*\bgallery\.py\b|(?:"command":"|[;&|(]\s*|\\n\s*|(?:\b|(?<=\\n))(?:then|do)\s+)\\?["'']?(?:\./|/|\$\{?\w+\}?/)[^\s"''\\]*\bgallery\.py\b|^(?!.*(?:__doc__|help\())(?=.*(?:\b|(?<=\\n))(?:import\s+gallery\b|from\s+gallery\s+import\b))'
  - name: preview-read
    type: tool_used
    tool: Read
    input_match: '"file_path":"(?:[^"]*/)?preview\.png"'
  - name: names-sheet-asset
    type: regex
    pattern: 'sheet\.png\b[^\n]{0,80}\b(?:asset|engine|1x|deliverable|game)\b|\b(?:asset|engine|deliverable)\b[^\n]{0,80}\bsheet\.png\b'
    flags: 'i'
    target: last_message
  - name: preview-not-the-asset
    type: regex
    pattern: 'preview\.png[`*]*\s+is\s+(?:the|your)\s+(?:[\w-]+\s+)?(?:asset|deliverable)\b|\b(?:asset|deliverable)\b[`*]*\s*:\s*[`*]*[^\s`*]*preview\.png|(?<!not )(?<!n''t )(?<!n’t )(?<!never )\b(?:use|import|ship|drop)\s+[`*]*[^\s`*]*preview\.png[`*]*\s+(?:in|into)\s+(?:your|the)\s+(?:game|engine|project)'
    flags: 'i'
    match: 'not_contains'
    target: last_message
