schema_version: "1.1"
name: sp-icon-full-loop
graders:
  - name: brief-written
    type: file_exists
    path: '**/potion/brief.md'
  - name: palette-named-preset
    type: regex
    pattern: '^\{"type":"assistant".*?"type":"tool_use","id":"[^"]*","name":(?:"Write","input":\{"file_path":"(?:[^"\\]|\\.)*","content":"(?:[^"\\]|\\.)*?palette\\?["'']?\s*[:=]\s*\\?["''][^"''\\]*pico-8(?:\.json)?\\?["'']|"Bash","input":\{"command":"(?:[^"\\]|\\.)*?(?:(?:\b|(?<=\\n))(?:cat|tee)\b(?=(?:[^\\"]|\\")*?\.(?:json|py)\b)(?:[^\\"]|\\")*?<<-?\s*(?:\\"|'')?(\w+)(?:\\"|'')?(?:[^\\"]|\\")*?\\n(?:(?!\\n\1(?:\\n|"))(?:[^"\\]|\\.))*?palette\\?["'']?\s*[:=]\s*\\?["''][^"''\\]*pico-8(?:\.json)?\\?["'']|(?:\b|(?<=\\n))(?:echo|printf)\b(?:[^\\"]|\\")*?palette\\?["'']?\s*[:=]\s*\\?["''][^"''\\]*pico-8(?:\.json)?\\?["''](?:[^\\"]|\\")*?>>?\s*\\?["'']?[^\s"''\\<>|;&]*\.(?:json|py)\b))'
    flags: 'm'
    target: trace
  - name: backends-ran
    type: tool_used
    tool: Bash
    input_match: '(?:\b|(?<=\\n))(?:python[0-9.]*|uv run(?: python[0-9.]*)?)\s+(?:-\S+\s+)*\\?["'']?[^\s"''\\]*\bbackends\.py\b(?:[^\\";&|]|\\")*?\s--out\b|(?:"command":"|[;&|(]\s*|\\n\s*|(?:\b|(?<=\\n))(?:then|do)\s+)\\?["'']?(?:\./|/|\$\{?\w+\}?/)[^\s"''\\]*\bbackends\.py\b(?:[^\\";&|]|\\")*?\s--out\b|^(?!.*(?:__doc__|help\())(?=.*(?:\b|(?<=\\n))(?:import\s+backends\b|from\s+backends\s+import\b))|(?:\b|(?<=\\n))(?:python[0-9.]*|uv run(?: python[0-9.]*)?)\s+(?:-\S+\s+)*\\?["'']?[^\s"''\\]*\.py\\?["'']?(?:\s+[^\s;&|<>\\]+)*?\s+\\?["'']?[^\s"''\\]*\bbackends\.py\b|^(?=.*\bbackends\.py\b)(?=.*(?:\b|(?<=\\n))subprocess\.(?:run|call|check_call|check_output|Popen)\()(?=.*\\?["'']--out\\?["''])(?=.*(?:\b|(?<=\\n))python[0-9.]*\s+[^\s;&|]*\.py\b)'
  - name: gallery-ran
    type: tool_used
    tool: Bash
    input_match: '(?:\b|(?<=\\n))(?:python[0-9.]*|uv run(?: python[0-9.]*)?)\s+(?:-\S+\s+)*\\?["'']?[^\s"''\\]*\bgallery\.py\b|(?:"command":"|[;&|(]\s*|\\n\s*|(?:\b|(?<=\\n))(?:then|do)\s+)\\?["'']?(?:\./|/|\$\{?\w+\}?/)[^\s"''\\]*\bgallery\.py\b|^(?!.*(?:__doc__|help\())(?=.*(?:\b|(?<=\\n))(?:import\s+gallery\b|from\s+gallery\s+import\b))'
  - name: preview-read
    type: tool_used
    tool: Read
    input_match: '"file_path":"(?:[^"]*/)?preview\.png"'
  - name: names-sheet-asset
    type: regex
    pattern: 'sheet\.png\b(?:(?!\b(?:only|just|not|never|reference|preview)\b|n[''’]t\b)(?:[^\n.;!?]|\.(?=\S))){0,80}?\b(?:asset|engine|1x|deliverable|game)\b|\b(?:asset|engine|deliverable)\b(?:(?!preview\.png|\b(?:not|never)\b|n[''’]t\b)(?:[^\n.;!?]|\.(?=\S))){0,80}?\bsheet\.png\b'
    flags: 'i'
    target: last_message
  - name: preview-not-the-asset
    type: regex
    pattern: 'preview\.png[`*]*\s+is\s+(?:the|your)\s+(?:[\w-]+\s+)?(?:asset|deliverable)\b|\b(?:asset|deliverable)\b[`*]*\s*(?::|\bis\b)\s*[`*]*[^\s`*]*preview\.png|(?<!not )(?<!n''t )(?<!n’t )(?<!never )\b(?:use|import|ship|drop|add)\s+[`*]*[^\s`*]*preview\.png[`*]*\s+(?:in|into|to)\b'
    flags: 'i'
    match: 'not_contains'
    target: last_message
