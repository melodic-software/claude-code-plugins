<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campfire: pixel-art cutscene</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0a14; display: grid; place-items: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="screen" aria-label="Pixel-art cutscene: a traveler walks to a campfire at dusk"></canvas>
<script>
"use strict";
const SPRITE = /*EMBED:hero_mz.json*/null;
const W = 240, H = 160;                         // logical resolution (GBA)
const PAL = {                                   // locked scene palette
  sky0: "#1a1030", sky1: "#2c1c4a", sky2: "#4a2a5c", sky3: "#7a3c62", sky4: "#c0605a",
  star: "#fff2c0", mtnFar: "#3a2450", mtnNear: "#24183a", ground: "#1c2a24", grass: "#2e4a34",
  grassHi: "#4a6a3c", log: "#5a3422", logDark: "#34180e", fire0: "#fff4a0", fire1: "#ffc040",
  fire2: "#f07020", fire3: "#b02c20", smoke: "#5a4a60", glow: "#3a2a2a",
  box: "#141026", boxEdge: "#c8b89a", text: "#f4ecd8",
};
const screen = document.getElementById("screen");
const out = screen.getContext("2d");
const buf = document.createElement("canvas"); buf.width = W; buf.height = H;
const g = buf.getContext("2d");

function fit() {
  const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  screen.width = W * s; screen.height = H * s;
  out.imageSmoothingEnabled = false;
}
addEventListener("resize", fit); fit();

const px = (x, y, c) => { g.fillStyle = c; g.fillRect(x | 0, y | 0, 1, 1); };
const rect = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); };

// sprite frames -> offscreen canvases, built once from the shared sprite spec
const frames = {};
for (const [name, rows] of Object.entries(SPRITE.frames)) {
  const c = document.createElement("canvas"); c.width = rows[0].length; c.height = rows.length;
  const cx = c.getContext("2d");
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch !== ".") { cx.fillStyle = SPRITE.palette[ch]; cx.fillRect(x, y, 1, 1); }
  }));
  frames[name] = c;
}

// deterministic starfield and mountain ridges
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const stars = Array.from({ length: 40 }, () => [rnd() * W | 0, rnd() * 70 | 0, rnd() * 6.28]);
const ridge = (base, amp, f1, f2) => Array.from({ length: W }, (_, x) =>
  base - Math.round(amp * (Math.sin(x * f1) * 0.6 + Math.sin(x * f2 + 1.3) * 0.4)));
const far = ridge(92, 14, 0.031, 0.083), near = ridge(108, 10, 0.047, 0.121);

function sky() {
  const bands = [PAL.sky0, PAL.sky1, PAL.sky2, PAL.sky3, PAL.sky4];
  const bandH = 22;
  for (let i = 0; i < bands.length; i++) {
    rect(0, i * bandH, W, bandH, bands[i]);
    if (i + 1 < bands.length)                    // 2-row checker dither between bands
      for (let y = 0; y < 2; y++) for (let x = (y & 1); x < W; x += 2) px(x, (i + 1) * bandH - 2 + y, bands[i + 1]);
  }
  rect(0, bands.length * bandH, W, H, PAL.sky4);
}

function drawStars(t) {
  for (const [x, y, ph] of stars) if (Math.sin(t * 2 + ph) > -0.3) px(x, y, PAL.star);
}

function mountains() {
  for (let x = 0; x < W; x++) { rect(x, far[x], 1, H, PAL.mtnFar); rect(x, near[x], 1, H, PAL.mtnNear); }
  rect(0, 124, W, H - 124, PAL.ground);
  for (let x = 0; x < W; x++) {                  // grass lip with tufts
    px(x, 124, PAL.grass);
    if ((x * 7) % 11 === 0) { px(x, 123, PAL.grass); px(x, 122, PAL.grassHi); }
  }
}

const FIRE_X = 168, FIRE_Y = 124;
const embers = Array.from({ length: 24 }, () => ({ life: 0 }));
function fire(t, dt) {
  // ground glow: dithered ellipse, flickering radius
  const r = 22 + Math.round(Math.sin(t * 9) + Math.sin(t * 13));
  for (let y = -6; y <= 6; y++) for (let x = -r; x <= r; x++)
    if ((x * x) / (r * r) + (y * y) / 36 <= 1 && ((x + y) & 1)) px(FIRE_X + x, FIRE_Y + 2 + y, PAL.glow);
  rect(FIRE_X - 8, FIRE_Y - 2, 16, 3, PAL.log); rect(FIRE_X - 6, FIRE_Y, 12, 1, PAL.logDark);
  const ramp = [PAL.fire0, PAL.fire1, PAL.fire2, PAL.fire3];
  const frame = Math.floor(t * 10) % 3;          // 10 fps flame cycle
  for (let i = 0; i < 4; i++) {
    const w = 9 - i * 2, h = 12 - i * 2 + (frame === i % 3 ? 2 : 0);
    const sway = Math.round(Math.sin(t * 6 + i) * (i > 1 ? 1 : 0));
    for (let y = 0; y < h; y++) {
      const half = Math.max(0, Math.round((w / 2) * (1 - y / h)));
      rect(FIRE_X - half + sway, FIRE_Y - 3 - y, half * 2 + 1, 1, ramp[3 - i]);
    }
  }
  for (const e of embers) {                      // pooled embers stepping through the fire ramp
    if (e.life <= 0) Object.assign(e, { x: FIRE_X + (rnd() * 8 - 4), y: FIRE_Y - 6, vx: rnd() * 10 - 5, life: 0.6 + rnd() * 0.9 });
    e.life -= dt; e.y -= 22 * dt; e.x += e.vx * dt;
    const idx = Math.min(3, Math.floor((1 - e.life / 1.5) * 4));
    if (e.life > 0) px(e.x, e.y, idx > 2 ? PAL.smoke : ramp[idx]);
  }
}

// 3x5 pixel font
const FONT = {
  A: "010101111101101", B: "110101110101110", C: "011100100100011", D: "110101101101110", E: "111100110100111",
  F: "111100110100100", G: "011100101101011", H: "101101111101101", I: "111010010010111", K: "101101110101101",
  L: "100100100100111", M: "101111111101101", N: "110101101101101", O: "010101101101010", P: "110101110100100",
  R: "110101110101101", S: "011100010001110", T: "111010010010010", U: "101101101101111", V: "101101101101010",
  W: "101101111111101", Y: "101101010010010", ".": "000000000000010", ",": "000000000010100", "'": "010010000000000",
  "!": "010010010000010", " ": "000000000000000", "1": "010110010010111",
};
function text(str, x, y, c) {
  for (const ch of str.toUpperCase()) {
    const glyph = FONT[ch] || FONT[" "];
    for (let i = 0; i < 15; i++) if (glyph[i] === "1") px(x + (i % 3), y + ((i / 3) | 0), c);
    x += 4;
  }
}

function dialogue(msg, shown) {
  rect(8, 132, W - 16, 22, PAL.box);
  g.strokeStyle = PAL.boxEdge; g.lineWidth = 1; g.strokeRect(8.5, 132.5, W - 17, 21);
  text(msg.slice(0, shown), 14, 140, PAL.text);
}

// dither fade: 4x4 Bayer threshold keeps the fade on the pixel grid (no alpha)
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function ditherFade(level, c) {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (BAYER[(y & 3) * 4 + (x & 3)] < level * 16) px(x, y, c);
}

const LINE = "The road ends here... for tonight.";
const LOOP = 14;
let last = performance.now(), acc = 0, t = 0;
const STEP = 1 / 60;
function tick(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= STEP) { acc -= STEP; t += STEP; }
  const lt = t % LOOP;
  sky(); drawStars(t); mountains(); fire(t, STEP);

  const walkEnd = 6, startX = -48, stopX = FIRE_X - 64;
  const heroX = Math.round(startX + (stopX - startX) * Math.min(1, lt / walkEnd));
  const walking = lt < walkEnd;
  const cycle = SPRITE.animations.walk_right.frames;
  const frame = walking ? cycle[Math.floor(lt / 0.15) % cycle.length] : "right1";
  g.drawImage(frames[frame], heroX, 124 - 46);

  if (lt < 1.5) {                                // title card
    ditherFade(1 - lt / 1.5, PAL.sky0);
    text("CHAPTER 1", W / 2 - 18, 70, PAL.text);
  }
  if (lt > walkEnd + 0.5) dialogue(LINE, Math.floor((lt - walkEnd - 0.5) * 18));
  if (lt > LOOP - 1) ditherFade(lt - (LOOP - 1), PAL.sky0);

  out.drawImage(buf, 0, 0, screen.width, screen.height);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
