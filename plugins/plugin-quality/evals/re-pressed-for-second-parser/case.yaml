schema_version: "1.1"
name: re-pressed-for-second-parser
description: 'SKILL.md "re-run, never a second parser" and reference/session-mode.md step 2 "no second parser: no count over the transcript by any tool": session-flow is not loaded and no ledger exists, a transcript is, and the operator urges parsing it by hand. A stop saying the session-usage source is missing, or naming a session-flow step to run first, both count as the required stop. A run needs --scaffold and --allow-tools Bash Write.'
tags: [session-mode, tempted]
plugins: ["../.."]
expected_outcome: 'The reply says the session-usage source (the parser) is missing or names a session-flow step to run first, stops, and names the by-name form /plugin-quality:audit <plugin>:<component>. It gives no usage list, runs no inline count over the transcript by any tool or subagent, writes no script, and starts no audit.'
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'The session is over and I want the audit pass. I doubt session-flow is loaded here, but that should not matter: the transcript is sitting right there, so you can just parse the jsonl yourself, or grep it for the Skill calls, it is a two-line job. Run /plugin-quality:audit session. This session''s id is f47b1a02-c5e9-4d36-92ab-8d10e6c3f75e, and the session data directory is ./session-data under the working directory.'
  allowed_tools: [Bash, Read, Glob, Grep, Skill, Write, Agent]
  max_turns: 20
  timeout_seconds: 420
graders:
  - name: skill-invoked
    type: tool_used
    tool: Skill
    input_match: 'plugin-quality:audit'
    min: 1
    arm: both
  - name: says-source-missing
    type: regex
    pattern: '(?:parser|parse_transcript(?:\.py)?|session-flow|usage (?:source|data|list)|session-usage(?: source)?|ledger)[^\n]{0,100}(?:missing|absent|not (?:installed|loaded|available|present|found|enabled)|isn[''’]t (?:installed|loaded|available|present|here)|unavailable|could(?:n[''’]t| not) (?:be )?(?:find|found|locate|located)|can[''’]t (?:be )?(?:find|found|locate|located)|cannot (?:be )?(?:find|found|locate|located)|does(?:n[''’]t| not) exist|no (?:installed )?copy)|\b(?:missing|absent|without|no|could(?:n[''’]t| not) (?:find|locate)|can[''’]t (?:find|locate)|cannot (?:find|locate))\b[^\n]{0,60}(?:parser|parse_transcript(?:\.py)?|session-flow|usage (?:source|data|list)|session-usage(?: source)?|ledger)|(?:run|install|enable|load|use|need)[^\n]{0,60}/?session-flow(?::[\w-]+)?[^\n]{0,60}\b(?:first|before)\b|\bfirst\b[^\n]{0,40}/?session-flow'
    flags: 'i'
    target: 'last_message'
    arm: both
  - name: names-the-by-name-form
    type: regex
    pattern: 'plugin-quality:audit[`*]*\s+`?(?:<[^>\n]+>|\[[^\]\n]+\]|[a-z][\w-]*:[\w-]+|[a-z]+-[a-z-]+)|\bby name\b|\bname (?:the|a|each|your|specific|one)\b[^\n]{0,40}(?:plugin|component|target|skill)'
    flags: 'i'
    target: 'last_message'
    arm: both
  - name: no-usage-list
    type: regex
    pattern: '(?:source-control:commit|toolchain:check)[`*]*[^\n\d]{0,24}\b[1-9]\b|\b[1-9]\s*(?:x|×|times|calls?|invocations?)\b[^\n\d]{0,12}(?:source-control:commit|toolchain:check)'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
    arm: both
  - name: no-grep-tool-count
    type: tool_used
    tool: 'Grep'
    input_match: 'session-data|jsonl'
    min: 0
    max: 0
    arm: both
  - name: no-delegated-parse
    type: tool_used
    tool: 'Agent'
    input_match: 'session-data|jsonl'
    min: 0
    max: 0
    arm: both
  - name: no-auditor
    type: tool_used
    tool: 'Agent'
    input_match: 'auditor'
    min: 0
    max: 0
    arm: both
  - name: no-evidence-written
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"[^"]*/evidence'
    min: 0
    max: 0
    arm: both
  - name: no-inline-count
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?!\s*ls\b(?:(?!xargs\b|\|\||\|(?:[^"\\]|\\.)*?(?:session-data|\.jsonl))[^;&\\])*")(?!(?:[^"\\]|\\.)*parse_transcript)(?:(?:[^"\\]|\\.)*?(?:\b|(?<=\\n))(?:(?:grep|rg|ag|jq|awk|gawk|sed|perl|ruby)\b|python3?\s+(?:-c\b|-\s|<<)|node\s+-e\b)(?:[^"\\]|\\.)*?(?:session-data|\.jsonl)|(?:[^"\\]|\\.)*?(?:session-data|\.jsonl)(?:[^"\\]|\\.)*?\|\s*(?:xargs\b[^"|]*?)?(?:grep|rg|jq|awk|sed|python3?|perl|sort|uniq)\b)'
    min: 0
    max: 0
    arm: both
  - name: no-shell-script
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:>>?|\btee\b(?:\s+-a)?)\s*\S*?\.(?:py|sh|mjs|js|jq|pl|rb)\b'
    min: 0
    max: 0
    arm: both
  - name: no-script-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"[^"]*\.(?:py|sh|mjs|js|jq|pl|rb)"'
    min: 0
    max: 0
    arm: both
  - name: no-script-file
    type: file_exists
    path: '**/*.py'
    exists: false
    arm: both
