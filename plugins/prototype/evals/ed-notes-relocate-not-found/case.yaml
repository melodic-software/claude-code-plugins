schema_version: "1.1"
name: ed-notes-relocate-not-found
description: "Re-locating a note, MB:plugins/prototype/skills/explore-directions/reference/feedback.md: the person pinned a note on variant B's Export button in mockup-run/ before the mockup was reworked, and the rework removed the button. The note's test id is on no element and its path finds nothing. The agent reports the element not found, naming the anchor that failed, gives the note's stored box only as a position, labeled position only, asks the person one question, and edits nothing. Needs no live notes host: the note is in the scaffold's actions.json, which notes-bridge status reads with no server, and the page file alone shows the test id is gone. The scaffold's note is synthetic."
tags: [explore-directions, hard]
runs: 3
expected_outcome: "The agent reads the unhandled note (through notes-bridge status or actions.json), finds no element with test id shipments-export in variant B of the mockup, says the element was not found, gives any location only as the note's stored position labeled position only, asks the person one question about what the note should apply to, and makes no change to explore-directions.html."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/prototype:explore-directions Before you reworked the /shipments mockup in the run directory mockup-run/, I pinned a note on it in the page. Deal with my note."
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit]
  max_turns: 40
  timeout_seconds: 900
