schema_version: "1.1"
name: ed-graft-reply-records-and-deletes
description: "contract-change: base step 5 records a graft reply directly (winner, losers, steal/skip entries, what the discarded parts held, UI acceptance criteria) and then deletes the mockup; head runs the combine matrix on a graft reply first, so this case is expected to fail on head by design and is a decision for the owner."
tags: [explore-directions, contract-change, hard]
runs: 3
expected_outcome: "docs/decisions/ui-shipments.md records the graft piece by piece (delivery-date cards from B, region filter from C), why A lost, what the discarded parts held, and UI acceptance criteria as checkbox lines including the empty state and the test ids; the mockup file is then deleted."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/prototype:explore-directions Here is my reply on the /shipments variants (the mockup is at mockup-run/explore-directions.html):\n\nscreen: /shipments\ndirection: graft\nsteal: delivery-date cards from B\nsteal: region filter from C\nskip: A because the table hides the delivery date\nstate: empty shows the no-parcels message and a track-a-parcel action\ntest-ids: B: shipments-parcel-card, shipments-empty; C: shipments-region-filter\nnext-target: returns panel\n\nRecord the decision and close out the run."
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit]
  max_turns: 40
  timeout_seconds: 900
