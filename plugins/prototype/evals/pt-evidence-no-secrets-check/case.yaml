schema_version: "1.1"
name: pt-evidence-no-secrets-check
description: "Evidence step with no check to run, MB:plugins/prototype/context/discipline.md 'Evidence step': the scaffold repository has no secrets or machine-data check, so closing out the loans prototype pushes nothing and the durable note records the prototype's local path and not pushed: <reason>."
tags: [pressure-test, hard]
runs: 3
expected_outcome: "The agent writes the answer (a renewal of a reserved copy is refused) into docs/decisions/loan-renewal.md, runs no git push, and records in that note the prototype's local path under src/loans and a not pushed: <reason> line saying the repository has no secrets check. Nothing is pushed to any branch."
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/prototype:pressure-test I finished driving the loans prototype in src/loans. Answer: when someone else has reserved the copy, the current borrower's renewal is refused and the reservation stands. Record that in docs/decisions/loan-renewal.md and close the prototype out."
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit]
  max_turns: 40
  timeout_seconds: 900
