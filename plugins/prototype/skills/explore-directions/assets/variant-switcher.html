<!--
  Variant switcher for the explore-directions HTML mockup. Paste this whole fragment just before
  </body>. Each variant is an element carrying data-variant (its key) and data-variant-label (its
  name), for example: <section data-variant="A" data-variant-label="Quiet">...</section>.
  Keys 1-N and the left and right arrows switch (wrapping around), R replays the current variant's
  entrance, and keys are ignored while a field has focus or a modifier is held. State lives in
  memory only, so the page works from file:// under the mockup's CSP (inline style and script,
  nothing remote). Add data-position="top" to the nav when a variant occupies the bottom center.
  Switching and replay remount a variant from a copy of its markup, so listeners attached to
  elements inside it are lost: wire variant interactions with listeners delegated from document.
  Chrome, not a contestant: leave its look alone.
-->
<nav class="vs" aria-label="Variants" data-position="bottom">
  <span class="vs-highlight" aria-hidden="true"></span>
  <button type="button" class="vs-item vs-step" data-step="-1" aria-label="Previous variant">&larr;</button>
  <span class="vs-items"></span>
  <button type="button" class="vs-item vs-step" data-step="1" aria-label="Next variant">&rarr;</button>
  <span class="vs-divider" aria-hidden="true"></span>
  <button type="button" class="vs-item vs-replay" aria-label="Replay the variant (R)">&#8635;</button>
</nav>
<style>
  .vs {
    position: fixed;
    inset-block-end: 24px;
    inset-inline-start: 50%;
    transform: translateX(-50%);
    z-index: 2147483647;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: rgb(10 10 10 / 0.86);
    box-shadow: 0 0 0 1px rgb(255 255 255 / 0.08) inset, 0 8px 24px rgb(0 0 0 / 0.24);
    font: 13px/1 system-ui, sans-serif;
    direction: ltr;
    user-select: none;
    -webkit-user-select: none;
  }
  .vs[hidden] { display: none; }
  .vs[data-position="top"] { inset-block-end: auto; inset-block-start: 24px; }
  .vs-items { display: contents; }
  .vs-highlight {
    position: absolute;
    inset-block-start: 4px;
    inset-inline-start: 0;
    inline-size: 100px;
    block-size: 28px;
    border-radius: 999px;
    background: rgb(255 255 255 / 0.14);
    transform-origin: left center;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: no-preference) {
    .vs[data-ready] .vs-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1); }
  }
  .vs-item {
    position: relative;
    display: flex;
    align-items: center;
    block-size: 28px;
    padding: 0 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: rgb(255 255 255 / 0.6);
    font: inherit;
    cursor: pointer;
    transition: color 150ms ease-out;
  }
  @media (hover: hover) and (pointer: fine) {
    .vs-item:hover { color: rgb(255 255 255 / 0.9); }
  }
  .vs-item:focus-visible { outline: 2px solid rgb(255 255 255 / 0.5); outline-offset: 2px; }
  .vs-item[aria-current="true"] { color: #fff; }
  .vs-divider { inline-size: 1px; block-size: 16px; margin: 0 4px; background: rgb(255 255 255 / 0.14); }
  [data-variant][hidden] { display: none !important; }
</style>
<script>
  (() => {
    const nav = document.querySelector(".vs");
    const list = nav.querySelector(".vs-items");
    const highlight = nav.querySelector(".vs-highlight");
    const variants = [...document.querySelectorAll("[data-variant]")];
    if (variants.length === 0) { nav.hidden = true; return; }
    let current = 0;

    const items = variants.map((v, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "vs-item";
      b.textContent = `${v.dataset.variant} ${v.dataset.variantLabel || ""}`.trim();
      b.addEventListener("click", () => show(i));
      list.append(b);
      return b;
    });

    function place() {
      const el = items[current];
      highlight.style.transform = `translateX(${el.offsetLeft}px) scaleX(${el.offsetWidth / 100})`;
    }

    // Replacing the element with a fresh copy restarts its entrance animations.
    function remount(i) {
      const fresh = variants[i].cloneNode(true);
      variants[i].replaceWith(fresh);
      variants[i] = fresh;
    }

    function show(i) {
      current = (i + variants.length) % variants.length;
      variants.forEach((v, j) => { v.hidden = j !== current; });
      items.forEach((b, j) => {
        if (j === current) b.setAttribute("aria-current", "true");
        else b.removeAttribute("aria-current");
      });
      remount(current);
      place();
    }

    nav.querySelectorAll(".vs-step").forEach((b) => b.addEventListener("click", () => show(current + Number(b.dataset.step))));
    nav.querySelector(".vs-replay").addEventListener("click", () => remount(current));
    window.addEventListener("resize", place);

    document.addEventListener("keydown", (e) => {
      const t = e.target;
      if (t instanceof HTMLElement && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const n = Number.parseInt(e.key, 10);
      if (n >= 1 && n <= variants.length) show(n - 1);
      else if (e.key === "ArrowRight") show(current + 1);
      else if (e.key === "ArrowLeft") show(current - 1);
      else if (e.key === "r" || e.key === "R") remount(current);
      else return;
      e.preventDefault();
    });

    show(0);
    // The highlight slides only after first paint, so the load does not animate.
    requestAnimationFrame(() => requestAnimationFrame(() => nav.setAttribute("data-ready", "")));
  })();
</script>
