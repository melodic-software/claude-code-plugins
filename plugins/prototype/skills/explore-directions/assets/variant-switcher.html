<!--
  Variant switcher for the explore-directions HTML mockup. Paste this whole fragment just before
  </body>. Each variant is an element carrying data-variant (its key) and data-variant-label (its
  name), for example: <section data-variant="A" data-variant-label="Quiet">...</section>. Inside a
  variant, each screen state is an element carrying data-screen-state (its key, the same in every
  variant) and data-screen-state-label, for example:
  <div data-screen-state="empty" data-screen-state-label="Empty">...</div>. The attribute is not
  data-state, which component libraries (Radix, Headless UI) set on their own open/closed parts.
  Keys 1-N and the left and right arrows switch variants (wrapping around), the state button and
  the up and down arrows step through the current variant's states (wrapping around, kept across a
  variant switch), R replays the current variant's entrance, W flips demo and worst content, S
  steps the motion speed, and keys are ignored while a field has focus or a modifier is held. The
  up and down arrows still scroll the page when the variant has fewer than two states. The
  switcher keeps what it shows in memory only, so the page works from file:// under the mockup's
  CSP (inline style and script, nothing remote). It reads the variant and state elements once,
  when it runs, so render them before it: in the markup or a plain inline script above it, never a
  module script or a DOMContentLoaded listener. Add data-position="top" to the nav when a variant
  occupies the bottom center.
  Worst content: mark the ordinary set data-content-set="demo" and the breaking set
  data-content-set="worst"; the Demo/Worst button appears only when the page has both, and a script
  that renders content reads document.documentElement.dataset.vsContent ("demo" or "worst").
  Replay and the speed button appear only when a variant declares a CSS animation or transition, or
  carries data-motion. Speed slows CSS animations, CSS transitions and Web Animations; motion a
  script drives frame by frame (requestAnimationFrame, timers) is not slowed.
  Switching and replay remount a variant from a copy of its markup, so listeners attached to
  elements inside it are lost: wire variant interactions with listeners delegated from document.
  Chrome, not a contestant: leave its look alone.
-->
<nav class="vs" aria-label="Variants" data-position="bottom">
  <span class="vs-highlight" aria-hidden="true"></span>
  <button type="button" class="vs-item vs-step" data-step="-1" aria-label="Previous variant">&larr;</button>
  <span class="vs-items"></span>
  <button type="button" class="vs-item vs-step" data-step="1" aria-label="Next variant">&rarr;</button>
  <span class="vs-divider vs-state-part" aria-hidden="true"></span>
  <button type="button" class="vs-item vs-state vs-state-part"></button>
  <span class="vs-divider vs-extra" aria-hidden="true"></span>
  <button type="button" class="vs-item vs-extra vs-content" aria-pressed="false" aria-label="Show worst content (W)">Demo</button>
  <button type="button" class="vs-item vs-extra vs-speed" aria-label="Motion speed (S)">1&times;</button>
  <button type="button" class="vs-item vs-extra vs-replay" aria-label="Replay the variant (R)">&#8635;</button>
</nav>
<style>
  .vs {
    position: fixed;
    inset-block-end: 24px;
    inset-inline-start: 50%;
    transform: translateX(-50%);
    z-index: 2147483647;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: rgb(10 10 10 / 0.86);
    box-shadow: 0 0 0 1px rgb(255 255 255 / 0.08) inset, 0 8px 24px rgb(0 0 0 / 0.24);
    font: 13px/1 system-ui, sans-serif;
    direction: ltr;
    user-select: none;
    -webkit-user-select: none;
  }
  .vs[hidden], .vs [hidden] { display: none; }
  .vs[data-position="top"] { inset-block-end: auto; inset-block-start: 24px; }
  .vs-items { display: contents; }
  .vs-highlight {
    position: absolute;
    inset-block-start: 4px;
    inset-inline-start: 0;
    inline-size: 100px;
    block-size: 28px;
    border-radius: 999px;
    background: rgb(255 255 255 / 0.14);
    transform-origin: left center;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: no-preference) {
    .vs[data-ready] .vs-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1); }
  }
  .vs-item {
    position: relative;
    display: flex;
    align-items: center;
    block-size: 28px;
    padding: 0 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: rgb(255 255 255 / 0.6);
    font: inherit;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: color 150ms ease-out;
  }
  @media (hover: hover) and (pointer: fine) {
    .vs-item:hover { color: rgb(255 255 255 / 0.9); }
  }
  .vs-item:focus-visible { outline: 2px solid rgb(255 255 255 / 0.5); outline-offset: 2px; }
  .vs-item[aria-current="true"], .vs-item[aria-pressed="true"] { color: #fff; }
  .vs-divider { inline-size: 1px; block-size: 16px; margin: 0 4px; background: rgb(255 255 255 / 0.14); }
  .vs-state { color: #fff; }
  [data-variant][hidden], [data-screen-state][hidden] { display: none !important; }
  :root:not([data-vs-content="worst"]) [data-content-set="worst"],
  :root[data-vs-content="worst"] [data-content-set="demo"] { display: none !important; }
</style>
<script>
  (() => {
    const nav = document.querySelector(".vs");
    const list = nav.querySelector(".vs-items");
    const highlight = nav.querySelector(".vs-highlight");
    const stateButton = nav.querySelector(".vs-state");
    const stateParts = nav.querySelectorAll(".vs-state-part");
    const contentButton = nav.querySelector(".vs-content");
    const speedButton = nav.querySelector(".vs-speed");
    const replayButton = nav.querySelector(".vs-replay");
    const variants = [...document.querySelectorAll("[data-variant]")];
    if (variants.length === 0) { nav.hidden = true; return; }
    const root = document.documentElement;
    const speeds = [1, 0.5, 0.25];
    let current = 0;
    let stateKey = null;
    let speed = 0;

    const hasContent = !!document.querySelector('[data-content-set="demo"]') && !!document.querySelector('[data-content-set="worst"]');
    const hasMotion = variants.some((v) => v.matches("[data-motion]") || v.querySelector("[data-motion]") ||
      [v, ...v.querySelectorAll("*")].some((el) => {
        const s = getComputedStyle(el);
        return s.animationName.split(",").some((n) => n.trim() !== "none") ||
          s.transitionDuration.split(",").some((d) => Number.parseFloat(d) > 0);
      }));
    contentButton.hidden = !hasContent;
    speedButton.hidden = !hasMotion;
    replayButton.hidden = !hasMotion;
    nav.querySelector(".vs-divider.vs-extra").hidden = !hasContent && !hasMotion;
    root.dataset.vsContent = "demo";

    const items = variants.map((v, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "vs-item";
      b.textContent = `${v.dataset.variant} ${v.dataset.variantLabel || ""}`.trim();
      b.addEventListener("click", () => show(i));
      list.append(b);
      return b;
    });

    function place() {
      const el = items[current];
      highlight.style.transform = `translateX(${el.offsetLeft}px) scaleX(${el.offsetWidth / 100})`;
    }

    // Applies the speed to every running animation outside the switcher itself.
    function applySpeed() {
      for (const a of document.getAnimations()) {
        const target = a.effect && a.effect.target;
        if (target && nav.contains(target)) continue;
        if (a.playbackRate !== speeds[speed]) a.playbackRate = speeds[speed];
      }
    }

    // Animations created later start at full speed, so a slowed page re-applies the speed each frame.
    function watchSpeed() {
      if (speeds[speed] === 1) return;
      applySpeed();
      requestAnimationFrame(watchSpeed);
    }

    // Replacing the element with a fresh copy restarts its entrance animations.
    function remount(i) {
      const fresh = variants[i].cloneNode(true);
      variants[i].replaceWith(fresh);
      variants[i] = fresh;
      if (speeds[speed] !== 1) applySpeed();
    }

    // Queried on each use, since remounting replaces the state elements.
    const states = () => [...variants[current].querySelectorAll("[data-screen-state]")];

    // Falls back to the first state for display only, so the pick survives a variant without it.
    function applyState() {
      const all = states();
      stateParts.forEach((p) => { p.hidden = all.length === 0; });
      if (all.length === 0) return;
      const shown = all.find((s) => s.dataset.screenState === stateKey) || all[0];
      all.forEach((s) => { s.hidden = s !== shown; });
      const text = `state · ${shown.dataset.screenStateLabel || shown.dataset.screenState}`;
      stateButton.textContent = text;
      stateButton.setAttribute("aria-label", `${text}, next state (down arrow)`);
    }

    function stepState(step) {
      const all = states();
      if (all.length < 2) return false;
      const i = Math.max(0, all.findIndex((s) => s.dataset.screenState === stateKey));
      stateKey = all[(i + step + all.length) % all.length].dataset.screenState;
      applyState();
      return true;
    }

    function replay() {
      remount(current);
      applyState();
    }

    function show(i) {
      current = (i + variants.length) % variants.length;
      variants.forEach((v, j) => { v.hidden = j !== current; });
      items.forEach((b, j) => {
        if (j === current) b.setAttribute("aria-current", "true");
        else b.removeAttribute("aria-current");
      });
      replay();
      place();
    }

    function flipContent() {
      const worst = root.dataset.vsContent !== "worst";
      root.dataset.vsContent = worst ? "worst" : "demo";
      contentButton.textContent = worst ? "Worst" : "Demo";
      contentButton.setAttribute("aria-pressed", String(worst));
      replay();
    }

    function stepSpeed() {
      const wasSlow = speeds[speed] !== 1;
      speed = (speed + 1) % speeds.length;
      speedButton.textContent = `${speeds[speed]}×`;
      applySpeed();
      if (!wasSlow) watchSpeed();
    }

    nav.querySelectorAll(".vs-step").forEach((b) => b.addEventListener("click", () => show(current + Number(b.dataset.step))));
    stateButton.addEventListener("click", () => stepState(1));
    replayButton.addEventListener("click", replay);
    contentButton.addEventListener("click", flipContent);
    speedButton.addEventListener("click", stepSpeed);
    window.addEventListener("resize", place);

    document.addEventListener("keydown", (e) => {
      const t = e.target;
      if (t instanceof HTMLElement && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const n = Number.parseInt(e.key, 10);
      if (n >= 1 && n <= variants.length) show(n - 1);
      else if (e.key === "ArrowRight") show(current + 1);
      else if (e.key === "ArrowLeft") show(current - 1);
      else if (e.key === "ArrowDown") { if (!stepState(1)) return; }
      else if (e.key === "ArrowUp") { if (!stepState(-1)) return; }
      else if ((e.key === "r" || e.key === "R") && hasMotion) replay();
      else if ((e.key === "w" || e.key === "W") && hasContent) flipContent();
      else if ((e.key === "s" || e.key === "S") && hasMotion) stepSpeed();
      else return;
      e.preventDefault();
    });

    show(0);
    // The highlight slides only after first paint, so the load does not animate.
    requestAnimationFrame(() => requestAnimationFrame(() => nav.setAttribute("data-ready", "")));
  })();
</script>
