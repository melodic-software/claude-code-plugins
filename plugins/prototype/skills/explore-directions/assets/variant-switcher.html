<!--
  Variant switcher for the explore-directions HTML mockup. Paste this whole fragment just before
  </body>. Each variant is an element carrying data-variant (its key) and data-variant-label (its
  name), for example: <section data-variant="A" data-variant-label="Quiet">...</section>. Inside a
  variant, each screen state is an element carrying data-screen-state (its key, the same in every
  variant) and data-screen-state-label, for example:
  <div data-screen-state="empty" data-screen-state-label="Empty">...</div>. The attribute is not
  data-state, which component libraries (Radix, Headless UI) set on their own open/closed parts.
  Keys 1-N and the left and right arrows switch variants (wrapping around), the state button and
  the up and down arrows step through the current variant's states (wrapping around, kept across a
  variant switch), R replays the current variant's entrance, and keys are ignored while a field has
  focus or a modifier is held. The up and down arrows still scroll the page when the variant has
  fewer than two states. The switcher keeps what it shows in memory only, so the page works from
  file:// under the mockup's CSP (inline style and script, nothing remote). It reads the variant
  and state elements once, when it runs, so render them before it: in the markup or a plain
  inline script above it, never a module script or a DOMContentLoaded listener. Add
  data-position="top" to the nav when a variant occupies the bottom center.
  Switching and replay remount a variant from a copy of its markup, so listeners attached to
  elements inside it are lost: wire variant interactions with listeners delegated from document.
  Chrome, not a contestant: leave its look alone.
-->
<nav class="vs" aria-label="Variants" data-position="bottom">
  <span class="vs-highlight" aria-hidden="true"></span>
  <button type="button" class="vs-item vs-step" data-step="-1" aria-label="Previous variant">&larr;</button>
  <span class="vs-items"></span>
  <button type="button" class="vs-item vs-step" data-step="1" aria-label="Next variant">&rarr;</button>
  <span class="vs-divider vs-state-part" aria-hidden="true"></span>
  <button type="button" class="vs-item vs-state vs-state-part"></button>
  <span class="vs-divider" aria-hidden="true"></span>
  <button type="button" class="vs-item vs-replay" aria-label="Replay the variant (R)">&#8635;</button>
</nav>
<style>
  .vs {
    position: fixed;
    inset-block-end: 24px;
    inset-inline-start: 50%;
    transform: translateX(-50%);
    z-index: 2147483647;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: rgb(10 10 10 / 0.86);
    box-shadow: 0 0 0 1px rgb(255 255 255 / 0.08) inset, 0 8px 24px rgb(0 0 0 / 0.24);
    font: 13px/1 system-ui, sans-serif;
    direction: ltr;
    user-select: none;
    -webkit-user-select: none;
  }
  .vs[hidden] { display: none; }
  .vs[data-position="top"] { inset-block-end: auto; inset-block-start: 24px; }
  .vs-items { display: contents; }
  .vs-highlight {
    position: absolute;
    inset-block-start: 4px;
    inset-inline-start: 0;
    inline-size: 100px;
    block-size: 28px;
    border-radius: 999px;
    background: rgb(255 255 255 / 0.14);
    transform-origin: left center;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: no-preference) {
    .vs[data-ready] .vs-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1); }
  }
  .vs-item {
    position: relative;
    display: flex;
    align-items: center;
    block-size: 28px;
    padding: 0 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: rgb(255 255 255 / 0.6);
    font: inherit;
    cursor: pointer;
    transition: color 150ms ease-out;
  }
  @media (hover: hover) and (pointer: fine) {
    .vs-item:hover { color: rgb(255 255 255 / 0.9); }
  }
  .vs-item:focus-visible { outline: 2px solid rgb(255 255 255 / 0.5); outline-offset: 2px; }
  .vs-item[aria-current="true"] { color: #fff; }
  .vs-divider { inline-size: 1px; block-size: 16px; margin: 0 4px; background: rgb(255 255 255 / 0.14); }
  .vs-state { color: #fff; }
  .vs-state-part[hidden] { display: none; }
  [data-variant][hidden], [data-screen-state][hidden] { display: none !important; }
</style>
<script>
  (() => {
    const nav = document.querySelector(".vs");
    const list = nav.querySelector(".vs-items");
    const highlight = nav.querySelector(".vs-highlight");
    const stateButton = nav.querySelector(".vs-state");
    const stateParts = nav.querySelectorAll(".vs-state-part");
    const variants = [...document.querySelectorAll("[data-variant]")];
    if (variants.length === 0) { nav.hidden = true; return; }
    let current = 0;
    let stateKey = null;

    const items = variants.map((v, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "vs-item";
      b.textContent = `${v.dataset.variant} ${v.dataset.variantLabel || ""}`.trim();
      b.addEventListener("click", () => show(i));
      list.append(b);
      return b;
    });

    function place() {
      const el = items[current];
      highlight.style.transform = `translateX(${el.offsetLeft}px) scaleX(${el.offsetWidth / 100})`;
    }

    // Replacing the element with a fresh copy restarts its entrance animations.
    function remount(i) {
      const fresh = variants[i].cloneNode(true);
      variants[i].replaceWith(fresh);
      variants[i] = fresh;
    }

    // Queried on each use, since remounting replaces the state elements.
    const states = () => [...variants[current].querySelectorAll("[data-screen-state]")];

    // Falls back to the first state for display only, so the pick survives a variant without it.
    function applyState() {
      const all = states();
      stateParts.forEach((p) => { p.hidden = all.length === 0; });
      if (all.length === 0) return;
      const shown = all.find((s) => s.dataset.screenState === stateKey) || all[0];
      all.forEach((s) => { s.hidden = s !== shown; });
      const text = `state · ${shown.dataset.screenStateLabel || shown.dataset.screenState}`;
      stateButton.textContent = text;
      stateButton.setAttribute("aria-label", `${text}, next state (down arrow)`);
    }

    function stepState(step) {
      const all = states();
      if (all.length < 2) return false;
      const i = Math.max(0, all.findIndex((s) => s.dataset.screenState === stateKey));
      stateKey = all[(i + step + all.length) % all.length].dataset.screenState;
      applyState();
      return true;
    }

    function replay() {
      remount(current);
      applyState();
    }

    function show(i) {
      current = (i + variants.length) % variants.length;
      variants.forEach((v, j) => { v.hidden = j !== current; });
      items.forEach((b, j) => {
        if (j === current) b.setAttribute("aria-current", "true");
        else b.removeAttribute("aria-current");
      });
      replay();
      place();
    }

    nav.querySelectorAll(".vs-step").forEach((b) => b.addEventListener("click", () => show(current + Number(b.dataset.step))));
    stateButton.addEventListener("click", () => stepState(1));
    nav.querySelector(".vs-replay").addEventListener("click", replay);
    window.addEventListener("resize", place);

    document.addEventListener("keydown", (e) => {
      const t = e.target;
      if (t instanceof HTMLElement && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const n = Number.parseInt(e.key, 10);
      if (n >= 1 && n <= variants.length) show(n - 1);
      else if (e.key === "ArrowRight") show(current + 1);
      else if (e.key === "ArrowLeft") show(current - 1);
      else if (e.key === "ArrowDown") { if (!stepState(1)) return; }
      else if (e.key === "ArrowUp") { if (!stepState(-1)) return; }
      else if (e.key === "r" || e.key === "R") replay();
      else return;
      e.preventDefault();
    });

    show(0);
    // The highlight slides only after first paint, so the load does not animate.
    requestAnimationFrame(() => requestAnimationFrame(() => nav.setAttribute("data-ready", "")));
  })();
</script>
