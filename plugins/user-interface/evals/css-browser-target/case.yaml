schema_version: "1.1"
name: css-browser-target
description: "Hard (anchor positioning and display transitions are newer than the target): the browserslist target decides, with @supports or a stated skip"
tags: [write-css, hard]
runs: 3
expected_outcome: "The answer reads .browserslistrc, sees that anchor positioning and transitions from display: none (and popover) are newer than the target, and either wraps them in @supports with a working fallback or skips them with the reason stated"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Write the CSS for a tooltip that sits just below its trigger button and fades in from display: none when it opens. The markup is <button popovertarget=\"tip\">Help</button><div id=\"tip\" popover>...</div>. This run cannot write files, so put the CSS in your reply."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 600
