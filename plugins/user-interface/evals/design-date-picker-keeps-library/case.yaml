schema_version: "1.1"
name: design-date-picker-keeps-library
description: "The scaffold's package.json makes the headless library Radix; with nothing routed for the concern, design answers from component-libraries.md and keeps the installed library."
tags: [design, components, scaffold]
runs: 3
expected_outcome: "The answer prefers the installed Radix primitives for the date picker, or explains why they cannot cover one and picks a fit beside them, and does not propose replacing Radix"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "We need a date picker for the booking form. Our app already uses a headless component library for its dialogs and menus. What should we use?"
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 600
