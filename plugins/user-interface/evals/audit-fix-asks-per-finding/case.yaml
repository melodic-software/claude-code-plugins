schema_version: "1.1"
name: audit-fix-asks-per-finding
description: "Routine. Needs --scaffold --allow-tools Bash Edit Write: Edit and Write are granted so no-edit and no-write can fail. The scaffold commits src/drawer.css, then leaves an uncommitted change with several defects. With --fix, the audit reports, then shows one finding's exact diff and asks for a yes, applying nothing in this turn."
tags: [audit, diff, fix, scaffold]
runs: 3
expected_outcome: "user-interface:audit reports the findings in src/drawer.css, then shows one finding's exact diff and asks for a yes before applying it; no Edit, Write or shell edit is made in this turn"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Review the animations in my changes and fix what you find, with --fix."
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  max_turns: 40
  timeout_seconds: 900
