schema_version: "1.1"
name: wa-press-delegates-write-css
description: "Routine: write-animation decides the motion and hands the CSS to /user-interface:write-css with the Skill tool."
tags: [write-animation, delegation, scaffold]
runs: 3
expected_outcome: "write-animation invokes user-interface:write-css for the CSS, and the press scales each .button to between 0.95 and 0.98 within 160ms"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "This is a plain HTML and CSS site. Add a subtle press effect to every .button in styles/site.css. This run cannot write files, so put the CSS in your reply."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 600
