schema_version: "1.1"
name: css-review-mode
description: "Hard (review mode must report, not fix, and keep convention conflicts visible): findings with path:line, linter first, a Suppressed heading, no edits"
tags: [write-css, hard]
runs: 3
expected_outcome: "The review runs the bundled linter first, edits nothing, reports src/app.css findings with path:line (logical at 9, transition-all, ease-in and duration at 10, hover at 13, outline at 18), lists the color findings (lines 2, 3, 14) under a Suppressed heading citing docs/css-conventions.md, and points at the project's .stylelintrc.json"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Review src/app.css for CSS problems. Do not change any file."
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  max_turns: 40
  timeout_seconds: 600
