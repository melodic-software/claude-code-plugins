schema_version: "1.1"
name: wa-project-motion-tokens
description: "Routine: the project's motion tokens beat the plugin's defaults, with no parallel token set."
tags: [write-animation, precedence, scaffold]
runs: 3
expected_outcome: "The animation uses var(--motion-ease-enter) and var(--motion-fast), defines no parallel easing or duration tokens, enters from a scale between 0.9 and 0.98 with zero opacity, and sets the origin toward the trigger"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Animate the dropdown in src/components/dropdown.css so it scales out of its trigger when it opens. Our motion tokens are in src/styles/motion.css: --motion-ease-enter is cubic-bezier(0.2, 0, 0, 1) and --motion-fast is 140ms. This run cannot write files, so put the code in your reply."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 600
