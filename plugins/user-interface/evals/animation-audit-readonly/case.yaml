schema_version: "1.1"
name: animation-audit-readonly
description: "Hard (Edit and Write are allowed and the defects are obvious): a bare audit run reports and edits nothing"
tags: [audit-animation, read-only, hard]
runs: 3
expected_outcome: "audit-animation reports the defects in src/notifications.css and makes no Edit or Write call; it may offer --fix"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Audit the animations in src/notifications.css."
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
  max_turns: 30
  timeout_seconds: 600
