schema_version: "1.1"
name: audit-performance-cause-first
description: "Hard: adding a layer-promotion hint looks like a fix and is the common reflex; the case needs the cause named first. The sidebar opens by transitioning width and left."
tags: [audit, performance, read-only, hard, scaffold]
runs: 3
expected_outcome: "user-interface:audit runs the performance sub-mode: it names the width and left transition as the cause before any change, proposes transform instead of only a layer hint, labels the finding verified from code or needs a device recording, and makes no Edit or Write call"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The sidebar animation stutters when I open it. Find out why."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 40
  timeout_seconds: 900
