schema_version: "1.1"
name: fill-gap-offer
description: "Hard (the model tends to hard-code another palette): with no design system, the skill offers to create one in the project's format and waits for a yes"
tags: [project-first, hard]
runs: 3
expected_outcome: "The answer notes the project has no tokens or design-system file (colors are hard-coded per component), designs the alert banners from the values already in use, and offers to create a token file or short design note, creating it only after the user agrees"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Design consistent alert banners (info, warning, error) for this app, with exact styling values. This run cannot write files, so put the design in your reply."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 600
