schema_version: "1.1"
name: css-token-fallback-ask
description: "Hard (the model tends to invent a plausible amber token): with no matching token and token_fallback at its default, the skill asks instead of inventing"
tags: [write-css, hard]
runs: 3
expected_outcome: "The answer finds no warning or amber token in src/styles/tokens.css, does not invent one or hard-code an amber value as the delivered CSS, and asks the user how to proceed (add a token with a proposed value, or reuse an existing one)"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Add a .alert--warning variant next to the existing .alert--danger in src/styles/alert.css, with an amber background. This run cannot write files, so put the CSS in your reply."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 600
