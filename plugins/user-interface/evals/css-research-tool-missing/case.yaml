schema_version: "1.1"
name: css-research-tool-missing
description: "Hard (an unfamiliar styling library invites confident guessing): with no research tool, the answer marks which checklist answers it could not verify"
tags: [write-css, hard]
runs: 3
expected_outcome: "The answer identifies @quillkit/styled-core as the styling mechanism, says it could not research the library in this run, writes styles following the patterns already in the repo, and lists which questions it could not verify (how classes are scoped, whether it supports media queries and @layer, how tokens are referenced) instead of asserting them"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Add styles for a dismissible banner in src/Banner.tsx using this project's styling setup. This run cannot write files, so put the CSS in your reply."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 600
