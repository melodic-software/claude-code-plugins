schema_version: "1.1"
name: wa-native-sheet-gesture
description: "Hard: web CSS habits pull toward a stylesheet answer; the case needs the native stack recognized and a vendor skill or its docs preferred over recalled web syntax."
tags: [write-animation, gesture, stack-neutral, hard, scaffold]
runs: 3
expected_outcome: "write-animation names the Expo React Native stack from the files, looks for a vendor skill and then current docs before writing, dismisses on a fast release or past a distance with the release velocity handed to a spring, and writes no web CSS"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "In our Expo React Native app, add a drag-to-dismiss gesture to the bottom sheet in app/components/Sheet.tsx. This run cannot write files, so put the code in your reply."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 900
