schema_version: "1.1"
name: css-no-tokens
description: "Routine (guards the no-token path): with no token sources, the skill uses its own defaults and names each one"
tags: [write-css, routine]
runs: 3
expected_outcome: "The answer notes the project has no tokens or design system, styles .plan-card with the skill's own defaults, and names each default it used (spacing, radius, border, colors, highlight) so the user can swap them"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Style a pricing card (.plan-card) for this page: padding, rounded corners, a border, and a highlighted 'popular' variant. This run cannot write files, so put the CSS in your reply."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 600
