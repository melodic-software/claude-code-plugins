schema_version: "1.1"
name: css-scoped-styles
description: "Hard (scoped styles do not reach a child component's inner elements): the stack's scoping is discovered and the compiled selector is reasoned about"
tags: [write-css, hard]
runs: 3
expected_outcome: "The answer finds Vue single-file components with <style scoped>, puts the CSS in PriceTag.vue's scoped block, sees that a scoped rule cannot reach .info-link__icon inside InfoLink without :deep(), and checks or says how to check the compiled selector (the data-v attribute in the built CSS or in devtools)"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "In src/components/PriceTag.vue, add a 'Sale' badge style (.sale-badge) and make the info link's icon (.info-link__icon, rendered inside the InfoLink component) turn the accent color when the price tag is hovered. The styles belong in PriceTag.vue. This run cannot write files, so put the CSS in your reply."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 600
