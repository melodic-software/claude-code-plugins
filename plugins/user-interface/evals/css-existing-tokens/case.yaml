schema_version: "1.1"
name: css-existing-tokens
description: "Routine (guards project-first): with a token file present, the new component uses the project's tokens and invents no values"
tags: [write-css, routine]
runs: 3
expected_outcome: "The .notice CSS takes its padding, radius, colors, easing and duration from src/styles/tokens.css through var(--...) and adds no new literal colors, sizes or custom properties"
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Write the CSS for a new .notice component in this app: a padded box with rounded corners, a 4px accent stripe on its leading edge, body text color, and a short fade-in when it appears. This run cannot write files, so put the CSS in your reply."
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 600
