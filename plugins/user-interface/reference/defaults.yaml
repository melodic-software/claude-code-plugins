# Layer 1 of the user-interface config cascade: the plugin's own defaults.
# Later layers override a key (userConfig, ~/docs/conventions/user-interface.yaml,
# <home>/user-interface.yaml, <home>/user-interface.local.yaml); `*.disable` lists add up.
# Keys and allowed values: team.schema.json. Block style only.
version: 1
css:
  browser_target: "baseline widely available"
  techniques:
    disable: []
  rules:
    disable: []
  important: avoid
  layer: null
  token_fallback: ask
  # The widest gap in px (parent border plus padding) at which a nested radius is still derived from its parent's.
  concentric_radius:
    max_gap_px: 24
# Animation taste defaults: each curve is four cubic Bezier control points [x1, y1, x2, y2];
# durations are the upper end of each role's range in milliseconds, and exit_factor is the longest
# an exit may run as a fraction of its entrance; the stagger values are milliseconds between items
# and for the whole group; blur_max_px is a heuristic ceiling, not a measured limit; the gesture
# threshold is px/ms for a small element's swipe to dismiss. Project tokens beat every layer.
animation:
  easing:
    out:
      - 0.23
      - 1
      - 0.32
      - 1
    in:
      - 0.3
      - 0
      - 1
      - 1
    in_out:
      - 0.77
      - 0
      - 0.175
      - 1
    drawer:
      - 0.32
      - 0.72
      - 0
      - 1
  easing_library:
    out:
      quad:
        - 0.25
        - 0.46
        - 0.45
        - 0.94
      cubic:
        - 0.215
        - 0.61
        - 0.355
        - 1
      quart:
        - 0.165
        - 0.84
        - 0.44
        - 1
      quint:
        - 0.23
        - 1
        - 0.32
        - 1
      expo:
        - 0.19
        - 1
        - 0.22
        - 1
      circ:
        - 0.075
        - 0.82
        - 0.165
        - 1
    in_out:
      quad:
        - 0.455
        - 0.03
        - 0.515
        - 0.955
      cubic:
        - 0.645
        - 0.045
        - 0.355
        - 1
      quart:
        - 0.77
        - 0
        - 0.175
        - 1
      quint:
        - 0.86
        - 0
        - 0.07
        - 1
      expo:
        - 1
        - 0
        - 0
        - 1
      circ:
        - 0.785
        - 0.135
        - 0.15
        - 0.86
  duration_ms:
    press: 160
    small: 200
    medium: 250
    large: 300
    page: 400
    exit_factor: 0.8
  stagger_ms:
    interval: 40
    max_total: 400
  blur_max_px: 20
  gesture:
    velocity_threshold: 0.11
# The primitives library a React project with none installed builds on: a setting value from the
# primitives table in component-libraries.md, not a package name (install by the name its Install
# page gives). The project's installed library and design system beat every layer.
components:
  primitives_default: base-ui
