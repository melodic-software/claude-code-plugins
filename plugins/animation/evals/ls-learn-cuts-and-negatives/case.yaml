schema_version: "1.1"
name: ls-learn-cuts-and-negatives
context:
  scaffold_script: scaffold.sh
graders:
  - name: ran-learn-cuts-negative
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=\S*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*(?:\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?)?)?\\?["'']?(?:[^\s"''\\]*/)?learn\.py\\?["'']?(?![\w.-])\s+(?=(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?--cuts[\s=]+\\?["'']?0(?:\.0)?,4\.2,9\.8\b)(?=(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?--negative\s+\\?["'']?(?:[^\s"''\\]*/)?out/calibration/)'
    min: 1
  - name: selftest-names-pack
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=\S*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*(?:\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?)?)?\\?["'']?(?:[^\s"''\\]*/)?controls\.py\\?["'']?(?![\w.-])\s+selftest\b(?!\s+\\?["'']?(?!-)[^\s"''\\])'
    min: 0
    max: 0
    arm: 'both'
  - name: no-other-pack-file
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?packs/ink-short/(?!style\.json"|STYLE\.md")'
    min: 0
    max: 0
    arm: 'both'
  - name: no-geometry-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?packs/ink-short/(?:[^"\\]|\\.)*"[\s\S]*\\"(?:paths|points|tones)\\"\s*:\s*\[\s*\['
    min: 0
    max: 0
    arm: 'both'
  - name: no-geometry-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?packs/ink-short/(?:[^"\\]|\\.)*"[\s\S]*\\"(?:paths|points|tones)\\"\s*:\s*\[\s*\['
    min: 0
    max: 0
    arm: 'both'
  - name: no-shell-copy
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?=(?:[^"\\]|\\.)*packs/ink-short)(?=(?:[^"\\]|\\.)*(?:\bd/(?:d\d{3}|\*|\$)|work/d\b|\bsrc/(?:d\d{3}|\*|\$)|work/src\b|\.mp4\b))(?:[^\"\\]|\\.)*?(?:\b(?:cp|rsync|ln|mv|install|tar|shutil\.copy\w*|copytree)\b|json\.dump\(|\.write_text\(|\.write_bytes\(|\.write\(|\bwriteFile(?:Sync)?\(|>>?\s*\\?["'']?\S*packs/ink-short/(?!style\.json\b|STYLE\.md\b)|\btee\s+(?:-\S+\s+)*\\?["'']?\S*packs/ink-short/(?!style\.json\b|STYLE\.md\b))'
    min: 0
    max: 0
    arm: 'both'
