schema_version: "1.1"
name: ro-clip-extract-via-pydeps
context:
  scaffold_script: scaffold.sh
graders:
  - name: rotoscope-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"/?(?:animation:)?rotoscope"'
    min: 1
  - name: ran-extract-via-pydeps
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=\S*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?=(?:(?!--\s)\S+\s+)*?--data-dir[\s=])(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?\\?["'']?(?:[^\s"''\\]*/)?extract\.py\\?["'']?(?![\w.-])\s+\\?["'']?(?:[^\s"''\\]*/)?roto/ink-short\b(?=(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?--video[\s=]+\\?["'']?(?:[^\s"''\\]*/)?clips/ink-short\.mp4\b)|(?=(?:[^"\\]|\\.)*?(?:(?<=\\n)|(?<=\\t)|(?<![\w\\]))([A-Za-z_]\w*)\s*\(\)\s*\{\s*(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?=(?:(?!--\s)\S+\s+)*?--data-dir[\s=])(?:(?!--\s)\S+\s+)*--\s+\\?["'']?\$[@*])(?:[^"\\]|\\.)*?(?:[;&|(`{}]|\\n|\$\(|\b(?:do|then|else)\s)\s*\1\s+(?!\(\s*\))(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?\\?["'']?(?:[^\s"''\\]*/)?extract\.py\\?["'']?(?![\w.-])\s+\\?["'']?(?:[^\s"''\\]*/)?roto/ink-short\b(?=(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?--video[\s=]+\\?["'']?(?:[^\s"''\\]*/)?clips/ink-short\.mp4\b))'
    min: 1
  - name: scripts-through-pydeps
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=\S*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*\\?["'']?(?:[^\s"''\\]*/)?(?:extract|measure|fit|review|regress)\.py\\?["'']?(?![\w.-])(?!\s+(?:--help|-h)\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: measure-fit-get-playwright-core
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=\S*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*(?:\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?)?)?\\?["'']?(?:[^\s"''\\]*/)?(?:measure|fit)\.py\\?["'']?(?![\w.-])(?!\s+(?:--help|-h)\b)(?!(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?--playwright-core\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: work-dir-outside-plugin
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=\S*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*(?:\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?)?)?\\?["'']?(?:[^\s"''\\]*/)?extract\.py\\?["'']?(?![\w.-])\s+\\?["'']?(?:\$\{?CLAUDE_PLUGIN_ROOT\}?|[^\s"''\\]*/plugins/animation(?:/|\\?["'']?\s))'
    min: 0
    max: 0
    arm: 'both'
  - name: no-bitmap-write
    type: tool_used
    tool: 'Write'
    input_match: '"content":"(?:[^"\\]|\\.)*?(?:data:image/|src/d\d{3}\.png)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-bitmap-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"new_string":"(?:[^"\\]|\\.)*?(?:data:image/|src/d\d{3}\.png)'
    min: 0
    max: 0
    arm: 'both'
