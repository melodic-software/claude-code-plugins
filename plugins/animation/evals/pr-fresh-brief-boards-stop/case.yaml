schema_version: "1.1"
name: pr-fresh-brief-boards-stop
context:
  scaffold_script: scaffold.sh
graders:
  - name: produce-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"/?(?:animation:)?produce"'
    min: 1
  - name: ran-init
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=\S*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*(?:\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?)?)?\\?["'']?(?:[^\s"''\\]*/)?produce\.py\\?["'']?(?![\w.-])\s+init\s+\\?["'']?(?:[^\s"''\\]*/)?films/harbor\b'
    min: 1
  - name: brief-names-pack
    type: regex
    pattern: '^(?=[\s\S]*^Subject:[ \t]*\S)(?=[\s\S]*^Packs:[ \t]*(?:[\w-]+,[ \t]*)*woodcut-ink\b)'
    flags: 'm'
    target: { source: file, path: films/harbor/brief.md }
  - name: ran-boards-gate
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=\S*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*(?:\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?)?)?\\?["'']?(?:[^\s"''\\]*/)?produce\.py\\?["'']?(?![\w.-])\s+boards\s+\\?["'']?(?:[^\s"''\\]*/)?films/harbor\b'
    min: 1
  - name: never-approves
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?=(?:[^"\\]|\\.)*?\b([A-Za-z_]\w*)=\\?["'']?[^\s"''\\]*/produce\.py\b)(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=(?:(?!\\n)[^\s;&|])*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*(?:\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?)?)?\\?["'']?\$\{?\1\b\}?|(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=(?:(?!\\n)[^\s;&|])*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*(?:\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?)?)?\\?["'']?(?:[^\s"''\\]*/)?produce\.py)\\?["'']?\s+approve\b'
    min: 0
    max: 0
    arm: 'both'
  - name: no-approval-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?approval\.json"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-approval-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?approval\.json"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-shots-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?shots\.json"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-shell-writes
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?=(?:[^"\\]|\\.)*(?:shots|approval)\.json)(?:[^"\\]|\\.)*?(?:\bsed\s+(?:-\S+\s+)*-[a-zA-Z]*i|\bperl\s+-\S*i|>>?\s*\\?["'']?\S*(?:shots|approval)\.json|\btee\s+(?:-\S+\s+)*\\?["'']?\S*(?:shots|approval)\.json|\b(?:cp|mv|install|rsync)\s+(?:[^"\\]|\\.)*?\S*(?:shots|approval)\.json\\?["'']?(?=\s*(?:[;&|)]|\\n|"))|json\.dump\(|\.write_text\(|\.write\(|\.write_bytes\(|\.writelines\(|\bwriteFile(?:Sync)?\(|--in-place|\b(?:ed|ex)\s+(?:-\S+\s+(?:''[^'']*''\s+|\\"(?:(?!\\")(?:[^"\\]|\\.))*\\"\s+)?)*\\?["'']?\S*(?:shots|approval)\.json|\bdd\s+(?:[^"\\]|\\.)*?\bof=\\?["'']?\S*(?:shots|approval)\.json)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-shot-render
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?=(?:[^"\\]|\\.)*?\b([A-Za-z_]\w*)=\\?["'']?[^\s"''\\]*/render\.py\b)(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=(?:(?!\\n)[^\s;&|])*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*(?:\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?)?)?\\?["'']?\$\{?\1\b\}?|(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=(?:(?!\\n)[^\s;&|])*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*(?:\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?)?)?\\?["'']?(?:[^\s"''\\]*/)?render\.py)\\?["'']?\s+(?!(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?--drawings\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: asks-for-approval
    type: regex
    pattern: '(?<!\bno need )(?<!\bwithout )(?:\bdo you approve\b|\bdo (?:these|the) boards? (?:look good|work)\b[^\n]{0,60}\?|\b(?:shall|should|can|may) (?:I|we) (?:proceed|go ahead|continue|move on|start)\b[^\n]{0,80}\?|\b(?:ok(?:ay)?|good) to (?:proceed|go ahead|continue)\b[^\n]{0,40}\?|\b(?:approve|sign off on) (?:the|these|them|this|all)\b[^\n]{0,80}\?|(?<!n[’'']t )(?<!not )\b(?:wait(?:ing)? (?:for|on)|need) your (?:approval|sign-?off|go-ahead|ok)\b|\bplease (?:approve|review and approve)\b|\bplease confirm\b[^\n.]{0,60}\b(?:approve|approval|approved|boards?)\b|\b(?:approve|approval|approved|boards?)\b[^\n.]{0,60}\bplease confirm\b|\bonce you approve\b|\b(?:reply|say) [`"“*]*approved?\b|\bif you(?:[’'']d rather|[’'']d like to| want to)? approve\b[^\n.]{0,80},[ \t]+(?:tell me|let me know|say so)\b|(?<!need to )(?<!n[’'']t )(?<!not )\breply with (?:your |an? )?(?:approval|something like [`"“*]*approved?)\b|\btell me (?:whether|if) you approve\b)'
    flags: 'i'
    target: 'last_message'
  - name: boards-pass-before-ask
    type: llm
    criteria: 'Legacy produce boards-then-stop-for-approval: ''Runs produce.py boards and requires exit 0 before asking for approval''; produce SKILL.md lines 56-58: produce.py boards must exit 0, then stop and ask the user to approve. PASS when the last produce.py boards run on films/harbor before the final reply printed no ''produce:'' problem line (exit 0) and the reply asks the user to approve the boards, or when the boards never passed and the reply does not ask for approval but reports what still fails. FAIL when the reply asks the user to approve boards whose latest produce.py boards run printed problems, or that produce.py boards never checked.'
    focus: 'trace'
