schema_version: "1.1"
name: ro-near-miss-vlog-edit
graders:
  - name: no-rotoscope-skill
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"/?(?:animation:)?rotoscope"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-extract-run
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=\S*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*(?:\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?)?)?\\?["'']?(?:[^\s"''\\]*/)?extract\.py\\?["'']?(?![\w.-])'
    min: 0
    max: 0
    arm: 'both'
  - name: no-vector-trace
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?(?:/d/d\d{3}\.json|\.svg)"'
    min: 0
    max: 0
    arm: 'both'
