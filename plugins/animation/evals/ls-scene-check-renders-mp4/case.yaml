schema_version: "1.1"
name: ls-scene-check-renders-mp4
context:
  scaffold_script: scaffold.sh
graders:
  - name: learn-style-fired
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"/?(?:animation:)?learn-style"'
    min: 1
  - name: ran-render-encode
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=\S*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*(?:\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?)?)?\\?["'']?(?:[^\s"''\\]*/)?render\.py\\?["'']?(?![\w.-])\s+(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?harbor\.js\b(?=(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?--encode[\s=]+mp4\b)'
    min: 1
  - name: render-at-base-fps
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=\S*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*(?:\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?)?)?\\?["'']?(?:[^\s"''\\]*/)?render\.py\\?["'']?(?![\w.-])\s+(?=(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?--fps[\s=]+(?!24(?:\.0+)?\b)\d)'
    min: 0
    max: 0
    arm: 'both'
  - name: inkstats-has-pack
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=\S*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*(?:\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?)?)?\\?["'']?(?:[^\s"''\\]*/)?inkstats\.py\\?["'']?(?![\w.-])(?!\s+(?:--help|-h)\b)\s+(?!(?:(?![;&|]|\\n)(?:[^"\\]|\\.))*?--pack\b)'
    min: 0
    max: 0
    arm: 'both'
  - name: no-pack-write
    type: tool_used
    tool: 'Write'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?packs/woodcut-ink/style\.json"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-pack-edit
    type: tool_used
    tool: 'Edit'
    input_match: '"file_path":"(?:[^"\\]|\\.)*?packs/woodcut-ink/style\.json"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-shell-pack-write
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?=(?:[^"\\]|\\.)*style\.json)(?:[^"\\]|\\.)*?(?:\bsed\s+(?:-\S+\s+)*-[a-zA-Z]*i|\bperl\s+-\S*i|>>?\s*\\?["'']?\S*style\.json|\btee\s+(?:-\S+\s+)*\\?["'']?\S*style\.json|\b(?:cp|mv|install|rsync)\s+(?:[^"\\]|\\.)*?\S*style\.json\\?["'']?(?=\s*(?:[;&|)]|\\n|"))|json\.dump\(|\.write_text\(|\.write\()'
    min: 0
    max: 0
    arm: 'both'
  - name: no-unread-match-claim
    type: regex
    pattern: '(?:^|[.!?]\s+|\n)[\s*>#-]*(?:yes\b|it (?:does |already )?match(?:es)?\b|(?:the |your |this )?(?:new )?scene (?:does |already )?match(?:es)?\b|(?:it|the scene) (?:passes|matches) the (?:woodcut(?:-ink)? )?(?:pack|check)\b)(?![^\n.]{0,40}\b(?:if|once|only|until|when|but)\b)'
    flags: 'i'
    match: 'not_contains'
    target: 'last_message'
