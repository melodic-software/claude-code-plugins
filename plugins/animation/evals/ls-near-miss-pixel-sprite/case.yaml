schema_version: "1.1"
name: ls-near-miss-pixel-sprite
graders:
  - name: no-learn-style-skill
    type: tool_used
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"/?(?:animation:)?learn-style"'
    min: 0
    max: 0
    arm: 'both'
  - name: no-learn-run
    type: tool_used
    tool: 'Bash'
    input_match: '"command":"(?:(?:[^"\\]|\\.)*?(?:[;&|(`{]|\\n|\$\(|\b(?:do|then|else)\s))?\s*(?:(?:\w+=\S*|(?:\S*/)?(?:env|nohup|time|exec|sudo|command)|timeout\s+\S+|(?:\S*/)?(?:bash|zsh|dash|sh)\s+(?:-\S+\s+)*-c)\s+\\?["'']?)*(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*(?:\\?["'']?\S*pydeps\.py\\?["'']?\s+run\s+(?:(?!--\s)\S+\s+)*--\s+(?:(?:\S*/)?python(?:3(?:\.\d+)?)?\s+(?:-\S+\s+)*)?)?)?\\?["'']?(?:[^\s"''\\]*/)?learn\.py\\?["'']?(?![\w.-])'
    min: 0
    max: 0
    arm: 'both'
  - name: treats-as-sprite
    type: regex
    pattern: '\b(?:rows?|columns?|frames? (?:per|in each|for each) (?:direction|row|animation)|Aseprite|Piskel|LibreSprite|Pyxel ?Edit|GraphicsGale|AnimatedSprite2D|SpriteFrames|AnimationPlayer|[hv]frames|Sprite2D|nearest[- ]neighbou?r|grid)\b'
    flags: 'i'
    target: 'last_message'
