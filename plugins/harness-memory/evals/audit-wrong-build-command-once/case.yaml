schema_version: "1.1"
name: audit-wrong-build-command-once
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'c9-flags-compile'
    type: 'regex'
    pattern: '\bC9\b[^\n]{0,150}?\bcompile\b|\bcompile\b[^\n]{0,150}?\bC9\b'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the report of a harness-memory audit of a repo whose CLAUDE.md says "we use pnpm and vitest" and to build with `pnpm run compile`, whose package.json defines only build, test and lint, and whose build and test commands are already recorded in auto memory. PASS only if it satisfies every point: (1) FAILs the `pnpm run compile` command because package.json does not define that script; (2) Does NOT report build/test commands as absent, because step 0 finds them on another loaded surface (auto memory) and routes location to C3; (3) Reports the wrong command once under C9 and does not double-report it under C7; (4) Identifies the bare "we use pnpm and vitest" prose as naming tools without invocations. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
