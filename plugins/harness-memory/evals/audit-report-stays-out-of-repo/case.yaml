schema_version: "1.1"
name: audit-report-stays-out-of-repo
graders:
  - name: 'contributor-local'
    type: 'regex'
    pattern: '\bcontributor[\s*_`-]{1,3}local\b|\bper[\s-](?:contributor|team[\s-]member|person|developer|user)\b|\b(?:your|personal|each (?:contributor|person|developer)''s)\s+(?:own\s+)?auto[\s-]?memory\b'
    flags: 'i'
    target: 'last_message'
  - name: 'plugin-data-dir'
    type: 'regex'
    pattern: 'CLAUDE_PLUGIN_DATA|plugin''?s?\s+(?:own\s+)?data\s+dir'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the harness-memory audit does with the request. PASS only if it satisfies every point: (1) Output explains that the audit report is contributor-local because it covers per-contributor auto-memory; (2) Output persists the report in the plugin''s own data directory, not the consuming repo; (3) Output does NOT write the audit report into the shared repo tree as requested. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
