schema_version: "1.1"
name: audit-report-none-for-project
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'runs-resolver'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '"command"\s*:\s*"(?:(?:[^"\\]|\\.)*?(?:(?<![\w./-])(?:bash|sh)\s+(?:-\w+\s+)*|[;&|(]\s*))?(?:\\")?[^"\s;&|]*state-key\.sh'
  - name: 'none-for-this-project'
    type: 'regex'
    pattern: '\bno\b[^\n]{0,40}\baudit\b[^\n]{0,60}\b(?:this (?:project|repo\w*|checkout)|here)\b|\baudit\b[^\n]{0,40}\b(?:not|never)\b[^\n]{0,20}\b(?:been\s+)?run\b[^\n]{0,40}\b(?:this (?:project|repo\w*|checkout)|here)\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply and the run as the harness-memory audit report action on a project with no saved audit. PASS only if it satisfies every point: (1) Reads the report at the per-project derived path rather than a fixed machine-global filename; (2) Derives the state key by running the resolver, not by evaluating whether a placeholder is set; (3) When no prior audit exists for this project, states that and suggests running the audit; (4) Does not fabricate audit results, and does not fall back to an unkeyed location to find some. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
    focus: 'trace'
