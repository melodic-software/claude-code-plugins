schema_version: "1.1"
name: audit-happy-path-severities
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'c1-severity'
    type: 'regex'
    pattern: '\bC1\b(?:(?!\b[A-Z]{1,3}\d+\b)[^\n]){0,80}?\b(?:PASS|FAIL|WARN)\b|\b(?:PASS|FAIL|WARN)\b(?:(?!\b(?:[A-Z]{1,3}\d+|PASS|FAIL|WARN)\b)[^\n]){0,80}?\bC1\b'
    target: 'last_message'
  - name: 'judgment-candidate'
    type: 'regex'
    pattern: 'judgment[\s*_`-]{1,6}candidate'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the report of a harness-memory audit of this repository. PASS only if it satisfies every point: (1) Output audits the instruction/memory files (CLAUDE.md or a root AGENTS.md read in its place, CLAUDE.local.md, .claude/rules/, auto-memory); (2) Output reports per-check results using PASS/FAIL/WARN severities from the codified checklist; (3) Judgment-tier findings are labeled as ''judgment candidate'' distinct from the deterministic-spine checks. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
