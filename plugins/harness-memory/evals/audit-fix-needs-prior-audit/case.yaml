schema_version: "1.1"
name: audit-fix-needs-prior-audit
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'audit-first'
    type: 'regex'
    pattern: '\bno\b[^\n.]{0,40}\baudit\b[^\n.]{0,40}\b(?:on record|exists?|found|run|yet|for this)\b|\b(?:requires?|needs?|run(?:s|ning)?|start(?:s|ing)? with)\b[^\n.]{0,20}\b(?:a\s+|an\s+|the\s+)?(?:prior|fresh|first|new)?\s*audit\b[^\n.]{0,30}\b(?:first|before)\b|\baudit\b[^\n.]{0,20}\bfirst\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the account of what the harness-memory audit fix action does with the request. PASS only if it satisfies every point: (1) Output does not silently edit CLAUDE.md without a prior audit; (2) Output requires/produces a prior audit before fixing; (3) Output asks for approval before applying any fixes. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
