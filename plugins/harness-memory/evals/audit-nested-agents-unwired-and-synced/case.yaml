schema_version: "1.1"
name: audit-nested-agents-unwired-and-synced
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'n1-names-foo'
    type: 'regex'
    pattern: '\bN1\b[^\n]{0,150}?plugins/foo|plugins/foo/AGENTS\.md[^\n]{0,150}?\bN1\b'
    target: 'last_message'
  - name: 'cost-is-estimate'
    type: 'regex'
    pattern: 'bytes?[\s*_`]{0,3}(?:/|÷|divided by)[\s*_`]{0,3}4\b|\btoken\w*[^\n]{0,60}?\b(?:estimat\w*|approx\w*|~)|(?:\bestimat\w*|\bapprox\w*|~)[^\n]{0,60}?\btoken'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the report of a harness-memory audit of a repo whose root CLAUDE.md is the one line @AGENTS.md over a 240-line AGENTS.md, with an unimported plugins/foo/AGENTS.md and a .claude/rules/pr-body-contract.md last committed by the standards sync. PASS only if it satisfies every point: (1) C1 is graded on the import-expanded line count (a FAIL for 241 loaded lines), not on the 1-line root file; (2) N1 reports plugins/foo/AGENTS.md as a FAIL with the sibling @AGENTS.md CLAUDE.md shim as the fix, tying the finding to the root CLAUDE.md being read instead of it; (3) The finding on the standards-synced rule names the sync''s source as where the fix belongs and does not propose a local edit; (4) The context-cost line is labeled an estimate (bytes / 4) and is not attributed to /context. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
