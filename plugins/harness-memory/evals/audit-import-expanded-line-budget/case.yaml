schema_version: "1.1"
name: audit-import-expanded-line-budget
description: "C1 counts a root file with its @ imports expanded. CLAUDE.md is 14 non-blank lines and imports docs/module-guide.md at 233, so the file that loads is 247 lines against the 200-line target: the reply reports 247 as over budget, attributes it to the import, and edits nothing. Source: the SKILL.md determinism contract and C1's how-to-check step 5, written for this format. Hard because the root file alone passes easily and the prompt says the split was done to keep it short, so a reader counting the file it was told about reports it healthy."
tags: [audit, harness-memory, hard]
expected_outcome: "The reply reports the C1 line budget as over its 200-line target at 247 loaded lines and names docs/module-guide.md as the import behind it; no Write, Edit or shell command changes CLAUDE.md or docs/module-guide.md."
context:
  scaffold_script: scaffold.sh
execution:
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  max_turns: 25
  timeout_seconds: 900
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:harness-memory:)?audit"'
    arm: with-only
  - name: c1-expanded-count
    type: regex
    pattern: '(?<!\d)247(?!\d)(?:(?!\b(?:under|within|below|pass(?:es|ed)?)\b)[^\n]){0,120}?(?:\bC1\b|\bFAIL|\bover\b|exceed|\b200\b|target|budget)|(?:\bC1\b|\bFAIL|\bover\b|exceed)(?:(?!\b(?:under|within|below|pass(?:es|ed)?)\b)[^\n]){0,120}?(?<!\d)247(?!\d)(?![^\n]{0,40}\b(?:under|within|below|pass(?:es|ed)?)\b)'
    flags: i
    target: last_message
    arm: both
  - name: names-import
    type: regex
    pattern: 'module-guide\.md[^\n]{0,100}?(?:(?<!\d)233(?!\d)|\bimport)|(?:(?<!\d)233(?!\d)|\bimport)[^\n]{0,100}?module-guide\.md'
    flags: i
    target: last_message
    arm: both
  - name: no-instruction-write
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*(?:CLAUDE\.md|module-guide\.md)"'
    min: 0
    max: 0
    arm: both
  - name: no-instruction-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*(?:CLAUDE\.md|module-guide\.md)"'
    min: 0
    max: 0
    arm: both
  - name: no-instruction-shell-change
    type: tool_used
    tool: Bash
    input_match: '\bsed\s+-i[^;&|]*(?:CLAUDE\.md|module-guide)|\b(?:rm|mv|truncate)\b[^;&|]*(?:CLAUDE\.md|module-guide)|>\s*(?:\\")?[\w./-]*(?:CLAUDE\.md|module-guide\.md)'
    min: 0
    max: 0
    arm: both
