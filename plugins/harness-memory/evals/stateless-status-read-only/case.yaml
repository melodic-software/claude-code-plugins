schema_version: "1.1"
name: stateless-status-read-only
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'reports-state'
    type: 'regex'
    pattern: '(?<!whether )(?<!if )\bauto[\s-]?memory[^\n.]{0,80}?(?<!not )(?<!n''t )(?<!be )(?<!or )(?<!based )(?<!depends )(?<!relies )\b(?:on|off|enabled|disabled|conflicting)\b(?! (?:the|this|whether|which|what|your|my)\b)|\b(?:enabled|disabled|conflicting)\b[^\n]{0,30}?\bauto[\s-]?memory\b'
    flags: 'i'
    target: 'last_message'
  - name: 'meets-expectations'
    type: 'llm'
    criteria: 'Read the reply as the harness-memory stateless status report. PASS only if it satisfies every point: (1) Output reports the effective auto-memory enabled/disabled state across settings scopes, reading autoMemoryEnabled and CLAUDE_CODE_DISABLE_AUTO_MEMORY; (2) Output reports the auto-memory directory location (default or autoMemoryDirectory override) and whether memory files (MEMORY.md, topic files) exist; (3) Output does not edit any settings file or delete any memory files. A point counts only when the reply states it or plainly acts on it; it need not use the same words. FAIL if any point is missing or contradicted.'
