schema_version: "1.1"
name: sc-clean-file-no-invention
context:
  scaffold_script: scaffold.sh
graders:
  - name: hunter-dispatched
    type: tool_used
    tool: Agent
    min: 1
  - name: states-no-verified-findings
    type: regex
    pattern: '^[ \t]*[*_#]*[ \t]*no verified findings\b|\b(?:zero|0|no) (?:verified|confirmed) (?:findings|bugs)\b|\bverified(?: findings)?[ \t]*:[ \t]*(?:0|zero|none)\b|\bnothing (?:was )?verified\b'
    flags: 'mi'
    target: last_message
  - name: no-verified-finding-presented
    type: regex
    pattern: '^[ \t]*#{1,6}[ \t]*Finding[ \t]*\d|\bEvidence\b(?:\*\*)?[ \t]*:[ \t]*(?:\*\*)?[ \t]*`?(?:reproduced|verified[- ]by[- ]reading)\b'
    flags: 'mi'
    match: not_contains
    target: last_message
  - name: no-write
    type: tool_used
    tool: Write
    input_match: '.'
    min: 0
    max: 0
    arm: both
  - name: no-edit
    type: tool_used
    tool: Edit
    input_match: '.'
    min: 0
    max: 0
    arm: both
