schema_version: "1.1"
name: wr-five-fields-late-fee
graders:
  - name: title-field
    type: regex
    pattern: '^[ \t]*(?:#{1,6}[ \t]*)?(?:\*\*)?(?:Bug(?: report)?|Title)(?:\*\*)?[ \t]*[:—–-]'
    flags: 'mi'
    target: last_message
  - name: steps-field
    type: regex
    pattern: '^[ \t]*(?:#{1,6}[ \t]*|\*\*)?(?:steps to reproduce|reproduction steps|steps to repro|repro steps)\b'
    flags: 'mi'
    target: last_message
  - name: expected-and-actual-fields
    type: regex
    pattern: '^(?=[\s\S]*^[ \t]*(?:#{1,6}[ \t]*|\|[ \t]*)?(?:\*\*)?expected\b)(?=[\s\S]*^[ \t]*(?:#{1,6}[ \t]*|\|[ \t]*)?(?:\*\*)?actual\b)|\|[ \t]*(?:\*\*)?expected\b[^\n]*\|[ \t]*(?:\*\*)?actual\b'
    flags: 'mi'
    target: last_message
  - name: severity-from-rubric
    type: regex
    pattern: '\bseverity\b(?:\*\*)?[ \t]*[:|]?[ \t]*(?:\*\*)?[ \t]*[`*]*(?:low|medium|high|critical)\b'
    flags: 'i'
    target: last_message
  - name: fix-location-names-file-and-function
    type: regex
    pattern: '\b(?:suggested fix location|fix location|where to fix)\b(?=[^\n]*(?:\n[^\n]*){0,2}?\bfees\.ts\b)(?=[^\n]*(?:\n[^\n]*){0,2}?\bapplyLateFee\b)'
    flags: 'i'
    target: last_message
  - name: title-not-past-tense
    type: regex
    pattern: '^[ \t]*(?:#{1,6}[ \t]*)?(?:\*\*)?(?:Bug(?: report)?|Title)(?:\*\*)?[ \t]*[:—–-][^\n]*\b(?:fixed|broke|(?:was|were)[ \t]+(?:\w+ed|\w+ing|broken|\w+en)|(?<!\bis )(?<!\bare )(?<!\bbe )(?<!\bget )(?<!\bgets )(?<!\bbeen )(?<!\bbeing )(?:charged|applied|added|returned|billed)[ \t]+(?:an?|the|\d|\$|customers?|users?|invoices?))\b'
    flags: 'mi'
    match: not_contains
    target: last_message
  - name: no-patch
    type: regex
    pattern: '```[ \t]*(?:diff|patch)\b|```[ \t]*(?:ts|tsx|typescript|js|jsx|javascript|mjs|cjs)\b[^\n]*\n(?:(?!```)[^\n]*\n)*?[^\n]*(?:\bfunction\b|\breturn\b|\bif[ \t]*\(|\{[ \t]*$)|^[ \t]*(?:[+-][ \t]*)?(?:export[ \t]+)?(?:(?:async[ \t]+)?function[ \t]+applyLateFee\b|(?:const|let|var)[ \t]+applyLateFee[ \t]*=)|^@@[ \t]|^[ \t]*[+-][ \t]*(?:(?:const|let|var)[ \t]+[\w$]+[ \t]*=|await[ \t]+[\w$.]+|return\b[^\n]*;|throw[ \t]+new\b|if[ \t]*\(|else\b|\})|^[ \t]*(?:if[ \t]*\(|else[ \t]*(?:if\b|\{)|return\b[^\n]*;[ \t]*$|await[ \t]+[\w$.]+[ \t]*\(|\}[ \t]*(?:else\b|$))|\b[Cc]hange line \d+\b|\b(?:[Cc]hange|[Ss]wap|[Ss]witch)[ \t]+(?:the[ \t]+)?`(?![/-]|gh )[^`\n]+`[ \t]+(?:to|for|with)[ \t]+`[^`\n]+`|\b[Rr]eplace[ \t]+(?:the[ \t]+)?`(?![/-]|gh )[^`\n]+`[ \t]+with[ \t]+`[^`\n]+`|\b[Uu]se[ \t]+(?:the[ \t]+)?`(?![/-]|gh )[^`\n]+`[ \t]+instead of[ \t]+`[^`\n]+`|`[^`\n]+`[ \t]+(?:should|must)[ \t]+(?:be|become|read)[ \t]+`[^`\n]+`'
    flags: 'm'
    match: not_contains
    target: last_message
