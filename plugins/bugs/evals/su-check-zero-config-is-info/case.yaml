schema_version: "1.1"
name: su-check-zero-config-is-info
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'default-lanes-named'
    type: 'regex'
    pattern: '\b(?:bundled|built-in|generic)\b[^\n]{0,40}\bdefault lanes?\b'
    flags: 'i'
    target: 'last_message'
  - name: 'missing-config-not-a-failure'
    type: 'llm'
    criteria: 'The final reply treats the absence of every bugs config layer (no docs/conventions/bugs.yaml, no personal override, no user-global file) as a working state, such as INFO or "nothing to fix", and does not mark that absence as a FAIL or an error. A FAIL raised for something else in the repository does not by itself fail this criterion.'
    focus: 'last_message'
  - name: 'file-default-destination'
    type: 'regex'
    pattern: 'CLAUDE_PLUGIN_DATA|bug-reports|plugin(?:''s)? (?:own )?(?:persistent )?data (?:dir|folder)'
    flags: 'i'
    target: 'last_message'
    arm: 'with-only'
  - name: 'no-file-written'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '(?<![0-9&>])>>?(?!&)\s*(?:\\")?(?:[^\s;|&"\\]*/)?bugs(?:\.local)?\.(?:ya?ml|md)|\b(?:tee|touch)\b(?:(?![;&|]|\\n)[^"])*?bugs(?:\.local)?\.(?:ya?ml|md)'
    min: 0
    max: 0
    arm: 'both'
