schema_version: "1.1"
name: su-check-untracked-team-file
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'ran-tracked-probe'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'ls-files(?:(?!\\n)[^"])*--error-unmatch(?:(?!\\n)[^"])*bugs\.yaml'
    min: 1
    arm: 'with-only'
  - name: 'flags-untracked'
    type: 'regex'
    pattern: '\buntracked\b|\bnot (?:yet )?(?:tracked|committed)\b|\bnever (?:been )?committed\b'
    flags: 'i'
    target: 'last_message'
  - name: 'says-commit-it'
    type: 'regex'
    pattern: '\b(?:commit|stage)\b[^\n]{0,60}\b(?:it|the (?:team )?file|bugs\.yaml)\b|\bgit add\b'
    flags: 'i'
    target: 'last_message'
  - name: 'reports-team-lane'
    type: 'regex'
    pattern: '\bentrypoints\b'
    target: 'last_message'
  - name: 'no-commit-run'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '\bgit(?:\s+-C\s+\S+)?\s+(?:add|commit|rm|mv|stash|reset|checkout)\b'
    min: 0
    max: 0
    arm: 'both'
