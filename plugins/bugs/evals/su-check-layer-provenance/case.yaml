schema_version: "1.1"
name: su-check-layer-provenance
context:
  scaffold_script: scaffold.sh
graders:
  - name: 'names-each-layer'
    type: 'regex'
    pattern: '^(?=[\s\S]*(?:user-global|~/\.claude/bugs\.md))(?=[\s\S]*docs/conventions/bugs\.yaml)(?=[\s\S]*(?:bugs\.local\.md|personal override))'
    flags: 'i'
    target: 'last_message'
  - name: 'ran-tracked-probe'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'ls-files(?:(?!\\n)[^"])*--error-unmatch(?:(?!\\n)[^"])*bugs\.yaml'
    min: 1
    arm: 'with-only'
  - name: 'ran-override-ignore-probe'
    type: 'tool_used'
    tool: 'Bash'
    input_match: 'check-ignore(?:(?!\\n)[^"])*bugs\.local\.md'
    min: 1
    arm: 'with-only'
  - name: 'names-opt-out'
    type: 'regex'
    pattern: '\bopt(?:s|ed|ing)?[- ]out\b'
    flags: 'i'
    target: 'last_message'
  - name: 'posture-from-work-items'
    type: 'regex'
    pattern: '\ballowed\b[^\n]{0,120}work-items\.yaml|work-items\.yaml[^\n]{0,120}\ballowed\b'
    flags: 'i'
    target: 'last_message'
  - name: 'no-file-written'
    type: 'tool_used'
    tool: 'Bash'
    input_match: '(?<![0-9&>])>>?(?!&)\s*(?:\\")?(?:[^\s;|&"\\]*/)?bugs(?:\.local)?\.(?:ya?ml|md)|\b(?:tee|touch)\b(?:(?![;&|]|\\n)[^"])*?bugs(?:\.local)?\.(?:ya?ml|md)'
    min: 0
    max: 0
    arm: 'both'
  - name: 'effective-lanes-opt-out'
    type: 'llm'
    criteria: 'The tracked team layer docs/conventions/bugs.yaml declares one lane, entrypoints; the gitignored personal override .claude/bugs.local.md declares lanes: []. Per the bugs config contract an explicit empty list is an opt-out that drops every inherited lane and the bundled defaults. PASS only if the reply says the effective lane set here is empty (scan has no lanes to use on this machine), names the personal override as the layer that decided it, and reports it as an opt-out rather than a broken or malformed layer. FAIL if it says scan uses the entrypoints lane or the bundled default lanes here, or calls the override malformed.'
    focus: 'last_message'
