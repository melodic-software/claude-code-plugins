schema_version: "1.1"
name: su-apply-writes-team-lanes
context:
  scaffold_script: scaffold.sh
graders:
  - name: check-before-write
    type: tool_order
    before:
      tool: Bash
      input_match: '"command":"(?:[^"\\]|\\.)*?(?:(?<=\\n)|(?<=\\t)|(?<![\w\\]))git\b'
    after:
      tool: Write
      input_match: 'docs/conventions/bugs\.yaml'
  - name: team-file-lanes
    type: regex
    target: { source: file, path: docs/conventions/bugs.yaml }
    pattern: '^lanes:(?=[\s\S]*^[ \t]*(?:-[ \t]+)?name:[ \t]*[''"]?[a-z][a-z0-9-]*)(?=[\s\S]*^[ \t]*(?:-[ \t]+)?globs:)(?=[\s\S]*\bsrc/(?:api|billing)/)'
    flags: 'm'
  - name: team-file-known-keys
    type: regex
    target: { source: file, path: docs/conventions/bugs.yaml }
    pattern: '^(?!lanes:|verification(?:_skills)?:)[A-Za-z_][\w-]*:|^[ \t]+(?:-[ \t]+)?(?!name:|globs:)[A-Za-z_][\w-]*:'
    flags: 'm'
    match: not_contains
  - name: no-posture-in-team-file
    type: regex
    target: { source: file, path: docs/conventions/bugs.yaml }
    pattern: 'filing_posture'
    match: not_contains
  - name: writes-only-team-file
    type: tool_used
    tool: Write
    input_match: '"file_path":"(?![^"]*docs/conventions/bugs\.yaml")'
    min: 0
    max: 0
    arm: both
  - name: edits-only-team-file
    type: tool_used
    tool: Edit
    input_match: '"file_path":"(?![^"]*docs/conventions/bugs\.yaml")'
    min: 0
    max: 0
    arm: both
  - name: verifies-after-write
    type: llm
    focus: trace
    criteria: "PASS only if, after the call that writes docs/conventions/bugs.yaml, the trace shows a later call that re-reads that file (a Read, cat or a YAML parse of it) and a later git check-ignore on docs/conventions/bugs.yaml, and the final reply reports what those showed. A check-ignore or read that ran only before the write does not count. FAIL if no such file was written, or nothing re-checks it after the write."
  - name: recommends-ignore-line
    type: regex
    pattern: '\.claude/\*\*/\*\.local\.\*'
    target: last_message
  - name: says-commit-it
    type: regex
    pattern: '\b(?:commit|stage)\b[^\n]{0,60}\b(?:it|the (?:team )?file|bugs\.yaml)\b|\bgit add\b'
    flags: 'i'
    target: last_message
