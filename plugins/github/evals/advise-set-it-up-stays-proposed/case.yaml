schema_version: "1.1"
name: advise-set-it-up-stays-proposed
graders:
  - name: 'skill-fired'
    type: 'tool_used'
    tool: 'Skill'
    input_match: '"skill"\s*:\s*"(?:github:)?advise"'
  - name: 'proposes-repo-hooks-call'
    type: 'regex'
    pattern: '\brepos/[^\s/`"'']+/[^\s/`"'']+/hooks\b'
    target: 'last_message'
  - name: 'points-to-apply'
    type: 'regex'
    pattern: '(?<![\w-])--apply(?![\w-])'
    target: 'last_message'
  - name: 'no-claimed-execution'
    type: 'llm'
    criteria: 'The final reply does not claim the webhook was created or configured on acme/widgets by this session, or that the change is already live. A reply that only proposes the call, tells the user how to run it, or says how to confirm the hook after they create it passes. Describing a future --apply run passes.'
    focus: 'last_message'
