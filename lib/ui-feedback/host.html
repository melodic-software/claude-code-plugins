<!doctype html>
<!--
  Host page for in-page notes on a non-final UI (docs/contracts/ui-feedback). notes_bridge.py serves
  it at / on the session bridge. It frames the model-written page from /api/page through srcdoc, with
  sandbox="allow-scripts" and never allow-same-origin, so the page runs with an opaque origin and
  reaches nothing but this window, by postMessage. This page alone holds the token and the network.
  It trusts a message only from the frame's own window, takes the first ready only, and stops
  listening when the frame loads a second document. A pick becomes a note only through
  note.schema.json: each anchor field the schema refuses is dropped, and page text (the helper's
  label) is never kept. Every string reaches the screen through textContent.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup notes</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.45 system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; height: 100vh; }
  #page { inline-size: 100%; block-size: 100%; border: 0; background: #fff; }
  aside { display: flex; flex-direction: column; gap: 10px; padding: 12px; overflow: auto; border-inline-start: 1px solid rgb(127 127 127 / 0.35); }
  h1, h2 { margin: 0; font-size: 1rem; }
  button { font: inherit; padding: 4px 10px; }
  button[aria-pressed="true"] { outline: 2px solid currentColor; }
  textarea { font: inherit; inline-size: 100%; box-sizing: border-box; min-block-size: 6em; }
  ol { margin: 0; padding-inline-start: 1.4em; display: grid; gap: 8px; }
  .where, .state { font-size: 0.9em; opacity: 0.75; }
  .reply { margin: 2px 0 0; padding-inline-start: 8px; border-inline-start: 3px solid rgb(13 148 136); }
  [hidden] { display: none !important; }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } }
</style>
</head>
<body>
<iframe id="page" sandbox="allow-scripts" title="The mockup"></iframe>
<aside aria-label="Notes">
  <h1>Notes to Claude</h1>
  <p id="status" role="status" aria-live="polite">Loading the mockup.</p>
  <p id="session" class="state"></p>
  <button type="button" id="pick" aria-pressed="false" disabled>Pick an element (P)</button>
  <div id="composer" hidden>
    <p id="picked" class="where"></p>
    <label for="text">Your note</label>
    <textarea id="text"></textarea>
    <p><button type="button" id="send">Send</button> <button type="button" id="cancel">Cancel</button></p>
  </div>
  <h2>Sent</h2>
  <ol id="notes"></ol>
</aside>
<script type="module">
  import { problems } from "/note-model.mjs";

  const $ = (id) => document.getElementById(id);
  const frame = $("page"), pickButton = $("pick"), composer = $("composer"), text = $("text");
  const say = (t) => { $("status").textContent = t; };
  let schema = null, token = null, ready = false, loads = 0, picking = false, draft = null;
  const sent = new Map(); // seq -> {where, text}, this page load's notes
  let last = { listening: "idle", notes: [] };

  const fits = (value, node) => value !== undefined && problems(value, schema, node).length === 0;
  const toFrame = (m) => { if (ready && loads < 2) frame.contentWindow.postMessage(m, "*"); };

  function setPick(on) {
    picking = !!on && ready && loads < 2;
    pickButton.setAttribute("aria-pressed", String(picking));
    toFrame({ type: "mode", on: picking });
    say(picking ? "Click an element in the mockup to pin a note to it. Esc cancels." : "");
  }

  /** The note a pick becomes: only the fields note.schema.json admits, never the helper's label. */
  function noteFrom(a) {
    if (!a || typeof a !== "object") return null;
    const p = schema.properties, A = p.anchor.properties, anchor = {};
    for (const k of Object.keys(A)) if (fits(a[k], A[k])) anchor[k] = a[k];
    if (!("testid" in anchor)) delete anchor.testidIndex;
    const note = { kind: "element", anchor };
    for (const k of ["variant", "state"]) if (fits({ key: a[k] }, p[k])) note[k] = { key: a[k] };
    if (fits(a.content, p.content)) note.content = a.content;
    return problems({ ...note, text: "x" }, schema).length ? null : note;
  }

  function where(n) {
    const a = n.anchor, parts = [];
    if (n.variant) parts.push(`variant ${n.variant.key}`);
    if (n.state) parts.push(`state ${n.state.key}`);
    parts.push(a.testid ? `${a.testid} #${a.testidIndex + 1}` : `<${a.tag}>${a.cssPath ? ` at ${a.cssPath}` : ""}`);
    return parts.join(" · ");
  }

  function openComposer(note) {
    draft = note;
    setPick(false);
    $("picked").textContent = `Picked: ${where(note)}`;
    composer.hidden = false;
    text.value = "";
    text.focus();
  }
  function closeComposer() { draft = null; composer.hidden = true; pickButton.focus(); }

  async function send() {
    if (!draft) return;
    const note = { ...draft, text: text.value.trim() };
    const found = problems(note, schema);
    if (found.length) return say(`Not sent: ${found[0]}.`);
    try {
      const r = await fetch("/api/note", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Notes-Token": token },
        body: JSON.stringify(note),
      });
      const body = await r.json();
      if (!r.ok) return say(`Not sent: ${body.error || r.status}.`);
      sent.set(body.seq, { where: where(note), text: note.text });
      closeComposer();
      say(`Note ${body.seq} sent.`);
      render();
    } catch {
      say("Not sent: the session's server is not answering. Keep this tab open and ask Claude to serve the mockup again.");
    }
  }

  function render() {
    const listening = { listening: "Claude is listening.", reading: "Claude is reading your notes." }[last.listening]
      || "No session is listening right now; your notes wait until Claude checks them.";
    $("session").textContent = listening;
    const byseq = new Map(last.notes.map((n) => [n.seq, n]));
    const seqs = [...new Set([...sent.keys(), ...byseq.keys()])].sort((a, b) => a - b);
    $("notes").replaceChildren(...seqs.map((seq) => {
      const li = document.createElement("li"), mine = sent.get(seq), st = byseq.get(seq) || {};
      const head = document.createElement("div");
      head.className = "where";
      head.textContent = mine ? `#${seq} · ${mine.where}` : `#${seq} (sent earlier)`;
      const body = document.createElement("div");
      body.textContent = mine ? mine.text : "";
      const state = document.createElement("div");
      state.className = "state";
      state.textContent = st.handled ? "handled" : st.delivered ? "delivered to Claude" : "sent";
      li.append(head, body, state);
      if (st.reply) {
        const reply = document.createElement("p");
        reply.className = "reply";
        reply.textContent = st.reply;
        li.append(reply);
      }
      return li;
    }));
  }

  addEventListener("message", (e) => {
    if (e.source !== frame.contentWindow || loads > 1) return; // the frame's first document only
    const m = e.data;
    if (!m || typeof m !== "object") return;
    if (m.type === "ready") {
      if (ready) return;
      ready = true;
      pickButton.disabled = false;
      say("Press Pick an element (or P), then click the part of the mockup your note is about.");
    } else if (m.type === "escape") setPick(false);
    else if (m.type === "pinned" && picking) {
      const note = noteFrom(m.anchor);
      if (note) openComposer(note);
      else say("That element cannot carry a note: its tag or path is outside the note contract. Pick its parent.");
    }
  });

  pickButton.addEventListener("click", () => setPick(!picking));
  $("send").addEventListener("click", send);
  $("cancel").addEventListener("click", closeComposer);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { if (draft) closeComposer(); else setPick(false); return; }
    if (e.target instanceof HTMLElement && (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if ((e.key === "p" || e.key === "P") && ready) { e.preventDefault(); setPick(!picking); }
  });

  try {
    const [s, t, page] = await Promise.all([
      fetch("/note.schema.json").then((r) => r.json()),
      fetch("/api/token").then((r) => r.json()),
      fetch("/api/page"),
    ]);
    if (!page.ok) throw new Error((await page.json()).error);
    schema = s;
    token = t.token;
    frame.addEventListener("load", () => {
      loads += 1;
      if (loads > 1) {
        ready = false;
        picking = false;
        pickButton.disabled = true;
        say("The mockup loaded another page in its frame, so this page stopped listening to it. Reload to start again.");
      }
    });
    frame.srcdoc = await page.text();
    const events = new EventSource("/events");
    events.addEventListener("state", (e) => { last = JSON.parse(e.data); render(); });
  } catch (err) {
    say(`No session is connected (${err.message || "the server is not answering"}). Use the mockup's own copy-out control instead.`);
  }
</script>
</body>
</html>
