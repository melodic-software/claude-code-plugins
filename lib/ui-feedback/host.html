<!doctype html>
<!--
  Host page for in-page notes on a non-final UI (docs/contracts/ui-feedback). notes_bridge.py serves
  it at / on the session bridge. It frames the model-written page from /api/page through srcdoc, with
  sandbox="allow-scripts" and never allow-same-origin, so the page runs with an opaque origin and
  reaches nothing but this window, by postMessage. This page alone holds the token and the network.
  It trusts a message only from the frame's own window, takes the first ready only, and stops
  listening when the frame loads a second document. A pick, a region, a move arrow or a text selection
  becomes a note only through note.schema.json: each anchor field, box, point, quote, data log and viewport the
  schema refuses is dropped, and the helper's label is never kept. The one page text a note keeps
  is a selection's quote (anchor.textQuote), cut to the schema's limits. Every string reaches the
  screen through textContent. When the server stops answering, the notes written here stay on this
  page and Copy all notes makes one prototype-notes block for the session to import. A draft stays
  on this page, out of that block, until it is sent; it is kept in this tab's sessionStorage under the
  run's token, never on the server, so a reload of the same run lists it again. The run's sent notes come
  back from /api/notes, the token in the request's header, each kept only as note.schema.json admits
  it. A region note, a draft or sent, can be moved or resized from the editor or its row; a sent one's
  new anchor, rect and elements go to /api/note/change, which tells the session that note changed. A sent
  note's Edit sends its new text to /api/note/edit and its Withdraw to /api/note/withdraw, each naming
  the note's seq; a withdrawn note is listed as withdrawn, with no marker and no actions, and left out
  of Copy all notes. Hovering a row draws its note's box in the frame, and clicking a row or its marker restores the
  note's view and keeps the box drawn; the frame gets keys, a path and a box, never note text. The Controls tab renders the framed page's
  controls manifest, kept only when controls.schema.json admits it, through the registry in
  controls.js, beside the content sets the page marks, and the Sample data menu lists the data
  controls it marks, each kept only as note.schema.json admits a data step or a content set; it sends
  the frame values and presses, never markup, and a note keeps only the control values the manifest names.
  The mockup frame always fills the window: the command bar and the notes popover sit over it. The
  frame reports its variants and screen states and, for each listed note, its element's visible text
  and card heading; both are shown as plain text, cut by frame-channel.mjs, and never kept in a note.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup notes</title>
<style>
  :root {
    color-scheme: light dark;
    --uif-surface: #ffffff;
    --uif-sunk: #f0f1f5;
    --uif-ink: #16171d;
    --uif-ink-2: #4f5363;
    --uif-line: #d9dbe3;
    --uif-line-strong: #7d8294;
    --uif-accent: #4433cc;
    --uif-on-accent: #ffffff;
    --uif-accent-soft: #eceafe;
    --uif-accent-text: #3a2bb8;
    --uif-draft: #8a5300;
    --uif-ok: #1c6b3a;
    --uif-shadow: 0 1px 2px rgb(20 20 40 / 0.08), 0 8px 28px rgb(20 20 40 / 0.14);
    --uif-r-s: 6px;
    --uif-r-m: 10px;
    --uif-r-l: 14px;
    --uif-ease-out: cubic-bezier(0.32, 0.72, 0, 1);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--uif-ink);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --uif-surface: #1c1d24;
      --uif-sunk: #272934;
      --uif-ink: #ecedf2;
      --uif-ink-2: #a9adbd;
      --uif-line: #343743;
      --uif-line-strong: #737889;
      --uif-accent: #a99bff;
      --uif-on-accent: #15122b;
      --uif-accent-soft: #2e2a55;
      --uif-accent-text: #bdb2ff;
      --uif-draft: #e9bc63;
      --uif-ok: #74d49e;
      --uif-shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 10px 32px rgb(0 0 0 / 0.5);
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; }
  [hidden] { display: none !important; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: max(2px, 0.08em) solid var(--uif-accent); outline-offset: 2px; }
  .sr-only { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  #page { position: fixed; inset: 0; inline-size: 100%; block-size: 100%; border: 0; background: #fff; }

  .surface { background: var(--uif-surface); color: var(--uif-ink); border: 1px solid var(--uif-line); border-radius: var(--uif-r-l); box-shadow: var(--uif-shadow); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; min-block-size: 32px; padding-block: 0; padding-inline: 10px;
    border: 1px solid transparent; border-radius: var(--uif-r-s); background: transparent; cursor: pointer; white-space: nowrap;
  }
  .btn:disabled { cursor: default; opacity: 0.55; }
  .btn.line { border-color: var(--uif-line-strong); }
  .btn.primary { background: var(--uif-accent); color: var(--uif-on-accent); border-color: var(--uif-accent); }
  .btn[aria-pressed="true"], .btn[aria-current="true"], .btn[aria-expanded="true"] { background: var(--uif-accent-soft); color: var(--uif-accent-text); border-color: var(--uif-accent); }
  @media (hover: hover) and (pointer: fine) {
    .btn:not(:disabled):hover { background: var(--uif-sunk); }
    .btn.primary:not(:disabled):hover { background: color-mix(in oklch, var(--uif-accent) 85%, var(--uif-ink)); }
    .btn[aria-pressed="true"]:hover, .btn[aria-current="true"]:hover, .btn[aria-expanded="true"]:hover { background: var(--uif-accent-soft); }
    .note:hover { border-color: var(--uif-line-strong); }
  }
  .btn svg { inline-size: 18px; block-size: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  kbd {
    font: 600 11px/1 system-ui, sans-serif; color: var(--uif-ink-2); border: 1px solid var(--uif-line-strong); border-radius: 4px;
    padding-block: 2px; padding-inline: 4px; min-inline-size: 18px; text-align: center;
  }
  .btn[aria-pressed="true"] kbd, .btn[aria-expanded="true"] kbd { color: var(--uif-accent-text); border-color: var(--uif-accent); }
  .sep { inline-size: 1px; align-self: stretch; margin-block: 4px; margin-inline: 2px; background: var(--uif-line); }

  .bar {
    position: fixed; inset-block-end: 16px; inset-inline-start: 50%; transform: translateX(-50%); z-index: 4;
    display: flex; align-items: center; gap: 2px; padding: 5px; max-inline-size: calc(100vw - 24px);
  }
  .wrap { position: relative; display: flex; }
  .vname { min-inline-size: 150px; justify-content: center; font-weight: 600; }
  .count { font-variant-numeric: tabular-nums; }
  #markers[aria-pressed="false"] .on, #markers[aria-pressed="true"] .off { display: none; }
  .menu {
    position: absolute; inset-block-end: calc(100% + 10px); inset-inline-start: 0; z-index: 3;
    min-inline-size: 230px; padding: 6px; display: grid; gap: 2px;
  }
  .menu .btn { justify-content: flex-start; inline-size: 100%; }
  .menu .hint { font-size: 12px; color: var(--uif-ink-2); padding-block: 2px 6px; padding-inline: 10px; margin: 0; max-inline-size: 260px; }
  .menu .group-title { font: 600 12px/1.4 system-ui, sans-serif; color: var(--uif-ink-2); margin-block: 4px 2px; margin-inline: 10px; }
  .menu .aside { margin-inline-start: auto; color: var(--uif-ink-2); }
  .hsep { block-size: 1px; margin-block: 4px; background: var(--uif-line); }

  #panel {
    position: fixed; z-index: 3; inset-block-end: var(--bar-top, 76px); inset-inline-end: var(--bar-end, 16px);
    inline-size: min(440px, calc(100vw - 24px)); max-block-size: min(70vh, 640px);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #panel[data-side="start"] { inset-inline-end: auto; inset-inline-start: var(--bar-start, 16px); }
  @media (prefers-reduced-motion: no-preference) {
    #panel, .menu { animation: uif-in 200ms var(--uif-ease-out); }
    @keyframes uif-in { from { opacity: 0; transform: translateY(8px); } }
  }
  #panel > header { padding-block: 12px 8px; padding-inline: 14px; display: grid; gap: 6px; }
  .top { display: flex; align-items: flex-start; gap: 8px; }
  .top .status { flex: 1; }
  .top .btn { min-block-size: 28px; padding-inline: 6px; }
  .status { margin: 0; color: var(--uif-ink-2); font-size: 13px; }
  .status b { color: var(--uif-ink); font-weight: 600; }
  [role="tablist"] { display: flex; gap: 4px; border-block-end: 1px solid var(--uif-line); }
  [role="tab"] {
    border: 0; border-block-end: 2px solid transparent; margin-block-end: -1px; background: none; padding-block: 10px; padding-inline: 8px;
    cursor: pointer; color: var(--uif-ink-2);
  }
  [role="tab"][aria-selected="true"] { color: var(--uif-ink); font-weight: 600; border-block-end-color: var(--uif-accent); }
  .filters { display: flex; gap: 4px; flex-wrap: wrap; }
  .filters .btn { min-block-size: 28px; font-size: 13px; }
  .body { overflow: auto; padding-block: 8px 14px; padding-inline: 14px; display: flex; flex-direction: column; gap: 8px; }

  .notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .note { border: 1px solid var(--uif-line); border-radius: var(--uif-r-m); padding-block: 8px; padding-inline: 10px; background: var(--uif-surface); cursor: pointer; }
  .note[aria-current="true"] { border-color: var(--uif-accent); box-shadow: 0 0 0 1px var(--uif-accent); }
  .note .head { display: flex; gap: 8px; align-items: baseline; }
  .num {
    flex: none; min-inline-size: 26px; block-size: 20px; padding-inline: 5px; border-radius: 10px 10px 10px 3px; text-align: center;
    background: var(--uif-accent); color: var(--uif-on-accent); font: 700 11px/20px system-ui, sans-serif; font-variant-numeric: tabular-nums;
  }
  .note.draft .num { background: none; color: var(--uif-accent-text); border: 1.5px dashed var(--uif-accent); line-height: 17px; }
  .note .name { font-weight: 600; }
  .note .text { margin-block: 4px 0; margin-inline: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .note[aria-current="true"] .text { display: block; }
  .st { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-block-start: 6px; font-size: 12px; color: var(--uif-ink-2); }
  .st .s-draft { color: var(--uif-draft); font-weight: 600; }
  .st .s-handled { color: var(--uif-ok); font-weight: 600; }
  .st .s-withdrawn { color: var(--uif-ink-2); font-weight: 600; }
  .note.withdrawn .text { color: var(--uif-ink-2); text-decoration: line-through; }
  .reply {
    margin-block: 8px 0; margin-inline: 0; padding-block: 6px; padding-inline: 10px; border-inline-start: 3px solid var(--uif-accent);
    background: var(--uif-sunk); border-radius: 0 var(--uif-r-s) var(--uif-r-s) 0; font-size: 13px; overflow-wrap: anywhere;
  }
  .reply::before { content: "Claude replied"; display: block; font-size: 12px; color: var(--uif-ink-2); font-weight: 600; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-block-start: 8px; }
  .acts .btn { min-block-size: 28px; padding-inline: 8px; font-size: 13px; }
  .note:not([aria-current="true"]) .acts { display: none; }
  .composer { border: 1.5px solid var(--uif-accent); border-radius: var(--uif-r-m); padding-block: 10px; padding-inline: 12px; }
  .composer label { font-weight: 600; display: block; }
  .composer .acts { margin-block-start: 8px; }
  .where, .state-line { font-size: 12px; color: var(--uif-ink-2); margin: 0; }
  .hint { font-size: 13px; color: var(--uif-ink-2); margin: 0; }
  textarea {
    inline-size: 100%; min-block-size: 70px; margin-block-start: 6px; padding-block: 6px; padding-inline: 8px;
    border: 1px solid var(--uif-line-strong); border-radius: var(--uif-r-s); background: var(--uif-surface); resize: vertical;
  }

  #controls-panel fieldset { margin: 0; padding: 0; border: 0; display: grid; gap: 10px; }
  #controls-panel legend { font-weight: 600; padding: 0; margin-block-end: 4px; }
  #controls-panel p { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .uifc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .uifc-row label { min-inline-size: 7em; }
  .uifc-row input[type="range"] { flex: 1; accent-color: var(--uif-accent); min-block-size: 24px; }
  .uifc-row input[type="checkbox"], .uifc-row input[type="radio"] { accent-color: var(--uif-accent); inline-size: 18px; block-size: 18px; margin: 0; }
  .uifc-row input[type="color"] { inline-size: 44px; block-size: 32px; border: 1px solid var(--uif-line-strong); border-radius: var(--uif-r-s); background: var(--uif-surface); padding: 2px; }
  .uifc-row select { min-block-size: 32px; border: 1px solid var(--uif-line-strong); border-radius: var(--uif-r-s); background: var(--uif-surface); }
  .uifc-row output { min-inline-size: 3.5em; font-variant-numeric: tabular-nums; color: var(--uif-ink-2); }
  .uifc-row [role="radiogroup"] label { display: inline-flex; align-items: center; gap: 6px; min-block-size: 28px; margin-inline-end: 14px; }
  #controls-panel .btn { min-block-size: 32px; }

  @media (max-width: 1180px) { .bar .lbl { display: none; } .vname { min-inline-size: 0; } }
  @media (max-width: 700px) {
    .bar { inset-inline: 8px; inset-block-end: 8px; transform: none; overflow-x: auto; max-inline-size: none; }
    #panel, #panel[data-side="start"], .menu { position: fixed; inset-inline: 8px; inset-block-end: 64px; inline-size: auto; }
  }
</style>
</head>
<body>
<iframe id="page" sandbox="allow-scripts" title="The mockup"></iframe>
<nav class="bar surface" id="bar" aria-label="Notes tools">
  <div class="wrap" id="view-wrap" hidden>
    <button type="button" class="btn" id="vprev" aria-label="Previous variant" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" class="btn vname" id="view" aria-expanded="false" aria-controls="view-menu"><span id="view-key"></span><span class="lbl" id="view-name"></span><span id="view-state"></span></button>
    <button type="button" class="btn" id="vnext" aria-label="Next variant" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="menu surface" id="view-menu" role="group" aria-label="View of the mockup" hidden></div>
  </div>
  <span class="sep" id="view-sep" hidden></span>
  <button type="button" class="btn" id="pick" aria-keyshortcuts="P" aria-label="Pick an element" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 7-6 2-2 6z"/></svg><span class="lbl">Pick</span><kbd aria-hidden="true">P</kbd></button>
  <button type="button" class="btn" id="region" aria-keyshortcuts="R" aria-label="Mark a region" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M10 4h4M10 20h4M4 10v4M20 10v4" stroke-dasharray="2 2"/></svg><span class="lbl">Region</span><kbd aria-hidden="true">R</kbd></button>
  <button type="button" class="btn" id="move" aria-keyshortcuts="A" aria-label="Draw a move arrow" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18C8 8 14 6 20 6"/><path d="M15 3l5 3-3 5"/></svg><span class="lbl">Arrow</span><kbd aria-hidden="true">A</kbd></button>
  <button type="button" class="btn" id="quote" aria-keyshortcuts="T" aria-label="Note on selected text" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M12 6v13M9 19h6"/></svg><span class="lbl">Text</span><kbd aria-hidden="true">T</kbd></button>
  <button type="button" class="btn" id="markers" aria-keyshortcuts="M" aria-label="Markers" aria-pressed="true"><svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-6-6-11a6 6 0 0112 0c0 5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg><svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-6-6-11a6 6 0 0112 0c0 5-6 11-6 11z"/><path d="M3 3l18 18"/></svg><span class="lbl" id="markers-label">Markers</span><kbd aria-hidden="true">M</kbd></button>
  <span class="sep"></span>
  <div class="wrap" id="data-wrap" hidden>
    <button type="button" class="btn" id="data" aria-label="Sample data" aria-expanded="false" aria-controls="data-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg><span class="lbl">Sample data</span></button>
    <div class="menu surface" id="data-menu" role="group" aria-label="Sample data" hidden>
      <p class="hint">Changes the mockup's sample data, not its design.</p>
      <div id="data-list"></div>
    </div>
  </div>
  <div class="wrap">
    <button type="button" class="btn" id="copy-button" aria-label="Copy" aria-expanded="false" aria-controls="copy-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg><span class="lbl">Copy</span></button>
    <div class="menu surface" id="copy-menu" role="group" aria-label="Copy out" hidden>
      <button type="button" class="btn" id="copy">Copy all notes <span class="aside" id="copy-count"></span></button>
      <button type="button" class="btn" id="copy-values" disabled>Copy control values</button>
      <p class="hint">Paste what you copy to Claude in the terminal.</p>
    </div>
  </div>
  <span class="sep"></span>
  <button type="button" class="btn" id="dock" aria-keyshortcuts="N" aria-label="Notes" aria-expanded="true" aria-controls="panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg><span class="lbl">Notes</span> <b class="count" id="count">0</b><kbd aria-hidden="true">N</kbd></button>
  <p class="sr-only" id="said" aria-live="polite"></p>
</nav>
<section class="surface" id="panel" aria-label="Notes to Claude">
  <header>
    <div class="top">
      <p class="status"><b id="session"></b> <span id="drafts"></span> <span id="status" role="status" aria-live="polite">Loading the mockup.</span></p>
      <button type="button" class="btn" id="side"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4"/></svg></button>
    </div>
    <div role="tablist" aria-label="Notes and controls">
      <button type="button" role="tab" id="tab-notes" aria-controls="notes-panel" aria-selected="true">Notes</button>
      <button type="button" role="tab" id="tab-controls" aria-controls="controls-panel" aria-selected="false" tabindex="-1">Controls</button>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Show">
      <button type="button" class="btn" data-filter="all" aria-pressed="true">All <span class="count"></span></button>
      <button type="button" class="btn" data-filter="draft" aria-pressed="false">Drafts <span class="count"></span></button>
      <button type="button" class="btn" data-filter="sent" aria-pressed="false">Sent <span class="count"></span></button>
    </div>
  </header>
  <div class="body" role="tabpanel" id="notes-panel" aria-labelledby="tab-notes">
    <h2 class="sr-only" id="notes-title" tabindex="-1">Notes</h2>
    <div class="composer" id="composer" hidden>
      <label for="text" id="composer-label">New note</label>
      <p class="where" id="picked"></p>
      <textarea id="text"></textarea>
      <div class="acts"><button type="button" class="btn primary" id="send">Send</button><button type="button" class="btn line" id="save">Save draft</button><button type="button" class="btn line" id="reshape" hidden>Move or resize</button><button type="button" class="btn" id="cancel">Cancel</button></div>
    </div>
    <p class="state-line" id="changes" aria-live="polite"></p>
    <p class="hint" id="empty" hidden>No notes yet.</p>
    <ol class="notes" id="notes" aria-labelledby="notes-title"></ol>
    <div><button type="button" class="btn line" id="sendall" hidden>Send all drafts</button></div>
    <div id="copyout" hidden>
      <label for="block">Paste this block to Claude</label>
      <textarea id="block" readonly></textarea>
    </div>
  </div>
  <div class="body" role="tabpanel" id="controls-panel" aria-labelledby="tab-controls" hidden>
    <p class="hint" id="controls-status">The mockup has not loaded yet.</p>
    <fieldset id="controls-fields"><div id="controls-list"></div></fieldset>
    <p><button type="button" class="btn line" id="copy-config" disabled>Copy config</button><button type="button" class="btn" id="reset-controls" disabled>Reset controls</button></p>
    <p class="hint" id="controls-said" role="status" aria-live="polite"></p>
    <div id="config-out" hidden>
      <label for="config">The current config</label>
      <textarea id="config" readonly></textarea>
    </div>
  </div>
</section>
<script src="/controls.js"></script>
<script type="module" src="/host.mjs"></script>
</body>
</html>
