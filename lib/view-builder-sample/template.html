<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finding Triage Sample</title>
<style>
/* Layout: one reading column; a filter bar; findings as rows with a pick box on the left. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --fg: #1b2330;
  --muted: #566173;
  --line: #d6dce4;
  --accent: #2b59c3;
  --chip: #e6ecf8;
  --sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #12161d;
    --surface: #1a2029;
    --fg: #e4e9f0;
    --muted: #9aa5b5;
    --line: #2c3542;
    --accent: #86a8f0;
    --chip: #233150;
    color-scheme: dark;
  }
}
:root[data-theme=dark] {
  --bg: #12161d;
  --surface: #1a2029;
  --fg: #e4e9f0;
  --muted: #9aa5b5;
  --line: #2c3542;
  --accent: #86a8f0;
  --chip: #233150;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); }
.page { max-width: 46rem; margin: 0 auto; padding: 0 16px; padding-block: 2rem 3rem; display: grid; gap: 1.5rem; }
.eyebrow { margin: 0; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0.25rem 0 0.5rem; font-size: 1.6rem; line-height: 1.2; text-wrap: balance; }
h2 { margin: 0; font-size: 1.1rem; }
.lede { margin: 0; max-width: 65ch; }
.meta { margin: 0.5rem 0 0; color: var(--muted); font-variant-numeric: tabular-nums; }
code { font-family: var(--mono); font-size: 0.85em; overflow-wrap: anywhere; }
.bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.bar input { flex: 1 1 14rem; min-width: 0; padding: 0.5rem 0.65rem; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); font: inherit; }
.findings { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
.finding { display: grid; grid-template-columns: auto 1fr; gap: 0.75rem; padding: 0.9rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.finding .body { min-width: 0; display: grid; gap: 0.35rem; }
.finding p { margin: 0; }
.pick { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; font-size: 0.75rem; color: var(--muted); }
.pick input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
.head { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: baseline; }
.sev { padding: 0.05rem 0.5rem; border-radius: 4px; background: var(--chip); color: var(--accent); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.steps { margin: 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.9rem; }
.reply { display: grid; gap: 0.6rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.reply textarea { min-height: 5rem; padding: 0.6rem; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); font: inherit; resize: vertical; }
.actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
button { padding: 0.5rem 0.9rem; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
button + button { background: transparent; color: var(--accent); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { margin: 0; min-height: 1.5em; color: var(--muted); }
.out { margin: 0; padding: 0.75rem; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; font-family: var(--mono); font-size: 0.85rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none; animation: none; } }
</style>
</head>
<body>
<main class="page">
<header>
<p class="eyebrow">Sample page with example data</p>
<h1 data-rv-text="title">Findings</h1>
<p class="lede" data-rv-text="summary"></p>
<p class="meta"><span data-rv-count="findings">0</span> findings in <code data-rv-text="change"></code></p>
</header>
<div class="bar">
<label for="find">Filter</label>
<input id="find" type="search" placeholder="Type a word from a finding" data-rv-filter="findings">
</div>
<ol class="findings" data-rv-each="findings">
<li class="finding">
<label class="pick"><input type="checkbox" data-rv-pick="">Accept</label>
<div class="body">
<p class="head"><span class="sev" data-rv-text="severity"></span><code data-rv-text="file"></code></p>
<p data-rv-text="what"></p>
<ul class="steps" data-rv-each="evidence"><li data-rv-text="item"></li></ul>
</div>
</li>
</ol>
<section class="reply">
<h2>Send your decision back</h2>
<label for="note">Note for the session</label>
<textarea id="note" data-rv-note="note" placeholder="What should change before this merges"></textarea>
<label for="verdict">Verdict</label>
<select id="verdict" data-rv-choice="verdict"><option value="approve">Approve</option><option value="change">Ask for changes</option></select>
<div class="actions">
<button type="button" data-rv-send="triage">Send to the session</button>
<button type="button" data-rv-copy="triage">Copy reply</button>
<button type="button" data-rv-download="triage">Save as file</button>
</div>
<p class="status" role="status" data-rv-status=""></p>
<p class="status" data-rv-session=""></p>
<ol data-rv-replies=""></ol>
<pre class="out" data-rv-out="" hidden></pre>
</section>
</main>
</body>
</html>
