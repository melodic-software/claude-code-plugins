# GitHub Actions workflows in this repository. Contract and schema: docs/contracts/ecosystem-commands/.
globs: [".github/**/*.yml", ".github/**/*.yaml"]
build-cmd: null
test-cmd: null
check-cmd: |
  actionlint
  zizmor --offline <files>
fix-cmd: null
opt-in: "GitHub Actions workflows present"
install-hint: |
  actionlint: the kjanat/actionlint fork from https://github.com/kjanat/actionlint/releases, at the version and linux_amd64 SHA-256 that ci-workflows' actionlint composite sets as its version and sha256 input defaults, at the ref .github/workflows/pr-require-checks.yml pins (the unqualified actionlint package in winget and Homebrew installs upstream, which rejects $/ action references and concurrency.queue)
  zizmor: pip install zizmor==1.32.0 (the version .github/requirements-ci.txt pins)
tool-pin:
  zizmor: "1.32.0"
notes: "Lint-only: owned by /toolchain:lint. actionlint runs from the repository root with no arguments and finds every workflow itself; CI's zizmor step fails on any finding."
