globs: ["*.ts", "*.tsx", "*.mts", "*.cts", "*.js", "*.jsx", "*.mjs", "*.cjs"]
project-discovery: ["package.json"]
build-cmd: "test ! -f tsconfig.json || npx tsc --noEmit"
test-cmd: "npm run test --if-present"
check-cmd: "npx --no @biomejs/biome check ."
fix-cmd: "npx --no @biomejs/biome check --write --linter-enabled=false <files>"
code-fix-cmd: "npx --no @biomejs/biome check --write <files>"
opt-in: "a biome.json in the project directory"
install-hint: "node 24 or later; npm ci --ignore-scripts in a package with a package-lock.json installs its dependencies"
requires:
  check-cmd:
    - name: "the root npm toolchain (package-lock.json)"
      probe: "test -d node_modules/@biomejs/biome"
      hint: "npm ci --ignore-scripts --no-audit --no-fund at the repository root"
      install:
        manager: npm
        lockfile: package-lock.json
notes: "build-cmd runs from each package.json directory and type-checks only where that directory has a tsconfig.json: three packages (plugins/miro/server and the two plugins/knowledge extraction packages). Six plugins keep a tsconfig.json with no package.json beside it; their files resolve to the root package, where nothing is type-checked. test-cmd runs a package's test script when it has one; the root package has none. Biome runs only in a package with its own biome.json (plugins/miro/server today)."
