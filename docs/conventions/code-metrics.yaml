# Team layer for the code-metrics plugin (reference: plugins/code-metrics/reference/config.md).
# Every key is optional; an absent key keeps the bundled default.
scope:
  exclude:
    - "**/node_modules/**"
    - "**/vendor/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/package-lock.json"
    - "**/CHANGELOG.md"
    - "plugins/themes/hooks/bedroom/lights.ts"
    - "plugins/*/scripts/docs-cache.sh"
    - "scripts/shared-copies.txt"
    - "scripts/skill-links.json"
  registries: [scripts/cross-plugin-source-registry.txt]
size:
  check: crossing
