scope:
  exclude:
    - "**/node_modules/**"
    - "**/vendor/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/package-lock.json"
    - "**/CHANGELOG.md"
    - "plugins/themes/hooks/bedroom/lights.ts"
    - "scripts/shared-copies.txt"
    - "scripts/skill-links.json"
    # Captured compare answers past the 300-file cap: https://docs.github.com/en/rest/commits/commits#compare-two-commits
    - ".github/scripts/pr-merge/fixtures/compare*"
  registries: [scripts/cross-plugin-source-registry.txt]
size:
  check: crossing
  copies_manifest: scripts/shared-copies.txt
