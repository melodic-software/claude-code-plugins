# yaml-language-server: $schema=../../plugins/architecture/schemas/architecture.schema.json
# Team layer for the architecture plugin's settings: plugins/architecture/reference/config.md.

layout:
  # The release, sync and dependency bots by name, not every [bot] author: the lanes bot's commits
  # are real feature work, so /architecture:improve layout counts them.
  exclude_authors:
    - "melodic-release[bot]"
    - "melodic-plugin-release[bot]"
    - "melodic-standards-sync[bot]"
    - "dependabot[bot]"
