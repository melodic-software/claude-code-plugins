# yaml-language-server: $schema=../../plugins/source-control/schemas/source-control.schema.json
# Team layer for the source-control plugin's YAML settings.
# Resolution: plugins/source-control/reference/config-resolution.md.
#
# pr_body_required_sections is the section list this repository's pull-request contract asks for,
# each non-empty, alongside a native closing keyword. The contract runs in the `ci-status` job of
# .github/workflows/pr-require-checks.yml, in the `check-contract` composite step pinned to
# melodic-software/ci-workflows/.github/actions/pr-require-checks/check-contract, which exempts
# `dependabot[bot]` from the linkage check and no other author. The linkage half is advisory: a body
# that misses a closing keyword or a required section gets a warning, an upserted comment and the
# `needs-issue-linkage` label, and `ci-status` still passes on that account. The composite is the
# authority; this key restates it so /source-control:pull-request drafts a body that conforms. Read
# the composite at the SHA pr-require-checks.yml pins, not at its default branch, since that pin is
# what actually runs. Re-read it before changing either.
#
# subject_pattern is the commit-subject convention, enforced by the guardrails commit-msg hook and
# block-convention-violation guard (docs/contracts/commit-convention/README.md). Its types are the
# standards components/pr-convention-policy/policy.json `title.allowedTypes`, the scope is optional,
# and git's own `Merge ...` and `Revert "..."` subjects pass. Single-quoted, with no single quote
# inside, so every reader gets it unescaped. dialect: posix-ere is the only dialect enforcement reads.
#
# The babysit_loop_* keys are the /source-control:babysit-loop lane's repository policy: a standing
# lane at the worker tier, merge authority up to the c2-mechanical rung, and a 30-minute activity
# grace window. Landing them here is the lane's tracked adoption. .claude/source-control.md keeps
# the same four values until the cleanup slice deletes it; change both while it exists.
pr_open_state: ready
# sync_stale_base: push-branch.sh merges the base into a branch behind it on paths
# scripts/check-stale-base-overlap.sh calls overlapping, just before the push, so a push that
# waited in the rate gate while main moved is not refused by the pre-push stale-base check.
sync_stale_base: true
# pre_ready turns off /source-control:pull-request ready's local verify step: it ran the
# affected suites on the merged head right before the flip starts CI, which runs the same
# suites there and gates the merge through ci-status. On a shared host the local run took
# 20-25 minutes and failed on load or a moving main (#10719, 2026-10-28). The pre-push hook
# still runs check-affected on every push.
pre_ready:
  - step: verify
    enabled: false
pr_body_required_sections:
  - Summary
  - Fix
  - Verification
  - Related
dialect: posix-ere
subject_pattern: '^((build|chore|ci|docs|feat|fix|perf|refactor|revert|security|style|test)(\(.+\))?!?: .+|Merge .+|Revert ".+)'
pr_title_pattern: "Same as `subject_pattern`."
babysit_loop_stop_mode: standing
babysit_loop_tier: worker
babysit_loop_merge: c2-mechanical
babysit_loop_grace_window_minutes: 30
# dossier_branch_prefix: the prefix of an owning item's dossier branch, dossier/<key>-<slug>.
dossier_branch_prefix: dossier/
