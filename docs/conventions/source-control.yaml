# yaml-language-server: $schema=../../plugins/source-control/schemas/source-control.schema.json
pr_open_state: ready
review_venue: auto
sync_stale_base: true
pre_ready:
  - step: verify
    enabled: false
dialect: posix-ere
subject_pattern: '^((build|chore|ci|docs|feat|fix|perf|refactor|revert|security|style|test)(\(.+\))?!?: .+|Merge .+|Revert ".+)'
pr_title_pattern: "Same as `subject_pattern`."
pr_body_required_sections:
  - Summary
  - Fix
  - Verification
  - Related
babysit_loop_stop_mode: standing
babysit_loop_tier: worker
babysit_loop_merge: c2-mechanical
babysit_loop_grace_window_minutes: 30
dossier_branch_prefix: dossier/
linkage_gate_uses_pattern: '\.github/actions/pr-require-checks/(check-contract|report-ci-status)([@[:space:]]|$)'
runner_policy_paths:
  - docs/ci-runner-routing.md
trusted_actors_source: standards
standards_repository: melodic-software/standards
org_settings_repo: melodic-software/github-iac
review_lane_producer_repo: melodic-software/ci-workflows
