# yaml-language-server: $schema=../../plugins/source-control/schemas/source-control.schema.json
# Team layer for the source-control plugin's YAML settings.
# Resolution: plugins/source-control/reference/config-resolution.md.
#
# pr_body_required_sections is the section list this repository's pull-request contract asks for,
# each non-empty, alongside a native closing keyword. The contract runs in the `ci-status` job of
# .github/workflows/pr-require-checks.yml, in the `check-contract` composite step pinned to
# melodic-software/ci-workflows/.github/actions/pr-require-checks/check-contract, which exempts
# `dependabot[bot]` from the linkage check and no other author. The linkage half is advisory: a body
# that misses a closing keyword or a required section gets a warning, an upserted comment and the
# `needs-issue-linkage` label, and `ci-status` still passes on that account. The composite is the
# authority; this key restates it so /source-control:pull-request drafts a body that conforms. Read
# the composite at the SHA pr-require-checks.yml pins, not at its default branch, since that pin is
# what actually runs. Re-read it before changing either.
pr_open_state: ready
pr_body_required_sections:
  - Summary
  - Fix
  - Verification
  - Related
