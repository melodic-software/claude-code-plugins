# yaml-language-server: $schema=../pr-pipeline.schema.json
version: 1

activities:
  simplify:
    skill: code-tidying:batch-simplify
    effect: mutate-branch
    gating: advisory
    reads-untrusted: false
    inputs: [base-sha, head-sha, changed-paths]
  fix-docs:
    skill: ai-slop:audit
    args: fix
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [changed-paths]
    applies-when:
      paths: ["**/*.md"]
  run-tests:
    skill: toolchain:check
    effect: read
    gating: gate
    reads-untrusted: false
    inputs: [head-sha, changed-paths]
  measure-coverage:
    skill: code-metrics:audit-coverage
    effect: read
    gating: advisory
    reads-untrusted: false
    inputs: [head-sha, changed-paths]
  claude:
    skill: review:code-review
    effect: publish-artifact
    gating: gate
    reads-untrusted: true
    inputs: [pr, base-sha, head-sha]
  review-security:
    skill: review:security-review
    effect: publish-artifact
    gating: gate
    reads-untrusted: true
    inputs: [pr, base-sha, head-sha]
  check-intent:
    skill: verification:confirm
    effect: read
    gating: gate
    reads-untrusted: true
    inputs: [pr, issue, head-sha]
  explain:
    skill: review:explain-change
    effect: publish-artifact
    gating: advisory
    reads-untrusted: true
    inputs: [pr, base-sha, head-sha]
  require-checks:
    script: .github/scripts/require-checks.sh
    effect: read
    gating: gate
    reads-untrusted: false
    inputs: [pr, head-sha]
  resolve-conflicts:
    skill: source-control:resolve-conflicts
    args: ci                      # no gates; escalates instead of asking
    prepare: merge-base           # the runner merges the base tip before the skill, commits after
    effect: mutate-branch
    gating: advisory              # ci-status judges the merged tree
    reads-untrusted: true         # reads PR head files
    inputs: [pr, base-sha, head-sha]
    applies-when:
      mergeable: [conflicting]    # a PR that is only behind stays with the merge queue
      labels-absent: [do-not-merge, needs-human]
      draft: [false]
  report-escalation:              # labels needs-human with a resume key
    script: .github/scripts/pr-unblock/report-escalation.sh
    effect: publish-artifact
    gating: advisory
    reads-untrusted: false
    inputs: [pr, head-sha]
  merge:
    script: .github/scripts/merge-pr.sh
    effect: merge
    gating: advisory
    reads-untrusted: false
    inputs: [pr, head-sha]
  check-default-branch:
    skill: toolchain:check
    effect: read
    gating: advisory
    reads-untrusted: false
    scope: tree
    inputs: [head-sha]
  sweep-comments:
    skill: review:fanout
    effect: mutate-tracker
    gating: advisory
    reads-untrusted: true
    inputs: [pr]

lanes:
  pr-refine:
    stage: refine
    slots:
      - activity: simplify
      - activity: fix-docs
  pr-run-checks:
    stage: verify
    slots:
      - activity: run-tests
      - activity: measure-coverage
        needs: [run-tests]
  pr-review:
    stage: verify
    slots:
      - activity: claude
  pr-review-security:
    stage: verify
    slots:
      - activity: review-security
  pr-verify:
    stage: verify
    slots:
      - activity: check-intent
  pr-explain:
    stage: verify
    slots:
      - activity: explain
  pr-require-checks:
    stage: verify
    slots:
      - activity: require-checks
  pr-unblock:
    stage: unblock
    slots:
      - activity: resolve-conflicts
      - activity: report-escalation
        needs: [resolve-conflicts]
      # Fixing CI and addressing review feedback join this lane as composites
      # (a `children:` list of leaves) once their designs land.
  pr-merge:
    stage: merge
    slots:
      - activity: merge
  post-merge-verify:
    stage: post-merge
    slots:
      - activity: check-default-branch
  post-merge-sweep-comments:
    stage: post-merge
    slots:
      - activity: sweep-comments
        enabled: false

loop:
  review-rounds: 3
  no-progress: 3

# Every skill activity takes default-profile unless a route names another
# (README.md, Models).
models:
  profiles:
    standard: { model: default, max-turns: 75 }
    review: { model: opus, max-turns: 100 }
  default-profile: standard
  routes:
    claude: review

merge:
  rung: C2
  # The merge authority and, for local-babysit, the login the lane acts as
  # (README.md, Merge authority). local-babysit requires agent-identity.
  # authority: local-babysit
  # agent-identity: example-lanes[bot]
  diff-check:
    denied-paths: [".github/**", ".claude/**", "docs/conventions/pr-pipeline.yaml"]
    max-changed-lines: 400
  stack-landing: manual
