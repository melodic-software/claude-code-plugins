# yaml-language-server: $schema=../pr-pipeline.schema.json
version: 2

activities:
  simplify:
    skill: code-tidying:batch-simplify
    args: --unattended
    effect: read
    applied-by:
      patch: apply-patch
    gating: advisory
    reads-untrusted: false
    inputs: [base-sha, head-sha, changed-paths]
  fix-docs:
    skill: ai-slop:audit
    args: fix
    effect: read
    applied-by:
      patch: apply-patch
    gating: advisory
    reads-untrusted: true
    inputs: [changed-paths]
    applies-when:
      paths: ["**/*.md"]
  apply-patch:
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
  run-tests:
    skill: toolchain:check
    args: --unattended
    effect: read
    gating: gate
    reads-untrusted: false
    inputs: [head-sha, changed-paths]
  measure-coverage:
    skill: code-metrics:audit-coverage
    effect: read
    gating: advisory
    reads-untrusted: false
    inputs: [head-sha, changed-paths]
  claude:
    skill: review:code-review
    effect: read
    gating: gate
    reads-untrusted: true
    inputs: [pr, base-sha, head-sha]
  review-security:
    skill: review:security-review
    effect: read
    gating: gate
    reads-untrusted: true
    inputs: [pr, base-sha, head-sha]
  check-intent:
    skill: verification:confirm
    args: --unattended
    effect: read
    gating: gate
    reads-untrusted: true
    inputs: [pr, issue, head-sha]
  explain:
    skill: review:explain-change
    effect: read
    gating: advisory
    reads-untrusted: true
    inputs: [pr, base-sha, head-sha]
  require-checks:
    script: .github/scripts/require-checks.sh
    effect: read
    gating: gate
    reads-untrusted: false
    inputs: [pr, head-sha]
  resolve-conflicts:
    skill: source-control:pull-request
    args: conflicts --ci --unattended
    prepare: merge-base
    effect: read
    applied-by:
      patch: apply-conflict-patch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, base-sha, head-sha]
    applies-when:
      mergeable: [conflicting]
      labels-absent: [do-not-merge]
      draft: [false]
  apply-conflict-patch:
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha, base-sha]
    applies-when:
      labels-absent: [do-not-merge]
      draft: [false]
  report-escalation:
    script: .github/scripts/pr-unblock/report-escalation.sh
    effect: publish-artifact
    gating: advisory
    reads-untrusted: false
    inputs: [pr, head-sha]
  merge:
    script: .github/scripts/merge-pr.sh
    effect: merge
    gating: advisory
    reads-untrusted: false
    inputs: [pr, head-sha]

lanes:
  pr-refine:
    stage: refine
    slots:
      - activity: simplify
      - activity: apply-patch
        needs: [simplify]
  pr-run-checks:
    stage: verify
    slots:
      - activity: run-tests
      - activity: measure-coverage
        needs: [run-tests]
  pr-review-hosted:
    stage: review
    slots:
      - activity: claude
  pr-review-security-hosted:
    stage: review
    slots:
      - activity: review-security
  pr-verify:
    stage: verify
    slots:
      - activity: check-intent
  pr-explain:
    stage: verify
    slots:
      - activity: explain
        enabled: false
  pr-require-checks:
    stage: verify
    slots:
      - activity: require-checks
  pr-unblock:
    stage: fix
    slots:
      - activity: resolve-conflicts
      - activity: apply-conflict-patch
        needs: [resolve-conflicts]
      - activity: fix-docs
      - activity: apply-patch
        needs: [fix-docs]
      - activity: report-escalation
        needs: [resolve-conflicts, apply-conflict-patch]
  pr-merge:
    stage: merge
    slots:
      - activity: merge

loop:
  review-rounds: 3
  no-progress: 3

models:
  profiles:
    standard:
      model: opus
      max-turns: 75
    review:
      model: opus
      max-turns: 100
  default-profile: standard
  routes:
    claude: review

merge:
  rung: merge
  # The merge authority and, for local-babysit, the login the lane acts as
  # (README.md, Merge authority). local-babysit requires agent-identity.
  # authority: local-babysit
  # agent-identity: example-lanes[bot]
  diff-check:
    denied-paths: [".github/**", ".claude/**", "docs/conventions/pr-pipeline.yaml"]
    max-changed-lines: 400
  stack-landing: manual
