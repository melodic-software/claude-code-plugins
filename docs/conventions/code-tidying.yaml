# yaml-language-server: $schema=../../plugins/code-tidying/schemas/code-tidying.schema.json
upkeep_cadence: daily
upkeep_backstop: weekly
upkeep_max_open: 3
upkeep_spec_issue: 12894
comment_posture: necessary
comment_edit_scope: files
comment_lint: block
comment_lint_allow:
  - '^#[[:space:]]*test-scope:'
  - '^//[[:space:]]*test-scope:'
comment_lint_exclude:
  # Vendored ci-workflows contract files, byte-identical to the pinned commit so the credential-legs
  # test runs offline; their comments are upstream's, not ours. Owner decision Q156: "I'm fine with
  # lint exclusions, but those need to be heavily justified, and they should be far and few between."
  # https://github.com/melodic-software/architecture/pull/232
  - '.github/scripts/pr-unblock/fixtures/ci-workflows-394af27bda4bda2e02e0ef0691eacd120389108f/**'
