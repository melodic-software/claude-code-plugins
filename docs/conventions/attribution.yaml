# yaml-language-server: $schema=../../plugins/attribution/schemas/attribution.schema.json
# Team layer for the attribution plugin (schema: plugins/attribution/schemas/attribution.schema.json).
# Every key is optional; an absent key keeps the shipped default. This file wins over the
# legacy .claude/attribution.json, which stays in this repository until the cleanup slice under
# #5906 deletes it and is read only when this file is absent. Until then a change to a value
# below is made in both files.
#
# The eval fixtures are excluded as config, never in a script, so the eval harness's own config
# isolation lifts the exclusion and the fixtures report their real findings. The trigger-less
# stamp check, off in the portable baseline, is on here as it was in .claude/attribution.json.
excluded_paths:
  - "**/evals/fixtures/**"
trigger_less_stamp_check: true
