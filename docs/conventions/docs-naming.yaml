# This repository's own file-name configuration, validated by
# plugins/docs-naming/schemas/docs-naming.schema.json. Every key is documented in
# plugins/docs-naming/reference/config.md.
roots:
  - "docs"
  - path: "."
    extensions:
      - "md"
    exempt_paths:
      - "**/fixtures/**"
      - "**/evals/**"
      - "**/vendor/**"
rule: "lower-kebab"
regex: '^[a-z0-9]+([.-][a-z0-9]+)*\.[a-z0-9]+$'
exempt_basenames:
  - "README.md"
  - "CHANGELOG.md"
  - "INDEX.md"
  - "LICENSE.md"
  - "AGENTS.md"
  - "CLAUDE.md"
  - "SKILL.md"
  - "CONTRIBUTING.md"
  - "SECURITY.md"
  - "REVIEW.md"
  - "CODE_OF_CONDUCT.md"
  - "CONTRACT.md"
  - "STYLE.md"
  - "TODO.md"
  - "PLAN.md"
exempt_paths: []
exempt_extensions:
  - "py"
  - "sh"
  - "mjs"
  - "js"
  - "ps1"
tiers:
  - name: "historical"
    paths:
      - "docs/adr/**"
      - "docs/upstream/**"
      - ".claude/unhobble/**"
    forms: "links-and-paths"
  - name: "released"
    paths:
      - "**/CHANGELOG.md"
    forms: "none"
sweep_exclude:
  - ".work/**"
  - "plugins/education/skills/teach/**"
  - "plugins/domain-driven-design/skills/ubiquitous-language/**"
sweep_exclude_sites: []
generated:
  - path: "docs/architecture/landscape.json"
    regenerate: "bash plugins/architecture/skills/map-landscape/scripts/landscape-record.sh --source 'current repository plus reference graph' --remote 'not used' --edges-from . . > docs/architecture/landscape.json"
    churn:
      - "generated_on"
      - "repositories[].last_touched"
redirect_map: null
