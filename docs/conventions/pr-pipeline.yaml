# yaml-language-server: $schema=pr-pipeline/pr-pipeline.schema.json
version: 1

activities:
  fix-docs:
    skill: ai-slop:audit
    args: fix
    effect: mutate-branch
    gating: advisory
    # Head markdown can quote issue, PR or web text.
    reads-untrusted: true
    inputs: [changed-paths]
    applies-when:
      paths: ["**/*.md"]
      labels-absent: [do-not-merge, needs-human]
  resolve-conflicts:
    skill: source-control:resolve-conflicts
    args: ci
    # The write runner merges the base tip before the skill and commits the
    # result with both parents after it.
    prepare: merge-base
    effect: mutate-branch
    # ci-status judges the merged tree.
    gating: advisory
    # Reads PR head files.
    reads-untrusted: true
    inputs: [pr, base-sha, head-sha]
    applies-when:
      # A PR that is only behind stays with the merge queue.
      mergeable: [conflicting]
      labels-absent: [do-not-merge, needs-human]
      draft: [false]
  report-escalation:
    # Labels the PR needs-human and posts the reason with a resume key.
    script: .github/scripts/pr-unblock/report-escalation.sh
    effect: publish-artifact
    gating: advisory
    reads-untrusted: false
    inputs: [pr, head-sha]
  merge-pr:
    # Runs the merge gate on one PR and, when it passes, adds the PR to the
    # merge queue at the head it checked. No model. .github/workflows/pr-merge.yml
    # runs it for each candidate PR.
    script: plugins/source-control/scripts/source-control-babysit-merge
    args: --unattended --authority pr-merge --merge
    effect: merge
    gating: advisory
    # Reads PR bodies, labels and comments for holds.
    reads-untrusted: true
    inputs: [pr, head-sha]

lanes:
  pr-refine:
    stage: refine
    slots:
      - activity: fix-docs
  pr-unblock:
    stage: unblock
    slots:
      - activity: resolve-conflicts
      - activity: report-escalation
        needs: [resolve-conflicts]
  pr-merge:
    stage: merge
    slots:
      - activity: merge-pr

merge:
  # The lane auto-merges only PRs labeled `work-class: mechanical` (C2):
  # dependency bumps, lint and format fixes, syncs. The classes C1-C5 (read-only,
  # mechanical, scoped, structural, untrusted-provenance) are defined in
  # plugins/autonomy/reference/guardrails/work-classes.md.
  rung: C2
  authority: pr-merge
  agent-identity: melodic-automation-lanes[bot]
  # Reports each decision and writes nothing until the owner sets false.
  report-only: true
  diff-check:
    denied-paths:
      - ".github/**"
      - "docs/conventions/**"
      - "plugins/source-control/skills/babysit-prs/**"
      - ".claude/**"
      - "plugins/*/skills/**"
      - "plugins/*/agents/**"
      - "plugins/*/hooks/**"
      - "plugins/*/.claude-plugin/**"
      - "scripts/**"
    max-changed-lines: 400
