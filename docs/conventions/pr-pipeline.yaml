# yaml-language-server: $schema=pr-pipeline/pr-pipeline.schema.json
version: 2

activities:
  fix-docs:
    skill: ai-slop:audit
    args: fix
    effect: mutate-branch
    gating: advisory
    # Head markdown can quote issue, PR or web text.
    reads-untrusted: true
    inputs: [changed-paths]
    applies-when:
      paths: ["**/*.md"]
      labels-absent: [do-not-merge, needs-human]
      # Skips a draft PR before any model turn, since the promote step drops
      # a draft's commits anyway.
      draft: [false]
  resolve-conflicts:
    skill: source-control:resolve-conflicts
    args: ci
    # The write runner merges the base tip before the skill and commits the
    # result with both parents after it.
    prepare: merge-base
    effect: mutate-branch
    # ci-status judges the merged tree.
    gating: advisory
    # Reads PR head files.
    reads-untrusted: true
    inputs: [pr, base-sha, head-sha]
    applies-when:
      # A PR that is only behind stays with the merge queue.
      mergeable: [conflicting]
      labels-absent: [do-not-merge, needs-human]
      draft: [false]
  address-feedback:
    # Fixes the review lanes' open findings on a pull request and records a
    # reply for each one. It posts nothing itself. pr-feedback-dispatch.yml
    # starts it only on pull requests the lanes App opened; a trusted person
    # may also dispatch it by hand.
    skill: source-control:pull-request
    # The skill's CI mode for review comments: edits only files a finding
    # names, never under .github/, and writes replies to a file.
    args: comments --ci
    # Before any model turn the runner keeps only unresolved threads the
    # reviewer bot opened on a reviewed head, left by it alone or answered by
    # a trusted person after the lane escalated them, hands the pull request to a
    # person when it changes .github/ or `loop.review-rounds` rounds already
    # ran, and gives the skill the review-thread tool.
    prepare: review-threads
    # Pushes its fixes to the pull request's branch, nothing else.
    effect: mutate-branch
    # ci-status and the review lanes judge the pushed fix.
    gating: advisory
    # Reads review comments, which quote the diff.
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      # do-not-merge stops it. On a needs-human PR the select step keeps only
      # threads a trusted person with write access asked it to fix, and
      # holds the PR when there are none; pr-merge still refuses that PR.
      labels-absent: [do-not-merge]
      # A draft pull request is skipped.
      draft: [false]
  publish-feedback:
    # Posts the replies address-feedback recorded, exactly as written, resolves
    # the threads it fixed, and posts the round marker. A script, no model.
    script: .github/scripts/pr-unblock/publish-feedback.mjs
    # Writes pull request comments and resolves threads; pushes nothing.
    effect: publish-artifact
    gating: advisory
    # Reads the replies the model wrote.
    reads-untrusted: true
    inputs: [pr, head-sha]
  review-dependency:
    # Reviews one Dependabot pull request the classifier sorts `review` (a
    # major bump, an action publisher outside the allowlist, a group holding
    # a major, a red ci-status, or a file outside the content rule) and
    # returns a verdict: merge, fix, close or escalate. It posts nothing
    # itself. pr-unblock-dispatch.yml starts it; a trusted person may also
    # dispatch it by hand.
    skill: source-control:pull-request
    # The skill's CI mode for dependency bumps: reads the runner's context
    # file, the checkout and upstream release notes, runs no head code, and
    # pushes a fix only outside .github/ with [dependabot skip].
    args: dependency --ci
    # Before any model turn the runner skips a pull request Dependabot did
    # not open or one sorted `auto`, and hands it to a person once
    # `loop.dependency-review-rounds` rounds already ran.
    prepare: dependency-review
    # Reads the upstream changelog and release notes for the bumped versions.
    web-access:
      enabled: true
      domains: [github.com, raw.githubusercontent.com, www.npmjs.com, registry.npmjs.org, pypi.org]
    # Pushes a fix to the pull request's branch, nothing else.
    effect: mutate-branch
    # ci-status judges the pushed fix; the verdict job acts on the verdict.
    gating: advisory
    # Reads the PR body's release notes, the upstream changelog and head files.
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, needs-human]
      draft: [false]
  apply-dependency-verdict:
    # Acts on the verdict review-dependency recorded: posts the round marker
    # (for merge, the record the pr-merge lane merges on), closes the pull request
    # and files an ignore-entry issue (never for a security update), or hands
    # the pull request to a person. Never merges. A script, no model.
    script: .github/scripts/pr-unblock/apply-dependency-verdict.mjs
    effect: publish-artifact
    gating: advisory
    # Reads the verdict the model wrote, and the PR body for an advisory.
    reads-untrusted: true
    inputs: [pr, head-sha]
  fix-ci:
    # Fixes the failing CI checks on a lanes App pull request: reproduces each
    # with the repository's own command, fixes the cause and reruns it. It
    # holds no write token: the runner turns its uncommitted edits into a
    # patch that apply-ci-fix pushes. pr-unblock-dispatch.yml starts it; a
    # trusted person may also dispatch it by hand.
    skill: source-control:pull-request
    # The skill's CI mode for failing checks: never weakens a check, never
    # edits .github/, and reports each check fixed or escalated.
    args: ci --ci
    # Before the run a base job writes the failing checks' names, workflow,
    # annotations and log ends to a context file, or hands the pull request
    # to a person once `loop.fix-ci-rounds` fixes were already pushed. The
    # read runner gives the skill that file, Bash, Edit and Write.
    prepare: ci-context
    # Runs head code, so no write token: the change leaves as a patch.
    effect: read
    # ci-status judges the pushed fix.
    gating: advisory
    # Reads check annotations and logs, which print head text.
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, needs-human]
      draft: [false]
  apply-ci-fix:
    # Applies fix-ci's patch to the head fix-ci worked on and pushes it as one
    # commit, without force. A script, no model, and it runs no head code.
    script: .github/scripts/pr-unblock/apply-ci-fix.mjs
    # Before the mint the runner checks the patch artifact and the head;
    # the script refuses the whole patch when any change is under .github/,
    # an agent instruction path (CLAUDE.md, AGENTS.md, .claude/ or
    # .claude-plugin/, a plugin's hooks/, .mcp.json, .gitmodules, CODEOWNERS), a
    # symbolic link or a gitlink, and hands an empty, invalid or unappliable
    # patch to a person.
    prepare: apply-patch
    # Pushes the fix to the pull request's branch, nothing else.
    effect: mutate-branch
    gating: advisory
    # Reads the patch and the report the model wrote.
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, needs-human]
      draft: [false]
  resolve-issue:
    # Works one issue labeled agent-ready: either commits the change to a new
    # branch, or stops and says why. The runner adds `--issue <number>`.
    skill: work-items:work
    args: --ci
    # Validates the format of every changelog fragment before the skill
    # reports done. A missing fragment is caught on the PR by ci-status
    # (--check-required needs committed work, and the lane commits through
    # the API, not in the checkout). After the skill, work-resolve-issue.yml's
    # run-checks job runs each check again itself, from the base copy against
    # the lane branch with the base's scripts/, and report-outcome stops a done
    # run whose checks failed or did not run, whatever the outcome file says.
    checks: ["scripts/check-changelog-fragments.sh --check"]
    # Runs the diff-scoped lint checks a push would face (markdown,
    # shellcheck, exec bits, changelog fragments, plugin validation) in the
    # run, so the skill fixes what they report before it commits and the PR
    # does not open red. Advisory: unlike checks, the runner does not run
    # these again, and a failure the skill cannot fix still opens the PR,
    # named in its report. --uncommitted checks the work tree as the commit
    # the API would make, since the lane commits through the API.
    self-checks: ["scripts/check-affected.sh --uncommitted"]
    # Repository scripts the run may call with any arguments it chooses, to
    # check its work the way an issue's done-when says. Each runs from a
    # read-only copy of the base. A script that changes files, runs code from
    # the checkout or reaches the network hands the run that power, so list
    # one only when it limits that itself. Each script starts with GH_TOKEN
    # and GITHUB_TOKEN unset, but code it runs can still read the lane's
    # push-capable token from an ancestor process's /proc/<pid>/environ.
    # run-test-file.sh runs one test file inside the checkout
    # (pytest, bash, node --test or the package's vitest), so the run can
    # show a test it changed passing and failing when broken on purpose.
    # git-mv-rm.sh renames and removes paths inside the checkout.
    # sync-shared-copies.sh regenerates registered shared-library copies
    # inside the checkout: it reads the registry and canonicals there and
    # writes only registered plugins/<name>/... copies, running no checkout
    # code; it refuses a registry path that is absolute, has a . or .. segment
    # or crosses a symbolic link, and from this copy refuses --check-bump,
    # which can reach the GitHub API.
    # check-evals-quality.sh reads evals.json files with bash and jq.
    # check-skill.sh runs checkout code: each checked skill's
    # scripts/*.test.sh and the checkout's markdownlint, with the network
    # open and the token readable that way: the same power run-test-file.sh
    # has.
    # new-changelog-fragment.sh writes .changes/<plugin>/<slug>.md in the
    # work tree it runs in, refusing a plugin name with a path in it and a
    # linked .changes directory (--carriers-of also makes and removes one
    # temp file); it runs no checkout code and reaches no network.
    verify-scripts:
      - plugins/testing/skills/audit/scripts/cant-fail-scan.sh
      - scripts/run-test-file.sh
      - scripts/git-mv-rm.sh
      - plugins/skill-quality/scripts/check-skill.sh
      - plugins/skill-quality/scripts/check-evals-quality.sh
      - scripts/sync-shared-copies.sh
      - scripts/new-changelog-fragment.sh
    # Lets the run read web pages, so it can check a fact against its source
    # (for example a documented default on a vendor docs page) instead of
    # trusting the issue's quote. It may search the web and read any site,
    # through the research skills (/discovery:research and the like), and
    # lists each page it read in its report. Off unless set here; `domains`
    # can name sites instead of `any`. A page can try to steer the run, so a
    # person still reviews every PR the run opens.
    web-access:
      enabled: true
      domains: any
    effect: mutate-branch
    gating: advisory
    # Reads the issue's title and body, which anyone can write, and its
    # comments by listed authors.
    reads-untrusted: true
    inputs: [issue]
    applies-when:
      events: [labeled]
      # The agent-ready label alone admits the issue, whoever added it; the
      # trigger gate checks that a listed human or the lanes App added it.
      # No `work-class:` label admits or refuses it. A person decides an
      # issue carrying one of these labels, so it starts nothing.
      labels-absent: [needs-human, needs-owner-decision, "status: needs-decision"]
      # Read now, so removing agent-ready while a run waits stops it.
      labels: [agent-ready]
      # Only issues labeled agent-ready after this time start a run; an issue
      # labeled earlier starts nothing.
      labeled-after: "2026-10-14T19:21:59Z"
  report-outcome:
    # Opens a ready pull request from the branch, or comments on the issue
    # and labels it needs-human. A Refs pull request also labels the issue
    # needs-human, with a refs-hold comment. A script, no model.
    script: .github/scripts/work-resolve-issue/report-outcome.mjs
    effect: publish-artifact
    gating: advisory
    reads-untrusted: false
    inputs: [issue]
  report-escalation:
    # Labels the PR needs-human and posts the reason with a resume key.
    script: .github/scripts/pr-unblock/report-escalation.sh
    effect: publish-artifact
    gating: advisory
    reads-untrusted: false
    inputs: [pr, head-sha]
  merge-pr:
    # Runs the merge gate on one PR and, when it passes, adds the PR to the
    # merge queue at the head it checked. No model. .github/workflows/pr-merge.yml
    # runs it for each candidate PR.
    script: plugins/source-control/scripts/source-control-babysit-merge
    args: --unattended --authority pr-merge --merge
    effect: merge
    gating: advisory
    # Reads PR bodies, labels and comments for holds.
    reads-untrusted: true
    inputs: [pr, head-sha]
  label-unblocked:
    # When an issue closes (or, hourly, for each issue a listed human or a
    # merge closed in the last three hours), labels agent-ready each issue it
    # blocked whose blockers are all closed as completed by a listed human or
    # a merge, meaning a merged PR or a commit (a pull request blocker:
    # merged; another repository's: never), that carries no
    # hold label, and whose agent-ready label was never removed. The label
    # starts resolve-issue. Hourly it also hands an agent-ready issue whose
    # lanes-App PR merged with `Refs:` or closed unmerged to triage
    # (needs-triage on, agent-ready off), lifting only the needs-human
    # report-outcome set for a merged Refs PR. A script, no model.
    # .github/workflows/work-unblock.yml runs it.
    script: .github/scripts/work-unblock/label-unblocked.mjs
    # Labels, unlabels and comments on issues; nothing else.
    effect: mutate-tracker
    gating: advisory
    # Reads issue comments for the lanes App's outcome markers.
    reads-untrusted: true
    # The closed issue; the hourly sweep takes none and lists recent closes.
    inputs: [issue]

lanes:
  # Started by the agent-ready label on an issue (.github/workflows/work-resolve-issue.yml).
  work-resolve-issue:
    stage: work
    slots:
      - activity: resolve-issue
      - activity: report-outcome
        needs: [resolve-issue]
  pr-refine:
    stage: refine
    slots:
      - activity: fix-docs
  pr-unblock:
    stage: unblock
    slots:
      - activity: resolve-conflicts
      # Started by pr-feedback-dispatch.yml after both review lanes reviewed
      # the head.
      - activity: address-feedback
      # Runs after address-feedback, in its own job with its own token.
      - activity: publish-feedback
        needs: [address-feedback]
      # Started by pr-unblock-dispatch.yml for review-tier Dependabot PRs.
      - activity: review-dependency
      # Runs after review-dependency, in its own job with its own token.
      - activity: apply-dependency-verdict
        needs: [review-dependency]
      # Started by pr-unblock-dispatch.yml for lanes App PRs whose ci-status
      # failed.
      - activity: fix-ci
      # Runs after fix-ci, in its own job with its own token.
      - activity: apply-ci-fix
        needs: [fix-ci]
      # Hands the pull request to a person when any of the others escalates.
      - activity: report-escalation
        needs: [resolve-conflicts, address-feedback, publish-feedback, review-dependency, apply-dependency-verdict, fix-ci, apply-ci-fix]
  pr-merge:
    stage: merge
    slots:
      - activity: merge-pr
  # Started by an issue closing and by an hourly sweep of recent closes
  # (.github/workflows/work-unblock.yml).
  work-unblock:
    stage: work
    slots:
      - activity: label-unblocked

# The model, effort and turn budget of every model run (README.md, Models).
# Aliases only, never full model IDs. `default` passes no --model, so the
# account's default model runs. No profile sets effort, so each run keeps its
# model's default effort. Every skill activity takes default-profile;
# pr-verify.yml's judgment routes as verify-pr.
models:
  profiles:
    standard: { model: default, max-turns: 75 }
    review: { model: opus, max-turns: 60 }
    pr-review: { model: sonnet, effort: high, max-turns: 75 }
    triage: { model: sonnet, effort: medium, max-turns: 30 }
    summary: { model: sonnet, effort: medium, max-turns: 10 }
  default-profile: standard
  routes:
    verify-pr: review
    review-code: pr-review
    review-security: pr-review
    triage-issue: triage
    # work-resolve-issue's read-only pass that describes a reused lane branch.
    summarize-reuse: summary
  # A run on an issue (resolve-issue) takes its budget from the issue's Size,
  # Complexity and Uncertainty org issue fields, read by id. An empty field,
  # or one whose latest setter is not a listed human or the lanes App, is not
  # assessed and the lane refuses the issue (not-assessed); an unmapped
  # option fails the run. Turn cap = base-turns x complexity factor, rounded
  # up; it replaces the profile's max-turns.
  issue-dimensions:
    fields:
      size:
        field-id: 15462270
        options: { "27053568": small, "27053567": medium, "27053566": large }
      complexity:
        field-id: 48625720
        options: { "85127651": low, "85127652": medium, "85127653": high }
      uncertainty:
        field-id: 48625721
        options: { "85127654": known, "85127655": knowable, "85127656": unknown }
    sizes:
      # 75 turns is the cap every lane run had; 50 minutes covers the high
      # factor at the 20 seconds a turn the old 75-turn, 25-minute run allowed.
      small: { base-turns: 75, timeout-minutes: 50 }
      # Twice small's turns and time.
      medium: { base-turns: 150, timeout-minutes: 100 }
      # Too big for one run: the lane skips it (split-required) before any
      # model turn, and triage sends it to /work-items:decompose.
      large: split
    complexity:
      # Base turns as they are: a small low-complexity issue runs as before.
      low: 1
      # Half again, for an issue with several moving parts.
      medium: 1.5
      # Double, the most a size's timeout covers.
      high: 2
    uncertainty:
      # The approach is known: run it.
      known: run
      # Answerable by reading or asking first: skip until it is (research-first).
      knowable: research-first
      # Only an experiment answers it: skip until a probe has (probe-first).
      unknown: probe-first

loop:
  review-rounds: 3
  dependency-review-rounds: 2
  # Fixes fix-ci may push to one pull request before the next run hands it to
  # a person instead. 3 matches review-rounds: past it, CI failing again after
  # each pushed fix means the fixes are not converging and a person decides.
  fix-ci-rounds: 3

limits:
  # fix-ci runs one pr-unblock-dispatch run starts. 2 matches the
  # review-dependency cap, so a push to main starts at most a few model runs
  # while plan usage per run is unmeasured; the backlog drains over pushes.
  fix-ci-per-run: 2
  # Extra fix-ci dispatches on one head whose fix-ci run failed (an outage,
  # a timeout). 1 retries once; a second failure on the same head is a
  # pattern for a person, not a retry.
  fix-ci-restarts: 1
  # The issue lane's WIP cap when the lane merge rate cannot be read; the
  # wip block below derives it otherwise.
  wip-cap: 12
  # Restarts after a run reaches its turn cap, per agent-ready a person adds.
  # 0 hands every capped run back to a person, naming the cap; it stays 0
  # until the lane commits a capped run's leftover edits.
  turn-cap-restarts: 0
  # Hours of issue-lane admissions the admitted backlog (open issues with
  # agent-ready) may hold before new agent-ready labels pause.
  admission-window-hours: 24
  # Share of the lane's hourly merge rate admitted per hour; the release point
  # is this factor times hourly merges times admission-window-hours.
  admission-factor: 0.8

wip:
  # Cap = lane PRs merged per hour over the window times this target.
  target-lead-time-hours: 2
  # Floor under the computed cap: the earlier fixed cap (#8252). It stops a
  # day with few merges from shrinking the cap until the lane stalls.
  min-cap: 12
  merge-rate-window-hours: 24
  # Lane PRs opened in the window may be at most this share of those merged
  # in it (not limits.admission-factor, which sizes the agent-ready backlog).
  opened-to-merged-ratio: 0.8
  # Held lane PRs (needs-human, do-not-merge, or a "Hold: a human merges
  # this" body line) count here, not against the cap. Step down to 30 later.
  held-cap: 60
  held-alarm-hours: 24
  # Over the WIP cap the lane pauses from this date; the held cap only alerts.
  # The owner clears it to only alert. Empty: over a cap the lane alerts and
  # keeps starting runs.
  pause-from: "2026-10-18"

merge:
  # The lane treats every PR the lanes App opened for one closing issue as
  # class C2 (plugins/autonomy/reference/guardrails/work-classes.md) and reads
  # no `work-class:` label. Its merge criterion is the verifier verdict below.
  rung: C2
  authority: pr-merge
  agent-identity: melodic-automation-lanes[bot]
  # true: report each decision and write nothing.
  report-only: false
  # A PR merges only with a passing pr-verify.yml verdict at its head. Must be
  # true at a rung above off: the gate refuses otherwise.
  require-verifier-verdict: true
  # Lane merges in flight at once (queued plus merged and not yet verified).
  # The merge queue tests each PR against the latest base plus the PRs ahead
  # of it.
  max-in-flight: 5
  # Minutes pr-merge's gate loop runs before it starts no further candidate;
  # the next run starts after the last one reached. Runs 39190604942,
  # 39187691831 and 39183126369 (the last three scheduled sweeps that ran
  # the gate) checked 37-39 candidates each: median 30-39 s, longest
  # 157-164 s, about 1 minute before the loop. 10 keeps a run, its longest
  # candidate included, inside the 15 minutes between scheduled runs.
  gate-budget-minutes: 10
  # pr-verify.yml judges only PRs the lanes App (agent-identity) opened; `any`
  # judges every author's.
  verify-authors: lane
  # Dependabot pull requests answer to this switch, not report-only: tier auto
  # (every update non-major, allowed Actions publishers) merges once ci-status
  # passes; tier review merges once the pr-unblock review leaves a merge
  # verdict at the head and ci-status passes. Owner decision 2026-10-18: a
  # major update, or one whose version cannot be read (a SHA pin) or whose
  # sources disagree, waits for a human whatever the verdict (`majors: hold`); `review` lets the verdict
  # merge it.
  dependabot:
    mode: enforce
    majors: hold
  # The HIGH path floor, floor-paths, floor-script-scopes and the capability
  # check are on (owner decision 2026-10-18, reversing Q661): lanes may edit
  # runnable plugin files (the #8184 scope), and fix-ci's patch guard
  # covers only .github/** and agent instruction paths. The scorer's fixed HIGH floor (.github/**,
  # docs/conventions/**, agent instructions, hooks, lib/, scripts/, package
  # manifests and more) now applies in the pr-merge lane too. A lane PR
  # touching a floor path or script, or changing
  # capability frontmatter in a SKILL.md, agents/**/*.md or commands/**/*.md,
  # scores HIGH and waits for a human, who merges it in person. A denied path
  # would instead make the PR ineligible. The switch governs both lanes: in
  # the local babysit lane, false would leave out floor-paths,
  # floor-script-scopes, the capability check and the floor entries for
  # plugin monitors and workflows, keeping the rest of the fixed floor. The
  # verifier verdict, both AI review lanes, ci-status and the post-merge
  # revert breaker still gate every lane PR.
  # Owner decision Q624 still holds for the rest: no denied path, size cap or
  # C2 contradiction check. Each comes back by setting it here: list
  # denied-paths, set `c2-contradictions: true`, or set `max-changed-files`
  # or `max-changed-lines` (the earlier 8 and 400).
  # Owner decision 2026-10-17: the lane hold covers structural and untrusted-
  # provenance work only; scoped lane PRs off the HIGH floor merge on the
  # verifier verdict.
  diff-check:
    denied-paths: []
    high-path-floor: true
    floor-paths:
      - "**/bin/**"
      - "**/.lsp.json"
      - "**/settings*.json"
      - "plugins/ai-slop/scripts/**"
      - "plugins/ai-slop/skills/*/scripts/**"
      - "plugins/source-control/scripts/**"
      - "plugins/source-control/skills/*/scripts/**"
      - "plugins/discovery/scripts/**"
      - "plugins/discovery/skills/*/scripts/**"
      - "plugins/knowledge/scripts/**"
      - "plugins/knowledge/skills/*/scripts/**"
      - "plugins/skill-quality/scripts/**"
      - "plugins/skill-quality/skills/*/scripts/**"
      - "plugins/testing/scripts/**"
      - "plugins/testing/skills/*/scripts/**"
      - "plugins/autonomy/scripts/**"
      - "plugins/autonomy/skills/*/scripts/**"
      # The directories of the scripts a SessionStart or PreToolUse hook runs
      # by path, outside the plugin's hooks/, held whole so a sibling module
      # cannot shadow one of their imports (pydeps.py, arm_observer.py,
      # destructive_guard.py).
      - "plugins/animation/scripts/**"
      - "plugins/explainer-video/scripts/**"
      - "plugins/speech/scripts/**"
      - "plugins/playwright/skills/demo-video/scripts/**"
      - "plugins/session-flow/skills/running-retro/scripts/**"
      - "plugins/disk-hygiene/skills/clean/scripts/**"
    # Owner decision Q646 (2026-10-18): a .ps1 or .cjs file, or one with git
    # mode 100755, holds the same way in the plugins the CI lanes load and,
    # in the scorer, at the top level. work-items and review are already on
    # the floor; other plugins stay an accepted risk (Q640c).
    floor-script-scopes:
      - "plugins/ai-slop/**"
      - "plugins/source-control/**"
      - "plugins/discovery/**"
      - "plugins/knowledge/**"
      - "plugins/skill-quality/**"
      - "plugins/testing/**"
      - "plugins/autonomy/**"
