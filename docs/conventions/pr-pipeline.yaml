# yaml-language-server: $schema=pr-pipeline/pr-pipeline.schema.json
version: 2

activities:
  fix-docs:
    skill: ai-slop:audit
    args: fix
    stage: refine
    order: 10
    group: docs
    effect: read
    applied-by:
      patch: apply-patch
    gating: advisory
    reads-untrusted: true
    inputs: [changed-paths]
    applies-when:
      paths: ["**/*.md"]
      paths-ignore: [".changes/**"]
      labels-absent: [do-not-merge, "security: outside-actor"]
      draft: [false]
  resolve-conflicts:
    skill: source-control:pull-request
    args: conflicts --ci --unattended
    prepare: merge-base
    effect: read
    applied-by:
      patch: apply-conflict-patch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, base-sha, head-sha]
    applies-when:
      mergeable: [conflicting, clean]
      labels-absent: [do-not-merge, "security: outside-actor"]
      draft: [false]
  apply-conflict-patch:
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha, base-sha]
    applies-when:
      labels-absent: [do-not-merge, "security: outside-actor"]
      draft: [false]
  address-feedback:
    skill: source-control:pull-request
    args: comments --ci --unattended
    prepare: review-threads
    self-checks: ["scripts/check-affected.sh --uncommitted"]
    effect: read
    applied-by:
      patch: apply-feedback-patch
      feedback-replies: publish-feedback
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, "security: outside-actor"]
      draft: [false]
  apply-feedback-patch:
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, "security: outside-actor"]
      draft: [false]
  publish-feedback:
    script: .github/scripts/pr-unblock/publish-feedback.mjs
    effect: publish-artifact
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
  resolve-feedback-threads:
    script: .github/scripts/pr-unblock/resolve-threads.mjs
    effect: mutate-branch
    checkout: base
    gating: advisory
    reads-untrusted: true
    inputs: [pr]
    applies-when:
      labels-absent: [do-not-merge, "security: outside-actor"]
      draft: [false]
  review-dependency:
    skill: source-control:pull-request
    args: dependency --ci --unattended
    prepare: dependency-review
    web-access:
      enabled: true
      domains: [github.com, raw.githubusercontent.com, www.npmjs.com, registry.npmjs.org, pypi.org]
    effect: read
    applied-by:
      patch: apply-dependency-patch
      dependency-verdict: apply-dependency-verdict
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, needs-human, needs-session, "security: outside-actor"]
      draft: [false]
  apply-dependency-patch:
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, needs-human, needs-session, "security: outside-actor"]
      draft: [false]
  apply-dependency-verdict:
    script: .github/scripts/pr-unblock/apply-dependency-verdict.mjs
    effect: publish-artifact
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
  fix-ci:
    skill: source-control:pull-request
    args: ci --ci --unattended
    prepare: ci-context
    verify-scripts: [plugins/planning/scripts/repin-digests.sh]
    self-checks: ["scripts/check-affected.sh --uncommitted"]
    effect: read
    applied-by:
      patch: apply-patch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, "security: outside-actor"]
      draft: [false]
  apply-patch:
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, "security: outside-actor"]
      draft: [false]
  sync-shared-copies:
    script: .github/scripts/pr-unblock/sync-shared-copies.sh
    effect: read
    gating: advisory
    reads-untrusted: true
    inputs: [pr, base-sha, head-sha]
    applies-when:
      labels-absent: [do-not-merge, "security: outside-actor"]
      draft: [false]
  apply-shared-copies:
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha, base-sha]
    applies-when:
      labels-absent: [do-not-merge, "security: outside-actor"]
      draft: [false]
  fix-test-scope:
    script: .github/scripts/pr-unblock/declare-test-scope.mjs
    effect: read
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, needs-session, "security: outside-actor"]
      draft: [false]
  apply-test-scope:
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    effect: mutate-branch
    checkout: base
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
    applies-when:
      labels-absent: [do-not-merge, needs-session, "security: outside-actor"]
      draft: [false]
  resolve-issue:
    skill: work-items:work
    args: --ci
    checks: ["scripts/check-changelog-fragments.sh --check", "scripts/check-changed-skills.sh --merge-base"]
    self-checks: ["scripts/check-affected.sh --uncommitted"]
    verify-scripts:
      - plugins/testing/skills/audit/scripts/cant-fail-scan.sh
      - scripts/git-mv-rm.sh
      - plugins/skill-quality/scripts/check-evals-quality.sh
      - scripts/sync-shared-copies.sh
      - scripts/new-changelog-fragment.sh
      - plugins/planning/scripts/repin-digests.sh
    web-access:
      enabled: true
      domains: any
    tidy:
      entry: code-tidying:tidy-diff
      passes:
        - docs-hygiene:write-for-agents
        - docs-hygiene:write-for-humans
        - ai-slop:audit
      turn-share: 25
      cutoffs:
        max-files: 10
        max-lines: 300
        max-areas: 1
        shared-paths:
          - .github/
          - .claude/
          - .claude-plugin/
          - scripts/
          - lib/
          - docs/conventions/
          - docs/standards/
          - AGENTS.md
          - CLAUDE.md
    effect: read
    applied-by:
      patch: apply-issue-patch
      work-outcome: report-outcome
    gating: advisory
    reads-untrusted: true
    inputs: [issue]
    applies-when:
      events: [field_added]
      labels-absent: [needs-human, needs-owner-decision, needs-reporter-info, attended, host-run, "security: outside-actor"]
      labels: [agent-ready]
  apply-issue-patch:
    script: .github/scripts/apply-patch/apply-patch.mjs
    prepare: apply-patch
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
    inputs:
      - issue
    applies-when:
      labels-absent:
        - needs-human
        - needs-owner-decision
        - needs-reporter-info
        - attended
        - host-run
        - "security: outside-actor"
      labels:
        - agent-ready
  report-outcome:
    script: .github/scripts/work-resolve-issue/report-outcome.mjs
    effect: publish-artifact
    checkout: base
    gating: advisory
    reads-untrusted: false
    inputs: [issue]
  report-escalation:
    script: .github/scripts/pr-unblock/report-escalation.sh
    effect: publish-artifact
    gating: advisory
    reads-untrusted: false
    inputs: [pr, head-sha]
  merge-pr:
    script: plugins/source-control/scripts/source-control-babysit-merge
    args: --unattended --authority pr-merge --merge
    effect: merge
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
  enable-auto-merge:
    script: .github/scripts/pr-merge/enable-auto-merge.mjs
    effect: merge
    gating: advisory
    reads-untrusted: true
    inputs: [pr, head-sha]
  label-unblocked:
    script: .github/scripts/work-unblock/label-unblocked.mjs
    effect: mutate-tracker
    gating: advisory
    reads-untrusted: true
    inputs: [issue]
  sync-status:
    script: .github/scripts/work-unblock/sync-status.mjs
    effect: mutate-tracker
    gating: advisory
    reads-untrusted: false
    inputs: [issue]
  publish-lane-level:
    script: .github/scripts/work-unblock/publish-lane-level.mjs
    effect: mutate-variable
    gating: advisory
    reads-untrusted: false
    inputs: []
  triage-issue:
    skill: work-items:triage
    args: --ci
    effect: read
    applied-by:
      triage-verdict: post-triage
    gating: advisory
    reads-untrusted: true
    inputs: [issue]
  post-triage:
    script: .github/scripts/intake-triage/post-triage.mjs
    effect: mutate-tracker
    gating: advisory
    reads-untrusted: true
    inputs: [issue]
  apply-verdict:
    script: .github/scripts/intake-triage/apply-verdict.mjs
    effect: mutate-tracker
    gating: advisory
    reads-untrusted: true
    inputs: [issue]
  apply-refinement:
    script: .github/scripts/intake-triage/refine.mjs
    effect: mutate-tracker
    gating: advisory
    reads-untrusted: true
    inputs: [issue]
  apply-changelog:
    skill: harness-ops:changelog
    args: apply --ci
    effect: read
    gating: advisory
    reads-untrusted: true
  apply-changelog-branches:
    script: .github/scripts/upstream-apply-changelog/upstream-apply-changelog.mjs
    args: push
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
  publish-changelog-intake:
    script: .github/scripts/upstream-apply-changelog/upstream-apply-changelog.mjs
    args: publish
    effect: publish-artifact
    gating: advisory
    reads-untrusted: true
  push-native-baseline-branch:
    script: .github/scripts/upstream-apply-changelog/native-baseline-publish.mjs
    args: push
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
  publish-native-baseline-pr:
    script: .github/scripts/upstream-apply-changelog/native-baseline-publish.mjs
    args: publish
    effect: publish-artifact
    gating: advisory
    reads-untrusted: true
  apply-upkeep-branches:
    script: .github/scripts/maintenance-tidy-code-upkeep/batch.mjs
    args: push
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
  publish-upkeep-prs:
    script: .github/scripts/maintenance-tidy-code-upkeep/batch.mjs
    args: publish
    effect: publish-artifact
    gating: advisory
    reads-untrusted: true
  apply-skill-edit-branch:
    script: .github/scripts/plugin-eval/hill-climb-publish.mjs
    args: push
    effect: mutate-branch
    gating: advisory
    reads-untrusted: true
  publish-skill-edit-pr:
    script: .github/scripts/plugin-eval/hill-climb-publish.mjs
    args: publish
    effect: publish-artifact
    gating: advisory
    reads-untrusted: true
  file-architecture-findings:
    script: .github/scripts/maintenance-scan-architecture/file-findings.mjs
    args: file
    effect: mutate-tracker
    gating: advisory
    reads-untrusted: true

lanes:
  work-resolve-issue:
    stage: build
    slots:
      - activity: resolve-issue
      - activity: apply-issue-patch
        needs:
          - resolve-issue
      - activity: report-outcome
        needs:
          - resolve-issue
          - apply-issue-patch
  pr-refine:
    stage: refine
    slots:
      - activity: fix-docs
      - activity: apply-patch
        needs: [fix-docs]
  pr-unblock:
    stage: fix
    slots:
      - activity: resolve-conflicts
      - activity: apply-conflict-patch
        needs: [resolve-conflicts]
      - activity: address-feedback
      - activity: apply-feedback-patch
        needs: [address-feedback]
      - activity: publish-feedback
        needs: [address-feedback, apply-feedback-patch]
      - activity: resolve-feedback-threads
        needs: [publish-feedback]
      - activity: review-dependency
      - activity: apply-dependency-patch
        needs: [review-dependency]
      - activity: apply-dependency-verdict
        needs: [review-dependency, apply-dependency-patch]
      - activity: fix-ci
      - activity: apply-patch
        needs: [fix-ci]
      - activity: sync-shared-copies
      - activity: apply-shared-copies
        needs: [sync-shared-copies]
      - activity: fix-test-scope
      - activity: apply-test-scope
        needs: [fix-test-scope]
      - activity: report-escalation
        needs: [resolve-conflicts, apply-conflict-patch, address-feedback, publish-feedback, review-dependency, apply-dependency-verdict, fix-ci, apply-patch, sync-shared-copies, apply-shared-copies, fix-test-scope, apply-test-scope]
  pr-merge:
    stage: merge
    slots:
      - activity: merge-pr
      - activity: enable-auto-merge
  work-unblock:
    stage: admit
    slots:
      - activity: label-unblocked
      - activity: sync-status
      - activity: publish-lane-level
  intake-triage:
    stage: intake
    slots:
      - activity: triage-issue
      - activity: post-triage
        needs: [triage-issue]
      - activity: apply-verdict
      - activity: apply-refinement
        needs: [apply-verdict]
  upstream-apply-changelog:
    stage: upstream
    slots:
      - activity: apply-changelog
      - activity: apply-changelog-branches
        needs: [apply-changelog]
      - activity: publish-changelog-intake
        needs: [apply-changelog-branches]
      - activity: push-native-baseline-branch
      - activity: publish-native-baseline-pr
        needs: [push-native-baseline-branch]
  maintenance-tidy-code-upkeep:
    stage: maintenance
    slots:
      - activity: apply-upkeep-branches
      - activity: publish-upkeep-prs
        needs: [apply-upkeep-branches]
  maintenance-measure-skill-edit:
    stage: maintenance
    slots:
      - activity: apply-skill-edit-branch
      - activity: publish-skill-edit-pr
        needs: [apply-skill-edit-branch]
  maintenance-scan-architecture:
    stage: maintenance
    enabled: true
    every-days: 1
    slots:
      - activity: file-architecture-findings

models:
  profiles:
    standard:
      model: opus
      max-turns: 75
    # verify-pr, review-dependency and adjudicate-feedback check work, so high:
    # https://code.claude.com/docs/en/model-config#choose-an-effort-level
    review:
      model: opus
      effort: high
      max-turns: 60
    pr-review:
      model: opus
      effort: high
      max-turns: 75
    triage:
      model: sonnet
      effort: medium
      max-turns: 30
    summary:
      model: sonnet
      effort: medium
      max-turns: 10
    code-fix:
      role: worker
      workload: code
      effort-role: verifier
      max-turns: 75
      escalate-to: code-xhigh
    apply-changelog:
      role: worker
      workload: code
      effort-role: verifier
      max-turns: 150
    code-xhigh:
      model: opus
      effort: xhigh
      max-turns: 75
    docs-fix:
      role: worker
      workload: mechanical
      max-turns: 75
    merge-risk:
      model: opus
      effort: high
      subagent-model: opus
      max-turns: 40
  default-profile: standard
  routes:
    resolve-conflicts: code-fix
    address-feedback: code-fix
    review-dependency: review
    fix-ci: code-fix
    fix-docs: docs-fix
    verify-pr: review
    merge-risk: merge-risk
    review-code: pr-review
    review-security: pr-review
    triage-issue: triage
    summarize-reuse: summary
    resolve-issue: code-fix
    apply-changelog: apply-changelog
    adjudicate-feedback: review
  issue-dimensions:
    fields:
      size:
        field-id: 15462270
        options:
          "27053568": small
          "27053567": medium
          "27053566": large
      complexity:
        field-id: 48625720
        options:
          "85127651": low
          "85127652": medium
          "85127653": high
      uncertainty:
        field-id: 48625721
        options:
          "85127654": known
          "85127655": knowable
          "85127656": unknown
    sizes:
      small:
        base-turns: 75
        timeout-minutes: 65
      medium:
        base-turns: 150
        timeout-minutes: 115
      large: split
    split-child-size: medium
    complexity:
      low: 1
      medium: 1.5
      high: 2
    complexity-profiles:
      high: code-xhigh
    uncertainty:
      known: run
      knowable: run
      unknown: probe-first
  issue-status:
    field-id: 48484079
    field-events-since: "2026-11-07T09:45:00Z"
    options:
      "84879216": needs-triage
      "84879217": needs-reporter-info
      "84879218": needs-owner-decision
      "84879219": needs-spec
      "84879220": agent-ready
      "86380002": confirmed
      "86380003": ready
      "86380004": deferred
      "86380005": needs-human
    labels:
      needs-triage:
        - needs-triage
      needs-reporter-info:
        - needs-reporter-info
      needs-owner-decision:
        - needs-owner-decision
      needs-spec:
        - needs-spec
      agent-ready:
        - agent-ready
      confirmed:
        - "status: confirmed"
      ready:
        - "status: ready"
      deferred:
        - admission-deferred
      needs-human:
        - needs-human
    order:
      - needs-human
      - needs-owner-decision
      - needs-spec
      - needs-reporter-info
      - agent-ready
      - deferred
      - ready
      - confirmed
      - needs-triage

test-scope:
  apply: false
loop:
  review-rounds: 3
  findings-after-first-review: blocking-only
  dependency-review-rounds: 2
  fix-ci-rounds: 3

limits:
  fix-ci-per-run: 2
  fix-ci-restarts: 1
  fix-docs-per-run: 2
  wip-cap: 12
  turn-cap-restarts: 1
  admission-factor: 0.8
  admission-min-per-hour: 1
  restarts-per-run: 10
  refire-queue-per-slot: 2
  refire-budget-per-slot: 2
  stale-queued-minutes: 60
  sweep-gap-minutes: 5
  stranded-backoff-hours:
    no-run: 1
    no-report: 3
    failed-again: 3
    failed-mint: 1
    kill-switch: 1
  upstream-apply-changelog-per-day: 3
  lane-level:
    floor: 2
    ceiling: 4
    default: 3
    clean-windows: 2
    pools: [lanes-app]
    shadow: true
    variable: CLAUDE_LANE_LEVEL
    valid-minutes: 150

wip:
  target-lead-time-hours: 2
  min-cap: 12
  merge-rate-window-hours: 24
  opened-to-merged-ratio: 0.8
  held-cap: 10
  held-alarm-hours: 24
  pause-from: "2026-10-22T00:00:00Z"

red-main:
  dry-run: true
  daily-cap: 3
  max-culprit-age-hours: 24
  confirm-wait-minutes: 55
  remedy: rollback

post-merge:
  paths:
    owner-agent:
      mode: record
      enqueuers: [kyle-sexton]

adoption:
  idle-hours: 2
  spec-from-body-apps: [337859524, 300666570]
  self-merging-apps: [337859524]

review-threads:
  reviewer-ids: [199175422, 62310815]

attended:
  classes:
    dns: a DNS record or registrar change
    cloud-resource: a cloud resource created outside an IaC repository's preview and deploy flow
    credential: an API key, token or secret created or rotated
    host-elevation: an elevated (UAC or sudo) pass on a host
    network: a network or IP address registration

branch-cleanup:
  max-deletes-per-run: 25

monitor:
  lane-holds:
    threshold: 4
    window-hours: 24
  incidents:
    main-red:
      open-hours: 0
      close-hours: 6
    ceiling:
      open-hours: 2
      close-hours: 6
    throttling:
      open-hours: 4
      close-hours: 3
    merge-queue-ejections:
      open-hours: 4
      close-hours: 6
    held-prs:
      open-hours: 4
      close-hours: 6
    report-only-audit:
      open-hours: 2
      close-hours: 6
    throughput:
      open-hours: 6
      close-hours: 4
    lane-stop:
      open-hours: 3
      close-hours: 6
    stalled-lane-stop:
      open-hours: 8
      close-hours: 5
    post-merge-unreadable:
      open-hours: 2
      close-hours: 6
    listing-held:
      open-hours: 2
      close-hours: 6
    lane-holds:
      open-hours: 2
      close-hours: 6
    lane-variables:
      open-hours: 0
      close-hours: 168

merge:
  rung: merge
  authority: pr-merge
  agent-identity: melodic-automation-lanes[bot]
  trust-path-hold-apps:
    - trust-path-hold-off[bot]
  report-only: false
  full-run-cap-bypass: true
  lane-prs: native
  baseline-file: docs/upstream/claude-code-native-surfaces.min.json
  refire-skip-branches: [release/plugins]
  require-verifier-verdict: true
  max-in-flight: 11
  in-flight-sizing:
    measured: 2026-10-31
    peak-merges-per-hour: 11
    mean-minutes-in-flight: 58
    app-hourly-limit: 5200
    app-target-percent: 70
    app-peak-hourly-used: 1974
    app-calls-per-candidate: 9
    reader-runs-per-hour: 4
  check-inputs:
    - scripts/shared-copies.txt
    - scripts/docs-only-paths.txt
  gate-budget-minutes: 10
  gate-candidate-minutes: 4
  gate-deferred-minutes: 20
  risk-escalation-minutes: 60
  skip-unchanged:
    max-minutes: 0
    max-skips: 3
  max-verify-fails: 3
  verify-cap-attempts: 1
  quarantine-days: 7
  verify-authors: lane-or-owner
  dependabot:
    mode: enforce
    majors: review
    trusted-action-owners:
      - actions
      - anthropics
      - aws-actions
      - azure
      - docker
      - github
      - google
      - google-github-actions
      - hashicorp
      - melodic-software
      - microsoft
      - openai
  diff-check:
    denied-paths: []
    high-path-floor: false
    path-holds: false
    floor-paths:
      - glob: ".github/actions/check-trusted-trigger/**"
        class: trust
      - glob: ".github/scripts/lib/github-client.mjs"
        class: trust
      - glob: ".github/scripts/lib/trusted-actors.mjs"
        class: trust
      - glob: ".github/actions/resolve-config/**"
        class: trust
      - glob: ".github/actions/check-kill-switch/**"
        class: trust
      - glob: ".github/actions/request-lane-token/**"
        class: trust
      - glob: ".github/source-control-settings.json"
        class: trust
      - glob: ".github/verify-legacy-fails.json"
        class: trust
