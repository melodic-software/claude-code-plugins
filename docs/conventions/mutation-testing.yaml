# Team layer for the mutation-testing plugin (keys: plugins/mutation-testing/skills/setup/templates/config-template.md).
# Read by /mutation-testing:audit, which the post-merge mutation lane
# (.github/workflows/post-merge-test-mutation.yml) runs on every push to main
# that changes a file in `mutate`. That workflow's trigger,
# .github/workflows/post-merge-select-mutation-range.yml, lists the same globs
# as its paths filter; .github/scripts/post-merge-test-mutation/report.test.mjs
# fails when the two lists differ. The lane writes a personal override,
# .claude/mutation-testing.local.md, with diff-target set to the push's
# previous head, so each run mutates the lines that push changed.
#
# No test-command: the lane runs the default diff scope, and
# scripts/run-test-file.sh takes one test file, so `audit --exercised` refuses
# here.

# No mutation tool drives every runner here (bash, node --test, pytest,
# vitest), so mutants are applied by the manual protocol in the principles
# skill's tooling.md.
tool: manual
command: none, the manual protocol applies each mutant by hand

# Mutants for one source file run against every suite scripts/affected-tests.sh
# selects for it, through one command, scripts/run-covering-tests.sh <file>;
# any failing suite kills the mutant.
diff-target: main

# Code the runners in scripts/run-test-file.sh can test. PowerShell is left
# out: that runner does not run Pester suites. docs/conventions/ holds this
# config and .claude/ the lane's personal override and the arid record, which the model
# may not edit.
mutate:
  - "**/*.sh"
  - "**/*.mjs"
  - "**/*.js"
  - "**/*.ts"
  - "**/*.py"
  - "!**/*.test.*"
  - "!**/test_*.py"
  - "!**/conftest.py"
  - "!**/tests/**"
  - "!**/evals/**"
  - "!**/fixtures/**"
  - "!**/vendor/**"
  - "!.claude/**"
  - "!docs/conventions/**"

operators: default

# Measured 2026-10-25 on a Linux host: the covering suites of
# scripts/run-test-file.sh (4 suites) took 17,489 ms, of
# scripts/check-silent-revert.sh (10) 49,634 ms and of
# .github/scripts/pr-verify/resolve-pr.mjs (8) 72,571 ms. The slowest is
# the baseline; the timeout is 1.5 x that plus 5 s, rounded up.
baseline-suite-ms: 72571
timeout-ms: 115000

# The lane runs the audit split (--phase generate, then the mutate job, then
# --phase triage), so no model turn runs a test. The mutate job runs about one
# covering-suite run per mutant, so 7 mutants fit its 60-minute job. A larger
# diff reports what it dropped.
max-mutants: 7
