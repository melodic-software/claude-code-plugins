# Team layer for the ai-slop plugin (schema: plugins/ai-slop/schemas/ai-slop.schema.json).
# Every key is optional; an absent key keeps the shipped default.
thresholds:
  ai_vocabulary: 2.0
  copulative_avoidance: 2.0
em_dash_allowed_paths:
  - "docs/upstream/aihero-course.md"
  - "docs/upstream/aihero-shipping-course.md"
  - "docs/upstream/humanlayer-skills.md"
rule_allowed_paths:
  rule-ai-vocabulary:
    - "plugins/architecture/skills/improve/research/deepening/**"
    - "plugins/architecture/reference/vocabulary.md"
excluded_paths:
  - "plugins/*/skills/*/vendor/**"
  - "plugins/ai-slop/skills/audit/evals/fixtures/**"
disabled_rules:
  - "rule-curly-artifacts"
  - "rule-emoji-formatting"
