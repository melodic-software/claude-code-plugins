# yaml-language-server: $schema=../../plugins/work-items/schemas/work-items.schema.json
# Team layer for the work-items plugin's settings.
# Resolution: plugins/work-items/reference/ai-disclaimer.md (ai_disclaimer),
# plugins/work-items/skills/morning-brief/scripts/morning-brief.sh (morning_brief keys),
# plugins/bugs/reference/config.md (filing_posture, read by /bugs:scan --track).
# Autonomous lane posts here come from a bot account, whose author line already marks them.
ai_disclaimer: false
filing_posture: allowed
# The Azure subscription is not set here: pass --subscription or set it in work-items.local.yaml.
morning_brief:
  org: melodic-software
  actions_included_minutes: 3000
  actions_included_storage_gb: 2
  usage_alert_percent: 50
  log_cap_alert_percent: 50
  forecast_alert: 50
  required_budgets:
    - budget-subscription-monthly
    - budget-subscription-forecast
  anomaly_alert: daily-cost-anomaly
  expiry_days: 30
