# yaml-language-server: $schema=../../plugins/work-items/schemas/work-items.schema.json
# Team layer for the work-items plugin's settings.
# Resolution: plugins/work-items/reference/ai-disclaimer.md (ai_disclaimer),
# plugins/work-items/skills/morning-brief/scripts/morning-brief.sh (morning_brief keys),
# plugins/bugs/reference/config.md (filing_posture, read by /bugs:scan --track).
ai_disclaimer: false
filing_posture: allowed
label_as_code_repo: melodic-software/github-iac
permission_floor_source: https://github.com/melodic-software/standards/tree/main/components/claude-permissions
morning_brief:
  org: melodic-software
  actions_included_minutes: 3000
  actions_included_storage_gb: 2
  usage_alert_percent: 50
  log_cap_alert_percent: 50
  forecast_alert: 50
  required_budgets:
    - budget-subscription-monthly
    - budget-subscription-forecast
  anomaly_alert: daily-cost-anomaly
  expiry_days: 30
  lane_workflows:
    - intake-triage.yml
    - pr-review-hosted.yml
    - pr-review-main.yml
    - pr-review-security-hosted.yml
    - pr-rate-merge-risk.yml
    - pr-verify.yml
    - pr-refine.yml
    - pr-unblock.yml
    - work-resolve-issue.yml
  lane_outcome_contract_ref:
    - "https://github.com/melodic-software/ci-workflows/blob/main/.github/actions/report-lane-outcome/action.yml"
    - "https://github.com/melodic-software/ci-workflows/blob/main/.github/actions/report-lane-outcome/classify.cjs"
    - "https://github.com/melodic-software/ci-workflows/blob/main/docs/lane-outcome.md#fields"
tracker:
  schema_version: "1.0"
  provider: "github"
  config:
    lease_ttl_hours: 24
    github:
      status_trust:
        trusted_actors: .github/standards/trusted-actors/trusted-actors.json
        model: docs/conventions/pr-pipeline.yaml
        lanes_app: melodic-automation-lanes[bot]
