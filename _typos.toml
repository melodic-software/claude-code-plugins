[default]
locale = "en-us"

extend-ignore-re = [
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
  "(#|//)\\s*spellchecker:ignore-next-line\\r?\\n.*",
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
  "(?s)<!--\\s*spellchecker:off\\s*-->.*?<!--\\s*spellchecker:on\\s*-->",
  "\\{[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\\}",
]

[default.extend-words]
armoury = "armoury"
axe = "axe"
calibre = "calibre"
canva = "canva"
recomendations = "recomendations"
ageing = "aging"
amidst = "amid"
amongst = "among"
benefitted = "benefited"
draught = "draft"
encyclopaedia = "encyclopedia"
focussed = "focused"
focussing = "focusing"
grey = "gray"
greyed = "grayed"
greyer = "grayer"
greying = "graying"
greys = "grays"
greyscale = "grayscale"
judgemental = "judgmental"
kerb = "curb"
lustre = "luster"
practise = "practice"
practised = "practiced"
practising = "practicing"
programme = "program"
programmes = "programs"
sabre = "saber"
skilful = "skillful"
spelt = "spelled"
storey = "story"
storeys = "stories"
whilst = "while"
wilful = "willful"

[default.extend-identifiers]
abd = "abd"
BAAs = "BAAs"
certifi = "certifi"
DUM = "DUM"
FO = "FO"
FoD = "FoD"
MITRE = "MITRE"
ND = "ND"
PnP = "PnP"
PnPCapabilities = "PnPCapabilities"
rotat = "rotat"
Win32_PnPEntity = "Win32_PnPEntity"
xdescribe = "xdescribe"

[files]
extend-exclude = [
  "*.min.*",
]
